const toneMap = {
  rose: 'border-rose-200 bg-rose-50 text-rose-900',
  amber: 'border-amber-200 bg-amber-50 text-amber-900',
  indigo: 'border-indigo-200 bg-indigo-50 text-indigo-900',
  slate: 'border-slate-200 bg-slate-50 text-slate-800'
};

function renderBlock(b) {
  let html = `<div class="mt-4"><h3 class="text-sm font-bold text-slate-900 sm:text-base">${b.heading}</h3>`;
  if (b.bullets) {
    html += `<ul class="mt-2 space-y-1.5 text-sm leading-relaxed text-slate-700">${b.bullets.map(li => `<li class="flex gap-2"><span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-fuchsia-600"></span><span>${li}</span></li>`).join('')}</ul>`;
  }
  if (b.cards) {
    html += `<div class="mt-2.5 grid gap-2.5 sm:grid-cols-2">${b.cards.map(c => `<div class="rounded-xl border p-3 ${toneMap[c.tone]}"><div class="text-xs font-bold">${c.title}</div><p class="mt-1 text-xs leading-relaxed opacity-90">${c.text}</p></div>`).join('')}</div>`;
  }
  if (b.table) {
    html += `<div class="mt-2.5 overflow-x-auto rounded-xl border border-slate-200"><table class="min-w-full divide-y divide-slate-200 text-left text-xs sm:text-sm"><thead class="bg-slate-100 text-slate-700"><tr>${b.table.headers.map(h => `<th class="px-3 py-2 font-bold">${h}</th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-100 bg-white">${b.table.rows.map(r => `<tr>${r.map((cell, i) => `<td class="px-3 py-2 ${i === 1 ? 'font-semibold text-slate-900' : 'text-slate-700'}">${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  if (b.callout) {
    html += `<div class="mt-3 rounded-xl border border-fuchsia-200 bg-fuchsia-50/70 p-3 text-xs leading-relaxed text-fuchsia-950 sm:text-sm">${b.callout}</div>`;
  }
  return html + '</div>';
}

function renderAll(query = '') {
  const q = query.trim().toLowerCase();
  const filteredChapters = CHAPTERS.filter(ch => !q || (ch.badge + ch.title + ch.keywords + JSON.stringify(ch.blocks)).toLowerCase().includes(q));
  const filteredQA = QA_ITEMS.filter(([qu, an]) => !q || (qu + an).toLowerCase().includes(q));

  document.getElementById('desktopNav').innerHTML = [
    ...filteredChapters.map(c => `<a href="#${c.id}" class="flex items-center justify-between rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-700 hover:bg-fuchsia-50 hover:text-fuchsia-800"><span class="truncate">${c.badge} · ${c.title.split('（')[0]}</span></a>`),
    `<a href="#qa" class="flex items-center justify-between rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-700 hover:bg-fuchsia-50 hover:text-fuchsia-800"><span>Q&amp;A 速查 (${filteredQA.length})</span></a>`
  ].join('');

  document.getElementById('mobileNav').innerHTML = [
    ...filteredChapters.map(c => `<a href="#${c.id}" class="shrink-0 rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold text-slate-700 hover:border-fuchsia-300 hover:bg-fuchsia-50 hover:text-fuchsia-800">${c.badge}</a>`),
    `<a href="#qa" class="shrink-0 rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold text-slate-700">Q&amp;A (${filteredQA.length})</a>`
  ].join('');

  document.getElementById('chaptersContainer').innerHTML = filteredChapters.map(ch => `
    <article id="${ch.id}" class="scroll-mt-16 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
      <div class="border-b border-slate-100 pb-3">
        <span class="inline-block rounded-md bg-fuchsia-50 px-2 py-0.5 text-xs font-bold text-fuchsia-700">${ch.badge}</span>
        <h2 class="mt-1 text-lg font-bold text-slate-900 sm:text-xl">${ch.title}</h2>
      </div>
      ${ch.blocks.map(renderBlock).join('')}
      ${ch.diagram ? DIAGRAMS[ch.diagram]() : ''}
      ${ch.diagrams ? ch.diagrams.map(d => DIAGRAMS[d]()).join('') : ''}
    </article>
  `).join('');

  document.getElementById('qaList').innerHTML = filteredQA.map(([qu, an], idx) => `
    <div class="py-3">
      <button type="button" data-qa="${idx}" class="qa-btn flex w-full items-start justify-between gap-3 text-left text-sm font-bold text-slate-900 hover:text-fuchsia-800">
        <span>${qu}</span>
        <span class="qa-icon shrink-0 rounded bg-slate-100 px-1.5 py-0.5 text-xs text-slate-600">+</span>
      </button>
      <div class="qa-ans hidden pt-2 text-sm leading-relaxed text-slate-700">${an}</div>
    </div>
  `).join('');

  document.querySelectorAll('.qa-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const ans = btn.nextElementSibling;
      const icon = btn.querySelector('.qa-icon');
      const open = ans.classList.toggle('hidden');
      icon.textContent = open ? '+' : '−';
    });
  });

  document.getElementById('qa').classList.toggle('hidden', filteredQA.length === 0);
  document.getElementById('qaCount').textContent = `共 ${filteredQA.length} 条`;
  document.getElementById('matchBadge').textContent = `${filteredChapters.length} 章 · ${filteredQA.length} Q&A`;
  document.getElementById('emptyState').classList.toggle('hidden', filteredChapters.length > 0 || filteredQA.length > 0);
}

const searchInput = document.getElementById('searchInput');
const clearSearch = document.getElementById('clearSearch');
searchInput.addEventListener('input', e => {
  clearSearch.classList.toggle('hidden', !e.target.value);
  renderAll(e.target.value);
});
clearSearch.addEventListener('click', () => {
  searchInput.value = '';
  clearSearch.classList.add('hidden');
  renderAll('');
});

renderAll('');
</script>

    function feedCardsFor(key) {
      const d = feedDataFor(key);
      const family = key === 'all';
      const childName = family ? '' : d.childName;
      const cards = [];
      const urgentList = family ? familyUrgentNotices() : [];
      const notice = family ? urgentList[state.noticeSeen] : (state.readChildNotices[key] ? null : d.notification);
      if (notice) {
        const remain = family ? Math.max(0, urgentList.length - state.noticeSeen - 1) : 0;
        cards.push({
          surface: 'rose', icon: 'bell-ring', iconClass: 'text-rose-600', dot: 'bg-rose-500',
          type: '通知', chip: notice.tag || '课程变动', chipTone: 'rose', right: notice.right || '2 小时前',
          rightClass: 'text-[12px] font-semibold leading-4 text-slate-600',
          title: notice.title,
          sub: notice.meta || (family ? 'Alice · David 老师临时请假' : 'David 老师临时请假'),
          footer: remain > 0 ? `另有 ${remain} 条紧急待处理 · 点击查看或 🔔` : '家长视角 · 已同步至通知中心',
          footerClass: remain > 0 ? 'font-bold text-rose-700' : 'text-slate-600',
          action: '查看通知', actionAction: 'notifications'
        });
      }
      if (state.noCourse) {
        cards.push({ custom: emptyCourseCardHtml(family ? '全家' : childName) });
      } else if (d.course) {
        const isGroup = d.course.type === 'group';
        const isToday = d.course.date.includes('今天');
        const shortDay = isToday ? '' : d.course.date.replace(/\s*\([^)]*\)\s*/, ' ').trim();
        const merged = d.course.merged > 1 ? ` · 连上 ${d.course.merged} 节` : '';
        const siblingText = family ? ` · 另有 ${state.manyKids ? 5 : 1} 个孩子` : '';
        const teacherLabel = family ? d.course.teacher.split(' ')[0] : d.course.teacher;
        const typeText = isGroup ? '小班课' : (d.course.type === 'fixed' ? '固定位正课' : '临时课');
        cards.push({
          surface: 'neutral', icon: 'calendar-clock', iconClass: 'text-indigo-600', dot: 'bg-indigo-500',
          type: '课程', chip: isGroup ? '[G] 小班' : (family ? `今日 ${FAMILY_FEED.all.todayLessons} 节` : '少儿英语'), chipTone: 'neutral',
          right: isGroup ? '主理班长派课' : (d.course.countdown || '待上课'), rightClass: 'text-[12px] font-bold leading-4 text-amber-700',
          title: `下一节 · ${family ? 'Alice' : childName}`,
          sub: isGroup
            ? `${shortDay ? shortDay + ' ' : ''}${d.course.time} · ${d.course.className} · [G] 小班${merged}`
            : `${shortDay ? shortDay + ' ' : ''}${d.course.time} · ${teacherLabel} · 少儿英语 1v1${merged}`,
          footer: isGroup ? '小班课 · 仅只读详情 · 请假挪位由主理班长处理' : (family ? `${typeText}${siblingText}` : `${typeText} · 授课准备期`),
          action: isGroup ? '联系主理班长' : 'ClassIn 二维码',
          actionAction: isGroup ? 'monitor-qr' : 'qr',
          actionMonitor: isGroup ? 'Leo' : undefined,
          actionTeacher: isGroup ? undefined : d.course.teacher
        });
      }
      if (d.reminder) {
        cards.push({
          surface: 'amber', icon: 'alarm-clock', iconClass: 'text-amber-700', dot: 'bg-amber-500',
          type: '提醒', chip: '待续费', chipTone: 'amber',
          metric: { prefix: '剩余', value: d.reminder.remaining, unit: '节', prefixClass: 'text-amber-700', valueClass: 'text-amber-800', unitClass: 'text-amber-700' },
          title: `${family ? 'Bob' : childName} 的 1v1 课次即将用完`,

          footer: '联系班长 Leo 微信', footerAction: 'monitor-qr', footerMonitor: 'Leo',
          action: '即刻续费', href: 'm2a_course_orders.html?role=parent&page=list'
        });
      }
      if (d.asset) {
        cards.push({
          surface: 'neutral', icon: 'wallet', iconClass: 'text-emerald-600', dot: 'bg-emerald-500',
          type: '资产', chip: family ? '家庭' : '个人', chipTone: 'neutral',
          metric: { value: family && state.manyKids ? 24 : d.asset.fixed + d.asset.temp, unit: '节' },
          title: family ? '1v1 课次资产与账单' : `${childName} 1v1 课次资产`,

          footer: family ? '仅统计 1v1 · 不含小班课次与费用' : '仅统计 1v1 课次',
          action: '查看账单', actionAction: 'assets'
        });
      }
      if (d.courseware) {
        const first = d.courseware.latest.split(' · ')[0];
        const latestTime = (d.courseware.latest.split(' · ')[1] || '昨天更新').replace('更新', '');
        const progress = collapseText(d.courseware.progress || first, 40);
        const groupCw = !!d.courseware.group;
        cards.push({
          surface: 'neutral', icon: 'book-open', iconClass: 'text-purple-600', dot: 'bg-purple-500',
          type: '课件', chip: groupCw ? '小班只读' : '在学', chipTone: 'neutral',

          footer: groupCw ? '小班课件 · 家长只读' : `最近更新 · ${latestTime}`,
          action: '查看课件', href: 'm1e_courseware.html?role=parent'
        });
      }
      return cards;
    }

    function renderLoadMore(kind, shown, total) {
      const loads = kind === 'upcoming' ? state.teacherUpcomingLoads : state.teacherCompletedLoads;
      if (loads >= 5 || shown >= total) {
        return `<a href="m3a_calendar_grid.html?role=teacher&teacher=david&week=0" target="_blank" rel="noopener" class="mt-2 flex h-11 w-full items-center justify-center gap-1.5 rounded-xl border border-slate-300 bg-white text-[14px] font-bold text-indigo-600">${icon('calendar-days', 'h-4 w-4')}${t('打开完整课表', 'Open full schedule')} ↗</a>`;

      const label = kind === 'upcoming' ? t('加载更多待上课', 'Load more') : t('加载更多刚结束', 'Load more');
      const remain = total - shown;
      return `<button data-action="load-more" data-list="${kind}" class="mt-2 flex h-11 w-full items-center justify-center gap-1.5 rounded-xl border border-slate-300 bg-white text-[14px] font-bold text-slate-600 transition hover:bg-slate-50">${label} (${t(`还有 ${remain} 条`, `${remain} more`)}) ▾</button>`;

    function primaryCourseware(item) {

      const targetTeacher = item.sub && item.subFrom ? item.subFrom : 'David Miller';
      const idx = list.findIndex((c) => c.topTeacher === targetTeacher);

      return { cw, extra: Math.max(0, list.length - 1) };

    function collapseText(text, max = 40) {
      const flat = String(text || '').replace(/\s*\n+\s*/g, ' ').replace(/\s+/g, ' ').trim();
      return flat.length > max ? `${flat.slice(0, max)}…` : flat;
    }

    function renderNotesSummary(item, kind, idx) {

      const processLine = `<button type="button" data-action="preview-note" data-kind="${kind}" data-index="${idx}" data-field="process" class="flex w-full min-w-0 items-center gap-1 rounded-md text-left transition hover:bg-white/60">

      const studentLine = item.type !== 'group' && item.note
        ? `<button type="button" data-action="preview-note" data-kind="${kind}" data-index="${idx}" data-field="student" class="flex w-full min-w-0 items-center gap-1 rounded-md text-left transition hover:bg-white/60">
            <span class="truncate text-[12px] font-medium text-slate-700">📝 ${esc(collapseText(item.note, 36))}</span>

    function opsKingTile(k) {
      const on = k.dotKey ? dotVisible(k.dotKey) : !!k.dot;
      const mark = on
        ? `<span class="absolute -right-1 -top-1 h-[7px] w-[7px] rounded-full bg-rose-500 ring-2 ring-white" aria-label="有待处理事项"></span>`
        : '';
      const inner = `${mark}<span class="grid h-8 w-8 place-items-center rounded-full border border-slate-200 bg-white text-indigo-600">${icon(k.icon, 'h-4 w-4')}</span><span class="max-w-full truncate whitespace-nowrap text-[12px] font-bold leading-tight text-slate-700">${esc(k.label)}</span>`;
      const cls = 'relative flex flex-col items-center gap-1 rounded-xl border border-slate-200 bg-slate-50/70 px-0.5 py-2 transition active:scale-95';
      return `<a data-ops-king="1" href="${k.href}" target="_blank" rel="noopener" class="${cls}">${inner}</a>`;
    }

    function todoRoleItems() {
      if (state.role === 'admin') return OPS_TODO.slice();
      return OPS_TODO.filter((item) => item.owner === 'Leo');
    }

    function todoSelfOwner() {
      return state.role === 'admin' ? 'Sarah' : 'Leo';
    }

    function todoOwnerScope() {
      if (state.role === 'admin') return state.todoOwnerPick || 'all';
      return state.todoOwnerMode === 'mine' ? 'mine' : 'all';
    }

    function todoScopedItems() {
      const self = todoSelfOwner();
      if (state.role === 'admin') {
        const scope = todoOwnerScope();
        if (scope === 'mine') return OPS_TODO.filter((item) => item.owner === self);
        if (scope !== 'all') return OPS_TODO.filter((item) => item.owner === scope);
        return OPS_TODO.slice();
      }
      if (state.role === 'monitor') {
        const mineOnly = todoOwnerScope() === 'mine';
        return OPS_TODO.filter((item) => item.owner === self || (!mineOnly && item.urgency === 'urgent'));
      }
      return todoRoleItems();
    }

    function todoStage(item) {
      if (item.urgency === 'urgent') return item.owner === todoSelfOwner() ? 'own-urgent' : 'rescue-urgent';
      if (state.role === 'admin' && item.group === 'payroll') return 'own-docs';
      return item.group === 'schedule' ? 'own-ops' : 'own-docs';
    }

    function todoStageRank(stage) {
      return { 'own-urgent': 0, 'rescue-urgent': 1, 'own-ops': 2, 'own-docs': 3 }[stage] ?? 4;
    }

    function todoIsRescue(item) {
      return item.urgency === 'urgent' && item.owner !== todoSelfOwner();
    }

    function todoRank(group) {
      const found = OPS_TODO_GROUPS.find((g) => g.key === group);
      return found ? found.rank : 99;
    }

    function todoCategories() {
      const cats = OPS_TODO_GROUPS.filter((g) => state.role === 'admin' || g.key !== 'payroll');
      return [{ key: 'all', label: '全部' }, ...cats.map((g) => ({ key: g.key, label: g.label }))];
    }

    function todoUrgencyRank(urgency) {
      return urgency === 'urgent' ? 0 : 1;
    }

    function filteredTodos() {
      const query = String(state.todoQuery || '').trim().toLowerCase();
      return todoScopedItems()
        .map((item, index) => ({ item, index }))
        .filter(({ item }) => state.todoFilter === 'all' || item.group === state.todoFilter)
        .filter(({ item }) => {
          if (!query) return true;
          return `${item.title} ${item.summary} ${item.search} ${item.owner}`.toLowerCase().includes(query);
        })
        .sort((a, b) => {
          const sa = todoStage(a.item);
          const sb = todoStage(b.item);
          const stageDiff = todoStageRank(sa) - todoStageRank(sb);
          if (stageDiff) return stageDiff;
          if (sa === 'own-urgent' || sa === 'rescue-urgent') {
            const ma = Number.isFinite(a.item.minutesToStart) ? a.item.minutesToStart : 9999;
            const mb = Number.isFinite(b.item.minutesToStart) ? b.item.minutesToStart : 9999;
            return ma - mb || a.index - b.index;
          }
          if (sa === 'own-docs') {
            const pinned = (b.item.pin ? 1 : 0) - (a.item.pin ? 1 : 0);
            if (pinned) return pinned;
          }
          return todoRank(a.item.group) - todoRank(b.item.group) || a.index - b.index;
        })
        .map(({ item }) => item);
    }

    function todoHref(item) {
      return (item.href || '#').replace('{role}', state.role);
    }

    function renderTodoCard(item) {
      const isUrgent = item.urgency === 'urgent';
      const isRescue = todoIsRescue(item);
      const owner = state.role === 'admin' && !isRescue
        ? `<span class="shrink-0 text-[12px] font-medium text-slate-600">${esc(item.owner === '平台' ? '平台' : `${item.owner} 班`)}</span>`
        : '';
      const rescueBadge = isRescue
        ? `<span class="shrink-0 rounded-full border border-rose-200 bg-white/80 px-1.5 py-0.5 text-[12px] font-semibold leading-none text-rose-700">${esc(item.ownerType === 'platform' || item.owner === '平台' ? '协助 · 平台直管' : `协助 · 负责班长: ${item.owner}`)}</span>`
        : '';
      const cardCls = isUrgent
        ? 'box-border w-full flex items-center gap-3 rounded-2xl border border-rose-200 border-l-4 border-l-rose-600 bg-rose-50/80 px-3 py-2.5'
        : 'box-border w-full flex items-center gap-3 rounded-2xl border border-amber-300 bg-amber-50/50 px-3 py-2.5';
      const iconCls = isUrgent
        ? 'grid h-9 w-9 shrink-0 place-items-center rounded-xl border border-rose-200 bg-white text-rose-600'
        : 'grid h-9 w-9 shrink-0 place-items-center rounded-xl border border-amber-200 bg-white text-amber-700';
      const tagRow = isUrgent
        ? `<span class="h-[7px] w-[7px] shrink-0 rounded-full bg-rose-500"></span><span class="shrink-0 rounded-full bg-rose-100 px-1.5 py-0.5 text-[12px] font-bold leading-none text-rose-800">${esc(item.tag)}</span>`
        : `<span class="shrink-0 rounded-full border border-amber-300 bg-amber-100 px-1.5 py-0.5 text-[12px] font-bold leading-none text-amber-900">${esc(item.tag)}</span>`;
      const actionCls = isUrgent
        ? 'inline-flex h-7 shrink-0 items-center whitespace-nowrap rounded-lg border border-rose-200 bg-white px-2.5 text-[12px] font-bold text-rose-700 transition hover:bg-rose-50'
        : 'inline-flex h-7 shrink-0 items-center whitespace-nowrap rounded-lg border border-amber-300 bg-white px-2.5 text-[12px] font-bold text-amber-900 transition hover:bg-amber-50';
      const flag = item.flag
        ? `<span class="shrink-0 rounded-full border border-amber-300 bg-white px-1.5 py-0.5 text-[12px] font-bold leading-none text-amber-900">${esc(item.flag)}</span>`
        : '';
      return `<article data-todo-group="${item.group}" data-todo-urgency="${item.urgency}" data-todo-stage="${todoStage(item)}" data-todo-owner="${esc(item.owner)}" data-todo-search="${esc(`${item.title} ${item.summary} ${item.search} ${item.owner} ${item.flag || ''} ${item.note || ''}`)}" class="${cardCls}">
        <span class="${iconCls}">${icon(item.icon, 'h-4 w-4')}</span>
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-1.5">
            ${tagRow}
            ${flag}
            ${rescueBadge}
            ${owner}
          </div>
          <h3 class="mt-1 truncate text-[14px] font-bold leading-5 text-slate-900">${esc(item.title)}</h3>
          <p class="truncate text-[12px] font-medium leading-[18px] text-slate-600">${esc(item.summary)}</p>
          ${item.note ? `<p class="truncate text-[12px] font-medium leading-[18px] text-amber-800">${esc(item.note)}</p>` : ''}
        </div>
        <a href="${todoHref(item)}" target="_blank" rel="noopener" class="${actionCls}">${esc(item.action)} →</a>
      </article>`;
    }

    function renderTodoBody() {
      const items = filteredTodos();
      const shown = state.todoExpanded ? items : items.slice(0, 20);
      if (!items.length) {
        return `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/60 px-4 py-10 text-center text-[14px] font-semibold text-slate-600">暂无待办</div>`;
      }
      const more = items.length > 20 && !state.todoExpanded

    function resolveProgressLevel(cw) {
      const curLevel = cw.level || '';
      const levelPrefix = /^Level\b/i.test(curLevel) ? 'Level' : 'Stage';
      const options = [1, 2, 3].map((n) => `${levelPrefix} ${n}`);
      if (curLevel && !options.includes(curLevel)) options.unshift(curLevel);
      const selected = curLevel && options.includes(curLevel) ? curLevel : options[0];
      return { options, selected };
    }

      const list = kind === 'upcoming' ? TEACHER_UPCOMING : TEACHER_COMPLETED;
      return list[index] || null;

          <div class="text-slate-600">${t('主力更新老师', 'Top teacher')}：${cw.topCount > 0 ? `${esc(cw.topTeacher)} (${cw.topCount}${t('次', 'x')})` : t('暂无老师更新记录', 'No teacher updates yet')}</div>

            <span id="progressCount" class="font-mono text-slate-500">${curVal.length}/2000</span>
          </div>
          <textarea id="progressInput" rows="5" maxlength="2000" placeholder="Unit 3 · Page 24" oninput="const c=document.getElementById('progressCount');if(c)c.textContent=this.value.length+'/2000';" class="min-h-[110px] w-full resize-y rounded-xl border border-slate-300 bg-white px-3 py-2 text-[14px] leading-relaxed text-slate-900 outline-none placeholder:text-slate-500 focus:border-indigo-500">${esc(curVal)}</textarea>
          <p class="mt-1 text-[12px] text-slate-500">${t('请尽量填写英文，便于老师看懂（最多 2000 字符，可多行）', 'Please write in English so teachers can understand (max 2,000 characters, multi-line).')}</p>
        </div>
        <div>
          <div class="mb-1.5 text-[12px] font-bold text-slate-700">${t('英文快捷短语', 'Quick English phrases')}</div>
          <div class="flex flex-wrap gap-1.5">
            ${quickPhrases.map((q) => `<button type="button" data-action="append-progress" data-text="${esc(q)}" class="h-7 whitespace-nowrap rounded-full border border-slate-200 bg-white px-2.5 text-[12px] font-medium text-slate-600 transition hover:bg-slate-50">${esc(q)}</button>`).join('')}
          </div>
        </div>
        <button type="button" data-action="save-progress" class="flex h-11 w-full items-center justify-center rounded-xl bg-indigo-600 text-[14px] font-semibold text-white transition hover:bg-indigo-700">${t('保存进度', 'Save Progress')}</button>
      </div>`);
    }

    function studentNoteSheet() {
      const target = state.studentNoteTarget;
      if (!target) return '';
      const item = progressTargetItem(target.kind, target.index);
      if (!item || item.type === 'group') return '';
      const val = item.note || '';
      return sheetShell(t('📝 学生备注', '📝 Student Note'), `${displayName(item)} · ${item.when}`, `<div class="space-y-3">
        <div>
          <div class="mb-1 flex items-center justify-between text-[12px]">
            <label for="studentNoteInput" class="font-bold text-slate-700">${t('学生备注', 'Student Note')}</label>
            <span id="studentNoteCount" class="font-mono text-slate-500">${val.length}/2000</span>
          </div>
          <textarea id="studentNoteInput" rows="6" maxlength="2000" placeholder="Shy at first, David guides well…" oninput="const c=document.getElementById('studentNoteCount');if(c)c.textContent=this.value.length+'/2000';" class="min-h-[130px] w-full resize-y rounded-xl border border-slate-300 bg-white px-3 py-2 text-[14px] leading-relaxed text-slate-900 outline-none placeholder:text-slate-500 focus:border-indigo-500">${esc(val)}</textarea>
          <p class="mt-1 text-[12px] text-slate-500">${t('请尽量填写英文，便于老师看懂（最多 2000 字符，可多行）', 'Please write in English so teachers can understand (max 2,000 characters, multi-line).')}</p>

        <button type="button" data-action="save-student-note" class="flex h-11 w-full items-center justify-center rounded-xl bg-indigo-600 text-[14px] font-semibold text-white transition hover:bg-indigo-700">${t('保存学生备注', 'Save Student Note')}</button>
      </div>`);
    }

    function notePreviewSheet() {
      const preview = state.notePreview;
      if (!preview) return '';
      const item = progressTargetItem(preview.kind, preview.index);
      if (!item) return '';
      const actions = `<div class="flex gap-2">
        <button data-action="close-overlay" class="flex h-11 flex-1 items-center justify-center rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-700 transition hover:bg-slate-50">${t('收起', 'Close')}</button>
        <button data-action="edit-preview-note" class="flex h-11 flex-1 items-center justify-center rounded-xl bg-indigo-600 text-[14px] font-semibold text-white transition hover:bg-indigo-700">${t('编辑', 'Edit')}</button>
      </div>`;
      if (preview.field === 'student') {
        return sheetShell(t('📝 学生备注', '📝 Student Note'), `${displayName(item)} · ${item.when}`, `<div class="space-y-3">
          <div class="whitespace-pre-line rounded-xl border border-slate-200 bg-white p-3 text-[14px] leading-relaxed text-slate-700">${esc(item.note || '—')}</div>
          ${actions}
        </div>`);
      }
      const { cw } = primaryCourseware(item);
      return sheetShell(t('📚 进度备注', '📚 Process Note'), `${displayName(item)} · ${item.when}`, `<div class="space-y-3">
        <div class="rounded-xl border border-slate-200 bg-slate-50 p-3 text-[12px]">
          <div class="font-bold text-slate-900">${esc(cw.name)} <span class="font-medium text-slate-500">(${esc(cw.level || 'Standard')})</span></div>
          <div class="mt-0.5 text-slate-600">${t('最后更新', 'Last updated')}：${esc(cw.updatedBy)} (${esc(cw.updatedByRole)}) · ${cw.daysAgo === 0 ? t('刚刚', 'Just now') : t(`${cw.daysAgo} 天前`, `${cw.daysAgo}d ago`)}</div>
        </div>
        <div class="whitespace-pre-line rounded-xl border border-slate-200 bg-white p-3 text-[14px] leading-relaxed text-slate-700">${esc(cw.progress || '—')}</div>
        ${actions}
      </div>`);
    }

    function renderOverlay() {
      const root = $('overlayRoot');
      if (!state.overlay) { root.innerHTML = ''; return; }
      if (state.overlay === 'todo-owner') root.innerHTML = todoOwnerSheet();
      else if (state.overlay === 'notifications') root.innerHTML = notificationsSheet();
      else if (state.overlay === 'legal') root.innerHTML = legalSheet();
      else if (state.overlay === 'qr') root.innerHTML = qrSheet();
      else if (state.overlay === 'monitor-qr') root.innerHTML = monitorQrSheet();
      else if (state.overlay === 'my-wechat-qr') root.innerHTML = myWechatQrSheet();
      else if (state.overlay === 'assets') root.innerHTML = assetsSheet();
      else if (state.overlay === 'progress') root.innerHTML = progressSheet();
      else if (state.overlay === 'student-note') root.innerHTML = studentNoteSheet();
      else if (state.overlay === 'note-preview') root.innerHTML = notePreviewSheet();
      else if (state.overlay === 'children') root.innerHTML = childrenSheet();
      else if (state.overlay === 'activity') root.innerHTML = activitySheet();
      else root.innerHTML = '';
    }

    /* ------------------------------------------------------------------
     * 渲染与交互
     * ------------------------------------------------------------------ */
    function renderContent() {
      if (state.tab === 'home') return renderHome();
      if (state.tab === 'schedule') return renderScheduleEmbed();
      if (state.tab === 'ops') return (state.role === 'monitor' || state.role === 'admin') ? renderOps() : renderPlaceholder();
      if (state.tab === 'students') return state.role === 'teacher' ? renderTeacherStudents() : renderPlaceholder();
      if (state.tab === 'me') return renderMe();
      if (state.tab === 'settings') return state.role === 'admin' ? renderAdminSettings() : renderPlaceholder();
      if (state.tab === 'hall') return renderHall();
      return renderPlaceholder();
    }

    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;
      const contentEl = $('content');
      const top = contentEl.scrollTop;
      $('banner').innerHTML = renderBanner();
      contentEl.innerHTML = renderContent();
      $('bottomnav').innerHTML = renderNav();
      renderOverlay();
      syncConsole();
      contentEl.scrollTop = top;
      if (window.lucide) window.lucide.createIcons();
    }

    function syncConsole() {
      document.querySelectorAll('#console .role-btn').forEach((btn) => {
        const on = btn.dataset.role === state.role;
        btn.className = `role-btn rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-200'}`;
      });
      document.querySelectorAll('#console .device-btn').forEach((btn) => {
        const on = btn.dataset.device === state.device;
        btn.className = `device-btn rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-slate-200'}`;
      });
      document.querySelectorAll('#console .lang-btn').forEach((btn) => {
        const on = btn.dataset.consoleLang === state.lang;
        btn.className = `lang-btn rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-slate-200'}`;
      });
      const manyBtn = document.getElementById('btnManyKids');
      if (manyBtn) manyBtn.className = `rounded-lg border px-2.5 py-1.5 font-semibold transition ${state.manyKids ? 'border-indigo-200 bg-indigo-50 text-indigo-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`;
      const noCourseBtn = document.getElementById('btnNoCourse');
      if (noCourseBtn) noCourseBtn.className = `rounded-lg border px-2.5 py-1.5 font-semibold transition ${state.noCourse ? 'border-indigo-200 bg-indigo-50 text-indigo-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`;
      const noKidsBtn = document.getElementById('btnNoKids');
      if (noKidsBtn) noKidsBtn.className = `rounded-lg border px-2.5 py-1.5 font-semibold transition ${state.noKids ? 'border-indigo-200 bg-indigo-50 text-indigo-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`;
      const ordinaryAdminBtn = document.getElementById('btnOrdinaryAdmin');
      if (ordinaryAdminBtn) ordinaryAdminBtn.className = `rounded-lg border px-2.5 py-1.5 font-semibold transition ${state.ordinaryAdmin ? 'border-indigo-200 bg-indigo-50 text-indigo-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`;
    }

    function readConsoleCollapsed() {
      try { return localStorage.getItem('dream_proto_nav_collapsed') === '1'; } catch (e) { return false; }
    }

    function writeConsoleCollapsed(collapsed) {
      try { localStorage.setItem('dream_proto_nav_collapsed', collapsed ? '1' : '0'); } catch (e) { /* 本地存储不可用时静默降级 */ }
    }

    function applyConsoleCollapsed(collapsed) {
      const consoleEl = $('console');
      if (consoleEl) consoleEl.classList.toggle('hidden', collapsed);
      const mini = document.querySelector('[data-console-mini]');
      if (mini) {
        mini.classList.toggle('hidden', !collapsed);
        mini.classList.toggle('flex', collapsed);
      }
    }

    function updateTodoQuery(value) {
      state.todoQuery = String(value || '');
      const body = $('todoSectionBody');
      const count = $('todoCount');
      if (count) count.textContent = `${filteredTodos().length} 条`;
      if (body) {
        body.innerHTML = renderTodoBody();
        if (window.lucide) window.lucide.createIcons();
      }
    }

    function setRole(role) {
      if (!ROLES[role]) return;
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.tab = 'home';
      state.overlay = null;
      state.todoFilter = 'all'; state.todoExpanded = false; state.todoQuery = '';
      state.todoOwnerMode = 'all'; state.todoOwnerPick = 'all'; state.assetsTab = 'orders';
      state.scheduleChild = 'alice';
      state.feedChild = 'all'; state.manyKids = false;
      state.qrTeacher = null; state.qrReturn = null;
      state.studentNoteTarget = null; state.notePreview = null;
      state.teacherUpcomingLoads = 0; state.teacherCompletedLoads = 0; state.teacherNoticeRead = false;
      state.noCourse = false; state.noticeSeen = 0;
      state.lang = role === 'teacher' ? 'en' : 'zh';
      renderAll();
      $('content').scrollTop = 0;
      toast(`已切换到${ROLES[role].label}`);
    }

    function navTo(tab) {
      if (!roleMeta().nav.some((n) => n.id === tab) && tab !== 'home') return;
      const enteringSchedule = tab === 'schedule' && state.tab !== 'schedule';
      state.tab = tab;
      state.overlay = null;
      state.qrTeacher = null;
      state.qrReturn = null;
      if (enteringSchedule) {
        state.scheduleChild = 'alice';
      }
      renderAll();
      $('content').scrollTop = 0;
    }

    function setLang(lang) {
      state.lang = lang;
      renderAll();
      if (state.role === 'teacher') {
        toast(lang === 'zh' ? '已切换为中文' : 'Language: English');
      } else {
        toast(lang === 'zh' ? '已切换为中文偏好' : 'Language preference saved: English');
      }
    }

    document.getElementById('console').addEventListener('click', (event) => {
      if (event.target.closest('[data-console-collapse]')) {
        applyConsoleCollapsed(true);
        writeConsoleCollapsed(true);
        return;
      }
      const roleBtn = event.target.closest('[data-role]');
      if (roleBtn) return setRole(roleBtn.dataset.role);
      const deviceBtn = event.target.closest('[data-device]');
      if (deviceBtn) { state.device = deviceBtn.dataset.device; renderAll(); return; }
      const langBtn = event.target.closest('[data-console-lang]');
      if (langBtn) return setLang(langBtn.dataset.consoleLang);
      if (event.target.closest('#btnResetDemo')) return resetDemo();
      if (event.target.closest('#btnManyKids')) {
        state.manyKids = !state.manyKids;
        state.feedChild = 'all';
        renderAll();
        return;
      }
      if (event.target.closest('#btnNoCourse')) {
        state.noCourse = !state.noCourse;
        renderAll();
        return;
      }
      if (event.target.closest('#btnNoKids')) {
        state.noKids = !state.noKids;
        state.feedChild = 'all';
        renderAll();
        return;
      }
      if (event.target.closest('#btnOrdinaryAdmin')) {
        state.ordinaryAdmin = !state.ordinaryAdmin;
        renderAll();
        return;
      }
    });

    $('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'quick-tab') return navTo(el.dataset.tab);
      if (action === 'todo-filter') {
        state.todoFilter = el.dataset.filter || 'all';
        state.todoExpanded = false;
        renderAll();
        return;
      }
      if (action === 'todo-owner') {
        const owner = el.dataset.owner === 'mine' ? 'mine' : 'all';
        state.todoOwnerMode = owner;
        if (state.role === 'admin') state.todoOwnerPick = owner;
        state.todoExpanded = false;
        renderAll();
        return;
      }
      if (action === 'todo-more') {
        state.todoExpanded = true;
        renderAll();
        return;
      }
      if (action === 'load-more') {
        if (el.dataset.list === 'upcoming') state.teacherUpcomingLoads = Math.min(5, state.teacherUpcomingLoads + 1);
        else state.teacherCompletedLoads = Math.min(5, state.teacherCompletedLoads + 1);
        return renderAll();
      }
      if (action === 'toast') return toast(el.dataset.message || '操作已完成');
      if (action === 'feed-child') {
        state.feedChild = el.dataset.child || 'all';
        state.overlay = null;
        renderAll();
        return;
      }
      if (action === 'feed-child-drawer') { state.overlay = 'children'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return; }
      if (action === 'activity-feed') { state.overlay = 'activity'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return; }
      if (action === 'teacher-notice-view' || action === 'teacher-notice-read') {
        state.teacherNoticeRead = true;
        renderAll();
        return;
      }
      if (action === 'open-todo-owner-sheet') { state.overlay = 'todo-owner'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return; }
      if (action === 'select-todo-owner') {
        const val = ['all', 'mine', 'Leo', 'Amy', 'Sarah'].includes(el.dataset.owner) ? el.dataset.owner : 'all';
        state.todoOwnerPick = val;
        if (val === 'all' || val === 'mine') state.todoOwnerMode = val;
        state.todoExpanded = false;
        state.overlay = null;
        renderAll();
        return;
      }
      if (action === 'notifications') {
        if (state.role !== 'teacher') {
          if (state.feedChild === 'all' && state.noticeSeen < familyUrgentNotices().length) {
            state.noticeSeen += 1;
            renderAll();
          } else if (state.feedChild !== 'all' && !state.readChildNotices[state.feedChild]) {
            state.readChildNotices[state.feedChild] = true;
            renderAll();
          }
        }
        state.overlay = 'notifications'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return;
      }
      if (action === 'legal') { state.legalDoc = el.dataset.message || 'terms'; state.overlay = 'legal'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return; }
      if (action === 'close-overlay') {
        state.overlay = null; state.qrReturn = null;
        renderOverlay();
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      if (action === 'qr') {
        state.qrReturn = null;
        state.qrTeacher = el.dataset.teacher ? { name: el.dataset.teacher } : null;
        state.overlay = 'qr';
        renderOverlay();
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      if (action === 'monitor-qr') {
        state.monitorQrName = el.dataset.monitor || 'Leo';
        state.overlay = 'monitor-qr';
        renderOverlay();
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      if (action === 'my-wechat-qr') {
        state.overlay = 'my-wechat-qr';
        renderOverlay();
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      if (action === 'toggle-monitor-qr') {
        const mode = el.dataset.mode;
        state.monitorWechatUploaded = mode !== 'clear';
        renderAll();
        toast(state.monitorWechatUploaded ? '微信二维码已更新' : '已清除微信二维码');
        return;
      }
      if (action === 'assets') {
        state.assetsTab = 'orders';
        state.overlay = 'assets';
        renderOverlay();
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      if (action === 'assets-tab') {
        state.assetsTab = el.dataset.tab === 'changes' ? 'changes' : 'orders';
        renderOverlay();
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      if (action === 'open-progress') {
        return openProgressEditor(el.dataset.kind || 'completed', Number(el.dataset.index) || 0);
      }
      if (action === 'open-student-note') {
        return openStudentNoteEditor(el.dataset.kind || 'completed', Number(el.dataset.index) || 0);
      }
      if (action === 'preview-note') {
        state.notePreview = {
          kind: el.dataset.kind || 'completed',
          index: Number(el.dataset.index) || 0,
          field: el.dataset.field || 'process'
        };
        state.overlay = 'note-preview';
        renderOverlay();
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      if (action === 'edit-preview-note') {
        const preview = state.notePreview;
        if (!preview) return;
        if (preview.field === 'student') return openStudentNoteEditor(preview.kind, preview.index);
        return openProgressEditor(preview.kind, preview.index);
      }
      if (action === 'append-progress') {
        const inp = $('progressInput');
        if (!inp) return;
        const phrase = el.dataset.text || '';
        const prefix = inp.value && !inp.value.endsWith('\n') ? '\n' : '';
        const next = `${inp.value}${prefix}${phrase}`.slice(0, 2000);
        inp.value = next;
        const count = $('progressCount');
        if (count) count.textContent = `${next.length}/2000`;
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
        return;
      }
      if (action === 'save-student-note') {
        const target = state.studentNoteTarget;
        const inp = $('studentNoteInput');
        const item = target ? progressTargetItem(target.kind, target.index) : null;
        if (item && inp) item.note = inp.value.trim().slice(0, 2000);
        state.overlay = null;
        state.studentNoteTarget = null;
        renderAll();
        toast(t('学生备注已保存', 'Student note saved'));
        return;
      }
      if (action === 'select-cw') {
        state.progressCwIdx = Number(el.dataset.cwIdx) || 0;
        state.progressLevel = '';
        renderOverlay();
        if (window.lucide) window.lucide.createIcons();
        const inp = $('progressInput');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        return;
      }
      if (action === 'select-level') {
        state.progressLevel = el.dataset.level || '';
        document.querySelectorAll('[data-action="select-level"]').forEach((pill) => {
          const on = pill.dataset.level === state.progressLevel;
          pill.className = `h-8 shrink-0 whitespace-nowrap rounded-full px-3 text-[12px] transition ${on ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}`;
          pill.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        return;
      }
      if (action === 'save-progress') {
        const target = state.progressTarget;
        const inp = $('progressInput');
        if (target && inp) {
          const list = target.kind === 'upcoming' ? TEACHER_UPCOMING : TEACHER_COMPLETED;
          const item = list[target.index];
          const cw = item && item.coursewares && item.coursewares[state.progressCwIdx || 0];
          if (cw) {
            const lv = resolveProgressLevel(cw);
            const levelValue = lv.options.includes(state.progressLevel) ? state.progressLevel : lv.selected;
            cw.progress = inp.value.trim().slice(0, 2000);
            cw.level = levelValue;
            cw.daysAgo = 0;
            cw.updatedBy = 'David Miller';
            cw.updatedByRole = '老师';
            cw.topTeacher = 'David Miller';
            cw.topCount = (cw.topCount || 0) + 1;
          }
        }
        state.overlay = null;
        state.progressTarget = null;
        state.progressLevel = '';
        renderAll();
        toast(t('课件级别与进度备注已保存', 'Material level and process note saved'));
        return;
      }
      if (action === 'set-lang') return setLang(el.dataset.lang);
      if (action === 'copy-id') {
        const text = el.dataset.account || (state.qrTeacher && state.qrTeacher.account) || '982-123-456';
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(`已复制: ${text}`)).catch(() => toast(text));
        else toast(text);
      }
    });

    const consoleMini = document.querySelector('[data-console-mini]');
    if (consoleMini) {
      consoleMini.addEventListener('click', (event) => {
        if (!event.target.closest('[data-console-expand]')) return;
        applyConsoleCollapsed(false);
        writeConsoleCollapsed(false);
      });
    }

    renderAll();
    applyConsoleCollapsed(readConsoleCollapsed());
  </script>
</body>
</html>

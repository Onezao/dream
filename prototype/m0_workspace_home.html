            <div class="flex items-center justify-between gap-2"><div><h3 class="text-[16px] font-bold text-slate-900">${esc(title)}</h3><p class="mt-0.5 text-[12px] text-slate-400">${esc(subtitle)}</p></div><button data-action="close-overlay" class="grid h-8 w-8 place-items-center rounded-xl text-slate-400 hover:bg-slate-100">${icon('x', 'h-4 w-4')}</button></div>
          </div>
          <div class="flex-1 overflow-y-auto p-3">${body}</div>
        </div>
      </div>`;
    }

    function identitySheet() {
      return sheetShell('身份与账号', '当前账号绑定的角色与工作台', `<div class="space-y-1">${Object.values(ROLES).map((r) => `<button data-action="set-role" data-role="${r.key}" class="flex w-full items-center gap-3 rounded-xl border px-3 py-2.5 text-left ${state.role === r.key ? 'border-indigo-200 bg-indigo-50/60' : 'border-transparent bg-white hover:bg-slate-50'}"><span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br ${r.banner} text-[14px] font-bold text-white">${r.initial}</span><span class="min-w-0 flex-1"><span class="block text-[14px] font-bold text-slate-900">${esc(r.label)}</span><span class="block text-[12px] text-slate-400">${esc(r.brand)} · ${esc(r.short)}</span></span>${state.role === r.key ? `<span class="grid h-6 w-6 place-items-center rounded-full bg-indigo-600 text-white">${icon('check', 'h-3.5 w-3.5')}</span>` : icon('chevron-right', 'h-4 w-4 text-slate-300')}</button>`).join('')}</div>`);
    }

    function notificationsSheet() {
      return sheetShell('通知摘要', '完整通知中心见 M4 原型', `<div class="space-y-2">
        <div class="rounded-2xl border border-rose-200 bg-rose-50/80 p-3"><div class="flex items-center justify-between"><span class="text-[12px] font-bold text-rose-700">三级 · 课程转让成功</span><span class="text-[12px] text-rose-600">5 分钟前</span></div><p class="mt-1 text-[14px] text-rose-900">AliceZ12 的固定位已转让给 TomZ11，资金持有人不变。</p></div>
        <div class="rounded-2xl border border-indigo-200 bg-indigo-50/80 p-3"><div class="flex items-center justify-between"><span class="text-[12px] font-bold text-indigo-700">一级 · 公开留言回复</span><span class="text-[12px] text-indigo-600">8 分钟前</span></div><p class="mt-1 text-[14px] text-indigo-900">David 老师在公开留言板回复了本周学习反馈。</p></div>
        <a href="m4_notification.html" target="_blank" rel="noopener" class="flex h-11 items-center justify-center rounded-xl bg-indigo-600 text-[16px] font-semibold text-white">打开 M4 通知原型</a>
      </div>`);
    }

    function legalSheet() {
      const docs = {
        terms: { title: '用户服务协议', version: 'v1.1 · 2026-11', content: '固定位四周一轮、12.5% 请假配额、开课前 3 小时授课保障期、代课差价多退少不补、退费原收款方退回。' },
        privacy: { title: '隐私保护政策', version: 'v1.1 · 2026-11', content: '仅收集上课必需的年龄与昵称；未成年人信息保护专章；跨国数据跨境传输与海外外教端脱敏说明。' },
        about: { title: '关于 Dream', version: 'Dream v1.0.0', content: 'Dream 是少儿英语小班与 1v1 教学打造的教务排班与分账管理系统。官方支持请联系班长或平台客服。' }
      };
      const doc = docs[state.legalDoc] || docs.terms;
      return sheetShell(doc.title, doc.version, `<div class="rounded-2xl border border-slate-200/80 bg-slate-50 p-4 text-[14px] leading-relaxed text-slate-600">${esc(doc.content)}</div><p class="mt-3 text-[12px] text-slate-400">法律文本待定；本期仅提供入口与占位内容。</p>`);
    }

    function qrSheet() {
      return sheetShell('扫码 / 教室号', '家长手机对准上课设备扫码进班', `<div class="flex flex-col items-center">
        <div class="grid h-52 w-52 grid-cols-8 gap-1 rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">${Array.from({ length: 64 }, (_, i) => `<span class="${[0,1,2,7,8,9,14,15,16,23,24,31,32,39,40,47,48,49,54,55,56,57,62,63].includes(i) || i % 7 === 0 ? 'bg-slate-900' : 'bg-white'} rounded-[1px]"></span>`).join('')}</div>
        <div class="mt-3 text-[16px] font-bold text-slate-900">David Miller</div>
        <div class="mt-1 font-mono text-[12px] text-slate-500">ClassIn ID · david.miller</div>
        <button data-action="copy-id" class="mt-3 h-10 rounded-xl border border-slate-200 bg-slate-50 px-4 text-[14px] font-semibold text-slate-700">复制 ClassIn 账号</button>
        <p class="mt-3 text-[12px] leading-relaxed text-slate-400">学生用平板 / 电脑进教室，家长手机扫码或复制账号即可。</p>
      </div>`);
    }

    function renderOverlay() {
      const root = $('overlayRoot');
      if (!state.overlay) { root.innerHTML = ''; return; }
      if (state.overlay === 'identity') root.innerHTML = identitySheet();
      else if (state.overlay === 'notifications') root.innerHTML = notificationsSheet();
      else if (state.overlay === 'legal') root.innerHTML = legalSheet();
      else if (state.overlay === 'qr') root.innerHTML = qrSheet();
      else root.innerHTML = '';
    }

    /* ------------------------------------------------------------------
     * 渲染与交互
     * ------------------------------------------------------------------ */
    function renderContent() {
      if (state.tab === 'home') return renderHome();
      if (state.tab === 'schedule') return state.role === 'teacher' ? renderTeacherSchedule() : renderAgenda();
      if (state.tab === 'ops') return state.role === 'admin' ? renderAdminOps() : renderOps();
      if (state.tab === 'me') return renderMe();
      if (state.tab === 'settings') return renderAdminSettings();
      if (state.tab === 'hall') return renderHall();
      return renderPlaceholder();
    }

    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;
      const contentEl = $('content');
      const top = contentEl.scrollTop;
      $('banner').innerHTML = renderBanner();
      contentEl.innerHTML = renderContent();
      $('bottomnav').innerHTML = renderNav();
      renderOverlay();
      syncConsole();
      contentEl.scrollTop = top;
      if (window.lucide) window.lucide.createIcons();
    }

    function syncConsole() {
      document.querySelectorAll('#console .role-btn').forEach((btn) => {
        const on = btn.dataset.role === state.role;
        btn.className = `role-btn rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-200'}`;
      });
      document.querySelectorAll('#console .device-btn').forEach((btn) => {
        const on = btn.dataset.device === state.device;
        btn.className = `device-btn rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-slate-200'}`;
      });
    }

    function setRole(role) {
      if (!ROLES[role]) return;
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.tab = 'home';
      state.overlay = null;
      state.scheduleFilter = 'all';
      state.opsTab = 'teachers';
      if (role !== 'teacher') state.lang = 'zh';
      renderAll();
      $('content').scrollTop = 0;
      toast(`已切换到${ROLES[role].label}`);
    }

    function navTo(tab) {
      if (!roleMeta().nav.some((n) => n.id === tab) && tab !== 'home') return;
      state.tab = tab;
      state.overlay = null;
      renderAll();
      $('content').scrollTop = 0;
    }

    function setLang(lang) {
      if (state.role !== 'teacher') {
        toast('语言切换入口在「我的」，原型仅演示教师端英文界面');
        return;
      }
      state.lang = lang;
      renderAll();
      toast(lang === 'zh' ? '已切换为中文' : 'Language: English');
    }

    document.getElementById('console').addEventListener('click', (event) => {
      const roleBtn = event.target.closest('[data-role]');
      if (roleBtn) return setRole(roleBtn.dataset.role);
      const deviceBtn = event.target.closest('[data-device]');
      if (deviceBtn) { state.device = deviceBtn.dataset.device; renderAll(); return; }
      if (event.target.closest('#btnResetDemo')) return resetDemo();
    });

    $('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'quick-tab') return navTo(el.dataset.tab);
      if (action === 'toast') return toast(el.dataset.message || '原型演示');
      if (action === 'identity') { state.overlay = 'identity'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return; }
      if (action === 'notifications') { state.overlay = 'notifications'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return; }
      if (action === 'legal') { state.legalDoc = el.dataset.message || 'terms'; state.overlay = 'legal'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return; }
      if (action === 'close-overlay') { state.overlay = null; renderOverlay(); return; }
      if (action === 'qr') { state.overlay = 'qr'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return; }
      if (action === 'set-role') return setRole(el.dataset.role);
      if (action === 'filter-schedule') { state.scheduleFilter = el.dataset.filter || 'all'; renderAll(); return; }
      if (action === 'ops-tab') { state.opsTab = el.dataset.tab || 'teachers'; renderAll(); return; }
      if (action === 'set-lang') return setLang(el.dataset.lang);
      if (action === 'copy-id') {
        const text = 'david.miller';
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('已复制 ClassIn 账号')).catch(() => toast(text));
        else toast(text);
      }
    });

    renderAll();
  </script>
</body>
</html>

<!-- 即抛型原型：M0 工作台与主页全域基座。纯前端 Mock，不连接后端，不触碰生产代码。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原型 · M0 工作台与主页基座</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Inter', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 antialiased">

  <!-- 原型控制台 -->
  <header class="sticky top-0 z-[60] border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-2.5 text-xs">
      <div class="flex items-center gap-2">
        <span class="grid h-6 w-6 place-items-center rounded-lg bg-slate-900 text-[12px] font-bold text-amber-400">M0</span>
        <span class="text-[13px] font-bold text-slate-900">工作台与主页基座</span>
        <span class="hidden text-[12px] font-medium text-slate-400 sm:inline">纯前端 Mock · 不连接后端</span>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">工作台</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-action="set-role" data-role="user" data-role-btn class="console-role inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 font-semibold">
            <i data-lucide="home" class="h-3.5 w-3.5"></i>家长
          </button>
          <button data-action="set-role" data-role="monitor" data-role-btn class="console-role inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 font-semibold">
            <i data-lucide="briefcase" class="h-3.5 w-3.5"></i>班长
          </button>
          <button data-action="set-role" data-role="teacher" data-role-btn class="console-role inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 font-semibold">
            <i data-lucide="graduation-cap" class="h-3.5 w-3.5"></i>教师
          </button>
          <button data-action="set-role" data-role="admin" data-role-btn class="console-role inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 font-semibold">
            <i data-lucide="shield-check" class="h-3.5 w-3.5"></i>管理员
          </button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">多角色</span>
        <button data-action="toggle-multi" id="multiToggle" class="relative h-5 w-9 rounded-full bg-indigo-600 transition">
          <span class="absolute top-0.5 h-4 w-4 rounded-full bg-white shadow-sm transition-all"></span>
        </button>
        <span id="multiLabel" class="text-[12px] font-semibold text-indigo-600">开</span>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">设备</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-action="set-device" data-device="mobile" data-device-btn class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 font-semibold">
            <i data-lucide="smartphone" class="h-3.5 w-3.5"></i>手机
          </button>
          <button data-action="set-device" data-device="tablet" data-device-btn class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 font-semibold">
            <i data-lucide="tablet" class="h-3.5 w-3.5"></i>平板
          </button>
        </div>
      </div>

      <a href="../docs/prd/m0_workspace_and_home.md" class="ml-auto hidden items-center gap-1.5 rounded-lg border border-slate-200 px-2.5 py-1.5 font-semibold text-slate-500 hover:bg-slate-50 md:inline-flex">
        <i data-lucide="file-text" class="h-3.5 w-3.5"></i>M0 PRD
      </a>
    </div>
  </header>

  <main class="flex justify-center px-4 py-6">
    <!-- 手机优先画框；平板由 JS 切换为 768px -->
    <div id="frame" class="relative flex h-[812px] w-[390px] flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300">
      <div id="topbar" class="shrink-0"></div>
      <div id="content" class="flex-1 overflow-y-auto"></div>
      <nav id="bottomnav" class="shrink-0"></nav>
      <div id="overlay"></div>
      <div id="toast" class="pointer-events-none absolute bottom-24 left-1/2 z-[80] hidden -translate-x-1/2 rounded-full bg-slate-900/90 px-4 py-2 text-[12px] font-semibold text-white shadow-xl"></div>
    </div>
  </main>

  <!-- Tailwind CDN 动态类安全垫 -->
  <div class="hidden grid-cols-1 grid-cols-2 grid-cols-3 grid-cols-4 grid-cols-6 grid-cols-[repeat(21,1fr)]"></div>

  <script>
    const ROLE_META = {
      user: {
        label: '家长', short: '家长端', icon: 'home', todo: 0, frame: 'bg-slate-50',
        title: '家长工作台', subtitle: 'Amy · 2 个孩子',
        desc: '多孩档案与课表',
        nav: [
          { icon: 'home', label: '首页', action: 'open-home' },
          { icon: 'calendar-days', label: '课表', action: 'toast', message: '课表入口：由 M3 排班模块承载' },
          { icon: 'plus-circle', label: '约课', action: 'toast', message: '约课入口：由 M3 排班模块承载' },
          { icon: 'bell', label: '消息', action: 'notifications' },
          { icon: 'user', label: '我的', action: 'open-me' }
        ]
      },
      monitor: {
        label: '班长', short: '班长端', icon: 'briefcase', todo: 2, frame: 'bg-slate-100',
        title: '班长工作台', subtitle: 'Leo 的教务域 · 50 名学生',
        desc: '50 名学生与教师团队',
        nav: [
          { icon: 'home', label: '首页', action: 'open-home' },
          { icon: 'calendar-days', label: '排课', action: 'toast', message: '全局排课网格：由 M3 排班模块承载' },
          { icon: 'file-plus', label: '录单', action: 'toast', message: '购课录单：由 M2 资金单据模块承载' },
          { icon: 'wallet', label: '财务', action: 'toast', message: '财务中心：由 M5 结算模块承载' },
          { icon: 'user', label: '我的', action: 'open-me' }
        ]
      },
      teacher: {
        label: '教师', short: '教师端', icon: 'graduation-cap', todo: 1, frame: 'bg-slate-50',
        title: 'Teacher Workspace', subtitle: 'David · 今日 6 节',
        desc: '今日授课与代课交接',
        nav: [
          { icon: 'home', labelKey: 'navHome', action: 'open-home' },
          { icon: 'calendar-days', labelKey: 'navSchedule', action: 'toast', message: '教师 7 色课表：由 M3 排班模块承载' },
          { icon: 'message-square', labelKey: 'navFeedback', action: 'toast', message: '留言与反馈：由 M1D 留言板模块承载' },
          { icon: 'wallet', labelKey: 'navPay', action: 'toast', message: '周课酬节数单：由 M5B 结算模块承载' },
          { icon: 'user', labelKey: 'navMe', action: 'open-me' }
        ]
      },
      admin: {
        label: '管理员', short: '管理员端', icon: 'shield-check', todo: 1, frame: 'bg-slate-100',
        title: '管理员后台', subtitle: 'Sarah · 平台中枢',
        desc: '中央结算与平台风控',
        nav: [
          { icon: 'home', label: '首页', action: 'open-home' },
          { icon: 'landmark', label: '结算', action: 'toast', message: '中央结算：由 M5 结算模块承载' },
          { icon: 'users', label: '教师', action: 'toast', message: '教师与班长调配：由 M1B 模块承载' },
          { icon: 'bar-chart-3', label: '报表', action: 'toast', message: '平台工具费周报：由 M5B 模块承载' },
          { icon: 'user', label: '我的', action: 'open-me' }
        ]
      }
    };

    const PROFILES = {
      alice: {
        name: 'AliceZ12', age: 12, initial: 'A', color: 'sky', tag: '固定位',
        next: { teacher: 'David', initial: 'D', course: '少儿英语', type: '1v1', time: '19:00 - 19:30', countdown: '02:14:36', fuse: true },
        stats: { scheduled: 3, pending: 5, leave: '1/2' },
        todos: [
          { icon: 'calendar-plus', label: '去约课', sub: '还有 3 节待排', tone: 'indigo' },
          { icon: 'message-square', label: '看反馈', sub: 'David 新反馈', tone: 'sky' },
          { icon: 'alarm-clock', label: '续费提醒', sub: '72h 后到期', tone: 'rose' }
        ]
      },
      bob: {
        name: 'BobZ10', age: 10, initial: 'B', color: 'emerald', tag: '临时课',
        next: { teacher: 'Amy', initial: 'A', course: '生活口语', type: '1v1', time: '20:00 - 20:30', countdown: '03:14:36', fuse: false },
        stats: { scheduled: 2, pending: 1, leave: '0/2' },
        todos: [
          { icon: 'calendar-plus', label: '去约课', sub: '还有 1 节待排', tone: 'indigo' },
          { icon: 'message-square', label: '看反馈', sub: 'Amy 新反馈', tone: 'sky' },
          { icon: 'users', label: '小班课', sub: '2 个招生中', tone: 'violet' }
        ]
      }
    };

    const TONES = {
      indigo: { bg: 'bg-indigo-50', text: 'text-indigo-600' },
      sky: { bg: 'bg-sky-50', text: 'text-sky-600' },
      emerald: { bg: 'bg-emerald-50', text: 'text-emerald-600' },
      amber: { bg: 'bg-amber-50', text: 'text-amber-600' },
      rose: { bg: 'bg-rose-50', text: 'text-rose-600' },
      violet: { bg: 'bg-violet-50', text: 'text-violet-600' },
      purple: { bg: 'bg-purple-50', text: 'text-purple-600' },
      slate: { bg: 'bg-slate-100', text: 'text-slate-600' }
    };

    const TEACHER_TEXT = {
      zh: {
        navHome: '首页', navSchedule: '课表', navFeedback: '反馈', navPay: '课酬', navMe: '我的',
        workspaceTitle: '教师工作台', topSubtitle: 'David · 今日 6 节',
        greeting: '下午好，David', subtitle: '今日 6 节课 · 1 节代课', todayDate: '11月6日 周四',
        today: '今日授课', lessons: '节课', done: '已完课', upcoming: '待上课', substitute: '代上课',
        next: '下一节课', substituting: '代上课', years: '岁', oral: '生活口语', forTeacher: '原老师',
        handover: '原老师交接摘要', handoverText: '上节课完成 Unit 4 阅读，Bob 对过去式还不熟；今天先复习 10 分钟再进新单元。',
        feedback: '留言板 / 写反馈', openClassIn: '打开 ClassIn', leave: '请假', leaveToast: '已打开请假面板',
        feedbackReminder: '18:00 的课后反馈还没写', fillNow: '去补录',
        week: '本周课表', legend: '7 色状态', thu: '周四', fri: '周五', sat: '周六',
        tools: '常用工具', toolAvailability: '开放常规时段', toolLeave: '请假 / 销假', toolPay: '周课酬节数单', toolCard: '我的名片',
        weekLabel: '本周'
      },
      en: {
        navHome: 'Home', navSchedule: 'Schedule', navFeedback: 'Feedback', navPay: 'Pay', navMe: 'Me',
        workspaceTitle: 'Teacher', topSubtitle: 'David · 6 lessons',
        greeting: 'Good afternoon, David', subtitle: '6 lessons today · 1 substitute', todayDate: 'Nov 6 · Thu',
        today: "Today's teaching", lessons: 'lessons', done: 'Done', upcoming: 'Upcoming', substitute: 'Substitute',
        next: 'Next class', substituting: 'Substituting', years: 'yrs', oral: 'Conversational', forTeacher: 'for',
        handover: 'Handover from Amy', handoverText: 'We finished Unit 4 reading last time. Bob is still shaky on past tense — review for 10 minutes before the new unit.',
        feedback: 'Message / Feedback', openClassIn: 'Open ClassIn', leave: 'Request leave', leaveToast: 'Leave panel opened',
        feedbackReminder: 'Feedback for the 18:00 class is missing', fillNow: 'Add now',
        week: 'This week', legend: '7-color status', thu: 'Thu', fri: 'Fri', sat: 'Sat',
        tools: 'Tools', toolAvailability: 'Availability', toolLeave: 'Leave', toolPay: 'Weekly pay', toolCard: 'My card',
        weekLabel: 'This week'
      }
    };

    const state = {
      role: 'user',
      multiRole: true,
      device: 'mobile',
      profileId: 'alice',
      view: 'home',
      sheet: null,
      legalDoc: 'terms',
      lang: 'zh'
    };

    // 便于评审的 URL 参数：?role=monitor&device=tablet&multi=0&view=me&sheet=workspace&doc=privacy&lang=en
    const params = new URLSearchParams(location.search);
    if (params.get('role') && ROLE_META[params.get('role')]) state.role = params.get('role');
    if (params.get('device') === 'tablet') state.device = 'tablet';
    if (params.get('multi') === '0') state.multiRole = false;
    if (params.get('profile') && PROFILES[params.get('profile')]) state.profileId = params.get('profile');
    if (params.get('view') === 'me') state.view = 'me';
    if (params.get('lang') === 'en') state.lang = 'en';
    if (['workspace', 'profile', 'notifications', 'qr', 'legal'].includes(params.get('sheet'))) state.sheet = params.get('sheet');
    if (params.get('doc')) state.legalDoc = params.get('doc');

    const THEMES = {
      user: {
        topbar: 'bg-white/95 text-slate-900 border-b border-slate-200',
        capsule: 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50',
        iconBtn: 'bg-slate-100 text-slate-600 hover:bg-slate-200',
        avatar: 'bg-indigo-600 text-white',
        nav: 'border-t border-slate-200 bg-white',
        navActive: 'text-indigo-600',
        navIdle: 'text-slate-400'
      },
      monitor: {
        topbar: 'bg-indigo-950 text-white',
        capsule: 'border-indigo-700 bg-indigo-900/70 text-indigo-100 hover:bg-indigo-900',
        iconBtn: 'bg-white/10 text-white hover:bg-white/20',
        avatar: 'bg-indigo-600 text-white ring-1 ring-indigo-400',
        nav: 'border-t border-slate-200 bg-white',
        navActive: 'text-indigo-600',
        navIdle: 'text-slate-400'
      },
      teacher: {
        topbar: 'bg-white text-slate-900 border-b border-slate-200',
        capsule: 'border-slate-200 bg-slate-100 text-slate-700 hover:bg-slate-200',
        iconBtn: 'bg-slate-100 text-slate-600 hover:bg-slate-200',
        avatar: 'bg-slate-900 text-white',
        nav: 'border-t border-slate-200 bg-white',
        navActive: 'text-slate-900',
        navIdle: 'text-slate-400'
      },
      admin: {
        topbar: 'bg-slate-900 text-amber-400',
        capsule: 'border-amber-500/30 bg-slate-800 text-amber-300 hover:bg-slate-800/80',
        iconBtn: 'bg-white/5 text-amber-300 hover:bg-white/10',
        avatar: 'bg-amber-400 text-slate-900',
        nav: 'border-t border-slate-800 bg-slate-900',
        navActive: 'text-amber-400',
        navIdle: 'text-slate-500'
      }
    };

    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function t(key) {
      return TEACHER_TEXT[state.lang][key] || TEACHER_TEXT.zh[key] || key;
    }

    function otherTodo() {
      const order = ['monitor', 'admin', 'teacher', 'user'].filter(r => r !== state.role);
      for (const r of order) {
        if (ROLE_META[r].todo > 0) return { role: r, count: ROLE_META[r].todo };
      }
      return null;
    }

    function renderTopbar() {
      const meta = ROLE_META[state.role];
      const th = THEMES[state.role];
      const badge = otherTodo();
      const capsule = state.multiRole
        ? `<div class="relative shrink-0">
             <button data-action="workspace-menu" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-full border px-2.5 py-1.5 text-[12px] font-bold ${th.capsule}">
               ${icon('repeat-2', 'h-3.5 w-3.5')}
               <span>${meta.short}</span>
               ${icon('chevron-down', 'h-3 w-3 opacity-60')}
             </button>
             ${badge && state.role === 'user' ? `<span class="absolute -right-1.5 -top-1.5 grid h-[18px] min-w-[18px] place-items-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white">${badge.count}</span>` : ''}
           </div>`
        : `<span class="inline-flex shrink-0 items-center gap-1.5 whitespace-nowrap rounded-full border px-2.5 py-1.5 text-[12px] font-bold ${th.capsule}">${meta.short}</span>`;

      const avatarText = state.role === 'teacher' ? 'D' : 'A';
      const title = state.role === 'teacher' ? t('workspaceTitle') : meta.title;
      const subtitle = state.role === 'teacher' ? t('topSubtitle') : meta.subtitle;

      return `
        <div class="${th.topbar}">
          <div class="flex h-14 items-center justify-between px-3.5">
            <div class="flex min-w-0 items-center gap-2">
              ${capsule}
              <div class="ml-1 min-w-0">
                <div class="truncate text-[13px] font-bold leading-tight">${title}</div>
                <div class="truncate text-[12px] font-medium opacity-60">${subtitle}</div>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              ${state.role === 'teacher' ? `<button data-action="toggle-lang" class="inline-flex h-8 shrink-0 items-center gap-1 whitespace-nowrap rounded-full border border-slate-200 bg-white px-2 text-[12px] font-bold text-slate-600">${icon('globe', 'h-3.5 w-3.5')}<span>${state.lang === 'zh' ? 'EN' : '中'}</span></button>` : ''}
              <button data-action="notifications" class="relative grid h-8 w-8 place-items-center rounded-full ${th.iconBtn}">
                ${icon('bell', 'h-4 w-4')}
                <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-rose-500 ring-1 ${state.role === 'monitor' ? 'ring-indigo-950' : state.role === 'admin' ? 'ring-slate-900' : 'ring-white'}"></span>
              </button>
              <div class="grid h-8 w-8 place-items-center rounded-full ${th.avatar} text-[12px] font-bold">${avatarText}</div>
            </div>
          </div>
          ${state.role === 'user' ? renderProfileRow() : ''}
        </div>`;
    }

    function renderProfileRow() {
      const p = PROFILES[state.profileId];
      return `
        <div class="flex items-center justify-between border-t border-slate-100 px-3.5 py-2">
          <button data-action="profile-menu" class="flex items-center gap-2">
            <span class="grid h-7 w-7 place-items-center rounded-full bg-${p.color}-100 text-[12px] font-bold text-${p.color}-700">${p.initial}</span>
            <span class="text-left">
              <span class="block text-[12px] font-bold text-slate-900">${p.name}</span>
              <span class="block text-[12px] font-medium text-slate-400">${p.age}岁 · ${p.tag}</span>
            </span>
            ${icon('chevron-down', 'h-3.5 w-3.5 text-slate-400')}
          </button>
          <button data-action="toast" data-message="打开多孩档案管理" class="text-[12px] font-bold text-indigo-600">管理档案</button>
        </div>`;
    }

    function renderHome() {
      if (state.view === 'me') return renderMe();
      switch (state.role) {
        case 'user': return renderParentHome();
        case 'monitor': return renderMonitorHome();
        case 'teacher': return renderTeacherHome();
        case 'admin': return renderAdminHome();
        default: return '';
      }
    }

    function renderParentHome() {
      const p = PROFILES[state.profileId];
      const n = p.next;
      const entries = [
        { icon: 'calendar-plus', label: '约临时课', tone: 'indigo' },
        { icon: 'arrow-right-left', label: '课程转让', tone: 'sky' },
        { icon: 'message-square', label: '留言板', tone: 'emerald' },
        { icon: 'receipt', label: '购课与账单', tone: 'amber' },
        { icon: 'baby', label: '孩子档案', tone: 'rose' },
        { icon: 'users', label: '小班课大厅', tone: 'violet' }
      ];

      return `
        <div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-8">
          <div class="flex items-end justify-between">
            <div>
              <h1 class="text-[22px] font-bold tracking-tight text-slate-900">晚上好，Amy</h1>
              <p class="mt-0.5 text-[12px] font-medium text-slate-400">11月6日 周四 · 今天也要加油</p>
            </div>
          </div>

          <section class="overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm">
            <div class="h-1 bg-indigo-600"></div>
            <div class="p-4">
              <div class="flex items-center justify-between">
                <span class="inline-flex items-center gap-1.5 rounded-full bg-indigo-50 px-2.5 py-1 text-[12px] font-bold text-indigo-700">${icon('clock-3', 'h-3.5 w-3.5')}下一节课</span>
                <div class="text-right">
                  <div class="font-mono text-[17px] font-bold tracking-tight text-rose-600">${n.countdown}</div>
                  <div class="text-[12px] font-medium text-slate-400">距上课</div>
                </div>
              </div>
              <div class="mt-3 flex items-center gap-3">
                <div class="grid h-12 w-12 place-items-center rounded-2xl bg-indigo-100 text-[17px] font-bold text-indigo-700">${n.initial}</div>

    function renderQr() {
      const p = PROFILES[state.profileId];
      const size = 21;
      const isFinder = (x, y, ox, oy) => {
        const dx = x - ox, dy = y - oy;
        if (dx < 0 || dx > 6 || dy < 0 || dy > 6) return false;
        return dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
      };
      let cells = '';
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          let on;
          if (isFinder(x, y, 0, 0) || isFinder(x, y, size - 7, 0) || isFinder(x, y, 0, size - 7)) {
            on = true;
          } else if ((x < 8 && y < 8) || (x >= size - 8 && y < 8) || (x < 8 && y >= size - 8)) {
            on = false;
          } else {
            on = ((x * 7 + y * 11 + x * y) % 5) < 2;
          }
          cells += `<div class="aspect-square ${on ? 'bg-slate-900' : 'bg-white'}"></div>`;
        }
      }
      return `
        <div class="absolute inset-0 z-50 flex flex-col bg-white">
          <div class="flex h-14 shrink-0 items-center justify-between px-4">

          version: 'v1.0 · 生效日期待定',
          sections: [
            ['固定位四周一轮', '固定位一次购买 4 周课次，购买后不可直接取消，只可选择同师挪位或转让。'],
            ['12.5% 请假配额', '每期请假免费配额为总课次的 12.5%，向下取整；超出配额按规则扣费。'],
            ['3 小时阶梯熔断', '距开课不足 3 小时，所有请假、挪位与转让入口关闭，缺席照常按已结课扣费。'],
            ['代课差价多退少不补', '代课产生差价时，多收部分退还，少收部分不向家长补收。'],
            ['退费原路退回', '退款按原收款方退回，原购课单与资金持有人保持锁定。']
          ]
        },
        privacy: {
          title: '隐私保护政策',
          version: 'v1.0 · 生效日期待定',
          sections: [
            ['未成年人信息保护', '仅收集上课必需的年龄与昵称；非授课教师无法接触学生敏感信息。'],
            ['跨境数据传输', '海外外教端仅接收脱敏后的授课必要信息，敏感个人信息物理屏蔽。'],
            ['数据使用边界', '学生信息仅用于排课、授课、课后反馈与财务对账，不用于其他目的。']
          ]
        },
        about: {
          title: '关于我们',
          version: 'Dream v1.0.0',
          sections: [
            ['品牌介绍', 'Dream 是为少儿英语小班与 1v1 教学打造的教务排班与分账管理系统。'],
            ['官方支持', '如需帮助，请联系你的班长或平台客服；工作日 09:00 - 21:00。'],
            ['版权声明', '© 2024-2026 Topee (https://topee.top). All rights reserved.']
          ]
        }
      };
      const doc = docs[state.legalDoc] || docs.terms;
      return `
        <div class="absolute inset-0 z-50 flex flex-col bg-slate-50">
          <div class="flex h-14 shrink-0 items-center justify-between border-b border-slate-200 bg-white px-4">
            <button data-action="close-sheet" class="grid h-8 w-8 place-items-center rounded-full bg-slate-100 text-slate-600">${icon('chevron-left', 'h-4 w-4')}</button>
            <span class="text-[14px] font-bold text-slate-900">${doc.title}</span>
            <span class="w-8"></span>
          </div>
          <div class="flex-1 overflow-y-auto px-4 py-4">
            <div class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
              <div class="text-[12px] font-bold text-slate-400">${doc.version}</div>
              <h1 class="mt-1 text-[20px] font-bold tracking-tight text-slate-900">${doc.title}</h1>
              <div class="mt-4 space-y-3">
                ${doc.sections.map(([title, body], i) => `
                  <div class="flex gap-2.5">
                    <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full bg-slate-900 text-[12px] font-bold text-white">${i + 1}</span>
                    <div>
                      <h3 class="text-[12px] font-bold text-slate-900">${title}</h3>
                      <p class="mt-0.5 text-[12px] leading-relaxed text-slate-500">${body}</p>
                    </div>
                  </div>`).join('')}
              </div>
              <div class="mt-4 rounded-xl border border-amber-200 bg-amber-50 p-3 text-[12px] leading-relaxed text-amber-800">法律文本待定；本期仅提供入口与占位内容，不记录用户同意版本。</div>
            </div>
          </div>
        </div>`;
    }

    function applyTabletCols() {
      document.querySelectorAll('[data-tablet-cols]').forEach(el => {
        const mobile = el.dataset.mobileCols || '1';
        const cols = state.device === 'tablet' ? el.dataset.tabletCols : mobile;
        el.classList.remove('grid-cols-1', 'grid-cols-2', 'grid-cols-3', 'grid-cols-4', 'grid-cols-6');
        el.classList.add(`grid-cols-${cols}`);
      });
    }

    function syncConsole() {
      document.querySelectorAll('[data-role-btn]').forEach(btn => {
        const active = btn.dataset.role === state.role;
        btn.className = `console-role inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 font-semibold ${active ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-200'}`;
      });
      document.querySelectorAll('[data-device-btn]').forEach(btn => {
        const active = btn.dataset.device === state.device;
        btn.className = `inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 font-semibold ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-slate-200'}`;
      });
      const multiToggle = document.getElementById('multiToggle');
      const multiLabel = document.getElementById('multiLabel');
      if (multiToggle) {
        multiToggle.className = `relative h-5 w-9 rounded-full transition ${state.multiRole ? 'bg-indigo-600' : 'bg-slate-300'}`;
        multiToggle.firstElementChild.className = `absolute top-0.5 h-4 w-4 rounded-full bg-white shadow-sm transition-all ${state.multiRole ? 'left-[18px]' : 'left-0.5'}`;
      }
      if (multiLabel) {
        multiLabel.textContent = state.multiRole ? '开' : '关';
        multiLabel.className = `text-[12px] font-semibold ${state.multiRole ? 'text-indigo-600' : 'text-slate-400'}`;
      }
    }

    function render() {
      const meta = ROLE_META[state.role];
      const frame = document.getElementById('frame');
      frame.className = `relative flex flex-col overflow-hidden rounded-3xl shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'} ${meta.frame}`;
      document.getElementById('topbar').innerHTML = renderTopbar();
      document.getElementById('content').innerHTML = renderHome();
      document.getElementById('bottomnav').innerHTML = renderNav();
      document.getElementById('overlay').innerHTML = renderOverlay();
      applyTabletCols();
      syncConsole();
      lucide.createIcons();
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.classList.add('hidden'), 2200);
    }

    function setRole(role) {
      state.role = role;
      state.view = 'home';
      state.sheet = null;
      render();
      const meta = ROLE_META[role];
      showToast(`已切换到${meta.short}${meta.todo ? ` · ${meta.todo} 项待办` : ''}`);
    }

    document.addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'set-role') {
        setRole(el.dataset.role);
        return;
      }
      if (action === 'set-device') {
        state.device = el.dataset.device;
        render();
        return;
      }
      if (action === 'toggle-multi') {
        state.multiRole = !state.multiRole;
        state.sheet = null;
        render();
        showToast(state.multiRole ? '多角色模式：显示工作台切换器' : '单角色模式：隐藏工作台切换器');
        return;
      }
      if (action === 'workspace-menu') {
        state.sheet = 'workspace';
        render();
        return;
      }
      if (action === 'profile-menu') {
        state.sheet = 'profile';
        render();
        return;
      }
      if (action === 'set-profile') {
        state.profileId = el.dataset.profile;
        state.sheet = null;
        render();
        showToast(`已切换到 ${PROFILES[state.profileId].name}`);
        return;
      }
      if (action === 'notifications') {
        state.sheet = 'notifications';
        render();
        return;
      }
      if (action === 'open-qr') {
        state.sheet = 'qr';
        render();
        return;
      }
      if (action === 'close-sheet') {
        state.sheet = null;
        render();
        return;
      }
      if (action === 'open-home') {
        state.view = 'home';
        state.sheet = null;
        render();
        return;
      }
      if (action === 'open-me') {
        state.view = 'me';
        state.sheet = null;
        render();
        return;
      }
      if (action === 'open-legal') {
        state.sheet = 'legal';
        state.legalDoc = el.dataset.doc || (el.textContent.includes('隐私') ? 'privacy' : el.textContent.includes('关于') ? 'about' : 'terms');
        render();
        return;
      }
      if (action === 'toggle-lang') {
        state.lang = state.lang === 'zh' ? 'en' : 'zh';
        render();
        showToast(state.lang === 'zh' ? '已切换为中文' : 'Language: English');
        return;
      }
      if (action === 'classin') {
        showToast('正在唤醒 ClassIn…');
        return;
      }
      if (action === 'toast') {
        showToast(el.dataset.message || '原型模拟操作');
      }
    });

    render();
  </script>
</body>
</html>

        ? `<button type="button" data-action="qr" data-teacher="${esc(card.footerTeacher || '')}" data-account="${esc(card.footerAccount || '')}" class="min-w-0 truncate text-left text-[12px] font-medium leading-4 text-slate-600 underline decoration-slate-300 underline-offset-2 hover:text-indigo-600">${esc(card.footer)}</button>`
        : `<span class="min-w-0 truncate text-[12px] font-medium leading-4 text-slate-600">${esc(card.footer)}</span>`;
      const action = card.href
        ? `<a href="${card.href}" target="_blank" rel="noopener" class="shrink-0 text-[12px] font-bold leading-4 text-indigo-600 transition hover:text-indigo-700">${esc(card.action)} ${card.arrow || '→'}</a>`
        : `<button type="button" data-action="${card.actionAction || 'toast'}" ${card.actionAction === 'toast' ? `data-message="${esc(card.actionMessage || card.action)}"` : ''} class="shrink-0 text-[12px] font-bold leading-4 text-indigo-600 transition hover:text-indigo-700">${esc(card.action)} ${card.arrow || '→'}</button>`;
      return `<article class="flex h-[120px] flex-col rounded-2xl border ${surface} px-3.5 py-3">
        <div class="flex items-start gap-3">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-slate-200 bg-white ${card.iconClass}">${icon(card.icon, 'h-4 w-4')}</span>
          <div class="min-w-0 flex-1">
            <div class="flex h-4 items-center gap-1.5">
              <span class="h-[7px] w-[7px] shrink-0 rounded-full ${card.dot}"></span>
              <span class="shrink-0 text-[12px] font-bold leading-4 text-slate-700">${card.type}</span>
              <span class="inline-flex h-4 shrink-0 items-center rounded-full px-1.5 text-[12px] font-semibold leading-none ${chip}">${card.chip}</span>
              ${metric}
            </div>
            <h3 class="mt-1.5 whitespace-nowrap text-[14px] font-bold leading-5 text-slate-900">${card.title}</h3>
            <p class="mt-1.5 whitespace-nowrap text-[12px] font-medium leading-[18px] text-slate-600">${card.sub}</p>
          </div>
        </div>
        <div class="mt-1 flex h-6 shrink-0 items-center justify-between gap-2">
          ${footer}
          ${action}
        </div>
      </article>`;
    }

    function feedCardsFor(key) {
      const d = feedDataFor(key);
      const family = key === 'all';
      const childName = family ? '' : d.childName;
      const cards = [];
      if (d.notification) {
        cards.push({
          surface: 'rose', icon: 'bell-ring', iconClass: 'text-rose-600', dot: 'bg-rose-500',
          type: '通知', chip: '课程变动', chipTone: 'rose', right: '2 小时前',
          rightClass: 'text-[12px] font-semibold leading-4 text-slate-600',
          title: d.notification.title,
          sub: `${family ? 'Alice · ' : ''}David 老师临时请假`,
          footer: '已同步至通知中心', action: '查看通知', actionAction: 'notifications'
        });
      }
      if (d.course) {
        const isToday = d.course.date.includes('今天');
        const shortDay = isToday ? '' : d.course.date.replace(/\s*\([^)]*\)\s*/, ' ').trim();
        const merged = d.course.merged > 1 ? ` · 连上 ${d.course.merged} 节` : '';
        cards.push({
          surface: 'neutral', icon: 'calendar-clock', iconClass: 'text-indigo-600', dot: 'bg-indigo-500',
          type: '课程', chip: family ? `今日 ${FAMILY_FEED.all.todayLessons} 节` : (d.course.type === 'fixed' ? '固定位' : '临时课'), chipTone: 'neutral',
          right: d.course.countdown || '待上课', rightClass: 'text-[12px] font-bold leading-4 text-amber-700',
          title: `下一节 · ${family ? 'Alice' : childName} 少儿英语 1v1`,
          sub: `${shortDay ? shortDay + ' ' : ''}${d.course.time} · ${d.course.teacher}${merged}`,
          footer: `ClassIn ${d.course.account}`, footerAction: 'qr', footerTeacher: d.course.teacher, footerAccount: d.course.account,
          action: '进入 ClassIn', actionAction: 'toast', actionMessage: '正在进入 ClassIn 教室…'
        });
      }
      if (d.reminder) {
        cards.push({
          surface: 'amber', icon: 'alarm-clock', iconClass: 'text-amber-700', dot: 'bg-amber-500',
          type: '提醒', chip: '待续费', chipTone: 'amber',
          metric: { prefix: '剩余', value: d.reminder.remaining, unit: '次', prefixClass: 'text-amber-700', valueClass: 'text-amber-800', unitClass: 'text-amber-700' },
          title: `${family ? 'Bob' : childName} 的课时即将用完`,
          sub: family ? `另有 ${state.manyKids ? '3 个孩子' : '1 个孩子'}课时不足 · 固定位保留至 11-14` : '建议续费 10 次 · 固定位保留至 11-14',
          footer: '班主任 Leo · 已发送续费提醒', action: '去续费', href: 'm2a_course_orders.html?role=parent&page=list'
        });
      }
      if (d.activity) {
        cards.push({
          surface: 'neutral', icon: 'history', iconClass: 'text-slate-600', dot: 'bg-slate-500',
          type: '动态', chip: '近 24 小时', chipTone: 'neutral',
          metric: { value: family && state.manyKids ? 7 : d.activity.count, unit: '条' },
          title: d.activity.latest,
          sub: family ? `Alice · ${d.activity.time} · 另有 ${state.manyKids ? '5 个孩子有动态' : '1 个孩子有动态'}` : `${childName} · ${d.activity.time}`,
          footer: family ? '家庭动态 · 全部孩子' : `家庭动态 · ${childName}`,
          action: '查看更多', actionAction: 'activity-feed'
        });
      }
      if (d.message) {
        cards.push({
          surface: 'neutral', icon: 'message-square', iconClass: 'text-purple-600', dot: 'bg-purple-500',
          type: '留言', chip: '近 7 天', chipTone: 'neutral',
          metric: { value: family && state.manyKids ? 9 : d.message.count, unit: '条' },
          title: `${d.message.teacher} 老师在 Unit 4 留了新留言`,
          sub: family ? `Bob · ${d.message.time} · 另有 ${state.manyKids ? '5 个孩子 8 条' : '1 个孩子 2 条'}` : `${childName} · ${d.message.time} · 公开留言`,
          footer: '留言板 · 公开可见', action: '查看留言', href: 'm1d_profile_messages.html?role=parent'
        });
      }
      if (d.asset) {
        cards.push({
          surface: 'neutral', icon: 'wallet', iconClass: 'text-emerald-600', dot: 'bg-emerald-500',
          type: '资产', chip: family ? '家庭' : '个人', chipTone: 'neutral',
          metric: { value: family && state.manyKids ? 24 : d.asset.fixed + d.asset.temp, unit: '次' },
          title: family ? '家庭课时资产' : `${childName} 课时资产`,
          sub: family ? (state.manyKids ? '6 个孩子 · 固定位 16 · 临时课 8' : '2 个孩子 · 固定位 6 · 临时课 3') : `固定位 ${d.asset.fixed} · 临时课 ${d.asset.temp}`,
          footer: family ? '最近消课 11-11 · Alice 1 次' : `最近消课 11-11 · ${childName} 1 次`,
          action: '查看明细', href: 'm2a_course_orders.html?role=parent&page=list'
        });
      }
      if (d.courseware) {
        const first = d.courseware.latest.split(' · ')[0];
        cards.push({
          surface: 'neutral', icon: 'book-open', iconClass: 'text-purple-600', dot: 'bg-purple-500',
          type: '课件', chip: `在学 ${family && state.manyKids ? 8 : d.courseware.count} 门`, chipTone: 'neutral',
          metric: { value: family && state.manyKids ? 8 : d.courseware.count, unit: '门' },
          title: family ? '家庭在学课件' : (d.courseware.count > 1 ? `${first} 等 ${d.courseware.count} 门` : first),
          sub: family ? `${state.manyKids ? 6 : 2} 个孩子 · 最近更新 Wonders G1` : `${childName} · 最近更新 ${first}`,
          footer: `最近更新 · ${first}`,
          action: '查看课件', arrow: '↗', href: 'm1e_courseware.html?role=parent'
        });
      }
      return cards;
    }

    function renderScopeControl() {
      if (state.manyKids) {
        return `<button data-action="feed-child-drawer" class="flex h-7 shrink-0 items-center gap-1 rounded-md border border-slate-200 bg-white px-2.5 text-[12px] font-bold text-slate-900 transition hover:bg-slate-50 active:scale-95">

        </button>`;

      if (FAMILY_FEED.children.length === 1) {
        const c = FAMILY_FEED.children[0];
        return `<span class="text-[12px] font-semibold text-slate-600">${esc(c.name)} · ${esc(c.nick)}</span>`;
      }
      const tabs = [{ key: 'all', label: '全部' }, ...FAMILY_FEED.children.slice(0, 2).map((c) => ({ key: c.key, label: c.name }))];

    function renderFamilyFeed() {
      const key = FAMILY_FEED.children.some((c) => c.key === state.feedChild) ? state.feedChild : 'all';
      return `<section class="space-y-1.5">
        <div class="flex items-center gap-2 pl-1">
          <h2 class="shrink-0 text-[16px] font-bold text-slate-900">家庭信息流</h2>
          <div class="ml-auto min-w-0">${renderScopeControl()}</div>
        </div>
        ${feedCardsFor(key).map(feedCardShell).join('')}
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 首页
     * ------------------------------------------------------------------ */
    function renderHome() {
      if (state.role === 'teacher') return renderTeacherHome();
      const r = roleMeta();
      const capsule = CAPSULES[state.role];
      return `
        <div class="mx-auto w-full max-w-[640px] space-y-2 px-4 py-3 pb-10">
          ${greetingBlock()}
          ${renderQuick(r)}
          ${capsule ? renderCapsule(capsule) : ''}
          ${renderFamilyFeed()}

    function teacherShown(kind) {
      const total = kind === 'upcoming' ? TEACHER_UPCOMING.length : TEACHER_COMPLETED.length;
      const loads = kind === 'upcoming' ? state.teacherUpcomingLoads : state.teacherCompletedLoads;
      return Math.min(total, 6 + loads * 6);
    }

    function renderLoadMore(kind, shown, total) {
      const loads = kind === 'upcoming' ? state.teacherUpcomingLoads : state.teacherCompletedLoads;
      if (loads >= 5 || shown >= total) {
        return `<a href="m3a_calendar_grid.html?role=teacher&teacher=david&week=0" target="_blank" rel="noopener" class="mt-2 flex h-10 w-full items-center justify-center gap-1.5 rounded-xl border border-slate-200 bg-white text-[14px] font-bold text-indigo-600 shadow-sm">${icon('calendar-days', 'h-4 w-4')}${t('打开完整课表', 'Open full schedule')} ↗</a>`;
      }
      const label = kind === 'upcoming' ? t('加载更多待上课', 'Load more') : t('加载更多刚结束', 'Load more');
      const remain = total - shown;
      return `<button data-action="load-more" data-list="${kind}" class="mt-2 flex h-10 w-full items-center justify-center gap-1.5 rounded-xl border border-slate-200 bg-white text-[14px] font-bold text-slate-600 shadow-sm transition hover:bg-slate-50">${label} (${t(`还有 ${remain} 条`, `${remain} more`)}) ▾</button>`;
    }

    function teacherUpcomingCard(item) {
      const meta = TYPE_META[item.type] || TYPE_META.fixed;
      const mergedText = item.merged > 1 ? (isTeacherEn() ? ` · ${item.merged} lessons back-to-back` : ` · 连续 ${item.merged} 节`) : '';
      return `<article class="rounded-xl border border-amber-200/70 bg-amber-50/80 p-2.5 shadow-sm">
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="text-[14px] font-bold text-amber-950">${esc(item.student)}</span>
          <span class="rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${meta.chip}">${typeLabel(item.type)}</span>
          ${item.sub ? `<span class="rounded-full border border-purple-200 bg-purple-100 px-1.5 py-0.5 text-[12px] font-bold text-purple-700">${t('🟣 代课', 'Substitute')}</span>` : ''}
        </div>
        <div class="mt-0.5 text-[12px] font-medium text-amber-700">${esc(item.when)}${mergedText}</div>
        ${item.countdown ? `<div class="text-[12px] font-bold text-amber-800">${esc(item.countdown)}</div>` : ''}
        <div class="mt-2 flex gap-1.5">
          <button data-action="toast" data-message="${esc(t(`正在打开 ${item.student} 的留言板`, `Opening ${item.student}'s lesson notes`))}" class="flex h-8 flex-1 items-center justify-center gap-1 rounded-lg bg-amber-600 text-[12px] font-bold text-white transition hover:bg-amber-700">${icon('message-square', 'h-3.5 w-3.5')}${t('留言板', 'Messages')}</button>
          <button data-action="toast" data-message="${esc(t('正在进入 ClassIn 教室…', 'Entering ClassIn classroom…'))}" class="flex h-8 flex-1 items-center justify-center gap-1 rounded-lg border border-slate-200 bg-slate-50 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-100">${icon('door-open', 'h-3.5 w-3.5')}${t('进教室', 'Enter classroom')}</button>
        </div>
      </article>`;
    }

    function teacherCompletedCard(item) {
      const meta = TYPE_META[item.type] || TYPE_META.fixed;
      const done = item.feedback;
      const mergedText = item.merged > 1 ? (isTeacherEn() ? ` · ${item.merged} lessons back-to-back` : ` · 连续 ${item.merged} 节`) : '';
      const typeChip = done
        ? `<span class="text-[12px] font-semibold text-slate-500">${typeLabel(item.type)}</span>`
        : `<span class="rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${meta.chip}">${typeLabel(item.type)}</span>`;
      return `<article class="rounded-xl border p-2.5 shadow-sm ${done ? 'border-slate-200 bg-slate-50' : 'border-amber-200/70 bg-amber-50/80'}">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="text-[14px] font-bold ${done ? 'text-slate-900' : 'text-amber-950'}">${esc(item.student)}</span>
              ${typeChip}
              <span class="rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${done ? 'border-slate-200 bg-white text-slate-500' : 'border-amber-200 bg-amber-100 text-amber-800'}">${t('已完课', 'Completed')}</span>
              ${item.sub ? `<span class="rounded-full border border-purple-200 bg-purple-100 px-1.5 py-0.5 text-[12px] font-bold text-purple-700">${t('🟣 代课', 'Substitute')}</span>` : ''}
            </div>
            <div class="mt-0.5 text-[12px] font-medium ${done ? 'text-slate-500' : 'text-amber-700'}">${esc(item.when)}${mergedText}</div>
            ${done && item.note ? `<p class="mt-0.5 truncate text-[12px] text-slate-500">${esc(item.note)}</p>` : ''}
          </div>
          ${done
            ? `<button data-action="toast" data-message="${esc(t('正在打开留言板', 'Opening messages'))}" class="flex h-8 shrink-0 items-center justify-center gap-1 rounded-lg border border-slate-200 bg-slate-100 px-2 text-[12px] font-semibold text-slate-600">${icon('message-square', 'h-3.5 w-3.5')}${t('留言板', 'Messages')}</button>`
            : `<button data-action="toast" data-message="${esc(t(`正在打开 ${item.student} 的反馈`, `Opening feedback for ${item.student}`))}" class="flex h-8 shrink-0 items-center justify-center gap-1 rounded-lg bg-amber-600 px-2 text-[12px] font-bold text-white transition hover:bg-amber-700">${icon('pen-line', 'h-3.5 w-3.5')}${t('方便写留言', 'Write note')}</button>`}

    function renderTeacherHome() {
      const upShown = teacherShown('upcoming');
      const compShown = teacherShown('completed');
      return `
        <div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
          ${greetingBlock()}
          ${renderQuick(roleMeta())}
          ${teacherStatsCapsule()}
          <section>
            <div class="mb-1.5 flex items-center justify-between px-1">
              <h2 class="text-[16px] font-bold text-slate-900">${t('待上课（近 7 天）', 'Upcoming (7 days)')}</h2>

              <span class="text-[12px] font-medium text-slate-400">${compShown}/${TEACHER_COMPLETED.length}${t(' 条', '')}</span>
            </div>
            <div class="space-y-2">${TEACHER_COMPLETED.slice(0, compShown).map(teacherCompletedCard).join('')}</div>
            ${renderLoadMore('completed', compShown, TEACHER_COMPLETED.length)}
          </section>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 学生课表 / 教师课表（7 色周课表）
     * ------------------------------------------------------------------ */
    function weekStart(week) {
      return new Date(2026, 10, 9 + week * 7);
    }
    function weekTitle(week) {
      return `2026年第${46 + week}周`;
    }
    function weekRange(week) {
      const start = weekStart(week);
      const end = new Date(start);
      end.setDate(end.getDate() + 6);
      return `${pad2(start.getMonth() + 1)}.${pad2(start.getDate())} - ${pad2(end.getMonth() + 1)}.${pad2(end.getDate())}`;
    }
    function dayInfo(week, day) {
      const d = weekStart(week);
      d.setDate(d.getDate() + day);
      return {
        date: `${pad2(d.getMonth() + 1)}.${pad2(d.getDate())}`,
        full: `${d.getMonth() + 1}月${d.getDate()}日`,
        weekday: SCHEDULE_DAYS[day]
      };
    }
    function getWeekLessons(child, week) {
      return (WEEK_LESSONS[child] && WEEK_LESSONS[child][String(week)]) || [];
    }
    function lessonSlot(l) {
      return (l.hour - 6) * 2 + (l.minute >= 30 ? 1 : 0);
    }
    function fmtHM(hour, minute) {
      return `${pad2(hour)}:${pad2(minute)}`;
    }
    function lessonEnd(l) {
      const total = l.hour * 60 + l.minute + (l.duration || 25);
      return fmtHM(Math.floor(total / 60), total % 60);
    }

    function renderWeekNav(count) {
      return `
        <div class="flex shrink-0 items-center justify-between gap-1 rounded-2xl border border-slate-200/80 bg-white px-2 py-1.5 shadow-sm">
          <button data-action="schedule-week" data-week="-1" class="flex h-8 shrink-0 items-center rounded-lg px-2 text-[12px] font-bold text-slate-600 transition hover:bg-slate-50">‹ 上周</button>
          <div class="min-w-0 text-center">
            <div class="truncate text-[12px] font-bold text-slate-900">${weekTitle(state.scheduleWeek)} · ${count} 节</div>
            <div class="truncate font-mono text-[12px] text-slate-500">${weekRange(state.scheduleWeek)}</div>
          </div>
          <button data-action="schedule-week" data-week="1" class="flex h-8 shrink-0 items-center rounded-lg px-2 text-[12px] font-bold text-slate-600 transition hover:bg-slate-50">下周 ›</button>
        </div>
        ${state.scheduleWeek !== 0 ? `<div class="flex shrink-0 justify-end"><button data-action="schedule-week" data-week="0" class="rounded-full border border-indigo-200 bg-indigo-50 px-2.5 py-1 text-[12px] font-bold text-indigo-700">回到本周</button></div>` : ''}`;
    }

    function renderChildSwitcher() {
      return `<div class="sticky top-0 z-20 flex shrink-0 gap-1.5 rounded-2xl border border-slate-200/80 bg-white p-1 shadow-sm">
        ${Object.values(CHILDREN).map((c) => {

            <span class="shrink-0 text-[14px]">${c.emoji}</span>

    const PARENT_LEGEND = [
      ['固定位', 'bg-amber-400'],
      ['临时课', 'bg-yellow-400'],
      ['被代课', 'bg-blue-500'],
      ['停课待补', 'bg-slate-300'],

    function renderParentLegend() {

        ${PARENT_LEGEND.map(([label, dot]) => `<span class="inline-flex items-center gap-1 text-[12px] font-medium text-slate-500"><span class="h-1.5 w-1.5 shrink-0 rounded-full ${dot}"></span>${label}</span>`).join('')}

    function lessonCell(l) {
      const meta = LESSON_TYPES[l.type] || LESSON_TYPES.fixed;

    function teacherGridForWeek(week) {
      const grid = TEACHER_GRID.map((row) => ({ ...row, cells: row.cells.map((c) => ({ ...c })) }));
      const set = (time, day, cell) => {
        const row = grid.find((r) => r.time === time);
        if (row) row.cells[day] = { ...cell };
      };
      if (week === -1) {
        set('17:30', 0, { t: '约', c: 'green' });
        set('18:30', 5, { t: '约', c: 'green' });
      }
      if (week === 1) {
        set('19:00', 1, { t: 'BobZ', c: 'amber' });
        set('18:00', 3, { t: 'Emma', c: 'purple' });
        set('19:00', 6, { t: 'Alic', c: 'amber' });
      }
      return grid;
    }

    function countTeacherLessons(grid) {
      return grid.reduce((sum, row) => sum + row.cells.filter((c) => ['amber', 'yellow', 'purple', 'blue'].includes(c.c)).length, 0);

    function renderOverlay() {
      const root = $('overlayRoot');
      if (!state.overlay) { root.innerHTML = ''; return; }
      if (state.overlay === 'identity') root.innerHTML = identitySheet();
      else if (state.overlay === 'notifications') root.innerHTML = notificationsSheet();
      else if (state.overlay === 'legal') root.innerHTML = legalSheet();
      else if (state.overlay === 'qr') root.innerHTML = qrSheet();
      else if (state.overlay === 'lesson') root.innerHTML = lessonSheet();
      else if (state.overlay === 'children') root.innerHTML = childrenSheet();
      else if (state.overlay === 'activity') root.innerHTML = activitySheet();
      else if (state.overlay === 'myops') root.innerHTML = myOpsSheet();
      else root.innerHTML = '';

    /* ------------------------------------------------------------------
     * 渲染与交互
     * ------------------------------------------------------------------ */
    function renderContent() {
      if (state.opsSchedule && (state.tab === 'ops' || state.tab === 'settings')) return renderOpsSchedule();
      if (state.tab === 'home') return renderHome();
      if (state.tab === 'schedule') return renderScheduleEmbed();
      if (state.tab === 'ops') return (state.role === 'monitor' || state.role === 'admin') ? renderOps() : renderPlaceholder();
      if (state.tab === 'me') return renderMe();
      if (state.tab === 'settings') return state.role === 'admin' ? renderAdminSettings() : renderPlaceholder();
      if (state.tab === 'hall') return renderHall();
      return renderPlaceholder();
    }

    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;
      const contentEl = $('content');
      const top = contentEl.scrollTop;
      $('banner').innerHTML = renderBanner();
      contentEl.innerHTML = renderContent();
      $('bottomnav').innerHTML = renderNav();
      renderOverlay();
      syncConsole();
      contentEl.scrollTop = top;
      if (window.lucide) window.lucide.createIcons();
      initScheduleScroll();
    }

    function initScheduleScroll() {
      const scroller = $('scheduleGridScroll');
      if (!scroller) return;
      requestAnimationFrame(() => {
        if (!document.body.contains(scroller)) return;
        if (state.scheduleScroll == null) {
          const target = scroller.querySelector('[data-grid-time="16:30"]');
          if (target) {
            const offset = target.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop;
            scroller.scrollTop = Math.max(0, offset - 36);
          }
        } else {
          scroller.scrollTop = state.scheduleScroll;
        }
        state.scheduleScroll = scroller.scrollTop;
        scroller.addEventListener('scroll', () => { state.scheduleScroll = scroller.scrollTop; }, { passive: true });
      });
    }

    function syncConsole() {
      document.querySelectorAll('#console .role-btn').forEach((btn) => {
        const on = btn.dataset.role === state.role;
        btn.className = `role-btn rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-200'}`;
      });
      document.querySelectorAll('#console .device-btn').forEach((btn) => {
        const on = btn.dataset.device === state.device;
        btn.className = `device-btn rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-slate-200'}`;
      });
      document.querySelectorAll('#console .lang-btn').forEach((btn) => {
        const on = btn.dataset.consoleLang === state.lang;
        btn.className = `lang-btn rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-slate-200'}`;
      });
      const manyBtn = document.getElementById('btnManyKids');
      if (manyBtn) manyBtn.className = `rounded-lg border px-2.5 py-1.5 font-semibold transition ${state.manyKids ? 'border-indigo-200 bg-indigo-50 text-indigo-700' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`;
    }

    function filterOps(value) {
      const query = String(value || '').trim().toLowerCase();
      document.querySelectorAll('[data-ops-search]').forEach((el) => {
        const hit = !query || el.dataset.opsSearch.toLowerCase().includes(query);
        el.classList.toggle('hidden', !hit);
      });
    }

    function setRole(role) {
      if (!ROLES[role]) return;
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.tab = 'home';
      state.overlay = null;
      state.opsTab = 'teachers';
      state.opsSchedule = null;
      state.scheduleChild = 'alice'; state.scheduleWeek = 0; state.scheduleScroll = null;
      state.feedChild = 'all'; state.manyKids = false;
      state.selectedLesson = null; state.qrTeacher = null; state.qrReturn = null;
      state.teacherUpcomingLoads = 0; state.teacherCompletedLoads = 0;
      state.lang = role === 'teacher' ? 'en' : 'zh';
      renderAll();
      $('content').scrollTop = 0;
      toast(`已切换到${ROLES[role].label}`);
    }

    function navTo(tab) {
      if (!roleMeta().nav.some((n) => n.id === tab) && tab !== 'home') return;
      const enteringSchedule = tab === 'schedule' && state.tab !== 'schedule';
      state.tab = tab;
      state.overlay = null;
      state.opsSchedule = null;
      state.selectedLesson = null;
      state.qrTeacher = null;
      state.qrReturn = null;
      if (enteringSchedule) {
        state.scheduleChild = 'alice';
        state.scheduleWeek = 0;
        state.scheduleScroll = null;
      }
      renderAll();
      $('content').scrollTop = 0;
    }

    function setLang(lang) {
      state.lang = lang;
      renderAll();
      if (state.role === 'teacher') {
        toast(lang === 'zh' ? '已切换为中文' : 'Language: English');
      } else {
        toast(lang === 'zh' ? '已切换为中文偏好' : 'Language preference saved: English');
      }
    }

    document.getElementById('console').addEventListener('click', (event) => {
      const roleBtn = event.target.closest('[data-role]');
      if (roleBtn) return setRole(roleBtn.dataset.role);
      const deviceBtn = event.target.closest('[data-device]');
      if (deviceBtn) { state.device = deviceBtn.dataset.device; renderAll(); return; }
      const langBtn = event.target.closest('[data-console-lang]');
      if (langBtn) return setLang(langBtn.dataset.consoleLang);
      if (event.target.closest('#btnResetDemo')) return resetDemo();
      if (event.target.closest('#btnManyKids')) {
        state.manyKids = !state.manyKids;
        state.feedChild = 'all';
        renderAll();
        return;
      }
    });

    $('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'quick-tab') {
        if (el.dataset.opsTab) state.opsTab = el.dataset.opsTab;
        return navTo(el.dataset.tab);
      }
      if (action === 'ops-jump') {
        state.opsTab = el.dataset.opsTab || 'teachers';
        return navTo('ops');
      }
      if (action === 'ops-schedule') {
        openOpsSchedule(el.dataset.kind, el.dataset.name);
        renderAll();
        $('content').scrollTop = 0;
        return;
      }
      if (action === 'ops-schedule-back') {
        state.opsSchedule = null;
        renderAll();
        $('content').scrollTop = 0;
        return;
      }
      if (action === 'load-more') {
        if (el.dataset.list === 'upcoming') state.teacherUpcomingLoads = Math.min(5, state.teacherUpcomingLoads + 1);
        else state.teacherCompletedLoads = Math.min(5, state.teacherCompletedLoads + 1);
        return renderAll();
      }
      if (action === 'toast') return toast(el.dataset.message || '操作已完成');
      if (action === 'feed-child') {
        state.feedChild = el.dataset.child || 'all';
        state.overlay = null;
        renderAll();
        return;
      }
      if (action === 'feed-child-drawer') { state.overlay = 'children'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return; }
      if (action === 'activity-feed') { state.overlay = 'activity'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return; }
      if (action === 'my-ops') { state.overlay = 'myops'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return; }
      if (action === 'identity') { state.overlay = 'identity'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return; }
      if (action === 'notifications') { state.overlay = 'notifications'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return; }
      if (action === 'legal') { state.legalDoc = el.dataset.message || 'terms'; state.overlay = 'legal'; renderOverlay(); if (window.lucide) window.lucide.createIcons(); return; }
      if (action === 'close-overlay') {
        if (state.overlay === 'qr' && state.qrReturn === 'lesson') {
          state.overlay = 'lesson'; state.qrReturn = null;
        } else {
          state.overlay = null; state.qrReturn = null; state.selectedLesson = null;
        }
        renderOverlay();
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      if (action === 'qr') {
        state.qrReturn = state.overlay === 'lesson' ? 'lesson' : null;
        state.qrTeacher = el.dataset.teacher ? { name: el.dataset.teacher, account: el.dataset.account || '' } : null;
        state.overlay = 'qr';
        renderOverlay();
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      if (action === 'set-role') return setRole(el.dataset.role);
      if (action === 'schedule-child') {
        const grid = $('scheduleGridScroll');
        if (grid) state.scheduleScroll = grid.scrollTop;
        state.scheduleChild = el.dataset.child || 'alice';
        state.overlay = null; state.selectedLesson = null;
        renderAll();
        return;
      }
      if (action === 'schedule-week') {
        const grid = $('scheduleGridScroll');
        if (grid) state.scheduleScroll = grid.scrollTop;
        state.scheduleWeek = Math.max(-1, Math.min(1, Number(el.dataset.week) || 0));
        state.overlay = null; state.selectedLesson = null;
        renderAll();
        return;
      }
      if (action === 'open-lesson') {
        state.selectedLesson = { child: state.scheduleChild, week: state.scheduleWeek, id: el.dataset.lesson };
        state.overlay = 'lesson';
        renderOverlay();
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      if (action === 'lesson-move') return toast('已进入挪位，正在查询该老师其他空闲时段');
      if (action === 'lesson-leave') return toast('已提交请假申请，将扣减 12.5% 配额');
      if (action === 'lesson-transfer') return toast('已发起课程转让，请选择接收人');
      if (action === 'lesson-locked') return toast('老师已在做授课准备，暂无法变更');
      if (action === 'ops-tab') { state.opsTab = el.dataset.tab || 'teachers'; renderAll(); return; }
      if (action === 'set-lang') return setLang(el.dataset.lang);
      if (action === 'copy-id') {
        const text = el.dataset.account || (state.qrTeacher && state.qrTeacher.account) || '982-123-456';
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(`已复制: ${text}`)).catch(() => toast(text));
        else toast(text);
      }
    });

    const opsViewParam = params.get('opsView');
    if (opsViewParam && (state.tab === 'ops' || state.tab === 'settings')) {
      const defaults = { student: 'AliceZ12', teacher: 'David Miller', group: 'KET 冲刺 A 班' };
      openOpsSchedule(opsViewParam, params.get('opsName') || defaults[opsViewParam]);
    }

    renderAll();
  </script>
</body>
</html>

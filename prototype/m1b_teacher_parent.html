  <script>
    const TODAY = '2026-11-10';
    const SAMPLE_VIDEO = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';
    const PARENT_CHILDREN = [{ name: 'AliceZ12', age: 12 }, { name: 'BobZ10', age: 10 }];

    function demoPhoto(label, from, to, w = 800, h = 600) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${from}"/><stop offset="1" stop-color="${to}"/></linearGradient></defs>
        <rect width="${w}" height="${h}" fill="url(#g)"/>
        <circle cx="${w * 0.74}" cy="${h * 0.28}" r="${h * 0.16}" fill="#ffffff" opacity="0.20"/>
        <path d="M0 ${h * 0.72} Q ${w * 0.28} ${h * 0.5} ${w * 0.55} ${h * 0.74} T ${w} ${h * 0.6} V ${h} H 0 Z" fill="#0f172a" opacity="0.18"/>
        <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="${Math.round(h * 0.09)}" font-weight="700" fill="#ffffff" opacity="0.94">${label}</text>
        <text x="50%" y="64%" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="${Math.round(h * 0.035)}" font-weight="500" fill="#ffffff" opacity="0.72">Dream Teacher Gallery</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function demoAlbum(prefix, specs) {
      return specs.map(([label, from, to], i) => ({
        id: `ph_${prefix}_${i + 1}`,
        name: `${prefix}_${i + 1}.webp`,
        dataUrl: demoPhoto(label, from, to)
      }));
    }

    const DEMO = {
      david: demoAlbum('david', [
        ['教学瞬间', '#6366f1', '#0ea5e9'],
        ['课堂互动', '#0ea5e9', '#22c55e'],
        ['阅读时光', '#f59e0b', '#ef4444'],
        ['户外活动', '#8b5cf6', '#ec4899'],
        ['绘本共读', '#14b8a6', '#0ea5e9']
      ]),
      sarah: demoAlbum('sarah', [
        ['绘本课堂', '#0ea5e9', '#14b8a6'],
        ['口语练习', '#f97316', '#f59e0b'],
        ['旅行英语', '#6366f1', '#0ea5e9']
      ]),
      michael: demoAlbum('michael', [
        ['语法课堂', '#6366f1', '#4338ca'],
        ['KET 备考', '#0ea5e9', '#6366f1']
      ]),
      emma: demoAlbum('emma', [
        ['低龄启蒙', '#ec4899', '#8b5cf6'],
        ['日常对话', '#f59e0b', '#f97316']
      ]),
      kevin: demoAlbum('kevin', [
        ['游戏化课堂', '#14b8a6', '#6366f1'],
        ['自然拼读', '#22c55e', '#0ea5e9']
      ])
    };

    const TEACHERS = [
      {
        id: 'tc_david0001', name: 'David Miller', level: '21', monitor: 'Leo', status: 'active', taughtChildren: ['AliceZ12'],
        pendingPrice: { level: '18', effectiveDate: '2026-12-07' },
        videoDuration: '01:45', videoUrl: SAMPLE_VIDEO,
        photos: DEMO.david, avatarPhotoId: DEMO.david[0].id, avatarDataUrl: demoPhoto('David', '#6366f1', '#0ea5e9', 600, 600),
        introZh: 'David 老师来自英国伦敦，拥有牛津大学教育学背景与 8 年少儿一线教学经验（CELTA 认证）。擅长通过高频游戏化互动与自然拼读教学法激发孩子语言潜能，累计辅导超 200 名学员高分通过 KET/PET 剑桥五级考试。',
        introEn: 'Teacher David comes from London, UK, holding a degree in Education and CELTA certification with over 8 years of ESL teaching experience. He specializes in gamified phonics and Cambridge KET exam preparation.'
      },
      {
        id: 'tc_sarah0002', name: 'Sarah Jenkins', level: '18', monitor: 'Leo', status: 'active', taughtChildren: [],
        videoDuration: '01:15', videoUrl: SAMPLE_VIDEO,
        photos: DEMO.sarah, avatarPhotoId: DEMO.sarah[0].id, avatarDataUrl: demoPhoto('Sarah', '#0ea5e9', '#14b8a6', 600, 600),
        introZh: 'Sarah 老师拥有 6 年在线少儿英语教学经验，课堂节奏轻快，擅长生活口语与旅游情境表达训练，善于用绘本和角色扮演帮助孩子建立开口自信。',
        introEn: 'Sarah has six years of online ESL teaching experience. Her lively classes focus on everyday conversation and travel English, using picture books and role-play to build children\'s speaking confidence.'
      },
      {
        id: 'tc_micha0006', name: 'Michael Chen', level: '21', monitor: 'Amy', status: 'active', taughtChildren: ['BobZ10'],
        videoDuration: '01:32', videoUrl: SAMPLE_VIDEO,
        photos: DEMO.michael, avatarPhotoId: DEMO.michael[0].id, avatarDataUrl: demoPhoto('Michael', '#6366f1', '#4338ca', 600, 600),
        introZh: 'Michael 老师拥有 7 年英语语法与剑桥 KET 备考执教经历，教学逻辑严密，擅长用词根记忆网打牢语法词汇基本功。',
        introEn: 'Michael has seven years of grammar and Cambridge KET preparation experience, using systematic word-root maps to build solid foundations.'
      },
      {
        id: 'tc_emma00001', name: 'Emma Stone', level: '18', monitor: 'Amy', status: 'active', taughtChildren: ['AliceZ12'],
        videoDuration: '01:08', videoUrl: SAMPLE_VIDEO,
        photos: DEMO.emma, avatarPhotoId: DEMO.emma[0].id, avatarDataUrl: demoPhoto('Emma', '#ec4899', '#8b5cf6', 600, 600),
        introZh: 'Emma 老师擅长低龄学员口语启蒙与日常对话训练，课堂亲和力强，善于用生活情境带孩子自然开口。',
        introEn: 'Emma specializes in early-years speaking and everyday conversation. Her classes are warm and highly interactive.'
      },
      {
        id: 'tc_kevin0005', name: 'Kevin Lin', level: '16', monitor: 'Amy', status: 'active', taughtChildren: ['BobZ10'],
        videoDuration: '01:02', videoUrl: SAMPLE_VIDEO,
        photos: DEMO.kevin, avatarPhotoId: DEMO.kevin[0].id, avatarDataUrl: demoPhoto('Kevin', '#14b8a6', '#6366f1', 600, 600),
        introZh: 'Kevin 老师专注少儿英语启蒙，擅长游戏化课堂与自然拼读，注重孩子的课堂参与感。',
        introEn: 'Kevin focuses on early-years English and gamified phonics lessons with strong classroom participation.'
      }
    ];

    const NAVS = [
      { id: 'home', icon: 'home', label: '首页', desc: '查看家庭日程与教务待办。', href: 'm0_workspace_home.html?role=user' },
      { id: 'schedule', icon: 'calendar-days', label: '自家课表', desc: '查看孩子的当周课程安排。', href: 'm3a_calendar_grid.html' },
      { id: 'hall', icon: 'plus-circle', label: '约课大厅', desc: '选老师与预约排课', board: true },
      { id: 'me', icon: 'user', label: '我的', desc: '查看孩子档案与购课账单。', href: 'm1a_student_profile.html' }
    ];

    const state = {
      page: 'hall',
      navTab: 'hall',
      device: 'mobile',
      online: 'on',
      paid: 'yes',
      teachers: JSON.parse(JSON.stringify(TEACHERS)),
      activeTeacherId: 'tc_david0001',
      child: 'AliceZ12',
      lang: 'zh',
      playingVideo: false,
      overlay: null,
      teacherPreview: false,
      embed: false,
      availabilityRole: 'teacher',
      returnTo: 'm0_workspace_home.html?role=teacher&tab=me',
      availabilityFullDay: false,
      availabilityExpanded: {},
      availabilityData: null,
      availBatchOpen: false,
      availBatchStart: '09:00',
      availBatchEnd: '12:00',
      availBatchMode: 'open'
    };

    const params = new URLSearchParams(location.search);
    if (params.get('teacher_id')) state.activeTeacherId = params.get('teacher_id');
    if (params.get('child')) state.child = params.get('child');
    if (params.get('paid') === 'no') state.paid = 'no';
    if (params.get('paid') === 'refunded') state.paid = 'refunded';
    if (params.get('device') === 'tablet') state.device = 'tablet';
    if (params.get('embed') === '1') {
      state.embed = true;
      state.page = 'hall';
      state.navTab = 'hall';
    }
    if (!state.embed && params.get('role') === 'teacher' && params.get('page') === 'detail') {
      state.teacherPreview = true;
      state.page = 'detail';
      state.navTab = 'me';
    }
    if (!state.embed && ['teacher', 'monitor', 'admin'].includes(params.get('role')) && params.get('page') === 'availability') {
      const availabilityRole = params.get('role');
      state.teacherPreview = true;
      state.page = 'availability';
      state.navTab = 'home';
      state.availabilityRole = availabilityRole === 'teacher' ? 'teacher' : 'manager';
      state.returnTo = availabilityRole === 'teacher'
        ? 'm0_workspace_home.html?role=teacher&tab=home'
        : 'm1b_teacher_monitor.html';
      state.lang = availabilityRole === 'teacher' ? 'en' : 'zh';
    }

    const $ = (id) => document.getElementById(id);
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function teacherById(id) {
      return state.teachers.find((t) => t.id === id) || state.teachers[0];
    }

    function activeTeacher() {
      return teacherById(state.activeTeacherId);
    }

    function mainPhotoId(t) {
      if (t.avatarPhotoId) return t.avatarPhotoId;
      return t.photos && t.photos[0] ? t.photos[0].id : null;
    }

    function mainPhoto(t) {
      return (t.photos || []).find((p) => p.id === mainPhotoId(t)) || (t.photos || [])[0] || null;
    }

    function avatar(t, size = 'h-14 w-14', text = 'text-[18px]') {
      const initial = (t.name || '?').trim().charAt(0).toUpperCase() || '?';
      const photo = mainPhoto(t);
      const src = t.avatarDataUrl || (photo ? photo.dataUrl : '');
      if (src) return `<img src="${esc(src)}" class="shrink-0 rounded-full object-cover ring-1 ring-slate-200 ${size}" alt="">`;
      return `<span class="${size} grid shrink-0 place-items-center rounded-full bg-indigo-50 ${text} font-bold text-indigo-700 ring-1 ring-indigo-100">${esc(initial)}</span>`;
    }

    function levelBadge(level) {
      const map = {
        '21': 'border-indigo-200 bg-indigo-50 text-indigo-700',
        '18': 'border-slate-300 bg-slate-100 text-slate-700',
        '16': 'border-slate-200 bg-slate-50 text-slate-600'
      };
      return `<span class="inline-flex shrink-0 items-center rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${map[level] || map['18']}">${esc(level)}积分</span>`;
    }

    function pendingPriceText(plan) {
      if (!plan) return '';
      return `${String(plan.effectiveDate).slice(5)} 起 ${plan.level}积分`;
    }

    function hallTeachers() {
      return state.teachers
        .filter((t) => t.status !== 'resigned')
        .slice()
        .sort((a, b) => {
          const aFamiliar = (a.taughtChildren || []).includes(state.child) ? 0 : 1;
          const bFamiliar = (b.taughtChildren || []).includes(state.child) ? 0 : 1;
          if (aFamiliar !== bFamiliar) return aFamiliar - bFamiliar;
          return a.name.localeCompare(b.name, 'en');
        });
    }

    function qrSvg(seed) {
      const n = 9;
      let h = 0;
      for (const ch of String(seed)) h = (h * 131 + ch.charCodeAt(0)) >>> 0;
      const isFinder = (x, y, ox, oy) => x >= ox && x < ox + 3 && y >= oy && y < oy + 3
        && (x === ox || x === ox + 2 || y === oy || y === oy + 2 || (x === ox + 1 && y === oy + 1));
      let rects = '';
      for (let y = 0; y < n; y++) {
        for (let x = 0; x < n; x++) {
          const on = isFinder(x, y, 0, 0) || isFinder(x, y, 6, 0) || isFinder(x, y, 0, 6)
            ? true
            : ((h >> ((x + y * 3) % 30)) & 1) === 1;
          if (on) rects += `<rect x="${x * 10}" y="${y * 10}" width="10" height="10"/>`;
        }
      }
      return `<svg viewBox="0 0 90 90" class="h-full w-full text-slate-900" fill="currentColor" aria-hidden="true">${rects}</svg>`;
    }

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      if (state.embed) {
        document.documentElement.classList.add('h-full');
        document.body.className = 'h-full overflow-hidden bg-white font-sans text-slate-800 antialiased';
        $('console').classList.add('hidden');
        document.querySelector('main').className = 'h-full w-full';
        frame.className = 'relative flex h-full w-full flex-col overflow-hidden bg-white';
      } else {
        frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;
      }

      $('banner').innerHTML = state.embed ? '' : renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 网络不佳，正在显示已加载的老师资料；预约需联网`
        : '';

      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = state.embed ? '' : renderNav();
      $('overlay').innerHTML = renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function renderContentOnly() {
      $('content').innerHTML = renderContent();
      if (window.lucide) lucide.createIcons();
    }

    function renderBanner() {
      const preview = state.teacherPreview;
      const availability = state.page === 'availability';
      const managerAvailability = availability && state.availabilityRole === 'manager';
      const title = availability
        ? (managerAvailability ? '常规可约时段' : '开放时段')
        : (preview
          ? '我的名片'
          : (state.page === 'detail'
            ? '老师介绍'
            : (state.page === 'placeholder'
              ? ((NAVS.find((n) => n.id === state.navTab) || {}).label || '选老师')
              : '选老师')));
      const bannerTone = (preview || availability) ? 'from-slate-800 via-emerald-900 to-slate-700' : 'from-slate-800 via-blue-900 to-slate-700';
      const initial = (activeTeacher().name || 'A').trim().charAt(0).toUpperCase() || 'A';
      const backButton = availability
        ? `<button data-action="teacher-back" class="inline-flex h-8 shrink-0 items-center gap-1 rounded-lg px-2 -ml-1 text-[13px] font-semibold text-white/90 transition hover:bg-white/10 active:bg-white/15" aria-label="${managerAvailability ? '返回管理端' : '返回首页'}">${icon('chevron-left', 'h-4 w-4')}<span>${managerAvailability ? '返回管理端' : '返回首页'}</span></button>`
        : (preview
          ? `<button data-action="teacher-back" class="inline-flex h-8 shrink-0 items-center gap-1 rounded-lg px-2 -ml-1 text-[13px] font-semibold text-white/90 transition hover:bg-white/10 active:bg-white/15" aria-label="返回老师工作台">${icon('chevron-left', 'h-4 w-4')}<span>返回</span></button>`
          : (state.page === 'detail'
            ? `<button data-action="go-back" class="inline-flex h-8 shrink-0 items-center gap-1 rounded-lg px-2 -ml-1 text-[13px] font-semibold text-white/90 transition hover:bg-white/10 active:bg-white/15" aria-label="返回选老师">${icon('chevron-left', 'h-4 w-4')}<span>返回</span></button>`
            : ''));
      return `<header class="relative flex h-16 shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${bannerTone} px-4 text-white">
        <svg class="pointer-events-none absolute inset-0 h-full w-full" viewBox="0 0 390 80" preserveAspectRatio="xMidYMid slice" fill="none"><path d="M-20 64 C50 30 110 82 190 48 S300 18 410 44" stroke="white" stroke-opacity=".10" stroke-width="18" stroke-linecap="round"/><circle cx="320" cy="20" r="34" fill="white" fill-opacity=".05"/></svg>
        <div class="relative flex min-w-0 items-center gap-2">
          ${backButton}
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${esc(initial)}</span>
          <span class="truncate text-[18px] font-bold tracking-tight">${esc(title)}</span>
        </div>
        <button data-action="toast" data-message="暂无新消息" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
          ${icon('bell', 'h-4 w-4')}
          <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-rose-400 ring-1 ring-white/50"></span>
        </button>
      </header>`;
    }

    function renderNav() {
      if (state.teacherPreview) return '';
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${NAVS.map((item) => {
            const on = state.navTab === item.id;
            return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-500'}">
              ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
              <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const active = state[b.dataset.group] === b.dataset.value;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}`;

    function renderContent() {
      if (state.page === 'availability') return renderAvailability();
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.page === 'detail') return renderDetail();
      return renderHall();
    }

    function renderPlaceholder() {
      const item = NAVS.find((n) => n.id === state.navTab);
      if (!item) return `<div class="p-8 text-center text-[14px] font-medium text-slate-500">页面不存在</div>`;
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">进入对应页面</a>` : ''}
      </div>`;
    }

    function pageHeader(title, subtitle) {
      return `<div class="px-1">
        <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(title)}</h1>
        <p class="mt-0.5 text-[12px] font-medium text-slate-500">${esc(subtitle)}</p>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 老师常规可约时段模板（纯 2 色 · 零学员名 · 禁预约交互）
     * ------------------------------------------------------------------ */
    const AVAIL_DAYS = [
      { key: 'mon', label: '周一', en: 'Mon' },
      { key: 'tue', label: '周二', en: 'Tue' },
      { key: 'wed', label: '周三', en: 'Wed' },
      { key: 'thu', label: '周四', en: 'Thu' },
      { key: 'fri', label: '周五', en: 'Fri' },
      { key: 'sat', label: '周六', en: 'Sat' },
      { key: 'sun', label: '周日', en: 'Sun' }
    ];

    function availPad(n) { return String(n).padStart(2, '0'); }
    function availTime(hour, minute) { return `${availPad(hour)}:${minute === 0 ? '00' : '30'}`; }

    function availTimeOptions(selected) {
      const opts = [];
      for (let h = 6; h <= 24; h += 1) {
        const minutes = h === 24 ? [0] : [0, 30];
        minutes.forEach((m) => {
          const t = availTime(h, m);
          opts.push(`<option value="${t}"${t === selected ? ' selected' : ''}>${t}</option>`);
        });
      }
      return opts.join('');
    }

    function availBatchTimes(start, end) {
      const toMin = (t) => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
      const out = [];
      for (let cur = toMin(start); cur < toMin(end); cur += 30) {
        out.push(availTime(Math.floor(cur / 60), cur % 60));
      }
      return out;
    }

    function renderAvailBatchPanel() {
      const invalid = state.availBatchEnd <= state.availBatchStart;
      const modeOpen = state.availBatchMode === 'open';
      return `<div class="mt-2 w-full max-w-[340px] rounded-xl border border-slate-300 bg-white p-2.5 shadow-sm">
        <div class="flex flex-wrap items-center gap-1.5 text-[12px] font-semibold text-slate-700">
          <span>从</span>
          <select data-action="avail-batch-start" aria-label="批量选段开始时间" class="h-8 rounded-lg border border-slate-300 bg-white px-1 text-[12px] font-semibold text-slate-700">${availTimeOptions(state.availBatchStart)}</select>
          <span>至</span>
          <select data-action="avail-batch-end" aria-label="批量选段结束时间" class="h-8 rounded-lg border border-slate-300 bg-white px-1 text-[12px] font-semibold text-slate-700">${availTimeOptions(state.availBatchEnd)}</select>
        </div>
        <div class="mt-2 flex flex-wrap items-center gap-1.5">
          <button type="button" data-action="avail-batch-mode" data-mode="open" aria-pressed="${modeOpen}" class="h-8 whitespace-nowrap rounded-full border px-2.5 text-[12px] font-bold transition ${modeOpen ? 'border-emerald-300 bg-emerald-100 text-emerald-900' : 'border-slate-300 bg-white text-slate-600 hover:bg-slate-50'}">🟢 开放可约</button>
          <button type="button" data-action="avail-batch-mode" data-mode="rest" aria-pressed="${!modeOpen}" class="h-8 whitespace-nowrap rounded-full border px-2.5 text-[12px] font-bold transition ${!modeOpen ? 'border-slate-400 bg-slate-200 text-slate-900' : 'border-slate-300 bg-white text-slate-600 hover:bg-slate-50'}">⚪ 休息</button>
        </div>
        <button type="button" data-action="avail-batch-apply" ${invalid ? 'disabled' : ''} class="mt-2 h-8 w-full rounded-lg bg-indigo-600 px-3 text-[12px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">应用到全周</button>
        ${invalid ? '<p class="mt-1 text-[12px] font-medium text-rose-600">结束时间需晚于开始时间</p>' : ''}
      </div>`;
    }

    function buildAvailability() {
      const data = {};
      AVAIL_DAYS.forEach((d) => { data[d.key] = {}; });
      for (let h = 6; h < 24; h += 1) {
        [0, 30].forEach((m) => {
          const time = availTime(h, m);
          AVAIL_DAYS.forEach((d) => {
            const isWeekend = d.key === 'sat' || d.key === 'sun';
            const open = isWeekend
              ? ((h >= 9 && h < 12) || (h >= 14 && h < 18))
              : (d.key !== 'mon' && h >= 16 && h < 21);
            data[d.key][time] = open;
          });
        });
      }
      return data;
    }

    function availabilityRow(time) {
      const data = state.availabilityData || (state.availabilityData = buildAvailability());
      const cells = AVAIL_DAYS.map((d) => {
        const open = !!data[d.key][time];
        return `<button type="button" data-action="toggle-availability" data-day="${d.key}" data-time="${time}" aria-pressed="${open}" aria-label="${d.label} ${time} ${open ? '开放可约' : '休息'}" class="flex h-6 items-center justify-center rounded-[4px] border transition ${open ? 'border-emerald-300 bg-emerald-100 text-emerald-900 hover:bg-emerald-200' : 'border-slate-200 bg-slate-100 text-slate-600 hover:bg-slate-200'}"><span class="text-[12px] leading-none">${open ? '●' : '·'}</span></button>`;
      }).join('');
      return `<div class="flex h-6 items-center justify-end pr-1 font-mono text-[12px] font-medium text-slate-600">${time}</div>${cells}`;
    }

    function availabilityBand(band, start, end, hint) {
      const expanded = !!state.availabilityExpanded[band];
      return `<button type="button" data-action="toggle-avail-band" data-band="${band}" class="col-span-8 my-0.5 flex h-[22px] items-center justify-center gap-1 rounded-lg border border-dashed border-slate-300 bg-white text-[12px] font-medium text-slate-600 transition hover:bg-slate-50">${expanded ? `▾ ${start}–${end} ${hint} · fold 点击收起` : `▸ ${start}–${end} ${hint} · folded 点击展开设置`}</button>`;
    }

    function availabilityRows(startHour, endHour) {
      const rows = [];
      for (let h = startHour; h < endHour; h += 1) {
        for (const m of [0, 30]) rows.push(availabilityRow(availTime(h, m)));
      }
      return rows.join('');
    }

    function availabilityBandAllRest(startHour, endHour) {
      const data = state.availabilityData || (state.availabilityData = buildAvailability());
      for (let h = startHour; h < endHour; h += 1) {
        for (const m of [0, 30]) {
          const time = availTime(h, m);
          if (AVAIL_DAYS.some((d) => data[d.key][time])) return false;
        }
      }
      return true;
    }

    function availabilityBody() {
      if (state.availabilityFullDay) return availabilityRows(6, 24);
      const earlyFolded = !state.availabilityExpanded.early && availabilityBandAllRest(6, 9);
      const midFolded = !state.availabilityExpanded.mid && availabilityBandAllRest(12, 14);
      const lateFolded = !state.availabilityExpanded.late && availabilityBandAllRest(21, 24);
      return `
        ${earlyFolded ? availabilityBand('early', '06:00', '09:00', '早间全休息') : availabilityRows(6, 9)}
        ${availabilityRows(9, 12)}
        ${midFolded ? availabilityBand('mid', '12:00', '14:00', '午间全休息') : availabilityRows(12, 14)}
        ${availabilityRows(14, 21)}
        ${lateFolded ? availabilityBand('late', '21:00', '24:00', '晚间全休息') : availabilityRows(21, 24)}
      `;
    }

    function renderAvailability() {
      if (!state.availabilityData) state.availabilityData = buildAvailability();
      const manager = state.availabilityRole === 'manager';
      const labelFullDay = manager ? (state.availabilityFullDay ? '恢复智能折叠' : '展开全天') : (state.availabilityFullDay ? 'Smart fold' : 'Expand full day');
      const labelCopyWeekday = manager ? '复制周二到工作日' : 'Copy Tue → weekdays';
      const labelCopyAll = manager ? '复制到全周' : 'Copy Tue → all week';
      const labelBatch = manager ? '批量选段' : 'Batch range';
      const labelSave = manager ? '保存模板' : 'Save template';
      const dayHeaders = AVAIL_DAYS.map((d) => `<div class="flex h-8 flex-col items-center justify-center leading-tight"><span class="text-[12px] font-bold text-slate-600">${d.en}</span><span class="text-[12px] text-slate-500">${d.label}</span></div>`).join('');
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${manager ? '常规可约时段 <span class="text-[14px] font-bold text-slate-700">Availability</span>' : 'Availability <span class="text-[14px] font-bold text-slate-700">开放时段</span>'}</h1>
              <p class="mt-0.5 text-[12px] font-medium text-slate-600">${esc(activeTeacher().name)} · ${manager ? '班长/管理员配置 · 仅维护每周常规模板，不影响已排课次 · 北京时间 UTC+8' : 'Weekly recurring template · 每周循环重复生效 · 不展示具体日期与学员 · 北京时间 UTC+8'}</p>
            </div>
            <button type="button" data-action="avail-full-day" title="展开全天 06:00–24:00 / 恢复智能折叠" class="h-8 shrink-0 whitespace-nowrap rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">${labelFullDay}</button>
          </div>
          <div class="mt-2 flex flex-wrap gap-1.5">
            <button type="button" data-action="avail-copy-weekday" title="复制周二到工作日" class="h-8 whitespace-nowrap rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">${labelCopyWeekday}</button>
            <button type="button" data-action="avail-copy-all" title="复制到全周" class="h-8 whitespace-nowrap rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">${labelCopyAll}</button>
            <button type="button" data-action="avail-batch-toggle" aria-expanded="${state.availBatchOpen}" title="按时段区间批量开关" class="h-8 whitespace-nowrap rounded-lg border px-2.5 text-[12px] font-semibold transition ${state.availBatchOpen ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-50'}">${labelBatch}</button>
            <button type="button" data-action="avail-save" title="保存模板" class="h-8 whitespace-nowrap rounded-lg bg-indigo-600 px-3 text-[12px] font-semibold text-white transition hover:bg-indigo-700">${labelSave}</button>
          </div>
          ${state.availBatchOpen ? renderAvailBatchPanel() : ''}
        </section>
        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="grid grid-cols-[42px_repeat(7,minmax(0,1fr))] gap-0.5">
            <div class="flex h-8 flex-col items-center justify-center leading-tight"><span class="text-[12px] font-semibold text-slate-600">Time</span><span class="text-[12px] text-slate-500">时段</span></div>
            ${dayHeaders}
            ${availabilityBody()}
          </div>
        </section>
        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3">
          <div class="flex flex-wrap items-center gap-3 text-[12px] font-semibold text-slate-700">
            <span class="inline-flex items-center gap-1"><span class="inline-block h-3 w-3 rounded-[3px] border border-emerald-300 bg-emerald-100"></span>🟢 Available 开放可约</span>
            <span class="inline-flex items-center gap-1"><span class="inline-block h-3 w-3 rounded-[3px] border border-slate-200 bg-slate-100"></span>⚪ Rest 休息</span>
          </div>
          <div class="mt-2 rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-[12px] font-semibold text-slate-700">⏰ 时区基准：北京时间 UTC+8 (All times in Beijing Time)</div>
          <div class="mt-2 space-y-1 text-[12px] leading-relaxed text-slate-600">
            <p>• All times are in Beijing Time (UTC+8). This weekly template shows no dates, student names or booking actions.</p>
            <p>• 本页仅设置每周循环重复的常规可约时段（统一按北京时间 UTC+8），不展示具体日期与任何学员姓名，页面内不可发起约课、选生或请假操作。</p>
            <p>• Existing booked lessons are not affected; closing a slot only stops new bookings and next-round renewal placement.</p>
            <p>• 修改常规模板不会取消既有已排课次；关闭已有固定位占用的时段并保存后，将向负责班长、小班主理人及受影响 1v1 固定位家长发送站内浅黄提醒（不发邮件），并停止后续新约与下轮续费基准。如需仅针对具体某天临时加开时段或请假，请前往【课表】页面操作。</p>
          </div>
        </section>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 选课大厅
     * ------------------------------------------------------------------ */
    function renderHall() {
      const list = hallTeachers();
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('选老师', `为 ${state.child} 挑选合适的老师`)}
        ${childSelector()}
        <div class="flex items-center justify-between px-1">
          <span class="text-[14px] font-semibold text-slate-700">老师团队</span>
          <span class="text-[12px] font-medium text-slate-500">共 ${list.length} 位</span>
        </div>
        <div class="${grid}">
          ${list.length ? list.map(teacherCard).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-500">暂无可约老师</div>`}
        </div>
      </div>`;
    }

    function childSelector() {
      return `<div class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3">
        <div class="flex items-center justify-between">
          <span class="text-[12px] font-medium text-slate-500">当前选课宝贝</span>
          <span class="text-[12px] font-medium text-slate-500">多孩家庭</span>
        </div>
        <div class="mt-2 grid grid-cols-2 gap-2">
          ${PARENT_CHILDREN.map((ch) => {
            const on = ch.name === state.child;
            return `<button data-action="select-child" data-child="${ch.name}" class="flex h-10 items-center justify-center gap-1.5 rounded-xl text-[14px] font-semibold transition ${on ? 'bg-indigo-600 text-white' : 'border border-slate-300 bg-white text-slate-700 hover:bg-slate-50'}">
              <span class="grid h-6 w-6 place-items-center rounded-full text-[12px] font-bold ${on ? 'bg-white/15 text-white' : 'bg-white text-indigo-700'}">${esc(ch.name.charAt(0))}</span>${esc(ch.name)}
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function teacherCard(t) {
      return `<article data-action="open-teacher" data-id="${t.id}" role="button" tabindex="0" class="cursor-pointer rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5 transition hover:border-indigo-200 active:scale-[0.995]">
        <div class="flex items-start gap-3">
          ${avatar(t, 'h-12 w-12', 'text-[16px]')}
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-1.5">
              <span class="truncate text-[16px] font-bold text-slate-900">${esc(t.name)}</span>
              ${levelBadge(t.level)}
            </div>
            <div class="mt-0.5 flex flex-wrap items-center gap-1.5 text-[12px] font-medium text-slate-500">
              <span class="inline-flex items-center rounded-full border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">可约</span>
              <span class="truncate">负责班长 ${esc(t.monitor)}</span>
              ${t.pendingPrice ? `<span class="shrink-0 whitespace-nowrap font-semibold text-indigo-700">${esc(pendingPriceText(t.pendingPrice))}</span>` : ''}
            </div>
          </div>
          ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-300')}
        </div>
        <p class="mt-2 line-clamp-2 text-[14px] font-medium leading-relaxed text-slate-600">${esc(t.introZh)}</p>
        <div class="mt-2 flex items-center justify-between gap-2 border-t border-slate-100 pt-2">
          <div class="flex min-w-0 items-center gap-2 text-[12px] font-medium text-slate-500">
            <span class="inline-flex items-center gap-1">${icon('images', 'h-3.5 w-3.5')}${(t.photos || []).length} 张</span>
            <span class="inline-flex items-center gap-1">${icon('play', 'h-3.5 w-3.5')}${esc(t.videoDuration)}</span>
          </div>
          <div class="flex shrink-0 items-center gap-1.5">
            ${state.paid === 'yes'
              ? `<button data-action="open-qr" data-id="${t.id}" class="grid h-8 w-8 place-items-center rounded-lg border border-slate-300 bg-white text-slate-600 hover:bg-slate-50" aria-label="ClassIn 二维码">${icon('qr-code', 'h-4 w-4')}</button>`
              : `<button data-action="toast" data-message="${state.paid === 'refunded' ? '购课单已全额清退，ClassIn 联系方式暂不可见；重新购课后解锁' : '购课后解锁查看老师 ClassIn 联系方式'}" class="inline-flex h-8 shrink-0 items-center gap-1 whitespace-nowrap rounded-lg border border-slate-200 bg-slate-100 px-1.5 text-[12px] font-medium text-slate-500" aria-label="购课后解锁查看老师 ClassIn 联系方式">${icon('lock', 'h-3.5 w-3.5')}${state.paid === 'refunded' ? '已清退锁定' : '购课后解锁'}</button>`}
            <button data-action="open-teacher" data-id="${t.id}" class="inline-flex items-center gap-0.5 whitespace-nowrap text-[12px] font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">查看介绍${icon('chevron-right', 'h-3 w-3')}</button>
            <button data-action="book" data-id="${t.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-7 shrink-0 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-200 disabled:text-slate-500">预约</button>
          </div>
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 老师详情
     * ------------------------------------------------------------------ */
    function renderDetail() {
      const t = activeTeacher();
      const isZh = state.lang === 'zh';
      const intro = isZh ? t.introZh : t.introEn;
      const backRow = state.embed
        ? `<div class="px-1"><button data-action="go-back" class="inline-flex items-center gap-0.5 text-[12px] font-semibold text-slate-600 transition hover:text-slate-800">${icon('chevron-left', 'h-3.5 w-3.5')}<span>返回老师列表</span></button></div>`
        : '';
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        ${backRow}
        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
          <div class="flex items-start gap-3.5">
            ${avatar(t, 'h-16 w-16', 'text-[18px]')}
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-1.5">
                <h1 class="truncate text-[18px] font-bold tracking-tight text-slate-900">${esc(t.name)}</h1>
                ${levelBadge(t.level)}
                ${t.pendingPrice ? `<span class="shrink-0 whitespace-nowrap text-[12px] font-semibold text-indigo-700">${esc(pendingPriceText(t.pendingPrice))}</span>` : ''}
                <span class="shrink-0 rounded-full border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">可约</span>
              </div>
              <div class="mt-1 text-[12px] font-medium text-slate-500">负责班长 ${esc(t.monitor)}</div>
            </div>
          </div>
        </section>

        ${renderPhotoGrid(t)}

        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-[16px] font-bold text-slate-900">老师介绍</h2>
            <div class="inline-flex rounded-xl bg-slate-100 p-1">
              <button data-action="set-lang" data-lang="zh" class="h-8 rounded-lg px-2.5 text-[12px] font-bold ${isZh ? 'bg-white text-indigo-700' : 'text-slate-500'}">中文</button>
              <button data-action="set-lang" data-lang="en" class="h-8 rounded-lg px-2.5 text-[12px] font-bold ${!isZh ? 'bg-white text-indigo-700' : 'text-slate-500'}">English</button>
            </div>
          </div>
          <p id="introText" class="mt-2.5 whitespace-pre-line text-[14px] font-medium leading-relaxed text-slate-700">${esc(intro)}</p>
        </section>

        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
          <div class="flex items-center justify-between">
            <h2 class="text-[16px] font-bold text-slate-900">试讲视频</h2>
            <span class="font-mono text-[12px] font-medium text-slate-500">${esc(t.videoDuration)}</span>
          </div>
          <div class="mt-2.5 overflow-hidden rounded-xl border border-slate-200">
            ${state.playingVideo
              ? `<video controls autoplay playsinline class="aspect-video w-full bg-black" src="${esc(t.videoUrl)}"></video>`
              : `<button data-action="play-video" class="block w-full">
                <div class="relative flex aspect-video w-full items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-950 to-indigo-700">
                  <span class="grid h-12 w-12 place-items-center rounded-full bg-white/15 text-white ring-1 ring-white/30">${icon('play', 'ml-0.5 h-6 w-6')}</span>
                  <span class="absolute bottom-2 right-2 rounded-md bg-slate-900/80 px-1.5 py-0.5 font-mono text-[12px] font-semibold text-white">${esc(t.videoDuration)}</span>
                </div>
                <div class="flex items-center justify-between bg-white px-2.5 py-2">
                  <span class="text-[14px] font-semibold text-slate-800">点击就地播放试讲视频</span>
                  <span class="text-[12px] font-medium text-slate-500">MP4</span>
                </div>
              </button>`}
          </div>
          <p class="mt-1.5 text-[12px] font-medium text-slate-500">老师试讲视频 · MP4 格式 · 支持全屏播放</p>
        </section>

        ${state.paid === 'yes'
          ? `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
          <div class="flex items-center justify-between">
            <h2 class="text-[16px] font-bold text-slate-900">ClassIn 二维码</h2>
            <span class="text-[12px] font-medium text-slate-500">点击放大</span>
          </div>
          <button data-action="open-qr" data-id="${t.id}" class="mt-2.5 flex w-full items-center gap-3 rounded-xl border border-slate-300 bg-white p-2.5 text-left">
            <span class="grid h-14 w-14 shrink-0 place-items-center rounded-lg bg-white p-1 ring-1 ring-slate-200">${qrSvg(t.name)}</span>
            <span class="min-w-0">
              <span class="block truncate text-[14px] font-semibold text-slate-800">${esc(t.name)} · ClassIn</span>
              <span class="mt-0.5 block text-[12px] font-medium text-slate-500">长按识别或截图，使用 ClassIn App 扫码添加</span>
            </span>
          </button>
        </section>`
          : `<section class="rounded-2xl border border-slate-200 bg-slate-50/50 p-4">
          <div class="flex items-center justify-between">
            <h2 class="text-[16px] font-bold text-slate-500">ClassIn 二维码</h2>
            <span class="inline-flex items-center gap-1 text-[12px] font-medium text-slate-500">${icon('lock', 'h-3.5 w-3.5')}购课后解锁</span>
          </div>
          <div class="mt-2.5 flex items-center gap-3 rounded-xl border border-dashed border-slate-200 bg-slate-100/60 p-3">
            <span class="grid h-14 w-14 shrink-0 place-items-center rounded-lg bg-slate-200/70 text-slate-400">${icon('lock', 'h-6 w-6')}</span>
            <span class="min-w-0">
              <span class="block text-[14px] font-semibold text-slate-500">${state.paid === 'refunded' ? '购课单已全额清退，ClassIn 联系方式暂不可见' : '购课后解锁查看老师 ClassIn 联系方式'}</span>
              <span class="mt-0.5 block text-[12px] font-medium text-slate-400">${state.paid === 'refunded' ? '重新购课后即可扫码添加老师' : '完成任一购课单后即可扫码添加老师'}</span>
            </span>
          </div>
        </section>`}

        ${state.teacherPreview
          ? renderTeacherPreviewNote()
          : `<button data-action="book" data-id="${t.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">为 ${esc(state.child)} 预约 ${esc(t.name)}</button>`}
      </div>`;
    }

    function renderTeacherPreviewNote() {
      return `<section class="flex items-start gap-2 rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        ${icon('info', 'mt-0.5 h-4 w-4 shrink-0 text-slate-600')}
        <p class="text-[12px] font-medium leading-relaxed text-slate-600">如需修改个人介绍、相册或试讲视频，请联系负责班长或管理员更新。</p>
      </section>`;
    }

    function renderPhotoGrid(t) {
      const photos = t.photos || [];
      if (!photos.length) return '';
      const mainId = mainPhotoId(t);
      const capacity = state.device === 'tablet' ? 9 : 4;
      const overflow = photos.length > capacity;
      const shown = overflow ? photos.slice(0, capacity) : photos;
      const cols = state.device === 'tablet' ? 'grid-cols-3' : 'grid-cols-2';
      const remain = photos.length - capacity + 1;
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        <div class="flex items-center justify-between gap-2">
          <h2 class="text-[16px] font-bold text-slate-900">老师风采相册</h2>
          <span class="text-[12px] font-medium text-slate-500">共 ${photos.length} 张 · 点击看大图</span>
        </div>
        <div class="mt-2.5 grid ${cols} gap-1.5">
          ${shown.map((p, i) => {
            const isLastSlot = overflow && i === capacity - 1;
            return `<button data-action="open-photo" data-id="${t.id}" data-index="${i}" class="relative aspect-square overflow-hidden rounded-lg border border-slate-300 bg-white" aria-label="${isLastSlot ? `查看其余 ${remain} 张照片` : `查看第 ${i + 1} 张风采照片`}">
              <img src="${p.dataUrl}" class="h-full w-full object-cover" alt="">
              ${p.id === mainId && !isLastSlot ? '<span class="absolute left-1 top-1 rounded bg-indigo-600 px-1 py-0.5 text-[12px] font-bold text-white">主头像</span>' : ''}
              ${isLastSlot ? `<span class="absolute inset-0 grid place-items-center bg-slate-900/60 text-[18px] font-bold text-white">+${remain}</span>` : ''}
            </button>`;
          }).join('')}
        </div>
        <p class="mt-1.5 text-[12px] font-medium text-slate-500">点击任意缩略图全屏查看，支持左右切换与双指 / 双击缩放。</p>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'photo') return renderPhotoLightbox();
      if (state.overlay.type === 'qr') return renderQrModal();
      if (state.overlay.type === 'avail-conflict') return renderAvailConflictModal();
      return '';
    }

    function renderAvailConflictModal() {
      const count = Number(state.overlay && state.overlay.count) || 3;
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-5 top-1/2 mx-auto max-w-[330px] -translate-y-1/2 rounded-2xl bg-white p-4 shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="availConflictTitle">
          <div class="flex items-start justify-between gap-2">
            <h2 id="availConflictTitle" class="text-[16px] font-bold text-slate-900">保存常规可约时段</h2>
            <button type="button" data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 transition hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="mt-2 flex items-start gap-2 rounded-xl border border-amber-200 bg-amber-50 p-2.5">
            ${icon('alert-triangle', 'mt-0.5 h-4 w-4 shrink-0 text-amber-600')}
            <p class="text-[12px] font-medium leading-relaxed text-amber-900">检测到 <span class="font-bold">${count}</span> 处已排课程落在即将关闭的时段。已排课程不受影响，如需按时授课或请假，请前往【课表】另行处理。确认保存后仅停止后续新约与下轮自动续费排入。</p>
          </div>
          <div class="mt-3 grid grid-cols-2 gap-2">
            <button type="button" data-action="close-overlay" class="h-10 rounded-xl border border-slate-300 bg-white text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">取消</button>
            <button type="button" data-action="avail-confirm-save" class="h-10 rounded-xl bg-indigo-600 text-[12px] font-semibold text-white transition hover:bg-indigo-700">确认保存</button>
          </div>
        </div>
      </div>`;
    }

    function renderQrModal() {
      if (state.paid !== 'yes') return '';
      const t = teacherById(state.overlay.teacherId);
      if (!t) return '';
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-6 top-1/2 mx-auto max-w-[340px] -translate-y-1/2 rounded-2xl bg-white p-4 text-center shadow-2xl">
          <div class="flex justify-end">
            <button data-action="close-overlay" class="grid h-8 w-8 place-items-center rounded-lg text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="mx-auto mt-1 h-56 w-56 rounded-2xl border border-slate-200 bg-white p-3">${qrSvg(t.name)}</div>
          <div class="mt-3 text-[16px] font-bold text-slate-900">${esc(t.name)}</div>
          <p class="mt-1 text-[12px] font-medium text-slate-500">长按识别 / 使用 ClassIn 扫码添加</p>
          <p class="mt-1 text-[12px] font-medium text-slate-600">添加后可在 ClassIn 中直接沟通上课安排</p>
        </div>
      </div>`;
    }

    function renderPhotoLightbox() {
      const t = teacherById(state.overlay.teacherId);
      const photos = (t && t.photos) || [];
      if (!photos.length) return '';
      const total = photos.length;
      const index = ((state.overlay.index % total) + total) % total;
      const photo = photos[index];
      const mainId = mainPhotoId(t);
      const zoom = !!state.overlay.zoom;
      return `<div class="absolute inset-0 z-[70] overflow-hidden bg-slate-950/95">
        <div class="absolute inset-0" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 top-0 z-10 flex items-start justify-between gap-3 px-4 py-3">
          <div class="min-w-0 text-white">
            <div class="truncate text-[14px] font-bold">${esc(t.name)} · 风采相册</div>
            <div class="mt-1 flex items-center gap-1.5 text-[12px] font-medium text-slate-300">
              ${photo.id === mainId ? '<span class="rounded bg-indigo-500 px-1.5 py-0.5 text-[12px] font-bold text-white">主头像</span>' : ''}
              <span>生活 / 教学照片</span>
            </div>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <button data-action="zoom-photo" class="grid h-9 w-9 place-items-center rounded-xl bg-white/10 text-white hover:bg-white/20" aria-label="${zoom ? '还原大图' : '放大查看'}">${icon(zoom ? 'zoom-out' : 'zoom-in', 'h-5 w-5')}</button>
            <span class="rounded-full bg-white/10 px-2.5 py-1 font-mono text-[12px] font-semibold text-white">${index + 1} / ${total}</span>
            <button data-action="close-overlay" class="grid h-9 w-9 place-items-center rounded-xl bg-white/10 text-white hover:bg-white/20" aria-label="关闭大图">${icon('x', 'h-5 w-5')}</button>
          </div>
        </div>
        <div class="pointer-events-none relative z-10 flex h-full items-center justify-center px-4 pb-20 pt-20">
          <img data-action="zoom-photo" src="${photo.dataUrl}" class="pointer-events-auto max-h-full max-w-full ${zoom ? 'scale-150 cursor-zoom-out' : 'cursor-zoom-in'} rounded-xl object-contain shadow-2xl transition-transform duration-200" alt="">
        </div>
        ${total > 1 ? `<button data-action="photo-prev" class="absolute left-3 top-1/2 z-10 grid h-11 w-11 -translate-y-1/2 place-items-center rounded-full bg-white/10 text-white backdrop-blur hover:bg-white/20" aria-label="上一张">${icon('chevron-left', 'h-6 w-6')}</button>
        <button data-action="photo-next" class="absolute right-3 top-1/2 z-10 grid h-11 w-11 -translate-y-1/2 place-items-center rounded-full bg-white/10 text-white backdrop-blur hover:bg-white/20" aria-label="下一张">${icon('chevron-right', 'h-6 w-6')}</button>` : ''}
        <div class="pointer-events-none absolute inset-x-0 bottom-0 z-10 px-4 py-3 text-center text-[12px] font-medium text-slate-300">双击图片或双指缩放 · 点击暗色背景或按 Esc 退出${total > 1 ? ' · 使用 ← → 切换照片' : ''}</div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    function openTeacher(id) {
      state.activeTeacherId = id;
      state.page = 'detail';
      state.navTab = hallTab();
      state.playingVideo = false;
      state.lang = 'zh';
      state.overlay = null;
      renderAll();
    }

    function hallTab() {
      return 'hall';
    }

    function navTo(tab) {
      const item = NAVS.find((n) => n.id === tab);
      if (!item) return;
      state.navTab = tab;
      state.page = item.board ? 'hall' : 'placeholder';
      state.playingVideo = false;
      state.overlay = null;
      renderAll();
    }

    function book(id) {
      if (state.online === 'off') return showToast('网络不佳，预约需联网后重试');
      const t = teacherById(id);
      showToast(`正在打开 ${t.name} 的周度排班网格...`);
      setTimeout(() => {
        const teacherKey = t.id.replace('tc_', '').replace(/\d+$/, '');
        window.location.href = `m3a_calendar_grid.html?role=parent&view=calendar&teacher=${encodeURIComponent(teacherKey)}&teacher_name=${encodeURIComponent(t.name)}&child=${encodeURIComponent(state.child)}&from=hall`;
      }, 350);
    }

    function setLang(lang) {
      state.lang = lang;
      const t = activeTeacher();
      const text = $('introText');
      if (text) text.textContent = lang === 'zh' ? t.introZh : t.introEn;
      document.querySelectorAll('[data-action="set-lang"]').forEach((b) => {
        const on = b.dataset.lang === lang;
        b.className = `h-8 rounded-lg px-2.5 text-[12px] font-bold ${on ? 'bg-white text-indigo-700' : 'text-slate-500'}`;
      });
    }

    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'teacher-back') { window.location.href = state.returnTo; return; }
      if (action === 'go-back') { state.page = 'hall'; state.navTab = 'hall'; state.playingVideo = false; state.overlay = null; return renderAll(); }
      if (action === 'select-child') { state.child = el.dataset.child; return renderContentOnly(); }
      if (action === 'open-teacher') return openTeacher(el.dataset.id);
      if (action === 'open-qr') {
        if (state.paid !== 'yes') return showToast(state.paid === 'refunded' ? '购课单已全额清退，ClassIn 联系方式暂不可见' : '购课后解锁查看老师 ClassIn 联系方式');
        state.overlay = { type: 'qr', teacherId: el.dataset.id };
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'open-photo') {
        state.overlay = { type: 'photo', teacherId: el.dataset.id, index: Number(el.dataset.index) || 0, zoom: false };
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'zoom-photo') {
        if (!state.overlay || state.overlay.type !== 'photo') return;
        state.overlay.zoom = !state.overlay.zoom;
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'photo-prev' || action === 'photo-next') {
        if (!state.overlay || state.overlay.type !== 'photo') return;
        const t = teacherById(state.overlay.teacherId);
        const total = (t && t.photos && t.photos.length) || 0;
        if (!total) return;
        state.overlay.index = (state.overlay.index + (action === 'photo-next' ? 1 : -1) + total) % total;
        state.overlay.zoom = false;
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'close-overlay') {
        state.overlay = null;
        $('overlay').innerHTML = '';
        return;
      }
      if (action === 'set-lang') return setLang(el.dataset.lang);
      if (action === 'play-video') { state.playingVideo = true; return renderContentOnly(); }
      if (action === 'toggle-availability') {
        const day = el.dataset.day;
        const time = el.dataset.time;
        if (state.availabilityData && day && time) {
          state.availabilityData[day][time] = !state.availabilityData[day][time];
          renderContentOnly();
        }
        return;
      }
      if (action === 'toggle-avail-band') {
        const band = el.dataset.band;
        state.availabilityExpanded[band] = !state.availabilityExpanded[band];
        return renderContentOnly();
      }
      if (action === 'avail-full-day') {
        state.availabilityFullDay = !state.availabilityFullDay;
        state.availabilityExpanded = {};
        return renderContentOnly();
      }
      if (action === 'avail-copy-weekday' || action === 'avail-copy-all') {
        const source = state.availabilityData || (state.availabilityData = buildAvailability());
        const targets = action === 'avail-copy-weekday' ? ['mon', 'wed', 'thu', 'fri'] : ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
        targets.forEach((k) => { source[k] = { ...source.tue }; });
        state.availabilityExpanded = {};
        renderContentOnly();
        showToast(action === 'avail-copy-weekday' ? '已将周二模板复制到工作日' : '已将周二模板复制到全周');
        return;
      }
      if (action === 'avail-batch-toggle') {
        state.availBatchOpen = !state.availBatchOpen;
        return renderContentOnly();
      }
      if (action === 'avail-batch-mode') {
        state.availBatchMode = el.dataset.mode === 'rest' ? 'rest' : 'open';
        return renderContentOnly();
      }
      if (action === 'avail-batch-apply') {
        if (state.availBatchEnd <= state.availBatchStart) return showToast('结束时间需晚于开始时间');
        const data = state.availabilityData || (state.availabilityData = buildAvailability());
        const target = state.availBatchMode !== 'rest';
        const times = availBatchTimes(state.availBatchStart, state.availBatchEnd);
        AVAIL_DAYS.forEach((d) => {
          times.forEach((time) => { data[d.key][time] = target; });
        });
        renderContentOnly();
        showToast(`已将全周 ${state.availBatchStart}–${state.availBatchEnd} 设为${target ? '开放可约' : '休息'}`);
        return;
      }
      if (action === 'avail-save') {
        state.overlay = { type: 'avail-conflict', count: 3 };
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'avail-confirm-save') {
        state.overlay = null;
        $('overlay').innerHTML = '';
        showToast('常规可约模板已保存，并记入档案变动日志');
        return;
      }
      if (action === 'book') return book(el.dataset.id);
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      if (el.dataset.action === 'avail-batch-start') {
        state.availBatchStart = el.value;
        renderContentOnly();
      } else if (el.dataset.action === 'avail-batch-end') {
        state.availBatchEnd = el.value;
        renderContentOnly();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (!state.overlay) return;
      if (e.key === 'Escape') {
        state.overlay = null;
        $('overlay').innerHTML = '';
        return;
      }
      if (state.overlay.type !== 'photo') return;
      const t = teacherById(state.overlay.teacherId);
      const total = (t && t.photos && t.photos.length) || 0;
      if (total > 1 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        e.preventDefault();
        state.overlay.index = (state.overlay.index + (e.key === 'ArrowRight' ? 1 : -1) + total) % total;
        state.overlay.zoom = false;
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
      }
    });

    document.getElementById('btnResetDemo').addEventListener('click', () => {
      const availability = state.page === 'availability';
      state.page = availability ? 'availability' : (state.teacherPreview ? 'detail' : 'hall');
      state.navTab = availability ? 'home' : (state.teacherPreview ? 'me' : 'hall');
      state.device = 'mobile'; state.online = 'on';
      state.paid = 'yes';
      state.teachers = clone(TEACHERS);
      state.activeTeacherId = 'tc_david0001';
      state.child = 'AliceZ12'; state.lang = availability ? 'en' : 'zh';
      state.playingVideo = false; state.overlay = null;
      state.availabilityFullDay = false;
      state.availabilityExpanded = {};
      state.availabilityData = null;
      state.availBatchOpen = false;
      state.availBatchStart = '09:00';
      state.availBatchEnd = '12:00';
      state.availBatchMode = 'open';
      renderAll();
      showToast('演示数据已重置');
    });

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'paid') {
          state.paid = value;
          state.overlay = null;
          renderAll();
          showToast(value === 'yes' ? '已切换为已购课家长' : (value === 'refunded' ? '已切换为已全额清退家长' : '已切换为未购课家长'));
        }
        if (group === 'online') {
          state.online = value;
          renderAll();
          if (value === 'off') showToast('网络不佳，预约需联网');
        }
      });
    });

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    /* 原型演示导航折叠（§8.5） */
    const NAV_COLLAPSE_KEY = 'dream_proto_nav_collapsed';

    function navCollapsedPref() {
      try { return localStorage.getItem(NAV_COLLAPSE_KEY) === '1'; } catch (e) { return false; }
    }

    function saveNavCollapsed(collapsed) {
      try { localStorage.setItem(NAV_COLLAPSE_KEY, collapsed ? '1' : '0'); } catch (e) { /* 静默降级 */ }
    }

    function applyNavCollapsed(collapsed) {
      const header = $('console');
      const mini = document.querySelector('[data-console-mini]');
      if (!header || !mini) return;
      const embed = !!state.embed;
      header.classList.toggle('hidden', collapsed || embed);
      mini.classList.toggle('hidden', embed || !collapsed);
      mini.classList.toggle('flex', !embed && collapsed);
    }

    const consoleCollapseBtn = document.querySelector('[data-console-collapse]');
    const consoleExpandBtn = document.querySelector('[data-console-expand]');
    if (consoleCollapseBtn) consoleCollapseBtn.addEventListener('click', () => { saveNavCollapsed(true); applyNavCollapsed(true); });
    if (consoleExpandBtn) consoleExpandBtn.addEventListener('click', () => { saveNavCollapsed(false); applyNavCollapsed(false); });

    renderAll();
    applyNavCollapsed(navCollapsedPref());
  </script>
</body>
</html>

    function demoPhoto(label, from, to, w = 800, h = 600) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">

    const TEACHERS = [
      {

        introEn: 'Teacher David comes from London, UK, holding a degree in Education and CELTA certification with over 8 years of ESL teaching experience. He specializes in gamified phonics and Cambridge KET exam preparation.'
      },
      {
        id: 'tc_sarah0002', name: 'Sarah Jenkins', level: 'Standard', monitor: 'Leo',
        skills: ['生活口语', '旅游口语'], videoDuration: '01:15', videoUrl: SAMPLE_VIDEO,
        photos: DEMO.sarah, avatarPhotoId: DEMO.sarah[0].id, avatarDataUrl: demoPhoto('Sarah', '#0ea5e9', '#14b8a6', 600, 600),
        introZh: 'Sarah 老师拥有 6 年在线少儿英语教学经验，课堂节奏轻快，擅长生活口语与旅游情境表达训练，善于用绘本和角色扮演帮助孩子建立开口自信。',
        introEn: 'Sarah has six years of online ESL teaching experience. Her lively classes focus on everyday conversation and travel English, using picture books and role-play to build children\'s speaking confidence.'
      },
      {
        id: 'tc_micha0006', name: 'Michael Chen', level: 'Senior', monitor: 'Amy',
        skills: ['KET', '自然拼读'], videoDuration: '01:32', videoUrl: SAMPLE_VIDEO,
        photos: DEMO.michael, avatarPhotoId: DEMO.michael[0].id, avatarDataUrl: demoPhoto('Michael', '#6366f1', '#4338ca', 600, 600),
        introZh: 'Michael 老师拥有 7 年英语语法与剑桥 KET 备考执教经历，教学逻辑严密，擅长用词根记忆网打牢语法词汇基本功。',
        introEn: 'Michael has seven years of grammar and Cambridge KET preparation experience, using systematic word-root maps to build solid foundations.'
      },
      {
        id: 'tc_emma00001', name: 'Emma Stone', level: 'Standard', monitor: 'Amy',
        skills: ['生活口语'], videoDuration: '01:08', videoUrl: SAMPLE_VIDEO,
        photos: DEMO.emma, avatarPhotoId: DEMO.emma[0].id, avatarDataUrl: demoPhoto('Emma', '#ec4899', '#8b5cf6', 600, 600),
        introZh: 'Emma 老师擅长低龄学员口语启蒙与日常对话训练，课堂亲和力强，善于用生活情境带孩子自然开口。',

      },
      {
        id: 'tc_kevin0005', name: 'Kevin Lin', level: 'Junior', monitor: 'Amy',
        skills: ['少儿英语', '自然拼读'], videoDuration: '01:02', videoUrl: SAMPLE_VIDEO,
        photos: DEMO.kevin, avatarPhotoId: DEMO.kevin[0].id, avatarDataUrl: demoPhoto('Kevin', '#14b8a6', '#6366f1', 600, 600),
        introZh: 'Kevin 老师专注少儿英语启蒙，擅长游戏化课堂与自然拼读，注重孩子的课堂参与感。',
        introEn: 'Kevin focuses on early-years English and gamified phonics lessons with strong classroom participation.'
      }

    const NAVS = [
      { id: 'home', icon: 'home', label: '首页', desc: '查看家庭日程与教务待办。', href: 'm0_workspace_home.html?role=user' },
      { id: 'schedule', icon: 'calendar-days', label: '学生课表', desc: '查看孩子的当周课程安排。', href: 'm3a_calendar_grid.html' },
      { id: 'hall', icon: 'plus-circle', label: '约课大厅', desc: '教师公开履历与选课大厅', board: true },
      { id: 'me', icon: 'user', label: '我的', desc: '查看孩子档案与购课账单。', href: 'm1a_student_profile.html' }
    ];

    const state = {
      page: 'hall',
      navTab: 'hall',
      device: 'mobile',
      online: 'on',
      teachers: JSON.parse(JSON.stringify(TEACHERS)),
      activeTeacherId: 'tc_david0001',
      child: 'AliceZ12',
      filter: 'all',
      lang: 'zh',
      playingVideo: false,
      overlay: null
    };

    const params = new URLSearchParams(location.search);
    if (params.get('teacher_id')) state.activeTeacherId = params.get('teacher_id');
    if (params.get('child')) state.child = params.get('child');
    if (params.get('filter')) state.filter = params.get('filter');
    if (params.get('device') === 'tablet') state.device = 'tablet';

    const $ = (id) => document.getElementById(id);
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function teacherById(id) {
      return state.teachers.find((t) => t.id === id) || state.teachers[0];
    }

    function activeTeacher() {
      return teacherById(state.activeTeacherId);
    }

    function mainPhotoId(t) {
      if (t.avatarPhotoId) return t.avatarPhotoId;
      return t.photos && t.photos[0] ? t.photos[0].id : null;
    }

    function mainPhoto(t) {
      return (t.photos || []).find((p) => p.id === mainPhotoId(t)) || (t.photos || [])[0] || null;
    }

    function avatar(t, size = 'h-14 w-14', text = 'text-[18px]') {
      const initial = (t.name || '?').trim().charAt(0).toUpperCase() || '?';
      const photo = mainPhoto(t);
      const src = t.avatarDataUrl || (photo ? photo.dataUrl : '');
      if (src) return `<img src="${esc(src)}" class="shrink-0 rounded-full object-cover ring-1 ring-slate-200 ${size}" alt="">`;
      return `<span class="${size} grid shrink-0 place-items-center rounded-full bg-indigo-50 ${text} font-bold text-indigo-700 ring-1 ring-indigo-100">${esc(initial)}</span>`;
    }

    function levelBadge(level) {
      const map = {
        Senior: 'border-indigo-200 bg-indigo-50 text-indigo-700',
        Standard: 'border-slate-200 bg-slate-100 text-slate-600',
        Junior: 'border-slate-200 bg-slate-50 text-slate-500'
      };
      return `<span class="inline-flex shrink-0 items-center rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${map[level] || map.Standard}">${esc(level)}</span>`;
    }

    function qrSvg(seed) {
      const n = 9;
      let h = 0;
      for (const ch of String(seed)) h = (h * 131 + ch.charCodeAt(0)) >>> 0;
      const isFinder = (x, y, ox, oy) => x >= ox && x < ox + 3 && y >= oy && y < oy + 3
        && (x === ox || x === ox + 2 || y === oy || y === oy + 2 || (x === ox + 1 && y === oy + 1));
      let rects = '';
      for (let y = 0; y < n; y++) {
        for (let x = 0; x < n; x++) {
          const on = isFinder(x, y, 0, 0) || isFinder(x, y, 6, 0) || isFinder(x, y, 0, 6)
            ? true
            : ((h >> ((x + y * 3) % 30)) & 1) === 1;
          if (on) rects += `<rect x="${x * 10}" y="${y * 10}" width="10" height="10"/>`;
        }
      }
      return `<svg viewBox="0 0 90 90" class="h-full w-full text-slate-900" fill="currentColor" aria-hidden="true">${rects}</svg>`;
    }

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线只读：正在查看上次浏览的教师资料，预约需联网`
        : '';

      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = renderNav();
      $('overlay').innerHTML = renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function renderContentOnly() {
      $('content').innerHTML = renderContent();
      if (window.lucide) lucide.createIcons();
    }

    function renderBanner() {
      const title = state.page === 'detail'
        ? '教师履历'
        : (state.page === 'placeholder'
          ? ((NAVS.find((n) => n.id === state.navTab) || {}).label || '教师风采')
          : '教师风采');
      return `<header class="relative flex h-16 shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br from-slate-800 via-blue-900 to-slate-700 px-4 text-white">

        <div class="relative flex min-w-0 items-center gap-2">
          ${state.page === 'detail' ? `<button data-action="go-back" class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="返回选老师">${icon('chevron-left', 'h-4 w-4')}</button>` : ''}
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">A</span>
          <span class="truncate text-[18px] font-bold tracking-tight">${esc(title)}</span>
        </div>
        <button data-action="toast" data-message="暂无新消息" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">

        </button>
      </header>`;
    }

    function renderNav() {
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${NAVS.map((item) => {
            const on = state.navTab === item.id;

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const active = state[b.dataset.group] === b.dataset.value;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;

    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.page === 'detail') return renderDetail();
      return renderHall();
    }

    function renderPlaceholder() {
      const item = NAVS.find((n) => n.id === state.navTab);

    /* ------------------------------------------------------------------

     * ------------------------------------------------------------------ */
    function renderHall() {
      const list = state.filter === 'all' ? state.teachers : state.teachers.filter((t) => t.skills.includes(state.filter));
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('选老师', `为 ${state.child} 选外教 · 公开履历`)}
        ${childSelector()}
        <div class="flex gap-1.5 overflow-x-auto pb-1 [&::-webkit-scrollbar]:hidden">
          ${['all', ...COURSE_TYPES].map((c) => `<button data-action="set-filter" data-value="${esc(c)}" class="h-8 shrink-0 rounded-full border px-2.5 text-[12px] font-bold transition ${state.filter === c ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">${c === 'all' ? '全部科目' : esc(c)}</button>`).join('')}
        </div>
        <div class="flex items-center justify-between px-1">
          <span class="text-[14px] font-semibold text-slate-700">外教团队</span>
          <span class="text-[12px] font-medium text-slate-500">共 ${list.length} 位</span>
        </div>
        <div class="${grid}">
          ${list.length ? list.map(teacherCard).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-500">暂无符合该科目的教师</div>`}
        </div>
        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">公开履历已脱敏，不展示教师邮箱与课酬；弱网时可查看上次浏览的离线快照。</div>
      </div>`;
    }

    function childSelector() {
      return `<div class="rounded-2xl border border-slate-200/80 bg-white p-3 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-[12px] font-medium text-slate-500">当前选课宝贝</span>
          <span class="text-[12px] font-medium text-slate-500">多孩家庭</span>
        </div>
        <div class="mt-2 grid grid-cols-2 gap-2">
          ${PARENT_CHILDREN.map((ch) => {
            const on = ch.name === state.child;
            return `<button data-action="select-child" data-child="${ch.name}" class="flex h-10 items-center justify-center gap-1.5 rounded-xl text-[14px] font-semibold transition ${on ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
              <span class="grid h-6 w-6 place-items-center rounded-full text-[12px] font-bold ${on ? 'bg-white/15 text-white' : 'bg-white text-indigo-700'}">${esc(ch.name.charAt(0))}</span>${esc(ch.name)}
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function teacherCard(t) {
      return `<article data-action="open-teacher" data-id="${t.id}" role="button" tabindex="0" class="cursor-pointer rounded-2xl border border-slate-200/80 bg-white p-3.5 shadow-sm transition hover:border-indigo-200 active:scale-[0.995]">
        <div class="flex items-start gap-3">
          ${avatar(t, 'h-12 w-12', 'text-[16px]')}
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-1.5">
              <span class="truncate text-[16px] font-bold text-slate-900">${esc(t.name)}</span>
              ${levelBadge(t.level)}
            </div>
            <div class="mt-0.5 flex items-center gap-1.5 text-[12px] font-medium text-slate-500">
              <span class="inline-flex items-center rounded-full border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">可约</span>
              <span class="truncate">负责班长 ${esc(t.monitor)}</span>
            </div>
            <div class="mt-1 flex flex-wrap gap-1.5">
              ${t.skills.map((s) => `<span class="rounded-md border border-slate-200 bg-slate-50 px-1.5 py-0.5 text-[12px] font-semibold text-slate-600">${esc(s)}</span>`).join('')}
            </div>
          </div>
          ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-300')}
        </div>
        <p class="mt-2 line-clamp-2 text-[14px] font-medium leading-relaxed text-slate-600">${esc(t.introZh)}</p>
        <div class="mt-2 flex items-center justify-between gap-2 border-t border-slate-100 pt-2">
          <div class="flex min-w-0 items-center gap-2 text-[12px] font-medium text-slate-500">
            <span class="inline-flex items-center gap-1">${icon('images', 'h-3.5 w-3.5')}${(t.photos || []).length} 张</span>
            <span class="inline-flex items-center gap-1">${icon('play', 'h-3.5 w-3.5')}${esc(t.videoDuration)}</span>
          </div>
          <div class="flex shrink-0 items-center gap-1.5">
            <button data-action="open-qr" data-id="${t.id}" class="grid h-8 w-8 place-items-center rounded-lg border border-slate-200 bg-slate-100 text-slate-600 hover:bg-slate-200" aria-label="ClassIn 二维码">${icon('qr-code', 'h-4 w-4')}</button>
            <button data-action="open-teacher" data-id="${t.id}" class="h-8 rounded-lg border border-slate-200 bg-slate-100 px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-200">查看履历</button>
            <button data-action="book" data-id="${t.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 rounded-lg bg-indigo-600 px-2.5 text-[12px] font-bold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">预约</button>
          </div>
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 教师详情
     * ------------------------------------------------------------------ */
    function renderDetail() {
      const t = activeTeacher();
      const isZh = state.lang === 'zh';
      const intro = isZh ? t.introZh : t.introEn;
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
          <div class="flex items-start gap-3.5">
            ${avatar(t, 'h-16 w-16', 'text-[18px]')}
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-1.5">
                <h1 class="truncate text-[18px] font-bold tracking-tight text-slate-900">${esc(t.name)}</h1>
                ${levelBadge(t.level)}
                <span class="shrink-0 rounded-full border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">可约</span>
              </div>
              <div class="mt-1 text-[12px] font-medium text-slate-500">负责班长 ${esc(t.monitor)}</div>
              <div class="mt-1.5 flex flex-wrap gap-1.5">
                ${t.skills.map((s) => `<span class="rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-semibold text-indigo-700">${esc(s)}</span>`).join('')}
              </div>
            </div>
          </div>
        </section>

        ${renderPhotoGrid(t)}

        <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-[16px] font-bold text-slate-900">教师简介</h2>
            <div class="inline-flex rounded-xl bg-slate-100 p-1">
              <button data-action="set-lang" data-lang="zh" class="h-8 rounded-lg px-2.5 text-[12px] font-bold ${isZh ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">中文</button>
              <button data-action="set-lang" data-lang="en" class="h-8 rounded-lg px-2.5 text-[12px] font-bold ${!isZh ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">English</button>
            </div>
          </div>
          <p id="introText" class="mt-2.5 whitespace-pre-line text-[14px] font-medium leading-relaxed text-slate-700">${esc(intro)}</p>
        </section>

        <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
          <div class="flex items-center justify-between">
            <h2 class="text-[16px] font-bold text-slate-900">试讲视频</h2>
            <span class="font-mono text-[12px] font-medium text-slate-500">${esc(t.videoDuration)}</span>
          </div>
          <div class="mt-2.5 overflow-hidden rounded-xl border border-slate-200">
            ${state.playingVideo
              ? `<video controls autoplay playsinline class="aspect-video w-full bg-black" src="${esc(t.videoUrl)}"></video>`
              : `<button data-action="play-video" class="block w-full">
                <div class="relative flex aspect-video w-full items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-950 to-indigo-700">
                  <span class="grid h-12 w-12 place-items-center rounded-full bg-white/15 text-white ring-1 ring-white/30">${icon('play', 'ml-0.5 h-6 w-6')}</span>
                  <span class="absolute bottom-2 right-2 rounded-md bg-slate-900/80 px-1.5 py-0.5 font-mono text-[12px] font-semibold text-white">${esc(t.videoDuration)}</span>
                </div>
                <div class="flex items-center justify-between bg-white px-2.5 py-2">
                  <span class="text-[14px] font-semibold text-slate-800">点击就地播放试讲视频</span>
                  <span class="text-[12px] font-medium text-slate-500">MP4</span>
                </div>
              </button>`}
          </div>
          <p class="mt-1.5 text-[12px] font-medium text-slate-500">教师试讲视频 · MP4 格式 · 支持全屏播放</p>
        </section>

        <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
          <div class="flex items-center justify-between">
            <h2 class="text-[16px] font-bold text-slate-900">ClassIn 二维码</h2>
            <span class="text-[12px] font-medium text-slate-500">点击放大</span>
          </div>
          <button data-action="open-qr" data-id="${t.id}" class="mt-2.5 flex w-full items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 p-2.5 text-left">
            <span class="grid h-14 w-14 shrink-0 place-items-center rounded-lg bg-white p-1 ring-1 ring-slate-200">${qrSvg(t.name)}</span>
            <span class="min-w-0">
              <span class="block truncate text-[14px] font-semibold text-slate-800">${esc(t.name)} · ClassIn</span>
              <span class="mt-0.5 block text-[12px] font-medium text-slate-500">长按识别或截图，使用 ClassIn App 扫码添加</span>
            </span>
          </button>
        </section>

        <button data-action="book" data-id="${t.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">为 ${esc(state.child)} 预约 ${esc(t.name)}</button>
        <div class="rounded-xl border border-indigo-100 bg-indigo-50/70 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900">公开履历已脱敏；预约将打开该教师的可约时段。</div>
      </div>`;
    }

    function renderPhotoGrid(t) {
      const photos = t.photos || [];
      if (!photos.length) return '';
      const mainId = mainPhotoId(t);
      const capacity = state.device === 'tablet' ? 9 : 4;
      const overflow = photos.length > capacity;
      const shown = overflow ? photos.slice(0, capacity) : photos;
      const cols = state.device === 'tablet' ? 'grid-cols-3' : 'grid-cols-2';
      const remain = photos.length - capacity + 1;
      return `<section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <h2 class="text-[16px] font-bold text-slate-900">教师风采相册</h2>
          <span class="text-[12px] font-medium text-slate-500">共 ${photos.length} 张 · 点击看大图</span>
        </div>
        <div class="mt-2.5 grid ${cols} gap-1.5">
          ${shown.map((p, i) => {
            const isLastSlot = overflow && i === capacity - 1;
            return `<button data-action="open-photo" data-id="${t.id}" data-index="${i}" class="relative aspect-square overflow-hidden rounded-lg border border-slate-200 bg-slate-100" aria-label="${isLastSlot ? `查看其余 ${remain} 张照片` : `查看第 ${i + 1} 张风采照片`}">
              <img src="${p.dataUrl}" class="h-full w-full object-cover" alt="">
              ${p.id === mainId && !isLastSlot ? '<span class="absolute left-1 top-1 rounded bg-indigo-600 px-1 py-0.5 text-[12px] font-bold text-white">主头像</span>' : ''}
              ${isLastSlot ? `<span class="absolute inset-0 grid place-items-center bg-slate-900/60 text-[18px] font-bold text-white">+${remain}</span>` : ''}
            </button>`;
          }).join('')}
        </div>
        <p class="mt-1.5 text-[12px] font-medium text-slate-500">点击任意缩略图全屏查看，支持左右切换与双指 / 双击缩放。</p>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'photo') return renderPhotoLightbox();
      if (state.overlay.type === 'qr') return renderQrModal();
      return '';
    }

    function renderQrModal() {
      const t = teacherById(state.overlay.teacherId);
      if (!t) return '';
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-6 top-1/2 mx-auto max-w-[340px] -translate-y-1/2 rounded-2xl bg-white p-4 text-center shadow-2xl">
          <div class="flex justify-end">
            <button data-action="close-overlay" class="grid h-8 w-8 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="mx-auto mt-1 h-56 w-56 rounded-2xl border border-slate-200 bg-white p-3">${qrSvg(t.name)}</div>
          <div class="mt-3 text-[16px] font-bold text-slate-900">${esc(t.name)}</div>
          <p class="mt-1 text-[12px] font-medium text-slate-500">长按识别 / 使用 ClassIn 扫码添加</p>
          <p class="mt-1 text-[12px] font-medium text-slate-600">添加后可在 ClassIn 中直接沟通上课安排</p>
        </div>
      </div>`;
    }

    function renderPhotoLightbox() {
      const t = teacherById(state.overlay.teacherId);
      const photos = (t && t.photos) || [];
      if (!photos.length) return '';
      const total = photos.length;
      const index = ((state.overlay.index % total) + total) % total;
      const photo = photos[index];
      const mainId = mainPhotoId(t);
      const zoom = !!state.overlay.zoom;
      return `<div class="absolute inset-0 z-[70] overflow-hidden bg-slate-950/95">
        <div class="absolute inset-0" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 top-0 z-10 flex items-start justify-between gap-3 px-4 py-3">
          <div class="min-w-0 text-white">
            <div class="truncate text-[14px] font-bold">${esc(t.name)} · 风采相册</div>
            <div class="mt-1 flex items-center gap-1.5 text-[12px] font-medium text-slate-300">
              ${photo.id === mainId ? '<span class="rounded bg-indigo-500 px-1.5 py-0.5 text-[12px] font-bold text-white">主头像</span>' : ''}
              <span>生活 / 教学照片</span>
            </div>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <button data-action="zoom-photo" class="grid h-9 w-9 place-items-center rounded-xl bg-white/10 text-white hover:bg-white/20" aria-label="${zoom ? '还原大图' : '放大查看'}">${icon(zoom ? 'zoom-out' : 'zoom-in', 'h-5 w-5')}</button>
            <span class="rounded-full bg-white/10 px-2.5 py-1 font-mono text-[12px] font-semibold text-white">${index + 1} / ${total}</span>
            <button data-action="close-overlay" class="grid h-9 w-9 place-items-center rounded-xl bg-white/10 text-white hover:bg-white/20" aria-label="关闭大图">${icon('x', 'h-5 w-5')}</button>
          </div>
        </div>
        <div class="pointer-events-none relative z-10 flex h-full items-center justify-center px-4 pb-20 pt-20">
          <img data-action="zoom-photo" src="${photo.dataUrl}" class="pointer-events-auto max-h-full max-w-full ${zoom ? 'scale-150 cursor-zoom-out' : 'cursor-zoom-in'} rounded-xl object-contain shadow-2xl transition-transform duration-200" alt="">
        </div>
        ${total > 1 ? `<button data-action="photo-prev" class="absolute left-3 top-1/2 z-10 grid h-11 w-11 -translate-y-1/2 place-items-center rounded-full bg-white/10 text-white backdrop-blur hover:bg-white/20" aria-label="上一张">${icon('chevron-left', 'h-6 w-6')}</button>
        <button data-action="photo-next" class="absolute right-3 top-1/2 z-10 grid h-11 w-11 -translate-y-1/2 place-items-center rounded-full bg-white/10 text-white backdrop-blur hover:bg-white/20" aria-label="下一张">${icon('chevron-right', 'h-6 w-6')}</button>` : ''}
        <div class="pointer-events-none absolute inset-x-0 bottom-0 z-10 px-4 py-3 text-center text-[12px] font-medium text-slate-300">双击图片或双指缩放 · 点击暗色背景或按 Esc 退出${total > 1 ? ' · 使用 ← → 切换照片' : ''}</div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    function openTeacher(id) {
      state.activeTeacherId = id;
      state.page = 'detail';
      state.navTab = hallTab();
      state.playingVideo = false;
      state.lang = 'zh';
      state.overlay = null;
      renderAll();
    }

    function hallTab() {
      return 'hall';
    }

    function navTo(tab) {
      const item = NAVS.find((n) => n.id === tab);
      if (!item) return;
      state.navTab = tab;
      state.page = item.board ? 'hall' : 'placeholder';
      state.playingVideo = false;
      state.overlay = null;
      renderAll();
    }

    function book(id) {
      if (state.online === 'off') return showToast('离线模式下不可预约，请联网后重试');
      const t = teacherById(id);
      showToast(`正在打开 ${t.name} 的周度排班网格...`);
      setTimeout(() => {
        const teacherKey = t.id.replace('tc_', '').replace(/\d+$/, '');
        window.location.href = `m3a_calendar_grid.html?role=parent&view=calendar&teacher=${encodeURIComponent(teacherKey)}&teacher_name=${encodeURIComponent(t.name)}&child=${encodeURIComponent(state.child)}`;
      }, 350);
    }

    function setLang(lang) {
      state.lang = lang;
      const t = activeTeacher();
      const text = $('introText');
      if (text) text.textContent = lang === 'zh' ? t.introZh : t.introEn;
      document.querySelectorAll('[data-action="set-lang"]').forEach((b) => {
        const on = b.dataset.lang === lang;
        b.className = `h-8 rounded-lg px-2.5 text-[12px] font-bold ${on ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}`;
      });
    }

    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'go-back') { state.page = 'hall'; state.navTab = 'hall'; state.playingVideo = false; state.overlay = null; return renderAll(); }
      if (action === 'set-filter') { state.filter = el.dataset.value; return renderContentOnly(); }
      if (action === 'select-child') { state.child = el.dataset.child; return renderContentOnly(); }
      if (action === 'open-teacher') return openTeacher(el.dataset.id);
      if (action === 'open-qr') {
        state.overlay = { type: 'qr', teacherId: el.dataset.id };
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'open-photo') {
        state.overlay = { type: 'photo', teacherId: el.dataset.id, index: Number(el.dataset.index) || 0, zoom: false };
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'zoom-photo') {
        if (!state.overlay || state.overlay.type !== 'photo') return;
        state.overlay.zoom = !state.overlay.zoom;
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'photo-prev' || action === 'photo-next') {
        if (!state.overlay || state.overlay.type !== 'photo') return;
        const t = teacherById(state.overlay.teacherId);
        const total = (t && t.photos && t.photos.length) || 0;
        if (!total) return;
        state.overlay.index = (state.overlay.index + (action === 'photo-next' ? 1 : -1) + total) % total;
        state.overlay.zoom = false;
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'close-overlay') {
        state.overlay = null;
        $('overlay').innerHTML = '';
        return;
      }
      if (action === 'set-lang') return setLang(el.dataset.lang);
      if (action === 'play-video') { state.playingVideo = true; return renderContentOnly(); }
      if (action === 'book') return book(el.dataset.id);
    });

    document.addEventListener('keydown', (e) => {
      if (!state.overlay || state.overlay.type !== 'photo') return;
      const t = teacherById(state.overlay.teacherId);
      const total = (t && t.photos && t.photos.length) || 0;
      if (e.key === 'Escape') {
        state.overlay = null;
        $('overlay').innerHTML = '';
      } else if (total > 1 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        e.preventDefault();
        state.overlay.index = (state.overlay.index + (e.key === 'ArrowRight' ? 1 : -1) + total) % total;
        state.overlay.zoom = false;
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
      }
    });

    document.getElementById('btnResetDemo').addEventListener('click', () => {
      state.page = 'hall'; state.navTab = 'hall'; state.device = 'mobile'; state.online = 'on';
      state.teachers = clone(TEACHERS);
      state.activeTeacherId = 'tc_david0001';
      state.child = 'AliceZ12'; state.filter = 'all'; state.lang = 'zh';
      state.playingVideo = false; state.overlay = null;
      renderAll();
      showToast('演示数据已重置');
    });

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          renderAll();
          if (value === 'off') showToast('离线只读：预约需联网');
        }
      });
    });

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    renderAll();
  </script>
</body>
</html>

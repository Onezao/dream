      role: 'monitor',
      page: 'list',
      navTab: 'ops',
      device: 'mobile',
      online: 'on',
      orders: clone(INITIAL_ORDERS),
      refunds: clone(INITIAL_REFUNDS),
      activeRefundId: null,
      statusFilter: 'all',
      query: '',
      parentChild: 'alice',
      overlay: null,
      create: emptyCreate(),
      confirm: { refundId: null, proofs: [] },
      cancel: { refundId: null, reason: '', error: '' }
    };

    const $ = (id) => document.getElementById(id);
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const fmtSize = (n) => (n >= 1024 * 1024 ? `${(n / 1024 / 1024).toFixed(1)}MB` : `${Math.max(1, Math.round(n / 1024))}KB`);

    function roleMeta() { return ROLE_META[state.role]; }
    function navItems() { return NAVS[state.role]; }
    function boardTab() { return roleMeta().boardTab; }
    function actor() { return state.role === 'admin' ? 'Sarah' : state.role === 'monitor' ? 'Leo' : 'Amy'; }
    function studentName(key) { const s = STUDENTS.find((x) => x.key === key); return s ? s.name : key; }
    function orderById(id) { return state.orders.find((o) => o.id === id) || null; }
    function refundById(id) { return state.refunds.find((r) => r.id === id) || null; }
    function tsById(id) { return state.orders.flatMap((o) => o.ts).find((t) => t.id === id) || null; }

    function scopedRefunds() {
      let list = state.refunds;
      if (state.role === 'monitor') list = list.filter((r) => r.holder === 'Leo');
      if (state.role === 'parent') list = list.filter((r) => r.studentKey === state.parentChild);
      return list;
    }

    function filteredRefunds() {
      let list = scopedRefunds();
      if (state.statusFilter !== 'all') list = list.filter((r) => r.status === state.statusFilter);
      const q = state.query.trim().toLowerCase();
      if (q) list = list.filter((r) => [r.id, r.student, ...(r.orderIds || [])].join(' ').toLowerCase().includes(q));
      return list;
    }

    function statusMeta(s) {
      if (s === 'PENDING_REFUND') return { label: '待打款确认', tone: 'amber' };
      if (s === 'REFUNDED') return { label: '已退款', tone: 'emerald' };
      return { label: '已作废', tone: 'slate' };
    }

    function tsStatusLabel(t) {
      if (t.status === 'PENDING_SCHEDULE') return '待排期';
      if (t.status === 'SCHEDULED') return '已排期';
      if (t.status === 'REFUND_LOCKED') return '退款锁定';
      if (t.status === 'CANCELLED') return '已取消';
      if (t.status === 'FINISHED') return '已结课';
      return t.status;
    }

    function tsMeta(t) {
      const status = tsStatusLabel(t);
      if (!t.teacher || t.teacher === '—') return `${status} · 尚未排定教师`;
      return `${status} · ${t.teacher} · ${t.time}`;
    }

    function eligible(t) {
      if (!t || t.transferred || t.status === 'REFUND_LOCKED' || t.status === 'FINISHED' || t.status === 'CANCELLED') return false;
      if (t.status === 'PENDING_SCHEDULE') return true;
      return t.status === 'SCHEDULED' && (t.hours === null || t.hours >= 24);
    }

    function blockReason(t) {
      if (t.transferred) return '已跨家长转让，不可原路退款';
      if (t.status === 'REFUND_LOCKED') return '已被其他未完结退款单锁定';
      if (t.status === 'SCHEDULED' && t.hours < 24) return '开课前 24 小时内禁止退款';
      if (t.status === 'FINISHED') return '已结课，不可退款';
      if (t.status === 'CANCELLED') return '课次已取消';
      return '';
    }

    function splitPenalty(penalty, salaryBase, toolBase) {
      if (!penalty) return { pT: 0, pTool: 0 };
      if (salaryBase + toolBase <= 0) return { pT: 0, pTool: penalty };
      const pT = Math.floor(penalty * salaryBase / (salaryBase + toolBase));
      return { pT, pTool: penalty - pT };
    }

    function canView(r) {
      if (!r) return false;
      if (state.role === 'admin') return true;
      if (state.role === 'monitor') return r.holder === 'Leo';
      return r.studentKey === state.parentChild;
    }

    function canOperate(r) {
      if (!r || state.role === 'parent') return false;
      if (state.role === 'monitor') return r.holder === 'Leo';
      return true;
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线只读：录单 / 确认 / 作废 / 凭证上传不可用');
        }
      });
    });
    $('btnResetDemo').addEventListener('click', resetDemo);

    function setRole(role) {
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.page = 'list';
      state.navTab = boardTab();
      state.statusFilter = 'all';
      state.query = '';
      state.overlay = null;
      state.create = emptyCreate();
      state.confirm = { refundId: null, proofs: [] };
      state.cancel = { refundId: null, reason: '', error: '' };
      renderAll();
    }

    function navTo(tab) {
      const item = navItems().find((n) => n.id === tab);
      if (!item) return;
      state.navTab = tab;
      state.page = item.board ? 'list' : 'placeholder';
      state.overlay = null;
      renderAll();
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const active = state[b.dataset.group] === b.dataset.value;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;
      });
    }

    function resetDemo() {
      state.orders = clone(INITIAL_ORDERS);
      state.refunds = clone(INITIAL_REFUNDS);
      state.role = 'monitor';
      state.page = 'list';
      state.navTab = 'ops';
      state.device = 'mobile';
      state.online = 'on';
      state.activeRefundId = null;
      state.statusFilter = 'all';
      state.query = '';
      state.parentChild = 'alice';
      state.overlay = null;
      state.create = emptyCreate();
      state.confirm = { refundId: null, proofs: [] };
      state.cancel = { refundId: null, reason: '', error: '' };
      renderAll();
      showToast('演示数据已重置');
    }

    /* ------------------------------------------------------------------
     * 外壳
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;
      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线只读：可查看退款记录，录单 / 确认 / 作废 / 凭证上传不可用`
        : '';

      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = renderNav();
      renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function renderContentOnly() {
      $('content').innerHTML = renderContent();
      if (window.lucide) lucide.createIcons();
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.page === 'detail') {
        const r = refundById(state.activeRefundId);
        if (!r || !canView(r)) return renderList();
        return renderDetail(r);
      }
      return renderList();
    }

    function renderBanner() {
      const m = roleMeta();
      return `<header class="relative flex h-[68px] shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${m.banner} px-4 text-white">
        ${PATTERNS[state.role]}
        <div class="relative flex min-w-0 items-center gap-2.5">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${m.initial}</span>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="truncate text-[16px] font-bold">${esc(m.brand)}</span>
              <span class="shrink-0 rounded-full bg-white/20 px-2 py-0.5 text-[12px] font-bold">${esc(m.role)}</span>
            </div>
            <div class="truncate text-[12px] text-white/70">${esc(m.subtitle)}</div>
          </div>
        </div>
        <button data-action="toast" data-message="暂无新消息" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
          ${icon('bell', 'h-4 w-4')}
          <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-rose-400 ring-1 ring-white/50"></span>
        </button>
      </header>`;
    }

    function backRow(action, label) {
      return `<button data-action="${action}" class="flex items-center gap-1 text-[14px] font-semibold text-slate-500 transition hover:text-slate-800">${icon('chevron-left', 'h-4 w-4')}${esc(label)}</button>`;
    }

    function pendingCount() {
      return scopedRefunds().filter((r) => r.status === 'PENDING_REFUND').length;
    }

    function renderNav() {
      const pending = pendingCount();
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${navItems().map((item) => {
            const on = state.navTab === item.id;
            const dot = item.board && pending > 0 ? '<span class="absolute -right-1 -top-0.5 h-1.5 w-1.5 rounded-full bg-rose-500 ring-2 ring-white"></span>' : '';
            return `<button data-action="nav" data-tab="${item.id}" ${on ? 'aria-current="page"' : ''} class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-400'}">
              <span class="relative">${icon(item.icon, 'h-[18px] w-[18px]')}${dot}</span>
              <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderPlaceholder() {
      const item = navItems().find((n) => n.id === state.navTab);
      if (!item) return `<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>`;
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">打开对应原型</a>` : ''}
        <button data-action="nav" data-tab="${boardTab()}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回退款管理</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 退款单列表
     * ------------------------------------------------------------------ */
    function miniStat(label, value, tone) {
      const T = TONES[tone];
      return `<div class="rounded-xl border px-2.5 py-2 ${T.card}">
        <div class="text-[12px] font-medium ${T.sub}">${esc(label)}</div>
        <div class="mt-0.5 font-mono text-[18px] font-bold ${T.right}">${esc(value)}</div>
      </div>`;
    }

    function pageHeader(title, subtitle, right = '') {
      return `<div class="flex items-end justify-between gap-3 px-1">
        <div class="min-w-0">
          <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(title)}</h1>
          <p class="mt-0.5 text-[12px] font-medium text-slate-400">${esc(subtitle)}</p>
        </div>
        ${right}
      </div>`;
    }

    function renderList() {
      const scoped = scopedRefunds();
      const pending = scoped.filter((r) => r.status === 'PENDING_REFUND').length;
      const refunded = scoped.filter((r) => r.status === 'REFUNDED').length;
      const cancelled = scoped.filter((r) => r.status === 'CANCELLED').length;
      const list = filteredRefunds();
      const isParent = state.role === 'parent';
      const isAdmin = state.role === 'admin';
      const canCreate = !isParent && state.online === 'on';
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader(
          isParent ? '我的退款记录' : isAdmin ? '退款审计' : '退款管理',
          isParent ? `只读 · 当前 ${studentName(state.parentChild)}` : isAdmin ? '全平台退款单据 · 凭证审计' : `资金持有人 Leo · 待打款 ${pending} 单`,
          isParent ? '' : `<button data-action="open-create" ${canCreate ? '' : 'disabled'} class="h-8 shrink-0 rounded-lg bg-indigo-600 px-3 text-[12px] font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">+ 新建退款单</button>`
        )}
        ${isParent ? childSelector() : ''}
        <div class="grid grid-cols-3 gap-2">
          ${miniStat('待打款确认', pending, 'amber')}
          ${miniStat('已退款', refunded, 'emerald')}
          ${miniStat('已作废', cancelled, 'slate')}
        </div>
        <div class="flex gap-1 rounded-2xl bg-slate-200/60 p-1">
          ${[['all', '全部'], ['PENDING_REFUND', '待打款'], ['REFUNDED', '已退款'], ['CANCELLED', '已作废']].map(([v, label]) => `<button data-action="set-status" data-value="${v}" class="flex-1 rounded-xl py-2 text-[12px] font-bold transition ${state.statusFilter === v ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">${label}</button>`).join('')}
        </div>
        <div class="relative">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">${icon('search', 'h-4 w-4')}</span>
          <input id="refundSearch" value="${esc(state.query)}" placeholder="搜索退款单号 / 学生昵称 / 原购课单号" class="h-11 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500">
        </div>
        <div id="refundList" class="${grid}">
          ${list.length ? list.map(renderRefundCard).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-400">暂无退款单记录</div>`}
        </div>
        <div class="rounded-xl border border-indigo-100 bg-indigo-50/70 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900">
          ${isParent ? '仅展示当前宝贝名下退款单，只读；如有疑问请联系负责班长。' : isAdmin ? '管理员可查看全平台退款单、打款凭证与审计日志；确认退款无需前置审批，但会即时触发审计邮件。' : '班长仅可经办本人持有购课单的退款；跨班长转让课次与开课前 24h 内课次不可退。'}
        </div>
      </div>`;
    }

    function childSelector() {
      return `<div class="rounded-2xl border border-slate-200/80 bg-white p-3 shadow-sm">
        <div class="flex items-center justify-between"><span class="text-[12px] font-medium text-slate-400">当前宝贝档案</span><span class="text-[12px] font-medium text-slate-400">只读</span></div>
        <div class="mt-2 grid grid-cols-2 gap-2">
          ${PARENT_CHILDREN.map((ch) => {
            const on = ch.key === state.parentChild;
            return `<button data-action="select-child" data-child="${ch.key}" class="flex h-10 items-center justify-center gap-1.5 rounded-xl text-[14px] font-semibold transition ${on ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
              <span class="grid h-6 w-6 place-items-center rounded-full text-[12px] font-bold ${on ? 'bg-white/15 text-white' : 'bg-white text-indigo-700'}">${esc(ch.name.charAt(0))}</span>${esc(ch.name)}
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderRefundCard(r) {
      const sm = statusMeta(r.status);
      const T = TONES[sm.tone];
      const isParent = state.role === 'parent';
      const orderIds = r.orderIds || [r.orderId];
      const typeText = r.type || (orderById(r.orderId) || {}).type || '';
      const canOp = !isParent && canOperate(r) && r.status === 'PENDING_REFUND';
      const offline = state.online === 'off';
      const actions = canOp
        ? `<button data-action="open-cancel" data-id="${r.id}" ${offline ? 'disabled' : ''} class="h-8 rounded-lg border border-slate-300 bg-white/70 px-2.5 text-[12px] font-bold text-slate-700 hover:bg-white disabled:opacity-40">作废</button>
           <button data-action="open-confirm" data-id="${r.id}" ${offline ? 'disabled' : ''} class="h-8 rounded-lg ${T.action} px-2.5 text-[12px] font-bold disabled:cursor-not-allowed disabled:opacity-50">上传凭证与确认</button>`
        : `<button data-action="open-refund" data-id="${r.id}" class="h-8 rounded-lg border ${SOFT_BTN[sm.tone]} px-2.5 text-[12px] font-bold">查看详情</button>`;
      return `<article data-action="open-refund" data-id="${r.id}" role="button" tabindex="0" class="cursor-pointer rounded-2xl border p-3.5 shadow-sm transition active:scale-[0.995] ${T.card}">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="truncate font-mono text-[14px] font-bold ${T.title}">${esc(r.id)}</span>
              ${r.churn ? `<span class="rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${T.chip}">退学全量清退</span>` : ''}
            </div>
            <div class="mt-0.5 truncate text-[14px] font-medium ${T.body}">${esc(r.student)} · ${r.n} 节${typeText ? ` · ${esc(typeText)}` : ''}</div>
            <div class="mt-0.5 truncate font-mono text-[12px] font-medium ${T.sub}">${esc(orderIds.join(' / '))}</div>
          </div>
          <span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${T.chip}">${sm.label}</span>
        </div>
        <div class="mt-2 grid grid-cols-3 gap-1 text-center">
          <div><div class="text-[12px] font-medium ${T.sub}">实付积分</div><div class="mt-0.5 font-mono text-[16px] font-bold ${T.title}">${r.total}</div></div>
          <div><div class="text-[12px] font-medium ${T.sub}">违约金</div><div class="mt-0.5 font-mono text-[16px] font-bold ${T.title}">${r.penalty}</div></div>
          <div><div class="text-[12px] font-medium ${T.sub}">实退积分</div><div class="mt-0.5 font-mono text-[16px] font-bold ${T.title}">${r.refund}</div></div>
        </div>
        <div class="mt-2 flex items-center justify-between gap-2 border-t border-black/5 pt-2">
          <div class="min-w-0 text-[12px] font-medium ${T.sub}">
            <div class="truncate">经办 ${esc(r.by)} · ${esc(r.at)}</div>
            <div class="truncate">凭证 ${r.proofs.length} 张${r.emailSent ? ' · 审计邮件已发' : ''}</div>
          </div>
          <div class="flex shrink-0 items-center gap-1.5">${actions}</div>
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 新建退款单
     * ------------------------------------------------------------------ */
    function studentsForRole() {
      return STUDENTS.filter((s) => ordersForStudent(s.key).length > 0);
    }

    function ordersForStudent(key) {
      return state.orders.filter((o) => o.studentKey === key && o.status === 'PAID' && (state.role === 'admin' || o.holder === 'Leo'));
    }

    function createOrders() {
      if (state.create.fullChurn) return ordersForStudent(state.create.studentKey);
      const o = orderById(state.create.orderId);
      return o ? [o] : [];
    }

    function createTsList() {
      return createOrders().flatMap((o) => o.ts.slice().reverse());
    }

    function createPickedTs() {
      const ids = new Set(state.create.picked);
      return createTsList().filter((t) => ids.has(t.id));
    }

    function createCalc() {
      const sel = createPickedTs();
      const total = sel.reduce((a, t) => a + t.points, 0);
      const sT = sel.reduce((a, t) => a + t.salary + t.prep, 0);
      const sTool = sel.reduce((a, t) => a + t.tool, 0);
      const raw = String(state.create.penalty).trim();
      const pen = Number(raw || 0);
      let err = '';
      if (!Number.isInteger(pen) || pen < 0) err = '违约金必须为不小于 0 的整数';
      else if (pen > total) err = '违约金不能大于勾选课次的总实付积分';
      const split = err ? { pT: 0, pTool: 0 } : splitPenalty(pen, sT, sTool);
      return { sel, total, sT, sTool, pen: err ? 0 : pen, err, pT: split.pT, pTool: split.pTool, refund: total - (err ? 0 : pen) };
    }

    function openCreate() {
      if (state.online === 'off') return showToast('离线模式下不可新建退款单');
      if (state.role === 'parent') return;
      const students = studentsForRole();
      if (!students.length) return showToast('当前无可退款的 PAID 购课单');
      const key = students[0].key;
      const first = ordersForStudent(key)[0];
      state.create = { studentKey: key, orderId: first ? first.id : null, picked: [], fullChurn: false, penalty: '0', reason: '', error: '' };
      state.overlay = { type: 'create' };
      renderAll();
    }

    function eligibleIdsAcrossCreateOrders() {
      return createTsList().filter(eligible).map((t) => t.id);
    }

    function renderCreateSheet() {
      const c = state.create;
      const orders = ordersForStudent(c.studentKey);
      const calc = createCalc();
      const inputCls = 'h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500';
      const canSubmit = state.online === 'on' && calc.sel.length > 0 && !calc.err && !!c.reason.trim();
      const tsSection = c.fullChurn
        ? createOrders().map((o) => `<div class="rounded-xl border border-slate-200">
            <div class="flex items-center justify-between gap-2 border-b border-slate-100 bg-slate-50 px-2.5 py-2">
              <span class="truncate font-mono text-[12px] font-semibold text-slate-600">${esc(o.id)}</span>
              <span class="shrink-0 text-[12px] font-medium text-slate-400">${esc(o.type)}</span>
            </div>
            <div class="divide-y divide-slate-100">${o.ts.slice().reverse().map(renderTsRow).join('')}</div>
          </div>`).join('')
        : `<div class="divide-y divide-slate-100 rounded-xl border border-slate-200">${createTsList().map(renderTsRow).join('')}</div>`;

      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 mx-auto flex max-h-[92%] w-full max-w-[560px] flex-col rounded-t-3xl bg-white p-4 shadow-2xl">
          <div class="mx-auto mb-2 h-1 w-10 shrink-0 rounded-full bg-slate-200"></div>
          <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 pb-2.5">
            <div>
              <h2 class="text-[16px] font-bold text-slate-900">新建退款单</h2>
              <p class="mt-0.5 text-[12px] font-medium text-slate-500">仅 1v1 · PAID 购课单 · 退学支持跨单全量清退</p>
            </div>
            <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="min-h-0 flex-1 overflow-y-auto py-3" data-scroll>
            <div class="space-y-3.5">
              <div>
                <label for="createStudent" class="mb-1 block text-[14px] font-semibold text-slate-700">学生档案</label>
                <select id="createStudent" class="${inputCls} bg-white font-medium">
                  ${studentsForRole().map((s) => `<option value="${s.key}" ${c.studentKey === s.key ? 'selected' : ''}>${esc(s.name)} · ${esc(s.tag)}</option>`).join('')}
                </select>
              </div>

              <label class="flex items-start justify-between gap-3 rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3 py-2.5">
                <span class="min-w-0">
                  <span class="block text-[14px] font-bold text-indigo-950">学员退学全量清退</span>
                  <span class="mt-0.5 block text-[12px] font-medium leading-relaxed text-indigo-900/85">跨全部 PAID 购课单聚合可退 TS，自动勾选；不足 24h 与已转让课次仍会被排除。</span>
                </span>
                <input id="fullChurn" type="checkbox" ${c.fullChurn ? 'checked' : ''} class="mt-0.5 h-4 w-4 shrink-0 accent-indigo-600">
              </label>

              ${c.fullChurn ? `<div class="rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3 py-2 text-[12px] font-medium leading-relaxed text-indigo-900">已开启跨购课单全量清退：共 ${createOrders().length} 张购课单、${createTsList().filter(eligible).length} 节可退 TS 已自动勾选。</div>` : `<div>
                <label class="mb-1 block text-[14px] font-semibold text-slate-700">原购课单</label>
                <div class="space-y-1.5">
                  ${orders.length ? orders.map((o) => `<button data-action="pick-order" data-id="${o.id}" class="w-full rounded-xl border px-2.5 py-2 text-left ${c.orderId === o.id ? 'border-indigo-300 bg-indigo-50' : 'border-slate-200 bg-white'}">
                    <div class="font-mono text-[12px] font-semibold text-slate-700">${esc(o.id)}</div>
                    <div class="mt-0.5 text-[12px] font-medium text-slate-500">${esc(o.type)} · 共 ${o.ts.length} 节 · 可退 ${o.ts.filter(eligible).length} 节</div>
                  </button>`).join('') : `<div class="rounded-xl border border-dashed border-slate-300 px-3 py-4 text-center text-[14px] font-medium text-slate-400">该学员暂无可退款的 PAID 购课单</div>`}
                </div>
              </div>`}

              <div>
                <div class="flex items-center justify-between">
                  <span class="text-[14px] font-semibold text-slate-700">勾选待退课次（LIFO 倒序）</span>
                  <button data-action="select-all-ts" class="text-[12px] font-bold text-indigo-600">全选可退</button>
                </div>
                <div class="mt-1.5 space-y-2">${tsSection}</div>
              </div>

              <div class="grid grid-cols-2 gap-2 rounded-xl border border-indigo-200/70 bg-indigo-50/80 p-2.5">
                <div class="rounded-lg bg-white/60 px-2.5 py-2">
                  <div class="text-[12px] font-medium text-indigo-700">已选课时</div>
                  <div id="createCount" class="mt-0.5 font-mono text-[18px] font-bold text-indigo-950">${calc.sel.length} 节</div>
                </div>
                <div class="rounded-lg bg-white/60 px-2.5 py-2">
                  <div class="text-[12px] font-medium text-indigo-700">实付积分小计</div>
                  <div id="createTotal" class="mt-0.5 font-mono text-[18px] font-bold text-indigo-950">${calc.total}</div>
                </div>
              </div>

              <div>
                <label for="penalty" class="mb-1 block text-[14px] font-semibold text-slate-700">扣除违约金（积分）</label>
                <div class="flex items-center gap-2">
                  <button data-action="penalty-step" data-delta="-10" class="h-10 w-10 rounded-lg border border-slate-200 bg-slate-100 text-[16px] font-bold text-slate-600">−</button>
                  <input id="penalty" type="number" min="0" step="1" value="${esc(c.penalty)}" class="h-11 flex-1 rounded-xl border border-slate-200 bg-white text-center text-[16px] font-bold text-slate-900 outline-none focus:border-indigo-500">
                  <button data-action="penalty-step" data-delta="10" class="h-10 w-10 rounded-lg border border-slate-200 bg-slate-100 text-[16px] font-bold text-slate-600">+</button>
                </div>
                <p id="createPenaltyErr" class="mt-1 text-[12px] font-medium text-rose-600 ${calc.err ? '' : 'hidden'}">${esc(calc.err)}</p>
              </div>

              <div id="createSplitBox" class="rounded-xl border border-amber-200/70 bg-amber-50/80 px-3 py-2.5 text-[12px] font-medium text-amber-900 ${calc.pen > 0 ? '' : 'hidden'}">
                <div class="flex justify-between"><span>教师课酬补偿</span><b id="splitTeacher" class="text-amber-950">${calc.pT} 分</b></div>
                <div class="flex justify-between"><span>平台工具费扣留</span><b id="splitTool" class="text-amber-950">${calc.pTool} 分</b></div>
                <div id="splitFormula" class="mt-1 leading-relaxed text-amber-700">课酬基准 ${calc.sT} : 工具费基准 ${calc.sTool}；教师向下取整，余数归平台，合计 ${calc.pen}</div>
              </div>

              <div class="rounded-xl border border-indigo-200/70 bg-indigo-50/80 p-3 text-center">
                <div class="text-[12px] font-medium text-indigo-700">实际应退积分（1 积分 = 1 元）</div>
                <div id="createRefund" class="mt-0.5 font-mono text-[18px] font-bold text-indigo-950">${calc.refund}</div>
              </div>

              <div>
                <label for="refundReason" class="mb-1 block text-[14px] font-semibold text-slate-700">退款原因（必填）</label>
                <textarea id="refundReason" rows="3" maxlength="200" placeholder="如：家庭搬迁 / 课业繁忙 / 录入有误……" class="h-24 w-full resize-none rounded-xl border border-slate-200 p-3 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500">${esc(c.reason)}</textarea>
                <p class="mt-1 text-[12px] font-medium text-slate-400">提交后所选 TS 进入退款锁定，禁止排课、挪位、请假与转让。</p>
              </div>

              ${c.error ? `<div class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[14px] font-medium text-rose-700">${esc(c.error)}</div>` : ''}
            </div>
          </div>
          <div class="flex shrink-0 gap-2 border-t border-slate-100 pt-3">
            <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
            <button id="btnCreateRefund" data-action="submit-create" ${canSubmit ? '' : 'disabled'} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">创建退款单</button>
          </div>
        </div>
      </div>`;
    }

    function renderTsRow(t) {
      const can = eligible(t);
      const picked = state.create.picked.includes(t.id);
      const reason = blockReason(t);
      const tone = t.transferred || (t.status === 'SCHEDULED' && t.hours < 24) ? 'rose' : 'slate';
      return `<label class="flex gap-3 px-3 py-2.5 ${can ? '' : 'opacity-60'}">
        <input data-action="toggle-ts" data-id="${t.id}" type="checkbox" ${can ? '' : 'disabled'} ${picked ? 'checked' : ''} class="mt-1 h-4 w-4 accent-indigo-600">
        <div class="min-w-0 flex-1">
          <div class="flex items-baseline justify-between gap-2">
            <span class="text-[14px] font-bold text-slate-800">TS #${t.no}</span>
            <span class="shrink-0 font-mono text-[14px] font-semibold text-slate-700">${t.points} 分${t.tail ? ' · 尾差' : ''}</span>
          </div>
          <div class="mt-0.5 truncate text-[12px] font-medium text-slate-500">${esc(tsMeta(t))}</div>
          ${reason ? `<div class="mt-1"><span class="rounded-md border px-1.5 py-0.5 text-[12px] font-semibold ${TONES[tone].chip}">${esc(reason)}</span></div>` : ''}
        </div>
      </label>`;
    }

    function refreshCreateCalc() {
      const calc = createCalc();
      const c = state.create;
      const set = (id, val) => { const el = $(id); if (el) el.textContent = val; };
      set('createCount', `${calc.sel.length} 节`);
      set('createTotal', String(calc.total));
      set('createRefund', String(calc.refund));
      const err = $('createPenaltyErr');
      if (err) { err.textContent = calc.err || ''; err.classList.toggle('hidden', !calc.err); }
      const split = $('createSplitBox');
      if (split) split.classList.toggle('hidden', !(calc.pen > 0));
      set('splitTeacher', `${calc.pT} 分`);
      set('splitTool', `${calc.pTool} 分`);
      set('splitFormula', `课酬基准 ${calc.sT} : 工具费基准 ${calc.sTool}；教师向下取整，余数归平台，合计 ${calc.pen}`);
      const btn = $('btnCreateRefund');
      if (btn) btn.disabled = state.online === 'off' || !calc.sel.length || !!calc.err || !c.reason.trim();
    }

    function nextRefundId() {
      const stamp = '261110';
      let seq = 1;
      state.refunds.forEach((r) => {
        const m = String(r.id).match(/^RF261110(\d{4})$/);
        if (m) seq = Math.max(seq, Number(m[1]) + 1);
      });
      return `RF${stamp}${String(seq).padStart(4, '0')}`;
    }

    function submitCreate() {
      if (state.online === 'off') return showToast('离线模式下不可新建退款单');
      const c = state.create;
      const calc = createCalc();
      const sel = calc.sel;
      if (!sel.length) return failCreate('请至少勾选 1 节可退 TS');
      if (calc.err) return failCreate(calc.err);
      if (!c.reason.trim()) return failCreate('请填写退款原因');
      const orders = [...new Set(sel.map((t) => t.orderId))].map(orderById).filter(Boolean);
      const id = nextRefundId();
      const holders = [...new Set(orders.map((o) => o.holder))];
      sel.forEach((t) => { t.prev = t.status; t.status = 'REFUND_LOCKED'; t.refundId = id; });
      state.refunds.unshift({
        id,
        orderIds: orders.map((o) => o.id),
        orderId: orders[0] ? orders[0].id : '',
        studentKey: c.studentKey,
        student: studentName(c.studentKey),
        type: orders.length > 1 ? '跨单清退' : orders[0] ? orders[0].type : '',
        holder: holders.join(' / ') || (state.role === 'admin' ? '平台' : 'Leo'),
        ts: sel.map((t) => t.id),
        n: sel.length,
        total: calc.total,
        penalty: calc.pen,
        pT: calc.pT,
        pTool: calc.pTool,
        refund: calc.refund,
        status: 'PENDING_REFUND',
        by: actor(),
        at: '刚刚',
        reason: c.reason.trim(),
        proofs: [],
        emailSent: false,
        churn: c.fullChurn,
        logs: [
          { at: '刚刚', by: actor(), action: '创建退款单', detail: `${sel.length} 个 TS 置为退款锁定，禁止排课 / 挪位 / 请假 / 转让`, ip: '10.0.8.23' }
        ]
      });
      state.overlay = null;
      state.statusFilter = 'all';
      state.page = 'list';
      state.navTab = boardTab();
      renderAll();
      showToast(`已创建退款单 · ${sel.length} 个 TS 已退款预锁定`);
    }

    function failCreate(msg) {
      state.create.error = msg;
      renderOverlay();
      if (window.lucide) lucide.createIcons();
      showToast(msg);
    }

    /* ------------------------------------------------------------------
     * 确认 / 作废
     * ------------------------------------------------------------------ */
    function modalShell(content) {
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-4 top-1/2 mx-auto max-h-[85%] max-w-[560px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl" data-scroll>${content}</div>
      </div>`;
    }

    function modalHeader(title, subtitle = '') {
      return `<div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
          ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
        </div>
        <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
      </div>`;
    }

    function renderConfirmModal() {
      const r = refundById(state.confirm.refundId);
      if (!r) return '';
      const proofs = state.confirm.proofs;
      return modalShell(`
        ${modalHeader('确认退款完成', `${r.id} · ${r.student} · ${r.n} 节`)}
        <div class="mt-2.5 rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3 py-2.5">
          <div class="flex items-end justify-between gap-2">
            <div class="text-[12px] font-medium text-indigo-700">本次应退积分（1 积分 = 1 元）</div>
            <div class="font-mono text-[18px] font-bold leading-none text-indigo-950">${r.refund}</div>
          </div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-indigo-900/85">请由资金持有方「${esc(r.holder)}」向出资家长线下打款：微信 / 支付宝 / 银行卡均可。</p>
        </div>
        <div class="mt-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-600">确认后所选 TS 立即核销作废并释放排课日历（🟢 空闲可约）；原购课单按剩余课次联动为「已退款 / 部分退款」，请假配额保持原值。</div>
        <div class="mt-2.5">
          <div class="flex items-center justify-between"><span class="text-[16px] font-semibold text-slate-800">打款凭证</span><span class="text-[12px] font-medium text-slate-400">${proofs.length}/5</span></div>
          <p class="mt-0.5 text-[12px] font-medium text-slate-400">JPG / PNG / PDF · 单文件 ≤10MB · 至少 1 张</p>
          <label class="mt-2 flex h-11 cursor-pointer items-center justify-center gap-2 rounded-xl border border-dashed border-slate-300 bg-white text-[14px] font-semibold text-slate-600">${icon('upload', 'h-4 w-4 text-slate-400')}选择凭证文件<input id="proofInput" type="file" accept="image/jpeg,image/png,application/pdf" class="hidden"></label>
          <button data-action="sample-proof" class="mt-1.5 text-[12px] font-bold text-indigo-600">使用示例凭证（原型）</button>
          <div class="mt-2 grid grid-cols-3 gap-2">
            ${proofs.map((p, i) => `<div class="rounded-lg border border-slate-200 bg-slate-50 px-2 py-2 text-center">
              <div class="truncate text-[12px] font-medium text-slate-600">${esc(p.name)}</div>
              <div class="mt-0.5 text-[12px] font-medium text-slate-400">${fmtSize(p.size)}</div>
              <button data-action="remove-proof" data-index="${i}" class="mt-1 text-[12px] font-bold text-rose-600">删除</button>
            </div>`).join('')}
          </div>
        </div>
        <p class="mt-2 text-[12px] font-medium leading-relaxed text-rose-600">确认后不可撤销，请确保已完成线下打款。</p>
        <div class="mt-3 flex gap-2">
          <button data-action="stash-proofs" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">暂存凭证</button>
          <button data-action="confirm-refund" ${state.online === 'off' || proofs.length < 1 ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认退款完成</button>
        </div>`);
    }

    function renderCancelModal() {
      const r = refundById(state.cancel.refundId);
      if (!r) return '';
      return modalShell(`
        ${modalHeader('作废退款单', `${r.id} · ${r.student} · ${r.n} 节`)}
        <p class="mt-2.5 text-[14px] font-medium leading-relaxed text-slate-600">作废后关联课次立即解除退款锁定，恢复退款前的「待排期 / 已排期」状态，可继续排课。</p>
        <div class="mt-2.5">
          <label for="cancelReason" class="mb-1 block text-[14px] font-semibold text-slate-700">作废原因 <span class="text-rose-500">*</span> <span class="text-[12px] font-normal text-slate-400">（1-200 字）</span></label>
          <textarea id="cancelReason" rows="3" maxlength="200" class="h-24 w-full resize-none rounded-xl border border-slate-200 p-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500">${esc(state.cancel.reason)}</textarea>
          ${state.cancel.error ? `<p class="mt-1 text-[12px] font-medium text-rose-600">${esc(state.cancel.error)}</p>` : ''}
        </div>
        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">返回</button>
          <button data-action="confirm-cancel" ${state.online === 'off' || !state.cancel.reason.trim() ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认作废</button>
        </div>`);
    }

    function renderOverlay() {
      const el = $('overlay');
      const prev = el.querySelector('[data-scroll]');
      const top = prev ? prev.scrollTop : 0;
      if (!state.overlay) el.innerHTML = '';
      else if (state.overlay.type === 'create') el.innerHTML = renderCreateSheet();
      else if (state.overlay.type === 'confirm') el.innerHTML = renderConfirmModal();
      else if (state.overlay.type === 'cancel') el.innerHTML = renderCancelModal();
      else el.innerHTML = '';
      const next = el.querySelector('[data-scroll]');
      if (next) next.scrollTop = top;
    }

    function pushLog(r, action, detail, by = actor(), ip = '10.0.8.23') {
      if (!r.logs) r.logs = [];
      r.logs.push({ at: '刚刚', by, action, detail, ip });
    }

    function openConfirm(id) {
      if (state.online === 'off') return showToast('离线模式下不可确认退款');
      const r = refundById(id);
      if (!canOperate(r) || r.status !== 'PENDING_REFUND') return showToast('当前单据不可确认或已终态');
      state.confirm = { refundId: id, proofs: [...r.proofs] };
      state.overlay = { type: 'confirm' };
      renderAll();
    }

    function confirmRefund() {
      if (state.online === 'off') return showToast('离线模式下不可确认退款');
      const r = refundById(state.confirm.refundId);
      if (!r || !canOperate(r)) return;
      if (r.status !== 'PENDING_REFUND') {
        state.overlay = null;
        renderAll();
        return showToast('单据已处于终态（409 幂等拦截）');
      }
      if (!state.confirm.proofs.length) return showToast('至少上传 1 张打款凭证');
      r.status = 'REFUNDED';
      r.proofs = [...state.confirm.proofs];
      r.at = '刚刚';
      r.emailSent = true;
      const touched = new Set();
      r.ts.forEach((id) => {
        const t = tsById(id);
        if (!t) return;
        t.status = 'CANCELLED';
        t.prev = null;
        touched.add(t.orderId);
      });
      touched.forEach((oid) => {
        const o = orderById(oid);
        if (!o) return;
        const left = o.ts.filter((t) => !['CANCELLED', 'FINISHED'].includes(t.status)).length;
        o.status = left === 0 ? 'REFUNDED' : 'PAID';
        o.partial = left > 0;
      });
      pushLog(r, '确认退款完成', `TS 原子核销 ${r.ts.length} 节，教师日历网格恢复为 🟢 空闲可约，请假配额保持原值`);
      pushLog(r, '管理员审计邮件已触发', '收件人：平台管理员审计邮箱（5 秒内派发，失败自动重试 3 次）', '系统', 'system');
      state.overlay = null;
      renderAll();
      showToast('已确认退款 · TS 已核销、日历已释放、审计邮件已触发、请假配额保持原值');
    }

    function openCancel(id) {
      if (state.online === 'off') return showToast('离线模式下不可作废');
      const r = refundById(id);
      if (!canOperate(r) || r.status !== 'PENDING_REFUND') return showToast('当前单据不可作废或已终态');
      state.cancel = { refundId: id, reason: '', error: '' };
      state.overlay = { type: 'cancel' };
      renderAll();
    }

    function confirmCancel() {
      if (state.online === 'off') return showToast('离线模式下不可作废');
      const r = refundById(state.cancel.refundId);
      if (!r || !canOperate(r)) return;
      if (r.status !== 'PENDING_REFUND') {
        state.overlay = null;
        renderAll();
        return showToast('单据已处于终态（409 幂等拦截）');
      }
      const reason = state.cancel.reason.trim();
      if (!reason) {
        state.cancel.error = '请填写作废原因';
        renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
      r.status = 'CANCELLED';
      r.cancelReason = reason;
      r.at = '刚刚';
      r.ts.forEach((id) => {
        const t = tsById(id);
        if (!t) return;
        t.status = t.prev || (t.hours === null ? 'PENDING_SCHEDULE' : 'SCHEDULED');
        t.prev = null;
        t.refundId = null;
      });
      pushLog(r, '作废退款单', `关联 TS 解除退款锁定，恢复为「${r.ts.map((id) => { const t = tsById(id); return t ? tsStatusLabel(t) : ''; }).filter(Boolean).join(' / ')}」`);
      state.overlay = null;
      renderAll();
      showToast('已作废退款单 · 关联 TS 已解除锁定并恢复可用');
    }

    /* ------------------------------------------------------------------
     * 详情
     * ------------------------------------------------------------------ */
    function openDetail(id) {
      state.activeRefundId = id;
      state.page = 'detail';
      state.navTab = boardTab();
      state.overlay = null;
      renderAll();
    }

    function orderRefundState(o) {
      if (!o) return '历史单据';
      if (o.status === 'REFUNDED') return '已全额退款';
      if (o.partial) return '部分退款 · 保持 PAID';
      return '已购课';
    }

    function renderDetail(r) {
      const sm = statusMeta(r.status);
      const T = TONES[sm.tone];
      const isParent = state.role === 'parent';
      const canOp = canOperate(r) && r.status === 'PENDING_REFUND';
      const tsRows = r.ts.map((id) => tsById(id)).filter(Boolean);
      const orders = [...new Set((r.orderIds || [r.orderId]).filter(Boolean))];
      const logs = r.logs || [];
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        ${backRow('go-back', '退款管理')}
        <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <h1 class="truncate font-mono text-[18px] font-bold tracking-tight text-slate-900">${esc(r.id)}</h1>
              <div class="mt-0.5 flex flex-wrap items-center gap-1.5">
                <span class="text-[14px] font-medium text-slate-600">${esc(r.student)} · ${r.n} 节</span>
                ${r.churn ? `<span class="rounded-full border border-indigo-200 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">退学全量清退</span>` : ''}
              </div>
              <div class="mt-0.5 text-[12px] font-medium text-slate-400">经办 ${esc(r.by)} · ${esc(r.at)}</div>
            </div>
            <span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${T.chip}">${sm.label}</span>
          </div>
          <div class="mt-2.5 grid grid-cols-2 gap-1.5">
            <div class="rounded-xl bg-slate-50 px-2.5 py-2"><div class="text-[12px] font-medium text-slate-400">${isParent ? '经办班长' : '资金持有方'}</div><div class="mt-0.5 truncate text-[14px] font-semibold text-slate-900">${esc(r.holder)}</div></div>
            <div class="rounded-xl bg-slate-50 px-2.5 py-2"><div class="text-[12px] font-medium text-slate-400">经办人</div><div class="mt-0.5 truncate text-[14px] font-semibold text-slate-900">${esc(r.by)}</div></div>
          </div>
          <div class="mt-1.5 space-y-1">
            ${orders.map((id) => {
              const o = orderById(id);
              const tone = o && o.status === 'REFUNDED' ? 'text-emerald-700' : o && o.partial ? 'text-amber-700' : 'text-slate-500';
              return `<div class="flex items-center justify-between gap-2 rounded-lg bg-slate-50 px-2.5 py-1.5">
                <span class="truncate font-mono text-[12px] font-medium text-slate-600">${esc(id)}</span>
                <span class="shrink-0 text-[12px] font-semibold ${tone}">${esc(orderRefundState(o))}</span>
              </div>`;
            }).join('')}
          </div>
        </section>

        <section class="rounded-2xl border p-3.5 shadow-sm ${T.card}">
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-[16px] font-bold ${T.title}">退款核算</h2>
            <span class="text-[12px] font-medium ${T.sub}">1 积分 = 1 元</span>
          </div>
          <div class="mt-2 grid grid-cols-3 gap-1 text-center">
            <div><div class="text-[12px] font-medium ${T.sub}">实付积分</div><div class="mt-0.5 font-mono text-[18px] font-bold ${T.title}">${r.total}</div></div>
            <div><div class="text-[12px] font-medium ${T.sub}">违约金</div><div class="mt-0.5 font-mono text-[18px] font-bold ${T.title}">${r.penalty}</div></div>
            <div><div class="text-[12px] font-medium ${T.sub}">实退积分</div><div class="mt-0.5 font-mono text-[18px] font-bold ${T.title}">${r.refund}</div></div>
          </div>
          ${r.penalty > 0 ? `<div class="mt-2 rounded-xl bg-white/60 px-2.5 py-2 text-[12px] font-medium ${T.body}">
            <div class="flex justify-between"><span class="${T.sub}">教师课酬补偿</span><b class="${T.title}">${r.pT} 分</b></div>
            <div class="flex justify-between"><span class="${T.sub}">平台工具费扣留</span><b class="${T.title}">${r.pTool} 分</b></div>
            <div class="mt-1 leading-relaxed ${T.sub}">按 TS 财务快照比例拆分，向下取整，余数归平台，合计 ${r.penalty} 分。</div>
          </div>` : ''}
          <p class="mt-2 text-[12px] font-medium leading-relaxed ${T.sub}">退款原因：${esc(r.reason)}${r.cancelReason ? ` · 作废原因：${esc(r.cancelReason)}` : ''}</p>
          <p class="mt-0.5 text-[12px] font-medium leading-relaxed ${T.sub}">原购课单请假配额保持原值不缩减。</p>
        </section>

        <section class="rounded-2xl border border-slate-200/80 bg-white p-3.5 shadow-sm">
          <div class="flex items-center justify-between"><h2 class="text-[16px] font-bold text-slate-900">核销课次</h2><span class="text-[12px] font-medium text-slate-400">${tsRows.length} 节</span></div>
          <div class="mt-1.5 divide-y divide-slate-100">
            ${tsRows.length ? tsRows.map((t) => {
              const stateLabel = r.status === 'REFUNDED' ? '已核销取消' : r.status === 'CANCELLED' ? `已恢复可用 · ${tsStatusLabel(t)}` : '退款锁定';
              const tone = r.status === 'REFUNDED' ? 'text-slate-500' : r.status === 'CANCELLED' ? 'text-emerald-700' : 'text-amber-700';
              return `<div class="flex items-center justify-between gap-2 py-2">
                <div class="min-w-0">
                  <div class="text-[14px] font-semibold text-slate-800">TS #${t.no} · ${esc(t.teacher === '—' ? '尚未排定教师' : t.teacher)}</div>
                  ${t.time && t.time !== '待排期' ? `<div class="text-[12px] font-medium text-slate-400">${esc(t.time)}</div>` : ''}
                </div>
                <div class="shrink-0 text-right"><div class="font-mono text-[14px] font-bold text-slate-700">${t.points} 分${t.tail ? ' · 尾差' : ''}</div><div class="text-[12px] font-medium ${tone}">${stateLabel}</div></div>
              </div>`;
            }).join('') : '<div class="py-2 text-[14px] font-medium text-slate-400">历史退款单：课次已归档核销</div>'}
          </div>
        </section>

        <section class="rounded-2xl border border-slate-200/80 bg-white p-3.5 shadow-sm">
          <div class="flex items-center justify-between"><h2 class="text-[16px] font-bold text-slate-900">打款凭证</h2><span class="text-[12px] font-medium text-slate-400">${r.proofs.length} 张</span></div>
          <div class="mt-1.5 flex flex-wrap gap-2">
            ${r.proofs.length ? r.proofs.map((p) => `<div class="rounded-lg border border-slate-200 bg-slate-50 px-2.5 py-1.5 text-[12px] font-medium text-slate-600">${esc(p.name)} · ${fmtSize(p.size)}</div>`).join('') : '<span class="text-[14px] font-medium text-amber-700">未上传凭证</span>'}
          </div>
          <div class="mt-2 flex items-center justify-between gap-2 rounded-xl border ${r.emailSent ? 'border-emerald-200 bg-emerald-50' : 'border-slate-200 bg-slate-50'} px-2.5 py-2">
            <span class="text-[12px] font-medium ${r.emailSent ? 'text-emerald-700' : 'text-slate-500'}">管理员审计邮件</span>
            <span class="text-[12px] font-bold ${r.emailSent ? 'text-emerald-700' : 'text-slate-500'}">${r.emailSent ? '已触发 · 5s 内派发' : '确认退款后自动触发'}</span>
          </div>
        </section>

        <section class="rounded-2xl border border-slate-200/80 bg-white p-3.5 shadow-sm">
          <h2 class="text-[16px] font-bold text-slate-900">审计日志</h2>
          <ol class="mt-2.5 space-y-2.5 border-l border-slate-200 pl-3">
            ${logs.length ? logs.map((l) => `<li class="relative">
              <span class="absolute -left-[17px] top-1.5 h-2 w-2 rounded-full bg-indigo-500 ring-2 ring-white"></span>
              <div class="flex items-center justify-between gap-2"><span class="text-[14px] font-semibold text-slate-800">${esc(l.action)}</span><span class="shrink-0 text-[12px] font-medium text-slate-400">${esc(l.at)}</span></div>
              <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(l.detail || '')}</p>
              <p class="mt-0.5 text-[12px] font-medium text-slate-400">${esc(l.by)} · IP ${esc(l.ip || '10.0.8.23')}</p>
            </li>`).join('') : '<li class="text-[14px] font-medium text-slate-400">暂无审计记录</li>'}
          </ol>
        </section>

        ${!isParent ? `<div class="flex gap-2">
          ${canOp ? `<button data-action="open-cancel" data-id="${r.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-1 rounded-xl border border-rose-200 bg-rose-50 text-[16px] font-semibold text-rose-700 disabled:cursor-not-allowed disabled:opacity-50">作废</button>
          <button data-action="open-confirm" data-id="${r.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">上传凭证与确认退款</button>` : `<div class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-50 text-center text-[14px] font-medium leading-[44px] text-slate-400">${r.status === 'REFUNDED' ? '已退款终态 · 课次已核销' : '已作废 · 课次已解锁'}</div>`}
        </div>` : `<div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">家长端只读：不可创建、确认或作废退款单；如对金额有疑问请联系负责班长。</div>`}
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    $('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'go-back') { state.page = 'list'; state.navTab = boardTab(); state.overlay = null; renderAll(); return; }
      if (action === 'open-refund') return openDetail(el.dataset.id);
      if (action === 'open-create') return openCreate();
      if (action === 'close-overlay') { state.overlay = null; renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      if (action === 'set-status') { state.statusFilter = el.dataset.value; renderContentOnly(); return; }
      if (action === 'select-child') { state.parentChild = el.dataset.child; renderAll(); return; }
      if (action === 'pick-order') { state.create.orderId = el.dataset.id; state.create.picked = []; renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      if (action === 'select-all-ts') {
        const list = createTsList().filter(eligible);
        const all = list.length > 0 && list.every((t) => state.create.picked.includes(t.id));
        state.create.picked = all ? [] : list.map((t) => t.id);
        renderOverlay(); if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'penalty-step') {
        const d = Number(el.dataset.delta);
        state.create.penalty = String(Math.max(0, (Number(state.create.penalty) || 0) + d));
        const input = $('penalty');
        if (input) input.value = state.create.penalty;
        refreshCreateCalc();
        return;
      }
      if (action === 'submit-create') return submitCreate();
      if (action === 'open-confirm') return openConfirm(el.dataset.id);
      if (action === 'stash-proofs') {
        const r = refundById(state.confirm.refundId);
        if (r) {
          r.proofs = [...state.confirm.proofs];
          if (r.proofs.length) pushLog(r, '暂存打款凭证', `已暂存 ${r.proofs.length} 张凭证，待确认打款`);
        }
        state.overlay = null;
        renderAll();
        showToast('凭证已暂存，可稍后继续确认退款');
        return;
      }
      if (action === 'sample-proof') {
        if (state.confirm.proofs.length >= 5) return showToast('每单最多 5 张凭证');
        state.confirm.proofs.push({ name: `示例转账凭证_${state.confirm.proofs.length + 1}.png`, size: 240 * 1024 });
        renderOverlay(); if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'remove-proof') {
        state.confirm.proofs.splice(Number(el.dataset.index), 1);
        renderOverlay(); if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'confirm-refund') return confirmRefund();
      if (action === 'open-cancel') return openCancel(el.dataset.id);
      if (action === 'confirm-cancel') return confirmCancel();
    });

    $('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'refundSearch') {
        state.query = e.target.value;
        const list = $('refundList');
        if (list) {
          const rows = filteredRefunds();
          list.className = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';
          list.innerHTML = rows.length ? rows.map(renderRefundCard).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-400">暂无退款单记录</div>`;
          if (window.lucide) lucide.createIcons();
        }
        return;
      }
      if (id === 'penalty') { state.create.penalty = e.target.value; refreshCreateCalc(); return; }
      if (id === 'refundReason') { state.create.reason = e.target.value; state.create.error = ''; refreshCreateCalc(); return; }
      if (id === 'cancelReason') {
        state.cancel.reason = e.target.value;
        state.cancel.error = '';
        const btn = document.querySelector('[data-action="confirm-cancel"]');
        if (btn) btn.disabled = state.online === 'off' || !state.cancel.reason.trim();
        return;
      }
    });

    $('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'createStudent') {
        const key = e.target.value;
        state.create.studentKey = key;
        state.create.orderId = (ordersForStudent(key)[0] || {}).id || null;
        state.create.picked = [];
        state.create.fullChurn = false;
        renderOverlay(); if (window.lucide) lucide.createIcons();
        return;
      }
      if (id === 'fullChurn') {
        state.create.fullChurn = e.target.checked;
        state.create.picked = state.create.fullChurn ? eligibleIdsAcrossCreateOrders() : [];
        renderOverlay(); if (window.lucide) lucide.createIcons();
        return;
      }
      if (id === 'proofInput') {
        const file = (e.target.files || [])[0];
        if (!file) return;
        if (!['image/jpeg', 'image/png', 'application/pdf'].includes(file.type)) return showToast('仅支持 JPG / PNG / PDF');
        if (file.size > 10 * 1024 * 1024) return showToast('文件大小不能超过 10MB');
        if (state.confirm.proofs.length >= 5) return showToast('每单最多 5 张凭证');
        state.confirm.proofs.push({ name: file.name, size: file.size });
        e.target.value = '';
        renderOverlay(); if (window.lucide) lucide.createIcons();
        return;
      }
      if (e.target.matches('[data-action="toggle-ts"]')) {
        const tid = e.target.dataset.id;
        state.create.picked = e.target.checked ? [...state.create.picked, tid] : state.create.picked.filter((x) => x !== tid);
        renderOverlay(); if (window.lucide) lucide.createIcons();
        return;
      }
    });

    function showToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.add('hidden'), 2600);
    }

    renderAll();
  </script>
</body>
</html>

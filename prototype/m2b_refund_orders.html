    function studentByKey(key) { return STUDENTS.find((s) => s.key === key) || null; }
    function studentName(key) { const s = studentByKey(key); return s ? s.name : key; }
    function studentNickname(key) { const s = studentByKey(key); return s ? s.nickname : ''; }
    function orderById(id) { return state.orders.find((o) => o.id === id) || null; }
    function recordById(id) { return state.records.find((r) => r.id === id) || null; }
    function ordersForStudent(key) { return state.orders.filter((o) => o.studentKey === key); }
    function recordHolders(r) { return [...new Set((r.items || []).map((i) => i.holder))]; }
    function recordPoints(r) {
      if (typeof r.totalPoints === 'number') return r.totalPoints;
      return (r.items || []).reduce((a, i) => a + i.price * i.n, 0);
    }
    function itemKindLabel(item) {
      if (item.kind === '小班') return `小班待排${item.className ? ' · ' + item.className : ''}`;
      return '1v1 待排';
    }
    function orderRemaining(o) { return (o.tiers || []).reduce((a, t) => a + t.remaining, 0); }
    function orderPoints(o) { return (o.tiers || []).reduce((a, t) => a + t.remaining * t.price, 0); }
    function assetDetailText(o) {
      const parts = (o.tiers || []).filter((t) => t.remaining > 0)
        .map((t) => `${t.price}积分×${t.remaining}节`);
      return parts.length ? parts.join(' · ') : '无剩余待排期';
    }
    function sortedRecords(list) { return list.slice().sort((a, b) => b.at.localeCompare(a.at)); }
    function formatDateTime(d) {
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }
    function parseQty(raw) {
      const s = String(raw ?? '').trim();
      if (s === '') return 0;
      const n = Number(s);
      return Number.isFinite(n) && Number.isInteger(n) && n >= 0 ? n : null;
    }

    function pendingTierRows(studentKey) {
      const rows = [];
      ordersForStudent(studentKey).forEach((o) => {
        (o.tiers || []).forEach((t, idx) => {
          if (t.remaining <= 0) return;
          rows.push({
            key: `${o.id}#${idx}`, orderId: o.id, idx, studentKey,
            kind: t.kind, price: t.price, remaining: t.remaining, holder: o.holder,
            className: t.className || ''
          });
        });
      });
      const monitor = isMonitorRole();
      const holderRank = (h) => (monitor ? (h === actor() ? 0 : 1) : (h === '平台' ? 0 : 1));
      const kindRank = (k) => (k === '小班' ? 1 : 0);
      rows.sort((a, b) => holderRank(a.holder) - holderRank(b.holder)
        || a.holder.localeCompare(b.holder, 'zh-CN')
        || kindRank(a.kind) - kindRank(b.kind)
        || a.price - b.price
        || a.orderId.localeCompare(b.orderId));
      return rows;
    }

    function groupRowsByHolder(rows) {
      const map = new Map();
      rows.forEach((r) => {
        if (!map.has(r.holder)) map.set(r.holder, []);
        map.get(r.holder).push(r);
      });
      return Array.from(map.entries()).map(([holder, list]) => ({ holder, list }));
    }

    function studentTotals(key) {
      const rows = pendingTierRows(key);
      const orders = ordersForStudent(key);
      return {
        pending: rows.reduce((a, r) => a + r.remaining, 0),
        points: rows.reduce((a, r) => a + r.remaining * r.price, 0),
        scheduled: orders.reduce((a, o) => a + (o.scheduled || 0), 0),
        finished: orders.reduce((a, o) => a + (o.finished || 0), 0),
        holders: [...new Set(orders.map((o) => o.holder))]
      };
    }

    function rowEditable(row) {
      if (state.role === 'parent') return false;
      if (state.role === 'admin') return true;
      return row.holder === actor();
    }

    function canViewRecord(r) {
      if (!r) return false;
      if (state.role === 'admin') return true;
      if (isMonitorRole()) return r.by === actor() || recordHolders(r).includes(actor());
      return PARENT_CHILDREN.includes(r.studentKey);
    }

    function scopedRecords() {
      if (state.role === 'admin') return state.records.slice();
      if (isMonitorRole()) return state.records.filter(canViewRecord);
      return state.records.filter((r) => PARENT_CHILDREN.includes(r.studentKey));
    }

    function filteredRecords() {
      const q = state.query.trim().toLowerCase();
      const days = state.range === '30' ? 30 : state.range === '90' ? 90 : Infinity;
      const list = scopedRecords().filter((r) => {
        const date = new Date(r.at.replace(' ', 'T'));
        if (days !== Infinity && (TODAY - date) / 86400000 > days) return false;
        if (state.role === 'admin') {
          if (state.adminHolder === 'self') {
            if (!(r.by === actor() || recordHolders(r).includes('平台'))) return false;
          } else if (state.adminHolder !== 'all' && !recordHolders(r).includes(state.adminHolder)) {
            return false;
          }
          if (state.method === 'self' && r.isFallback) return false;
          if (state.method === 'fallback' && !r.isFallback) return false;
        }
        if (q) {
          const s = studentByKey(r.studentKey);
          const hay = [
            s ? s.name : '', s ? s.nickname : '', r.note, r.by,
            ...(r.orderIds || []),
            ...(r.items || []).map((i) => `${i.price}积分 ${i.holder} ${i.kind}`)
          ].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      return sortedRecords(list);
    }

    function visibleRecordsForStudent(key) {
      return sortedRecords(state.records.filter((r) => r.studentKey === key && canViewRecord(r)));
    }

    function visibleRecordsForOrder(orderId) {
      return sortedRecords(state.records.filter((r) => (r.orderIds || []).includes(orderId) && canViewRecord(r)));
    }

    function orderStatusMeta(s) {
      if (s === 'PARTIALLY_REFUNDED') return { label: 'PAID (PARTIALLY_REFUNDED)', cls: 'border-amber-300 bg-amber-100 text-amber-900' };
      if (s === 'REFUNDED') return { label: 'REFUNDED', cls: 'border-emerald-200 bg-emerald-50 text-emerald-800' };
      return { label: 'PAID', cls: 'border-slate-300 bg-slate-100 text-slate-700' };
    }
    function orderStatusLabel(s) { return orderStatusMeta(s).label; }
    function statusPill(status) {
      const m = orderStatusMeta(status);
      return `<span class="inline-flex whitespace-nowrap shrink-0 items-center rounded-full border px-2 py-0.5 text-[12px] font-bold ${m.cls}">${m.label}</span>`;
    }
    function statusChips(from, to) {
      return `${statusPill(from)}<span class="text-[12px] font-bold text-slate-500">→</span>${statusPill(to)}`;
    }
    function proofStatusText(r) {
      const n = (r.proofs || []).length;
      return n ? `已上传 ${n} 张` : '未上传';
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          showToast(value === 'off' ? '离线只读：课次清退不可用，仅可查看记录' : '已恢复在线，可继续执行课次清退');
        }
      });
    });
    $('btnResetDemo').addEventListener('click', resetDemo);

    function setRole(role) {
      state.role = role;
      state.page = 'records';
      state.navTab = boardTab();
      state.adminHolder = 'all';
      state.method = 'all';
      state.query = '';
      state.overlay = null;
      state.back = null;
      state.activeRecordId = null;
      state.activeOrderId = null;
      state.activeStudentKey = null;
      state.deduct = emptyDeduct();
      renderAll();
    }

    function navTo(tab) {
      const item = navItems().find((n) => n.id === tab);
      if (!item) return;
      state.navTab = tab;
      state.page = item.board ? 'records' : 'placeholder';
      state.activeRecordId = null;
      state.activeOrderId = null;
      state.activeStudentKey = null;
      state.back = null;
      state.overlay = null;
      renderAll();
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const active = state[b.dataset.group] === b.dataset.value;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}`;
      });
    }

    function resetDemo() {
      state.orders = clone(INITIAL_ORDERS);
      state.records = clone(INITIAL_RECORDS);
      state.role = 'monitor';
      state.page = 'records';
      state.navTab = 'ops';
      state.device = 'mobile';
      state.online = 'on';
      state.activeRecordId = null;
      state.activeStudentKey = null;
      state.activeOrderId = null;
      state.back = null;
      state.query = '';
      state.range = '30';
      state.adminHolder = 'all';
      state.method = 'all';
      state.overlay = null;
      state.deduct = emptyDeduct();
      renderAll();
      showToast('演示数据已重置');
    }

    /* ------------------------------------------------------------------
     * 外壳
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;
      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线只读：课次清退不可用，仅可查看清退记录与财务备注`
        : '';

      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = renderNav();
      renderOverlay();
      syncConsole();
      const pageKey = [state.role, state.page, state.activeRecordId, state.activeStudentKey, state.activeOrderId, state.navTab, state.online, state.device].join('|');
      if (pageKey !== lastPageKey) {
        lastPageKey = pageKey;
        $('content').scrollTop = 0;
      }
      if (window.lucide) lucide.createIcons();
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.page === 'student') return renderStudentPage();
      if (state.page === 'record') return renderRecordPage();
      if (state.page === 'order') return renderOrderPage();
      return renderRecordsPage();
    }

    function unreadCount() {
      if (state.role === 'parent') return 2;
      if (state.role === 'admin') return 5;
      return 3;
    }

    function bannerTitle() {
      if (state.overlay) {
        if (state.overlay.type === 'pick') return '发起课次清退';
        if (state.overlay.type === 'deduct') return '课次清退/扣减';
        if (state.overlay.type === 'confirm') return '确认清退课次';
      }
      if (state.page === 'student') return '学员课次资产';
      if (state.page === 'record') return '清退记录详情';
      if (state.page === 'order') return '购课单详情';
      if (state.page === 'placeholder') {
        const item = navItems().find((n) => n.id === state.navTab);
        return item ? item.label : '课次清退';
      }
      return '课次清退记录';
    }

    function renderBanner() {
      const m = roleMeta();
      const hasBack = state.page !== 'records' && state.page !== 'placeholder';
      const unread = unreadCount();
      const left = hasBack
        ? `<button data-action="banner-back" class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="返回">${icon('chevron-left', 'h-5 w-5')}</button>
           <h1 class="min-w-0 truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</h1>`
        : `<span class="grid h-8 w-8 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${m.initial}</span>
           <h1 class="min-w-0 truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</h1>`;
      return `<header class="relative flex h-16 shrink-0 items-center justify-between gap-3 overflow-hidden bg-gradient-to-br ${m.banner} px-4 text-white">
        ${PATTERNS[state.role]}
        <div class="relative flex min-w-0 items-center gap-2.5">${left}</div>
        <button data-action="toast" data-message="您有 ${unread} 条未读通知" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
          ${icon('bell', 'h-4 w-4')}
          <span class="absolute -right-1 -top-1 grid h-[18px] min-w-[18px] place-items-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white/20">${unread}</span>
        </button>
      </header>`;
    }

    function renderNav() {
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${navItems().map((item) => {
            const on = state.navTab === item.id;
            return `<button data-action="nav" data-tab="${item.id}" ${on ? 'aria-current="page"' : ''} class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-500'}">
              ${icon(item.icon, 'h-[18px] w-[18px]')}
              <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderPlaceholder() {
      const item = navItems().find((n) => n.id === state.navTab);
      if (!item) return `<div class="p-8 text-center text-[14px] font-medium text-slate-500">页面不存在</div>`;
      const pageAction = { home: '进入首页', schedule: '查看完整课表', hall: '进入约课大厅', me: '进入我的', ops: '进入教务中心', settings: '进入管理与设置' };
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">${pageAction[item.id] || '进入页面'}</a>` : ''}
        <button data-action="nav" data-tab="${boardTab()}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回课次清退</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 独立清退记录列表页
     * ------------------------------------------------------------------ */
    function filterChip(label, active, action, attr, value) {
      return `<button data-action="${action}" ${attr}="${value}" class="rounded-full px-2.5 py-1 text-[12px] font-bold transition ${active ? 'bg-slate-900 text-white' : 'border border-slate-300 bg-white text-slate-700 hover:bg-slate-50'}">${label}</button>`;
    }

    function renderRecordsPage() {
      const isParent = state.role === 'parent';
      const isAdmin = state.role === 'admin';
      const list = filteredRecords();
      const canCreate = !isParent && state.online === 'on';
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';

      const ranges = [['30', '近 30 天'], ['90', '近 90 天'], ['all', '全部']];
      const adminFilters = isAdmin
        ? `<div class="mt-2 grid grid-cols-2 gap-2">
            <div class="min-w-0">
              <div class="mb-1 text-[12px] font-semibold text-slate-600">持有人</div>
              <div class="relative">
                <select id="adminHolderFilter" class="h-10 w-full appearance-none rounded-xl border border-slate-300 bg-white pl-3 pr-8 text-[14px] font-medium text-slate-700 outline-none transition focus:border-indigo-500">
                  <option value="all" ${state.adminHolder === 'all' ? 'selected' : ''}>全部持有人</option>
                  <option value="self" ${state.adminHolder === 'self' ? 'selected' : ''}>⭐ 我经办/直管</option>
                  <option value="Leo" ${state.adminHolder === 'Leo' ? 'selected' : ''}>Leo</option>
                  <option value="Mia" ${state.adminHolder === 'Mia' ? 'selected' : ''}>Mia</option>
                  <option value="平台" ${state.adminHolder === '平台' ? 'selected' : ''}>平台</option>
                </select>
                <span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-slate-500">${icon('chevron-down', 'h-4 w-4')}</span>
              </div>
            </div>
            <div class="min-w-0">
              <div class="mb-1 text-[12px] font-semibold text-slate-600">清退方式</div>
              <div class="relative">
                <select id="methodFilter" class="h-10 w-full appearance-none rounded-xl border border-slate-300 bg-white pl-3 pr-8 text-[14px] font-medium text-slate-700 outline-none transition focus:border-indigo-500">
                  <option value="all" ${state.method === 'all' ? 'selected' : ''}>全部</option>
                  <option value="self" ${state.method === 'self' ? 'selected' : ''}>持有人自清退</option>
                  <option value="fallback" ${state.method === 'fallback' ? 'selected' : ''}>管理员兜底代清退</option>
                </select>
                <span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-slate-500">${icon('chevron-down', 'h-4 w-4')}</span>
              </div>
            </div>
          </div>`
        : '';

      const createButton = isParent
        ? `<span class="shrink-0 rounded-full border border-slate-300 bg-slate-100 px-2.5 py-1 text-[12px] font-bold text-slate-600">只读</span>`
        : `<button data-action="open-picker" ${canCreate ? '' : 'disabled'} class="inline-flex h-9 shrink-0 items-center gap-1 rounded-xl bg-indigo-600 px-3 text-[12px] font-bold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">
            ${icon('plus', 'h-3.5 w-3.5')} 发起课次清退
          </button>`;

      return `<div class="pb-10">
        <div class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 px-4 py-2.5 backdrop-blur">
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0">
              <h1 class="text-[16px] font-bold text-slate-900">清退流水</h1>
              <p class="truncate text-[12px] font-medium text-slate-600">共 ${list.length} 条 · 按清退时间倒序</p>
            </div>
            ${createButton}
          </div>
        </div>

        <div class="space-y-3 px-4 pt-3">
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
            <input id="recordSearch" value="${esc(state.query)}" placeholder="搜索学员昵称/小名、购课单号或备注" class="h-11 w-full rounded-xl border border-slate-300 bg-white pl-9 pr-9 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500">
            ${state.query ? `<button data-action="clear-search" class="absolute right-1 top-1/2 grid h-9 w-9 -translate-y-1/2 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="清除搜索">${icon('x', 'h-4 w-4')}</button>` : ''}
          </div>

          <div class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-2.5">
            <div class="flex items-center gap-2">
              <span class="shrink-0 text-[12px] font-semibold text-slate-600">时间</span>
              <div class="flex flex-1 flex-wrap gap-1.5">
                ${ranges.map(([value, label]) => filterChip(label, state.range === value, 'set-range', 'data-range', value)).join('')}
              </div>
            </div>
            ${adminFilters}
          </div>

          <div id="recordList" class="${grid}">
            ${list.length ? list.map((r) => renderRecordCard(r, { showStudent: true })).join('') : renderEmptyRecords()}
          </div>

          <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">
            ${isParent
              ? '仅展示本人孩子名下的课次清退记录，只读；如有疑问请联系负责班长。'
              : isAdmin
                ? '管理员展示全校清退记录，可按持有人与清退方式筛选；记录一经生成不可编辑或删除。'
                : '班长仅展示本人作为资金持有人或本人经办的清退记录；已清退 TS 不进入周转账单与老师周课酬单。'}
          </div>
        </div>
      </div>`;
    }

    function renderEmptyRecords() {
      return `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/70 px-6 py-10 text-center">
        <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-white text-slate-600 ring-1 ring-slate-200">${icon('history', 'h-5 w-5')}</div>
        <p class="mt-3 text-[14px] font-semibold text-slate-700">没有匹配的清退记录</p>
        <p class="mt-0.5 text-[12px] font-medium text-slate-600">试试调整时间范围、持有人或搜索关键词。</p>
        <button data-action="reset-filters" class="mt-3 inline-flex h-9 items-center rounded-xl border border-slate-300 bg-white px-3 text-[12px] font-bold text-slate-700 hover:bg-slate-50">重置筛选</button>
      </div>`;
    }

    function renderRecordCard(r, opts = {}) {
      const showStudent = opts.showStudent !== false;
      const holders = recordHolders(r);
      const points = recordPoints(r);
      return `<article data-action="open-record" data-id="${r.id}" role="button" tabindex="0" class="cursor-pointer rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5 transition active:scale-[0.995]">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            ${showStudent
              ? `<button data-action="open-student" data-key="${esc(r.studentKey)}" class="block max-w-full truncate text-left text-[14px] font-bold text-slate-900">
                  ${esc(studentName(r.studentKey))} <span class="ml-1 rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(studentNickname(r.studentKey))}</span>
                </button>
                <div class="mt-1 font-mono text-[12px] font-medium text-slate-600">${esc(r.at)}</div>`
              : `<div class="font-mono text-[12px] font-medium text-slate-600">${esc(r.at)}</div>`}
          </div>
          <div class="flex shrink-0 flex-wrap justify-end gap-1">
            ${r.isFallback ? `<span class="rounded-md border border-amber-300 bg-amber-100 px-1.5 py-0.5 text-[12px] font-bold text-amber-900">兜底代清退</span>` : ''}
            <span class="rounded-md border border-slate-200 bg-white px-1.5 py-0.5 text-[12px] font-bold text-slate-800">清退 ${r.n} 节</span>
          </div>
        </div>
        <p class="mt-1.5 line-clamp-2 text-[12px] font-medium leading-relaxed text-slate-700">${esc(r.note)}</p>
        <div class="mt-2 space-y-1 border-t border-slate-200/70 pt-2 text-[12px] font-medium text-slate-600">
          <div class="flex items-center justify-between gap-2">
            <span class="min-w-0 truncate">经办人 ${esc(r.by)} · 持有人 ${esc(holders.join(' / '))} · 退款总积分 <span class="font-bold text-slate-900">${points}</span></span>
            <span class="inline-flex shrink-0 items-center gap-0.5 text-[12px] font-semibold text-indigo-600">详情 ${icon('chevron-right', 'h-3.5 w-3.5')}</span>
          </div>
          <div class="flex items-center justify-between gap-2">
            <span class="min-w-0 truncate font-mono">${esc((r.orderIds || []).join(' · '))}</span>
            <span class="shrink-0 ${(r.proofs || []).length ? 'text-slate-600' : 'text-slate-500'}">凭证 ${proofStatusText(r)}</span>
          </div>
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 学员资产卡（内嵌倒序历史）
     * ------------------------------------------------------------------ */
    function assetTile(label, value) {
      return `<div class="rounded-xl border border-slate-200/60 bg-white px-2 py-2 text-center">
        <div class="text-[12px] font-semibold text-slate-600">${label}</div>
        <div class="mt-0.5 text-[18px] font-bold leading-none text-slate-900">${value}<span class="ml-0.5 text-[12px] font-semibold text-slate-600">节</span></div>
      </div>`;
    }

    function renderStudentPage() {
      const s = studentByKey(state.activeStudentKey);
      if (!s) return renderNotFound('学员档案不存在', '请返回清退记录列表重新选择学员。');
      if (state.role === 'parent' && !PARENT_CHILDREN.includes(s.key)) {
        return renderNotFound('学员档案不可见', '家长端仅可查看本人孩子的档案与清退记录。');
      }
      const totals = studentTotals(s.key);
      const rows = pendingTierRows(s.key);
      const groups = groupRowsByHolder(rows);
      const orders = ordersForStudent(s.key);
      const history = visibleRecordsForStudent(s.key);
      const isParent = state.role === 'parent';
      const editable = rows.filter(rowEditable);
      const blockedHolders = [...new Set(rows.filter((r) => !rowEditable(r)).map((r) => r.holder))];
      const canDeduct = state.online === 'on' && !isParent && editable.length > 0 && totals.pending > 0;
      const actionTitle = state.online === 'off'
        ? '离线模式下不可用'
        : isParent
          ? '家长端只读'
          : !editable.length
            ? `该课次资金当前由 ${blockedHolders.join(' / ') || '他人'} 持有，请由资金持有人操作清退`
            : '发起多价位联合清退';
      const action = isParent
        ? `<span class="shrink-0 rounded-full border border-slate-300 bg-slate-100 px-2 py-0.5 text-[12px] font-bold text-slate-600">只读</span>`
        : `<button data-action="open-deduct-student" ${canDeduct ? '' : 'disabled'} title="${esc(actionTitle)}" class="h-9 shrink-0 rounded-lg px-2.5 text-[12px] font-bold ${canDeduct ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-slate-200 text-slate-500'} disabled:cursor-not-allowed">课时清退/扣减</button>`;

      return `<div class="space-y-3 px-4 py-3 pb-10">
        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5">
          <div class="flex items-start gap-2.5">
            <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full border border-indigo-100 bg-indigo-50 text-[16px] font-bold text-indigo-700">${esc(s.name.charAt(0))}</span>
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-1.5">
                <h2 class="truncate text-[16px] font-bold text-slate-900">${esc(s.name)}</h2>
                <span class="shrink-0 rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">小名 ${esc(s.nickname)}</span>
              </div>
              <div class="mt-0.5 text-[12px] font-medium text-slate-600">${esc(s.age)} · 资金持有人：<span class="font-bold text-slate-900">${esc(totals.holders.join(' / '))}</span></div>
            </div>
            ${action}
          </div>
          <div class="mt-3 grid grid-cols-3 gap-1.5">
            ${assetTile('待排期', totals.pending)}
            ${assetTile('未来已排期', totals.scheduled)}
            ${assetTile('历史结课', totals.finished)}
          </div>
          <div class="mt-2 rounded-xl border border-slate-200/80 bg-white px-2.5 py-2 text-[12px] font-medium text-slate-700">
            <span class="font-semibold text-slate-600">当前共剩余：</span>${totals.pending} 节未排 <span class="text-slate-600">(合计 ${totals.points} 积分)</span>
          </div>
        </section>

        ${totals.scheduled > 0 ? `<div class="box-border w-full rounded-2xl border border-amber-300 bg-amber-50/50 p-3">
          <div class="flex items-start gap-2">
            <span class="mt-0.5 shrink-0 text-amber-700">${icon('alert-triangle', 'h-4 w-4')}</span>
            <p class="text-[12px] font-semibold leading-relaxed text-amber-900">该学员仍有 ${totals.scheduled} 节未来已排期课次，需先在课表请假退回待排期后才能清退；已排课格不得强行作废。</p>
          </div>
        </div>` : ''}

        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5">
          <div class="flex items-center justify-between">
            <h2 class="text-[16px] font-bold text-slate-900">可清退待排课次</h2>
            <span class="text-[12px] font-semibold text-slate-600">按价位与持有人</span>
          </div>
          ${groups.length ? `<div class="mt-2 space-y-2">
            ${groups.map((group) => `<div>
              <div class="flex items-center justify-between px-1 pb-1">
                <span class="text-[12px] font-bold text-slate-900">资金持有人 · ${esc(group.holder)}</span>
                <span class="text-[12px] font-semibold text-slate-600">${group.list.reduce((a, r) => a + r.remaining, 0)} 节 · ${group.list.reduce((a, r) => a + r.remaining * r.price, 0)} 积分</span>
              </div>
              <div class="space-y-1.5">
                ${group.list.map((row) => `<div class="flex items-center justify-between gap-2 rounded-xl border border-slate-200/80 bg-white px-2.5 py-2">
                  <div class="min-w-0">
                    <div class="flex flex-wrap items-center gap-1.5">
                      <span class="text-[14px] font-bold text-slate-900">${row.price}积分</span>
                      <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${itemKindLabel(row)}</span>
                    </div>
                    <div class="mt-0.5 text-[12px] font-medium text-slate-600">剩余 ${row.remaining} 节未排 · ${row.orderId}</div>
                  </div>
                  <span class="shrink-0 text-[14px] font-bold text-slate-900">${row.remaining * row.price} <span class="text-[12px] font-semibold text-slate-600">积分</span></span>
                </div>`).join('')}
              </div>
            </div>`).join('')}
          </div>` : `<div class="mt-2 rounded-xl border border-dashed border-slate-300 bg-white px-3 py-4 text-center text-[12px] font-medium text-slate-600">当前没有可清退的待排期课次</div>`}
        </section>

        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5">
          <div class="flex items-center justify-between">
            <h2 class="text-[16px] font-bold text-slate-900">关联购课单</h2>
            <span class="text-[12px] font-semibold text-slate-600">${orders.length} 张</span>
          </div>
          <div class="mt-2 space-y-1.5">
            ${orders.map((o) => {
              const m = orderStatusMeta(o.status);
              return `<button data-action="open-order" data-id="${esc(o.id)}" class="w-full rounded-xl border border-slate-200/80 bg-white px-2.5 py-2 text-left transition hover:bg-slate-50">
                <div class="flex items-center justify-between gap-2">
                  <span class="truncate font-mono text-[12px] font-bold text-slate-900">${esc(o.id)}</span>
                  <span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${m.cls}">${m.label}</span>
                </div>
                <div class="mt-1 flex flex-wrap items-center gap-1.5 text-[12px] font-medium text-slate-600">
                  <span class="rounded bg-slate-100 px-1.5 py-0.5 font-bold text-slate-700">${esc(o.type)}</span>
                  <span>持有人 ${esc(o.holder)}</span>
                  <span>待排 ${orderRemaining(o)} 节 · 已排 ${o.scheduled} 节 · 结课 ${o.finished} 节</span>
                </div>
                <div class="mt-1 truncate text-[12px] font-medium text-slate-700">${esc(assetDetailText(o))}</div>
              </button>`;
            }).join('')}
          </div>
        </section>

        <section>
          <div class="flex items-center justify-between px-1">
            <h2 class="text-[16px] font-bold text-slate-900">历史清退记录</h2>
            <span class="rounded-full border border-slate-200 bg-white px-2 py-0.5 text-[12px] font-bold text-slate-600">${history.length} 条 · 倒序</span>
          </div>
          <div class="mt-2 ${state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2'}">
            ${history.length ? history.map((r) => renderRecordCard(r, { showStudent: false })).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/70 px-4 py-6 text-center text-[12px] font-medium text-slate-600">该学员暂无清退记录</div>`}
          </div>
        </section>

        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">
          清退仅扣减待排期课次并记录财务备注；已排期课次需先在课表请假退回；已清退 TS 不进入周转账单与老师周课酬单。
        </div>
      </div>`;
    }

    function renderNotFound(title, desc) {
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-slate-600 ring-1 ring-slate-200">${icon('search', 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(title)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(desc)}</p>
        <button data-action="banner-back" class="mt-4 inline-flex h-10 items-center rounded-xl bg-indigo-600 px-4 text-[14px] font-semibold text-white">返回清退记录</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 购课单详情（内嵌倒序历史）
     * ------------------------------------------------------------------ */
    function renderOrderPage() {
      const o = orderById(state.activeOrderId);
      if (!o) return renderNotFound('购课单不存在', '该购课单可能已归档，请返回清退记录列表查看。');
      if (state.role === 'parent' && !PARENT_CHILDREN.includes(o.studentKey)) {
        return renderNotFound('购课单不可见', '家长端仅可查看本人孩子的购课单与清退记录。');
      }
      const s = studentByKey(o.studentKey);
      const history = visibleRecordsForOrder(o.id);
      const remaining = orderRemaining(o);
      const editable = pendingTierRows(o.studentKey).filter(rowEditable);
      const canDeduct = state.online === 'on' && state.role !== 'parent' && remaining > 0 && editable.length > 0;
      return `<div class="space-y-3 px-4 py-3 pb-10">
        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="font-mono text-[12px] font-bold text-slate-900">${esc(o.id)}</div>
              <button data-action="open-student" data-key="${esc(o.studentKey)}" class="mt-1 block max-w-full truncate text-left text-[16px] font-bold text-slate-900">${esc(s ? s.name : o.studentKey)} · ${esc(s ? s.nickname : '')}</button>
              <div class="mt-0.5 text-[12px] font-medium text-slate-600">${esc(o.type)} · 资金持有人 ${esc(o.holder)}</div>
            </div>
            ${statusPill(o.status)}
          </div>
          <div class="mt-3 grid grid-cols-3 gap-1.5">
            ${assetTile('待排期', remaining)}
            ${assetTile('未来已排期', o.scheduled)}
            ${assetTile('历史结课', o.finished)}
          </div>
          <div class="mt-2 rounded-xl border border-slate-200/80 bg-white px-2.5 py-2">
            <div class="flex items-center justify-between text-[12px] font-medium text-slate-600"><span>剩余待排积分</span><span class="text-[14px] font-bold text-slate-900">${orderPoints(o)} 积分</span></div>
          </div>
          ${canDeduct ? `<button data-action="open-deduct-order" data-id="${esc(o.id)}" class="mt-2 flex h-9 w-full items-center justify-center gap-1 rounded-lg border border-indigo-200 bg-white text-[12px] font-bold text-indigo-700 hover:bg-indigo-50">${icon('minus-circle', 'h-3.5 w-3.5')} 发起课次清退</button>` : ''}
        </section>

        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5">
          <h2 class="text-[16px] font-bold text-slate-900">价位明细</h2>
          <div class="mt-2 space-y-1.5">
            ${(o.tiers || []).map((t) => `<div class="flex items-center justify-between gap-2 rounded-xl border border-slate-200/80 bg-white px-2.5 py-2">
              <div class="min-w-0">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="text-[14px] font-bold text-slate-900">${t.price}积分</span>
                  <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${itemKindLabel(t)}</span>
                </div>
                <div class="mt-0.5 text-[12px] font-medium text-slate-600">${t.remaining > 0 ? `剩余 ${t.remaining} 节未排` : '该价位已无剩余待排期'}</div>
              </div>
              <span class="shrink-0 text-[12px] font-bold text-slate-900">${t.remaining * t.price} 积分</span>
            </div>`).join('')}
          </div>
        </section>

        <section>
          <div class="flex items-center justify-between px-1">
            <h2 class="text-[16px] font-bold text-slate-900">该购课单清退记录</h2>
            <span class="rounded-full border border-slate-200 bg-white px-2 py-0.5 text-[12px] font-bold text-slate-600">${history.length} 条 · 倒序</span>
          </div>
          <div class="mt-2 ${state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2'}">
            ${history.length ? history.map((r) => renderRecordCard(r, { showStudent: false })).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/70 px-4 py-6 text-center text-[12px] font-medium text-slate-600">该购课单暂无清退记录</div>`}
          </div>
        </section>

        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">
          购课单与清退记录永久只读留痕；清退仅作废待排期 TS，已排期课次需先退回待排期池。
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 清退记录详情
     * ------------------------------------------------------------------ */
    function renderRecordPage() {
      const r = recordById(state.activeRecordId);
      if (!r || !canViewRecord(r)) return renderNotFound('清退记录不存在', '该记录可能不在当前账号的可见范围内。');
      const s = studentByKey(r.studentKey);
      const holders = recordHolders(r);
      const changes = r.statusChanges || [];
      return `<div class="space-y-3 px-4 py-3 pb-10">
        <section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="font-mono text-[12px] font-medium text-slate-600">${esc(r.at)}</div>
              <h1 class="mt-1 text-[18px] font-bold tracking-tight text-slate-900">清退 ${r.n} 节课次</h1>
              <button data-action="open-student" data-key="${esc(r.studentKey)}" class="mt-0.5 block max-w-full truncate text-left text-[14px] font-semibold text-slate-700">${esc(s ? s.name : r.studentKey)} · ${esc(s ? s.nickname : '')}</button>
            </div>
            <div class="flex shrink-0 flex-col items-end gap-1">
              <span class="rounded-full border border-slate-300 bg-slate-100 px-2 py-0.5 text-[12px] font-bold text-slate-600">只读</span>
              ${r.isFallback ? `<span class="rounded-md border border-amber-300 bg-amber-100 px-1.5 py-0.5 text-[12px] font-bold text-amber-900">兜底代清退</span>` : ''}
            </div>
          </div>
          <div class="mt-3 grid grid-cols-2 gap-1.5">
            <div class="rounded-xl border border-slate-200/60 bg-white px-2.5 py-2">
              <div class="text-[12px] font-semibold text-slate-600">退款总积分</div>
              <div class="mt-0.5 text-[18px] font-bold text-slate-900">${recordPoints(r)} <span class="text-[12px] font-semibold text-slate-600">积分</span></div>
            </div>
            <div class="rounded-xl border border-slate-200/60 bg-white px-2.5 py-2">
              <div class="text-[12px] font-semibold text-slate-600">操作后剩余未排</div>
              <div class="mt-0.5 text-[18px] font-bold text-slate-900">${r.after} <span class="text-[12px] font-semibold text-slate-600">节</span></div>
            </div>
            <div class="rounded-xl border border-slate-200/60 bg-white px-2.5 py-2">
              <div class="text-[12px] font-semibold text-slate-600">经办人</div>
              <div class="mt-0.5 text-[14px] font-bold text-slate-900">${esc(r.by)}</div>
            </div>
            <div class="rounded-xl border border-slate-200/60 bg-white px-2.5 py-2">
              <div class="text-[12px] font-semibold text-slate-600">凭证状态</div>
              <div class="mt-0.5 text-[14px] font-bold text-slate-900">${(r.proofs || []).length ? `已上传 ${(r.proofs || []).length} 张` : '未上传'}</div>
            </div>
          </div>
        </section>

        <section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5">
          <h2 class="text-[16px] font-bold text-slate-900">清退明细</h2>
          <div class="mt-2 space-y-1.5">
            ${(r.items || []).map((i) => `<div class="flex items-center justify-between gap-2 rounded-xl border border-slate-200/80 bg-white px-2.5 py-2">
              <div class="min-w-0">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="text-[14px] font-bold text-slate-900">${i.price}积分 × ${i.n} 节</span>
                  <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${itemKindLabel(i)}</span>
                </div>
                <div class="mt-0.5 text-[12px] font-medium text-slate-600">资金持有人 ${esc(i.holder)}</div>
              </div>
              <span class="shrink-0 text-[12px] font-bold text-slate-900">${i.price * i.n} 积分</span>
            </div>`).join('')}
          </div>
        </section>

        <section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5">
          <h2 class="text-[16px] font-bold text-slate-900">财务备注</h2>
          <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-700">${esc(r.note)}</p>
        </section>

        <section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5">
          <h2 class="text-[16px] font-bold text-slate-900">关联购课单</h2>
          <div class="mt-2 space-y-1.5">
            ${(r.orderIds || []).map((id) => {
              const order = orderById(id);
              return order
                ? `<button data-action="open-order" data-id="${esc(id)}" class="flex w-full items-center justify-between gap-2 rounded-xl border border-slate-200/80 bg-white px-2.5 py-2 text-left transition hover:bg-slate-50">
                    <div class="min-w-0 flex-1"><div class="truncate font-mono text-[12px] font-bold text-slate-900">${esc(id)}</div><div class="mt-0.5 text-[12px] font-medium text-slate-600">${esc(order.type)} · 持有人 ${esc(order.holder)}</div></div>
                    ${statusPill(order.status)}
                  </button>`
                : `<div class="flex items-center justify-between gap-2 rounded-xl border border-slate-200/80 bg-white px-2.5 py-2">
                    <div class="min-w-0"><div class="truncate font-mono text-[12px] font-bold text-slate-900">${esc(id)}</div><div class="mt-0.5 text-[12px] font-medium text-slate-600">历史购课单（只读留痕）</div></div>
                    <span class="shrink-0 text-[12px] font-semibold text-slate-600">已归档</span>
                  </div>`;
            }).join('')}
          </div>
        </section>

        <section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5">
          <h2 class="text-[16px] font-bold text-slate-900">购课单状态变化</h2>
          <div class="mt-2 space-y-1.5">
            ${changes.length ? changes.map((c) => `<div class="rounded-xl border border-slate-200/80 bg-white px-2.5 py-2">
              <div class="font-mono text-[12px] font-bold text-slate-900">${esc(c.orderId)}</div>

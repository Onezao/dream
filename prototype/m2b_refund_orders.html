          </div>
        </section>

        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5">
          <h2 class="text-[16px] font-bold text-slate-900">截图凭证（${(r.proofs || []).length} 张）</h2>
          ${(r.proofs && r.proofs.length)
            ? `<div class="mt-2 space-y-1.5">${r.proofs.map((p) => `<button data-action="preview-proof" class="flex w-full items-center gap-2 rounded-xl border border-slate-200 bg-white p-2 text-left hover:bg-slate-50">
                <span class="grid h-12 w-12 shrink-0 place-items-center rounded-lg bg-slate-100 text-slate-600">${icon('image', 'h-5 w-5')}</span>
                <span class="min-w-0 flex-1">
                  <span class="block truncate text-[14px] font-semibold text-slate-800">${esc(p.name)}</span>
                  <span class="block text-[12px] font-medium text-slate-600">${fmtSize(p.size)} · 点击预览</span>
                </span>
                ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-500')}
              </button>`).join('')}</div>`
            : `<div class="mt-2 rounded-xl border border-dashed border-slate-300 bg-white px-3 py-3 text-[12px] font-medium text-slate-600">本笔清退未上传截图凭证</div>`}
        </section>

        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5">
          <h2 class="text-[16px] font-bold text-slate-900">记录信息</h2>
          <div class="mt-2 space-y-1 text-[12px]">
            <div class="flex justify-between gap-2"><span class="shrink-0 font-medium text-slate-600">记录编号</span><span class="truncate font-mono font-semibold text-slate-900">${esc(r.id)}</span></div>
            <div class="flex justify-between gap-2"><span class="font-medium text-slate-600">记录状态</span><span class="font-semibold text-emerald-700">EFFECTIVE（已生效 · 不可删除）</span></div>
            <div class="flex justify-between gap-2"><span class="font-medium text-slate-600">资金持有人</span><span class="truncate font-semibold text-slate-900">${esc(holders.join(' / '))}</span></div>
            <div class="flex justify-between gap-2"><span class="font-medium text-slate-600">清退节数</span><span class="font-semibold text-slate-900">${r.n} 节</span></div>
          </div>
        </section>

        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">清退记录一经生成不可编辑或删除，仅用于财务审计追溯；已清退 TS 不进入周转账单与老师周课酬单。</div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 学员选择（发起清退）
     * ------------------------------------------------------------------ */
    function renderPicker() {
      const students = STUDENTS.filter((s) => pendingTierRows(s.key).some(rowEditable));
      return `<div class="absolute inset-x-0 bottom-0 top-16 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 mx-auto flex max-h-[92%] w-full max-w-[560px] flex-col rounded-t-3xl bg-white shadow-2xl">
          <div class="mx-auto mb-1 mt-2 h-1 w-10 shrink-0 rounded-full bg-slate-200"></div>
          <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 px-4 pb-2.5">
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">发起课次清退</h2>
              <p class="mt-0.5 text-[12px] font-medium text-slate-600">选择存在可清退待排课次的学员</p>
            </div>
            <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="min-h-0 flex-1 space-y-2 overflow-y-auto px-4 py-3" data-scroll>
            ${students.length ? students.map((s) => {
              const totals = studentTotals(s.key);
              const rows = pendingTierRows(s.key);
              const holders = [...new Set(rows.map((r) => r.holder))];
              return `<button data-action="pick-student" data-key="${esc(s.key)}" class="w-full rounded-xl border border-slate-300 bg-slate-50/70 p-3 text-left transition hover:bg-slate-100">
                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0">
                    <div class="flex flex-wrap items-center gap-1.5">
                      <span class="text-[14px] font-bold text-slate-900">${esc(s.name)}</span>
                      <span class="rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">小名 ${esc(s.nickname)}</span>
                    </div>
                    <div class="mt-0.5 text-[12px] font-medium text-slate-600">持有人 ${esc(holders.join(' / '))}</div>
                  </div>
                  <span class="shrink-0 rounded-full border border-slate-200 bg-white px-2 py-0.5 text-[12px] font-bold text-slate-800">${totals.pending} 节 · ${totals.points} 积分</span>
                </div>
                <div class="mt-1.5 flex flex-wrap gap-1">
                  ${rows.map((r) => `<span class="rounded-md border border-slate-200 bg-white px-1.5 py-0.5 text-[12px] font-semibold text-slate-700">${r.price}积分 × ${r.remaining} 节${r.kind === '小班' ? ' · 小班' : ''}</span>`).join('')}
                </div>
              </button>`;
            }).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/70 px-4 py-10 text-center text-[14px] font-medium text-slate-600">当前身份下没有可清退的学员资产</div>`}
          </div>
          <div class="shrink-0 border-t border-slate-100 px-4 pb-4 pt-3">
            <button data-action="close-overlay" class="h-11 w-full rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">取消</button>
          </div>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 清退抽屉（多价位联合清退）
     * ------------------------------------------------------------------ */
    function deductState() {
      const d = state.deduct;
      const rows = pendingTierRows(d.studentKey).map((row) => {
        const raw = d.inputs[row.key] ?? '0';
        const n = parseQty(raw);
        const canEdit = rowEditable(row);
        const over = n !== null && n > row.remaining;
        const invalid = n === null;
        const liveError = invalid
          ? '请输入非负整数'
          : over
            ? `该价位最多可清退 ${row.remaining} 节待排期课次`
            : '';
        return {
          ...row, raw, n, canEdit, over, invalid, liveError,
          selected: canEdit && n !== null && n > 0,
          after: n !== null ? Math.max(0, row.remaining - n) : row.remaining
        };
      });
      const selected = rows.filter((r) => r.selected);
      const pending = rows.reduce((a, r) => a + r.remaining, 0);
      const pointsAll = rows.reduce((a, r) => a + r.remaining * r.price, 0);
      const totalN = selected.reduce((a, r) => a + r.n, 0);
      const totalPoints = selected.reduce((a, r) => a + r.n * r.price, 0);
      const after = Math.max(0, pending - totalN);
      const fallbackSelected = state.role === 'admin' && selected.some((r) => r.holder !== '平台');
      const fallbackAvailable = state.role === 'admin' && rows.some((r) => r.holder !== '平台');
      return {
        rows, groups: groupRowsByHolder(rows), selected, pending, pointsAll,
        totalN, totalPoints, after, fallbackSelected, fallbackAvailable,
        errors: d.errors || {}
      };
    }

    function deductHolderBadge(holder) {
      if (state.role === 'admin') {
        return holder === '平台'
          ? '<span class="rounded border border-slate-300 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-600">平台持有</span>'
          : '<span class="rounded border border-amber-300 bg-amber-100 px-1.5 py-0.5 text-[12px] font-bold text-amber-900">兜底可操作</span>';
      }
      if (holder === actor()) return '<span class="rounded border border-slate-300 bg-white px-1.5 py-0.5 text-[12px] font-bold text-slate-700">本人持有</span>';
      return '<span class="rounded border border-slate-300 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-600">非本人持有</span>';
    }

    function renderTierRow(row, offline) {
      const disabled = !row.canEdit || offline;
      const kindLabel = row.kind === '小班' ? `小班待排${row.className ? ' · ' + row.className : ''}` : '1v1 待排';
      return `<div class="rounded-xl border ${row.canEdit ? 'border-slate-200/80 bg-white' : 'border-dashed border-slate-400 bg-slate-50/60 opacity-65'} p-2.5">
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="text-[14px] font-bold text-slate-900">${row.price}积分</span>
              <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${kindLabel}</span>
              ${!row.canEdit ? `<span class="rounded border border-slate-300 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-600">持有人 ${esc(row.holder)}</span>` : ''}
            </div>
            <div class="mt-0.5 text-[12px] font-medium text-slate-600">剩余 ${row.remaining} 节未排</div>
            <div class="mt-0.5 flex flex-wrap items-center gap-1.5 text-[12px] font-semibold text-slate-700">
              <span data-tier-after="${esc(row.key)}">退后余 ${row.after} 节</span>
              ${row.over ? '<span class="text-rose-700">已超限</span>' : ''}
            </div>
            <p data-tier-error="${esc(row.key)}" class="mt-0.5 text-[12px] font-semibold text-rose-600 ${row.liveError ? '' : 'hidden'}">${esc(row.liveError)}</p>
          </div>
          <div class="flex shrink-0 items-center gap-1">
            <button data-action="tier-step" data-key="${esc(row.key)}" data-delta="-1" ${disabled ? 'disabled' : ''} class="grid h-9 w-9 place-items-center rounded-xl border border-slate-300 bg-white text-[18px] font-bold text-slate-700 hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40">−</button>
            <input data-tier-input="${esc(row.key)}" type="number" inputmode="numeric" min="0" max="${row.remaining}" step="1" value="${esc(row.raw)}" ${disabled ? 'disabled' : ''} class="h-10 w-12 rounded-xl border border-slate-200 bg-white text-center text-[16px] font-bold text-slate-900 outline-none transition focus:border-indigo-500 disabled:bg-slate-100">
            <button data-action="tier-step" data-key="${esc(row.key)}" data-delta="1" ${disabled ? 'disabled' : ''} class="grid h-9 w-9 place-items-center rounded-xl border border-slate-300 bg-white text-[18px] font-bold text-slate-700 hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40">+</button>
          </div>
        </div>
      </div>`;
    }

    function renderDeductSummary(ds) {
      const err = ds.errors.total || '';
      return `<div class="grid grid-cols-3 gap-2">
          <div class="min-w-0">
            <div class="text-[12px] font-semibold text-slate-600">本次清退</div>
            <div class="mt-0.5 whitespace-nowrap text-[16px] font-bold leading-tight text-slate-900">共 ${ds.totalN} <span class="text-[12px] font-semibold text-slate-600">节</span></div>
          </div>
          <div class="min-w-0 border-l border-slate-200 pl-2">
            <div class="text-[12px] font-semibold text-slate-600">退款总积分</div>
            <div class="mt-0.5 whitespace-nowrap text-[16px] font-bold leading-tight text-indigo-700">${ds.totalPoints} <span class="text-[12px] font-semibold text-slate-600">积分</span></div>
          </div>
          <div class="min-w-0 border-l border-slate-200 pl-2">
            <div class="text-[12px] font-semibold text-slate-600">退后剩余未排</div>
            <div class="mt-0.5 whitespace-nowrap text-[16px] font-bold leading-tight text-slate-900">${ds.after} <span class="text-[12px] font-semibold text-slate-600">节</span></div>
          </div>
        </div>
        <p id="deductTotalError" class="mt-1 text-[12px] font-semibold text-rose-600 ${err ? '' : 'hidden'}">${esc(err)}</p>`;
    }

    function renderDeductSheet() {
      const d = state.deduct;
      const student = studentByKey(d.studentKey);
      if (!student) return '';
      const ds = deductState();
      const offline = state.online === 'off';
      const holders = [...new Set(ds.rows.map((r) => r.holder))];
      const fallbackHolders = [...new Set(ds.rows.filter((r) => r.holder !== '平台').map((r) => r.holder))];
      const isFallbackFlow = state.role === 'admin' && fallbackHolders.length > 0;
      const scheduled = studentTotals(d.studentKey).scheduled;

      const fallbackNotice = isFallbackFlow
        ? `<div class="rounded-2xl border border-amber-300 bg-amber-50/50 p-3">
            <div class="flex items-start gap-2">
              <span class="mt-0.5 shrink-0 text-amber-700">${icon('shield-alert', 'h-4 w-4')}</span>
              <div class="min-w-0">
                <p class="text-[12px] font-bold text-amber-900">管理员紧急兜底代清退（资金持有人：${esc(fallbackHolders.join(' / '))}）</p>
                <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-amber-900/85">代清退非平台持有的课次时，必须上传 1～5 张线下退款/转账截图凭证并填写原因；提交后向原持有人班长发送只读通知。</p>
              </div>
            </div>
          </div>`
        : '';

      const scheduledReminder = scheduled > 0
        ? `<div class="rounded-2xl border border-amber-300 bg-amber-50/50 p-3">
            <div class="flex items-start gap-2">
              <span class="mt-0.5 shrink-0 text-amber-700">${icon('alert-triangle', 'h-4 w-4')}</span>
              <div class="min-w-0">
                <p class="text-[12px] font-semibold leading-relaxed text-amber-900">存在未来已排期 ${scheduled} 节，请先在课表请假退回待排期池再清退</p>
                <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-amber-900/85">不得强行作废已排课格；本操作仅扣减待排期课次。</p>
              </div>
            </div>
            <button data-action="go-schedule" class="mt-2 inline-flex items-center gap-1 text-[12px] font-bold text-amber-800 hover:text-amber-900">${icon('calendar-days', 'h-3.5 w-3.5')} 前往课表</button>
          </div>`
        : '';

      const groups = ds.groups.map((group) => {
        const groupPending = group.list.reduce((a, r) => a + r.remaining, 0);
        const groupPoints = group.list.reduce((a, r) => a + r.remaining * r.price, 0);
        const locked = group.list.every((r) => !r.canEdit);
        return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="flex items-center justify-between gap-2 px-1 pb-1.5">
            <div class="flex min-w-0 items-center gap-1.5">
              <span class="grid h-6 w-6 shrink-0 place-items-center rounded-full border border-slate-200 bg-white text-[12px] font-bold text-slate-700">${esc(group.holder.charAt(0))}</span>
              <span class="truncate text-[12px] font-bold text-slate-900">资金持有人 · ${esc(group.holder)}</span>
              ${deductHolderBadge(group.holder)}
            </div>
            <span class="shrink-0 text-[12px] font-semibold text-slate-600">${groupPending} 节 · ${groupPoints} 积分</span>
          </div>
          <div class="space-y-1.5">${group.list.map((row) => renderTierRow(row, offline)).join('')}</div>
          ${locked ? `<p class="px-1 pt-1 text-[12px] font-medium leading-relaxed text-slate-600">该价位由 ${esc(group.holder)} 持有，需由持有人操作；管理员可经兜底流程代清退。</p>` : ''}
        </section>`;
      }).join('');

      const proofRequired = ds.fallbackSelected;
      const proofHint = proofRequired
        ? `必填 · 1～5 张（已传 ${d.proofs.length}/5）`
        : isFallbackFlow
          ? `选填 · 选择非平台课次时必填（已传 ${d.proofs.length}/5）`
          : `选填 · 0～5 张（已传 ${d.proofs.length}/5）`;

      return `<div class="absolute inset-x-0 bottom-0 top-16 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 mx-auto flex max-h-[92%] w-full max-w-[560px] flex-col rounded-t-3xl bg-white shadow-2xl">
          <div class="mx-auto mb-1 mt-2 h-1 w-10 shrink-0 rounded-full bg-slate-200"></div>
          <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 px-4 pb-2.5">
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">课次清退/扣减</h2>
              <p class="mt-0.5 truncate text-[12px] font-medium text-slate-600">${esc(student.name)} · ${esc(student.nickname)} · 共 ${ds.pending} 节未排</p>
            </div>
            <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="min-h-0 flex-1 overflow-y-auto px-4 py-3" data-scroll>
            <div class="space-y-3">
              ${offline ? `<div class="rounded-xl border border-amber-300 bg-amber-50 px-3 py-2 text-[12px] font-semibold text-amber-900">离线模式：课次清退不可提交，仅可查看。</div>` : ''}
              ${fallbackNotice}
              ${scheduledReminder}

              <div class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3">
                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0">
                    <div class="text-[12px] font-semibold text-slate-600">当前可清退资产</div>
                    <div class="mt-0.5 text-[14px] font-bold leading-snug text-slate-900">当前共剩余 ${ds.pending} 节未排 <span class="text-[12px] font-semibold text-slate-600">(合计 ${ds.pointsAll} 积分)</span></div>
                  </div>
                  <button data-action="clear-all" ${offline ? 'disabled' : ''} class="shrink-0 rounded-lg border border-indigo-200 bg-white px-2 py-1 text-[12px] font-bold text-indigo-700 hover:bg-indigo-50 disabled:cursor-not-allowed disabled:opacity-40">[ 全部清零 ]</button>
                </div>
                <div class="mt-1 text-[12px] font-medium text-slate-600">按价位与资金持有人分组，可同时填写多个价位。</div>
              </div>

              ${groups}

              <div>
                <div class="flex items-center justify-between">
                  <label for="deductNote" class="text-[14px] font-semibold text-slate-700"><span id="deductNoteLabel">${proofRequired ? '财务备注与兜底原因' : '财务备注'}</span> <span class="text-rose-500">*</span></label>
                  <span id="noteCount" class="text-[12px] font-medium text-slate-600">${d.note.length}/200</span>
                </div>
                <textarea id="deductNote" rows="3" maxlength="200" ${offline ? 'disabled' : ''} placeholder="例如：线下微信退费 ¥600，家长因故停课" class="mt-1.5 h-24 w-full resize-none rounded-xl border border-slate-200 p-3 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500 disabled:bg-slate-100">${esc(d.note)}</textarea>
                <p id="deductNoteError" class="mt-1 text-[12px] font-semibold text-rose-600 ${d.errors.note ? '' : 'hidden'}">${esc(d.errors.note || '')}</p>
              </div>

              <div>
                <div class="flex items-center justify-between gap-2">
                  <span class="text-[14px] font-semibold text-slate-700"><span id="proofTitle">线下退款/转账截图凭证</span> <span id="proofStar" class="text-rose-500 ${proofRequired ? '' : 'hidden'}">*</span></span>
                  <span id="proofRequirement" class="shrink-0 text-[12px] font-semibold ${proofRequired ? 'text-rose-700' : 'text-slate-600'}">${proofHint}</span>
                </div>
                ${d.proofs.map((p, idx) => proofChip(p, idx)).join('')}
                ${d.proofs.length < 5
                  ? `<label class="mt-1.5 flex h-14 cursor-pointer items-center justify-center gap-2 rounded-xl border border-dashed border-slate-300 bg-white text-[14px] font-semibold text-slate-700 hover:bg-slate-50">
                      ${icon('upload', 'h-4 w-4 text-slate-500')} 选择截图文件（可多选）
                      <input id="proofInput" type="file" multiple accept="image/jpeg,image/png,image/webp" class="hidden">
                    </label>`
                  : ''}
                <p id="deductProofError" class="mt-1 text-[12px] font-semibold text-rose-600 ${d.errors.proof ? '' : 'hidden'}">${esc(d.errors.proof || '')}</p>
                <div class="mt-1 flex items-center justify-between gap-2">
                  <p class="text-[12px] font-medium text-slate-600">JPG / PNG / WebP · 单张 ≤5MB</p>
                  ${d.proofs.length < 5 ? `<button data-action="sample-proof" ${offline ? 'disabled' : ''} class="text-[12px] font-bold text-indigo-600 disabled:opacity-40">使用示例凭证</button>` : ''}
                </div>
              </div>

              <div class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
                <div class="flex items-center justify-between gap-2 text-[12px]">
                  <span class="font-medium text-slate-600">清退后剩余未排</span>
                  <span id="deductAfter" class="font-bold text-slate-900">${ds.after} 节</span>
                </div>
                <div class="mt-1.5 flex flex-wrap items-center justify-between gap-1.5 text-[12px]">
                  <span class="font-medium text-slate-600">资金持有人</span>
                  <span class="font-semibold text-slate-900">${esc(holders.join(' / '))}</span>
                </div>
                <p class="mt-1.5 text-[12px] font-medium text-slate-600">已清退 TS 不进入周转账单与老师周课酬单。</p>
              </div>
            </div>
          </div>
          <div class="shrink-0 border-t border-slate-100 px-4 pb-4 pt-2.5">
            <div id="deductSummary" class="rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2">${renderDeductSummary(ds)}</div>
            <div class="mt-2 flex gap-2">
              <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">取消</button>
              <button data-action="submit-deduct" ${offline ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-rose-600 text-[16px] font-bold text-white hover:bg-rose-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认清退课时</button>
            </div>
          </div>
        </div>
      </div>`;
    }

    function proofChip(p, idx) {
      return `<div class="mt-1.5 flex items-center gap-2 rounded-xl border border-slate-200 bg-white p-2">
        <span class="grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-slate-100 text-slate-600">${icon('image', 'h-5 w-5')}</span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-[14px] font-semibold text-slate-800">${esc(p.name)}</span>
          <span class="block text-[12px] font-medium text-slate-600">${fmtSize(p.size)} · 已选择</span>
        </span>
        <button data-action="remove-proof" data-idx="${idx}" class="shrink-0 rounded-lg border border-slate-300 bg-white px-2 py-1 text-[12px] font-semibold text-slate-700 hover:bg-slate-50">移除</button>
      </div>`;
    }

    function refreshDeductPreview() {
      const ds = deductState();
      const d = state.deduct;

      const summary = $('deductSummary');
      if (summary) summary.innerHTML = renderDeductSummary(ds);

      const afterEl = $('deductAfter');
      if (afterEl) afterEl.textContent = `${ds.after} 节`;

      ds.rows.forEach((row) => {
        const rowAfter = document.querySelector(`[data-tier-after="${row.key}"]`);
        if (rowAfter) rowAfter.textContent = `退后余 ${row.after} 节`;
        const rowError = document.querySelector(`[data-tier-error="${row.key}"]`);
        if (rowError) {
          rowError.textContent = row.liveError || '';
          rowError.classList.toggle('hidden', !row.liveError);
        }
      });

      const noteCount = $('noteCount');
      if (noteCount) noteCount.textContent = `${d.note.length}/200`;

      const noteErr = $('deductNoteError');
      if (noteErr) {
        noteErr.textContent = d.errors.note || '';
        noteErr.classList.toggle('hidden', !d.errors.note);
      }
      const proofErr = $('deductProofError');
      if (proofErr) {
        proofErr.textContent = d.errors.proof || '';
        proofErr.classList.toggle('hidden', !d.errors.proof);
      }
      const noteLabel = $('deductNoteLabel');
      if (noteLabel) noteLabel.textContent = ds.fallbackSelected ? '财务备注与兜底原因' : '财务备注';
      const proofStar = $('proofStar');
      if (proofStar) proofStar.classList.toggle('hidden', !ds.fallbackSelected);
      const proofReq = $('proofRequirement');
      if (proofReq) {
        if (ds.fallbackSelected) {
          proofReq.textContent = `必填 · 1～5 张（已传 ${d.proofs.length}/5）`;
          proofReq.className = 'shrink-0 text-[12px] font-semibold text-rose-700';
        } else if (ds.fallbackAvailable) {
          proofReq.textContent = `选填 · 选择非平台课次时必填（已传 ${d.proofs.length}/5）`;
          proofReq.className = 'shrink-0 text-[12px] font-semibold text-slate-600';
        } else {
          proofReq.textContent = `选填 · 0～5 张（已传 ${d.proofs.length}/5）`;
          proofReq.className = 'shrink-0 text-[12px] font-semibold text-slate-600';
        }
      }
      if (window.lucide) lucide.createIcons();
    }

    /* ------------------------------------------------------------------
     * 二次确认
     * ------------------------------------------------------------------ */
    function renderConfirmModal() {
      const ds = deductState();
      if (!ds.selected.length) return '';
      const student = studentByKey(state.deduct.studentKey);
      if (!student) return '';
      return `<div class="absolute inset-x-0 bottom-0 top-16 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-5 top-1/2 mx-auto max-h-[92%] max-w-[360px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">
          <div class="flex items-start gap-2.5">
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full border border-rose-200 bg-rose-50 text-rose-600">${icon('alert-triangle', 'h-4 w-4')}</span>
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">确认清退课次</h2>
              <p class="mt-1 text-[14px] font-medium leading-relaxed text-slate-700">将作废 ${ds.totalN} 节待排期课次，操作不可撤销，请确认已完成线下沟通与核算。</p>
            </div>
          </div>
          <div class="mt-3 space-y-1.5 rounded-xl border border-slate-200/80 bg-slate-50/70 p-2.5 text-[12px]">
            <div class="flex justify-between gap-2"><span class="font-medium text-slate-600">学员</span><span class="truncate font-semibold text-slate-900">${esc(student.name)} · ${esc(student.nickname)}</span></div>
            ${ds.selected.map((row) => `<div class="flex justify-between gap-2"><span class="font-medium text-slate-600">${row.price}积分 × ${row.n} 节</span><span class="truncate font-semibold text-slate-900">持有人 ${esc(row.holder)}</span></div>`).join('')}
            <div class="flex justify-between gap-2"><span class="font-medium text-slate-600">退款总积分</span><span class="truncate font-semibold text-slate-900">${ds.totalPoints} 积分</span></div>
            <div class="flex justify-between gap-2"><span class="font-medium text-slate-600">清退后剩余未排</span><span class="truncate font-semibold text-slate-900">${ds.after} 节</span></div>
            <div class="flex justify-between gap-2"><span class="font-medium text-slate-600">凭证张数</span><span class="truncate font-semibold text-slate-900">${state.deduct.proofs.length} 张</span></div>
            <div class="flex justify-between gap-2"><span class="shrink-0 font-medium text-slate-600">财务备注</span><span class="truncate text-right font-medium text-slate-700">${esc(state.deduct.note.trim())}</span></div>
          </div>
          ${ds.fallbackSelected ? `<div class="mt-2 rounded-xl border border-amber-300 bg-amber-50/70 px-2.5 py-2 text-[12px] font-semibold text-amber-900">提交后将向原持有人班长发送只读通知。</div>` : ''}
          <div class="mt-2.5 rounded-xl border border-slate-200/80 bg-white p-2.5">
            <div class="flex items-center justify-between gap-2 text-[12px]"><span class="font-medium text-slate-600">关联购课单</span><span class="truncate font-mono font-semibold text-slate-900">${esc([...new Set(ds.selected.map((r) => r.orderId))].join(' · '))}</span></div>
            <p class="mt-1.5 text-[12px] font-medium text-slate-600">已清退 TS 不进入周转账单与老师周课酬单。</p>
          </div>
          <div class="mt-3 flex gap-2">
            <button data-action="back-to-deduct" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">返回修改</button>
            <button data-action="confirm-deduct" class="h-11 flex-[1.3] rounded-xl bg-rose-600 text-[16px] font-bold text-white hover:bg-rose-700">确认清退</button>
          </div>
        </div>
      </div>`;
    }

    function renderOverlay() {
      const el = $('overlay');
      if (!state.overlay) el.innerHTML = '';
      else if (state.overlay.type === 'pick') el.innerHTML = renderPicker();
      else if (state.overlay.type === 'deduct') el.innerHTML = renderDeductSheet();
      else if (state.overlay.type === 'confirm') el.innerHTML = renderConfirmModal();
      else el.innerHTML = '';
    }

    /* ------------------------------------------------------------------
     * 业务动作
     * ------------------------------------------------------------------ */
    function captureBack() {
      state.back = {
        page: state.page,
        recordId: state.activeRecordId,
        studentKey: state.activeStudentKey,
        orderId: state.activeOrderId
      };
    }

    function goBack() {
      const b = state.back;
      state.back = null;
      state.overlay = null;
      if (b) {
        state.page = b.page;
        state.activeRecordId = b.recordId;
        state.activeStudentKey = b.studentKey;
        state.activeOrderId = b.orderId;
      } else {
        state.page = 'records';
        state.activeRecordId = null;
        state.activeOrderId = null;
      }
      renderAll();
    }

    function openPicker() {
      if (state.online === 'off') return showToast('离线模式下不可执行课次清退');
      if (state.role === 'parent') return;
      state.overlay = { type: 'pick' };
      renderAll();
    }

    function applyPreset(preset) {
      if (!preset) return;
      const d = state.deduct;
      const rows = pendingTierRows(d.studentKey).filter(rowEditable);
      const setRow = (row, n) => { if (row) d.inputs[row.key] = String(Math.max(0, Math.min(row.remaining, n))); };
      if (preset === 'multi') {
        setRow(rows.find((r) => r.price === 16 && r.kind === '1v1'), 2);
        setRow(rows.find((r) => r.price === 18 && r.kind === '1v1'), 1);
        d.note = '线下微信退费 ¥150，家长调整课业安排，已与家长确认剩余课次。';
      }
      if (preset === 'fallback') {
        setRow(rows.find((r) => r.price === 16 && r.kind === '1v1'), 2);
        setRow(rows.find((r) => r.kind === '小班'), 1);
        d.note = '管理员兜底：家长移居停课，线下微信退费 ¥900，已与持有人及家长三方确认。';
        d.proofs = [{ name: '微信转账凭证_示例.png', size: 286 * 1024 }];
      }
      if (preset === 'clear') {
        rows.forEach((r) => { d.inputs[r.key] = String(r.remaining); });
      }
    }

    function openDeduct(studentKey, preset) {
      if (state.online === 'off') return showToast('离线模式下不可执行课次清退');
      if (state.role === 'parent') return;
      const key = studentKey || state.activeStudentKey;
      const student = key ? studentByKey(key) : null;
      if (!student) return showToast('请先选择学员');
      const rows = pendingTierRows(key);
      if (!rows.length) return showToast('该学员当前没有待排期课次可清退');
      const editable = rows.filter(rowEditable);
      if (!editable.length) {
        const holders = [...new Set(rows.map((r) => r.holder))];
        return showToast(`该课次资金当前由 ${holders.join(' / ')} 持有，请由资金持有人操作清退`);
      }
      state.deduct = { studentKey: key, inputs: {}, note: '', proofs: [], errors: {} };
      rows.forEach((row) => { state.deduct.inputs[row.key] = '0'; });
      applyPreset(preset);
      state.overlay = { type: 'deduct' };
      renderAll();
    }

    function clearAllRows() {
      if (state.online === 'off') return showToast('离线模式下不可执行课次清退');
      const rows = pendingTierRows(state.deduct.studentKey).filter(rowEditable);
      rows.forEach((row) => { state.deduct.inputs[row.key] = String(row.remaining); });
      state.deduct.errors = {};
      state.overlay = { type: 'deduct' };
      renderAll();
      showToast(`已填满可清退的 ${rows.reduce((a, r) => a + r.remaining, 0)} 节待排期课次`);
    }

    function validateDeduct() {
      const d = state.deduct;
      const ds = deductState();
      const errors = {};
      let rowError = false;
      ds.rows.forEach((row) => {
        if (!row.canEdit) return;
        if (row.invalid) { errors[row.key] = '请输入非负整数'; rowError = true; }
        else if (row.over) { errors[row.key] = `该价位最多可清退 ${row.remaining} 节待排期课次`; rowError = true; }
      });
      if (ds.selected.length === 0) errors.total = '请至少输入 1 节清退课次';
      else if (rowError) errors.total = '存在超出该价位剩余节数的输入，请调整后再提交';
      const note = d.note.trim();
      if (!note) errors.note = '请填写财务备注';
      else if (note.length > 200) errors.note = '财务备注最多 200 字';
      if (ds.fallbackSelected && d.proofs.length < 1) {
        errors.proof = '管理员兜底清退必须上传至少 1 张线下退款/转账截图凭证';
      } else if (d.proofs.length > 5) {
        errors.proof = '最多上传 5 张截图凭证';
      }
      d.errors = errors;
      return Object.keys(errors).length === 0 ? ds : null;
    }

    function firstError() {
      const e = state.deduct.errors || {};
      return e.total || e.note || e.proof || Object.values(e)[0] || '请检查清退信息';
    }

    function submitDeduct() {
      if (state.online === 'off') return showToast('离线模式下不可执行课次清退');
      const ds = validateDeduct();
      if (!ds) {
        renderOverlay();
        if (window.lucide) lucide.createIcons();
        showToast(firstError());
        return;
      }
      state.overlay = { type: 'confirm' };
      renderAll();
    }

    function nextRecordId() {
      const now = new Date();
      return `CD-${now.getFullYear()}${pad2(now.getMonth() + 1)}${pad2(now.getDate())}-${pad2(state.records.length + 1)}`;
    }

    function confirmDeduct() {
      if (state.online === 'off') return showToast('离线模式下不可执行课次清退');
      const ds = validateDeduct();
      if (!ds) {
        state.overlay = { type: 'deduct' };
        renderAll();
        showToast(firstError());
        return;
      }
      const d = state.deduct;
      const selected = ds.selected;
      const orderIds = [...new Set(selected.map((r) => r.orderId))];
      const changes = [];
      orderIds.forEach((id) => {
        const o = orderById(id);
        if (!o) return;
        const from = o.status;
        selected.filter((r) => r.orderId === id).forEach((r) => {
          const tier = o.tiers[r.idx];
          if (tier) tier.remaining = Math.max(0, tier.remaining - r.n);
        });
        const remaining = orderRemaining(o);
        o.status = (remaining + (o.scheduled || 0)) === 0 ? 'REFUNDED' : 'PARTIALLY_REFUNDED';
        changes.push({ orderId: id, from, to: o.status });
      });
      const holders = [...new Set(selected.map((r) => r.holder))];
      const isFallback = state.role === 'admin' && holders.some((h) => h !== '平台');
      const after = studentTotals(d.studentKey).pending;
      const record = {
        id: nextRecordId(),
        studentKey: d.studentKey,
        at: formatDateTime(new Date()),
        by: actor(),
        isFallback,
        note: d.note.trim(),
        items: selected.map((r) => ({ kind: r.kind, price: r.price, n: r.n, holder: r.holder, className: r.className })),
        n: ds.totalN,
        totalPoints: ds.totalPoints,
        orderIds,
        after,
        proofs: clone(d.proofs),
        statusChanges: changes
      };
      state.records.unshift(record);
      state.overlay = null;
      state.page = 'records';
      state.activeRecordId = null;
      state.activeStudentKey = d.studentKey;
      state.activeOrderId = null;
      state.back = null;
      renderAll();
      showToast(isFallback
        ? `已清退 ${ds.totalN} 节，退款总积分 ${ds.totalPoints} 积分，已向原持有人班长发送只读通知`
        : `已清退 ${ds.totalN} 节，退款总积分 ${ds.totalPoints} 积分，财务备注已留痕`);
    }

    function openRecord(id) {
      const r = recordById(id);
      if (!r || !canViewRecord(r)) return showToast('该清退记录不在当前可见范围内');
      captureBack();
      state.activeRecordId = id;
      state.page = 'record';
      state.overlay = null;
      renderAll();
    }

    function openStudent(key) {
      const s = studentByKey(key);
      if (!s) return;
      if (state.role === 'parent' && !PARENT_CHILDREN.includes(key)) return showToast('家长端仅可查看本人孩子的档案');
      captureBack();
      state.activeStudentKey = key;
      state.page = 'student';
      state.overlay = null;
      renderAll();
    }

    function openOrder(id) {
      const order = orderById(id);
      if (!order) return showToast('该购课单已归档，仅保留清退留痕');
      if (state.role === 'parent' && !PARENT_CHILDREN.includes(order.studentKey)) return showToast('家长端仅可查看本人孩子的购课单');
      captureBack();
      state.activeOrderId = id;
      state.page = 'order';
      state.overlay = null;
      renderAll();
    }

    function resetFilters() {
      state.query = '';
      state.range = '30';
      state.adminHolder = 'all';
      state.method = 'all';
      renderAll();
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    $('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'banner-back') {
        if (state.overlay) { state.overlay = null; renderAll(); return; }
        if (state.page !== 'records' && state.page !== 'placeholder') return goBack();
        return;
      }
      if (action === 'open-picker') return openPicker();
      if (action === 'pick-student') {
        state.overlay = null;
        return openDeduct(el.dataset.key);
      }
      if (action === 'open-student') return openStudent(el.dataset.key);
      if (action === 'open-order') return openOrder(el.dataset.id);
      if (action === 'open-record') return openRecord(el.dataset.id);
      if (action === 'open-deduct-student') {
        if (state.online === 'off') return showToast('离线模式下不可执行课次清退');
        return openDeduct(state.activeStudentKey);
      }
      if (action === 'open-deduct-order') {
        const order = orderById(el.dataset.id);
        if (!order) return;
        return openDeduct(order.studentKey);
      }
      if (action === 'close-overlay') { state.overlay = null; renderAll(); return; }
      if (action === 'set-range') {
        state.range = el.dataset.range;
        renderAll();
        return;
      }
      if (action === 'clear-search') {
        state.query = '';
        renderAll();
        const input = $('recordSearch');
        if (input) input.focus();
        return;
      }
      if (action === 'reset-filters') return resetFilters();
      if (action === 'tier-step') {
        const key = el.dataset.key;
        const row = pendingTierRows(state.deduct.studentKey).find((r) => r.key === key);
        if (!row || !rowEditable(row)) return;
        let n = parseQty(state.deduct.inputs[key] ?? '0');
        if (n === null) n = 0;
        n = Math.max(0, Math.min(row.remaining, n + Number(el.dataset.delta)));
        state.deduct.inputs[key] = String(n);
        state.deduct.errors = {};
        const input = document.querySelector(`[data-tier-input="${key}"]`);
        if (input) input.value = String(n);
        refreshDeductPreview();
        return;
      }
      if (action === 'clear-all') return clearAllRows();
      if (action === 'submit-deduct') return submitDeduct();
      if (action === 'back-to-deduct') {
        state.overlay = { type: 'deduct' };
        renderAll();
        return;
      }
      if (action === 'confirm-deduct') return confirmDeduct();
      if (action === 'remove-proof') {
        const idx = Number(el.dataset.idx);
        state.deduct.proofs.splice(idx, 1);
        state.deduct.errors = {};
        renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'sample-proof') {
        if (state.online === 'off') return showToast('离线模式下不可上传凭证');
        if (state.deduct.proofs.length >= 5) return showToast('最多上传 5 张截图凭证');
        const idx = state.deduct.proofs.length + 1;
        state.deduct.proofs.push({ name: `微信转账截图_示例${idx}.png`, size: (210 + idx * 35) * 1024 });
        state.deduct.errors = {};
        renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'preview-proof') return showToast('演示环境：凭证缩略图占位，实际以原图预览');
      if (action === 'go-schedule') return showToast('演示：已定位到学员课表，请对已排期课次发起请假');
    });

    $('frame').addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-action="open-record"]')) {
        e.preventDefault();
        openRecord(e.target.dataset.id);
      }
    });

    $('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (e.target.matches('[data-tier-input]')) {
        state.deduct.inputs[e.target.dataset.tierInput] = e.target.value;
        state.deduct.errors = {};
        refreshDeductPreview();
        return;
      }
      if (id === 'deductNote') {
        state.deduct.note = e.target.value;
        state.deduct.errors.note = '';
        refreshDeductPreview();
        return;
      }
      if (id === 'recordSearch') {
        state.query = e.target.value;
        const pos = e.target.selectionStart;
        $('content').innerHTML = renderContent();
        if (window.lucide) lucide.createIcons();
        const next = $('recordSearch');
        if (next) {
          next.focus();
          try { next.setSelectionRange(pos, pos); } catch (_) { /* noop */ }
        }
        return;
      }
    });

    $('frame').addEventListener('change', (e) => {
      if (e.target.id === 'adminHolderFilter') {
        state.adminHolder = e.target.value;
        renderAll();
        return;
      }
      if (e.target.id === 'methodFilter') {
        state.method = e.target.value;
        renderAll();
        return;
      }
      if (e.target.id === 'proofInput') {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        for (const file of files) {
          if (state.deduct.proofs.length >= 5) {
            showToast('最多上传 5 张截图凭证');
            break;
          }
          if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
            showToast('仅支持 JPG / PNG / WebP');
            continue;
          }
          if (file.size > 5 * 1024 * 1024) {
            showToast('单张凭证大小不能超过 5MB');
            continue;
          }
          state.deduct.proofs.push({ name: file.name, size: file.size });
        }
        state.deduct.errors = {};
        e.target.value = '';
        renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
    });

    function showToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.add('hidden'), 2600);
    }

    /* ------------------------------------------------------------------
     * 启动
     * ------------------------------------------------------------------ */
    (function boot() {
      if (state.page === 'record') {
        const target = recordById(state.activeRecordId);
        if (!target || !canViewRecord(target)) {
          const first = sortedRecords(scopedRecords())[0];
          if (first) state.activeRecordId = first.id;
          else state.page = 'records';
        }
      }
      if (state.page === 'student' && !studentByKey(state.activeStudentKey)) state.page = 'records';
      if (state.page === 'order' && !orderById(state.activeOrderId)) state.page = 'records';

      renderAll();

      if (bootOverlay === 'pick' && state.role !== 'parent' && state.online === 'on') {
        state.overlay = { type: 'pick' };
        renderAll();
      }
      if (bootOverlay === 'deduct' || bootOverlay === 'confirm') {
        const key = params.get('student') || (sortedRecords(scopedRecords())[0] || {}).studentKey || 'alice';
        openDeduct(key, bootPreset);
        if (bootOverlay === 'confirm' && state.overlay && state.overlay.type === 'deduct') {
          const ds = validateDeduct();
          if (ds) {
            state.overlay = { type: 'confirm' };
            renderAll();
          }
        }
      }
      if (bootScroll === 'summary') {
        const sheet = $('overlay').querySelector('[data-scroll]');
        const summary = $('deductSummary');
        if (sheet && summary) sheet.scrollTop = Math.max(0, summary.offsetTop - 80);
      }
      if (window.lucide) lucide.createIcons();
    })();
  </script>
</body>
</html>

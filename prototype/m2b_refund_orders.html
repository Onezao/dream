<!DOCTYPE html>
<html lang="zh-CN">
<!-- /** (c) 2024-2026 Topee (https://topee.top). All rights reserved. Proprietary and confidential. */ -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 - M2B 退款单与课时冲退</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{50:'#eef2ff',100:'#e0e7ff',500:'#4f46e5',600:'#4338ca',700:'#3730a3'}}}}}</script>
</head>
<body class="bg-slate-200 text-slate-800 min-h-screen">
<!-- 原型控制台 -->
<header class="bg-white border-b border-slate-200 px-3 py-2 sticky top-0 z-50 flex flex-wrap gap-2 items-center justify-center text-xs">
  <div class="inline-flex rounded-lg bg-slate-100 p-1" id="roleSwitch"></div>
  <div class="inline-flex rounded-lg bg-slate-100 p-1" id="variantSwitch"></div>
  <div class="inline-flex rounded-lg bg-slate-100 p-1" id="deviceSwitch"></div>
</header>

<main class="flex justify-center py-4">
  <div id="frame" class="relative w-[390px] max-w-full bg-slate-50 rounded-xl shadow-lg overflow-hidden min-h-[780px] flex flex-col">
    <!-- 顶栏 -->
    <div class="bg-brand-700 text-white px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div id="avatar" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center font-semibold text-sm">L</div>
        <div>
          <div id="whoName" class="text-sm font-semibold leading-tight">Leo · 班长</div>
          <div id="whoSub" class="text-sm text-indigo-200">退款管理</div>
        </div>
      </div>
      <button id="btnCreate" onclick="openCreate()" class="bg-white text-brand-700 text-sm font-medium rounded-lg px-3 py-1.5 flex items-center gap-1"><i data-lucide="plus" class="w-4 h-4"></i>新建退款单</button>
    </div>

    <!-- 筛选 -->
    <div class="bg-white border-b border-slate-200 px-3 py-2 flex gap-2 overflow-x-auto text-xs" id="filters"></div>

    <!-- 列表 -->
    <div id="list" class="flex-1 p-3 space-y-3"></div>

    <!-- Toast -->
    <div id="toast" class="hidden absolute left-1/2 -translate-x-1/2 bottom-6 bg-slate-900 text-white text-xs rounded-lg px-4 py-2 z-[70] max-w-[90%]"></div>

    <!-- 遮罩 -->
    <div id="mask" onclick="closeAll()" class="hidden absolute inset-0 bg-slate-900/50 z-40"></div>

    <!-- 新建退款单抽屉 -->
    <section id="createSheet" class="hidden absolute inset-x-0 bottom-0 top-8 bg-white rounded-t-xl z-50 flex flex-col">
      <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
        <h2 class="font-semibold text-sm">新建退款单</h2>
        <button onclick="closeAll()" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 space-y-5">
        <!-- 步骤一 -->
        <div class="space-y-3">
          <div class="text-xs font-semibold text-slate-500">① 选择源单（仅 1v1 · PAID）</div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">学生档案</label>
            <select id="selStudent" onchange="onStudentChange()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
              <option value="alice">AliceZ12</option>
              <option value="bob">BobZ10</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">原购课单</label>
            <div id="orderPick" class="space-y-2"></div>
          </div>
        </div>
        <!-- 步骤二 -->
        <div id="tsBlock" class="space-y-2">
          <div class="flex items-center justify-between">
            <div class="text-xs font-semibold text-slate-500">② 勾选待退课次（倒序）</div>
            <button onclick="toggleAllEligible()" class="text-xs text-brand-600">全选可退</button>
          </div>
          <div id="tsList" class="divide-y divide-slate-100 border border-slate-200 rounded-lg"></div>
        </div>
        <!-- 步骤三 -->
        <div id="calcBlock" class="space-y-3">
          <div class="text-xs font-semibold text-slate-500">③ 违约金与核算</div>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="rounded-lg bg-slate-50 p-3"><div class="text-slate-500">已选课时</div><div id="calcCount" class="text-lg font-semibold">0 节</div></div>
            <div class="rounded-lg bg-slate-50 p-3"><div class="text-slate-500">实付小计</div><div id="calcTotal" class="text-lg font-semibold">0 分</div></div>
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">扣除违约金（积分）</label>
            <div class="flex items-center gap-2">
              <button onclick="stepPenalty(-10)" class="w-9 h-9 rounded-lg border border-slate-300 text-lg">−</button>
              <input id="penalty" type="number" min="0" step="1" value="0" oninput="recalc()" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm text-center">
              <button onclick="stepPenalty(10)" class="w-9 h-9 rounded-lg border border-slate-300 text-lg">+</button>
            </div>
            <p id="penaltyErr" class="hidden text-xs text-red-600 mt-1"></p>
          </div>
          <div id="splitBox" class="hidden rounded-lg border border-amber-200 bg-amber-50 p-3 text-xs space-y-1">
            <div class="flex justify-between"><span>教师课酬补偿</span><b id="splitTeacher">0</b></div>
            <div class="flex justify-between"><span>平台工具费扣留</span><b id="splitTool">0</b></div>
            <div class="text-sm text-amber-700" id="splitFormula"></div>
          </div>
          <div class="rounded-lg bg-brand-50 p-4 text-center">
            <div class="text-xs text-brand-700">实际应退积分</div>
            <div id="calcRefund" class="text-3xl font-bold text-brand-700">0</div>
          </div>
        </div>
        <!-- 步骤四 -->
        <div>
          <label class="block text-xs text-slate-600 mb-1">退款原因（必填）</label>
          <textarea id="reason" rows="3" maxlength="200" oninput="recalc()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="如：家庭搬迁，协商退课"></textarea>
        </div>
      </div>
      <div class="p-3 border-t border-slate-200 flex gap-2">
        <button onclick="closeAll()" class="flex-1 border border-slate-300 rounded-lg py-2.5 text-sm">取消</button>
        <button id="btnSubmit" onclick="submitCreate()" class="flex-[2] bg-brand-600 text-white rounded-lg py-2.5 text-sm font-medium disabled:bg-slate-300" disabled>创建退款单</button>
      </div>
    </section>

    <!-- 详情抽屉 -->
    <section id="detailSheet" class="hidden absolute inset-x-0 bottom-0 top-16 bg-white rounded-t-xl z-50 flex flex-col">
      <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
        <h2 id="detailTitle" class="font-semibold text-sm">退款单详情</h2>
        <button onclick="closeAll()" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="detailBody" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm"></div>
    </section>

    <!-- 确认退款弹窗 -->
    <section id="confirmModal" class="hidden absolute inset-x-3 top-16 bg-white rounded-xl z-[60] shadow-xl max-h-[85%] overflow-y-auto">
      <div class="p-4 space-y-3">
        <h3 class="font-semibold text-sm">确认退款完成</h3>
        <div id="confirmSummary" class="rounded-lg bg-slate-50 p-3 text-xs space-y-1"></div>
        <div class="text-xs text-slate-600">请按 1 积分 = 1 元，线下向家长账号打款后上传凭证（JPG/PNG/PDF，≤10MB，最多 5 张）。</div>
        <button onclick="addProof()" class="w-full border border-dashed border-slate-300 rounded-lg py-4 text-xs text-slate-500 flex items-center justify-center gap-1"><i data-lucide="upload" class="w-4 h-4"></i>上传凭证（模拟）</button>
        <div id="proofList" class="grid grid-cols-3 gap-2"></div>
        <p class="text-sm text-red-600">确认后所选课次立即核销作废并释放排课日历，不可撤销。</p>
        <div class="flex gap-2">
          <button onclick="closeModal()" class="flex-1 border border-slate-300 rounded-lg py-2.5 text-sm">暂存凭证</button>
          <button id="btnConfirm" onclick="doConfirm()" class="flex-[2] bg-brand-600 text-white rounded-lg py-2.5 text-sm font-medium disabled:bg-slate-300" disabled>确认退款完成</button>
        </div>
      </div>
    </section>

    <!-- 作废弹窗 -->
    <section id="cancelModal" class="hidden absolute inset-x-3 top-24 bg-white rounded-xl z-[60] shadow-xl">
      <div class="p-4 space-y-3">
        <h3 class="font-semibold text-sm">作废退款单</h3>
        <div>
          <label class="block text-xs text-slate-600 mb-1">作废原因（1-200 字，必填）</label>
          <textarea id="cancelReason" rows="3" maxlength="200" oninput="document.getElementById('btnCancelOk').disabled=!this.value.trim()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>
        <p class="text-sm text-slate-500">作废后关联课次解除锁定，恢复退款前状态。</p>
        <div class="flex gap-2">
          <button onclick="closeModal()" class="flex-1 border border-slate-300 rounded-lg py-2.5 text-sm">返回</button>
          <button id="btnCancelOk" onclick="doCancel()" class="flex-[2] bg-red-600 text-white rounded-lg py-2.5 text-sm font-medium disabled:bg-slate-300" disabled>确认作废</button>
        </div>
      </div>
    </section>
  </div>
</main>

<script>
const S = { role:'monitor', variant:'A', device:'phone', filter:'ALL', orderId:null, picked:new Set(), activeRefund:null, proofs:0 };
const STU = { alice:'AliceZ12', bob:'BobZ10' };
const mk=(o,no,status,hours,extra={})=>({id:o+'-'+no,no,status,pts:100,salary:70,prep:0,tool:30,hours,transferred:false,teacher:'Teacher David',time:'',...extra});
const ORDERS = [
  { id:'ord_20261105001', student:'alice', type:'1v1 固定位', status:'PAID', partial:false, quota:2, ts:[
    mk('a',1,'FINISHED',-200,{time:'已结课'}), mk('a',2,'FINISHED',-100,{time:'已结课'}),
    mk('a',3,'SCHEDULED',10,{time:'11-06 周五 16:00'}),
    mk('a',4,'SCHEDULED',3,{time:'11-05 周四 19:00'}),
    mk('a',5,'SCHEDULED',120,{time:'11-10 周二 16:00'}),
    mk('a',6,'SCHEDULED',140,{time:'11-12 周四 16:00',transferred:true,teacher:'Teacher David'}),
    mk('a',7,'PENDING_SCHEDULE',null,{time:'待排期',teacher:'—'}),
    mk('a',8,'PENDING_SCHEDULE',null,{time:'待排期',teacher:'—',pts:104,salary:72,prep:2,tool:30}) ] },
  { id:'ord_20261103007', student:'bob', type:'1v1 临时课', status:'PAID', partial:false, quota:1, ts:[
    mk('b',1,'REFUND_LOCKED',200,{time:'11-20 周五 10:00'}), mk('b',2,'REFUND_LOCKED',null,{time:'待排期',teacher:'—'}),
    mk('b',3,'PENDING_SCHEDULE',null,{time:'待排期',teacher:'—'}), mk('b',4,'PENDING_SCHEDULE',null,{time:'待排期',teacher:'—'}) ] }
];
const REFUNDS = [
  { id:'RF202611040003', orderId:'ord_20261103007', student:'bob', ts:['b-1','b-2'], total:200, penalty:20, pT:14, pTool:6, refund:180, status:'PENDING_REFUND', by:'Leo', at:'11-04 15:20', reason:'孩子课业繁忙', proofs:0 },
  { id:'RF202611010001', orderId:'ord_20261101002', student:'alice', ts:[], n:2, total:200, penalty:0, pT:0, pTool:0, refund:200, status:'REFUNDED', by:'Leo', at:'11-01 10:05', reason:'家庭搬迁', proofs:2 },
  { id:'RF202610280002', orderId:'ord_20261028005', student:'alice', ts:[], n:1, total:100, penalty:10, pT:7, pTool:3, refund:90, status:'CANCELLED', by:'Leo', at:'10-28 18:40', reason:'录入有误', cancelReason:'家长反悔，继续上课', proofs:0 }
];
const ST = {
  PENDING_REFUND:['待打款确认','bg-amber-100 text-amber-700'], REFUNDED:['已退款','bg-emerald-100 text-emerald-700'], CANCELLED:['已作废','bg-slate-200 text-slate-600'] };
const $=id=>document.getElementById(id);
const ord=id=>ORDERS.find(o=>o.id===id);
const allTs=()=>ORDERS.flatMap(o=>o.ts);
const eligible=t=>(t.status==='PENDING_SCHEDULE'||t.status==='SCHEDULED')&&!t.transferred&&(t.hours===null||t.hours>=24);
const ico=()=>lucide.createIcons();
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)};
const seg=(el,items,cur,fn)=>{$(el).innerHTML=items.map(([k,l])=>`<button onclick="${fn}('${k}')" class="px-3 py-1.5 rounded-md font-medium ${k===cur?'bg-white text-slate-900 shadow-sm':'text-slate-500'}">${l}</button>`).join('')};

function renderControls(){
  seg('roleSwitch',[['monitor','班长 Leo'],['parent','家长 Amy']],S.role,'setRole');
  seg('variantSwitch',[['A','方案A 紧凑'],['B','方案B 拆分展开']],S.variant,'setVariant');
  seg('deviceSwitch',[['phone','手机 390'],['tablet','平板 768']],S.device,'setDevice');
}
function setRole(r){S.role=r;const m=r==='monitor';
  $('avatar').textContent=m?'L':'A';$('whoName').textContent=m?'Leo · 班长':'Amy · 家长（只读）';
  $('whoSub').textContent=m?'退款管理':'账单中心 · 退款记录 · AliceZ12';
  $('btnCreate').classList.toggle('hidden',!m);renderAll()}
function setVariant(v){S.variant=v;renderAll()}
function setDevice(d){S.device=d;$('frame').className=`relative ${d==='phone'?'w-[390px]':'w-[768px]'} max-w-full bg-slate-50 rounded-xl shadow-lg overflow-hidden min-h-[780px] flex flex-col`;renderAll()}
function setFilter(f){S.filter=f;renderAll()}

function visibleRefunds(){
  return REFUNDS.filter(r=>(S.role==='monitor'||r.student==='alice')&&(S.filter==='ALL'||r.status===S.filter));
}
function renderFilters(){
  const f=[['ALL','全部'],['PENDING_REFUND','待打款确认'],['REFUNDED','已退款'],['CANCELLED','已作废']];
  $('filters').innerHTML=f.map(([k,l])=>`<button onclick="setFilter('${k}')" class="shrink-0 px-3 py-1.5 rounded-lg ${S.filter===k?'bg-brand-600 text-white':'bg-slate-100 text-slate-600'}">${l}</button>`).join('');
}
function card(r){
  const [label,cls]=ST[r.status]; const n=r.n||r.ts.length;
  const acts=S.role==='monitor'&&r.status==='PENDING_REFUND'?`<div class="flex gap-2 pt-2">
     <button onclick="openConfirm('${r.id}')" class="flex-1 bg-brand-600 text-white rounded-lg py-2 text-xs font-medium">上传凭证与确认</button>
     <button onclick="openCancel('${r.id}')" class="px-4 border border-red-300 text-red-600 rounded-lg py-2 text-xs">作废</button></div>`:'';
  const split=S.variant==='B'?`<div class="grid grid-cols-3 gap-2 text-sm pt-2">
     <div class="rounded-lg bg-slate-50 p-2"><div class="text-slate-500">违约金</div><b>${r.penalty}</b></div>
     <div class="rounded-lg bg-slate-50 p-2"><div class="text-slate-500">教师补偿</div><b>${r.pT}</b></div>
     <div class="rounded-lg bg-slate-50 p-2"><div class="text-slate-500">工具费</div><b>${r.pTool}</b></div></div>`:'';
  return `<div class="bg-white rounded-xl border border-slate-200 p-3">
    <div class="flex items-center justify-between"><button onclick="openDetail('${r.id}')" class="font-mono text-xs text-brand-600">${r.id}</button>
      <span class="text-sm px-2 py-0.5 rounded-full ${cls}">${label}</span></div>
    <div class="flex items-end justify-between mt-2">
      <div class="text-xs text-slate-500">${STU[r.student]} · ${n} 节 · ${r.by} · ${r.at}</div>
      <div class="text-right"><div class="text-sm text-slate-500">实退积分</div><div class="text-xl font-bold">${r.refund}</div></div></div>
    ${split}${acts}</div>`;
}
function renderList(){
  const rs=visibleRefunds();
  const grid=S.device==='tablet'?'grid grid-cols-2 gap-3 content-start':'space-y-3';
  $('list').className=`flex-1 p-3 ${grid}`;
  $('list').innerHTML=rs.length?rs.map(card).join(''):'<div class="text-center text-sm text-slate-400 py-16 col-span-2">暂无退款单记录</div>';
}
function renderAll(){renderControls();renderFilters();renderList();ico()}

/* ===== 新建 ===== */
function openSheet(id){$('mask').classList.remove('hidden');$(id).classList.remove('hidden');ico()}
function closeModal(){['confirmModal','cancelModal'].forEach(i=>$(i).classList.add('hidden'));
  if($('detailSheet').classList.contains('hidden')&&$('createSheet').classList.contains('hidden'))$('mask').classList.add('hidden')}
function closeAll(){['createSheet','detailSheet','confirmModal','cancelModal','mask'].forEach(i=>$(i).classList.add('hidden'))}
function openCreate(){S.picked=new Set();S.orderId=null;$('penalty').value=0;$('reason').value='';onStudentChange();openSheet('createSheet')}
function onStudentChange(){
  const sid=$('selStudent').value;const os=ORDERS.filter(o=>o.student===sid&&o.status==='PAID');
  S.orderId=os[0]?os[0].id:null;S.picked=new Set();renderOrderPick();renderTs();recalc()}
function renderOrderPick(){
  const sid=$('selStudent').value;
  $('orderPick').innerHTML=ORDERS.filter(o=>o.student===sid).map(o=>{const left=o.ts.filter(t=>!['CANCELLED','FINISHED'].includes(t.status)).length;
    return `<button onclick="pickOrder('${o.id}')" class="w-full text-left border rounded-lg p-3 text-xs ${S.orderId===o.id?'border-brand-500 bg-brand-50':'border-slate-300'}">
      <div class="font-mono">${o.id}</div><div class="text-slate-500 mt-1">${o.type} · 共 ${o.ts.length} 节 · 剩余可用 ${left} 节</div></button>`}).join('');
}
function pickOrder(id){S.orderId=id;S.picked=new Set();renderOrderPick();renderTs();recalc()}
function renderTs(){
  const o=ord(S.orderId);if(!o){$('tsList').innerHTML='';return}
  const rows=o.ts.filter(t=>!['FINISHED','CANCELLED'].includes(t.status)).slice().reverse();
  $('tsList').innerHTML=rows.map(t=>{
    let tag='',dis=false;
    if(t.status==='REFUND_LOCKED'){dis=true;tag='<span class="text-sm px-1.5 rounded bg-slate-200 text-slate-600">已被其他退款单锁定</span>'}
    else if(t.transferred){dis=true;tag='<span class="text-sm px-1.5 rounded bg-red-100 text-red-600">已跨家长转让，不可原路退款</span>'}
    else if(t.hours!==null&&t.hours<24){dis=true;tag='<span class="text-sm px-1.5 rounded bg-amber-100 text-amber-700">开课前 24 小时内禁止退款，仅可同师改期或转让</span>'}
    const remark=t.pts!==100?' <span class="text-sm text-amber-700">含尾差</span>':'';
    return `<label class="flex gap-3 p-3 ${dis?'opacity-60':''}"><input type="checkbox" class="mt-1 w-4 h-4" ${dis?'disabled':''} ${S.picked.has(t.id)?'checked':''} onchange="togglePick('${t.id}')">
      <div class="flex-1 text-xs space-y-1"><div class="flex justify-between"><b>TS #${t.no}</b><span>${t.pts} 分${remark}</span></div>
      <div class="text-slate-500">${t.status==='SCHEDULED'?'已排期':t.status==='PENDING_SCHEDULE'?'待排期':'退款锁定'} · ${t.teacher} · ${t.time}</div>${tag}</div></label>`}).join('');
}
function togglePick(id){S.picked.has(id)?S.picked.delete(id):S.picked.add(id);recalc()}
function toggleAllEligible(){const o=ord(S.orderId);if(!o)return;const el=o.ts.filter(eligible);
  const all=el.every(t=>S.picked.has(t.id));el.forEach(t=>all?S.picked.delete(t.id):S.picked.add(t.id));renderTs();recalc()}
function stepPenalty(d){$('penalty').value=Math.max(0,(parseInt($('penalty').value)||0)+d);recalc()}
function calc(){
  const o=ord(S.orderId);const sel=o?o.ts.filter(t=>S.picked.has(t.id)):[];
  const total=sel.reduce((a,t)=>a+t.pts,0);
  const sT=sel.reduce((a,t)=>a+t.salary+t.prep,0), sTool=sel.reduce((a,t)=>a+t.tool,0);
  const raw=$('penalty').value;const pen=Number(raw||0);
  let err='';
  if(!Number.isInteger(pen)||pen<0)err='违约金必须为不小于 0 的整数';
  else if(pen>total)err='违约金不能大于勾选课次的总实付积分';
  const pT=(sT+sTool)>0&&!err?Math.floor(pen*sT/(sT+sTool)):0;
  return {sel,total,sT,sTool,pen:err?0:pen,err,pT,pTool:err?0:pen-pT,refund:total-(err?0:pen)};
}
function recalc(){
  const c=calc();
  $('calcCount').textContent=c.sel.length+' 节';$('calcTotal').textContent=c.total+' 分';
  $('penaltyErr').classList.toggle('hidden',!c.err);$('penaltyErr').textContent=c.err;
  $('penalty').classList.toggle('border-red-500',!!c.err);
  $('splitBox').classList.toggle('hidden',!(c.pen>0));
  $('splitTeacher').textContent=c.pT+' 分';$('splitTool').textContent=c.pTool+' 分';
  $('splitFormula').textContent=`课酬基准 ${c.sT} : 工具费基准 ${c.sTool}；教师向下取整，余数归平台，合计 ${c.pen}`;
  $('calcRefund').textContent=c.refund;
  $('btnSubmit').disabled=!(c.sel.length>=1&&!c.err&&$('reason').value.trim());
}
function submitCreate(){
  const c=calc();const o=ord(S.orderId);
  c.sel.forEach(t=>{t.prev=t.status;t.status='REFUND_LOCKED'});
  const id='RF2026110'+(50+REFUNDS.length)+'0'+REFUNDS.length;
  REFUNDS.unshift({id,orderId:o.id,student:o.student,ts:c.sel.map(t=>t.id),total:c.total,penalty:c.pen,pT:c.pT,pTool:c.pTool,refund:c.refund,status:'PENDING_REFUND',by:'Leo',at:'刚刚',reason:$('reason').value.trim(),proofs:0});
  closeAll();S.filter='ALL';renderAll();toast('已创建，所选课次已预锁定')}

/* ===== 详情 / 确认 / 作废 ===== */
function openDetail(id){
  const r=REFUNDS.find(x=>x.id===id);const [label,cls]=ST[r.status];
  const lines=r.ts.length?r.ts.map(tid=>{const t=allTs().find(x=>x.id===tid);return `<div class="flex justify-between text-xs py-1.5"><span>TS #${t.no} · ${t.time}</span><span>${t.status==='CANCELLED'?'已取消':'退款锁定'}</span></div>`}).join(''):`<div class="text-xs text-slate-500">历史单据：共 ${r.n} 节</div>`;
  $('detailTitle').textContent='退款单详情';
  $('detailBody').innerHTML=`<div class="flex justify-between items-center"><span class="font-mono text-xs">${r.id}</span><span class="text-sm px-2 py-0.5 rounded-full ${cls}">${label}</span></div>
   <div class="grid grid-cols-2 gap-2 text-xs">
     <div class="rounded-lg bg-slate-50 p-3"><div class="text-slate-500">实付小计</div><b>${r.total}</b></div>
     <div class="rounded-lg bg-slate-50 p-3"><div class="text-slate-500">实退积分</div><b>${r.refund}</b></div>
     <div class="rounded-lg bg-slate-50 p-3"><div class="text-slate-500">教师课酬补偿</div><b>${r.pT}</b></div>
     <div class="rounded-lg bg-slate-50 p-3"><div class="text-slate-500">平台工具费</div><b>${r.pTool}</b></div></div>
   <div class="text-xs text-slate-600">原购课单 <span class="font-mono">${r.orderId}</span><br>退款原因：${r.reason}${r.cancelReason?'<br>作废原因：'+r.cancelReason:''}</div>
   <div><div class="text-xs font-semibold text-slate-500 mb-1">冲退课次</div><div class="divide-y divide-slate-100">${lines}</div></div>
   <div class="text-xs text-slate-500">打款凭证：${r.proofs} 张</div>
   ${r.status==='REFUNDED'?'<div class="text-xs rounded-lg bg-emerald-50 text-emerald-700 p-3">已释放排期日历为空闲，并已通知管理员邮箱。请假配额保持原值。</div>':''}`;
  openSheet('detailSheet');
}
function openConfirm(id){S.activeRefund=id;const r=REFUNDS.find(x=>x.id===id);S.proofs=r.proofs;
  $('confirmSummary').innerHTML=`<div class="font-mono">${r.id}</div><div>${STU[r.student]} · 应退 <b>${r.refund}</b> 积分（¥${r.refund}）</div>`;
  renderProofs();$('mask').classList.remove('hidden');$('confirmModal').classList.remove('hidden');ico()}
function addProof(){if(S.proofs>=5)return toast('每单最多 5 张凭证');S.proofs++;renderProofs()}
function delProof(){S.proofs--;renderProofs()}
function renderProofs(){
  $('proofList').innerHTML=Array.from({length:S.proofs},(_,i)=>`<div class="relative h-16 rounded-lg bg-slate-100 border border-slate-200 flex items-center justify-center text-sm text-slate-500">凭证 ${i+1}<button onclick="delProof()" class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-slate-700 text-white text-xs">×</button></div>`).join('');
  $('btnConfirm').disabled=S.proofs<1}
function doConfirm(){
  const r=REFUNDS.find(x=>x.id===S.activeRefund);
  if(r.status!=='PENDING_REFUND')return toast('单据已处于终态（409）');
  r.status='REFUNDED';r.proofs=S.proofs;r.at='刚刚';
  const o=ord(r.orderId);let released=0;
  r.ts.forEach(tid=>{const t=allTs().find(x=>x.id===tid);if(t.prev==='SCHEDULED'||t.hours!==null)released++;t.status='CANCELLED'});
  const left=o.ts.filter(t=>!['CANCELLED','FINISHED'].includes(t.status)).length;
  if(left===0)o.status='REFUNDED';else o.partial=true;
  closeAll();renderAll();
  toast(`已退款，释放 ${released} 个日历时段；主单${left===0?'全额退款':'部分退款(配额不变)'}`)}
function openCancel(id){S.activeRefund=id;$('cancelReason').value='';$('btnCancelOk').disabled=true;$('mask').classList.remove('hidden');$('cancelModal').classList.remove('hidden')}
function doCancel(){
  const r=REFUNDS.find(x=>x.id===S.activeRefund);
  if(r.status!=='PENDING_REFUND')return toast('单据已处于终态（409）');
  r.status='CANCELLED';r.cancelReason=$('cancelReason').value.trim();
  r.ts.forEach(tid=>{const t=allTs().find(x=>x.id===tid);t.status=t.prev||(t.hours===null?'PENDING_SCHEDULE':'SCHEDULED')});
  closeAll();renderAll();toast('已作废，课次恢复可用')}

setRole('monitor');setDevice('phone');
</script>
</body>

<!-- 即抛型演示：课次清退/扣减与财务备注留痕。纯前端 Mock，不连接后端，不触碰生产代码。遵循 DESIGN.md 与 docs/prd/m2b_refund_orders.md -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>课次清退与财务备注 · Dream</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Inter', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800 antialiased">

  <!-- 演示控制台（不属于产品界面） -->
  <header id="console" class="sticky top-0 z-[60] border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-5 gap-y-2 px-4 py-2.5 text-[12px]">
      <div class="flex items-center gap-2">
        <span class="grid h-6 w-6 place-items-center rounded-lg bg-slate-900 text-amber-300"><i data-lucide="undo-2" class="h-3.5 w-3.5"></i></span>
        <span class="text-[14px] font-bold text-slate-900">课次清退</span>
        <span class="hidden text-[12px] font-medium text-slate-500 lg:inline">剩余待排课次扣减 · 财务备注留痕 · 周转账单零耦合</span>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">身份</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="role" data-value="monitor" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">班长</button>
          <button data-group="role" data-value="admin" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">管理员</button>
          <button data-group="role" data-value="parent" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">家长</button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">设备</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="device" data-value="mobile" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">手机</button>
          <button data-group="device" data-value="tablet" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">平板</button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">网络</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="online" data-value="on" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">在线</button>
          <button data-group="online" data-value="off" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">离线</button>
        </div>
      </div>

      <button id="btnResetDemo" class="rounded-lg border border-slate-200 px-2.5 py-1.5 font-semibold text-slate-500 hover:bg-slate-50">重置</button>

      <div class="ml-auto hidden items-center gap-1.5 lg:flex">
        <a href="../docs/prd/m2b_refund_orders.md" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 px-2.5 py-1.5 font-semibold text-slate-500 hover:bg-slate-50">
          <i data-lucide="file-text" class="h-3.5 w-3.5"></i>课次清退 PRD
        </a>
        <a href="m2a_course_orders.html" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 px-2.5 py-1.5 font-semibold text-slate-500 hover:bg-slate-50">
          <i data-lucide="receipt" class="h-3.5 w-3.5"></i>购课单
        </a>
      </div>
    </div>
  </header>

  <main class="flex justify-center px-4 py-6">
    <div id="frame" class="relative flex h-[812px] w-[390px] shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300">
      <div id="banner" class="shrink-0"></div>
      <div id="offlineBanner" class="hidden"></div>
      <div id="content" class="min-h-0 flex-1 overflow-y-auto overflow-x-hidden"></div>
      <nav id="bottomnav" class="shrink-0"></nav>
      <div id="overlay"></div>
      <div id="toast" class="pointer-events-none absolute bottom-20 left-1/2 z-[100] hidden w-max max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl bg-slate-900/90 px-4 py-2 text-center text-[12px] font-semibold leading-relaxed text-white shadow-xl"></div>
    </div>
  </main>

  <!-- Tailwind CDN 动态类安全垫 -->
  <div class="hidden">
    <span class="bg-gradient-to-br from-slate-800 via-blue-900 to-slate-700 from-slate-900 via-fuchsia-950 to-slate-800 from-slate-900 via-violet-950 to-slate-800"></span>
    <span class="bg-amber-50/80 border-amber-200/70 bg-amber-100 text-amber-800 text-amber-700 text-amber-950 text-amber-900/85 bg-amber-600 hover:bg-amber-700 border-amber-300 bg-white/70 bg-amber-50/50 bg-amber-50 text-amber-900 ring-1 ring-amber-300"></span>
    <span class="bg-emerald-50/80 border-emerald-200/70 bg-emerald-100 text-emerald-800 text-emerald-700 text-emerald-950 text-emerald-900/85 bg-emerald-600 hover:bg-emerald-700 border-emerald-300 bg-white/70 bg-emerald-50"></span>
    <span class="bg-rose-50/80 border-rose-200/70 bg-rose-100 text-rose-800 text-rose-700 text-rose-950 text-rose-900/85 bg-rose-600 hover:bg-rose-700 border-rose-300 bg-white/70 bg-rose-50"></span>
    <span class="bg-slate-50 border-slate-200/80 bg-slate-100 text-slate-700 text-slate-600 text-slate-500 bg-slate-400 bg-slate-900 hover:bg-slate-800 border-slate-300 bg-white/70 text-slate-300 bg-slate-50/80 opacity-65"></span>
    <span class="bg-indigo-50/80 border-indigo-200/70 bg-indigo-100 text-indigo-800 text-indigo-700 text-indigo-950 text-indigo-900/85 bg-indigo-600 hover:bg-indigo-700 border-indigo-300 bg-white/70"></span>
    <span class="bg-white/60 bg-white/70 bg-white/20 bg-white/15 ring-white/30 bg-slate-900/40 backdrop-blur-[1px]"></span>
    <span class="h-[812px] w-[390px] h-[860px] w-[768px] max-h-[92%] max-w-[560px] max-w-[360px] grid-cols-1 grid-cols-2 grid-cols-3 line-clamp-2"></span>
  </div>

  <script>
    /* ------------------------------------------------------------------
     * 演示数据
     * ------------------------------------------------------------------ */
    const STUDENTS = [
      { key: 'alice', name: 'AliceZ12', nickname: '跳跳', age: '10岁', holder: 'Leo' },
      { key: 'bob', name: 'BobZ10', nickname: '豆豆', age: '8岁', holder: 'Leo' },
      { key: 'emma', name: 'EmmaZ10', nickname: '果果', age: '10岁', holder: 'Amy' }
    ];
    const PARENT_CHILDREN = ['alice', 'bob'];

    const INITIAL_ORDERS = [
      { id: 'CO-20261110-01', studentKey: 'alice', type: '1v1 固定位', status: 'PAID', total: 14, pending: 6, scheduled: 2, finished: 6 },
      { id: 'CO-20261012-02', studentKey: 'alice', type: '1v1 临时课', status: 'REFUNDED', total: 8, pending: 0, scheduled: 0, finished: 6 },
      { id: 'CO-20261025-01', studentKey: 'bob', type: '1v1 临时课', status: 'PAID', total: 4, pending: 2, scheduled: 0, finished: 2 },
      { id: 'CO-20261002-09', studentKey: 'emma', type: '1v1 固定位', status: 'PARTIALLY_REFUNDED', total: 13, pending: 4, scheduled: 1, finished: 8 }
    ];

    const INITIAL_RECORDS = [
      {
        id: 'CD-20261108-02', studentKey: 'alice', at: '2026-11-08 20:15', n: 2, by: 'Leo',
        note: '家长调整课业安排，线下微信退费 ¥200，退回 2 节临时课。',
        orderId: 'CO-20261012-02', after: 6, prevStatus: 'PAID', newStatus: 'REFUNDED',
        proof: { name: '微信打款凭证_20261108.png', size: 245 * 1024 }
      },
      {
        id: 'CD-20261105-01', studentKey: 'emma', at: '2026-11-05 16:40', n: 3, by: 'Amy',
        note: '家长移居停课，线下支付宝退费 ¥450，已与家长核对剩余课次。',
        orderId: 'CO-20261002-09', after: 4, prevStatus: 'PAID', newStatus: 'PARTIALLY_REFUNDED',
        proof: null
      }
    ];

    const NAVS = {
      monitor: [
        { id: 'home', icon: 'home', label: '首页', desc: '班长首页与教务待办。', href: 'm0_workspace_home.html?role=monitor' },
        { id: 'schedule', icon: 'calendar-days', label: '学员课表', desc: '自家孩子的周度课表。', href: 'm3a_calendar_grid.html' },
        { id: 'ops', icon: 'layout-grid', label: '教务中心', desc: '课次清退、购课单与学员教务。', board: true },
        { id: 'me', icon: 'user', label: '我的', desc: '班长周转账与家庭多孩档案。', href: 'm0_workspace_home.html?role=monitor&view=me' }
      ],
      parent: [
        { id: 'home', icon: 'home', label: '首页', desc: '多孩时间流与常用入口。', href: 'm0_workspace_home.html?role=user' },
        { id: 'schedule', icon: 'calendar-days', label: '学员课表', desc: '七色课表与多孩切换。', href: 'm3a_calendar_grid.html' },
        { id: 'hall', icon: 'plus-circle', label: '约课大厅', desc: '老师与小班选课。', href: 'm1c_classes.html' },
        { id: 'me', icon: 'user', label: '我的', desc: '学员档案、账单与课次记录。', board: true }
      ],
      admin: [
        { id: 'home', icon: 'home', label: '首页', desc: '平台结算待办与运营大盘。', href: 'm0_workspace_home.html?role=admin' },
        { id: 'schedule', icon: 'calendar-days', label: '学员课表', desc: '自家孩子的周度课表。', href: 'm3a_calendar_grid.html' },
        { id: 'ops', icon: 'layout-grid', label: '教务中心', desc: '全校老师、学员与小班的教务运营入口。', href: 'm0_workspace_home.html?role=admin&view=ops' },
        { id: 'settings', icon: 'settings', label: '管理与设置', desc: '全平台学员课次清退留痕与财务备注。', board: true }
      ]
    };

    const ROLE_META = {
      monitor: { banner: 'from-slate-900 via-fuchsia-950 to-slate-800', initial: 'L', boardTab: 'ops' },
      parent: { banner: 'from-slate-800 via-blue-900 to-slate-700', initial: 'A', boardTab: 'me' },
      admin: { banner: 'from-slate-900 via-violet-950 to-slate-800', initial: 'S', boardTab: 'settings' }
    };

    const PATTERNS = {
      monitor: `<svg class="pointer-events-none absolute inset-0 h-full w-full" viewBox="0 0 390 80" preserveAspectRatio="xMidYMid slice" fill="none"><path d="M0 20 H390 M0 40 H390 M0 60 H390" stroke="white" stroke-opacity=".06"/><path d="M65 0 V80 M130 0 V80 M195 0 V80 M260 0 V80 M325 0 V80" stroke="white" stroke-opacity=".04"/><circle cx="330" cy="20" r="34" fill="white" fill-opacity=".05"/></svg>`,
      parent: `<svg class="pointer-events-none absolute inset-0 h-full w-full" viewBox="0 0 390 80" preserveAspectRatio="xMidYMid slice" fill="none"><path d="M-20 64 C50 30 110 82 190 48 S300 18 410 44" stroke="white" stroke-opacity=".10" stroke-width="18" stroke-linecap="round"/><circle cx="320" cy="20" r="34" fill="white" fill-opacity=".05"/></svg>`,
      admin: `<svg class="pointer-events-none absolute inset-0 h-full w-full" viewBox="0 0 390 80" preserveAspectRatio="xMidYMid slice" fill="none"><circle cx="325" cy="18" r="38" stroke="white" stroke-opacity=".08"/><circle cx="325" cy="18" r="24" stroke="white" stroke-opacity=".06"/><path d="M0 68 C60 40 120 82 190 52 S300 20 390 48" stroke="white" stroke-opacity=".07" stroke-width="16" stroke-linecap="round"/></svg>`
    };

    /* ------------------------------------------------------------------
     * 状态与工具
     * ------------------------------------------------------------------ */
    function clone(v) { return JSON.parse(JSON.stringify(v)); }

    const state = {
      role: 'monitor',
      page: 'list',
      navTab: 'ops',
      device: 'mobile',
      online: 'on',
      activeStudent: 'alice',
      activeRecordId: null,
      holderFilter: 'all',
      query: '',
      overlay: null,
      deduct: { orderId: null, count: '1', note: '', proof: null, errorCount: '', errorNote: '' },
      orders: clone(INITIAL_ORDERS),
      records: clone(INITIAL_RECORDS)
    };
    let lastViewKey = null;

    const params = new URLSearchParams(location.search);
    if (['monitor', 'parent', 'admin'].includes(params.get('role'))) {
      state.role = params.get('role');
      state.navTab = ROLE_META[state.role].boardTab;
    }
    if (params.get('device') === 'tablet') state.device = 'tablet';
    if (params.get('online') === 'off') state.online = 'off';
    if (params.get('student')) state.activeStudent = params.get('student');
    if (['all', 'Leo', 'Amy'].includes(params.get('holder'))) state.holderFilter = params.get('holder');
    if (params.get('page') === 'detail') {
      state.page = 'detail';
      state.activeRecordId = params.get('record') || null;
    }
    const bootOverlay = params.get('overlay');

    const $ = (id) => document.getElementById(id);
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const fmtSize = (n) => (n >= 1024 * 1024 ? `${(n / 1024 / 1024).toFixed(1)}MB` : `${Math.max(1, Math.round(n / 1024))}KB`);

    function roleMeta() { return ROLE_META[state.role]; }
    function navItems() { return NAVS[state.role]; }
    function boardTab() { return roleMeta().boardTab; }
    function actor() { return state.role === 'admin' ? 'Sarah' : state.role === 'monitor' ? 'Leo' : 'Amy'; }
    function studentByKey(key) { return STUDENTS.find((s) => s.key === key) || null; }
    function studentName(key) { const s = studentByKey(key); return s ? s.name : key; }
    function studentNickname(key) { const s = studentByKey(key); return s ? s.nickname : ''; }
    function orderById(id) { return state.orders.find((o) => o.id === id) || null; }
    function recordById(id) { return state.records.find((r) => r.id === id) || null; }
    function ordersForStudent(key) { return state.orders.filter((o) => o.studentKey === key); }
    function recordsFor(key) { return state.records.filter((r) => r.studentKey === key); }

    function assetOf(key) {
      const list = ordersForStudent(key);
      return {
        pending: list.reduce((a, o) => a + o.pending, 0),
        scheduled: list.reduce((a, o) => a + o.scheduled, 0),
        finished: list.reduce((a, o) => a + o.finished, 0)
      };
    }

    function primaryOrderFor(key) {
      return ordersForStudent(key).find((o) => o.pending > 0) || null;
    }

    function visibleStudents() {
      let list;
      if (state.role === 'parent') list = STUDENTS.filter((s) => PARENT_CHILDREN.includes(s.key));
      else if (state.role === 'monitor') list = STUDENTS.filter((s) => s.holder === 'Leo');
      else list = STUDENTS.filter((s) => state.holderFilter === 'all' || s.holder === state.holderFilter);
      const q = state.query.trim().toLowerCase();
      if (state.role === 'admin' && q) {
        list = list.filter((s) => `${s.name} ${s.nickname}`.toLowerCase().includes(q)
          || state.orders.some((o) => o.studentKey === s.key && o.id.toLowerCase().includes(q)));
      }
      return list;
    }

    function ensureActiveStudent() {
      const list = visibleStudents();
      if (list.length && !list.some((s) => s.key === state.activeStudent)) state.activeStudent = list[0].key;
    }

    function orderStatusMeta(s) {
      if (s === 'PARTIALLY_REFUNDED') return { label: '部分清退', cls: 'border-amber-300 bg-amber-100 text-amber-900' };
      if (s === 'REFUNDED') return { label: '已全额清退', cls: 'border-emerald-200 bg-emerald-50 text-emerald-800' };
      return { label: '已购课', cls: 'border-slate-300 bg-slate-100 text-slate-700' };
    }

    function orderStatusLabel(s) { return orderStatusMeta(s).label; }

    function statusPill(status) {
      const m = orderStatusMeta(status);
      return `<span class="inline-flex items-center rounded-full border px-2 py-0.5 text-[12px] font-bold ${m.cls}">${m.label}</span>`;
    }

    function statusChips(from, to) {
      return `${statusPill(from)}<span class="text-[12px] font-bold text-slate-500">→</span>${statusPill(to)}`;
    }

    function canOperate() { return state.role !== 'parent'; }

    function canViewRecord(r) {
      if (!r) return false;
      if (state.role === 'admin') return true;
      if (state.role === 'monitor') {
        const s = studentByKey(r.studentKey);
        return !!s && s.holder === 'Leo';
      }
      return PARENT_CHILDREN.includes(r.studentKey) && r.studentKey === state.activeStudent;
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          showToast(value === 'off' ? '离线只读：课次清退不可用，仅可查看记录' : '已恢复在线，可继续执行课次清退');
        }
      });
    });
    $('btnResetDemo').addEventListener('click', resetDemo);

    function setRole(role) {
      state.role = role;
      state.page = 'list';
      state.navTab = boardTab();
      state.holderFilter = 'all';
      state.query = '';
      state.overlay = null;
      state.activeRecordId = null;
      if (role === 'parent' && !PARENT_CHILDREN.includes(state.activeStudent)) state.activeStudent = PARENT_CHILDREN[0];
      ensureActiveStudent();
      renderAll();
    }

    function navTo(tab) {
      const item = navItems().find((n) => n.id === tab);
      if (!item) return;
      state.navTab = tab;
      state.page = item.board ? 'list' : 'placeholder';
      state.activeRecordId = null;
      state.overlay = null;
      renderAll();
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const active = state[b.dataset.group] === b.dataset.value;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}`;
      });
    }

    function resetDemo() {
      state.orders = clone(INITIAL_ORDERS);
      state.records = clone(INITIAL_RECORDS);
      state.role = 'monitor';
      state.page = 'list';
      state.navTab = 'ops';
      state.device = 'mobile';
      state.online = 'on';
      state.activeStudent = 'alice';
      state.activeRecordId = null;
      state.holderFilter = 'all';
      state.query = '';
      state.overlay = null;
      state.deduct = { orderId: null, count: '1', note: '', proof: null, errorCount: '', errorNote: '' };
      renderAll();
      showToast('演示数据已重置');
    }

    /* ------------------------------------------------------------------
     * 外壳
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;
      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线只读：课次清退不可用，仅可查看清退记录与财务备注`
        : '';

      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = renderNav();
      renderOverlay();
      syncConsole();
      const viewKey = [state.role, state.page, state.activeRecordId, state.activeStudent, state.navTab, state.online, state.overlay ? state.overlay.type : 'none'].join('|');
      if (viewKey !== lastViewKey) {
        lastViewKey = viewKey;
        $('content').scrollTop = 0;
        const sheet = $('overlay').querySelector('[data-scroll]');
        if (sheet) sheet.scrollTop = 0;
      }
      if (window.lucide) lucide.createIcons();
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.page === 'detail') {
        const r = recordById(state.activeRecordId);
        if (!r || !canViewRecord(r)) return renderList();
        return renderRecordDetail(r);
      }
      return renderList();
    }

    function unreadCount() {
      if (state.role === 'parent') return 2;
      if (state.role === 'admin') return 5;
      return 3;
    }

    function bannerTitle() {
      if (state.overlay) {
        if (state.overlay.type === 'deduct') return '课次清退/扣减';
        if (state.overlay.type === 'confirm') return '确认清退课次';
      }
      if (state.page === 'detail') return '清退记录详情';
      if (state.page === 'placeholder') {
        const item = navItems().find((n) => n.id === state.navTab);
        return item ? item.label : '课次清退';
      }
      return state.role === 'parent' ? '课次清退记录' : '课次清退';
    }

    function renderBanner() {
      const m = roleMeta();
      const hasBack = state.page === 'detail';
      const unread = unreadCount();
      const left = hasBack
        ? `<button data-action="banner-back" class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="返回">${icon('chevron-left', 'h-5 w-5')}</button>
           <h1 class="min-w-0 truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</h1>`
        : `<span class="grid h-8 w-8 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${m.initial}</span>
           <h1 class="min-w-0 truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</h1>`;
      return `<header class="relative flex h-16 shrink-0 items-center justify-between gap-3 overflow-hidden bg-gradient-to-br ${m.banner} px-4 text-white">
        ${PATTERNS[state.role]}
        <div class="relative flex min-w-0 items-center gap-2.5">${left}</div>
        <button data-action="toast" data-message="您有 ${unread} 条未读通知" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
          ${icon('bell', 'h-4 w-4')}
          <span class="absolute -right-1 -top-1 grid h-[18px] min-w-[18px] place-items-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white/20">${unread}</span>
        </button>
      </header>`;
    }

    function renderNav() {
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${navItems().map((item) => {
            const on = state.navTab === item.id;
            return `<button data-action="nav" data-tab="${item.id}" ${on ? 'aria-current="page"' : ''} class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-500'}">
              ${icon(item.icon, 'h-[18px] w-[18px]')}
              <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderPlaceholder() {
      const item = navItems().find((n) => n.id === state.navTab);
      if (!item) return `<div class="p-8 text-center text-[14px] font-medium text-slate-500">页面不存在</div>`;
      const pageAction = { home: '进入首页', schedule: '查看完整课表', hall: '进入约课大厅', me: '进入我的', ops: '进入教务中心', settings: '进入管理与设置' };
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">${pageAction[item.id] || '进入页面'}</a>` : ''}
        <button data-action="nav" data-tab="${boardTab()}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回课次清退</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 课次清退首页
     * ------------------------------------------------------------------ */
    function renderList() {
      const isParent = state.role === 'parent';
      const isAdmin = state.role === 'admin';
      const list = visibleStudents();
      const student = studentByKey(state.activeStudent);
      const asset = assetOf(state.activeStudent);
      const records = recordsFor(state.activeStudent);
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';

      const filterRow = isAdmin
        ? `<div class="flex items-center gap-2">
            <div class="relative shrink-0">
              <select id="holderFilter" class="h-10 appearance-none rounded-full border border-slate-200 bg-white pl-3 pr-8 text-[14px] font-medium text-slate-700 outline-none transition focus:border-indigo-500">
                <option value="all" ${state.holderFilter === 'all' ? 'selected' : ''}>全部班长</option>
                <option value="Leo" ${state.holderFilter === 'Leo' ? 'selected' : ''}>Leo</option>
                <option value="Amy" ${state.holderFilter === 'Amy' ? 'selected' : ''}>Amy</option>
              </select>
              <span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-slate-500">${icon('chevron-down', 'h-4 w-4')}</span>
            </div>
            <div class="relative min-w-0 flex-1">
              <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
              <input id="studentSearch" value="${esc(state.query)}" placeholder="搜索学员或购课单号" class="h-10 w-full rounded-full border border-slate-200 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500">
            </div>
          </div>`
        : '';

      if (!list.length) {
        return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
          ${filterRow}
          <div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/70 px-6 py-10 text-center">
            <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-white text-slate-600 ring-1 ring-slate-200">${icon('users', 'h-5 w-5')}</div>
            <p class="mt-3 text-[14px] font-semibold text-slate-700">没有匹配的学员或购课单</p>
            <p class="mt-0.5 text-[12px] font-medium text-slate-600">请调整班长筛选或搜索关键词。</p>
          </div>
        </div>`;
      }

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${filterRow}
        ${renderStudentSelector()}
        ${renderStudentCard(student, asset)}
        ${isParent ? '' : renderOrders(student, asset)}
        <section>
          <div class="flex items-center justify-between px-1">
            <h2 class="text-[16px] font-bold text-slate-900">课次清退记录</h2>
            <span class="rounded-full border border-slate-200 bg-white px-2 py-0.5 text-[12px] font-bold text-slate-600">${records.length} 条</span>
          </div>
          <div id="recordList" class="mt-2 ${grid}">
            ${records.length ? records.map(renderRecordCard).join('') : renderEmptyRecords(isParent)}
          </div>
        </section>
        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">
          ${isParent
            ? '仅展示当前宝贝名下课次清退记录，只读；如有疑问请联系负责班长。'
            : isAdmin
              ? '管理员可查看全平台学员课次清退记录；清退即时生效，记录不可编辑或删除。'
              : '清退仅扣减待排期课次并记录财务备注，已排期课次需先在课表请假退回；周转账单仍按实际结课结算。'}
        </div>
      </div>`;
    }

    function renderStudentSelector() {
      if (state.role === 'parent') {
        return `<div class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-600">当前宝贝档案</span>
            <span class="rounded-full border border-slate-300 bg-slate-100 px-2 py-0.5 text-[12px] font-bold text-slate-600">只读</span>
          </div>
          <div class="mt-2 grid grid-cols-2 gap-2">
            ${PARENT_CHILDREN.map((key) => {
              const s = studentByKey(key);
              const on = key === state.activeStudent;
              return `<button data-action="select-student" data-key="${key}" class="flex h-10 items-center justify-center gap-1.5 rounded-xl text-[14px] font-semibold transition ${on ? 'bg-indigo-600 text-white' : 'border border-slate-300 bg-white text-slate-700 hover:bg-slate-50'}">
                <span class="grid h-6 w-6 place-items-center rounded-full text-[12px] font-bold ${on ? 'bg-white/15 text-white' : 'bg-white text-indigo-700'}">${esc(s.name.charAt(0))}</span>${esc(s.name)}
              </button>`;
            }).join('')}
          </div>
        </div>`;
      }

      const list = visibleStudents();
      return `<div class="flex flex-wrap items-center gap-1.5">
        <span class="text-[12px] font-medium text-slate-600">学员</span>
        ${list.map((s) => {
          const on = s.key === state.activeStudent;
          return `<button data-action="select-student" data-key="${s.key}" class="rounded-full px-3 py-1.5 text-[12px] font-semibold transition ${on ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${esc(s.name)} · ${esc(s.nickname)}</button>`;
        }).join('')}
      </div>`;
    }

    function assetTile(label, value) {
      return `<div class="rounded-xl border border-slate-200/60 bg-white px-2 py-2 text-center">
        <div class="text-[12px] font-semibold text-slate-600">${label}</div>
        <div class="mt-0.5 text-[18px] font-bold leading-none text-slate-900">${value}<span class="ml-0.5 text-[12px] font-semibold text-slate-600">节</span></div>
      </div>`;
    }

    function renderStudentCard(s, asset) {
      const isParent = state.role === 'parent';
      const canDeduct = state.online === 'on' && asset.pending > 0;
      const actionTitle = state.online === 'off' ? '离线模式下不可用' : (asset.pending > 0 ? '清退或扣减剩余待排期课次' : '当前没有可清退的待排期课次');
      const action = isParent
        ? `<span class="shrink-0 rounded-full border border-slate-300 bg-slate-100 px-2 py-0.5 text-[12px] font-bold text-slate-600">只读</span>`
        : `<button data-action="open-deduct" ${canDeduct ? '' : 'disabled'} title="${actionTitle}" class="h-8 shrink-0 rounded-lg px-2.5 text-[12px] font-bold ${canDeduct ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-slate-200 text-slate-500'} disabled:cursor-not-allowed">课次清退/扣减</button>`;
      return `<section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5">
        <div class="flex items-start gap-2.5">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full border border-indigo-100 bg-indigo-50 text-[16px] font-bold text-indigo-700">${esc(s.name.charAt(0))}</span>
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <h2 class="truncate text-[16px] font-bold text-slate-900">${esc(s.name)}</h2>
              <span class="shrink-0 rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">小名 ${esc(s.nickname)}</span>
            </div>
            <div class="mt-0.5 text-[12px] font-medium text-slate-600">${esc(s.age)} · 资金持有人 ${esc(s.holder)}</div>
          </div>
          ${action}
        </div>
        <div class="mt-3 grid grid-cols-3 gap-1.5">
          ${assetTile('待排期', asset.pending)}
          ${assetTile('未来已排期', asset.scheduled)}
          ${assetTile('历史结课', asset.finished)}
        </div>
      </section>`;
    }

    function renderOrders(s, asset) {
      const list = ordersForStudent(s.key);
      const canDeduct = state.online === 'on' && asset.pending > 0;
      return `<section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5">
        <div class="flex items-center justify-between">
          <h2 class="text-[16px] font-bold text-slate-900">关联购课单</h2>
          <span class="text-[12px] font-semibold text-slate-600">${list.length} 张</span>
        </div>
        <div class="mt-2 space-y-1.5">
          ${list.map((o) => {
            const m = orderStatusMeta(o.status);
            return `<div class="rounded-xl border border-slate-200/60 bg-white px-2.5 py-2">
              <div class="flex items-center justify-between gap-2">
                <span class="truncate font-mono text-[12px] font-bold text-slate-900">${esc(o.id)}</span>
                <span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${m.cls}">${m.label}</span>
              </div>
              <div class="mt-1 text-[12px] font-medium text-slate-600">${esc(o.type)} · 待排期 ${o.pending} 节 · 已排期 ${o.scheduled} 节 · 结课 ${o.finished} 节</div>
            </div>`;
          }).join('')}
        </div>
        <button data-action="open-deduct" ${canDeduct ? '' : 'disabled'} title="${state.online === 'off' ? '离线模式下不可用' : (asset.pending > 0 ? '清退或扣减剩余待排期课次' : '当前没有可清退的待排期课次')}" class="mt-2 flex h-9 w-full items-center justify-center gap-1 rounded-lg border text-[12px] font-bold ${canDeduct ? 'border-indigo-200 bg-white text-indigo-700 hover:bg-indigo-50' : 'border-slate-200 bg-slate-100 text-slate-500'} disabled:cursor-not-allowed">
          ${icon('minus-circle', 'h-3.5 w-3.5')} 课次清退/扣减
        </button>
      </section>`;
    }

    function renderEmptyRecords(isParent) {
      return `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/70 px-6 py-10 text-center">
        <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-white text-slate-600 ring-1 ring-slate-200">${icon('history', 'h-5 w-5')}</div>
        <p class="mt-3 text-[14px] font-semibold text-slate-700">暂无课次清退记录</p>
        <p class="mt-0.5 text-[12px] font-medium text-slate-500">${isParent ? '当前宝贝暂无课次清退留痕。' : '该学员当前没有课次清退留痕。'}</p>
      </div>`;
    }

    function renderRecordCard(r) {
      return `<article data-action="open-record" data-id="${r.id}" role="button" tabindex="0" class="cursor-pointer rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5 transition active:scale-[0.995]">
        <div class="flex items-center justify-between gap-2">
          <span class="font-mono text-[12px] font-medium text-slate-600">${esc(r.at)}</span>
          <span class="shrink-0 rounded-md border border-slate-200 bg-white px-1.5 py-0.5 text-[12px] font-bold text-slate-800">清退 ${r.n} 节</span>
        </div>
        <p class="mt-1.5 line-clamp-2 text-[12px] font-medium leading-relaxed text-slate-700">${esc(r.note)}</p>
        <div class="mt-2 flex items-center justify-between gap-2 border-t border-slate-200/70 pt-2">
          <span class="min-w-0 truncate text-[12px] font-medium text-slate-600">经办人 ${esc(r.by)} · <span class="font-mono">${esc(r.orderId)}</span></span>
          <span class="inline-flex shrink-0 items-center gap-0.5 text-[12px] font-semibold text-indigo-600">查看详情 ${icon('chevron-right', 'h-3.5 w-3.5')}</span>
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 清退抽屉
     * ------------------------------------------------------------------ */
    function proofChip(p) {
      return `<div class="mt-1.5 flex items-center gap-2 rounded-xl border border-slate-200 bg-white p-2">
        <span class="grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-slate-100 text-slate-600">${icon('image', 'h-5 w-5')}</span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-[14px] font-semibold text-slate-800">${esc(p.name)}</span>
          <span class="block text-[12px] font-medium text-slate-600">${fmtSize(p.size)} · 已选择</span>
        </span>
        <button data-action="remove-proof" class="shrink-0 rounded-lg border border-slate-300 bg-white px-2 py-1 text-[12px] font-semibold text-slate-700 hover:bg-slate-50">移除</button>
      </div>`;
    }

    function renderDeductSheet() {
      const d = state.deduct;
      const order = orderById(d.orderId);
      if (!order) return '';
      const student = studentByKey(order.studentKey);
      const asset = assetOf(order.studentKey);
      const max = order.pending;
      const n = Number(d.count);
      const validN = Number.isInteger(n) && n >= 1 && n <= max;
      const after = validN ? Math.max(0, asset.pending - n) : asset.pending;
      const nextStatus = validN ? ((order.pending - n + order.scheduled) === 0 ? 'REFUNDED' : 'PARTIALLY_REFUNDED') : null;
      const offline = state.online === 'off';

      const reminder = asset.scheduled > 0
        ? `<div class="rounded-2xl border border-amber-300 bg-amber-50/50 p-3">
            <div class="flex items-start gap-2">
              <span class="mt-0.5 shrink-0 text-amber-700">${icon('alert-triangle', 'h-4 w-4')}</span>
              <div class="min-w-0">
                <p class="text-[14px] font-semibold leading-relaxed text-amber-900">存在未来已排期 ${asset.scheduled} 节，请先在课表请假退回待排期后再清退</p>
                <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-amber-900/85">已排期课格不会被直接作废；本操作仅扣减待排期课次。</p>
              </div>
            </div>
            <button data-action="go-schedule" class="mt-2 inline-flex items-center gap-1 text-[12px] font-bold text-amber-800 hover:text-amber-900">${icon('calendar-days', 'h-3.5 w-3.5')} 前往课表</button>
          </div>`
        : '';

      return `<div class="absolute inset-x-0 bottom-0 top-16 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 mx-auto flex max-h-[92%] w-full max-w-[560px] flex-col rounded-t-3xl bg-white shadow-2xl">
          <div class="mx-auto mb-1 mt-2 h-1 w-10 shrink-0 rounded-full bg-slate-200"></div>
          <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 px-4 pb-2.5">
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">课次清退/扣减</h2>
              <p class="mt-0.5 truncate text-[12px] font-medium text-slate-600">${esc(student.name)} · 关联购课单 <span class="font-mono">${esc(order.id)}</span></p>
            </div>
            <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="min-h-0 flex-1 overflow-y-auto px-4 py-3" data-scroll>
            <div class="space-y-3">
              ${offline ? `<div class="rounded-xl border border-amber-300 bg-amber-50 px-3 py-2 text-[12px] font-semibold text-amber-900">离线模式：课次清退不可提交，仅可查看。</div>` : ''}
              <div class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3">
                <div class="flex items-end justify-between gap-2">
                  <div>
                    <div class="text-[12px] font-semibold text-slate-600">剩余待排期</div>
                    <div class="mt-0.5 text-[18px] font-bold leading-none text-slate-900">${max} <span class="text-[12px] font-semibold text-slate-600">节</span></div>
                  </div>
                  <div class="min-w-0 text-right">
                    <div class="text-[12px] font-semibold text-slate-600">关联购课单</div>
                    <div class="mt-0.5 truncate font-mono text-[12px] font-bold text-slate-800">${esc(order.id)}</div>
                  </div>
                </div>
              </div>
              ${reminder}
              <div>
                <div class="flex items-center justify-between">
                  <label for="deductCount" class="text-[14px] font-semibold text-slate-700">清退节数</label>
                  <button data-action="clear-all" ${offline ? 'disabled' : ''} class="text-[12px] font-bold text-indigo-600 disabled:opacity-40">全部清零</button>
                </div>
                <div class="mt-1.5 flex items-center gap-2">
                  <button data-action="count-step" data-delta="-1" ${offline ? 'disabled' : ''} class="grid h-11 w-11 shrink-0 place-items-center rounded-xl border border-slate-300 bg-white text-[18px] font-bold text-slate-700 hover:bg-slate-50 disabled:opacity-40">−</button>
                  <input id="deductCount" type="number" inputmode="numeric" min="1" max="${max}" step="1" value="${esc(d.count)}" ${offline ? 'disabled' : ''} class="h-11 min-w-0 flex-1 rounded-xl border border-slate-200 bg-white text-center text-[18px] font-bold text-slate-900 outline-none transition focus:border-indigo-500 disabled:bg-slate-100">
                  <button data-action="count-step" data-delta="1" ${offline ? 'disabled' : ''} class="grid h-11 w-11 shrink-0 place-items-center rounded-xl border border-slate-300 bg-white text-[18px] font-bold text-slate-700 hover:bg-slate-50 disabled:opacity-40">+</button>
                </div>
                <p id="deductHelper" class="mt-1 text-[12px] font-medium text-slate-600 ${d.errorCount === `最多可清退 ${max} 节待排期课次` ? 'hidden' : ''}">本次最多可清退 ${max} 节待排期课次</p>
                <p id="deductCountError" class="mt-1 text-[12px] font-semibold text-rose-600 ${d.errorCount ? '' : 'hidden'}">${esc(d.errorCount)}</p>
              </div>
              <div>
                <div class="flex items-center justify-between">
                  <label for="deductNote" class="text-[14px] font-semibold text-slate-700">财务备注 <span class="text-rose-500">*</span></label>
                  <span id="noteCount" class="text-[12px] font-medium text-slate-600">${d.note.length}/200</span>

    function refreshDeductPreview() {
      const d = state.deduct;
      const order = orderById(d.orderId);
      if (!order) return;
      const asset = assetOf(order.studentKey);
      const max = order.pending;
      const n = Number(d.count);
      const valid = Number.isInteger(n) && n >= 1 && n <= max;

      const afterEl = $('deductAfter');
      if (afterEl) afterEl.textContent = `${valid ? Math.max(0, asset.pending - n) : asset.pending} 节`;

      const statusEl = $('deductStatus');
      if (statusEl) {
        const next = valid ? ((order.pending - n + order.scheduled) === 0 ? 'REFUNDED' : 'PARTIALLY_REFUNDED') : null;
        statusEl.innerHTML = next ? statusChips(order.status, next) : '<span class="font-semibold text-slate-600">待计算</span>';
      }

      const noteCount = $('noteCount');
      if (noteCount) noteCount.textContent = `${d.note.length}/200`;

      const countErr = $('deductCountError');
      if (countErr) {
        countErr.textContent = d.errorCount || '';
        countErr.classList.toggle('hidden', !d.errorCount);
      }
      const helper = $('deductHelper');
      if (helper) helper.classList.toggle('hidden', d.errorCount === `最多可清退 ${max} 节待排期课次`);
      const noteErr = $('deductNoteError');
      if (noteErr) {
        noteErr.textContent = d.errorNote || '';
        noteErr.classList.toggle('hidden', !d.errorNote);

      if (window.lucide) lucide.createIcons();
    }

    function renderOverlay() {
      const el = $('overlay');

      else if (state.overlay.type === 'confirm') el.innerHTML = renderConfirmModal();
      else el.innerHTML = '';
      const next = el.querySelector('[data-scroll]');
      if (next) next.scrollTop = top;
    }

    /* ------------------------------------------------------------------
     * 业务动作
     * ------------------------------------------------------------------ */
    function openDeduct(orderId) {
      if (state.online === 'off') return showToast('离线模式下不可执行课次清退');
      if (!canOperate()) return;
      ensureActiveStudent();
      const order = orderId ? orderById(orderId) : primaryOrderFor(state.activeStudent);
      if (!order || order.pending <= 0) return showToast('暂无待排期课次可清退');
      state.deduct = { orderId: order.id, count: '1', note: '', proof: null, errorCount: '', errorNote: '' };
      state.overlay = { type: 'deduct' };
      renderAll();
    }

    function validateDeduct() {
      const d = state.deduct;
      const order = orderById(d.orderId);
      if (!order) return false;
      const max = order.pending;
      const raw = String(d.count).trim();
      let ok = true;
      if (raw === '') {
        d.errorCount = '请输入清退节数';
        ok = false;
      } else {
        const n = Number(raw);
        if (!Number.isFinite(n) || !Number.isInteger(n)) {
          d.errorCount = '请输入有效的清退节数';
          ok = false;
        } else if (n <= 0) {
          d.errorCount = '清退节数必须大于 0';
          ok = false;
        } else if (n > max) {
          d.errorCount = `最多可清退 ${max} 节待排期课次`;
          ok = false;
        } else {
          d.errorCount = '';
        }
      }
      const note = d.note.trim();
      if (!note) {
        d.errorNote = '请填写财务备注';
        ok = false;
      } else if (note.length > 200) {
        d.errorNote = '财务备注最多 200 字';
        ok = false;
      } else {
        d.errorNote = '';
      }
      return ok;
    }

    function submitDeduct() {
      if (state.online === 'off') return showToast('离线模式下不可执行课次清退');
      if (!validateDeduct()) {
        renderOverlay();
        if (window.lucide) lucide.createIcons();
        showToast(state.deduct.errorCount || state.deduct.errorNote);
        return;
      }
      state.overlay = { type: 'confirm' };
      renderAll();
    }

    function confirmDeduct() {
      if (state.online === 'off') return showToast('离线模式下不可执行课次清退');
      if (!validateDeduct()) {
        state.overlay = { type: 'deduct' };
        renderAll();
        showToast(state.deduct.errorCount || state.deduct.errorNote);
        return;
      }
      const d = state.deduct;
      const order = orderById(d.orderId);
      if (!order || order.pending <= 0) {
        state.overlay = null;
        renderAll();
        return showToast('该购课单暂无可清退课次');
      }
      const n = Number(d.count);
      const prevStatus = order.status;
      order.pending = Math.max(0, order.pending - n);
      const remainingValid = order.pending + order.scheduled;
      order.status = remainingValid === 0 ? 'REFUNDED' : 'PARTIALLY_REFUNDED';
      const asset = assetOf(order.studentKey);
      state.records.unshift({
        id: nextRecordId(),
        studentKey: order.studentKey,
        at: '2026-11-13 14:20',
        n,
        by: actor(),
        note: d.note.trim(),
        orderId: order.id,
        after: asset.pending,
        prevStatus,
        newStatus: order.status,
        proof: d.proof ? { ...d.proof } : null
      });
      state.overlay = null;
      state.page = 'list';
      state.activeRecordId = null;
      state.navTab = boardTab();
      renderAll();
      showToast(`已清退 ${n} 节课次，财务备注已留痕`);
    }

    function nextRecordId() {
      return `CD-20261113-${String(state.records.length + 1).padStart(2, '0')}`;
    }

    function openRecord(id) {
      const r = recordById(id);
      if (!r || !canViewRecord(r)) return;
      state.activeRecordId = id;
      state.page = 'detail';
      state.overlay = null;
      state.navTab = boardTab();
      renderAll();
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    $('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'banner-back' || action === 'go-back') {
        if (state.overlay) { state.overlay = null; renderAll(); return; }
        if (state.page === 'detail') {
          state.page = 'list';
          state.activeRecordId = null;
          state.navTab = boardTab();
          renderAll();
          return;
        }
        return;
      }
      if (action === 'select-student') {
        state.activeStudent = el.dataset.key;
        state.page = 'list';
        state.activeRecordId = null;
        state.overlay = null;
        renderAll();
        return;
      }
      if (action === 'open-record') return openRecord(el.dataset.id);
      if (action === 'open-deduct') return openDeduct(el.dataset.order || null);
      if (action === 'close-overlay') { state.overlay = null; renderAll(); return; }
      if (action === 'count-step') {
        const order = orderById(state.deduct.orderId);
        if (!order) return;
        const max = order.pending;
        let n = Number(state.deduct.count);
        if (!Number.isInteger(n)) n = 1;
        n = Math.max(1, Math.min(max, n + Number(el.dataset.delta)));
        state.deduct.count = String(n);
        state.deduct.errorCount = '';
        const input = $('deductCount');
        if (input) input.value = String(n);
        refreshDeductPreview();
        return;
      }
      if (action === 'clear-all') {
        const order = orderById(state.deduct.orderId);
        if (!order) return;
        state.deduct.count = String(order.pending);
        state.deduct.errorCount = '';
        const input = $('deductCount');
        if (input) input.value = String(order.pending);
        refreshDeductPreview();
        return;
      }
      if (action === 'submit-deduct') return submitDeduct();
      if (action === 'back-to-deduct') {
        state.overlay = { type: 'deduct' };
        renderAll();
        return;
      }
      if (action === 'confirm-deduct') return confirmDeduct();
      if (action === 'remove-proof') {
        state.deduct.proof = null;
        renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'sample-proof') {
        if (state.online === 'off') return showToast('离线模式下不可上传凭证');
        state.deduct.proof = { name: '微信转账截图_示例.png', size: 248 * 1024 };
        renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'preview-proof') return showToast('演示环境：凭证缩略图占位，实际以原图预览');
      if (action === 'go-schedule') return showToast('演示：已定位到学员课表，请对已排期课次发起请假');
    });

    $('frame').addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-action="open-record"]')) {
        e.preventDefault();
        openRecord(e.target.dataset.id);
      }
    });

    $('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'deductCount') {
        state.deduct.count = e.target.value;
        state.deduct.errorCount = '';
        refreshDeductPreview();
        return;
      }
      if (id === 'deductNote') {
        state.deduct.note = e.target.value;
        state.deduct.errorNote = '';
        refreshDeductPreview();
        return;
      }
      if (id === 'studentSearch') {
        state.query = e.target.value;
        ensureActiveStudent();
        const pos = e.target.selectionStart;
        $('content').innerHTML = renderContent();
        if (window.lucide) lucide.createIcons();
        const next = $('studentSearch');
        if (next) {
          next.focus();
          try { next.setSelectionRange(pos, pos); } catch (_) { /* noop */ }
        }
        return;
      }
    });

    $('frame').addEventListener('change', (e) => {
      if (e.target.id === 'holderFilter') {
        state.holderFilter = e.target.value;
        ensureActiveStudent();
        renderAll();
        return;
      }
      if (e.target.id === 'proofInput') {
        const file = (e.target.files || [])[0];
        if (!file) return;
        if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
          e.target.value = '';
          return showToast('仅支持 JPG / PNG / WebP');
        }
        if (file.size > 5 * 1024 * 1024) {
          e.target.value = '';
          return showToast('凭证大小不能超过 5MB');
        }
        state.deduct.proof = { name: file.name, size: file.size };
        e.target.value = '';
        renderOverlay();
        if (window.lucide) lucide.createIcons();
        return;
      }
    });

    function showToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.add('hidden'), 2600);
    }

    /* ------------------------------------------------------------------
     * 启动
     * ------------------------------------------------------------------ */
    (function boot() {
      ensureActiveStudent();
      if (state.page === 'detail') {
        const target = recordById(state.activeRecordId);
        if (state.activeRecordId && (!target || !canViewRecord(target))) {
          state.page = 'list';
          state.activeRecordId = null;
        } else if (!state.activeRecordId) {
          const first = recordsFor(state.activeStudent).find((r) => canViewRecord(r));
          if (first) state.activeRecordId = first.id;
          else state.page = 'list';
        }
      }
      renderAll();
      if (bootOverlay === 'deduct') openDeduct();
      if (bootOverlay === 'confirm') {
        openDeduct();
        if (state.overlay && state.overlay.type === 'deduct') {
          state.overlay = { type: 'confirm' };
          renderAll();
        }
      }
    })();
  </script>
</body>
</html>

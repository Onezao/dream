<body class="min-h-screen bg-slate-100 font-sans text-slate-800 antialiased">

  <!-- Tailwind CDN 动态类安全垫 -->

  </div>

  <script>
    /* (c) 2024-2026 Topee (https://topee.top). All rights reserved. Proprietary and confidential. */
    'use strict';

    /* ------------------------------------------------------------------
     * 演示数据 · 两步式排课第一步：老师空闲大盘
     * ------------------------------------------------------------------ */
    const DAY_LABELS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    const DAY_SHORT = ['一', '二', '三', '四', '五', '六', '日'];
    const PRICE_ORDER = { '16': 0, '18': 1, '21': 2 };
    const priceLabel = (price) => price === 'all' ? '全部' : `${price}积分`;
    const CAPACITY = 28;
    const LOAD_LIMIT = 20;
    const CURRENT_MONITOR = 'leo';

    const PERIODS = {
      early: { key: 'early', label: '早 06-11', start: 6, end: 11, rows: 10 },
      mid: { key: 'mid', label: '中 10-15', start: 10, end: 15, rows: 10 },
      afternoon: { key: 'afternoon', label: '下 14-19', start: 14, end: 19, rows: 10 },
      evening: { key: 'evening', label: '晚 18-24', start: 18, end: 24, rows: 12 }
    };

    const WEEK_META = [
      { value: 0, label: '本周', range: '11.09 - 11.15' },
      { value: 1, label: '下周', range: '11.16 - 11.22' }
    ];

    const PRICE_FILTERS = [
      { value: 'all', label: '全部' },
      { value: '16', label: '16积分' },
      { value: '18', label: '18积分' },
      { value: '21', label: '21积分' }
    ];

    const STUDENTS = {
      alice: {
        key: 'alice',
        id: 'stu_alice',
        name: 'AliceZ12',
        nickname: 'Alice',
        price: '16',
        credits: 8,
        emoji: '👧'
      },
      bob: {
        key: 'bob',
        id: 'stu_bob',
        name: 'BobZ10',
        nickname: 'Bob',
        price: '18',
        credits: 4,
        emoji: '👦'
      }
    };

    const CLASSES = {
      ket1: {
        key: 'ket1',
        id: 'ket1',
        name: 'KET 冲刺小班',
        code: 'KET1',
        price: '16',
        credits: 32,
        teacher: 'david',
        enrolled: 3,
        capacity: 4
      },
      mov2: {
        key: 'mov2',
        id: 'mov2',
        name: 'Movers 进阶班',
        code: 'MOV2',
        price: '18',
        credits: 16,
        teacher: null,
        enrolled: 3,
        capacity: 4
      }
    };

    function makeTeacher(key, name, price, load, regulars, opts = {}) {
      const seed = key.split('').reduce((sum, ch) => sum + ch.charCodeAt(0), 0) + (opts.seed || 0);
      return {
        key,
        id: `tea_${key}`,
        name,
        short: name.split(' ')[0],
        initial: name.charAt(0),
        price,
        load,
        loadNext: typeof opts.loadNext === 'number'
          ? opts.loadNext
          : Math.max(6, Math.min(26, load + ((seed % 7) - 3))),
        capacity: CAPACITY,
        regulars,
        seed,
        start: typeof opts.start === 'number' ? opts.start : 9,
        end: typeof opts.end === 'number' ? opts.end : 21,
        offDays: opts.offDays || [],
        weekendOff: !!opts.weekendOff,
        zeroPeriods: opts.zeroPeriods || [],
        owner: opts.owner || 'other'
      };
    }

    /* 29 位在职老师：16 / 18 / 21 积分价位，熟客与空闲矩阵各不相同 */
    const TEACHERS = [
      makeTeacher('david', 'David Miller', '16', 18, ['alice', 'bob'], { start: 9, end: 21, seed: 3, owner: 'leo' }),
      makeTeacher('linda', 'Linda Wu', '16', 14, ['alice'], { start: 8, end: 20, seed: 5, owner: 'leo' }),
      makeTeacher('ethan', 'Ethan Brooks', '16', 16, ['bob'], { start: 9, end: 22, seed: 7 }),
      makeTeacher('noah', 'Noah Kim', '16', 9, [], { start: 7, end: 19, seed: 11, owner: 'leo' }),
      makeTeacher('grace', 'Grace Park', '16', 12, ['alice', 'bob'], { start: 8, end: 20, seed: 13 }),
      makeTeacher('henry', 'Henry Ford', '16', 20, ['alice'], { start: 10, end: 22, seed: 17 }),
      makeTeacher('ivy', 'Ivy Chen', '16', 15, ['bob'], { start: 9, end: 21, seed: 19 }),
      makeTeacher('jack', 'Jack Turner', '16', 22, [], { start: 11, end: 23, seed: 23, offDays: [0] }),
      makeTeacher('kevin', 'Kevin Shaw', '16', 10, [], { start: 8, end: 18, seed: 29 }),
      makeTeacher('lucy', 'Lucy Hale', '16', 17, ['bob'], { start: 9, end: 21, seed: 31 }),
      makeTeacher('mason', 'Mason Reed', '16', 24, [], { start: 10, end: 22, seed: 37, weekendOff: true }),
      makeTeacher('nina', 'Nina Patel', '16', 13, ['alice'], { start: 9, end: 20, seed: 41, owner: 'leo' }),
      makeTeacher('oscar', 'Oscar Wilde', '16', 19, [], { start: 10, end: 23, seed: 43 }),
      makeTeacher('peter', 'Peter Pan', '16', 11, [], { start: 7, end: 19, seed: 47 }),
      makeTeacher('quinn', 'Quinn Harper', '16', 21, [], { start: 9, end: 22, seed: 53 }),
      makeTeacher('rachel', 'Rachel Green', '16', 16, ['bob'], { start: 8, end: 20, seed: 59 }),
      makeTeacher('sam', 'Sam Wilson', '16', 8, [], { start: 9, end: 18, seed: 61, owner: 'leo' }),
      makeTeacher('tina', 'Tina Fey', '16', 23, [], { start: 11, end: 23, seed: 67, offDays: [6] }),
      makeTeacher('victor', 'Victor Hugo', '16', 12, [], { start: 9, end: 21, seed: 71 }),
      makeTeacher('wendy', 'Wendy Brown', '16', 18, ['alice'], { start: 10, end: 22, seed: 73 }),
      makeTeacher('xavier', 'Xavier Lee', '16', 15, [], { start: 8, end: 20, seed: 79 }),
      makeTeacher('zoe', 'Zoe Turner', '16', 20, [], { start: 9, end: 21, seed: 83, zeroPeriods: ['mid'] }),
      makeTeacher('mia', 'Mia Chen', '21', 11, ['alice', 'bob'], { start: 9, end: 21, seed: 89 }),
      makeTeacher('sofia', 'Sofia Reyes', '21', 20, ['bob'], { start: 10, end: 22, seed: 97, zeroPeriods: ['mid'] }),
      makeTeacher('olivia', 'Olivia Stone', '21', 14, ['alice'], { start: 8, end: 20, seed: 101 }),
      makeTeacher('lucas', 'Lucas Gray', '21', 17, [], { start: 9, end: 22, seed: 103 }),
      makeTeacher('emma', 'Emma Stone', '18', 10, ['bob'], { start: 8, end: 19, seed: 107 }),
      makeTeacher('leo', 'Leo Martin', '18', 13, [], { start: 9, end: 20, seed: 109 }),
      makeTeacher('ruby', 'Ruby Rose', '18', 16, ['alice'], { start: 10, end: 21, seed: 113, offDays: [4] })
    ];

    /* ------------------------------------------------------------------
     * 状态与地址参数
     * ------------------------------------------------------------------ */
    const state = {
      role: 'monitor',
      device: 'mobile',
      online: true,
      embed: false,
      view: 'board',
      contextType: 'none',
      student: 'alice',
      classKey: 'ket1',
      price: '16',
      period: 'mid',
      week: 0,
      shown: 5,
      overlay: null,
      focusTeacher: null,
      highlightDay: null,
      highlightHour: null,
      toast: '',
      scenario: ''
    };

    const params = new URLSearchParams(window.location.search);
    state.embed = params.get('embed') === '1';
    state.view = params.get('view') || 'board';
    state.device = params.get('device') === 'tablet' ? 'tablet' : 'mobile';
    if (['monitor', 'admin'].includes(params.get('role'))) state.role = params.get('role');
    if (params.get('online') === '0' || params.get('network') === 'off') state.online = false;

    function applyScenario(name) {
      state.scenario = name || '';
      state.overlay = null;
      state.toast = '';
      state.focusTeacher = null;
      state.highlightDay = null;
      state.highlightHour = null;
      state.shown = 5;

      if (name === 'student-alice') {
        state.contextType = 'student';
        state.student = 'alice';
        state.price = '16';
        state.period = 'mid';
        state.week = 0;
      } else if (name === 'student-bob') {
        state.contextType = 'student';
        state.student = 'bob';
        state.price = '18';
        state.period = 'mid';
        state.week = 0;
      } else if (name === 'class-ket') {
        state.contextType = 'class';
        state.classKey = 'ket1';
        state.price = '16';
        state.period = 'mid';
        state.week = 0;
      } else if (name === 'class-unassigned') {
        state.contextType = 'class';
        state.classKey = 'mov2';
        state.price = '18';
        state.period = 'mid';
        state.week = 0;
      } else if (name === 'empty') {
        state.contextType = 'none';
        state.price = '16';
        state.period = 'mid';
        state.week = 0;
      } else if (name === 'price-all') {
        state.contextType = 'student';
        state.student = 'alice';
        state.price = 'all';
        state.period = 'mid';
        state.week = 0;
      } else if (name === 'price-16') {
        state.contextType = 'student';
        state.student = 'alice';
        state.price = '16';
        state.period = 'mid';
        state.week = 0;
      } else if (name === 'price-18') {
        state.contextType = 'student';
        state.student = 'alice';
        state.price = '18';
        state.period = 'mid';
        state.week = 0;
      } else if (name === 'price-21') {
        state.contextType = 'student';
        state.student = 'alice';
        state.price = '21';
        state.period = 'mid';
        state.week = 0;
      } else if (name === 'period-early') {
        state.contextType = 'student';
        state.student = 'alice';
        state.price = '16';
        state.period = 'early';
        state.week = 0;
      } else if (name === 'period-mid') {
        state.contextType = 'student';
        state.student = 'alice';
        state.price = '16';
        state.period = 'mid';
        state.week = 0;
      } else if (name === 'period-afternoon') {
        state.contextType = 'student';
        state.student = 'alice';
        state.price = '16';
        state.period = 'afternoon';
        state.week = 0;
      } else if (name === 'period-evening') {
        state.contextType = 'student';
        state.student = 'alice';
        state.price = '16';
        state.period = 'evening';
        state.week = 0;
      } else if (name === 'week-next') {
        state.contextType = 'student';
        state.student = 'alice';
        state.price = '16';
        state.period = 'mid';
        state.week = 1;
      } else if (name === 'load-more') {
        state.contextType = 'student';
        state.student = 'alice';
        state.price = '16';
        state.period = 'mid';
        state.week = 0;
        state.shown = 10;
      } else if (name === 'focus-david') {
        state.contextType = 'student';
        state.student = 'alice';
        state.price = '16';
        state.period = 'mid';
        state.week = 0;
        state.focusTeacher = 'david';
      } else {
        state.contextType = 'none';
        state.price = '16';
        state.period = 'mid';
        state.week = 0;
      }
    }

    if (params.get('scenario')) applyScenario(params.get('scenario'));

    const priceParam = params.get('price');
    if (['all', '16', '18', '21'].includes(priceParam)) state.price = priceParam;
    const periodParam = params.get('period');
    if (periodParam && PERIODS[periodParam]) state.period = periodParam;
    const weekParam = params.get('week');
    if (weekParam === '0' || weekParam === '1') state.week = Number(weekParam);
    const shownParam = Number(params.get('shown'));
    if (!Number.isNaN(shownParam) && shownParam > 0) state.shown = Math.min(LOAD_LIMIT, Math.max(5, shownParam));

    const studentIdMap = { stu_alice: 'alice', stu_bob: 'bob' };
    const classIdMap = { ket1: 'ket1', mov2: 'mov2' };
    if (studentIdMap[params.get('studentId')]) {
      state.contextType = 'student';
      state.student = studentIdMap[params.get('studentId')];
    }
    if (classIdMap[params.get('classId')]) {
      state.contextType = 'class';
      state.classKey = classIdMap[params.get('classId')];
    }
    const teacherParam = params.get('teacherId') || params.get('teacher');
    if (teacherParam) {
      const found = TEACHERS.find((teacher) => teacher.id === teacherParam || teacher.key === teacherParam);
      if (found) state.focusTeacher = found.key;
    }
    if (params.get('view') === 'board') state.view = 'board';

    function contextStudent() {
      return state.contextType === 'student' ? STUDENTS[state.student] : null;
    }

    function contextClass() {
      return state.contextType === 'class' ? CLASSES[state.classKey] : null;
    }

    function currentPeriod() {
      return PERIODS[state.period] || PERIODS.mid;
    }

    function weekLoad(teacher) {
      return state.week === 0 ? teacher.load : teacher.loadNext;
    }

    function weekMeta() {
      return WEEK_META.find((item) => item.value === state.week) || WEEK_META[0];
    }

    /* ------------------------------------------------------------------
     * 通用工具
     * ------------------------------------------------------------------ */
    const esc = (value) => String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function pad2(value) {
      return String(value).padStart(2, '0');
    }

    function rowTime(period, row) {
      const total = period.start * 60 + row * 30;
      return `${pad2(Math.floor(total / 60))}:${pad2(total % 60)}`;
    }

    function roleMeta() {
      if (state.role === 'admin') {
        return { banner: 'from-slate-900 via-violet-950 to-slate-800', initial: 'S', label: '管理员' };
      }
      return { banner: 'from-slate-900 via-fuchsia-950 to-slate-800', initial: 'L', label: '班长' };
    }

    /* ------------------------------------------------------------------
     * 空闲矩阵计算：确定性 Mock，保证除零空闲老师外至少 1 格可排
     * ------------------------------------------------------------------ */
    function hash01(seed) {
      const x = Math.sin(seed * 12.9898) * 43758.5453;
      return x - Math.floor(x);
    }

    function firstWorkDay(teacher) {
      for (let day = 0; day < 7; day += 1) {
        if (teacher.offDays.includes(day)) continue;
        if (teacher.weekendOff && day >= 5) continue;
        return day;
      }
      return 0;
    }

    function forcedFreeCell(teacher) {
      const period = currentPeriod();
      const row = Math.min(period.rows - 1, 3);
      const slot = period.start * 2 + row;
      if (slot < teacher.start * 2 || slot >= teacher.end * 2) return null;
      return { day: firstWorkDay(teacher), row };
    }

    function isTeacherFree(teacher, week, day, row) {
      const period = currentPeriod();
      const slot = period.start * 2 + row;
      if (teacher.zeroPeriods.includes(state.period)) return false;
      if (slot < teacher.start * 2 || slot >= teacher.end * 2) return false;
      if (teacher.offDays.includes(day)) return false;
      if (teacher.weekendOff && day >= 5) return false;
      const forced = forcedFreeCell(teacher);
      if (forced && forced.day === day && forced.row === row) return true;
      const loadRate = (week === 0 ? teacher.load : teacher.loadNext) / teacher.capacity;
      const busyThreshold = 0.34 + loadRate * 0.62;
      const value = hash01(teacher.seed * 7.13 + week * 31.7 + day * 11.3 + slot * 3.1);
      return value > busyThreshold;
    }

    function teacherFreeCount(teacher) {
      const period = currentPeriod();
      let count = 0;
      for (let day = 0; day < 7; day += 1) {
        for (let row = 0; row < period.rows; row += 1) {
          if (isTeacherFree(teacher, state.week, day, row)) count += 1;
        }
      }
      return count;
    }

    function priceGroup() {
      return TEACHERS.filter((teacher) => state.price === 'all' || teacher.price === state.price);
    }

    function priceDistance(teacherPrice, targetPrice) {
      if (!targetPrice) return 0;
      return Math.abs((PRICE_ORDER[teacherPrice] ?? 0) - (PRICE_ORDER[targetPrice] ?? 0));
    }

    function sortedTeachers() {
      const list = priceGroup()
        .map((teacher) => ({ teacher, free: teacherFreeCount(teacher) }))
        .filter((item) => item.free > 0);

      if (state.contextType === 'student') {
        const student = contextStudent();
        list.sort((a, b) => {
          const familiarA = a.teacher.regulars.includes(state.student) ? 1 : 0;
          const familiarB = b.teacher.regulars.includes(state.student) ? 1 : 0;
          if (familiarA !== familiarB) return familiarB - familiarA;
          const priceA = priceDistance(a.teacher.price, student.price);
          const priceB = priceDistance(b.teacher.price, student.price);
          if (priceA !== priceB) return priceA - priceB;
          const loadA = weekLoad(a.teacher);
          const loadB = weekLoad(b.teacher);
          if (loadA !== loadB) return loadA - loadB;
          if (a.free !== b.free) return b.free - a.free;
          return a.teacher.name.localeCompare(b.teacher.name);
        });
      } else if (state.contextType === 'class') {
        const cls = contextClass();
        list.sort((a, b) => {
          const assignedA = cls.teacher === a.teacher.key ? 1 : 0;
          const assignedB = cls.teacher === b.teacher.key ? 1 : 0;
          if (assignedA !== assignedB) return assignedB - assignedA;
          const priceA = priceDistance(a.teacher.price, cls.price);
          const priceB = priceDistance(b.teacher.price, cls.price);
          if (priceA !== priceB) return priceA - priceB;
          const loadA = weekLoad(a.teacher);
          const loadB = weekLoad(b.teacher);
          if (loadA !== loadB) return loadA - loadB;
          return b.free - a.free;
        });
      } else {
        list.sort((a, b) => {
          if (a.free !== b.free) return b.free - a.free;
          const loadA = weekLoad(a.teacher);
          const loadB = weekLoad(b.teacher);
          if (loadA !== loadB) return loadA - loadB;
          return a.teacher.name.localeCompare(b.teacher.name);
        });
      }

      return list;
    }

    function hiddenCount() {
      return priceGroup().filter((teacher) => teacherFreeCount(teacher) === 0).length;
    }

    function selectUrl(teacher) {
      const query = new URLSearchParams();
      query.set('role', state.role);
      query.set('teacherId', teacher.id);
      query.set('mode', 'schedule_select');
      query.set('week', String(state.week));
      if (state.contextType === 'student') query.set('studentId', STUDENTS[state.student].id);
      if (state.contextType === 'class') query.set('classId', CLASSES[state.classKey].id);
      return `m3a_calendar_grid.html?${query.toString()}`;
    }

    /* ------------------------------------------------------------------
     * 页面骨架
     * ------------------------------------------------------------------ */
    let toastTimer = null;

    function render(preserveScroll = true) {
      const previous = document.getElementById('content');
      const previousTop = previous ? previous.scrollTop : 0;
      const app = document.getElementById('app');
      app.innerHTML = `${state.embed ? '' : renderConsole()}${renderFrame()}`;
      const next = document.getElementById('content');
      if (next) next.scrollTop = preserveScroll ? previousTop : 0;
      if (window.lucide) window.lucide.createIcons();
    }

    function renderFrame() {
      const isTablet = state.device === 'tablet';
      const frameCls = state.embed
        ? 'h-[812px] w-full max-w-[390px] rounded-none'
        : isTablet
          ? 'h-[860px] w-[768px] max-w-full rounded-3xl shadow-2xl ring-1 ring-slate-300'
          : 'h-[812px] w-full max-w-[390px] rounded-2xl shadow-xl ring-1 ring-slate-300 sm:rounded-3xl sm:shadow-2xl';
      return `<main class="flex min-h-screen w-full justify-center ${state.embed ? '' : 'overflow-x-hidden px-0 py-0 sm:px-3 sm:py-6'}">
        <div id="frame" class="relative flex ${frameCls} shrink-0 flex-col overflow-hidden bg-white transition-all duration-300">
          ${renderBanner()}
          ${!state.online ? renderOfflineStrip() : ''}
          ${renderBoard()}
          ${renderOverlay()}
          ${state.toast ? renderToast() : ''}
        </div>
      </main>`;
    }

    function renderBanner() {
      const meta = roleMeta();
      const week = weekMeta();
      return `<header class="relative flex h-16 shrink-0 items-center gap-2 overflow-hidden bg-gradient-to-br ${meta.banner} px-3 text-white">
        <span class="pointer-events-none absolute -right-7 -top-9 h-24 w-24 rounded-full border border-white/10"></span>
        <span class="pointer-events-none absolute right-16 top-5 h-14 w-14 rounded-full border border-white/10"></span>
        <span class="pointer-events-none absolute -bottom-8 left-20 h-20 w-20 rounded-full bg-white/5"></span>
        <a href="m0_workspace_home.html?role=${state.role}" class="relative -ml-1 inline-flex h-8 shrink-0 items-center gap-1 rounded-lg px-2 text-[13px] font-semibold text-white/90 transition hover:bg-white/10 active:bg-white/15" aria-label="返回来源页">
          ${icon('chevron-left', 'h-4 w-4')}<span>返回</span>
        </a>
        <div class="relative min-w-0 flex-1">
          <h1 class="truncate text-[18px] font-bold tracking-tight">老师空闲大盘</h1>
          <p class="mt-0.5 truncate text-[12px] font-medium text-white/70">${week.label} ${week.range} · 第 1 步 挑老师</p>
        </div>
        <button type="button" data-action="open-rules" class="relative flex h-8 shrink-0 items-center gap-1 rounded-lg px-2 text-[12px] font-semibold text-white/80 transition hover:bg-white/10 hover:text-white">
          ${icon('info', 'h-4 w-4')}<span>排课规则</span>
        </button>
      </header>`;
    }

    function renderOfflineStrip() {
      return `<div class="flex shrink-0 items-center gap-1.5 border-b border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-semibold text-amber-900">
        ${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')}
        <span class="truncate">离线只读：可浏览老师空档，暂不能提交排课</span>
      </div>`;
    }

    function renderBoard() {
      const list = sortedTeachers();
      const total = list.length;
      const hidden = hiddenCount();
      const visibleCount = Math.min(state.shown, total, LOAD_LIMIT);
      const visible = list.slice(0, visibleCount);
      return `<div id="content" data-price="${state.price}" data-period="${state.period}" data-week="${state.week}" data-context="${state.contextType}" data-total="${total}" data-hidden="${hidden}" data-shown="${visibleCount}" class="min-h-0 flex-1 overflow-y-auto overscroll-contain">
        <div class="mx-auto w-full max-w-[720px] px-3 pb-1 pt-1">
          ${renderStepHint()}
          ${renderContextCard()}
          ${renderWeekSwitch()}
          ${renderFilters()}
          ${renderSummary(total, hidden)}
          ${visible.length ? renderMatrixHeader() : ''}
          ${visible.length ? `<section class="mt-1 space-y-1" aria-label="老师空档列表">${visible.map((item) => renderTeacherCard(item.teacher, item.free)).join('')}</section>` : renderEmptyState()}
          ${renderLoadMore(total, visibleCount)}
          <p class="mt-2 text-center text-[12px] font-medium leading-relaxed text-slate-500">本页只对比空档。点“选取”进入老师当周课表，完成选时段与 4 周校验。</p>
        </div>
      </div>`;
    }

    function renderStepHint() {
      return `<div class="flex items-center gap-1.5 text-[12px] font-medium text-slate-600">
        <span class="rounded-md bg-slate-900 px-1.5 py-0.5 font-semibold text-white">1 挑老师</span>
        <span class="text-slate-500">→</span>
        <span class="rounded-md bg-white px-1.5 py-0.5 font-semibold text-slate-700 ring-1 ring-inset ring-slate-200">2 课表选时段</span>
        <span class="ml-auto inline-flex items-center gap-1 truncate text-slate-500">${icon('layout-grid', 'h-3.5 w-3.5')}7 列 = 周一 → 周日</span>
      </div>`;
    }

    function renderContextCard() {
      const student = contextStudent();
      const cls = contextClass();
      if (student) {
        return `<button type="button" data-action="open-context" class="mt-1 flex w-full items-center gap-1.5 rounded-xl border border-slate-300 bg-slate-50/70 px-2 py-1 text-left transition active:scale-[0.995]" aria-label="切换排课对象">
          <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg border border-indigo-100 bg-indigo-50 text-[14px]">${student.emoji}</span>
          <span class="min-w-0 flex-1">
            <span class="flex min-w-0 items-center gap-1">
              <span class="truncate text-[14px] font-bold text-slate-900">${esc(student.nickname)}</span>
              <span class="shrink-0 rounded bg-slate-100 px-1 py-0.5 text-[12px] font-bold leading-none text-slate-700">${esc(priceLabel(student.price))}</span>
            </span>
            <span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">${esc(student.name)} · 固定位可用 <span class="font-bold text-indigo-700">${student.credits}</span> 节 · 熟客优先</span>
          </span>
          <span class="shrink-0 text-[12px] font-semibold text-indigo-600">切换</span>
        </button>`;
      }
      if (cls) {
        const teacher = cls.teacher ? TEACHERS.find((item) => item.key === cls.teacher) : null;
        return `<button type="button" data-action="open-context" class="mt-1 flex w-full items-center gap-1.5 rounded-xl border border-slate-300 bg-slate-50/70 px-2 py-1 text-left transition active:scale-[0.995]" aria-label="切换排课对象">
          <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg border border-teal-200 bg-teal-50 text-[14px] font-bold text-teal-800">${esc(cls.code.slice(0, 1))}</span>
          <span class="min-w-0 flex-1">
            <span class="flex min-w-0 items-center gap-1">
              <span class="truncate text-[14px] font-bold text-slate-900">${esc(cls.name)}</span>
              <span class="shrink-0 rounded bg-slate-100 px-1 py-0.5 text-[12px] font-bold leading-none text-slate-700">${esc(cls.code)}</span>
              ${teacher ? '' : '<span class="shrink-0 rounded border border-amber-300 bg-amber-50 px-1 py-0.5 text-[12px] font-bold leading-none text-amber-900">待委任</span>'}
            </span>
            <span class="mt-0.5 block truncate text-[12px] font-medium ${teacher ? 'text-slate-600' : 'text-amber-900'}">小班课次可用 <span class="font-bold text-indigo-700">${cls.credits}</span> 节 · ${teacher ? `主讲 ${esc(teacher.name)}` : '请先委任主讲老师'}</span>
          </span>
          <span class="shrink-0 text-[12px] font-semibold text-indigo-600">切换</span>
        </button>`;
      }
      return `<button type="button" data-action="open-context" class="mt-1 flex w-full items-center gap-1.5 rounded-xl border border-dashed border-slate-300 bg-slate-50/70 px-2 py-1 text-left transition active:scale-[0.995]" aria-label="选择学员或小班">
        <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg border border-slate-200 bg-white text-slate-500">${icon('user-plus', 'h-4 w-4')}</span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-[14px] font-bold text-slate-900">选择学员 / 小班 (可选)</span>
          <span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">不选也可仅查空档，直接浏览老师空闲分布</span>
        </span>
        <span class="shrink-0 text-[12px] font-semibold text-indigo-600">选择</span>
      </button>`;
    }

    function renderWeekSwitch() {
      return `<div class="mt-1 flex items-center justify-between gap-2">
        <div class="inline-flex rounded-lg bg-slate-100 p-0.5">
          ${WEEK_META.map((item) => `<button type="button" data-week-select="${item.value}" aria-pressed="${state.week === item.value}" class="h-6 rounded-md px-3 text-[12px] font-semibold transition ${state.week === item.value ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">${item.label}</button>`).join('')}
        </div>
        <span class="text-[12px] font-medium text-slate-600">${weekMeta().range}</span>
      </div>`;
    }

    function renderFilters() {
      return `<div class="mt-1 flex h-6 items-center gap-1 overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden" aria-label="价位筛选">
        <span class="shrink-0 text-[12px] font-medium text-slate-600">价位</span>
        ${PRICE_FILTERS.map((item) => `<button type="button" data-filter="price" data-value="${item.value}" aria-pressed="${state.price === item.value}" class="h-6 shrink-0 rounded-full px-2.5 text-[11px] transition ${state.price === item.value ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${item.label}</button>`).join('')}
      </div>
      <div class="mt-1 flex h-6 items-center gap-1 overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden" aria-label="时段筛选">
        <span class="shrink-0 text-[12px] font-medium text-slate-600">时段</span>
        ${Object.values(PERIODS).map((item) => `<button type="button" data-filter="period" data-value="${item.key}" aria-pressed="${state.period === item.key}" class="h-6 shrink-0 rounded-full px-2.5 text-[11px] transition ${state.period === item.key ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${item.label}</button>`).join('')}
      </div>`;
    }

    function renderSummary(total, hidden) {
      return `<div class="mt-1 flex items-center justify-between gap-2">
        <p class="min-w-0 truncate text-[12px] font-medium text-slate-600">当前时段 <span class="text-[14px] font-bold text-slate-900">${total}</span> 位老师有空档</p>
        <span class="shrink-0 rounded-full bg-emerald-50 px-2 py-0.5 text-[12px] font-semibold text-emerald-700 ring-1 ring-inset ring-emerald-200">${currentPeriod().label}</span>
      </div>
      <div class="mt-0.5 flex items-center gap-x-2 gap-y-0 text-[12px] font-medium text-slate-600">
        <span class="flex items-center gap-1"><span class="h-1.5 w-3 rounded-[1px] bg-emerald-500"></span>空闲</span>
        <span class="flex items-center gap-1"><span class="h-1.5 w-3 rounded-[1px] bg-slate-200"></span>已占 / 休息</span>
        ${hidden ? `<span class="ml-auto truncate text-slate-500">零空闲 ${hidden} 位已隐藏</span>` : ''}
      </div>`;
    }

    function renderMatrixHeader() {
      const hasHighlight = state.highlightDay !== null || state.highlightHour !== null;
      const focusParts = [];
      if (state.highlightDay !== null) focusParts.push(DAY_LABELS[state.highlightDay]);
      if (state.highlightHour !== null) focusParts.push(`${String(state.highlightHour).padStart(2, '0')}:00`);
      const dayButtons = DAY_SHORT.map((label, day) => {
        const active = state.highlightDay === day;
        return `<button type="button" data-highlight-day="${day}" aria-pressed="${active ? 'true' : 'false'}" class="flex h-5 w-4 items-center justify-center rounded text-[11px] font-bold transition ${active ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-indigo-50 hover:text-indigo-700'}" title="点击高亮${DAY_LABELS[day]}列">${label}</button>`;
      }).join('');
      return `<div class="sticky top-0 z-10 mt-1.5 flex items-center gap-1.5 rounded-lg border border-slate-300 bg-white/95 px-2 py-1 backdrop-blur-sm">
        <div class="flex min-w-0 flex-1 items-center gap-1">
          ${hasHighlight
            ? `<span class="truncate text-[12px] font-bold text-indigo-700">聚焦: ${focusParts.join(' · ')}</span><button type="button" data-clear-highlight class="shrink-0 rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-semibold text-slate-600 hover:bg-slate-200">清除</button>`
            : '<span class="truncate text-[12px] font-medium text-slate-500">点周几/时段聚焦空档</span>'}
        </div>
        <div class="flex shrink-0 items-center gap-1">
          <span class="w-9 shrink-0 pr-0.5 text-right text-[11px] font-medium text-slate-600">时段</span>
          <div class="grid grid-cols-7 gap-px">${dayButtons}</div>
        </div>
      </div>`;
    }

    function renderTeacherCard(teacher, free) {
      const student = contextStudent();
      const familiar = !!student && teacher.regulars.includes(state.student);
      const samePrice = !!student && teacher.price === student.price;
      const mine = state.role === 'monitor' && teacher.owner === CURRENT_MONITOR;
      const focus = state.focusTeacher === teacher.key;
      const load = weekLoad(teacher);
      const cardBorder = focus ? 'border-indigo-300 ring-2 ring-inset ring-indigo-200' : 'border-slate-300';
      return `<article data-teacher="${teacher.key}" data-load="${load}" data-free="${free}" data-familiar="${familiar ? 1 : 0}" data-same-price="${samePrice ? 1 : 0}" data-mine="${mine ? 1 : 0}" class="rounded-xl border ${cardBorder} bg-slate-50/70 px-2 py-0.5">
        <div class="flex items-center gap-1.5">
          <div class="flex min-w-0 flex-1 flex-col">
            <div class="flex min-w-0 flex-wrap items-center gap-x-1 gap-y-0.5">
              <span data-teacher-name="${teacher.key}" class="max-w-[112px] truncate text-[12px] font-bold leading-none text-slate-900">${esc(teacher.name)}</span>
              <span class="rounded bg-slate-100 px-1 py-0.5 text-[12px] font-bold leading-none text-slate-700">${esc(priceLabel(teacher.price))}</span>
              ${mine ? '<span class="rounded bg-slate-900 px-1 py-0.5 text-[12px] font-bold leading-none text-white">我负责</span>' : ''}
              ${familiar ? '<span class="rounded bg-indigo-50 px-1 py-0.5 text-[12px] font-bold leading-none text-indigo-700">教过该学员</span>' : ''}
              ${samePrice ? '<span class="rounded bg-emerald-50 px-1 py-0.5 text-[12px] font-bold leading-none text-emerald-700">同价位</span>' : ''}
              ${focus ? '<span class="rounded bg-indigo-600 px-1 py-0.5 text-[12px] font-bold leading-none text-white">当前</span>' : ''}
            </div>
            <div class="mt-1 flex items-center justify-between gap-1.5">
              <p class="truncate text-[12px] font-medium text-slate-600">${state.week === 0 ? '本周' : '下周'}负荷 <span class="text-[12px] font-bold text-slate-900">${load}</span>/${teacher.capacity} 节</p>
              <a href="${selectUrl(teacher)}" target="_blank" rel="noopener" class="inline-flex h-7 shrink-0 items-center justify-center gap-0.5 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 active:scale-[0.98]" aria-label="选取 ${esc(teacher.name)} 并进入课表">
                ${icon('corner-up-right', 'h-3.5 w-3.5')}选取
              </a>
            </div>
          </div>
          <div class="shrink-0">${renderMatrix(teacher)}</div>
        </div>
      </article>`;
    }

    function renderMatrix(teacher) {
      const period = currentPeriod();
      const hasHighlight = state.highlightDay !== null || state.highlightHour !== null;
      const bothHighlight = state.highlightDay !== null && state.highlightHour !== null;
      const cells = [];
      for (let row = 0; row < period.rows; row += 1) {
        const hour = period.start + Math.floor(row / 2);
        const matchHour = state.highlightHour === hour;
        for (let day = 0; day < 7; day += 1) {
          const free = isTeacherFree(teacher, state.week, day, row);
          const matchDay = state.highlightDay === day;
          let toneClass;
          if (!hasHighlight) {
            toneClass = free ? 'bg-emerald-500' : 'bg-slate-200';
          } else if (bothHighlight) {
            if (matchDay && matchHour) {
              toneClass = free ? 'bg-emerald-600 ring-1 ring-indigo-600' : 'bg-slate-300 ring-1 ring-indigo-400';
            } else if (matchDay || matchHour) {
              toneClass = free ? 'bg-emerald-500 opacity-85' : 'bg-slate-300 opacity-85';
            } else {
              toneClass = free ? 'bg-emerald-500 opacity-20' : 'bg-slate-200 opacity-20';
            }
          } else if (matchDay || matchHour) {
            toneClass = free ? 'bg-emerald-500' : 'bg-slate-300';
          } else {
            toneClass = free ? 'bg-emerald-500 opacity-25' : 'bg-slate-200 opacity-25';
          }
          cells.push(`<span class="h-1.5 w-4 rounded-[1px] transition-opacity ${toneClass}"></span>`);
        }
      }
      const timeLabels = [];
      for (let row = 0; row < period.rows; row += 2) {
        const hour = period.start + row / 2;
        const activeHour = state.highlightHour === hour;
        timeLabels.push(`<button type="button" data-highlight-hour="${hour}" aria-pressed="${activeHour ? 'true' : 'false'}" class="flex h-[13px] w-full items-center justify-end rounded px-0.5 font-mono text-[11px] leading-none transition ${activeHour ? 'bg-indigo-600 font-bold text-white' : 'text-slate-500 hover:bg-indigo-50 hover:text-indigo-700'}" title="点击高亮全页 ${rowTime(period, row)} 时段">${rowTime(period, row)}</button>`);
      }
      return `<div class="flex shrink-0 items-start gap-1" role="img" aria-label="${esc(teacher.name)} 空闲分布：7 列周一至周日，每两行一小时">
        <div class="flex w-9 shrink-0 flex-col gap-px">${timeLabels.join('')}</div>
        <div class="grid grid-cols-7 gap-px">${cells.join('')}</div>
      </div>`;
    }

    function renderEmptyState() {
      return `<div class="mt-3 rounded-2xl border border-dashed border-slate-300 bg-slate-50/70 px-4 py-8 text-center">
        <div class="mx-auto grid h-11 w-11 place-items-center rounded-2xl border border-slate-200 bg-white text-slate-500">${icon('search-x', 'h-5 w-5')}</div>
        <p class="mt-2 text-[14px] font-bold text-slate-900">当前时段暂无老师有空档</p>
        <p class="mt-1 text-[12px] font-medium text-slate-600">试试切换价位、时段或周次</p>
      </div>`;
    }

    function renderLoadMore(total, visibleCount) {
      if (total <= 5) {
        return `<p class="mt-2 text-center text-[12px] font-medium text-slate-500">已显示全部 ${visibleCount} 位老师</p>`;
      }
      if (visibleCount >= LOAD_LIMIT) {
        return `<div class="mt-2 rounded-lg border border-slate-300 bg-slate-50/70 px-3 py-1.5 text-center text-[12px] font-semibold text-slate-600">已显示 ${visibleCount} 位 · 已达上限</div>`;
      }
      if (visibleCount >= total) {
        return `<p class="mt-2 text-center text-[12px] font-medium text-slate-500">已显示全部 ${visibleCount} 位老师</p>`;
      }
      return `<button type="button" data-action="load-more" class="mt-2 flex h-9 w-full items-center justify-center gap-1 rounded-lg border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 transition hover:bg-slate-50 active:bg-slate-100">
        ${icon('chevron-down', 'h-4 w-4')}再加载 5 位老师
        <span class="text-[12px] font-medium text-slate-500">(已显示 ${visibleCount} / 上限 ${LOAD_LIMIT})</span>
      </button>`;
    }

    function renderToast() {
      return `<div class="pointer-events-none absolute left-1/2 top-20 z-[100] w-max max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl bg-slate-900/90 px-3.5 py-2 text-center text-[12px] font-semibold leading-relaxed text-white shadow-xl">${esc(state.toast)}</div>`;
    }

    /* ------------------------------------------------------------------
     * 浮层：对象选择 / 排课规则
     * ------------------------------------------------------------------ */
    function overlayShell(title, content) {
      return `<div class="absolute inset-0 z-50">
        <button type="button" data-action="close-overlay" class="absolute inset-0 h-full w-full bg-slate-900/40" aria-label="关闭浮层"></button>
        <div class="absolute inset-x-0 bottom-0 max-h-[85%] overflow-y-auto rounded-t-3xl bg-white px-3 pb-5 pt-2.5 shadow-2xl">
          <div class="mx-auto mb-2 h-1 w-10 rounded-full bg-slate-200"></div>
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-[16px] font-bold text-slate-900">${title}</h2>
            <button type="button" data-action="close-overlay" class="grid h-8 w-8 place-items-center rounded-lg bg-slate-100 text-slate-600" aria-label="关闭">${icon('x', 'h-4 w-4')}</button>
          </div>
          ${content}
        </div>
      </div>`;
    }

    function renderOverlay() {
      if (state.overlay === 'context') return overlayShell('选择学员 / 小班', renderContextSheetContent());
      if (state.overlay === 'rules') return overlayShell('排课规则', renderRulesContent());
      return '';
    }

    function renderContextSheetContent() {
      const studentButtons = Object.values(STUDENTS).map((student) => {
        const active = state.contextType === 'student' && state.student === student.key;
        return `<button type="button" data-pick-context="student" data-key="${student.key}" class="flex w-full items-center gap-2 rounded-xl border p-2.5 text-left transition active:scale-[0.99] ${active ? 'border-indigo-300 bg-indigo-50/60' : 'border-slate-300 bg-slate-50/70 hover:bg-slate-100'}">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl border border-indigo-100 bg-white text-[16px]">${student.emoji}</span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-[14px] font-bold text-slate-900">${esc(student.nickname)}</span>
            <span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">${esc(priceLabel(student.price))} · 固定位可用 ${student.credits} 节</span>
          </span>
          ${active ? `<span class="shrink-0 text-[12px] font-bold text-indigo-600">已选</span>` : ''}
        </button>`;
      }).join('');

      const classButtons = Object.values(CLASSES).map((cls) => {
        const active = state.contextType === 'class' && state.classKey === cls.key;
        const teacher = cls.teacher ? TEACHERS.find((item) => item.key === cls.teacher) : null;
        return `<button type="button" data-pick-context="class" data-key="${cls.key}" class="flex w-full items-center gap-2 rounded-xl border p-2.5 text-left transition active:scale-[0.99] ${active ? 'border-indigo-300 bg-indigo-50/60' : 'border-slate-300 bg-slate-50/70 hover:bg-slate-100'}">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl border border-teal-200 bg-white text-[14px] font-bold text-teal-800">${esc(cls.code.slice(0, 1))}</span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-[14px] font-bold text-slate-900">${esc(cls.name)}</span>
            <span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">${cls.credits} 节可用 · ${teacher ? `主讲 ${esc(teacher.name)}` : '主讲待委任'}</span>
          </span>
          ${active ? `<span class="shrink-0 text-[12px] font-bold text-indigo-600">已选</span>` : ''}
        </button>`;
      }).join('');

      return `<p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">选学员后按熟客、价位与当周负荷排序；也可保持无对象，仅查空档。</p>
        <div class="mt-2 grid grid-cols-1 gap-2">${studentButtons}</div>
        <p class="mt-3 text-[12px] font-semibold text-slate-600">小班</p>
        <div class="mt-1 grid grid-cols-1 gap-2">${classButtons}</div>
        <button type="button" data-pick-context="none" class="mt-2 flex h-11 w-full items-center justify-center gap-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 transition hover:bg-slate-50">
          ${icon('search', 'h-4 w-4')}仅查空档
        </button>`;
    }

    function renderRulesContent() {
      return `<div class="mt-2 space-y-2">
        <div class="rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="flex items-center gap-1.5">
            <span class="grid h-6 w-6 shrink-0 place-items-center rounded-lg border border-slate-200 bg-white text-indigo-600">${icon('calendar-check', 'h-3.5 w-3.5')}</span>
            <p class="text-[14px] font-bold text-slate-900">固定位与整班排课</p>
          </div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">以 4 周为一轮，每个每周时段是独立原子单元；未来 4 周全通才可落单，避免残缺预占。</p>
        </div>
        <div class="rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="flex items-center gap-1.5">
            <span class="grid h-6 w-6 shrink-0 place-items-center rounded-lg border border-slate-200 bg-white text-amber-600">${icon('refresh-cw', 'h-3.5 w-3.5')}</span>
            <p class="text-[14px] font-bold text-slate-900">续费预占可平移</p>
          </div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">家长暂不续费将立即释放未来 4 周预占；申请调整期间保底锁位，改期或换师后旧占位释放、新占位锁定。</p>
        </div>
        <div class="rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="flex items-center gap-1.5">
            <span class="grid h-6 w-6 shrink-0 place-items-center rounded-lg border border-slate-200 bg-white text-teal-700">${icon('layout-grid', 'h-3.5 w-3.5')}</span>
            <p class="text-[14px] font-bold text-slate-900">小班连续双格</p>
          </div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">老师课表按连续双格选取并校验 4 周连贯度；未委任主讲老师时先完成委任。</p>
        </div>
        <div class="rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="flex items-center gap-1.5">
            <span class="grid h-6 w-6 shrink-0 place-items-center rounded-lg border border-slate-200 bg-white text-slate-700">${icon('mouse-pointer-click', 'h-3.5 w-3.5')}</span>
            <p class="text-[14px] font-bold text-slate-900">本页只负责挑老师</p>
          </div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">点“选取”进入老师当周课表后，再选具体时段、查看 4 周校验并提交。</p>
        </div>
      </div>
      <button type="button" data-action="close-overlay" class="mt-3 h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-bold text-white transition hover:bg-indigo-700">知道了</button>`;
    }

    /* ------------------------------------------------------------------
     * 演示控制台
     * ------------------------------------------------------------------ */
    function segment(group, options, activeValue) {
      return `<div class="inline-flex rounded-xl bg-slate-100 p-1">
        ${options.map((option) => `<button type="button" data-control="${group}" data-value="${option.value}" class="rounded-lg px-2.5 py-1.5 text-[12px] font-semibold transition ${activeValue === option.value ? 'bg-white text-slate-900' : 'text-slate-600 hover:text-slate-900'}">${option.label}</button>`).join('')}
      </div>`;
    }

    function renderConsole() {
      const scenarios = [
        { value: 'student-alice', label: '学员 Alice' },
        { value: 'student-bob', label: '学员 Bob' },
        { value: 'class-ket', label: '小班 KET' },
        { value: 'class-unassigned', label: '小班待委任' },
        { value: 'empty', label: '仅查空档' },
        { value: 'price-all', label: '全部价位' },
        { value: 'price-16', label: '16积分' },
        { value: 'price-18', label: '18积分' },
        { value: 'price-21', label: '21积分' },
        { value: 'period-early', label: '早 06-11' },
        { value: 'period-mid', label: '中 10-15' },
        { value: 'period-afternoon', label: '下 14-19' },
        { value: 'period-evening', label: '晚 18-24' },
        { value: 'week-next', label: '下周' },
        { value: 'load-more', label: '已加载 10 位' },
        { value: 'focus-david', label: '当前老师 David' }
      ];
      return `<header class="sticky top-0 z-[60] border-b border-slate-200 bg-white/95 backdrop-blur">
        <div class="mx-auto max-w-[1400px] px-3 py-2.5">
          <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
            <div class="flex min-w-0 items-center gap-2">
              <span class="grid h-6 w-6 shrink-0 place-items-center rounded-lg bg-slate-900 text-[12px] font-bold text-amber-400">D</span>
              <div class="min-w-0">
                <div class="truncate text-[14px] font-bold text-slate-900">老师空闲大盘演示控制台</div>
                <div class="truncate text-[12px] font-medium text-slate-500">两步式排课 · 空档对比 · 5 位分批 · 课表复选</div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-[12px] font-medium text-slate-500">角色</span>
              ${segment('role', [{ value: 'monitor', label: '班长' }, { value: 'admin', label: '管理员' }], state.role)}
            </div>
            <div class="flex items-center gap-2">
              <span class="text-[12px] font-medium text-slate-500">设备</span>
              ${segment('device', [{ value: 'mobile', label: '手机' }, { value: 'tablet', label: '平板' }], state.device)}
            </div>
            <div class="flex items-center gap-2">
              <span class="text-[12px] font-medium text-slate-500">网络</span>
              ${segment('network', [{ value: 'on', label: '在线' }, { value: 'off', label: '离线' }], state.online ? 'on' : 'off')}
            </div>
            <div class="ml-auto flex flex-wrap items-center gap-2">
              <span class="hidden text-[12px] font-medium text-slate-500 xl:inline">演示日 11-14 周六</span>
              <button type="button" data-action="reset-demo" class="rounded-lg border border-slate-200 px-3 py-1.5 text-[12px] font-semibold text-slate-600 transition hover:bg-slate-50">重置演示</button>
            </div>
          </div>
          <div class="mt-2 flex flex-wrap items-center gap-1.5">
            <span class="mr-1 text-[12px] font-medium text-slate-500">场景</span>
            ${scenarios.map((scenario) => `<button type="button" data-scenario="${scenario.value}" class="rounded-lg border px-2 py-1.5 text-[12px] font-semibold transition ${state.scenario === scenario.value ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">${scenario.label}</button>`).join('')}
          </div>
        </div>
      </header>`;
    }

    /* ------------------------------------------------------------------
     * 交互
     * ------------------------------------------------------------------ */
    function flashToast(message) {
      state.toast = message;
      render(true);
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        state.toast = '';
        render(true);
      }, 2400);
    }

    function pickContext(type, key) {
      state.overlay = null;
      state.shown = 5;
      state.scenario = '';
      if (type === 'student' && STUDENTS[key]) {
        state.contextType = 'student';
        state.student = key;
      } else if (type === 'class' && CLASSES[key]) {
        state.contextType = 'class';
        state.classKey = key;
      } else {
        state.contextType = 'none';
      }
      render(false);
      if (type === 'class' && CLASSES[key] && !CLASSES[key].teacher) {
        flashToast('该小班尚未委任主讲老师，排课前请先委任');
      }
    }

    function setFilter(group, value) {
      if (group === 'price' && ['all', '16', '18', '21'].includes(value)) state.price = value;
      if (group === 'period' && PERIODS[value]) {
        state.period = value;
        const p = PERIODS[value];
        if (state.highlightHour !== null && (state.highlightHour < p.start || state.highlightHour >= p.end)) {
          state.highlightHour = null;
        }
      }
      state.shown = 5;
      state.scenario = '';
      render(false);
    }

    function setWeek(value) {
      state.week = value === 1 ? 1 : 0;
      state.shown = 5;
      state.scenario = '';
      render(false);
    }

    function setControl(group, value) {
      if (group === 'role' && ['monitor', 'admin'].includes(value)) state.role = value;
      if (group === 'device' && ['mobile', 'tablet'].includes(value)) state.device = value;
      if (group === 'network') state.online = value === 'on';
      state.scenario = '';
      render(false);
    }

    function resetDemo() {
      state.role = 'monitor';
      state.device = 'mobile';
      state.online = true;
      state.contextType = 'none';
      state.student = 'alice';
      state.classKey = 'ket1';
      state.price = '16';
      state.period = 'mid';
      state.week = 0;
      state.shown = 5;
      state.overlay = null;
      state.focusTeacher = null;
      state.highlightDay = null;
      state.highlightHour = null;
      state.toast = '';
      state.scenario = '';
      if (toastTimer) clearTimeout(toastTimer);
      render(false);
    }

    document.addEventListener('click', (event) => {
      const control = event.target.closest('[data-control]');
      if (control) {
        setControl(control.dataset.control, control.dataset.value);
        return;
      }

      const scenarioButton = event.target.closest('[data-scenario]');
      if (scenarioButton) {
        applyScenario(scenarioButton.dataset.scenario);
        render(false);
        return;
      }

      const weekButton = event.target.closest('[data-week-select]');
      if (weekButton) {
        setWeek(Number(weekButton.dataset.weekSelect));
        return;
      }

      const filterButton = event.target.closest('[data-filter]');
      if (filterButton) {
        setFilter(filterButton.dataset.filter, filterButton.dataset.value);
        return;
      }

      const pickButton = event.target.closest('[data-pick-context]');
      if (pickButton) {
        pickContext(pickButton.dataset.pickContext, pickButton.dataset.key);
        return;
      }

      const dayButton = event.target.closest('[data-highlight-day]');
      if (dayButton) {
        const day = Number(dayButton.dataset.highlightDay);
        state.highlightDay = state.highlightDay === day ? null : day;
        render(true);
        return;
      }

      const hourButton = event.target.closest('[data-highlight-hour]');
      if (hourButton) {
        const hour = Number(hourButton.dataset.highlightHour);
        state.highlightHour = state.highlightHour === hour ? null : hour;
        render(true);
        return;
      }

      if (event.target.closest('[data-clear-highlight]')) {
        state.highlightDay = null;
        state.highlightHour = null;
        render(true);
        return;
      }

      const trigger = event.target.closest('[data-action]');
      if (!trigger) return;
      const action = trigger.dataset.action;

      if (action === 'open-context') {
        state.overlay = 'context';
        render(true);
      } else if (action === 'open-rules') {
        state.overlay = 'rules';
        render(true);
      } else if (action === 'close-overlay') {
        state.overlay = null;
        render(true);
      } else if (action === 'load-more') {
        const total = sortedTeachers().length;
        if (state.shown < LOAD_LIMIT && state.shown < total) {
          state.shown = Math.min(LOAD_LIMIT, state.shown + 5);
          render(true);
        }
      } else if (action === 'reset-demo') {
        resetDemo();
      }
    });

    render(false);
  </script>
</body>
</html>

    if (!params.get('scenario') && state.view === 'calendar' && !['group_single', 'makeup'].includes(params.get('mode'))) {
      state.calMode = defaultCalMode();

    function contextStudent() {
      return state.contextType === 'student' ? STUDENTS[state.student] : null;

      return state.contextType === 'class' ? CLASSES[state.classKey] : null;
    }

    function currentPeriod() {
      return PERIODS[state.period] || PERIODS.mid;
    }

    function weekLoad(teacher) {
      return state.week === 0 ? teacher.load : teacher.loadNext;
    }

    function weekMeta() {
      return WEEK_META.find((item) => item.value === state.week) || WEEK_META[0];
    }

    /* ------------------------------------------------------------------
     * 通用工具

    const esc = (value) => String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function pad2(value) {
      return String(value).padStart(2, '0');
    }

    function rowTime(period, row) {
      const total = period.start * 60 + row * 30;
      return `${pad2(Math.floor(total / 60))}:${pad2(total % 60)}`;
    }

    function roleMeta() {
      if (state.role === 'admin') {
        return { banner: 'from-slate-900 via-violet-950 to-slate-800', initial: 'S', label: '管理员' };
      }
      return { banner: 'from-slate-900 via-fuchsia-950 to-slate-800', initial: 'L', label: '班长' };
    }

    /* ------------------------------------------------------------------
     * 空闲矩阵计算：确定性 Mock，保证除零空闲老师外至少 1 格可排
     * ------------------------------------------------------------------ */
    function hash01(seed) {
      const x = Math.sin(seed * 12.9898) * 43758.5453;
      return x - Math.floor(x);
    }

    function firstWorkDay(teacher) {
      for (let day = 0; day < 7; day += 1) {
        if (teacher.offDays.includes(day)) continue;
        if (teacher.weekendOff && day >= 5) continue;
        return day;
      }
      return 0;
    }

    function forcedFreeCell(teacher) {
      const period = currentPeriod();
      const row = Math.min(period.rows - 1, 3);
      const slot = period.start * 2 + row;
      if (slot < teacher.start * 2 || slot >= teacher.end * 2) return null;
      return { day: firstWorkDay(teacher), row };
    }

    function isTeacherFree(teacher, week, day, row) {
      const period = currentPeriod();
      const slot = period.start * 2 + row;
      if (teacher.zeroPeriods.includes(state.period)) return false;
      if (slot < teacher.start * 2 || slot >= teacher.end * 2) return false;
      if (teacher.offDays.includes(day)) return false;
      if (teacher.weekendOff && day >= 5) return false;
      const forced = forcedFreeCell(teacher);
      if (forced && forced.day === day && forced.row === row) return true;
      const loadRate = (week === 0 ? teacher.load : teacher.loadNext) / teacher.capacity;
      const busyThreshold = 0.34 + loadRate * 0.62;
      const value = hash01(teacher.seed * 7.13 + week * 31.7 + day * 11.3 + slot * 3.1);
      return value > busyThreshold;
    }

    function teacherFreeCount(teacher) {
      const period = currentPeriod();
      let count = 0;
      for (let day = 0; day < 7; day += 1) {
        for (let row = 0; row < period.rows; row += 1) {
          if (isTeacherFree(teacher, state.week, day, row)) count += 1;
        }
      }
      return count;
    }

    function priceGroup() {
      return TEACHERS.filter((teacher) => state.price === 'all' || teacher.price === state.price);
    }

    function priceDistance(teacherPrice, targetPrice) {
      if (!targetPrice) return 0;
      return Math.abs((PRICE_ORDER[teacherPrice] ?? 0) - (PRICE_ORDER[targetPrice] ?? 0));
    }

    function sortedTeachers() {
      const list = priceGroup()
        .map((teacher) => ({ teacher, free: teacherFreeCount(teacher) }))
        .filter((item) => item.free > 0);

      if (state.contextType === 'student') {
        const student = contextStudent();
        list.sort((a, b) => {
          const familiarA = a.teacher.regulars.includes(state.student) ? 1 : 0;
          const familiarB = b.teacher.regulars.includes(state.student) ? 1 : 0;
          if (familiarA !== familiarB) return familiarB - familiarA;
          const priceA = priceDistance(a.teacher.price, student.price);
          const priceB = priceDistance(b.teacher.price, student.price);
          if (priceA !== priceB) return priceA - priceB;
          const loadA = weekLoad(a.teacher);
          const loadB = weekLoad(b.teacher);
          if (loadA !== loadB) return loadA - loadB;
          if (a.free !== b.free) return b.free - a.free;
          return a.teacher.name.localeCompare(b.teacher.name);
        });
      } else if (state.contextType === 'class') {
        const cls = contextClass();
        list.sort((a, b) => {
          const assignedA = cls.teacher === a.teacher.key ? 1 : 0;
          const assignedB = cls.teacher === b.teacher.key ? 1 : 0;
          if (assignedA !== assignedB) return assignedB - assignedA;
          const priceA = priceDistance(a.teacher.price, cls.price);
          const priceB = priceDistance(b.teacher.price, cls.price);
          if (priceA !== priceB) return priceA - priceB;
          const loadA = weekLoad(a.teacher);
          const loadB = weekLoad(b.teacher);
          if (loadA !== loadB) return loadA - loadB;
          return b.free - a.free;
        });
      } else {
        list.sort((a, b) => {
          if (a.free !== b.free) return b.free - a.free;
          const loadA = weekLoad(a.teacher);
          const loadB = weekLoad(b.teacher);
          if (loadA !== loadB) return loadA - loadB;
          return a.teacher.name.localeCompare(b.teacher.name);
        });
      }

      return list;
    }

    function hiddenCount() {
      return priceGroup().filter((teacher) => teacherFreeCount(teacher) === 0).length;

      }
      if (cls) {
        const teacher = cls.teacher ? TEACHERS.find((item) => item.key === cls.teacher) : null;
        return `<button type="button" data-action="open-context" class="mt-1 flex w-full items-center gap-1.5 rounded-xl border border-slate-300 bg-slate-50/70 px-2 py-1 text-left transition active:scale-[0.995]" aria-label="切换排课对象">

          </span>

        </button>`;
      }
      return `<button type="button" data-action="open-context" class="mt-1 flex w-full items-center gap-1.5 rounded-xl border border-dashed border-slate-300 bg-slate-50/70 px-2 py-1 text-left transition active:scale-[0.995]" aria-label="选择学员或小班">

    function renderMatrixHeader() {

    function renderTeacherCard(teacher, free) {
      const student = contextStudent();
      const familiar = !!student && teacher.regulars.includes(state.student);
      const samePrice = !!student && teacher.price === student.price;
      const mine = state.role === 'monitor' && teacher.owner === CURRENT_MONITOR;
      const focus = state.focusTeacher === teacher.key;
      const load = weekLoad(teacher);
      const cardBorder = focus ? 'border-indigo-300 ring-2 ring-inset ring-indigo-200' : 'border-slate-300';
      const selectControl = state.renewalEdit
        ? `<a href="${esc(selectUrl(teacher))}" class="inline-flex h-7 shrink-0 items-center justify-center gap-0.5 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 active:scale-[0.98]" aria-label="选取 ${esc(teacher.name)} 并跳转课表">${icon('corner-up-right', 'h-3.5 w-3.5')}选取</a>`
        : `<button type="button" data-action="select-teacher" data-teacher="${teacher.key}" class="inline-flex h-7 shrink-0 items-center justify-center gap-0.5 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 active:scale-[0.98]" aria-label="选取 ${esc(teacher.name)} 并进入课表">${icon('corner-up-right', 'h-3.5 w-3.5')}选取</button>`;

              <span class="rounded bg-slate-100 px-1 py-0.5 text-[12px] font-bold leading-none text-slate-700">${esc(priceLabel(teacher.price))}</span>
              ${mine ? '<span class="rounded bg-slate-900 px-1 py-0.5 text-[12px] font-bold leading-none text-white">我负责</span>' : (state.role === 'monitor' ? '<span title="非本人负责老师：1v1 固定位不可排；临时代约落盘后向目标老师负责班长发送 M4 中性知会" class="rounded bg-sky-50 px-1 py-0.5 text-[12px] font-bold leading-none text-sky-700">跨组</span>' : '')}
              ${familiar ? '<span class="rounded bg-indigo-50 px-1 py-0.5 text-[12px] font-bold leading-none text-indigo-700">教过该学员</span>' : ''}
              ${samePrice ? '<span class="rounded bg-emerald-50 px-1 py-0.5 text-[12px] font-bold leading-none text-emerald-700">同价位</span>' : ''}
              ${focus ? '<span class="rounded bg-indigo-600 px-1 py-0.5 text-[12px] font-bold leading-none text-white">当前</span>' : ''}
            </div>
            <div class="mt-1 flex items-center justify-between gap-1.5">
              <p class="truncate text-[12px] font-medium text-slate-600">${state.week === 0 ? '本周' : '下周'}负荷 <span class="text-[12px] font-bold text-slate-900">${load}</span>/${teacher.capacity} 节</p>
              ${selectControl}
            </div>
          </div>
          <div class="shrink-0">${renderMatrix(teacher)}</div>
        </div>
      </article>`;
    }

    function renderMatrix(teacher) {
      const period = currentPeriod();
      const hasHighlight = state.highlightDay !== null || state.highlightHour !== null;
      const bothHighlight = state.highlightDay !== null && state.highlightHour !== null;
      const cells = [];
      for (let row = 0; row < period.rows; row += 1) {
        const hour = period.start + Math.floor(row / 2);
        const matchHour = state.highlightHour === hour;
        for (let day = 0; day < 7; day += 1) {
          const free = isTeacherFree(teacher, state.week, day, row);
          const matchDay = state.highlightDay === day;
          let toneClass;
          if (!hasHighlight) {
            toneClass = free ? 'bg-emerald-500' : 'bg-slate-200';
          } else if (bothHighlight) {
            if (matchDay && matchHour) {
              toneClass = free ? 'bg-emerald-600 ring-1 ring-indigo-600' : 'bg-slate-300 ring-1 ring-indigo-400';
            } else if (matchDay || matchHour) {
              toneClass = free ? 'bg-emerald-500 opacity-85' : 'bg-slate-300 opacity-85';
            } else {
              toneClass = free ? 'bg-emerald-500 opacity-20' : 'bg-slate-200 opacity-20';
            }
          } else if (matchDay || matchHour) {
            toneClass = free ? 'bg-emerald-500' : 'bg-slate-300';
          } else {
            toneClass = free ? 'bg-emerald-500 opacity-25' : 'bg-slate-200 opacity-25';
          }
          cells.push(`<span class="h-1.5 w-4 rounded-[1px] transition-opacity ${toneClass}"></span>`);
        }
      }
      const timeLabels = [];
      for (let row = 0; row < period.rows; row += 2) {
        const hour = period.start + row / 2;
        const activeHour = state.highlightHour === hour;
        timeLabels.push(`<button type="button" data-highlight-hour="${hour}" aria-pressed="${activeHour ? 'true' : 'false'}" class="flex h-[13px] w-full items-center justify-end rounded px-0.5 font-mono text-[11px] leading-none transition ${activeHour ? 'bg-indigo-600 font-bold text-white' : 'text-slate-500 hover:bg-indigo-50 hover:text-indigo-700'}" title="点击高亮全页 ${rowTime(period, row)} 时段">${rowTime(period, row)}</button>`);
      }
      return `<div class="flex shrink-0 items-start gap-1" role="img" aria-label="${esc(teacher.name)} 空闲分布：7 列周一至周日，每两行一小时">
        <div class="flex w-9 shrink-0 flex-col gap-px">${timeLabels.join('')}</div>
        <div class="grid grid-cols-7 gap-px">${cells.join('')}</div>
      </div>`;
    }

    function renderEmptyState() {
      return `<div class="mt-3 rounded-2xl border border-dashed border-slate-300 bg-slate-50/70 px-4 py-8 text-center">
        <div class="mx-auto grid h-11 w-11 place-items-center rounded-2xl border border-slate-200 bg-white text-slate-500">${icon('search-x', 'h-5 w-5')}</div>
        <p class="mt-2 text-[14px] font-bold text-slate-900">当前时段暂无老师有空档</p>
        <p class="mt-1 text-[12px] font-medium text-slate-600">试试切换价位、时段或周次</p>
      </div>`;
    }

    function renderLoadMore(total, visibleCount) {
      if (total <= 5) {
        return `<p class="mt-2 text-center text-[12px] font-medium text-slate-500">已显示全部 ${visibleCount} 位老师</p>`;
      }
      if (visibleCount >= LOAD_LIMIT) {
        return `<div class="mt-2 rounded-lg border border-slate-300 bg-slate-50/70 px-3 py-1.5 text-center text-[12px] font-medium leading-relaxed text-slate-600"><span class="font-bold text-slate-800">已显示 ${visibleCount} 位 · 已达上限</span>（轻量化大盘性能取舍）<br>请叠加「价位 + 时段 + 本周/下周」筛选收窄范围，或前往 M1B 老师列表按姓名精确搜索后进入课表</div>`;
      }
      if (visibleCount >= total) {
        return `<p class="mt-2 text-center text-[12px] font-medium text-slate-500">已显示全部 ${visibleCount} 位老师</p>`;
      }
      return `<button type="button" data-action="load-more" class="mt-2 flex h-9 w-full items-center justify-center gap-1 rounded-lg border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 transition hover:bg-slate-50 active:bg-slate-100">
        ${icon('chevron-down', 'h-4 w-4')}再加载 5 位老师
        <span class="text-[12px] font-medium text-slate-500">(已显示 ${visibleCount} / 上限 ${LOAD_LIMIT})</span>
      </button>`;
    }

    function renderToast() {
      return `<div class="pointer-events-none absolute left-1/2 top-20 z-[100] w-max max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl bg-slate-900/90 px-3.5 py-2 text-center text-[12px] font-semibold leading-relaxed text-white shadow-xl">${esc(state.toast)}</div>`;
    }

    /* ------------------------------------------------------------------
     * 浮层：对象选择 / 排课规则
     * ------------------------------------------------------------------ */
    function overlayShell(title, content) {
      return `<div class="absolute inset-0 z-50">
        <button type="button" data-action="close-overlay" class="absolute inset-0 h-full w-full bg-slate-900/40" aria-label="关闭浮层"></button>
        <div class="absolute inset-x-0 bottom-0 max-h-[85%] overflow-y-auto rounded-t-3xl bg-white px-3 pb-5 pt-2.5 shadow-2xl">
          <div class="mx-auto mb-2 h-1 w-10 rounded-full bg-slate-200"></div>
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-[16px] font-bold text-slate-900">${title}</h2>
            <button type="button" data-action="close-overlay" class="grid h-8 w-8 place-items-center rounded-lg bg-slate-100 text-slate-600" aria-label="关闭">${icon('x', 'h-4 w-4')}</button>
          </div>
          ${content}
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 第 2 步：复用老师当周课表页（排课复选态 · 打通 4 周）
     * ------------------------------------------------------------------ */
    const CAL_START_HOUR = 8;
    const CAL_ROWS = 28; // 08:00 ~ 21:30

    function currentCalTeacher() {
      return TEACHERS.find((t) => t.key === state.selectedTeacher) || TEACHERS[0];
    }

    function defaultCalMode() {
      if (state.contextType === 'class') {
        const cls = contextClass();
        return cls && cls.credits < 4 ? 'makeup' : 'batch';
      }
      return 'temp';
    }

    function availableCredits() {
      if (state.contextType === 'student') return contextStudent().credits;
      if (state.contextType === 'class') return contextClass().credits;
      return 0;
    }

    function calRowTime(row) {
      const total = CAL_START_HOUR * 60 + row * 30;
      return `${pad2(Math.floor(total / 60))}:${pad2(total % 60)}`;
    }

    function slotKey(day, row) {
      return `${day}-${row}`;
    }

    function isDayWithinTempWindow(day) {
      // 演示日为 11-14 周六 (day=5)；第 1 轮 week=0 中，周日(6) 为 +1天，其余为过去；
      // 为方便演示 AC-3D-05：设定 cycleOffset===0 且 calWeek===0 时 day=5(今天) 不可约，day=6(明天/+1天) 可约；
      // calWeek===1 (下周) 中 day=0..4 (+2~+6天) 可约，day=5..6 (+7~+8天) 超出 7 天不可约；calWeek>=2 均超出 7 天。
      if (state.cycleOffset !== 0) return false;
      if (state.calWeek === 0) return day === 6;
      if (state.calWeek === 1) return day <= 4;
      return false;
    }

    function getBaseCalCell(teacherKey, absWeek, day, row) {
      const overrideKey = `${absWeek}-${day}-${row}`;
      if (state.lockedOverrides[overrideKey]) {
        return state.lockedOverrides[overrideKey];
      }
      const wInCycle = ((absWeek % 4) + 4) % 4;
      const teacher = TEACHERS.find((t) => t.key === teacherKey) || TEACHERS[0];
      const hour = CAL_START_HOUR + Math.floor(row / 2);

      /* 老师预约离职日 D 起（含 D 当日）全格熔断，不可排入或手工补入 */
      if (teacher.resignWeek !== undefined && wInCycle >= teacher.resignWeek) {
        return { type: 'GRAY', label: '离职', conflictReason: '老师预约离职日 D 起熔断，不可排' };
      }

      // 续费 HOLD 与冲突降级场景 (AC-3D-07, AC-3D-08)
      if (day === 0 && row === 22) { // 周一 19:00
        if ((state.holdMode === 'normal' || state.holdMode === 'voucher') && !state.releasedHold) {
          return {
            type: 'ORANGE_HOLD',
            label: state.holdMode === 'voucher' ? '待核' : 'Alic',
            isHold: true,
            voucherPending: state.holdMode === 'voucher'
          };
        }
        if (state.holdMode === 'conflict') {
          if (wInCycle === 2) return { type: 'RED', label: '假', conflictReason: '第3周老师休假' };
          return { type: 'GREEN', label: '约' };
        }
        if (state.holdMode === 'all-conflict') {
          return { type: 'RED', label: '满', conflictReason: '4 周全冲突 (0/4)' };
        }
      }

      // 第3周老师请假冲突 (AC-3D-11)
      if (day === 2 && row === 20 && wInCycle === 2) {
        return { type: 'RED', label: '假', conflictReason: '第3周老师请假' };
      }
      // 第2周小班双格局部冲突 (75分 · 3/4周)
      if (day === 5 && (row === 12 || row === 13) && wInCycle === 1) {
        return { type: 'ORANGE', label: 'TimZ', conflictReason: '第2周已有 1v1 占用' };
      }

      // 必绿演示格（模板周可用，逐周校验后部分周可能冲突）
      const guaranteedGreen = [
        '1-22', '3-20', '3-23', '1-23', // 周二19:00, 周四18:00, 周四19:30, 周二19:30
        '5-4', '5-5',   // 周六 10:00-11:00 (小班双格)
        '6-2', '6-3',   // 周日 09:00-10:00 (小班双格)
        '6-4', '6-5',   // 周日 10:00-11:00 (小班撞已绑学员 1v1 演示 AC-3D-23)
        '6-14', '6-15', // 周日 15:00-16:00 (小班单节补排 AC-3D-12)
        '5-12', '5-13'  // 周六 14:00-15:00 (非第2周空闲)
      ];
      if (guaranteedGreen.includes(`${day}-${row}`)) {
        return { type: 'GREEN', label: '约' };
      }

      // 7色日历丰富演示数据
      if (day === 1 && row === 20) return { type: 'ORANGE', label: 'BobZ' };
      if (day === 2 && row === 22) return { type: 'BLUE', label: 'TimZ' };
      if (day === 4 && row === 20) return { type: 'PURPLE', label: 'EvaZ' };
      if (day === 4 && row === 22) return { type: 'YELLOW', label: 'MiaZ' };
      if (day === 5 && row === 21) return { type: 'TEAL', label: 'KET2', isDoubleStart: true, enrolled: 3, capacity: 4 };
      if (day === 5 && row === 22) return { type: 'TEAL', label: 'KET2', isDoubleCont: true };

      if (teacher.offDays.includes(day) || (teacher.weekendOff && day >= 5)) {
        return { type: 'GRAY', label: '休' };
      }
      if (hour < teacher.start || hour >= teacher.end) {
        return { type: 'GRAY', label: '休' };
      }
      const val = hash01(teacher.seed * 5.3 + absWeek * 17.1 + day * 9.7 + row * 2.9);
      if (val > 0.58) return { type: 'GREEN', label: '约' };
      if (val > 0.35) return { type: 'ORANGE', label: 'LeoZ' };
      return { type: 'GRAY', label: '休' };
    }

    /* 正式学员已绑定小班的 [G] 已排期双格（1v1 严格禁占；小班自身落盘不受影响） */
    const STUDENT_BOUND_CLASS_SLOTS = {
      alice: [
        { wInCycle: 1, day: 5, row: 4, time: '第2周 周六 10:00' },
        { wInCycle: 1, day: 5, row: 5, time: '第2周 周六 10:30' }
      ]
    };

    function studentBoundClassSlot(studentKey, absWeek, day, row) {
      const wInCycle = ((absWeek % 4) + 4) % 4;
      return (STUDENT_BOUND_CLASS_SLOTS[studentKey] || [])
        .find((entry) => entry.wInCycle === wInCycle && entry.day === day && entry.row === row) || null;
    }

    function cellSelectable(teacherKey, absWeek, day, row, isClass) {
      /* 跨调价轮次（涨/降同权）：生效日及之后周次不可用 */
      if (!isClass && state.priceChangeDemo && (((absWeek % 4) + 4) % 4) >= 2) {
        return { ok: false, reason: '12-07 起调为 18积分，不可跨调价轮次排班（涨/降同权）' };
      }
      /* 1v1 临时课与 4 周固定位严禁占用学员已绑定小班 [G] 已排期双格（含半格重叠） */
      if (!isClass && state.contextType === 'student') {
        const bound = studentBoundClassSlot(state.student, absWeek, day, row);
        if (bound) {
          return { ok: false, reason: `与学员已绑定小班 [G] ${bound.time} 冲突（单周标冲突待补）` };
        }
      }
      const c1 = getBaseCalCell(teacherKey, absWeek, day, row);
      if (c1.type === 'ORANGE_HOLD' && c1.isHold && !isClass) {
        return { ok: true };
      }
      if (c1.type !== 'GREEN') {
        return {
          ok: false,
          reason: c1.conflictReason || (c1.type === 'GRAY' ? '休息 / 不可约' : c1.type === 'ORANGE_HOLD' ? '续费预占中' : '已被占用')
        };
      }
      if (isClass) {
        if (row + 1 >= CAL_ROWS) return { ok: false, reason: '下格不可用' };
        const c2 = getBaseCalCell(teacherKey, absWeek, day, row + 1);
        if (c2.type !== 'GREEN') {
          return { ok: false, reason: c2.conflictReason || (c2.type === 'GRAY' ? '下格休息 / 不可约' : '下格已被占用') };
        }
      }
      return { ok: true };
    }

    function computeWeekPlan(week) {
      const teacher = currentCalTeacher();
      const isClass = state.contextType === 'class';
      const absWeek = state.cycleOffset * 4 + week;
      if (week === 0) {
        return { week: 0, status: 'template', slots: state.templateSlots.slice(), conflicts: [] };
      }
      if (state.weekAdjusted[week]) {
        return { week, status: 'adjusted', slots: state.weekSlots[week].slice(), conflicts: [] };
      }
      const slots = [];
      const conflicts = [];
      state.templateSlots.forEach((slot) => {
        const result = cellSelectable(teacher.key, absWeek, slot.day, slot.row, isClass);
        if (result.ok) slots.push({ day: slot.day, row: slot.row });
        else conflicts.push({ day: slot.day, row: slot.row, reason: result.reason });
      });
      return { week, status: conflicts.length ? 'conflict' : 'follow', slots, conflicts };
    }

    function currentWeekPlan() {
      if (state.calMode !== 'batch') {
        return { week: state.calWeek, status: 'single', slots: state.selectedSlots.slice(), conflicts: [] };
      }
      return computeWeekPlan(state.calWeek);
    }

    function planActualTotal() {
      if (state.calMode !== 'batch') return state.selectedSlots.length;
      return [0, 1, 2, 3].reduce((sum, week) => sum + computeWeekPlan(week).slots.length, 0);
    }

    function weekStatusMeta(week) {
      if (state.calMode !== 'batch') {
        return { label: '单周', tone: 'text-slate-500', dot: 'bg-slate-300' };
      }
      if (week === 0) return { label: '模板周', tone: 'text-indigo-700', dot: 'bg-indigo-500' };
      if (state.weekAdjusted[week]) return { label: '已调整', tone: 'text-amber-800', dot: 'bg-amber-500' };
      const plan = computeWeekPlan(week);
      if (plan.conflicts.length) return { label: '冲突待补', tone: 'text-rose-700', dot: 'bg-rose-500' };
      return { label: '跟随模板', tone: 'text-emerald-700', dot: 'bg-emerald-500' };
    }

    function maxSelectableSlots() {
      if (state.contextType === 'student') {
        const stu = contextStudent();
        if (state.calMode === 'temp') return stu.credits;
        return Math.floor(stu.credits / 4);
      }
      if (state.contextType === 'class') {
        const cls = contextClass();
        if (state.calMode === 'makeup') return cls.credits;
        return Math.floor(cls.credits / 4);
      }
      return 4;
    }

    function renderBatchWeekHint(isBatch, isClass) {
      if (!isBatch) return '';
      if (state.priceChangeDemo) {
        return `<div class="mt-1.5 rounded-xl border border-rose-200 bg-rose-50/70 px-2.5 py-1.5">
          <p class="text-[11px] font-medium leading-relaxed text-rose-800"><span class="font-bold">跨调价轮次熔断</span> · 12-07 起调为 18积分（涨价/降价同权），第 3/4 周已置灰阻断，仅可锁定第 1/2 周；未排节数留存学员待排池。</p>
        </div>`;
      }
      const plan = computeWeekPlan(state.calWeek);
      if (state.calWeek === 0) {
        return `<div class="mt-1.5 rounded-xl border border-indigo-200 bg-indigo-50/60 px-2.5 py-1.5">
          <p class="text-[11px] font-medium leading-relaxed text-indigo-900"><span class="font-bold">模板周</span> · 选格后自动复制到第 2~4 周（${isClass ? '小班连续双格' : '1v1 单格'}）；冲突周留空标「冲突待补」，不阻断整单。${isClass ? '<br><span class="font-bold">小班排课仅校验主讲老师双格空闲，不因已绑学员 1v1 阻断；重叠时双方班长/主理人收到 M4 冲突待协调提醒。</span>' : '<br><span class="font-bold">价位：</span>TS 原价位档位须与老师当日生效价位双向严格相等；跨调价轮次（涨/降同）生效日及之后周次置灰。'}</p>
        </div>`;
      }
      if (plan.status === 'adjusted') {
        return `<div class="mt-1.5 flex items-center justify-between gap-2 rounded-xl border border-amber-200 bg-amber-50/60 px-2.5 py-1.5">
          <p class="min-w-0 text-[11px] font-medium leading-relaxed text-amber-900"><span class="font-bold">已调整</span> · 本周手工选中 ${plan.slots.length} 格，仅作用于本周。</p>
          <button type="button" data-action="restore-week" data-week="${state.calWeek}" class="inline-flex h-6 shrink-0 items-center gap-0.5 rounded-md border border-amber-300 bg-white px-1.5 text-[10px] font-bold text-amber-900 hover:bg-amber-100">${icon('rotate-ccw', 'h-3 w-3')}恢复跟随第 1 周</button>
        </div>`;
      }
      if (plan.status === 'conflict') {
        const detail = plan.conflicts.map((c) => `${DAY_LABELS[c.day]} ${calRowTime(c.row)}`).join('、');
        return `<div class="mt-1.5 rounded-xl border border-rose-200 bg-rose-50/60 px-2.5 py-1.5">
          <p class="text-[11px] font-medium leading-relaxed text-rose-800"><span class="font-bold">冲突待补</span> · 本周 ${plan.conflicts.length} 节留待排池（${esc(detail)}），可在本周另选空闲格补足。</p>
        </div>`;
      }
      return `<div class="mt-1.5 rounded-xl border border-emerald-200 bg-emerald-50/60 px-2.5 py-1.5">
        <p class="text-[11px] font-medium leading-relaxed text-emerald-800"><span class="font-bold">跟随模板</span> · 本周自动选中 ${plan.slots.length} 格，模板周变动会同步更新。</p>
      </div>`;
    }

    function renderCalendarView() {
      const teacher = currentCalTeacher();
      const student = contextStudent();
      const cls = contextClass();
      const isClass = state.contextType === 'class';
      const absWeek = state.cycleOffset * 4 + state.calWeek;

        : [
            { key: 'temp', label: '仅排单周/临时课', disabled: false },

          ];

      const weekPlans = isBatch ? [0, 1, 2, 3].map((week) => computeWeekPlan(week)) : [];
      const weekCapsules = [0, 1, 2, 3].map((week) => {

          <span class="mt-1 flex items-center gap-0.5 text-[10px] font-semibold leading-none ${active ? 'text-white/85' : meta.tone}"><span class="h-1 w-1 rounded-full ${active ? 'bg-white/80' : meta.dot}"></span>${label}${count ? ` ${count}格` : ''}</span>

      return `<div id="content" class="min-h-0 flex-1 overflow-y-auto overscroll-contain bg-white">
        <div class="mx-auto w-full max-w-[720px] px-2.5 pb-4 pt-2">

            </div>
            <div class="flex items-center gap-1 text-[11px] font-medium text-slate-600">
              <span class="inline rounded-md border border-slate-200 bg-white px-1.5 py-0.5 font-bold text-slate-500" title="排课调度批：选格草稿中不锁日历、不扣 TS、不写流水；确认后单事务进入不可逆「已落盘」">草稿中</span>
              ${(state.holdMode === 'conflict' || state.holdMode === 'all-conflict') && !state.holdResolved ? `<button type="button" data-action="open-hold-conflict" class="inline-flex items-center gap-1 rounded-md border border-rose-200 bg-rose-50 px-2 py-0.5 font-bold text-rose-700 hover:bg-rose-100">${icon('alert-triangle', 'h-3 w-3')}续费冲突</button>` : ''}
              <button type="button" data-action="open-rules" class="rounded-md bg-slate-100 px-2 py-0.5 font-semibold text-slate-700 hover:bg-slate-200">规则</button>
            </div>
          </div>

          <!-- 4周一轮导航条（逐周状态胶囊） -->
          <div class="mt-1.5 rounded-xl border border-slate-200 bg-slate-50/70 px-1.5 py-1">
            <div class="mb-1 flex items-center justify-between gap-1">
              <button type="button" data-cal-cycle="-1" class="inline-flex h-6 items-center gap-0.5 rounded-md px-1.5 text-[11px] font-semibold text-slate-600 hover:bg-white">
                ${icon('chevron-left', 'h-3.5 w-3.5')}上一轮
              </button>
              <span class="truncate text-[10px] font-medium text-slate-500">本轮 11.09 - 12.06</span>
              <button type="button" data-cal-cycle="1" class="inline-flex h-6 items-center gap-0.5 rounded-md px-1.5 text-[11px] font-semibold text-slate-600 hover:bg-white">
                下一轮${icon('chevron-right', 'h-3.5 w-3.5')}
              </button>
            </div>
            <div class="grid grid-cols-4 gap-1">${weekCapsules}</div>
          </div>

          ${renderBatchWeekHint(isBatch, isClass)}

          ${state.classConflict ? `<div class="mt-1.5 rounded-xl border border-amber-300 bg-amber-50/80 px-2.5 py-2">
            <p class="text-[12px] font-bold text-amber-900">小班已落盘 · 与已绑学员 1v1 重叠（不阻断）</p>
            <p class="mt-0.5 text-[11px] font-medium leading-relaxed text-amber-800">${esc(state.classConflict.student)} ${esc(state.classConflict.time)} 的 1v1 与本次小班重叠：学员个人课表仅显示 1v1，小班仍独立计费履约。已向该 1v1 老师负责班长与本小班主理人各发送 1 条 M4 冲突待协调提醒卡（不直接骚扰家长）。</p>
          </div>` : ''}

          ${(state.holdMode === 'conflict' || state.holdMode === 'all-conflict') && !state.holdResolved ? `<div class="mt-1.5 box-border w-full rounded-xl border border-rose-200 border-l-4 border-l-rose-600 bg-rose-50/80 px-2.5 py-2">
            <div class="flex items-center justify-between gap-2">
              <p class="text-[12px] font-bold text-rose-800">${state.holdMode === 'all-conflict' ? '续费预占 4 周全冲突 (0/4)' : '续费预占冲突 · 已跳过冲突周'}</p>
              <button type="button" data-action="open-hold-conflict" class="shrink-0 rounded-lg bg-rose-600 px-2 py-1 text-[11px] font-bold text-white hover:bg-rose-700">查看方案</button>
            </div>
            <p class="mt-0.5 text-[11px] font-medium text-rose-700">${state.holdMode === 'all-conflict' ? '系统锁定 0 格 HOLD 并仍生成 0/4 续费单，全部节数确认收款后直接进入待排池；未传凭证逾期按周日 00:00 (UTC+8) 作废。' : '原周一 19:00 第3周老师休假冲突：系统跳过第3周，仅预占第1/2/4周 HOLD，余1节留存待排池并提醒班长补约。'}</p>
          </div>` : ''}

          <!-- 7色周度课表冻结网格 -->
          <div class="mt-1.5 overflow-x-auto rounded-xl border border-slate-300 bg-white">
            <div class="min-w-[360px]">
              <!-- 表头 -->
              <div class="sticky top-0 z-30 grid grid-cols-8 border-b border-slate-200 bg-slate-50 text-center">
                <div class="sticky left-0 z-40 border-r border-slate-200 bg-slate-100 py-1.5 text-[11px] font-bold text-slate-600">${weekDates[state.calWeek] || '当周'}</div>
                ${DAY_SHORT.map((d, idx) => `<div class="py-1.5 text-[11px] font-bold ${idx === 5 && state.calWeek === 0 && state.cycleOffset === 0 ? 'text-indigo-700' : 'text-slate-700'}">周${d}</div>`).join('')}
              </div>
              <!-- 时间网格 -->
              <div class="divide-y divide-slate-100">
                ${renderCalendarRows(teacher, absWeek, isClass)}
              </div>
            </div>
          </div>

          <div class="mt-2 flex flex-wrap items-center justify-center gap-x-2.5 gap-y-1 text-[11px] font-medium text-slate-600">
            <span class="flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-sm border border-emerald-300 bg-emerald-50"></span>空闲可约</span>
            <span class="flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-sm border border-amber-300 bg-amber-50"></span>固定位</span>
            <span class="flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-sm border border-dashed border-amber-400 bg-amber-50/70"></span>续费预占</span>
            <span class="flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-sm border border-yellow-300 bg-yellow-50"></span>临时课</span>
            <span class="flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-sm border-2 border-teal-400 bg-teal-50"></span>小班双格</span>
            <span class="flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-sm border border-rose-200 bg-rose-50"></span>请假/冲突</span>
          </div>
        </div>
      </div>`;
    }

    function renderCalContextBar(student, cls) {
      if (student) {
        return `<button type="button" data-action="open-context" class="flex w-full items-center justify-between gap-2 rounded-xl border border-slate-300 bg-slate-50/70 px-2.5 py-1.5 text-left">
          <span class="flex min-w-0 items-center gap-1.5">
            <span class="text-[14px]">${student.emoji}</span>
            <span class="truncate text-[13px] font-bold text-slate-900">${esc(student.name)}</span>
            <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[11px] font-bold text-slate-700">原价位 ${student.price}积分</span>
            <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[11px] font-bold text-slate-700">待排余 ${student.credits} 节</span>
          </span>
          <span class="shrink-0 text-[12px] font-semibold text-indigo-600">切换</span>
        </button>`;
      }
      if (cls) {
        const teacher = cls.teacher ? TEACHERS.find((t) => t.key === cls.teacher) : null;
        return `<button type="button" data-action="open-context" class="flex w-full items-center justify-between gap-2 rounded-xl border ${teacher ? 'border-slate-300 bg-slate-50/70' : 'border-amber-300 bg-amber-50/50'} px-2.5 py-1.5 text-left">
          <span class="flex min-w-0 items-center gap-1.5">
            <span class="rounded bg-teal-50 px-1.5 py-0.5 text-[11px] font-bold text-teal-800 ring-1 ring-inset ring-teal-200">${esc(cls.code)}</span>
            <span class="truncate text-[13px] font-bold text-slate-900">${esc(cls.name)}</span>
            <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[11px] font-bold text-slate-700">余 ${cls.credits} 节</span>
            ${teacher ? '' : '<span class="rounded bg-amber-100 px-1.5 py-0.5 text-[11px] font-bold text-amber-900">未委任老师</span>'}
          </span>
          <span class="shrink-0 text-[12px] font-semibold text-indigo-600">切换</span>
        </button>`;
      }
      return `<button type="button" data-action="open-context" class="flex w-full items-center justify-between gap-2 rounded-xl border border-dashed border-amber-300 bg-amber-50/50 px-2.5 py-1.5 text-left">
        <span class="truncate text-[12px] font-bold text-amber-900">未选学员 / 小班（仅查空档 · 点此补选）</span>
        <span class="shrink-0 text-[12px] font-bold text-indigo-600">补选</span>
      </button>`;
    }

    function renderCalendarRows(teacher, absWeek, isClass) {
      const student = contextStudent();
      const plan = currentWeekPlan();
      const selectedMap = new Map(plan.slots.map((slot) => [slotKey(slot.day, slot.row), slot]));
      const conflictMap = new Map(plan.conflicts.map((item) => [slotKey(item.day, item.row), item.reason]));
      const isTemplateWeek = state.calMode === 'batch' && state.calWeek === 0;
      const isFollowWeek = state.calMode === 'batch' && state.calWeek > 0 && !state.weekAdjusted[state.calWeek];
      const isAdjustedWeek = state.calMode === 'batch' && state.calWeek > 0 && state.weekAdjusted[state.calWeek];
      const selectedLabel = isTemplateWeek ? '模板' : isFollowWeek ? '跟随' : isAdjustedWeek ? '已调' : '已选';
      const rowsHtml = [];

      for (let row = 0; row < CAL_ROWS; row += 1) {
        const timeStr = calRowTime(row);
        const isHour = row % 2 === 0;
        const cellsHtml = [];
        for (let day = 0; day < 7; day += 1) {
          const cell = getBaseCalCell(teacher.key, absWeek, day, row);
          const key = slotKey(day, row);
          const isSelected = selectedMap.has(key);
          const isSecondOfSelectedGroup = isClass && plan.slots.some((s) => s.day === day && s.row + 1 === row);
          const conflictReason = conflictMap.get(key);
          const justLocked = state.justLockedKeys.includes(`${absWeek}-${day}-${row}`);
          const pulseCls = justLocked ? 'ring-2 ring-emerald-500 animate-pulse' : '';
          const conflictDot = conflictReason
            ? `<span class="absolute right-0.5 top-0.5 z-10 h-1.5 w-1.5 rounded-full bg-rose-500 ring-1 ring-white" title="模板时段本周冲突：${esc(conflictReason)}"></span>`
            : '';

          if (cell.isDoubleCont) {
            cellsHtml.push(`<div class="relative h-[28px] border-l border-slate-100 bg-teal-50/40">${conflictDot}</div>`);
            continue;
          }
          if (cell.isDoubleStart) {
            cellsHtml.push(`<div class="relative h-[28px] border-l border-slate-100 p-0.5">
              <div class="absolute inset-x-0.5 top-0.5 z-10 flex h-[54px] flex-col justify-between rounded-md border-2 border-teal-400 bg-teal-50 p-1 text-[11px] font-bold leading-tight text-teal-950 ${pulseCls}">
                <span class="truncate">[G] ${esc(cell.label)}</span>
                <span class="text-[10px] font-semibold text-teal-800">${cell.enrolled || 3}/${cell.capacity || 4}人</span>
              </div>${conflictDot}
            </div>`);
            continue;
          }

          if (isSecondOfSelectedGroup) {
            cellsHtml.push(`<div class="relative h-[28px] border-l border-slate-100 bg-indigo-50/40">${conflictDot}</div>`);
            continue;
          }

          // 临时课模式时间窗校验 (AC-3D-05)
          const tempBlocked = state.calMode === 'temp' && !isDayWithinTempWindow(day) && cell.type === 'GREEN';

          if (isSelected) {
            const boxH = isClass ? 'h-[54px] z-10' : 'h-[26px]';
            const label = isClass ? '双格' : selectedLabel;
            cellsHtml.push(`<div class="relative h-[28px] border-l border-slate-100 p-0.5">
              <button type="button" data-cal-cell="${day}-${row}" class="${isClass ? 'absolute inset-x-0.5 top-0.5' : 'w-full'} flex ${boxH} items-center justify-center rounded-md border-2 border-indigo-600 bg-indigo-600 text-[11px] font-bold text-white shadow-sm">
                ☑ ${label}
              </button>
            </div>`);
            continue;
          }

          if (cell.type === 'GREEN' && !tempBlocked) {
            const isPref = student && student.preferences && student.preferences.includes(key);
            const classBlocked = state.calMode === 'batch' && isClass && !cellSelectable(teacher.key, absWeek, day, row, true).ok;
            if (classBlocked) {
              cellsHtml.push(`<div class="relative h-[28px] border-l border-slate-100 p-0.5">
                <div class="flex h-[26px] w-full items-center justify-center rounded-md border border-slate-200 bg-slate-50 text-[11px] font-medium text-slate-500">双格缺</div>${conflictDot}
              </div>`);
            } else {
              const label = isClass ? '双格' : (state.calMode === 'batch' ? (isPref ? '★约' : '约') : '约');
              cellsHtml.push(`<div class="relative h-[28px] border-l border-slate-100 p-0.5">
                <button type="button" data-cal-cell="${day}-${row}" class="flex h-full w-full items-center justify-center rounded-md border border-emerald-200 bg-emerald-50/80 text-[11px] font-bold text-emerald-700 hover:bg-emerald-100 ${pulseCls}">
                  ${label}
                </button>${conflictDot}
              </div>`);
            }
          } else if (tempBlocked) {
            cellsHtml.push(`<div class="relative h-[28px] border-l border-slate-100 p-0.5">
              <button type="button" data-cal-blocked="temp" class="flex h-full w-full items-center justify-center rounded-md border border-slate-200 bg-slate-100 text-[11px] font-medium text-slate-500 opacity-60">限</button>${conflictDot}
            </div>`);
          } else if (cell.type === 'ORANGE_HOLD') {
            const holdClickable = state.calMode === 'batch' && !isClass;
            const holdVoucher = !!cell.voucherPending;
            cellsHtml.push(`<div class="relative h-[28px] border-l border-slate-100 p-0.5">
              <button type="button" ${holdClickable ? `data-cal-cell="${day}-${row}"` : 'disabled'} title="${holdVoucher ? '已传凭证待核：禁止静默释放或作废，须先赴 M2A 核款' : '未付款 HOLD：提交后释放原预占、同步作废续费单，并从已付款待排池实扣'}" class="flex h-full w-full items-center justify-center rounded-md border ${holdVoucher ? 'border-rose-300 bg-rose-50 text-rose-700' : 'border-dashed border-amber-400 bg-amber-50/70 text-amber-800'} text-[11px] font-bold ${holdClickable ? pulseCls : 'opacity-70'}">
                [预]${esc(cell.label.slice(0, 2))}
              </button>${conflictDot}
            </div>`);
          } else {
            const styleMap = {
              ORANGE: 'border-amber-300 bg-amber-50 text-amber-900',
              YELLOW: 'border-yellow-300 bg-yellow-50 text-yellow-900',
              BLUE: 'border-blue-300 bg-blue-50 text-blue-900',
              PURPLE: 'border-purple-300 bg-purple-50 text-purple-900',
              RED: 'border-rose-200 bg-rose-50 text-rose-700',
              GRAY: 'border-slate-200 bg-slate-100 text-slate-600'
            };
            const clsStr = styleMap[cell.type] || styleMap.GRAY;
            cellsHtml.push(`<div class="relative h-[28px] border-l border-slate-100 p-0.5">
              <div class="flex h-full w-full items-center justify-center truncate rounded-md border ${clsStr} text-[11px] font-semibold ${pulseCls}">${esc(cell.label)}</div>${conflictDot}
            </div>`);
          }
        }
        rowsHtml.push(`<div class="grid grid-cols-8 items-center">
          <div class="sticky left-0 z-20 flex h-[28px] items-center justify-center border-r border-slate-200 bg-slate-50 font-mono text-[11px] ${isHour ? 'font-bold text-slate-700' : 'text-slate-500'}">${isHour ? timeStr : ''}</div>
          ${cellsHtml.join('')}
        </div>`);
      }
      return rowsHtml.join('');
    }

    function renderCalendarFooter() {
      const student = contextStudent();
      const cls = contextClass();
      const isClass = state.contextType === 'class';
      const isBatch = state.calMode === 'batch';
      const weekPlans = isBatch ? [0, 1, 2, 3].map((week) => computeWeekPlan(week)) : [];
      const actualTotal = isBatch
        ? weekPlans.reduce((sum, plan) => sum + plan.slots.length, 0)
        : state.selectedSlots.length;

      // 未付款 HOLD 绝不免扣转正：无论是否同格重叠，一律释放原预占并从已付款待排池实扣
      const billable = actualTotal;
      const holdActive = isBatch && !isClass && (state.holdMode === 'normal' || state.holdMode === 'voucher') && !state.releasedHold;
      const holdVoucherPending = holdActive && state.holdMode === 'voucher';
      const credits = availableCredits();
      const potential = isBatch ? state.templateSlots.length * 4 : 0;
      const remaining = isBatch ? Math.max(0, potential - actualTotal) : 0;

      // 判断阻断原因
      let blockedReason = '';
      let isWarning = false;
      if (!state.online) {
        blockedReason = '离线模式不可提交排课';
      } else if (state.contextType === 'none') {
        blockedReason = '请先选择学员或小班';
      } else if (isClass && !cls.teacher) {
        blockedReason = '请先在小班管理中委任授课老师后再排课';
        isWarning = true;
      } else if (isBatch && state.templateSlots.length === 0) {
        blockedReason = '请在第 1 周模板周点选时段';
      } else if (isBatch && actualTotal === 0) {
        blockedReason = '没有可落单的已选时段';
      } else if (isBatch && holdVoucherPending) {
        blockedReason = '关联自动续费单已传付款凭证待核，请先赴 M2A 核实确认收款或驳回作废后再重排';
        isWarning = true;
      } else if (isBatch && state.contextType === 'student' && currentCalTeacher().price !== contextStudent().price) {
        blockedReason = '原价位档位与老师生效价位不一致，禁止跨价位混扣（涨跌双向严格相等）';
        isWarning = true;
      } else if (isBatch && state.renewalEdit && actualTotal > state.renewalOrderSize) {
        blockedReason = `已选 ${actualTotal} 节超过订单购买 ${state.renewalOrderSize} 节，请返回 M2A 上调购买节数或取消多余格`;
        isWarning = true;
      } else if (isBatch && billable > credits) {
        blockedReason = `该价位待排课次不足（需 ${billable} 节，仅剩 ${credits} 节）`;
        isWarning = true;
      } else if (state.calMode === 'makeup' && state.selectedSlots.length === 0) {
        blockedReason = isClass ? '请在课表中点选连续双格' : '请在课表中点选空闲绿格';
      } else if (state.calMode === 'temp') {
        blockedReason = '点选空闲绿格选择连约节数后即时预约';
      }

      let holdHint = '';
      if (holdActive) {
        holdHint = holdVoucherPending
          ? '关联自动续费单已传付款凭证待核：严禁静默释放或作废，请先赴 M2A 完成确认收款或核验驳回'
          : '提交后将同步释放原未付款预占位，并自动作废未传凭证在途续费单；全部新选格从已付款待排池按实扣减（未付款 HOLD 绝不免扣转正）';
      }

      const weekCards = isBatch ? weekPlans.map((plan, week) => {
        const meta = weekStatusMeta(week);
        return `<div data-week-card="${week}" class="flex items-center justify-between gap-1 rounded-lg border border-slate-200 bg-slate-50 px-1.5 py-1">
          <span class="flex min-w-0 items-center gap-1 text-[10px] font-bold text-slate-700"><span class="h-1.5 w-1.5 shrink-0 rounded-full ${meta.dot}"></span>第${week + 1}周</span>
          <span class="shrink-0 text-[10px] font-semibold ${meta.tone}">${meta.label} · ${plan.slots.length}格${plan.conflicts.length ? ` · ${plan.conflicts.length}待补` : ''}</span>
        </div>`;
      }).join('') : '';

      const chips = !isBatch && state.selectedSlots.length
        ? state.selectedSlots.map((s) => `<button type="button" data-remove-slot="${s.day}-${s.row}" class="inline-flex items-center gap-1 rounded-full bg-indigo-50 px-2 py-0.5 text-[11px] font-bold text-indigo-700 ring-1 ring-inset ring-indigo-200 hover:bg-indigo-100">
          ${DAY_LABELS[s.day]} ${calRowTime(s.row)}${isClass ? '~' + calRowTime(s.row + 2) : ''} ×
        </button>`).join('')
        : '';

      const totalCost = state.calMode === 'makeup' ? state.selectedSlots.length : billable;
      const canSubmit = !blockedReason && (isBatch ? actualTotal > 0 : state.selectedSlots.length > 0);
      const renewalPending = isBatch && state.renewalEdit;
      const btnLabel = canSubmit
        ? (renewalPending
            ? '确认排期并返回 (草稿回传 M2A)'
            : state.calMode === 'makeup'
              ? `确认单节补排 (扣 ${totalCost} 节)`
              : isBatch
                ? `确认批量锁定可用周 (共扣 ${totalCost} 节)`
                : '临时课即时预约')
        : blockedReason;

      /* 吸底加粗核对摘要：老师英文名 + 排课类型 + 对象规范英文名/小班名 + 各周落盘明细 */
      const typeLabel = isClass
        ? (state.calMode === 'makeup' ? '小班单节补排' : '小班整班')
        : (state.calMode === 'batch' ? '1v1 固定位' : '1v1 临时课');
      const objectLabel = student ? student.name : cls ? cls.name : '未选对象';
      const weekDetail = isBatch
        ? weekPlans.map((plan, week) => {
            const times = plan.slots.map((s) => `${DAY_LABELS[s.day]} ${calRowTime(s.row)}`).join('、');
            return `第${week + 1}周 ${times || weekStatusMeta(week).label}`;
          }).join(' / ')
        : (state.selectedSlots[0]
            ? `${DAY_LABELS[state.selectedSlots[0].day]} ${calRowTime(state.selectedSlots[0].row)}${isClass ? ' 连续双格' : ''}`
            : '');

      const summaryText = isBatch
        ? `实扣 ${totalCost} 节 · ${remaining > 0 ? `${remaining} 节留存待排池` : '无剩余'}`
        : '';
      const makeupCost = state.calMode === 'makeup' && state.selectedSlots.length > 0
        ? `单节补排 ${state.selectedSlots.length} 节 · 剩余 ${cls.credits} ➔ ${Math.max(0, cls.credits - state.selectedSlots.length)} 节`
        : '';

      return `<footer class="shrink-0 border-t border-slate-200 bg-white px-3 py-2.5 shadow-lg">
        ${isBatch ? `<div class="mb-1.5 grid grid-cols-2 gap-1">${weekCards}</div>` : ''}
        ${chips ? `<div class="mb-1.5 flex flex-wrap items-center gap-1">${chips}</div>` : ''}
        ${renewalPending ? `<p class="mb-1 text-[11px] font-bold text-indigo-800">已选 ${actualTotal} 节 / 订单共 ${state.renewalOrderSize} 节 · 剩余 ${Math.max(0, state.renewalOrderSize - actualTotal)} 节待排</p>` : ''}
        ${isBatch ? `<p class="mb-1 text-[11px] font-semibold text-slate-700">${summaryText}</p>` : ''}
        ${makeupCost ? `<p class="mb-1.5 text-[11px] font-semibold text-slate-600">${makeupCost}</p>` : ''}
        ${isBatch && actualTotal ? `<div class="mb-1.5 rounded-lg border border-indigo-200 bg-indigo-50/70 px-2 py-1">
          <p class="text-[11px] font-bold text-indigo-900">📌 核对：${esc(currentCalTeacher().name)} · ${typeLabel} · ${esc(objectLabel)}</p>
          <p class="mt-0.5 text-[11px] font-medium leading-relaxed text-indigo-800">${esc(weekDetail)}</p>
        </div>` : ''}
        ${holdHint ? `<p class="mb-1 rounded-lg border ${holdVoucherPending ? 'border-rose-200 bg-rose-50 text-rose-700' : 'border-amber-200 bg-amber-50 text-amber-800'} px-2 py-1 text-[11px] font-semibold">${holdHint}</p>` : ''}
        ${isWarning ? `<p class="mb-1.5 rounded-lg border border-rose-200 bg-rose-50 px-2 py-1 text-[11px] font-bold text-rose-700">${blockedReason}</p>` : ''}
        <button type="button" data-action="confirm-cal-schedule" ${canSubmit ? '' : 'disabled'} class="h-11 w-full rounded-xl text-[14px] font-bold transition ${canSubmit ? 'bg-indigo-600 text-white hover:bg-indigo-700 active:scale-[0.99]' : 'cursor-not-allowed bg-slate-200 text-slate-500'}">
          ${esc(btnLabel)}
        </button>
      </footer>`;
    }

    function renderHoldConflictOverlay() {
      const allConflict = state.holdMode === 'all-conflict';
      if (allConflict) {
        return `<div class="space-y-2 pt-2">
          <div class="box-border w-full rounded-xl border border-rose-200 border-l-4 border-l-rose-600 bg-rose-50/80 p-2.5">
            <p class="text-[12px] font-bold text-rose-800">续费预占 · 4 周全冲突（0/4）</p>
            <p class="mt-1 text-[12px] font-medium leading-relaxed text-rose-700">本轮未来 4 周偶发全部占满/老师请假，系统锁定 <span class="font-bold">0 格</span> HOLD，仍按完整周期生成 <span class="font-bold">0/4</span> 待付款续费单，全部 N 节确认收款后直接进入待排池。</p>
          </div>
          <div class="rounded-xl border border-slate-300 bg-slate-50/70 p-2.5 text-[12px] text-slate-700 space-y-1">
            <p><span class="font-bold text-slate-900">1. 0 格预占：</span>不锁任何课格，也不会静默跳过整单。</p>
            <p><span class="font-bold text-slate-900">2. 时限锚点：</span>0/4 单据按新轮次首日周一 00:00 倒推：周六 00:00 (UTC+8) 催办、周日 00:00 (UTC+8) 自动作废。</p>
            <p><span class="font-bold text-slate-900">3. 通知：</span>向资金托管班长 / 小班主理人 / 平台直管管理员发送 M4 浅黄提醒卡与补约提醒邮件。</p>
          </div>
          <button type="button" data-action="accept-candidate-hold" class="h-11 w-full rounded-xl bg-indigo-600 text-[14px] font-bold text-white hover:bg-indigo-700">确认收款 · 0 格预占全部入待排池</button>
          <button type="button" data-action="release-candidate-hold" class="h-10 w-full rounded-xl border border-slate-300 bg-white text-[13px] font-semibold text-slate-700 hover:bg-slate-50">稍后处理 · 查看待排池</button>
        </div>`;
      }
      return `<div class="space-y-2 pt-2">
        <div class="box-border w-full rounded-xl border border-rose-200 border-l-4 border-l-rose-600 bg-rose-50/80 p-2.5">
          <p class="text-[12px] font-bold text-rose-800">续费预占冲突 · 跳过第 3 周冲突</p>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-rose-700">原固定位 [周一 19:00] 第 3 周老师休假冲突。系统已跳过冲突周，仅对第 1/2/4 周锁定续费预占（HOLD），余 1 节留存待排池。</p>
        </div>
        <div class="rounded-xl border border-slate-300 bg-slate-50/70 p-2.5 text-[12px] text-slate-700 space-y-1">
          <p><span class="font-bold text-slate-900">1. 跳过冲突周：</span>仅对可用周（第 1/2/4 周）预占 HOLD，第 3 周不锁位、不阻断。</p>
          <p><span class="font-bold text-slate-900">2. 余节留存：</span>续费单仍按原 4 节生成并标注「跳过第 3 周，余 1 节待补约」；确认收款后尚在未来的 HOLD 周转正，余 1 节进入待排池。</p>
          <p><span class="font-bold text-slate-900">3. 通知班长：</span>已发送浅黄提醒卡与补约提醒邮件，请与家长沟通确认收款后人工补约余下 1 节。</p>
          <p><span class="font-bold text-slate-900">4. 逾期清退：</span>未传凭证 1v1 续费单按 min(最早预占开课前 24h, 新轮首日周一 01:00 UTC+8) 作废释放；已传凭证待核豁免；小班 G-HOLD 保持开课前 24h。</p>
        </div>
        <button type="button" data-action="accept-candidate-hold" class="h-11 w-full rounded-xl bg-indigo-600 text-[14px] font-bold text-white hover:bg-indigo-700">确认收款 · 锁定可用周 HOLD (3 周)</button>
        <button type="button" data-action="release-candidate-hold" class="h-10 w-full rounded-xl border border-slate-300 bg-white text-[13px] font-semibold text-slate-700 hover:bg-slate-50">稍后处理 · 查看待排池</button>
      </div>`;
    }

    function renderTempDurationOverlay() {
      const slot = state.tempBookingSlot;
      if (!slot) return '';
      const teacher = currentCalTeacher();
      const absWeek = state.cycleOffset * 4 + state.calWeek;
      const student = contextStudent();
      const availCredits = student ? student.credits : 0;
      const options = [1, 2, 3, 4].map((count) => {
        let consecutiveOk = true;
        let boundConflict = false;
        for (let i = 0; i < count; i += 1) {
          if (slot.row + i >= CAL_ROWS) { consecutiveOk = false; break; }
          if (student && studentBoundClassSlot(state.student, absWeek, slot.day, slot.row + i)) {
            boundConflict = true;
            consecutiveOk = false;
            break;
          }
          const c = getBaseCalCell(teacher.key, absWeek, slot.day, slot.row + i);
          if (c.type !== 'GREEN') { consecutiveOk = false; break; }
        }
        const enough = availCredits >= count;
        const ok = consecutiveOk && enough && state.contextType === 'student';
        const reason = state.contextType !== 'student'
          ? '请先选择学员'
          : boundConflict
            ? '与已绑定小班 [G] 时段冲突'
            : !consecutiveOk
              ? '后续时段已被占用'
              : !enough
                ? '待排课次不足'
                : `${count * 30} 分钟 · 扣 ${count} 节`;
        return `<button type="button" data-confirm-temp="${count}" ${ok ? '' : 'disabled'} class="flex w-full items-center justify-between rounded-xl border px-3 py-2.5 text-left transition ${ok ? 'border-slate-300 bg-slate-50/70 hover:border-indigo-300 hover:bg-indigo-50/60' : 'cursor-not-allowed border-slate-200 bg-slate-100 opacity-60'}">
          <span class="text-[14px] font-bold text-slate-900">${count === 1 ? '单约 1 节' : `连约 ${count} 节`} (${calRowTime(slot.row)}~${calRowTime(slot.row + count)})</span>
          <span class="text-[12px] font-semibold ${ok ? 'text-indigo-700' : 'text-slate-500'}">${reason}</span>
        </button>`;
      }).join('');
      const crossPrice = student && teacher.price !== student.price;
      return `<p class="mt-1 text-[12px] font-medium text-slate-600">${DAY_LABELS[slot.day]} ${calRowTime(slot.row)} · 1v1 临时课抢约（提前 1-7 天，最早明日 00:00 UTC+8）</p>
        ${crossPrice ? `<p class="mt-1.5 rounded-lg border border-amber-200 bg-amber-50 px-2 py-1 text-[11px] font-semibold leading-relaxed text-amber-800">跨价位代约软预检（非阻断）：TS 原价位 ${student.price}积分 ≠ 老师生效 ${teacher.price}积分；仍按原单实付积分快照上交，不补退差价</p>` : ''}
        <div class="mt-2 space-y-2">${options}</div>`;
    }

    function renderOverlay() {
      if (state.overlay === 'context') return overlayShell('选择学员 / 小班', renderContextSheetContent());
      if (state.overlay === 'rules') return overlayShell('排课规则', renderRulesContent());
      if (state.overlay === 'hold-conflict') return overlayShell('续费预占冲突调解', renderHoldConflictOverlay());
      if (state.overlay === 'temp-duration') return overlayShell('选择临时课连约节数', renderTempDurationOverlay());
      return '';
    }

    function filterContextStudents() {
      const query = String(state.contextSearch || '').trim().toLowerCase();
      const students = Object.values(STUDENTS);
      if (!query) return students;
      /* 全列表仅按规范英文名检索，严禁暴露或搜索学员小名 */
      return students.filter((student) => student.name.toLowerCase().includes(query));
    }

    function renderContextSheetContent() {
      const searchedStudents = filterContextStudents();
      /* 仅当当前可选学员 > 10 人时展示首字母索引（≤10 隐藏） */
      const showLetterIndex = searchedStudents.length > 10;
      const letters = [...new Set(searchedStudents.map((student) => student.name.charAt(0).toUpperCase()))]
        .filter((letter) => /^[A-Z]$/.test(letter))
        .sort();
      const effectiveLetter = showLetterIndex && letters.includes(state.contextLetter) ? state.contextLetter : 'all';
      const sortAZ = String(state.contextSearch || '').trim() !== '' || effectiveLetter !== 'all';
      let visibleStudents = effectiveLetter === 'all'
        ? searchedStudents.slice()
        : searchedStudents.filter((student) => student.name.charAt(0).toUpperCase() === effectiveLetter);
      if (sortAZ) visibleStudents.sort((a, b) => a.name.localeCompare(b.name));

      const studentButtons = visibleStudents.map((student) => {
        const active = state.contextType === 'student' && state.student === student.key;
        return `<button type="button" data-pick-context="student" data-key="${student.key}" class="flex min-h-[44px] w-full items-center gap-2 rounded-xl border p-2.5 text-left transition active:scale-[0.99] ${active ? 'border-indigo-300 bg-indigo-50/60' : 'border-slate-300 bg-slate-50/70 hover:bg-slate-100'}">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl border border-indigo-100 bg-white text-[16px]">${student.emoji}</span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-[14px] font-bold text-slate-900">${esc(student.name)}</span>
            <span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">原价位档位 ${esc(tierSummary(student))}</span>
          </span>
          ${active ? `<span class="shrink-0 text-[12px] font-bold text-indigo-600">已选</span>` : ''}
        </button>`;
      }).join('');

      const studentList = visibleStudents.length
        ? studentButtons
        : `<p class="rounded-xl border border-dashed border-slate-300 bg-slate-50/70 px-3 py-4 text-center text-[12px] font-medium text-slate-500">没有匹配的学员</p>`;

      const letterChips = [`<button type="button" data-context-letter="all" class="h-7 rounded-full px-2.5 text-[12px] font-semibold transition ${effectiveLetter === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">全部</button>`]

      state.overlay = null;
      state.shown = 5;

      resetContextSheetFilters();
      if (type === 'student' && STUDENTS[key]) {
        state.contextType = 'student';

      } else if (type === 'class' && CLASSES[key]) {
        state.contextType = 'class';
        state.classKey = key;

      if (group === 'price' && ['all', '16', '18', '21'].includes(value)) state.price = value;
      if (group === 'period' && PERIODS[value]) {
        state.period = value;

      state.shown = 5;

    function handleCalCellClick(day, row) {
      const teacher = currentCalTeacher();
      const isClass = state.contextType === 'class';
      const absWeek = state.cycleOffset * 4 + state.calWeek;

      if (state.contextType === 'none') {
        flashToast('请先选择学员或小班');
        return;
      }
      if (isClass && contextClass() && !contextClass().teacher) {
        flashToast('请先在小班管理中委任授课老师后再排课');
        return;
      }

      if (state.calMode === 'temp') {
        if (isClass) {
          flashToast('小班课不支持临时抢约模式');
          return;
        }
        state.tempBookingSlot = { day, row };
        state.overlay = 'temp-duration';
        render(true);
        return;
      }

      if (state.calMode === 'makeup') {
        const idx = state.selectedSlots.findIndex((s) => s.day === day && s.row === row);
        if (idx >= 0) {
          state.selectedSlots.splice(idx, 1);
          render(true);
          return;
        }
        if (row + 1 >= CAL_ROWS || getBaseCalCell(teacher.key, absWeek, day, row + 1).type !== 'GREEN') {
          flashToast('小班需连续双格 (56px)，下格已被占用');
          return;
        }
        const max = maxSelectableSlots();
        if (state.selectedSlots.length >= max) {
          flashToast(`小班待补排课次上限为 ${max} 节`);
          return;
        }
        state.selectedSlots.push({ day, row });
        render(true);
        return;
      }

      // 连续 4 周批量：第 1 周为模板周，选格后自动穿透第 2~4 周
      if (state.calWeek === 0) {
        const idx = state.templateSlots.findIndex((s) => s.day === day && s.row === row);
        if (idx >= 0) {
          state.templateSlots.splice(idx, 1);
          render(true);
          return;
        }
        const selectable = cellSelectable(teacher.key, absWeek, day, row, isClass);
        if (!selectable.ok) {
          flashToast(`该时段不可选：${selectable.reason}`);
          return;
        }
        const need = (state.templateSlots.length + 1) * 4;
        if (need > availableCredits()) {
          flashToast(`该价位待排课次不足（需 ${need} 节，仅剩 ${availableCredits()} 节）`);
          return;
        }
        state.templateSlots.push({ day, row });
        render(true);
        return;
      }

      // 第 2~4 周：逐周手工调整，只影响当前周
      if (!state.weekAdjusted[state.calWeek]) {
        const followPlan = computeWeekPlan(state.calWeek);
        state.weekSlots[state.calWeek] = followPlan.slots.map((s) => ({ day: s.day, row: s.row }));
        state.weekAdjusted[state.calWeek] = true;
      }
      const list = state.weekSlots[state.calWeek];
      const idx = list.findIndex((s) => s.day === day && s.row === row);
      if (idx >= 0) {
        list.splice(idx, 1);
        render(true);
        return;
      }
      const selectable = cellSelectable(teacher.key, absWeek, day, row, isClass);
      if (!selectable.ok) {
        flashToast(`该时段不可选：${selectable.reason}`);
        return;
      }
      const need = planActualTotal() + 1;
      if (need > availableCredits()) {
        flashToast(`该价位待排课次不足（需 ${need} 节，仅剩 ${availableCredits()} 节）`);
        return;
      }
      list.push({ day, row });
      render(true);
    }

    /* 已绑正式学员的个人 1v1 课次（小班落盘不阻断，但需 M4 冲突待协调告警） */
    const CLASS_BOUND_ONEONONE = {
      ket1: [{ student: 'AliceZ12', day: 6, row: 5, time: '周日 10:30' }],
      ket1_makeup: [{ student: 'AliceZ12', day: 6, row: 5, time: '周日 10:30' }],
      mov2: []
    };

    function firstClassStudentOverlap(plans) {
      const list = CLASS_BOUND_ONEONONE[state.classKey] || [];
      const hit = list.find((entry) => plans.some((slot) => slot.day === entry.day
        && (slot.row === entry.row || slot.row + 1 === entry.row)));
      return hit || null;
    }

    function confirmCalSchedule() {
      const student = contextStudent();
      const cls = contextClass();
      const isClass = state.contextType === 'class';
      const baseWeek = state.cycleOffset * 4;
      const pulseKeys = [];

      if (state.calMode === 'makeup') {
        const absWeek = baseWeek + state.calWeek;
        state.selectedSlots.forEach((s) => {
          state.lockedOverrides[`${absWeek}-${s.day}-${s.row}`] = {
            type: 'TEAL', label: cls.code, isDoubleStart: true, enrolled: cls.enrolled, capacity: cls.capacity
          };
          state.lockedOverrides[`${absWeek}-${s.day}-${s.row + 1}`] = {
            type: 'TEAL', label: cls.code, isDoubleCont: true
          };
          pulseKeys.push(`${absWeek}-${s.day}-${s.row}`);
        });
        cls.credits = Math.max(0, cls.credits - state.selectedSlots.length);
        const count = state.selectedSlots.length;
        const overlap = firstClassStudentOverlap(state.selectedSlots);
        state.selectedSlots = [];
        triggerPulse(pulseKeys);
        if (overlap) {
          state.classConflict = overlap;
          flashToast(`单节补排成功 · 已锁定 ${count} 个连续双格；检测到与 ${overlap.student} ${overlap.time} 的 1v1 重叠，已发 M4 冲突待协调提醒`);
        } else {
          flashToast(`单节补排成功 · 锁定 ${count} 个连续双格，已核销待补排待办`);
        }
        return;
      }

      // 连续 4 周批量：单事务锁定各周实际选中格（冲突周留空，不阻断整单）
      const weekPlans = [0, 1, 2, 3].map((week) => computeWeekPlan(week));
      const actualTotal = weekPlans.reduce((sum, plan) => sum + plan.slots.length, 0);
      if (actualTotal === 0) return;

      // 已传凭证待核：严禁静默释放/作废原续费单
      if (!isClass && state.holdMode === 'voucher' && !state.releasedHold) {
        flashToast('关联自动续费单已传付款凭证待核，请先赴 M2A 核实确认收款或驳回作废后再重排');
        return;
      }
      // 双向严格单价位匹配（涨跌同权），禁止跨价位混扣
      if (!isClass && student && currentCalTeacher().price !== student.price) {
        flashToast(`原价位档位 ${student.price}积分 与老师生效价位 ${currentCalTeacher().price}积分 不一致，禁止跨价位混扣`);
        return;
      }
      // 续费预排调课模式：仅校验 X <= N 后回传草稿，M3D 不落盘、不动原 HOLD
      if (state.renewalEdit) {
        if (actualTotal > state.renewalOrderSize) {
          flashToast(`已选 ${actualTotal} 节超过订单购买 ${state.renewalOrderSize} 节，请回 M2A 上调节数或取消多余格`);
          return;
        }
        flashToast(`草稿已回传 M2A：已选 ${actualTotal} 节 / 订单 ${state.renewalOrderSize} 节，剩余 ${Math.max(0, state.renewalOrderSize - actualTotal)} 节待排；原预占未变更，需在 M2A 点保存并更正账单后生效`);
        return;
      }

      // 未付款 HOLD 绝不免扣转正，一律从已付款待排池实扣
      const billable = actualTotal;
      if (billable > availableCredits()) {
        flashToast(`该价位待排课次不足（需 ${billable} 节，仅剩 ${availableCredits()} 节）`);
        return;
      }
      const classOverlap = isClass ? firstClassStudentOverlap(weekPlans.flatMap((plan) => plan.slots)) : null;

      weekPlans.forEach((plan) => {
        const absWeek = baseWeek + plan.week;
        plan.slots.forEach((s) => {
          if (isClass) {
            state.lockedOverrides[`${absWeek}-${s.day}-${s.row}`] = {
              type: 'TEAL', label: cls.code, isDoubleStart: true, enrolled: cls.enrolled, capacity: cls.capacity
            };
            state.lockedOverrides[`${absWeek}-${s.day}-${s.row + 1}`] = {
              type: 'TEAL', label: cls.code, isDoubleCont: true
            };
          } else {
            state.lockedOverrides[`${absWeek}-${s.day}-${s.row}`] = {
              type: 'ORANGE', label: student.short
            };
          }
          pulseKeys.push(`${absWeek}-${s.day}-${s.row}`);
        });
      });

      let releasedUnpaidHold = false;
      if (!isClass && state.holdMode === 'normal' && !state.releasedHold) {
        releasedUnpaidHold = true;
        state.holdMode = 'none';
        state.releasedHold = true;
      }
      state.classConflict = classOverlap;

      if (isClass) {
        cls.credits = Math.max(0, cls.credits - billable);
      } else {
        student.credits = Math.max(0, student.credits - billable);
      }

      const weekCount = weekPlans.filter((plan) => plan.slots.length > 0).length;
      const remaining = Math.max(0, state.templateSlots.length * 4 - actualTotal);
      state.templateSlots = [];
      state.weekAdjusted = { 1: false, 2: false, 3: false };
      state.weekSlots = { 1: [], 2: [], 3: [] };
      state.selectedSlots = [];
      state.calWeek = 0;
      triggerPulse(pulseKeys);
      const noticeParts = [`已锁定 ${weekCount} 周 · ${actualTotal} 格 · 实扣 ${billable} 节`];
      if (releasedUnpaidHold) noticeParts.push('原未付款续费单已同步作废，家长与原资金持有人已收 M4 浅黄提醒（无需重复付款）');
      if (remaining) noticeParts.push(`${remaining} 节留存待排池`);
      if (classOverlap) noticeParts.push(`小班与 ${classOverlap.student} 的 1v1 重叠，已发 M4 冲突待协调提醒`);
      flashToast(noticeParts.join(' · '));
    }

    document.addEventListener('input', (event) => {
      const searchInput = event.target.closest('[data-context-search]');
      if (!searchInput) return;
      state.contextSearch = searchInput.value;
      state.contextLetter = 'all';
      render(true);
      const nextInput = document.querySelector('[data-context-search]');
      if (nextInput) {
        nextInput.focus();
        const caret = nextInput.value.length;
        nextInput.setSelectionRange(caret, caret);
      }
    });

    document.addEventListener('click', (event) => {
      const consoleCollapseBtn = event.target.closest('[data-console-collapse]');
      if (consoleCollapseBtn) {
        setConsoleCollapsed(true);
        return;
      }

      const consoleExpandBtn = event.target.closest('[data-console-expand]');
      if (consoleExpandBtn) {
        setConsoleCollapsed(false);
        return;
      }

      const control = event.target.closest('[data-control]');
      if (control) {
        setControl(control.dataset.control, control.dataset.value);
        return;
      }

      const scenarioButton = event.target.closest('[data-scenario]');
      if (scenarioButton) {
        applyScenario(scenarioButton.dataset.scenario);
        render(false);
        return;
      }

      const weekButton = event.target.closest('[data-week-select]');
      if (weekButton) {
        setWeek(Number(weekButton.dataset.weekSelect));
        return;
      }

      const filterButton = event.target.closest('[data-filter]');
      if (filterButton) {
        setFilter(filterButton.dataset.filter, filterButton.dataset.value);
        return;
      }

      const letterToggle = event.target.closest('[data-context-letter-toggle]');
      if (letterToggle) {
        state.contextLetterOpen = !state.contextLetterOpen;
        render(true);
        return;
      }

      const letterChip = event.target.closest('[data-context-letter]');
      if (letterChip) {
        const letter = letterChip.dataset.contextLetter;
        state.contextLetter = letter === 'all' || state.contextLetter === letter ? 'all' : letter;
        render(true);
        return;
      }

      const pickButton = event.target.closest('[data-pick-context]');
      if (pickButton) {
        pickContext(pickButton.dataset.pickContext, pickButton.dataset.key);
        return;
      }

      const dayButton = event.target.closest('[data-highlight-day]');
      if (dayButton) {
        const day = Number(dayButton.dataset.highlightDay);
        state.highlightDay = state.highlightDay === day ? null : day;
        render(true);
        return;
      }

      const hourButton = event.target.closest('[data-highlight-hour]');
      if (hourButton) {
        const hour = Number(hourButton.dataset.highlightHour);
        state.highlightHour = state.highlightHour === hour ? null : hour;
        render(true);
        return;
      }

      if (event.target.closest('[data-clear-highlight]')) {
        state.highlightDay = null;
        state.highlightHour = null;
        render(true);
        return;
      }

      const calModeBtn = event.target.closest('[data-cal-mode]');
      if (calModeBtn) {
        const mode = calModeBtn.dataset.calMode;
        if (['batch', 'temp', 'makeup'].includes(mode) && state.calMode !== mode) {
          state.calMode = mode;
          resetWeekPlan();
          render(true);
        }
        return;
      }

      const calWeekBtn = event.target.closest('[data-cal-week]');
      if (calWeekBtn) {
        state.calWeek = Number(calWeekBtn.dataset.calWeek);
        render(true);
        return;
      }

      const calCycleBtn = event.target.closest('[data-cal-cycle]');
      if (calCycleBtn) {
        state.cycleOffset = Math.max(0, state.cycleOffset + Number(calCycleBtn.dataset.calCycle));
        render(true);
        return;
      }

      const calCellBtn = event.target.closest('[data-cal-cell]');
      if (calCellBtn) {
        const [d, r] = calCellBtn.dataset.calCell.split('-').map(Number);
        handleCalCellClick(d, r);
        return;
      }

      if (event.target.closest('[data-cal-blocked="temp"]')) {
        flashToast('仅支持提前 1-7 天预约临时课，当天及超期不可约');
        return;
      }

      const removeSlotBtn = event.target.closest('[data-remove-slot]');
      if (removeSlotBtn) {
        const [d, r] = removeSlotBtn.dataset.removeSlot.split('-').map(Number);
        state.selectedSlots = state.selectedSlots.filter((s) => !(s.day === d && s.row === r));
        render(true);
        return;
      }

      const confirmTempBtn = event.target.closest('[data-confirm-temp]');
      if (confirmTempBtn) {
        const count = Number(confirmTempBtn.dataset.confirmTemp);
        const slot = state.tempBookingSlot;
        const student = contextStudent();
        if (slot && student) {
          const absWeek = state.cycleOffset * 4 + state.calWeek;
          const keys = [];
          for (let i = 0; i < count; i += 1) {
            state.lockedOverrides[`${absWeek}-${slot.day}-${slot.row + i}`] = {
              type: 'YELLOW', label: student.short
            };
            keys.push(`${absWeek}-${slot.day}-${slot.row + i}`);
          }
          student.credits = Math.max(0, student.credits - count);
          state.overlay = null;
          state.tempBookingSlot = null;
          triggerPulse(keys);
          const tempTeacher = currentCalTeacher();
          const crossGroup = tempTeacher.owner !== CURRENT_MONITOR;
          flashToast(`已预约 1v1 临时课 ${count} 节 (${DAY_LABELS[slot.day]} ${calRowTime(slot.row)})${crossGroup ? ` · 已向 ${tempTeacher.name} 负责班长发送 M4 跨组中性知会（不发邮件）` : ''}`);
        }
        return;
      }

      const trigger = event.target.closest('[data-action]');
      if (!trigger) return;
      const action = trigger.dataset.action;

      if (action === 'select-teacher') {
        state.selectedTeacher = trigger.dataset.teacher || 'david';
        state.view = 'calendar';
        state.calMode = defaultCalMode();
        resetWeekPlan();
        render(false);
      } else if (action === 'back-to-board') {
        state.view = 'board';
        state.selectedSlots = [];
        render(false);
      } else if (action === 'confirm-cal-schedule') {
        confirmCalSchedule();
      } else if (action === 'restore-week') {
        const week = Number(trigger.dataset.week);
        if (week >= 1 && week <= 3) {
          state.weekAdjusted[week] = false;
          state.weekSlots[week] = [];
          render(true);
          flashToast(`第${week + 1}周已恢复跟随第 1 周模板`);
        }
      } else if (action === 'open-hold-conflict') {
        state.overlay = 'hold-conflict';
        render(true);
      } else if (action === 'accept-candidate-hold') {
        const baseWeek = state.cycleOffset * 4;
        const keys = [];
        const stu = contextStudent();
        let held = 0;
        if (state.holdMode === 'all-conflict') {
          state.holdResolved = true;
          state.overlay = null;
          flashToast('4 周全冲突：锁定 0 格 HOLD，仍生成 0/4 续费单，全部节数确认收款后进入待排池');
          return;
        }
        for (let w = 0; w < 4; w += 1) {
          const absWeek = baseWeek + w;
          // 跳过第 3 周冲突，仅对可用周（第 1/2/4 周）预占 HOLD
          if (w === 2) continue;
          state.lockedOverrides[`${absWeek}-0-22`] = { type: 'ORANGE_HOLD', label: stu ? stu.short : 'Alic', isHold: true };
          keys.push(`${absWeek}-0-22`);
          held += 1;
        }
        state.holdResolved = true;
        state.overlay = null;
        triggerPulse(keys);
        flashToast(`已跳过第 3 周冲突 · 预占 ${held} 周 HOLD · 余 1 节留存待排池，已提醒班长补约`);
      } else if (action === 'release-candidate-hold') {
        state.holdResolved = true;
        state.overlay = null;
        render(true);
        flashToast('已释放候补，请在课表按可用周自选时段');
      } else if (action === 'open-context') {
        state.overlay = 'context';
        resetContextSheetFilters();
        render(true);
      } else if (action === 'open-rules') {
        state.overlay = 'rules';
        render(true);
      } else if (action === 'close-overlay') {
        state.overlay = null;
        resetContextSheetFilters();
        render(true);
      } else if (action === 'load-more') {
        const total = sortedTeachers().length;
        if (state.shown < LOAD_LIMIT && state.shown < total) {
          state.shown = Math.min(LOAD_LIMIT, state.shown + 5);
          render(true);
        }
      } else if (action === 'reset-demo') {
        resetDemo();
      }
    });

    render(false);
  </script>
</body>
</html>

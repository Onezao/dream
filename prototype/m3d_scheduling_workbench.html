    const esc = (value) => String(value ?? '')

      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    function pad2(value) { return String(value).padStart(2, '0'); }

    function toMinutes(time) {
      const bits = time.split(':').map(Number);
      return bits[0] * 60 + bits[1];
    }

    function addMinutesToTime(time, mins) {
      const total = toMinutes(time) + mins;
      return `${pad2(Math.floor(total / 60))}:${pad2(total % 60)}`;
    }

    function endTime(time) { return addMinutesToTime(time, 30); }
    function endHour(time) { return addMinutesToTime(time, 60); }

    function currentClass() { return CLASSES[state.classId]; }

      return '平台直管';

      if (isAdmin()) return '全平台在职 · 管理员统筹';
      return '全平台在职 · 班长可全域约课';
    }

    function demoDateInfo(offset) {
      const date = new Date(DEMO_YEAR, DEMO_MONTH, DEMO_DAY);
      date.setDate(date.getDate() + offset);
      return {
        offset,
        mm: pad2(date.getMonth() + 1),
        dd: pad2(date.getDate()),
        label: `${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`,
        weekday: (DEMO_WEEKDAY + offset) % 7,
        week: Math.floor((DEMO_WEEKDAY + offset) / 7)
      };
    }

    function isSelected(day, time) {
      return state.selectedSlots.some((slot) => slot.day === day && slot.time === time);
    }
    function removeSlot(day, time) {
      state.selectedSlots = state.selectedSlots.filter((slot) => !(slot.day === day && slot.time === time));
      syncCandidateAck();
    }
    function orderedSlots() {
      return [...state.selectedSlots].sort((a, b) => a.day - b.day || toMinutes(a.time) - toMinutes(b.time));
    }
    function slotsLabel(slots = orderedSlots()) {
      return slots.map((slot) => `${DAY_LABELS[slot.day]} ${slot.time}`).join('、');
    }
    function slotsParam(slots = orderedSlots()) {
      return slots.map((slot) => `${DAY_EN[slot.day]}:${slot.time}`).join(',');
    }

    function hasCandidateSelected() {
      return state.scenario === 'conflict' && isSelected(1, '19:30');
    }
    function syncCandidateAck() {
      if (!hasCandidateSelected()) state.candidateAck = false;
    }

    function fixedCreditUnit() { return 4; }
    function groupCreditUnit() { return 16; }
    function isGroupMakeup() { return state.mode === 'group_makeup'; }
    function maxFixedSlots() { return Math.floor(currentStudent().credits / fixedCreditUnit()); }
    function maxGroupSlots() { return isGroupMakeup() ? 1 : Math.floor(currentClass().credits / groupCreditUnit()); }

    function isHoldSlot(slot) {
      if (!slot || state.mode === 'batch_group') return false;
      const hold = activeHold();
      return !!hold && hold.day === slot.day && hold.time === slot.time;
    }
    function billableSlots() {
      return state.selectedSlots.filter((slot) => !isHoldSlot(slot));
    }
    function billableCount() {
      return billableSlots().length;
    }
    function convertedCount() {
      return state.mode === 'batch_group' ? 0 : state.selectedSlots.length - billableCount();
    }

    function activeHold() {
      if (state.student === 'alice' && state.scenario !== 'conflict') {
        return { day: 0, time: '19:00' };
      }
      return null;
    }

    function conflictCandidate() {
      return state.scenario === 'conflict' ? { day: 1, time: '19:30' } : null;
    }

    function isIntent(time, student = currentStudent()) {
      const mins = toMinutes(time);
      return mins >= student.intentStart && mins < student.intentEnd;
    }

    /* ------------------------------------------------------------------
     * 4 周可用性与智能筛师数据计算
     * ------------------------------------------------------------------ */
    function teacherFreeAt(teacherKey, weekday, time, week) {
      const teacher = TEACHERS[teacherKey];
      if (!teacher || !teacher.active) return false;
      if (week === 0) {
        if (BUSY[teacherKey] && BUSY[teacherKey][weekday] && BUSY[teacherKey][weekday][time]) return false;
        if (LEAVE[teacherKey] && LEAVE[teacherKey].has(`${weekday}|${time}`)) return false;
      }
      if (CLOSED[teacherKey] && CLOSED[teacherKey].has(`${weekday}|${time}`)) return false;
      if (week > 0) {
        const conflicts = WEEK_CONFLICTS[teacherKey] || [];
        if (conflicts.some((entry) => entry.week === week && entry.day === weekday && entry.time === time)) return false;
      }
      return true;
    }

    function teacherWeekConflicts(teacherKey, day, time) {
      const weeks = [];
      for (let week = 0; week < 4; week += 1) {
        if (!teacherFreeAt(teacherKey, day, time, week)) weeks.push(week);
      }
      return weeks;
    }

    function weekConflictReason(teacherKey, day, time, week) {
      if (week === 0) {
        if (BUSY[teacherKey] && BUSY[teacherKey][day] && BUSY[teacherKey][day][time]) return '已排课程';
        if (CLOSED[teacherKey] && CLOSED[teacherKey].has(`${day}|${time}`)) return '老师休息';
        if (LEAVE[teacherKey] && LEAVE[teacherKey].has(`${day}|${time}`)) return '老师请假';
      }
      if (CLOSED[teacherKey] && CLOSED[teacherKey].has(`${day}|${time}`)) return '老师休息';
      const conflict = (WEEK_CONFLICTS[teacherKey] || []).find((entry) => entry.week === week && entry.day === day && entry.time === time);
      return conflict ? conflict.reason : '时段冲突';
    }

    function slotWeekConflicts(slot) {
      return teacherWeekConflicts(state.teacher, slot.day, slot.time);
    }

    function weekConflictSlots() {
      return orderedSlots().filter((slot) => slotWeekConflicts(slot).length > 0);
    }

    function sortSmartTeachers(list) {
      const student = currentStudent();
      return list.sort((a, b) => {
        const regularA = a.regulars.includes(state.student) ? 1 : 0;
        const regularB = b.regulars.includes(state.student) ? 1 : 0;
        if (regularA !== regularB) return regularB - regularA;
        const levelA = a.level === student.level ? 1 : 0;
        const levelB = b.level === student.level ? 1 : 0;
        if (levelA !== levelB) return levelB - levelA;
        return b.freeRate - a.freeRate;
      });
    }

    function smartFixedResult() {
      const eligible = [];
      const filtered = [];
      Object.values(TEACHERS).forEach((teacher) => {
        if (!teacher.active) {
          filtered.push({ teacher, reason: '非在职', detail: '非在职' });
          return;
        }
        if (!teacher.qualified.includes(state.smartCourse)) {
          filtered.push({ teacher, reason: '资质不符', detail: `无${COURSE_TYPES[state.smartCourse]}课程资质` });
          return;
        }
        let conflict = null;
        for (const slot of orderedSlots()) {
          const weeks = teacherWeekConflicts(teacher.key, slot.day, slot.time);
          if (weeks.length) {
            conflict = { slot, week: weeks[0] };
            break;
          }
        }
        if (conflict) {
          const reason = `第 ${conflict.week + 1} 周冲突`;
          filtered.push({
            teacher,
            reason,
            detail: `${reason}（${DAY_LABELS[conflict.slot.day]} ${conflict.slot.time}）`
          });
        } else {
          eligible.push(teacher);
        }
      });
      return { eligible: sortSmartTeachers(eligible), filtered };
    }

    function tempFilterResult() {
      const info = demoDateInfo(state.temp.offset);
      const cells = state.temp.duration / 30;
      const eligible = [];
      const filtered = [];
      Object.values(TEACHERS).forEach((teacher) => {
        if (!teacher.active) {
          filtered.push({ teacher, reason: '非在职', detail: '非在职' });
          return;
        }
        if (!teacher.qualified.includes(state.temp.course)) {
          filtered.push({ teacher, reason: '资质不符', detail: `无${COURSE_TYPES[state.temp.course]}课程资质` });
          return;
        }
        let blocked = null;
        for (let index = 0; index < cells; index += 1) {
          const time = addMinutesToTime(state.temp.start, index * 30);
          if (!teacherFreeAt(teacher.key, info.weekday, time, info.week)) {
            blocked = time;
            break;
          }
        }
        if (blocked) {
          filtered.push({ teacher, reason: `${blocked} 已占用`, detail: `${blocked} 已占用，无法连续 ${cells} 节` });
        } else {
          eligible.push(teacher);
        }
      });
      return { eligible: sortSmartTeachers(eligible), filtered };
    }

    function filteredSummary(filtered) {
      if (!filtered.length) return '';
      const counts = {};
      filtered.forEach((item) => { counts[item.reason] = (counts[item.reason] || 0) + 1; });
      return Object.entries(counts).map(([reason, count]) => `${reason} ×${count}`).join(' · ');
    }

    function tempCreditsEnough() {
      return currentStudent().tempCredits >= state.temp.duration / 30;
    }

    /* ------------------------------------------------------------------
     * 网格状态计算
     * ------------------------------------------------------------------ */
    function fixedCell(day, time) {
      const teacherKey = state.teacher || 'david';
      const hold = activeHold();
      const candidate = conflictCandidate();

      if (state.scenario === 'conflict' && day === 1 && time === '19:00') {
        return { kind: 'original', label: '⚠', cls: 'border-rose-300 bg-rose-50 text-rose-700' };
      }
      if (candidate && candidate.day === day && candidate.time === time) {
        return { kind: 'candidate', label: '候补', cls: 'border-amber-400 border-dashed bg-amber-50/70 text-amber-800' };
      }
      if (hold && hold.day === day && hold.time === time) {
        return { kind: 'hold', label: '预', cls: 'border-amber-400 border-dashed bg-amber-50/70 text-amber-800' };
      }

      const busy = BUSY[teacherKey] && BUSY[teacherKey][day] && BUSY[teacherKey][day][time];
      if (busy) {
        return { kind: 'busy', label: busy, cls: 'border-amber-300 bg-amber-50 text-amber-900' };
      }
      if (LEAVE[teacherKey] && LEAVE[teacherKey].has(`${day}|${time}`)) {
        return { kind: 'leave', label: '假', cls: 'border-rose-200 bg-rose-50 text-rose-700' };
      }
      if (CLOSED[teacherKey] && CLOSED[teacherKey].has(`${day}|${time}`)) {
        return { kind: 'closed', label: '休', cls: 'border-slate-200 bg-slate-100 text-slate-500' };
      }
      if (isIntent(time)) {
        return { kind: 'available', label: '可排', cls: 'border-emerald-200 bg-emerald-50 text-emerald-700' };
      }
      return { kind: 'available', label: '可排', cls: 'border-slate-200 bg-slate-50/80 text-slate-500 opacity-60' };
    }

    function canPickFixed(day, time) {
      const status = fixedCell(day, time);
      return ['available', 'original', 'candidate', 'hold'].includes(status.kind);
    }

    function groupBlock(day, time) {
      const cls = currentClass();
      const activeTeacher = cls.teacher;
      if (!activeTeacher) return { kind: 'closed', label: '休' };
      if (day === 5 && time === '10:00') return { kind: 'full', label: '16/16' };
      if (day === 6 && time === '09:00') return { kind: 'full', label: '16/16' };
      if (day === 6 && time === '10:00') return { kind: 'partial', label: '15/16', week: 8, reason: '小班外出活动' };
      return { kind: 'closed', label: '休' };
    }

    function makeupBlock(day, time) {
      if (!currentClass().teacher) return { kind: 'closed', label: '休' };
      if ((day === 5 && time === '10:00') || (day === 6 && time === '09:00') || (day === 6 && time === '10:00')) {
        return { kind: 'available', label: '可排' };
      }
      return { kind: 'closed', label: '休' };
    }

    function groupCell(day, time) {
      return isGroupMakeup() ? makeupBlock(day, time) : groupBlock(day, time);
    }

    function selectedGroupBlocks() {
      if (state.mode !== 'batch_group' && state.mode !== 'group_makeup') return [];
      return orderedSlots().map((slot) => ({ slot, block: groupCell(slot.day, slot.time) }));
    }

    function selectedIsCandidate() {
      return hasCandidateSelected();
    }

    function fixedAllGreen() {
      const slots = orderedSlots();
      return slots.length > 0 && slots.every((slot) => slotWeekConflicts(slot).length === 0);
    }

    function groupAllGreen() {
      const blocks = selectedGroupBlocks();
      return blocks.length > 0 && blocks.every((item) => isGroupMakeup() ? item.block.kind === 'available' : item.block.kind === 'full');
    }

    function creditsNeeded() {
      if (state.mode === 'group_makeup') return state.selectedSlots.length;
      return state.mode === 'batch_group'
        ? state.selectedSlots.length * groupCreditUnit()
        : billableCount() * fixedCreditUnit();
    }

    function creditsEnough() {
      if (state.mode === 'group_makeup') return state.selectedSlots.length <= 1 && currentClass().credits >= 1;
      if (state.mode === 'batch_group') return state.selectedSlots.length <= maxGroupSlots();
      return currentStudent().credits >= creditsNeeded();
    }

    function confirmReady() {
      if (isParent()) return false;
      if (!state.online || state.completed) return false;
      if (!state.selectedSlots.length) return false;
      if (state.mode === 'group_makeup') {
        if (!currentClass().teacher) return false;
        if (state.selectedSlots.length !== 1) return false;
        return groupCell(state.selectedSlots[0].day, state.selectedSlots[0].time).kind === 'available';
      }
      if (state.mode === 'batch_group') {
        if (!currentClass().teacher) return false;
        if (!creditsEnough()) return false;
        return groupAllGreen();
      }
      if (!creditsEnough()) return false;
      if (!fixedAllGreen()) return false;
      if (hasCandidateSelected() && !state.candidateAck) return false;
      return true;
    }

    /* ------------------------------------------------------------------
     * 页面骨架
     * ------------------------------------------------------------------ */
    function render(preserveScroll = true) {
      const previous = document.getElementById('content');
      const previousTop = previous ? previous.scrollTop : 0;
      const app = document.getElementById('app');
      app.innerHTML = `${EMBED ? '' : renderConsole()}${renderFrame()}`;
      const next = document.getElementById('content');
      if (next) next.scrollTop = preserveScroll ? previousTop : 0;
      if (window.lucide) window.lucide.createIcons();
    }

    function renderFrame() {
      const isTablet = state.device === 'tablet';
      const frameCls = EMBED
        ? `h-[812px] w-full max-w-[390px] rounded-none`
        : isTablet
          ? `h-[860px] w-[768px] max-w-full rounded-3xl shadow-2xl ring-1 ring-slate-300`
          : `h-[812px] w-full max-w-[390px] rounded-2xl shadow-xl ring-1 ring-slate-300 sm:rounded-3xl sm:shadow-2xl`;
      return `<main class="flex min-h-screen w-full justify-center ${EMBED ? '' : 'overflow-x-hidden px-0 py-0 sm:px-3 sm:py-6'}">
        <div id="frame" class="relative flex ${frameCls} shrink-0 flex-col overflow-hidden bg-white transition-all duration-300">
          ${renderBanner()}
          ${!state.online && !isParent() ? renderOfflineStrip() : ''}
          ${isParent() ? renderParentView() : renderWorkbench()}
          ${renderOverlay()}
          ${state.toast ? renderToast() : ''}
        </div>
      </main>`;
    }

    function renderWorkbench() {
      return `<div id="content" class="min-h-0 flex-1 overflow-y-auto overscroll-contain">
        <div class="mx-auto w-full max-w-[720px] px-3 pb-4 pt-3">
          ${renderContent()}
        </div>
      </div>
      ${renderConfirmBar()}`;
    }

    function renderContent() {
      if (state.mode === 'group_makeup') {
        return `${renderGroupContext()}
          ${renderMakeupTaskCard()}
          ${currentClass().teacher ? renderGroupGrid() : renderBlockedCard()}`;
      }
      if (state.mode === 'batch_group') {
        return `${renderGroupContext()}
          ${currentClass().teacher ? renderGroupSummary() : ''}
          ${currentClass().teacher ? renderGroupGrid() : renderBlockedCard()}`;
      }
      return `${state.scenario === 'conflict' ? renderConflictTicket() : ''}
        ${renderFixedContext()}
        ${state.scenario === 'conflict' ? '' : renderRecommendations()}
        ${renderSmartBar()}
        ${renderFixedGrid()}`;
    }

    /* ------------------------------------------------------------------
     * Banner / 权限页
     * ------------------------------------------------------------------ */
    function roleMeta() {
      if (state.role === 'admin') {
        return { banner: 'from-slate-900 via-violet-950 to-slate-800', initial: 'S' };
      }
      if (state.role === 'parent') {
        return { banner: 'from-slate-800 via-blue-900 to-slate-700', initial: 'A' };
      }
      return { banner: 'from-slate-900 via-fuchsia-950 to-slate-800', initial: 'L' };

      const subtitle = isParent()
        ? ''
        : (state.mode === 'group_makeup'
          ? '暂停待排退回 1 节 · 单周选位'
          : state.mode === 'batch_group' ? '全学期 16 周 · 11.16 - 03.08' : '未来 4 周 · 11.16 - 12.13');
      const backRole = isParent() ? 'parent' : state.role;
      return `<header class="relative flex h-16 shrink-0 items-center gap-2 overflow-hidden bg-gradient-to-br ${meta.banner} px-3 text-white">
        <span class="pointer-events-none absolute -right-7 -top-9 h-24 w-24 rounded-full border border-white/10"></span>
        <span class="pointer-events-none absolute right-16 top-5 h-14 w-14 rounded-full border border-white/10"></span>
        <span class="pointer-events-none absolute -bottom-8 left-20 h-20 w-20 rounded-full bg-white/5"></span>
        <a href="m3a_calendar_grid.html?role=${backRole}" class="relative flex h-9 shrink-0 items-center gap-0.5 rounded-xl bg-white/10 pl-1 pr-2 text-[12px] font-semibold ring-1 ring-white/15 transition hover:bg-white/20" aria-label="返回课表">
          ${icon('chevron-left', 'h-4 w-4')}取消
        </a>
        <div class="relative min-w-0 flex-1">
          <h1 class="truncate text-[18px] font-bold tracking-tight">${title}</h1>
          ${subtitle ? `<p class="mt-0.5 truncate text-[12px] font-medium text-white/70">${subtitle}</p>` : ''}
        </div>
        ${isParent() ? '' : `<button data-action="open-rules" class="relative flex h-8 shrink-0 items-center gap-1 rounded-lg px-2 text-[12px] font-semibold text-white/80 transition hover:bg-white/10 hover:text-white">
          ${icon('info', 'h-4 w-4')}规则
        </button>`}
      </header>`;
    }

    function renderOfflineStrip() {
      return `<div class="flex shrink-0 items-center gap-1.5 border-b border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-semibold text-amber-900">
        ${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')}
        <span class="truncate">离线只读：可查看排课方案，暂不可提交</span>
      </div>`;
    }

    function renderParentView() {
      return `<div id="content" class="min-h-0 flex-1 overflow-y-auto">
        <div class="mx-auto flex h-full w-full max-w-[520px] flex-col items-center justify-center px-6 pb-8 text-center">
          <div class="grid h-16 w-16 place-items-center rounded-2xl border border-indigo-100 bg-indigo-50 text-indigo-700">
            ${icon('lock', 'h-7 w-7')}
          </div>
          <h2 class="mt-4 text-[18px] font-bold text-slate-900">批量排课由班长发起</h2>
          <p class="mt-2 max-w-[310px] text-[14px] font-medium leading-relaxed text-slate-600">你可以在课表中查看孩子的完整安排，临时课请直接选择空闲时段预约。</p>
          <a href="m3a_calendar_grid.html?role=parent" class="mt-5 inline-flex h-11 items-center justify-center gap-1.5 rounded-xl bg-indigo-600 px-5 text-[16px] font-bold text-white transition hover:bg-indigo-700">
            ${icon('calendar-days', 'h-4 w-4')}查看我的课表
          </a>
          <p class="mt-3 text-[12px] font-medium text-slate-500">孩子的课程变动会通过通知中心同步</p>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 固定位上下文
     * ------------------------------------------------------------------ */
    function renderFixedContext() {
      const student = currentStudent();
      const teacher = currentTeacher();
      const hold = activeHold();
      const conflict = state.scenario === 'conflict';
      const holdText = conflict ? '原时段 周二 19:00' : (hold ? `续费预占 ${DAY_LABELS[hold.day]} ${hold.time}` : '');
      return `<section aria-label="排课对象">
        <button data-action="open-students" class="w-full rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3 text-left transition active:scale-[0.995]">
          <div class="flex items-start gap-2.5">
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-2xl border border-indigo-100 bg-indigo-50 text-[16px] font-bold text-indigo-700">${esc(student.nickname.slice(0, 1))}</span>
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-2">
                <h2 class="truncate text-[16px] font-bold text-slate-900">${esc(student.name)}（${esc(student.nickname)}）</h2>
                <span class="flex shrink-0 items-center gap-0.5 text-[12px] font-semibold text-indigo-600">切换 ${icon('chevron-down', 'h-3.5 w-3.5')}</span>
              </div>
              <div class="mt-1 flex flex-wrap items-center gap-1.5">
                <span class="text-[12px] font-medium text-slate-600">${student.age} 岁</span>
                <span class="rounded-md bg-indigo-50 px-1.5 py-0.5 text-[12px] font-semibold text-indigo-700">固定位课次 ${student.credits} 节可用</span>
                ${holdText ? `<span class="rounded-md border border-amber-300 bg-amber-50 px-1.5 py-0.5 text-[12px] font-semibold text-amber-900">${holdText}</span>` : ''}
              </div>
              <div class="mt-1.5 flex flex-wrap items-center gap-1.5">
                <span class="inline-flex items-center rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-medium text-indigo-700">${esc(student.preference)}</span>
                <span class="text-[12px] font-medium text-slate-500">可排时间 ${student.windowLabel}</span>
              </div>
            </div>
          </div>
        </button>

        <button data-action="open-teachers" class="mt-2 flex w-full items-center gap-2 rounded-2xl border border-slate-200/80 bg-slate-50/70 px-3 py-2.5 text-left transition active:scale-[0.995]">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl border border-slate-200 bg-slate-100 text-[14px] font-bold text-slate-700">${teacher.initial}</span>
          <span class="min-w-0 flex-1">
            <span class="flex flex-wrap items-center gap-1.5">
              <span class="truncate text-[14px] font-bold text-slate-900">${esc(teacher.name)}</span>
              <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-semibold text-slate-700">${teacher.level}</span>
              <span class="rounded bg-white px-1.5 py-0.5 text-[12px] font-semibold text-slate-600 ring-1 ring-inset ring-slate-200">[${ownerLabel(teacher)}]</span>
            </span>
            <span class="mt-0.5 flex items-center gap-1 text-[12px] font-medium text-slate-600">
              <span>${teacherScopeLabel()}</span>
              <span class="text-slate-500">·</span>
              <span>本周已排 ${teacher.load} 节</span>
            </span>
          </span>
          <span class="flex shrink-0 items-center gap-0.5 text-[12px] font-semibold text-slate-600">切换 ${icon('chevron-down', 'h-3.5 w-3.5')}</span>
        </button>
      </section>`;
    }

    function renderRecommendations() {
      const recs = (RECOMMENDATIONS[recKey()] || DEFAULT_RECOMMENDATIONS[state.student] || [])
        .filter((rec) => teacherWeekConflicts(state.teacher, rec.day, rec.time).length === 0);
      return `<section class="mt-3" aria-label="黄金推荐">
        <div class="mb-1.5 flex items-center justify-between gap-2 px-0.5">
          <h2 class="text-[14px] font-bold text-slate-900">黄金推荐</h2>
          <span class="text-[12px] font-medium text-slate-500">老师空闲与学员意向的交集</span>
        </div>
        ${recs.length ? `<div class="grid grid-cols-2 gap-2">
          ${recs.map((rec) => {
            const active = isSelected(rec.day, rec.time);
            return `<button data-action="pick-slot" data-day="${rec.day}" data-time="${rec.time}" class="rounded-xl border p-2.5 text-left transition active:scale-[0.99] ${active ? 'border-indigo-300 bg-slate-50/70 ring-2 ring-inset ring-indigo-500' : 'border-slate-200/80 bg-slate-50/70'}">
              <div class="flex items-center justify-between gap-1">
                <span class="text-[12px] font-bold ${active ? 'text-indigo-700' : 'text-emerald-800'}">${active ? '✓ 已选' : '🟢 推荐'}</span>
                <span class="text-[12px] font-semibold ${active ? 'text-indigo-600' : 'text-emerald-700'}">4 周全通</span>
              </div>
              <div class="mt-1 text-[16px] font-bold tracking-tight text-slate-900">${DAY_LABELS[rec.day]} ${rec.time}</div>
            </button>`;
          }).join('')}
        </div>` : `<div class="rounded-xl border border-dashed border-slate-200 bg-slate-50/70 px-3 py-3 text-center text-[12px] font-medium text-slate-600">当前老师在意向时段无 4 周全通，试试按时段智能筛师</div>`}
      </section>`;
    }

    function renderSmartBar() {
      const hasSlots = state.selectedSlots.length > 0;
      return `<section class="mt-3 flex items-center gap-2" aria-label="智能筛师">

              <span class="shrink-0 text-[12px] font-semibold text-teal-700">16/16 周全通</span>
            </div>
            <div class="mt-1 flex gap-0.5 pl-0">
              ${Array.from({ length: 16 }, () => '<span class="h-2 flex-1 rounded-full bg-emerald-500"></span>').join('')}
            </div>
          </div>`).join('')}
        </div>`}
      </div>`;
    }

    function renderBlockedCard() {
      return `<section class="mt-3 rounded-2xl border border-slate-200/80 bg-slate-50/70 p-5 text-center">
        <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl border border-rose-200 bg-rose-50 text-rose-700">${icon('user-x', 'h-6 w-6')}</div>
        <h2 class="mt-3 text-[16px] font-bold text-slate-900">请先委任授课老师</h2>
        <p class="mx-auto mt-1.5 max-w-[280px] text-[14px] font-medium leading-relaxed text-slate-600">请先在小班管理中委任授课老师后再排课</p>
        <a href="m1c_classes.html" class="mt-3 inline-flex h-10 items-center justify-center gap-1.5 rounded-xl bg-indigo-600 px-4 text-[14px] font-bold text-white transition hover:bg-indigo-700">
          ${icon('arrow-up-right', 'h-4 w-4')}去小班管理
        </a>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 吸底确认栏
     * ------------------------------------------------------------------ */
    function bottomState() {
      const s = {
        disabled: true,
        title: '',
        subtitle: '',
        error: '',
        summary: '',
        chips: [],
        showCandidate: false,
        holdNotice: null,
        buttonLabel: ''
      };
      const slots = orderedSlots();
      const count = slots.length;

      if (state.mode === 'group_makeup') {
        const cls = currentClass();
        s.buttonLabel = count ? '确认补排 1 节（连续双格）' : '确认补排 1 节';
        if (!cls.teacher) {
          s.title = '请先在小班管理中委任授课老师';
          s.subtitle = '完成委任后即可补排';
          return s;
        }
        if (count !== 1) {
          s.title = '请选择 1 个补排时段';
          s.subtitle = '单节补排仅选单周一个连续双格';
          return s;
        }
        s.title = '已选 1 个补排时段';
        s.chips = slots;
        s.summary = '扣减 1 节待补排课次 · 待办自动核销';
        const cell = groupCell(slots[0].day, slots[0].time);
        if (cell.kind !== 'available') {
          s.error = '该时段不可补排';
          return s;
        }
        s.subtitle = '单周选位 · 不执行 16 周连贯度评分';
        s.disabled = !confirmReady();
        return s;
      }

      if (state.mode === 'batch_group') {
        const cls = currentClass();
        s.buttonLabel = count
          ? `确认整班排课 16 周（${count} 个时段 · 扣减 ${count * groupCreditUnit()} 节小班课次）`
          : '确认整班排课 16 周';
        if (!cls.teacher) {
          s.title = '请先在小班管理中委任授课老师';
          s.subtitle = '完成委任后即可选择整班时段';
          return s;
        }
        if (!count) {
          s.title = '请选择整班时段';
          s.subtitle = state.conflictDetail
            ? `${DAY_LABELS[state.conflictDetail.day]} ${state.conflictDetail.time} 第 ${state.conflictDetail.week} 周冲突，未加入已选`
            : '小班课按全学期 16 周连续双格排定，可多选';
          return s;
        }
        s.title = `已选 ${count} 个时段`;
        s.chips = slots;
        const remaining = cls.credits - creditsNeeded();
        s.summary = `共扣 16×${count} 节小班课次 · ${remaining >= 0 ? `剩余 ${remaining} 节` : `尚缺 ${-remaining} 节`}`;
        if (!creditsEnough()) {
          s.subtitle = '请取消部分时段后再确认';
          s.error = `小班课次不足，最多选 ${maxGroupSlots()} 个时段`;
          return s;
        }
        const bad = selectedGroupBlocks().find((item) => item.block.kind !== 'full');
        if (bad) {
          s.subtitle = '每个时段独立执行 16 周连贯度校验';
          s.error = `${DAY_LABELS[bad.slot.day]} ${bad.slot.time} 全学期未全部可排`;
          return s;
        }
        s.subtitle = '全学期 16 周全通 · 单一事务整批锁定';
        s.disabled = !confirmReady();
        return s;
      }

      s.buttonLabel = count
        ? `确认批量锁定 4 周（${count} 个时段 · 扣减 ${billableCount() * fixedCreditUnit()} 节固定位）`
        : '确认批量锁定 4 周';
      if (!count) {
        s.title = '请选择每周时段';
        s.subtitle = '可一次选择多个时段批量锁定；推荐时段已按学员意向筛选';
        if (!activeHold() && currentStudent().credits < fixedCreditUnit()) {
          s.error = `固定位课次不足 4 节（仅剩 ${currentStudent().credits} 节）`;
        }
        return s;
      }
      s.title = `已选 ${count} 个时段`;
      s.chips = slots;
      const credits = currentStudent().credits;
      const billable = billableCount();
      const converted = convertedCount();
      const remaining = credits - creditsNeeded();
      s.summary = converted > 0
        ? `预占转正 ${converted} 个 · 新排 ${billable} 个 · 共扣 ${billable * fixedCreditUnit()} 节固定位 · ${remaining >= 0 ? `剩余 ${remaining} 节` : `尚缺 ${-remaining} 节`}`
        : `共扣 ${count * fixedCreditUnit()} 节固定位 · ${remaining >= 0 ? `剩余 ${remaining} 节` : `尚缺 ${-remaining} 节`}`;
      if (!creditsEnough()) {
        s.subtitle = '请取消部分时段或先完成续费';
        s.error = count === 1
          ? `固定位课次不足 4 节（仅剩 ${credits} 节）`
          : `固定位课次不足（需 ${creditsNeeded()} 节，仅剩 ${credits} 节）`;
        return s;
      }
      const weekBad = weekConflictSlots();
      if (weekBad.length) {
        const first = weekBad[0];
        const weeks = slotWeekConflicts(first);
        s.subtitle = '可打开智能筛师，切换未来 4 周全通的老师';
        s.error = `${DAY_LABELS[first.day]} ${first.time} 第 ${weeks[0] + 1} 周${weekConflictReason(state.teacher, first.day, first.time, weeks[0])}，整批暂不能锁定`;
        return s;
      }
      const hold = activeHold();
      if (hold) {
        const inSelection = isSelected(hold.day, hold.time);
        s.holdNotice = {
          convert: inSelection,
          text: inSelection
            ? '原预占位将转为正式固定位'
            : `原预占位 [${DAY_LABELS[hold.day]} ${hold.time}] 将自动释放`,
          detail: inSelection
            ? '该预占时段保留在已选清单中，确认后直接转为实线固定位，不重复扣占。'
            : '确认后原时段立即释放，不会同时占用两个时段，续费权益无缝继承。'
        };
      }
      if (hasCandidateSelected()) {
        s.showCandidate = true;
        if (!state.candidateAck) s.error = '请先与家长确认候补时段后再确认';
      }
      s.subtitle = `${count > 1 ? '每个时段独立' : '所选时段'} 4 周全通校验 · 单一事务整批锁定`;
      s.disabled = !confirmReady();
      return s;
    }

    function renderSlotChips(slots) {
      return `<div class="mt-1.5 flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">
        ${slots.map((slot) => `<button data-action="remove-slot" data-day="${slot.day}" data-time="${slot.time}" class="inline-flex shrink-0 items-center gap-1 rounded-lg border border-indigo-200 bg-indigo-50 px-2 py-1 text-[12px] font-semibold text-indigo-700 transition active:bg-indigo-100" aria-label="取消 ${DAY_LABELS[slot.day]} ${slot.time}">
          <span>${DAY_LABELS[slot.day]} ${slot.time}</span>
          <span class="text-[14px] leading-none text-indigo-400">×</span>
        </button>`).join('')}
      </div>`;
    }

    function renderConfirmBar() {
      const s = bottomState();
      const offline = !state.online;
      const disabled = s.disabled || offline;
      const hasChips = s.chips.length > 0;
      return `<section class="relative z-40 shrink-0 border-t border-slate-200 bg-white px-3 pb-2.5 pt-2 shadow-[0_-6px_18px_rgba(15,23,42,0.06)]" aria-label="确认排课">
        <div class="mx-auto w-full max-w-[720px]">
          ${s.holdNotice ? `<div class="mb-2 rounded-xl border border-amber-300 bg-amber-50 px-2.5 py-2">
            <div class="flex items-center gap-1.5 text-[12px] font-bold text-amber-900">💡 ${esc(s.holdNotice.text)}</div>
            <p class="mt-1 text-[12px] font-medium leading-relaxed text-amber-800">${esc(s.holdNotice.detail)}</p>
          </div>` : ''}
          ${s.showCandidate ? `<div class="mb-2 rounded-xl border border-amber-300 bg-amber-50 px-2.5 py-2">
            <div class="flex items-center gap-1.5 text-[12px] font-bold text-amber-900">${icon('clock-3', 'h-3.5 w-3.5')}候补时段已临时保留 24 小时</div>
            <label class="mt-1.5 flex cursor-pointer items-center gap-1.5 text-[12px] font-semibold text-amber-900">
              <input type="checkbox" id="candidateAck" ${state.candidateAck ? 'checked' : ''} class="h-4 w-4 rounded border-amber-300 accent-indigo-600">
              已与家长确认候补时段
            </label>
          </div>` : ''}
          ${hasChips ? `<div class="flex items-center justify-between gap-2">
            <div class="min-w-0 truncate text-[16px] font-bold text-slate-900">${s.title}</div>
            <button data-action="clear-slots" class="shrink-0 rounded-md px-1.5 py-0.5 text-[12px] font-semibold text-slate-500 transition hover:bg-slate-100 hover:text-slate-700">清空</button>
          </div>
          ${renderSlotChips(s.chips)}
          <div class="mt-0.5 text-[12px] font-semibold text-slate-700">${s.summary}</div>` : `<div class="truncate text-[16px] font-bold text-slate-900">${s.title}</div>`}
          <div class="mt-0.5 truncate text-[12px] font-medium text-slate-600">${s.subtitle}</div>
          ${s.error ? `<div class="mt-1 text-[12px] font-bold text-rose-700">${esc(s.error)}</div>` : ''}
          ${offline ? `<div class="mt-1 text-[12px] font-bold text-amber-700">当前为离线只读，暂不可提交</div>` : ''}
          <button data-action="confirm-booking" ${disabled ? 'disabled' : ''} class="mt-2 flex h-11 w-full items-center justify-center gap-1.5 rounded-xl px-2 ${state.mode === 'batch_group' || state.mode === 'group_makeup' ? 'text-[12px]' : 'text-[14px]'} font-bold transition ${disabled ? 'cursor-not-allowed bg-slate-200 text-slate-500' : 'bg-indigo-600 text-white active:bg-indigo-700'}">
            ${icon(disabled ? 'lock' : 'check-check', 'h-4 w-4 shrink-0')}
            <span class="truncate">${s.buttonLabel}</span>
          </button>
        </div>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 抽屉、智能筛师面板、成功反馈与提示
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay) return '';
      if (state.completed) return renderSuccess();
      if (state.overlay === 'temp-confirm') return renderTempConfirm();
      const content = state.overlay === 'students'
        ? renderStudentSheet()
        : state.overlay === 'teachers'
          ? renderTeacherSheet()
          : state.overlay === 'smart-fixed'
            ? renderSmartFixedSheet()
            : state.overlay === 'temp-smart'
              ? renderTempSheet()
              : renderRulesSheet();
      return `<div class="absolute inset-0 z-50">
        <button data-action="close-overlay" class="absolute inset-0 h-full w-full bg-slate-900/40" aria-label="关闭"></button>
        <div class="absolute inset-x-0 bottom-0 max-h-[85%] overflow-y-auto rounded-t-3xl border-t border-slate-200 bg-white px-4 pb-5 pt-2.5 shadow-2xl">
          <div class="mx-auto mb-3 h-1 w-10 rounded-full bg-slate-200"></div>
          ${content}
        </div>
      </div>`;
    }

    function sheetHeader(title, subtitle) {
      return `<div class="mb-3 flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 class="text-[16px] font-bold text-slate-900">${title}</h2>
          ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium text-slate-600">${subtitle}</p>` : ''}
        </div>
        <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-slate-100 text-slate-600" aria-label="关闭">${icon('x', 'h-4 w-4')}</button>
      </div>`;
    }

    function renderStudentSheet() {
      return `${sheetHeader('切换学员', '课次与意向作息跟随学员档案')}
        <div class="space-y-2">
          ${Object.values(STUDENTS).map((student) => {
            const active = student.key === state.student;
            return `<button data-action="select-student" data-key="${student.key}" class="flex w-full items-center gap-2.5 rounded-xl border px-3 py-2.5 text-left transition ${active ? 'border-indigo-200 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl ${active ? 'bg-white text-indigo-700' : 'bg-slate-100 text-slate-700'} text-[14px] font-bold">${esc(student.nickname.slice(0, 1))}</span>
              <span class="min-w-0 flex-1">
                <span class="flex items-center gap-1.5">
                  <span class="truncate text-[14px] font-bold text-slate-900">${esc(student.name)}</span>
                  <span class="text-[12px] font-medium text-slate-500">${student.age} 岁</span>
                </span>
                <span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">${esc(student.preference)}</span>
              </span>
              <span class="shrink-0 text-right">
                <span class="block text-[14px] font-bold ${student.credits < 4 ? 'text-amber-700' : 'text-indigo-700'}">${student.credits} 节</span>
                <span class="block text-[12px] font-medium text-slate-500">固定位</span>
              </span>
              ${active ? `<span class="shrink-0 text-indigo-600">${icon('check-circle-2', 'h-4 w-4')}</span>` : ''}
            </button>`;
          }).join('')}
        </div>`;
    }

    function renderTeacherSheet() {
      const subtitle = isAdmin() ? '全平台在职老师 · 管理员跨班长统筹' : '全平台在职老师 · 班长可全域约课';
      return `${sheetHeader('切换授课老师', subtitle)}
        <div class="mb-2 flex items-start gap-1.5 rounded-xl border border-indigo-100 bg-indigo-50/70 px-2.5 py-2">
          ${icon('globe-2', 'h-4 w-4 shrink-0 text-indigo-600')}
          <p class="text-[12px] font-medium leading-relaxed text-indigo-800">班长可为学员预约全平台任意在职老师的空闲时段，不再受班长与老师归属关系限制。</p>
        </div>
        <div class="space-y-2">
          ${Object.values(TEACHERS).map((teacher) => {
            const active = teacher.key === state.teacher;
            return `<button data-action="select-teacher" data-key="${teacher.key}" class="flex w-full items-center gap-2.5 rounded-xl border px-3 py-2.5 text-left transition ${active ? 'border-indigo-200 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl ${active ? 'bg-white text-indigo-700' : 'bg-slate-100 text-slate-700'} text-[14px] font-bold">${teacher.initial}</span>
              <span class="min-w-0 flex-1">
                <span class="flex flex-wrap items-center gap-1.5">
                  <span class="truncate text-[14px] font-bold text-slate-900">${esc(teacher.name)}</span>
                  <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-semibold text-slate-700">${teacher.level}</span>
                  <span class="rounded bg-white px-1.5 py-0.5 text-[12px] font-semibold text-slate-600 ring-1 ring-inset ring-slate-200">[${ownerLabel(teacher)}]</span>
                </span>
                <span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">${teacher.qualified.map((key) => COURSE_TYPES[key]).join(' / ')}资质 · 本周已排 ${teacher.load} 节 · 空闲 ${teacher.freeRate}%</span>
              </span>
              ${active ? `<span class="shrink-0 text-indigo-600">${icon('check-circle-2', 'h-4 w-4')}</span>` : `<span class="shrink-0 text-[12px] font-semibold text-slate-500">选择</span>`}
            </button>`;
          }).join('')}
        </div>`;
    }

    function renderSmartFixedSheet() {
      if (!state.selectedSlots.length) {
        return `${sheetHeader('按已选时段智能筛师', '请先在网格中勾选 1~N 个每周时段')}
          <div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 px-3 py-6 text-center text-[12px] font-medium text-slate-600">尚未选择时段，返回网格勾选后可反选老师。</div>`;
      }
      const { eligible, filtered } = smartFixedResult();
      const summary = filtered.length ? `已过滤 ${filtered.length} 位：${filteredSummary(filtered)}` : '全部在职老师均满足 4 周全通与资质条件';
      return `${sheetHeader('按已选时段智能筛师', '全平台在职老师 · 未来 4 周全通校验')}
        <div class="mb-2 flex flex-wrap gap-1.5">
          ${orderedSlots().map((slot) => `<span class="rounded-lg border border-indigo-200 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-semibold text-indigo-700">${DAY_LABELS[slot.day]} ${slot.time}</span>`).join('')}
          <span class="rounded-lg border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-semibold text-slate-700">4 周 × ${orderedSlots().length} 时段全通</span>
        </div>
        <div class="mb-2">
          <div class="mb-1 text-[12px] font-semibold text-slate-600">课程类型</div>
          <div class="inline-flex rounded-xl bg-slate-100 p-1">
            ${Object.entries(COURSE_TYPES).map(([key, label]) => `<button data-action="smart-fixed-course" data-value="${key}" class="rounded-lg px-3 py-1.5 text-[12px] font-semibold transition ${state.smartCourse === key ? 'bg-white text-slate-900' : 'text-slate-600'}">${label}</button>`).join('')}
          </div>
        </div>
        <div class="mb-2 rounded-xl border border-slate-200 bg-slate-50 px-2.5 py-2">
          <div class="flex items-center gap-1.5 text-[12px] font-bold ${filtered.length ? 'text-slate-800' : 'text-emerald-700'}">
            ${icon('filter', 'h-3.5 w-3.5 shrink-0')}${summary}
          </div>
          ${filtered.length ? `<div class="mt-1 space-y-0.5">${filtered.map((item) => `<div class="text-[12px] font-medium leading-relaxed text-slate-600">${esc(item.teacher.short)} · ${esc(item.detail)}</div>`).join('')}</div>` : ''}
        </div>
        <div class="mb-1.5 flex items-center justify-between gap-2">
          <h3 class="text-[14px] font-bold text-slate-900">全通候选 ${eligible.length} 位</h3>
          <span class="text-[12px] font-medium text-slate-500">熟客优先 → 定级匹配 → 空闲率</span>
        </div>
        <div class="space-y-2">
          ${eligible.length ? eligible.map((teacher, index) => renderSmartTeacherCard(teacher, index, '选择')).join('') : `<div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 px-3 py-6 text-center text-[12px] font-medium text-slate-600">没有老师同时满足全部所选时段的 4 周全通条件，请调整时段或课程类型。</div>`}
        </div>
        <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-500">仅展示全部所选时段未来 4 周均空闲且具备课程资质的在职老师；任一周冲突或资质不符均会被过滤。</p>`;
    }

    function renderSmartTeacherCard(teacher, index, actionLabel, actionEnabled = true) {
      const regular = teacher.regulars.includes(state.student);
      const levelMatch = teacher.level === currentStudent().level;
      const isTempBook = actionLabel === '立即预约' || actionLabel === '课次不足';
      const actionCls = !actionEnabled
        ? 'cursor-not-allowed bg-slate-200 text-slate-500'
        : isTempBook
          ? 'bg-indigo-600 px-2.5 text-white active:bg-indigo-700'
          : 'border border-indigo-200 bg-white text-indigo-700 active:bg-indigo-50';
      return `<div class="rounded-xl border ${index === 0 ? 'border-indigo-200 bg-indigo-50/40' : 'border-slate-200 bg-white'} p-2.5">
        <div class="flex items-start gap-2">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-slate-100 text-[14px] font-bold text-slate-700">${teacher.initial}</span>
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="truncate text-[14px] font-bold text-slate-900">${esc(teacher.name)}</span>
              <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-semibold text-slate-700">${teacher.level}</span>
              <span class="rounded bg-white px-1.5 py-0.5 text-[12px] font-semibold text-slate-600 ring-1 ring-inset ring-slate-200">[${ownerLabel(teacher)}]</span>
            </div>
            <div class="mt-1 flex flex-wrap gap-1">

              ${levelMatch ? `<span class="rounded-md border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">定级匹配</span>` : ''}

        ? '扣减 1 节待补排课次'
        : isGroup
          ? `共扣 16×${data.count} 节小班课次`
          : `共扣 ${4 * fixedBillable} 节固定位课次`;
      return `<div class="absolute inset-0 z-[100] flex items-center justify-center bg-slate-900/40 p-5 backdrop-blur-sm">
        <div class="max-h-[92%] w-full overflow-y-auto rounded-2xl border border-slate-200 bg-white p-5 text-center shadow-2xl">
          <div class="mx-auto grid h-14 w-14 place-items-center rounded-full border border-emerald-200 bg-emerald-50 text-emerald-600">${icon('check', 'h-7 w-7')}</div>
          <h2 class="mt-3 text-[18px] font-bold text-slate-900">${isMakeup ? '单节补排已排定' : isGroup ? '全学期 16 周已排定' : '未来 4 周已锁定'}</h2>
          <p class="mt-1 text-[14px] font-semibold text-slate-700">${isMakeup ? '已选 1 个时段 · 扣减 1 节待补排课次' : isGroup ? `已选 ${data.count} 个时段 · 共扣 ${16 * data.count} 节小班课次` : `已选 ${data.count} 个时段 · 共扣 ${4 * fixedBillable} 节固定位课次`}</p>
          <div class="mt-3 space-y-1.5 rounded-xl border border-slate-200 bg-slate-50 p-2.5 text-left">

              const statusCls = isMakeup || isGroup || !convertedSlot ? 'border-emerald-200 bg-emerald-50 text-emerald-700' : 'border-amber-200 bg-amber-50 text-amber-700';

                <span class="min-w-0 truncate text-[14px] font-bold text-slate-900">${DAY_LABELS[slot.day]} ${slot.time} - ${(isGroup || isMakeup) ? endHour(slot.time) : endTime(slot.time)}</span>
                <span class="shrink-0 rounded-md border px-1.5 py-0.5 text-[12px] font-bold ${statusCls}">${status}</span>

          </div>
          <div class="mt-2 space-y-1.5 rounded-xl border border-slate-200 bg-slate-50 p-3 text-left">
            <div class="flex items-center gap-1.5 text-[12px] font-medium text-slate-700">${icon('check-circle-2', 'h-3.5 w-3.5 shrink-0 text-emerald-600')}${creditsLine}</div>
            <div class="flex items-center gap-1.5 text-[12px] font-medium text-slate-700">${icon('bell', 'h-3.5 w-3.5 shrink-0 text-indigo-600')}${isMakeup ? '已通知绑定班长 · 待补排待办已核销 · 小班修改日志已记录' : isGroup ? `已通知小班家长与 ${currentClass().teacher ? TEACHERS[currentClass().teacher].short : '授课'} 老师` : `已通知家长与 ${currentTeacher().short} 老师`}</div>
            ${!isGroup && !isMakeup && data.holdMode === 'released' ? `<div class="flex items-center gap-1.5 text-[12px] font-medium text-amber-800">${icon('undo-2', 'h-3.5 w-3.5 shrink-0 text-amber-600')}原预占位 [${DAY_LABELS[data.hold.day]} ${data.hold.time}] 已释放</div>` : ''}
            ${!isGroup && !isMakeup && data.holdMode === 'converted' ? `<div class="flex items-center gap-1.5 text-[12px] font-medium text-amber-800">${icon('badge-check', 'h-3.5 w-3.5 shrink-0 text-amber-600')}原预占位 [${DAY_LABELS[data.hold.day]} ${data.hold.time}] 已转为正式固定位</div>` : ''}
            ${!isGroup && !isMakeup && data.converted > 0 ? `<div class="flex items-center gap-1.5 text-[12px] font-medium text-amber-800">${icon('shield-check', 'h-3.5 w-3.5 shrink-0 text-amber-600')}预占转正不重复扣减</div>` : ''}
            ${!isGroup && !isMakeup && !data.holdMode ? `<div class="flex items-center gap-1.5 text-[12px] font-medium text-slate-600">${icon('move-right', 'h-3.5 w-3.5 shrink-0 text-slate-500')}全部时段已在单一事务内原子锁定</div>` : ''}
          </div>
          <a href="${data.link}" class="mt-4 flex h-11 items-center justify-center rounded-xl bg-indigo-600 text-[14px] font-bold text-white transition hover:bg-indigo-700">返回课表</a>
        </div>
      </div>`;

    function renderToast() {
      return `<div class="pointer-events-none absolute left-1/2 top-20 z-[100] w-max max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl bg-slate-900/90 px-3.5 py-2 text-center text-[12px] font-semibold leading-relaxed text-white shadow-xl">${esc(state.toast)}</div>`;
    }

    /* ------------------------------------------------------------------
     * 操作与状态切换
     * ------------------------------------------------------------------ */
    function showToast(message) {
      state.toast = message;
      render(true);
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        state.toast = '';
        render(true);
      }, 2600);
    }

    function pickFixedSlot(day, time) {
      if (!canPickFixed(day, time)) return;
      if (isSelected(day, time)) {
        removeSlot(day, time);
        state.completed = null;
        render(true);
        return;
      }
      const target = { day, time };
      if (!isHoldSlot(target) && billableCount() >= maxFixedSlots()) {
        showToast(`固定位课次不足，最多选 ${maxFixedSlots()} 个时段`);
        return;
      }
      state.selectedSlots.push(target);
      state.completed = null;
      syncCandidateAck();
      render(true);
    }

    function pickGroupSlot(day, time) {
      const block = groupCell(day, time);
      if (isGroupMakeup()) {
        if (block.kind !== 'available') return;
        state.selectedSlots = isSelected(day, time) ? [] : [{ day, time }];
        state.conflictDetail = null;
        state.completed = null;
        render(true);
        return;
      }
      if (block.kind !== 'full' && block.kind !== 'partial') return;
      if (block.kind === 'partial') {
        state.conflictDetail = { day, time, week: block.week, reason: block.reason };
        state.completed = null;
        render(true);
        return;
      }
      if (isSelected(day, time)) {
        removeSlot(day, time);
      } else {
        const max = maxGroupSlots();
        if (state.selectedSlots.length >= max) {
          showToast(`小班课次不足，最多选 ${max} 个时段`);
          return;
        }
        state.selectedSlots.push({ day, time });
      }
      state.conflictDetail = null;
      state.completed = null;
      render(true);
    }

    function chooseStudent(key) {
      if (!STUDENTS[key]) return;
      state.student = key;
      state.overlay = null;
      state.completed = null;
      state.candidateAck = false;
      state.conflictDetail = null;
      state.tempPick = null;
      state.selectedSlots = [];
      if (state.scenario === 'conflict' && key !== 'alice') state.scenario = 'normal';
      if (state.scenario === 'insufficient' && key !== 'charlie') state.scenario = 'normal';
      render(true);
    }

    function chooseTeacher(key) {
      if (!TEACHERS[key]) return;
      state.teacher = key;
      state.overlay = null;
      state.completed = null;
      state.candidateAck = false;
      state.selectedSlots = [];
      state.conflictDetail = null;
      if (state.scenario === 'conflict') state.scenario = 'normal';
      render(true);
    }

    function chooseSmartTeacher(key) {
      if (!TEACHERS[key]) return;
      state.teacher = key;
      state.overlay = null;
      state.completed = null;
      state.candidateAck = false;
      if (state.scenario === 'conflict') state.scenario = 'normal';
      showToast(`已切换为 ${TEACHERS[key].short}，已选时段保留`);
    }

    function confirmTempBooking() {
      if (!state.tempPick) return;
      const teacher = TEACHERS[state.tempPick.teacher];
      if (!teacher) return;
      const cells = state.temp.duration / 30;
      const info = demoDateInfo(state.temp.offset);
      const end = addMinutesToTime(state.temp.start, state.temp.duration);
      if (currentStudent().tempCredits < cells) {
        state.overlay = 'temp-smart';
        state.tempPick = null;
        showToast('临时课次不足，暂不可预约');
        return;
      }
      currentStudent().tempCredits -= cells;
      state.overlay = null;
      state.tempPick = null;
      showToast(`已为 ${currentStudent().nickname} 预约 ${info.label} ${DAY_LABELS[info.weekday]} ${state.temp.start}-${end}，扣减 ${cells} 节临时课次`);
    }

    function confirmBooking() {
      if (!confirmReady()) return;
      const slots = orderedSlots();
      if (!slots.length) return;
      const first = slots[0];
      const isGroup = state.mode === 'batch_group';
      if (state.mode === 'group_makeup') {
        const link = `m3a_calendar_grid.html?role=${state.role}&booked=1&mode=makeup&classId=${state.classId}&slots=${encodeURIComponent(slotsParam(slots))}&day=${DAY_EN[first.day]}&time=${first.time}`;
        state.completed = {
          isMakeup: true,
          isGroup: false,
          slots,
          count: 1,
          credits: 1,
          link
        };
        state.overlay = 'success';
        render(true);
        return;
      }
      if (isGroup) {
        const link = `m3a_calendar_grid.html?role=${state.role}&booked=1&mode=group&slots=${encodeURIComponent(slotsParam(slots))}&day=${DAY_EN[first.day]}&time=${first.time}`;
        state.completed = {
          isGroup: true,
          slots,
          count: slots.length,
          credits: slots.length * groupCreditUnit(),
          link
        };
      } else {
        const hold = activeHold();
        const holdMode = hold ? (isSelected(hold.day, hold.time) ? 'converted' : 'released') : null;
        const link = `m3a_calendar_grid.html?role=${state.role}&booked=1&mode=fixed&slots=${encodeURIComponent(slotsParam(slots))}&day=${DAY_EN[first.day]}&time=${first.time}`;
        state.completed = {
          isGroup: false,
          slots,
          count: slots.length,
          billable: billableCount(),
          converted: convertedCount(),
          credits: billableCount() * fixedCreditUnit(),
          holdMode,
          hold,
          link
        };
      }
      state.overlay = 'success';
      render(true);
    }

    function adoptCandidate() {
      if (state.scenario !== 'conflict') return;
      const candidate = { day: 1, time: '19:30' };
      const originalIndex = state.selectedSlots.findIndex((slot) => slot.day === 1 && slot.time === '19:00');
      if (originalIndex >= 0) {
        state.selectedSlots[originalIndex] = candidate;
      } else if (!isSelected(candidate.day, candidate.time)) {
        if (billableCount() >= maxFixedSlots()) {
          showToast(`固定位课次不足，最多选 ${maxFixedSlots()} 个时段`);
          return;
        }
        state.selectedSlots.push(candidate);
      }
      state.candidateAck = false;
      state.completed = null;
      render(true);
    }

    function resetDemo() {
      state.role = 'monitor';
      state.device = 'mobile';
      state.online = true;
      state.overlay = null;
      state.completed = null;
      state.toast = '';
      applyScenarioPreset('normal', false);
      render(false);
    }

    function setControl(group, value) {
      state.completed = null;
      state.overlay = null;
      state.toast = '';
      if (group === 'role') {
        state.role = value;
        if (value === 'parent') {
          state.overlay = null;
        }
        render(false);
        return;
      }
      if (group === 'mode') {
        state.mode = value;
        state.candidateAck = false;
        state.conflictDetail = null;
        if (value === 'batch_group') {
          if (state.scenario !== 'group-blocked') {
            state.classId = 'ket1';
            state.teacher = state.teacher || 'david';
            state.selectedSlots = [{ day: 5, time: '10:00' }, { day: 6, time: '09:00' }];
            state.scenario = 'group';
          }
        } else if (value === 'group_makeup') {
          state.classId = 'ket1p';
          state.teacher = 'david';
          state.selectedSlots = [];
          state.scenario = 'group-makeup';
        } else {
          state.scenario = 'normal';
          state.selectedSlots = [];
        }
        render(false);
        return;
      }
      if (group === 'device') {
        state.device = value;
        render(false);
        return;
      }
      if (group === 'network') {
        state.online = value === 'on';
        render(false);
      }
    }

    /* ------------------------------------------------------------------
     * 演示控制台
     * ------------------------------------------------------------------ */
    function segment(group, options, activeValue) {
      return `<div class="inline-flex rounded-xl bg-slate-100 p-1">
        ${options.map((option) => `<button data-control="${group}" data-value="${option.value}" class="rounded-lg px-2.5 py-1.5 text-[12px] font-semibold transition ${activeValue === option.value ? 'bg-white text-slate-900' : 'text-slate-600 hover:text-slate-900'}">${option.label}</button>`).join('')}
      </div>`;
    }

    function renderConsole() {
      const scenarios = [
        { value: 'normal', label: '固定位常规' },
        { value: 'hold-shift', label: 'HOLD 平移' },
        { value: 'hold-convert', label: 'HOLD 转正' },
        { value: 'conflict', label: '续费冲突降级' },
        { value: 'insufficient', label: '课次不足' },
        { value: 'group', label: '小班整班' },
        { value: 'group-makeup', label: '小班单节补排' },
        { value: 'group-blocked', label: '小班未委任' },
        { value: 'smart-fixed', label: '智能筛师·固定位' },
        { value: 'smart-temp', label: '智能筛师·临时课' },
        { value: 'teacher-all', label: '全平台老师' },
        { value: 'parent', label: '家长视角' }
      ];
      return `<header class="sticky top-0 z-[60] border-b border-slate-200 bg-white/95 backdrop-blur">
        <div class="mx-auto max-w-[1400px] px-3 py-2.5">
          <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
            <div class="flex min-w-0 items-center gap-2">
              <span class="grid h-6 w-6 shrink-0 place-items-center rounded-lg bg-slate-900 text-[12px] font-bold text-amber-400">D</span>
              <div class="min-w-0">
                <div class="truncate text-[14px] font-bold text-slate-900">排课工作台演示控制台</div>
                <div class="truncate text-[12px] font-medium text-slate-500">沉浸式排课 · 意向交集 · 4 周原子锁定 · 小班双格 · 智能筛师</div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-[12px] font-medium text-slate-500">角色</span>
              ${segment('role', [{ value: 'monitor', label: '班长' }, { value: 'admin', label: '管理员' }, { value: 'parent', label: '家长' }], state.role)}
            </div>
            <div class="flex items-center gap-2">
              <span class="text-[12px] font-medium text-slate-500">模式</span>
              ${segment('mode', [{ value: 'batch_fixed', label: '固定位' }, { value: 'batch_group', label: '小班' }, { value: 'group_makeup', label: '单节补排' }], state.mode)}
            </div>
            <div class="flex items-center gap-2">
              <span class="text-[12px] font-medium text-slate-500">设备</span>
              ${segment('device', [{ value: 'mobile', label: '手机' }, { value: 'tablet', label: '平板' }], state.device)}
            </div>
            <div class="flex items-center gap-2">
              <span class="text-[12px] font-medium text-slate-500">网络</span>
              ${segment('network', [{ value: 'on', label: '在线' }, { value: 'off', label: '离线' }], state.online ? 'on' : 'off')}
            </div>
            <div class="ml-auto flex flex-wrap items-center gap-2">
              <span class="hidden text-[12px] font-medium text-slate-500 xl:inline">${TODAY_LABEL}</span>
              <button data-action="reset-demo" class="rounded-lg border border-slate-200 px-3 py-1.5 text-[12px] font-semibold text-slate-600 transition hover:bg-slate-50">重置演示</button>
              <a href="../docs/prd/m3d_course_scheduling.md" class="rounded-lg border border-slate-200 px-3 py-1.5 text-[12px] font-semibold text-indigo-700 transition hover:bg-indigo-50">PRD 文档</a>
            </div>
          </div>
          <div class="mt-2 flex flex-wrap items-center gap-1.5">
            <span class="mr-1 text-[12px] font-medium text-slate-500">场景</span>
            ${scenarios.map((scenario) => `<button data-scenario="${scenario.value}" class="rounded-lg border px-2 py-1.5 text-[12px] font-semibold transition ${((!isParent() && state.scenario === scenario.value) || (scenario.value === 'parent' && isParent())) ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">${scenario.label}</button>`).join('')}
          </div>
        </div>
      </header>`;
    }

    /* ------------------------------------------------------------------
     * 事件绑定
     * ------------------------------------------------------------------ */
    document.addEventListener('click', (event) => {
      const control = event.target.closest('[data-control]');
      if (control) {
        setControl(control.dataset.control, control.dataset.value);
        return;
      }

      const scenarioButton = event.target.closest('[data-scenario]');
      if (scenarioButton) {
        const scenario = scenarioButton.dataset.scenario;
        state.completed = null;
        state.overlay = null;
        if (scenario === 'parent') {
          state.role = 'parent';
          state.scenario = 'parent';
        } else {
          if (state.role === 'parent') state.role = 'monitor';
          applyScenarioPreset(scenario, false);
        }
        render(false);
        return;
      }

      const trigger = event.target.closest('[data-action]');
      if (!trigger) return;
      const action = trigger.dataset.action;

      if (action === 'open-students') {
        state.overlay = 'students';
        render(true);
      } else if (action === 'open-teachers') {
        state.overlay = 'teachers';
        render(true);
      } else if (action === 'open-rules') {
        state.overlay = 'rules';
        render(true);
      } else if (action === 'open-smart-fixed') {
        if (!state.selectedSlots.length) {
          showToast('请先在网格中勾选 1~N 个每周时段');
          return;
        }
        state.overlay = 'smart-fixed';
        render(true);
      } else if (action === 'open-temp-smart') {
        state.overlay = 'temp-smart';
        state.tempPick = null;
        render(true);
      } else if (action === 'close-overlay') {
        state.overlay = null;
        state.tempPick = null;
        render(true);
      } else if (action === 'select-student') {
        chooseStudent(trigger.dataset.key);
      } else if (action === 'select-teacher') {
        chooseTeacher(trigger.dataset.key);
      } else if (action === 'smart-teacher') {
        chooseSmartTeacher(trigger.dataset.key);
      } else if (action === 'smart-fixed-course') {
        state.smartCourse = trigger.dataset.value;
        render(true);
      } else if (action === 'temp-date') {
        state.temp.offset = Number(trigger.dataset.value);
        state.tempPick = null;
        render(true);
      } else if (action === 'temp-start') {
        state.temp.start = trigger.dataset.value;
        state.tempPick = null;
        render(true);
      } else if (action === 'temp-duration') {
        state.temp.duration = Number(trigger.dataset.value);
        state.tempPick = null;
        render(true);
      } else if (action === 'temp-course') {
        state.temp.course = trigger.dataset.value;
        state.tempPick = null;
        render(true);
      } else if (action === 'temp-book') {
        if (!tempCreditsEnough()) {
          showToast(`学员临时课次不足，连续 ${state.temp.duration / 30} 节暂不可预约`);
          return;
        }
        state.tempPick = { teacher: trigger.dataset.key };
        state.overlay = 'temp-confirm';
        render(true);
      } else if (action === 'confirm-temp') {
        confirmTempBooking();
      } else if (action === 'pick-slot') {
        pickFixedSlot(Number(trigger.dataset.day), trigger.dataset.time);
      } else if (action === 'pick-group-slot') {
        pickGroupSlot(Number(trigger.dataset.day), trigger.dataset.time);
      } else if (action === 'remove-slot') {
        removeSlot(Number(trigger.dataset.day), trigger.dataset.time);
        state.completed = null;
        render(true);
      } else if (action === 'clear-slots') {
        state.selectedSlots = [];
        state.candidateAck = false;
        state.completed = null;
        state.toast = '';
        render(true);
      } else if (action === 'adopt-candidate') {
        adoptCandidate();
      } else if (action === 'contact-parent') {
        showToast('已生成联系提醒，家长端将同步展示备选时段');
      } else if (action === 'confirm-booking') {
        confirmBooking();
      } else if (action === 'reset-demo') {
        resetDemo();
      }
    });

    document.addEventListener('change', (event) => {
      if (event.target && event.target.id === 'candidateAck') {
        state.candidateAck = event.target.checked;
        render(true);
      }
    });

    render(false);
  </script>
</body>
</html>

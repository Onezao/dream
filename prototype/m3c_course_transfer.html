<head>

</head>
<body class="bg-slate-200 text-slate-800 min-h-screen">

<header class="bg-white border-b border-slate-200 px-3 py-2 sticky top-0 z-50 flex flex-wrap gap-2 items-center justify-between text-xs shadow-sm">
  <div class="flex items-center gap-2">
    <span class="font-bold text-slate-900 flex items-center gap-1.5">
      <i data-lucide="arrow-left-right" class="w-4 h-4 text-teal-700"></i>M3C 课程转让与权益交割
    </span>
    <div class="inline-flex rounded-lg bg-slate-100 p-0.5" id="roleSwitch"></div>
    <div class="inline-flex rounded-lg bg-slate-100 p-0.5" id="viewSwitch"></div>
    <div class="inline-flex rounded-lg bg-slate-100 p-0.5" id="deviceSwitch"></div>
  </div>
  <div class="flex items-center gap-2">
    <span class="text-sm text-slate-400">场景</span>
    <div class="inline-flex rounded-lg bg-slate-100 p-0.5" id="scenarioSwitch"></div>
    <button onclick="resetPrototype()" class="px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm flex items-center gap-1 transition">
      <i data-lucide="rotate-ccw" class="w-3 h-3"></i>重置
    </button>
  </div>
</header>

<main class="flex justify-center py-4">
  <div id="frame" class="relative w-[390px] max-w-full bg-white rounded-2xl shadow-xl overflow-hidden min-h-[840px] flex flex-col border border-slate-300/60 transition-all">

    <div id="appHeader" class="bg-teal-700 text-white px-4 py-2.5 flex items-center justify-between shrink-0 transition-colors">
      <div class="flex items-center gap-2.5">
        <div id="roleAvatar" class="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center font-bold text-sm">A</div>
        <div>
          <div id="roleTitle" class="text-xs font-semibold leading-tight">Amy · 家长工作台</div>
          <div id="roleSub" class="text-xs text-teal-100">转出方 · 出资家长 · 固定位流转</div>
        </div>
      </div>
      <div id="topHeaderRight" class="flex items-center gap-1.5"></div>
    </div>

    <div id="scenarioBanner" class="px-4 py-2 bg-amber-50 border-b border-amber-200 text-amber-900 text-sm flex items-center justify-between shrink-0">
      <span class="flex items-center gap-1.5 truncate">
        <i data-lucide="shield-check" class="w-3.5 h-3.5 text-amber-600 shrink-0"></i>
        <span id="scenarioBannerText">距开课 48 小时，仅 1v1 固定位可发起转让</span>
      </span>
      <span id="scenarioTag" class="text-xs px-1.5 py-0.5 rounded bg-amber-200 text-amber-900 font-bold shrink-0">≥3h</span>
    </div>

    <div id="content" class="flex-1 overflow-y-auto p-3.5 space-y-3"></div>

    <div id="toast" class="hidden absolute left-1/2 -translate-x-1/2 bottom-12 bg-slate-900/95 text-white text-xs rounded-xl px-4 py-2.5 z-[100] shadow-xl max-w-[90%] text-center flex items-center gap-2">
      <i data-lucide="info" class="w-4 h-4 shrink-0 text-amber-400"></i>
      <span id="toastText">提示内容</span>
    </div>

    <div id="transferModal" class="hidden absolute inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-3">
      <div id="transferDialog" class="bg-white rounded-2xl p-4 w-full max-w-sm shadow-2xl max-h-[92%] overflow-y-auto"></div>
    </div>

    <div id="confirmModal" class="hidden absolute inset-0 z-[60] bg-slate-900/70 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl p-4 w-full max-w-xs shadow-2xl space-y-3 text-xs">
        <div class="text-center space-y-1">
          <div class="w-10 h-10 rounded-full bg-rose-100 text-rose-600 mx-auto grid place-items-center">
            <i data-lucide="alert-octagon" class="w-5 h-5"></i>
          </div>
          <h4 class="font-bold text-slate-900 text-sm">确认转让给该学员吗</h4>
          <p class="text-xs text-slate-500">提交后立即生效，此操作不可撤销</p>
        </div>
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-1.5 text-sm">
          <div class="flex justify-between">
            <span class="text-slate-400">转出课次</span>
            <span id="confirmLessonTime" class="font-semibold text-slate-800">2026-11-14 16:00</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400">授课教师</span>
            <span class="font-semibold text-slate-800">David Miller</span>
          </div>
          <div class="flex justify-between border-t border-slate-200 pt-1.5">
            <span class="text-slate-400">接收学员</span>
            <span id="confirmRecipient" class="font-bold text-rose-700">TomZ11（男，11岁）</span>
          </div>
        </div>
        <p class="text-xs text-rose-700 bg-rose-50 p-2 rounded-lg leading-relaxed">
          请确认线下资金已交割完毕。划转后原课格清空，受让方课表加注【转】字角标，且全端禁止二次转让。
        </p>
        <div class="flex gap-2 pt-1">
          <button onclick="closeModal('confirmModal')" class="flex-1 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 font-medium text-slate-700 transition">再核对一下</button>
          <button onclick="commitExternalTransfer()" class="flex-1 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold shadow-sm transition">我已核实，确认交割</button>
        </div>
      </div>
    </div>

    <div id="detailModal" class="hidden absolute inset-0 z-50 bg-slate-900/60 flex items-end justify-center">
      <div id="detailBody" class="bg-white rounded-t-3xl p-4 w-full max-w-sm shadow-2xl max-h-[88%] overflow-y-auto"></div>
    </div>

    <div id="memoModal" class="hidden absolute inset-0 z-[60] bg-slate-900/60 flex items-end justify-center">
      <div id="memoBody" class="bg-white rounded-t-3xl p-4 w-full max-w-sm shadow-2xl max-h-[88%] overflow-y-auto"></div>
    </div>

    <div id="monitorModal" class="hidden absolute inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-3">
      <div id="monitorBody" class="bg-white rounded-2xl p-4 w-full max-w-sm shadow-2xl max-h-[92%] overflow-y-auto"></div>
    </div>

    <div id="rescheduleModal" class="hidden absolute inset-0 z-50 bg-slate-900/60 flex items-end justify-center">
      <div id="rescheduleBody" class="bg-white rounded-t-3xl p-4 w-full max-w-sm shadow-2xl max-h-[88%] overflow-y-auto"></div>
    </div>

  </div>
</main>

<script>
const STUDENTS = {
  AliceZ12: { nickname: 'AliceZ12', gender: '女', age: 12, grade: '六年级', parent: 'Amy', account: 'amy', focus: '英语 KET 精读', level: 'KET 卓越', match: true },
  BobZ10: { nickname: 'BobZ10', gender: '男', age: 10, grade: '四年级', parent: 'Amy', account: 'amy', focus: '英语 KET 基础', level: 'KET 备考', match: true },
  CharlieZ08: { nickname: 'CharlieZ08', gender: '男', age: 8, grade: '二年级', parent: 'Amy', account: 'amy', focus: '英语启蒙', level: 'Starters', match: false },
  TomZ11: { nickname: 'TomZ11', gender: '男', age: 11, grade: '五年级', parent: 'Helen', account: 'helen', focus: '英语 KET 精读', level: 'KET 卓越', match: true },
  CatherineW09: { nickname: 'CatherineW09', gender: '女', age: 9, grade: '三年级', parent: 'Eva', account: 'eva', focus: '英语 PET 冲刺', level: 'PET 预备', match: false }
};

const FIXED = {
  id: 'TS_20261114_1600',
  date: '2026-11-14',
  weekday: '周六',
  time: '16:00-16:30',
  type: 'fixed',
  course: '1v1 英语 KET 精读',
  teacher: 'David Miller',
  student: 'AliceZ12',
  room: 'ClassIn A-302',
  orderId: 'ORD_20261102_0091',
  funder: 'Amy',
  holder: 'Leo 班长'
};

const TEMP = {
  id: 'TS_20261114_1700',
  date: '2026-11-14',
  weekday: '周六',
  time: '17:00-17:30',
  type: 'temp',
  course: '1v1 临时口语强化',
  teacher: 'David Miller',
  student: 'AliceZ12',
  room: 'ClassIn A-302',
  orderId: 'ORD_20261102_0091',
  funder: 'Amy',
  holder: 'Leo 班长'
};

const DEFAULT_TRANSFER = {
  from: 'AliceZ12',
  to: 'TomZ11',
  type: 'external',
  operator: 'Amy',
  at: '2026-11-05 10:20',
  note: '微信群已线下结清，转给同群 TomZ11'
};

const WEEK = [
  { date: '2026-11-09', weekday: '周一', label: '11-09' },
  { date: '2026-11-10', weekday: '周二', label: '11-10' },
  { date: '2026-11-11', weekday: '周三', label: '11-11' },
  { date: '2026-11-12', weekday: '周四', label: '11-12' },
  { date: '2026-11-13', weekday: '周五', label: '11-13' },
  { date: '2026-11-14', weekday: '周六', label: '11-14' },
  { date: '2026-11-15', weekday: '周日', label: '11-15' }
];

const TIME_SLOTS = [
  '08:00', '08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '11:30',
  '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00', '17:30',
  '18:00', '18:30', '19:00', '19:30', '20:00', '20:30', '21:00'
];

const CELL_STYLES = {
  ORANGE: 'bg-amber-500 text-white',
  YELLOW: 'bg-yellow-400 text-gray-900',
  BLUE: 'bg-blue-500 text-white',
  PURPLE: 'bg-purple-600 text-white',
  GREEN: 'bg-emerald-500 text-white',
  GRAY: 'bg-slate-100 text-slate-400',
  RED: 'bg-rose-500 text-white'
};

const LEGEND = [
  ['bg-amber-500', '固定位'],
  ['bg-yellow-400', '临时课'],
  ['bg-blue-500', '被代课'],
  ['bg-emerald-500', '空闲可约'],
  ['bg-rose-500', '已请假'],
  ['bg-slate-200', '不可约']
];

const ROLES = {
  amy: { name: 'Amy', title: 'Amy · 家长工作台', sub: '转出方 · 出资家长 · 固定位流转', avatar: 'A', theme: 'bg-teal-700', badge: '转出方' },
  helen: { name: 'Helen', title: 'Helen · 家长工作台', sub: '受让方 · 课次接收 · 资金不变', avatar: 'H', theme: 'bg-emerald-700', badge: '受让方' },
  david: { name: 'David Miller', title: 'David Miller · 教师课表', sub: '授课教师 · 学员变更与备课', avatar: 'D', theme: 'bg-slate-800', badge: '教师端' },
  leo: { name: 'Leo', title: 'Leo · 班长工作台', sub: '代办经办 · 资金持有方', avatar: 'L', theme: 'bg-indigo-900', badge: '班长端' }
};

const INIT = {
  role: 'amy',
  view: 'calendar',
  device: 'phone',
  scenario: 'normal',
  amyActive: 'AliceZ12',
  auditTab: 'out',
  selectedDate: '2026-11-14',
  selectedLesson: 'fixed',
  transferTab: 'family',
  nickInput: 'TomZ11',
  verified: null,
  verifyError: null,
  transfer: null,
  rescheduleCount: 0
};

let S = Object.assign({}, INIT);
let toastTimer = null;

const $ = (id) => document.getElementById(id);

function ico() {
  if (window.lucide) window.lucide.createIcons();
}

function escapeHtml(value) {
  return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function stamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function activeTransfer() {
  if (S.scenario === 'transferred' && !S.transfer) return DEFAULT_TRANSFER;
  return S.transfer;
}

function currentStudent() {
  if (S.role === 'amy') return S.amyActive;
  if (S.role === 'helen') return 'TomZ11';
  return null;
}

function fixedLesson() {
  const t = activeTransfer();
  return Object.assign({}, FIXED, {
    isTransferred: !!t,
    actualStudent: t ? t.to : FIXED.student,
    originalStudent: t ? t.from : null,
    hours: S.scenario === 'locked' ? 2 : 48,
    rescheduleCount: S.rescheduleCount
  });
}

function toast(message) {
  const el = $('toast');
  $('toastText').textContent = message;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
}

function closeModal(id) {
  $(id).classList.add('hidden');
}

function closeAllModals() {
  ['transferModal', 'confirmModal', 'detailModal', 'memoModal', 'monitorModal', 'rescheduleModal'].forEach((id) => {
    const el = $(id);
    if (el) el.classList.add('hidden');
  });
}

function setRole(role) {
  S.role = role;
  closeAllModals();
  renderAll();
}

function setView(view) {
  S.view = view;
  renderAll();
}

function setDevice(device) {
  S.device = device;
  $('frame').className = `relative ${device === 'tablet' ? 'w-[760px]' : 'w-[390px]'} max-w-full bg-white rounded-2xl shadow-xl overflow-hidden min-h-[840px] flex flex-col border border-slate-300/60 transition-all`;
  renderAll();
}

function setScenario(key) {
  S.scenario = key;
  S.rescheduleCount = 0;
  S.view = 'calendar';
  if (key === 'transferred') {
    S.transfer = Object.assign({}, DEFAULT_TRANSFER);
    S.role = 'helen';
  } else {
    S.transfer = null;
    S.role = 'amy';
    S.amyActive = 'AliceZ12';
  }
  closeAllModals();
  renderAll();
}

function setAmyStudent(nickname) {
  S.amyActive = nickname;
  renderAll();
}

function selectDate(date) {
  S.selectedDate = date;
  renderAll();
}

function resetPrototype() {
  S = Object.assign({}, INIT);
  closeAllModals();
  $('frame').className = 'relative w-[390px] max-w-full bg-white rounded-2xl shadow-xl overflow-hidden min-h-[840px] flex flex-col border border-slate-300/60 transition-all';
  renderAll();
}

function renderControls() {
  const roleButtons = [
    ['amy', 'Amy 转出方'],
    ['helen', 'Helen 受让方'],
    ['david', 'David 教师'],
    ['leo', 'Leo 班长']
  ];
  $('roleSwitch').innerHTML = roleButtons.map(([key, label]) => (
    `<button onclick="setRole('${key}')" class="px-2 py-1 rounded-md transition ${S.role === key ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'}">${label}</button>`
  )).join('');

  const views = S.role === 'david'
    ? [['calendar', '课表'], ['audit', '通知']]
    : [['calendar', '课表'], ['audit', S.role === 'leo' ? '转让审计' : '转让明细']];
  $('viewSwitch').innerHTML = views.map(([key, label]) => (
    `<button onclick="setView('${key}')" class="px-2 py-1 rounded-md transition ${S.view === key ? 'bg-white text-slate-900 shadow-sm font-semibold' : 'text-slate-500 hover:text-slate-800'}">${label}</button>`
  )).join('');

  $('deviceSwitch').innerHTML = [['phone', '手机'], ['tablet', '平板']].map(([key, label]) => (
    `<button onclick="setDevice('${key}')" class="px-2 py-1 rounded-md transition ${S.device === key ? 'bg-white text-slate-900 shadow-sm font-semibold' : 'text-slate-500 hover:text-slate-800'}">${label}</button>`
  )).join('');

  const scenarios = [
    ['normal', '正常 ≥3h'],
    ['locked', '开课 <3h'],
    ['transferred', '已受让']
  ];
  $('scenarioSwitch').innerHTML = scenarios.map(([key, label]) => (
    `<button onclick="setScenario('${key}')" class="px-2 py-1 rounded-md transition ${S.scenario === key ? 'bg-amber-500 text-white shadow-sm font-semibold' : 'text-slate-500 hover:text-slate-800'}">${label}</button>`
  )).join('');
}

function renderHeader() {
  const role = ROLES[S.role];
  const header = $('appHeader');
  header.className = `${role.theme} text-white px-4 py-2.5 flex items-center justify-between shrink-0 transition-colors`;
  $('roleAvatar').textContent = role.avatar;
  $('roleTitle').textContent = role.title;
  $('roleSub').textContent = role.sub;

  let profile = '';
  if (S.role === 'amy') {
    profile = `
      <div class="flex items-center bg-white/15 rounded-lg px-2 py-1 text-sm">
        <span class="text-white/80 mr-1">档案</span>
        <select onchange="setAmyStudent(this.value)" class="bg-transparent text-white font-medium outline-none cursor-pointer">
          ${['AliceZ12', 'BobZ10', 'CharlieZ08'].map((nick) => `<option value="${nick}" class="text-slate-900" ${S.amyActive === nick ? 'selected' : ''}>${nick}</option>`).join('')}
        </select>
      </div>`;
  } else if (S.role === 'helen') {
    profile = `<span class="text-xs px-2 py-1 rounded-lg bg-white/15 font-mono">TomZ11</span>`;
  }
  $('topHeaderRight').innerHTML = `${profile}<span class="text-xs px-2 py-0.5 rounded-full bg-white/20 font-medium">${role.badge}</span>`;
}

function renderBanner() {
  const banner = $('scenarioBanner');
  let text = '距开课 48 小时，仅 1v1 固定位可发起转让';
  let tag = '≥3h';
  let cls = 'px-4 py-2 bg-amber-50 border-b border-amber-200 text-amber-900 text-sm flex items-center justify-between shrink-0';
  let icon = 'shield-check';
  let iconCls = 'text-amber-600';

  if (S.role === 'david') {
    const t = activeTransfer();
    text = t ? `学员变更已送达：${t.from} 变更为 ${t.to}，请提前备课` : '本周课程正常，暂无学员变更通知';
    tag = t ? '变更' : '教师端';
    cls = t ? 'px-4 py-2 bg-rose-50 border-b border-rose-200 text-rose-900 text-sm flex items-center justify-between shrink-0' : cls;
    icon = t ? 'bell' : 'calendar-check';
    iconCls = t ? 'text-rose-600' : 'text-amber-600';
  } else if (S.role === 'leo') {
    text = '资金持有方永久锁定，转让只改实际上课学员';
    tag = '财课分离';
  } else if (S.scenario === 'locked') {
    text = '距开课不足 3 小时，转让入口已物理锁死';
    tag = '<3h';
    cls = 'px-4 py-2 bg-rose-50 border-b border-rose-200 text-rose-900 text-sm flex items-center justify-between shrink-0';
    icon = 'lock';
    iconCls = 'text-rose-600';
  } else if (activeTransfer()) {
    text = '受让课次已标记【转】，全端禁止二次转让，保留 1 次同师挪位';
    tag = 'is_transferred';
    cls = 'px-4 py-2 bg-emerald-50 border-b border-emerald-200 text-emerald-900 text-sm flex items-center justify-between shrink-0';
    icon = 'badge-check';
    iconCls = 'text-emerald-600';
  }

  banner.className = cls;
  banner.innerHTML = `
    <span class="flex items-center gap-1.5 truncate">
      <i data-lucide="${icon}" class="w-3.5 h-3.5 ${iconCls} shrink-0"></i>
      <span>${text}</span>
    </span>
    <span class="text-xs px-1.5 py-0.5 rounded bg-white/70 text-slate-700 font-bold shrink-0">${tag}</span>`;
}

function dayStrip() {
  const hasLesson = !!activeTransfer() || S.scenario !== 'transferred';
  return `
    <div class="grid grid-cols-7 gap-1">
      ${WEEK.map((d) => {
        const active = S.selectedDate === d.date;
        const dot = d.date === '2026-11-14' && hasLesson;
        return `
          <button onclick="selectDate('${d.date}')" class="relative rounded-xl py-1.5 text-center transition ${active ? 'bg-teal-700 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
            <div class="text-sm font-bold ${active ? 'text-teal-100' : 'text-slate-400'}">${d.weekday}</div>
            <div class="text-sm font-semibold">${d.label.slice(3)}</div>
            ${dot ? `<span class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full ${active ? 'bg-amber-300' : 'bg-amber-500'}"></span>` : ''}
          </button>`;
      }).join('')}
    </div>`;
}

function weekHeader() {
  return `
    <div class="flex items-center justify-between">
      <button onclick="toast('原型固定演示 2026 年第 46 周')" class="p-1 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 text-slate-600">
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
      </button>
      <div class="text-center">
        <div class="text-xs font-bold text-slate-800">2026 年第 46 周</div>
        <div class="text-xs text-slate-400 mt-0.5">11-09 周一 至 11-15 周日</div>
      </div>
      <button onclick="toast('原型固定演示 2026 年第 46 周')" class="p-1 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 text-slate-600">
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>
    </div>`;
}

function lessonCardHTML(lesson) {
  const isTemp = lesson.type === 'temp';
  const base = isTemp
    ? 'bg-yellow-400 text-gray-900 border-yellow-500'
    : 'bg-amber-500 text-white border-amber-600';

function buildGrid() {
  const grid = {};
  const transfer = activeTransfer();
  const lesson = fixedLesson();
  const student = currentStudent();
  const teacherLike = S.role === 'david' || S.role === 'leo';

  WEEK.forEach((day) => {
    grid[day.date] = {};
    TIME_SLOTS.forEach((time) => {
      const hour = Number(time.split(':')[0]);
      const open = hour >= 14 && hour < 18;
      grid[day.date][time] = {
        kind: open ? 'free' : 'rest',
        color: open ? 'GREEN' : 'GRAY',
        text: open ? '约' : '休',
        title: open ? '空闲可约' : '教师未开放'
      };
    });
  });

  grid['2026-11-12']['17:00'] = {
    kind: 'leave',
    color: 'RED',
    text: '假',
    title: '教师已请假'
  };

  let showFixed = false;
  let isTransferred = false;
  if (teacherLike) {
    showFixed = true;
    isTransferred = lesson.isTransferred;
  } else if (transfer) {
    if (student === transfer.to) {
      showFixed = true;
      isTransferred = true;
    }
  } else if (student === 'AliceZ12') {
    showFixed = true;
  }

  if (showFixed) {
    grid['2026-11-14']['16:00'] = {
      kind: 'fixed',
      color: 'ORANGE',
      text: (lesson.actualStudent || lesson.student).slice(0, 4),
      title: `1v1 固定位 · ${lesson.actualStudent || lesson.student} · ${lesson.teacher}${isTransferred ? ' · 受让课次' : ''}`,
      transferred: isTransferred
    };
  } else if (transfer && student === transfer.from) {
    grid['2026-11-14']['16:00'].title = `原固定位已转给 ${transfer.to}，恢复空闲`;
  }

  const showTemp = teacherLike || student === 'AliceZ12';
  if (showTemp) {
    grid['2026-11-14']['17:00'] = {
      kind: 'temp',
      color: 'YELLOW',
      text: TEMP.student.slice(0, 4),
      title: `1v1 临时课 · ${TEMP.student} · ${TEMP.teacher}`
    };
  }

  return grid;
}

function detailActions(lesson) {
  const isTemp = lesson.type === 'temp';
  const isTransferred = lesson.isTransferred;
  const canReschedule = !isTemp && lesson.rescheduleCount === 0 && lesson.hours >= 3;

  if (S.role === 'david') {
    return `<button onclick="openMemo()" class="w-full rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold py-2.5 transition">查看学员留言板</button>`;
  }
  if (S.role === 'leo') {
    if (isTemp) {
      return `<div class="rounded-xl border border-yellow-200 bg-yellow-50 p-3 text-sm text-yellow-900 leading-relaxed">临时课仅支持请假退期待排，不可代办转让。</div>`;
    }
    return `<button onclick="openMonitorModal()" ${isTransferred ? 'disabled' : ''} class="w-full rounded-xl text-xs font-bold py-2.5 transition ${isTransferred ? 'bg-slate-100 text-slate-400' : 'bg-indigo-900 hover:bg-indigo-800 text-white'}">${isTransferred ? '该课次已完成代办交割' : '后台协助转让'}</button>`;
  }

  if (isTemp) {
    return `
      <div class="rounded-xl border border-yellow-200 bg-yellow-50 p-3 text-sm text-yellow-900 leading-relaxed">
        临时课仅支持请假退期待排，不可发起转让。
      </div>`;
  }

  const rescheduleButton = canReschedule
    ? `<button onclick="openReschedule()" class="w-full rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold py-2.5 transition">同师挪位，剩 1 次</button>`
    : `<button disabled class="w-full rounded-xl bg-slate-100 text-slate-400 text-xs font-semibold py-2.5">${lesson.rescheduleCount >= 1 ? '该课次已挪位，不可再次挪位' : '当前不可挪位'}</button>`;

    return `
      <button disabled class="w-full rounded-xl bg-slate-100 text-slate-400 text-xs font-bold py-2.5">受让课程不可二次转让</button>

  return `

function renderTransferDialog() {
  $('transferDialog').innerHTML = transferDialogHTML();
  ico();
}

function openTransferModal() {
  const lesson = fixedLesson();
  if (lesson.type === 'temp') return toast('临时课不可转让');
  if (lesson.isTransferred) return toast('受让课程不可二次转让');
  if (lesson.hours < 3) return toast('开课前 3 小时内锁定，禁止转让');
  S.transferTab = 'family';
  S.verified = null;
  S.verifyError = null;
  S.nickInput = 'TomZ11';
  renderTransferDialog();
  $('transferModal').classList.remove('hidden');
  ico();
}

function switchTransferTab(tab) {
  S.transferTab = tab;
  S.verified = null;
  S.verifyError = null;
  renderTransferDialog();
}

function onNickInput(value) {
  S.nickInput = value;
  S.verified = null;
  S.verifyError = null;
  const feedback = $('verifyFeedback');
  if (feedback) feedback.innerHTML = '';
  const button = $('confirmExternalBtn');
  if (button) {
    button.disabled = true;
    button.className = 'flex-1 py-2 rounded-xl text-xs font-bold transition bg-slate-100 text-slate-400 cursor-not-allowed';
  }
}

function verifyNickname() {
  const raw = (S.nickInput || '').trim();
  S.verified = null;
  S.verifyError = null;

  if (!/^[A-Za-z]+[A-Za-z][0-9]{1,2}$/.test(raw)) {
    S.verifyError = '未找到该学员，请核对昵称格式。';
    renderTransferDialog();
    return;
  }

  const found = Object.values(STUDENTS).find((s) => s.nickname.toLowerCase() === raw.toLowerCase());
  if (!found) {
    S.verifyError = '未找到该学员，请核对昵称格式。';
    renderTransferDialog();
    return;
  }
  if (found.nickname === currentStudent()) {
    S.verifyError = '禁止自己转给自己，请选择其他学员。';
    renderTransferDialog();
    return;
  }

  S.verified = found;
  renderTransferDialog();
}

function showConfirmModal() {
  if (!S.verified) return;
  const lesson = fixedLesson();
  $('confirmLessonTime').textContent = `${lesson.date} ${lesson.time}`;
  $('confirmRecipient').textContent = `${S.verified.nickname}（${S.verified.gender}，${S.verified.age}岁）`;

  ico();

        学员变更：${transfer.from} 已转让给 ${transfer.to}。请按 ${transfer.to} 的进度备课。
      </div>` : ''}
    <div class="rounded-xl border border-slate-200 bg-slate-50 p-3 space-y-1.5 text-sm">
      <div class="flex items-center justify-between"><span class="text-slate-400">学员昵称</span><span class="font-mono font-semibold">${student.nickname}</span></div>
      <div class="flex items-center justify-between"><span class="text-slate-400">性别与年龄</span><span>${student.gender} · ${student.age}岁</span></div>
      <div class="flex items-center justify-between"><span class="text-slate-400">年级</span><span>${student.grade}</span></div>
      <div class="flex items-center justify-between"><span class="text-slate-400">当前水平</span><span class="text-emerald-700 font-medium">${student.level}</span></div>
      <div class="flex items-center justify-between"><span class="text-slate-400">学习重点</span><span>${student.focus}</span></div>
    </div>
    <div class="rounded-xl border border-teal-200 bg-teal-50 p-2.5 text-sm text-teal-900 space-y-1">
      <div class="flex items-center justify-between text-xs text-teal-700 font-medium"><span>转让方留言</span><span>${transfer ? transfer.at : '暂无'}</span></div>
      <p class="text-xs leading-relaxed">${transfer ? transfer.note : '本周暂无转让留言。'}</p>
    </div>
    <button onclick="closeModal('memoModal')" class="w-full rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium py-2.5 transition">已了解学情并备课</button>`;
  $('memoModal').classList.remove('hidden');
  ico();
}

function openReschedule() {
  const lesson = fixedLesson();
  if (lesson.rescheduleCount >= 1) return toast('该课次已挪位，不可再次挪位');
  if (lesson.hours < 3) return toast('开课前 3 小时内不可挪位');
  const slots = [
    { date: '11-12 周四', time: '18:00-18:30' },
    { date: '11-16 周一', time: '16:00-16:30' },
    { date: '11-17 周二', time: '17:30-18:00' }
  ];
  $('rescheduleBody').innerHTML = `
    <div class="flex items-start justify-between pb-2 border-b border-slate-100">
      <div>
        <h4 class="font-bold text-slate-900 text-sm">同师挪位</h4>
        <p class="text-xs text-slate-400">David Miller · 前后 7 天内空闲格 · 仅限 1 次</p>
      </div>
      <button onclick="closeModal('rescheduleModal')" class="w-7 h-7 rounded-full bg-slate-100 text-slate-400 hover:text-slate-700 grid place-items-center">
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
      </button>
    </div>
    <div class="space-y-2">
      ${slots.map((s) => `
        <button onclick="commitReschedule('${s.date} ${s.time}')" class="w-full flex items-center justify-between rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-sm hover:bg-emerald-100 transition">
          <span class="font-medium text-emerald-900">${s.date} · ${s.time}</span>
          <span class="text-xs text-emerald-700 font-semibold">选择</span>
        </button>`).join('')}
    </div>
    <p class="text-xs text-slate-400 mt-2">挪位不改变授课教师、出资家长与资金持有方。</p>`;
  $('rescheduleModal').classList.remove('hidden');
  ico();
}

function commitReschedule(slot) {
  S.rescheduleCount = 1;
  closeAllModals();
  renderAll();
  toast(`已提交同师挪位申请：${slot}`);
}

renderAll();
</script>
</body>
</html>

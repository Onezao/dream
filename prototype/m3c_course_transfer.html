    function isoToTs(iso) { return Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10))); }
    function isoAdd(iso, days) { return new Date(isoToTs(iso) + days * 86400000).toISOString().slice(0, 10); }
    function weekdayLabel(iso) { return DAY_LABELS[(new Date(isoToTs(iso)).getUTCDay() + 6) % 7]; }
    function fmtDate(iso) { return `${iso.slice(5)} (${weekdayLabel(iso)})`; }
    function endTime(time) {
      const [h, m] = time.split(':').map(Number);
      const total = h * 60 + m + 30;
      return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;

        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') { state.modal = null; state.confirmOpen = false; }

          if (value === 'off') showToast('离线只读：转让 / 验证 / 代办 / 挪位不可用');

        if (group === 'scenario') setScenario(value);
      });

      state.role = role;
      state.page = 'board';
      state.navTab = boardTab();
      state.modal = null;
      state.confirmOpen = false;
      if (role === 'helen') state.auditTab = 'in';
      if (role === 'amy') state.auditTab = state.transfer && state.amyActive === state.transfer.to ? 'in' : 'out';
      renderAll();
    }

    function navTo(tab) {
      const item = navItems().find((n) => n.id === tab);
      if (!item) return;
      state.modal = null;
      state.confirmOpen = false;
      if (item.board) {
        state.page = 'board';
        state.navTab = tab;
        state.view = 'calendar';
      } else {
        state.page = 'placeholder';
        state.navTab = tab;
      }
      renderAll();

        state.role = 'amy';
        state.amyActive = 'AliceZ12';
        state.auditTab = 'out';
      }
      state.navTab = boardTab();
      renderAll();
    }

    function resetDemo() {
      state.role = 'amy';
      state.view = 'calendar';
      state.page = 'board';
      state.navTab = 'schedule';
      state.device = 'mobile';
      state.online = 'on';
      state.scenario = 'normal';
      state.amyActive = 'AliceZ12';
      state.transfer = null;
      state.rescheduleCount = 0;
      state.modal = null;
      state.confirmOpen = false;
      state.lessonKind = 'fixed';
      state.transferTab = 'family';
      state.nickInput = 'TomZ11';
      state.verified = null;
      state.verifyError = null;
      state.auditTab = 'out';
      renderAll();
      showToast('演示数据已重置');
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const active = String(state[b.dataset.group]) === String(b.dataset.value);
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;
      });
    }

    /* ------------------------------------------------------------------
     * 外壳
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      $('banner').innerHTML = renderBanner();
      $('scenarioBanner').innerHTML = renderScenarioBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线只读：可查看课表与转让明细，转让 / 验证 / 代办 / 挪位不可用`
        : '';

      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = renderNav();
      $('overlay').innerHTML = renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function renderBanner() {
      const b = roleMeta();
      return `<header class="relative flex h-[68px] shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${b.gradient} px-4 text-white">
        ${b.pattern}
        <div class="relative flex min-w-0 items-center gap-2.5">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${b.initial}</span>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="truncate text-[16px] font-bold">${esc(b.brand)}</span>
              <span class="shrink-0 rounded-full bg-white/20 px-2 py-0.5 text-[12px] font-bold">${esc(b.role)}</span>
            </div>
            <div class="truncate text-[12px] text-white/70">${esc(b.subtitle)}</div>
          </div>
        </div>
        <button data-action="toast" data-message="暂无新消息" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
          ${icon('bell', 'h-4 w-4')}
          <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-rose-400 ring-1 ring-white/50"></span>
        </button>
      </header>`;
    }

    function renderScenarioBanner() {
      let text = '距开课 48 小时 · 仅 1v1 固定位可转让';
      let tag = '≥3h';
      let cls = 'border-emerald-200 bg-emerald-50 text-emerald-900';
      let tagCls = 'bg-emerald-200 text-emerald-900';
      let iconName = 'shield-check';

      if (state.role === 'david') {
        const t = activeTransfer();
        text = t ? `学员变更已送达：${t.from} 变更为 ${t.to}，请提前备课` : '本周课程正常，暂无学员变更通知';
        tag = t ? '变更' : '教师端';
        cls = t ? 'border-rose-200 bg-rose-50 text-rose-900' : 'border-slate-200 bg-slate-50 text-slate-700';
        tagCls = t ? 'bg-rose-200 text-rose-900' : 'bg-slate-200 text-slate-700';
        iconName = t ? 'bell' : 'calendar-check';
      } else if (state.role === 'leo') {
        text = '资金持有方保持不变，转让只改实际上课学员';
        tag = '财课分离';
        cls = 'border-indigo-200 bg-indigo-50 text-indigo-900';
        tagCls = 'bg-indigo-200 text-indigo-900';
        iconName = 'lock';
      } else if (state.scenario === 'locked') {
        text = '距开课不足 3 小时，已进入授课准备期，转让已截止';
        tag = '<3h';
        cls = 'border-rose-200 bg-rose-50 text-rose-900';
        tagCls = 'bg-rose-200 text-rose-900';
        iconName = 'clock-alert';
      } else if (activeTransfer()) {
        text = '受让课次已标记【转】，不可二次转让，保留 1 次同师挪位';
        tag = '已受让';
        cls = 'border-emerald-200 bg-emerald-50 text-emerald-900';
        tagCls = 'bg-emerald-200 text-emerald-900';
        iconName = 'badge-check';
      }

      return `<div class="flex items-center justify-between gap-2 border-b px-3 py-2 ${cls}">
        <div class="flex min-w-0 items-center gap-1.5 text-[12px] font-medium leading-relaxed">
          ${icon(iconName, 'h-3.5 w-3.5 shrink-0')}
          <span class="min-w-0">${esc(text)}</span>
        </div>
        <span class="shrink-0 rounded px-1.5 py-0.5 text-[12px] font-bold ${tagCls}">${esc(tag)}</span>
      </div>`;
    }

    function renderNav() {
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${navItems().map((item) => {
            const on = state.navTab === item.id;
            const dot = state.role === 'david' && item.id === 'schedule' && activeTransfer()
              ? '<span class="absolute -right-1 -top-0.5 h-1.5 w-1.5 rounded-full bg-rose-500 ring-2 ring-white"></span>'
              : '';
            return `<button data-action="nav" data-tab="${item.id}" ${on ? 'aria-current="page"' : ''} class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-400'}">
              <span class="relative">${icon(item.icon, 'h-[18px] w-[18px]')}${dot}</span>
              <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.view === 'audit') {
        if (state.role === 'david') return renderNoticePage();
        return renderAuditPage();
      }
      return renderCalendar();
    }

    function renderPlaceholder() {
      const item = navItems().find((n) => n.id === state.navTab);
      if (!item) return `<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>`;
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc || '')}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">打开对应原型</a>` : ''}
        <button data-action="nav" data-tab="${boardTab()}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回${state.role === 'leo' ? '转让代办' : '课表'}</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 标题行
     * ------------------------------------------------------------------ */
    function viewOptions() {
      if (state.role === 'david') return [['calendar', '课表'], ['audit', '通知']];
      if (state.role === 'leo') return [['calendar', '课表'], ['audit', '转让审计']];
      return [['calendar', '课表'], ['audit', '转让明细']];
    }

    function titleRow(title, subtitle) {
      return `<div class="flex items-end justify-between gap-2">
        <div class="min-w-0">
          <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(title)}</h1>
          <p class="mt-0.5 truncate text-[12px] font-medium text-slate-400">${esc(subtitle)}</p>
        </div>
        <div class="inline-flex shrink-0 rounded-lg bg-slate-100 p-0.5">
          ${viewOptions().map(([key, label]) => `<button data-action="set-view" data-view="${key}" class="h-7 rounded-md px-2 text-[12px] font-bold transition ${state.view === key ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}">${esc(label)}</button>`).join('')}
        </div>
      </div>`;
    }

    function pageHeading() {
      if (state.view === 'audit') {
        if (state.role === 'david') return ['通知中心', 'David Miller · 学员变更与备课'];
        if (state.role === 'leo') return ['转让审计', '全平台转让流水 · 已交割留痕'];
        return ['转让明细', '转出 / 转入记录 · 财课分离留痕'];
      }
      if (state.role === 'helen') return ['学生课表', 'TomZ11 · 受让课次与履约 · 保留 1 次同师挪位'];
      if (state.role === 'david') return ['我的课表', 'David Miller · 学员变更与备课提示'];
      if (state.role === 'leo') return ['转让代办', 'Leo · 后台协助与全量审计'];
      return ['学生课表', `${state.amyActive} · 固定位转让与权益交割`];
    }

    /* ------------------------------------------------------------------
     * 日历主页面
     * ------------------------------------------------------------------ */
    function renderCalendar() {
      const [title, subtitle] = pageHeading();
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        ${titleRow(title, subtitle)}
        ${roleNoticeCards()}
        ${state.role === 'amy' ? childSelector() : state.role === 'helen' ? transfereeProfile() : ''}
        ${weekHeader()}
        ${legendBar()}
        ${excelGridHTML()}
        <div class="rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900/85">
          仅 1v1 固定位可转让：同家庭直转保留原家长退款权；跨家长转让后原家长退款入口关闭。转让只改实际上课学员，出资家长与资金持有方保持不变。
        </div>
      </div>`;
    }

    function childSelector() {
      return `<div class="rounded-2xl border border-slate-200/80 bg-white p-3 shadow-sm">
        <div class="text-[12px] font-medium text-slate-400">当前宝贝档案</div>
        <div class="mt-2 flex gap-1.5">
          ${['AliceZ12', 'BobZ10', 'CharlieZ08'].map((nick) => {
            const on = state.amyActive === nick;
            return `<button data-action="set-child" data-nick="${nick}" class="h-9 flex-1 rounded-xl border text-[12px] font-bold ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-slate-100 text-slate-600'}">${esc(nick)}</button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function transfereeProfile() {
      const s = STUDENTS.TomZ11;
      return `<div class="rounded-2xl border border-emerald-200/70 bg-emerald-50/80 p-3 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-emerald-100 text-[14px] font-bold text-emerald-800">${s.nickname.charAt(0)}</span>
            <div class="min-w-0">
              <div class="truncate text-[14px] font-bold text-emerald-950">${s.nickname} · ${s.gender} · ${s.age}岁</div>
              <div class="truncate text-[12px] font-medium text-emerald-700">${esc(s.grade)} · ${esc(s.level)}</div>
            </div>
          </div>
          <span class="shrink-0 rounded-full border border-emerald-200 bg-white/60 px-2 py-0.5 text-[12px] font-bold text-emerald-700">受让方</span>
        </div>
      </div>`;
    }

    function roleNoticeCards() {
      const t = activeTransfer();
      if (state.role === 'david' && t) {
        return `<button data-action="open-memo" class="w-full rounded-2xl border border-rose-200/70 bg-rose-50/80 p-3.5 text-left shadow-sm">
          <div class="flex items-center justify-between text-[12px] font-bold text-rose-700">
            <span>学员变更通知</span><span>站内信 + 邮件</span>
          </div>
          <p class="mt-1 text-[14px] font-medium leading-relaxed text-rose-900/85">${t.from} 已变更为 ${t.to}，点击查看受让学员留言板与学情。</p>
          <span class="mt-2 inline-flex items-center gap-1 rounded-lg bg-rose-600 px-2.5 py-1 text-[12px] font-bold text-white">${icon('book-open', 'h-3.5 w-3.5')}查看学员留言板</span>
        </button>`;
      }
      if (state.role === 'helen') {
        return t ? `<div class="rounded-2xl border border-emerald-200/70 bg-emerald-50/80 p-3.5 shadow-sm">
          <div class="flex items-center justify-between text-[12px] font-bold text-emerald-700"><span>受让课次已到账</span><span>已交割</span></div>
          <p class="mt-1 text-[14px] font-medium leading-relaxed text-emerald-900/85">由 ${t.from} 转让而来，课表已加注【转】角标；不可二次转让，保留 1 次同师挪位。</p>
        </div>` : `<div class="rounded-2xl border border-slate-200/80 bg-white p-3.5 text-[14px] font-medium text-slate-500 shadow-sm">暂无受让课次。可切换场景「已受让」查看受让方视角。</div>`;
      }
      if (state.role === 'leo') return monitorSummary();
      return '';
    }

    function monitorSummary() {
      const lesson = fixedLesson();
      const t = activeTransfer();
      const locked = state.scenario === 'locked';
      const assistDisabled = !!t || locked || state.online === 'off';
      const assistLabel = t ? '该课次已完成代办交割' : locked ? '转让已截止' : state.online === 'off' ? '离线只读' : '后台协助转让';
      const T = TONES.indigo;
      return `<section class="rounded-2xl border ${T.card} p-3.5 shadow-sm">
        <div class="flex items-center justify-between text-[12px] font-medium ${T.sub}">
          <span>班长代办工作台</span><span>${t ? '已完成交割' : '待协助'}</span>
        </div>
        <h2 class="mt-1 text-[16px] font-bold ${T.title}">${esc(lesson.course)}</h2>
        <p class="mt-0.5 text-[12px] font-medium ${T.sub}">${fmtDate(lesson.date)} · ${lesson.time} - ${endTime(lesson.time)} · ${esc(lesson.teacher)}</p>
        <div class="mt-2.5 grid grid-cols-3 gap-1.5 text-[12px]">
          <div class="rounded-xl bg-white/60 p-2"><div class="${T.sub}">实际上课</div><div class="mt-0.5 font-mono font-semibold ${T.body}">${esc(lesson.actualStudent)}</div></div>
          <div class="rounded-xl bg-white/60 p-2"><div class="${T.sub}">资金持有</div><div class="mt-0.5 font-semibold ${T.body}">Leo 不变</div></div>
          <div class="rounded-xl bg-white/60 p-2"><div class="${T.sub}">购课单</div><div class="mt-0.5 font-mono font-semibold ${T.body}">${esc(lesson.orderId)}</div></div>
        </div>
        <button data-action="open-monitor" ${assistDisabled ? 'disabled' : ''} class="mt-2.5 h-10 w-full rounded-lg text-[14px] font-bold ${assistDisabled ? 'bg-slate-200 text-slate-400' : T.action} disabled:cursor-not-allowed">${assistLabel}</button>
      </section>`;
    }

    function weekHeader() {
      return `<div class="flex items-center justify-between gap-2">
        <button data-action="toast" data-message="原型固定演示 2026 年第 46 周" class="grid h-8 w-8 place-items-center rounded-lg border border-slate-200 bg-white text-slate-600">${icon('chevron-left', 'h-4 w-4')}</button>
        <div class="text-center">
          <div class="text-[14px] font-bold text-slate-800">2026 年第 46 周</div>
          <div class="mt-0.5 text-[12px] font-medium text-slate-400">11-09 周一 至 11-15 周日</div>
        </div>
        <button data-action="toast" data-message="原型固定演示 2026 年第 46 周" class="grid h-8 w-8 place-items-center rounded-lg border border-slate-200 bg-white text-slate-600">${icon('chevron-right', 'h-4 w-4')}</button>
      </div>`;
    }

    function legendBar() {
      const items = [
        ['bg-amber-500', '固定位'], ['bg-yellow-400', '临时课'], ['bg-emerald-500', '可约'],
        ['bg-rose-500', '请假'], ['bg-slate-200', '不可约']
      ];
      return `<div class="flex flex-wrap items-center gap-x-2 gap-y-1 rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-[12px] font-medium text-slate-600">
        ${items.map(([c, l]) => `<span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded ${c}"></span>${l}</span>`).join('')}
        <span class="ml-auto inline-flex items-center gap-1 rounded bg-rose-600 px-1.5 py-0.5 text-[12px] font-bold text-white">转</span>
        <span class="text-slate-500">受让课次</span>
      </div>`;
    }

    function buildGrid() {
      const grid = {};
      const t = activeTransfer();
      const lesson = fixedLesson();
      const student = currentStudent();
      const teacherLike = state.role === 'david' || state.role === 'leo';

      for (let d = 0; d < 7; d += 1) {
        const date = isoAdd(WEEK_START, d);
        grid[date] = {};
        GRID_TIMES.forEach((time) => {
          grid[date][time] = { kind: 'free', color: 'GREEN', text: '约', title: '空闲可约' };
        });
      }

      grid['2026-11-12']['17:00'] = { kind: 'leave', color: 'RED', text: '假', title: '教师已请假' };

      let showFixed = false;
      if (teacherLike) showFixed = true;
      else if (t) showFixed = student === t.to;
      else showFixed = student === 'AliceZ12';
      if (showFixed) {
        grid[FIXED.date][FIXED.time] = {
          kind: 'fixed',
          color: 'ORANGE',
          text: lesson.actualStudent.slice(0, 4),
          title: `1v1 固定位 · ${lesson.actualStudent} · ${lesson.teacher}${lesson.isTransferred ? ' · 受让课次' : ''}`,
          transferred: lesson.isTransferred
        };
      } else if (t && student === t.from) {
        grid[FIXED.date][FIXED.time] = { kind: 'free', color: 'GREEN', text: '约', title: `原固定位已转给 ${t.to}，恢复空闲` };
      }

      const showTemp = teacherLike || student === 'AliceZ12';
      if (showTemp) {
        grid[TEMP.date][TEMP.time] = {
          kind: 'temp',
          color: 'YELLOW',
          text: TEMP.student.slice(0, 4),
          title: `1v1 临时课 · ${TEMP.student} · ${TEMP.teacher}`
        };
      }
      return grid;
    }

    function gridCellHTML(date, time, cell) {
      const colorCls = {
        ORANGE: 'bg-amber-50 border-amber-300 text-amber-900',
        YELLOW: 'bg-yellow-50 border-yellow-300 text-yellow-900',
        GREEN: 'bg-emerald-50/80 border-emerald-200 text-emerald-700',
        GRAY: 'bg-slate-100 border-slate-200 text-slate-400',
        RED: 'bg-rose-50 border-rose-200 text-rose-700'
      }[cell.color] || 'bg-slate-100 border-slate-200 text-slate-400';
      const badge = cell.transferred
        ? '<span class="absolute right-0 top-0 grid h-4 w-4 place-items-center rounded bg-rose-600 text-[12px] font-bold leading-none text-white">转</span>'
        : '';
      const action = cell.kind === 'fixed' || cell.kind === 'temp'
        ? `data-action="open-lesson" data-kind="${cell.kind}"`
        : `data-action="toast" data-message="${esc(cell.title)}"`;
      const displayText = cell.transferred ? cell.text.slice(0, 3) : cell.text;
      return `<td class="border-b border-r border-slate-100 p-[2px] align-middle">
        <button ${action} title="${esc(cell.title)}" class="relative flex h-8 w-full items-center justify-center overflow-hidden rounded-md border text-[12px] font-bold leading-none transition active:scale-95 ${colorCls}">
          <span class="truncate px-0.5">${esc(displayText)}</span>${badge}
        </button>
      </td>`;
    }

    function excelGridHTML() {
      const grid = buildGrid();
      return `<div class="overflow-hidden rounded-xl border border-slate-200 bg-white">
        <div class="overflow-auto">
          <table class="w-full table-fixed border-collapse">
            <thead>
              <tr>
                <th class="sticky left-0 top-0 z-40 w-[44px] border-b border-r border-slate-200 bg-slate-100 px-0 py-1 text-center text-[12px] font-bold text-slate-500">时段</th>
                ${Array.from({ length: 7 }, (_, i) => {
                  const date = isoAdd(WEEK_START, i);
                  const isToday = date === TODAY;
                  const isLessonDay = date === FIXED.date;
                  return `<th class="sticky top-0 z-30 border-b border-r border-slate-200 ${isToday ? 'bg-amber-100 text-amber-900' : isLessonDay ? 'bg-amber-50 text-amber-900' : 'bg-slate-50 text-slate-600'} px-0.5 py-1 text-center">
                    <div class="text-[12px] font-bold leading-tight">${DAY_LABELS[i]}</div>
                    <div class="font-mono text-[12px] font-semibold leading-tight ${isToday ? 'text-amber-800' : 'text-slate-400'}">${date.slice(5)}</div>
                  </th>`;
                }).join('')}
              </tr>
            </thead>
            <tbody>
              ${GRID_TIMES.map((time) => `
                <tr class="h-8">

    /* ------------------------------------------------------------------
     * 转让明细 / 通知页
     * ------------------------------------------------------------------ */
    function transferRecord() {
      const t = activeTransfer();
      if (!t) return null;
      return {
        from: t.from, to: t.to, type: t.type, scope: t.scope, operator: t.operator,
        at: t.at, note: t.note, teacher: FIXED.teacher, slot: `${fmtDate(FIXED.date)} ${FIXED.time}`,
        status: '已交割', orderId: FIXED.orderId, holder: FIXED.holder
      };
    }

    function filteredRecords() {
      const record = transferRecord();
      if (!record) return [];
      if (state.role === 'david' || state.role === 'leo') return [record];
      const student = currentStudent();
      if (!student) return [];
      if (state.auditTab === 'out') return record.from === student ? [record] : [];
      return record.to === student ? [record] : [];
    }

      const [title, subtitle] = pageHeading();

            const other = isParent ? (state.auditTab === 'out' ? r.to : r.from) : `${r.from} → ${r.to}`;

              <div class="flex items-center justify-between gap-2">

                <span class="shrink-0 rounded-full border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">${esc(r.status)}</span>
              </div>
              <div class="mt-2 grid grid-cols-2 gap-1.5 text-[12px]">
                <div class="rounded-lg bg-slate-50 px-2.5 py-2"><div class="text-slate-400">授课教师</div><div class="mt-0.5 text-[14px] font-semibold text-slate-800">${esc(r.teacher)}</div></div>
                <div class="rounded-lg bg-slate-50 px-2.5 py-2"><div class="text-slate-400">原排课</div><div class="mt-0.5 font-mono text-[12px] font-semibold text-slate-800">${esc(r.slot)}</div></div>
                <div class="rounded-lg bg-slate-50 px-2.5 py-2"><div class="text-slate-400">${isParent ? '对方学员' : '转让双方'}</div><div class="mt-0.5 font-mono text-[12px] font-semibold text-slate-800">${esc(other)}</div></div>
                <div class="rounded-lg bg-slate-50 px-2.5 py-2"><div class="text-slate-400">转让类型</div><div class="mt-0.5 text-[14px] font-semibold text-slate-800">${esc(typeLabel(r))}</div></div>
              </div>
              <div class="mt-2 flex items-center justify-between gap-2 rounded-lg bg-slate-50 px-2.5 py-1.5 text-[12px]">
                <span class="text-slate-400">出资家长</span><span class="font-semibold text-slate-700">Amy 不变</span>
              </div>
              <div class="mt-1 flex items-center justify-between gap-2 rounded-lg bg-slate-50 px-2.5 py-1.5 text-[12px]">
                <span class="text-slate-400">资金持有方</span><span class="font-semibold text-emerald-700">${esc(r.holder)} 不变</span>
              </div>
              <div class="mt-2 rounded-xl border px-3 py-2 text-[12px] font-medium leading-relaxed ${family ? 'border-emerald-200 bg-emerald-50 text-emerald-800' : 'border-rose-200 bg-rose-50 text-rose-800'}">
                <div class="flex items-start justify-between gap-2">
                  <span class="min-w-0">${refundNote(r)}</span>
                  ${family ? `<a href="m2b_refund_orders.html" target="_blank" rel="noopener" class="shrink-0 rounded-md bg-emerald-600 px-2 py-1 text-[12px] font-bold text-white">前往 M2B 退款</a>` : `<span class="shrink-0 rounded-md border border-rose-200 bg-white/60 px-2 py-1 text-[12px] font-bold text-rose-700">退款入口已关闭</span>`}
                </div>
              </div>
              <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-500">${esc(r.note)}</p>
            </article>`;
          }).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-12 text-center sm:col-span-2">
            <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-slate-50 text-slate-300">${icon('inbox', 'h-5 w-5')}</div>

          </div>`}
        </div>
      </div>`;
    }

    function renderNoticePage() {
      const [title, subtitle] = pageHeading();
      const t = activeTransfer();
      const lesson = fixedLesson();
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        ${titleRow(title, subtitle)}
        ${t ? `<div class="rounded-2xl border border-rose-200/70 bg-rose-50/80 p-3.5 shadow-sm">
          <div class="flex items-center justify-between text-[12px] font-bold text-rose-700"><span>紧急学员变更</span><span>站内信 + 邮件</span></div>

        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      let html = '';
      if (state.modal === 'transfer') html += renderTransferModal();
      else if (state.modal === 'detail') html += renderDetailModal();
      else if (state.modal === 'memo') html += renderMemoModal();
      else if (state.modal === 'monitor') html += renderMonitorModal();
      else if (state.modal === 'reschedule') html += renderRescheduleModal();
      if (state.confirmOpen) html += renderConfirmModal();
      return html;
    }

    function modalShell(content, width = 'max-w-[420px]', closeAction = 'close-modal') {
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]" data-action="${closeAction}"></div>
        <div class="absolute inset-x-4 top-1/2 mx-auto ${width} max-h-[90%] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">${content}</div>
      </div>`;
    }

    function sheetShell(content) {
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]" data-action="close-modal"></div>
        <div class="absolute inset-x-0 bottom-0 mx-auto flex max-h-[92%] w-full max-w-[560px] flex-col overflow-y-auto rounded-t-3xl bg-white p-4 shadow-2xl">
          <div class="mx-auto mb-2.5 h-1 w-10 shrink-0 rounded-full bg-slate-200"></div>
          ${content}
        </div>
      </div>`;
    }

    function modalHeader(title, subtitle = '', iconName = 'arrow-left-right', tone = 'indigo') {
      const T = TONES[tone];
      return `<div class="flex items-start justify-between gap-3">
        <div class="flex min-w-0 items-start gap-2.5">
          <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl ${T.icon}">${icon(iconName, 'h-4 w-4')}</div>
          <div class="min-w-0">
            <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
            ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
          </div>
        </div>
        <button data-action="close-modal" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 转让弹窗
     * ------------------------------------------------------------------ */
    function openTransferModal() {
      if (!guardWrite()) return;
      const lesson = fixedLesson();
      if (lesson.isTransferred) return showToast('受让课程不可二次转让');
      if (lesson.hours < 3) return showToast('开课前 3 小时内转让已截止');
      if (state.role !== 'amy' && state.role !== 'helen') return showToast('当前身份不可发起转让');
      state.modal = 'transfer';
      state.confirmOpen = false;
      state.transferTab = 'family';
      state.verified = null;
      state.verifyError = null;
      state.nickInput = 'TomZ11';
      renderOverlayOnly();
    }

    function renderTransferModal() {
      const from = FIXED.student;
      const current = STUDENTS[from];
      const siblings = Object.values(STUDENTS).filter((s) => s.account === current.account && s.nickname !== from);
      const isFamily = state.transferTab === 'family';
      const verified = state.verified;
      const error = state.verifyError;

      const profileCard = verified ? `<div class="rounded-xl border border-emerald-300 bg-emerald-50 p-3">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[12px] font-bold text-emerald-800">匹配成功 · 接收学员档案</span>
          <span class="rounded bg-emerald-200 px-1.5 py-0.5 font-mono text-[12px] font-bold text-emerald-900">${esc(verified.nickname)}</span>
        </div>
        <div class="mt-2 flex items-center gap-2.5">
          <div class="grid h-10 w-10 place-items-center rounded-full bg-emerald-200 text-[14px] font-bold text-emerald-800">${esc(verified.nickname.charAt(0))}</div>
          <div class="min-w-0">
            <div class="text-[14px] font-bold text-slate-800">${esc(verified.nickname)}</div>
            <div class="text-[12px] font-medium text-slate-500">${verified.gender} · ${verified.age}岁 · ${esc(verified.grade)}</div>
          </div>
        </div>
        <div class="mt-2 flex items-center justify-between gap-2 border-t border-emerald-200 pt-2 text-[12px]">
          <span class="rounded px-1.5 py-0.5 font-semibold ${verified.match ? 'bg-emerald-200 text-emerald-900' : 'bg-amber-200 text-amber-900'}">${verified.match ? '技能匹配' : '偏好不一致，不阻断'}</span>
          <span class="text-slate-500">${esc(verified.level)}</span>
        </div>
      </div>` : '';

      const errorCard = error ? `<div class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-[12px] font-medium text-rose-700">${esc(error)}</div>` : '';

      return modalShell(`
        ${modalHeader('固定位课程转让', `${fmtDate(FIXED.date)} · ${FIXED.time} - ${endTime(FIXED.time)} · ${FIXED.teacher}`, 'arrow-left-right')}
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[12px]">
          <div class="flex items-center justify-between py-0.5"><span class="text-slate-400">授课教师</span><span class="font-semibold text-slate-800">${esc(FIXED.teacher)}</span></div>
          <div class="flex items-center justify-between py-0.5"><span class="text-slate-400">课程类型</span><span class="font-semibold text-slate-800">1v1 固定位 · ${esc(FIXED.course)}</span></div>
          <div class="flex items-center justify-between py-0.5"><span class="text-slate-400">转让条件</span><span class="font-semibold text-slate-800">已排期固定位 · 距开课 ≥3h</span></div>
          <div class="flex items-center justify-between py-0.5"><span class="text-slate-400">财课分离</span><span class="font-semibold text-emerald-700">出资 Amy / 持有 Leo 不变</span></div>
        </div>

        <div class="mt-3 grid grid-cols-2 gap-1 rounded-xl bg-slate-100 p-1">
          <button data-action="transfer-tab" data-tab="family" class="h-8 rounded-lg text-[12px] font-bold transition ${isFamily ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">同家庭直转</button>
          <button data-action="transfer-tab" data-tab="external" class="h-8 rounded-lg text-[12px] font-bold transition ${!isFamily ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">转给其他家长</button>
        </div>

        ${isFamily ? `<div class="mt-3 space-y-2">
          <label for="familyRecipient" class="block text-[14px] font-semibold text-slate-700">选择名下其他孩子</label>
          <select id="familyRecipient" class="h-11 w-full rounded-xl border border-indigo-200 bg-indigo-50 px-3 text-[16px] font-medium text-indigo-900 outline-none">
            ${siblings.length ? siblings.map((s) => `<option value="${s.nickname}">${esc(s.nickname)} · ${s.gender} · ${s.age}岁</option>`).join('') : '<option value="">暂无其他孩子档案</option>'}
          </select>
          <div class="rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3 py-2 text-[12px] font-medium leading-relaxed text-indigo-900/85">转让后该课次将直接呈现在所选孩子课表，并加注【转】角标；出资家长与资金持有方不变，原出资家长仍可退款。</div>
          <div class="flex gap-2 pt-1">
            <button data-action="close-modal" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
            <button data-action="commit-family" ${state.online === 'off' || !siblings.length ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认划转</button>

        </div>` : `<div class="mt-3 space-y-2">
          <label for="nickInput" class="block text-[14px] font-semibold text-slate-700">输入接收学员规范昵称</label>
          <div class="flex gap-1.5">
            <input id="nickInput" value="${esc(state.nickInput)}" placeholder="例如 TomZ11" class="h-11 min-w-0 flex-1 rounded-xl border border-slate-200 px-3 font-mono text-[16px] outline-none focus:border-indigo-500">
            <button data-action="verify" class="h-11 shrink-0 rounded-xl border border-slate-200 bg-slate-100 px-3 text-[14px] font-semibold text-slate-700 hover:bg-slate-200">${icon('search', 'h-3.5 w-3.5')}验证</button>
          </div>
          <p class="text-[12px] font-medium text-slate-400">格式：英文名 + 姓首字母 + 年龄，如 TomZ11。大小写不敏感。</p>

          <div class="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-amber-900">系统不介入线下资金。请确认已收到对方款项后再提交；提交后立即生效、不可撤销。</div>
          <div class="flex gap-2 pt-1">
            <button data-action="close-modal" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
            <button id="confirmExternalBtn" data-action="show-confirm" ${verified && state.online === 'on' ? '' : 'disabled'} class="h-11 flex-[2] rounded-xl text-[16px] font-semibold ${verified && state.online === 'on' ? 'bg-indigo-600 text-white' : 'cursor-not-allowed bg-slate-200 text-slate-400'}">确认转让给该学员</button>
          </div>
        </div>`}
      `);
    }

    function renderConfirmModal() {
      const recipient = state.verified;
      if (!recipient) return '';
      return `<div class="absolute inset-0 z-[60]">
        <div class="absolute inset-0 bg-slate-900/70 backdrop-blur-[1px]" data-action="close-confirm"></div>
        <div class="absolute inset-x-4 top-1/2 mx-auto max-w-[420px] -translate-y-1/2 rounded-2xl bg-white p-4 shadow-2xl">

            <p class="mt-1 text-[12px] font-medium text-slate-500">提交后立即生效，此操作不可撤销</p>

    /* ------------------------------------------------------------------
     * 课次详情
     * ------------------------------------------------------------------ */
    function openDetail(kind) {
      state.lessonKind = kind;
      state.modal = 'detail';
      state.confirmOpen = false;
      renderOverlayOnly();
    }

    function renderDetailModal() {
      const isTemp = state.lessonKind === 'temp';
      const lesson = isTemp
        ? { ...TEMP, isTransferred: false, actualStudent: TEMP.student, originalStudent: null, hours: state.scenario === 'locked' ? 2 : 48, rescheduleCount: state.rescheduleCount }
        : fixedLesson();
      const t = activeTransfer();
      const isFixed = !isTemp;
      const canReschedule = isFixed && lesson.rescheduleCount === 0 && lesson.hours >= 3 && state.online === 'on';
      const transferred = lesson.isTransferred;
      const scope = t ? t.scope : null;
      const typeCls = isTemp ? 'bg-yellow-50 text-yellow-800 border-yellow-200' : 'bg-amber-50 text-amber-800 border-amber-200';

      let actions = '';
      if (state.role === 'david') {
        actions = `<button data-action="open-memo" class="h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white">查看学员留言板</button>`;
      } else if (state.role === 'leo') {
        const disabled = transferred || lesson.hours < 3 || state.online === 'off';
        actions = `<button data-action="open-monitor" ${disabled ? 'disabled' : ''} class="h-11 w-full rounded-xl text-[16px] font-semibold ${disabled ? 'bg-slate-100 text-slate-400' : 'bg-indigo-600 text-white'} disabled:cursor-not-allowed">${transferred ? '该课次已完成代办交割' : lesson.hours < 3 ? '转让已截止' : '后台协助转让'}</button>`;
      } else if (isTemp) {
        actions = `<div class="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-amber-900">临时课仅支持请假退期待排，不可发起转让。</div>`;
      } else {
        const reschedule = canReschedule
          ? `<button data-action="open-reschedule" class="h-10 w-full rounded-xl border border-slate-200 bg-slate-100 text-[14px] font-semibold text-slate-700 hover:bg-slate-200">同师挪位（1 次 · 免扣配额）</button>`
          : `<button disabled class="h-10 w-full rounded-xl bg-slate-100 text-[14px] font-semibold text-slate-400">${lesson.rescheduleCount >= 1 ? '该课次已挪位，不可再次挪位' : '当前不可挪位'}</button>`;
        const transferBtn = transferred
          ? `<button disabled class="h-11 w-full rounded-xl bg-slate-100 text-[16px] font-semibold text-slate-400">受让课程不可二次转让</button>`
          : lesson.hours < 3
            ? `<button disabled class="h-11 w-full rounded-xl bg-slate-100 text-[16px] font-semibold text-slate-400">开课前 3 小时内转让已截止</button>`
            : state.online === 'off'
              ? `<button disabled class="h-11 w-full rounded-xl bg-slate-100 text-[16px] font-semibold text-slate-400">离线只读</button>`
              : `<button data-action="open-transfer" class="h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white">课程转让</button>`;
        actions = `${transferBtn}${reschedule}`;
      }

      return sheetShell(`
        <div class="flex items-start justify-between gap-3">
          <div class="flex min-w-0 items-start gap-2.5">
            <div class="grid h-9 w-9 shrink-0 place-items-center rounded-xl ${isTemp ? 'bg-amber-100 text-amber-700' : 'bg-amber-100 text-amber-700'}">${icon('calendar-clock', 'h-4 w-4')}</div>
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <h2 class="text-[16px] font-bold text-slate-900">${esc(lesson.course)}</h2>
                <span class="rounded border px-1.5 py-0.5 text-[12px] font-bold ${typeCls}">${isTemp ? '临时课' : '固定位'}</span>
                ${transferred ? '<span class="rounded bg-rose-100 px-1.5 py-0.5 text-[12px] font-bold text-rose-700">【转】</span>' : ''}
              </div>
              <p class="mt-0.5 text-[12px] font-medium text-slate-400">${fmtDate(lesson.date)} · ${lesson.time} - ${endTime(lesson.time)} · ${esc(lesson.teacher)}</p>
            </div>
          </div>
          <button data-action="close-modal" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100">${icon('x', 'h-5 w-5')}</button>
        </div>

        ${transferred ? `<div class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-rose-800">本节课由学员 ${esc(lesson.originalStudent)} 转让而来，当前上课学员 ${esc(lesson.actualStudent)}。</div>` : ''}

        <div class="mt-2.5 grid grid-cols-2 gap-1.5 text-[12px]">
          <div class="rounded-xl bg-slate-50 px-2.5 py-2"><div class="text-slate-400">上课学员</div><div class="mt-0.5 font-mono text-[14px] font-semibold text-slate-800">${esc(lesson.actualStudent)}</div></div>
          <div class="rounded-xl bg-slate-50 px-2.5 py-2"><div class="text-slate-400">授课教师</div><div class="mt-0.5 text-[14px] font-semibold text-slate-800">${esc(lesson.teacher)}</div></div>
          <div class="rounded-xl bg-slate-50 px-2.5 py-2"><div class="text-slate-400">教室</div><div class="mt-0.5 text-[14px] font-semibold text-slate-800">${esc(lesson.room)}</div></div>
          <div class="rounded-xl bg-slate-50 px-2.5 py-2"><div class="text-slate-400">距开课</div><div class="mt-0.5 text-[14px] font-semibold ${lesson.hours < 3 ? 'text-rose-600' : 'text-emerald-700'}">${lesson.hours} 小时</div></div>
        </div>

        <div class="mt-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[12px]">
          <div class="flex justify-between py-1"><span class="text-slate-400">出资家长</span><span class="font-semibold text-slate-800">Amy 不变</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">购课单</span><span class="font-mono font-semibold text-slate-800">${esc(lesson.orderId)}</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">资金持有方</span><span class="font-semibold text-emerald-700">${esc(lesson.holder)} 不变</span></div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-400">财课分离：转让不改动出资人、购课单与资金持有方。</p>
          ${transferred ? `<div class="mt-1.5 rounded-lg px-2.5 py-2 text-[12px] font-medium leading-relaxed ${scope === 'external' ? 'bg-rose-50 text-rose-700' : 'bg-emerald-50 text-emerald-700'}">${scope === 'external' ? '跨家长转让：原出资家长不可对该课次申请退款（M2B 已关闭）。' : '同家庭直转：原出资家长仍可对该课次申请退款。'}</div>` : ''}
        </div>

        <div class="mt-3 space-y-2">${actions}</div>
        <button data-action="close-modal" class="mt-2 h-10 w-full rounded-xl bg-slate-100 text-[14px] font-medium text-slate-600">关闭</button>
      `);
    }

    /* ------------------------------------------------------------------
     * 班长代办 / 挪位 / 备课
     * ------------------------------------------------------------------ */
    function openMonitorModal() {
      if (!guardWrite()) return;
      const lesson = fixedLesson();
      if (lesson.isTransferred) return showToast('该课次已完成交割');
      if (lesson.hours < 3) return showToast('开课前 3 小时内转让已截止');
      if (state.role !== 'leo') return;
      state.modal = 'monitor';
      state.confirmOpen = false;
      renderOverlayOnly();
    }

    function renderMonitorModal() {
      const options = Object.values(STUDENTS)
        .filter((s) => s.nickname !== FIXED.student)
        .map((s) => `<option value="${s.nickname}">${esc(s.nickname)} · ${esc(s.parent)} 名下 · ${s.age}岁</option>`)
        .join('');
      return modalShell(`
        ${modalHeader('后台协助转让', '操作人 Leo 班长 · 审计留痕', 'user-cog')}
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[12px]">
          <div class="flex justify-between py-1"><span class="text-slate-400">待转排课</span><span class="font-semibold text-slate-800">${fmtDate(FIXED.date)} ${FIXED.time}</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">原排课学员</span><span class="font-mono font-semibold text-slate-800">AliceZ12</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">资金持有方</span><span class="font-semibold text-emerald-700">Leo 班长 不变</span></div>
        </div>
        <label for="monitorRecipient" class="mt-3 block text-[14px] font-semibold text-slate-700">选择接收学员档案</label>
        <select id="monitorRecipient" class="mt-1 h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-[16px] outline-none focus:border-indigo-500">${options}</select>
        <label for="monitorNote" class="mt-3 block text-[14px] font-semibold text-slate-700">代办转让原因及交割备注</label>
        <textarea id="monitorNote" rows="3" maxlength="200" class="mt-1 h-24 w-full resize-none rounded-xl border border-slate-200 p-3 text-[16px] outline-none focus:border-indigo-500" placeholder="例如：家长微信群已结清打款，电话委托班长代办"></textarea>
        <p class="mt-1 text-[12px] font-medium text-slate-400">1 至 200 字，备注将写入审计快照并派发协同通知。</p>
        <div class="mt-3 flex gap-2">
          <button data-action="close-modal" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
          <button data-action="commit-monitor" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认代办划转</button>
        </div>`);
    }

    function openRescheduleModal() {
      if (!guardWrite()) return;
      const lesson = fixedLesson();
      if (lesson.rescheduleCount >= 1) return showToast('该课次已挪位，不可再次挪位');
      if (lesson.hours < 3) return showToast('开课前 3 小时内不可挪位');
      state.modal = 'reschedule';
      state.confirmOpen = false;
      renderOverlayOnly();
    }

    function renderRescheduleModal() {
      const slots = [
        { label: '11-18 (周三) 16:00 - 16:30', value: '11-18 周三 16:00' },
        { label: '11-20 (周五) 15:00 - 15:30', value: '11-20 周五 15:00' },
        { label: '11-21 (周六) 17:00 - 17:30', value: '11-21 周六 17:00' }
      ];
      return sheetShell(`
        ${modalHeader('同师挪位', 'David Miller · 仅 1 次 · 免扣请假配额', 'calendar-range', 'emerald')}
        <div class="mt-3 rounded-xl border border-emerald-200/70 bg-emerald-50/80 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-emerald-900/85">受让课次保留 1 次同师挪位权益；挪位不改变授课教师、出资家长与资金持有方。</div>
        <div class="mt-3 space-y-2">
          ${slots.map((s) => `<button data-action="commit-reschedule" data-slot="${esc(s.value)}" class="flex h-12 w-full items-center justify-between rounded-xl border border-emerald-200 bg-emerald-50 px-3.5 text-[14px] font-semibold text-emerald-900">
            <span>${esc(s.label)}</span><span class="rounded bg-white px-2 py-0.5 text-[12px] font-bold text-emerald-700">选择</span>
          </button>`).join('')}
        </div>
        <button data-action="close-modal" class="mt-3 h-10 w-full rounded-xl bg-slate-100 text-[14px] font-medium text-slate-600">取消</button>`);
    }

    function openMemoModal() {
      state.modal = 'memo';
      state.confirmOpen = false;
      renderOverlayOnly();
    }

    function renderMemoModal() {
      const lesson = fixedLesson();
      const t = activeTransfer();
      const student = STUDENTS[lesson.actualStudent] || STUDENTS.AliceZ12;
      return sheetShell(`
        ${modalHeader('受让学员备课学情', `${fmtDate(FIXED.date)} ${FIXED.time} · ${FIXED.course}`, 'book-open')}
        ${t ? `<div class="mt-2 rounded-xl border border-amber-200/70 bg-amber-50/80 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-amber-900/85">学员变更：${t.from} 已转让给 ${t.to}。请按 ${t.to} 的进度备课。</div>` : ''}
        <div class="mt-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[12px]">
          <div class="flex justify-between py-1"><span class="text-slate-400">学员昵称</span><span class="font-mono font-semibold text-slate-800">${esc(student.nickname)}</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">性别与年龄</span><span class="font-semibold text-slate-800">${student.gender} · ${student.age}岁</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">年级</span><span class="font-semibold text-slate-800">${esc(student.grade)}</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">当前水平</span><span class="font-semibold text-emerald-700">${esc(student.level)}</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">学习重点</span><span class="font-semibold text-slate-800">${esc(student.focus)}</span></div>
        </div>
        <div class="mt-2 rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3 py-2.5 text-[12px] text-indigo-900/85">
          <div class="flex justify-between text-[12px] font-bold text-indigo-700"><span>转让方留言</span><span>${t ? esc(t.at) : '暂无'}</span></div>
          <p class="mt-1 font-medium leading-relaxed">${t ? esc(t.note) : '本周暂无转让留言。'}</p>
        </div>
        <a href="m1d_profile_messages.html" target="_blank" rel="noopener" class="mt-2 flex h-10 w-full items-center justify-center gap-1.5 rounded-xl border border-slate-200 bg-slate-100 text-[14px] font-semibold text-slate-700 hover:bg-slate-200">${icon('message-square', 'h-4 w-4')}打开双权限留言板</a>
        <button data-action="close-modal" class="mt-2 h-10 w-full rounded-xl bg-indigo-600 text-[14px] font-semibold text-white">已了解学情并备课</button>`);
    }

    /* ------------------------------------------------------------------
     * 提交动作
     * ------------------------------------------------------------------ */
    function verifyNickname() {
      if (!guardWrite()) return;
      const raw = (state.nickInput || '').trim();
      state.verified = null;
      state.verifyError = null;
      if (!/^[A-Za-z]+[A-Za-z][0-9]{1,2}$/.test(raw)) {
        state.verifyError = '未找到该学员，请核对昵称格式。';
        return renderOverlayOnly();
      }
      const found = Object.values(STUDENTS).find((s) => s.nickname.toLowerCase() === raw.toLowerCase());
      if (!found) {
        state.verifyError = '未找到该学员，请核对昵称格式。';
        return renderOverlayOnly();
      }
      if (found.nickname === FIXED.student) {
        state.verifyError = '不可转给自己，请选择其他学员。';
        return renderOverlayOnly();
      }
      if (found.account === STUDENTS[FIXED.student].account) {
        state.verifyError = '该学员与本课次同属一个家庭账号，请使用【同家庭直转】。';
        return renderOverlayOnly();
      }
      state.verified = found;
      renderOverlayOnly();
    }

    function renderOverlayOnly() {
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    function commitFamilyTransfer() {
      if (!guardWrite()) return;
      const select = $('familyRecipient');
      const to = select ? select.value : '';
      if (!to) return showToast('请选择接收孩子');
      const from = FIXED.student;
      state.transfer = { from, to, type: 'family', scope: 'family', operator: 'Amy', at: stamp(), note: '同家庭多孩直转，出资家长与资金持有方不变' };
      state.rescheduleCount = 0;
      state.modal = null;
      state.confirmOpen = false;
      state.amyActive = to;
      state.role = 'amy';
      state.page = 'board';
      state.navTab = 'schedule';
      state.view = 'calendar';
      state.auditTab = 'in';
      renderAll();
      showToast(`已划转给 ${to}，课表已挂载【转】角标；原家长退款权保留`);
    }

    function commitExternalTransfer() {
      if (!guardWrite()) return;
      if (!state.verified) return showToast('请先验证接收学员');
      const from = FIXED.student;
      const to = state.verified.nickname;
      state.transfer = { from, to, type: 'external', scope: 'external', operator: 'Amy', at: stamp(), note: '家长自助转让，线下资金已结清' };
      state.rescheduleCount = 0;
      state.modal = null;
      state.confirmOpen = false;
      state.role = 'helen';
      state.page = 'board';
      state.view = 'calendar';
      state.navTab = 'schedule';
      state.auditTab = 'in';
      renderAll();
      showToast(`转让已生效，${to} 课表已加注【转】角标；原家长退款入口已关闭`);
    }

    function commitMonitorTransfer() {
      if (!guardWrite()) return;
      const recipient = $('monitorRecipient');
      const noteEl = $('monitorNote');
      const to = recipient ? recipient.value : '';
      const note = noteEl ? noteEl.value.trim() : '';
      if (!to) return showToast('请选择接收学员');
      if (note.length < 1 || note.length > 200) return showToast('请填写 1 至 200 字的代办备注');
      const from = FIXED.student;
      state.transfer = { from, to, type: 'proxy', scope: transferScope(from, to), operator: 'Leo 班长', at: stamp(), note };
      state.rescheduleCount = 0;
      state.modal = null;
      state.confirmOpen = false;
      state.role = 'leo';
      state.page = 'board';
      state.navTab = 'ops';
      state.view = 'calendar';
      renderAll();
      showToast(`代办交割完成，已划转给 ${to}；审计日志已写入`);
    }

    function commitReschedule(slot) {
      if (!guardWrite()) return;
      state.rescheduleCount = 1;
      state.modal = null;
      state.confirmOpen = false;
      renderAll();
      showToast(`已提交同师挪位：${slot} · 免扣请假配额`);
    }

    function showToast(msg) {
      const t = $('toast');
      t.className = 'pointer-events-none absolute bottom-20 left-1/2 z-[100] w-max max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl bg-slate-900/90 px-4 py-2 text-center text-[12px] font-semibold leading-relaxed text-white shadow-xl';
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.add('hidden'), 2800);
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'set-view') return setView(el.dataset.view);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'set-child') return setAmyStudent(el.dataset.nick);
      if (action === 'audit-tab') { state.auditTab = el.dataset.tab; return renderAll(); }
      if (action === 'open-lesson') return openDetail(el.dataset.kind);
      if (action === 'open-transfer') return openTransferModal();
      if (action === 'open-reschedule') return openRescheduleModal();
      if (action === 'open-monitor') return openMonitorModal();
      if (action === 'open-memo') return openMemoModal();
      if (action === 'transfer-tab') {
        state.transferTab = el.dataset.tab;
        state.verified = null;
        state.verifyError = null;
        return renderOverlayOnly();
      }
      if (action === 'verify') return verifyNickname();
      if (action === 'show-confirm') {
        if (!state.verified) return showToast('请先验证接收学员');
        state.confirmOpen = true;
        return renderOverlayOnly();
      }
      if (action === 'commit-external') return commitExternalTransfer();
      if (action === 'commit-family') return commitFamilyTransfer();
      if (action === 'commit-monitor') return commitMonitorTransfer();
      if (action === 'commit-reschedule') return commitReschedule(el.dataset.slot);
      if (action === 'close-confirm') { state.confirmOpen = false; return renderOverlayOnly(); }
      if (action === 'close-modal') { state.modal = null; state.confirmOpen = false; return renderOverlayOnly(); }
    });

    document.getElementById('frame').addEventListener('input', (e) => {
      if (e.target.id === 'nickInput') {
        state.nickInput = e.target.value;
        state.verified = null;
        state.verifyError = null;
        const feedback = $('verifyFeedback');
        if (feedback) feedback.innerHTML = '';
        const btn = $('confirmExternalBtn');
        if (btn) {
          btn.disabled = true;
          btn.className = 'h-11 flex-[2] rounded-xl text-[16px] font-semibold cursor-not-allowed bg-slate-200 text-slate-400';
        }
      }
    });

    renderAll();
  </script>
</body>
</html>

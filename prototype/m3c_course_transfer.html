</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800 antialiased">

  <!-- 原型控制台（不属于产品界面） -->
  <header class="sticky top-0 z-[60] border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-5 gap-y-2 px-4 py-2.5 text-xs">

        <span class="hidden text-[12px] font-medium text-slate-400 lg:inline">最新 PRD · 主页面底栏 ≤ 4 Tab</span>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">角色</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="role" data-value="amy" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">Amy 转出</button>
          <button data-group="role" data-value="helen" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">Helen 受让</button>

  <main class="flex justify-center px-4 py-6">
    <div id="frame" class="relative flex h-[812px] w-[390px] shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300">

        <i data-lucide="wifi-off" class="h-4 w-4 shrink-0 text-amber-600"></i>
        离线只读：可查看课表与转让明细，转让 / 验证 / 代办 / 挪位不可用

      <div id="content" class="flex-1 overflow-y-auto"></div>
      <nav id="bottomnav" class="shrink-0"></nav>
      <div id="overlay"></div>
      <div id="toast" class="pointer-events-none absolute bottom-24 left-1/2 z-[100] hidden w-max max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl bg-slate-900/90 px-4 py-2 text-center text-[12px] font-semibold leading-relaxed text-white shadow-xl"></div>
    </div>

  <!-- Tailwind CDN 动态类安全垫 -->
  <div class="hidden">
    <span class="h-[812px] w-[390px] h-[860px] w-[768px] max-h-[92%] max-h-[90%] max-w-[560px] max-w-[420px] max-w-[360px]"></span>
    <span class="grid grid-cols-1 grid-cols-2 grid-cols-3"></span>
    <span class="bg-amber-50 border-amber-300 text-amber-900 bg-yellow-50 border-yellow-300 text-yellow-900"></span>
    <span class="bg-blue-50 border-blue-300 text-blue-900 bg-purple-50 border-purple-300 text-purple-900"></span>
    <span class="bg-emerald-50/80 border-emerald-200 text-emerald-700 bg-slate-100 border-slate-200 text-slate-400"></span>
    <span class="bg-rose-50 border-rose-200 text-rose-700 bg-indigo-600 bg-indigo-50 text-indigo-700 border-indigo-100"></span>
    <span class="bg-amber-100 text-amber-900 bg-rose-600 bg-slate-900 text-amber-300"></span>
    <span class="bg-slate-900/40 backdrop-blur-[1px]"></span>
  </div>

  <script>
    /* ------------------------------------------------------------------
     * 演示日期与基础数据
     * ------------------------------------------------------------------ */
    const TODAY = '2026-11-10';
    const WEEK_START = '2026-11-09';
    const DAY_LABELS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    const TIME_SLOTS = Array.from({ length: 36 }, (_, i) => {
      const total = 6 * 60 + i * 30;
      return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
    });

    const STUDENTS = {
      AliceZ12: { nickname: 'AliceZ12', gender: '女', age: 12, grade: '六年级', parent: 'Amy', account: 'amy', focus: '英语 KET 精读', level: 'KET 卓越', match: true },
      BobZ10: { nickname: 'BobZ10', gender: '男', age: 10, grade: '四年级', parent: 'Amy', account: 'amy', focus: '英语 KET 基础', level: 'KET 备考', match: true },
      CharlieZ08: { nickname: 'CharlieZ08', gender: '男', age: 8, grade: '二年级', parent: 'Amy', account: 'amy', focus: '英语启蒙', level: 'Starters', match: false },
      TomZ11: { nickname: 'TomZ11', gender: '男', age: 11, grade: '五年级', parent: 'Helen', account: 'helen', focus: '英语 KET 精读', level: 'KET 卓越', match: true },
      CatherineW09: { nickname: 'CatherineW09', gender: '女', age: 9, grade: '三年级', parent: 'Eva', account: 'eva', focus: '英语 PET 冲刺', level: 'PET 预备', match: false }
    };

    const FIXED = {
      id: 'TS_20261114_1600', date: '2026-11-14', time: '16:00', type: 'fixed',
      course: '1v1 英语 KET 精读', teacher: 'David Miller', student: 'AliceZ12',
      room: 'ClassIn A-302', orderId: 'ORD_20261102_0091', funder: 'Amy', holder: 'Leo 班长'
    };
    const TEMP = {
      id: 'TS_20261114_1700', date: '2026-11-14', time: '17:00', type: 'temp',
      course: '1v1 临时口语强化', teacher: 'David Miller', student: 'AliceZ12',
      room: 'ClassIn A-302', orderId: 'ORD_20261102_0091', funder: 'Amy', holder: 'Leo 班长'
    };
    const DEFAULT_TRANSFER = {
      from: 'AliceZ12', to: 'TomZ11', type: 'external', scope: 'external',
      operator: 'Amy', at: '2026-11-05 10:20',
      note: '微信群已线下结清，转给同群 TomZ11'
    };

    const NAVS = {
      amy: [
        { id: 'home', icon: 'home', label: '首页', desc: '多孩时间流与金刚位属于 M0 工作台主页。', href: 'm0_workspace_home.html?role=user' },
        { id: 'schedule', icon: 'calendar-days', label: '学生课表', board: true },
        { id: 'hall', icon: 'plus-circle', label: '约课大厅', desc: '教师与小班选课属于 M1B / M1C。', href: 'm1c_classes.html' },
        { id: 'me', icon: 'user', label: '我的', desc: '学员档案、账单与转让明细属于 M0 个人中心。', href: 'm0_workspace_home.html?role=user&view=me' }
      ],
      helen: [
        { id: 'home', icon: 'home', label: '首页', desc: '多孩时间流与金刚位属于 M0 工作台主页。', href: 'm0_workspace_home.html?role=user' },
        { id: 'schedule', icon: 'calendar-days', label: '学生课表', board: true },
        { id: 'hall', icon: 'plus-circle', label: '约课大厅', desc: '教师与小班选课属于 M1B / M1C。', href: 'm1c_classes.html' },
        { id: 'me', icon: 'user', label: '我的', desc: '学员档案、账单与转让明细属于 M0 个人中心。', href: 'm0_workspace_home.html?role=user&view=me' }
      ],
      david: [
        { id: 'home', icon: 'home', label: '首页', desc: '教师工作台主页属于 M0。', href: 'm0_workspace_home.html?role=teacher' },
        { id: 'schedule', icon: 'calendar-days', label: '我的课表', board: true },
        { id: 'students', icon: 'users', label: '学员档案', desc: '学员档案与留言板属于 M1A / M1D。', href: 'm1a_student_profile.html' },
        { id: 'me', icon: 'user', label: '我的', desc: '教师履历与课酬单属于 M1B / M5B。', href: 'm1b_teacher_monitor.html' }
      ],
      leo: [
        { id: 'home', icon: 'home', label: '首页', desc: '班长主页与教务待办属于 M0 工作台。', href: 'm0_workspace_home.html?role=monitor' },
        { id: 'schedule', icon: 'calendar-days', label: '学生课表', desc: '班长本人家庭课表属于 M0 / M3A。', href: 'm3a_calendar_schedule.html' },
        { id: 'ops', icon: 'layout-grid', label: '教务中心', board: true },
        { id: 'me', icon: 'user', label: '我的', desc: '班长周转账与家庭档案属于 M0 个人中心。', href: 'm0_workspace_home.html?role=monitor&view=me' }
      ]
    };

    const ROLE_META = {
      amy: { label: '家长工作台 · Amy', initial: 'A', dark: false },
      helen: { label: '家长工作台 · Helen', initial: 'H', dark: false },
      david: { label: '教师工作台 · David', initial: 'D', dark: true },
      leo: { label: '班长工作台 · Leo', initial: 'L', dark: true }
    };

    /* ------------------------------------------------------------------
     * 状态
     * ------------------------------------------------------------------ */
    const state = {
      role: 'amy',
      view: 'calendar', // calendar | audit
      page: 'board', // board | placeholder
      navTab: 'schedule',
      device: 'mobile',
      online: 'on',
      scenario: 'normal', // normal | locked | transferred
      amyActive: 'AliceZ12',
      transfer: null,
      rescheduleCount: 0,
      modal: null, // transfer | detail | memo | monitor | reschedule
      confirmOpen: false,
      lessonKind: 'fixed',
      transferTab: 'family',
      nickInput: 'TomZ11',
      verified: null,
      verifyError: null,
      auditTab: 'out'
    };

    /* ------------------------------------------------------------------
     * 工具
     * ------------------------------------------------------------------ */
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const clone = (v) => JSON.parse(JSON.stringify(v));

    function isoToTs(iso) { return Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10))); }
    function isoAdd(iso, days) { return new Date(isoToTs(iso) + days * 86400000).toISOString().slice(0, 10); }
    function diffDays(a, b) { return Math.round((isoToTs(a) - isoToTs(b)) / 86400000); }
    function weekdayLabel(iso) { return DAY_LABELS[(new Date(isoToTs(iso)).getUTCDay() + 6) % 7]; }
    function fmtDate(iso) { return `${iso.slice(5)} (${weekdayLabel(iso)})`; }
    function endTime(time) {
      const [h, m] = time.split(':').map(Number);
      const total = h * 60 + m + 30;
      return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
    }
    function stamp() {
      return `${TODAY} 10:20`;
    }

    function roleMeta() { return ROLE_META[state.role]; }
    function navItems() { return NAVS[state.role]; }
    function boardTab() { return state.role === 'leo' ? 'ops' : 'schedule'; }
    function fixedStudent() { return STUDENTS.AliceZ12; }
    function transferScope(from, to) {
      return STUDENTS[from].account === STUDENTS[to].account ? 'family' : 'external';
    }
    function activeTransfer() { return state.transfer; }
    function fixedLesson() {
      const t = activeTransfer();
      return {
        ...FIXED,
        isTransferred: !!t,
        actualStudent: t ? t.to : FIXED.student,
        originalStudent: t ? t.from : null,
        hours: state.scenario === 'locked' ? 2 : 48,
        rescheduleCount: state.rescheduleCount
      };
    }
    function currentStudent() {
      if (state.role === 'amy') return state.amyActive;
      if (state.role === 'helen') return 'TomZ11';
      return null;
    }
    function typeLabel(record) {
      if (record.type === 'family') return '同家庭直转';
      if (record.type === 'proxy') return '班长代办';
      return '跨家长转让';
    }
    function refundNote(record) {
      return record.scope === 'family'
        ? '同家庭直转：原出资家长仍可对该课次在 M2B 发起退款。'
        : '跨家长转让：原出资家长的 M2B 退款入口已物理锁定。';
    }
    function guardWrite() {
      if (state.online === 'off') {
        showToast('离线只读，暂不可执行该操作', true);
        return false;
      }
      return true;
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') { state.modal = null; state.confirmOpen = false; }
          renderAll();
          if (value === 'off') showToast('离线只读：转让 / 验证 / 代办 / 挪位不可用', true);
        }
        if (group === 'scenario') setScenario(value);
      });
    });
    document.getElementById('btnResetDemo').addEventListener('click', resetDemo);

    function setRole(role) {
      state.role = role;
      state.page = 'board';
      state.navTab = boardTab();
      state.modal = null;
      state.confirmOpen = false;
      if (role === 'helen') state.auditTab = 'in';
      if (role === 'amy') state.auditTab = state.transfer && state.amyActive === state.transfer.to ? 'in' : 'out';
      renderAll();
    }

    function navTo(tab) {
      const item = navItems().find((n) => n.id === tab);
      if (!item) return;
      state.modal = null;
      state.confirmOpen = false;
      if (item.board) {
        state.page = 'board';
        state.navTab = tab;
        state.view = 'calendar';
      } else {
        state.page = 'placeholder';
        state.navTab = tab;
      }
      renderAll();
    }

    function setView(view) {
      state.view = view;
      state.page = 'board';
      state.modal = null;
      state.confirmOpen = false;
      renderAll();
    }

    function setAmyStudent(nickname) {
      state.amyActive = nickname;
      state.auditTab = state.transfer && state.transfer.to === nickname ? 'in' : 'out';
      renderAll();
    }

    function setScenario(key) {
      state.scenario = key;
      state.rescheduleCount = 0;
      state.view = 'calendar';
      state.page = 'board';
      state.modal = null;
      state.confirmOpen = false;
      if (key === 'transferred') {
        state.transfer = clone(DEFAULT_TRANSFER);
        state.role = 'helen';
        state.auditTab = 'in';
      } else {
        state.transfer = null;
        state.role = 'amy';
        state.amyActive = 'AliceZ12';
        state.auditTab = 'out';
      }
      state.navTab = boardTab();
      renderAll();
    }

    function resetDemo() {
      state.role = 'amy';
      state.view = 'calendar';
      state.page = 'board';
      state.navTab = 'schedule';
      state.device = 'mobile';
      state.online = 'on';
      state.scenario = 'normal';
      state.amyActive = 'AliceZ12';
      state.transfer = null;
      state.rescheduleCount = 0;
      state.modal = null;
      state.confirmOpen = false;
      state.lessonKind = 'fixed';
      state.transferTab = 'family';
      state.nickInput = 'TomZ11';
      state.verified = null;
      state.verifyError = null;
      state.auditTab = 'out';
      renderAll();
      showToast('演示数据已重置');
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const active = String(state[b.dataset.group]) === String(b.dataset.value);
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;
      });
    }

    /* ------------------------------------------------------------------
     * 外壳：顶栏 / 场景横幅 / 底部导航
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = document.getElementById('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      document.getElementById('topbar').innerHTML = renderTopbar();
      document.getElementById('scenarioBanner').innerHTML = renderScenarioBanner();

      const banner = document.getElementById('offlineBanner');
      banner.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2.5 text-[14px] font-semibold text-amber-900'
        : 'hidden';

      document.getElementById('content').innerHTML = renderContent();
      document.getElementById('bottomnav').innerHTML = renderNav();
      renderOverlay();
      syncConsole();
      lucide.createIcons();
      if (state.page === 'board' && state.view === 'calendar') setTimeout(scrollGridToPrime, 0);
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.view === 'audit') {
        if (state.role === 'david') return renderNoticePage();
        return renderAuditPage();
      }
      return renderCalendar();
    }

    function renderTopbar() {
      const meta = roleMeta();
      return `
        <div class="border-b border-slate-200 bg-white/95">
          <div class="flex h-14 items-center justify-between px-4">
            <div class="flex min-w-0 items-center gap-2.5">
              <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-indigo-600 text-[14px] font-bold text-white shadow-sm">D</div>
              <div class="min-w-0">
                <div class="truncate text-[16px] font-bold leading-tight text-slate-900">Dream 教务</div>
                <div class="truncate text-[12px] font-medium text-slate-400">${esc(meta.label)}</div>
              </div>
            </div>
            <div class="flex shrink-0 items-center gap-2">
              <button data-action="toast" data-message="暂无新消息" class="relative grid h-9 w-9 place-items-center rounded-xl bg-slate-100 text-slate-600" aria-label="通知">
                ${icon('bell', 'h-[18px] w-[18px]')}
                <span class="absolute right-2 top-2 h-1.5 w-1.5 rounded-full bg-rose-500 ring-2 ring-white"></span>
              </button>
              <div class="grid h-9 w-9 place-items-center rounded-full ${meta.dark ? 'bg-slate-900 text-amber-300' : 'bg-indigo-600 text-white'} text-[14px] font-bold">${esc(meta.initial)}</div>
            </div>
          </div>
        </div>`;
    }

    function renderScenarioBanner() {
      let text = '距开课 48 小时，仅 1v1 固定位可发起转让';
      let tag = '≥3h';
      let cls = 'border-emerald-200 bg-emerald-50 text-emerald-900';
      let tagCls = 'bg-emerald-200 text-emerald-900';
      let iconName = 'shield-check';

      if (state.role === 'david') {
        const t = activeTransfer();
        text = t ? `学员变更已送达：${t.from} 变更为 ${t.to}，请提前备课` : '本周课程正常，暂无学员变更通知';
        tag = t ? '变更' : '教师端';
        cls = t ? 'border-rose-200 bg-rose-50 text-rose-900' : 'border-slate-200 bg-slate-50 text-slate-700';
        tagCls = t ? 'bg-rose-200 text-rose-900' : 'bg-slate-200 text-slate-700';
        iconName = t ? 'bell' : 'calendar-check';

        tag = '<3h';

        tagCls = 'bg-rose-200 text-rose-900';
        iconName = 'lock';

        text = '受让课次已标记【转】，全端禁止二次转让，保留 1 次同师挪位';
        tag = 'is_transferred';
        cls = 'border-emerald-200 bg-emerald-50 text-emerald-900';
        tagCls = 'bg-emerald-200 text-emerald-900';

      return `
        <div class="flex items-center justify-between gap-2 border-b px-3 py-2 ${cls}">
          <div class="flex min-w-0 items-center gap-1.5 text-[12px] font-medium leading-relaxed">

            <span class="min-w-0">${esc(text)}</span>
          </div>
          <span class="shrink-0 rounded px-1.5 py-0.5 text-[12px] font-bold ${tagCls}">${esc(tag)}</span>

      const item = navItems().find((n) => n.id === state.navTab);

      return `
        <div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">

    /* ------------------------------------------------------------------
     * 标题行 / 视图切换
     * ------------------------------------------------------------------ */
    function viewOptions() {
      if (state.role === 'david') return [['calendar', '课表'], ['audit', '通知']];
      if (state.role === 'leo') return [['calendar', '课表'], ['audit', '转让审计']];
      return [['calendar', '课表'], ['audit', '转让明细']];
    }

    function titleRow(title, subtitle) {
      return `
        <div class="flex items-end justify-between gap-2">
          <div class="min-w-0">
            <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(title)}</h1>
            <p class="mt-1 truncate text-[12px] font-medium text-slate-500">${esc(subtitle)}</p>
          </div>
          <div class="inline-flex shrink-0 rounded-lg bg-slate-100 p-0.5">
            ${viewOptions().map(([key, label]) => `<button data-action="set-view" data-view="${key}" class="h-7 rounded-md px-2 text-[12px] font-bold transition ${state.view === key ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}">${label}</button>`).join('')}
          </div>
        </div>`;
    }

    function pageHeading() {
      if (state.view === 'audit') {
        if (state.role === 'david') return ['通知中心', 'David Miller · 学员变更与备课'];
        if (state.role === 'leo') return ['转让审计', '全平台转让流水 · 已交割留痕'];
        return ['转让明细', '转出 / 转入记录 · 财课分离留痕'];
      }
      if (state.role === 'helen') return ['学生课表', `TomZ11 · 受让课次与履约 · 仅 1 次同师挪位`];
      if (state.role === 'david') return ['我的课表', 'David Miller · 学员变更与备课提示'];
      if (state.role === 'leo') return ['转让代办', 'Leo · 后台协助与全量审计'];
      return ['学生课表', `${state.amyActive} · 固定位转让与权益交割`];

    /* ------------------------------------------------------------------
     * 日历主页面
     * ------------------------------------------------------------------ */
    function renderCalendar() {
      const [title, subtitle] = pageHeading();
      return `
        <div class="mx-auto w-full max-w-[720px] space-y-3 px-4 pb-6 pt-4">
          ${titleRow(title, subtitle)}
          ${roleNoticeCards()}

          ${legendBar()}

          </div>
        </div>`;
    }

    function childSelector() {
      return `
        <div class="rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
          <div class="text-[12px] font-medium text-slate-400">当前宝贝档案</div>
          <div class="mt-2 flex gap-1.5">
            ${['AliceZ12', 'BobZ10', 'CharlieZ08'].map((nick) => {
              const on = state.amyActive === nick;
              return `<button data-action="set-child" data-nick="${nick}" class="h-9 flex-1 rounded-xl text-[12px] font-bold ${on ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">${esc(nick)}</button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function transfereeProfile() {
      const s = STUDENTS.TomZ11;
      return `
        <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-3 shadow-sm">
          <div class="flex items-center justify-between gap-2">
            <div class="flex min-w-0 items-center gap-2">
              <div class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-emerald-200 text-[14px] font-bold text-emerald-800">${s.nickname.charAt(0)}</div>
              <div class="min-w-0">
                <div class="truncate text-[14px] font-bold text-emerald-900">${s.nickname} · ${s.gender} · ${s.age}岁</div>
                <div class="truncate text-[12px] font-medium text-emerald-700">${s.grade} · ${s.level}</div>
              </div>
            </div>
            <span class="shrink-0 rounded-full border border-emerald-200 bg-white px-2 py-0.5 text-[12px] font-bold text-emerald-700">受让方</span>
          </div>
        </div>`;
    }

    function roleNoticeCards() {
      const t = activeTransfer();
      if (state.role === 'david' && t) {
        return `
          <button data-action="open-memo" class="w-full text-left rounded-2xl border border-rose-200 bg-rose-50 p-3.5 shadow-sm">
            <div class="flex items-center justify-between text-[12px] font-bold text-rose-700">
              <span>学员变更通知</span><span>站内信 + 邮件</span>
            </div>
            <div class="mt-1 text-[14px] font-medium leading-relaxed text-rose-900">${t.from} 已变更为 ${t.to}，点击查看受让学员留言板与学情。</div>
          </button>`;
      }
      if (state.role === 'helen') {
        return t ? `
          <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-3.5 shadow-sm">
            <div class="flex items-center justify-between text-[12px] font-bold text-emerald-700"><span>受让课次已到账</span><span>已交割</span></div>
            <div class="mt-1 text-[14px] font-medium leading-relaxed text-emerald-900">由 ${t.from} 转让而来，课表已加注【转】角标；禁止二次转让，保留 1 次同师挪位。</div>
          </div>` : `
          <div class="rounded-2xl border border-slate-200 bg-white p-3.5 shadow-sm text-[14px] font-medium text-slate-500">暂无受让课次。可切换场景「已受让」查看受让方视角。</div>`;
      }
      if (state.role === 'leo') return monitorSummary();
      return '';
    }

    function monitorSummary() {
      const lesson = fixedLesson();
      const t = activeTransfer();
      const locked = state.scenario === 'locked';
      const assistDisabled = !!t || locked || state.online === 'off';
      const assistLabel = t ? '该课次已完成代办交割' : locked ? '开课前 3 小时内锁定' : state.online === 'off' ? '离线只读' : '后台协助转让';
      return `
        <div class="rounded-2xl bg-indigo-950 p-4 text-white shadow-sm">
          <div class="flex items-center justify-between text-[12px] font-medium text-indigo-200">
            <span>班长代办工作台</span><span>${t ? '已完成交割' : '待协助'}</span>
          </div>
          <h2 class="mt-1 text-[16px] font-bold">${esc(lesson.course)}</h2>
          <p class="mt-0.5 text-[12px] font-medium text-indigo-200">${fmtDate(lesson.date)} · ${lesson.time} - ${endTime(lesson.time)} · ${lesson.teacher}</p>
          <div class="mt-3 grid grid-cols-3 gap-1.5 text-[12px]">
            <div class="rounded-xl bg-white/10 p-2"><div class="text-indigo-300">实际上课</div><div class="mt-0.5 font-semibold">${esc(lesson.actualStudent)}</div></div>
            <div class="rounded-xl bg-white/10 p-2"><div class="text-indigo-300">资金持有</div><div class="mt-0.5 font-semibold">Leo 锁定</div></div>
            <div class="rounded-xl bg-white/10 p-2"><div class="text-indigo-300">购课单</div><div class="mt-0.5 font-mono font-semibold">ORD_0091</div></div>
          </div>
          <button data-action="open-monitor" ${assistDisabled ? 'disabled' : ''} class="mt-3 h-10 w-full rounded-xl text-[14px] font-bold ${assistDisabled ? 'bg-white/10 text-indigo-200' : 'bg-white text-indigo-900'} disabled:cursor-not-allowed">${assistLabel}</button>
        </div>`;
    }

    function weekHeader() {
      return `
        <div class="flex items-center justify-between gap-2">
          <button data-action="toast" data-message="原型固定演示 2026 年第 46 周" class="grid h-8 w-8 place-items-center rounded-lg border border-slate-200 bg-white text-slate-600">${icon('chevron-left', 'h-4 w-4')}</button>
          <div class="text-center">
            <div class="text-[14px] font-bold text-slate-800">2026 年第 46 周</div>
            <div class="mt-0.5 text-[12px] font-medium text-slate-400">11-09 周一 至 11-15 周日</div>
          </div>
          <button data-action="toast" data-message="原型固定演示 2026 年第 46 周" class="grid h-8 w-8 place-items-center rounded-lg border border-slate-200 bg-white text-slate-600">${icon('chevron-right', 'h-4 w-4')}</button>
        </div>`;
    }

    function legendBar() {
      const items = [
        ['bg-amber-500', '固定位'], ['bg-yellow-400', '临时课'], ['bg-blue-500', '被代课'],
        ['bg-emerald-500', '可约'], ['bg-rose-500', '请假'], ['bg-slate-200', '不可约']
      ];
      return `
        <div class="flex flex-wrap items-center gap-x-2 gap-y-1 rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-[12px] font-medium text-slate-600">
          ${items.map(([c, l]) => `<span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded ${c}"></span>${l}</span>`).join('')}
          <span class="ml-auto inline-flex items-center gap-1 rounded bg-rose-600 px-1.5 py-0.5 text-[12px] font-bold text-white">转</span>
          <span class="text-slate-500">受让课次</span>
        </div>`;
    }

    function buildGrid() {
      const grid = {};
      const t = activeTransfer();
      const lesson = fixedLesson();
      const student = currentStudent();
      const teacherLike = state.role === 'david' || state.role === 'leo';

      for (let d = 0; d < 7; d += 1) {
        const date = isoAdd(WEEK_START, d);
        grid[date] = {};
        TIME_SLOTS.forEach((time) => {
          const hour = Number(time.slice(0, 2));
          const open = hour >= 14 && hour < 18;
          grid[date][time] = {
            kind: open ? 'free' : 'rest',
            color: open ? 'GREEN' : 'GRAY',
            text: open ? '约' : '休',
            title: open ? '空闲可约' : '教师未开放'
          };
        });
      }

      grid['2026-11-12']['17:00'] = { kind: 'leave', color: 'RED', text: '假', title: '教师已请假' };

      let showFixed = false;
      if (teacherLike) showFixed = true;
      else if (t) showFixed = student === t.to;
      else showFixed = student === 'AliceZ12';
      if (showFixed) {
        grid[FIXED.date][FIXED.time] = {
          kind: 'fixed',
          color: 'ORANGE',
          text: lesson.actualStudent.slice(0, 4),
          title: `1v1 固定位 · ${lesson.actualStudent} · ${lesson.teacher}${lesson.isTransferred ? ' · 受让课次' : ''}`,
          transferred: lesson.isTransferred
        };
      } else if (t && student === t.from) {
        grid[FIXED.date][FIXED.time].title = `原固定位已转给 ${t.to}，恢复空闲`;
      }

      const showTemp = teacherLike || student === 'AliceZ12';
      if (showTemp) {
        grid[TEMP.date][TEMP.time] = {
          kind: 'temp',
          color: 'YELLOW',
          text: TEMP.student.slice(0, 4),
          title: `1v1 临时课 · ${TEMP.student} · ${TEMP.teacher}`
        };
      }
      return grid;
    }

    function gridCellHTML(date, time, cell) {
      const colorCls = {
        ORANGE: 'bg-amber-50 border-amber-300 text-amber-900',
        YELLOW: 'bg-yellow-50 border-yellow-300 text-yellow-900',
        BLUE: 'bg-blue-50 border-blue-300 text-blue-900',
        GREEN: 'bg-emerald-50/80 border-emerald-200 text-emerald-700',
        GRAY: 'bg-slate-100 border-slate-200 text-slate-400',
        RED: 'bg-rose-50 border-rose-200 text-rose-700'
      }[cell.color] || 'bg-slate-100 border-slate-200 text-slate-400';
      const badge = cell.transferred
        ? '<span class="absolute right-0.5 top-0 grid h-3.5 w-3.5 place-items-center rounded bg-rose-600 text-[11px] font-bold leading-none text-white">转</span>'
        : '';
      const action = cell.kind === 'fixed' || cell.kind === 'temp'
        ? `data-action="open-lesson" data-kind="${cell.kind}"`
        : `data-action="toast" data-message="${esc(cell.title)}"`;
      const padding = cell.transferred ? 'pr-3' : '';
      const displayText = cell.transferred ? cell.text.slice(0, 3) : cell.text;
      return `<td class="border-b border-r border-slate-100 p-[2px] align-middle">
        <button ${action} title="${esc(cell.title)}" class="relative flex h-7 w-full items-center justify-center overflow-hidden rounded-md border text-[11px] font-bold leading-none transition active:scale-95 ${colorCls}">
          <span class="truncate px-0.5 ${padding}">${esc(displayText)}</span>${badge}
        </button>
      </td>`;
    }

    function excelGridHTML() {
      const grid = buildGrid();
      return `
        <div class="overflow-hidden rounded-xl border border-slate-200 bg-white">
          <div id="excelScroll" class="max-h-[520px] overflow-auto">
            <table class="w-full table-fixed border-collapse">
              <thead>
                <tr>
                  <th class="sticky left-0 top-0 z-40 w-[40px] border-b border-r border-slate-200 bg-slate-100 px-0 py-1 text-center text-[12px] font-bold text-slate-500">时段</th>
                  ${Array.from({ length: 7 }, (_, i) => {
                    const date = isoAdd(WEEK_START, i);
                    const isToday = date === TODAY;
                    const isLessonDay = date === FIXED.date;
                    return `<th class="sticky top-0 z-30 border-b border-r border-slate-200 ${isToday ? 'bg-amber-100 text-amber-900' : isLessonDay ? 'bg-amber-50 text-amber-900' : 'bg-slate-50 text-slate-600'} px-0.5 py-1 text-center">
                      <div class="text-[12px] font-bold leading-tight">${DAY_LABELS[i]}</div>
                      <div class="font-mono text-[12px] font-semibold leading-tight ${isToday ? 'text-amber-800' : 'text-slate-400'}">${date.slice(5)}</div>
                    </th>`;
                  }).join('')}
                </tr>
              </thead>
              <tbody>
                ${TIME_SLOTS.map((time) => `
                  <tr class="h-8">
                    <th data-time="${time}" class="sticky left-0 z-20 w-[40px] border-b border-r border-slate-200 bg-slate-100 px-0 text-center text-[12px] font-mono font-semibold text-slate-500">${time}</th>
                    ${Array.from({ length: 7 }, (_, i) => gridCellHTML(isoAdd(WEEK_START, i), time, grid[isoAdd(WEEK_START, i)][time])).join('')}
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
        <div class="flex items-center justify-between text-[12px] font-medium text-slate-400">
          <span class="truncate">格内为学员昵称前 4 位，红底【转】为受让课次</span>
          <span class="shrink-0 font-mono">7 天 × 36 时段</span>
        </div>`;
    }

    function scrollGridToPrime() {
      const el = document.getElementById('excelScroll');
      if (!el) return;
      const anchor = el.querySelector('th[data-time="14:00"]');
      if (!anchor) return;
      const head = el.querySelector('thead');
      const delta = anchor.getBoundingClientRect().top - el.getBoundingClientRect().top + el.scrollTop;
      el.scrollTop = Math.max(0, delta - (head ? head.getBoundingClientRect().height : 40));
    }

    /* ------------------------------------------------------------------
     * 转让明细 / 通知页
     * ------------------------------------------------------------------ */
    function transferRecord() {
      const t = activeTransfer();
      if (!t) return null;
      return {
        from: t.from,
        to: t.to,
        type: t.type,
        scope: t.scope,
        operator: t.operator,
        at: t.at,
        note: t.note,
        teacher: FIXED.teacher,
        slot: `${fmtDate(FIXED.date)} ${FIXED.time}`,
        status: '已交割',
        orderId: FIXED.orderId,
        holder: FIXED.holder
      };
    }

    function filteredRecords() {
      const record = transferRecord();
      if (!record) return [];
      if (state.role === 'david' || state.role === 'leo') return [record];
      const student = currentStudent();
      if (!student) return [];
      if (state.auditTab === 'out') return record.from === student ? [record] : [];
      return record.to === student ? [record] : [];
    }

    function renderAuditPage() {
      const [title, subtitle] = pageHeading();
      const records = filteredRecords();
      const isParent = state.role === 'amy' || state.role === 'helen';
      const tabs = isParent ? `
        <div class="grid grid-cols-2 gap-1 rounded-xl bg-slate-100 p-1">
          ${[['out', '转出记录'], ['in', '转入记录']].map(([key, label]) => `<button data-action="audit-tab" data-tab="${key}" class="h-8 rounded-lg text-[12px] font-bold transition ${state.auditTab === key ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}">${label}</button>`).join('')}
        </div>` : '';
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-3' : 'space-y-3';
      return `
        <div class="mx-auto w-full max-w-[720px] space-y-3 px-4 pb-6 pt-4">
          ${titleRow(title, subtitle)}
          ${tabs}
          <div class="${grid}">
            ${records.length ? records.map((r) => {
              const other = isParent ? (state.auditTab === 'out' ? r.to : r.from) : `${r.from} → ${r.to}`;
              return `<article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                <div class="flex items-center justify-between gap-2">
                  <span class="truncate text-[12px] font-medium text-slate-400">${esc(r.at)}</span>
                  <span class="shrink-0 rounded-full border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[12px] font-bold text-emerald-700">${esc(r.status)}</span>
                </div>
                <div class="mt-2 grid grid-cols-2 gap-1.5 text-[12px]">
                  <div class="rounded-lg bg-slate-50 px-2.5 py-2"><div class="text-slate-400">授课教师</div><div class="mt-0.5 text-[14px] font-semibold text-slate-800">${esc(r.teacher)}</div></div>
                  <div class="rounded-lg bg-slate-50 px-2.5 py-2"><div class="text-slate-400">原排课</div><div class="mt-0.5 font-mono text-[12px] font-semibold text-slate-800">${esc(r.slot)}</div></div>
                  <div class="rounded-lg bg-slate-50 px-2.5 py-2"><div class="text-slate-400">${isParent ? '对方学员' : '转让双方'}</div><div class="mt-0.5 font-mono text-[12px] font-semibold text-slate-800">${esc(other)}</div></div>
                  <div class="rounded-lg bg-slate-50 px-2.5 py-2"><div class="text-slate-400">转让类型</div><div class="mt-0.5 text-[14px] font-semibold text-slate-800">${esc(typeLabel(r))}</div></div>

    /* ------------------------------------------------------------------
     * 弹层

    function renderOverlay() {
      const el = document.getElementById('overlay');
      let html = '';
      if (state.modal === 'transfer') html += renderTransferModal();
      else if (state.modal === 'detail') html += renderDetailModal();
      else if (state.modal === 'memo') html += renderMemoModal();
      else if (state.modal === 'monitor') html += renderMonitorModal();
      else if (state.modal === 'reschedule') html += renderRescheduleModal();
      if (state.confirmOpen) html += renderConfirmModal();
      el.innerHTML = html;
      lucide.createIcons();
    }

    function modalShell(content, width = 'max-w-[420px]', closeAction = 'close-modal') {
      return `
        <div class="absolute inset-0 z-50">
          <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]" data-action="${closeAction}"></div>

    }

      return `

    }

    function modalHeader(title, subtitle = '', iconName = 'arrow-left-right', rose = false) {

            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
              ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}

    /* ------------------------------------------------------------------
     * 转让弹窗
     * ------------------------------------------------------------------ */
    function openTransferModal() {
      if (!guardWrite()) return;
      const lesson = fixedLesson();
      if (lesson.type === 'temp') return showToast('临时课仅支持请假退期待排，不可转让', true);
      if (lesson.isTransferred) return showToast('受让课程不可二次转让', true);
      if (lesson.hours < 3) return showToast('开课前 3 小时内锁定，禁止转让', true);
      if (state.role !== 'amy' && state.role !== 'helen') return showToast('当前角色不可发起转让', true);
      state.modal = 'transfer';
      state.confirmOpen = false;
      state.transferTab = 'family';
      state.verified = null;
      state.verifyError = null;
      state.nickInput = 'TomZ11';
      renderOverlay();
    }

    function renderTransferModal() {
      const lesson = fixedLesson();
      const from = FIXED.student;
      const current = STUDENTS[from];
      const siblings = Object.values(STUDENTS).filter((s) => s.account === current.account && s.nickname !== from);
      const isFamily = state.transferTab === 'family';
      const verified = state.verified;
      const error = state.verifyError;

      const profileCard = verified ? `
        <div class="rounded-xl border border-emerald-300 bg-emerald-50 p-3">

          </div>
          <div class="mt-2 flex items-center gap-2.5">
            <div class="grid h-10 w-10 place-items-center rounded-full bg-emerald-200 text-[14px] font-bold text-emerald-800">${verified.nickname.charAt(0)}</div>
            <div class="min-w-0">
              <div class="text-[14px] font-bold text-slate-800">${esc(verified.nickname)}</div>

            </div>
          </div>
          <div class="mt-2 flex items-center justify-between gap-2 border-t border-emerald-200 pt-2 text-[12px]">
            <span class="rounded px-1.5 py-0.5 font-semibold ${verified.match ? 'bg-emerald-200 text-emerald-900' : 'bg-amber-200 text-amber-900'}">${verified.match ? '技能匹配' : '偏好不一致，不阻断'}</span>
            <span class="text-slate-500">${esc(verified.level)}</span>
          </div>
        </div>` : '';

      const errorCard = error ? `
        <div class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-[12px] font-medium text-rose-700">${esc(error)}</div>` : '';

      return modalShell(`
        ${modalHeader('固定位课程转让', `${fmtDate(FIXED.date)} · ${FIXED.time} - ${endTime(FIXED.time)} · ${FIXED.teacher}`)}

          <div class="flex items-center justify-between py-0.5"><span class="text-slate-400">授课教师</span><span class="font-semibold text-slate-800">${FIXED.teacher}</span></div>
          <div class="flex items-center justify-between py-0.5"><span class="text-slate-400">课程类型</span><span class="font-semibold text-slate-800">1v1 固定位 · ${esc(FIXED.course)}</span></div>
          <div class="flex items-center justify-between py-0.5"><span class="text-slate-400">财课分离</span><span class="font-semibold text-emerald-700">出资 Amy / 持有 Leo 不变</span></div>
        </div>

        <div class="mt-3 grid grid-cols-2 gap-1 rounded-xl bg-slate-100 p-1">
          <button data-action="transfer-tab" data-tab="family" class="h-8 rounded-lg text-[12px] font-bold transition ${isFamily ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">同家庭直转</button>

        </div>

        ${isFamily ? `
          <div class="mt-3 space-y-2">
            <label for="familyRecipient" class="block text-[12px] font-medium text-slate-500">选择名下其他孩子</label>
            <select id="familyRecipient" class="h-11 w-full rounded-xl border border-indigo-200 bg-indigo-50 px-3 text-[16px] font-medium text-indigo-900 outline-none">
              ${siblings.length ? siblings.map((s) => `<option value="${s.nickname}">${esc(s.nickname)} · ${s.gender} · ${s.age}岁</option>`).join('') : '<option value="">暂无其他孩子档案</option>'}

            <div class="rounded-xl border border-indigo-100 bg-indigo-50/70 px-3 py-2 text-[12px] font-medium leading-relaxed text-indigo-900">转让后该课次将直接呈现在所选孩子课表，并加注【转】角标；出资家长与资金持有方不变，原出资家长仍可退款。</div>
            <div class="flex gap-2 pt-1">

              <button data-action="commit-family" ${state.online === 'off' || !siblings.length ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认划转</button>

          </div>` : `
          <div class="mt-3 space-y-2">

              <button data-action="verify" class="h-11 shrink-0 rounded-xl bg-slate-800 px-3 text-[14px] font-semibold text-white">${icon('search', 'h-3.5 w-3.5')}验证</button>

            <p class="text-[12px] font-medium text-slate-400">格式：英文名 + 姓首字母 + 年龄，如 TomZ11。大小写不敏感。</p>

            <div class="flex gap-2 pt-1">

    function renderConfirmModal() {
      const recipient = state.verified;

    function openDetail(kind) {
      state.lessonKind = kind;
      state.modal = 'detail';
      state.confirmOpen = false;
      renderOverlay();
    }

    function renderDetailModal() {
      const isTemp = state.lessonKind === 'temp';
      const lesson = isTemp
        ? { ...TEMP, isTransferred: false, actualStudent: TEMP.student, originalStudent: null, hours: state.scenario === 'locked' ? 2 : 48, rescheduleCount: state.rescheduleCount }
        : fixedLesson();
      const t = activeTransfer();
      const isFixed = !isTemp;
      const canReschedule = isFixed && lesson.rescheduleCount === 0 && lesson.hours >= 3 && state.online === 'on';
      const canTransfer = isFixed && !lesson.isTransferred && lesson.hours >= 3 && state.online === 'on';
      const transferred = lesson.isTransferred;
      const scope = t ? t.scope : null;
      const typeCls = isTemp ? 'bg-yellow-50 text-yellow-800 border-yellow-200' : 'bg-amber-50 text-amber-800 border-amber-200';

      let actions = '';
      if (state.role === 'david') {
        actions = `<button data-action="open-memo" class="h-11 w-full rounded-xl bg-slate-800 text-[14px] font-bold text-white">查看学员留言板</button>`;
      } else if (state.role === 'leo') {
        const disabled = transferred || lesson.hours < 3 || state.online === 'off';
        actions = `<button data-action="open-monitor" ${disabled ? 'disabled' : ''} class="h-11 w-full rounded-xl text-[14px] font-bold ${disabled ? 'bg-slate-100 text-slate-400' : 'bg-indigo-900 text-white'} disabled:cursor-not-allowed">${transferred ? '该课次已完成代办交割' : lesson.hours < 3 ? '开课前 3 小时内锁定' : '后台协助转让'}</button>`;
      } else if (isTemp) {
        actions = `<div class="rounded-xl border border-yellow-200 bg-yellow-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-yellow-900">临时课仅支持请假退期待排，不可发起转让。</div>`;
      } else {
        const reschedule = canReschedule
          ? `<button data-action="open-reschedule" class="h-10 w-full rounded-xl border border-slate-300 bg-white text-[13px] font-semibold text-slate-700">同师挪位（1 次 · 免扣配额）</button>`
          : `<button disabled class="h-10 w-full rounded-xl bg-slate-100 text-[13px] font-semibold text-slate-400">${lesson.rescheduleCount >= 1 ? '该课次已挪位，不可再次挪位' : '当前不可挪位'}</button>`;
        const transferBtn = transferred
          ? `<button disabled class="h-11 w-full rounded-xl bg-slate-100 text-[14px] font-bold text-slate-400">受让课程不可二次转让</button>`
          : lesson.hours < 3
            ? `<button disabled class="h-11 w-full rounded-xl bg-slate-100 text-[14px] font-bold text-slate-400">开课前 3 小时内锁定，禁止转让</button>`

      return sheetShell(`
        <div class="flex items-start justify-between gap-3">

                ${transferred ? '<span class="rounded bg-rose-100 px-1.5 py-0.5 text-[12px] font-bold text-rose-700">【转】</span>' : ''}

              <p class="mt-0.5 text-[12px] font-medium text-slate-400">${fmtDate(lesson.date)} · ${lesson.time} - ${endTime(lesson.time)} · ${lesson.teacher}</p>

          <div class="rounded-xl bg-slate-50 px-3 py-2"><div class="text-slate-400">上课学员</div><div class="mt-0.5 font-mono text-[14px] font-semibold text-slate-800">${esc(lesson.actualStudent)}</div></div>

          <div class="rounded-xl bg-slate-50 px-3 py-2"><div class="text-slate-400">距开课</div><div class="mt-0.5 text-[14px] font-semibold ${lesson.hours < 3 ? 'text-rose-600' : 'text-emerald-700'}">${lesson.hours} 小时</div></div>
        </div>

        <div class="mt-2 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-[12px]">
          <div class="flex justify-between py-1"><span class="text-slate-400">出资家长</span><span class="font-semibold text-slate-800">Amy 不变</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">购课单</span><span class="font-mono font-semibold text-slate-800">${esc(lesson.orderId)}</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">资金持有方</span><span class="font-semibold text-emerald-700">${esc(lesson.holder)} 锁定</span></div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-400">财课分离：转让不改动出资人、购课单与资金持有方。</p>
          ${transferred ? `<div class="mt-1.5 rounded-lg px-2.5 py-2 text-[12px] font-medium leading-relaxed ${scope === 'external' ? 'bg-rose-50 text-rose-700' : 'bg-emerald-50 text-emerald-700'}">${scope === 'external' ? '跨家长转让：原出资家长不可对该课次申请退款（M2B 已锁定）。' : '同家庭直转：原出资家长仍可对该课次申请退款。'}</div>` : ''}
        </div>

        <div class="mt-3 space-y-2">${actions}</div>
        <button data-action="close-modal" class="mt-2 h-10 w-full rounded-xl bg-slate-100 text-[14px] font-medium text-slate-600">关闭</button>
      `);
    }

    function openMonitorModal() {
      if (!guardWrite()) return;
      const lesson = fixedLesson();
      if (lesson.isTransferred) return showToast('该课次已完成交割', true);
      if (lesson.hours < 3) return showToast('开课前 3 小时内锁定，禁止转让', true);
      if (state.role !== 'leo') return;
      state.modal = 'monitor';
      state.confirmOpen = false;
      renderOverlay();
    }

    function renderMonitorModal() {
      const options = Object.values(STUDENTS)
        .filter((s) => s.nickname !== FIXED.student)
        .map((s) => `<option value="${s.nickname}">${esc(s.nickname)} · ${s.parent} 名下 · ${s.age}岁</option>`)
        .join('');
      return modalShell(`
        ${modalHeader('后台协助转让', '操作人 Leo 班长 · 审计留痕', 'user-cog')}
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-[12px]">
          <div class="flex justify-between py-1"><span class="text-slate-400">待转排课</span><span class="font-semibold text-slate-800">${fmtDate(FIXED.date)} ${FIXED.time}</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">原排课学员</span><span class="font-mono font-semibold text-slate-800">AliceZ12</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">资金持有方</span><span class="font-semibold text-emerald-700">Leo 班长 锁定</span></div>
        </div>
        <label for="monitorRecipient" class="mt-3 block text-[12px] font-medium text-slate-500">选择接收学员档案</label>
        <select id="monitorRecipient" class="mt-1 h-11 w-full rounded-xl border border-slate-300 bg-white px-3 text-[16px] outline-none">${options}</select>
        <label for="monitorNote" class="mt-3 block text-[12px] font-medium text-slate-500">代办转让原因及交割备注</label>
        <textarea id="monitorNote" rows="3" maxlength="200" class="mt-1 h-24 w-full resize-none rounded-xl border border-slate-300 p-3 text-[16px] outline-none" placeholder="例如：家长微信群已结清打款，电话委托班长代办"></textarea>
        <p class="mt-1 text-[12px] font-medium text-slate-400">1 至 200 字，备注将写入审计快照并派发协同通知。</p>
        <div class="mt-3 flex gap-2">
          <button data-action="close-modal" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">取消</button>
          <button data-action="commit-monitor" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-900 text-[16px] font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认代办划转</button>
        </div>`);
    }

    function openRescheduleModal() {
      if (!guardWrite()) return;
      const lesson = fixedLesson();
      if (lesson.rescheduleCount >= 1) return showToast('该课次已挪位，不可再次挪位', true);
      if (lesson.hours < 3) return showToast('开课前 3 小时内不可挪位', true);
      state.modal = 'reschedule';
      state.confirmOpen = false;
      renderOverlay();
    }

    function renderRescheduleModal() {
      const slots = [
        { label: '11-18 (周三) 16:00 - 16:30', value: '11-18 周三 16:00' },
        { label: '11-20 (周五) 15:00 - 15:30', value: '11-20 周五 15:00' },
        { label: '11-21 (周六) 17:00 - 17:30', value: '11-21 周六 17:00' }
      ];
      return sheetShell(`
        ${modalHeader('同师挪位', 'David Miller · 仅 1 次 · 免扣请假配额', 'calendar-range')}
        <div class="mt-3 rounded-xl border border-emerald-200 bg-emerald-50 px-3.5 py-2.5 text-[12px] font-medium leading-relaxed text-emerald-800">受让课次保留 1 次同师挪位权益；挪位不改变授课教师、出资家长与资金持有方。</div>
        <div class="mt-3 space-y-2">
          ${slots.map((s) => `<button data-action="commit-reschedule" data-slot="${esc(s.value)}" class="flex h-12 w-full items-center justify-between rounded-xl border border-emerald-200 bg-emerald-50 px-3.5 text-[14px] font-semibold text-emerald-900">
            <span>${esc(s.label)}</span><span class="rounded bg-white px-2 py-0.5 text-[12px] font-bold text-emerald-700">选择</span>
          </button>`).join('')}
        </div>
        <button data-action="close-modal" class="mt-3 h-10 w-full rounded-xl bg-slate-100 text-[14px] font-medium text-slate-600">取消</button>`);
    }

    function openMemoModal() {
      state.modal = 'memo';
      state.confirmOpen = false;
      renderOverlay();
    }

    function renderMemoModal() {
      const lesson = fixedLesson();
      const t = activeTransfer();
      const student = STUDENTS[lesson.actualStudent] || STUDENTS.AliceZ12;
      return sheetShell(`
        ${modalHeader('受让学员备课学情', `${fmtDate(FIXED.date)} ${FIXED.time} · ${FIXED.course}`, 'book-open')}
        ${t ? `<div class="mt-2 rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-2.5 text-[12px] font-medium leading-relaxed text-amber-900">学员变更：${t.from} 已转让给 ${t.to}。请按 ${t.to} 的进度备课。</div>` : ''}
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-[12px]">
          <div class="flex justify-between py-1"><span class="text-slate-400">学员昵称</span><span class="font-mono font-semibold text-slate-800">${esc(student.nickname)}</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">性别与年龄</span><span class="font-semibold text-slate-800">${student.gender} · ${student.age}岁</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">年级</span><span class="font-semibold text-slate-800">${esc(student.grade)}</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">当前水平</span><span class="font-semibold text-emerald-700">${esc(student.level)}</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">学习重点</span><span class="font-semibold text-slate-800">${esc(student.focus)}</span></div>
        </div>
        <div class="mt-2 rounded-xl border border-indigo-100 bg-indigo-50/70 px-3.5 py-2.5 text-[12px] text-indigo-900">
          <div class="flex justify-between text-[12px] font-bold text-indigo-700"><span>转让方留言</span><span>${t ? esc(t.at) : '暂无'}</span></div>
          <p class="mt-1 font-medium leading-relaxed">${t ? esc(t.note) : '本周暂无转让留言。'}</p>
        </div>
        <button data-action="close-modal" class="mt-3 h-10 w-full rounded-xl bg-slate-800 text-[14px] font-medium text-white">已了解学情并备课</button>`);
    }

    /* ------------------------------------------------------------------
     * 提交动作
     * ------------------------------------------------------------------ */
    function verifyNickname() {
      const raw = (state.nickInput || '').trim();
      state.verified = null;
      state.verifyError = null;
      if (!/^[A-Za-z]+[A-Za-z][0-9]{1,2}$/.test(raw)) {
        state.verifyError = '未找到该学员，请核对昵称格式。';
        renderOverlay();
        return;
      }
      const found = Object.values(STUDENTS).find((s) => s.nickname.toLowerCase() === raw.toLowerCase());
      if (!found) {
        state.verifyError = '未找到该学员，请核对昵称格式。';
        renderOverlay();
        return;
      }
      if (found.nickname === FIXED.student) {
        state.verifyError = '禁止自己转给自己，请选择其他学员。';
        renderOverlay();
        return;
      }
      if (found.account === STUDENTS[FIXED.student].account) {
        state.verifyError = '该学员与本课次同属一个家庭账号，请使用【同家庭直转】。';
        renderOverlay();
        return;
      }
      state.verified = found;
      renderOverlay();
    }

    function commitFamilyTransfer() {
      if (!guardWrite()) return;
      const select = document.getElementById('familyRecipient');
      const to = select ? select.value : '';
      if (!to) return showToast('请选择接收孩子', true);
      const from = FIXED.student;
      state.transfer = {
        from, to, type: 'family', scope: 'family', operator: 'Amy',
        at: stamp(), note: '同家庭多孩直转，出资家长与资金持有方不变'
      };
      state.rescheduleCount = 0;
      state.modal = null;
      state.confirmOpen = false;
      state.amyActive = to;
      state.role = 'amy';
      state.page = 'board';
      state.navTab = 'schedule';
      state.view = 'calendar';
      state.auditTab = 'in';
      renderAll();
      showToast(`已划转给 ${to}，课表已挂载【转】角标；原家长退款权保留`);
    }

    function commitExternalTransfer() {
      if (!guardWrite()) return;
      if (!state.verified) return showToast('请先验证接收学员', true);
      const from = FIXED.student;
      const to = state.verified.nickname;
      state.transfer = {
        from, to, type: 'external', scope: 'external', operator: 'Amy',
        at: stamp(), note: '家长自助转让，线下资金已结清'
      };
      state.rescheduleCount = 0;
      state.modal = null;
      state.confirmOpen = false;
      state.role = 'helen';
      state.page = 'board';
      state.view = 'calendar';
      state.navTab = 'schedule';
      state.auditTab = 'in';
      renderAll();
      showToast(`转让已生效，${to} 课表已加注【转】角标；原家长退款入口已锁定`);
    }

    function commitMonitorTransfer() {
      if (!guardWrite()) return;
      const recipient = document.getElementById('monitorRecipient');
      const noteEl = document.getElementById('monitorNote');
      const to = recipient ? recipient.value : '';
      const note = noteEl ? noteEl.value.trim() : '';
      if (!to) return showToast('请选择接收学员', true);
      if (note.length < 1 || note.length > 200) return showToast('请填写 1 至 200 字的代办备注', true);
      const from = FIXED.student;
      state.transfer = {
        from, to, type: 'proxy', scope: transferScope(from, to), operator: 'Leo 班长',
        at: stamp(), note
      };
      state.rescheduleCount = 0;
      state.modal = null;
      state.confirmOpen = false;
      state.role = 'leo';
      state.page = 'board';
      state.navTab = 'ops';
      state.view = 'calendar';
      renderAll();
      showToast(`代办交割完成，已划转给 ${to}；审计日志已写入`);
    }

    function commitReschedule(slot) {
      if (!guardWrite()) return;
      state.rescheduleCount = 1;
      state.modal = null;
      state.confirmOpen = false;
      renderAll();
      showToast(`已提交同师挪位：${slot} · 免扣请假配额`);
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.className = `pointer-events-none absolute bottom-24 left-1/2 z-[100] w-max max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl px-4 py-2 text-center text-[12px] font-semibold leading-relaxed text-white shadow-xl ${isError ? 'bg-rose-600/95' : 'bg-slate-900/90'}`;
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.add('hidden'), 2800);
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'set-view') return setView(el.dataset.view);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'set-child') return setAmyStudent(el.dataset.nick);
      if (action === 'audit-tab') { state.auditTab = el.dataset.tab; renderAll(); return; }
      if (action === 'open-lesson') return openDetail(el.dataset.kind);
      if (action === 'open-transfer') return openTransferModal();
      if (action === 'open-reschedule') return openRescheduleModal();
      if (action === 'open-monitor') return openMonitorModal();
      if (action === 'open-memo') return openMemoModal();
      if (action === 'transfer-tab') {
        state.transferTab = el.dataset.tab;
        state.verified = null;
        state.verifyError = null;
        renderOverlay();
        return;
      }
      if (action === 'verify') return verifyNickname();
      if (action === 'show-confirm') {
        if (!state.verified) return showToast('请先验证接收学员', true);
        state.confirmOpen = true;
        renderOverlay();
        return;
      }
      if (action === 'commit-external') return commitExternalTransfer();
      if (action === 'commit-family') return commitFamilyTransfer();
      if (action === 'commit-monitor') return commitMonitorTransfer();
      if (action === 'commit-reschedule') return commitReschedule(el.dataset.slot);
      if (action === 'close-confirm') { state.confirmOpen = false; renderOverlay(); return; }
      if (action === 'close-modal') { state.modal = null; state.confirmOpen = false; renderOverlay(); return; }
    });

    document.getElementById('frame').addEventListener('input', (e) => {
      if (e.target.id === 'nickInput') {
        state.nickInput = e.target.value;
        state.verified = null;
        state.verifyError = null;
        const feedback = document.getElementById('verifyFeedback');
        if (feedback) feedback.innerHTML = '';
        const btn = document.getElementById('confirmExternalBtn');
        if (btn) {
          btn.disabled = true;
          btn.className = 'h-11 flex-[2] rounded-xl text-[16px] font-semibold cursor-not-allowed bg-slate-200 text-slate-400';
        }
      }
    });

    renderAll();
  </script>
</body>
</html>

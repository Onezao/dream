<!-- 即抛型页面：M3C 唯一转让中心。纯前端 Mock，不连接后端，不触碰生产代码。遵循 DESIGN.md、docs/prd/m3c_course_transfer.md 与 docs/prd/m3a_calendar_grid.md -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>课程转让 · 唯一转让中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Inter', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800 antialiased">

  <!-- 演示控制台（不属于产品界面） -->
  <header class="sticky top-0 z-[70] w-full border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex w-full max-w-7xl flex-wrap items-center gap-x-4 gap-y-2 px-3 py-2.5 text-[12px]">
      <div class="flex min-w-0 items-center gap-2">
        <span class="grid h-6 w-6 shrink-0 place-items-center rounded-lg bg-slate-900 text-[12px] font-bold text-amber-300">3C</span>
        <span class="truncate text-[14px] font-bold text-slate-900">M3C · 唯一转让中心</span>
      </div>

      <div class="flex flex-wrap items-center gap-1.5">
        <span class="font-medium text-slate-600">角色</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="role" data-value="amy" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">Amy</button>
          <button data-group="role" data-value="leo" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">Leo 班长</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-1.5">
        <span class="font-medium text-slate-600">模式</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="mode" data-value="slot" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">固定位</button>
          <button data-group="mode" data-value="ts" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">纯 TS</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-1.5">
        <span class="font-medium text-slate-600">场景</span>
        <div class="inline-flex flex-wrap rounded-xl bg-slate-100 p-1">
          <button data-group="scenario" data-value="family" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">同家庭</button>
          <button data-group="scenario" data-value="external" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">跨家长</button>
          <button data-group="scenario" data-value="transferred" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">已受让</button>
          <button data-group="scenario" data-value="cutoff" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">&lt;3h</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-1.5">
        <span class="font-medium text-slate-600">设备</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="device" data-value="mobile" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">手机</button>
          <button data-group="device" data-value="tablet" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">平板</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-1.5">
        <span class="font-medium text-slate-600">网络</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="online" data-value="on" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">在线</button>
          <button data-group="online" data-value="off" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">离线</button>
        </div>
      </div>

      <button id="btnResetDemo" class="rounded-lg border border-slate-200 px-2.5 py-1.5 font-semibold text-slate-600 hover:bg-slate-50">重置</button>

      <a href="../docs/prd/m3c_course_transfer.md" target="_blank" rel="noopener" class="ml-auto inline-flex items-center gap-1.5 rounded-lg border border-slate-200 px-2.5 py-1.5 font-semibold text-slate-600 hover:bg-slate-50">
        <i data-lucide="file-text" class="h-3.5 w-3.5"></i>PRD 说明
      </a>
    </div>
  </header>

  <main class="flex w-full justify-center px-2 py-4 sm:px-4">
    <div id="frame" class="relative flex h-[812px] w-[390px] shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300">
      <div id="banner" class="shrink-0"></div>
      <div id="offlineBanner" class="hidden"></div>
      <div id="content" class="min-h-0 flex-1 overflow-y-auto"></div>
      <div id="overlay"></div>
      <div id="toast" class="pointer-events-none absolute bottom-8 left-1/2 z-[100] hidden w-max max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl bg-slate-900/90 px-4 py-2 text-center text-[12px] font-semibold leading-relaxed text-white shadow-xl"></div>
    </div>
  </main>

  <!-- Tailwind CDN 动态类安全垫 -->
  <div class="hidden">
    <span class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-800 bg-indigo-600 hover:bg-indigo-700 bg-emerald-600 hover:bg-emerald-700 bg-rose-600 hover:bg-rose-700 text-white"></span>
    <span class="border-amber-300 bg-amber-50 bg-amber-100 bg-amber-200 text-amber-900 text-amber-950 border-emerald-300 bg-emerald-50 bg-emerald-100 bg-emerald-200 text-emerald-800 text-emerald-900 text-emerald-950"></span>
    <span class="border-rose-200 bg-rose-50 bg-rose-100 text-rose-700 text-rose-800 text-rose-900 border-indigo-200 bg-indigo-50 bg-indigo-100 bg-indigo-200 text-indigo-700 text-indigo-800 text-indigo-900 text-indigo-950"></span>
    <span class="border-slate-200 bg-slate-50 bg-slate-100 bg-slate-200 text-slate-500 text-slate-600 text-slate-700 text-slate-900 h-[812px] w-[390px] h-[860px] w-[768px] max-w-[560px] max-w-[680px] max-w-[420px] grid-cols-2 grid-cols-3 grid-cols-5"></span>
    <span class="bg-slate-900/60 bg-white/15 bg-white/70 ring-white/20 ring-white/30 text-transparent border-slate-300"></span>
  </div>

  <script>
    /* ------------------------------------------------------------------
     * 1. Mock 数据与工具
     * ------------------------------------------------------------------ */
    const TODAY = '2026-11-10';
    const WEEK_START = '2026-11-09';
    const DAY_LABELS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    const FINANCE = { funder: 'Amy', holder: 'Leo 班长' };

    const STUDENTS = {
      AliceZ12: { nickname: 'AliceZ12', gender: '女', age: 12, grade: '六年级', parent: 'Amy', account: 'amy', level: 'KET 卓越', focus: '英语 KET 精读', match: true },
      BobZ10: { nickname: 'BobZ10', gender: '男', age: 10, grade: '四年级', parent: 'Amy', account: 'amy', level: 'KET 备考', focus: '英语 KET 基础', match: true },
      CharlieZ08: { nickname: 'CharlieZ08', gender: '男', age: 8, grade: '二年级', parent: 'Amy', account: 'amy', level: 'Starters', focus: '英语启蒙', match: false },
      TomZ11: { nickname: 'TomZ11', gender: '男', age: 11, grade: '五年级', parent: 'Helen', account: 'helen', level: 'KET 卓越', focus: '英语 KET 精读', match: true },
      CatherineW09: { nickname: 'CatherineW09', gender: '女', age: 9, grade: '三年级', parent: 'Eva', account: 'eva', level: 'PET 预备', focus: '英语 PET 冲刺', match: false }
    };

    const SLOTS = [
      { tsId: 'ts_fixed0001', weekday: 1, time: '19:00', teacher: 'David Miller', course: '1v1 英语 KET 精读' },
      { tsId: 'ts_fixed0002', weekday: 3, time: '18:30', teacher: 'David Miller', course: '1v1 英语 KET 精读' },
      { tsId: 'ts_fixed0003', weekday: 5, time: '10:00', teacher: 'David Miller', course: '1v1 英语 KET 精读' }
    ];

    const SEED_RECORDS = [
      {
        serial: 'TR-20261105-0817', from: 'AliceZ12', to: 'TomZ11', scope: 'external', operator: 'Amy',
        at: '2026-11-05 10:20', kind: 'slot', teacher: 'David Miller', course: '1v1 英语 KET 精读',
        date: '2026-11-10', time: '19:00', count: 1,
        lessons: [{ date: '2026-11-10', time: '19:00' }],
        note: '家长自助转让，线下资金已结清'
      },
      {
        serial: 'TR-20261106-0942', from: 'BobZ10', to: 'AliceZ12', scope: 'family', operator: 'Amy',
        at: '2026-11-06 09:42', kind: 'slot', teacher: 'David Miller', course: '1v1 英语 KET 精读',
        date: '2026-11-12', time: '17:30', count: 1,
        lessons: [{ date: '2026-11-12', time: '17:30' }],
        note: '同家庭多孩直转，出资家长与资金持有方不变'
      },
      {
        serial: 'TR-20261107-1105', from: 'CatherineW09', to: 'TomZ11', scope: 'external', operator: 'Leo 班长',
        at: '2026-11-07 11:05', kind: 'ts', teacher: '不绑定教师', course: '自由 TS 课时',
        date: null, time: null, count: 2, lessons: [],
        note: '家长微信群已结清打款，电话委托班长代办'
      }
    ];

    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function isoToTs(iso) { return Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10))); }
    function isoAdd(iso, days) { return new Date(isoToTs(iso) + days * 86400000).toISOString().slice(0, 10); }
    function weekdayLabel(iso) { return DAY_LABELS[(new Date(isoToTs(iso)).getUTCDay() + 6) % 7]; }
    function fmtDate(iso) { return `${iso.slice(5)} (${weekdayLabel(iso)})`; }
    function endTime(time) {
      const [h, m] = time.split(':').map(Number);
      const total = h * 60 + m + 30;
      return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
    }
    function findByNick(nick) {
      return Object.values(STUDENTS).find((s) => s.nickname.toLowerCase() === String(nick || '').trim().toLowerCase()) || null;
    }

    /* ------------------------------------------------------------------
     * 2. 状态与入口参数
     * ------------------------------------------------------------------ */
    const params = new URLSearchParams(location.search);
    const state = {
      role: 'amy',
      mode: 'slot',
      scenario: 'family',
      device: 'mobile',
      online: 'on',
      page: 'create',
      tab: 'family',
      activeNick: 'AliceZ12',
      slotIndex: 0,
      entryWeek: null,
      entryFrom: null,
      entryTsId: null,
      selectedWeeks: [0, 2],
      familyRecipient: 'BobZ10',
      nickInput: 'TomZ11',
      verified: null,
      verifyError: null,
      leoQuery: '',
      leoRecipient: null,
      leoNote: '',
      tsCount: 3,
      confirmOpen: false,
      success: null,
      recordTab: 'out',
      unsupported: null,
      records: clone(SEED_RECORDS)
    };

    if (params.get('role') === 'amy' || params.get('role') === 'leo') state.role = params.get('role');
    if (params.get('mode') === 'ts' || params.get('mode') === 'slot') state.mode = params.get('mode');
    if (params.get('studentId') === 'stu_bob') state.activeNick = 'BobZ10';
    else if (params.get('studentId') === 'stu_alice') state.activeNick = 'AliceZ12';
    if (['family', 'external', 'transferred', 'cutoff'].includes(params.get('scenario'))) state.scenario = params.get('scenario');
    if (params.get('device') === 'tablet') state.device = 'tablet';
    if (params.get('type') === 'temp' || params.get('type') === 'group') state.unsupported = params.get('type');

    const tsIdParam = params.get('tsId');
    if (tsIdParam) {
      state.entryTsId = tsIdParam;
      const idx = SLOTS.findIndex((s) => s.tsId === tsIdParam);
      if (idx >= 0) state.slotIndex = idx;
    }
    if (params.get('from') === 'calendar') state.entryFrom = 'calendar';
    const dayParam = params.get('day');
    const timeParam = params.get('time');
    if (dayParam !== null && /^[0-6]$/.test(dayParam)) {
      const idx = SLOTS.findIndex((s) => s.weekday === Number(dayParam) && (!timeParam || s.time === timeParam));
      if (idx >= 0) state.slotIndex = idx;
    }
    const weekParam = params.get('week');
    if (weekParam !== null && /^[0-3]$/.test(weekParam)) {
      state.entryWeek = Number(weekParam);
      state.selectedWeeks = [state.entryWeek];
    }

    const initialSibling = Object.values(STUDENTS).find((s) => s.account === STUDENTS[state.activeNick].account && s.nickname !== state.activeNick);
    if (initialSibling) state.familyRecipient = initialSibling.nickname;

    if (state.scenario === 'external') state.tab = 'external';
    if (params.get('tab') === 'external' || params.get('tab') === 'family') state.tab = params.get('tab');
    if (params.get('view') === 'records') state.page = 'records';
    if (params.get('recordTab') === 'in' || params.get('recordTab') === 'out') state.recordTab = params.get('recordTab');

    const verifiedParam = findByNick(params.get('verified'));
    if (verifiedParam && verifiedParam.nickname !== state.activeNick) {
      state.verified = verifiedParam;
      state.tab = 'external';
      state.nickInput = verifiedParam.nickname;
    }
    if (params.get('confirm') === '1' && state.verified) state.confirmOpen = true;

    /* ------------------------------------------------------------------
     * 3. 派生数据
     * ------------------------------------------------------------------ */
    function sourceStudent() { return STUDENTS[state.activeNick] || STUDENTS.AliceZ12; }
    function sourceSlot() { return SLOTS[state.slotIndex] || SLOTS[0]; }
    function lessonsFor(slot) {
      return [0, 1, 2, 3].map((week) => ({
        week,
        date: isoAdd(WEEK_START, week * 7 + slot.weekday),
        time: slot.time,
        teacher: slot.teacher,
        course: slot.course
      }));
    }
    function selectedLessons() {
      return lessonsFor(sourceSlot()).filter((l) => state.selectedWeeks.includes(l.week));
    }
    function siblings() {
      return Object.values(STUDENTS).filter((s) => s.account === sourceStudent().account && s.nickname !== state.activeNick);
    }
    function isBlocked() {
      if (state.mode !== 'slot') return false;
      if (state.unsupported) return true;
      return state.scenario === 'cutoff' || state.scenario === 'transferred';
    }
    function noteOk() {
      const n = (state.leoNote || '').trim();
      return n.length >= 1 && n.length <= 200;
    }
    function canSubmit() {
      if (state.online === 'off') return false;
      if (state.mode === 'ts') {
        if (state.tsCount < 1 || state.tsCount > 5) return false;
        if (state.role === 'leo') return !!state.leoRecipient && noteOk();
        return state.tab === 'family' ? !!state.familyRecipient : !!state.verified;
      }
      if (isBlocked()) return false;
      if (!selectedLessons().length) return false;
      if (state.role === 'leo') return !!state.leoRecipient && noteOk();
      return state.tab === 'family' ? !!state.familyRecipient : !!state.verified;
    }
    function resolveRecipient() {
      if (state.role === 'leo') return state.leoRecipient ? STUDENTS[state.leoRecipient] || null : null;
      if (state.tab === 'family') return STUDENTS[state.familyRecipient] || null;
      return state.verified;
    }
    function m3aHref() {
      const role = state.role === 'leo' ? 'monitor' : 'parent';
      const child = state.activeNick === 'BobZ10' ? '&child=bob' : '';
      const week = state.entryWeek !== null ? `&week=${state.entryWeek}` : '';
      return `m3a_calendar_grid.html?role=${role}${child}${week}&from=transfer`;
    }

    /* ------------------------------------------------------------------
     * 4. 控制台
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'mode') setMode(value);
        if (group === 'scenario') setScenario(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.confirmOpen = false;
          renderAll();
          if (value === 'off') showToast('离线只读：可查看记录，转让 / 验证 / 代办不可用');
        }
      });
    });
    $('btnResetDemo').addEventListener('click', resetDemo);

    function setRole(role) {
      state.role = role;
      state.page = 'create';
      state.success = null;
      state.confirmOpen = false;
      state.verified = null;
      state.verifyError = null;
      state.leoRecipient = null;
      state.leoQuery = '';
      state.leoNote = '';
      renderAll();
    }

    function setMode(mode) {
      state.mode = mode;
      state.page = 'create';
      state.success = null;
      state.confirmOpen = false;
      state.verified = null;
      state.verifyError = null;
      state.leoRecipient = null;
      state.leoQuery = '';
      state.leoNote = '';
      renderAll();
    }

    function setScenario(scenario) {
      state.scenario = scenario;
      state.page = 'create';
      state.success = null;
      state.confirmOpen = false;
      state.verified = null;
      state.verifyError = null;
      if (scenario === 'family' || scenario === 'external') state.tab = scenario;
      renderAll();
    }

    function resetDemo() {
      state.role = 'amy';
      state.mode = 'slot';
      state.scenario = 'family';
      state.device = 'mobile';
      state.online = 'on';
      state.page = 'create';
      state.tab = 'family';
      state.activeNick = 'AliceZ12';
      state.slotIndex = 0;
      state.entryWeek = null;
      state.entryFrom = null;
      state.entryTsId = null;
      state.selectedWeeks = [0, 2];
      state.familyRecipient = 'BobZ10';
      state.nickInput = 'TomZ11';
      state.verified = null;
      state.verifyError = null;
      state.leoQuery = '';
      state.leoRecipient = null;
      state.leoNote = '';
      state.tsCount = 3;
      state.confirmOpen = false;
      state.success = null;
      state.recordTab = 'out';
      state.unsupported = null;
      state.records = clone(SEED_RECORDS);
      renderAll();
      showToast('演示数据已重置');
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const active = String(state[b.dataset.group]) === String(b.dataset.value);
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`;
      });
    }

    /* ------------------------------------------------------------------
     * 5. 外壳渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-700')} 离线只读：可查看转让记录，转让 / 验证 / 代办不可用`
        : '';

      $('content').innerHTML = renderContent();
      $('overlay').innerHTML = renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function renderBanner() {
      const title = state.page === 'records' ? '转让明细' : '课程转让';
      return `<header class="relative flex h-16 shrink-0 items-center justify-between gap-3 overflow-hidden bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-800 px-4 text-white">
        <div class="relative flex min-w-0 items-center gap-2.5">
          <a href="${m3aHref()}" class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="返回课表">${icon('chevron-left', 'h-5 w-5')}</a>
          <h1 class="truncate text-[18px] font-bold tracking-tight">${title}</h1>
        </div>
        <button data-action="toast" data-message="暂无新消息" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知，2 条未读">
          ${icon('bell', 'h-5 w-5')}
          <span class="absolute -right-1 -top-1 grid h-4 min-w-[16px] place-items-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white/30">2</span>
        </button>
      </header>`;
    }

    function renderContent() {
      return state.page === 'records' ? renderRecordsPage() : renderCreatePage();
    }

    function renderPageTabs() {
      const createOn = state.page === 'create';
      const recordsOn = state.page === 'records';
      return `<div class="space-y-1.5">
        <div class="grid grid-cols-2 gap-1 rounded-xl bg-slate-200/70 p-1">
          <button data-action="page" data-page="create" class="h-9 rounded-lg text-[14px] font-bold transition ${createOn ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">发起转让</button>
          <button data-action="page" data-page="records" class="h-9 rounded-lg text-[14px] font-bold transition ${recordsOn ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">转让记录</button>
        </div>
        <div class="flex items-center justify-between gap-2 px-0.5 text-[12px] font-medium text-slate-600">
          <span class="min-w-0 truncate">${state.role === 'leo' ? '操作者 <span class="font-bold text-slate-900">Leo 班长</span>' : `当前档案 <span class="font-mono font-bold text-slate-900">${state.activeNick}</span>`}</span>
          <span class="shrink-0">${state.role === 'leo' ? '全平台代办 · 操作留痕' : state.page === 'records' ? '转出 / 转入留痕' : state.mode === 'ts' ? '自由 TS 课时转让' : state.entryFrom === 'calendar' ? '课表带参 · 已定位源课次' : '固定位课次转让'}</span>
        </div>
      </div>`;
    }

    function renderCreatePage() {
      return `<div class="mx-auto w-full max-w-[560px] space-y-3 px-4 py-3 pb-8">
        ${renderPageTabs()}
        ${state.success ? renderSuccess() : state.mode === 'ts' ? renderTsForm() : isBlocked() ? renderBlocked() : renderSlotForm()}
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 6. 固定位转让表单
     * ------------------------------------------------------------------ */
    function renderSlotForm() {
      return `<div class="space-y-3">
        ${renderSlotPicker()}
        ${renderSourceCard()}
        ${renderEligibility()}
        ${renderWeekPicker()}
        ${renderRecipient()}
        ${renderFinanceCard()}
        <button id="submitBtn" data-action="submit" ${canSubmit() ? '' : 'disabled'} class="h-11 w-full rounded-xl text-[16px] font-bold transition ${canSubmit() ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'cursor-not-allowed bg-slate-200 text-slate-500'}">${state.role === 'leo' ? '确认代办转让' : '确认转让'}</button>
        <p class="text-center text-[12px] font-medium leading-relaxed text-slate-600">转让提交后立即生效且不可撤销；系统不介入线下资金结算。</p>
      </div>`;
    }

    function renderSlotPicker() {
      return `<section class="rounded-xl border border-slate-200/80 bg-white p-3 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <h3 class="text-[14px] font-bold text-slate-900">固定位源课次</h3>
          <span class="text-[12px] font-medium text-slate-600">4 周循环 · 仅固定位</span>
        </div>
        <div class="mt-2 grid grid-cols-3 gap-1.5">
          ${SLOTS.map((s, i) => {
            const on = state.slotIndex === i;
            return `<button data-action="pick-slot" data-index="${i}" aria-pressed="${on}" class="min-w-0 rounded-xl border px-2 py-2 text-left transition ${on ? 'border-indigo-600 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
              <span class="block truncate text-[12px] font-bold ${on ? 'text-indigo-900' : 'text-slate-900'}">${DAY_LABELS[s.weekday]} ${s.time}</span>
              <span class="mt-0.5 block truncate text-[12px] font-medium ${on ? 'text-indigo-700' : 'text-slate-600'}">${s.teacher}</span>
            </button>`;
          }).join('')}
        </div>
      </section>`;
    }

    function renderSourceCard() {
      const slot = sourceSlot();
      const lessons = lessonsFor(slot);
      const focus = (state.selectedWeeks.length
        ? lessons.filter((l) => state.selectedWeeks.includes(l.week))
        : lessons)[0] || lessons[0];
      return `<section class="rounded-xl border border-amber-300 bg-amber-50/80 p-3 shadow-sm">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="rounded border border-amber-300 bg-amber-100 px-1.5 py-0.5 text-[12px] font-bold text-amber-900">固定位</span>
              <span class="text-[12px] font-medium text-amber-900">1v1 · 4 周循环</span>
            </div>
            <h2 class="mt-1 truncate text-[16px] font-bold text-amber-950">${esc(slot.course)}</h2>
            <p class="mt-0.5 truncate text-[14px] font-medium text-amber-900">${esc(slot.teacher)} · ${DAY_LABELS[slot.weekday]} ${slot.time} - ${endTime(slot.time)}</p>
          </div>
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-amber-100 text-amber-800">${icon('calendar-clock', 'h-4 w-4')}</span>
        </div>
        <div class="mt-2 grid grid-cols-3 gap-1.5 text-[12px]">
          <div class="min-w-0 rounded-lg bg-white/70 px-2 py-1.5"><span class="block font-medium text-amber-900">学员</span><span class="block truncate font-mono font-bold text-amber-950">${state.activeNick}</span></div>
          <div class="min-w-0 rounded-lg bg-white/70 px-2 py-1.5"><span class="block font-medium text-amber-900">首个课次</span><span class="block truncate font-semibold text-amber-950">${fmtDate(focus.date)}</span></div>
          <div class="min-w-0 rounded-lg bg-white/70 px-2 py-1.5"><span class="block font-medium text-amber-900">本节时段</span><span class="block truncate font-semibold text-amber-950">${focus.time} 起</span></div>
        </div>
      </section>`;
    }

    function renderEligibility() {
      const items = [
        { ok: !state.unsupported, label: '仅 1v1 固定位' },
        { ok: state.scenario !== 'cutoff', label: '距开课 ≥3h' },
        { ok: true, label: '未结课 / 未结算 / 未退款' },
        { ok: state.scenario !== 'transferred', label: '未二次转让' }
      ];
      const passed = items.filter((i) => i.ok).length;
      return `<section class="rounded-xl border border-slate-200/80 bg-white p-3 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <h3 class="text-[14px] font-bold text-slate-900">准入校验</h3>
          <span class="text-[12px] font-medium text-slate-600">${passed}/4 通过</span>
        </div>
        <ul class="mt-2 grid grid-cols-2 gap-1.5">
          ${items.map((i) => `<li class="flex min-w-0 items-center gap-1.5 text-[12px] font-medium ${i.ok ? 'text-emerald-800' : 'text-rose-800'}">
            ${icon(i.ok ? 'check-circle-2' : 'x-circle', 'h-3.5 w-3.5 shrink-0')}
            <span class="min-w-0">${i.label}</span>
          </li>`).join('')}
        </ul>
        <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-600">临时课、小班课在课表无转让入口；受让课次入口置灰，不可二次转让。</p>
      </section>`;
    }

    function renderWeekPicker() {
      const lessons = lessonsFor(sourceSlot());
      return `<section class="rounded-xl border border-slate-200/80 bg-white p-3 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <h3 class="text-[14px] font-bold text-slate-900">选择转让课次</h3>
          <span class="text-[12px] font-bold text-indigo-700">已选 ${selectedLessons().length} 节</span>
        </div>
        <div class="mt-2 space-y-1.5">
          ${lessons.map((l) => {
            const on = state.selectedWeeks.includes(l.week);
            return `<button data-action="toggle-week" data-week="${l.week}" aria-pressed="${on}" class="flex w-full items-center gap-2 rounded-xl border px-2.5 py-2 text-left transition ${on ? 'border-indigo-300 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
              <span class="grid h-5 w-5 shrink-0 place-items-center rounded ${on ? 'bg-indigo-600 text-white' : 'border border-slate-300 bg-white text-transparent'}">${icon('check', 'h-3.5 w-3.5')}</span>
              <span class="min-w-0 flex-1">
                <span class="block truncate text-[14px] font-bold ${on ? 'text-indigo-950' : 'text-slate-900'}">第 ${l.week + 1} 周 · ${fmtDate(l.date)}</span>
                <span class="block truncate text-[12px] font-medium ${on ? 'text-indigo-800' : 'text-slate-600'}">${l.time} - ${endTime(l.time)} · ${esc(l.teacher)}</span>
              </span>
              <span class="shrink-0 rounded border px-1.5 py-0.5 text-[12px] font-bold ${on ? 'border-indigo-200 bg-white text-indigo-700' : 'border-slate-200 bg-slate-50 text-slate-600'}">待上</span>
            </button>`;
          }).join('')}
        </div>
        <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-600">可跳选第 1、3 周；未勾选的课次继续由 ${state.activeNick} 上课。</p>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 7. 接收方与财课分离
     * ------------------------------------------------------------------ */
    function renderRecipient() {
      return `<section class="rounded-xl border border-slate-200/80 bg-white p-3 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <h3 class="text-[14px] font-bold text-slate-900">接收方</h3>
          <span class="text-[12px] font-medium text-slate-600">${state.role === 'leo' ? '全平台搜索' : '直接指定学员'}</span>
        </div>
        ${state.role === 'leo' ? renderLeoRecipient() : renderParentRecipient()}
      </section>`;
    }

    function renderParentRecipient() {
      const isFamily = state.tab === 'family';
      return `<div class="mt-2 grid grid-cols-2 gap-1 rounded-xl bg-slate-100 p-1">
          <button data-action="recipient-tab" data-tab="family" class="h-8 rounded-lg text-[12px] font-bold transition ${isFamily ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'}">同家庭直转</button>
          <button data-action="recipient-tab" data-tab="external" class="h-8 rounded-lg text-[12px] font-bold transition ${!isFamily ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'}">转给其他家长</button>
        </div>
        <div class="mt-2.5">${isFamily ? renderFamilyOptions() : renderExternalRecipient()}</div>`;
    }

    function renderFamilyOptions() {
      const options = siblings();
      if (!options.length) {
        return `<div class="rounded-xl border border-dashed border-slate-300 bg-slate-50 px-3 py-4 text-center text-[12px] font-medium text-slate-600">当前账号下暂无可接收的其他孩子档案。</div>`;
      }
      return `<div class="space-y-1.5">
        ${options.map((s) => {
          const on = state.familyRecipient === s.nickname;
          return `<button data-action="pick-family" data-nick="${s.nickname}" aria-pressed="${on}" class="flex w-full items-center gap-2 rounded-xl border px-2.5 py-2 text-left transition ${on ? 'border-indigo-300 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full ${on ? 'bg-indigo-200 text-indigo-900' : 'bg-slate-100 text-slate-700'} text-[14px] font-bold">${s.nickname.charAt(0)}</span>
            <span class="min-w-0 flex-1">
              <span class="block truncate text-[14px] font-bold ${on ? 'text-indigo-950' : 'text-slate-900'}">${s.nickname} · ${s.gender} · ${s.age}岁</span>
              <span class="block truncate text-[12px] font-medium ${on ? 'text-indigo-800' : 'text-slate-600'}">${esc(s.grade)} · ${esc(s.level)} · ${esc(s.focus)}</span>
            </span>
            <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 bg-white text-transparent'}">${icon('check', 'h-3.5 w-3.5')}</span>
          </button>`;
        }).join('')}
        <div class="rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-emerald-800">${state.mode === 'ts' ? '同家庭直转：原出资家长仍可申请退款；自由 TS 直接计入受让方余额，不产生固定课格。' : '同家庭直转：原出资家长仍可申请退款；受让方课表加注【转】角标。'}</div>
      </div>`;
    }

    function renderExternalRecipient() {
      return `<div class="space-y-1.5">
        <label for="nickInput" class="block text-[14px] font-semibold text-slate-800">接收学员规范昵称</label>
        <div class="flex gap-1.5">
          <input id="nickInput" value="${esc(state.nickInput)}" placeholder="例如 TomZ11" class="h-11 min-w-0 flex-1 rounded-xl border border-slate-200 px-3 font-mono text-[16px] text-slate-900 outline-none focus:border-indigo-500">
          <button data-action="verify" class="inline-flex h-11 shrink-0 items-center gap-1 whitespace-nowrap rounded-xl border border-slate-200 bg-slate-100 px-3 text-[14px] font-semibold text-slate-700 hover:bg-slate-200">${icon('search', 'h-3.5 w-3.5')}验证学员</button>
        </div>
        <p class="text-[12px] font-medium leading-relaxed text-slate-600">格式：英文名 + 姓首字母 + 年龄，如 TomZ11；大小写不敏感。不能转给自己或同家庭账号。</p>
        <div id="verifyFeedback" class="space-y-1.5">${renderVerifiedProfile()}${renderVerifyError()}</div>
        <div class="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-amber-900">系统不介入线下资金。请确认已收到对方款项后再提交；${state.mode === 'ts' ? '跨家长转让后原家长退款入口关闭；自由 TS 直接计入受让方余额，不产生固定课格。' : '跨家长转让后原家长退款入口关闭；受让方课表加注【转】角标。'}提交后不可撤销。</div>
      </div>`;
    }

    function renderVerifiedProfile() {
      const s = state.verified;
      if (!s) return '';
      return `<div class="rounded-xl border border-emerald-300 bg-emerald-50 p-2.5">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[12px] font-bold text-emerald-800">已核验 · 接收学员</span>
          <span class="rounded bg-emerald-200 px-1.5 py-0.5 font-mono text-[12px] font-bold text-emerald-900">${esc(s.nickname)}</span>
        </div>
        <div class="mt-1.5 flex items-center gap-2">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-emerald-200 text-[14px] font-bold text-emerald-900">${s.nickname.charAt(0)}</span>
          <div class="min-w-0">
            <div class="truncate text-[14px] font-bold text-emerald-950">${esc(s.nickname)} · ${s.gender} · ${s.age}岁</div>
            <div class="truncate text-[12px] font-medium text-emerald-800">${esc(s.grade)} · ${esc(s.level)} · ${esc(s.focus)}</div>
          </div>
        </div>
        <div class="mt-2 flex items-center justify-between gap-2 border-t border-emerald-200 pt-1.5 text-[12px]">
          <span class="min-w-0 truncate font-medium text-emerald-800">授课教师 ${esc(sourceSlot().teacher)}</span>
          <span class="shrink-0 rounded px-1.5 py-0.5 font-bold ${s.match ? 'bg-emerald-200 text-emerald-900' : 'bg-amber-200 text-amber-900'}">${s.match ? '技能匹配' : '偏好不一致（不阻断）'}</span>
        </div>
      </div>`;
    }

    function renderVerifyError() {
      if (!state.verifyError) return '';
      return `<div class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-[12px] font-medium text-rose-800">${esc(state.verifyError)}</div>`;
    }

    function renderLeoRecipient() {
      return `<div class="mt-2 space-y-1.5">
        <label for="leoQuery" class="block text-[14px] font-semibold text-slate-800">接收学员（输入昵称或家长名搜索）</label>
        <div class="flex items-center gap-2 rounded-xl border border-slate-200 px-3">
          ${icon('search', 'h-4 w-4 shrink-0 text-slate-600')}
          <input id="leoQuery" value="${esc(state.leoQuery)}" placeholder="例如 TomZ11 / 家长名" class="h-11 min-w-0 flex-1 bg-transparent font-mono text-[16px] text-slate-900 outline-none">
        </div>
        <div id="leoSuggest">${leoSuggestionsHTML()}</div>
        <div id="leoSelected">${renderLeoSelected()}</div>
        <label for="leoNote" class="mt-2 block text-[14px] font-semibold text-slate-800">代办理由及交割备注 <span class="text-[12px] font-bold text-rose-700">必填</span></label>
        <textarea id="leoNote" rows="3" maxlength="200" class="h-20 w-full resize-none rounded-xl border border-slate-200 p-3 text-[16px] text-slate-900 outline-none focus:border-indigo-500" placeholder="例如：家长微信群已结清打款，电话委托班长代办">${esc(state.leoNote)}</textarea>
        <div class="flex items-center justify-between gap-2 text-[12px] font-medium text-slate-600">
          <span>1 至 200 字，将写入转让记录与审计日志。</span>
          <span id="noteCount" class="shrink-0 font-mono font-semibold text-slate-700">${state.leoNote.length}/200</span>
        </div>
      </div>`;
    }

    function leoSuggestionsHTML() {
      const q = state.leoQuery.trim().toLowerCase();
      const pool = Object.values(STUDENTS).filter((s) => s.nickname !== state.activeNick);
      const matches = (q
        ? pool.filter((s) => s.nickname.toLowerCase().includes(q) || s.parent.toLowerCase().includes(q))
        : pool).slice(0, 4);
      if (!matches.length) {
        return `<p class="mt-1.5 text-[12px] font-medium text-slate-600">未找到匹配学员，请核对昵称或家长名。</p>`;
      }
      return `<div class="mt-1.5 space-y-1.5">
        ${matches.map((s) => {
          const on = state.leoRecipient === s.nickname;
          return `<button data-action="pick-leo" data-nick="${s.nickname}" class="flex w-full items-center justify-between gap-2 rounded-lg border px-2.5 py-1.5 text-left transition ${on ? 'border-indigo-300 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
            <span class="min-w-0">
              <span class="block truncate font-mono text-[14px] font-bold text-slate-900">${esc(s.nickname)}</span>
              <span class="block truncate text-[12px] font-medium text-slate-600">${esc(s.parent)} 名下 · ${s.gender} · ${s.age}岁 · ${esc(s.level)}</span>
            </span>
            <span class="shrink-0 text-[12px] font-bold text-indigo-700">选择</span>
          </button>`;
        }).join('')}
      </div>`;
    }

    function renderLeoSelected() {
      const s = state.leoRecipient ? STUDENTS[state.leoRecipient] : null;
      if (!s) return '';
      const scope = s.account === sourceStudent().account ? '同家庭直转' : '跨家长转让';
      return `<div class="rounded-xl border border-emerald-300 bg-emerald-50 p-2.5">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[12px] font-bold text-emerald-800">已选定接收学员</span>
          <span class="rounded bg-emerald-200 px-1.5 py-0.5 text-[12px] font-bold text-emerald-900">${scope}</span>
        </div>
        <div class="mt-1 text-[14px] font-bold text-emerald-950">${esc(s.nickname)} · ${s.gender} · ${s.age}岁</div>
        <div class="text-[12px] font-medium text-emerald-800">${esc(s.parent)} 名下 · ${esc(s.grade)} · ${esc(s.level)}</div>
      </div>`;
    }

    function renderFinanceCard() {
      const body = state.mode === 'ts'
        ? `只划转账户内未排课的自由 TS 节数；出资家长 ${FINANCE.funder}、原购课单与资金持有方 ${FINANCE.holder} 100% 不变。不产生积分划扣、退充或拆借记账。`
        : `只变更实际上课学员与【转】标记；出资家长 ${FINANCE.funder}、原购课单与资金持有方 ${FINANCE.holder} 100% 不变。不产生积分划扣、退充或拆借记账。`;
      return `<div class="rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3 py-2.5">
        <div class="flex items-center gap-1.5 text-[12px] font-bold text-indigo-800">${icon('lock', 'h-3.5 w-3.5')}财课分离</div>
        <p class="mt-1 text-[12px] font-medium leading-relaxed text-indigo-900">${body}</p>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 8. 纯 TS 转让
     * ------------------------------------------------------------------ */
    function renderTsForm() {
      return `<div class="space-y-3">
        <section class="rounded-xl border border-indigo-200/70 bg-indigo-50/80 p-3 shadow-sm">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="rounded border border-indigo-200 bg-indigo-100 px-1.5 py-0.5 text-[12px] font-bold text-indigo-900">自由 TS</span>
                <span class="text-[12px] font-medium text-indigo-800">未排课 · 可划转</span>
              </div>
              <h2 class="mt-1 truncate text-[16px] font-bold text-indigo-950">纯课时转让</h2>
              <p class="mt-0.5 truncate text-[14px] font-medium text-indigo-900">${state.activeNick} · 剩余 5 TS · 不绑定教师与时段</p>
            </div>
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-indigo-100 text-indigo-800">${icon('ticket', 'h-4 w-4')}</span>
          </div>
        </section>

        <section class="rounded-xl border border-slate-200/80 bg-white p-3 shadow-sm">
          <div class="flex items-center justify-between gap-2">
            <h3 class="text-[14px] font-bold text-slate-900">转让节数</h3>
            <span class="text-[12px] font-medium text-slate-600">1 - 5 节</span>
          </div>
          <div class="mt-2 grid grid-cols-5 gap-1.5">
            ${[1, 2, 3, 4, 5].map((n) => {
              const on = state.tsCount === n;
              return `<button data-action="ts-count" data-count="${n}" aria-pressed="${on}" class="h-10 rounded-xl border text-[16px] font-bold transition ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}">${n}</button>`;
            }).join('')}
          </div>
          <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-600">受让方自由 TS +${state.tsCount} 节；转出方余额同步减少 ${state.tsCount} 节。仅支持账户内未排课的自由 TS。</p>
        </section>

        ${renderRecipient()}
        ${renderFinanceCard()}

        <button id="submitBtn" data-action="submit" ${canSubmit() ? '' : 'disabled'} class="h-11 w-full rounded-xl text-[16px] font-bold transition ${canSubmit() ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'cursor-not-allowed bg-slate-200 text-slate-500'}">确认转让 ${state.tsCount} 节 TS</button>
        <p class="text-center text-[12px] font-medium leading-relaxed text-slate-600">两位家长线下自行结算；系统不介入资金划扣，也不代收代付。转让即时生效且不可撤销。</p>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 9. 阻断与成功
     * ------------------------------------------------------------------ */
    function blockedMeta() {
      if (state.unsupported === 'temp') {
        return { tone: 'yellow', icon: 'clock-alert', title: '临时课不可转让', body: '临时课仅支持请假退期待排，请返回课表处理。', tag: '非固定位' };
      }
      if (state.unsupported === 'group') {
        return { tone: 'teal', icon: 'users', title: '小班课不可转让', body: '小班课单人缺席由主理人线下处理，系统不提供转让入口。', tag: '非 1v1' };
      }
      if (state.scenario === 'cutoff') {
        return { tone: 'rose', icon: 'clock-alert', title: '距开课不足 3 小时', body: '开课前 3 小时内转让入口已关闭，请返回课表尝试同师挪位。', tag: '已截止' };
      }
      return { tone: 'amber', icon: 'ban', title: '受让课次不可二次转让', body: '该课次已带【转】角标。受让方仅保留 1 次同师挪位，严禁再次转让。', tag: '已受让' };
    }

    function renderBlocked() {
      const m = blockedMeta();
      const tones = {
        rose: { box: 'border-rose-200 bg-rose-50', icon: 'bg-rose-100 text-rose-700', title: 'text-rose-950', body: 'text-rose-800', tag: 'bg-rose-200 text-rose-900' },
        amber: { box: 'border-amber-300 bg-amber-50', icon: 'bg-amber-100 text-amber-800', title: 'text-amber-950', body: 'text-amber-900', tag: 'bg-amber-200 text-amber-900' },
        yellow: { box: 'border-amber-300 bg-amber-50', icon: 'bg-amber-100 text-amber-800', title: 'text-amber-950', body: 'text-amber-900', tag: 'bg-amber-200 text-amber-900' },
        teal: { box: 'border-teal-300 bg-teal-50', icon: 'bg-teal-100 text-teal-800', title: 'text-teal-950', body: 'text-teal-900', tag: 'bg-teal-200 text-teal-900' }
      }[m.tone];
      const invalid = state.unsupported ? { title: state.unsupported === 'temp' ? '临时课 · 1v1 临时口语强化' : '小班课 · 3/4 人', slot: '课表已隐藏转让入口' } : null;
      return `<div class="space-y-3">
        <div class="rounded-2xl border ${tones.box} p-4 text-center shadow-sm">
          <div class="mx-auto grid h-11 w-11 place-items-center rounded-full ${tones.icon}">${icon(m.icon, 'h-5 w-5')}</div>
          <div class="mt-2 flex items-center justify-center gap-1.5">
            <h2 class="text-[18px] font-bold ${tones.title}">${m.title}</h2>
            <span class="rounded px-1.5 py-0.5 text-[12px] font-bold ${tones.tag}">${m.tag}</span>
          </div>
          <p class="mt-1 text-[14px] font-medium leading-relaxed ${tones.body}">${m.body}</p>
        </div>

        ${invalid ? `<div class="rounded-xl border border-slate-200/80 bg-white p-3 shadow-sm">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold text-slate-900">${invalid.title}</span>
            <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${invalid.slot}</span>
          </div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">只有未来 4 周内、距开课 ≥3h、未结课/未结算/未退款锁定且未二次转让的 1v1 固定位可进入转让流程。</p>
        </div>` : ''}

        ${m.tone === 'amber' ? `<div class="rounded-xl border border-amber-300 bg-amber-50 p-3 shadow-sm">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-bold text-amber-900">受让方课格预览</span>
            <span class="rounded bg-amber-200 px-1.5 py-0.5 text-[12px] font-bold text-amber-900">转</span>
          </div>
          <div class="mt-1.5 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="truncate text-[14px] font-bold text-amber-950">${state.activeNick}</div>
              <div class="truncate text-[12px] font-medium text-amber-900">${esc(sourceSlot().teacher)} · ${DAY_LABELS[sourceSlot().weekday]} ${sourceSlot().time}</div>
            </div>
            <span class="shrink-0 rounded border border-amber-300 bg-amber-100 px-2 py-1 text-[12px] font-bold text-amber-900">固定位</span>
          </div>
          <p class="mt-1.5 flex items-center gap-1 text-[12px] font-semibold text-amber-900">${icon('pin', 'h-3.5 w-3.5 shrink-0')}本节课由学员 ${esc((Object.values(STUDENTS).find((s) => s.nickname !== state.activeNick && s.account === sourceStudent().account) || {}).nickname || '原学员')} 转让而来</p>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-amber-900">课格右上角带【转】角标；点击仅展示详情与同师挪位，不出现二次转让入口。</p>
        </div>` : ''}

        <div class="grid grid-cols-2 gap-2">
          <a href="${m3aHref()}" class="flex h-11 items-center justify-center rounded-xl bg-indigo-600 text-[14px] font-bold text-white hover:bg-indigo-700">返回课表</a>
          <button data-action="page" data-page="records" class="h-11 rounded-xl border border-slate-200 bg-white text-[14px] font-bold text-slate-700 hover:bg-slate-50">查看转让记录</button>
        </div>
      </div>`;
    }

    function renderSuccess() {
      const s = state.success;
      const isTs = s.kind === 'ts' || s.mode === 'ts';
      const isProxy = s.operator === 'Leo 班长';
      const first = s.lessons && s.lessons.length ? s.lessons[0] : null;
      return `<div class="space-y-3">
        <div class="rounded-2xl border border-emerald-200 bg-white p-4 text-center shadow-sm">
          <div class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-emerald-100 text-emerald-700">${icon('check', 'h-6 w-6')}</div>
          <h2 class="mt-2 text-[18px] font-bold text-slate-900">${isProxy ? '代办交割完成' : '转让交割完成'}</h2>
          <p class="mt-1 text-[14px] font-medium leading-relaxed text-slate-600">${esc(s.from)} 的 ${isTs ? `${s.count} 节自由 TS` : `${s.lessons.length} 个课次`} 已即时划转给 <span class="font-mono font-bold text-slate-900">${esc(s.to)}</span></p>
        </div>

        <div class="rounded-xl border border-slate-200/80 bg-white p-3 shadow-sm">
          <div class="flex items-center justify-between gap-2 text-[12px]">
            <span class="font-medium text-slate-600">流水号</span>
            <span class="truncate font-mono font-bold text-slate-900">${esc(s.serial)}</span>
          </div>
          <div class="mt-2 space-y-1.5 border-t border-slate-200 pt-2 text-[12px]">
            <div class="flex items-start justify-between gap-2"><span class="shrink-0 font-medium text-slate-600">转出课次</span><span class="min-w-0 text-right font-semibold text-slate-900">${isTs ? `自由 TS × ${s.count}` : s.lessons.map((l) => `${fmtDate(l.date)} ${l.time}`).join('、')}</span></div>
            <div class="flex items-start justify-between gap-2"><span class="shrink-0 font-medium text-slate-600">接收学员</span><span class="min-w-0 truncate font-mono font-semibold text-slate-900">${esc(s.to)}</span></div>
            <div class="flex items-start justify-between gap-2"><span class="shrink-0 font-medium text-slate-600">操作人</span><span class="font-semibold text-slate-900">${esc(s.operator)}</span></div>
            <div class="flex items-start justify-between gap-2"><span class="shrink-0 font-medium text-slate-600">操作时间</span><span class="font-mono font-semibold text-slate-900">${esc(s.at)}</span></div>
          </div>
        </div>

        ${isTs ? `<div class="rounded-xl border border-indigo-200 bg-indigo-50 p-3 shadow-sm">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-bold text-indigo-900">受让方资产结果</span>
            <span class="rounded bg-indigo-200 px-1.5 py-0.5 text-[12px] font-bold text-indigo-900">自由 TS</span>
          </div>
          <div class="mt-1.5 text-[14px] font-bold text-indigo-950">${esc(s.to)} · 自由 TS +${s.count}</div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-indigo-900">纯 TS 不产生固定课格与【转】角标；受让方可直接用于后续排课。</p>
        </div>` : `<div class="rounded-xl border border-amber-300 bg-amber-50 p-3 shadow-sm">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-bold text-amber-900">受让方课表结果预览</span>
            <span class="rounded bg-amber-200 px-1.5 py-0.5 text-[12px] font-bold text-amber-900">转</span>
          </div>
          <div class="mt-1.5 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="truncate text-[14px] font-bold text-amber-950">${esc(s.to)}</div>
              <div class="truncate text-[12px] font-medium text-amber-900">${esc(s.teacher)} · ${first ? `${fmtDate(first.date)} ${first.time}` : ''}</div>
            </div>
            <span class="shrink-0 rounded border border-amber-300 bg-amber-100 px-2 py-1 text-[12px] font-bold text-amber-900">固定位</span>
          </div>
          <p class="mt-1.5 text-[12px] font-medium leading-relaxed text-amber-900">转出方原课格已清空；受让方课格右上角带【转】，不可二次转让，保留 1 次同师挪位。</p>
        </div>`}

        <div class="rounded-xl border border-indigo-200/70 bg-indigo-50/80 p-3">
          <div class="flex items-center gap-1.5 text-[12px] font-bold text-indigo-900">${icon('lock', 'h-3.5 w-3.5')}财课分离已落盘</div>
          <div class="mt-1.5 space-y-1 text-[12px] font-medium text-indigo-900">
            <div class="flex justify-between gap-2"><span>出资家长</span><span class="font-semibold">${FINANCE.funder} 不变</span></div>
            <div class="flex justify-between gap-2"><span>资金持有方</span><span class="font-semibold">${FINANCE.holder} 不变</span></div>
            <div class="flex justify-between gap-2"><span>教师通知</span><span class="font-semibold">${isTs ? '无固定课次，不触发' : '5 秒内已送达站内信 + 邮件'}</span></div>
          </div>
          <p class="mt-1.5 text-[12px] font-medium leading-relaxed ${s.scope === 'family' ? 'text-emerald-800' : 'text-rose-800'}">${s.scope === 'family' ? '同家庭直转：原出资家长仍可申请退款。' : '跨家长转让：原出资家长的退款入口已关闭。'}</p>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-indigo-900">审计已写入，操作者 ${esc(s.operator)}。</p>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button data-action="page" data-page="records" class="h-11 rounded-xl border border-slate-200 bg-white text-[14px] font-bold text-slate-700 hover:bg-slate-50">查看转让记录</button>
          <a href="${m3aHref()}" class="flex h-11 items-center justify-center rounded-xl bg-indigo-600 text-[14px] font-bold text-white hover:bg-indigo-700">返回课表</a>
        </div>
        <button data-action="new-transfer" class="h-10 w-full rounded-xl text-[12px] font-bold text-indigo-700 hover:bg-indigo-50">继续发起转让</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 10. 转让记录
     * ------------------------------------------------------------------ */
    function activeRecords() {
      if (state.role === 'leo') return state.records;
      if (state.recordTab === 'out') return state.records.filter((r) => r.from === state.activeNick);
      return state.records.filter((r) => r.to === state.activeNick);
    }

    function renderRecordsPage() {
      const isLeo = state.role === 'leo';
      const records = activeRecords();
      const width = state.device === 'tablet' ? 'max-w-[680px]' : 'max-w-[560px]';
      const tabs = isLeo
        ? `<div class="rounded-xl border border-slate-200/80 bg-white px-3 py-2 text-[12px] font-medium text-slate-700 shadow-sm">全平台转让流水 · 共 <span class="font-bold text-slate-900">${records.length}</span> 笔</div>`
        : `<div class="flex items-center justify-between gap-2">
            <span class="min-w-0 truncate text-[12px] font-medium text-slate-600">${state.recordTab === 'out' ? '转出' : '转入'} <span class="font-bold text-slate-900">${records.length}</span> 笔</span>
            <div class="inline-flex shrink-0 rounded-lg bg-slate-200/70 p-0.5">
              <button data-action="record-tab" data-tab="out" class="h-8 rounded-md px-2.5 text-[12px] font-bold transition ${state.recordTab === 'out' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">转出记录</button>
              <button data-action="record-tab" data-tab="in" class="h-8 rounded-md px-2.5 text-[12px] font-bold transition ${state.recordTab === 'in' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">转入记录</button>
            </div>
          </div>`;

      return `<div class="mx-auto w-full ${width} space-y-3 px-4 py-3 pb-8">
        ${renderPageTabs()}
        ${tabs}
        ${records.length
          ? `<div class="${state.device === 'tablet' && records.length > 1 ? 'grid grid-cols-2 gap-2' : 'space-y-2'}">${records.map(recordCard).join('')}</div>`
          : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-12 text-center">
              <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-slate-50 text-slate-500">${icon('inbox', 'h-5 w-5')}</div>
              <p class="mt-3 text-[14px] font-bold text-slate-700">暂无课程转让记录</p>
              <p class="mt-1 text-[12px] font-medium text-slate-600">完成一次转让后将在此留痕</p>
            </div>`}
        <div class="rounded-xl border border-slate-200/80 bg-white p-3 text-[12px] font-medium leading-relaxed text-slate-700 shadow-sm">
          <span class="font-bold text-slate-900">退款防线：</span>同家庭直转保留原出资家长退款权；跨家长转让后原家长退款入口关闭。转让不可撤销，受让课次不可二次转让。
        </div>
      </div>`;
    }

    function recordCard(r) {
      const isLeo = state.role === 'leo';
      const other = isLeo ? `${r.from} → ${r.to}` : (state.recordTab === 'out' ? r.to : r.from);
      const slotText = r.kind === 'ts'
        ? `自由 TS 课时 × ${r.count}`
        : `${fmtDate(r.date)} ${r.time}${r.lessons && r.lessons.length > 1 ? ` 等 ${r.lessons.length} 节` : ''}`;
      const typeLabel = r.scope === 'family' ? '同家庭直转' : r.operator === 'Leo 班长' ? '班长代办' : '跨家长转让';
      return `<article class="rounded-xl border border-slate-200/80 bg-white p-3.5 shadow-sm">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <div class="truncate text-[14px] font-bold text-slate-900">${slotText}</div>
            <div class="truncate text-[12px] font-medium text-slate-600">${esc(r.teacher)} · ${esc(r.course)}</div>
          </div>
          <span class="shrink-0 rounded-full border border-slate-200 bg-slate-100 px-2 py-0.5 text-[12px] font-bold text-slate-700">已交割</span>
        </div>
        <div class="mt-2 grid grid-cols-2 gap-1.5 text-[12px]">
          <div class="min-w-0 rounded-lg bg-slate-50 px-2 py-1.5"><div class="font-medium text-slate-600">${isLeo ? '转让双方' : '对方学员'}</div><div class="mt-0.5 truncate font-mono font-bold text-slate-900">${esc(other)}</div></div>
          <div class="min-w-0 rounded-lg bg-slate-50 px-2 py-1.5"><div class="font-medium text-slate-600">转让类型</div><div class="mt-0.5 truncate font-semibold text-slate-900">${typeLabel}</div></div>
          <div class="min-w-0 rounded-lg bg-slate-50 px-2 py-1.5"><div class="font-medium text-slate-600">操作时间</div><div class="mt-0.5 truncate font-mono font-semibold text-slate-900">${esc(r.at)}</div></div>
          <div class="min-w-0 rounded-lg bg-slate-50 px-2 py-1.5"><div class="font-medium text-slate-600">流水号</div><div class="mt-0.5 truncate font-mono font-semibold text-slate-900">${esc(r.serial)}</div></div>
        </div>
        ${isLeo ? `<div class="mt-1.5 text-[12px] font-medium text-slate-600">操作人 <span class="font-semibold text-slate-900">${esc(r.operator)}</span></div>` : ''}
        <div class="mt-2 rounded-lg border px-2.5 py-1.5 text-[12px] font-medium ${r.scope === 'family' ? 'border-emerald-200 bg-emerald-50 text-emerald-800' : 'border-rose-200 bg-rose-50 text-rose-800'}">${r.scope === 'family' ? '同家庭直转 · 原出资家长退款入口保留' : '跨家长转让 · 原出资家长退款入口关闭'}</div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 11. 二次确认
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      return state.confirmOpen ? renderConfirmModal() : '';
    }

    function renderConfirmModal() {
      const recipient = resolveRecipient();
      if (!recipient) return '';
      const mode = state.mode;
      const lessons = mode === 'slot' ? selectedLessons() : [];
      const scope = recipient.account === sourceStudent().account ? 'family' : 'external';
      const slotSummary = mode === 'slot'
        ? lessons.map((l) => `${fmtDate(l.date)} ${l.time}`).join('、')
        : `${state.tsCount} 节自由 TS`;
      const note = state.role === 'leo' ? state.leoNote.trim() : '';
      const disabled = state.online === 'off';
      return `<div class="absolute inset-0 z-[60]">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-[1px]" data-action="close-confirm"></div>
        <div class="absolute inset-x-3 top-1/2 mx-auto max-h-[90%] max-w-[420px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">
          <div class="text-center">
            <div class="mx-auto grid h-11 w-11 place-items-center rounded-full bg-rose-100 text-rose-700">${icon('alert-octagon', 'h-5 w-5')}</div>
            <h3 class="mt-2 text-[16px] font-bold text-slate-900">${state.role === 'leo' ? '确认代办交割？' : '确认转让给该学员吗？'}</h3>
            <p class="mt-1 text-[12px] font-medium text-slate-600">提交后立即生效，此操作不可撤销</p>
          </div>
          <div class="mt-3 space-y-1 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[12px]">
            <div class="flex items-start justify-between gap-2"><span class="shrink-0 font-medium text-slate-600">转出课次</span><span class="min-w-0 text-right font-semibold text-slate-900">${slotSummary}</span></div>
            <div class="flex items-start justify-between gap-2"><span class="shrink-0 font-medium text-slate-600">接收学员</span><span class="min-w-0 text-right font-bold text-slate-900">${esc(recipient.nickname)}（${recipient.gender}，${recipient.age}岁）</span></div>
            <div class="flex items-start justify-between gap-2 border-t border-slate-200 pt-1.5"><span class="shrink-0 font-medium text-slate-600">操作人</span><span class="font-semibold text-slate-900">${state.role === 'leo' ? 'Leo 班长' : 'Amy'}</span></div>
            ${note ? `<div class="border-t border-slate-200 pt-1.5"><div class="font-medium text-slate-600">代办备注</div><p class="mt-0.5 font-medium leading-relaxed text-slate-900">${esc(note)}</p></div>` : ''}
          </div>
          <p class="mt-2 rounded-lg px-3 py-2 text-[12px] font-medium leading-relaxed ${scope === 'family' ? 'bg-emerald-50 text-emerald-800' : 'bg-amber-50 text-amber-900'}">${scope === 'family' ? '同家庭直转：原出资家长仍可申请退款；受让方课表加注【转】角标。' : '请确认线下款项已结清。跨家长转让后原家长退款入口关闭；受让方课表加注【转】角标。'}</p>
          <div class="mt-3 flex gap-2">
            <button data-action="close-confirm" class="h-10 flex-1 rounded-xl bg-slate-100 text-[14px] font-semibold text-slate-700 hover:bg-slate-200">再核对一下</button>
            <button data-action="confirm" ${disabled ? 'disabled' : ''} class="h-10 flex-1 rounded-xl text-[14px] font-bold ${disabled ? 'cursor-not-allowed bg-slate-200 text-slate-500' : 'bg-rose-600 text-white hover:bg-rose-700'}">我已核实，确认交割</button>
          </div>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 12. 交互动作
     * ------------------------------------------------------------------ */
    function guardWrite() {
      if (state.online === 'off') {
        showToast('离线只读，暂不可执行该操作');
        return false;
      }
      return true;
    }

    function syncSubmit() {
      const btn = $('submitBtn');
      if (!btn) return;
      const ok = canSubmit();
      btn.disabled = !ok;
      btn.className = `h-11 w-full rounded-xl text-[16px] font-bold transition ${ok ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'cursor-not-allowed bg-slate-200 text-slate-500'}`;
      if (state.mode === 'ts') btn.textContent = `确认转让 ${state.tsCount} 节 TS`;
    }

    function verifyNickname() {
      if (!guardWrite()) return;
      const raw = (state.nickInput || '').trim();
      state.verified = null;
      state.verifyError = null;
      if (!/^[A-Za-z]+[A-Za-z][0-9]{1,2}$/.test(raw)) {
        state.verifyError = '未找到该学员，请核对昵称格式。';
        return renderAll();
      }
      const found = findByNick(raw);
      if (!found) {
        state.verifyError = '未找到该学员，请核对昵称格式。';
        return renderAll();
      }
      if (found.nickname === state.activeNick) {
        state.verifyError = '不可转给自己，请选择其他学员。';
        return renderAll();
      }
      if (found.account === sourceStudent().account) {
        state.verifyError = '该学员属于同一家庭账号，请使用【同家庭直转】。';
        return renderAll();
      }
      state.verified = found;
      renderAll();
    }

    function submitTransfer() {
      if (!guardWrite()) return;
      if (!canSubmit()) {
        showToast(state.mode === 'ts' ? '请选择接收学员' : '请选择至少 1 个课次并指定接收学员');
        return;
      }
      if (state.mode === 'ts') {
        if (state.tab === 'external' || state.role === 'leo') {
          state.confirmOpen = true;
          return renderAll();
        }
        return commitTransfer();
      }
      if (state.role === 'leo' || state.tab === 'external') {
        state.confirmOpen = true;
        return renderAll();
      }
      commitTransfer();
    }

    function commitTransfer() {
      if (!guardWrite()) return;
      const recipient = resolveRecipient();
      if (!recipient) return showToast('请先指定接收学员');
      const mode = state.mode;
      const lessons = mode === 'slot' ? selectedLessons() : [];
      const scope = recipient.account === sourceStudent().account ? 'family' : 'external';
      const operator = state.role === 'leo' ? 'Leo 班长' : 'Amy';
      const count = mode === 'ts' ? state.tsCount : lessons.length;
      const serial = `TR-${TODAY.replace(/-/g, '')}-${String(1042 + state.records.length * 17).padStart(4, '0')}`;
      const note = state.role === 'leo'
        ? state.leoNote.trim()
        : scope === 'family'
          ? '同家庭多孩直转，出资家长与资金持有方不变'
          : '家长自助转让，线下资金已结清';
      const record = {
        serial,
        from: sourceStudent().nickname,
        to: recipient.nickname,
        scope,
        operator,
        at: '2026-11-10 10:42',
        kind: mode,
        teacher: mode === 'slot' ? sourceSlot().teacher : '不绑定教师',
        course: mode === 'slot' ? sourceSlot().course : '自由 TS 课时',
        date: mode === 'slot' && lessons.length ? lessons[0].date : null,
        time: mode === 'slot' && lessons.length ? lessons[0].time : null,
        count,
        lessons: lessons.map((l) => ({ date: l.date, time: l.time })),
        note
      };
      state.records.unshift(record);
      state.success = clone(record);
      state.confirmOpen = false;
      state.verified = null;
      state.verifyError = null;
      state.leoRecipient = null;
      state.leoQuery = '';
      state.leoNote = '';
      state.page = 'create';
      renderAll();
      showToast(mode === 'ts' ? `已转让 ${count} 节 TS 给 ${recipient.nickname}` : `转让已交割给 ${recipient.nickname}，受让方课格已加注【转】`);
    }

    function showToast(msg) {
      const t = $('toast');
      t.className = 'pointer-events-none absolute bottom-8 left-1/2 z-[100] w-max max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl bg-slate-900/90 px-4 py-2 text-center text-[12px] font-semibold leading-relaxed text-white shadow-xl';
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.add('hidden'), 2800);
    }

    /* ------------------------------------------------------------------
     * 13. 事件绑定
     * ------------------------------------------------------------------ */
    $('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'page') {
        const prev = state.page;
        state.page = el.dataset.page;
        state.confirmOpen = false;
        if (prev === 'records' && state.page === 'create') state.success = null;
        return renderAll();
      }
      if (action === 'new-transfer') {
        state.success = null;
        state.page = 'create';
        return renderAll();
      }
      if (action === 'pick-slot') {
        state.slotIndex = Number(el.dataset.index);
        state.selectedWeeks = [0, 2];
        state.entryWeek = null;
        state.verified = null;
        state.verifyError = null;
        return renderAll();
      }
      if (action === 'toggle-week') {
        const week = Number(el.dataset.week);
        state.selectedWeeks = state.selectedWeeks.includes(week)
          ? state.selectedWeeks.filter((w) => w !== week)
          : [...state.selectedWeeks, week].sort();
        return renderAll();
      }
      if (action === 'recipient-tab') {
        state.tab = el.dataset.tab;
        state.verified = null;
        state.verifyError = null;
        return renderAll();
      }
      if (action === 'pick-family') {
        state.familyRecipient = el.dataset.nick;
        return renderAll();
      }
      if (action === 'pick-leo') {
        state.leoRecipient = el.dataset.nick;
        state.leoQuery = el.dataset.nick;
        return renderAll();
      }
      if (action === 'verify') return verifyNickname();
      if (action === 'ts-count') {
        state.tsCount = Number(el.dataset.count);
        return renderAll();
      }
      if (action === 'submit') return submitTransfer();
      if (action === 'confirm') return commitTransfer();
      if (action === 'close-confirm') {
        state.confirmOpen = false;
        return renderAll();
      }
      if (action === 'record-tab') {
        state.recordTab = el.dataset.tab;
        return renderAll();
      }
    });

    $('frame').addEventListener('input', (e) => {
      if (e.target.id === 'nickInput') {
        state.nickInput = e.target.value;
        state.verified = null;
        state.verifyError = null;
        const feedback = $('verifyFeedback');
        if (feedback) feedback.innerHTML = '';
        syncSubmit();
      }
      if (e.target.id === 'leoQuery') {
        state.leoQuery = e.target.value;
        const exact = findByNick(state.leoQuery);
        state.leoRecipient = exact && exact.nickname !== state.activeNick ? exact.nickname : null;
        const box = $('leoSuggest');
        if (box) box.innerHTML = leoSuggestionsHTML();
        const selected = $('leoSelected');
        if (selected) selected.innerHTML = renderLeoSelected();
        syncSubmit();
      }
      if (e.target.id === 'leoNote') {
        state.leoNote = e.target.value;
        const counter = $('noteCount');
        if (counter) counter.textContent = `${state.leoNote.length}/200`;
        syncSubmit();
      }
    });

    /* ------------------------------------------------------------------
     * 14. 截图 / 演示参数（不影响正常入口）
     * ------------------------------------------------------------------ */
    function applyDemoParams() {
      const successParam = params.get('success');
      if (!successParam) return;
      const mode = successParam === 'ts' ? 'ts' : 'slot';
      const toNick = successParam === 'external' || successParam === 'proxy' ? 'TomZ11' : 'BobZ10';
      const recipient = STUDENTS[toNick];
      const lessons = mode === 'slot' ? lessonsFor(sourceSlot()).filter((l) => state.selectedWeeks.includes(l.week)) : [];
      const scope = recipient.account === sourceStudent().account ? 'family' : 'external';
      state.mode = mode;
      state.page = 'create';
      state.success = {
        mode,
        from: sourceStudent().nickname,
        to: toNick,
        scope,
        operator: successParam === 'proxy' ? 'Leo 班长' : 'Amy',
        serial: `TR-${TODAY.replace(/-/g, '')}-1042`,
        at: '2026-11-10 10:42',
        kind: mode,
        teacher: mode === 'slot' ? sourceSlot().teacher : '不绑定教师',
        course: mode === 'slot' ? sourceSlot().course : '自由 TS 课时',
        count: mode === 'ts' ? state.tsCount : lessons.length,
        lessons: lessons.map((l) => ({ date: l.date, time: l.time })),
        note: successParam === 'proxy' ? '家长微信群已结清打款，电话委托班长代办' : '演示交割记录'
      };
    }

    applyDemoParams();
    renderAll();
  </script>
</body>

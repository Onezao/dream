    function generateTSFission(order) {
      if (order.orderType === 'small_group') {
        const n = Math.max(1, Number(order.lessonCount));
        const total = Number(order.paidPoints);
        const base = Math.floor(total / n);
        const remainder = total % n;
        return Array.from({ length: n }, (_, i) => ({
          index: i + 1,
          tsId: `ts_${String(order.id).slice(-4)}${String(i + 1).padStart(5, '0')}`,
          points: i === n - 1 ? base + remainder : base,
          priceTier: 0,
          holder: order.holder,
          last: i === n - 1
        }));
      }
      const items = orderItems(order);
      const extra = order.extraPrep ? 10 : 0;
      const list = [];
      let idx = 1;
      items.forEach((item) => {
        for (let k = 0; k < Math.max(0, Number(item.lessons) || 0); k += 1) {
          list.push({
            index: idx,
            tsId: `ts_${String(order.id).slice(-4)}${String(idx).padStart(5, '0')}`,
            points: Number(item.priceTier) + extra,
            priceTier: Number(item.priceTier),
            holder: order.holder,
            last: false
          });
          idx += 1;
        }
      });
      const diff = Number(order.paidPoints) - list.reduce((s, ts) => s + ts.points, 0);
      if (list.length && diff !== 0) {
        list[list.length - 1].points += diff;
        list[list.length - 1].last = true;
      }
      return list;
    }

        <div class="relative flex min-w-0 items-center gap-2">

          <span class="truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</span>
        </div>

      const isParent = state.role === 'parent';
      const canCreate = state.role !== 'parent' && state.online === 'on';

        ? `<p class="min-w-0 text-[12px] font-semibold text-slate-600">当前家长 · ${esc(state.parentChild)}</p>`

          </div>
          <div class="relative min-w-[160px] flex-1">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
            <input id="orderSearch" value="${esc(state.query)}" placeholder="搜索学员 / 单号" class="h-10 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500">
          </div>

          ${list.length ? list.map(renderOrderCard).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/60 px-6 py-10 text-center text-[14px] font-medium text-slate-500">暂无符合条件的购课单</div>`}
        </div>

      </div>`;

    function childSelector() {
      return `<div class="rounded-2xl border border-slate-300 bg-slate-50/70 p-2.5">
        <div class="flex items-center justify-between px-0.5"><span class="text-[12px] font-medium text-slate-600">当前宝贝档案</span><span class="text-[12px] font-medium text-slate-600">只读</span></div>
        <div class="mt-2 grid grid-cols-2 gap-2">${PARENT_CHILDREN.map((ch) => { const on = ch.name === state.parentChild; return `<button data-action="select-child" data-child="${ch.name}" class="flex h-10 items-center justify-center gap-1.5 rounded-xl border text-[14px] font-semibold transition ${on ? 'border-indigo-500 bg-indigo-50/60 text-indigo-950 ring-1 ring-indigo-500' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}"><span class="grid h-6 w-6 place-items-center rounded-full text-[12px] font-bold ${on ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-indigo-700'}">${esc(ch.name.charAt(0))}</span>${esc(ch.name)}</button>`; }).join('')}</div>
      </div>`;
    }
    function renderOrderCard(o) {
      const pending = o.status === 'PENDING_PAYMENT';
      const paid = o.status === 'PAID';
      const archived = o.status === 'CANCELLED';
      const isParent = state.role === 'parent';
      const canOp = canOperate(o);
      const auto = o.source === 'AUTO_RENEWAL';
      const eligible = parentCanSelfServe(o);
      const hours = Number(o.expireHours || 99);
      const urgent = auto && pending && hours <= 48;
      const red = auto && pending && hours <= 24;
      const adjust = adjustmentPending(o);
      const priceChanged = auto && Number(o.previousTier) && Number(o.priceTier) && Number(o.previousTier) !== Number(o.priceTier);

      // DESIGN.md 2.2.1: 待办=浅黄提醒卡；常态=中性卡；失效=归档卡（零投影）
      let cardCls = 'min-h-[120px] rounded-2xl border border-slate-300 bg-slate-50/70 px-3.5 py-3';
      if (pending) {

        cardCls = 'min-h-[120px] rounded-2xl border border-dashed border-slate-400 bg-slate-50/60 px-3.5 py-3 opacity-60';
      }

      const sm = statusMeta(o.status);
      const statusBadge = pending
        ? `<span class="inline-flex shrink-0 items-center rounded-full border border-amber-300 bg-amber-100 px-2 py-0.5 text-[12px] font-bold text-amber-900">${esc(sm.label)}</span>`
        : paid
          ? `<span class="inline-flex shrink-0 items-center rounded-full border border-slate-300 bg-slate-100 px-2 py-0.5 text-[12px] font-bold text-slate-700">${esc(sm.label)}</span>`
          : `<span class="inline-flex shrink-0 items-center rounded-full border border-slate-300 bg-slate-100 px-2 py-0.5 text-[12px] font-bold text-slate-600">${esc(sm.label)}</span>`;

      const settlementTag = paid
        ? (o.classDissolved ? '小班已解散' : ((o.clearRecords && o.clearRecords.length) || (o.transferTrace && o.transferTrace.length) ? '含清退' : ''))

      const tags = [
        `<span class="inline-flex shrink-0 items-center rounded-md bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${esc(typeShort(o.orderType))}</span>`,
        settlementTag
          ? `<span data-settlement="${esc(settlementTag)}" class="inline-flex shrink-0 items-center rounded-md bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${esc(settlementTag)}</span>`
          : (auto ? '<span class="inline-flex shrink-0 items-center rounded-md bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">自动续费</span>' : '')
      ].filter(Boolean).join('');

      const voucherTone = o.voucherPendingReview ? 'text-amber-800' : o.hasVoucher ? 'text-emerald-700' : 'text-slate-600';
      const voucherText = o.hasVoucher ? `已传凭证(${o.voucherCount || 1})` : archived ? '未上传' : '待补凭证';

      let note = '';
      let noteBadge = '';
      let noteTone = 'text-slate-700';
      if (adjust) {
        noteBadge = isParent ? '' : '家长申请调整';
        note = isParent ? '已提交调整申请，待班长联系处理' : (o.adjustmentNote || o.adjustmentTags.join('、'));
        noteTone = 'text-amber-800';
      } else if (o.voucherPendingReview) {
        note = '已传凭证待核';
        noteTone = 'text-amber-800';
      } else if (urgent) {
        note = red ? `24h 逾期红线 · 仅剩 ${o.expireHours} 小时` : `48h 临期 · 距自动作废 ${o.expireHours} 小时`;
        noteTone = red ? 'text-rose-700' : 'text-amber-800';
      } else if (archived && o.cancelReason === 'EXPIRED_OVERDUE') {
        note = '24h 逾期自动作废 · HOLD 已释放';
        noteTone = 'text-rose-700';
      } else if (!isParent && priceChanged) {
        note = `价位调整 · ${o.previousTier}积分 → ${shortDate(o.effectiveFrom) || '新轮次'} 起 ${o.priceTier}积分`;
        noteTone = 'text-slate-700';
      } else if (!isParent && auto && o.makeupLessons) {
        note = `HOLD 冲突跳过 · 待补约 ${o.makeupLessons} 节`;
        noteTone = 'text-slate-700';
      } else if (!isParent && o.isForced) {
        note = '含特批改价 · 点击查看详情';

      let actions = '';
      if (isParent) {
        actions = eligible
          ? `<button data-action="open-adjustment" data-id="${o.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-7 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold whitespace-nowrap text-indigo-700 transition hover:bg-indigo-100/70 disabled:opacity-40">申请调整</button><button data-action="open-voucher" data-id="${o.id}" ${state.online === 'off' || (o.voucherCount || 0) >= 5 ? 'disabled' : ''} class="h-7 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold whitespace-nowrap text-slate-800 transition hover:bg-slate-50 disabled:opacity-40">上传付款凭证</button>`
          : `<button data-action="open-order" data-id="${o.id}" class="inline-flex items-center gap-0.5 text-[12px] font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">查看明细</button>`;
      } else if (canOp && pending) {

          ? `<button data-action="open-edit" data-id="${o.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-7 rounded-lg border border-slate-300 bg-white px-2 text-[12px] font-bold whitespace-nowrap text-slate-800 transition hover:bg-slate-50 disabled:opacity-40">修改</button>`
          : '';
        actions = `${editBtn}<button data-action="open-cancel" data-id="${o.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-7 rounded-lg border border-slate-300 bg-white px-2 text-[12px] font-bold whitespace-nowrap text-slate-800 transition hover:bg-slate-50 disabled:opacity-40">作废</button><button data-action="open-confirm" data-id="${o.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-7 rounded-lg bg-indigo-600 px-2 text-[12px] font-bold whitespace-nowrap text-white transition hover:bg-indigo-700 disabled:opacity-50">确认收款</button>`;
      } else if (paid) {
        actions = `<button data-action="open-fission" data-id="${o.id}" class="h-7 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold whitespace-nowrap text-slate-800 transition hover:bg-slate-50">课次明细</button>`;
      } else {
        actions = `<button data-action="open-order" data-id="${o.id}" class="inline-flex items-center gap-0.5 text-[12px] font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">查看明细</button>`;

      const summaryLine = o.orderType === 'small_group'
        ? `${o.teacherName} · ${o.lessonCount} 节 · 待上交 ${o.paidPoints} 积分`

      const holderLine = isParent
        ? `经办班长 <strong class="font-bold text-slate-900">${esc(holderLabel(o.holder))}</strong> · ${esc(shortDate(o.createdAt))}`
        : state.role === 'monitor' && !canOp
          ? `仅查看 · 资金持有人 <strong class="font-bold text-slate-900">${esc(holderLabel(o.holder))}</strong>`
          : `${o.holder === '平台' ? '资金持有' : '资金持有班长'} <strong class="font-bold text-slate-900">${esc(holderLabel(o.holder))}</strong> · ${esc(shortDate(o.createdAt))}`;

      return `<article data-action="open-order" data-id="${o.id}" role="button" tabindex="0" class="cursor-pointer transition hover:border-slate-400 active:scale-[0.995] ${cardCls}">
        <div class="flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-1.5">
            <span class="truncate text-[16px] font-bold text-slate-900">${esc(studentLabel(o))}</span>
            ${tags}
          </div>
          <span class="shrink-0">${statusBadge}</span>
        </div>
        <div class="mt-1.5 flex items-center justify-between gap-2 text-[12px]">
          <span class="min-w-0 truncate font-semibold leading-5 text-slate-700">${esc(summaryLine)}</span>
          <span class="shrink-0 font-semibold ${voucherTone}">${voucherText}</span>
        </div>
        ${note ? `<div class="mt-1.5 flex items-center gap-1.5 overflow-hidden text-[12px] leading-4">${noteBadge ? `<span class="shrink-0 rounded-md bg-amber-100 px-1.5 py-0.5 font-bold text-amber-900">${esc(noteBadge)}</span>` : ''}<span class="truncate font-semibold ${noteTone}">${esc(note)}</span></div>` : ''}
        <div class="mt-1 flex items-center justify-between gap-2 border-t border-slate-200/80 pt-2">
          <span class="min-w-0 truncate text-[12px] font-medium text-slate-600" data-role="holder-line">${holderLine}</span>
          <div class="flex shrink-0 items-center gap-1.5">${actions}</div>
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 详情
     * ------------------------------------------------------------------ */
    function holdGrid(o) {
      const tone = orderTone(o);
      const baseLabel = tone === 'emerald' ? '正式' : tone === 'slate' ? '释放' : '预占';
      const baseCls = tone === 'emerald' ? 'border-emerald-200 bg-white text-emerald-800' : tone === 'slate' ? 'border-slate-200 bg-white text-slate-500' : 'border-amber-300 border-dashed bg-white text-amber-800';
      const skippedWeeks = tone === 'emerald' ? [] : (o.holdSkipped || []);
      return `<div class="mt-1.5 grid grid-cols-4 gap-1">${[1, 2, 3, 4].map((w) => {
        const skipped = skippedWeeks.includes(w);
        const label = skipped ? '冲突跳过' : baseLabel;
        const cls = skipped ? 'border-rose-200 bg-white text-rose-700' : baseCls;
        return `<div class="rounded-lg border px-1 py-1.5 text-center ${cls}"><div class="text-[12px] font-bold">第${w}周</div><div class="text-[12px] font-medium">${label}</div></div>`;
      }).join('')}</div>`;
    }
    function cancelReasonLabel(o) {
      if (o.cancelReason === 'PARENT_DECLINED') return '家长暂不续费';
      if (o.cancelReason === 'EXPIRED_OVERDUE') return '24h 逾期自动作废';
      if (o.cancelReason === 'MANUAL_CANCEL') return '经办班长作废';
      return '单据作废';
    }
    function orderTimeline(o) {
      const items = [{
        at: o.createdAt,

    function createTotalLessons() {
      const f = state.create;
      if (f.orderType === 'small_group') return Math.max(0, Number(f.lessons) || 0);
      return itemsTotalLessons(f.items);
    }
    function createPendingClass() {
      const f = state.create;
      return f.orderType === 'small_group' && isPendingTeacherClass(classById(f.classId));
    }
    function createLeaveBlock() {
      const f = state.create;
      if (f.orderType !== 'small_group') return null;
      return classLeaveTeacher(classById(f.classId));
    }
    function createExpected() {
      const f = state.create;
      if (f.orderType === 'small_group') return Math.max(0, Number(f.paid) || 0);
      const extra = f.extraPrep ? 10 : 0;
      return (f.items || []).reduce((s, it) => s + (Number(it.priceTier) || 0) * Math.max(0, Number(it.lessons) || 0) + extra * Math.max(0, Number(it.lessons) || 0), 0);
    }
    function createLeave() { return Math.floor(createTotalLessons() * 0.125); }
    function createFormulaText() {
      const f = state.create;
      const lessons = createTotalLessons();
      if (f.orderType === 'small_group') {
        const cls = classById(f.classId);
        if (isPendingTeacherClass(cls)) return '待委任老师 · 暂不可提交';
        const leaveTeacher = classLeaveTeacher(cls);
        if (leaveTeacher) return `跨离职日续期 · 暂不可提交（${shortDate(leaveTeacher.leaveDate)} 离职）`;
        const paid = Math.max(0, Number(f.paid) || 0);
        const per = lessons > 0 ? Math.floor(paid / lessons) : 0;
        return `录入多少上交多少 · 折算约 ${per} 积分/节`;
      }
      const extra = f.extraPrep ? 10 : 0;
      const parts = (f.items || []).map((it) => `${it.priceTier}积分×${Number(it.lessons) || 0}节${extra ? `(+${extra})` : ''}`);
      return parts.join(' + ') || '请添加价位明细';
    }

      return `<div class="flex items-center gap-2"><span class="grid h-5 w-5 place-items-center rounded-full bg-indigo-50 text-[11px] font-bold text-indigo-600">${no}</span><h3 class="text-[14px] font-bold text-slate-900">${title}</h3></div>`;

      return `<button type="button" data-action="open-picker" data-picker="${picker}" aria-haspopup="dialog" aria-label="${ariaLabel}" class="flex h-11 w-full items-center justify-between gap-2 rounded-xl border border-slate-200 bg-slate-50/70 px-3.5 text-left text-[16px] font-medium text-slate-900 outline-none transition hover:bg-white focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">

      </button>`;

      return `<button type="button" data-action="pick-value" data-picker="${picker}" data-value="${esc(value)}" class="flex min-h-[44px] w-full items-center gap-3 px-3.5 py-2.5 text-left transition ${selected ? 'bg-indigo-50/70' : 'hover:bg-white'}">

                : `<div class="space-y-2">

    function updateCreateCalc() {
      const expectedEl = $('createExpected');
      if (!expectedEl) return;
      const f = state.create;
      const small = f.orderType === 'small_group';
      const trial = f.student === 'LeoW8';
      const totalLessons = createTotalLessons();
      const expected = createExpected();
      const leave = createLeave();
      const pending = createPendingClass();
      const leaveBlock = createLeaveBlock();
      if (f.autoPaid && !small) {
        f.paid = String(expected);
        const paidEl = $('createPaid');
        if (paidEl) paidEl.value = f.paid;
      }
      expectedEl.textContent = pending || leaveBlock ? '0' : expected;
      $('createFormula').textContent = createFormulaText();
      $('createLeave').textContent = `${leave} 节`;
      const paidNum = trial ? expected : Number(f.paid || 0);
      const diff = paidNum - expected;
      const mismatch = !small && !trial && paidNum !== expected;
      const diffEl = $('createDiff');
      diffEl.textContent = pending
        ? '待委任老师 · 暂不可提交'
        : leaveBlock
          ? '跨离职日续期 · 暂不可提交'
          : small
            ? '录入多少即上交多少'
            : trial
              ? '试课严格按价位计价 · 禁止改价'
              : mismatch ? `差额 ${diff > 0 ? '+' : ''}${diff}` : '与期望相符';
      diffEl.className = `text-[12px] font-semibold ${pending || leaveBlock ? 'text-rose-600' : trial ? 'text-slate-600' : mismatch ? 'text-amber-600' : 'text-emerald-600'}`;
      const forceBox = $('createForceBox');
      if (forceBox) forceBox.classList.toggle('hidden', !mismatch || pending);
      const trialLimitErr = trial && (totalLessons < 1 || totalLessons > 20);
      const submitEl = $('createSubmit');
      if (submitEl) {
        submitEl.disabled = state.online === 'off' || pending || trialLimitErr || !!leaveBlock;
        submitEl.textContent = pending ? '请先委任老师' : leaveBlock ? '跨离职日不可续期' : '提交生成待确认单据';
      }
      const tip = $('createLessonTip');
      if (tip) tip.classList.toggle('hidden', !(totalLessons > 0 && totalLessons % 4 !== 0));
      const limitTip = $('createLimitTip');
      if (limitTip) {
        limitTip.textContent = `试课待认领总节数范围为 1～20 节（当前 ${totalLessons} 节）`;
        limitTip.classList.toggle('hidden', !trialLimitErr);
      }
    }

      const currTier = Number(o.priceTier || editUnit);

    function updateEditCalc() {
      const el = $('editExpected');
      if (!el) return;
      const e = state.edit;
      const o = orderById(e.orderId);
      const teacher = o ? editTeacherInfo(o, e) : TEACHERS[0];
      const editUnit = teacher.priceTier;
      const expected = (Number(e.lessons) || 0) * editUnit;
      const leave = Math.floor((Number(e.lessons) || 0) * 0.125);
      if (e.autoPaid) {
        e.paid = String(expected);
        const paidEl = $('editPaid');
        if (paidEl) paidEl.value = e.paid;
      }
      el.textContent = `${expected} 积分`;
      $('editLeave').textContent = `${leave} 节`;
      const priceLine = $('editPriceLine');
      if (priceLine) priceLine.textContent = `${teacher.priceTier} 积分/节`;
      const diff = Number(e.paid || 0) - expected;
      const diffText = diff === 0 ? '与期望相符' : `差额 ${diff > 0 ? '+' : ''}${diff}`;
      const diffEl = $('editDiff');
      if (diffEl) {
        diffEl.textContent = diffText;
        diffEl.className = `text-[12px] font-semibold ${diff === 0 ? 'text-emerald-700' : 'text-amber-700'}`;
      }
      const summaryExpected = $('editSummaryExpected');
      if (summaryExpected) summaryExpected.textContent = expected;
      const summaryDiff = $('editSummaryDiff');
      if (summaryDiff) {
        summaryDiff.textContent = diffText;
        summaryDiff.className = diff === 0 ? 'text-emerald-700' : 'text-amber-700';
      }
      const forceBox = $('editForceBox');
      if (forceBox) forceBox.classList.toggle('hidden', Number(e.paid || 0) === expected);
    }

    function submitCreate() {
      if (state.online === 'off') return showToast('离线模式下不可录入购课单');
      if (state.role === 'parent') return;
      const f = state.create;
      const trial = f.student === 'LeoW8';
      const small = f.orderType === 'small_group';
      if (trial && small) return failCreate('试课待认领档案仅支持 1v1 课次');
      if (small && isPendingTeacherClass(classById(f.classId))) {
        return failCreate('该小班尚未委任授课老师，请先委任老师后再录单收款');
      }
      if (small) {
        const leaveTeacher = classLeaveTeacher(classById(f.classId));
        if (leaveTeacher) return failCreate(`所选授课老师已预约于 ${shortDate(leaveTeacher.leaveDate)} 离职，禁止开具跨离职日续期订单`);
      }
      if (small && f.remarks.trim().length > 200) return failCreate('业务备注不能超过 200 字');
      const lessons = createTotalLessons();
      if (!Number.isInteger(lessons) || lessons <= 0) return failCreate('课次数必须为正整数');
      if (trial && (lessons < 1 || lessons > 20)) return failCreate('试课待认领总节数严格限制为 1～20 节');
      if (!small) {
        const items = f.items || [];
        if (!items.length) return failCreate('请至少添加一条价位明细');
        const tiers = items.map((it) => Number(it.priceTier));
        if (new Set(tiers).size !== tiers.length) return failCreate('同一价位不可重复添加');
        if (items.some((it) => !Number.isInteger(Number(it.lessons)) || Number(it.lessons) <= 0)) {
          return failCreate('每行明细课次数必须为正整数');
        }
      }
      const expected = createExpected();
      const paid = trial ? expected : Number(f.paid);
      if (!Number.isInteger(paid) || paid <= 0) return failCreate('实收积分必须为正整数');
      if (!small && !trial && paid !== expected) {
        if (!f.forceSubmit) return failCreate('实收积分与期望积分不符，请勾选强制提交并填写原因');
        if (!f.forceReason.trim()) return failCreate('实收积分不符，请填写强制提交原因');
        if (f.forceReason.trim().length > 200) return failCreate('强制提交原因不能超过 200 字');
      }
      const cls = small ? classById(f.classId) : null;
      const sourceCls = small ? terminatedClassById(f.sourceClassId) : null;
      const t = small ? teacherById(cls.teacherId) : (f.teacherId ? teacherById(f.teacherId) : null);
      const holder = trial ? '平台' : state.role === 'admin' ? f.holder : 'Leo';
      const items = small ? undefined : f.items.map((it) => ({ priceTier: Number(it.priceTier), lessons: Number(it.lessons) }));
      const tier = small ? 0 : Number(items[0].priceTier);
      const order = {
        id: `ord_${Math.random().toString(36).slice(2, 10).padEnd(8, '0')}`,
        orderType: f.orderType, source: 'MANUAL', student: small ? cls.name : f.student, isTrial: trial,
        classId: small ? cls.id : undefined, className: small ? cls.name : undefined,
        teacherId: t ? t.id : '', teacherName: t ? t.name : '不指定意向老师',
        priceTier: tier, previousTier: tier, items,
        lessonCount: lessons, extraPrep: !small && f.extraPrep,
        expectedPoints: small ? paid : expected, paidPoints: paid, status: 'PENDING_PAYMENT',
        leaveQuota: Math.floor(lessons * 0.125), createdAt: '刚刚', holder,
        sourceClassId: sourceCls ? sourceCls.id : undefined, sourceClassName: sourceCls ? sourceCls.name : undefined,
        carriedRemaining: sourceCls ? sourceCls.remainingLessons : undefined, remarks: small ? f.remarks.trim() : '',
        isForced: !small && !trial && paid !== expected, forceReason: !small && !trial && paid !== expected ? f.forceReason.trim() : '',
        hasVoucher: f.vouchers.length > 0, voucherCount: f.vouchers.length, voucherPendingReview: false, cancelReason: '',
        adjustmentStatus: '', adjustmentTags: [], adjustmentNote: '', adjustmentAt: ''
      };
      state.orders.unshift(order);
      state.activeOrderId = order.id;
      state.page = 'detail';
      state.navTab = boardTab();
      state.overlay = null;
      renderAll();
      showToast('购课单已生成待确认收款 · 核实到账后请确认');
    }

    function pickEditTeacher(id) {
      const t = TEACHERS.find((x) => x.id === id);

    function cancelEdit() {

    function saveEdit() {
      if (state.online === 'off') return showToast('离线模式下不可修改');
      const e = state.edit;
      const o = orderById(e.orderId);
      if (!o || !canOperate(o)) return;
      const lessons = Number(e.lessons);
      const paid = Number(e.paid);
      if (!Number.isInteger(lessons) || lessons <= 0) { e.error = '课次数必须为正整数'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      if (lessons % 4 !== 0) { e.error = '续费课次数须为 4 的倍数（4 周固定时段）'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      if (!Number.isInteger(paid) || paid <= 0) { e.error = '实收积分必须为正整数'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      const newTeacher = editTeacherInfo(o, e);
      const teacherChanged = newTeacher.id !== o.teacherId || !!e.draft;
      if (state.role === 'monitor' && !isTeacherOwnedByMonitor(newTeacher) && teacherChanged) {
        e.error = '非本人负责老师，只能更换为本人负责的在职老师';
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
        showToast('非本人负责老师，请联系该老师现负责班长或管理员调整');
        return;
      }
      const editUnit = newTeacher.priceTier;
      const expected = lessons * editUnit;
      if (paid !== expected && e.forceReason.trim().length > 200) { e.error = '修改原因不能超过 200 字'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      if (paid !== expected && !e.forceReason.trim()) { e.error = '实收积分不符，请填写修改原因'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      const oldTeacher = teacherById(o.teacherId);
      const oldLessons = o.lessonCount;
      const oldPaid = o.paidPoints;
      const hadDraft = !!e.draft;
      if (newTeacher.id !== oldTeacher.id) {
        o.previousTier = oldTeacher.priceTier;
        o.priceChangeReason = `授课老师更换为 ${newTeacher.name}（${newTeacher.priceTier} 积分/节）。`;
      } else if (hadDraft) {
        o.priceChangeReason = `已按课表草稿更新未来 4 周排期，按 ${newTeacher.priceTier} 积分/节计费。`;
      }
      o.teacherId = newTeacher.id;
      o.teacherName = newTeacher.name;
      o.priceTier = newTeacher.priceTier;
      o.items = [{ priceTier: newTeacher.priceTier, lessons }];
      o.lessonCount = lessons;
      o.expectedPoints = expected;
      o.paidPoints = paid;
      o.leaveQuota = Math.floor(lessons * 0.125);
      o.isForced = paid !== expected;
      o.forceReason = paid !== expected ? e.forceReason.trim() : '';
      if (hadDraft) {
        const scheduleText = draftScheduleText(e.draft);
        if (scheduleText) o.preScheduleSlots = scheduleText;
        o.holdSkipped = draftConflictWeeks(e.draft);
        o.makeupLessons = Number(e.draft.conflictCount) || 0;
      }
      o.history = o.history || [];
      o.history.push({
        at: '刚刚',
        title: hadDraft ? '班长按课表草稿修改续费单' : '班长修改续费单',
        note: `老师 ${oldTeacher.name}→${newTeacher.name}；课次 ${oldLessons}→${lessons}；实收 ${oldPaid}→${paid}；${hadDraft ? '释放旧 HOLD 并锁定新排期 HOLD' : '更新账单'}`,
        actor: holderLabel(o.holder)
      });
      if (adjustmentPending(o)) { o.adjustmentStatus = 'RESOLVED'; o.adjustmentResolvedAt = '刚刚'; }
      discardRenewalDraft(o.id);
      state.overlay = null;
      renderAll();
      showToast(hadDraft ? '已保存并更正账单 · 旧 HOLD 已释放，新 HOLD 已锁定' : '已保存并更正账单，已通知家长');
    }

    $('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'back-list') { state.page = 'list'; state.overlay = null; renderAll(); return; }
      if (action === 'banner-back') {
        if (state.overlay && state.overlay.type === 'edit') return cancelEdit();
        if (state.overlay) { state.overlay = null; renderAll(); return; }
        if (state.page === 'detail') { state.page = 'list'; renderAll(); return; }
        return;
      }
      if (action === 'open-order') return openOrder(el.dataset.id);
      if (action === 'open-create') return openCreate();
      if (action === 'close-overlay') { state.overlay = null; resetCreatePicker(); renderAll(); return; }
      if (action === 'open-picker') {
        state.create.picker = el.dataset.picker || null;
        state.create.pickerQuery = '';
        $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'close-picker') {
        resetCreatePicker();
        $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'pick-value') return pickCreateValue(el.dataset.picker, el.dataset.value || '');
      if (action === 'set-holder') {
        state.create.holder = el.dataset.value;
        $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons();
        return;
      }
      if (action === 'set-item-tier') {
        const idx = Number(el.dataset.index);
        if (!state.create.items[idx]) return;
        state.create.items[idx].priceTier = Number(el.dataset.value);
        state.create.error = '';
        $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); updateCreateCalc();
        return;
      }
      if (action === 'cancel-edit') return cancelEdit();
      if (action === 'apply-remaining') {
        const src = terminatedClassById(state.create.sourceClassId);
        if (!src) return;
        state.create.lessons = String(src.remainingLessons);
        state.create.autoPaid = true;
        state.create.error = '';
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
        updateCreateCalc();
        return showToast(`已带入承接原班剩余 ${src.remainingLessons} 节`);
      }
      if (action === 'set-status') { state.statusFilter = el.dataset.value; renderContentOnly(); return; }
      if (action === 'set-source') { state.sourceFilter = el.dataset.value; renderContentOnly(); return; }
      if (action === 'select-child') { state.parentChild = el.dataset.child; renderContentOnly(); return; }
      if (action === 'create-type') return setCreateType(el.dataset.value);
      if (action === 'add-item-row') {
        const used = state.create.items.map((it) => Number(it.priceTier));
        const nextTier = PRICE_TIERS.find((t) => !used.includes(t));
        if (!nextTier) return;
        state.create.items.push({ priceTier: nextTier, lessons: '1' });
        state.create.error = '';
        $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); updateCreateCalc(); return;
      }
      if (action === 'remove-item-row') {
        if (state.create.items.length <= 1) return;
        state.create.items.splice(Number(el.dataset.index), 1);
        state.create.error = '';
        $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); updateCreateCalc(); return;
      }
      if (action === 'submit-create') return submitCreate();
      if (action === 'remove-voucher') { state.create.vouchers.splice(Number(el.dataset.index), 1); $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      if (action === 'open-confirm') return openConfirm(el.dataset.id);
      if (action === 'confirm-pay') return confirmPay();
      if (action === 'open-cancel') return openCancel(el.dataset.id);
      if (action === 'confirm-cancel') return confirmCancel();
      if (action === 'open-edit') return openEdit(el.dataset.id);
      if (action === 'save-edit') return saveEdit();
      if (action === 'cancel-renewal') { discardRenewalDraft(el.dataset.id); state.overlay = null; return openCancel(el.dataset.id); }
      if (action === 'open-fission') return openFission(el.dataset.id);
      if (action === 'open-adjustment') return openAdjustment(el.dataset.id);
      if (action === 'toggle-adjust-tag') return toggleAdjustTag(el.dataset.tag);
      if (action === 'submit-adjustment') return submitAdjustment();
      if (action === 'open-decline') return openDecline(el.dataset.id);
      if (action === 'confirm-decline') return confirmDecline();
      if (action === 'mark-communicated') return markCommunicated(el.dataset.id);
      if (action === 'open-wechat-qr') { state.overlay = { type: 'wechat-qr', holder: el.dataset.holder || 'Leo' }; renderAll(); return; }
      if (action === 'pick-edit-teacher') return pickEditTeacher(el.dataset.teacher);
      if (action === 'set-edit-lessons') {
        state.edit.lessons = el.dataset.lessons;
        state.edit.autoPaid = true;
        state.edit.error = '';
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
        updateEditCalc();
        return;
      }
      if (action === 'open-voucher') return openVoucher(el.dataset.id);
      if (action === 'sample-voucher') return sampleVoucher();
      if (action === 'submit-voucher') return submitVoucher();
      if (action === 'simulate-overdue') return simulateOverdue();
    });
    $('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'orderSearch') {
        state.query = e.target.value;
        const val = e.target.value;
        renderContentOnly();
        const input = $('orderSearch');
        if (input) { input.focus(); input.setSelectionRange(val.length, val.length); }
        return;
      }
      if (id === 'pickerSearch') {
        state.create.pickerQuery = e.target.value;
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
        const input = $('pickerSearch');
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
        return;
      }
      if (e.target.dataset.action === 'item-lessons') {
        const idx = Number(e.target.dataset.index);
        if (state.create.items[idx]) state.create.items[idx].lessons = e.target.value;
        state.create.error = '';
        updateCreateCalc();
        return;
      }
      if (id === 'createLessons') { state.create.lessons = e.target.value; state.create.error = ''; updateCreateCalc(); return; }
      if (id === 'createPaid') { state.create.paid = e.target.value; state.create.autoPaid = false; state.create.error = ''; updateCreateCalc(); return; }
      if (id === 'createForceReason') { state.create.forceReason = e.target.value; state.create.error = ''; return; }
      if (id === 'createRemarks') { state.create.remarks = e.target.value; state.create.error = ''; return; }
      if (id === 'editLessons') { state.edit.lessons = e.target.value; state.edit.error = ''; updateEditCalc(); return; }
      if (id === 'editPaid') { state.edit.paid = e.target.value; state.edit.autoPaid = false; state.edit.error = ''; updateEditCalc(); return; }
      if (id === 'editForceReason') { state.edit.forceReason = e.target.value; state.edit.error = ''; return; }
      if (id === 'adjustNote') { state.adjustment.note = e.target.value; state.adjustment.error = ''; return; }
      if (id === 'voucherAmount') { state.voucher.amount = e.target.value; state.voucher.error = ''; return; }
      if (id === 'voucherRemark') { state.voucher.remark = e.target.value; return; }
    });
    $('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'createExtra') { state.create.extraPrep = e.target.checked; state.create.error = ''; updateCreateCalc(); return; }
      if (id === 'createForceSubmit') { state.create.forceSubmit = e.target.checked; state.create.error = ''; return; }
      if (id === 'createVoucherInput') {
        const files = Array.from(e.target.files || []);
        for (const file of files) {
          if (state.create.vouchers.length >= 5) { showToast('最多上传 5 个凭证'); break; }
          if (!['image/jpeg', 'image/png', 'application/pdf'].includes(file.type)) { showToast('仅支持 JPG / PNG / PDF'); continue; }
          if (file.size > 10 * 1024 * 1024) { showToast('文件大小不能超过 10MB'); continue; }
          state.create.vouchers.push({ name: file.name, size: file.size });
        }
        e.target.value = '';
        $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons();
        return;
      }
      if (id === 'voucherFile') {
        const file = (e.target.files || [])[0];
        if (!file) return;
        if (!['image/jpeg', 'image/png', 'application/pdf'].includes(file.type)) { state.voucher.error = '仅支持 JPG / PNG / PDF'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
        if (file.size > 10 * 1024 * 1024) { state.voucher.error = '文件大小不能超过 10MB'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
        state.voucher.file = { name: file.name, size: file.size };
        state.voucher.error = '';
        $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons();
        return;
      }
    });

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    if (params.get('draft') === '1') {
      const draftOrderId = params.get('orderId');
      const draft = draftOrderId ? loadRenewalDraft(draftOrderId) : null;
      const target = draftOrderId ? state.orders.find((o) => o.id === draftOrderId) : null;
      if (draft && target && target.source === 'AUTO_RENEWAL' && target.status === 'PENDING_PAYMENT' && canOperate(target)) {
        state.activeOrderId = target.id;
        state.edit = buildEditState(target, draft);
        state.overlay = { type: 'edit', orderId: target.id };
      }
    }
    renderAll();
    if (params.get('bare') !== '1') applyConsoleCollapsed(readConsoleCollapsed());
    updateCreateCalc();
    if (state.overlay && state.overlay.type === 'edit') updateEditCalc();
    if (params.get('scroll') === 'bottom') {
      setTimeout(() => {
        const contentEl = $('content');
        if (contentEl) contentEl.scrollTop = contentEl.scrollHeight;
      }, 400);
    }
  </script>
</body>
</html>

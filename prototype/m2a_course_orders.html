    function scopedOrders() {
      let list = state.orders;

    }
    function statusMeta(status) {
      if (status === 'PENDING_PAYMENT') return { label: '待确认收款', tone: 'amber' };
      if (status === 'PAID') return { label: '已购课', tone: 'emerald' };
      return { label: '已作废', tone: 'slate' };
    }
    function sourceMeta(source) {
      return source === 'AUTO_RENEWAL' ? { label: '自动续费' } : { label: '人工录入' };
    }
    function typeLabel(type) {
      if (type === '1v1_fixed') return '1v1 固定位';

    function levelLabel(level) {

    function canViewOrder(o) {
      if (state.role === 'admin') return true;

    function canOperate(o) {

    function generateTSFission(order) {
      const n = Math.max(1, Number(order.lessonCount));
      const total = Number(order.paidPoints);
      const base = Math.floor(total / n);
      const remainder = total % n;
      return Array.from({ length: n }, (_, i) => ({
        index: i + 1,
        tsId: `ts_${String(order.id).slice(-4)}${String(i + 1).padStart(5, '0')}`,
        points: i === n - 1 ? base + remainder : base,
        holder: order.holder,
        last: i === n - 1
      }));
    }
    function unitExpectedFor(order) {
      if (order.orderType === 'small_group') {

    function renderOrderCard(o) {

      const urgent = auto && pending && hours <= 48;

      // DESIGN.md 2.2.1: 待办=浅黄提醒卡；常态=中性卡；失效=归档卡
      let cardCls = 'rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5';

        cardCls = 'rounded-2xl border border-amber-300 bg-amber-50/50 p-3.5';

    function createUnitExpected() {
      const f = state.create;
      if (f.orderType === 'small_group') {
        const cls = classById(f.classId);
        return isPendingTeacherClass(cls) ? 0 : cls.teacherRate + cls.max * 6;
      }
      return teacherById(f.teacherId).rate + 2 + (f.extraPrep ? 10 : 0);
    }
    function createPendingClass() {
      const f = state.create;
      return f.orderType === 'small_group' && isPendingTeacherClass(classById(f.classId));
    }
    function createExpected() { return Math.max(0, Number(state.create.lessons) || 0) * createUnitExpected(); }
    function createLeave() { return Math.floor(Math.max(0, Number(state.create.lessons) || 0) * 0.125); }
    function createFormulaText() {
      const f = state.create;
      const lessons = Math.max(0, Number(f.lessons) || 0);
      if (f.orderType === 'small_group') {
        const cls = classById(f.classId);
        if (isPendingTeacherClass(cls)) return '待委任老师 · 暂不可测算';
        return `${lessons} × (${cls.teacherRate} 课酬 + Max ${cls.max} × 6)`;
      }
      const rate = teacherById(f.teacherId).rate;
      return `${lessons} × (${rate} 课酬 + 2 工具费${f.extraPrep ? ' + 10 备课费' : ''})`;
    }

    function updateCreateCalc() {
      const expectedEl = $('createExpected');
      if (!expectedEl) return;
      const f = state.create;
      const expected = createExpected();
      const leave = createLeave();
      const pending = createPendingClass();
      if (f.autoPaid && !pending) {
        f.paid = String(expected);
        const paidEl = $('createPaid');
        if (paidEl) paidEl.value = f.paid;
      }
      expectedEl.textContent = pending ? '0' : expected;
      $('createFormula').textContent = createFormulaText();
      $('createLeave').textContent = `${leave} 节`;
      const small = f.orderType === 'small_group';
      const paidNum = Number(f.paid || 0);
      const diff = paidNum - expected;
      const belowFloor = small && paidNum < expected;
      const otherSurplus = small ? paidNum - expected : 0;
      const mismatch = small ? belowFloor : paidNum !== expected;
      const diffEl = $('createDiff');
      diffEl.textContent = pending
        ? '待委任老师 · 暂不可测算'
        : small
          ? (belowFloor ? `低于底线 ${Math.abs(diff)}` : otherSurplus > 0 ? `其他结余 +${otherSurplus}` : '满足底线')
          : mismatch ? `差额 ${diff > 0 ? '+' : ''}${diff}` : '与期望相符';
      diffEl.className = `text-[12px] font-semibold ${pending || belowFloor ? 'text-rose-600' : small ? 'text-emerald-600' : mismatch ? 'text-amber-600' : 'text-emerald-600'}`;
      $('createForceBox').classList.toggle('hidden', small || !mismatch || pending);
      const surplusEl = $('createSurplus');
      if (surplusEl) {
        surplusEl.textContent = `其他结余 +${otherSurplus} 积分 · 沉淀平台，不可退`;
        surplusEl.classList.toggle('hidden', !(small && otherSurplus > 0));
      }
      const floorEl = $('createFloorWarn');
      if (floorEl) {
        floorEl.textContent = `待上交总积分低于底线：最低 ${expected} 积分（课时 × 教师课酬 + Max×6）。请提高金额后再提交。`;
        floorEl.classList.toggle('hidden', !(small && belowFloor));
      }
      const submitEl = $('createSubmit');
      if (submitEl) {
        submitEl.disabled = state.online === 'off' || pending || belowFloor;
        submitEl.textContent = pending ? '请先委任老师' : belowFloor ? '低于底线 · 不可提交' : '提交生成待确认单据';
      }
      const tip = $('createLessonTip');
      if (tip) tip.classList.toggle('hidden', f.orderType !== '1v1_fixed' || (Number(f.lessons) % 4 === 0) || !Number(f.lessons));
      const limitTip = $('createLimitTip');
      if (limitTip) limitTip.classList.toggle('hidden', f.orderType !== '1v1_temp' || Number(f.lessons) <= 20);
    }

        <div class="mt-2"><label for="voucherAmount" class="mb-1 block text-[14px] font-semibold text-slate-700">付款金额（积分）</label><input id="voucherAmount" type="number" value="${esc(v.amount)}" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-[16px] text-slate-900 outline-none"></div>

    /* ------------------------------------------------------------------
     * 业务动作
     * ------------------------------------------------------------------ */
    function openCreate() {
      if (state.online === 'off') return showToast('离线模式下不可录入购课单');
      if (state.role === 'parent') return;
      state.create = emptyCreate();
      state.create.holder = 'Leo';
      state.overlay = { type: 'create' };
      renderAll();
      updateCreateCalc();
    }
    function submitCreate() {
      if (state.online === 'off') return showToast('离线模式下不可录入购课单');
      if (state.role === 'parent') return;
      const f = state.create;
      if (f.student === 'LeoW8' && f.orderType !== '1v1_temp') return failCreate('试课待认领档案仅支持 1v1 临时课');
      if (f.orderType === 'small_group' && isPendingTeacherClass(classById(f.classId))) {
        return failCreate('该小班尚未委任授课老师，请先委任老师后再录单收款（CLASS_TEACHER_NOT_ASSIGNED）');
      }
      if (f.orderType === 'small_group' && f.remarks.trim().length > 200) return failCreate('业务备注不能超过 200 字');
      const lessons = Number(f.lessons);
      if (!Number.isInteger(lessons) || lessons <= 0) return failCreate('课时数必须为正整数');
      if (f.orderType === '1v1_temp' && lessons > 20) return failCreate('1v1 临时课课时数上限为 20 节');
      const paid = Number(f.paid);
      if (!Number.isInteger(paid) || paid <= 0) return failCreate('实收积分必须为正整数');
      const expected = createExpected();
      if (f.orderType === 'small_group') {
        if (paid < expected) return failCreate(`待上交总积分不得低于底线 ${expected} 积分（课时 × (教师课酬 + Max×6)）`);
      } else if (paid !== expected) {
        if (!f.forceReason.trim()) return failCreate('PRICE_CALCULATION_MISMATCH · 金额不符必须填写强制提交原因');
        if (f.forceReason.trim().length > 200) return failCreate('强制提交原因不能超过 200 字');
      }
      const trial = f.student === 'LeoW8';
      const small = f.orderType === 'small_group';
      const cls = small ? classById(f.classId) : null;
      const sourceCls = small ? terminatedClassById(f.sourceClassId) : null;
      const t = small ? teacherById(cls.teacherId) : teacherById(f.teacherId);
      const holder = trial ? '平台' : state.role === 'admin' ? f.holder : 'Leo';
      const order = {
        id: `ord_${Math.random().toString(36).slice(2, 10).padEnd(8, '0')}`,
        orderType: f.orderType, source: 'MANUAL', student: small ? cls.name : f.student, isTrial: trial,
        classId: small ? cls.id : undefined, className: small ? cls.name : undefined,
        teacherId: t.id, teacherName: t.name, teacherLevel: t.level, previousLevel: t.level,
        courseType: small ? cls.courseType : f.courseType, lessonCount: lessons, extraPrep: f.extraPrep && !small,
        expectedPoints: expected, paidPoints: paid, status: 'PENDING_PAYMENT',
        leaveQuota: Math.floor(lessons * 0.125), createdAt: '刚刚', holder,
        sourceClassId: sourceCls ? sourceCls.id : undefined, sourceClassName: sourceCls ? sourceCls.name : undefined,
        carriedRemaining: sourceCls ? sourceCls.remainingLessons : undefined, remarks: small ? f.remarks.trim() : '',
        otherBalancePoints: small ? Math.max(0, paid - expected) : 0,
        isForced: !small && paid !== expected, forceReason: !small && paid !== expected ? f.forceReason.trim() : '',
        hasVoucher: f.vouchers.length > 0, voucherCount: f.vouchers.length, cancelReason: ''
      };
      state.orders.unshift(order);
      state.activeOrderId = order.id;
      state.page = 'detail';
      state.navTab = boardTab();
      state.overlay = null;
      renderAll();
      showToast('购课单已生成待确认收款 · 核实到账后请确认');
    }

      state.create.error = msg;
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
      showToast(msg);
    }

      if (state.create.student === 'LeoW8' && type !== '1v1_temp') return showToast('试课待认领档案仅支持 1v1 临时课');
      state.create.orderType = type;

      if (!o || !canOperate(o)) return showToast('无权操作该购课单');
      if (o.source !== 'AUTO_RENEWAL') return showToast('仅自动续费单可在确认收款前修改');
      state.edit = { orderId: id, lessons: String(o.lessonCount), paid: String(o.paidPoints), slotsTue: true, slotsThu: true, slotTime: o.slotTime || '19:00', forceReason: o.forceReason || '', error: '' };
      state.overlay = { type: 'edit', orderId: id };
      renderAll();
      updateEditCalc();
    }
    function saveEdit() {
      if (state.online === 'off') return showToast('离线模式下不可修改');
      const e = state.edit;
      const o = orderById(e.orderId);
      if (!o || !canOperate(o)) return;
      const lessons = Number(e.lessons);
      const paid = Number(e.paid);
      if (!Number.isInteger(lessons) || lessons <= 0) { e.error = '课时数必须为正整数'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      if (!Number.isInteger(paid) || paid <= 0) { e.error = '实收积分必须为正整数'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      if (!e.slotsTue && !e.slotsThu) { e.error = '请至少保留一个固定上课时段'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      const editUnit = teacherById(o.teacherId).rate + 2;
      const expected = lessons * editUnit;
      if (paid !== expected && e.forceReason.trim().length > 200) { e.error = '强制提交原因不能超过 200 字'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      if (paid !== expected && !e.forceReason.trim()) { e.error = '金额不符必须填写修改原因'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      const days = [e.slotsTue ? '二' : '', e.slotsThu ? '四' : ''].filter(Boolean).join('、');
      o.lessonCount = lessons;
      o.expectedPoints = expected;
      o.paidPoints = paid;
      o.leaveQuota = Math.floor(lessons * 0.125);
      o.isForced = paid !== expected;
      o.forceReason = paid !== expected ? e.forceReason.trim() : '';
      o.slotTime = e.slotTime;
      o.preScheduleSlots = `每周${days} ${slotRange(e.slotTime)}（共 ${lessons} 节）`;
      state.overlay = null;
      renderAll();
      showToast('购课单已更新 · 更正账单与日历预占已同步');
    }
    function openFission(id) {
      state.overlay = { type: 'fission', orderId: id };
      renderAll();
    }
    function openContact(id) {
      if (state.online === 'off') return showToast('离线模式下不可提交协调申请');
      state.contact = emptyContact();
      state.contact.orderId = id;
      state.overlay = { type: 'contact', orderId: id };
      renderAll();
    }
    function submitContact() {
      if (state.online === 'off') return showToast('离线模式下不可提交');
      state.overlay = null;
      renderAll();
      showToast('协调申请已发送给负责班长 Leo · 2 小时内响应');
    }
    function openVoucher(id) {
      if (state.role === 'parent') return showToast('家长端只读，支付凭证由经办班长上传');
      if (state.online === 'off') return showToast('离线模式下不可上传凭证');
      const o = orderById(id);
      if (!o) return;
      state.voucher = { orderId: id, amount: String(o.paidPoints), remark: '', file: null, error: '' };
      state.overlay = { type: 'voucher', orderId: id };
      renderAll();
    }
    function sampleVoucher() {
      state.voucher.file = { name: '微信转账回单.png', size: 240 * 1024 };
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }
    function submitVoucher() {
      if (state.online === 'off') return showToast('离线模式下不可上传凭证');
      if (state.role === 'parent') return showToast('家长端只读');
      const v = state.voucher;
      if (!v.file) { v.error = '请选择凭证文件，或使用示例凭证'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      const o = orderById(v.orderId);
      if (!o) return;
      if ((o.voucherCount || 0) >= 5) { v.error = '每单最多上传 5 个凭证'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      o.hasVoucher = true;
      o.voucherCount = (o.voucherCount || 0) + 1;
      o.voucherAmount = Number(v.amount) || o.paidPoints;
      o.voucherRemark = v.remark;
      state.overlay = null;
      renderAll();
      showToast('支付凭证上传成功 · 班长核实到账后确认收款');
    }

    /* ------------------------------------------------------------------
     * 事件委托
     * ------------------------------------------------------------------ */
    $('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'back-list') { state.page = 'list'; state.overlay = null; renderAll(); return; }
      if (action === 'banner-back') {
        if (state.overlay) { state.overlay = null; renderAll(); return; }
        if (state.page === 'detail') { state.page = 'list'; renderAll(); return; }
        return;
      }
      if (action === 'open-order') return openOrder(el.dataset.id);
      if (action === 'open-create') return openCreate();
      if (action === 'close-overlay') { state.overlay = null; renderAll(); return; }
      if (action === 'apply-remaining') {
        const src = terminatedClassById(state.create.sourceClassId);
        if (!src) return;
        state.create.lessons = String(src.remainingLessons);
        state.create.autoPaid = true;
        state.create.error = '';
        $('overlay').innerHTML = renderOverlay();
        if (window.lucide) lucide.createIcons();
        updateCreateCalc();
        return showToast(`已带入承接原班剩余 ${src.remainingLessons} 节`);
      }
      if (action === 'set-status') { state.statusFilter = el.dataset.value; renderContentOnly(); return; }
      if (action === 'set-source') { state.sourceFilter = el.dataset.value; renderContentOnly(); return; }
      if (action === 'select-child') { state.parentChild = el.dataset.child; renderContentOnly(); return; }
      if (action === 'create-type') return setCreateType(el.dataset.value);
      if (action === 'submit-create') return submitCreate();
      if (action === 'remove-voucher') { state.create.vouchers.splice(Number(el.dataset.index), 1); $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
      if (action === 'open-confirm') return openConfirm(el.dataset.id);
      if (action === 'confirm-pay') return confirmPay();
      if (action === 'open-cancel') return openCancel(el.dataset.id);
      if (action === 'confirm-cancel') return confirmCancel();
      if (action === 'open-edit') return openEdit(el.dataset.id);
      if (action === 'save-edit') return saveEdit();
      if (action === 'cancel-fixed') { state.overlay = null; return openCancel(el.dataset.id); }
      if (action === 'open-fission') return openFission(el.dataset.id);
      if (action === 'open-contact') return openContact(el.dataset.id);
      if (action === 'submit-contact') return submitContact();
      if (action === 'open-voucher') return openVoucher(el.dataset.id);
      if (action === 'sample-voucher') return sampleVoucher();
      if (action === 'submit-voucher') return submitVoucher();
      if (action === 'simulate-overdue') return simulateOverdue();
    });
    $('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'orderSearch') {
        state.query = e.target.value;
        const val = e.target.value;
        renderContentOnly();
        const input = $('orderSearch');
        if (input) { input.focus(); input.setSelectionRange(val.length, val.length); }
        return;
      }
      if (id === 'createLessons') { state.create.lessons = e.target.value; state.create.error = ''; updateCreateCalc(); return; }
      if (id === 'createPaid') { state.create.paid = e.target.value; state.create.autoPaid = false; state.create.error = ''; updateCreateCalc(); return; }
      if (id === 'createForceReason') { state.create.forceReason = e.target.value; state.create.error = ''; return; }
      if (id === 'createRemarks') { state.create.remarks = e.target.value; state.create.error = ''; return; }
      if (id === 'editLessons') { state.edit.lessons = e.target.value; state.edit.error = ''; updateEditCalc(); return; }
      if (id === 'editPaid') { state.edit.paid = e.target.value; state.edit.error = ''; updateEditCalc(); return; }
      if (id === 'editForceReason') { state.edit.forceReason = e.target.value; state.edit.error = ''; return; }
      if (id === 'contactMemo') { state.contact.memo = e.target.value; return; }
      if (id === 'voucherAmount') { state.voucher.amount = e.target.value; state.voucher.error = ''; return; }
      if (id === 'voucherRemark') { state.voucher.remark = e.target.value; return; }
    });
    $('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'createClass') { state.create.classId = e.target.value; state.create.error = ''; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); updateCreateCalc(); return; }
      if (id === 'createSourceClass') { state.create.sourceClassId = e.target.value; state.create.error = ''; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); updateCreateCalc(); return; }
      if (id === 'createStudent') {
        state.create.student = e.target.value; state.create.error = '';
        if (e.target.value === 'LeoW8') { state.create.orderType = '1v1_temp'; state.create.holder = '平台'; }
        else if (state.create.holder === '平台') state.create.holder = 'Leo';
        $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); updateCreateCalc();
        return;
      }
      if (id === 'createTeacher') { state.create.teacherId = e.target.value; state.create.error = ''; updateCreateCalc(); return; }
      if (id === 'createCourse') { state.create.courseType = e.target.value; state.create.error = ''; return; }
      if (id === 'createHolder') { state.create.holder = e.target.value; return; }
      if (id === 'createExtra') { state.create.extraPrep = e.target.checked; state.create.error = ''; updateCreateCalc(); return; }
      if (id === 'editSlotTue') { state.edit.slotsTue = e.target.checked; return; }
      if (id === 'editSlotThu') { state.edit.slotsThu = e.target.checked; return; }
      if (id === 'editSlotTime') { state.edit.slotTime = e.target.value; return; }
      if (id === 'contactType') { state.contact.type = e.target.value; return; }
      if (id === 'createVoucherInput') {
        const files = Array.from(e.target.files || []);
        for (const file of files) {
          if (state.create.vouchers.length >= 5) { showToast('最多上传 5 个凭证'); break; }
          if (!['image/jpeg', 'image/png', 'application/pdf'].includes(file.type)) { showToast('仅支持 JPG / PNG / PDF'); continue; }
          if (file.size > 10 * 1024 * 1024) { showToast('文件大小不能超过 10MB'); continue; }
          state.create.vouchers.push({ name: file.name, size: file.size });
        }
        e.target.value = '';
        $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons();
        return;
      }
      if (id === 'voucherFile') {
        const file = (e.target.files || [])[0];
        if (!file) return;
        if (!['image/jpeg', 'image/png', 'application/pdf'].includes(file.type)) { state.voucher.error = '仅支持 JPG / PNG / PDF'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
        if (file.size > 10 * 1024 * 1024) { state.voucher.error = '文件大小不能超过 10MB'; $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons(); return; }
        state.voucher.file = { name: file.name, size: file.size };
        state.voucher.error = '';
        $('overlay').innerHTML = renderOverlay(); if (window.lucide) lucide.createIcons();
        return;
      }
      if (e.target.name === 'coordType') state.contact.type = e.target.value;
    });

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    renderAll();
    updateCreateCalc();
  </script>
</body>
</html>

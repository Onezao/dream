    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function roleMeta() { return ROLE_META[state.role]; }
    function navItems() { return NAVS[state.role]; }
    function boardTab() { return roleMeta().boardTab; }
    function teacherById(id) { return TEACHERS.find((t) => t.id === id) || TEACHERS[0]; }
    function classById(id) { return CLASSES.find((c) => c.id === id) || CLASSES[0]; }
    function orderById(id) { return state.orders.find((o) => o.id === id) || null; }

    function scopedOrders() {
      let list = state.orders;
      if (state.role === 'monitor') list = list.filter((o) => o.holder === 'Leo');
      if (state.role === 'admin') list = list.slice();
      if (state.role === 'parent') list = list.filter((o) => o.student === state.parentChild && o.orderType !== 'small_group');
      return list;
    }

    function filteredOrders() {
      let list = scopedOrders();
      if (state.statusFilter !== 'all') list = list.filter((o) => o.status === state.statusFilter);
      if (state.sourceFilter !== 'all') list = list.filter((o) => o.source === state.sourceFilter);
      const q = state.query.trim().toLowerCase();
      if (q) list = list.filter((o) => [o.student, o.id, o.teacherName, o.className || ''].join(' ').toLowerCase().includes(q));
      return list;
    }

    function statusMeta(status) {
      if (status === 'PENDING_PAYMENT') return { label: '待确认收款', cls: 'border-amber-200 bg-amber-50 text-amber-800' };
      if (status === 'PAID') return { label: '已购课 (已裂变)', cls: 'border-emerald-200 bg-emerald-50 text-emerald-700' };
      return { label: '已作废', cls: 'border-slate-200 bg-slate-100 text-slate-500' };
    }

    function sourceMeta(source) {
      return source === 'AUTO_RENEWAL'
        ? { label: '系统自动续费', cls: 'border-indigo-100 bg-indigo-50 text-indigo-700' }
        : { label: '人工录入', cls: 'border-slate-200 bg-slate-100 text-slate-600' };
    }

    function typeLabel(type) {
      if (type === '1v1_fixed') return '1v1 固定位';
      if (type === '1v1_temp') return '1v1 临时课';
      return '小班整班课';
    }

    function levelLabel(level, rate) {
      return `${level.charAt(0)}${level.slice(1).toLowerCase()} ${rate}分`;
    }

    function holderLabel(holder) { return holder === '平台' ? '平台（管理员）' : holder; }

    function incomeTone(status) {
      if (status === 'PAID') return 'text-emerald-700';
      if (status === 'PENDING_PAYMENT') return 'text-amber-700';
      return 'text-slate-400';
    }

    function generateTSFission(order) {
      const n = Math.max(1, Number(order.lessonCount));
      const total = Number(order.paidPoints);
      const base = Math.floor(total / n);
      const remainder = total % n;
      return Array.from({ length: n }, (_, i) => ({
        index: i + 1,
        tsId: `ts_${String(order.id).slice(-6)}_${String(i + 1).padStart(2, '0')}`,
        points: i === n - 1 ? base + remainder : base,
        holder: order.holder,
        last: i === n - 1
      }));
    }

    function unitExpectedFor(order) {
      const t = teacherById(order.teacherId);
      if (order.orderType === 'small_group') {
        const cls = classById(order.classId);
        return cls.teacherRate + cls.max * 6;
      }
      return t.rate + 2 + (order.extraPrep ? 10 : 0);
    }

        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;

          renderAll();
          if (value === 'off') showToast('离线模式：只读缓存，录单/确认/作废/凭证不可用');

      state.statusFilter = 'all';
      state.sourceFilter = 'all';
      state.query = '';
      state.overlay = null;
      renderAll();

      const item = navItems().find((n) => n.id === tab);
      if (!item) return;
      state.navTab = tab;
      state.page = item.board ? 'list' : 'placeholder';
      state.overlay = null;
      renderAll();
    }

      document.querySelectorAll('.ctl').forEach((b) => {
        const active = state[b.dataset.group] === b.dataset.value;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;

      state.role = 'monitor';

      state.navTab = 'ops';
      state.device = 'mobile';
      state.online = 'on';

      state.sourceFilter = 'all';

      document.getElementById('bottomnav').innerHTML = renderNav();

    function renderContentOnly() {
      document.getElementById('content').innerHTML = renderContent();
      lucide.createIcons();
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.page === 'detail') {
        const o = orderById(state.activeOrderId);
        if (!o || !canViewOrder(o)) return renderList();
        return renderDetail(o);
      }
      return renderList();
    }

    function canViewOrder(o) {
      if (state.role === 'admin') return true;
      if (state.role === 'monitor') return o.holder === 'Leo';
      return o.student === state.parentChild && o.orderType !== 'small_group';
    }

    function canOperate(o) {
      if (!o || state.role === 'parent') return false;
      if (state.role === 'monitor') return o.holder === 'Leo';
      return true;
    }

    function renderTopbar() {
      const meta = roleMeta();
      if (state.page === 'detail') return topbarSub('购课单详情');
      if (state.page === 'placeholder') {
        const item = navItems().find((n) => n.id === state.navTab);
        return topbarBase(meta.brand, `${meta.label} · ${item ? item.label : '其他模块'}`, meta.initial, meta.dark);
      }
      return topbarBase(meta.brand, meta.label, meta.initial, meta.dark);
    }

    function topbarBase(title, subtitle, initial, dark) {
      return `
        <div class="border-b border-slate-200 bg-white/95">
          <div class="flex h-14 items-center justify-between px-4">
            <div class="flex min-w-0 items-center gap-2.5">
              <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-indigo-600 text-[14px] font-bold text-white shadow-sm">D</div>
              <div class="min-w-0">
                <div class="truncate text-[16px] font-bold leading-tight text-slate-900">${esc(title)}</div>
                <div class="truncate text-[12px] font-medium text-slate-400">${esc(subtitle)}</div>
              </div>
            </div>
            <div class="flex shrink-0 items-center gap-2">
              <button data-action="toast" data-message="暂无新消息" class="relative grid h-9 w-9 place-items-center rounded-xl bg-slate-100 text-slate-600" aria-label="通知">
                ${icon('bell', 'h-[18px] w-[18px]')}
                <span class="absolute right-2 top-2 h-1.5 w-1.5 rounded-full bg-rose-500 ring-2 ring-white"></span>
              </button>
              <div class="grid h-9 w-9 place-items-center rounded-full ${dark ? 'bg-slate-900 text-amber-300' : 'bg-indigo-600 text-white'} text-[14px] font-bold">${esc(initial)}</div>
            </div>
          </div>
        </div>`;
    }

    function topbarSub(title) {
      return `
        <div class="border-b border-slate-200 bg-white/95">
          <div class="grid h-14 grid-cols-[44px_1fr_44px] items-center px-2">
            <button data-action="go-back" class="grid h-10 w-10 place-items-center rounded-xl text-slate-600 hover:bg-slate-100" aria-label="返回">${icon('chevron-left', 'h-5 w-5')}</button>
            <div class="truncate text-center text-[16px] font-bold text-slate-900">${esc(title)}</div>
            <button data-action="toast" data-message="暂无新消息" class="relative grid h-10 w-10 place-items-center rounded-xl text-slate-600 hover:bg-slate-100" aria-label="通知">${icon('bell', 'h-[18px] w-[18px]')}<span class="absolute right-2.5 top-2.5 h-1.5 w-1.5 rounded-full bg-rose-500 ring-2 ring-white"></span></button>
          </div>
        </div>`;
    }

    function renderNav() {
      return `
        <div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
          <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
            ${navItems().map((item) => {
              const on = state.navTab === item.id;
              return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'text-indigo-600' : 'text-slate-400'}">${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}<span class="text-[12px] font-bold">${item.label}</span></button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function renderPlaceholder() {
      const item = navItems().find((n) => n.id === state.navTab);
      if (!item) return '<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>';
      return `
        <div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
          <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
          <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
          <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
          ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">打开对应原型</a>` : ''}
          <button data-action="nav" data-tab="${boardTab()}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回购课单</button>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 购课单列表
     * ------------------------------------------------------------------ */
    function renderList() {
      const scoped = scopedOrders();
      const pending = scoped.filter((o) => o.status === 'PENDING_PAYMENT').length;
      const paid = scoped.filter((o) => o.status === 'PAID').length;
      const cancelled = scoped.filter((o) => o.status === 'CANCELLED').length;
      const list = filteredOrders();
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-3' : 'space-y-3';
      const isParent = state.role === 'parent';
      const canCreate = state.role !== 'parent' && state.online === 'on';
      const meta = roleMeta();
      return `
        <div class="mx-auto w-full max-w-[720px] space-y-4 px-4 pb-6 pt-4">
          <div class="flex items-end justify-between gap-3 px-1">
            <div class="min-w-0">
              <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${isParent ? '我的购课单' : state.role === 'admin' ? '购课单管理' : '购课单'}</h1>
              <p class="mt-1 text-[14px] font-medium text-slate-500">${isParent ? `只读 · 当前 ${state.parentChild}` : state.role === 'admin' ? '全平台收款单据 · 凭证审计' : `资金持有人 Leo · 待确认收款 ${pending} 单`}</p>
            </div>
            ${isParent ? '' : `<button data-action="open-create" ${canCreate ? '' : 'disabled'} class="h-9 shrink-0 rounded-xl bg-indigo-600 px-3.5 text-[14px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">+ 录入购课单</button>`}
          </div>

          ${isParent ? childSelector() : ''}

          <div class="grid grid-cols-3 gap-2">
            <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 shadow-sm"><div class="text-[12px] font-medium text-slate-400">待确认收款</div><div class="mt-0.5 text-[18px] font-bold ${pending ? 'text-amber-700' : 'text-slate-900'}">${pending}</div></div>
            <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 shadow-sm"><div class="text-[12px] font-medium text-slate-400">已购课</div><div class="mt-0.5 text-[18px] font-bold text-slate-900">${paid}</div></div>
            <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 shadow-sm"><div class="text-[12px] font-medium text-slate-400">已作废</div><div class="mt-0.5 text-[18px] font-bold text-slate-900">${cancelled}</div></div>
          </div>

          <div class="flex rounded-xl bg-slate-100 p-1">
            ${[['all', '全部'], ['PENDING_PAYMENT', '待确认'], ['PAID', '已购课'], ['CANCELLED', '已作废']].map(([v, label]) => `<button data-action="set-status" data-value="${v}" class="h-9 flex-1 rounded-lg text-[12px] font-bold transition ${state.statusFilter === v ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">${label}</button>`).join('')}
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <div class="inline-flex rounded-xl bg-slate-100 p-1">
              ${[['all', '全部来源'], ['MANUAL', '人工录入'], ['AUTO_RENEWAL', '自动续费']].map(([v, label]) => `<button data-action="set-source" data-value="${v}" class="h-8 rounded-lg px-2.5 text-[12px] font-bold transition ${state.sourceFilter === v ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">${label}</button>`).join('')}
            </div>
            <div class="relative min-w-[180px] flex-1">
              <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">${icon('search', 'h-4 w-4')}</span>
              <input id="orderSearch" value="${esc(state.query)}" placeholder="搜索学生昵称 / 单号" class="h-10 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
            </div>
          </div>

          <div id="orderList" class="${grid}">
            ${list.length ? list.map((o) => renderOrderCard(o)).join('') : `
              <div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-12 text-center sm:col-span-2">
                <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-slate-50 text-slate-300">${icon('receipt', 'h-5 w-5')}</div>
                <p class="mt-3 text-[14px] font-medium text-slate-400">暂无符合条件的购课单</p>
              </div>`}
          </div>

          <div class="rounded-xl border border-indigo-100 bg-indigo-50/60 px-3.5 py-3 text-[12px] font-medium leading-relaxed text-indigo-900">
            ${isParent ? '仅展示当前宝贝名下、非小班整班的购课单，只读；如需调整请联系负责班长。' : state.role === 'admin' ? '管理员可查看全平台单据、录入或作废任一班长名下待付款单据。' : '班长仅可查看与操作本人持有的购课单，越权请求返回无权限。'}
          </div>
        </div>`;
    }

    function childSelector() {
      return `
        <div class="rounded-2xl border border-slate-200 bg-white p-3.5 shadow-sm">
          <div class="text-[12px] font-medium text-slate-400">当前宝贝档案</div>
          <div class="mt-2 flex gap-2">
            ${PARENT_CHILDREN.map((ch) => {
              const on = ch.name === state.parentChild;
              return `<button data-action="select-child" data-child="${ch.name}" class="flex h-10 flex-1 items-center justify-center gap-1.5 rounded-xl text-[14px] font-semibold ${on ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}"><span class="grid h-6 w-6 place-items-center rounded-full ${on ? 'bg-white/15 text-white' : 'bg-white text-indigo-700'} text-[12px] font-bold">${esc(ch.name.charAt(0))}</span>${esc(ch.name)}</button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function renderOrderCard(o) {
      const sm = statusMeta(o.status);
      const src = sourceMeta(o.source);
      const isAuto = o.source === 'AUTO_RENEWAL';
      const isPending = o.status === 'PENDING_PAYMENT';
      const isPaid = o.status === 'PAID';
      const isParent = state.role === 'parent';
      const isMonitorAdmin = state.role !== 'parent';
      const autoWarn = isAuto && isPending && Number(o.expireHours || 99) <= 48;
      const studentLabel = o.orderType === 'small_group' ? `${o.className} · 整班` : o.isTrial ? `${o.student} · 试课待认领` : o.student;
      const teacherLabel = o.orderType === 'small_group' ? `班级 ${o.className} · ${o.teacherName}` : `${o.teacherName} · ${o.courseType}`;

      const actionButtons = isParent
        ? `<button data-action="open-order" data-id="${o.id}" class="h-8 rounded-lg border border-slate-200 px-2.5 text-[12px] font-semibold text-slate-700">查看明细</button>
           ${(isPending || isPaid) && (o.voucherCount || 0) < 5 ? `<button data-action="open-voucher" data-id="${o.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 rounded-lg bg-indigo-50 px-2.5 text-[12px] font-semibold text-indigo-700 disabled:cursor-not-allowed disabled:opacity-50">上传凭证</button>` : ''}
           ${isAuto ? `<button data-action="open-contact" data-id="${o.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 rounded-lg border border-slate-200 px-2.5 text-[12px] font-medium text-slate-600 disabled:cursor-not-allowed disabled:opacity-50">协调换师</button>` : ''}`
        : isPending
          ? `${isAuto ? `<button data-action="open-edit" data-id="${o.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 rounded-lg bg-indigo-50 px-2.5 text-[12px] font-semibold text-indigo-700 disabled:cursor-not-allowed disabled:opacity-50">修改</button>` : ''}
             <button data-action="open-cancel" data-id="${o.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 rounded-lg border border-rose-200 bg-white px-2.5 text-[12px] font-medium text-rose-600 disabled:cursor-not-allowed disabled:opacity-50">作废</button>
             <button data-action="open-confirm" data-id="${o.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 rounded-lg bg-emerald-600 px-2.5 text-[12px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认收款</button>`
          : isPaid
            ? `<button data-action="open-fission" data-id="${o.id}" class="h-8 rounded-lg bg-indigo-50 px-2.5 text-[12px] font-semibold text-indigo-700">裂变明细</button>`
            : `<span class="text-[12px] font-medium text-slate-400">已归档</span>`;

      return `
        <article data-action="open-order" data-id="${o.id}" role="button" tabindex="0" class="cursor-pointer rounded-2xl border ${isAuto && isPending ? 'border-amber-300 ring-1 ring-amber-100' : 'border-slate-200'} bg-white p-4 shadow-sm transition hover:border-indigo-200">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="truncate text-[16px] font-bold text-slate-900">${esc(studentLabel)}</span>
                <span class="rounded-md border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-semibold text-slate-600">${esc(typeLabel(o.orderType))}</span>
                <span class="rounded-md border px-1.5 py-0.5 text-[12px] font-semibold ${src.cls}">${esc(src.label)}</span>
              </div>
              <div class="mt-1 truncate text-[14px] font-medium text-slate-500">${esc(teacherLabel)}</div>
            </div>
            <span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${sm.cls}">${esc(sm.label)}</span>
          </div>

          <div class="mt-3 grid grid-cols-3 divide-x divide-slate-100 rounded-xl bg-slate-50 py-2.5 text-center">
            <div><div class="text-[16px] font-bold text-slate-900">${o.lessonCount} 节</div><div class="mt-0.5 text-[12px] font-medium text-slate-400">课时</div></div>
            <div><div class="text-[16px] font-bold ${incomeTone(o.status)}">${o.paidPoints} 积分</div><div class="mt-0.5 text-[12px] font-medium text-slate-400">实收</div></div>
            <div><div class="text-[16px] font-bold text-slate-900">${o.leaveQuota} 节</div><div class="mt-0.5 text-[12px] font-medium text-slate-400">请假额度</div></div>
          </div>

          <div class="mt-2 text-[12px] font-medium ${o.hasVoucher ? 'text-emerald-600' : 'text-amber-700'}">凭证：${o.hasVoucher ? `已上传 ${o.voucherCount || 1} 张` : '未上传'}</div>

          ${isAuto ? `
            <div class="mt-2 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-amber-900">
              <div class="flex items-center justify-between gap-2"><span class="font-bold">自动续费 · 涨价透明</span><span class="shrink-0 font-mono">${o.expireHours ? `${o.expireHours}h` : ''}</span></div>
              <p class="mt-0.5 line-clamp-2">${esc(o.priceChangeReason || '')}</p>
              ${autoWarn ? `<p class="mt-1 font-bold text-rose-600">距自动作废仅剩 ${o.expireHours} 小时</p>` : ''}
            </div>` : ''}

          ${o.isForced ? `<div class="mt-2 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-medium text-amber-900"><span class="font-bold">强制提交留痕：</span>${esc(o.forceReason)}</div>` : ''}

          <div class="mt-3 flex items-center justify-between gap-2 border-t border-slate-100 pt-3">
            <div class="min-w-0">
              <div class="truncate text-[12px] font-medium text-slate-400">${isParent ? `经办班长 ${esc(holderLabel(o.holder))}` : `资金持有 ${esc(holderLabel(o.holder))}`}</div>
              <div class="truncate text-[12px] font-medium text-slate-400">${esc(o.createdAt)}</div>
            </div>
            <div class="flex shrink-0 items-center gap-1.5">${actionButtons}</div>
          </div>
        </article>`;

    /* ------------------------------------------------------------------
     * 购课单详情
     * ------------------------------------------------------------------ */
    function renderDetail(o) {
      const sm = statusMeta(o.status);
      const src = sourceMeta(o.source);
      const isParent = state.role === 'parent';
      const isPending = o.status === 'PENDING_PAYMENT';
      const isPaid = o.status === 'PAID';
      const isAuto = o.source === 'AUTO_RENEWAL';
      const diff = o.paidPoints - o.expectedPoints;
      const ts = generateTSFission(o);
      const base = Math.floor(o.paidPoints / Math.max(1, o.lessonCount));
      const remainder = o.paidPoints % Math.max(1, o.lessonCount);
      const studentLabel = o.orderType === 'small_group' ? `${o.className} · 整班` : o.isTrial ? `${o.student} · 试课待认领` : o.student;
      const teacherLabel = o.orderType === 'small_group' ? `${o.className} · ${o.teacherName}` : `${o.teacherName} · ${o.courseType}`;

      return `
        <div class="mx-auto w-full max-w-[640px] space-y-4 px-4 pb-6 pt-4">
          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(studentLabel)}</h1>
                <div class="mt-1 text-[14px] font-medium text-slate-500">${esc(teacherLabel)}</div>
                <div class="mt-1 flex flex-wrap items-center gap-1.5">
                  <span class="rounded-md border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-semibold text-slate-600">${esc(typeLabel(o.orderType))}</span>
                  <span class="rounded-md border px-1.5 py-0.5 text-[12px] font-semibold ${src.cls}">${esc(src.label)}</span>
                  ${o.isTrial ? '<span class="rounded-md border border-amber-200 bg-amber-50 px-1.5 py-0.5 text-[12px] font-semibold text-amber-800">UNBOUND · 平台托管</span>' : ''}
                </div>
              </div>
              <span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${sm.cls}">${esc(sm.label)}</span>
            </div>

            <div class="mt-3 grid grid-cols-2 gap-2">
              <div class="rounded-xl bg-slate-50 px-3 py-2.5"><div class="text-[12px] font-medium text-slate-400">单据编号</div><div class="mt-0.5 truncate font-mono text-[12px] font-semibold text-slate-800">${esc(o.id)}</div></div>
              <div class="rounded-xl bg-slate-50 px-3 py-2.5"><div class="text-[12px] font-medium text-slate-400">${isParent ? '经办班长' : '资金持有方'}</div><div class="mt-0.5 text-[14px] font-semibold text-slate-900">${esc(holderLabel(o.holder))}</div></div>
              <div class="rounded-xl bg-slate-50 px-3 py-2.5"><div class="text-[12px] font-medium text-slate-400">创建时间</div><div class="mt-0.5 text-[14px] font-semibold text-slate-900">${esc(o.createdAt)}</div></div>
              <div class="rounded-xl bg-slate-50 px-3 py-2.5"><div class="text-[12px] font-medium text-slate-400">请假额度</div><div class="mt-0.5 text-[14px] font-semibold text-slate-900">${o.leaveQuota} 节</div></div>
            </div>
          </section>

          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <h2 class="text-[16px] font-bold text-slate-900">金额与课次</h2>
            <div class="mt-3 grid grid-cols-3 divide-x divide-slate-100 rounded-xl bg-slate-50 py-2.5 text-center">
              <div><div class="text-[18px] font-bold text-slate-900">${o.lessonCount}</div><div class="mt-0.5 text-[12px] font-medium text-slate-400">课时</div></div>
              <div><div class="text-[18px] font-bold ${incomeTone(o.status)}">${o.paidPoints}</div><div class="mt-0.5 text-[12px] font-medium text-slate-400">实收积分</div></div>
              <div><div class="text-[18px] font-bold text-slate-900">${o.expectedPoints}</div><div class="mt-0.5 text-[12px] font-medium text-slate-400">期望积分</div></div>
            </div>
            ${diff !== 0 ? `<div class="mt-2 rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-2.5 text-[14px] font-medium text-amber-900">实收与期望相差 ${diff > 0 ? '+' : ''}${diff} 积分${o.isForced ? ` · 强制提交原因：${esc(o.forceReason)}` : ''}</div>` : ''}
            ${o.isForced && diff === 0 ? `<div class="mt-2 rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-2.5 text-[14px] font-medium text-amber-900">强制提交原因：${esc(o.forceReason)}</div>` : ''}
          </section>

          ${isAuto ? `
            <section class="rounded-2xl border border-amber-200 bg-amber-50 p-4">
              <div class="flex items-center justify-between gap-2"><h2 class="text-[16px] font-bold text-amber-950">自动续费与调价</h2><span class="text-[12px] font-mono font-semibold text-amber-800">${o.expireHours ? `${o.expireHours}h` : ''}</span></div>
              <p class="mt-2 text-[14px] font-medium leading-relaxed text-amber-900">${esc(o.priceChangeReason || '')}</p>

              <span class="text-[12px] font-medium ${o.hasVoucher ? 'text-emerald-600' : 'text-amber-700'}">${o.hasVoucher ? `已上传 ${o.voucherCount || 1} 张` : '未上传'}</span>

    /* ------------------------------------------------------------------
     * 创建购课单
     * ------------------------------------------------------------------ */
    function createUnitExpected() {
      const f = state.create;
      if (f.orderType === 'small_group') {
        const cls = classById(f.classId);
        return cls.teacherRate + cls.max * 6;
      }
      const t = teacherById(f.teacherId);
      return t.rate + 2 + (f.extraPrep ? 10 : 0);
    }

    function createExpected() { return Math.max(0, Number(state.create.lessons) || 0) * createUnitExpected(); }
    function createLeave() { return Math.floor(Math.max(0, Number(state.create.lessons) || 0) * 0.125); }

    function renderCreateSheet() {

      const isAdmin = state.role === 'admin';
      const trial = f.student === 'LeoW8';
      const small = f.orderType === 'small_group';

      const expected = createExpected();
      const leave = createLeave();
      const diff = Number(f.paid || 0) - expected;
      const mismatch = Number(f.paid || 0) !== expected;
      return `

            </div>
            <div class="flex-1 overflow-y-auto py-3">
              <div class="space-y-4">

                    ${[['1v1_fixed', '1v1 固定位'], ['1v1_temp', '1v1 临时课'], ['small_group', '小班整班课']].map(([v, label]) => `<button data-action="create-type" data-value="${v}" ${trial && v !== '1v1_temp' ? 'disabled' : ''} class="h-9 rounded-lg text-[14px] font-semibold ${f.orderType === v ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'} ${trial && v !== '1v1_temp' ? 'cursor-not-allowed opacity-40' : ''}">${label}</button>`).join('')}
                  </div>
                </div>

                ${small ? `
                  <div>
                    <label for="createClass" class="mb-1.5 block text-[16px] font-semibold text-slate-800">关联班级 <span class="text-rose-500">*</span></label>
                    <select id="createClass" class="${inputCls} bg-white font-medium">${CLASSES.map((c) => `<option value="${c.id}" ${f.classId === c.id ? 'selected' : ''}>${esc(c.name)} · ${esc(c.teacherName)} · Max ${c.max}</option>`).join('')}</select>
                  </div>` : `
                  <div>
                    <label for="createStudent" class="mb-1.5 block text-[16px] font-semibold text-slate-800">上课学员档案 <span class="text-rose-500">*</span></label>

                    </select>
                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label for="createTeacher" class="mb-1.5 block text-[16px] font-semibold text-slate-800">授课外教 <span class="text-rose-500">*</span></label>
                      <select id="createTeacher" class="${inputCls} bg-white font-medium">${TEACHERS.map((t) => `<option value="${t.id}" ${f.teacherId === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
                    </div>
                    <div>
                      <label for="createCourse" class="mb-1.5 block text-[16px] font-semibold text-slate-800">课程类型 <span class="text-rose-500">*</span></label>
                      <select id="createCourse" class="${inputCls} bg-white font-medium">${COURSE_TYPES.map((t) => `<option value="${esc(t)}" ${f.courseType === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
                    </div>
                  </div>`}

                <div>
                  <span class="mb-1.5 block text-[16px] font-semibold text-slate-800">资金持有方 <span class="text-rose-500">*</span></span>
                  ${isAdmin && !trial ? `
                    <select id="createHolder" class="${inputCls} bg-white font-medium"><option value="Leo" ${f.holder === 'Leo' ? 'selected' : ''}>Leo（班长）</option><option value="Amy" ${f.holder === 'Amy' ? 'selected' : ''}>Amy（班长）</option></select>` : `
                    <div class="flex h-12 items-center justify-between rounded-xl border border-slate-200 bg-slate-100 px-3.5 text-[14px] font-medium text-slate-600"><span>${trial ? '平台（管理员）' : 'Leo（当前班长）'}</span>${icon('lock', 'h-3.5 w-3.5 text-slate-400')}</div>`}
                </div>

                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label for="createLessons" class="mb-1.5 block text-[16px] font-semibold text-slate-800">课时数 <span class="text-rose-500">*</span></label>
                    <input id="createLessons" type="number" min="1" value="${esc(f.lessons)}" class="${inputCls} font-bold">
                    <p id="createLessonTip" class="mt-1 hidden text-[12px] font-medium text-amber-700">建议为 4 的倍数（四周一轮）</p>
                  </div>
                  <div class="flex flex-col justify-end">
                    <label class="flex h-12 items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 cursor-pointer">
                      <input id="createExtra" type="checkbox" ${f.extraPrep ? 'checked' : ''} ${small ? 'disabled' : ''} class="h-4 w-4 rounded accent-indigo-600 disabled:opacity-40">
                      <span class="text-[14px] font-medium ${small ? 'text-slate-400' : 'text-slate-700'}">含额外备课费 (+10)</span>
                    </label>
                  </div>
                </div>

                <div class="rounded-xl border border-indigo-100 bg-indigo-50/70 p-3.5">
                  <div class="flex items-center justify-between"><span class="flex items-center gap-1 text-[12px] font-semibold text-indigo-900">${icon('calculator', 'h-3.5 w-3.5 text-indigo-600')}系统防呆自动测算</span><span class="text-[12px] font-mono text-indigo-600">实时刷新</span></div>
                  <div class="mt-2 grid grid-cols-2 gap-2">
                    <div class="rounded-lg border border-indigo-100 bg-white p-2.5"><div class="text-[12px] text-slate-400">系统期望总积分</div><div id="createExpected" class="mt-0.5 text-[18px] font-bold text-indigo-700">${expected}</div><div id="createFormula" class="mt-0.5 text-[12px] text-slate-400">${Math.max(0, Number(f.lessons) || 0)} × ${createUnitExpected()}</div></div>
                    <div class="rounded-lg border border-indigo-100 bg-white p-2.5"><div class="text-[12px] text-slate-400">赠予请假配额</div><div id="createLeave" class="mt-0.5 text-[18px] font-bold text-emerald-600">${leave} 节</div><div class="mt-0.5 text-[12px] text-slate-400">⌊课时 × 12.5%⌋</div></div>
                  </div>
                </div>

                <div>
                  <div class="mb-1.5 flex items-center justify-between"><label for="createPaid" class="text-[16px] font-semibold text-slate-800">线下实收积分 <span class="text-rose-500">*</span></label><span id="createDiff" class="text-[12px] font-semibold ${mismatch ? 'text-amber-600' : 'text-emerald-600'}">${mismatch ? `差额 ${diff > 0 ? '+' : ''}${diff}` : '与期望相符'}</span></div>
                  <input id="createPaid" type="number" min="1" value="${esc(f.paid)}" class="${inputCls} font-bold">
                </div>

                <div id="createForceBox" class="${mismatch ? '' : 'hidden'} rounded-xl border border-amber-200 bg-amber-50 p-3">
                  <div class="text-[14px] font-semibold text-amber-900">金额不符：需强制提交并留痕</div>
                  <input id="createForceReason" value="${esc(f.forceReason)}" maxlength="200" placeholder="强制录单原因（1-200 字）" class="mt-2 h-10 w-full rounded-lg border border-amber-300 bg-white px-3 text-[14px] text-slate-900 outline-none">
                </div>

                <div class="rounded-xl border border-slate-200 bg-slate-50 p-3">
                  <div class="flex items-center justify-between"><span class="text-[14px] font-semibold text-slate-800">支付凭证</span><span class="text-[12px] font-medium text-slate-400">${f.vouchers.length}/5</span></div>
                  <label class="mt-2 flex h-11 cursor-pointer items-center justify-center gap-2 rounded-xl border border-dashed border-slate-300 bg-white text-[14px] font-semibold text-slate-600">${icon('upload', 'h-4 w-4 text-slate-400')}选择 JPG/PNG/PDF（≤10MB）<input id="createVoucherInput" type="file" accept="image/jpeg,image/png,application/pdf" multiple class="hidden"></label>

            </div>
          </div>
        </div>`;

    function updateCreateCalc() {
      const expectedEl = document.getElementById('createExpected');
      if (!expectedEl) return;
      const f = state.create;
      const expected = createExpected();
      const leave = createLeave();
      const paid = Number(f.paid || 0);
      if (f.autoPaid) {
        f.paid = String(expected);
        const paidEl = document.getElementById('createPaid');
        if (paidEl) paidEl.value = f.paid;
      }
      expectedEl.textContent = expected;
      document.getElementById('createFormula').textContent = `${Math.max(0, Number(f.lessons) || 0)} × ${createUnitExpected()}`;
      document.getElementById('createLeave').textContent = `${leave} 节`;
      const mismatch = Number(f.paid || 0) !== expected;
      const diff = Number(f.paid || 0) - expected;
      const diffEl = document.getElementById('createDiff');
      diffEl.textContent = mismatch ? `差额 ${diff > 0 ? '+' : ''}${diff}` : '与期望相符';
      diffEl.className = `text-[12px] font-semibold ${mismatch ? 'text-amber-600' : 'text-emerald-600'}`;
      document.getElementById('createForceBox').classList.toggle('hidden', !mismatch);
      const tip = document.getElementById('createLessonTip');
      if (tip) tip.classList.toggle('hidden', f.orderType !== '1v1_fixed' || (Number(f.lessons) % 4 === 0) || !Number(f.lessons));
    }

    /* ------------------------------------------------------------------
     * 自动续费修改抽屉
     * ------------------------------------------------------------------ */
    function renderEditSheet() {
      const o = orderById(state.edit.orderId);

      const editUnit = teacherById(o.teacherId).rate + 2;
      const expected = (Number(e.lessons) || 0) * editUnit;
      const leave = Math.floor((Number(e.lessons) || 0) * 0.125);
      const paid = Number(e.paid || 0);
      const mismatch = paid !== expected;
      const inputCls = 'h-12 w-full rounded-xl border border-slate-200 bg-white px-3.5 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100';
      return `
        <div class="absolute inset-0 z-50">
          <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>

            <div class="flex-1 overflow-y-auto py-3">
              <div class="space-y-4">
                <div class="rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-2.5 text-[14px] font-medium leading-relaxed text-amber-900">${esc(o.priceChangeReason || '')}</div>

                  <div><label for="editLessons" class="mb-1.5 block text-[16px] font-semibold text-slate-800">调整课次</label><input id="editLessons" type="number" min="1" value="${esc(e.lessons)}" class="${inputCls} font-bold"></div>
                  <div><label for="editPaid" class="mb-1.5 block text-[16px] font-semibold text-slate-800">实收积分</label><input id="editPaid" type="number" min="1" value="${esc(e.paid)}" class="${inputCls} font-bold"></div>

                <div><span class="mb-1.5 block text-[16px] font-semibold text-slate-800">预排固定时段</span><div class="rounded-xl border border-slate-200 bg-slate-50 p-3 space-y-1.5"><label class="flex items-center gap-2 text-[14px] font-medium text-slate-700"><input id="editSlotTue" type="checkbox" ${e.slotsTue ? 'checked' : ''} class="h-4 w-4 accent-indigo-600">每周二 19:00 - 19:30</label><label class="flex items-center gap-2 text-[14px] font-medium text-slate-700"><input id="editSlotThu" type="checkbox" ${e.slotsThu ? 'checked' : ''} class="h-4 w-4 accent-indigo-600">每周四 19:00 - 19:30</label></div></div>
                <div class="rounded-xl border border-indigo-100 bg-indigo-50/70 p-3.5 text-[12px] font-medium text-indigo-900"><div class="flex justify-between"><span>测算基准：${o.teacherLevel} ${teacherById(o.teacherId).rate} + 工具费 2 = ${editUnit} 分/节</span><span id="editExpected" class="font-bold text-[16px] text-indigo-700">${expected} 积分</span></div><div class="mt-1">请假额度同步更新为 <span id="editLeave" class="font-bold text-emerald-600">${leave} 节</span></div></div>
                <div id="editForceBox" class="${mismatch ? '' : 'hidden'} rounded-xl border border-amber-200 bg-amber-50 p-3"><div class="text-[14px] font-semibold text-amber-900">金额不符：需填写修改理由留痕</div><input id="editForceReason" value="${esc(e.forceReason)}" maxlength="200" placeholder="如：老学员沟通换师补偿直减 10 积分" class="mt-2 h-10 w-full rounded-lg border border-amber-300 bg-white px-3 text-[14px] text-slate-900 outline-none"></div>
                ${e.error ? `<div id="editError" class="rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-2.5 text-[14px] font-medium text-rose-700">${esc(e.error)}</div>` : ''}
              </div>
            </div>
            <div class="flex shrink-0 gap-2 border-t border-slate-100 pt-3"><button data-action="close-overlay" class="h-12 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">取消</button><button data-action="save-edit" ${state.online === 'off' ? 'disabled' : ''} class="h-12 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">保存并更正账单</button></div>
          </div>
        </div>`;
    }

    function updateEditCalc() {
      const el = document.getElementById('editExpected');
      if (!el) return;
      const e = state.edit;
      const o = orderById(e.orderId);
      const editUnit = o ? teacherById(o.teacherId).rate + 2 : 42;
      const expected = (Number(e.lessons) || 0) * editUnit;
      const leave = Math.floor((Number(e.lessons) || 0) * 0.125);
      el.textContent = `${expected} 积分`;
      document.getElementById('editLeave').textContent = `${leave} 节`;
      document.getElementById('editForceBox').classList.toggle('hidden', Number(e.paid || 0) === expected);
    }

    /* ------------------------------------------------------------------
     * 确认 / 作废 / 裂变 / 联系 / 凭证弹层
     * ------------------------------------------------------------------ */
    function modalShell(content) {
      return `<div class="absolute inset-0 z-50"><div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div><div class="absolute inset-x-4 top-1/2 mx-auto max-h-[85%] max-w-[560px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl">${content}</div></div>`;
    }
    function modalHeader(title, subtitle = '') {
      return `<div class="flex items-start justify-between gap-3"><div class="min-w-0"><h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>${subtitle ? `<p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}</div><button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button></div>`;
    }

    function renderConfirmModal() {
      const o = orderById(state.overlay.orderId);
      if (!o) return '';
      return modalShell(`${modalHeader('确认收款并裂变？', `${esc(o.student)} · ${o.lessonCount} 个 TS`) }
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-3 text-[14px] font-medium text-slate-700">确认收到实收 <b class="text-emerald-700">${o.paidPoints} 积分</b> 后，将在同一事务内原子裂变生成 ${o.lessonCount} 个待排期 TS，资金持有方永久锁定为 <b>${esc(holderLabel(o.holder))}</b>。</div>
        <div class="mt-2 rounded-xl border border-indigo-100 bg-indigo-50/70 px-3.5 py-2.5 text-[12px] font-medium text-indigo-900">余数分配：基础值 ⌊${o.paidPoints} ÷ ${o.lessonCount}⌋，除不尽余数全部加到最后一节。</div>
        <div class="mt-4 flex gap-2"><button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">暂不确认</button><button data-action="confirm-pay" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-1 rounded-xl bg-emerald-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认收款裂变</button></div>`);
    }

    function renderCancelModal() {
      const o = orderById(state.overlay.orderId);
      if (!o) return '';
      return modalShell(`${modalHeader('作废待收款购课单', `${esc(o.student)} · ${esc(typeLabel(o.orderType))}`) }
        <p class="mt-3 text-[14px] font-medium leading-relaxed text-slate-600">作废后单据状态变为已作废（CANCELLED），不产生任何 TS 课次。</p>
        ${o.source === 'AUTO_RENEWAL' ? '<p class="mt-2 rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-2.5 text-[12px] font-medium text-amber-900">系统将同步释放 M3A 日历中的续费预占（HOLD）时段为空闲可约。</p>' : ''}
        <div class="mt-4 flex gap-2"><button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">取消</button><button data-action="confirm-cancel" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-1 rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认作废</button></div>`);
    }

    function renderFissionSheet() {
      const o = orderById(state.overlay.orderId);
      if (!o) return '';
      const list = generateTSFission(o);
      return `
        <div class="absolute inset-0 z-50">
          <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
          <div class="absolute inset-x-0 bottom-0 mx-auto flex max-h-[85%] w-full max-w-[560px] flex-col rounded-t-3xl bg-white p-5 shadow-2xl">
            <div class="mx-auto mb-3 h-1 w-10 shrink-0 rounded-full bg-slate-200"></div>
            <div class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-100 pb-2.5"><div><h2 class="text-[18px] font-bold text-slate-900">TS 裂变明细</h2><p class="mt-1 text-[12px] font-medium text-slate-500">${esc(o.student)} · ${o.lessonCount} 节 · 余数归入末节</p></div><button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button></div>
            <div class="flex-1 overflow-y-auto py-3 space-y-2">${list.map((ts) => `<div class="flex items-center justify-between rounded-xl border ${ts.last ? 'border-indigo-300 bg-indigo-50/70' : 'border-slate-200 bg-slate-50/60'} px-3 py-2.5"><div class="min-w-0"><div class="truncate font-mono text-[12px] font-semibold text-slate-700">${esc(ts.tsId)}</div><div class="text-[12px] font-medium text-slate-400">持有方 ${esc(holderLabel(ts.holder))} · 待排期</div></div><div class="text-right"><div class="font-mono text-[14px] font-bold text-indigo-700">${ts.points} 积分</div>${ts.last ? '<div class="text-[12px] font-medium text-indigo-600">★ 含取整余数</div>' : ''}</div></div>`).join('')}</div>
            <div class="rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-[12px] font-medium text-slate-600">快照合计 <b class="text-slate-900">${list.reduce((s, x) => s + x.points, 0)} 积分</b> = 单据实收 ${o.paidPoints} 积分</div>
            <button data-action="close-overlay" class="mt-3 h-11 w-full rounded-xl bg-slate-900 text-[16px] font-semibold text-white">关闭</button>
          </div>
        </div>`;
    }

    function renderContactModal() {
      const c = state.contact;
      return modalShell(`${modalHeader('联系班长协调排课', '负责班长 Leo · 2 小时内响应') }
        <div class="mt-3 space-y-1.5">
          ${[['teacher_price', '外教晋升涨价超预算，申请更换 Standard 级老师'], ['time_conflict', '下轮固定时间冲突，申请调整预排时段'], ['pause_renewal', '近期学业忙碌，申请下轮暂缓续费（放弃固定位）']].map(([v, label]) => `<label class="flex items-center gap-2 rounded-xl border ${c.type === v ? 'border-indigo-200 bg-indigo-50/50' : 'border-slate-200 bg-white'} p-2.5 text-[14px] font-medium text-slate-800"><input type="radio" name="coordType" value="${v}" ${c.type === v ? 'checked' : ''} class="h-4 w-4 accent-indigo-600">${label}</label>`).join('')}
        </div>
        <div class="mt-3"><label for="contactMemo" class="mb-1.5 block text-[16px] font-semibold text-slate-800">补充说明（可选）</label><textarea id="contactMemo" rows="2" class="w-full resize-none rounded-xl border border-slate-200 p-3 text-[16px] text-slate-900 outline-none">${esc(c.memo)}</textarea></div>
        <div class="mt-4 flex gap-2"><button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">取消</button><button data-action="submit-contact" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">提交协调申请</button></div>`);
    }

    function renderVoucherModal() {
      const v = state.voucher;
      return modalShell(`${modalHeader('上传支付凭证', `单号：${v.orderId || ''}`) }
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 p-3 text-center">
          <label class="block cursor-pointer">
            <input id="voucherFile" type="file" accept="image/jpeg,image/png,application/pdf" class="hidden">
            <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl border border-indigo-200 bg-indigo-50 text-indigo-600">${icon('camera', 'h-6 w-6')}</div>
            <div class="mt-2 text-[14px] font-semibold text-slate-800">${v.file ? esc(v.file.name) : '点击选择凭证文件'}</div>
            <p class="mt-0.5 text-[12px] font-medium text-slate-400">JPG / PNG / PDF · 单文件 ≤10MB · 每单最多 5 份</p>
          </label>
          <button data-action="sample-voucher" class="mt-2 text-[12px] font-semibold text-indigo-600">使用示例凭证（原型）</button>
        </div>
        <div class="mt-3"><label for="voucherAmount" class="mb-1.5 block text-[16px] font-semibold text-slate-800">付款金额（积分）</label><input id="voucherAmount" type="number" value="${esc(v.amount)}" class="h-12 w-full rounded-xl border border-slate-200 px-3.5 text-[16px] text-slate-900 outline-none"></div>
        <div class="mt-3"><label for="voucherRemark" class="mb-1.5 block text-[16px] font-semibold text-slate-800">转账单号 / 备注</label><input id="voucherRemark" value="${esc(v.remark)}" class="h-12 w-full rounded-xl border border-slate-200 px-3.5 text-[16px] text-slate-900 outline-none"></div>
        ${v.error ? `<div class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-2.5 text-[14px] font-medium text-rose-700">${esc(v.error)}</div>` : ''}
        <div class="mt-4 flex gap-2"><button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">取消</button><button data-action="submit-voucher" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认上传凭证</button></div>`);
    }

    function renderOverlay() {
      const el = document.getElementById('overlay');
      if (!state.overlay) { el.innerHTML = ''; return; }
      if (state.overlay.type === 'create') el.innerHTML = renderCreateSheet();
      else if (state.overlay.type === 'edit') el.innerHTML = renderEditSheet();
      else if (state.overlay.type === 'confirm') el.innerHTML = renderConfirmModal();
      else if (state.overlay.type === 'cancel') el.innerHTML = renderCancelModal();
      else if (state.overlay.type === 'fission') el.innerHTML = renderFissionSheet();
      else if (state.overlay.type === 'contact') el.innerHTML = renderContactModal();
      else if (state.overlay.type === 'voucher') el.innerHTML = renderVoucherModal();
      else el.innerHTML = '';
    }

    /* ------------------------------------------------------------------
     * 业务动作
     * ------------------------------------------------------------------ */
    function openCreate() {
      if (state.online === 'off') return showToast('离线模式下不可录入购课单');
      if (state.role === 'parent') return;
      state.create = emptyCreate();
      if (state.role === 'admin') state.create.holder = 'Leo';
      else state.create.holder = 'Leo';
      state.overlay = { type: 'create' };
      renderAll();
      updateCreateCalc();
    }

    function submitCreate() {
      if (state.online === 'off') return showToast('离线模式下不可录入购课单');
      if (state.role === 'parent') return;
      const f = state.create;
      if (f.student === 'LeoW8' && f.orderType !== '1v1_temp') return failCreate('试课待认领档案仅支持 1v1 临时课');
      const lessons = Number(f.lessons);
      if (!Number.isInteger(lessons) || lessons <= 0) return failCreate('课时数必须为正整数');
      if (f.orderType === '1v1_temp' && lessons > 20) return failCreate('1v1 临时课课时数上限为 20 节');
      const paid = Number(f.paid);
      if (!Number.isInteger(paid) || paid <= 0) return failCreate('实收积分必须为正整数');
      const expected = createExpected();
      if (paid !== expected) {
        if (!f.forceReason.trim()) return failCreate('PRICE_CALCULATION_MISMATCH · 金额不符必须填写强制提交原因');
        if (f.forceReason.trim().length > 200) return failCreate('强制提交原因不能超过 200 字');
      }
      const trial = f.student === 'LeoW8';
      const small = f.orderType === 'small_group';
      const cls = small ? classById(f.classId) : null;
      const t = small ? teacherById(cls.teacherId) : teacherById(f.teacherId);
      const holder = trial ? '平台' : state.role === 'admin' ? f.holder : 'Leo';
      const order = {
        id: `ord_${Math.random().toString(36).slice(2, 10)}`,
        orderType: f.orderType, source: 'MANUAL',
        student: small ? cls.name : f.student, isTrial: trial,
        classId: small ? cls.id : undefined, className: small ? cls.name : undefined,
        teacherId: t.id, teacherName: t.name, teacherLevel: t.level, previousLevel: t.level,
        courseType: small ? cls.courseType : f.courseType,
        lessonCount: lessons, extraPrep: f.extraPrep && !small,
        expectedPoints: expected, paidPoints: paid,
        status: 'PENDING_PAYMENT', leaveQuota: Math.floor(lessons * 0.125),
        createdAt: '刚刚', holder, isForced: paid !== expected, forceReason: paid !== expected ? f.forceReason.trim() : '',
        hasVoucher: f.vouchers.length > 0, voucherCount: f.vouchers.length
      };
      state.orders.unshift(order);
      state.activeOrderId = order.id;
      state.page = 'detail';
      state.navTab = boardTab();
      state.overlay = null;
      renderAll();
      showToast('购课单已生成待确认收款 · 核实到账后请确认');
    }

    function failCreate(msg) {
      state.create.error = msg;
      renderOverlay();
      lucide.createIcons();
      showToast(msg);
    }

    function setCreateType(type) {
      if (state.create.student === 'LeoW8' && type !== '1v1_temp') {
        return showToast('试课待认领档案仅支持 1v1 临时课');
      }
      state.create.orderType = type;
      if (type === 'small_group') state.create.extraPrep = false;
      if (type !== '1v1_temp' && state.create.student === 'LeoW8') state.create.student = 'AliceZ12';
      renderOverlay();
      lucide.createIcons();
      updateCreateCalc();
    }

    function openOrder(id) {
      state.activeOrderId = id;
      state.page = 'detail';
      state.navTab = boardTab();
      state.overlay = null;
      renderAll();
    }

    function openConfirm(id) {
      if (state.online === 'off') return showToast('离线模式下不可确认收款');
      const o = orderById(id);
      if (!canOperate(o)) return showToast('无权操作该购课单');
      state.overlay = { type: 'confirm', orderId: id };
      renderAll();
    }

    function confirmPay() {
      if (state.online === 'off') return showToast('离线模式下不可确认收款');
      const o = orderById(state.overlay.orderId);
      if (!o || !canOperate(o)) return;
      if (o.status !== 'PENDING_PAYMENT') {
        state.overlay = null;
        renderAll();
        return showToast('当前单据已处理，幂等返回，不重复生成 TS');
      }
      o.status = 'PAID';
      state.overlay = null;
      renderAll();
      showToast(`已确认收款 · 原子裂变 ${o.lessonCount} 个 TS，余数已补入末节${o.source === 'AUTO_RENEWAL' ? ' · HOLD 已转为正式固定位' : ''}`);
    }

    function openCancel(id) {
      if (state.online === 'off') return showToast('离线模式下不可作废');
      const o = orderById(id);
      if (!canOperate(o)) return showToast('无权操作该购课单');
      state.overlay = { type: 'cancel', orderId: id };
      renderAll();
    }

    function confirmCancel() {
      if (state.online === 'off') return showToast('离线模式下不可作废');
      const o = orderById(state.overlay.orderId);
      if (!o || !canOperate(o)) return;
      if (o.status !== 'PENDING_PAYMENT') {
        state.overlay = null;
        renderAll();
        return showToast('仅待付款单据可作废');
      }
      o.status = 'CANCELLED';
      state.overlay = null;
      renderAll();
      showToast('已作废购课单 · 不产生 TS' + (o.source === 'AUTO_RENEWAL' ? ' · 日历预占已释放' : ''));
    }

    function openEdit(id) {
      if (state.online === 'off') return showToast('离线模式下不可修改');
      const o = orderById(id);
      if (!o || !canOperate(o)) return showToast('无权操作该购课单');
      state.edit = { orderId: id, lessons: String(o.lessonCount), paid: String(o.paidPoints), slotsTue: true, slotsThu: true, forceReason: o.forceReason || '', error: '' };
      state.overlay = { type: 'edit', orderId: id };
      renderAll();
      updateEditCalc();
    }

    function saveEdit() {
      if (state.online === 'off') return showToast('离线模式下不可修改');
      const e = state.edit;
      const o = orderById(e.orderId);
      if (!o || !canOperate(o)) return;
      const lessons = Number(e.lessons);
      const paid = Number(e.paid);
      if (!Number.isInteger(lessons) || lessons <= 0) { e.error = '课时数必须为正整数'; renderOverlay(); lucide.createIcons(); return; }
      if (!Number.isInteger(paid) || paid <= 0) { e.error = '实收积分必须为正整数'; renderOverlay(); lucide.createIcons(); return; }
      const editUnit = teacherById(o.teacherId).rate + 2;
      const expected = lessons * editUnit;
      if (paid !== expected && !e.forceReason.trim()) { e.error = '金额不符必须填写修改原因'; renderOverlay(); lucide.createIcons(); return; }
      o.lessonCount = lessons;
      o.expectedPoints = expected;
      o.paidPoints = paid;
      o.leaveQuota = Math.floor(lessons * 0.125);
      o.isForced = paid !== expected;
      o.forceReason = paid !== expected ? e.forceReason.trim() : '';
      o.preScheduleSlots = `每周${e.slotsTue ? '二' : ''}${e.slotsTue && e.slotsThu ? '、' : ''}${e.slotsThu ? '四' : ''} 19:00 - 19:30（共 ${lessons} 节）`;
      state.overlay = null;
      renderAll();
      showToast('购课单已更新 · 更正邮件与日历预占已同步');
    }

    function openFission(id) {
      state.overlay = { type: 'fission', orderId: id };
      renderAll();
    }

    function openContact(id) {
      if (state.online === 'off') return showToast('离线模式下不可提交协调申请');
      state.contact = emptyContact();
      state.contact.orderId = id;
      state.overlay = { type: 'contact', orderId: id };
      renderAll();
    }

    function submitContact() {
      if (state.online === 'off') return showToast('离线模式下不可提交');
      state.overlay = null;
      renderAll();
      showToast('协调申请已发送给负责班长 Leo · 2 小时内响应');
    }

    function openVoucher(id) {
      if (state.online === 'off') return showToast('离线模式下不可上传凭证');
      const o = orderById(id);
      if (!o) return;
      state.voucher = { orderId: id, amount: String(o.paidPoints), remark: '', file: null, error: '' };
      state.overlay = { type: 'voucher', orderId: id };
      renderAll();
    }

    function sampleVoucher() {
      state.voucher.file = { name: '微信转账回单.png', size: 240 * 1024 };
      renderOverlay();
      lucide.createIcons();
    }

    function submitVoucher() {
      if (state.online === 'off') return showToast('离线模式下不可上传凭证');
      const v = state.voucher;
      if (!v.file) { v.error = '请选择凭证文件，或使用示例凭证'; renderOverlay(); lucide.createIcons(); return; }
      const o = orderById(v.orderId);
      if (!o) return;
      if ((o.voucherCount || 0) >= 5) { v.error = '每单最多上传 5 个凭证'; renderOverlay(); lucide.createIcons(); return; }
      o.hasVoucher = true;
      o.voucherCount = (o.voucherCount || 0) + 1;
      o.voucherAmount = Number(v.amount) || o.paidPoints;
      o.voucherRemark = v.remark;
      state.overlay = null;
      renderAll();
      showToast('支付凭证上传成功 · 班长核实到账后确认收款');
    }

    /* ------------------------------------------------------------------
     * 事件委托
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'go-back') { state.page = 'list'; state.overlay = null; renderAll(); return; }
      if (action === 'open-order') return openOrder(el.dataset.id);
      if (action === 'open-create') return openCreate();
      if (action === 'close-overlay') { state.overlay = null; renderOverlay(); lucide.createIcons(); return; }
      if (action === 'set-status') { state.statusFilter = el.dataset.value; renderContentOnly(); return; }
      if (action === 'set-source') { state.sourceFilter = el.dataset.value; renderContentOnly(); return; }
      if (action === 'select-child') { state.parentChild = el.dataset.child; renderContentOnly(); return; }
      if (action === 'create-type') return setCreateType(el.dataset.value);
      if (action === 'submit-create') return submitCreate();
      if (action === 'remove-voucher') {
        state.create.vouchers.splice(Number(el.dataset.index), 1);
        renderOverlay(); lucide.createIcons();
        return;
      }
      if (action === 'open-confirm') return openConfirm(el.dataset.id);
      if (action === 'confirm-pay') return confirmPay();
      if (action === 'open-cancel') return openCancel(el.dataset.id);
      if (action === 'confirm-cancel') return confirmCancel();
      if (action === 'open-edit') return openEdit(el.dataset.id);
      if (action === 'save-edit') return saveEdit();
      if (action === 'open-fission') return openFission(el.dataset.id);
      if (action === 'open-contact') return openContact(el.dataset.id);
      if (action === 'submit-contact') return submitContact();
      if (action === 'open-voucher') return openVoucher(el.dataset.id);
      if (action === 'sample-voucher') return sampleVoucher();
      if (action === 'submit-voucher') return submitVoucher();
    });

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'orderSearch') { state.query = e.target.value; const list = document.getElementById('orderList'); if (list) { list.className = state.device === 'tablet' ? 'grid grid-cols-2 gap-3' : 'space-y-3'; list.innerHTML = filteredOrders().length ? filteredOrders().map(renderOrderCard).join('') : '<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-12 text-center sm:col-span-2"><p class="text-[14px] font-medium text-slate-400">暂无符合条件的购课单</p></div>'; lucide.createIcons(); } return; }
      if (id === 'createLessons') { state.create.lessons = e.target.value; state.create.error = ''; updateCreateCalc(); return; }
      if (id === 'createPaid') { state.create.paid = e.target.value; state.create.autoPaid = false; state.create.error = ''; updateCreateCalc(); return; }
      if (id === 'createForceReason') { state.create.forceReason = e.target.value; state.create.error = ''; return; }
      if (id === 'editLessons') { state.edit.lessons = e.target.value; state.edit.error = ''; updateEditCalc(); return; }
      if (id === 'editPaid') { state.edit.paid = e.target.value; state.edit.error = ''; updateEditCalc(); return; }
      if (id === 'editForceReason') { state.edit.forceReason = e.target.value; state.edit.error = ''; return; }
      if (id === 'contactMemo') { state.contact.memo = e.target.value; return; }
      if (id === 'voucherAmount') { state.voucher.amount = e.target.value; state.voucher.error = ''; return; }
      if (id === 'voucherRemark') { state.voucher.remark = e.target.value; return; }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'createClass') { state.create.classId = e.target.value; state.create.error = ''; updateCreateCalc(); return; }
      if (id === 'createStudent') {
        state.create.student = e.target.value;
        state.create.error = '';
        if (e.target.value === 'LeoW8') {
          state.create.orderType = '1v1_temp';
          state.create.holder = '平台';
        } else if (state.create.holder === '平台') {
          state.create.holder = 'Leo';
        }
        renderOverlay(); lucide.createIcons(); updateCreateCalc();
        return;
      }
      if (id === 'createTeacher') { state.create.teacherId = e.target.value; state.create.error = ''; updateCreateCalc(); return; }
      if (id === 'createCourse') { state.create.courseType = e.target.value; state.create.error = ''; return; }
      if (id === 'createHolder') { state.create.holder = e.target.value; return; }
      if (id === 'createExtra') { state.create.extraPrep = e.target.checked; state.create.error = ''; updateCreateCalc(); return; }
      if (id === 'editSlotTue') { state.edit.slotsTue = e.target.checked; return; }
      if (id === 'editSlotThu') { state.edit.slotsThu = e.target.checked; return; }
      if (id === 'contactType') { state.contact.type = e.target.value; return; }
      if (id === 'createVoucherInput') {
        const files = Array.from(e.target.files || []);
        for (const file of files) {
          if (state.create.vouchers.length >= 5) { showToast('最多上传 5 个凭证'); break; }
          if (!['image/jpeg', 'image/png', 'application/pdf'].includes(file.type)) { showToast('仅支持 JPG / PNG / PDF'); continue; }
          if (file.size > 10 * 1024 * 1024) { showToast('文件大小不能超过 10MB'); continue; }
          state.create.vouchers.push({ name: file.name, size: file.size });
        }
        e.target.value = '';
        renderOverlay(); lucide.createIcons();
        return;
      }
      if (id === 'voucherFile') {
        const file = (e.target.files || [])[0];
        if (!file) return;
        if (!['image/jpeg', 'image/png', 'application/pdf'].includes(file.type)) { state.voucher.error = '仅支持 JPG / PNG / PDF'; renderOverlay(); lucide.createIcons(); return; }
        if (file.size > 10 * 1024 * 1024) { state.voucher.error = '文件大小不能超过 10MB'; renderOverlay(); lucide.createIcons(); return; }
        state.voucher.file = { name: file.name, size: file.size };
        state.voucher.error = '';
        renderOverlay(); lucide.createIcons();
        return;
      }
      if (e.target.name === 'coordType') { state.contact.type = e.target.value; }
    });

    /* ------------------------------------------------------------------
     * 提示
     * ------------------------------------------------------------------ */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2600);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

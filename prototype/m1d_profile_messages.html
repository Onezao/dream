<!-- 即抛型原型：M1D 双权限教学留言板。纯前端 Mock，不连接后端，不触碰生产代码。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>原型 · M1D 双权限教学留言板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Inter', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800 antialiased">

  <!-- 原型控制台（不属于产品界面） -->
  <header class="sticky top-0 z-[60] border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-5 gap-y-2 px-4 py-2.5 text-xs">
      <div class="flex items-center gap-2">
        <span class="grid h-6 w-6 place-items-center rounded-lg bg-slate-900 text-[12px] font-bold text-amber-400">1D</span>
        <span class="text-[14px] font-bold text-slate-900">双权限教学留言板</span>
        <span class="hidden text-[12px] font-medium text-slate-400 lg:inline">最新 PRD · 底栏 ≤ 4 Tab</span>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">角色</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="role" data-value="teacher" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">教师</button>
          <button data-group="role" data-value="parent" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">家长</button>
          <button data-group="role" data-value="monitor" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">班长</button>
          <button data-group="role" data-value="admin" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">管理员</button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">卡片</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="variant" data-value="A" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">时间流</button>
          <button data-group="variant" data-value="B" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">教学备忘卡</button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">设备</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="device" data-value="mobile" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">手机</button>
          <button data-group="device" data-value="tablet" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">平板</button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">网络</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="online" data-value="on" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">在线</button>
          <button data-group="online" data-value="off" class="ctl rounded-lg px-2.5 py-1.5 font-semibold">离线</button>
        </div>
      </div>

      <button id="btnResetDemo" class="rounded-lg border border-slate-200 px-3 py-1.5 font-semibold text-slate-500 hover:bg-slate-50">重置演示</button>

      <a href="../docs/prd/m1d_profile_messages.md" target="_blank" rel="noopener" class="ml-auto hidden items-center gap-1.5 rounded-lg border border-slate-200 px-2.5 py-1.5 font-semibold text-slate-500 hover:bg-slate-50 lg:inline-flex">
        <i data-lucide="file-text" class="h-3.5 w-3.5"></i>M1D PRD
      </a>
    </div>
  </header>

  <main class="flex justify-center px-4 py-6">
    <div id="frame" class="relative flex h-[812px] w-[390px] shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300">
      <div id="topbar" class="shrink-0"></div>
      <div id="offlineBanner" class="hidden">
        <i data-lucide="wifi-off" class="h-4 w-4 shrink-0 text-amber-600"></i>
        离线模式：只读缓存，发布/撤回/下架不可用
      </div>
      <div id="privacy" class="shrink-0"></div>
      <div id="content" class="flex-1 overflow-y-auto"></div>
      <div id="composer" class="shrink-0"></div>
      <nav id="bottomnav" class="shrink-0"></nav>
      <div id="overlay"></div>
      <div id="toast" class="pointer-events-none absolute bottom-64 left-1/2 z-[80] hidden w-max max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl bg-slate-900/90 px-4 py-2 text-center text-[12px] font-semibold leading-relaxed text-white shadow-xl"></div>
    </div>
  </main>

  <!-- Tailwind CDN 动态类安全垫 -->
  <div class="hidden">
    <span class="h-[812px] w-[390px] h-[860px] w-[768px] max-h-[85%] max-w-[560px]"></span>
    <span class="bg-indigo-600 bg-indigo-50 text-indigo-700 border-indigo-100 text-indigo-950"></span>
    <span class="bg-emerald-50 text-emerald-600 text-emerald-700 border-emerald-200"></span>
    <span class="bg-slate-100 text-slate-500 text-slate-600 text-slate-700 border-slate-200 bg-slate-50 bg-slate-900 text-amber-300"></span>
    <span class="bg-rose-50 text-rose-600 text-rose-700 border-rose-200 bg-rose-600 border-rose-300"></span>
    <span class="bg-amber-50 text-amber-600 text-amber-900 border-amber-200 bg-slate-900/40 backdrop-blur-[1px]"></span>
  </div>

  <script>
    /* ------------------------------------------------------------------
     * 常量与演示数据
     * ------------------------------------------------------------------ */
    const STUDENT = { nickname: 'AliceZ12', tag: '大宝 · 12岁', initial: 'A' };

    const ROLE_META = {
      teacher: { label: '授课教师 David', author: 'David Miller', initial: 'D', dark: false, canInternal: true, boardTab: 'home' },
      parent: { label: '学员家长 Amy', author: 'Amy（家长）', initial: 'A', dark: false, canInternal: false, boardTab: 'me' },
      monitor: { label: '带班班长 Leo', author: 'Leo（班长）', initial: 'L', dark: true, canInternal: true, boardTab: 'ops' },
      admin: { label: '管理员 Sarah', author: 'Sarah（管理员）', initial: 'S', dark: true, canInternal: true, boardTab: 'settings' }
    };

    const NAVS = {
      teacher: [
        { id: 'home', icon: 'home', label: '首页', desc: '教师主页的“我的学生”金刚位进入学员留言板。', board: true },
        { id: 'schedule', icon: 'calendar-days', label: '课表', desc: '7 色课表与排期属于 M3A 模块。', href: 'm3a_calendar_schedule.html' },
        { id: 'me', icon: 'user', label: '我的', desc: '个人名片与周课酬单属于 M0 个人中心。', href: 'm0_workspace_home.html?role=teacher&view=me' }
      ],
      parent: [
        { id: 'home', icon: 'home', label: '首页', desc: '多孩时间流与金刚位属于 M0 工作台主页。', href: 'm0_workspace_home.html?role=user' },
        { id: 'schedule', icon: 'calendar-days', label: '学生课表', desc: '7 色课表与多孩锚点属于 M3A 排课模块。', href: 'm3a_calendar_schedule.html' },
        { id: 'hall', icon: 'plus-circle', label: '约课大厅', desc: '小班课选班与 1v1 自由约课属于 M1C。', href: 'm1c_classes.html' },
        { id: 'me', icon: 'user', label: '我的', desc: '多孩档案下的教学留言板。', board: true }
      ],
      monitor: [
        { id: 'home', icon: 'home', label: '首页', desc: '班长教务待办与主页属于 M0 工作台。', href: 'm0_workspace_home.html?role=monitor' },
        { id: 'schedule', icon: 'calendar-days', label: '学生课表', desc: '自家孩子课表属于 M3A 排课模块。', href: 'm3a_calendar_schedule.html' },
        { id: 'ops', icon: 'layout-grid', label: '教务中心', desc: '所辖学员档案与教学留言板。', board: true },
        { id: 'me', icon: 'user', label: '我的', desc: '班长周转账与家庭多孩档案属于 M0 个人中心。', href: 'm0_workspace_home.html?role=monitor&view=me' }
      ],
      admin: [
        { id: 'home', icon: 'home', label: '首页', desc: '平台结算待办与运营大盘属于 M0 工作台。', href: 'm0_workspace_home.html?role=admin' },
        { id: 'schedule', icon: 'calendar-days', label: '学生课表', desc: '自家孩子课表属于 M3A 排课模块。', href: 'm3a_calendar_schedule.html' },
        { id: 'ops', icon: 'layout-grid', label: '教务调度', desc: '全局排班看板与调度入口属于 M0 / M3A。', href: 'm0_workspace_home.html?role=admin&view=ops' },
        { id: 'settings', icon: 'settings', label: '管理与设置', desc: '学员档案与管理员争议留言处置。', board: true }
      ]
    };

    function initialMessages() {
      const t = Date.now();
      return [
        {
          id: 'msg_001', authorRole: 'teacher', authorName: 'David Miller',
          visibility: 'public_teacher_student',
          content: 'Alice 今天完成了 KET Unit 3 过去时态精读与单词拓展，课堂回答问题非常积极！课后请完成 Workbook P24-25 语法练习。',
          createdAt: t - 95 * 1000, isRevoked: false
        },
        {
          id: 'msg_002', authorRole: 'teacher', authorName: 'David Miller',
          visibility: 'internal_teaching_only',
          content: '【内部代课备忘】Alice 对不规则动词过去式拼写有点抗拒，容易产生挫败感。下周二若由代课老师接手，建议开课先用 5 分钟小卡片游戏调动自信，切勿直接批评。',
          createdAt: t - 3600 * 1000, isRevoked: false
        },
        {
          id: 'msg_003', authorRole: 'parent', authorName: 'Amy（家长）',
          visibility: 'public_teacher_student',
          content: '收到老师反馈！今晚已督促她打卡完成了练习册，发音录音已经提交在 ClassIn 作业区了，感谢 David 老师耐心的启发！',
          createdAt: t - 86400 * 1000, isRevoked: false
        },
        {
          id: 'msg_004', authorRole: 'monitor', authorName: 'Leo（班长）',
          visibility: 'internal_teaching_only',
          content: '【教务备忘】已向家长同步下周外教年假代课安排，Sarah 老师已确认接单，教材与当前课次进度均已在后台完成交接。',
          createdAt: t - 172800 * 1000, isRevoked: false
        }
      ];
    }

    /* ------------------------------------------------------------------
     * 状态
     * ------------------------------------------------------------------ */
    const state = {
      role: 'teacher',
      variant: 'A',
      device: 'mobile',
      online: 'on',
      page: 'board', // board | placeholder
      navTab: 'home',
      visibility: 'public',
      draft: '',
      messages: initialMessages(),
      overlay: null,
      deleteReason: '',
      deleteError: ''
    };

    /* ------------------------------------------------------------------
     * 工具
     * ------------------------------------------------------------------ */
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function roleMeta() {
      return ROLE_META[state.role];
    }

    function navItems() {
      return NAVS[state.role];
    }

    function boardTab() {
      return roleMeta().boardTab;
    }

    function formatTime(ts) {
      const diff = Math.max(0, Math.floor((Date.now() - ts) / 1000));
      if (diff < 60) return '刚刚';
      if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
      if (diff < 172800) return '昨天';
      return `${Math.floor(diff / 86400)} 天前`;
    }

    function revokeRemaining(ts) {
      return Math.max(0, 300 - Math.floor((Date.now() - ts) / 1000));
    }

    function visibleMessages() {
      let list = state.messages.filter((m) => !m.isRevoked);
      if (state.role === 'parent') {
        list = list.filter((m) => m.visibility === 'public_teacher_student');
      }
      return list;
    }

    function canRevoke(m) {
      return state.role === m.authorRole && revokeRemaining(m.createdAt) > 0;
    }

    function roleAvatar(role, size = 'h-8 w-8', text = 'text-[12px]') {
      const meta = ROLE_META[role];
      const cls = meta.dark ? 'bg-slate-900 text-amber-300 ring-slate-800' : 'bg-indigo-50 text-indigo-700 ring-indigo-100';
      return `<div class="grid shrink-0 place-items-center rounded-full ${size} ${text} font-bold ring-1 ${cls}">${esc(meta.initial)}</div>`;
    }

    function visibilityTag(internal, compact = true) {
      if (internal) {
        return `<span class="inline-flex shrink-0 items-center gap-1 rounded-md border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-semibold text-slate-600">${icon('lock', 'h-3 w-3')}${compact ? '仅内部可见' : '内部教学交接'}</span>`;
      }
      return `<span class="inline-flex shrink-0 items-center gap-1 rounded-md border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-semibold text-emerald-700">${icon('globe', 'h-3 w-3')}${compact ? '师生公开' : '公开课后反馈'}</span>`;
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'variant') {
          state.variant = value;
          syncConsole();
          if (state.page === 'board') renderMessagesOnly();
        }
        if (group === 'device') {
          state.device = value;
          renderAll();
        }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：可查看缓存留言，发布/撤回/下架不可用');
        }
      });
    });

    document.getElementById('btnResetDemo').addEventListener('click', resetDemo);

    function setRole(role) {
      state.role = role;
      state.page = 'board';
      state.navTab = boardTab();
      if (role === 'parent') state.visibility = 'public';
      state.overlay = null;
      renderAll();
    }

    function navTo(tab) {
      const item = navItems().find((n) => n.id === tab);
      if (!item) return;
      if (item.board) {
        state.page = 'board';
        state.navTab = tab;
      } else {
        state.page = 'placeholder';
        state.navTab = tab;
      }
      state.overlay = null;
      renderAll();
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const active = state[group] === b.dataset.value;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;
      });
    }

    function resetDemo() {
      state.messages = initialMessages();
      state.role = 'teacher';
      state.variant = 'A';
      state.device = 'mobile';
      state.online = 'on';
      state.page = 'board';
      state.navTab = 'home';
      state.visibility = 'public';
      state.draft = '';
      state.overlay = null;
      state.deleteReason = '';
      state.deleteError = '';
      renderAll();
      showToast('演示数据已重置');
    }

    /* ------------------------------------------------------------------
     * 外壳与留言流
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = document.getElementById('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      document.getElementById('topbar').innerHTML = renderTopbar();

      const banner = document.getElementById('offlineBanner');
      banner.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2.5 text-[14px] font-semibold text-amber-900'
        : 'hidden';

      const board = state.page === 'board';
      document.getElementById('privacy').innerHTML = board ? renderPrivacyBanner() : '';
      document.getElementById('content').innerHTML = board ? renderMessagesHTML() : renderPlaceholder();
      document.getElementById('composer').innerHTML = board ? renderComposer() : '';
      document.getElementById('bottomnav').innerHTML = renderNav();
      renderOverlay();
      syncConsole();
      lucide.createIcons();
      updateComposerButton();
    }

    function renderMessagesOnly() {
      document.getElementById('content').innerHTML = renderMessagesHTML();
      lucide.createIcons();
    }

    function renderTopbar() {
      const meta = roleMeta();
      const badge = `<div class="flex shrink-0 items-center gap-1 rounded-full px-2.5 py-1 text-[12px] font-semibold ${meta.dark ? 'bg-slate-900 text-amber-300' : 'border border-indigo-100 bg-indigo-50 text-indigo-700'}">${icon('user', 'h-3 w-3')}${esc(meta.label)}</div>`;
      if (state.page === 'placeholder') {
        return `
          <div class="border-b border-slate-200 bg-white/95">
            <div class="flex h-14 items-center justify-between px-4">
              <div class="flex min-w-0 items-center gap-2.5">
                <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-indigo-600 text-[14px] font-bold text-white shadow-sm">D</div>
                <div class="min-w-0">
                  <div class="truncate text-[16px] font-bold leading-tight text-slate-900">Dream 教务</div>
                  <div class="truncate text-[12px] font-medium text-slate-400">${esc(meta.label)} · 其他模块原型</div>
                </div>
              </div>
              ${badge}
            </div>
          </div>`;
      }
      return `
        <div class="border-b border-slate-200 bg-white/95">
          <div class="flex h-14 items-center justify-between gap-2 px-4">
            <div class="flex min-w-0 items-center gap-2.5">
              <div class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-indigo-50 text-[14px] font-bold text-indigo-700 ring-1 ring-indigo-100">${esc(STUDENT.initial)}</div>
              <div class="min-w-0">
                <div class="flex items-center gap-1.5">
                  <span class="truncate text-[18px] font-bold tracking-tight text-slate-900">${esc(STUDENT.nickname)}</span>
                  <span class="shrink-0 rounded-md bg-indigo-50 px-1.5 py-0.5 text-[12px] font-semibold text-indigo-700">${esc(STUDENT.tag)}</span>
                </div>
                <div class="truncate text-[12px] font-medium text-slate-400">教学留言板 · 双权限隔离</div>
              </div>
            </div>
            ${badge}
          </div>
        </div>`;
    }

    function renderPrivacyBanner() {
      const parent = state.role === 'parent';
      return `
        <div class="flex items-center justify-between gap-2 border-b px-4 py-2.5 ${parent ? 'border-emerald-100 bg-emerald-50 text-emerald-800' : 'border-indigo-100 bg-indigo-50 text-indigo-900'}">
          <span class="flex min-w-0 items-center gap-2 text-[14px] font-medium">
            ${icon(parent ? 'shield-check' : 'lock', `h-4 w-4 shrink-0 ${parent ? 'text-emerald-600' : 'text-indigo-600'}`)}
            <span class="truncate">${parent ? '师生公开视图 · 内部评语已屏蔽' : '双权限：公开反馈 / 内部交接'}</span>
          </span>
          <span class="shrink-0 font-mono text-[12px] font-semibold ${parent ? 'text-emerald-700' : 'text-indigo-700'}">300s 撤回</span>
        </div>`;
    }

    function renderComposer() {
      const parent = state.role === 'parent';
      const base = 'flex h-8 items-center gap-1 rounded-md px-2.5 text-[14px] font-semibold transition';
      const pubOn = state.visibility === 'public';
      return `
        <div class="shrink-0 border-t border-slate-200 bg-white p-3">
          <div class="mx-auto w-full max-w-[720px] space-y-2">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[12px] font-medium text-slate-400">留言可见范围</span>
              ${parent ? `
                <span class="flex items-center gap-1 text-[12px] font-medium text-slate-400">${icon('info', 'h-3.5 w-3.5 text-emerald-600')}家长留言固定【师生公开】</span>` : `
                <div class="inline-flex rounded-lg bg-slate-100 p-0.5">
                  <button data-action="set-visibility" data-v="public" id="visPublic" class="${base} ${pubOn ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}">${icon('globe', 'h-3.5 w-3.5 text-emerald-600')}师生公开</button>
                  <button data-action="set-visibility" data-v="internal" id="visInternal" class="${base} ${pubOn ? 'text-slate-500' : 'bg-white text-slate-900 shadow-sm'}">${icon('lock', 'h-3.5 w-3.5 text-slate-500')}仅内部可见</button>
                </div>`}
            </div>
            <div class="relative">
              <textarea id="messageInput" rows="2" maxlength="1000" placeholder="${parent ? '记录孩子的公开学习反馈与作业建议...' : '写下教学反馈、课堂表现或内部交接备忘...'}" class="h-[76px] w-full resize-none rounded-xl border border-slate-200 bg-white p-3 pr-16 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">${esc(state.draft)}</textarea>
              <span id="charCount" class="absolute bottom-3 right-3 font-mono text-[12px] font-medium text-slate-400">${state.draft.length}/1000</span>
            </div>
            <div class="flex items-center justify-between gap-2">
              <span class="text-[12px] font-medium text-slate-400">发布后 5 分钟内可自主撤回</span>
              <button data-action="post" id="btnPost" class="flex h-10 items-center gap-1.5 rounded-xl bg-indigo-600 px-4 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">发送 ${icon('send', 'h-4 w-4')}</button>
            </div>
          </div>
        </div>`;
    }

    function renderMessagesHTML() {
      const list = visibleMessages();
      return `
        <div class="mx-auto w-full max-w-[720px] space-y-3 px-4 pb-6 pt-4">
          <div class="flex items-center justify-between px-1">
            <h2 class="text-[16px] font-bold text-slate-900">历史留言</h2>
            <span class="text-[12px] font-medium text-slate-400">${list.length} 条 · 按时间倒序</span>
          </div>
          ${list.length ? (state.variant === 'A' ? list.map(renderBubble).join('') : list.map(renderMemo).join('')) : `
            <div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-12 text-center">
              <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-slate-50 text-slate-300">${icon('message-square-off', 'h-5 w-5')}</div>
              <p class="mt-3 text-[14px] font-medium text-slate-400">暂无留言记录</p>
            </div>`}
          ${list.length ? `
            <button data-action="toast" data-message="已加载更早留言（原型模拟 · 游标分页）" class="mx-auto block pt-1 text-[12px] font-semibold text-indigo-600">加载更早留言</button>` : ''}
        </div>`;
    }

    function revokeButton(m) {
      const off = state.online === 'off';
      return `
        <button data-action="revoke" data-id="${m.id}" data-revoke-wrap ${off ? 'disabled' : ''} class="inline-flex items-center gap-1 rounded-lg bg-indigo-50 px-2 py-1 text-[12px] font-semibold text-indigo-700 hover:bg-indigo-100 disabled:cursor-not-allowed disabled:opacity-50">
          ${icon('rotate-ccw', 'h-3 w-3')}<span data-revoke-count data-id="${m.id}">撤回 (${revokeRemaining(m.createdAt)}s)</span>
        </button>`;
    }

    function deleteButton(m) {
      const off = state.online === 'off';
      return `<button data-action="admin-delete" data-id="${m.id}" ${off ? 'disabled' : ''} class="inline-flex items-center gap-1 text-[12px] font-semibold text-rose-600 hover:text-rose-800 disabled:cursor-not-allowed disabled:opacity-50">${icon('trash-2', 'h-3 w-3')}下架</button>`;
    }

    function renderBubble(m) {
      const internal = m.visibility === 'internal_teaching_only';
      return `
        <div class="flex items-start gap-2.5">
          ${roleAvatar(m.authorRole, 'h-8 w-8', 'text-[12px]')}
          <div class="min-w-0 flex-1">
            <div class="mb-1 flex items-center justify-between gap-2">
              <div class="flex min-w-0 items-center gap-1.5">
                <span class="truncate text-[14px] font-bold text-slate-900">${esc(m.authorName)}</span>
                ${visibilityTag(internal)}
              </div>
              <span class="shrink-0 font-mono text-[12px] font-medium text-slate-400">${formatTime(m.createdAt)}</span>
            </div>
            <div class="whitespace-pre-line rounded-2xl border p-3 text-[14px] font-medium leading-relaxed ${internal ? 'border-slate-200 bg-slate-50 text-slate-800' : 'border-slate-200 bg-white text-slate-800'}">${esc(m.content)}</div>
            <div class="mt-1 flex items-center justify-end gap-2">
              ${canRevoke(m) ? revokeButton(m) : ''}
              ${state.role === 'admin' ? deleteButton(m) : ''}
            </div>
          </div>
        </div>`;
    }

    function renderMemo(m) {
      const internal = m.visibility === 'internal_teaching_only';
      return `
        <div class="rounded-2xl border p-4 shadow-sm ${internal ? 'border-slate-300 bg-slate-50 ring-1 ring-slate-100' : 'border-slate-200 bg-white'}">
          <div class="flex items-center justify-between gap-2 border-b border-slate-100 pb-2">
            <div class="flex min-w-0 items-center gap-2">
              ${roleAvatar(m.authorRole, 'h-8 w-8', 'text-[12px]')}
              <div class="min-w-0">
                <div class="truncate text-[14px] font-bold text-slate-900">${esc(m.authorName)}</div>
                <div class="font-mono text-[12px] font-medium text-slate-400">${formatTime(m.createdAt)}</div>
              </div>
            </div>
            ${visibilityTag(internal, false)}
          </div>
          <p class="mt-2 whitespace-pre-line text-[14px] font-medium leading-relaxed text-slate-800">${esc(m.content)}</p>
          <div class="mt-2 flex items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-400">${internal ? '仅教师、代课教师与班长可见' : '家长与学员全员可见'}</span>
            <div class="flex items-center gap-2">
              ${canRevoke(m) ? revokeButton(m) : ''}
              ${state.role === 'admin' ? deleteButton(m) : ''}
            </div>
          </div>
        </div>`;
    }

    function renderPlaceholder() {
      const item = navItems().find((n) => n.id === state.navTab);
      if (!item) return '<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>';
      return `
        <div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
          <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
          <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
          <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
          ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">打开对应原型</a>` : ''}
          <button data-action="nav" data-tab="${boardTab()}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回留言板</button>
        </div>`;
    }

    function renderNav() {
      return `
        <div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
          <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
            ${navItems().map((item) => {
              const on = state.navTab === item.id;
              return `
                <button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'text-indigo-600' : 'text-slate-400'}">
                  ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
                  <span class="text-[12px] font-bold">${item.label}</span>
                </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 发布 / 撤回 / 管理员下架
     * ------------------------------------------------------------------ */
    function setVisibility(v) {
      if (state.role === 'parent') return;
      state.visibility = v;
      const pub = document.getElementById('visPublic');
      const internal = document.getElementById('visInternal');
      if (!pub || !internal) return;
      const base = 'flex h-8 items-center gap-1 rounded-md px-2.5 text-[14px] font-semibold transition';
      pub.className = `${base} ${v === 'public' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`;
      internal.className = `${base} ${v === 'internal' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`;
    }

    function updateComposerButton() {
      const btn = document.getElementById('btnPost');
      if (!btn) return;
      btn.disabled = state.online === 'off' || !state.draft.trim();
    }

    function postMessage() {
      if (state.online === 'off') return showToast('离线模式下不可发布留言');
      const text = state.draft.trim();
      if (!text) return showToast('请输入留言内容');
      if (text.length > 1000) return showToast('留言不能超过 1000 字符');
      const meta = roleMeta();
      const visibility = state.role === 'parent'
        ? 'public_teacher_student'
        : state.visibility === 'internal' ? 'internal_teaching_only' : 'public_teacher_student';
      state.messages.unshift({
        id: `msg_${Date.now()}`,
        authorRole: state.role,
        authorName: meta.author,
        visibility,
        content: text,
        createdAt: Date.now(),
        isRevoked: false
      });
      state.draft = '';
      if (state.role === 'parent') state.visibility = 'public';
      renderAll();
      const content = document.getElementById('content');
      if (content) content.scrollTop = 0;
      showToast('留言已发布 · 5 分钟内可撤回');
    }

    function revokeMessage(id) {
      if (state.online === 'off') return showToast('离线模式下不可撤回留言');
      const m = state.messages.find((x) => x.id === id);
      if (!m || m.authorRole !== state.role) return;
      if (revokeRemaining(m.createdAt) <= 0) {
        return showToast('403 MESSAGE_REVOKE_WINDOW_EXPIRED · 已超过 300 秒撤回时效');
      }
      m.isRevoked = true;
      renderMessagesOnly();
      showToast('已撤回该条留言并从界面移除');
    }

    function openAdminDelete(id) {
      if (state.online === 'off') return showToast('离线模式下不可下架留言');
      if (state.role !== 'admin') return;
      state.overlay = { type: 'adminDelete', messageId: id };
      state.deleteReason = '';
      state.deleteError = '';
      renderOverlay();
      lucide.createIcons();
      setTimeout(() => document.getElementById('deleteReason')?.focus(), 50);
    }

    function confirmAdminDelete() {
      if (state.online === 'off') return showToast('离线模式下不可下架留言');
      const reason = state.deleteReason.trim();
      if (reason.length < 2 || reason.length > 200) {
        state.deleteError = '下架原因需为 2-200 字符';
        renderOverlay();
        lucide.createIcons();
        return;
      }
      const m = state.messages.find((x) => x.id === (state.overlay && state.overlay.messageId));
      if (m) {
        m.isRevoked = true;
        m.deletedBy = 'admin';
        m.deleteReason = reason;
        m.deletedAt = Date.now();
      }
      state.overlay = null;
      renderAll();
      showToast('已下架留言 · dream.audit_logs 已记录操作人/留言ID/原因/原文快照');
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      document.getElementById('overlay').innerHTML = state.overlay ? renderOverlayHTML() : '';
    }

    function renderOverlayHTML() {
      if (!state.overlay || state.overlay.type !== 'adminDelete') return '';
      const m = state.messages.find((x) => x.id === state.overlay.messageId);
      if (!m) return '';
      const internal = m.visibility === 'internal_teaching_only';
      return `
        <div class="absolute inset-0 z-50">
          <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
          <div class="absolute inset-x-4 top-1/2 mx-auto max-h-[85%] max-w-[560px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <h2 class="text-[16px] font-bold text-slate-900">下架争议留言</h2>
                <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">软删除后对所有角色物理隐藏，操作记入 dream.audit_logs。</p>
              </div>
              <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
            </div>

            <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-3">
              <div class="flex items-center gap-2">
                <span class="truncate text-[12px] font-semibold text-slate-700">${esc(m.authorName)}</span>
                ${visibilityTag(internal)}
              </div>
              <p class="mt-1 max-h-24 overflow-y-auto whitespace-pre-line text-[14px] font-medium leading-relaxed text-slate-700">${esc(m.content)}</p>
            </div>

            <div class="mt-3">
              <label for="deleteReason" class="mb-1.5 block text-[16px] font-semibold text-slate-800">下架处理原因 <span class="text-rose-500">*</span> <span class="text-[12px] font-normal text-slate-400">（2-200 字）</span></label>
              <input id="deleteReason" value="${esc(state.deleteReason)}" maxlength="200" placeholder="如：涉及学员隐私纠纷，协商下架" class="h-12 w-full rounded-xl border border-slate-200 bg-white px-3.5 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
            </div>
            ${state.deleteError ? `<div id="deleteError" class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-2.5 text-[14px] font-medium text-rose-700">${esc(state.deleteError)}</div>` : ''}

            <div class="mt-4 flex gap-2">
              <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">取消</button>
              <button data-action="confirm-delete" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-1 rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认下架</button>
            </div>
          </div>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 事件委托
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'set-visibility') return setVisibility(el.dataset.v);
      if (action === 'post') return postMessage();
      if (action === 'revoke') return revokeMessage(el.dataset.id);
      if (action === 'admin-delete') return openAdminDelete(el.dataset.id);
      if (action === 'close-overlay') {
        state.overlay = null;
        renderOverlay();
        lucide.createIcons();
        return;
      }
      if (action === 'confirm-delete') return confirmAdminDelete();
    });

    document.getElementById('frame').addEventListener('input', (e) => {
      if (e.target.id === 'messageInput') {
        state.draft = e.target.value;
        const count = document.getElementById('charCount');
        if (count) count.textContent = `${state.draft.length}/1000`;
        updateComposerButton();
      }
      if (e.target.id === 'deleteReason') {
        state.deleteReason = e.target.value;
        state.deleteError = '';
        const err = document.getElementById('deleteError');
        if (err) err.remove();
      }
    });

    /* ------------------------------------------------------------------
     * 300 秒撤回倒计时心跳（仅更新按钮文本，不重绘外壳）
     * ------------------------------------------------------------------ */
    setInterval(() => {
      document.querySelectorAll('[data-revoke-count]').forEach((el) => {
        const m = state.messages.find((x) => x.id === el.dataset.id);
        if (!m) return;
        const rem = revokeRemaining(m.createdAt);
        if (rem > 0) {
          el.textContent = `撤回 (${rem}s)`;
        } else {
          const wrap = el.closest('[data-revoke-wrap]');
          if (wrap) wrap.classList.add('hidden');
        }
      });
    }, 1000);

    /* ------------------------------------------------------------------
     * 提示
     * ------------------------------------------------------------------ */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2600);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

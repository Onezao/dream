      ];

    function seedAudit() {
      const now = Date.now();
      const day = (n) => now - n * 24 * 60 * 60 * 1000;
      return [
        {
          id: 'aud_alice001', messageId: 'msg_arch0001', studentId: 'stu_alice001',
          operator: 'Sarah', reason: '涉及学员隐私信息，已按平台规范下架',
          snapshot: '原留言包含家庭住址与联系方式，已按隐私规范下架。', at: day(2)
        },
        {
          id: 'aud_alice002', messageId: 'msg_arch0002', studentId: 'stu_alice001',
          operator: 'Sarah', reason: '与教学无关的推广内容',
          snapshot: '原留言包含外部课程推广链接。', at: day(6)
        }
      ];
    }

    const state = {
      role: 'teacher',
      studentId: 'stu_alice001',
      page: 'board',
      navTab: 'students',
      device: 'mobile',
      online: 'on',
      messages: seedMessages(),
      audit: seedAudit(),
      draft: '',
      internalOnly: false,
      viewFilter: 'all',
      visibleCount: 10,
      overlay: null,
      deleteReason: '',
      deleteError: ''
    };

    const params = new URLSearchParams(location.search);
    const validRoles = ['teacher', 'parent', 'monitor', 'admin'];
    if (validRoles.includes(params.get('role'))) state.role = params.get('role');
    const deepStudent = params.get('student_id') || params.get('studentId');
    if (deepStudent) state.studentId = deepStudent;
    if (params.get('device') === 'tablet') state.device = 'tablet';
    if (params.get('online') === 'off') state.online = 'off';
    if (params.get('filter') === 'internal' && state.role !== 'parent') state.viewFilter = 'internal';
    if (params.get('page') === 'placeholder') state.page = 'placeholder';
    state.navTab = ROLES[state.role].boardTab;

    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function roleMeta() { return ROLES[state.role]; }
    function studentById(id) { return STUDENTS.find((s) => s.id === id) || STUDENTS[0]; }
    function activeStudent() { return studentById(state.studentId); }
    function visibleStudents() { return roleMeta().students.map(studentById); }
    function canAdminDelete() { return state.role === 'admin'; }
    function canPostMessage() { return state.role !== 'admin'; }

    /* 家长只拿 PUBLIC；管理员审计流包含已撤回，普通流物理隐藏已撤回 */
    function visibleMessages() {
      return state.messages
        .filter((m) => m.studentId === state.studentId && !m.deleted)
        .filter((m) => (state.role === 'admin' ? true : !m.revoked))
        .filter((m) => (state.role !== 'parent' || m.visibility === 'PUBLIC'))
        .slice()
        .sort((a, b) => b.createdAt - a.createdAt);
    }

    function filteredMessages() {
      const list = visibleMessages();
      if (state.role === 'parent' || state.viewFilter === 'all') return list;
      return list.filter((m) => m.visibility === 'INTERNAL');
    }

    function displayedMessages() {
      return filteredMessages().slice(0, state.visibleCount);
    }

    function revokeRemaining(m) {
      return Math.max(0, 300 - Math.floor((Date.now() - m.createdAt) / 1000));
    }

    function canRevoke(m) {
      return !m.revoked && m.authorRole === state.role && m.authorName === roleMeta().authorName;
    }

    function authorRoleLabel(m) {
      if (state.role === 'parent') {
        if (m.authorRole === 'teacher') return '授课外教';
        if (m.authorRole === 'monitor') return '带班班长';
        if (m.authorRole === 'parent') return m.authorName === roleMeta().authorName ? '家长 (我)' : '家长';
        return '平台管理员';
      }
      if (m.authorRole === 'teacher') return '正课外教';
      if (m.authorRole === 'monitor') return '带班班长';
      if (m.authorRole === 'parent') return '家长';
      return '平台管理员';
    }

    function formatTime(ts) {
      const d = new Date(ts);
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      if (d.toDateString() === now.toDateString()) return `今天 ${hm}`;
      const y = new Date(now);
      y.setDate(now.getDate() - 1);
      if (d.toDateString() === y.toDateString()) return `昨天 ${hm}`;
      return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${hm}`;
    }

    function newId(prefix) {
      return `${prefix}_${Math.random().toString(36).slice(2, 10).padEnd(8, '0').slice(0, 8)}`;
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const value = b.dataset.value;
        let active = false;
        let disabled = false;
        if (group === 'role') active = state.role === value;
        if (group === 'student') {
          active = state.studentId === value;
          disabled = !visibleStudents().some((s) => s.id === value);
        }
        if (group === 'device') active = state.device === value;
        if (group === 'online') active = state.online === value;
        b.disabled = disabled;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}${disabled ? ' cursor-not-allowed opacity-40' : ''}`;
      });
    }

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'student') setStudent(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          showToast(value === 'off' ? '离线模式：可查看缓存留言，发布、撤回与下架暂不可用' : '已恢复在线');
        }
      });
    });

    function setRole(role) {
      state.role = role;
      state.navTab = roleMeta().boardTab;
      const allowed = visibleStudents();
      if (!allowed.some((s) => s.id === state.studentId)) state.studentId = allowed[0].id;
      state.page = 'board';
      state.draft = '';
      state.internalOnly = false;
      state.viewFilter = 'all';
      state.visibleCount = 10;
      state.overlay = null;
      state.deleteReason = '';
      state.deleteError = '';
      renderAll();
      const c = $('content'); if (c) c.scrollTop = 0;
    }

    function setStudent(id) {
      if (!visibleStudents().some((s) => s.id === id)) return;
      state.studentId = id;
      state.page = 'board';
      state.visibleCount = 10;
      state.viewFilter = 'all';
      state.draft = '';
      state.internalOnly = false;
      state.overlay = null;
      state.deleteReason = '';
      state.deleteError = '';
      renderAll();
      const c = $('content'); if (c) c.scrollTop = 0;
    }

    function resetDemo() {
      state.role = 'teacher';
      state.studentId = 'stu_alice001';
      state.page = 'board';
      state.navTab = 'students';
      state.device = 'mobile';
      state.online = 'on';
      state.messages = seedMessages();
      state.audit = seedAudit();
      state.draft = '';
      state.internalOnly = false;
      state.viewFilter = 'all';
      state.visibleCount = 10;
      state.overlay = null;
      state.deleteReason = '';
      state.deleteError = '';
      renderAll();
      const c = $('content'); if (c) c.scrollTop = 0;
      showToast('演示数据已重置');
    }

    $('btnResetDemo').addEventListener('click', resetDemo);

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      const title = bannerTitle();
      document.title = `${title} · Dream`;

      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线模式：可查看缓存留言，发布、撤回与下架暂不可用`
        : '';

      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = renderNav();
      $('overlay').innerHTML = renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function renderContentOnly(keepScroll = false) {
      const c = $('content');
      const top = c ? c.scrollTop : 0;
      if (!c) return;
      c.innerHTML = renderContent();
      c.scrollTop = keepScroll ? top : 0;
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function bannerTitle() {
      if (state.page !== 'board') {
        const item = roleMeta().nav.find((n) => n.id === state.navTab);
        return item ? item.label : '教学交流';
      }
      const name = activeStudent().displayName;
      if (state.role === 'parent') return `${name} 的教学交流`;
      if (state.role === 'admin') return `${name} 留言审计`;
      return `${name} 留言备忘`;
    }

    function renderBanner() {
      const r = roleMeta();
      const showBack = state.page === 'board';
      return `<header class="relative flex h-16 shrink-0 items-center gap-2 overflow-hidden bg-gradient-to-br ${r.banner} px-3 text-white">
        ${r.pattern}
        ${showBack
          ? `<button data-action="back" title="返回来源页（保留滚动位置与搜索条件）" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="返回">${icon('chevron-left', 'h-5 w-5')}</button>`
          : ''}
        <h1 class="relative min-w-0 flex-1 truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</h1>
        <button data-action="toast" data-message="2 条未读通知" class="relative grid h-9 w-9 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
          ${icon('bell', 'h-5 w-5')}
          <span class="absolute -right-0.5 -top-0.5 grid h-4 min-w-[16px] place-items-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white/30">2</span>
        </button>
      </header>`;
    }

    function renderNav() {
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${roleMeta().nav.map((item) => {
            const on = state.navTab === item.id;
            return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-400'}">
              ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
              <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      return renderBoard();
    }

    function renderPlaceholder() {
      const item = roleMeta().nav.find((n) => n.id === state.navTab);
      if (!item) return `<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>`;
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">进入${esc(item.label)}</a>` : ''}
        <button data-action="back-board" class="mt-3 text-[14px] font-semibold text-indigo-600">返回留言板</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 留言板
     * ------------------------------------------------------------------ */
    function renderBoard() {
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        ${state.role === 'parent' ? '' : filterBar()}
        ${composer()}
        ${historyHeader()}
        <div id="messageList" class="space-y-2">${messageListHtml()}</div>
        <div id="loadMoreBar">${loadMoreBar()}</div>
        ${auditCard()}
      </div>`;
    }

    function filterBar() {
      if (state.role === 'parent') return '';
      const all = visibleMessages().length;
      const internal = visibleMessages().filter((m) => m.visibility === 'INTERNAL').length;
      return `<div class="rounded-2xl border border-slate-200/80 bg-white p-1 shadow-sm">
        <div class="flex gap-1">
          ${filterButton('all', `全部交流 (${all})`)}
          ${filterButton('internal', `仅内部备忘 🔒 (${internal})`)}
        </div>
      </div>`;
    }

    function filterButton(value, label) {
      const active = state.viewFilter === value;
      return `<button data-action="filter" data-filter="${value}" class="h-9 flex-1 rounded-lg text-[12px] font-bold transition ${active ? 'bg-indigo-50 text-indigo-700 ring-1 ring-indigo-200' : 'text-slate-500 hover:bg-slate-50'}">${esc(label)}</button>`;
    }

    function composer() {
      if (!canPostMessage()) return adminNotice();
      const parent = state.role === 'parent';
      const max = parent ? 500 : 1000;
      const offline = state.online === 'off';
      const canSubmit = !offline && state.draft.trim().length > 0 && state.draft.length <= max;
      const textareaTone = !parent && state.internalOnly
        ? 'border-amber-300 bg-amber-50/40 focus:border-amber-500'
        : 'border-slate-200 bg-white focus:border-indigo-500';
      return `<section class="rounded-2xl border border-slate-200/80 bg-white p-3.5 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <h2 class="text-[16px] font-bold text-slate-900">${parent ? '给老师留言' : '发布留言'}</h2>
          <span class="shrink-0 text-[12px] font-medium text-slate-400">发布后 5 分钟内可撤回</span>
        </div>
        <textarea id="messageInput" rows="3" maxlength="${max}" placeholder="${parent ? '向老师留言或反馈孩子上课情况...' : '录入本节课教学反馈或内部交接备忘...'}" ${offline ? 'disabled' : ''} class="mt-2 h-24 w-full resize-none rounded-xl border p-3 text-[16px] leading-relaxed text-slate-900 outline-none transition disabled:bg-slate-100 disabled:text-slate-400 ${textareaTone}">${esc(state.draft)}</textarea>
        <div class="mt-2 flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-3">
            ${parent
              ? ''
              : `<label class="flex shrink-0 items-center gap-1.5">
                  <input id="internalToggle" type="checkbox" ${state.internalOnly ? 'checked' : ''} class="h-4 w-4 rounded border-slate-300 accent-indigo-600">
                  <span id="internalLabel" class="text-[12px] font-semibold ${state.internalOnly ? 'text-amber-700' : 'text-slate-600'}">仅内部教学可见 (🔒)</span>
                </label>`}
            <span id="msgCount" class="shrink-0 font-mono text-[12px] font-medium text-slate-400">${state.draft.length}/${max}</span>
          </div>
          <button id="btnPublish" data-action="publish" ${canSubmit ? '' : 'disabled'} class="h-11 shrink-0 rounded-xl bg-indigo-600 px-4 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">${parent ? '发送留言' : '发布留言'}</button>
        </div>
        ${parent ? '' : `<p id="internalHint" class="${state.internalOnly ? '' : 'hidden'} mt-1.5 text-[12px] font-medium text-amber-700">将作为内部备忘发布，仅教师与教务可见。</p>`}
        ${offline ? `<p class="mt-1.5 text-[12px] font-medium text-amber-700">离线只读：发布不可用</p>` : ''}
      </section>`;
    }

    function adminNotice() {
      return `<section class="rounded-2xl border border-slate-200/80 bg-slate-50 p-3.5 shadow-sm">
        <div class="flex items-center gap-2">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-white text-slate-700 ring-1 ring-slate-200">${icon('shield-check', 'h-4 w-4')}</span>
          <h2 class="text-[16px] font-bold text-slate-900">留言审计</h2>
        </div>
        <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">可查阅该学员的全部交流与内部备忘，并对违规留言执行下架。下架原因将写入审计记录。</p>
      </section>`;
    }

    function historyHeader() {
      const total = filteredMessages().length;
      return `<div class="flex items-center justify-between px-1">
        <h2 class="text-[14px] font-bold text-slate-900">历史记录</h2>
        <span class="text-[12px] font-medium text-slate-400">共 ${total} 条</span>
      </div>`;
    }

    function messageListHtml() {
      const list = displayedMessages();
      if (!list.length) {
        const internalFilter = state.role !== 'parent' && state.viewFilter === 'internal';
        const title = state.role === 'parent' ? '还没有教学交流记录' : internalFilter ? '暂无内部备忘' : '暂无留言记录';
        const sub = state.role === 'parent'
          ? '给老师留言，开启第一次教学交流吧。'
          : internalFilter
            ? '发布时勾选「仅内部教学可见」即可留下内部交接记录。'
            : '发布第一条教学反馈，记录孩子的成长。';
        return `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center">
          <div class="mx-auto grid h-11 w-11 place-items-center rounded-2xl bg-slate-100 text-slate-400">${icon('message-square', 'h-5 w-5')}</div>
          <p class="mt-3 text-[14px] font-bold text-slate-700">${esc(title)}</p>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-400">${esc(sub)}</p>
        </div>`;
      }
      return list.map(messageCard).join('');
    }

    function messageCard(m) {
      const internal = m.visibility === 'INTERNAL';
      const revoked = !!m.revoked;
      const T = revoked ? CARD_TONES.revoked : internal ? CARD_TONES.internal : CARD_TONES.public;
      const rem = revokeRemaining(m);
      const offline = state.online === 'off';
      let actions = '';
      if (!revoked && canRevoke(m) && rem > 0) {
        actions += `<button data-action="revoke" data-id="${m.id}" ${offline ? 'disabled' : ''} class="inline-flex items-center gap-1 rounded-md border px-1.5 py-0.5 text-[12px] font-semibold transition ${T.action} disabled:cursor-not-allowed disabled:opacity-50">${icon('rotate-ccw', 'h-3.5 w-3.5')}<span data-revoke-count data-id="${m.id}">撤回 (${rem}s)</span></button>`;
      }
      if (canAdminDelete()) {
        actions += `<button data-action="admin-delete" data-id="${m.id}" ${offline ? 'disabled' : ''} class="inline-flex items-center gap-1 rounded-md border border-rose-200 bg-white px-1.5 py-0.5 text-[12px] font-semibold text-rose-600 transition hover:bg-rose-50 disabled:cursor-not-allowed disabled:opacity-50">${icon('trash-2', 'h-3.5 w-3.5')}下架</button>`;
      }
      const badge = revoked
        ? `<span class="inline-flex items-center rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${T.badge}">已撤回</span>`
        : internal
          ? `<span class="inline-flex items-center rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${T.badge}">🔒 内部备忘</span>`
          : '';
      const footer = badge || actions
        ? `<div class="mt-2 flex items-center justify-between gap-2">
            <div class="min-w-0">${badge}</div>
            <div class="flex shrink-0 items-center gap-2">${actions}</div>
          </div>`
        : '';
      return `<article class="rounded-2xl border p-3.5 shadow-sm ${T.card}">
        <div class="flex items-start gap-2.5">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full text-[12px] font-bold ${T.avatar}">${esc((m.authorName || '?').charAt(0).toUpperCase())}</span>
          <div class="min-w-0 flex-1">
            <div class="flex items-start justify-between gap-2">
              <div class="flex min-w-0 items-center gap-1.5">
                <span class="truncate text-[14px] font-bold ${T.title}">${esc(m.authorName)}</span>
                <span class="shrink-0 rounded border px-1 py-0.5 text-[12px] font-semibold ${T.roleChip}">${esc(authorRoleLabel(m))}</span>
              </div>
              <span class="shrink-0 text-[12px] font-medium ${T.sub}">${formatTime(m.createdAt)}</span>
            </div>
            <p class="mt-1.5 whitespace-pre-line break-words text-[14px] font-medium leading-relaxed ${T.body}">${esc(m.content)}</p>
            ${footer}
          </div>
        </div>
      </article>`;
    }

    function loadMoreBar() {
      const total = filteredMessages().length;
      const shown = displayedMessages().length;
      if (!total) return '';
      const remain = total - shown;
      if (remain > 0) {
        return `<button data-action="load-more" class="flex h-11 w-full items-center justify-center gap-1.5 rounded-xl border border-slate-200 bg-white text-[14px] font-semibold text-indigo-700 shadow-sm transition hover:bg-slate-50">${icon('chevron-down', 'h-4 w-4')}加载更早留言（还有 ${remain} 条）</button>`;
      }
      return `<div class="py-2 text-center text-[12px] font-medium text-slate-400">— 已展示全部历史交流记录 —</div>`;
    }

    function currentAudit() {
      return state.audit
        .filter((a) => a.studentId === state.studentId)
        .slice()
        .sort((a, b) => b.at - a.at);
    }

    function auditCard() {
      if (!canAdminDelete()) return '';
      const logs = currentAudit();
      if (!logs.length) return '';
      return `<details class="rounded-2xl border border-slate-200/80 bg-white p-3.5 shadow-sm">
        <summary class="flex cursor-pointer list-none items-center justify-between [&::-webkit-details-marker]:hidden">
          <span class="text-[16px] font-bold text-slate-900">下架记录</span>
          <span class="text-[12px] font-medium text-slate-400">${logs.length} 条</span>
        </summary>
        <div class="mt-2.5 space-y-2">
          ${logs.map((a) => `<div class="rounded-xl border border-slate-200 bg-slate-50 p-2.5">
            <div class="flex items-center justify-between gap-2">
              <span class="inline-flex items-center gap-1 rounded-full border border-slate-200 bg-white px-1.5 py-0.5 text-[12px] font-bold text-slate-600">${icon('archive', 'h-3 w-3')}已下架</span>
              <span class="font-mono text-[12px] font-medium text-slate-400">${esc(a.messageId)}</span>
            </div>
            <div class="mt-1 text-[12px] font-medium text-slate-500">${formatTime(a.at)} · ${esc(a.operator)}</div>
            <div class="mt-1 text-[14px] font-semibold text-slate-800">原因：${esc(a.reason)}</div>
            <div class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">原文：${esc(a.snapshot)}</div>
          </div>`).join('')}
        </div>
      </details>`;
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay || state.overlay.type !== 'adminDelete') return '';
      const m = state.messages.find((x) => x.id === state.overlay.messageId);
      if (!m) return '';
      const internal = m.visibility === 'INTERNAL';
      const revoked = !!m.revoked;
      const T = revoked ? CARD_TONES.revoked : internal ? CARD_TONES.internal : CARD_TONES.public;
      const reason = state.deleteReason.trim();
      const reasonOk = reason.length >= 10 && reason.length <= 200;
      const badge = revoked
        ? `<span class="inline-flex items-center rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${T.badge}">已撤回</span>`
        : internal
          ? `<span class="inline-flex items-center rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${T.badge}">🔒 内部备忘</span>`
          : '';
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-4 top-1/2 mx-auto max-w-[420px] -translate-y-1/2 rounded-2xl bg-white p-4 shadow-2xl">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">下架留言</h2>
              <p class="mt-0.5 text-[12px] font-medium text-slate-500">软删除后从列表移除，原文与操作记录将留存于审计日志。</p>
            </div>
            <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="mt-2.5 rounded-xl border p-2.5 ${T.card}">
            <div class="flex items-center justify-between gap-2">
              <div class="flex min-w-0 items-center gap-1.5">
                <span class="truncate text-[12px] font-bold ${T.title}">${esc(m.authorName)}</span>
                <span class="shrink-0 rounded border px-1 py-0.5 text-[12px] font-semibold ${T.roleChip}">${esc(authorRoleLabel(m))}</span>
              </div>
              <span class="shrink-0 text-[12px] font-medium ${T.sub}">${formatTime(m.createdAt)}</span>
            </div>
            <p class="mt-1 line-clamp-3 text-[14px] font-medium leading-relaxed ${T.body}">${esc(m.content)}</p>
            ${badge ? `<div class="mt-1.5">${badge}</div>` : ''}
          </div>
          <div class="mt-3">
            <label for="deleteReason" class="mb-1 block text-[14px] font-semibold text-slate-700">下架原因（至少 10 个字）<span class="text-rose-600">*</span></label>
            <textarea id="deleteReason" maxlength="200" rows="3" placeholder="请说明下架原因，例如涉及学员隐私信息..." class="h-20 w-full resize-none rounded-xl border border-slate-200 bg-white p-2.5 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500">${esc(state.deleteReason)}</textarea>
            <div class="mt-1 flex items-center justify-between">
              <span id="deleteReasonCount" class="font-mono text-[12px] font-medium text-slate-400">${state.deleteReason.length}/200</span>
              <span class="text-[12px] font-medium text-slate-400">将记录操作人、时间、原因与原文</span>
            </div>
          </div>
          ${state.deleteError ? `<div id="deleteError" class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-[12px] font-medium text-rose-700">${esc(state.deleteError)}</div>` : ''}
          <div class="mt-3 flex gap-2">
            <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
            <button id="btnConfirmDelete" data-action="confirm-delete" ${reasonOk ? '' : 'disabled'} class="h-11 flex-1 rounded-xl bg-rose-600 text-[16px] font-semibold text-white transition hover:bg-rose-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认下架</button>
          </div>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 交互
     * ------------------------------------------------------------------ */
    function publishMessage() {
      if (!canPostMessage()) return showToast('当前身份不可发布留言');
      if (state.online === 'off') return showToast('离线模式下不可发布留言');
      const parent = state.role === 'parent';
      const max = parent ? 500 : 1000;
      const text = state.draft.trim();
      if (!text) return showToast('请输入留言内容');
      if (text.length > max) return showToast(`留言不能超过 ${max} 字`);
      const visibility = parent ? 'PUBLIC' : state.internalOnly ? 'INTERNAL' : 'PUBLIC';
      state.messages.unshift({
        id: newId('msg'),
        studentId: state.studentId,
        authorRole: state.role,
        authorName: roleMeta().authorName,
        visibility,
        content: text,
        createdAt: Date.now()
      });
      state.draft = '';
      state.internalOnly = false;
      if (state.viewFilter === 'internal' && visibility !== 'INTERNAL') state.viewFilter = 'all';
      state.visibleCount = 10;
      renderContentOnly(false);
      showToast(parent ? '留言已发送 · 5 分钟内可撤回' : visibility === 'INTERNAL' ? '内部备忘已发布 · 5 分钟内可撤回' : '留言已发布 · 5 分钟内可撤回');
    }

    function revokeMessage(id) {
      if (state.online === 'off') return showToast('离线模式下不可撤回留言');
      const m = state.messages.find((x) => x.id === id);
      if (!m || !canRevoke(m)) return showToast('只能撤回自己发布的留言');
      if (revokeRemaining(m) <= 0) return showToast('已超过 5 分钟撤回时效，无法撤回');
      m.revoked = true;
      renderContentOnly(true);
      showToast('已撤回该条留言');
    }

    function openAdminDelete(id) {
      if (!canAdminDelete()) return;
      if (state.online === 'off') return showToast('离线模式下不可下架留言');
      state.overlay = { type: 'adminDelete', messageId: id };
      state.deleteReason = '';
      state.deleteError = '';
      renderAll();
    }

    function confirmAdminDelete() {
      if (!canAdminDelete()) return;
      if (state.online === 'off') return showToast('离线模式下不可下架留言');
      const reason = state.deleteReason.trim();
      if (reason.length < 10 || reason.length > 200) {
        state.deleteError = '下架原因需为 10-200 个字';
        return renderOverlayOnly();
      }
      const m = state.messages.find((x) => x.id === state.overlay.messageId);
      if (!m) return;
      state.audit.unshift({
        id: newId('aud'),
        messageId: m.id,
        studentId: m.studentId,
        operator: roleMeta().authorName,
        reason,
        snapshot: m.content,
        at: Date.now()
      });
      m.deleted = true;
      state.overlay = null;
      state.deleteReason = '';
      state.deleteError = '';
      renderAll();
      showToast('已下架留言，下架记录已保存');
    }

    function renderOverlayOnly() {
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    function syncInternalToggle() {
      const toggle = $('internalToggle');
      if (!toggle) return;
      state.internalOnly = toggle.checked;
      const label = $('internalLabel');
      if (label) label.className = `text-[12px] font-semibold ${state.internalOnly ? 'text-amber-700' : 'text-slate-600'}`;
      const hint = $('internalHint');
      if (hint) hint.classList.toggle('hidden', !state.internalOnly);
      const ta = $('messageInput');
      if (ta) ta.className = `mt-2 h-24 w-full resize-none rounded-xl border p-3 text-[16px] leading-relaxed text-slate-900 outline-none transition disabled:bg-slate-100 disabled:text-slate-400 ${state.internalOnly ? 'border-amber-300 bg-amber-50/40 focus:border-amber-500' : 'border-slate-200 bg-white focus:border-indigo-500'}`;
    }

    function updateComposerState() {
      const max = state.role === 'parent' ? 500 : 1000;
      const count = $('msgCount');
      if (count) count.textContent = `${state.draft.length}/${max}`;
      const btn = $('btnPublish');
      if (btn) btn.disabled = state.online === 'off' || !state.draft.trim() || state.draft.length > max;
    }

    function updateDeleteState() {
      const count = $('deleteReasonCount');
      if (count) count.textContent = `${state.deleteReason.length}/200`;
      const btn = $('btnConfirmDelete');
      if (btn) btn.disabled = !(state.deleteReason.trim().length >= 10 && state.deleteReason.trim().length <= 200);
      if (state.deleteError) {
        state.deleteError = '';
        const err = $('deleteError');
        if (err) err.remove();
      }
    }

    function navTo(tab) {
      const item = roleMeta().nav.find((n) => n.id === tab);
      if (!item) return;
      state.navTab = tab;
      state.page = item.board ? 'board' : 'placeholder';
      state.overlay = null;
      renderAll();
      const c = $('content'); if (c) c.scrollTop = 0;
    }

    function goBack() {
      showToast('已返回来源页 · 保留滚动位置与搜索条件');
    }

    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'back') return goBack();
      if (action === 'back-board') { state.page = 'board'; state.navTab = roleMeta().boardTab; state.overlay = null; renderAll(); const c = $('content'); if (c) c.scrollTop = 0; return; }
      if (action === 'filter') {
        state.viewFilter = el.dataset.filter === 'internal' ? 'internal' : 'all';
        state.visibleCount = 10;
        return renderContentOnly(false);
      }
      if (action === 'publish') return publishMessage();
      if (action === 'revoke') return revokeMessage(el.dataset.id);
      if (action === 'load-more') {
        state.visibleCount += 10;
        return renderContentOnly(true);
      }
      if (action === 'admin-delete') return openAdminDelete(el.dataset.id);
      if (action === 'close-overlay') { state.overlay = null; state.deleteError = ''; return renderOverlayOnly(); }
      if (action === 'confirm-delete') return confirmAdminDelete();
    });

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'messageInput') {
        state.draft = e.target.value;
        updateComposerState();
      }
      if (id === 'deleteReason') {
        state.deleteReason = e.target.value;
        updateDeleteState();
      }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      if (e.target.id === 'internalToggle') syncInternalToggle();
    });

    /* ------------------------------------------------------------------
     * 300 秒撤回倒计时：本人可见，超时隐藏并从常规流移除
     * ------------------------------------------------------------------ */
    setInterval(() => {
      const list = $('messageList');
      if (!list) return;
      let needRefresh = false;
      document.querySelectorAll('[data-revoke-count]').forEach((el) => {
        const m = state.messages.find((x) => x.id === el.dataset.id);
        if (!m) return;
        const secs = revokeRemaining(m);
        if (secs > 0) el.textContent = `撤回 (${secs}s)`;
        else needRefresh = true;
      });
      if (needRefresh) {
        const c = $('content');
        const top = c ? c.scrollTop : 0;
        list.innerHTML = messageListHtml();
        if (c) c.scrollTop = top;
        if (window.lucide) lucide.createIcons();
      }
    }, 1000);

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2600);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    const initialAllowed = visibleStudents();
    if (!initialAllowed.some((s) => s.id === state.studentId)) state.studentId = initialAllowed[0].id;
    if (state.role === 'parent') state.viewFilter = 'all';
    renderAll();
  </script>
</body>
</html>

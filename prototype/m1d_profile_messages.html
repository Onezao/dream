    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function roleMeta() { return ROLES[state.role]; }
    function studentById(id) { return STUDENTS.find((s) => s.id === id) || STUDENTS[0]; }
    function activeStudent() { return studentById(state.studentId); }
    function visibleStudents() { return roleMeta().students.map(studentById); }
    function canInternal() { return state.role === 'teacher' || state.role === 'monitor'; }
    function canPost() { return state.role !== 'admin'; }
    function canDelete() { return state.role === 'admin'; }
    function authorLabel(role) {
      if (role === 'teacher') return '教师';
      if (role === 'monitor') return '班长';
      if (role === 'parent') return '家长';
      return '管理员';
    }

    function visibleMessages() {
      return state.messages
        .filter((m) => m.studentId === state.studentId && !m.deleted && !m.revoked)
        .filter((m) => state.role !== 'parent' || m.visibility === 'public')
        .sort((a, b) => b.createdAt - a.createdAt);
    }

    function studentCount(sid) {
      return state.messages.filter((m) =>
        m.studentId === sid && !m.deleted && !m.revoked && (state.role !== 'parent' || m.visibility === 'public')
      ).length;
    }

    function displayedMessages() {
      return visibleMessages().slice(0, state.visibleCount);
    }

    function revokeRemaining(m) {
      return Math.max(0, 300 - Math.floor((Date.now() - m.createdAt) / 1000));
    }

    function canRevoke(m) {
      return m.authorRole === state.role && m.authorName === roleMeta().authorName;
    }

    function formatTime(ts) {
      const d = new Date(ts);
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      if (d.toDateString() === now.toDateString()) return `今天 ${hm}`;
      const y = new Date(now);
      y.setDate(now.getDate() - 1);
      if (d.toDateString() === y.toDateString()) return `昨天 ${hm}`;
      return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${hm}`;
    }

    function newId(prefix) {
      return `${prefix}_${Math.random().toString(36).slice(2, 10).padEnd(8, '0')}`;
    }

        if (group === 'role') active = state.role === value;
        if (group === 'student') {
          active = state.studentId === value;
          disabled = !visibleStudents().some((s) => s.id === value);
        }
        if (group === 'device') active = state.device === value;
        if (group === 'online') active = state.online === value;
        b.disabled = disabled;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}${disabled ? ' cursor-not-allowed opacity-40' : ''}`;
      });
    }

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'student') setStudent(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：可查看缓存留言，发布 / 撤回 / 下架不可用');
        }
      });
    });

    function setRole(role) {
      state.role = role; if (role === 'admin') state.device = 'mobile';
      const allowed = visibleStudents();
      if (!allowed.some((s) => s.id === state.studentId)) state.studentId = allowed[0].id;
      state.navTab = roleMeta().boardTab;
      state.page = 'board';
      state.draft = '';
      state.visibility = 'public';
      state.visibleCount = 4;
      state.overlay = null;
      renderAll();
      const c = $('content'); if (c) c.scrollTop = 0;
    }

    function setStudent(id) {
      if (!visibleStudents().some((s) => s.id === id)) return;
      state.studentId = id;
      state.visibleCount = 4;
      state.draft = '';
      state.visibility = 'public';
      state.overlay = null;
      renderAll();
      const c = $('content'); if (c) c.scrollTop = 0;
    }

    function resetDemo() {
      state.role = 'teacher';
      state.studentId = 'stu_alice001';
      state.page = 'board';
      state.navTab = 'students';
      state.device = 'mobile';
      state.online = 'on';
      state.messages = seedMessages();
      state.audit = seedAudit();
      state.draft = '';
      state.visibility = 'public';
      state.visibleCount = 4;
      state.overlay = null;
      state.deleteReason = '';
      state.deleteError = '';
      renderAll();
      const c = $('content'); if (c) c.scrollTop = 0;
      showToast('演示数据已重置');
    }

    $('btnResetDemo').addEventListener('click', resetDemo);

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线模式：可查看缓存留言，发布 / 撤回 / 下架不可用`
        : '';

      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = renderNav();
      $('overlay').innerHTML = renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function renderContentOnly() {
      $('content').innerHTML = renderContent();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function renderBanner() {
      const r = roleMeta();
      return `<header class="relative flex h-[68px] shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${r.banner} px-4 text-white">
        ${r.pattern}
        <div class="relative flex min-w-0 items-center gap-2.5">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${r.initial}</span>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="truncate text-[16px] font-bold">${esc(r.brand)}</span>
              <span class="shrink-0 rounded-full bg-white/20 px-2 py-0.5 text-[12px] font-bold">${esc(r.label)}</span>
            </div>
            <div class="truncate text-[12px] text-white/70">${esc(r.subtitle)}</div>
          </div>
        </div>
        <button data-action="toast" data-message="暂无新消息" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
          ${icon('bell', 'h-4 w-4')}
          <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-rose-400 ring-1 ring-white/50"></span>
        </button>
      </header>`;
    }

    function renderNav() {
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${roleMeta().nav.map((item) => {
            const on = state.navTab === item.id;
            return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-400'}">
              ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
              <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      return `${studentSwitcher()}${renderBoard()}`;
    }

    function renderPlaceholder() {
      const item = roleMeta().nav.find((n) => n.id === state.navTab);
      if (!item) return `<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>`;
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">打开对应原型</a>` : ''}
        <button data-action="back-board" class="mt-3 text-[14px] font-semibold text-indigo-600">返回留言板</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 学员切换
     * ------------------------------------------------------------------ */
    function studentSwitcher() {
      return `<div class="sticky top-0 z-20 border-b border-slate-200/70 bg-slate-50/95 px-4 py-2 backdrop-blur">
        <div class="mx-auto flex w-full max-w-[640px] items-center gap-1 overflow-x-auto">
          <span class="shrink-0 text-[12px] font-semibold text-slate-400">学员</span>
          ${visibleStudents().map((s) => {
            const on = s.id === state.studentId;
            return `<button data-action="switch-student" data-id="${s.id}" class="flex shrink-0 items-center gap-1 rounded-full border px-1.5 py-1 ${on ? 'border-indigo-200 bg-white text-indigo-700 shadow-sm ring-1 ring-indigo-200' : 'border-slate-200 bg-white/70 text-slate-600'}">
              <span class="grid h-5 w-5 place-items-center rounded-full text-[12px] font-bold ${on ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-500'}">${esc(s.nickname.charAt(0))}</span>
              <span class="font-mono text-[12px] font-bold">${esc(s.nickname)}</span>
              <span class="text-[12px] font-medium ${on ? 'text-indigo-700' : 'text-slate-400'}">${studentCount(s.id)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 留言板
     * ------------------------------------------------------------------ */
    function renderBoard() {
      const s = activeStudent();
      const total = visibleMessages().length;
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        <div class="px-1">
          <h1 class="text-[18px] font-bold tracking-tight text-slate-900">教学留言板</h1>
          <p class="mt-0.5 text-[12px] font-medium text-slate-400">${esc(s.nickname)} · 双权限隔离 · 共 ${total} 条</p>
        </div>
        ${state.role === 'admin' ? '' : privacyBanner()}
        ${composer()}
        <div id="messageList" class="space-y-2">${messageListHtml()}</div>
        ${loadMoreButton()}
        ${auditCard()}
      </div>`;
    }

    function privacyBanner() {
      const T = TONES.indigo;
      const parent = state.role === 'parent';
      const admin = state.role === 'admin';
      const text = admin
        ? '管理员审计视图 · 可查看全部留言并下架'
        : parent
          ? '师生公开视图 · 内部教学评语已屏蔽'
          : '双权限：师生公开反馈 / 仅内部教学交接';
      const iconName = admin ? 'shield-check' : parent ? 'shield' : 'lock-keyhole';
      return `<div class="flex items-center gap-2 rounded-xl border ${T.card} px-3 py-2.5">
        <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg ${T.icon}">${icon(iconName, 'h-4 w-4')}</span>
        <span class="min-w-0 flex-1 truncate text-[12px] font-semibold ${T.title}">${esc(text)}</span>
        <span class="shrink-0 rounded-full bg-white/60 px-1.5 py-0.5 font-mono text-[12px] font-bold ${T.sub}">${admin ? '审计' : '300s 撤回'}</span>
      </div>`;
    }

    function composer() {
      if (!canPost()) {
        return `<section class="rounded-2xl border border-indigo-200/70 bg-indigo-50/80 p-3.5 shadow-sm">
          <div class="flex items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-indigo-100 text-indigo-700">${icon('shield-check', 'h-4 w-4')}</span>
            <h2 class="text-[16px] font-bold text-indigo-950">管理员审计视图</h2>
          </div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-indigo-900/85">管理员以审计与争议处置为主：可查看全部公开与内部留言并执行下架；留言发布由教师、班长或家长完成。</p>
        </section>`;
      }
      const parent = state.role === 'parent';
      const offline = state.online === 'off';
      const canSubmit = !offline && state.draft.trim().length > 0 && state.draft.length <= 1000;
      return `<section class="rounded-2xl border border-slate-200/80 bg-white p-3.5 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <h2 class="text-[16px] font-bold text-slate-900">发布留言</h2>
          <span class="shrink-0 text-[12px] font-medium text-slate-400">${parent ? '家长留言固定公开' : '发布后 5 分钟内可撤回'}</span>
        </div>
        ${parent
          ? `<div class="mt-2 flex items-center gap-1.5"><span class="inline-flex items-center gap-1 rounded-md border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">${icon('globe', 'h-3.5 w-3.5')}师生公开</span><span class="text-[12px] font-medium text-slate-400">家长不可发布内部留言</span></div>`
          : `<div class="mt-2 inline-flex rounded-xl bg-slate-100 p-1">
              <button data-action="set-visibility" data-v="public" class="h-8 rounded-lg px-2.5 text-[12px] font-bold ${state.visibility === 'public' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">${icon('globe', 'h-3.5 w-3.5')}师生公开</button>
              <button data-action="set-visibility" data-v="internal" class="h-8 rounded-lg px-2.5 text-[12px] font-bold ${state.visibility === 'internal' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">${icon('lock', 'h-3.5 w-3.5')}仅内部教学可见</button>
            </div>`}
        <textarea id="messageInput" rows="3" maxlength="1000" placeholder="${parent ? '记录孩子的公开学习反馈或与老师互动...' : '写下教学反馈、课堂表现或内部交接备忘...'}" ${offline ? 'disabled' : ''} class="mt-2 h-24 w-full resize-none rounded-xl border border-slate-200 bg-white p-3 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500 disabled:bg-slate-100 disabled:text-slate-400">${esc(state.draft)}</textarea>
        <div class="mt-2 flex items-center justify-between gap-2">
          <span id="msgCount" class="font-mono text-[12px] font-medium text-slate-400">${state.draft.length}/1000</span>
          <button id="btnPublish" data-action="publish" ${canSubmit ? '' : 'disabled'} class="h-11 rounded-xl bg-indigo-600 px-4 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">发布留言</button>
        </div>
        ${offline ? `<p class="mt-1.5 text-[12px] font-medium text-amber-700">离线只读：发布不可用</p>` : ''}
      </section>`;
    }

    function messageListHtml() {
      const list = displayedMessages();
      if (!list.length) {
        return `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-400">暂无留言记录</div>`;
      }
      return list.map(messageCard).join('');
    }

    function messageCard(m) {
      const internal = m.visibility === 'internal';
      const T = internal ? TONES.indigo : TONES.slate;
      const cardCls = internal ? 'rounded-2xl border border-indigo-200/70 bg-indigo-50/80 p-3.5 shadow-sm' : 'rounded-2xl border border-slate-200/80 bg-white p-3.5 shadow-sm';
      const nameCls = internal ? 'text-indigo-950' : 'text-slate-900';
      const bodyCls = internal ? 'text-indigo-900/85' : 'text-slate-700';
      const subCls = internal ? 'text-indigo-700' : 'text-slate-400';
      const avatarCls = internal ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-600';
      const roleChip = internal ? 'border-indigo-200 bg-indigo-100 text-indigo-800' : 'border-slate-200 bg-slate-100 text-slate-600';
      const badge = internal
        ? `<span class="inline-flex items-center gap-1 rounded-full border border-indigo-200 bg-indigo-100 px-1.5 py-0.5 text-[12px] font-bold text-indigo-800">${icon('lock', 'h-3 w-3')}仅内部</span>`
        : `<span class="inline-flex items-center gap-1 rounded-full border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">${icon('globe', 'h-3 w-3')}师生公开</span>`;
      const rem = revokeRemaining(m);
      const author = canRevoke(m);
      const offline = state.online === 'off';
      let actions = '';
      if (author && rem > 0) {
        actions += `<button data-action="revoke" data-id="${m.id}" ${offline ? 'disabled' : ''} class="inline-flex items-center gap-1 rounded-md border px-1.5 py-0.5 text-[12px] font-semibold ${internal ? 'border-indigo-300 bg-white/70 text-indigo-800' : 'border-slate-200 bg-slate-100 text-slate-700'} disabled:cursor-not-allowed disabled:opacity-50">${icon('rotate-ccw', 'h-3 w-3')}<span data-revoke-count data-id="${m.id}">撤回 (${rem}s)</span></button>`;
      }
      if (author && rem <= 0) {
        actions += `<span class="text-[12px] font-medium ${subCls}">撤回时效已过</span>
          <button data-action="revoke-expired" ${offline ? 'disabled' : ''} class="text-[12px] font-semibold underline ${internal ? 'text-indigo-700' : 'text-slate-500'} disabled:cursor-not-allowed disabled:opacity-50">尝试撤回</button>`;
      }
      if (canDelete()) {
        actions += `<button data-action="admin-delete" data-id="${m.id}" ${offline ? 'disabled' : ''} class="inline-flex items-center gap-1 text-[12px] font-semibold ${internal ? 'text-indigo-700 hover:text-indigo-900' : 'text-rose-600 hover:text-rose-800'} disabled:cursor-not-allowed disabled:opacity-50">${icon('trash-2', 'h-3 w-3')}下架</button>`;
      }
      return `<article class="${cardCls}">
        <div class="flex items-start gap-2.5">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full text-[12px] font-bold ${avatarCls}">${esc((m.authorName || '?').charAt(0).toUpperCase())}</span>
          <div class="min-w-0 flex-1">
            <div class="flex items-center justify-between gap-2">
              <div class="flex min-w-0 items-center gap-1.5">
                <span class="truncate text-[14px] font-bold ${nameCls}">${esc(m.authorName)}</span>
                <span class="shrink-0 rounded border px-1 py-0.5 text-[12px] font-semibold ${roleChip}">${authorLabel(m.authorRole)}</span>
              </div>
              <span class="shrink-0 text-[12px] font-medium ${subCls}">${formatTime(m.createdAt)}</span>
            </div>
            <p class="mt-1.5 whitespace-pre-line break-words text-[14px] font-medium leading-relaxed ${bodyCls}">${esc(m.content)}</p>
            <div class="mt-2 flex items-center justify-between gap-2">
              ${badge}
              <div class="flex shrink-0 items-center gap-2">${actions}</div>
            </div>
          </div>
        </div>
      </article>`;
    }

    function loadMoreButton() {
      const total = visibleMessages().length;
      const shown = displayedMessages().length;
      if (shown >= total) return '';
      return `<button data-action="load-more" class="flex w-full items-center justify-center gap-1.5 rounded-xl border border-slate-200 bg-white py-2.5 text-[12px] font-bold text-indigo-700 hover:bg-slate-50">${icon('chevron-down', 'h-3.5 w-3.5')}加载更早留言（剩余 ${total - shown} 条）</button>`;
    }

    function auditCard() {
      if (!canDelete() || !state.audit.length) return '';
      return `<details class="rounded-2xl border border-slate-200/80 bg-white p-3.5 shadow-sm">
        <summary class="flex cursor-pointer list-none items-center justify-between [&::-webkit-details-marker]:hidden">
          <span class="text-[16px] font-bold text-slate-900">下架审计</span>
          <span class="text-[12px] font-medium text-slate-400">${state.audit.length} 条</span>
        </summary>
        <div class="mt-2.5 space-y-2">
          ${state.audit.map((a) => `<div class="rounded-xl border border-slate-200 bg-slate-50 p-2.5">
            <div class="flex items-center justify-between gap-2">
              <span class="inline-flex items-center gap-1 rounded-full border border-rose-200 bg-rose-50 px-1.5 py-0.5 text-[12px] font-bold text-rose-700">${icon('trash-2', 'h-3 w-3')}已下架</span>
              <span class="font-mono text-[12px] font-medium text-slate-400">${esc(a.messageId)}</span>
            </div>
            <div class="mt-1 text-[12px] font-medium text-slate-500">${formatTime(a.at)} · ${esc(a.operator)} · ${esc(studentById(a.studentId).nickname)}</div>
            <div class="mt-1 text-[14px] font-semibold text-slate-800">原因：${esc(a.reason)}</div>
            <div class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">原文：${esc(a.snapshot)}</div>
          </div>`).join('')}
        </div>
      </details>`;
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay || state.overlay.type !== 'adminDelete') return '';
      const m = state.messages.find((x) => x.id === state.overlay.messageId);
      if (!m) return '';
      const internal = m.visibility === 'internal';
      const reasonOk = state.deleteReason.trim().length >= 2 && state.deleteReason.trim().length <= 200;
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-4 top-1/2 mx-auto max-w-[420px] -translate-y-1/2 rounded-2xl bg-white p-4 shadow-2xl">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">下架争议留言</h2>
              <p class="mt-0.5 text-[12px] font-medium text-slate-500">软删除并写入审计日志，原文快照永久留存</p>
            </div>
            <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="mt-2.5 rounded-xl border p-2.5 ${internal ? 'border-indigo-200/70 bg-indigo-50/80' : 'border-slate-200 bg-slate-50'}">
            <div class="flex items-center gap-1.5">
              <span class="text-[12px] font-bold ${internal ? 'text-indigo-950' : 'text-slate-800'}">${esc(m.authorName)}</span>
              <span class="text-[12px] font-medium ${internal ? 'text-indigo-700' : 'text-slate-400'}">${authorLabel(m.authorRole)} · ${internal ? '仅内部' : '师生公开'}</span>
            </div>
            <p class="mt-1 line-clamp-3 text-[14px] font-medium leading-relaxed ${internal ? 'text-indigo-900/85' : 'text-slate-700'}">${esc(m.content)}</p>
            <div class="mt-1 font-mono text-[12px] ${internal ? 'text-indigo-700' : 'text-slate-400'}">${esc(m.id)}</div>
          </div>
          <div class="mt-3">
            <label for="deleteReason" class="mb-1 block text-[14px] font-semibold text-slate-700">下架原因（2-200 字）<span class="text-rose-500">*</span></label>
            <textarea id="deleteReason" maxlength="200" rows="3" placeholder="请输入下架原因，例如涉及学员隐私信息..." class="h-20 w-full resize-none rounded-xl border border-slate-200 bg-white p-2.5 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500">${esc(state.deleteReason)}</textarea>
            <div class="mt-1 flex items-center justify-between">
              <span id="deleteReasonCount" class="font-mono text-[12px] font-medium text-slate-400">${state.deleteReason.length}/200</span>
              <span class="text-[12px] font-medium text-slate-400">将记录操作人 / 留言 ID / 原因 / 原文</span>
            </div>
          </div>
          ${state.deleteError ? `<div id="deleteError" class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-[12px] font-medium text-rose-700">${esc(state.deleteError)}</div>` : ''}
          <div class="mt-3 flex gap-2">
            <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
            <button id="btnConfirmDelete" data-action="confirm-delete" ${reasonOk ? '' : 'disabled'} class="h-11 flex-1 rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认下架</button>
          </div>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 交互
     * ------------------------------------------------------------------ */
    function publishMessage() {
      if (!canPost()) return showToast('当前身份不可发布留言');
      if (state.online === 'off') return showToast('离线模式下不可发布留言');
      const text = state.draft.trim();
      if (!text) return showToast('请输入留言内容');
      if (text.length > 1000) return showToast('留言不能超过 1000 字符');
      const visibility = state.role === 'parent' ? 'public' : state.visibility;
      state.messages.unshift({
        id: newId('msg'),
        studentId: state.studentId,
        authorRole: state.role,
        authorName: roleMeta().authorName,
        visibility,
        content: text,
        createdAt: Date.now()
      });
      state.draft = '';
      state.visibleCount = Math.max(4, state.visibleCount);
      renderContentOnly();
      showToast('留言已发布 · 5 分钟内可撤回');
    }

    function revokeMessage(id) {
      if (state.online === 'off') return showToast('离线模式下不可撤回留言');
      const m = state.messages.find((x) => x.id === id);
      if (!m || !canRevoke(m)) return showToast('仅发布者可在时效内撤回');
      if (revokeRemaining(m) <= 0) return showToast('403 MESSAGE_REVOKE_WINDOW_EXPIRED · 已超过 300 秒撤回时效');
      m.revoked = true;
      renderContentOnly();
      showToast('已撤回该条留言并从界面移除');
    }

    function attemptExpired() {
      showToast('403 MESSAGE_REVOKE_WINDOW_EXPIRED · 已超过 300 秒撤回时效');
    }

    function openAdminDelete(id) {
      if (!canDelete()) return;
      if (state.online === 'off') return showToast('离线模式下不可下架留言');
      state.overlay = { type: 'adminDelete', messageId: id };
      state.deleteReason = '';
      state.deleteError = '';
      renderAll();
    }

    function confirmAdminDelete() {
      if (!canDelete()) return;
      if (state.online === 'off') return showToast('离线模式下不可下架留言');
      const reason = state.deleteReason.trim();
      if (reason.length < 2 || reason.length > 200) {
        state.deleteError = '下架原因需为 2-200 字';
        return renderOverlayOnly();
      }
      const m = state.messages.find((x) => x.id === state.overlay.messageId);
      if (!m) return;
      state.audit.unshift({
        id: newId('aud'),
        messageId: m.id,
        studentId: m.studentId,
        operator: roleMeta().authorName,
        reason,
        snapshot: m.content,
        at: Date.now()
      });
      m.deleted = true;
      state.overlay = null;
      state.deleteReason = '';
      renderAll();
      showToast('已下架留言 · 审计日志已记录操作人 / 留言 ID / 原因 / 原文');
    }

    function renderOverlayOnly() {
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    function setVisibility(v) {
      if (!canInternal() || (v !== 'public' && v !== 'internal')) return;
      state.visibility = v;
      document.querySelectorAll('[data-action="set-visibility"]').forEach((b) => {
        const on = b.dataset.v === v;
        b.className = `h-8 rounded-lg px-2.5 text-[12px] font-bold ${on ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}`;
      });
    }

    function updateComposerState() {
      const count = $('msgCount');
      if (count) count.textContent = `${state.draft.length}/1000`;
      const btn = $('btnPublish');
      if (btn) btn.disabled = state.online === 'off' || !state.draft.trim() || state.draft.length > 1000;
    }

    function updateDeleteState() {
      const count = $('deleteReasonCount');
      if (count) count.textContent = `${state.deleteReason.length}/200`;
      const btn = $('btnConfirmDelete');
      if (btn) btn.disabled = !(state.deleteReason.trim().length >= 2 && state.deleteReason.trim().length <= 200);
      state.deleteError = '';
      const err = $('deleteError');
      if (err) err.remove();
    }

    function navTo(tab) {
      const item = roleMeta().nav.find((n) => n.id === tab);
      if (!item) return;
      state.navTab = tab;
      state.page = item.board ? 'board' : 'placeholder';
      state.overlay = null;
      renderAll();
      const c = $('content'); if (c) c.scrollTop = 0;
    }

    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'back-board') { state.page = 'board'; state.navTab = roleMeta().boardTab; state.overlay = null; renderAll(); const c = $('content'); if (c) c.scrollTop = 0; return; }
      if (action === 'switch-student') return setStudent(el.dataset.id);
      if (action === 'set-visibility') return setVisibility(el.dataset.v);
      if (action === 'publish') return publishMessage();
      if (action === 'revoke') return revokeMessage(el.dataset.id);
      if (action === 'revoke-expired') return attemptExpired();
      if (action === 'load-more') {
        state.visibleCount += 4;
        return renderContentOnly();
      }
      if (action === 'admin-delete') return openAdminDelete(el.dataset.id);
      if (action === 'close-overlay') { state.overlay = null; return renderOverlayOnly(); }
      if (action === 'confirm-delete') return confirmAdminDelete();
    });

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'messageInput') {
        state.draft = e.target.value;
        updateComposerState();
      }
      if (id === 'deleteReason') {
        state.deleteReason = e.target.value;
        updateDeleteState();
      }
    });

    /* ------------------------------------------------------------------
     * 300 秒撤回倒计时
     * ------------------------------------------------------------------ */
    setInterval(() => {
      const list = $('messageList');
      if (!list) return;
      let needRefresh = false;
      document.querySelectorAll('[data-revoke-count]').forEach((el) => {
        const m = state.messages.find((x) => x.id === el.dataset.id);
        if (!m) return;
        const secs = revokeRemaining(m);
        if (secs > 0) el.textContent = `撤回 (${secs}s)`;
        else needRefresh = true;
      });
      if (needRefresh) {
        list.innerHTML = messageListHtml();
        if (window.lucide) lucide.createIcons();
      }
    }, 1000);

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2600);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

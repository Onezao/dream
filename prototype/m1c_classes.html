      emerald: { card: 'border-emerald-200/70 bg-emerald-50/80', chip: 'border-emerald-200 bg-emerald-100 text-emerald-800', icon: 'bg-emerald-100 text-emerald-700', action: 'bg-emerald-600 text-white hover:bg-emerald-700', title: 'text-emerald-950', body: 'text-emerald-900/85', sub: 'text-emerald-700', right: 'text-emerald-950' },
      rose: { card: 'border-rose-200/70 bg-rose-50/80', chip: 'border-rose-200 bg-rose-100 text-rose-800', icon: 'bg-rose-100 text-rose-700', action: 'bg-rose-600 text-white hover:bg-rose-700', title: 'text-rose-950', body: 'text-rose-900/85', sub: 'text-rose-700', right: 'text-rose-950' },
      slate: { card: 'border-slate-200/80 bg-slate-50', chip: 'border-slate-200 bg-slate-100 text-slate-700', icon: 'bg-slate-100 text-slate-600', action: 'bg-slate-900 text-white hover:bg-slate-800', title: 'text-slate-900', body: 'text-slate-700', sub: 'text-slate-500', right: 'text-slate-900' }
    };

    const SOFT_BTN = {
      amber: 'border-amber-300 bg-white/70 text-amber-800 hover:bg-white',
      indigo: 'border-indigo-300 bg-white/70 text-indigo-800 hover:bg-white',

      rose: 'border-rose-300 bg-white/70 text-rose-800 hover:bg-white',
      slate: 'border-slate-300 bg-white/70 text-slate-700 hover:bg-white'
    };

    /* ------------------------------------------------------------------
     * 状态与工具
     * ------------------------------------------------------------------ */
    const $ = (id) => document.getElementById(id);
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function emptyCreate() {
      return {
        name: '', courseType: 'KET', teacherId: 'tc_david0001', ownerMonitorId: CURRENT_MONITOR_ID,
        max: '4', salary: '30', rate: '10.00', total: '80', sourceClassId: '', error: ''
      };
    }

    function emptyDissolve() {
      return { reason: '', disposition: '', note: '', screenshots: 0, confirmed: false };
    }

    const state = {
      role: 'monitor',
      page: 'classes',
      navTab: 'ops',
      device: 'mobile',
      online: 'on',
      classes: clone(INITIAL_CLASSES),
      activeClassId: 'cls_ket00001',
      classView: 'owned',
      filter: 'all',
      teacherFilter: 'all',
      create: emptyCreate(),
      dissolve: emptyDissolve(),
      appoint: { classId: '', selected: '' },
      logOpen: false,
      overlay: null
    };

    const params = new URLSearchParams(location.search);
    if (params.get('role') && ['monitor', 'admin', 'parent'].includes(params.get('role'))) {
      state.role = params.get('role') === 'parent' ? 'monitor' : params.get('role');
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
    }
    if (params.get('page')) state.page = params.get('page');
    if (params.get('filter')) state.filter = params.get('filter');
    if (params.get('class_view') === 'involved') state.classView = 'involved';
    if (params.get('class_id')) state.activeClassId = params.get('class_id');
    if (params.get('log') === '1') state.logOpen = true;
    if (params.get('device') === 'tablet') state.device = 'tablet';

    function currentNav() {
      return NAVS[state.role];
    }

    function teacherById(id) {
      return TEACHERS.find((t) => t.id === id) || null;
    }

    function monitorById(id) {
      return MONITORS.find((m) => m.id === id) || null;
    }

    function classById(id) {
      return state.classes.find((c) => c.id === id) || null;
    }

    function currentOperatorName() {
      return state.role === 'admin' ? '管理员 Sarah' : 'Leo';
    }

    function allClasses() {
      return state.classes;
    }

    function isAdmin() {
      return state.role === 'admin';
    }

    function ownsClass(c) {
      return isAdmin() || c.ownerMonitorId === CURRENT_MONITOR_ID;
    }

    function isSharedReadOnly(c) {
      return !isAdmin() && c.ownerMonitorId !== CURRENT_MONITOR_ID && c.teacherMonitorId === CURRENT_MONITOR_ID;
    }

    function scopeClasses() {
      if (isAdmin()) return allClasses();
      if (state.classView === 'involved') {
        return state.classes.filter((c) => c.teacherMonitorId === CURRENT_MONITOR_ID && c.ownerMonitorId !== CURRENT_MONITOR_ID);
      }
      return state.classes.filter((c) => c.ownerMonitorId === CURRENT_MONITOR_ID);
    }

    function viewableClasses() {
      if (isAdmin()) return allClasses();
      return state.classes.filter((c) => c.ownerMonitorId === CURRENT_MONITOR_ID || c.teacherMonitorId === CURRENT_MONITOR_ID);
    }

    /* 外教筛选条：全平台参与过小班课授课的在职外教，不收敛到当前主理人私域 */
    function teacherFilterOptions() {
      const participating = TEACHERS.filter((t) => t.active && state.classes.some((c) => c.teacherId === t.id));
      const scoped = scopeClasses();
      return participating.map((t) => ({
        ...t,
        count: scoped.filter((c) => c.teacherId === t.id).length
      })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
    }

    function teacherScopedClasses() {
      const list = scopeClasses();
      return state.teacherFilter === 'all' ? list : list.filter((c) => c.teacherId === state.teacherFilter);
    }

    function filteredClasses() {
      const list = teacherScopedClasses();
      return state.filter === 'all' ? list : list.filter((c) => c.status === state.filter);
    }

    function ensureTeacherFilter() {
      if (state.teacherFilter === 'all') return;
      if (!teacherFilterOptions().some((t) => t.id === state.teacherFilter)) state.teacherFilter = 'all';
    }

    function ensureActiveClass() {
      const list = viewableClasses();
      if (list.some((c) => c.id === state.activeClassId)) return;
      state.activeClassId = list[0] ? list[0].id : '';
    }

    function classTeacher(c) {
      return teacherById(c.teacherId);
    }

    function teacherMonitor(c) {
      return monitorById(c.teacherMonitorId);
    }

    function classOwner(c) {
      return monitorById(c.ownerMonitorId) || { name: '—' };
    }

    function points(n) {
      const v = Math.round((Number(n) + Number.EPSILON) * 100) / 100;
      return Number.isInteger(v) ? String(v) : v.toFixed(2);
    }

    function calcFinance(f) {
      const max = Number(f.max) || 0;
      const salary = Number(f.salary) || 0;
      const rate = Number(f.rate) || 0;
      const total = Number(f.total) || 0;
      const toolFee = max * 6;
      const net = total - salary - toolFee;
      const platformShare = net > 0 ? Math.round(net * rate) / 100 : 0;
      const retained = net - platformShare;
      const transfer = salary + toolFee + platformShare;
      return { max, salary, rate, total, toolFee, net, platformShare, retained, transfer };
    }

    function statusMeta(c) {
      if (c.status === 'archived') return { label: '已归档', tone: 'slate' };
      if (c.status === 'early_terminated') return { label: '已提前解散', tone: 'rose' };
      return { label: '正式开课', tone: 'emerald' };
    }

    function classTone(c) {
      if (c.status === 'archived') return 'slate';
      if (c.status === 'early_terminated') return 'rose';
      if (!c.teacherId) return 'rose';
      return 'amber';
    }

    function reasonLabel(id) {
      return DISSOLVE_REASONS.find((r) => r.id === id)?.label || '—';
    }

    function dispositionLabel(id) {
      return DISSOLVE_DISPOSITIONS.find((d) => d.id === id)?.label || '—';
    }

    function chip(label, tone) {
      return `<span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${TONES[tone].chip}">${esc(label)}</span>`;
    }

    function newClassId() {
      return `cls_${Math.random().toString(36).slice(2, 10).padEnd(8, '0')}`;
    }

    function teacherOptions() {
      return TEACHERS.filter((t) => t.active);
    }

    function monitorOptions() {
      return MONITORS;
    }

    function appendAudit(c, action, summary) {
      if (!Array.isArray(c.auditLog)) c.auditLog = [];
      c.auditLog.push({ at: `${TODAY} ${new Date().toTimeString().slice(0, 5)}`, action, operator: currentOperatorName(), summary });
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function currentViewKey() {
      if (state.page === 'placeholder') return '';
      if (state.page === 'create') return 'create';
      if (state.page === 'detail') return 'detail';
      if (state.page === 'classes') return 'classes';
      return '';
    }

    function syncConsole() {
      const view = currentViewKey();
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const value = b.dataset.value;
        let active = false;
        if (group === 'role') active = state.role === value;
        if (group === 'view') active = view === value;
        if (group === 'device') active = state.device === value;
        if (group === 'online') active = state.online === value;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;
      });
    }

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'view') setView(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：可浏览班级，创建、委任、归档、解散与整班停课不可用');
        }
      });
    });

    function setRole(role) {
      state.role = role;
      if (role === 'admin') state.device = 'mobile';
      state.page = 'classes';
      state.navTab = role === 'admin' ? 'settings' : 'ops';
      state.classView = 'owned';
      state.filter = 'all';
      state.teacherFilter = 'all';
      state.logOpen = false;
      state.overlay = null;
      ensureActiveClass();
      renderAll();
    }

    function setView(view) {
      if (view === 'classes') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      }
      if (view === 'detail') {
        if (!viewableClasses().length) {
          showToast('暂无可查看的班级');
          state.page = 'classes';
        } else {
          ensureActiveClass();
          state.page = 'detail';
          state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        }
      }
      if (view === 'create') {
        openCreate();
        return;
      }
      state.overlay = null;
      renderAll();
    }

    function resetDemo() {
      state.role = 'monitor';
      state.page = 'classes';
      state.navTab = 'ops';
      state.device = 'mobile';
      state.online = 'on';
      state.classes = clone(INITIAL_CLASSES);
      state.activeClassId = 'cls_ket00001';
      state.classView = 'owned';
      state.filter = 'all';
      state.teacherFilter = 'all';
      state.create = emptyCreate();
      state.dissolve = emptyDissolve();
      state.appoint = { classId: '', selected: '' };
      state.logOpen = false;
      state.overlay = null;
      renderAll();
      showToast('演示数据已重置');
    }

    $('btnResetDemo').addEventListener('click', resetDemo);

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线模式：可浏览班级，创建、委任、归档、解散与整班停课不可用`
        : '';

      ensureTeacherFilter();
      ensureActiveClass();
      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = state.page === 'create' ? '' : renderNav();
      $('overlay').innerHTML = renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function bannerTitle() {
      if (state.page === 'detail') return '班级详情';
      if (state.page === 'create') return '创建小班课';
      if (state.page === 'placeholder') return currentNav().find((n) => n.id === state.navTab)?.label || '小班课中心';
      return '小班课中心';
    }

    function renderBanner() {
      const b = BANNERS[state.role];

      const backAction = state.page === 'create' ? 'cancel-create' : 'back-classes';
      return `<header class="relative flex h-[60px] shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${b.gradient} px-4 text-white">

        <div class="relative flex min-w-0 items-center gap-2.5">
          ${canBack
            ? `<button data-action="${backAction}" class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="返回">${icon('chevron-left', 'h-5 w-5')}</button>`
            : `<span class="grid h-8 w-8 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${b.initial}</span>`}
          <div class="truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</div>

        </button>
      </header>`;

    function renderNav() {
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${currentNav().map((item) => {
            const on = state.navTab === item.id;
            return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-400'}">
              ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}

            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.page === 'create') return renderCreatePage();
      if (state.page === 'detail') return renderClassDetail();
      return renderClasses();
    }

    function renderPlaceholder() {
      const item = currentNav().find((n) => n.id === state.navTab);
      if (!item) return `<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>`;
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>

        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">前往${esc(item.label)}</a>` : ''}

      </div>`;

      const owned = allClasses().filter((c) => c.ownerMonitorId === CURRENT_MONITOR_ID).length;
      const involved = allClasses().filter((c) => c.teacherMonitorId === CURRENT_MONITOR_ID && c.ownerMonitorId !== CURRENT_MONITOR_ID).length;

      </div>`;
    }

      const total = scopeClasses().length;
      const items = [
        { id: 'all', name: '全部老师', count: total },

    function renderStatusTabs() {
      const list = teacherScopedClasses();
      const tabs = [
        ['all', '全部', list.length],
        ['active', '正式开课', list.filter((c) => c.status === 'active').length],
        ['archived', '已归档', list.filter((c) => c.status === 'archived').length],
        ['early_terminated', '已提前解散', list.filter((c) => c.status === 'early_terminated').length]
      ];
      return `<div class="flex gap-1 rounded-2xl bg-slate-200/60 p-1">

      </div>`;
    }

    function renderClasses() {
      const scoped = scopeClasses();
      const teacherScoped = teacherScopedClasses();
      const filtered = filteredClasses();
      const kpiActive = filtered.filter((c) => c.status === 'active');
      const futureTotal = kpiActive.reduce((s, c) => s + c.futureTs, 0);
      const moneyTotal = kpiActive.reduce((s, c) => {
        const f = calcFinance(c);
        if (isAdmin()) return s + f.platformShare;
        if (state.classView === 'involved') return s + f.salary * c.futureTs;
        return s + f.retained;
      }, 0);
      const readOnly = !isAdmin() && state.classView === 'involved';
      const tablet = state.device === 'tablet';
      const offline = state.online === 'off';
      const emptyState = state.teacherFilter !== 'all'
        ? `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-8 text-center">
            <div class="mx-auto grid h-10 w-10 place-items-center rounded-xl bg-slate-100 text-slate-400">${icon('user-x', 'h-5 w-5')}</div>

          </div>`
        : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-400">暂无符合条件的班级</div>`;
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${isAdmin() ? '' : renderClassViewSegment()}
        <div class="flex items-center justify-between gap-2">

    }

    function financeCard(fin, title, showFormula = false) {
      const positive = fin.net > 0;
      const T = TONES[positive ? 'emerald' : 'rose'];
      return `<section class="rounded-2xl border ${T.card} p-3.5 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="grid h-8 w-8 place-items-center rounded-xl ${T.icon}">${icon('calculator', 'h-4 w-4')}</span>
            <h2 class="text-[16px] font-bold ${T.title}">${esc(title)}</h2>
          </div>
          <span class="text-[12px] font-medium ${T.sub}">Max × 6 工具费</span>
        </div>
        <div class="mt-2.5 grid grid-cols-2 gap-1.5">
          ${financeTile('单节实收', points(fin.total), T)}
          ${financeTile('教师单节课酬', points(fin.salary), T)}
          ${financeTile('平台固定工具费', points(fin.toolFee), T)}
          ${financeTile('单节净盈余', points(fin.net), T)}
        </div>
        <div class="mt-2 space-y-1 rounded-xl bg-white/60 px-2.5 py-2 text-[12px] font-medium ${T.body}">
          <div class="flex items-center justify-between gap-2"><span>平台服务分成比例 (${points(fin.rate)}%)</span><span class="font-mono font-bold ${T.right}">${points(fin.platformShare)}</span></div>
          <div class="flex items-center justify-between gap-2"><span>${positive ? '主理人留存收益' : '差额由主理人补足'}</span><span class="font-mono font-bold ${T.right}">${points(positive ? fin.retained : Math.abs(fin.net))}</span></div>
          <div class="flex items-center justify-between gap-2 border-t border-black/5 pt-1"><span>周度上交金额</span><span class="font-mono font-bold ${T.right}">${points(fin.transfer)}</span></div>
        </div>
        ${showFormula ? `<p class="mt-1.5 text-[12px] font-medium leading-relaxed ${T.sub}">净盈余 = 单节实收 − 教师课酬 − Max×6；盈余按平台服务分成比例分成，若为负则差额由主理人补足。</p>` : ''}

    function renderAuditLog(c) {
      const logs = Array.isArray(c.auditLog) ? c.auditLog : [];
      return `<section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
        <button data-action="toggle-log" class="flex w-full items-center justify-between gap-2 text-left">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-indigo-100 text-indigo-700">${icon('history', 'h-4 w-4')}</span>

          </div>

        </button>
        ${state.logOpen ? `<div class="mt-3 space-y-3">
          ${logs.length ? logs.map((log) => `<div class="flex gap-2.5">
            <span class="mt-1 h-2 w-2 shrink-0 rounded-full bg-indigo-500"></span>

              <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5">

    /* ------------------------------------------------------------------
     * 创建班级
     * ------------------------------------------------------------------ */
    function renderCreatePage() {
      const f = state.create;
      const inputCls = 'h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500';
      const teachers = teacherOptions();

      const fin = calcFinance(f);
      const selectedTeacher = teacherById(f.teacherId);
      const bindingMonitor = selectedTeacher ? monitorById(selectedTeacher.monitorId) : null;
      const source = f.sourceClassId ? classById(f.sourceClassId) : null;
      return `<div class="flex h-full min-h-0 flex-col">
        <div class="min-h-0 flex-1 overflow-y-auto">
          <div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[14px] font-medium text-slate-500">建班即生效</span>
              <span class="text-[12px] font-medium ${state.online === 'off' ? 'text-rose-600' : 'text-slate-400'}">${state.online === 'off' ? '离线不可创建' : '不关联学生档案与家长账号'}</span>
            </div>

            ${source ? `<div class="rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3 py-2.5 shadow-sm">
              <div class="flex items-start gap-2.5">
                <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-indigo-100 text-indigo-700">${icon('arrow-right-left', 'h-4 w-4')}</span>
                <div class="min-w-0">
                  <div class="text-[14px] font-bold text-indigo-950">承接原班级：${esc(source.name)}</div>
                  <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-indigo-900/85">原班已提前结课解散，剩余 ${points(source.unsettledTs)} 节。请委任新外教，并录入线下多退少补后的单节实收。</p>
                </div>
              </div>
            </div>` : ''}

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
              <h2 class="text-[16px] font-bold text-slate-900">基本信息</h2>
              <div class="mt-2.5 space-y-3">
                <div>
                  <label for="fClassName" class="mb-1 block text-[14px] font-semibold text-slate-700">班级名称 <span class="text-rose-500">*</span></label>
                  <input id="fClassName" value="${esc(f.name)}" maxlength="64" placeholder="如 KET 冲刺精讲小班" class="${inputCls}">
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label for="fCourseType" class="mb-1 block text-[14px] font-semibold text-slate-700">课程类型 <span class="text-rose-500">*</span></label>
                    <select id="fCourseType" class="${inputCls} font-medium">${COURSE_TYPES.map((t) => `<option ${f.courseType === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
                  </div>
                  <div>
                    <label for="fTeacher" class="mb-1 block text-[14px] font-semibold text-slate-700">授课老师</label>
                    <select id="fTeacher" class="${inputCls} font-medium">
                      <option value="" ${!f.teacherId ? 'selected' : ''}>暂不绑定老师（待委任）</option>
                      ${teachers.map((t) => `<option value="${t.id}" ${f.teacherId === t.id ? 'selected' : ''}>${esc(t.name)} · ${esc(t.level)}</option>`).join('')}
                    </select>
                  </div>
                </div>
                <div>
                  <label class="mb-1 block text-[14px] font-semibold text-slate-700">外教绑定班长</label>
                  ${bindingMonitor
                    ? `<div class="flex h-11 items-center justify-between rounded-xl border border-slate-200 bg-slate-100 px-3 text-[14px] font-medium text-slate-600"><span>${esc(bindingMonitor.name)}</span><span class="flex items-center gap-1 text-[12px] text-slate-400">${icon('link', 'h-3.5 w-3.5')}系统自动带出</span></div>`
                    : `<div class="flex h-11 items-center justify-between rounded-xl border border-dashed border-slate-300 bg-slate-50 px-3 text-[14px] font-medium text-slate-500"><span>暂未委任</span><span class="text-[12px] text-slate-400">建班后可委任</span></div>`}
                </div>
                <div>
                  <label for="fOwnerMonitor" class="mb-1 block text-[14px] font-semibold text-slate-700">主理人 <span class="text-rose-500">*</span></label>
                  ${isAdmin()
                    ? `<select id="fOwnerMonitor" class="${inputCls} font-medium">${monitors.map((m) => `<option value="${m.id}" ${f.ownerMonitorId === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>`
                    : `<div class="flex h-11 items-center justify-between rounded-xl border border-slate-200 bg-slate-100 px-3 text-[14px] font-medium text-slate-600"><span>Leo（当前登录）</span>${icon('lock', 'h-3.5 w-3.5 text-slate-400')}</div>`}
                </div>
              </div>
            </section>

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
              <div class="flex items-center justify-between">
                <h2 class="text-[16px] font-bold text-slate-900">班级规模</h2>
                <span class="text-[12px] font-medium text-slate-400">2–20 人</span>
              </div>
              <div class="mt-2.5">
                <label for="fMax" class="mb-1 block text-[14px] font-semibold text-slate-700">最大学生数 Max <span class="text-rose-500">*</span></label>
                <input id="fMax" type="number" min="2" max="20" step="1" value="${esc(f.max)}" class="${inputCls}">
                <p id="toolFeeInline" class="mt-1 text-[12px] font-medium text-slate-400">平台固定工具费 = Max × 6 = <span class="font-mono font-bold text-slate-700">${points(fin.toolFee)}</span> 积分</p>
              </div>
            </section>

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
              <h2 class="text-[16px] font-bold text-slate-900">财务参数</h2>
              <div class="mt-2.5 space-y-3">
                <div>
                  <label for="fSalary" class="mb-1 block text-[14px] font-semibold text-slate-700">教师单节课酬积分 <span class="text-rose-500">*</span></label>
                  <input id="fSalary" type="number" min="0" step="1" value="${esc(f.salary)}" class="${inputCls}">
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label for="fRate" class="mb-1 block text-[14px] font-semibold text-slate-700">平台服务分成比例 R% <span class="text-rose-500">*</span></label>
                    <input id="fRate" type="number" min="0" max="100" step="0.01" value="${esc(f.rate)}" class="${inputCls}">
                  </div>
                  <div>
                    <label for="fTotal" class="mb-1 block text-[14px] font-semibold text-slate-700">单节折算总学费积分 <span class="text-rose-500">*</span></label>
                    <input id="fTotal" type="number" min="0" step="1" value="${esc(f.total)}" class="${inputCls}">
                  </div>
                </div>
              </div>
            </section>

            <div id="financePreview">${financeCard(fin, '实时核算预览', true)}</div>

            <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">建班后若暂未委任老师，购课与排课将被阻断；委任主讲外教后自动恢复。Max 是平台固定工具费（Max × 6）的唯一计算基准。</div>
            ${f.error ? `<div id="createError" class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-rose-700">${esc(f.error)}</div>` : ''}
          </div>
        </div>
        <div class="flex shrink-0 gap-2 border-t border-slate-200 bg-white px-4 py-3">
          <button data-action="cancel-create" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
          <button id="btnCreateClass" data-action="submit-create" ${createError() ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">创建并生效</button>
        </div>
      </div>`;
    }

    function updateCreatePreview() {
      const f = state.create;
      const fin = calcFinance(f);
      const preview = $('financePreview');
      if (preview) preview.innerHTML = financeCard(fin, '实时核算预览', true);
      const inline = $('toolFeeInline');
      if (inline) inline.innerHTML = `平台固定工具费 = Max × 6 = <span class="font-mono font-bold text-slate-700">${points(fin.toolFee)}</span> 积分`;
      const btn = $('btnCreateClass');
      if (btn) btn.disabled = !!createError();
    }

    function createError() {
      const f = state.create;
      if (state.online === 'off') return '离线模式下不可创建班级';
      const name = f.name.trim();
      if (!name) return '请填写班级名称';
      if (name.length > 64) return '班级名称不能超过 64 字符';
      if (!COURSE_TYPES.includes(f.courseType)) return '请选择课程类型';
      if (f.teacherId && !TEACHERS.some((t) => t.id === f.teacherId)) return '请选择在职授课老师或暂不绑定';
      if (!MONITORS.some((m) => m.id === f.ownerMonitorId)) return '请选择主理人';
      const max = Number(f.max);
      if (!Number.isInteger(max) || max < 2 || max > 20) return '最大学生数 Max 需为 2–20 的整数';
      const salary = Number(f.salary);
      if (!Number.isInteger(salary) || salary < 0) return '教师单节课酬需为非负整数';
      const rateStr = String(f.rate).trim();
      if (!/^\d{1,3}(\.\d{1,2})?$/.test(rateStr)) return '平台服务分成比例需为 0–100，最多 2 位小数';
      const rate = Number(rateStr);
      if (!(rate >= 0 && rate <= 100)) return '平台服务分成比例需为 0–100';
      const total = Number(f.total);
      if (!Number.isFinite(total) || total < 0) return '单节折算总学费需为非负数';
      return null;
    }

    function openCreate() {
      if (state.online === 'off') return showToast('离线模式下不可创建班级');
      state.create = {
        ...emptyCreate(),
        ownerMonitorId: isAdmin() ? 'mn_leo000001' : CURRENT_MONITOR_ID
      };
      state.page = 'create';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      updateCreatePreview();
    }

    function openReopen(classId) {
      if (state.online === 'off') return showToast('离线模式下不可创建班级');
      const source = classById(classId);
      if (!source) return;
      if (!ownsClass(source)) return showToast('仅主理人或管理员可创建承接新班');
      state.create = {
        ...emptyCreate(),
        name: `${source.name} · 承接班`,
        courseType: source.courseType,
        teacherId: '',
        ownerMonitorId: source.ownerMonitorId,
        max: String(source.max),
        salary: String(source.salary),
        rate: String(source.rate),
        total: String(source.total),
        sourceClassId: source.id
      };
      state.page = 'create';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      showToast('已带入原班课程类型、Max 与单节实收，请委任新外教');
    }

    function submitCreate() {
      const err = createError();
      if (err) {
        state.create.error = err;
        renderAll();
        setTimeout(() => $('createError')?.scrollIntoView({ block: 'center' }), 60);
        showToast(err);
        return;
      }
      const f = state.create;
      const teacher = teacherById(f.teacherId);
      const source = f.sourceClassId ? classById(f.sourceClassId) : null;
      const c = {
        id: newClassId(),
        name: f.name.trim(),
        courseType: f.courseType,
        teacherId: teacher ? teacher.id : null,
        ownerMonitorId: f.ownerMonitorId,
        teacherMonitorId: teacher ? teacher.monitorId : null,
        max: Number(f.max),
        salary: Number(f.salary),
        rate: Number(f.rate),
        total: Number(f.total),
        status: 'active',
        futureTs: 0,
        unsettledTs: 0,
        createdAt: TODAY,
        sourceClassId: source ? source.id : null,
        auditLog: [
          { at: `${TODAY} 10:00`, action: '新建班级', operator: currentOperatorName(), summary: teacher
            ? `创建班级 · 主理人 ${monitorById(f.ownerMonitorId).name} · 委任 ${teacher.name} · 外教绑定班长 ${monitorById(teacher.monitorId).name}`
            : `创建班级 · 主理人 ${monitorById(f.ownerMonitorId).name} · 暂未委任主讲外教` }
        ]
      };
      if (source) {
        c.auditLog.push({ at: `${TODAY} 10:01`, action: '承接原班', operator: currentOperatorName(), summary: `承接原班级 ${source.name} · 剩余 ${points(source.unsettledTs)} 节 · 原班已提前结课解散` });
        appendAudit(source, '委任新外教创建新班', `已创建承接新班 ${c.name}（${c.id}）`);
      }
      state.classes.unshift(c);
      state.activeClassId = c.id;
      state.page = 'detail';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      showToast(teacher ? `已创建 ${c.name} · 建班即生效` : `已创建 ${c.name} · 待委任老师，购课与排课暂不可用`);
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'archive') return renderArchiveModal();
      if (state.overlay.type === 'dissolve') return renderDissolveModal();
      if (state.overlay.type === 'appoint') return renderAppointModal();
      if (state.overlay.type === 'blocked') return renderBlockedModal();
      return '';
    }

    function renderOverlayOnly() {
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    function modalShell(content) {
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-3 top-1/2 mx-auto max-h-[88%] max-w-[560px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">${content}</div>
      </div>`;
    }

    function modalHeader(title, subtitle = '') {
      return `<div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
          ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
        </div>
        <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
      </div>`;
    }

    function renderArchiveModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      return modalShell(`
        ${modalHeader(`归档班级：${c.name}`, '归档后不再允许新开购课单；历史排课与财务记录保留只读')}
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-slate-600">
          当前班级为正式开课状态，归档不会影响已排期课程与历史财务数据。确认归档？
        </div>
        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
          <button data-action="archive-confirm" data-id="${c.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认归档</button>
        </div>
      `);
    }

    function dissolveValid(c) {
      const d = state.dissolve;
      if (!c || state.online === 'off') return false;
      if (!d.reason || !d.disposition) return false;
      if (d.disposition === 'PERMANENT_TERMINATE' && !d.note.trim()) return false;
      if (!d.confirmed) return false;
      return true;

        ${showRefund ? `<div class="mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5">
          <div class="text-[14px] font-bold text-rose-950">线下退费清算参考</div>
          <div class="mt-1.5 space-y-1 text-[12px] font-medium text-rose-900/85">
            <div class="flex items-center justify-between gap-2"><span>剩余未上课时</span><span class="font-mono font-bold text-rose-950">${points(remaining)} 节</span></div>
            <div class="flex items-center justify-between gap-2"><span>单节折算总学费</span><span class="font-mono font-bold text-rose-950">${points(c.total)} 积分</span></div>
            <div class="flex items-center justify-between gap-2 border-t border-rose-200/70 pt-1"><span>建议退还全班总额</span><span class="font-mono font-bold text-rose-950">${points(refundTotal)} 积分</span></div>
            <div class="flex items-center justify-between gap-2"><span>人均应退（按 Max ${c.max} 人测算）</span><span class="font-mono font-bold text-rose-950">${points(perCapita)} 积分</span></div>
            <p class="pt-1 text-rose-700">仅供主理人对账参考，系统不参与线上划扣与垫付。</p>
          </div>
        </div>` : d.disposition === 'REOPEN_NEW_CLASS' ? `<div class="mt-3 rounded-xl border border-indigo-200 bg-indigo-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900/85">
          剩余 ${points(c.unsettledTs)} 节将结转新班。提交后可在班级详情中点击【委任新外教创建新班】，原班购课单封存归档。

          <textarea id="fDissolveNote" rows="3" placeholder="${showRefund ? '如：已于微信群向全班家长原路结清剩余学费，班级彻底终止不再开班' : '如：已与家长协商，剩余课时与差额结转到新班'}" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-[14px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500">${esc(d.note)}</textarea>
        </div>

        ${showRefund ? `<div class="mt-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-semibold text-slate-700">打款截图凭证（选填）</span>

          <div class="mt-1.5 grid grid-cols-3 gap-1.5">
            ${Array.from({ length: d.screenshots }).map((_, i) => `<div class="flex h-16 flex-col items-center justify-center gap-1 rounded-xl border border-emerald-200 bg-emerald-50 text-[12px] font-medium text-emerald-700">
              ${icon('image', 'h-4 w-4')}截图 ${i + 1}

            ${d.screenshots < 3 ? `<button data-action="dissolve-add-shot" class="flex h-16 flex-col items-center justify-center gap-1 rounded-xl border border-dashed border-slate-300 bg-slate-50 text-[12px] font-medium text-slate-500 hover:bg-slate-100">
              ${icon('plus', 'h-4 w-4')}添加截图
            </button>` : ''}
          </div>
        </div>` : ''}

        <button data-action="dissolve-toggle-confirm" class="mt-3 flex w-full items-start gap-2 rounded-xl border px-3 py-2.5 text-left transition ${d.confirmed ? 'border-indigo-600 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
          <span class="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-md border ${d.confirmed ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 text-transparent'}">${icon('check', 'h-3.5 w-3.5')}</span>
          <span class="text-[12px] font-medium leading-relaxed ${d.confirmed ? 'text-indigo-900' : 'text-slate-600'}">${esc(DISCLAIMER_TEXT)}</span>
        </button>
        ${!d.confirmed ? `<p class="mt-1 text-[12px] font-medium text-slate-400">勾选免责确认后方可提交</p>` : ''}

        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
          <button id="dissolveSubmit" data-action="dissolve-confirm" data-id="${c.id}" ${valid ? '' : 'disabled'} class="h-11 flex-[1.6] rounded-xl bg-rose-600 text-[16px] font-semibold text-white hover:bg-rose-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认提前结课</button>
        </div>
      `);
    }

    function renderAppointModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      const teachers = teacherOptions();
      const selected = teacherById(state.appoint.selected);
      const selectedMonitor = selected ? monitorById(selected.monitorId) : null;
      return modalShell(`
        ${modalHeader(`委任老师：${c.name}`, '从全平台在职外教中选择主讲老师，选定后自动带出外教绑定班长')}
        <div class="mt-3 space-y-1.5">
          ${teachers.map((t) => {
            const m = monitorById(t.monitorId);
            const on = state.appoint.selected === t.id;
            return `<button data-action="appoint-select" data-teacher="${t.id}" class="w-full rounded-xl border px-3 py-2.5 text-left transition ${on ? 'border-indigo-600 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
              <div class="flex items-center justify-between gap-2">
                <div class="min-w-0">
                  <div class="flex flex-wrap items-center gap-1.5">
                    <span class="text-[14px] font-bold text-slate-900">${esc(t.name)}</span>
                    <span class="rounded-full border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-600">${esc(t.level)}</span>
                    ${on ? chip('已选择', 'indigo') : ''}
                  </div>
                  <div class="mt-0.5 text-[12px] font-medium text-slate-500">技能：${esc(t.skills.join(' / '))} · 外教绑定班长：${esc(m.name)}</div>
                </div>
                <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 text-transparent'}">${icon('check', 'h-3.5 w-3.5')}</span>
              </div>
            </button>`;
          }).join('')}
        </div>
        ${selected ? `<div class="mt-2 rounded-xl border border-indigo-200 bg-indigo-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-indigo-900/85">委任后外教绑定班长为 <span class="font-bold text-indigo-950">${esc(selectedMonitor.name)}</span>，系统将向其发送协同通知。</div>` : ''}
        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
          <button data-action="appoint-confirm" data-id="${c.id}" ${selected && state.online !== 'off' ? '' : 'disabled'} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认委任</button>
        </div>
      `);
    }

    function renderBlockedModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      return modalShell(`
        ${modalHeader('暂不可录单与排课', '请先完成主讲外教委任')}
        <div class="mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-3">
          <div class="flex items-start gap-2">
            ${icon('alert-triangle', 'h-5 w-5 shrink-0 text-rose-700')}
            <p class="text-[14px] font-semibold leading-relaxed text-rose-950">该小班尚未委任授课老师，请先点击【委任老师】选定主讲外教后再录单收款与排课</p>
          </div>
        </div>
        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">知道了</button>
          ${ownsClass(c) ? `<button data-action="blocked-appoint" data-id="${c.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[1.6] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">去委任老师</button>` : ''}
        </div>
      `);
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'ext-link') return;
      if (action === 'bell') return showToast(`消息中心有 ${BANNERS[state.role].unread} 条新通知`);
      if (action === 'back-main') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'back-classes') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'open-class') {
        state.activeClassId = el.dataset.id;
        state.page = 'detail';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.logOpen = false;
        state.overlay = null;
        return renderAll();
      }
      if (action === 'open-log') {
        state.activeClassId = el.dataset.id;
        state.page = 'detail';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.logOpen = true;
        state.overlay = null;
        return renderAll();
      }
      if (action === 'toggle-log') { state.logOpen = !state.logOpen; return renderAll(); }
      if (action === 'set-class-view') {
        state.classView = el.dataset.view === 'involved' ? 'involved' : 'owned';
        state.teacherFilter = 'all';
        state.overlay = null;
        ensureActiveClass();
        return renderAll();
      }
      if (action === 'set-filter') { state.filter = el.dataset.filter; return renderAll(); }
      if (action === 'set-teacher') { state.teacherFilter = el.dataset.teacher; return renderAll(); }
      if (action === 'show-teacher-all') { state.filter = 'all'; return renderAll(); }
      if (action === 'open-create') return openCreate();
      if (action === 'cancel-create') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'submit-create') return submitCreate();
      if (action === 'open-reopen') return openReopen(el.dataset.id);
      if (action === 'suspend-class') {
        if (state.online === 'off') return showToast('离线模式下不可整班停课');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可执行整班停课');
        const released = c.futureTs;
        if (released > 0) {
          c.futureTs = 0;
          c.unsettledTs += released;
          appendAudit(c, '整班停课', `${released} 节未来排课已退回待补排`);
        } else {
          appendAudit(c, '整班停课', '本次整班停课已记录，当前无未来排课');
        }
        renderAll();
        return showToast(released > 0 ? `已提交整班停课 · ${released} 节退回待补排` : '已提交整班停课');
      }
      if (action === 'open-archive') {
        if (state.online === 'off') return showToast('离线模式下不可归档');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可归档班级');
        state.overlay = { type: 'archive', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'open-dissolve') {
        if (state.online === 'off') return showToast('离线模式下不可提前结课解散');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可提前结课解散');
        state.dissolve = emptyDissolve();
        state.overlay = { type: 'dissolve', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'dissolve-reason') {
        state.dissolve.reason = el.dataset.reason;
        return renderOverlayOnly();
      }
      if (action === 'dissolve-disposition') {
        state.dissolve.disposition = el.dataset.disposition;
        return renderOverlayOnly();
      }
      if (action === 'dissolve-add-shot') {
        if (state.dissolve.screenshots < 3) state.dissolve.screenshots += 1;
        return renderOverlayOnly();
      }
      if (action === 'dissolve-remove-shot') {
        if (state.dissolve.screenshots > 0) state.dissolve.screenshots -= 1;
        return renderOverlayOnly();
      }
      if (action === 'dissolve-toggle-confirm') {
        state.dissolve.confirmed = !state.dissolve.confirmed;
        return renderOverlayOnly();
      }
      if (action === 'open-appoint') {
        if (state.online === 'off') return showToast('离线模式下不可委任老师');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可委任老师');
        state.appoint = { classId: el.dataset.id, selected: '' };
        state.overlay = { type: 'appoint', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'appoint-select') {
        state.appoint.selected = el.dataset.teacher;
        return renderOverlayOnly();
      }
      if (action === 'blocked-order' || action === 'blocked-schedule') {
        state.overlay = { type: 'blocked', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'blocked-appoint') {
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return;
        if (state.online === 'off') return showToast('离线模式下不可委任老师');
        state.appoint = { classId: c.id, selected: '' };
        state.overlay = { type: 'appoint', classId: c.id };
        return renderAll();
      }
      if (action === 'appoint-confirm') {
        if (state.online === 'off') return showToast('离线模式下不可委任老师');
        const c = classById(el.dataset.id);
        const t = teacherById(state.appoint.selected);
        if (!c || !t || !ownsClass(c)) return;
        const prevMonitor = teacherMonitor(c);
        c.teacherId = t.id;
        c.teacherMonitorId = t.monitorId;
        const nextMonitor = monitorById(t.monitorId);
        appendAudit(c, '委任老师', `主讲外教: 待委任 → ${t.name}；外教绑定班长: ${nextMonitor.name}${prevMonitor && prevMonitor.id !== nextMonitor.id ? `（原 ${prevMonitor.name}，已联动同步）` : ''}`);
        state.overlay = null;
        renderAll();
        const notify = nextMonitor && nextMonitor.id !== c.ownerMonitorId ? ` · 已通知外教绑定班长 ${nextMonitor.name}` : '';
        return showToast(`已委任 ${t.name}${notify}`);
      }
      if (action === 'archive-confirm') {
        if (state.online === 'off') return showToast('离线模式下不可归档');
        const c = classById(el.dataset.id);
        if (!c || c.status !== 'active' || !ownsClass(c)) return;
        c.status = 'archived';
        c.archivedAt = TODAY;
        appendAudit(c, '归档班级', '课程结束 · 班级归档，不再新开购课单');
        state.overlay = null;
        renderAll();
        return showToast(`${c.name} 已归档 · 不可新开购课单`);
      }
      if (action === 'dissolve-confirm') {
        if (state.online === 'off') return showToast('离线模式下不可提前结课解散');
        const c = classById(el.dataset.id);
        if (!c || c.status !== 'active' || !ownsClass(c)) return;
        if (!dissolveValid(c)) return showToast('请完成解散原因、处置流向与免责确认');
        const d = { ...state.dissolve };
        const released = c.futureTs;
        const remaining = c.futureTs + c.unsettledTs;
        const refundTotal = remaining * Number(c.total || 0);
        const perCapita = c.max > 0 ? refundTotal / c.max : 0;
        c.status = 'early_terminated';
        c.futureTs = 0;
        if (d.disposition === 'PERMANENT_TERMINATE') {
          c.voidedTs = c.unsettledTs;
          c.unsettledTs = 0;
        }
        c.termination = {
          reason: d.reason,
          disposition: d.disposition,
          note: d.note.trim(),
          at: TODAY,
          releasedTs: released,
          remainingLessons: remaining,
          refundTotal,
          perCapita,
          screenshots: d.screenshots
        };
        appendAudit(c, '提前结课解散', `原因: ${reasonLabel(d.reason)} · 流向: ${dispositionLabel(d.disposition)} · 未来 ${released} 节已取消释放${d.disposition === 'PERMANENT_TERMINATE' ? ` · 建议退还 ${points(refundTotal)} 积分` : ' · 剩余课时结转到新班'}`);
        state.overlay = null;
        state.dissolve = emptyDissolve();
        renderAll();
        const tm = teacherMonitor(c);
        const notify = tm && tm.id !== c.ownerMonitorId ? ` · 已通知外教绑定班长 ${tm.name}` : '';
        return showToast(`已提前结课解散 · 未来 ${released} 节已释放${notify}`);
      }
      if (action === 'close-overlay') {
        state.overlay = null;
        $('overlay').innerHTML = '';
        if (window.lucide) lucide.createIcons();
        return;
      }
    });

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'fClassName') { state.create.name = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fMax') { state.create.max = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fSalary') { state.create.salary = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fRate') { state.create.rate = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fTotal') { state.create.total = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fDissolveNote') {
        state.dissolve.note = e.target.value;
        const btn = $('dissolveSubmit');
        const c = state.overlay ? classById(state.overlay.classId) : null;
        if (btn && c) btn.disabled = !dissolveValid(c);
      }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'fCourseType') { state.create.courseType = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fTeacher') { state.create.teacherId = e.target.value; state.create.error = ''; renderAll(); }
      if (id === 'fOwnerMonitor') { state.create.ownerMonitorId = e.target.value; state.create.error = ''; updateCreatePreview(); }
    });

    function navTo(tab) {
      if (state.role === 'admin' && tab === 'settings') return setView('classes');
      if (state.role === 'monitor' && tab === 'ops') return setView('classes');
      state.page = 'placeholder';
      state.navTab = tab;
      state.overlay = null;
      renderAll();
    }

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    /* ------------------------------------------------------------------
     * URL 直达弹层（仅用于演示与截图）
     * ------------------------------------------------------------------ */
    function applyUrlOverlay() {
      const overlay = params.get('overlay');
      if (overlay === 'dissolve') {
        const c = classById(state.activeClassId);
        if (c && c.status === 'active') {
          state.dissolve = emptyDissolve();
          state.overlay = { type: 'dissolve', classId: c.id };
        }
      }
      if (overlay === 'appoint') {
        const c = classById(state.activeClassId);
        if (c) {
          state.appoint = { classId: c.id, selected: '' };
          state.overlay = { type: 'appoint', classId: c.id };
        }
      }
      if (overlay === 'blocked') {
        const c = classById(state.activeClassId);
        if (c) state.overlay = { type: 'blocked', classId: c.id };
      }
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    applyUrlOverlay();
    renderAll();
  </script>
</body>
</html>

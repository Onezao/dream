    }

    /* 小班归属：班长仅可见并持有自己作为小班主理人的小班；管理员可见全平台 */
    function scopeClasses() {
      if (isAdmin()) return allClasses();
      return state.classes.filter((c) => c.ownerMonitorId === CURRENT_MONITOR_ID);
    }

    function viewableClasses() {
      return scopeClasses();
    }

    /* 老师筛选条：全平台参与过小班课授课的在职老师，不收敛到当前主理人私域 */
    function teacherFilterOptions() {
      const participating = TEACHERS.filter((t) => t.active && state.classes.some((c) => c.teacherId === t.id));
      const scoped = scopeClasses();
      return participating.map((t) => ({
        ...t,
        count: scoped.filter((c) => c.teacherId === t.id).length
      })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
    }

    function teacherScopedClasses() {
      const list = scopeClasses();
      return state.teacherFilter === 'all' ? list : list.filter((c) => c.teacherId === state.teacherFilter);
    }

    function filteredClasses() {
      const list = teacherScopedClasses();
      return state.filter === 'all' ? list : list.filter((c) => c.status === state.filter);
    }

    function ensureTeacherFilter() {
      if (state.teacherFilter === 'all') return;
      if (!teacherFilterOptions().some((t) => t.id === state.teacherFilter)) state.teacherFilter = 'all';
    }

    function ensureActiveClass() {
      const list = viewableClasses();
      if (list.some((c) => c.id === state.activeClassId)) return;
      state.activeClassId = list[0] ? list[0].id : '';
    }

    function classTeacher(c) {
      return teacherById(c.teacherId);
    }

    function classOwner(c) {
      return monitorById(c.ownerMonitorId) || { name: '—' };
    }

    function points(n) {
      const v = Math.round((Number(n) + Number.EPSILON) * 100) / 100;
      return Number.isInteger(v) ? String(v) : v.toFixed(2);
    }

    function calcFinance(f) {
      const max = Number(f.max) || 0;
      const salary = Number(f.salary) || 0;
      const total = Number(f.total) || 0;
      const toolFee = max * 6;
      const minimum = salary + toolFee;
      const otherSurplus = total - minimum;
      const transfer = total;
      return { max, salary, total, toolFee, minimum, otherSurplus, transfer };
    }

    const STATUS_LABELS = {
      pending_open: '待开启',
      active: '正式开课',
      early_terminated: '已提前解散',
      archived: '已归档'
    };

    const STATUS_TONES = {
      pending_open: 'slate',
      active: 'emerald',
      early_terminated: 'rose',
      archived: 'slate'
    };

    function statusLabel(id) {
      return STATUS_LABELS[id] || '—';
    }

    function statusMeta(c) {
      if (c.status === 'archived') return { label: '已归档', tone: 'slate' };
      if (c.status === 'early_terminated') return { label: '已提前解散', tone: 'rose' };
      return { label: '正式开课', tone: 'emerald' };
    }

    function classTone(c) {
      if (c.status === 'archived') return 'slate';
      if (c.status === 'early_terminated') return 'rose';
      if (!c.teacherId) return 'rose';
      return 'amber';
    }

    /* AC-1C-05b：active 小班按老师委任与购课单/TS 分四阶段锁定字段 */
    const STAGE_META = {
      1: { label: '阶段 ① · 待委任老师', tone: 'indigo', desc: '课程类型、容量、财务参数与授课老师均可编辑；委任后自动进入阶段 ②' },
      2: { label: '阶段 ② · 尚未开单排课', tone: 'emerald', desc: '已委任老师且零购课单、零课次，全部字段可编辑' },
      3: { label: '阶段 ③ · 已锁定', tone: 'amber', desc: '已存在购课单或排课记录，仅班级名称可改' },

    };

    function classStage(c) {
      if (!c || c.status !== 'active') return '4';
      if (!c.teacherId) return '1';
      const tsCount = (Number(c.futureTs) || 0) + (Number(c.unsettledTs) || 0) + (Number(c.completedTs) || 0);
      if (tsCount + (c.hasOrder ? 1 : 0) === 0) return '2';
      return '3';
    }

    function stageMeta(c) {
      return STAGE_META[classStage(c)] || STAGE_META[4];
    }

    function reasonLabel(id) {
      return DISSOLVE_REASONS.find((r) => r.id === id)?.label || '—';

      return DISSOLVE_DISPOSITIONS.find((d) => d.id === id)?.label || '—';

    }

    function appendAudit(c, action, summary) {
      if (!Array.isArray(c.auditLog)) c.auditLog = [];
      c.auditLog.push({ at: `${TODAY} ${new Date().toTimeString().slice(0, 5)}`, action, operator: currentOperatorName(), summary });
    }

    /* 生命周期状态跃迁与字段变更共用 c.auditLog 单一时间轴，状态节点只读 */
    function appendStatus(c, from, to, reason) {
      if (!Array.isArray(c.auditLog)) c.auditLog = [];
      c.auditLog.push({
        at: `${TODAY} ${new Date().toTimeString().slice(0, 5)}`,
        kind: 'status', from, to, operator: currentOperatorName(), reason
      });
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function currentViewKey() {
      if (state.page === 'placeholder') return '';
      if (state.page === 'create') return 'create';
      if (state.page === 'detail') return 'detail';
      if (state.page === 'classes') return 'classes';
      return '';
    }

    function syncConsole() {
      const view = currentViewKey();
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const value = b.dataset.value;
        let active = false;
        if (group === 'role') active = state.role === value;
        if (group === 'view') active = view === value;
        if (group === 'device') active = state.device === value;
        if (group === 'online') active = state.online === value;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}`;
      });
    }

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'view') setView(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：可浏览小班，创建、委任、归档、解散与暂停待排不可用');
        }
      });
    });

    function setRole(role) {
      state.role = role;
      if (role === 'admin') state.device = 'mobile';
      state.page = 'classes';
      state.navTab = role === 'admin' ? 'settings' : 'ops';
      state.filter = 'all';
      state.teacherFilter = 'all';
      state.logOpen = false;
      state.overlay = null;
      ensureActiveClass();
      renderAll();
    }

    function setView(view) {
      if (view === 'classes') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      }
      if (view === 'detail') {
        if (!viewableClasses().length) {
          showToast('暂无可查看的小班');
          state.page = 'classes';
        } else {
          ensureActiveClass();
          state.page = 'detail';
          state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        }
      }
      if (view === 'create') {
        openCreate();
        return;
      }
      state.overlay = null;
      renderAll();
    }

      state.device = 'mobile';

      state.activeClassId = 'cls_ket00001';
      state.filter = 'all';
      state.teacherFilter = 'all';

      state.dissolve = emptyDissolve();

      state.appoint = { classId: '', selected: '' };

      state.overlay = null;
      renderAll();

      return '小班课中心';

      return `<header class="relative flex h-16 shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${b.gradient} px-4 text-white">

          ${canBack
            ? `<button data-action="${backAction}" class="inline-flex h-8 shrink-0 items-center gap-1 rounded-lg px-2 -ml-1 text-[13px] font-semibold text-white/90 transition hover:bg-white/10 active:bg-white/15" aria-label="返回">${icon('chevron-left', 'h-4 w-4')}返回</button>`

        </button>
      </header>`;
    }

    function renderNav() {
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">

            </button>`;
          }).join('')}
        </div>
      </div>`;

      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.page === 'create') return renderCreatePage();
      if (state.page === 'detail') return renderClassDetail();

      const item = currentNav().find((n) => n.id === state.navTab);
      if (!item) return `<div class="p-8 text-center text-[14px] font-medium text-slate-500">页面不存在</div>`;
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">

          ${c.status === 'archived'
            ? `<div class="mt-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">已归档于 ${esc(c.archivedAt || '—')} · 不可新开购课单；历史排课与财务记录只读。</div>`
            : `<div class="mt-2 space-y-1.5 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-rose-700">
                <div class="flex items-center justify-between gap-2"><span>解散原因</span><span class="font-bold">${esc(reasonLabel(termination?.reason))}</span></div>
                <div class="flex items-center justify-between gap-2"><span>处置流向</span><span class="font-bold">${esc(dispositionLabel(termination?.disposition))}</span></div>
                <div class="flex items-center justify-between gap-2"><span>解散时间</span><span class="font-bold">${esc(termination?.at || '—')}</span></div>
                <div class="flex items-center justify-between gap-2"><span>已结课</span><span class="font-bold">${points(termination?.completedTs ?? c.completedTs ?? 0)} 节</span></div>
                <div class="flex items-center justify-between gap-2"><span>作废节数</span><span class="font-bold">${points(termination?.voidedTs || 0)} 节</span></div>
                <div class="flex items-center justify-between gap-2"><span>未来取消释放</span><span class="font-bold">${points(termination?.releasedTs || 0)} 节</span></div>
                ${termination?.disposition === 'PERMANENT_TERMINATE' ? `<div class="flex items-center justify-between gap-2"><span>建议退还总额</span><span class="font-bold">${points(termination?.refundTotal || 0)} 积分</span></div>
                <div class="flex items-center justify-between gap-2"><span>人均应退（按 Max 测算）</span><span class="font-bold">${points(termination?.perCapita || 0)} 积分</span></div>
                ${termination?.screenshots ? `<div class="flex items-center justify-between gap-2"><span>打款截图凭证</span><span class="font-bold">${points(termination.screenshots)} 张</span></div>` : ''}
                <div class="border-t border-rose-200/70 pt-1.5 text-rose-900/85">${esc(termination?.note || '—')}</div>
                <p class="text-rose-700">已线下结清，系统不生成退款单。</p>` : `<div class="flex items-center justify-between gap-2"><span>结转剩余课次</span><span class="font-bold">${points(c.unsettledTs)} 节</span></div>
                ${termination?.screenshots ? `<div class="flex items-center justify-between gap-2"><span>打款截图凭证</span><span class="font-bold">${points(termination.screenshots)} 张</span></div>` : ''}
                <div class="border-t border-rose-200/70 pt-1.5 text-rose-900/85">${esc(termination?.note || '—')}</div>`}
              </div>
              <div class="mt-2 flex gap-1.5">
                <a href="m3a_calendar_grid.html?class_id=${c.id}" target="_blank" rel="noopener" class="flex h-11 flex-1 items-center justify-center rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 hover:bg-slate-50">查看历史排课</a>
                ${termination?.disposition === 'REOPEN_NEW_CLASS' && canWrite ? `<button data-action="open-reopen" data-id="${c.id}" ${offline ? 'disabled' : ''} class="h-11 flex-[1.4] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">委任新老师创建新小班</button>` : ''}
              </div>`}
        </section>` : ''}

        ${renderAuditLog(c)}

        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">小班课不关联学员档案与家长账号；平台固定工具费 = Max × 6；其他结余沉淀平台，不可退。</div>
      </div>`;
    }

    function financeCard(fin, title, showFormula = false) {
      const below = fin.otherSurplus < 0;
      const surplusTile = below
        ? financeTile('低于底线', `${points(Math.abs(fin.otherSurplus))} 积分`, 'rose')
        : financeTile('其他结余', `+${points(fin.otherSurplus)}`, 'slate');
      const transferRow = below
        ? `<div class="flex items-center justify-between gap-2 border-t border-slate-200 pt-1"><span>周度上交金额</span><span class="font-mono font-bold text-rose-700">— <span class="font-sans text-[12px] font-semibold">当前不可提交</span></span></div>`
        : `<div class="flex items-center justify-between gap-2 border-t border-slate-200 pt-1"><span>周度上交金额</span><span class="font-mono font-bold text-slate-900">${points(fin.transfer)}</span></div>`;
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="grid h-8 w-8 place-items-center rounded-xl border border-slate-200 bg-white text-indigo-600">${icon('calculator', 'h-4 w-4')}</span>
            <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
          </div>
          <span class="text-[12px] font-medium text-slate-500">单节核算</span>
        </div>
        <div class="mt-2.5 grid grid-cols-2 gap-1.5">
          ${financeTile('单节待上交', points(fin.total))}
          ${financeTile('老师单节课酬', points(fin.salary))}
          ${financeTile('平台固定工具费', points(fin.toolFee))}
          ${surplusTile}
        </div>
        <div class="mt-2 space-y-1 rounded-xl bg-white px-2.5 py-2 text-[12px] font-medium text-slate-600">
          <div class="flex items-center justify-between gap-2"><span>底线（老师课酬 + Max×6）</span><span class="font-mono font-bold text-slate-900">${points(fin.minimum)}</span></div>
          ${transferRow}
        </div>
        ${showFormula ? `<p class="mt-1.5 text-[12px] font-medium leading-relaxed ${below ? 'text-rose-700' : 'text-slate-500'}">${below ? `当前单节待上交低于底线，差额 ${points(Math.abs(fin.otherSurplus))} 积分；请提高单节待上交后再提交。` : '单节待上交 = 老师课酬 + Max×6 + 其他结余；其他结余沉淀平台，不可退。低于底线时不可提交。'}</p>` : ''}
      </section>`;
    }

    function renderAuditLog(c) {
      const logs = Array.isArray(c.auditLog) ? c.auditLog : [];
      const statusCount = logs.filter((log) => log.kind === 'status').length;
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        <button data-action="toggle-log" class="flex w-full items-center justify-between gap-2 text-left">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl border border-slate-200 bg-white text-indigo-600">${icon('history', 'h-4 w-4')}</span>
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">小班操作与修改日志</h2>
              <p class="text-[12px] font-medium text-slate-500">共 ${logs.length} 条 · 状态流转 ${statusCount} 条 · 仅可查看，不可编辑</p>
            </div>
          </div>
          ${icon(state.logOpen ? 'chevron-up' : 'chevron-down', 'h-4 w-4 shrink-0 text-slate-500')}
        </button>
        ${state.logOpen ? `<div class="mt-3 space-y-3">
          <p class="rounded-lg bg-white px-2.5 py-1.5 text-[12px] font-medium leading-relaxed text-slate-600">状态流转由系统在生命周期跃迁时自动追加，只读不可编辑；与字段变更记录共用同一时间轴。</p>
          ${logs.length ? logs.map((log) => log.kind === 'status' ? renderStatusLogItem(log) : renderFieldLogItem(log)).join('') : `<div class="rounded-xl border border-dashed border-slate-300 px-3 py-4 text-center text-[12px] font-medium text-slate-500">暂无操作记录</div>`}
        </div>` : ''}
      </section>`;
    }

    function renderFieldLogItem(log) {
      return `<div class="flex gap-2.5">
        <span class="mt-1 h-2 w-2 shrink-0 rounded-full bg-indigo-500"></span>
        <div class="min-w-0 flex-1 border-b border-slate-100 pb-2 last:border-0 last:pb-0">
          <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5">
            <span class="text-[14px] font-bold text-slate-900">${esc(log.action)}</span>
            <span class="text-[12px] font-medium text-slate-500">${esc(log.operator)} · ${esc(log.at)}</span>
          </div>
          <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">${esc(log.summary)}</p>
        </div>
      </div>`;
    }

    function renderStatusLogItem(log) {
      return `<div class="flex gap-2.5">
        <span class="mt-0.5 grid h-4 w-4 shrink-0 place-items-center rounded-full border border-indigo-200 bg-indigo-50 text-indigo-600">${icon('git-branch', 'h-2.5 w-2.5')}</span>
        <div class="min-w-0 flex-1 border-b border-slate-100 pb-2 last:border-0 last:pb-0">
          <div class="flex flex-wrap items-center gap-x-1.5 gap-y-1">
            <span class="text-[14px] font-bold text-slate-900">状态流转</span>
            ${chip(statusLabel(log.from), STATUS_TONES[log.from] || 'slate')}
            <span class="text-[12px] font-bold text-slate-600">→</span>
            ${chip(statusLabel(log.to), STATUS_TONES[log.to] || 'slate')}
            <span class="text-[12px] font-medium text-slate-500">${esc(log.operator)} · ${esc(log.at)}</span>
          </div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">原因：${esc(log.reason || '—')}</p>
          <span class="mt-1 inline-flex items-center rounded-full bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-600">只读</span>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 创建小班
     * ------------------------------------------------------------------ */
    function renderCreatePage() {
      const f = state.create;
      const inputCls = 'h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 px-3.5 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15';
      const teachers = teacherOptions(f.courseType);
      const monitors = monitorOptions();
      const fin = calcFinance(f);
      const source = f.sourceClassId ? classById(f.sourceClassId) : null;
      return `<div class="flex h-full min-h-0 flex-col">
        <div class="min-h-0 flex-1 overflow-y-auto bg-slate-50">
          <div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3">
            <div class="flex items-center justify-between gap-2">
              <span class="shrink-0 text-[14px] font-medium text-slate-500">建班即生效 · 4 周轮次滚动</span>
              <span class="shrink-0 text-[12px] font-medium ${state.online === 'off' ? 'text-rose-600' : 'text-slate-500'}">${state.online === 'off' ? '离线不可创建' : '免建档'}</span>
            </div>

            ${source ? `<div class="rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2.5">
              <div class="flex items-start gap-2.5">
                <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg border border-slate-200 bg-white text-indigo-600">${icon('arrow-right-left', 'h-4 w-4')}</span>
                <div class="min-w-0">
                  <div class="text-[14px] font-bold text-slate-900">承接原小班：${esc(source.name)}</div>
                  <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">原班已提前结课解散，剩余 ${points(source.unsettledTs)} 节。请委任新老师，并录入线下多退少补后的单节待上交。</p>
                </div>
              </div>
            </div>` : ''}

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4">
              <div class="flex items-center gap-2">
                <span class="grid h-5 w-5 place-items-center rounded-full bg-indigo-50 text-[11px] font-bold text-indigo-600">1</span>
                <h2 class="text-[14px] font-bold text-slate-900">基本信息</h2>
              </div>
              <div class="mt-3 space-y-3.5">
                <div>
                  <label for="fClassName" class="mb-1 block text-[14px] font-semibold text-slate-700">小班名称 <span class="text-rose-500">*</span></label>
                  <input id="fClassName" value="${esc(f.name)}" maxlength="64" placeholder="如 KET 冲刺精讲小班" class="${inputCls}">
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label for="fCourseType" class="mb-1 block text-[14px] font-semibold text-slate-700">课程类型 <span class="text-rose-500">*</span></label>
                    <select id="fCourseType" class="${inputCls} font-medium">${COURSE_TYPES.map((t) => `<option ${f.courseType === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
                  </div>
                  <div>
                    <label for="fTeacher" class="mb-1 block text-[14px] font-semibold text-slate-700">授课老师</label>
                    <select id="fTeacher" class="${inputCls} font-medium">
                      <option value="" ${!f.teacherId ? 'selected' : ''}>暂不绑定</option>
                      ${teachers.map((t) => `<option value="${t.id}" ${f.teacherId === t.id ? 'selected' : ''}>${esc(t.name)} · ${t.price}积分</option>`).join('')}
                    </select>
                  </div>
                </div>
                <p class="text-[12px] font-medium leading-relaxed text-slate-500">授课老师从全平台在职老师中直接选择，仅展示技能匹配该课程类型的老师；可先暂不绑定，建班后再委任。</p>
                <div>
                  <label for="fOwnerMonitor" class="mb-1 block text-[14px] font-semibold text-slate-700">小班主理人 <span class="text-rose-500">*</span></label>
                  ${isAdmin()
                    ? `<select id="fOwnerMonitor" class="${inputCls} font-medium">${monitors.map((m) => `<option value="${m.id}" ${f.ownerMonitorId === m.id ? 'selected' : ''}>${esc(m.name)}（在职）</option>`).join('')}</select>
                    <p class="mt-1 text-[12px] font-medium text-slate-500">管理员可指定任一在职班长作为主理人；班长建班时默认本人。</p>`
                    : `<div class="flex h-11 items-center justify-between rounded-xl border border-slate-200 bg-slate-100 px-3.5 text-[14px] font-medium text-slate-600"><span>Leo（当前登录，默认主理人）</span>${icon('lock', 'h-3.5 w-3.5 text-slate-500')}</div>`}
                </div>
              </div>
            </section>

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="grid h-5 w-5 place-items-center rounded-full bg-indigo-50 text-[11px] font-bold text-indigo-600">2</span>
                  <h2 class="text-[14px] font-bold text-slate-900">小班规模</h2>
                </div>
                <span class="text-[12px] font-medium text-slate-500">2~20 人</span>
              </div>
              <div class="mt-3">
                <label for="fMax" class="mb-1 block text-[14px] font-semibold text-slate-700">最大学员数 Max <span class="text-rose-500">*</span></label>
                <input id="fMax" type="number" min="2" max="20" step="1" value="${esc(f.max)}" class="${inputCls}">
                <p id="toolFeeInline" class="mt-1 text-[12px] font-medium text-slate-500">Max 2~20（默认 3）；平台固定工具费 = Max × 6，实时金额见下方核算预览</p>
              </div>
            </section>

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4">
              <div class="flex items-center gap-2">
                <span class="grid h-5 w-5 place-items-center rounded-full bg-indigo-50 text-[11px] font-bold text-indigo-600">3</span>
                <h2 class="text-[14px] font-bold text-slate-900">财务参数</h2>
              </div>
              <div class="mt-3 space-y-3.5">
                <div>
                  <label for="fSalary" class="mb-1 block text-[14px] font-semibold text-slate-700">老师单节课酬积分 <span class="text-rose-500">*</span></label>
                  <input id="fSalary" type="number" min="0" step="1" value="${esc(f.salary)}" class="${inputCls}">
                </div>
                <div>
                  <label for="fTotal" class="mb-1 block text-[14px] font-semibold text-slate-700">单节待上交费用积分 <span class="text-rose-500">*</span></label>
                  <input id="fTotal" type="number" min="0" step="1" value="${esc(f.total)}" class="${inputCls}">
                  <p id="totalHint" class="mt-1 text-[12px] leading-relaxed ${fin.otherSurplus < 0 ? 'font-semibold text-rose-700' : 'font-medium text-slate-500'}">${fin.otherSurplus < 0 ? `当前低于底线，差额 ${points(Math.abs(fin.otherSurplus))} 积分；请提高单节待上交后再提交。` : `底线：老师课酬 + Max×6 = ${points(fin.minimum)} 积分；低于底线不可提交。`}</p>
                </div>
              </div>
            </section>

            <div id="financePreview">${financeCard(fin, '实时核算预览', true)}</div>

            <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">建班后若暂未委任老师，购课与排课将被阻断；委任主讲老师后自动恢复。Max 是平台固定工具费（Max × 6）的唯一计算基准。</div>
            ${f.error ? `<div id="createError" class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-rose-700">${esc(f.error)}</div>` : ''}
          </div>
        </div>
        <div class="flex shrink-0 gap-2 border-t border-slate-200/80 bg-white/95 p-3">
          <button data-action="cancel-create" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 hover:bg-slate-50">取消</button>
          <button id="btnCreateClass" data-action="submit-create" ${createError() ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">创建并生效</button>
        </div>
      </div>`;
    }

    function updateCreatePreview() {
      const f = state.create;
      const fin = calcFinance(f);
      const preview = $('financePreview');
      if (preview) preview.innerHTML = financeCard(fin, '实时核算预览', true);
      const inline = $('toolFeeInline');
      if (inline) inline.textContent = 'Max 2~20（默认 3）；平台固定工具费 = Max × 6，实时金额见下方核算预览';
      const hint = $('totalHint');
      if (hint) {
        hint.textContent = fin.otherSurplus < 0
          ? `当前低于底线，差额 ${points(Math.abs(fin.otherSurplus))} 积分；请提高单节待上交后再提交。`
          : `底线：老师课酬 + Max×6 = ${points(fin.minimum)} 积分；低于底线不可提交。`;
        hint.className = `mt-1 text-[12px] leading-relaxed ${fin.otherSurplus < 0 ? 'font-semibold text-rose-700' : 'font-medium text-slate-500'}`;
      }
      const btn = $('btnCreateClass');
      if (btn) btn.disabled = !!createError();
    }

    function createError() {
      const f = state.create;
      if (state.online === 'off') return '离线模式下不可创建小班';
      const name = f.name.trim();
      if (!name) return '请填写小班名称';
      if (name.length > 64) return '小班名称不能超过 64 字符';
      if (!COURSE_TYPES.includes(f.courseType)) return '请选择课程类型';
      if (f.teacherId && !teacherOptions(f.courseType).some((t) => t.id === f.teacherId)) return '请选择技能匹配的在职授课老师或暂不绑定';
      if (!monitorOptions().some((m) => m.id === f.ownerMonitorId)) return '请选择在职主理人';
      const max = Number(f.max);
      if (!Number.isInteger(max) || max < 2 || max > 20) return '最大学员数 Max 需为 2~20 的整数';
      const salary = Number(f.salary);
      if (!Number.isInteger(salary) || salary < 0) return '老师单节课酬需为非负整数';
      const total = Number(f.total);
      if (!Number.isInteger(total) || total < 0) return '单节待上交费用需为非负整数';
      if (total < salary + max * 6) return `单节待上交费用不得低于底线 ${salary + max * 6} 积分（老师课酬 ${salary} + Max×6 ${max * 6}）`;
      return null;
    }

    function openCreate() {
      if (state.online === 'off') return showToast('离线模式下不可创建小班');
      state.create = {
        ...emptyCreate(),
        ownerMonitorId: isAdmin() ? 'mn_leo000001' : CURRENT_MONITOR_ID
      };
      state.page = 'create';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      updateCreatePreview();
    }

    function openReopen(classId) {
      if (state.online === 'off') return showToast('离线模式下不可创建小班');
      const source = classById(classId);
      if (!source) return;
      if (!ownsClass(source)) return showToast('仅主理人或管理员可创建承接新班');
      state.create = {
        ...emptyCreate(),
        name: `${source.name} · 承接小班`,
        courseType: source.courseType,
        teacherId: '',
        ownerMonitorId: source.ownerMonitorId,
        max: String(source.max),
        salary: String(source.salary),
        total: String(source.total),
        sourceClassId: source.id
      };
      state.page = 'create';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      showToast('已带入原班课程类型、Max 与单节待上交，请委任新老师');
    }

    function submitCreate() {
      const err = createError();
      if (err) {
        state.create.error = err;
        renderAll();
        setTimeout(() => $('createError')?.scrollIntoView({ block: 'center' }), 60);
        showToast(err);
        return;
      }
      const f = state.create;
      const teacher = teacherById(f.teacherId);
      const source = f.sourceClassId ? classById(f.sourceClassId) : null;
      const c = {
        id: newClassId(),
        name: f.name.trim(),
        courseType: f.courseType,
        teacherId: teacher ? teacher.id : null,
        ownerMonitorId: f.ownerMonitorId,
        max: Number(f.max),
        salary: Number(f.salary),
        total: Number(f.total),
        status: 'active',
        futureTs: 0,
        unsettledTs: 0,
        createdAt: TODAY,
        sourceClassId: source ? source.id : null,
        auditLog: [
          { at: `${TODAY} 10:00`, action: '新建小班', operator: currentOperatorName(), summary: teacher
            ? `创建小班 · 主理人 ${monitorById(f.ownerMonitorId).name} · 委任 ${teacher.name}（全平台直接委任）`
            : `创建小班 · 主理人 ${monitorById(f.ownerMonitorId).name} · 暂未委任主讲老师` },
          { at: `${TODAY} 10:00`, kind: 'status', from: 'pending_open', to: 'active', operator: currentOperatorName(), reason: '创建生效' }
        ]
      };
      if (source) {
        c.auditLog.push({ at: `${TODAY} 10:01`, action: '承接原班', operator: currentOperatorName(), summary: `承接原小班 ${source.name} · 剩余 ${points(source.unsettledTs)} 节 · 原班已提前结课解散` });
        appendAudit(source, '委任新老师创建新小班', `已创建承接新班 ${c.name}（${c.id}）`);
      }
      state.classes.unshift(c);
      state.activeClassId = c.id;
      state.page = 'detail';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      showToast(teacher ? `已创建 ${c.name} · 建班即生效` : `已创建 ${c.name} · 待委任老师，购课与排课暂不可用`);
    }

    /* ------------------------------------------------------------------
     * 编辑小班（AC-1C-05a / 05b / 05c）
     * ------------------------------------------------------------------ */
    function editFinanceError() {
      const f = state.edit;
      if (!f) return null;
      const max = Number(f.max);
      const salary = Number(f.salary);
      const total = Number(f.total);
      if (!Number.isInteger(max) || max < 2 || max > 20) return '最大学生数 Max 需为 2~20 的整数';
      if (!Number.isInteger(salary) || salary < 0) return '老师单节课酬需为非负整数';
      if (!Number.isInteger(total) || total < 0) return '单节待上交费用需为非负整数';
      if (total < salary + max * 6) return `单节待上交不得低于 老师课酬 + Max × 6 = ${salary + max * 6} 积分`;
      return null;
    }

    function editError() {
      const f = state.edit;
      if (!f) return null;
      const c = classById(f.classId);
      if (!c) return null;
      const name = f.name.trim();
      if (!name) return '请填写班级名称';
      if (name.length > 64) return '班级名称不能超过 64 字符';
      const stage = classStage(c);
      if (stage === '3' || stage === '4') return null;
      if (!COURSE_TYPES.includes(f.courseType)) return '请选择课程类型';
      if (f.teacherId && !teacherOptions(f.courseType).some((t) => t.id === f.teacherId)) return '请选择技能匹配的在职授课老师或待委任老师';
      return editFinanceError();
    }

    function renderEditFinance() {
      const fin = calcFinance(state.edit || {});
      const below = fin.otherSurplus < 0;
      const err = editFinanceError();
      const warn = below || !!err;
      return `<div class="rounded-2xl border p-3.5 ${warn ? 'border-rose-200 bg-rose-50' : 'border-indigo-200/80 bg-indigo-50/50'}">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[12px] font-semibold text-slate-600">底线 = 老师课酬 + Max × 6</span>
          <span class="font-mono text-[18px] font-bold ${warn ? 'text-rose-700' : 'text-slate-900'}">${points(fin.minimum)} <span class="text-[12px] font-medium">积分</span></span>
        </div>
        <div class="mt-1 flex items-center justify-between gap-2">
          <span class="text-[12px] font-semibold text-slate-600">当前其他结余 = 待上交 − 底线</span>
          <span class="font-mono text-[16px] font-bold ${below ? 'text-rose-700' : 'text-indigo-700'}">${below ? '−' : '+'}${points(Math.abs(fin.otherSurplus))} <span class="text-[12px] font-medium">积分</span></span>
        </div>
        ${err
          ? `<p class="mt-2 flex items-start gap-1 rounded-lg bg-white/70 px-2 py-1.5 text-[12px] font-semibold leading-relaxed text-rose-700">${icon('alert-triangle', 'h-3.5 w-3.5 shrink-0')}<span>${esc(err)}</span></p>`
          : `<p class="mt-2 text-[12px] font-medium text-slate-500">其他结余沉淀平台，不可退。</p>`}
      </div>`;
    }

    function editChanges(c) {
      const f = state.edit;
      const stage = classStage(c);
      const changes = [];
      const push = (label, from, to) => {
        if (String(from ?? '') !== String(to ?? '')) changes.push({ label, from, to });
      };
      push('班级名称', c.name, f.name.trim());
      if (stage === '1' || stage === '2') {
        push('课程类型', c.courseType, f.courseType);
        push('最大学生数', c.max, Number(f.max));
        push('老师单节课酬积分', c.salary, Number(f.salary));
        push('单节待上交费用积分', c.total, Number(f.total));
        const oldTeacher = c.teacherId ? (teacherById(c.teacherId)?.name || '待委任老师') : '待委任老师';
        const newTeacher = f.teacherId ? (teacherById(f.teacherId)?.name || '待委任老师') : '待委任老师';
        push('授课老师', oldTeacher, newTeacher);
      }
      return changes;
    }

    function openEdit(classId, force = false) {
      if (state.online === 'off') return showToast('离线模式下不可编辑小班');
      const c = classById(classId);
      if (!c) return;
      if (!ownsClass(c)) return showToast('仅主理人或管理员可编辑小班');
      if (c.status !== 'active' && !force) return showToast('终态小班全字段只读');
      state.edit = emptyEdit(c);
      state.overlay = { type: 'edit', classId: c.id };
      renderAll();
    }

    function saveEdit() {
      if (state.online === 'off') return showToast('离线模式下不可编辑小班');
      const f = state.edit;
      if (!f) return;
      const c = classById(f.classId);
      if (!c) return;
      const stage = classStage(c);
      if (stage === '4') return showToast('终态小班全字段只读');
      const err = editError();
      if (err) {
        f.error = err;
        updateEditLive();
        return showToast(err);
      }
      const changes = editChanges(c);
      if (!changes.length) {
        state.overlay = null;
        state.edit = null;
        renderAll();
        return showToast('未检测到修改');
      }
      c.name = f.name.trim();
      if (stage === '1' || stage === '2') {
        c.courseType = f.courseType;
        c.teacherId = f.teacherId || null;
        c.max = Number(f.max);
        c.salary = Number(f.salary);
        c.total = Number(f.total);
      }
      appendAudit(c, '编辑小班', changes.map((ch) => `${ch.label}: ${ch.from} → ${ch.to}`).join('；'));
      state.overlay = null;
      state.edit = null;
      renderAll();
      showToast('小班信息已保存');
    }

      const block = $('editFinanceBlock');
      if (block) block.innerHTML = renderEditFinance();
      const btn = $('editSave');
      if (btn) btn.disabled = state.online === 'off' || !!editError();
    }

            </div>
            <div class="mt-2 flex flex-wrap items-center gap-1.5">
              ${chip(meta.label, meta.tone)}

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'archive') return renderArchiveModal();
      if (state.overlay.type === 'dissolve') return renderDissolveModal();
      if (state.overlay.type === 'appoint') return renderAppointModal();
      if (state.overlay.type === 'blocked') return renderBlockedModal();
      if (state.overlay.type === 'edit') return renderEditSheet();
      return '';
    }

    function renderOverlayOnly() {
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    function modalShell(content) {
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-3 top-1/2 mx-auto max-h-[88%] max-w-[560px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">${content}</div>
      </div>`;
    }

    function modalHeader(title, subtitle = '') {
      return `<div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
          ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
        </div>
        <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
      </div>`;
    }

    function renderArchiveModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      return modalShell(`
        ${modalHeader(`归档小班：${c.name}`, '归档后不再允许新开购课单；历史排课与财务记录保留只读')}
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-slate-600">
          当前小班为正式开课状态，归档不会影响已排期课程与历史财务数据。确认归档？
        </div>
        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">取消</button>
          <button data-action="archive-confirm" data-id="${c.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认归档</button>
        </div>
      `);
    }

    function dissolveValid(c) {
      const d = state.dissolve;
      if (!c || state.online === 'off') return false;
      if (!d.reason || !d.disposition) return false;
      if (d.disposition === 'PERMANENT_TERMINATE' && !d.note.trim()) return false;
      if (!d.confirmed) return false;
      return true;
    }

    function renderDissolveModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      const d = state.dissolve;
      const remaining = c.futureTs + c.unsettledTs;
      const refundTotal = remaining * Number(c.total || 0);
      const perCapita = c.max > 0 ? refundTotal / c.max : 0;
      const showRefund = d.disposition === 'PERMANENT_TERMINATE';
      const valid = dissolveValid(c);
      return modalShell(`
        ${modalHeader(`提前结课解散：${c.name}`, '换师方案 2 · 仅限主理人或管理员操作 · 线下核算完成后提交')}
        <div class="mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5">
          <div class="flex items-start gap-2">
            ${icon('alert-triangle', 'h-4 w-4 shrink-0 text-rose-700')}
            <div class="min-w-0 text-[12px] font-medium leading-relaxed text-rose-900/85">
              未来已排 ${c.futureTs} 节将批量取消并释放日历；历史已结课正常进入结算；系统不生成退款单，不参与线上划扣与垫付。
            </div>

          <div class="flex items-start gap-2">
            <span class="grid h-6 w-6 shrink-0 place-items-center rounded-lg border border-slate-200 bg-white text-indigo-600">${icon('repeat', 'h-3.5 w-3.5')}</span>
            <p class="min-w-0 text-[12px] font-medium leading-relaxed text-indigo-900"><span class="font-bold">换师方案 2</span>：长期换师（老师离职、长期请假 ≥3 节或家长集体换师）必须通过本流程办理，不允许在原班直接更换老师。短期 1–2 节应急代课请走代课指派，不解散小班。</p>

        </div>

        <div class="mt-3">
          <div class="text-[14px] font-bold text-slate-900">解散原因 <span class="text-rose-500">*</span></div>
          <div class="mt-1.5 space-y-1.5">
            ${DISSOLVE_REASONS.map((r) => `<button data-action="dissolve-reason" data-reason="${r.id}" class="w-full rounded-xl border px-3 py-2 text-left transition ${d.reason === r.id ? 'border-indigo-600 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
              <div class="flex items-center gap-2">
                <span class="grid h-4 w-4 shrink-0 place-items-center rounded-full border ${d.reason === r.id ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 text-transparent'}">${icon('check', 'h-3 w-3')}</span>
                <span class="text-[14px] font-semibold text-slate-900">${esc(r.label)}</span>
              </div>
              <p class="mt-0.5 pl-6 text-[12px] font-medium leading-relaxed text-slate-500">${esc(r.desc)}</p>
            </button>`).join('')}
          </div>
        </div>

        <div class="mt-3">
          <div class="text-[14px] font-bold text-slate-900">后续处置流向 <span class="text-rose-500">*</span></div>

            <div class="flex items-center justify-between gap-2"><span>人均应退（按 Max ${c.max} 人测算）</span><span class="font-mono font-bold text-rose-950">${points(perCapita)} 积分</span></div>

        <div class="mt-3">
          <label for="fDissolveNote" class="mb-1 block text-[14px] font-semibold text-slate-700">${showRefund ? '退费说明及审计备注' : '结转备注（选填）'} ${showRefund ? '<span class="text-rose-500">*</span>' : ''}</label>
          <textarea id="fDissolveNote" rows="3" placeholder="${showRefund ? '如：已于微信群向全班家长原路结清剩余学费，小班彻底终止不再开班' : '如：已与家长协商，剩余课次与差额结转到新班'}" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-[14px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500">${esc(d.note)}</textarea>

        ${showRefund ? `<div class="mt-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-semibold text-slate-700">打款截图凭证（选填）</span>

          <div class="mt-1.5 grid grid-cols-3 gap-1.5">
            ${Array.from({ length: d.screenshots }).map((_, i) => `<div class="flex h-16 flex-col items-center justify-center gap-1 rounded-xl border border-emerald-200 bg-emerald-50 text-[12px] font-medium text-emerald-700">
              ${icon('image', 'h-4 w-4')}截图 ${i + 1}
              <button data-action="dissolve-remove-shot" class="text-[12px] font-bold text-rose-600">移除</button>

            ${d.screenshots < 3 ? `<button data-action="dissolve-add-shot" class="flex h-16 flex-col items-center justify-center gap-1 rounded-xl border border-dashed border-slate-300 bg-slate-50 text-[12px] font-medium text-slate-500 hover:bg-slate-100">
              ${icon('plus', 'h-4 w-4')}添加截图
            </button>` : ''}
          </div>
        </div>` : ''}

        <button data-action="dissolve-toggle-confirm" class="mt-3 flex w-full items-start gap-2 rounded-xl border px-3 py-2.5 text-left transition ${d.confirmed ? 'border-indigo-600 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
          <span class="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-md border ${d.confirmed ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 text-transparent'}">${icon('check', 'h-3.5 w-3.5')}</span>
          <span class="text-[12px] font-medium leading-relaxed ${d.confirmed ? 'text-indigo-900' : 'text-slate-600'}">${esc(DISCLAIMER_TEXT)}</span>
        </button>
        ${!d.confirmed ? `<p class="mt-1 text-[12px] font-medium text-slate-500">勾选免责确认后方可提交</p>` : ''}

        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">取消</button>
          <button id="dissolveSubmit" data-action="dissolve-confirm" data-id="${c.id}" ${valid ? '' : 'disabled'} class="h-11 flex-[1.6] rounded-xl bg-rose-600 text-[16px] font-semibold text-white hover:bg-rose-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认提前结课</button>
        </div>
      `);
    }

    function renderAppointModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      if (c.status !== 'active') {
        return modalShell(`
          ${modalHeader('当前状态不可委任老师', '仅正式开课的小班可委任主讲老师')}
          <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-[14px] font-medium leading-relaxed text-slate-600">该小班当前为${esc(statusMeta(c).label)}状态，不可再委任主讲老师。</div>
          <div class="mt-3"><button data-action="close-overlay" class="h-11 w-full rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">知道了</button></div>

            <div class="flex items-start gap-2">
              ${icon('alert-triangle', 'h-5 w-5 shrink-0 text-amber-700')}
              <div class="min-w-0 text-[14px] font-semibold leading-relaxed text-amber-950">

                <p class="mt-1 text-[12px] font-medium text-amber-900">长期换师（老师离职、长期请假 ≥3 节或家长集体换师）请走换师方案 2：提前结课解散 → 线下多退少补 → 委任新老师创建新小班。短期 1–2 节应急代课请走代课指派，不解散小班。</p>

            </div>
          </div>
          <div class="mt-3 flex gap-2">
            <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">知道了</button>
            ${ownsClass(c) ? `<button data-action="open-dissolve" data-id="${c.id}" class="h-11 flex-[1.6] rounded-xl bg-rose-600 text-[16px] font-semibold text-white hover:bg-rose-700">提前结课解散</button>` : ''}
          </div>

      return modalShell(`
        ${modalHeader(`委任老师：${c.name}`, `从全平台在职老师中选择技能匹配「${c.courseType}」的主讲老师；直接委任，无需审批`)}
        <div class="mt-3 space-y-1.5">
          ${teachers.length ? teachers.map((t) => {
            const on = state.appoint.selected === t.id;
            return `<button data-action="appoint-select" data-teacher="${t.id}" class="w-full rounded-xl border px-3 py-2.5 text-left transition ${on ? 'border-indigo-600 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
              <div class="flex items-center justify-between gap-2">
                <div class="min-w-0">
                  <div class="flex flex-wrap items-center gap-1.5">
                    <span class="text-[14px] font-bold text-slate-900">${esc(t.name)}</span>
                    <span class="rounded-full border-0 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${t.price}积分</span>
                    ${on ? chip('已选择', 'indigo') : ''}
                  </div>
                  <div class="mt-0.5 text-[12px] font-medium text-slate-500">技能：${esc(t.skills.join(' / '))} · 全平台在职老师</div>
                </div>
                <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 text-transparent'}">${icon('check', 'h-3.5 w-3.5')}</span>
              </div>
            </button>`;
          }).join('') : `<div class="rounded-xl border border-dashed border-slate-300 px-3 py-5 text-center text-[14px] font-medium leading-relaxed text-slate-500">暂无技能匹配「${esc(c.courseType)}」的在职老师，请调整课程类型或稍后再试</div>`}
        </div>
        ${selected ? `<div class="mt-2 rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-600">已选择 <span class="font-bold text-slate-900">${esc(selected.name)}</span>（${selected.price}积分）；委任后即可为本班购课与排课。</div>` : ''}
        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">取消</button>
          <button data-action="appoint-confirm" data-id="${c.id}" ${selected && teachers.length && state.online !== 'off' ? '' : 'disabled'} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认委任</button>
        </div>
      `);
    }

    function renderBlockedModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      return modalShell(`
        ${modalHeader('暂不可录单与排课', '请先完成主讲老师委任')}
        <div class="mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-3">
          <div class="flex items-start gap-2">
            ${icon('alert-triangle', 'h-5 w-5 shrink-0 text-rose-700')}
            <p class="text-[14px] font-semibold leading-relaxed text-rose-950">该小班尚未委任授课老师，请先点击【委任老师】选定主讲老师后再录单收款与排课</p>
          </div>
        </div>
        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">知道了</button>
          ${ownsClass(c) ? `<button data-action="blocked-appoint" data-id="${c.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[1.6] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">去委任老师</button>` : ''}
        </div>
      `);
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'ext-link') return;
      if (action === 'bell') return showToast(`消息中心有 ${BANNERS[state.role].unread} 条新通知`);
      if (action === 'back-main') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'back-classes') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'open-class') {
        state.activeClassId = el.dataset.id;
        state.page = 'detail';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.logOpen = false;
        state.overlay = null;
        return renderAll();
      }
      if (action === 'open-log') {
        state.activeClassId = el.dataset.id;
        state.page = 'detail';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.logOpen = true;
        state.overlay = null;
        return renderAll();
      }
      if (action === 'open-edit') return openEdit(el.dataset.id);
      if (action === 'save-edit') return saveEdit();
      if (action === 'toggle-log') { state.logOpen = !state.logOpen; return renderAll(); }
      if (action === 'set-filter') { state.filter = el.dataset.filter; return renderAll(); }
      if (action === 'set-teacher') { state.teacherFilter = el.dataset.teacher; return renderAll(); }
      if (action === 'show-teacher-all') { state.filter = 'all'; return renderAll(); }
      if (action === 'reset-filters') { state.teacherFilter = 'all'; state.filter = 'all'; return renderAll(); }
      if (action === 'open-create') return openCreate();
      if (action === 'cancel-create') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'submit-create') return submitCreate();
      if (action === 'open-reopen') return openReopen(el.dataset.id);
      if (action === 'suspend-class') {
        if (state.online === 'off') return showToast('离线模式下不可暂停待排');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可执行暂停待排');
        const released = c.futureTs;
        if (released > 0) {
          c.futureTs = 0;
          c.unsettledTs += released;
          appendAudit(c, '暂停待排', `${released} 节未来排课已退回待排池（补排待办：立即补排）`);
        } else {
          appendAudit(c, '暂停待排', '本次暂停待排已记录，当前无未来排课');
        }
        renderAll();
        return showToast(released > 0 ? `已提交暂停待排 · ${released} 节退回待排池，可在补排待办中立即补排` : '已提交暂停待排');
      }
      if (action === 'open-archive') {
        if (state.online === 'off') return showToast('离线模式下不可归档');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可归档小班');
        state.overlay = { type: 'archive', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'open-dissolve') {
        if (state.online === 'off') return showToast('离线模式下不可提前结课解散');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可提前结课解散');
        state.dissolve = emptyDissolve();
        state.overlay = { type: 'dissolve', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'dissolve-reason') {
        state.dissolve.reason = el.dataset.reason;
        return renderOverlayOnly();
      }
      if (action === 'dissolve-disposition') {
        state.dissolve.disposition = el.dataset.disposition;
        return renderOverlayOnly();
      }
      if (action === 'dissolve-add-shot') {
        if (state.dissolve.screenshots < 3) state.dissolve.screenshots += 1;
        return renderOverlayOnly();
      }
      if (action === 'dissolve-remove-shot') {
        if (state.dissolve.screenshots > 0) state.dissolve.screenshots -= 1;
        return renderOverlayOnly();
      }
      if (action === 'dissolve-toggle-confirm') {
        state.dissolve.confirmed = !state.dissolve.confirmed;
        return renderOverlayOnly();
      }
      if (action === 'open-appoint') {
        if (state.online === 'off') return showToast('离线模式下不可委任老师');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可委任老师');
        state.appoint = { classId: el.dataset.id, selected: '' };
        state.overlay = { type: 'appoint', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'appoint-select') {
        state.appoint.selected = el.dataset.teacher;
        return renderOverlayOnly();
      }
      if (action === 'blocked-order' || action === 'blocked-schedule') {
        state.overlay = { type: 'blocked', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'blocked-appoint') {
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return;
        if (state.online === 'off') return showToast('离线模式下不可委任老师');
        state.appoint = { classId: c.id, selected: '' };
        state.overlay = { type: 'appoint', classId: c.id };
        return renderAll();
      }
      if (action === 'appoint-confirm') {
        if (state.online === 'off') return showToast('离线模式下不可委任老师');
        const c = classById(el.dataset.id);
        const t = teacherById(state.appoint.selected);
        if (!c || !t || !ownsClass(c)) return;
        if (c.status !== 'active') return showToast('仅正式开课小班可委任主讲老师');
        if (c.teacherId) return showToast('该班已委任主讲老师；长期换师请走提前结课解散并创建新小班');
        if (!teacherOptions(c.courseType).some((x) => x.id === t.id)) return showToast('请选择技能匹配的在职老师');
        c.teacherId = t.id;
        appendAudit(c, '委任老师', `主讲老师: 待委任 → ${t.name}（全平台直接委任）`);
        state.overlay = null;
        renderAll();
        return showToast(`已委任 ${t.name} · 购课与排课已恢复`);
      }
      if (action === 'archive-confirm') {
        if (state.online === 'off') return showToast('离线模式下不可归档');
        const c = classById(el.dataset.id);
        if (!c || c.status !== 'active' || !ownsClass(c)) return;
        c.status = 'archived';
        c.archivedAt = TODAY;
        appendAudit(c, '归档小班', '课程结束 · 小班归档，不再新开购课单');
        appendStatus(c, 'active', 'archived', '4 周履约完结 · 主理人归档');
        state.overlay = null;
        renderAll();
        return showToast(`${c.name} 已归档 · 不可新开购课单`);
      }
      if (action === 'dissolve-confirm') {
        if (state.online === 'off') return showToast('离线模式下不可提前结课解散');
        const c = classById(el.dataset.id);
        if (!c || c.status !== 'active' || !ownsClass(c)) return;
        if (!dissolveValid(c)) return showToast('请完成解散原因、处置流向与免责确认');
        const d = { ...state.dissolve };
        const released = c.futureTs;
        const remaining = c.futureTs + c.unsettledTs;
        const completed = Number(c.completedTs) || 0;
        const voided = released + (d.disposition === 'PERMANENT_TERMINATE' ? c.unsettledTs : 0);
        const refundTotal = remaining * Number(c.total || 0);
        const perCapita = c.max > 0 ? refundTotal / c.max : 0;
        c.status = 'early_terminated';
        c.futureTs = 0;
        c.voidedTs = voided;
        if (d.disposition === 'PERMANENT_TERMINATE') c.unsettledTs = 0;
        c.termination = {
          reason: d.reason,
          disposition: d.disposition,
          note: d.note.trim(),
          at: TODAY,
          releasedTs: released,
          completedTs: completed,
          voidedTs: voided,
          remainingLessons: remaining,
          refundTotal,
          perCapita,
          screenshots: d.screenshots
        };
        const releasedTeacher = classTeacher(c);
        appendAudit(c, '提前结课解散', `小班 ${c.id} · 原因: ${reasonLabel(d.reason)} · 流向: ${dispositionLabel(d.disposition)} · 已结课 ${completed} 节 · 作废 ${voided} 节 · 未来 ${released} 节已取消释放${releasedTeacher ? ` · 已向原授课老师 ${releasedTeacher.name} 发送排期释放提醒` : ''} · 备注: ${d.note.trim() || '无'}${d.screenshots ? ` · 凭证 ${d.screenshots} 张` : ''}`);
        appendStatus(c, 'active', 'early_terminated', `${reasonLabel(d.reason)} · ${dispositionLabel(d.disposition)}`);
        state.overlay = null;
        state.dissolve = emptyDissolve();
        renderAll();
        const notify = releasedTeacher ? ` · 已向原授课老师 ${releasedTeacher.name} 发送排期释放提醒` : '';
        return showToast(`已提前结课解散 · 未来 ${released} 节已释放${notify}`);
      }
      if (action === 'close-overlay') {
        state.overlay = null;
        $('overlay').innerHTML = '';
        if (window.lucide) lucide.createIcons();
        return;
      }
    });

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'fClassName') { state.create.name = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fMax') { state.create.max = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fSalary') { state.create.salary = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fTotal') { state.create.total = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'eName' || id === 'eMax' || id === 'eSalary' || id === 'eTotal') {
        if (!state.edit) return;
        if (id === 'eName') state.edit.name = e.target.value;
        if (id === 'eMax') state.edit.max = e.target.value;
        if (id === 'eSalary') state.edit.salary = e.target.value;
        if (id === 'eTotal') state.edit.total = e.target.value;
        state.edit.error = '';
        updateEditLive();
      }
      if (id === 'fDissolveNote') {
        state.dissolve.note = e.target.value;
        const btn = $('dissolveSubmit');
        const c = state.overlay ? classById(state.overlay.classId) : null;
        if (btn && c) btn.disabled = !dissolveValid(c);
      }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'fCourseType') {
        state.create.courseType = e.target.value;
        state.create.error = '';
        if (state.create.teacherId && !teacherOptions(state.create.courseType).some((t) => t.id === state.create.teacherId)) state.create.teacherId = '';
        renderAll();
      }
      if (id === 'fTeacher') { state.create.teacherId = e.target.value; state.create.error = ''; renderAll(); }
      if (id === 'fOwnerMonitor') { state.create.ownerMonitorId = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'eCourseType' && state.edit) {
        state.edit.courseType = e.target.value;
        state.edit.error = '';
        if (state.edit.teacherId && !teacherOptions(state.edit.courseType).some((t) => t.id === state.edit.teacherId)) {
          state.edit.teacherId = '';
          showToast('课程类型已变更 · 原老师技能不匹配，已清空为待委任老师');
        }
        const scroller = document.querySelector('#overlay [data-edit-scroll]');
        const top = scroller ? scroller.scrollTop : 0;
        renderOverlayOnly();
        const next = document.querySelector('#overlay [data-edit-scroll]');
        if (next) next.scrollTop = top;
      }
      if (id === 'eTeacher' && state.edit) {
        state.edit.teacherId = e.target.value;
        state.edit.error = '';
        updateEditLive();
      }
    });

    function navTo(tab) {
      if (state.role === 'admin' && tab === 'settings') return setView('classes');
      if (state.role === 'monitor' && tab === 'ops') return setView('classes');
      state.page = 'placeholder';
      state.navTab = tab;
      state.overlay = null;
      renderAll();
    }

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    /* ------------------------------------------------------------------
     * URL 直达弹层（仅用于演示与截图）
     * ------------------------------------------------------------------ */
    function applyUrlOverlay() {
      const overlay = params.get('overlay');
      if (overlay === 'dissolve') {
        const c = classById(state.activeClassId);
        if (c && c.status === 'active') {
          state.dissolve = {
            reason: params.get('reason') || '',
            disposition: params.get('disposition') || '',
            note: params.get('note') || '',
            screenshots: Math.min(3, Math.max(0, Number(params.get('screenshots') || 0))),
            confirmed: params.get('confirmed') === '1'
          };
          state.overlay = { type: 'dissolve', classId: c.id };
        }
      }
      if (overlay === 'appoint') {
        const c = classById(state.activeClassId);
        if (c) {
          state.appoint = { classId: c.id, selected: params.get('teacher') || '' };
          state.overlay = { type: 'appoint', classId: c.id };
        }
      }
      if (overlay === 'blocked') {
        const c = classById(state.activeClassId);
        if (c) state.overlay = { type: 'blocked', classId: c.id };
      }
      if (overlay === 'edit') {
        const c = classById(state.activeClassId);
        if (c) {
          state.edit = emptyEdit(c);
          state.overlay = { type: 'edit', classId: c.id };
        }
      }
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    applyUrlOverlay();
    renderAll();
  </script>
</body>
</html>

      admin: { gradient: 'from-slate-900 via-violet-950 to-slate-800', brand: 'Dream 运营中枢', role: '管理员', subtitle: '平台统筹 · Sarah', initial: 'S', pattern: `<svg class="pointer-events-none absolute inset-0 h-full w-full" viewBox="0 0 390 80" preserveAspectRatio="xMidYMid slice" fill="none"><circle cx="325" cy="18" r="38" stroke="white" stroke-opacity=".08"/><circle cx="325" cy="18" r="24" stroke="white" stroke-opacity=".06"/><path d="M0 68 C60 40 120 82 190 52 S300 20 390 48" stroke="white" stroke-opacity=".07" stroke-width="16" stroke-linecap="round"/></svg>` }
    };

      rose: { card: 'border-rose-200/70 bg-rose-50/80', chip: 'border-rose-200 bg-rose-100 text-rose-800', icon: 'bg-rose-100 text-rose-700', action: 'bg-rose-600 text-white hover:bg-rose-700', title: 'text-rose-950', body: 'text-rose-900/85', sub: 'text-rose-700', right: 'text-rose-950' },

    };

    const SOFT_BTN = {
      amber: 'border-amber-300 bg-white/70 text-amber-800 hover:bg-white',
      indigo: 'border-indigo-300 bg-white/70 text-indigo-800 hover:bg-white',
      emerald: 'border-emerald-300 bg-white/70 text-emerald-800 hover:bg-white',
      rose: 'border-rose-300 bg-white/70 text-rose-800 hover:bg-white',
      slate: 'border-slate-300 bg-white/70 text-slate-700 hover:bg-white'
    };

    /* ------------------------------------------------------------------
     * 状态与工具
     * ------------------------------------------------------------------ */
    function emptyCreate() {
      return {
        name: '', courseType: 'KET', teacherId: 'tc_david0001', monitorId: CURRENT_MONITOR_ID,
        max: '4', salary: '30', rate: '10.00', total: '80', error: ''
      };
    }

    const state = {
      role: 'monitor',
      page: 'classes',
      navTab: 'ops',
      device: 'mobile',
      online: 'on',
      classes: JSON.parse(JSON.stringify(INITIAL_CLASSES)),
      activeClassId: 'cls_ket00001',
      filter: 'all',
      create: emptyCreate(),
      overlay: null
    };

    const $ = (id) => document.getElementById(id);
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function currentNav() {
      return NAVS[state.role];
    }

    function teacherById(id) {
      return TEACHERS.find((t) => t.id === id) || null;
    }

    function monitorById(id) {
      return MONITORS.find((m) => m.id === id) || null;
    }

    function classById(id) {
      return state.classes.find((c) => c.id === id) || null;
    }

    function allClasses() {
      return state.classes;
    }

    function myClasses() {
      return state.classes.filter((c) => c.monitorId === CURRENT_MONITOR_ID);
    }

    function scopedClasses() {
      return state.role === 'admin' ? allClasses() : myClasses();
    }

    function filteredClasses() {
      const list = scopedClasses();
      return state.filter === 'all' ? list : list.filter((c) => c.status === state.filter);
    }

    function ensureActiveClass() {
      const list = scopedClasses();
      if (list.some((c) => c.id === state.activeClassId)) return;
      state.activeClassId = list[0] ? list[0].id : '';
    }

    function classTeacher(c) {
      return teacherById(c.teacherId) || { name: '—', level: '' };
    }

    function classMonitor(c) {
      return monitorById(c.monitorId) || { name: '—' };
    }

    function points(n) {
      const v = Math.round((Number(n) + Number.EPSILON) * 100) / 100;
      return Number.isInteger(v) ? String(v) : v.toFixed(2);
    }

    function calcFinance(f) {
      const max = Number(f.max) || 0;
      const salary = Number(f.salary) || 0;
      const rate = Number(f.rate) || 0;
      const total = Number(f.total) || 0;
      const toolFee = max * 6;
      const net = total - salary - toolFee;
      const platformShare = net > 0 ? Math.round(net * rate) / 100 : 0;
      const retained = net - platformShare;
      const transfer = salary + toolFee + platformShare;
      return { max, salary, rate, total, toolFee, net, platformShare, retained, transfer };
    }

    function statusMeta(c) {
      if (c.status === 'archived') return { label: '已归档', tone: 'slate' };
      if (c.status === 'cancelled') return { label: '已取消', tone: 'rose' };
      return { label: '正式开课', tone: 'emerald' };
    }

    function chip(label, tone) {
      return `<span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${TONES[tone].chip}">${esc(label)}</span>`;
    }

    function newClassId() {
      return `cls_${Math.random().toString(36).slice(2, 10).padEnd(8, '0')}`;
    }

    function teacherOptions() {
      return state.role === 'admin' ? TEACHERS : TEACHERS.filter((t) => t.monitorId === CURRENT_MONITOR_ID);
    }

    function monitorOptions() {
      return state.role === 'admin' ? MONITORS : MONITORS.filter((m) => m.id === CURRENT_MONITOR_ID);
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function currentViewKey() {
      if (state.page === 'placeholder') return '';
      if (state.page === 'create') return 'create';
      if (state.page === 'detail') return 'detail';
      if (state.page === 'classes') return 'classes';
      return '';
    }

    function syncConsole() {
      const view = currentViewKey();
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const value = b.dataset.value;
        let active = false;
        if (group === 'role') active = state.role === value;
        if (group === 'view') active = view === value;
        if (group === 'device') active = state.device === value;
        if (group === 'online') active = state.online === value;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;
      });
    }

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'view') setView(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：可浏览班级，创建、归档、解散与整班停课不可用');
        }
      });
    });

    function setRole(role) {
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.page = 'classes';
      state.navTab = role === 'admin' ? 'settings' : 'ops';
      state.filter = 'all';
      state.overlay = null;
      ensureActiveClass();
      renderAll();
    }

    function setView(view) {
      if (view === 'classes') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      }
      if (view === 'detail') {
        if (!scopedClasses().length) {
          showToast('暂无可查看的班级');
          state.page = 'classes';
        } else {
          ensureActiveClass();
          state.page = 'detail';
          state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        }
      }
      if (view === 'create') {
        openCreate();
        return;
      }
      state.overlay = null;
      renderAll();
    }

    function resetDemo() {
      state.role = 'monitor';
      state.page = 'classes';
      state.navTab = 'ops';
      state.device = 'mobile';
      state.online = 'on';
      state.classes = JSON.parse(JSON.stringify(INITIAL_CLASSES));
      state.activeClassId = 'cls_ket00001';
      state.filter = 'all';
      state.create = emptyCreate();
      state.overlay = null;
      renderAll();
      showToast('演示数据已重置');
    }

    $('btnResetDemo').addEventListener('click', resetDemo);

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线模式：可浏览班级，创建、归档、解散与整班停课不可用`
        : '';

      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = state.page === 'create' ? '' : renderNav();

      const b = BANNERS[state.role];
      return `<header class="relative flex h-[68px] shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${b.gradient} px-4 text-white">

        <div class="relative flex min-w-0 items-center gap-2.5">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${b.initial}</span>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="truncate text-[16px] font-bold">${esc(b.brand)}</span>
              <span class="shrink-0 rounded-full bg-white/20 px-2 py-0.5 text-[12px] font-bold">${esc(b.role)}</span>
            </div>
            <div class="truncate text-[12px] text-white/70">${esc(b.subtitle)}</div>
          </div>
        </div>
        <button data-action="toast" data-message="暂无新消息" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
          ${icon('bell', 'h-4 w-4')}
          <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-rose-400 ring-1 ring-white/50"></span>
        </button>
      </header>`;
    }

    function renderNav() {
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${currentNav().map((item) => {
            const on = state.navTab === item.id;
            return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-400'}">
              ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
              <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.page === 'create') return renderCreatePage();
      if (state.page === 'detail') return renderClassDetail();
      return renderClasses();
    }

    function renderPlaceholder() {
      const item = currentNav().find((n) => n.id === state.navTab);
      if (!item) return `<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>`;
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">打开对应原型</a>` : ''}
        <button data-action="back-main" class="mt-3 text-[14px] font-semibold text-indigo-600">返回小班列表</button>

     * 通用组件

    function pageHeader(title, subtitle, right = '') {
      return `<div class="flex items-end justify-between gap-3 px-1">

          <p class="mt-0.5 text-[12px] font-medium text-slate-400">${esc(subtitle)}</p>
        </div>

      return `<button data-action="${action}" class="flex items-center gap-1 text-[14px] font-semibold text-slate-500 transition hover:text-slate-800">${icon('chevron-left', 'h-4 w-4')}${esc(label)}</button>`;
    }

    function miniStat(label, value, tone, suffix = '') {
      const T = TONES[tone];
      return `<div class="rounded-xl border px-2 py-2 ${T.card}">
        <div class="text-[12px] font-medium ${T.sub}">${esc(label)}</div>

      return `<div class="rounded-xl bg-white/60 px-2 py-1.5">

      const scoped = scopedClasses();

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader(
          state.role === 'admin' ? '小班课配置' : '我的小班课',
          state.role === 'admin' ? `全平台 ${scoped.length} 个班级 · 班级运营核算` : `${classMonitor({ monitorId: CURRENT_MONITOR_ID }).name} 负责 · ${scoped.length} 个班级 · 建班即生效`,
          `<button data-action="open-create" ${offline ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg bg-indigo-600 px-3 text-[12px] font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">+ 创建小班</button>`
        )}
        <div class="grid grid-cols-3 gap-2">

        </div>
        ${state.role === 'admin' ? `<section class="rounded-xl border border-indigo-200/70 bg-indigo-50/80 p-3 shadow-sm">
          <div class="flex items-start gap-2.5">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-indigo-100 text-indigo-700">${icon('eye-off', 'h-4 w-4')}</span>
            <div class="min-w-0">
              <div class="text-[14px] font-bold text-indigo-950">1v1 静默实体（后台）</div>
              <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-indigo-900/85">当前 ${ONE_TO_ONE_COUNT} 个 · 系统在购课或首次排课时自动建班；家长端与教师端仅呈现意向老师 + 课程类型，不出现班级字样。</p>
            </div>
          </div>
        </section>` : ''}
        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">小班课不关联学生档案与家长账号；招生、沟通与补课由班长在线下完成。建班即生效。</div>
      </div>`;

    function classCard(c) {

      const fin = calcFinance(c);
      const t = classTeacher(c);
      const m = classMonitor(c);
      const active = c.status === 'active';
      const tone = meta.tone;
      const T = TONES[tone];
      const cardCls = active ? 'border-slate-200/80 bg-white' : T.card;
      const titleCls = active ? 'text-slate-900' : T.title;
      const subCls = active ? 'text-slate-500' : T.sub;
      const bodyCls = active ? 'text-slate-600' : T.body;
      const offline = state.online === 'off';
      return `<article data-action="open-class" data-id="${c.id}" role="button" tabindex="0" class="cursor-pointer rounded-2xl border p-3.5 shadow-sm transition active:scale-[0.995] ${cardCls}">

        ${active ? `<div class="mt-2 grid grid-cols-4 gap-1 text-center">
          <div><div class="text-[12px] font-medium text-slate-400">单节实收</div><div class="mt-0.5 font-mono text-[16px] font-bold text-slate-900">${points(fin.total)}</div></div>
          <div><div class="text-[12px] font-medium text-slate-400">教师课酬</div><div class="mt-0.5 font-mono text-[16px] font-bold text-amber-700">${points(fin.salary)}</div></div>
          <div><div class="text-[12px] font-medium text-slate-400">工具费</div><div class="mt-0.5 font-mono text-[16px] font-bold text-slate-600">${points(fin.toolFee)}</div></div>

        </div>
        <div class="mt-1 flex items-center justify-between gap-2 rounded-lg bg-slate-50 px-2 py-1.5 text-[12px] font-medium text-slate-500">
          <span class="min-w-0 truncate">平台服务分成 <span class="font-mono font-bold text-slate-700">${points(fin.platformShare)}</span> · ${fin.net > 0 ? '班长留存' : '班长自补'} <span class="font-mono font-bold ${fin.net > 0 ? 'text-emerald-700' : 'text-rose-700'}">${points(fin.net > 0 ? fin.retained : Math.abs(fin.net))}</span></span>

        </div>` : `<div class="mt-2 rounded-lg bg-white/60 px-2 py-1.5 text-[12px] font-medium ${bodyCls}">单节实收 ${points(fin.total)} · 教师课酬 ${points(fin.salary)} · 工具费 ${points(fin.toolFee)} · 净盈余 ${points(fin.net)}</div>`}

        ${c.status === 'archived' ? `<div class="mt-1.5 text-[12px] font-medium ${T.sub}">已归档 · 不再允许新开购课单；历史排课与财务记录只读。</div>` : ''}
        ${c.status === 'cancelled' ? `<div class="mt-1.5 text-[12px] font-medium ${T.sub}">已取消 · 原因：${esc(c.cancelledReason || '—')} · 未排期 TS 已联动退回待排期。</div>` : ''}

        ${active ? `<div class="mt-2 flex gap-1.5 border-t border-black/5 pt-2">
            <a href="m2a_course_orders.html" target="_blank" rel="noopener" data-action="ext-link" class="flex h-8 flex-1 items-center justify-center rounded-lg bg-indigo-600 text-[12px] font-bold text-white hover:bg-indigo-700">为本班购课</a>

            <button data-action="suspend-class" ${offline ? 'disabled' : ''} class="h-8 flex-1 rounded-lg border border-slate-200 bg-slate-100 text-[12px] font-bold text-slate-700 hover:bg-slate-200 disabled:opacity-40">整班停课</button>
            <button data-action="open-archive" data-id="${c.id}" ${offline ? 'disabled' : ''} class="h-8 flex-1 rounded-lg border border-slate-200 bg-slate-100 text-[12px] font-bold text-slate-700 hover:bg-slate-200 disabled:opacity-40">归档</button>
        </div>` : `<div class="mt-2 flex items-center justify-between border-t border-black/5 pt-2">
          <span class="text-[12px] font-medium ${T.sub}">查看班级运营核算与历史记录</span>
          <button data-action="open-class" data-id="${c.id}" class="h-8 rounded-lg border ${SOFT_BTN[tone]} px-2.5 text-[12px] font-bold">查看详情</button>
        </div>`}
      </article>`;
    }

    function miniTile(label, value, tone) {
      const T = TONES[tone];
      return `<div class="rounded-lg border px-1.5 py-1.5 ${T.card}">

        <div class="mt-0.5 font-mono text-[16px] font-bold ${T.right}">${esc(value)}</div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 班级详情
     * ------------------------------------------------------------------ */
    function renderClassDetail() {
      const c = classById(state.activeClassId);
      if (!c) return renderClasses();
      const meta = statusMeta(c);
      const fin = calcFinance(c);
      const t = classTeacher(c);
      const m = classMonitor(c);
      const active = c.status === 'active';
      const offline = state.online === 'off';
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        ${backRow('back-classes', '小班列表')}
        <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
          <div class="flex flex-wrap items-center gap-1.5">
            <h1 class="truncate text-[18px] font-bold tracking-tight text-slate-900">${esc(c.name)}</h1>
            ${chip(meta.label, meta.tone)}
            ${chip(`${c.max} 人班`, 'indigo')}
          </div>

          <div class="mt-2 grid grid-cols-2 gap-x-3 gap-y-2">
            ${infoItem('课程类型', c.courseType)}
            ${infoItem('授课老师', `${t.name} (${t.level})`)}

        </section>

          <h2 class="text-[16px] font-bold text-slate-900">班级操作</h2>
          ${active ? `<div class="mt-2 space-y-1.5">
            <div class="flex gap-1.5">
              <a href="m2a_course_orders.html" target="_blank" rel="noopener" class="flex h-11 flex-1 items-center justify-center rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700">为本班购课</a>
              <a href="m3a_calendar_schedule.html" target="_blank" rel="noopener" class="flex h-11 flex-1 items-center justify-center rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">班级排课</a>
            </div>
            <div class="flex gap-1.5">
              <button data-action="suspend-class" ${offline ? 'disabled' : ''} class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200 disabled:opacity-40">整班停课</button>
              <button data-action="open-archive" data-id="${c.id}" ${offline ? 'disabled' : ''} class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200 disabled:opacity-40">归档</button>
              <button data-action="open-dissolve" data-id="${c.id}" ${offline ? 'disabled' : ''} class="h-11 flex-1 rounded-xl border border-rose-200 bg-rose-50 text-[16px] font-semibold text-rose-700 hover:bg-rose-100 disabled:opacity-40">解散</button>
            </div>
          </div>` : `<div class="mt-2 rounded-xl border px-3 py-2.5 text-[12px] font-medium leading-relaxed ${c.status === 'archived' ? 'border-slate-200 bg-slate-50 text-slate-500' : 'border-rose-200 bg-rose-50 text-rose-700'}">
            ${c.status === 'archived' ? `已归档于 ${esc(c.archivedAt || '—')} · 不可新开购课单；历史排课与财务记录只读。` : `已取消于 ${esc(c.cancelledAt || '—')} · 原因：${esc(c.cancelledReason || '—')} · 未排期 TS 已联动退回待排期。`}
          </div>
          <a href="m3a_calendar_schedule.html" target="_blank" rel="noopener" class="mt-2 flex h-11 items-center justify-center rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">查看历史排课</a>`}
        </section>

        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">小班课不关联学生档案与家长账号；平台固定工具费 = Max × 6，服务分成按单节净盈余计算。</div>
      </div>`;
    }

    function infoItem(label, value) {

        <div class="text-[12px] font-medium text-slate-400">${esc(label)}</div>
        <div class="mt-0.5 truncate text-[14px] font-semibold text-slate-900">${esc(value)}</div>
      </div>`;
    }

    function financeCard(fin, title, showFormula = false) {

      return `<section class="rounded-2xl border ${T.card} p-3.5 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="grid h-8 w-8 place-items-center rounded-xl ${T.icon}">${icon('calculator', 'h-4 w-4')}</span>

          </div>

      </section>`;

    /* ------------------------------------------------------------------
     * 创建班级
     * ------------------------------------------------------------------ */
    function renderCreatePage() {
      const f = state.create;
      const inputCls = 'h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500';
      const teachers = teacherOptions();
      const monitors = monitorOptions();
      const fin = calcFinance(f);
      return `<div class="flex h-full min-h-0 flex-col">
        <div class="min-h-0 flex-1 overflow-y-auto">
          <div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3">
            <div class="flex items-center justify-between gap-2">
              <button data-action="cancel-create" class="flex items-center gap-1 text-[14px] font-semibold text-slate-500">${icon('chevron-left', 'h-4 w-4')}返回</button>
              <span class="text-[12px] font-medium ${state.online === 'off' ? 'text-rose-600' : 'text-slate-400'}">${state.online === 'off' ? '离线不可创建' : '建班即生效'}</span>
            </div>
            <div class="px-1">
              <h1 class="text-[18px] font-bold tracking-tight text-slate-900">创建小班课</h1>
              <p class="mt-0.5 text-[12px] font-medium text-slate-400">班长独立运营 · 不关联学生档案与家长账号</p>
            </div>

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
              <h2 class="text-[16px] font-bold text-slate-900">基本信息</h2>
              <div class="mt-2.5 space-y-3">
                <div>
                  <label for="fClassName" class="mb-1 block text-[14px] font-semibold text-slate-700">班级名称 <span class="text-rose-500">*</span></label>
                  <input id="fClassName" value="${esc(f.name)}" maxlength="64" placeholder="如 KET 冲刺精讲小班" class="${inputCls}">
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label for="fCourseType" class="mb-1 block text-[14px] font-semibold text-slate-700">课程类型 <span class="text-rose-500">*</span></label>
                    <select id="fCourseType" class="${inputCls} font-medium">${COURSE_TYPES.map((t) => `<option ${f.courseType === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
                  </div>
                  <div>
                    <label for="fTeacher" class="mb-1 block text-[14px] font-semibold text-slate-700">授课老师 <span class="text-rose-500">*</span></label>
                    <select id="fTeacher" class="${inputCls} font-medium">${teachers.map((t) => `<option value="${t.id}" ${f.teacherId === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
                  </div>
                </div>
                <div>
                  <label for="fMonitor" class="mb-1 block text-[14px] font-semibold text-slate-700">负责班长 <span class="text-rose-500">*</span></label>
                  ${state.role === 'admin'
                    ? `<select id="fMonitor" class="${inputCls} font-medium">${monitors.map((m) => `<option value="${m.id}" ${f.monitorId === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>`
                    : `<div class="flex h-11 items-center justify-between rounded-xl border border-slate-200 bg-slate-100 px-3 text-[14px] font-medium text-slate-600"><span>Leo（当前班长）</span>${icon('lock', 'h-3.5 w-3.5 text-slate-400')}</div>`}
                </div>
              </div>
            </section>

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
              <div class="flex items-center justify-between">
                <h2 class="text-[16px] font-bold text-slate-900">班级规模</h2>
                <span class="text-[12px] font-medium text-slate-400">2–20 人</span>
              </div>
              <div class="mt-2.5">
                <label for="fMax" class="mb-1 block text-[14px] font-semibold text-slate-700">最大学生数 Max <span class="text-rose-500">*</span></label>
                <input id="fMax" type="number" min="2" max="20" step="1" value="${esc(f.max)}" class="${inputCls}">
                <p id="toolFeeInline" class="mt-1 text-[12px] font-medium text-slate-400">平台固定工具费 = Max × 6 = <span class="font-mono font-bold text-slate-700">${points(fin.toolFee)}</span> 积分</p>
              </div>
            </section>

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
              <h2 class="text-[16px] font-bold text-slate-900">财务参数</h2>
              <div class="mt-2.5 space-y-3">
                <div>
                  <label for="fSalary" class="mb-1 block text-[14px] font-semibold text-slate-700">教师单节课酬积分 <span class="text-rose-500">*</span></label>
                  <input id="fSalary" type="number" min="0" step="1" value="${esc(f.salary)}" class="${inputCls}">
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label for="fRate" class="mb-1 block text-[14px] font-semibold text-slate-700">平台服务分成比例 R% <span class="text-rose-500">*</span></label>
                    <input id="fRate" type="number" min="0" max="100" step="0.01" value="${esc(f.rate)}" class="${inputCls}">
                  </div>
                  <div>
                    <label for="fTotal" class="mb-1 block text-[14px] font-semibold text-slate-700">单节折算总学费积分 <span class="text-rose-500">*</span></label>
                    <input id="fTotal" type="number" min="0" step="1" value="${esc(f.total)}" class="${inputCls}">
                  </div>
                </div>
              </div>
            </section>

            <div id="financePreview">${financeCard(fin, '实时核算预览', true)}</div>

            <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">建班即生效（active）；不录入学生名单，不关联家长账号。Max 是平台固定工具费（Max × 6）的唯一计算基准。</div>
            ${f.error ? `<div id="createError" class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-rose-700">${esc(f.error)}</div>` : ''}
          </div>
        </div>
        <div class="flex shrink-0 gap-2 border-t border-slate-200 bg-white px-4 py-3">
          <button data-action="cancel-create" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
          <button id="btnCreateClass" data-action="submit-create" ${createError() ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">创建并生效</button>
        </div>
      </div>`;
    }

    function updateCreatePreview() {
      const f = state.create;
      const fin = calcFinance(f);
      const preview = $('financePreview');
      if (preview) preview.innerHTML = financeCard(fin, '实时核算预览', true);
      const inline = $('toolFeeInline');
      if (inline) inline.innerHTML = `平台固定工具费 = Max × 6 = <span class="font-mono font-bold text-slate-700">${points(fin.toolFee)}</span> 积分`;
      const btn = $('btnCreateClass');
      if (btn) btn.disabled = !!createError();
    }

    function createError() {
      const f = state.create;
      if (state.online === 'off') return '离线模式下不可创建班级';
      const name = f.name.trim();
      if (!name) return '请填写班级名称';
      if (name.length > 64) return '班级名称不能超过 64 字符';
      if (!COURSE_TYPES.includes(f.courseType)) return '请选择课程类型';
      if (!TEACHERS.some((t) => t.id === f.teacherId)) return '请选择在职授课老师';
      if (!MONITORS.some((m) => m.id === f.monitorId)) return '请选择负责班长';
      const max = Number(f.max);
      if (!Number.isInteger(max) || max < 2 || max > 20) return '最大学生数 Max 需为 2–20 的整数';
      const salary = Number(f.salary);
      if (!Number.isInteger(salary) || salary < 0) return '教师单节课酬需为非负整数';
      const rateStr = String(f.rate).trim();
      if (!/^\d{1,3}(\.\d{1,2})?$/.test(rateStr)) return '平台服务分成比例需为 0–100，最多 2 位小数';
      const rate = Number(rateStr);
      if (!(rate >= 0 && rate <= 100)) return '平台服务分成比例需为 0–100';
      const total = Number(f.total);
      if (!Number.isFinite(total) || total < 0) return '单节折算总学费需为非负数';
      return null;
    }

    function openCreate() {
      if (state.online === 'off') return showToast('离线模式下不可创建班级');
      const teachers = teacherOptions();
      state.create = {
        ...emptyCreate(),
        teacherId: teachers[0] ? teachers[0].id : '',
        monitorId: state.role === 'admin' ? 'mn_leo000001' : CURRENT_MONITOR_ID
      };
      state.page = 'create';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      updateCreatePreview();
    }

    function submitCreate() {
      const err = createError();
      if (err) {
        state.create.error = err;
        renderAll();
        setTimeout(() => $('createError')?.scrollIntoView({ block: 'center' }), 60);
        showToast(err);
        return;
      }
      const f = state.create;
      const c = {
        id: newClassId(),
        name: f.name.trim(),
        courseType: f.courseType,
        teacherId: f.teacherId,
        monitorId: f.monitorId,
        max: Number(f.max),
        salary: Number(f.salary),
        rate: Number(f.rate),
        total: Number(f.total),
        status: 'active',
        futureTs: 0,
        unsettledTs: 0,
        createdAt: TODAY
      };
      state.classes.unshift(c);
      state.activeClassId = c.id;
      state.page = 'detail';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      showToast(`已创建 ${c.name} · 建班即生效`);
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'archive') return renderArchiveModal();
      if (state.overlay.type === 'dissolve') return renderDissolveModal();
      return '';
    }

    function modalShell(content) {
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-3 top-1/2 mx-auto max-h-[88%] max-w-[560px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">${content}</div>
      </div>`;
    }

    function modalHeader(title, subtitle = '') {
      return `<div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
          ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
        </div>
        <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
      </div>`;
    }

    function renderArchiveModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      return modalShell(`
        ${modalHeader(`归档班级：${c.name}`, '归档后不再允许新开购课单；历史排课与财务记录保留只读')}
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-slate-600">
          当前班级为正式开课状态，归档不会影响已排期课程与历史财务数据。确认归档？
        </div>
        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
          <button data-action="archive-confirm" data-id="${c.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认归档</button>
        </div>
      `);
    }

    function renderDissolveModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      if (c.futureTs > 0) {
        return modalShell(`
          ${modalHeader(`无法解散：${c.name}`, '仍有未来已排期课程，需先完成排课交接')}
          <div class="mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5">
            <div class="flex items-start gap-2">
              ${icon('alert-triangle', 'h-4 w-4 shrink-0 text-rose-700')}
              <div class="min-w-0">
                <div class="text-[14px] font-bold text-rose-950">仍有 ${c.futureTs} 节已排期课程</div>
                <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-rose-900/85">请先在 M3A 取消或调整未来排课，或在 M3B 处理整班停课；清零后方可解散。</p>
              </div>
            </div>
          </div>
          <div class="mt-2 flex gap-1.5">
            <a href="m3a_calendar_schedule.html" target="_blank" rel="noopener" class="flex h-10 flex-1 items-center justify-center rounded-lg border border-rose-300 bg-white/70 text-[12px] font-bold text-rose-800">前往 M3A 调整排课</a>
            <a href="m3b_attendance_substitution.html" target="_blank" rel="noopener" class="flex h-10 flex-1 items-center justify-center rounded-lg border border-rose-300 bg-white/70 text-[12px] font-bold text-rose-800">前往 M3B 停课</a>
          </div>
          <button data-action="close-overlay" class="mt-3 h-11 w-full rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">知道了</button>
        `);
      }
      return modalShell(`
        ${modalHeader(`解散班级：${c.name}`, '解散后班级置为已取消，不可恢复')}
        <div class="mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-rose-900">
          结余 ${c.unsettledTs} 节未排期 TS 将联动退回待排期；历史排课与财务记录保留只读。确认解散？
        </div>
        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
          <button data-action="dissolve-confirm" data-id="${c.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认解散</button>
        </div>
      `);
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'ext-link') return;
      if (action === 'back-main') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'back-classes') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'open-class') {
        state.activeClassId = el.dataset.id;
        state.page = 'detail';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'set-filter') { state.filter = el.dataset.filter; return renderAll(); }
      if (action === 'open-create') return openCreate();
      if (action === 'cancel-create') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'submit-create') return submitCreate();
      if (action === 'suspend-class') {
        if (state.online === 'off') return showToast('离线模式下不可整班停课');
        return showToast('整班停课将在 M3B 处理（原型模拟）');
      }
      if (action === 'open-archive') {
        if (state.online === 'off') return showToast('离线模式下不可归档');
        state.overlay = { type: 'archive', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'open-dissolve') {
        if (state.online === 'off') return showToast('离线模式下不可解散');
        state.overlay = { type: 'dissolve', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'archive-confirm') {
        if (state.online === 'off') return showToast('离线模式下不可归档');
        const c = classById(el.dataset.id);
        if (!c || c.status !== 'active') return;
        c.status = 'archived';
        c.archivedAt = TODAY;
        state.overlay = null;
        renderAll();
        showToast(`${c.name} 已归档 · 不可新开购课单`);
        return;
      }
      if (action === 'dissolve-confirm') {
        if (state.online === 'off') return showToast('离线模式下不可解散');
        const c = classById(el.dataset.id);
        if (!c || c.status !== 'active') return;
        if (c.futureTs > 0) return showToast('仍有未来已排期课程，无法解散');
        c.status = 'cancelled';
        c.cancelledAt = TODAY;
        c.cancelledReason = '手动解散';
        c.unsettledTs = 0;
        state.overlay = null;
        renderAll();
        showToast(`${c.name} 已解散 · 未排期 TS 已退回待排期`);
        return;
      }
      if (action === 'close-overlay') {
        state.overlay = null;
        $('overlay').innerHTML = '';
        if (window.lucide) lucide.createIcons();
        return;
      }
    });

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'fClassName') { state.create.name = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fMax') { state.create.max = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fSalary') { state.create.salary = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fRate') { state.create.rate = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fTotal') { state.create.total = e.target.value; state.create.error = ''; updateCreatePreview(); }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'fCourseType') { state.create.courseType = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fTeacher') { state.create.teacherId = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fMonitor') { state.create.monitorId = e.target.value; state.create.error = ''; updateCreatePreview(); }
    });

    function navTo(tab) {
      if (state.role === 'admin' && tab === 'settings') return setView('classes');
      if (state.role === 'monitor' && tab === 'ops') return setView('classes');
      state.page = 'placeholder';
      state.navTab = tab;
      state.overlay = null;
      renderAll();
    }

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

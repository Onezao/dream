    /* 小班 Process Note 他生隐私扫描：中文名 / 英文名 / 联系方式分级检测 */
    function scanProcessNotePrivacy(text, c) {
      const raw = String(text || '');
      const hits = [];
      if (!raw.trim()) return hits;
      const seen = new Set();
      const students = [...classMembers(c), ...classRemovedMembers(c)]
        .map((m) => studentById(m.studentId))
        .filter(Boolean);
      students.forEach((s) => {
        if (s.chineseName && s.chineseName.length >= 2 && raw.includes(s.chineseName) && !seen.has(`name:${s.chineseName}`)) {
          seen.add(`name:${s.chineseName}`);
          hits.push({ kind: 'name', label: `学员姓名「${s.chineseName}」` });
        }
        if (s.name && s.name.length >= 2) {
          const re = new RegExp(`\\b${s.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
          if (re.test(raw) && !seen.has(`name:${s.name}`)) {
            seen.add(`name:${s.name}`);
            hits.push({ kind: 'name', label: `学员英文名「${s.name}」` });
          }
        }
      });
      if (/\b1[3-9]\d{9}\b/.test(raw) && !seen.has('contact:phone')) {
        seen.add('contact:phone');
        hits.push({ kind: 'contact', label: '手机号' });
      }
      if (/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i.test(raw) && !seen.has('contact:email')) {
        seen.add('contact:email');
        hits.push({ kind: 'contact', label: '电子邮箱' });
      }
      if (/(微信|wechat|weixin|whatsapp)/i.test(raw) && !seen.has('contact:im')) {
        seen.add('contact:im');
        hits.push({ kind: 'contact', label: '社交账号 / 微信号' });
      }
      return hits;
    }

    /* 小班归属：班长仅可见并持有自己作为小班主理人的小班；管理员可见全平台并可按主理人收敛 */
    function scopeClasses() {
      if (!isAdmin()) return state.classes.filter((c) => c.ownerMonitorId === CURRENT_MONITOR_ID);
      if (state.ownerFilter === 'all') return allClasses();
      const ownerId = state.ownerFilter === 'mine' ? ADMIN_MONITOR_ID : state.ownerFilter;

    /* 老师筛选条：随主理人筛选/班长归属联动收敛，仅展示当前范围内参与过小班课授课的在职老师 */
    function teacherFilterOptions() {
      const scoped = scopeClasses();
      const participating = TEACHERS.filter((t) => t.active && scoped.some((c) => c.teacherId === t.id));
      return participating.map((t) => ({
        ...t,
        count: scoped.filter((c) => c.teacherId === t.id).length
      })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
    }

    function teacherScopedClasses() {
      const list = scopeClasses();
      return state.teacherFilter === 'all' ? list : list.filter((c) => c.teacherId === state.teacherFilter);
    }

    /* 待排/待补排课次与剩余课次：优先读取 mock 显式字段，缺省时按未来已排 + 待排推算 */
    function classPendingTs(c) {
      return typeof c.pendingTs === 'number' ? c.pendingTs : (Number(c.unsettledTs) || 0);
    }

    function classRemainingTs(c) {
      return typeof c.remainingLessons === 'number'
        ? c.remainingLessons
        : (Number(c.futureTs) || 0) + (Number(c.unsettledTs) || 0);
    }

    /* 按小班名称搜索（大小写不敏感），与老师胶囊、状态分段条 AND 复合 */
    function searchedClasses() {
      const q = state.search.trim().toLowerCase();
      const list = teacherScopedClasses();
      if (!q) return list;
      return list.filter((c) => String(c.name).toLowerCase().includes(q));
    }

    /* AC-1C-10a 默认排序：待委任 → 正式开课（待排优先，剩余课次升序） → 已解散/已归档沉底 */
    function classSortTier(c) {
      if (c.status === 'active') return c.teacherId ? 1 : 0;
      return 2;
    }

    function sortClasses(list) {
      return [...list].sort((a, b) => {
        const tierA = classSortTier(a);
        const tierB = classSortTier(b);
        if (tierA !== tierB) return tierA - tierB;
        if (tierA === 1) {
          const pendingA = classPendingTs(a) > 0 ? 0 : 1;
          const pendingB = classPendingTs(b) > 0 ? 0 : 1;
          if (pendingA !== pendingB) return pendingA - pendingB;
          const remainingA = classRemainingTs(a);
          const remainingB = classRemainingTs(b);
          if (remainingA !== remainingB) return remainingA - remainingB;
        }
        const byName = a.name.localeCompare(b.name, 'zh-Hans-CN', { sensitivity: 'base' });
        if (byName !== 0) return byName;
        return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
      });
    }

    function filteredClasses() {
      const list = searchedClasses();
      const statusScoped = state.filter === 'all' ? list : list.filter((c) => c.status === state.filter);

    const STATUS_LABELS = {

      active: '正式开课',

    };

    const STATUS_TONES = {
      pending_open: 'slate',
      active: 'emerald',
      early_terminated: 'rose',
      archived: 'slate'
    };

    function statusLabel(id) {
      return STATUS_LABELS[id] || '—';
    }

    function statusMeta(c) {
      if (c.status === 'archived') return { label: '已归档', tone: 'slate' };
      if (c.status === 'early_terminated') return { label: '已提前解散', tone: 'rose' };
      return { label: '正式开课', tone: 'emerald' };
    }

    function classTone(c) {
      if (c.status === 'archived') return 'slate';
      if (c.status === 'early_terminated') return 'rose';
      if (!c.teacherId) return 'rose';
      return 'amber';
    }

    /* AC-1C-05b：active 小班按老师委任与购课单/TS 分四阶段锁定字段 */
    const STAGE_META = {
      1: { label: '阶段 ① · 待委任老师', tone: 'indigo', desc: '班级名称、容量、财务参数与授课老师均可编辑；委任后自动进入阶段 ②' },
      2: { label: '阶段 ② · 尚未开单排课', tone: 'emerald', desc: '已委任老师且零购课单、零课次，全部字段可编辑' },
      3: { label: '阶段 ③ · 已锁定', tone: 'amber', desc: '已存在购课单或排课记录，仅班级名称可改' },
      4: { label: '阶段 ④ · 只读', tone: 'slate', desc: '小班已归档或已提前解散，全字段只读' }
    };

    function classStage(c) {
      if (!c || c.status !== 'active') return '4';
      if (!c.teacherId) return '1';
      const tsCount = (Number(c.futureTs) || 0) + (Number(c.unsettledTs) || 0) + (Number(c.completedTs) || 0);
      if (tsCount + (c.hasOrder ? 1 : 0) + (c.hasInFlightOrder ? 1 : 0) === 0) return '2';
      return '3';
    }

    function stageMeta(c) {
      return STAGE_META[classStage(c)] || STAGE_META[4];
    }

    function reasonLabel(id) {
      return DISSOLVE_REASONS.find((r) => r.id === id)?.label || '—';
    }

    function dispositionLabel(id) {
      return DISSOLVE_DISPOSITIONS.find((d) => d.id === id)?.label || '—';
    }

    function chip(label, tone) {
      return `<span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${TONES[tone].chip}">${esc(label)}</span>`;
    }

    /* ---------------------------- 在学课件与进度 ---------------------------- */
    function coursewareById(id) {
      return COURSEWARE_LIBRARY.find((x) => x.id === id) || null;
    }

    function classCoursewares(c) {
      return Array.isArray(c && c.coursewares) ? c.coursewares : [];
    }

    function isCoursewareStale(cw) {
      return (Number(cw && cw.daysAgo) || 0) > 180;
    }

    function flattenProcessNote(text) {
      return String(text || '').replace(/\s+/g, ' ').trim();
    }

    /* 折叠为 1 行且总长度不超过 max（含省略号） */
    function processNotePreview(text, max = 40) {
      const flat = flattenProcessNote(text);
      if (!flat) return '未填写进度备注';
      return flat.length > max ? `${flat.slice(0, max - 1)}…` : flat;
    }

    function coursewareLevels(cw) {
      const def = coursewareById(cw && cw.id)?.defaultLevel;
      return [...new Set([cw && cw.level, def, 'Level 1', 'Level 2', 'Level 3'].filter(Boolean))];
    }

    function coursewareCardLine(c) {
      const list = classCoursewares(c);
      if (!list.length) return '未配置';
      const first = list[0];
      const extra = list.length > 1 ? ` +${list.length - 1}门` : '';
      return `${first.name} (${first.level}) · ${processNotePreview(first.processNote)}${extra}`;
    }

    /* ---------------------------- 剩余资产快照 ---------------------------- */
    function residualSnapshot(c) {
      const future = Number(c.futureTs) || 0;
      const pool = classPendingTs(c);
      const totalLessons = future + pool;
      return {
        future,
        pool,
        totalLessons,
        remainingPoints: totalLessons * (Number(c.total) || 0),
        completed: Number(c.completedTs) || 0
      };
    }

    function residualTsRows(c) {
      const snap = residualSnapshot(c);
      const perTs = Number(c.total) || 0;
      const dateCode = String(c.createdAt || TODAY).replace(/-/g, '') || '20261110';
      const orderNo = `CO-${dateCode}-01`;
      const rows = [];
      const takeFuture = Math.min(snap.future, 2);
      for (let i = 0; i < takeFuture; i += 1) {
        rows.push({ id: `TS-${dateCode}-${String(i + 1).padStart(2, '0')}`, form: '未来已排', orderNo, points: perTs });
      }
      const takePool = Math.min(snap.pool, 4 - rows.length);
      for (let i = 0; i < takePool; i += 1) {
        rows.push({ id: `TS-${dateCode}-${String(rows.length + 1).padStart(2, '0')}`, form: '待排池', orderNo, points: perTs });
      }
      return { ...snap, rows, hidden: Math.max(0, snap.totalLessons - rows.length) };
    }

    function nextClearRecordId() {
      const prefix = `CD-${TODAY.replace(/-/g, '')}`;
      const used = state.classes.filter((c) => c.termination && String(c.termination.clearRecordId || '').startsWith(prefix)).length;
      return `${prefix}-${String(used + 1).padStart(2, '0')}`;
    }

    /* ---------------------------- 归档五项资产守卫 ---------------------------- */
    function archiveGuards(c) {
      const future = Number(c.futureTs) || 0;
      const pool = classPendingTs(c);
      const inFlight = Number(c.inFlightOrders) || (c.hasInFlightOrder ? 1 : 0);
      const gHold = Number(c.gHold) || 0;
      const started = Number(c.startedUnfinished) || 0;
      const anomaly = Number(c.anomalyRollbacks) || 0;
      return [
        { label: '未来「已排期」课次', count: future, pass: future === 0 },
        { label: '小班待排池', count: pool, pass: pool === 0 },
        { label: '在途「待付款确认」单 / G-HOLD', count: inFlight + gHold, pass: inFlight + gHold === 0 },
        { label: '已过开课时间未结课/待考勤', count: started, pass: started === 0 },
        { label: '待处理异常回退', count: anomaly, pass: anomaly === 0 }
      ];
    }

    function archiveReady(c) {
      return archiveGuards(c).every((g) => g.pass);
    }

    function newClassId() {
      return `cls_${Math.random().toString(36).slice(2, 10).padEnd(8, '0')}`;
    }

    function teacherOptions() {

      if (state.page === 'classes') return 'classes';

    function syncConsole() {
      const view = currentViewKey();
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const value = b.dataset.value;
        let active = false;
        if (group === 'role') active = state.role === value;
        if (group === 'view') active = view === value;
        if (group === 'device') active = state.device === value;
        if (group === 'online') active = state.online === value;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}`;
      });
    }

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'view') setView(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：可浏览小班，创建、委任、归档、解散与暂停待排不可用');

    const CONSOLE_NAV_KEY = 'dream_proto_nav_collapsed';
    function readConsoleCollapsed() {
      try { return localStorage.getItem(CONSOLE_NAV_KEY) === '1'; } catch (e) { return false; }
    }
    function writeConsoleCollapsed(collapsed) {
      try { localStorage.setItem(CONSOLE_NAV_KEY, collapsed ? '1' : '0'); } catch (e) { /* 隐私模式下静默降级 */ }
    }
    function applyConsoleCollapsed(collapsed) {
      const header = $('console');
      const mini = document.querySelector('[data-console-mini]');
      if (!header || !mini) return;
      header.classList.toggle('hidden', collapsed);
      mini.className = collapsed
        ? 'sticky top-0 z-[60] flex items-center justify-end border-b border-slate-200/60 bg-white/70 px-2 py-1 backdrop-blur'
        : 'sticky top-0 z-[60] hidden items-center justify-end border-b border-slate-200/60 bg-white/70 px-2 py-1 backdrop-blur';
    }
    document.querySelector('[data-console-collapse]')?.addEventListener('click', () => { writeConsoleCollapsed(true); applyConsoleCollapsed(true); });
    document.querySelector('[data-console-expand]')?.addEventListener('click', () => { writeConsoleCollapsed(false); applyConsoleCollapsed(false); });

              <button data-action="open-dissolve" data-id="${c.id}" ${offline ? 'disabled' : ''} class="h-11 flex-1 rounded-xl border border-rose-200 bg-rose-50 text-[14px] font-semibold text-rose-700 hover:bg-rose-100 disabled:opacity-40">提前结课解散</button>
            </div>
          </div>
        </section>` : ''}

        ${!active ? `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
          <h2 class="text-[16px] font-bold text-slate-900">${c.status === 'archived' ? '归档状态' : '提前结课解散记录'}</h2>
          ${c.status === 'archived'
            ? `<div class="mt-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">已归档于 ${esc(c.archivedAt || '—')} · 已停用全局 4 周自动续费、关闭成员增删与未来课表投影；随班在读正式学员保留课件与 Process Note 只读回看，历史排课与财务记录只读。</div>`
            : `<div class="mt-2 space-y-1.5 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-rose-700">
                <div class="flex items-center justify-between gap-2"><span>解散原因</span><span class="font-bold text-rose-950">${esc(reasonLabel(termination?.reason))}</span></div>
                <div class="flex items-center justify-between gap-2"><span>处置流向</span><span class="font-bold text-rose-950">${esc(dispositionLabel(termination?.disposition))}</span></div>
                <div class="flex items-center justify-between gap-2"><span>解散时间</span><span class="font-bold text-rose-950">${esc(termination?.at || '—')}</span></div>
                <div class="border-t border-rose-200/70 pt-1.5"></div>
                <div class="flex items-center justify-between gap-2"><span>剩余未上课总节数</span><span class="font-mono font-bold text-rose-950">${points((termination?.voidedFutureTs || 0) + (termination?.voidedPoolTs || 0))} 节</span></div>
                <div class="flex items-center justify-between gap-2"><span>未来已排 / 待排池</span><span class="font-mono font-bold text-rose-950">${points(termination?.voidedFutureTs || 0)} / ${points(termination?.voidedPoolTs || 0)} 节</span></div>
                <div class="flex items-center justify-between gap-2"><span>剩余待上交总积分</span><span class="font-mono font-bold text-rose-950">${points(termination?.remainingPoints || 0)} 积分</span></div>
                <div class="flex items-center justify-between gap-2"><span>已结课</span><span class="font-bold text-rose-950">${points(termination?.completedTs ?? c.completedTs ?? 0)} 节</span></div>
                <div class="border-t border-rose-200/70 pt-1.5 text-rose-900/85">${esc(termination?.note || '—')}</div>
              </div>
              <div class="mt-2 rounded-xl border border-slate-300 bg-white px-3 py-2.5">
                <div class="flex items-center justify-between gap-2">
                  <div class="flex min-w-0 items-center gap-1.5">
                    <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg border border-slate-200 bg-slate-50 text-slate-600">${icon('receipt-text', 'h-3.5 w-3.5')}</span>
                    <span class="text-[14px] font-bold text-slate-900">清退记录</span>
                  </div>
                  ${chip(termination?.clearRecordStatus || '已生成', 'slate')}
                </div>
                <div class="mt-1.5 space-y-1 text-[12px] font-medium text-slate-600">
                  <div class="flex items-center justify-between gap-2"><span>记录编号</span><span class="font-mono font-bold text-slate-900">${esc(termination?.clearRecordId || '—')}</span></div>
                  <div class="flex items-center justify-between gap-2"><span>作废未来已排</span><span class="font-mono font-bold text-slate-900">${points(termination?.voidedFutureTs || 0)} 节</span></div>
                  <div class="flex items-center justify-between gap-2"><span>作废待排池</span><span class="font-mono font-bold text-slate-900">${points(termination?.voidedPoolTs || 0)} 节</span></div>
                  <div class="flex items-center justify-between gap-2"><span>剩余待上交积分</span><span class="font-mono font-bold text-slate-900">${points(termination?.remainingPoints || 0)} 积分</span></div>
                </div>
                <p class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-500">系统已同事务生成小班解散清退记录，作为线下退费 / 结转新班的核对依据；流向 A / B 均不进 M5A 冲抵。</p>
              </div>
              <div class="mt-2 flex items-start gap-1.5 rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">${icon('book-open', 'h-3.5 w-3.5 shrink-0 text-slate-500')}<span>小班已进入终态：原随班正式学员家长、曾执教 / 代课老师、主理班长与管理员仍可长期只读回看本班历史在学课件与 Process Note（M1A 已删除档案除外）。</span></div>
              <div class="mt-2 flex gap-1.5">
                <a href="m3a_calendar_grid.html?class_id=${c.id}" target="_blank" rel="noopener" class="flex h-11 flex-1 items-center justify-center rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 hover:bg-slate-50">小班课表（只读）</a>

              </div>`}
        </section>` : ''}

        ${renderAuditLog(c)}

        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">小班费用、购课与个人请假仍在线下闭环；已绑定「正式在读」学员的家长仅只读查看课表、在学课件与 Process Note，同班人数、同学名单与费用字段严格隔离。单节待上交费用积分录入多少即按多少上交，全额计入周度转账单。</div>
      </div>`;
    }

    /* 详情页「本班在读学员」：仅正式在读可绑定，K ≤ Max，零线上学费与零个人请假 */
    function renderMemberSection(c) {
      const list = classMembers(c);
      const k = list.length;
      const max = Number(c.max) || 0;
      const full = k >= max;
      const retained = membersRetained(c);
      const editable = c.status === 'active' && ownsClass(c) && state.online !== 'off';
      const removed = classRemovedMembers(c);
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex min-w-0 flex-1 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl border border-slate-200 bg-white text-indigo-600">${icon('users', 'h-4 w-4')}</span>
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">本班在读学员 (${k} / Max ${max})</h2>
              <p class="text-[12px] font-medium text-slate-500">仅绑定「正式在读」学员 · K ≤ Max · 零线上学费</p>
            </div>
          </div>
          ${retained
            ? chip('随班归档只读留存', 'slate')
            : `<button data-action="open-member-bind" data-id="${c.id}" ${editable && !full ? '' : 'disabled'} class="h-9 shrink-0 rounded-xl border px-3 text-[12px] font-bold ${editable && !full ? 'border-indigo-200 bg-indigo-50/80 text-indigo-700 hover:bg-indigo-100/70' : 'cursor-not-allowed border-slate-200 bg-slate-100 text-slate-500'}">+ 绑定正式学员</button>`}
        </div>
        <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-500">绑定后自动投影本班未来已排小班课次（与 1v1 冲突时整节仅显 1v1，无半格），家长只读查看小班在学课件与经隐私校验的 2000 字 Process Note，并接收停课 / 暂停待排 / 代课通知；费用与个人请假仍在线下闭环。M1A 学员归档或删档将自动解绑并释放 Max 名额（保留已移除历史）。</p>
        <div class="mt-1.5 flex items-start gap-1.5 rounded-lg border border-slate-200 bg-white px-2.5 py-2 text-[12px] font-medium leading-relaxed text-slate-600">${icon('eye', 'h-3.5 w-3.5 shrink-0 text-slate-500')}<span><span class="font-bold">家长端只读视图：</span>自家课表仅投影 [G] 课次、小班在学课件与 Process Note、停课 / 暂停 / 代课通知；同班人数、同学名单与费用字段 100% 不可见。</span></div>
        ${full && !retained ? `<p class="mt-1 text-[12px] font-semibold text-amber-700">已达最大学生数上限（K == Max），新增入口已禁用。</p>` : ''}
        ${list.length
          ? `<div class="mt-2 space-y-1.5">${list.map((m) => {
              const s = studentById(m.studentId);
              if (!s) return '';
              return `<div class="flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-2.5 py-2">
                <div class="min-w-0 flex-1">
                  <div class="truncate text-[14px] font-semibold text-slate-900">${esc(s.name)} <span class="text-[12px] font-medium text-slate-500">(${s.age}岁)</span></div>
                  <div class="truncate text-[12px] font-medium text-slate-500">${retained ? '随班归档 · 历史只读' : `绑定于 ${esc(m.boundAt || '—')}`}</div>
                </div>
                <a href="m3a_calendar_grid.html?student_id=${s.id}&class_id=${c.id}" target="_blank" rel="noopener" data-action="ext-link" class="flex h-8 shrink-0 items-center gap-1 rounded-lg border border-slate-300 bg-white px-2 text-[12px] font-bold text-slate-700 hover:bg-slate-50">${icon('calendar-days', 'h-3.5 w-3.5')}看课表</a>
                ${editable ? `<button data-action="remove-member" data-id="${c.id}" data-student-id="${s.id}" class="h-8 shrink-0 rounded-lg border border-rose-200 bg-rose-50 px-2 text-[12px] font-bold text-rose-700 hover:bg-rose-100">移出</button>` : ''}
              </div>`;
            }).join('')}</div>`
          : `<div class="mt-2 rounded-xl border border-dashed border-slate-300 bg-white px-3 py-4 text-center">
              <p class="text-[14px] font-semibold text-slate-700">${retained ? '本班无随班归档只读留存成员' : '尚未绑定正式学员'}</p>
              <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${retained ? '曾手工移出或 M1A 已删除的学员不保留回看权限。' : '绑定不影响 M2A 购课单、TS 与 M5A 周转账单，也不会纳入班长 1v1「所辖学员」列表。'}</p>
            </div>`}
        ${retained ? `<div class="mt-2 flex items-start gap-1.5 rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">${icon('lock', 'h-3.5 w-3.5 shrink-0 text-slate-500')}<span>已归档 / 已提前解散：停止排期投影与未来通知，禁止新增或重绑；当前及历史随班正式学员的家长、曾执教 / 代课老师、主理班长与管理员可长期只读回看本班在学课件与 Process Note（M1A 已删除档案除外）。</span></div>` : ''}
        ${removed.length ? `<p class="mt-1.5 text-[12px] font-medium text-slate-500">历史已移除 ${removed.length} 人（独立留痕不覆写，按新绑定生效时间截断展示）。</p>` : ''}
      </section>`;
    }

    /* 详情页「在学课件与进度」：仅主理人/管理员可配置；终态只读 */
    function renderCoursewareSection(c) {
      const list = classCoursewares(c);
      const editable = c.status === 'active' && ownsClass(c);
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        <div class="flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl border border-slate-200 bg-white text-indigo-600">${icon('book-open', 'h-4 w-4')}</span>
            <div class="min-w-0">
              <h2 class="truncate text-[16px] font-bold text-slate-900">在学课件与进度</h2>
              <p class="text-[12px] font-medium text-slate-500">平台课件库 · 进度备注最多 2000 字符${c.status !== 'active' ? ' · 终态只读留存' : ''}</p>
            </div>
          </div>
          <span class="shrink-0 rounded-full border border-slate-200 bg-white px-2 py-0.5 font-mono text-[12px] font-bold text-slate-700">${list.length}/6</span>
        </div>
        ${c.status !== 'active' ? `<div class="mt-2 flex items-start gap-1.5 rounded-lg border border-slate-300 bg-white px-2.5 py-2 text-[12px] font-medium leading-relaxed text-slate-600">${icon('lock', 'h-3.5 w-3.5 shrink-0 text-slate-500')}<span>全字段只读：随班正式学员家长、曾执教 / 代课老师、主理班长与管理员可长期只读回看；M1A 已删除档案除外。</span></div>` : ''}
        ${editable && list.length ? `<div class="mt-2 flex justify-end"><button data-action="open-courseware-config" data-id="${c.id}" class="h-9 rounded-xl border border-indigo-200 bg-indigo-50/80 px-3 text-[12px] font-bold text-indigo-700 hover:bg-indigo-100/70">配置课件</button></div>` : ''}
        ${list.length
          ? `<div class="mt-2 space-y-1.5">${list.map((cw) => coursewareDetailCard(c, cw, editable)).join('')}</div>`
          : `<div class="mt-2 rounded-xl border border-dashed border-slate-300 bg-white px-3 py-4 text-center">
              <p class="text-[14px] font-semibold text-slate-700">尚未配置在学课件</p>
              <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">配置后老师可在本页更新级别与进度备注</p>
              ${editable ? `<button data-action="open-courseware-config" data-id="${c.id}" class="mt-2 h-9 rounded-xl border border-indigo-200 bg-indigo-50/80 px-3 text-[12px] font-bold text-indigo-700 hover:bg-indigo-100/70">配置课件</button>` : ''}
            </div>`}
      </section>`;
    }

    function coursewareDetailCard(c, cw, editable) {
      const stale = isCoursewareStale(cw);
      return `<div class="rounded-xl border border-slate-200 bg-white p-2.5">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="min-w-0 truncate text-[14px] font-bold text-slate-900">${esc(cw.name)}</span>
              ${chip(cw.level, 'slate')}
              ${stale ? `<span class="shrink-0 rounded-full border border-amber-300 bg-amber-50 px-1.5 py-0.5 text-[12px] font-bold text-amber-800">近 6 个月没有更新（仅计老师角色更新）</span>` : ''}
            </div>
            <p class="mt-1 truncate text-[12px] font-medium leading-relaxed text-slate-600">${esc(processNotePreview(cw.processNote))}</p>
            <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-0.5 text-[12px] font-medium text-slate-500">
              <span>最后更新：${esc(cw.updatedBy)} · ${esc(cw.updatedAt)}</span>
              <span class="shrink-0">主力更新老师: ${esc(cw.topTeacher)}（${points(cw.topCount)} 次）</span>
            </div>
          </div>
          ${editable ? `<button data-action="open-progress" data-id="${c.id}" data-courseware-id="${cw.id}" class="h-8 shrink-0 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-800 hover:bg-slate-50">更新进度</button>` : ''}
        </div>
      </div>`;
    }

    function financeCard(fin, title, showFormula = false) {
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="grid h-8 w-8 place-items-center rounded-xl border border-slate-200 bg-white text-indigo-600">${icon('calculator', 'h-4 w-4')}</span>
            <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
          </div>
          <span class="text-[12px] font-medium text-slate-500">单节核算</span>
        </div>
        <div class="mt-2.5 grid grid-cols-2 gap-1.5">
          ${financeTile('单节待上交费用积分', `${points(fin.total)} 积分`)}
          ${financeTile('老师单节课酬积分', `${points(fin.salary)} 积分`)}
        </div>
        <div class="mt-2 space-y-1 rounded-xl bg-white px-2.5 py-2 text-[12px] font-medium text-slate-600">
          <div class="flex items-center justify-between gap-2"><span>周度单节上交积分</span><span class="font-mono font-bold text-slate-900">${points(fin.transfer)} 积分</span></div>
        </div>
        ${showFormula ? `<p class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-500">录入多少即按多少上交，按录入积分全额计入周度转账单。</p>` : ''}
      </section>`;
    }

    function renderAuditLog(c) {
      const logs = Array.isArray(c.auditLog) ? c.auditLog : [];
      const statusCount = logs.filter((log) => log.kind === 'status').length;
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        <button data-action="toggle-log" class="flex w-full items-center justify-between gap-2 text-left">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl border border-slate-200 bg-white text-indigo-600">${icon('history', 'h-4 w-4')}</span>
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">小班操作与修改日志</h2>
              <p class="text-[12px] font-medium text-slate-500">共 ${logs.length} 条 · 状态流转 ${statusCount} 条 · 仅可查看，不可编辑</p>
            </div>
          </div>
          ${icon(state.logOpen ? 'chevron-up' : 'chevron-down', 'h-4 w-4 shrink-0 text-slate-500')}

                  <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">可从全平台全体在职老师中直接委任（全平台在职老师均可选定）；也可先暂不绑定，建班后再委任。已设预约离职日 D 的老师置灰不可选；自 <span class="font-semibold">D 00:00 UTC+8</span> 起整班排课 / 单节补排 / 同师挪位均不可排入。</p>
                </div>
                <div>
                  <label class="mb-1 block text-[14px] font-semibold text-slate-700">小班课主理人 <span class="text-rose-500">*</span></label>
                  ${isAdmin()
                    ? `<button type="button" id="fOwnerTrigger" data-action="open-picker" data-picker="owner-create" class="flex h-11 w-full items-center justify-between gap-2 rounded-xl border border-slate-200 bg-slate-50/70 px-3.5 text-[16px] font-medium text-slate-900 outline-none transition hover:bg-white focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">
                      <span class="truncate">${esc((ownerMonitor ? ownerMonitor.name : '—') + '（在职）')}</span>

                    : `<div class="flex h-11 items-center justify-between rounded-xl border border-slate-200 bg-slate-100 px-3.5 text-[14px] font-medium text-slate-600"><span>Leo（当前登录，默认主理人）</span>${icon('lock', 'h-3.5 w-3.5 text-slate-500')}</div>`}
                </div>
              </div>
            </section>

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="grid h-5 w-5 place-items-center rounded-full bg-indigo-50 text-[11px] font-bold text-indigo-600">2</span>
                  <h2 class="text-[14px] font-bold text-slate-900">小班规模</h2>
                </div>
                <span class="text-[12px] font-medium text-slate-500">2~20 人</span>

              <div class="mt-3">
                <label for="fMax" class="mb-1 block text-[14px] font-semibold text-slate-700">最大学生数 (Max) <span class="text-rose-500">*</span></label>
                <input id="fMax" type="number" min="2" max="20" step="1" value="${esc(f.max)}" class="${inputCls}">
                <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">整数范围 2~20，默认 3 人；对线下参班人数仅作招生规模参考，系统不校验未绑定的线下人数；线上「正式在读」绑定人数构成硬容量上限 K ≤ Max（并发提交单事务原子校验）。</p>
              </div>
            </section>

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4">
              <div class="flex items-center gap-2">
                <span class="grid h-5 w-5 place-items-center rounded-full bg-indigo-50 text-[11px] font-bold text-indigo-600">3</span>
                <h2 class="text-[14px] font-bold text-slate-900">财务参数</h2>
              </div>
              <div class="mt-3 space-y-3.5">
                <div>
                  <label for="fSalary" class="mb-1 block text-[14px] font-semibold text-slate-700">老师单节课酬积分 <span class="text-rose-500">*</span></label>
                  <input id="fSalary" type="number" min="0" step="1" value="${esc(f.salary)}" class="${inputCls}">
                  <p class="mt-1 text-[12px] font-medium text-slate-500">每节课固定付给老师的课酬底金（非负整数）</p>
                </div>
                <div>
                  <label for="fTotal" class="mb-1 block text-[14px] font-semibold text-slate-700">单节待上交费用积分 <span class="text-rose-500">*</span></label>
                  <input id="fTotal" type="number" min="1" step="1" value="${esc(f.total)}" class="${inputCls}">
                  <p id="totalHint" class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">录入多少即按多少上交，按录入积分全额计入周度转账单。</p>
                </div>
              </div>
            </section>

            <div id="financePreview">${financeCard(fin, '实时核算预览', true)}</div>

            <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">建班即生效（ACTIVE）。小班费用与个人请假仍在线下闭环；建班后可在详情页轻量绑定「正式在读」学员（禁绑待认领试课），用于课表投影、只读课件与日程通知。若选择暂不绑定老师，购课与排课将被前置阻断，委任后自动恢复。</div>
            ${f.error ? `<div id="createError" class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-rose-700">${esc(f.error)}</div>` : ''}
          </div>
        </div>
        <div class="flex shrink-0 gap-2 border-t border-slate-200/80 bg-white/95 p-3">
          <button data-action="cancel-create" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 hover:bg-slate-50">取消</button>
          <button id="btnCreateClass" data-action="submit-create" ${createError() ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">创建并生效</button>
        </div>
      </div>`;
    }

    function updateCreatePreview() {
      const f = state.create;
      const fin = calcFinance(f);
      const preview = $('financePreview');
      if (preview) preview.innerHTML = financeCard(fin, '实时核算预览', true);
      const btn = $('btnCreateClass');
      if (btn) btn.disabled = !!createError();
    }

    function createError() {
      const f = state.create;
      if (state.online === 'off') return '离线模式下不可创建小班';
      const name = f.name.trim();
      if (!name) return '请填写班级名称';
      if (name.length > 64) return '班级名称不能超过 64 字符';
      if (f.teacherId) {
        const picked = teacherById(f.teacherId);
        if (!teacherSelectable(picked)) return '请选择无离职预约的全平台在职老师，或暂不绑定';
      }
      if (!monitorOptions().some((m) => m.id === f.ownerMonitorId)) return '请选择在职主理人';
      const max = Number(f.max);
      if (!Number.isInteger(max) || max < 2 || max > 20) return '最大学生数 (Max) 需为 2~20 的整数';
      const salary = Number(f.salary);
      if (!Number.isInteger(salary) || salary < 0) return '老师单节课酬积分需为非负整数';
      const total = Number(f.total);
      if (!Number.isInteger(total) || total <= 0) return '单节待上交费用积分需为正整数';
      return null;
    }

    function openCreate() {
      if (state.online === 'off') return showToast('离线模式下不可创建小班');
      state.create = {
        ...emptyCreate(),
        ownerMonitorId: isAdmin() ? 'mn_leo000001' : CURRENT_MONITOR_ID
      };
      state.page = 'create';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      updateCreatePreview();
    }

    function openReopen(classId) {
      if (state.online === 'off') return showToast('离线模式下不可创建小班');
      const source = classById(classId);
      if (!source) return;
      if (!ownsClass(source)) return showToast('仅主理人或管理员可创建承接新班');
      state.create = {
        ...emptyCreate(),
        name: `${source.name} · 承接小班`,
        teacherId: '',
        ownerMonitorId: source.ownerMonitorId,
        max: String(source.max),
        salary: String(source.salary),
        total: String(source.total),
        sourceClassId: source.id
      };
      state.page = 'create';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      showToast('已带入原班 Max 与财务参数；原班课件与 Process Note 将预填为草稿，创建前须过隐私扫描与确认');
    }

    function submitCreate() {
      const err = createError();
      if (err) {
        state.create.error = err;
        renderAll();
        setTimeout(() => $('createError')?.scrollIntoView({ block: 'center' }), 60);
        showToast(err);
        return;
      }
      const f = state.create;
      const teacher = teacherById(f.teacherId);
      const source = f.sourceClassId ? classById(f.sourceClassId) : null;
      const c = {
        id: newClassId(),
        name: f.name.trim(),
        teacherId: teacher ? teacher.id : null,
        ownerMonitorId: f.ownerMonitorId,
        max: Number(f.max),
        salary: Number(f.salary),
        total: Number(f.total),
        status: 'active',
        futureTs: 0,
        unsettledTs: 0,
        pendingTs: 0,
        remainingLessons: 0,
        completedTs: 0,
        hasOrder: false,
        createdAt: TODAY,
        members: [],
        sourceClassId: source ? source.id : null,
        auditLog: [
          { at: `${TODAY} 10:00`, action: '新建小班', operator: currentOperatorName(), summary: teacher
            ? `创建小班 · 主理人 ${monitorById(f.ownerMonitorId).name} · 委任 ${teacher.name}（全平台直接委任）`
            : `创建小班 · 主理人 ${monitorById(f.ownerMonitorId).name} · 暂未委任主讲老师` },
          { at: `${TODAY} 10:00`, kind: 'status', from: 'pending_open', to: 'active', operator: currentOperatorName(), reason: '创建生效' }
        ]
      };
      if (source) {
        c.auditLog.push({ at: `${TODAY} 10:01`, action: '承接原班', operator: currentOperatorName(), summary: `承接原小班 ${source.name} · 剩余 ${points(source.unsettledTs)} 节 · 原班已提前结课解散` });
        appendAudit(source, '委任新老师创建新小班', `已创建承接新班 ${c.name}（${c.id}）`);
      }
      state.classes.unshift(c);
      state.activeClassId = c.id;
      state.page = 'detail';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      showToast(teacher ? `已创建 ${c.name} · 建班即生效` : `已创建 ${c.name} · 待委任老师，购课与排课暂不可用`);
    }

    /* ------------------------------------------------------------------
     * 编辑小班（AC-1C-05a / 05b / 05c）
     * ------------------------------------------------------------------ */
    function editFinanceError() {
      const f = state.edit;
      if (!f) return null;
      const max = Number(f.max);
      const salary = Number(f.salary);
      const total = Number(f.total);
      if (!Number.isInteger(max) || max < 2 || max > 20) return '最大学生数 (Max) 需为 2~20 的整数';
      const cls = classById(f.classId);
      if (cls && Number.isInteger(max) && max < memberCount(cls)) return `Max 不能小于当前在读绑定人数 K = ${memberCount(cls)}`;
      if (!Number.isInteger(salary) || salary < 0) return '老师单节课酬积分需为非负整数';
      if (!Number.isInteger(total) || total <= 0) return '单节待上交费用积分需为正整数';
      return null;
    }

    function editError() {
      const f = state.edit;
      if (!f) return null;
      const c = classById(f.classId);
      if (!c) return null;
      const name = f.name.trim();
      if (!name) return '请填写班级名称';
      if (name.length > 64) return '班级名称不能超过 64 字符';
      const stage = classStage(c);
      if (stage === '3' || stage === '4') return null;
      if (f.teacherId) {
        const picked = teacherById(f.teacherId);
        if (!teacherSelectable(picked)) return '请选择无离职预约的全平台在职老师或待委任老师';
      }
      return editFinanceError();
    }

    function renderEditFinance() {
      const fin = calcFinance(state.edit || {});
      const err = editFinanceError();
      return `<div class="rounded-2xl border p-3.5 ${err ? 'border-rose-200 bg-rose-50' : 'border-indigo-200/80 bg-indigo-50/50'}">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[12px] font-semibold text-slate-600">单节待上交费用积分</span>
          <span class="font-mono text-[18px] font-bold ${err ? 'text-rose-700' : 'text-slate-900'}">${points(fin.total)} <span class="text-[12px] font-medium">积分</span></span>
        </div>
        <div class="mt-1 flex items-center justify-between gap-2">
          <span class="text-[12px] font-semibold text-slate-600">老师单节课酬积分</span>
          <span class="font-mono text-[16px] font-bold text-indigo-700">${points(fin.salary)} <span class="text-[12px] font-medium">积分</span></span>
        </div>
        ${err
          ? `<p class="mt-2 flex items-start gap-1 rounded-lg bg-white/70 px-2 py-1.5 text-[12px] font-semibold leading-relaxed text-rose-700">${icon('alert-triangle', 'h-3.5 w-3.5 shrink-0')}<span>${esc(err)}</span></p>`
          : `<p class="mt-2 text-[12px] font-medium text-slate-500">录入多少即按多少上交，按录入积分全额计入周度转账单。</p>`}
      </div>`;
    }

    function editChanges(c) {
      const f = state.edit;
      const stage = classStage(c);
      const changes = [];
      const push = (label, from, to) => {
        if (String(from ?? '') !== String(to ?? '')) changes.push({ label, from, to });
      };
      push('班级名称', c.name, f.name.trim());
      if (stage === '1' || stage === '2') {
        push('最大学生数 (Max)', c.max, Number(f.max));
        push('老师单节课酬积分', c.salary, Number(f.salary));
        push('单节待上交费用积分', c.total, Number(f.total));
        const oldTeacher = c.teacherId ? (teacherById(c.teacherId)?.name || '待委任老师') : '待委任老师';
        const newTeacher = f.teacherId ? (teacherById(f.teacherId)?.name || '待委任老师') : '待委任老师';
        push('授课老师', oldTeacher, newTeacher);
      }
      return changes;
    }

    function openEdit(classId, force = false) {
      if (state.online === 'off') return showToast('离线模式下不可编辑小班');
      const c = classById(classId);
      if (!c) return;
      if (!ownsClass(c)) return showToast('仅主理人或管理员可编辑小班');
      if (c.status !== 'active' && !force) return showToast('终态小班全字段只读');
      state.edit = emptyEdit(c);
      state.overlay = { type: 'edit', classId: c.id };
      renderAll();
    }

    function saveEdit() {
      if (state.online === 'off') return showToast('离线模式下不可编辑小班');
      const f = state.edit;
      if (!f) return;
      const c = classById(f.classId);
      if (!c) return;
      const stage = classStage(c);
      if (stage === '4') return showToast('终态小班全字段只读');
      const err = editError();
      if (err) {
        f.error = err;
        updateEditLive();
        return showToast(err);
      }
      const changes = editChanges(c);
      if (!changes.length) {
        state.overlay = null;
        state.edit = null;
        renderAll();
        return showToast('未检测到修改');
      }
      c.name = f.name.trim();
      if (stage === '1' || stage === '2') {
        c.teacherId = f.teacherId || null;
        c.max = Number(f.max);
        c.salary = Number(f.salary);
        c.total = Number(f.total);
      }
      appendAudit(c, '编辑小班', changes.map((ch) => `${ch.label}: ${ch.from} → ${ch.to}`).join('；'));
      state.overlay = null;
      state.edit = null;
      renderAll();
      showToast('小班信息已保存');
    }

    function updateEditLive() {
      const block = $('editFinanceBlock');
      if (block) block.innerHTML = renderEditFinance();
      const btn = $('editSave');
      if (btn) btn.disabled = state.online === 'off' || !!editError();
    }

    function renderEditSheet() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      if (!state.edit || state.edit.classId !== c.id) state.edit = emptyEdit(c);
      const f = state.edit;
      const stage = classStage(c);
      const meta = STAGE_META[stage];
      const readOnly = stage === '4';
      const lockBusiness = stage === '3' || stage === '4';
      const nameLocked = stage === '4';
      const editableCls = 'h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 px-3.5 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15';
      const lockedCls = 'h-11 w-full rounded-xl border border-slate-200 bg-slate-100 px-3.5 text-[16px] text-slate-500 outline-none';
      const owner = classOwner(c);
      const editTeacher = f.teacherId ? teacherById(f.teacherId) : null;
      const editTeacherLabel = editTeacher ? `${editTeacher.name} · ${editTeacher.price}积分` : '待委任老师';
      const stageNotice = stage === '3'
        ? `<div class="mt-2 flex items-start gap-2 rounded-xl border border-amber-300 bg-amber-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-amber-900">${icon('lock', 'h-4 w-4 shrink-0 text-amber-700')}<span>已存在购课单或排课记录，容量、财务参数与授课老师已锁定；如需长期换师请走【提前结课解散】</span></div>`
        : stage === '4'
          ? `<div class="mt-2 flex items-start gap-2 rounded-xl border border-slate-300 bg-slate-100 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">${icon('lock', 'h-4 w-4 shrink-0 text-slate-500')}<span>小班已归档或已提前解散，全字段只读。</span></div>`
          : '';
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 flex max-h-[85%] flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl">
          <div class="flex shrink-0 justify-center pt-2"><span class="h-1.5 w-10 rounded-full bg-slate-200"></span></div>
          <div class="shrink-0 border-b border-slate-100 px-4 pb-3 pt-1">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <h2 class="text-[18px] font-bold tracking-tight text-slate-900">编辑小班</h2>
                <p class="mt-0.5 truncate text-[14px] font-semibold text-slate-700">${esc(c.name)}</p>
              </div>
              <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
            </div>
            <div class="mt-2 flex flex-wrap items-center gap-1.5">
              ${chip(meta.label, meta.tone)}
              <span class="text-[12px] font-medium text-slate-500">${esc(meta.desc)}</span>
            </div>
            ${stageNotice}
          </div>
          <div data-edit-scroll class="min-h-0 flex-1 overflow-y-auto bg-slate-50 px-4 py-3">
            <div class="mx-auto w-full max-w-[640px] space-y-3">
              <section class="rounded-2xl border border-slate-200/80 bg-white p-4">
                <div class="flex items-center gap-2">
                  <span class="grid h-5 w-5 place-items-center rounded-full bg-indigo-50 text-[11px] font-bold text-indigo-600">1</span>
                  <h3 class="text-[14px] font-bold text-slate-900">基本信息</h3>
                </div>
                <div class="mt-3 space-y-3.5">
                  <div>
                    <label for="eName" class="mb-1 block text-[14px] font-semibold text-slate-700">班级名称 <span class="text-rose-500">*</span></label>
                    <input id="eName" value="${esc(f.name)}" maxlength="64" ${nameLocked ? 'disabled' : ''} class="${nameLocked ? lockedCls : editableCls}">
                  </div>
                  <div>
                    <div class="mb-1 block text-[14px] font-semibold text-slate-700">小班主理人</div>
                    <div class="rounded-xl border border-slate-200 bg-slate-100 px-3.5 py-2.5">
                      <div class="text-[14px] font-semibold text-slate-700">${esc(owner.name)}</div>
                      <div class="text-[12px] font-medium leading-relaxed text-slate-500">仅超级管理员在班长离职交接时改绑。改绑前必须清零该班在途「待付款确认」小班单：存在在途单时强制拦截，须先赴 M2A 完成收款或作废释放 G-HOLD。</div>
                    </div>
                  </div>
                </div>
              </section>

              <section class="rounded-2xl border border-slate-200/80 bg-white p-4">
                <div class="flex items-center gap-2">
                  <span class="grid h-5 w-5 place-items-center rounded-full bg-indigo-50 text-[11px] font-bold text-indigo-600">2</span>
                  <h3 class="text-[14px] font-bold text-slate-900">容量与财务</h3>
                </div>
                <div class="mt-3 space-y-3.5">
                  <div>
                    <label for="eMax" class="mb-1 block text-[14px] font-semibold text-slate-700">最大学生数 Max <span class="text-rose-500">*</span></label>
                    <input id="eMax" type="number" min="2" max="20" step="1" value="${esc(f.max)}" ${lockBusiness ? 'disabled' : ''} class="${lockBusiness ? lockedCls : editableCls}">
                    <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">当前在读绑定 K = ${memberCount(c)}；Max 须满足 2~20 且 K ≤ Max。并发缩容与绑定均在单事务原子校验，后到提交超限时整笔回滚并提示刷新重试。</p>
                  </div>
                  <div>
                    <label for="eSalary" class="mb-1 block text-[14px] font-semibold text-slate-700">老师单节课酬积分 <span class="text-rose-500">*</span></label>
                    <input id="eSalary" type="number" min="0" step="1" value="${esc(f.salary)}" ${lockBusiness ? 'disabled' : ''} class="${lockBusiness ? lockedCls : editableCls}">
                  </div>
                  <div>
                    <label for="eTotal" class="mb-1 block text-[14px] font-semibold text-slate-700">单节待上交费用积分 <span class="text-rose-500">*</span></label>
                    <input id="eTotal" type="number" min="0" step="1" value="${esc(f.total)}" ${lockBusiness ? 'disabled' : ''} class="${lockBusiness ? lockedCls : editableCls}">
                  </div>
                  <div id="editFinanceBlock">${renderEditFinance()}</div>
                </div>
              </section>

              <section class="rounded-2xl border border-slate-200/80 bg-white p-4">
                <div class="flex items-center gap-2">
                  <span class="grid h-5 w-5 place-items-center rounded-full bg-indigo-50 text-[11px] font-bold text-indigo-600">3</span>
                  <h3 class="text-[14px] font-bold text-slate-900">授课老师</h3>
                </div>
                <div class="mt-3">
                  <label for="eTeacherTrigger" class="mb-1 block text-[14px] font-semibold text-slate-700">主讲老师</label>
                  ${lockBusiness
                    ? `<button type="button" id="eTeacherTrigger" disabled class="flex h-11 w-full items-center justify-between gap-2 rounded-xl border border-slate-200 bg-slate-100 px-3.5 text-[16px] font-medium text-slate-500 disabled:cursor-not-allowed">
                      <span class="truncate">${esc(editTeacherLabel)}</span>
                      ${icon('lock', 'h-4 w-4 shrink-0 text-slate-500')}
                    </button>`
                    : `<button type="button" id="eTeacherTrigger" data-action="open-picker" data-picker="teacher-edit" class="flex h-11 w-full items-center justify-between gap-2 rounded-xl border border-slate-200 bg-slate-50/70 px-3.5 text-[16px] font-medium outline-none transition hover:bg-white focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15 ${f.teacherId ? 'text-slate-900' : 'text-slate-500'}">
                      <span id="eTeacherTriggerLabel" class="truncate">${esc(editTeacherLabel)}</span>
                      ${icon('chevron-down', 'h-4 w-4 shrink-0 text-slate-500')}
                    </button>`}
                  <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">可从全平台全体在职老师中直接选定（全平台在职老师均可选定）；暂不委任将受购课与排课双阻断。</p>
                </div>
              </section>
            </div>
          </div>
          <div class="shrink-0 border-t border-slate-200/80 bg-white/95 p-3">
            <div class="mx-auto flex w-full max-w-[640px] gap-2">
              <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 hover:bg-slate-50">${readOnly ? '关闭' : '取消'}</button>
              ${readOnly ? '' : `<button id="editSave" data-action="save-edit" ${state.online === 'off' || editError() ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">保存修改</button>`}
            </div>
          </div>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'archive') return renderArchiveModal();
      if (state.overlay.type === 'dissolve') return renderDissolveModal();
      if (state.overlay.type === 'appoint') return renderAppointModal();
      if (state.overlay.type === 'blocked') return renderBlockedModal();
      if (state.overlay.type === 'edit') return renderEditSheet();
      if (state.overlay.type === 'courseware-config') return renderCoursewareConfigModal();
      if (state.overlay.type === 'progress') return renderProgressModal();
      if (state.overlay.type === 'member-bind') return renderMemberBindModal();
      return '';
    }

    function renderOverlayOnly() {
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    /* ------------------------------------------------------------------
     * 授业老师 / 主理人选择抽屉（DESIGN §8.1.2 / §8.4.4，禁用原生 select）
     * ------------------------------------------------------------------ */
    function renderPickerOnly() {
      $('picker').innerHTML = renderPickerSheet();
      if (window.lucide) lucide.createIcons();
    }

    function pickerMeta() {
      const kind = state.picker?.kind;
      if (kind === 'teacher-create' || kind === 'teacher-edit') {
        const isEdit = kind === 'teacher-edit';
        const current = isEdit ? (state.edit ? state.edit.teacherId : '') : state.create.teacherId;
        return {
          title: '选择授课老师',
          current,
          action: isEdit ? 'pick-teacher-edit' : 'pick-teacher-create',
          search: true,
          allowNone: true,
          noneLabel: isEdit ? '待委任老师' : '暂不绑定老师（待委任老师）',
          noneMeta: isEdit ? '暂不委任将受购课与排课双阻断' : '建班后可再委任',
          resetLabel: '重置为待委任老师',
          options: teacherOptions().map((t) => ({
            value: t.id,
            name: t.name,
            meta: t.leaveDate
              ? `全平台在职老师 · 每节 ${t.price} 积分 · 已设预约离职日`
              : `全平台在职老师 · 每节 ${t.price} 积分`,
            disabled: !!t.leaveDate,
            tag: teacherLeaveLabel(t)
          }))
        };
      }
      if (kind === 'owner-create') {
        return {
          title: '选择小班课主理人',
          current: state.create.ownerMonitorId,
          action: 'pick-owner-create',
          search: false,
          allowNone: false,
          resetLabel: '恢复默认主理人',
          options: monitorOptions().map((m) => ({ value: m.id, name: m.name, meta: '在职班长' }))
        };
      }
      return null;
    }

    function renderPickerRow(cfg, option, on) {
      if (option.disabled) {
        return `<div aria-disabled="true" data-disabled-option="${esc(option.value)}" class="flex min-h-12 w-full cursor-not-allowed items-center justify-between gap-3 rounded-xl border border-slate-200 bg-slate-100 px-3 py-1.5 text-left">
          <span class="min-w-0">
            <span class="flex flex-wrap items-center gap-1.5">
              <span class="block truncate text-[14px] font-semibold text-slate-500">${esc(option.name)}</span>
              ${option.tag ? `<span class="shrink-0 rounded-full border border-amber-300 bg-amber-50 px-1.5 py-0.5 text-[12px] font-bold text-amber-800">${esc(option.tag)}</span>` : ''}
            </span>
            ${option.meta ? `<span class="mt-0.5 block truncate text-[12px] font-medium text-slate-500">${esc(option.meta)}</span>` : ''}
          </span>
          <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border border-slate-300 text-slate-400">${icon('lock', 'h-3 w-3')}</span>
        </div>`;
      }
      return `<button type="button" data-action="${cfg.action}" data-value="${esc(option.value)}" class="flex h-12 w-full items-center justify-between gap-3 rounded-xl border px-3 text-left transition ${on ? 'border-indigo-500 bg-indigo-50/60' : 'border-slate-200 bg-white hover:bg-slate-50'}">
        <span class="min-w-0">
          <span class="block truncate text-[14px] font-semibold ${on ? 'text-indigo-950' : 'text-slate-900'}">${esc(option.name)}</span>
          ${option.meta ? `<span class="mt-0.5 block truncate text-[12px] font-medium text-slate-500">${esc(option.meta)}</span>` : ''}
        </span>
        <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 text-transparent'}">${icon('check', 'h-3.5 w-3.5')}</span>
      </button>`;
    }

    function renderPickerRows(cfg, options) {
      const rows = [];
      if (cfg.allowNone) rows.push(renderPickerRow(cfg, { value: '', name: cfg.noneLabel, meta: cfg.noneMeta }, !cfg.current));
      if (!options.length) {
        rows.push(`<div class="rounded-xl border border-dashed border-slate-300 px-3 py-5 text-center text-[14px] font-medium leading-relaxed text-slate-500">没有匹配结果，请更换关键词</div>`);
      }
      options.forEach((option) => rows.push(renderPickerRow(cfg, option, cfg.current === option.value)));
      return rows.join('');
    }

    function renderPickerSheet() {
      const cfg = pickerMeta();
      if (!cfg) return '';
      const q = state.pickerSearch.trim().toLowerCase();
      const options = cfg.search && q ? cfg.options.filter((option) => option.name.toLowerCase().includes(q)) : cfg.options;
      return `<div class="absolute inset-0 z-[70]">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-picker"></div>
        <div class="absolute inset-x-0 bottom-0 flex max-h-[72%] flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl">
          <div class="flex shrink-0 justify-center pt-2"><span class="h-1.5 w-10 rounded-full bg-slate-200"></span></div>
          <div class="shrink-0 px-4 pb-2 pt-1">
            <div class="flex items-center justify-between gap-2">
              <h2 class="text-[16px] font-bold text-slate-900">${esc(cfg.title)}</h2>
              <button type="button" data-action="close-picker" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
            </div>
            ${cfg.search ? `<div class="relative mt-2">
              <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
              <input id="pickerSearch" type="text" value="${esc(state.pickerSearch)}" placeholder="搜索老师姓名" autocomplete="off" enterkeyhint="search" aria-label="搜索老师姓名" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 pl-9 pr-3 text-[16px] text-slate-900 outline-none transition placeholder:text-slate-500 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">
            </div>` : ''}
          </div>
          <div id="pickerRows" class="min-h-0 flex-1 space-y-1 overflow-y-auto px-4 pb-2">${renderPickerRows(cfg, options)}</div>
          <div class="shrink-0 border-t border-slate-200/80 p-3">
            <button type="button" data-action="picker-reset" class="h-11 w-full rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 hover:bg-slate-50">${esc(cfg.resetLabel)}</button>
          </div>
        </div>
      </div>`;
    }

    function refreshPickerRows() {
      const cfg = pickerMeta();
      if (!cfg) return;
      const q = state.pickerSearch.trim().toLowerCase();
      const options = cfg.search && q ? cfg.options.filter((option) => option.name.toLowerCase().includes(q)) : cfg.options;
      const rows = $('pickerRows');
      if (rows) rows.innerHTML = renderPickerRows(cfg, options);
      if (window.lucide) lucide.createIcons();
    }

    function applyTeacherPick(value) {
      const kind = state.picker?.kind;
      if (kind === 'teacher-edit') {
        if (!state.edit) return;
        state.edit.teacherId = value || '';
        state.edit.error = '';
        state.picker = null;
        state.pickerSearch = '';
        renderPickerOnly();
        const teacher = teacherById(value);
        const label = $('eTeacherTriggerLabel');
        if (label) {
          label.textContent = teacher ? `${teacher.name} · ${teacher.price}积分` : '待委任老师';
          label.className = `truncate ${teacher ? 'text-slate-900' : 'text-slate-500'}`;
        }
        updateEditLive();
        return;
      }
      state.create.teacherId = value || '';
      state.create.error = '';
      state.picker = null;
      state.pickerSearch = '';
      renderAll();
    }

    function applyOwnerPick(value) {
      if (!value) return;
      state.create.ownerMonitorId = value;
      state.create.error = '';
      state.picker = null;
      state.pickerSearch = '';
      renderAll();
    }

    function modalShell(content) {
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-3 top-1/2 mx-auto max-h-[88%] max-w-[560px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">${content}</div>
      </div>`;
    }

    function modalHeader(title, subtitle = '') {
      return `<div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
          ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
        </div>
        <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
      </div>`;
    }

    function renderArchiveModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      const guards = archiveGuards(c);
      const allPass = guards.every((g) => g.pass);
      const blocked = guards.filter((g) => !g.pass).length;
      const inFlightGuard = guards[2];
      const onlyInFlight = !inFlightGuard.pass && blocked === 1;
      const inFlightOrders = Array.isArray(c.inFlightOrderList) ? c.inFlightOrderList : [];
      return modalShell(`
        ${modalHeader(`归档小班：${c.name}`, '归档后不再允许新开购课单；历史排课与财务记录保留只读')}
        <div class="mt-3 flex items-center justify-between gap-2">
          <span class="text-[14px] font-bold text-slate-900">五项资产全清零校验</span>
          <span class="text-[12px] font-medium ${allPass ? 'text-emerald-700' : 'text-rose-700'}">${allPass ? '全部通过' : `${blocked} 项未清零`}</span>
        </div>
        <div class="mt-1.5 space-y-1">
          ${guards.map((g) => `<div class="flex items-center justify-between gap-2 rounded-lg border px-2.5 py-1.5 ${g.pass ? 'border-emerald-200 bg-emerald-50/60' : 'border-rose-200 bg-rose-50/60'}">
            <div class="flex min-w-0 items-center gap-1.5">
              <span class="shrink-0 text-[14px] font-bold ${g.pass ? 'text-emerald-700' : 'text-rose-700'}">${g.pass ? '✓' : '✗'}</span>
              <span class="min-w-0 truncate text-[12px] font-semibold ${g.pass ? 'text-emerald-900' : 'text-rose-900'}">${esc(g.label)}</span>
            </div>
            <span class="shrink-0 font-mono text-[12px] font-bold ${g.pass ? 'text-emerald-800' : 'text-rose-800'}">${g.count}</span>
          </div>`).join('')}
        </div>
        <p class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-500">连续 2 轮自动续费未确认且无未来排课：系统暂停自动续费空转（第 3 轮起不再生成续费草稿单），未来在 M3D 重新排入 4 周整班课后自动恢复扫描。</p>
        ${!inFlightGuard.pass ? `<div class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5">
          <div class="flex items-start gap-2 text-[12px] font-medium leading-relaxed text-rose-900/85">${icon('receipt-text', 'h-4 w-4 shrink-0 text-rose-700')}<span>${onlyInFlight ? '仅剩第 ③ 项在途「待付款确认」单未清零：作废在途单并释放 G-HOLD 后即可正常归档，无需误走【提前结课解散】，也不会产生 M2B 清退记录。' : '命中第 ③ 项：请先在 M2A 作废全部在途「待付款确认」单（含自动续费单）并释放 G-HOLD。'}</span></div>
          ${inFlightOrders.length ? `<div class="mt-1.5 space-y-1">${inFlightOrders.map((o) => `<div class="flex items-center justify-between gap-2 rounded-lg bg-white px-2.5 py-1.5 text-[12px] font-medium text-slate-600">
            <span class="min-w-0 truncate"><span class="font-mono font-bold text-slate-900">${esc(o.id)}</span> · ${esc(o.label)}</span>

          </div>`).join('') : `<div class="rounded-xl border border-dashed border-slate-300 px-3 py-3 text-center text-[12px] font-medium text-slate-500">课件库已全部配置</div>`}

    function progressPrivacyState(c, p) {
      const hits = scanProcessNotePrivacy(p?.note || '', c);
      return { hits, hard: hits.some((h) => h.kind === 'contact') };
    }

    function progressSaveBlocked(c, p) {
      if (state.online === 'off') return true;
      const scan = progressPrivacyState(c, p);
      return scan.hard || !p.confirmed;
    }

    function renderProgressPrivacyBody(c, p) {
      const scan = progressPrivacyState(c, p);
      return `<div class="mt-2 rounded-xl border px-3 py-2.5 ${scan.hits.length ? (scan.hard ? 'border-rose-200 bg-rose-50' : 'border-amber-200 bg-amber-50') : 'border-emerald-200 bg-emerald-50/70'}">
        <div class="flex items-start gap-2">
          <span class="grid h-5 w-5 shrink-0 place-items-center rounded-md ${scan.hits.length ? (scan.hard ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700') : 'bg-emerald-100 text-emerald-700'}">${icon(scan.hits.length ? 'shield-alert' : 'shield-check', 'h-3.5 w-3.5')}</span>
          <div class="min-w-0 flex-1">
            <div class="text-[12px] font-bold ${scan.hits.length ? (scan.hard ? 'text-rose-900' : 'text-amber-900') : 'text-emerald-900'}">${scan.hits.length ? '他生隐私检测未通过' : '他生隐私检测通过'}</div>
            ${scan.hits.length
              ? `<div class="mt-1 flex flex-wrap gap-1">${scan.hits.map((h) => `<span class="rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${h.kind === 'contact' ? 'border-rose-300 bg-white text-rose-700' : 'border-amber-300 bg-white text-amber-800'}">${h.kind === 'contact' ? '硬阻断' : '需确认'} · ${esc(h.label)}</span>`).join('')}</div>
              <p class="mt-1 text-[12px] font-medium leading-relaxed ${scan.hard ? 'text-rose-800' : 'text-amber-800'}">${scan.hard ? '命中联系方式为硬阻断：必须移除手机号 / 邮箱 / 社交账号后方可保存。' : '命中他生姓名：请修改为教学称谓，或勾选下方隐私确认后保存并留痕。'}</p>`
              : `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-emerald-800">未检测到他生姓名、联系方式或社交账号。</p>`}

    function renderProgressModal() {

      if (!cw) return '';

          <div class="mt-1.5 flex flex-wrap gap-1.5">
            ${levels.map((lv) => `<button data-action="progress-level" data-level="${esc(lv)}" class="h-8 rounded-full border px-3 text-[12px] font-bold transition ${p.level === lv ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-50'}">${esc(lv)}</button>`).join('')}
          </div>
        </div>
        <div class="mt-3">
          <div class="flex items-center justify-between gap-2">
            <label for="fProgressNote" class="text-[14px] font-semibold text-slate-700">进度备注 (Process Note)</label>
            <div class="flex items-center gap-2">
              <button data-action="progress-copy" data-id="${c.id}" class="rounded-full border border-slate-300 bg-white px-2 py-0.5 text-[12px] font-semibold text-slate-600 hover:bg-slate-50">复制</button>
              <span id="progressCount" class="text-[12px] font-medium text-slate-500">${p.note.length}/2000</span>
            </div>
          </div>

          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">请尽量填写英文，便于老师看懂；保存或复制前均须通过他生隐私检测。多方并发保存按版本校验，他人先提交时将提示刷新重试，防静默覆盖。</p>
          <div class="mt-1.5 flex flex-wrap gap-1.5">

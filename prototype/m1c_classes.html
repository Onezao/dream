    /* 老师筛选条：全平台参与过小班课授课的在职老师，不收敛到当前主理人私域 */
    function teacherFilterOptions() {

    /* 待排/待补排课次与剩余课次：优先读取 mock 显式字段，缺省时按未来已排 + 待排推算 */
    function classPendingTs(c) {
      return typeof c.pendingTs === 'number' ? c.pendingTs : (Number(c.unsettledTs) || 0);
    }

    function classRemainingTs(c) {
      return typeof c.remainingLessons === 'number'
        ? c.remainingLessons
        : (Number(c.futureTs) || 0) + (Number(c.unsettledTs) || 0);
    }

    /* 按小班名称搜索（大小写不敏感），与老师胶囊、状态分段条 AND 复合 */
    function searchedClasses() {
      const q = state.search.trim().toLowerCase();
      const list = teacherScopedClasses();
      if (!q) return list;
      return list.filter((c) => String(c.name).toLowerCase().includes(q));
    }

    /* AC-1C-10a 默认排序：待委任 → 正式开课（待排优先，剩余课次升序） → 已解散/已归档沉底 */
    function classSortTier(c) {
      if (c.status === 'active') return c.teacherId ? 1 : 0;
      return 2;
    }

    function sortClasses(list) {
      return [...list].sort((a, b) => {
        const tierA = classSortTier(a);
        const tierB = classSortTier(b);
        if (tierA !== tierB) return tierA - tierB;
        if (tierA === 1) {
          const pendingA = classPendingTs(a) > 0 ? 0 : 1;
          const pendingB = classPendingTs(b) > 0 ? 0 : 1;
          if (pendingA !== pendingB) return pendingA - pendingB;
          const remainingA = classRemainingTs(a);
          const remainingB = classRemainingTs(b);
          if (remainingA !== remainingB) return remainingA - remainingB;
        }
        const byName = a.name.localeCompare(b.name, 'zh-Hans-CN', { sensitivity: 'base' });
        if (byName !== 0) return byName;
        return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
      });
    }

    function filteredClasses() {
      const list = searchedClasses();
      const statusScoped = state.filter === 'all' ? list : list.filter((c) => c.status === state.filter);
      return sortClasses(statusScoped);

    const CONSOLE_NAV_KEY = 'dream_proto_nav_collapsed';
    function readConsoleCollapsed() {
      try { return localStorage.getItem(CONSOLE_NAV_KEY) === '1'; } catch (e) { return false; }
    }
    function writeConsoleCollapsed(collapsed) {
      try { localStorage.setItem(CONSOLE_NAV_KEY, collapsed ? '1' : '0'); } catch (e) { /* 隐私模式下静默降级 */ }
    }
    function applyConsoleCollapsed(collapsed) {
      const header = $('console');

      if (!header || !mini) return;
      header.classList.toggle('hidden', collapsed);
      mini.className = collapsed
        ? 'sticky top-0 z-[60] flex items-center justify-end border-b border-slate-200/60 bg-white/70 px-2 py-1 backdrop-blur'
        : 'sticky top-0 z-[60] hidden items-center justify-end border-b border-slate-200/60 bg-white/70 px-2 py-1 backdrop-blur';
    }
    document.querySelector('[data-console-collapse]')?.addEventListener('click', () => { writeConsoleCollapsed(true); applyConsoleCollapsed(true); });
    document.querySelector('[data-console-expand]')?.addEventListener('click', () => { writeConsoleCollapsed(false); applyConsoleCollapsed(false); });
    applyConsoleCollapsed(readConsoleCollapsed());

      return `<header class="relative flex h-16 shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${b.gradient} px-4 text-white">
        ${b.pattern}
        <div class="relative flex min-w-0 items-center gap-2.5">
          ${canBack
            ? `<button data-action="${backAction}" class="inline-flex h-8 shrink-0 items-center gap-1 rounded-lg px-2 -ml-1 text-[13px] font-semibold text-white/90 transition hover:bg-white/10 active:bg-white/15" aria-label="返回">${icon('chevron-left', 'h-4 w-4')}返回</button>`
            : `<span class="grid h-8 w-8 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${b.initial}</span>`}
          <div class="truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</div>

    }

    function renderNav() {
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${currentNav().map((item) => {
            const on = state.navTab === item.id;
            return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-500'}">
              ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
              <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.page === 'create') return renderCreatePage();
      if (state.page === 'detail') return renderClassDetail();
      return renderClasses();
    }

    function renderPlaceholder() {
      const item = currentNav().find((n) => n.id === state.navTab);
      if (!item) return `<div class="p-8 text-center text-[14px] font-medium text-slate-500">页面不存在</div>`;
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">前往${esc(item.label)}</a>` : ''}
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 通用组件
     * ------------------------------------------------------------------ */
    function miniStat(label, value, tone, suffix = '') {
      const T = TONES[tone];
      return `<div class="rounded-xl border border-slate-300 bg-slate-50/70 px-2 py-2">
        <div class="text-[12px] font-medium text-slate-600">${esc(label)}</div>
        <div class="mt-0.5 font-mono text-[18px] font-bold ${T.right}">${esc(value)}${suffix ? `<span class="ml-0.5 text-[12px] font-medium">${esc(suffix)}</span>` : ''}</div>
      </div>`;
    }

    function financeTile(label, value, tone = 'slate') {
      const T = TONES[tone];
      return `<div class="rounded-xl bg-slate-50 px-2 py-1.5">
        <div class="truncate text-[12px] font-medium text-slate-500">${esc(label)}</div>
        <div class="mt-0.5 font-mono text-[16px] font-bold ${T.right}">${esc(value)}</div>
      </div>`;
    }

    function infoItem(label, value) {
      return `<div class="min-w-0">
        <div class="text-[12px] font-medium text-slate-500">${esc(label)}</div>
        <div class="mt-0.5 truncate text-[14px] font-semibold text-slate-900">${esc(value)}</div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 小班列表
     * ------------------------------------------------------------------ */
    function renderTeacherPills() {
      const total = scopeClasses().length;
      const items = [
        { id: 'all', name: '全部老师', count: total },
        ...teacherFilterOptions().map((t) => ({ id: t.id, name: t.name, count: t.count }))
      ];
      return `<div>
        <div class="flex items-center justify-between gap-2">
          <span class="flex shrink-0 items-center gap-1 text-[12px] font-medium text-slate-500">${icon('users', 'h-3.5 w-3.5')}授课老师</span>
          <span class="shrink-0 text-[12px] font-medium text-slate-500">全平台在职 · 参与过小班课</span>
        </div>
        <div class="mt-1 flex min-w-0 items-center gap-1.5 overflow-x-auto py-0.5">
          ${items.map((item) => {
            const on = state.teacherFilter === item.id;
            return `<button data-action="set-teacher" data-teacher="${item.id}" class="h-8 shrink-0 whitespace-nowrap rounded-full border-0 px-3 text-[12px] transition ${on ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${esc(item.name)} (${item.count})</button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderStatusTabs() {
      const list = searchedClasses();
      const tabs = [
        ['all', '全部', list.length],
        ['active', '正式开课', list.filter((c) => c.status === 'active').length],
        ['archived', '已归档', list.filter((c) => c.status === 'archived').length],
        ['early_terminated', '已提前解散', list.filter((c) => c.status === 'early_terminated').length]
      ];
      return `<div class="flex items-center gap-1.5 overflow-x-auto py-0.5">
        ${tabs.map(([key, label, count]) => `<button data-action="set-filter" data-filter="${key}" class="h-8 shrink-0 whitespace-nowrap rounded-full border-0 px-3 text-[12px] transition ${state.filter === key ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${label} ${count}</button>`).join('')}
      </div>`;
    }

    function renderSearchClear() {
      if (!state.search) return '';
      return `<button data-action="clear-search" class="absolute right-2 top-1/2 grid h-7 w-7 -translate-y-1/2 place-items-center rounded-full text-slate-500 transition hover:bg-slate-200 hover:text-slate-700" aria-label="清空搜索">${icon('x', 'h-4 w-4')}</button>`;
    }

    function renderSearchBar() {
      return `<div class="relative">
        <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
        <input id="fClassSearch" type="text" value="${esc(state.search)}" placeholder="按小班名称搜索" autocomplete="off" enterkeyhint="search" aria-label="按小班名称搜索" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 pl-9 pr-10 text-[16px] text-slate-900 outline-none transition placeholder:text-slate-500 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">
        <span id="searchClearSlot">${renderSearchClear()}</span>
      </div>`;
    }

    function renderKpi() {
      const kpiActive = filteredClasses().filter((c) => c.status === 'active');
      const futureTotal = kpiActive.reduce((s, c) => s + (Number(c.futureTs) || 0), 0);
      const moneyTotal = kpiActive.reduce((s, c) => s + Number(c.total || 0) * (Number(c.futureTs) || 0), 0);
      return `<div class="grid grid-cols-3 gap-2">
        ${miniStat('正式开课', kpiActive.length, 'emerald')}
        ${miniStat('未来排课', futureTotal, 'amber', '节')}
        ${miniStat('待上交总积分', points(moneyTotal), 'indigo', '积分')}
      </div>`;
    }

    function emptyFilterState() {
      const q = state.search.trim();
      return `<div class="col-span-full rounded-2xl border border-dashed border-slate-300 bg-slate-50/70 px-6 py-8 text-center">
        <div class="mx-auto grid h-11 w-11 place-items-center rounded-xl border border-slate-200 bg-white text-slate-500">${icon('search-x', 'h-5 w-5')}</div>
        <p class="mt-2.5 text-[14px] font-semibold text-slate-700">${q ? `没有找到与“${esc(q)}”相关的小班` : '暂无符合条件的小班'}</p>
        <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">试试更换授课老师、切换状态，或清空搜索关键词</p>
        <button data-action="reset-filters" class="mt-3 h-10 rounded-xl border border-slate-300 bg-white px-4 text-[14px] font-medium text-slate-800 transition hover:bg-slate-50">重置筛选</button>
      </div>`;
    }

    function renderClassBodyInner() {
      const filtered = filteredClasses();
      return filtered.length ? filtered.map(classCard).join('') : emptyFilterState();
    }

    function refreshClassList() {
      const kpi = $('kpiZone');
      if (kpi) kpi.innerHTML = renderKpi();
      const tabs = $('statusTabsZone');
      if (tabs) tabs.innerHTML = renderStatusTabs();
      const body = $('classesBody');
      if (body) body.innerHTML = renderClassBodyInner();
      const clearSlot = $('searchClearSlot');
      if (clearSlot) clearSlot.innerHTML = renderSearchClear();
      if (window.lucide) lucide.createIcons();
    }

    function renderClasses() {
      const scoped = scopeClasses();
      const tablet = state.device === 'tablet';
      const offline = state.online === 'off';
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0 text-[12px] font-medium leading-relaxed text-slate-500">
            ${isAdmin()
              ? `全平台 ${scoped.length} 个小班 · 4 周轮次滚动`
              : `我主理 ${scoped.length} 个小班 · 4 周轮次滚动`}
          </div>
          <button data-action="open-create" ${offline ? 'disabled' : ''} class="h-10 shrink-0 rounded-lg bg-indigo-600 px-3 text-[14px] font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">+ 创建小班课</button>
        </div>
        <div id="kpiZone">${renderKpi()}</div>
        ${renderSearchBar()}
        ${renderTeacherPills()}
        <div id="statusTabsZone">${renderStatusTabs()}</div>
        <div id="classesBody" class="${tablet ? 'grid grid-cols-2 gap-2' : 'space-y-2'}">${renderClassBodyInner()}</div>
        ${isAdmin() ? `<section class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
          <div class="flex items-start gap-2.5">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg border border-slate-200 bg-white text-indigo-600">${icon('eye-off', 'h-4 w-4')}</span>
            <div class="min-w-0">
              <div class="text-[14px] font-bold text-slate-900">1v1 静默实体（后台）</div>
              <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">当前 ${ONE_TO_ONE_COUNT} 个 · 系统在购课或首次排课环节自动建班；家长端与老师端仅呈现授课老师（+ 价位）及学员信息，不出现小班字样。</p>
            </div>
          </div>
        </section>` : ''}
        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">小班课不关联学员档案与家长账号；招生、沟通与补课由主理人在线下完成。建班即生效。</div>
      </div>`;
    }

    function classCard(c) {
      const meta = statusMeta(c);
      const fin = calcFinance(c);
      const t = classTeacher(c);
      const owner = classOwner(c);
      const pending = !c.teacherId;
      const active = c.status === 'active';
      const offline = state.online === 'off';
      const canEdit = active && ownsClass(c);
      const teacherLine = pending ? '待委任' : `${t.name} · ${t.price}积分`;
      const btn = 'h-7 shrink-0 whitespace-nowrap rounded-lg px-2.5 text-[12px] font-bold transition';
      const neutralBtn = `${btn} border border-slate-300 bg-white text-slate-800 hover:bg-slate-50`;
      const primaryBtn = `${btn} border border-indigo-200 bg-indigo-50/80 text-indigo-700 hover:bg-indigo-100/70`;
      const dangerBtn = `${btn} border border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100`;
      const linkBtn = 'inline-flex items-center gap-0.5 whitespace-nowrap text-[12px] font-semibold text-indigo-600 hover:text-indigo-700 hover:underline';
      const cardCls = active
        ? 'cursor-pointer rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5 transition active:scale-[0.995]'
        : 'cursor-pointer rounded-2xl border border-dashed border-slate-400 bg-slate-50/60 p-3.5 opacity-60 transition active:scale-[0.995]';
      const refundedClosed = c.status === 'early_terminated' && c.termination?.disposition === 'PERMANENT_TERMINATE';
      return `<article data-action="open-class" data-id="${c.id}" role="button" tabindex="0" class="${cardCls}">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="truncate text-[16px] font-bold text-slate-900">${esc(c.name)}</span>
              ${chip(meta.label, meta.tone)}
              ${pending && active ? chip('待委任老师', 'rose') : ''}
              ${refundedClosed ? chip('已退费结案', 'slate') : ''}
            </div>
          </div>
          ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-500')}
        </div>

        <div class="mt-2 grid grid-cols-2 gap-x-3 gap-y-1.5 border-t border-slate-100 pt-2">
          <div class="min-w-0">
            <div class="text-[12px] font-medium text-slate-500">主讲老师</div>
            <div class="mt-0.5 text-[14px] font-semibold leading-tight ${pending ? 'text-rose-700' : 'text-slate-800'}">${esc(teacherLine)}</div>
          </div>
          <div class="min-w-0">
            <div class="text-[12px] font-medium text-slate-500">小班主理人</div>
            <div class="mt-0.5 truncate text-[14px] font-semibold text-slate-800">${esc(owner.name)}</div>
          </div>
          <div class="min-w-0">
            <div class="text-[12px] font-medium text-slate-500">小班规模</div>
            <div class="mt-0.5 truncate text-[14px] font-semibold text-slate-800">Max ${c.max} 人</div>
          </div>
          <div class="min-w-0">
            <div class="text-[12px] font-medium text-slate-500">履约轮次</div>
            <div class="mt-0.5 truncate text-[14px] font-semibold text-slate-800">4 周滚动</div>
          </div>
        </div>

        ${active ? `<div class="mt-2 grid grid-cols-2 gap-2 border-t border-slate-100 pt-2">
          <div><div class="text-[12px] font-medium text-slate-500">单节待上交</div><div class="mt-0.5 font-mono text-[16px] font-bold text-slate-900">${points(fin.total)} <span class="font-sans text-[12px] font-medium text-slate-600">积分/节</span></div></div>
          <div><div class="text-[12px] font-medium text-slate-500">老师单节课酬</div><div class="mt-0.5 font-mono text-[16px] font-bold text-slate-900">${points(fin.salary)} <span class="font-sans text-[12px] font-medium text-slate-600">积分/节</span></div></div>
        </div>
        <div class="mt-1.5 flex flex-wrap items-center justify-between gap-x-2 gap-y-1 rounded-lg bg-white px-2 py-1.5 text-[12px] font-medium leading-relaxed text-slate-600">
          <span class="min-w-0">待排/待补排 <span class="font-mono font-bold ${classPendingTs(c) > 0 ? 'text-amber-700' : 'text-slate-900'}">${classPendingTs(c)}</span> 节 · 剩余 <span class="font-mono font-bold text-slate-900">${classRemainingTs(c)}</span> 节</span>
          <span class="shrink-0">未来已排 <span class="font-mono font-bold text-slate-900">${c.futureTs}</span> 节</span>
        </div>` : `<div class="mt-2 rounded-lg bg-white px-2 py-1.5 text-[12px] font-medium leading-relaxed text-slate-600">单节待上交 ${points(fin.total)} 积分 · 老师课酬 ${points(fin.salary)} 积分</div>`}

        ${pending && active ? `<div class="mt-2 flex items-start gap-2 rounded-lg border border-rose-200 bg-rose-50 px-2 py-1.5 text-[12px] font-medium leading-relaxed text-rose-800">
          ${icon('alert-triangle', 'h-3.5 w-3.5 shrink-0')}待委任主讲老师 · 为本班购课与小班排课暂不可用
        </div>` : ''}
        ${c.status === 'archived' ? `<div class="mt-1.5 text-[12px] font-medium text-slate-600">已归档于 ${esc(c.archivedAt || '—')} · 不再允许新开购课单；历史排课与财务记录只读。</div>` : ''}
        ${c.status === 'early_terminated' ? `<div class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-600">已于 ${esc(c.termination?.at || '—')} 提前结课解散 · 原因：${esc(reasonLabel(c.termination?.reason))} · 处置：${esc(dispositionLabel(c.termination?.disposition))} · 未来排课已释放。</div>` : ''}

        ${active ? `<div class="mt-2 space-y-1.5 border-t border-slate-100 pt-2">
          <div class="flex gap-1.5">
            ${pending ? `<button data-action="open-appoint" data-id="${c.id}" ${offline ? 'disabled' : ''} class="${primaryBtn} flex-1 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">委任老师</button>
              <button data-action="blocked-order" data-id="${c.id}" class="${neutralBtn} flex-1">为本班购课</button>
              <button data-action="blocked-schedule" data-id="${c.id}" class="${neutralBtn} flex-1">小班排课</button>`
              : `<a href="m2a_course_orders.html?class_id=${c.id}" target="_blank" rel="noopener" data-action="ext-link" class="${primaryBtn} flex flex-1 items-center justify-center">为本班购课</a>
              <a href="m3a_calendar_grid.html?class_id=${c.id}" target="_blank" rel="noopener" data-action="ext-link" class="${neutralBtn} flex flex-1 items-center justify-center">小班排课</a>
              ${canEdit ? `<button data-action="open-edit" data-id="${c.id}" ${offline ? 'disabled' : ''} class="${neutralBtn} flex-1 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">编辑小班</button>` : ''}`}
          </div>
          ${pending ? `<div class="flex gap-1.5">
            ${canEdit ? `<button data-action="open-edit" data-id="${c.id}" ${offline ? 'disabled' : ''} class="${neutralBtn} flex-1 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">编辑小班</button>` : ''}
            <button data-action="suspend-class" data-id="${c.id}" ${offline ? 'disabled' : ''} class="${neutralBtn} flex-1 disabled:opacity-40">暂停待排</button>
            <button data-action="open-archive" data-id="${c.id}" ${offline ? 'disabled' : ''} class="${neutralBtn} flex-1 disabled:opacity-40">归档</button>
          </div>
          <div class="flex gap-1.5">
            <button data-action="open-dissolve" data-id="${c.id}" ${offline ? 'disabled' : ''} class="${dangerBtn} flex-1 disabled:opacity-40">提前结课解散</button>
          </div>` : `<div class="flex gap-1.5">
            <button data-action="suspend-class" data-id="${c.id}" ${offline ? 'disabled' : ''} class="${neutralBtn} flex-1 disabled:opacity-40">暂停待排</button>
            <button data-action="open-archive" data-id="${c.id}" ${offline ? 'disabled' : ''} class="${neutralBtn} flex-1 disabled:opacity-40">归档</button>
            <button data-action="open-dissolve" data-id="${c.id}" ${offline ? 'disabled' : ''} class="${dangerBtn} flex-1 disabled:opacity-40">提前结课解散</button>
          </div>`}
          <div class="flex items-center justify-end px-0.5">
            <button data-action="open-log" data-id="${c.id}" class="${linkBtn}">修改日志 →</button>
          </div>
        </div>` : `<div class="mt-2 flex flex-wrap items-center justify-between gap-1.5 border-t border-slate-100 pt-2">
          <span class="text-[12px] font-medium text-slate-600">${c.status === 'early_terminated' ? '已提前结课解散 · 记录只读' : '查看小班运营核算与历史记录'}</span>
          <div class="flex items-center gap-2">
            ${c.status === 'early_terminated' && c.termination?.disposition === 'REOPEN_NEW_CLASS' ? `<button data-action="open-reopen" data-id="${c.id}" ${offline ? 'disabled' : ''} class="${primaryBtn} disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">委任新老师创建新小班</button>` : ''}
            <button data-action="open-log" data-id="${c.id}" class="${linkBtn}">修改日志 →</button>
          </div>
        </div>`}
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 小班详情
     * ------------------------------------------------------------------ */
    function renderClassDetail() {
      const c = classById(state.activeClassId);
      if (!c) return renderClasses();
      if (!ownsClass(c)) return renderClasses();
      const meta = statusMeta(c);
      const fin = calcFinance(c);
      const t = classTeacher(c);
      const owner = classOwner(c);
      const canWrite = ownsClass(c);
      const pending = !c.teacherId;
      const active = c.status === 'active';
      const offline = state.online === 'off';
      const termination = c.termination;
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
          <div class="flex flex-wrap items-center gap-1.5">
            <h1 class="truncate text-[18px] font-bold tracking-tight text-slate-900">${esc(c.name)}</h1>
            ${chip(meta.label, meta.tone)}
            ${pending && active ? chip('待委任老师', 'rose') : ''}
            ${c.status === 'early_terminated' && termination?.disposition === 'PERMANENT_TERMINATE' ? chip('已退费结案', 'slate') : ''}
          </div>
          <div class="mt-0.5 truncate font-mono text-[12px] font-medium text-slate-500">${esc(c.id)}</div>
          <div class="mt-2 grid grid-cols-2 gap-x-3 gap-y-2">
            ${infoItem('主讲老师', pending ? '待委任' : `${t.name} · ${t.price}积分`)}
            ${infoItem('小班主理人', owner.name)}
            ${infoItem('小班规模', `Max ${c.max} 人`)}
            ${infoItem('履约轮次', '4 周滚动')}
            ${infoItem('建班日期', c.createdAt)}
            ${c.status !== 'early_terminated' ? `${infoItem('已结课', `${c.completedTs || 0} 节`)}
            ${infoItem('未来排课', `${c.futureTs} 节`)}
            ${infoItem('待排课', `${c.unsettledTs} 节`)}` : ''}
          </div>
          <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-500">小班以 4 周为一个履约轮次滚动运营；老师日历中按 50 分钟连续双格 56px 呈现，与 1v1 固定位合并排布。</p>
        </section>

      const fin = calcFinance(f);
      const preview = $('financePreview');
      if (preview) preview.innerHTML = financeCard(fin, '实时核算预览', true);
      const btn = $('btnCreateClass');
      if (btn) btn.disabled = !!createError();
    }

    function createError() {
      const f = state.create;
      if (state.online === 'off') return '离线模式下不可创建小班';
      const name = f.name.trim();
      if (!name) return '请填写班级名称';
      if (name.length > 64) return '班级名称不能超过 64 字符';
      if (f.teacherId && !teacherOptions().some((t) => t.id === f.teacherId)) return '请选择全平台在职授课老师或暂不绑定';
      if (!monitorOptions().some((m) => m.id === f.ownerMonitorId)) return '请选择在职主理人';
      const max = Number(f.max);
      if (!Number.isInteger(max) || max < 2 || max > 20) return '最大学生数 (Max) 需为 2~20 的整数';
      const salary = Number(f.salary);
      if (!Number.isInteger(salary) || salary < 0) return '老师单节课酬积分需为非负整数';
      const total = Number(f.total);
      if (!Number.isInteger(total) || total <= 0) return '单节待上交费用积分需为正整数';
      return null;
    }

    function openCreate() {
      if (state.online === 'off') return showToast('离线模式下不可创建小班');
      state.create = {
        ...emptyCreate(),
        ownerMonitorId: isAdmin() ? 'mn_leo000001' : CURRENT_MONITOR_ID
      };
      state.page = 'create';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      updateCreatePreview();
    }

    function openReopen(classId) {
      if (state.online === 'off') return showToast('离线模式下不可创建小班');
      const source = classById(classId);
      if (!source) return;
      if (!ownsClass(source)) return showToast('仅主理人或管理员可创建承接新班');
      state.create = {
        ...emptyCreate(),
        name: `${source.name} · 承接小班`,
        teacherId: '',
        ownerMonitorId: source.ownerMonitorId,
        max: String(source.max),
        salary: String(source.salary),
        total: String(source.total),
        sourceClassId: source.id
      };
      state.page = 'create';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      showToast('已带入原班 Max 与财务参数，请委任新老师');
    }

    function submitCreate() {
      const err = createError();
      if (err) {
        state.create.error = err;
        renderAll();
        setTimeout(() => $('createError')?.scrollIntoView({ block: 'center' }), 60);
        showToast(err);
        return;
      }
      const f = state.create;
      const teacher = teacherById(f.teacherId);
      const source = f.sourceClassId ? classById(f.sourceClassId) : null;
      const c = {
        id: newClassId(),
        name: f.name.trim(),
        teacherId: teacher ? teacher.id : null,
        ownerMonitorId: f.ownerMonitorId,
        max: Number(f.max),
        salary: Number(f.salary),
        total: Number(f.total),
        status: 'active',
        futureTs: 0,
        unsettledTs: 0,
        pendingTs: 0,
        remainingLessons: 0,
        completedTs: 0,
        hasOrder: false,
        createdAt: TODAY,
        sourceClassId: source ? source.id : null,
        auditLog: [
          { at: `${TODAY} 10:00`, action: '新建小班', operator: currentOperatorName(), summary: teacher
            ? `创建小班 · 主理人 ${monitorById(f.ownerMonitorId).name} · 委任 ${teacher.name}（全平台直接委任）`
            : `创建小班 · 主理人 ${monitorById(f.ownerMonitorId).name} · 暂未委任主讲老师` },
          { at: `${TODAY} 10:00`, kind: 'status', from: 'pending_open', to: 'active', operator: currentOperatorName(), reason: '创建生效' }
        ]
      };
      if (source) {
        c.auditLog.push({ at: `${TODAY} 10:01`, action: '承接原班', operator: currentOperatorName(), summary: `承接原小班 ${source.name} · 剩余 ${points(source.unsettledTs)} 节 · 原班已提前结课解散` });
        appendAudit(source, '委任新老师创建新小班', `已创建承接新班 ${c.name}（${c.id}）`);
      }
      state.classes.unshift(c);
      state.activeClassId = c.id;
      state.page = 'detail';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      showToast(teacher ? `已创建 ${c.name} · 建班即生效` : `已创建 ${c.name} · 待委任老师，购课与排课暂不可用`);
    }

    /* ------------------------------------------------------------------
     * 编辑小班（AC-1C-05a / 05b / 05c）
     * ------------------------------------------------------------------ */
    function editFinanceError() {
      const f = state.edit;
      if (!f) return null;
      const max = Number(f.max);
      const salary = Number(f.salary);
      const total = Number(f.total);
      if (!Number.isInteger(max) || max < 2 || max > 20) return '最大学生数 (Max) 需为 2~20 的整数';
      if (!Number.isInteger(salary) || salary < 0) return '老师单节课酬积分需为非负整数';
      if (!Number.isInteger(total) || total <= 0) return '单节待上交费用积分需为正整数';
      return null;
    }

    function editError() {
      const f = state.edit;
      if (!f) return null;
      const c = classById(f.classId);
      if (!c) return null;
      const name = f.name.trim();
      if (!name) return '请填写班级名称';
      if (name.length > 64) return '班级名称不能超过 64 字符';
      const stage = classStage(c);
      if (stage === '3' || stage === '4') return null;
      if (f.teacherId && !teacherOptions().some((t) => t.id === f.teacherId)) return '请选择全平台在职授课老师或待委任老师';
      return editFinanceError();
    }

    function renderEditFinance() {
      const fin = calcFinance(state.edit || {});
      const err = editFinanceError();
      return `<div class="rounded-2xl border p-3.5 ${err ? 'border-rose-200 bg-rose-50' : 'border-indigo-200/80 bg-indigo-50/50'}">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[12px] font-semibold text-slate-600">单节待上交费用积分</span>
          <span class="font-mono text-[18px] font-bold ${err ? 'text-rose-700' : 'text-slate-900'}">${points(fin.total)} <span class="text-[12px] font-medium">积分</span></span>
        </div>
        <div class="mt-1 flex items-center justify-between gap-2">
          <span class="text-[12px] font-semibold text-slate-600">老师单节课酬积分</span>
          <span class="font-mono text-[16px] font-bold text-indigo-700">${points(fin.salary)} <span class="text-[12px] font-medium">积分</span></span>
        </div>
        ${err
          ? `<p class="mt-2 flex items-start gap-1 rounded-lg bg-white/70 px-2 py-1.5 text-[12px] font-semibold leading-relaxed text-rose-700">${icon('alert-triangle', 'h-3.5 w-3.5 shrink-0')}<span>${esc(err)}</span></p>`
          : `<p class="mt-2 text-[12px] font-medium text-slate-500">录入多少即按多少上交，按录入金额全额计入周度转账单。</p>`}
      </div>`;
    }

    function editChanges(c) {
      const f = state.edit;
      const stage = classStage(c);
      const changes = [];
      const push = (label, from, to) => {
        if (String(from ?? '') !== String(to ?? '')) changes.push({ label, from, to });
      };
      push('班级名称', c.name, f.name.trim());
      if (stage === '1' || stage === '2') {
        push('最大学生数 (Max)', c.max, Number(f.max));
        push('老师单节课酬积分', c.salary, Number(f.salary));
        push('单节待上交费用积分', c.total, Number(f.total));
        const oldTeacher = c.teacherId ? (teacherById(c.teacherId)?.name || '待委任老师') : '待委任老师';
        const newTeacher = f.teacherId ? (teacherById(f.teacherId)?.name || '待委任老师') : '待委任老师';
        push('授课老师', oldTeacher, newTeacher);
      }
      return changes;
    }

    function openEdit(classId, force = false) {
      if (state.online === 'off') return showToast('离线模式下不可编辑小班');
      const c = classById(classId);
      if (!c) return;
      if (!ownsClass(c)) return showToast('仅主理人或管理员可编辑小班');
      if (c.status !== 'active' && !force) return showToast('终态小班全字段只读');
      state.edit = emptyEdit(c);
      state.overlay = { type: 'edit', classId: c.id };
      renderAll();
    }

    function saveEdit() {
      if (state.online === 'off') return showToast('离线模式下不可编辑小班');
      const f = state.edit;
      if (!f) return;
      const c = classById(f.classId);
      if (!c) return;
      const stage = classStage(c);
      if (stage === '4') return showToast('终态小班全字段只读');
      const err = editError();
      if (err) {
        f.error = err;
        updateEditLive();
        return showToast(err);
      }
      const changes = editChanges(c);
      if (!changes.length) {
        state.overlay = null;
        state.edit = null;
        renderAll();
        return showToast('未检测到修改');
      }
      c.name = f.name.trim();
      if (stage === '1' || stage === '2') {
        c.teacherId = f.teacherId || null;
        c.max = Number(f.max);
        c.salary = Number(f.salary);
        c.total = Number(f.total);
      }
      appendAudit(c, '编辑小班', changes.map((ch) => `${ch.label}: ${ch.from} → ${ch.to}`).join('；'));
      state.overlay = null;
      state.edit = null;
      renderAll();
      showToast('小班信息已保存');
    }

    function updateEditLive() {
      const block = $('editFinanceBlock');
      if (block) block.innerHTML = renderEditFinance();
      const btn = $('editSave');
      if (btn) btn.disabled = state.online === 'off' || !!editError();
    }

        : stage === '4'
          ? `<div class="mt-2 flex items-start gap-2 rounded-xl border border-slate-300 bg-slate-100 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">${icon('lock', 'h-4 w-4 shrink-0 text-slate-500')}<span>小班已归档或已提前解散，全字段只读。</span></div>`
          : '';
      return `<div class="absolute inset-0 z-50">

          <div class="flex shrink-0 justify-center pt-2"><span class="h-1.5 w-10 rounded-full bg-slate-200"></span></div>
          <div class="shrink-0 border-b border-slate-100 px-4 pb-3 pt-1">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <h2 class="text-[18px] font-bold tracking-tight text-slate-900">编辑小班</h2>
                <p class="mt-0.5 truncate text-[14px] font-semibold text-slate-700">${esc(c.name)}</p>
              </div>
              <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
            </div>
            <div class="mt-2 flex flex-wrap items-center gap-1.5">
              ${chip(meta.label, meta.tone)}
              <span class="text-[12px] font-medium text-slate-500">${esc(meta.desc)}</span>

          </div>
          <div data-edit-scroll class="min-h-0 flex-1 overflow-y-auto bg-slate-50 px-4 py-3">

                </div>
                <div class="mt-3 space-y-3.5">
                  <div>
                    <label for="eName" class="mb-1 block text-[14px] font-semibold text-slate-700">班级名称 <span class="text-rose-500">*</span></label>
                    <input id="eName" value="${esc(f.name)}" maxlength="64" ${nameLocked ? 'disabled' : ''} class="${nameLocked ? lockedCls : editableCls}">
                  </div>
                  <div>
                    <div class="mb-1 block text-[14px] font-semibold text-slate-700">小班主理人</div>

                    : `<button type="button" id="eTeacherTrigger" data-action="open-picker" data-picker="teacher-edit" class="flex h-11 w-full items-center justify-between gap-2 rounded-xl border border-slate-200 bg-slate-50/70 px-3.5 text-[16px] font-medium outline-none transition hover:bg-white focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15 ${f.teacherId ? 'text-slate-900' : 'text-slate-500'}">

              ${readOnly ? '' : `<button id="editSave" data-action="save-edit" ${state.online === 'off' || editError() ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">保存修改</button>`}

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'archive') return renderArchiveModal();
      if (state.overlay.type === 'dissolve') return renderDissolveModal();
      if (state.overlay.type === 'appoint') return renderAppointModal();
      if (state.overlay.type === 'blocked') return renderBlockedModal();
      if (state.overlay.type === 'edit') return renderEditSheet();
      return '';
    }

    function renderOverlayOnly() {
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    /* ------------------------------------------------------------------
     * 授业老师 / 主理人选择抽屉（DESIGN §8.1.2 / §8.4.4，禁用原生 select）
     * ------------------------------------------------------------------ */
    function renderPickerOnly() {
      $('picker').innerHTML = renderPickerSheet();
      if (window.lucide) lucide.createIcons();
    }

    function pickerMeta() {
      const kind = state.picker?.kind;
      if (kind === 'teacher-create' || kind === 'teacher-edit') {
        const isEdit = kind === 'teacher-edit';
        const current = isEdit ? (state.edit ? state.edit.teacherId : '') : state.create.teacherId;
        return {
          title: '选择授课老师',
          current,
          action: isEdit ? 'pick-teacher-edit' : 'pick-teacher-create',
          search: true,
          allowNone: true,
          noneLabel: isEdit ? '待委任老师' : '暂不绑定老师（待委任老师）',
          noneMeta: isEdit ? '暂不委任将受购课与排课双阻断' : '建班后可再委任',
          resetLabel: '重置为待委任老师',
          options: teacherOptions().map((t) => ({ value: t.id, name: t.name, meta: `全平台在职老师 · 每节 ${t.price} 积分` }))
        };
      }
      if (kind === 'owner-create') {
        return {
          title: '选择小班课主理人',
          current: state.create.ownerMonitorId,
          action: 'pick-owner-create',
          search: false,
          allowNone: false,
          resetLabel: '恢复默认主理人',
          options: monitorOptions().map((m) => ({ value: m.id, name: m.name, meta: '在职班长' }))
        };
      }
      return null;
    }

    function renderPickerRow(cfg, option, on) {
      return `<button type="button" data-action="${cfg.action}" data-value="${esc(option.value)}" class="flex h-12 w-full items-center justify-between gap-3 rounded-xl border px-3 text-left transition ${on ? 'border-indigo-500 bg-indigo-50/60' : 'border-slate-200 bg-white hover:bg-slate-50'}">
        <span class="min-w-0">
          <span class="block truncate text-[14px] font-semibold ${on ? 'text-indigo-950' : 'text-slate-900'}">${esc(option.name)}</span>
          ${option.meta ? `<span class="mt-0.5 block truncate text-[12px] font-medium text-slate-500">${esc(option.meta)}</span>` : ''}
        </span>
        <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 text-transparent'}">${icon('check', 'h-3.5 w-3.5')}</span>
      </button>`;
    }

    function renderPickerRows(cfg, options) {
      const rows = [];
      if (cfg.allowNone) rows.push(renderPickerRow(cfg, { value: '', name: cfg.noneLabel, meta: cfg.noneMeta }, !cfg.current));
      if (!options.length) {
        rows.push(`<div class="rounded-xl border border-dashed border-slate-300 px-3 py-5 text-center text-[14px] font-medium leading-relaxed text-slate-500">没有匹配结果，请更换关键词</div>`);
      }
      options.forEach((option) => rows.push(renderPickerRow(cfg, option, cfg.current === option.value)));
      return rows.join('');
    }

    function refreshPickerRows() {
      const cfg = pickerMeta();
      if (!cfg) return;
      const q = state.pickerSearch.trim().toLowerCase();
      const options = cfg.search && q ? cfg.options.filter((option) => option.name.toLowerCase().includes(q)) : cfg.options;
      const rows = $('pickerRows');
      if (rows) rows.innerHTML = renderPickerRows(cfg, options);
      if (window.lucide) lucide.createIcons();

    function applyTeacherPick(value) {
      const kind = state.picker?.kind;
      if (kind === 'teacher-edit') {
        if (!state.edit) return;
        state.edit.teacherId = value || '';
        state.edit.error = '';
        state.picker = null;
        state.pickerSearch = '';
        renderPickerOnly();
        const teacher = teacherById(value);
        const label = $('eTeacherTriggerLabel');
        if (label) {
          label.textContent = teacher ? `${teacher.name} · ${teacher.price}积分` : '待委任老师';
          label.className = `truncate ${teacher ? 'text-slate-900' : 'text-slate-500'}`;
        }
        updateEditLive();
        return;
      }
      state.create.teacherId = value || '';
      state.create.error = '';
      state.picker = null;
      state.pickerSearch = '';
      renderAll();
    }

    function applyOwnerPick(value) {
      if (!value) return;
      state.create.ownerMonitorId = value;
      state.create.error = '';
      state.picker = null;
      state.pickerSearch = '';
      renderAll();
    }

    function modalShell(content) {
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-3 top-1/2 mx-auto max-h-[88%] max-w-[560px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">${content}</div>

    function modalHeader(title, subtitle = '') {
      return `<div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>

    function dissolveValid(c) {
      const d = state.dissolve;
      if (!c || state.online === 'off') return false;
      if (!d.reason || !d.disposition) return false;
      if (d.disposition === 'PERMANENT_TERMINATE' && !d.note.trim()) return false;
      if (!d.confirmed) return false;
      return true;
    }

    function renderDissolveModal() {
      const c = classById(state.overlay.classId);

      return modalShell(`

        <div class="mt-3">

        <div class="mt-3">
          <div class="text-[14px] font-bold text-slate-900">后续处置流向 <span class="text-rose-500">*</span></div>
          <div class="mt-1.5 space-y-1.5">
            ${DISSOLVE_DISPOSITIONS.map((item) => `<button data-action="dissolve-disposition" data-disposition="${item.id}" class="w-full rounded-xl border px-3 py-2 text-left transition ${d.disposition === item.id ? 'border-indigo-600 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
              <div class="flex items-center gap-2">
                <span class="grid h-4 w-4 shrink-0 place-items-center rounded-full border ${d.disposition === item.id ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 text-transparent'}">${icon('check', 'h-3 w-3')}</span>
                <span class="text-[14px] font-semibold text-slate-900">${esc(item.label)}</span>
              </div>
              <p class="mt-0.5 pl-6 text-[12px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
            </button>`).join('')}
          </div>
        </div>

        ${showRefund ? `<div class="mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5">
          <div class="text-[14px] font-bold text-rose-950">线下退费清算参考</div>
          <div class="mt-1.5 space-y-1 text-[12px] font-medium text-rose-900/85">

            <div class="flex items-center justify-between gap-2"><span>人均应退（按 Max ${c.max} 人测算）</span><span class="font-mono font-bold text-rose-950">${points(perCapita)} 积分</span></div>
            <p class="pt-1 text-rose-700">仅供主理人对账参考；系统不生成退款单，不参与线上划扣与垫付。</p>

        </div>` : d.disposition === 'REOPEN_NEW_CLASS' ? `<div class="mt-3 rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">
          剩余 ${points(c.unsettledTs)} 节将结转新班。提交后可在小班详情中点击【委任新老师创建新小班】，原班购课单封存归档。
        </div>` : ''}

        <div class="mt-3">
          <label for="fDissolveNote" class="mb-1 block text-[14px] font-semibold text-slate-700">${showRefund ? '退费说明及审计备注' : '结转备注（选填）'} ${showRefund ? '<span class="text-rose-500">*</span>' : ''}</label>
          <textarea id="fDissolveNote" rows="3" placeholder="${showRefund ? '如：已于微信群向全班家长原路结清剩余学费，小班彻底终止不再开班' : '如：已与家长协商，剩余课次与差额结转到新班'}" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-[14px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500">${esc(d.note)}</textarea>

        ${showRefund ? `<div class="mt-3">

          <span class="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-md border ${d.confirmed ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 text-transparent'}">${icon('check', 'h-3.5 w-3.5')}</span>
          <span class="text-[12px] font-medium leading-relaxed ${d.confirmed ? 'text-indigo-900' : 'text-slate-600'}">${esc(DISCLAIMER_TEXT)}</span>
        </button>
        ${!d.confirmed ? `<p class="mt-1 text-[12px] font-medium text-slate-500">勾选免责确认后方可提交</p>` : ''}

        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">取消</button>
          <button id="dissolveSubmit" data-action="dissolve-confirm" data-id="${c.id}" ${valid ? '' : 'disabled'} class="h-11 flex-[1.6] rounded-xl bg-rose-600 text-[16px] font-semibold text-white hover:bg-rose-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认提前结课</button>
        </div>
      `);

    function renderAppointModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      if (c.status !== 'active') {
        return modalShell(`
          ${modalHeader('当前状态不可委任老师', '仅正式开课的小班可委任主讲老师')}
          <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-[14px] font-medium leading-relaxed text-slate-600">该小班当前为${esc(statusMeta(c).label)}状态，不可再委任主讲老师。</div>
          <div class="mt-3"><button data-action="close-overlay" class="h-11 w-full rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">知道了</button></div>
        `);
      }
      if (c.teacherId) {
        return modalShell(`
          ${modalHeader('无法直接更换主讲老师', '长期换师必须通过提前结课解散并创建新小班')}
          <div class="mt-3 rounded-xl border border-amber-200 bg-amber-50 px-3 py-3">
            <div class="flex items-start gap-2">
              ${icon('alert-triangle', 'h-5 w-5 shrink-0 text-amber-700')}
              <div class="min-w-0 text-[14px] font-semibold leading-relaxed text-amber-950">
                <p>该小班已委任主讲老师 ${esc(classTeacher(c).name)}，不支持在原班直接更换老师。</p>
                <p class="mt-1 text-[12px] font-medium text-amber-900">长期换师（老师离职、长期请假 ≥3 节或家长集体换师）请走换师方案 2：提前结课解散 → 线下多退少补 → 委任新老师创建新小班。短期 1–2 节应急代课请走代课指派，不解散小班。</p>
              </div>
            </div>
          </div>
          <div class="mt-3 flex gap-2">
            <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">知道了</button>
            ${ownsClass(c) ? `<button data-action="open-dissolve" data-id="${c.id}" class="h-11 flex-[1.6] rounded-xl bg-rose-600 text-[16px] font-semibold text-white hover:bg-rose-700">提前结课解散</button>` : ''}

        `);
      }
      const teachers = teacherOptions();

      return modalShell(`
        ${modalHeader(`委任老师：${c.name}`, '从全平台全体在职老师中直接选定主讲老师；无需审批')}
        <div class="mt-3 space-y-1.5">
          ${teachers.length ? teachers.map((t) => {
            const on = state.appoint.selected === t.id;
            return `<button data-action="appoint-select" data-teacher="${t.id}" class="w-full rounded-xl border px-3 py-2.5 text-left transition ${on ? 'border-indigo-600 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
              <div class="flex items-center justify-between gap-2">
                <div class="min-w-0">
                  <div class="flex flex-wrap items-center gap-1.5">
                    <span class="text-[14px] font-bold text-slate-900">${esc(t.name)}</span>
                    <span class="rounded-full border-0 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${t.price}积分</span>
                    ${on ? chip('已选择', 'indigo') : ''}
                  </div>
                  <div class="mt-0.5 text-[12px] font-medium text-slate-500">全平台在职老师 · 家长每节应付 ${t.price}积分</div>
                </div>
                <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 text-transparent'}">${icon('check', 'h-3.5 w-3.5')}</span>
              </div>
            </button>`;
          }).join('') : `<div class="rounded-xl border border-dashed border-slate-300 px-3 py-5 text-center text-[14px] font-medium leading-relaxed text-slate-500">暂无在职老师，请稍后再试</div>`}

        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">取消</button>

        </div>

    function renderBlockedModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      return modalShell(`
        ${modalHeader('暂不可录单与排课', '请先完成主讲老师委任')}
        <div class="mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-3">
          <div class="flex items-start gap-2">
            ${icon('alert-triangle', 'h-5 w-5 shrink-0 text-rose-700')}
            <p class="text-[14px] font-semibold leading-relaxed text-rose-950">该小班尚未委任授课老师，请先点击【委任老师】选定主讲老师后再录单收款与排课</p>

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'ext-link') return;
      if (action === 'bell') return showToast(`消息中心有 ${BANNERS[state.role].unread} 条新通知`);
      if (action === 'back-main') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'back-classes') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'open-class') {
        state.activeClassId = el.dataset.id;
        state.page = 'detail';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.logOpen = false;
        state.overlay = null;
        return renderAll();
      }
      if (action === 'open-log') {
        state.activeClassId = el.dataset.id;
        state.page = 'detail';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.logOpen = true;
        state.overlay = null;
        return renderAll();
      }
      if (action === 'open-edit') return openEdit(el.dataset.id);
      if (action === 'save-edit') return saveEdit();
      if (action === 'open-picker') {
        const kind = el.dataset.picker;
        if (!kind) return;
        if (kind === 'teacher-edit') {
          if (!state.edit) return;
          const c = classById(state.edit.classId);
          if (!c || classStage(c) === '3' || classStage(c) === '4') return;
        }
        state.picker = { kind };
        state.pickerSearch = '';
        return renderPickerOnly();
      }
      if (action === 'close-picker') {
        state.picker = null;
        state.pickerSearch = '';
        return renderPickerOnly();
      }
      if (action === 'pick-teacher-create' || action === 'pick-teacher-edit') return applyTeacherPick(el.dataset.value || '');
      if (action === 'pick-owner-create') return applyOwnerPick(el.dataset.value || '');
      if (action === 'picker-reset') {
        if (!state.picker) return;
        if (state.picker.kind === 'owner-create') return applyOwnerPick(monitorOptions()[0]?.id || CURRENT_MONITOR_ID);
        return applyTeacherPick('');
      }
      if (action === 'toggle-log') { state.logOpen = !state.logOpen; return renderAll(); }
      if (action === 'set-filter') { state.filter = el.dataset.filter; return renderAll(); }
      if (action === 'set-teacher') { state.teacherFilter = el.dataset.teacher; return renderAll(); }
      if (action === 'show-teacher-all') { state.filter = 'all'; return renderAll(); }
      if (action === 'clear-search') {
        state.search = '';
        renderAll();
        const input = $('fClassSearch');
        if (input) input.focus();
        return;
      }
      if (action === 'reset-filters') {
        state.search = '';
        state.teacherFilter = 'all';
        state.filter = 'all';
        renderAll();
        return;
      }
      if (action === 'open-create') return openCreate();
      if (action === 'cancel-create') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'submit-create') return submitCreate();
      if (action === 'open-reopen') return openReopen(el.dataset.id);
      if (action === 'suspend-class') {
        if (state.online === 'off') return showToast('离线模式下不可暂停待排');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可执行暂停待排');
        const released = c.futureTs;
        if (released > 0) {
          const pendingBefore = classPendingTs(c);
          c.futureTs = 0;
          c.unsettledTs += released;
          c.pendingTs = pendingBefore + released;
          appendAudit(c, '暂停待排', `${released} 节未来排课已退回待排池（补排待办：立即补排）`);
        } else {
          appendAudit(c, '暂停待排', '本次暂停待排已记录，当前无未来排课');
        }
        renderAll();
        return showToast(released > 0 ? `已提交暂停待排 · ${released} 节退回待排池，可在补排待办中立即补排` : '已提交暂停待排');
      }
      if (action === 'open-archive') {
        if (state.online === 'off') return showToast('离线模式下不可归档');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可归档小班');
        state.overlay = { type: 'archive', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'open-dissolve') {
        if (state.online === 'off') return showToast('离线模式下不可提前结课解散');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可提前结课解散');
        state.dissolve = emptyDissolve();
        state.overlay = { type: 'dissolve', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'dissolve-reason') {
        state.dissolve.reason = el.dataset.reason;
        return renderOverlayOnly();
      }
      if (action === 'dissolve-disposition') {
        state.dissolve.disposition = el.dataset.disposition;
        return renderOverlayOnly();
      }
      if (action === 'dissolve-add-shot') {
        if (state.dissolve.screenshots < 3) state.dissolve.screenshots += 1;
        return renderOverlayOnly();
      }
      if (action === 'dissolve-remove-shot') {
        if (state.dissolve.screenshots > 0) state.dissolve.screenshots -= 1;
        return renderOverlayOnly();
      }
      if (action === 'dissolve-toggle-confirm') {
        state.dissolve.confirmed = !state.dissolve.confirmed;
        return renderOverlayOnly();
      }
      if (action === 'open-appoint') {
        if (state.online === 'off') return showToast('离线模式下不可委任老师');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可委任老师');
        state.appoint = { classId: el.dataset.id, selected: '' };
        state.overlay = { type: 'appoint', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'appoint-select') {
        state.appoint.selected = el.dataset.teacher;
        return renderOverlayOnly();
      }
      if (action === 'blocked-order' || action === 'blocked-schedule') {
        state.overlay = { type: 'blocked', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'blocked-appoint') {
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return;
        if (state.online === 'off') return showToast('离线模式下不可委任老师');
        state.appoint = { classId: c.id, selected: '' };
        state.overlay = { type: 'appoint', classId: c.id };
        return renderAll();
      }
      if (action === 'appoint-confirm') {
        if (state.online === 'off') return showToast('离线模式下不可委任老师');
        const c = classById(el.dataset.id);
        const t = teacherById(state.appoint.selected);
        if (!c || !t || !ownsClass(c)) return;
        if (c.status !== 'active') return showToast('仅正式开课小班可委任主讲老师');
        if (c.teacherId) return showToast('该班已委任主讲老师；长期换师请走提前结课解散并创建新小班');
        if (!teacherOptions().some((x) => x.id === t.id)) return showToast('请选择全平台在职老师');
        c.teacherId = t.id;
        appendAudit(c, '委任老师', `主讲老师: 待委任 → ${t.name}（全平台直接委任）`);
        state.overlay = null;
        renderAll();
        return showToast(`已委任 ${t.name} · 购课与排课已恢复`);
      }
      if (action === 'archive-confirm') {
        if (state.online === 'off') return showToast('离线模式下不可归档');
        const c = classById(el.dataset.id);
        if (!c || c.status !== 'active' || !ownsClass(c)) return;
        if (c.futureTs > 0) return showToast(`该小班仍有 ${c.futureTs} 节未来已排课，请先暂停待排后再归档`);
        c.status = 'archived';
        c.archivedAt = TODAY;
        c.pendingTs = 0;
        c.remainingLessons = 0;
        appendAudit(c, '归档小班', '课程结束 · 小班归档，不再新开购课单');
        appendStatus(c, 'active', 'archived', '4 周履约完结 · 主理人归档');
        state.overlay = null;
        renderAll();
        return showToast(`${c.name} 已归档 · 不可新开购课单`);
      }
      if (action === 'dissolve-confirm') {
        if (state.online === 'off') return showToast('离线模式下不可提前结课解散');
        const c = classById(el.dataset.id);
        if (!c || c.status !== 'active' || !ownsClass(c)) return;
        if (c.futureTs > 0) return showToast(`该小班仍有 ${c.futureTs} 节未来已排课，请先暂停待排后再归档`);
        if (!dissolveValid(c)) return showToast('请完成解散原因、处置流向与免责确认');
        const d = { ...state.dissolve };
        const released = c.futureTs;
        const remaining = c.futureTs + c.unsettledTs;
        const completed = Number(c.completedTs) || 0;
        const voided = released + (d.disposition === 'PERMANENT_TERMINATE' ? c.unsettledTs : 0);
        const refundTotal = remaining * Number(c.total || 0);
        const perCapita = c.max > 0 ? refundTotal / c.max : 0;
        c.status = 'early_terminated';
        c.futureTs = 0;
        c.pendingTs = 0;
        c.remainingLessons = 0;
        c.voidedTs = voided;
        if (d.disposition === 'PERMANENT_TERMINATE') c.unsettledTs = 0;
        c.termination = {
          reason: d.reason,
          disposition: d.disposition,
          note: d.note.trim(),
          at: TODAY,
          releasedTs: released,
          completedTs: completed,
          voidedTs: voided,
          remainingLessons: remaining,
          refundTotal,
          perCapita,
          screenshots: d.screenshots
        };
        const releasedTeacher = classTeacher(c);
        appendAudit(c, '提前结课解散', `小班 ${c.id} · 原因: ${reasonLabel(d.reason)} · 流向: ${dispositionLabel(d.disposition)} · 已结课 ${completed} 节 · 作废 ${voided} 节 · 未来 ${released} 节已取消释放${releasedTeacher ? ` · 已向原授课老师 ${releasedTeacher.name} 发送排期释放提醒` : ''} · 备注: ${d.note.trim() || '无'}${d.screenshots ? ` · 凭证 ${d.screenshots} 张` : ''}`);
        appendStatus(c, 'active', 'early_terminated', `${reasonLabel(d.reason)} · ${dispositionLabel(d.disposition)}`);
        state.overlay = null;
        state.dissolve = emptyDissolve();
        renderAll();
        const notify = releasedTeacher ? ` · 已向原授课老师 ${releasedTeacher.name} 发送排期释放提醒` : '';
        return showToast(`已提前结课解散 · 未来 ${released} 节已释放${notify}`);
      }
      if (action === 'close-overlay') {
        state.overlay = null;
        state.picker = null;
        state.pickerSearch = '';
        $('overlay').innerHTML = '';
        $('picker').innerHTML = '';
        if (window.lucide) lucide.createIcons();
        return;
      }
    });

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'fClassSearch') { state.search = e.target.value; refreshClassList(); return; }
      if (id === 'fClassName') { state.create.name = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fMax') { state.create.max = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fSalary') { state.create.salary = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fTotal') { state.create.total = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'eName' || id === 'eMax' || id === 'eSalary' || id === 'eTotal') {
        if (!state.edit) return;
        if (id === 'eName') state.edit.name = e.target.value;
        if (id === 'eMax') state.edit.max = e.target.value;
        if (id === 'eSalary') state.edit.salary = e.target.value;
        if (id === 'eTotal') state.edit.total = e.target.value;
        state.edit.error = '';
        updateEditLive();
      }
      if (id === 'fDissolveNote') {
        state.dissolve.note = e.target.value;
        const btn = $('dissolveSubmit');
        const c = state.overlay ? classById(state.overlay.classId) : null;
        if (btn && c) btn.disabled = !dissolveValid(c);
      }
      if (id === 'pickerSearch') { state.pickerSearch = e.target.value; refreshPickerRows(); }
    });

    function navTo(tab) {
      if (state.role === 'admin' && tab === 'settings') return setView('classes');
      if (state.role === 'monitor' && tab === 'ops') return setView('classes');
      state.page = 'placeholder';
      state.navTab = tab;
      state.overlay = null;
      renderAll();
    }

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    /* ------------------------------------------------------------------
     * URL 直达弹层（仅用于演示与截图）
     * ------------------------------------------------------------------ */
    function applyUrlOverlay() {
      const overlay = params.get('overlay');
      if (overlay === 'dissolve') {
        const c = classById(state.activeClassId);
        if (c && c.status === 'active') {
          state.dissolve = {
            reason: params.get('reason') || '',
            disposition: params.get('disposition') || '',
            note: params.get('note') || '',
            screenshots: Math.min(3, Math.max(0, Number(params.get('screenshots') || 0))),
            confirmed: params.get('confirmed') === '1'
          };
          state.overlay = { type: 'dissolve', classId: c.id };
        }
      }
      if (overlay === 'appoint') {
        const c = classById(state.activeClassId);
        if (c) {
          state.appoint = { classId: c.id, selected: params.get('teacher') || '' };
          state.overlay = { type: 'appoint', classId: c.id };
        }
      }
      if (overlay === 'blocked') {
        const c = classById(state.activeClassId);
        if (c) state.overlay = { type: 'blocked', classId: c.id };
      }
      if (overlay === 'edit') {
        const c = classById(state.activeClassId);
        if (c) {
          state.edit = emptyEdit(c);
          state.overlay = { type: 'edit', classId: c.id };
        }
      }
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    applyUrlOverlay();
    renderAll();
  </script>
</body>
</html>

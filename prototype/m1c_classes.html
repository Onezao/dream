<!-- 即抛型原型：M1C 统一班级与招生管控。纯前端 Mock，不连接后端，不触碰生产代码。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>原型 · M1C 统一班级与招生管控</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Inter', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800 antialiased">

  <!-- 原型控制台（不属于产品界面） -->
  <header class="sticky top-0 z-[60] border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-5 gap-y-2 px-4 py-2.5 text-xs">
      <div class="flex items-center gap-2">
        <span class="grid h-6 w-6 place-items-center rounded-lg bg-slate-900 text-[12px] font-bold text-amber-400">1C</span>
        <span class="text-[14px] font-bold text-slate-900">统一班级与招生管控</span>
        <span class="hidden text-[12px] font-medium text-slate-400 lg:inline">最新 PRD · 底栏 ≤ 4 Tab</span>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">角色</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="role" data-value="monitor" class="ctl rounded-lg px-3 py-1.5 font-semibold">班长</button>
          <button data-group="role" data-value="parent" class="ctl rounded-lg px-3 py-1.5 font-semibold">家长</button>
          <button data-group="role" data-value="admin" class="ctl rounded-lg px-3 py-1.5 font-semibold">管理员</button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">页面</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="page" data-value="classes" class="ctl rounded-lg px-3 py-1.5 font-semibold">小班列表</button>
          <button data-group="page" data-value="classDetail" class="ctl rounded-lg px-3 py-1.5 font-semibold">班级详情</button>
          <button data-group="page" data-value="create" class="ctl rounded-lg px-3 py-1.5 font-semibold">创建小班</button>
          <button data-group="page" data-value="hall" class="ctl rounded-lg px-3 py-1.5 font-semibold">选班大厅</button>
          <button data-group="page" data-value="hallDetail" class="ctl rounded-lg px-3 py-1.5 font-semibold">选班详情</button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">设备</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="device" data-value="mobile" class="ctl rounded-lg px-3 py-1.5 font-semibold">手机</button>
          <button data-group="device" data-value="tablet" class="ctl rounded-lg px-3 py-1.5 font-semibold">平板</button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">网络</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="online" data-value="on" class="ctl rounded-lg px-3 py-1.5 font-semibold">在线</button>
          <button data-group="online" data-value="off" class="ctl rounded-lg px-3 py-1.5 font-semibold">离线</button>
        </div>
      </div>

      <button id="btnResetDemo" class="rounded-lg border border-slate-200 px-3 py-1.5 font-semibold text-slate-500 hover:bg-slate-50">重置演示</button>

      <a href="../docs/prd/m1c_classes.md" target="_blank" rel="noopener" class="ml-auto hidden items-center gap-1.5 rounded-lg border border-slate-200 px-2.5 py-1.5 font-semibold text-slate-500 hover:bg-slate-50 lg:inline-flex">
        <i data-lucide="file-text" class="h-3.5 w-3.5"></i>M1C PRD
      </a>
    </div>
  </header>

  <main class="flex justify-center px-4 py-6">
    <div id="frame" class="relative flex h-[812px] w-[390px] shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300">
      <div id="topbar" class="shrink-0"></div>
      <div id="offlineBanner" class="hidden">
        <i data-lucide="wifi-off" class="h-4 w-4 shrink-0 text-amber-600"></i>
        离线模式：可浏览缓存班级，创建、报名、开班与取消不可用
      </div>
      <div id="content" class="flex-1 overflow-y-auto"></div>
      <nav id="bottomnav" class="shrink-0"></nav>
      <div id="overlay"></div>
      <div id="toast" class="pointer-events-none absolute bottom-24 left-1/2 z-[80] hidden -translate-x-1/2 whitespace-nowrap rounded-full bg-slate-900/90 px-4 py-2 text-[12px] font-semibold text-white shadow-xl"></div>
    </div>
  </main>

  <!-- Tailwind CDN 动态类安全垫 -->
  <div class="hidden">
    <span class="h-[812px] w-[390px] h-[860px] w-[768px] max-h-[90%] max-h-[85%] max-w-[560px]"></span>
    <span class="grid grid-cols-1 grid-cols-2 grid-cols-3 w-0 w-1/4 w-1/3 w-1/2 w-2/3 w-3/4 w-full"></span>
    <span class="bg-indigo-600 bg-indigo-50 text-indigo-700 border-indigo-100 text-indigo-950"></span>
    <span class="bg-emerald-50 text-emerald-600 text-emerald-700 border-emerald-200"></span>
    <span class="bg-amber-50 text-amber-600 text-amber-800 text-amber-900 border-amber-200 bg-amber-500"></span>
    <span class="bg-rose-50 text-rose-600 text-rose-700 border-rose-200 bg-rose-400 bg-rose-600 border-rose-300"></span>
    <span class="bg-slate-100 text-slate-500 border-slate-200 text-slate-300 bg-slate-400 bg-slate-900/40 backdrop-blur-[1px]"></span>
  </div>

  <script>
    /* ------------------------------------------------------------------
     * 常量与演示数据
     * ------------------------------------------------------------------ */
    const TODAY = '2026-11-08';
    const COURSE_TYPES = ['少儿英语', '生活口语', '旅游口语', '自然拼读', 'KET', 'PET', '雅思', '托福'];
    const TEACHERS = [
      { id: 'tc_david', name: 'David Miller', level: 'Senior' },
      { id: 'tc_sarah', name: 'Sarah Jenkins', level: 'Standard' },
      { id: 'tc_chris', name: 'Chris Wang', level: 'Junior' }
    ];
    const PARENT_CHILDREN = [
      { name: 'AliceZ12', age: 12 },
      { name: 'BobZ10', age: 10 }
    ];

    const INITIAL_CLASSES = [
      {
        id: 'cls_ket0000001', name: 'KET 冲刺精讲小班 (4人班)', courseType: 'KET',
        teacherId: 'tc_david', teacherName: 'David Miller', monitorName: 'Leo',
        min: 2, max: 4, enrolled: ['AliceZ12', 'BobZ10'], status: 'recruiting',
        plannedStartDate: '2026-11-20', salaryPoints: 30, commissionRate: 10, isOneToOne: false
      },
      {
        id: 'cls_phonics002', name: '自然拼读发音启蒙班 (3人班)', courseType: '自然拼读',
        teacherId: 'tc_sarah', teacherName: 'Sarah Jenkins', monitorName: 'Leo',
        min: 2, max: 3, enrolled: ['CharlieC09'], status: 'recruiting',
        plannedStartDate: TODAY, salaryPoints: 25, commissionRate: 8, isOneToOne: false
      },
      {
        id: 'cls_cambridge03', name: '剑桥少儿英语进阶班 (3人班)', courseType: '少儿英语',
        teacherId: 'tc_david', teacherName: 'David Miller', monitorName: 'Leo',
        min: 2, max: 3, enrolled: ['DavidW11', 'EmmaZ10', 'FrankL12'], status: 'recruiting',
        plannedStartDate: '2026-11-25', salaryPoints: 30, commissionRate: 10, isOneToOne: false
      },
      {
        id: 'cls_pet_cancelled04', name: 'PET 考前冲刺小班 (2人班)', courseType: 'PET',
        teacherId: 'tc_sarah', teacherName: 'Sarah Jenkins', monitorName: 'Leo',
        min: 2, max: 2, enrolled: ['GraceZ11'], status: 'cancelled',
        plannedStartDate: '2026-11-05', salaryPoints: 28, commissionRate: 10,
        cancelledReason: '未达最低成班人数', cancelledAt: '2026-11-05', isOneToOne: false
      },
      {
        id: 'cls_ielts00005', name: '雅思口语 2 人小班', courseType: '雅思',
        teacherId: 'tc_sarah', teacherName: 'Sarah Jenkins', monitorName: 'Amy',
        min: 2, max: 2, enrolled: ['GraceZ11'], status: 'recruiting',
        plannedStartDate: '2026-11-22', salaryPoints: 35, commissionRate: 12, isOneToOne: false
      },
      {
        id: 'cls_1v1_silent01', name: '1v1 个人专属排班（后台静默实体）', courseType: '少儿英语',
        teacherId: 'tc_david', teacherName: 'David Miller', monitorName: 'Leo',
        min: 1, max: 1, enrolled: ['AliceZ12'], status: 'active',
        plannedStartDate: '2026-11-01', salaryPoints: 20, commissionRate: 0, isOneToOne: true
      }
    ];

    const MONITOR_NAV = [
      { id: 'home', icon: 'home', label: '首页', desc: '多孩时间流与金刚位属于 M0 工作台主页。', href: 'm0_workspace_home.html?role=monitor' },
      { id: 'schedule', icon: 'calendar-days', label: '学生课表', desc: '7 色课表与多孩锚点属于 M3A 排课模块。', href: 'm3a_calendar_schedule.html' },
      { id: 'ops', icon: 'layout-grid', label: '教务中心', desc: '我负责的小班课与招生管控', href: null },
      { id: 'me', icon: 'user', label: '我的', desc: '班长周转账与家庭多孩档案属于 M0 个人中心。', href: 'm0_workspace_home.html?role=monitor&view=me' }
    ];

    const PARENT_NAV = [
      { id: 'home', icon: 'home', label: '首页', desc: '多孩时间流与金刚位属于 M0 工作台主页。', href: 'm0_workspace_home.html?role=user' },
      { id: 'schedule', icon: 'calendar-days', label: '学生课表', desc: '7 色课表与多孩锚点属于 M3A 排课模块。', href: 'm3a_calendar_schedule.html' },
      { id: 'hall', icon: 'plus-circle', label: '约课大厅', desc: '小班课选班与 1v1 自由约课', href: null },
      { id: 'me', icon: 'user', label: '我的', desc: '多孩档案与购课账单属于 M1A / M0。', href: 'm1a_student_profile.html' }
    ];

    const ADMIN_NAV = [
      { id: 'home', icon: 'home', label: '首页', desc: '平台结算待办与运营大盘属于 M0 工作台主页。', href: 'm0_workspace_home.html?role=admin' },
      { id: 'schedule', icon: 'calendar-days', label: '学生课表', desc: '自家孩子课表属于 M3A 排课模块。', href: 'm3a_calendar_schedule.html' },
      { id: 'ops', icon: 'layout-grid', label: '教务调度', desc: '全局排班看板与调度入口属于 M0 / M3A。', href: 'm0_workspace_home.html?role=admin&view=ops' },
      { id: 'settings', icon: 'settings', label: '管理与设置', desc: '小班课全域配置与平台管理', href: null }
    ];

    /* ------------------------------------------------------------------
     * 状态
     * ------------------------------------------------------------------ */
    function emptyCreate() {
      return {
        name: '', courseType: 'KET', teacherId: 'tc_david',
        min: 2, max: 4, salary: '30', commission: '10.00', monitorName: 'Leo',
        startDate: '2026-11-20', error: ''
      };
    }

    const state = {
      role: 'monitor',
      page: 'classes', // classes | classDetail | hall | hallDetail | placeholder
      navTab: 'ops',
      device: 'mobile',
      online: 'on',
      classes: JSON.parse(JSON.stringify(INITIAL_CLASSES)),
      activeClassId: 'cls_ket0000001',
      parentChild: 'AliceZ12',
      classFilter: 'all', // all | recruiting | full | cancelled
      overlay: null, // create | force | cancel
      create: emptyCreate(),
      cancelReason: '',
      cancelError: ''
    };

    /* ------------------------------------------------------------------
     * 工具
     * ------------------------------------------------------------------ */
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function currentNav() {
      if (state.role === 'parent') return PARENT_NAV;
      if (state.role === 'admin') return ADMIN_NAV;
      return MONITOR_NAV;
    }

    function classById(id) {
      return state.classes.find((c) => c.id === id) || null;
    }

    function allSmallClasses() {
      return state.classes.filter((c) => !c.isOneToOne);
    }

    function myClasses() {
      return allSmallClasses().filter((c) => c.monitorName === 'Leo');
    }

    function scopedSmallClasses() {
      return state.role === 'admin' ? allSmallClasses() : myClasses();
    }

    function teacherById(id) {
      return TEACHERS.find((t) => t.id === id) || null;
    }

    function count(c) {
      return c.enrolled.length;
    }

    function isFull(c) {
      return count(c) >= c.max;
    }

    function isBelowMin(c) {
      return count(c) < c.min;
    }

    function isStartReached(c) {
      return c.plannedStartDate <= TODAY;
    }

    function canForceStart(c) {
      return c.status === 'recruiting' && isBelowMin(c) && isStartReached(c);
    }

    function canCancel(c) {
      return c.status === 'recruiting';
    }

    function isChildEnrolled(c, child) {
      return c.enrolled.includes(child);
    }

    function progressPct(c) {
      return Math.min(100, Math.round((count(c) / c.max) * 100));
    }

    function progressWidth(c) {
      const p = progressPct(c);
      if (p <= 0) return 'w-0';
      if (p <= 25) return 'w-1/4';
      if (p <= 33) return 'w-1/3';
      if (p <= 50) return 'w-1/2';
      if (p <= 66) return 'w-2/3';
      if (p <= 75) return 'w-3/4';
      return 'w-full';
    }

    function progressTone(c) {
      if (c.status === 'cancelled') return 'bg-rose-400';
      if (isFull(c)) return 'bg-slate-400';
      if (isBelowMin(c) && isStartReached(c)) return 'bg-amber-500';
      return 'bg-indigo-600';
    }

    function chip(label, tone) {
      const tones = {
        indigo: 'border-indigo-200 bg-indigo-50 text-indigo-700',
        emerald: 'border-emerald-200 bg-emerald-50 text-emerald-700',
        amber: 'border-amber-200 bg-amber-50 text-amber-800',
        rose: 'border-rose-200 bg-rose-50 text-rose-700',
        slate: 'border-slate-200 bg-slate-100 text-slate-600'
      };
      return `<span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${tones[tone]}">${esc(label)}</span>`;
    }

    function statusChip(c, role = 'monitor') {
      if (c.status === 'cancelled') return chip(role === 'parent' ? '招生取消' : '已取消', 'rose');
      if (c.status === 'active') return chip(c.isOneToOne && role === 'monitor' ? '履约中' : '已正式开课', 'emerald');
      if (isFull(c)) return chip(role === 'parent' ? '已满员封顶' : `已满员 (${count(c)}/${c.max})`, 'slate');
      if (isBelowMin(c) && isStartReached(c)) {
        return chip(role === 'parent' ? '待确认开班' : `待决策 (${count(c)}/${c.max})`, 'amber');
      }
      return chip(role === 'parent' ? `招募中 (余 ${c.max - count(c)} 位)` : `招募中 (${count(c)}/${c.max})`, 'indigo');
    }

    function studentChip(name) {
      return `<span class="inline-flex items-center gap-1 rounded-md bg-slate-100 px-1.5 py-0.5 text-[12px] font-medium text-slate-600"><span class="grid h-3.5 w-3.5 place-items-center rounded-full bg-white text-[12px] font-bold text-indigo-700 ring-1 ring-slate-200">${esc(name.charAt(0).toUpperCase())}</span>${esc(name)}</span>`;
    }

    function parentChild() {
      return PARENT_CHILDREN.find((c) => c.name === state.parentChild) || PARENT_CHILDREN[0];
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'page') setPage(value);
        if (group === 'device') {
          state.device = value;
          renderAll();
        }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：可浏览缓存，创建/报名/开班/取消不可用');
        }
      });
    });

    document.getElementById('btnResetDemo').addEventListener('click', resetDemo);

    function setRole(role) {
      state.role = role;
      state.page = role === 'parent' ? 'hall' : 'classes';
      state.navTab = role === 'parent' ? 'hall' : role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
    }

    function setPage(page) {
      if (page === 'classes') {
        if (state.role !== 'admin') state.role = 'monitor';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.page = 'classes';
      }
      if (page === 'classDetail') {
        if (state.role !== 'admin') state.role = 'monitor';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        const list = scopedSmallClasses();
        const current = classById(state.activeClassId);
        if (!current || current.isOneToOne || (state.role !== 'admin' && current.monitorName !== 'Leo')) {
          state.activeClassId = list[0] ? list[0].id : '';
        }
        state.page = 'classDetail';
      }
      if (page === 'create') {
        openCreateSheet();
        return;
      }
      if (page === 'hall') {
        state.role = 'parent';
        state.navTab = 'hall';
        state.page = 'hall';
      }
      if (page === 'hallDetail') {
        state.role = 'parent';
        state.navTab = 'hall';
        const list = allSmallClasses();
        const current = classById(state.activeClassId);
        if (!current || current.isOneToOne) {
          state.activeClassId = list[0] ? list[0].id : '';
        }
        state.page = 'hallDetail';
      }
      state.overlay = null;
      renderAll();
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        let active = state[group] === b.dataset.value;
        if (group === 'page' && b.dataset.value === 'create') {
          active = state.overlay && state.overlay.type === 'create';
        }
        let disabled = false;
        if (group === 'page') {
          const parentPage = b.dataset.value === 'hall' || b.dataset.value === 'hallDetail';
          disabled = (state.role !== 'parent' && parentPage) || (state.role === 'parent' && !parentPage);
        }
        b.disabled = disabled;
        b.className = `ctl rounded-lg px-3 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}${disabled ? ' cursor-not-allowed opacity-40' : ''}`;
      });
    }

    function resetDemo() {
      state.classes = clone(INITIAL_CLASSES);
      state.activeClassId = 'cls_ket0000001';
      state.role = 'monitor';
      state.page = 'classes';
      state.navTab = 'ops';
      state.parentChild = 'AliceZ12';
      state.classFilter = 'all';
      state.overlay = null;
      state.create = emptyCreate();
      state.cancelReason = '';
      state.cancelError = '';
      state.online = 'on';
      renderAll();
      showToast('演示数据已重置');
    }

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = document.getElementById('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      document.getElementById('topbar').innerHTML = renderTopbar();

      const banner = document.getElementById('offlineBanner');
      banner.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2.5 text-[14px] font-semibold text-amber-900'
        : 'hidden';

      document.getElementById('content').innerHTML = renderContent();
      document.getElementById('bottomnav').innerHTML = renderNav();
      renderOverlay();
      syncConsole();
      lucide.createIcons();
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.role === 'parent') {
        if (state.page === 'hallDetail') {
          const c = classById(state.activeClassId);
          if (!c || c.isOneToOne) return renderHall();
          return renderParentDetail();
        }
        return renderHall();
      }
      if (state.page === 'classDetail') {
        const c = classById(state.activeClassId);
        if (!c || (state.role === 'monitor' && c.monitorName !== 'Leo')) return renderClasses();
        return renderMonitorDetail();
      }
      return renderClasses();
    }

    function renderTopbar() {
      if (state.page === 'placeholder') {
        const item = currentNav().find((n) => n.id === state.navTab);
        return topbarBase(item ? item.label : '页面', '其他模块原型', '', false, false);
      }
      if (state.page === 'classDetail') return topbarSub('班级详情');
      if (state.page === 'hallDetail') return topbarSub('课程详情');
      if (state.role === 'parent') return topbarBase('Dream 教务', '家长工作台 · Amy', 'A', true, false);
      if (state.role === 'admin') return topbarBase('Dream 运营中枢', '平台管理员 · Sarah', 'S', true, true);
      return topbarBase('Dream 教务', '班长工作台 · Leo', 'L', true, true);
    }

    function topbarBase(title, subtitle, initial, showAvatar, dark) {
      return `
        <div class="border-b border-slate-200 bg-white/95">
          <div class="flex h-14 items-center justify-between px-4">
            <div class="flex min-w-0 items-center gap-2.5">
              <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-indigo-600 text-[14px] font-bold text-white shadow-sm">D</div>
              <div class="min-w-0">
                <div class="truncate text-[16px] font-bold leading-tight text-slate-900">${esc(title)}</div>
                <div class="truncate text-[12px] font-medium text-slate-400">${esc(subtitle)}</div>
              </div>
            </div>
            <div class="flex shrink-0 items-center gap-2">
              <button data-action="toast" data-message="暂无新消息" class="relative grid h-9 w-9 place-items-center rounded-xl bg-slate-100 text-slate-600" aria-label="通知">
                ${icon('bell', 'h-[18px] w-[18px]')}
                <span class="absolute right-2 top-2 h-1.5 w-1.5 rounded-full bg-rose-500 ring-2 ring-white"></span>
              </button>
              ${showAvatar ? `<div class="grid h-9 w-9 place-items-center rounded-full ${dark ? 'bg-slate-900 text-amber-300' : 'bg-indigo-600 text-white'} text-[14px] font-bold">${esc(initial)}</div>` : ''}
            </div>
          </div>
        </div>`;
    }

    function topbarSub(title) {
      return `
        <div class="border-b border-slate-200 bg-white/95">
          <div class="grid h-14 grid-cols-[44px_1fr_44px] items-center px-2">
            <button data-action="go-back" class="grid h-10 w-10 place-items-center rounded-xl text-slate-600 hover:bg-slate-100" aria-label="返回">
              ${icon('chevron-left', 'h-5 w-5')}
            </button>
            <div class="truncate text-center text-[16px] font-bold text-slate-900">${esc(title)}</div>
            <button data-action="toast" data-message="暂无新消息" class="relative grid h-10 w-10 place-items-center rounded-xl text-slate-600 hover:bg-slate-100" aria-label="通知">
              ${icon('bell', 'h-[18px] w-[18px]')}
              <span class="absolute right-2.5 top-2.5 h-1.5 w-1.5 rounded-full bg-rose-500 ring-2 ring-white"></span>
            </button>
          </div>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 底部导航（所有整页常驻）
     * ------------------------------------------------------------------ */
    function renderNav() {
      return `
        <div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
          <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
            ${currentNav().map((item) => {
              const on = state.navTab === item.id;
              return `
                <button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'text-indigo-600' : 'text-slate-400'}">
                  ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
                  <span class="text-[12px] font-bold">${item.label}</span>
                </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function navTo(tab) {
      if (state.role === 'parent') {
        if (tab === 'hall') {
          state.page = 'hall';
          state.navTab = 'hall';
        } else {
          state.page = 'placeholder';
          state.navTab = tab;
        }
      } else if (state.role === 'admin') {
        if (tab === 'settings') {
          state.page = 'classes';
          state.navTab = 'settings';
        } else {
          state.page = 'placeholder';
          state.navTab = tab;
        }
      } else {
        if (tab === 'ops') {
          state.page = 'classes';
          state.navTab = 'ops';
        } else {
          state.page = 'placeholder';
          state.navTab = tab;
        }
      }
      state.overlay = null;
      renderAll();
    }

    function renderPlaceholder() {
      const item = currentNav().find((n) => n.id === state.navTab);
      if (!item) return '<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>';
      return `
        <div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
          <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">
            ${icon(item.icon, 'h-6 w-6')}
          </div>
          <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
          <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
          ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">打开对应原型</a>` : ''}
          <button data-action="nav" data-tab="${state.role === 'parent' ? 'hall' : state.role === 'admin' ? 'settings' : 'ops'}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回${state.role === 'parent' ? '选班大厅' : '小班列表'}</button>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 班长 · 小班课列表
     * ------------------------------------------------------------------ */
    function filteredSmallClasses() {
      const list = scopedSmallClasses();
      if (state.classFilter === 'recruiting') return list.filter((c) => c.status === 'recruiting' && !isFull(c));
      if (state.classFilter === 'full') return list.filter((c) => c.status === 'recruiting' && isFull(c));
      if (state.classFilter === 'cancelled') return list.filter((c) => c.status === 'cancelled');
      return list;
    }

    function renderClasses() {
      const isAdmin = state.role === 'admin';
      const all = scopedSmallClasses();
      const recruiting = all.filter((c) => c.status === 'recruiting' && !isFull(c));
      const full = all.filter((c) => c.status === 'recruiting' && isFull(c));
      const pending = all.filter(canForceStart);
      const cancelled = all.filter((c) => c.status === 'cancelled');
      const list = filteredSmallClasses();
      const one = state.classes.find((c) => c.isOneToOne);
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-3' : 'space-y-3';
      const offline = state.online === 'off';

      return `
        <div class="mx-auto w-full max-w-[720px] space-y-4 px-4 pb-6 pt-4">
          <div class="flex items-end justify-between gap-3 px-1">
            <div class="min-w-0">
              <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${isAdmin ? '小班课配置' : '我的小班课'}</h1>
              <p class="mt-1 text-[14px] font-medium text-slate-500">${isAdmin ? `全平台 · ${all.length} 个小班 · 抽佣合规` : `Leo · 自负盈亏 · 当前 ${all.length} 个小班`}</p>
            </div>
            <button data-action="open-create" ${offline ? 'disabled' : ''} class="h-9 shrink-0 rounded-xl bg-indigo-600 px-3.5 text-[14px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">+ 创建小班</button>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 shadow-sm">
              <div class="text-[12px] font-medium text-slate-400">在招小班</div>
              <div class="mt-0.5 text-[18px] font-bold text-slate-900">${recruiting.length}</div>
            </div>
            <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 shadow-sm">
              <div class="text-[12px] font-medium text-slate-400">待决策</div>
              <div class="mt-0.5 text-[18px] font-bold ${pending.length ? 'text-amber-700' : 'text-slate-900'}">${pending.length}</div>
            </div>
            <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 shadow-sm">
              <div class="text-[12px] font-medium text-slate-400">已满员</div>
              <div class="mt-0.5 text-[18px] font-bold text-slate-900">${full.length}</div>
            </div>
          </div>

          <div class="flex rounded-xl bg-slate-100 p-1">
            ${[
              ['all', '全部', all.length],
              ['recruiting', '招募中', recruiting.length],
              ['full', '已满员', full.length],
              ['cancelled', '已取消', cancelled.length]
            ].map(([id, label, n]) => `
              <button data-action="set-filter" data-filter="${id}" class="h-9 flex-1 rounded-lg text-[12px] font-bold transition ${state.classFilter === id ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">${label} ${n}</button>
            `).join('')}
          </div>

          ${list.length ? `
            <div class="${grid}">
              ${list.map(renderMonitorCard).join('')}
            </div>` : `
            <div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center">
              <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-slate-50 text-slate-300">${icon('layout-grid', 'h-5 w-5')}</div>
              <p class="mt-3 text-[14px] font-medium text-slate-400">暂无符合条件的小班课</p>
            </div>`}

          ${state.classFilter === 'all' && one ? `
            <section class="space-y-2">
              <div class="flex items-center justify-between px-1">
                <h2 class="text-[16px] font-bold text-slate-900">1v1 静默实体</h2>
                <span class="text-[12px] font-medium text-slate-400">后台自动建班</span>
              </div>
              ${renderOneToOneCard(one)}
            </section>` : ''}

          <button data-action="open-create" ${offline ? 'disabled' : ''} class="flex w-full items-center justify-center gap-2 rounded-2xl border border-dashed border-slate-300 bg-white/70 py-4 text-[14px] font-semibold transition ${offline ? 'cursor-not-allowed text-slate-400' : 'text-indigo-700 hover:border-indigo-300 hover:bg-indigo-50/40'}">
            ${icon('plus', 'h-4 w-4')}创建新小班
          </button>

          <div class="flex items-start gap-2.5 rounded-xl border border-indigo-100 bg-indigo-50/60 px-3.5 py-3">
            <span class="mt-0.5 shrink-0 text-indigo-600">${icon('shield-check', 'h-4 w-4')}</span>
            <p class="text-[12px] font-medium leading-relaxed text-indigo-900">${isAdmin ? '仅管理员可见全平台小班课。满员由系统自动截流，未达 Min 时由负责班长在开课日决策强制开班或取消。' : '仅展示负责班长 Leo 的小班课。满员由系统自动截流，未达 Min 时需在开课日人工决策强制开班或取消。'}</p>
          </div>
        </div>`;
    }

    function renderMonitorCard(c) {
      const cnt = count(c);
      const below = isBelowMin(c);
      const start = isStartReached(c);
      const full = isFull(c);
      const warning = c.status === 'recruiting' && below && start;
      const chips = c.enrolled.slice(0, 4).map(studentChip).join('');
      const more = c.enrolled.length > 4 ? `<span class="px-1 text-[12px] font-medium text-slate-400">+${c.enrolled.length - 4}</span>` : '';

      return `
        <div data-action="open-class" data-id="${c.id}" role="button" tabindex="0" class="cursor-pointer rounded-2xl border ${warning ? 'border-amber-300 ring-1 ring-amber-100' : 'border-slate-200'} bg-white p-4 shadow-sm transition hover:border-indigo-200">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <h3 class="truncate text-[16px] font-bold text-slate-900">${esc(c.name)}</h3>
              <div class="mt-1 truncate text-[14px] font-medium text-slate-500">外教 ${esc(c.teacherName)} · ${esc(c.courseType)}</div>
            </div>
            ${statusChip(c, 'monitor')}
          </div>

          <div class="mt-2 inline-flex items-center gap-1 rounded-lg bg-slate-100 px-2 py-0.5 text-[12px] font-medium text-slate-600">
            ${icon('lock', 'h-3 w-3 text-slate-400')}负责班长 ${esc(c.monitorName)}${state.role === 'monitor' ? ' (我)' : ''}
          </div>

          <div class="mt-3">
            <div class="flex items-center justify-between text-[12px] font-medium text-slate-500">
              <span>招生 <strong class="text-[14px] text-slate-900">${cnt}/${c.max}</strong> · Min ${c.min} - Max ${c.max}</span>
              <span class="font-mono">${progressPct(c)}%</span>
            </div>
            <div class="mt-1 h-2 overflow-hidden rounded-full bg-slate-100">
              <div class="h-full rounded-full ${progressWidth(c)} ${progressTone(c)}"></div>
            </div>
            <div class="mt-1 flex items-center justify-between text-[12px] font-medium text-slate-400">
              <span>计划开课 ${esc(c.plannedStartDate)}</span>
              <span>${full ? '已满员' : `剩余 ${Math.max(0, c.max - cnt)} 位`}</span>
            </div>
          </div>

          ${warning ? `<div class="mt-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-amber-900">已到计划开课日 ${esc(c.plannedStartDate)}，仍差 ${c.min - cnt} 人成班</div>` : ''}
          ${c.status === 'recruiting' && full ? `<div class="mt-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-[12px] font-medium text-slate-500">已满员自动截流，选班入口已禁用</div>` : ''}

          <div class="mt-3 flex flex-wrap gap-1.5">
            ${c.enrolled.length ? chips + more : '<span class="text-[12px] font-medium text-slate-400">暂未报名</span>'}
          </div>

          <div class="mt-3 flex items-center justify-between gap-2 border-t border-slate-100 pt-3">
            <span class="text-[12px] font-medium text-slate-400">课酬 ${c.salaryPoints}分 · 抽佣 ${c.commissionRate}%</span>
            <div class="flex shrink-0 items-center gap-1.5">
              ${canForceStart(c) ? `<button data-action="open-force" data-id="${c.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 rounded-lg bg-amber-600 px-2.5 text-[12px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">强制开班</button>` : ''}
              ${canCancel(c) ? `<button data-action="open-cancel" data-id="${c.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 rounded-lg border border-rose-200 bg-white px-2.5 text-[12px] font-medium text-rose-600 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-50 disabled:text-slate-300">取消班级</button>` : ''}
              <span class="text-[12px] font-semibold text-indigo-600">查看</span>
            </div>
          </div>
        </div>`;
    }

    function renderOneToOneCard(c) {
      return `
        <div data-action="open-class" data-id="${c.id}" role="button" tabindex="0" class="cursor-pointer rounded-2xl border border-slate-200 bg-slate-50/80 p-4 shadow-sm opacity-90">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <h3 class="text-[16px] font-bold text-slate-800">1v1 个人专属排班</h3>
              <div class="mt-0.5 truncate font-mono text-[12px] font-medium text-slate-400">后台静默实体 · ${esc(c.id)}</div>
            </div>
            ${statusChip(c, 'monitor')}
          </div>
          <div class="mt-2 text-[14px] font-medium text-slate-600">外教 ${esc(c.teacherName)} · 学员 ${esc(c.enrolled[0] || '—')}</div>
          <p class="mt-2 rounded-lg bg-white px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-500">系统在购课或首次排课时自动静默建班，家长端与教师端物理屏蔽“班级”概念。</p>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 班长 · 班级详情
     * ------------------------------------------------------------------ */
    function renderMonitorDetail() {
      const c = classById(state.activeClassId);
      if (!c) return renderClasses();
      if (c.isOneToOne) return renderOneToOneDetail(c);
      const cnt = count(c);
      const below = isBelowMin(c);
      const start = isStartReached(c);
      const full = isFull(c);
      const warning = c.status === 'recruiting' && below && start;
      const toolFee = c.max * 6;

      return `
        <div class="mx-auto w-full max-w-[640px] space-y-4 px-4 pb-6 pt-4">
          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(c.name)}</h1>
                <div class="mt-1 text-[14px] font-medium text-slate-500">外教 ${esc(c.teacherName)} · ${esc(c.courseType)}</div>
              </div>
              ${statusChip(c, 'monitor')}
            </div>
            <div class="mt-2 inline-flex items-center gap-1 rounded-lg bg-slate-100 px-2 py-1 text-[12px] font-medium text-slate-600">
              ${icon('lock', 'h-3 w-3 text-slate-400')}负责班长 ${esc(c.monitorName)}${state.role === 'monitor' ? ' (我)' : ''}
            </div>

            <div class="mt-3">
              <div class="flex items-center justify-between text-[12px] font-medium text-slate-500">
                <span>招生进度 <strong class="text-[14px] text-slate-900">${cnt}/${c.max}</strong> · Min ${c.min} - Max ${c.max}</span>
                <span class="font-mono">${progressPct(c)}%</span>
              </div>
              <div class="mt-1 h-2 overflow-hidden rounded-full bg-slate-100">
                <div class="h-full rounded-full ${progressWidth(c)} ${progressTone(c)}"></div>
              </div>
            </div>

            <div class="mt-3 grid grid-cols-3 divide-x divide-slate-100 rounded-xl bg-slate-50 py-2.5 text-center">
              <div>
                <div class="text-[12px] font-medium text-slate-400">计划开课</div>
                <div class="mt-0.5 text-[14px] font-semibold text-slate-900">${esc(c.plannedStartDate)}</div>
              </div>
              <div>
                <div class="text-[12px] font-medium text-slate-400">人数区间</div>
                <div class="mt-0.5 text-[14px] font-semibold text-slate-900">${c.min}-${c.max} 人</div>
              </div>
              <div>
                <div class="text-[12px] font-medium text-slate-400">剩余名额</div>
                <div class="mt-0.5 text-[14px] font-semibold ${full ? 'text-slate-400' : 'text-slate-900'}">${Math.max(0, c.max - cnt)} 位</div>
              </div>
            </div>
          </section>

          ${warning ? `
            <div class="rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-3">
              <div class="flex items-start gap-2">
                ${icon('alert-triangle', 'h-4 w-4 shrink-0 text-amber-600 mt-0.5')}
                <div class="min-w-0 flex-1">
                  <div class="text-[14px] font-bold text-amber-900">已到计划开课日，仍差 ${c.min - cnt} 人成班</div>
                  <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-amber-800">可强制开班（差额由班长预留款承担），或取消班级并触发课时退回。</p>
                </div>
              </div>
            </div>` : ''}

          ${c.status === 'recruiting' && full ? `
            <div class="rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-[14px] font-medium text-slate-600">已满员，系统已自动封顶截流。</div>` : ''}
          ${c.status === 'active' ? `
            <div class="rounded-xl border border-emerald-200 bg-emerald-50 px-3.5 py-2.5 text-[14px] font-medium text-emerald-800">班级已正式开课${c.forceStartedAt ? ` · 强制开班于 ${esc(c.forceStartedAt)}` : ''}。</div>` : ''}
          ${c.status === 'cancelled' ? `
            <div class="rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-2.5 text-[14px] font-medium text-rose-700">已于 ${esc(c.cancelledAt || '—')} 取消 · 原因：${esc(c.cancelledReason || '—')}。</div>` : ''}

          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <div class="flex items-center justify-between">
              <h2 class="text-[16px] font-bold text-slate-900">已报名学员</h2>
              <span class="text-[12px] font-medium text-slate-400">${cnt}/${c.max}</span>
            </div>
            <div class="mt-3 flex flex-wrap gap-1.5">
              ${c.enrolled.length ? c.enrolled.map(studentChip).join('') : '<span class="text-[14px] font-medium text-slate-400">暂未报名</span>'}
            </div>
          </section>

          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <h2 class="text-[16px] font-bold text-slate-900">财务参数</h2>
            <div class="mt-3 grid grid-cols-3 gap-2">
              <div class="rounded-xl bg-slate-50 px-3 py-2.5">
                <div class="text-[12px] font-medium text-slate-400">教师单节课酬</div>
                <div class="mt-0.5 text-[16px] font-bold text-slate-900">${c.salaryPoints} <span class="text-[12px] font-medium text-slate-400">积分</span></div>
              </div>
              <div class="rounded-xl bg-slate-50 px-3 py-2.5">
                <div class="text-[12px] font-medium text-slate-400">平台抽佣</div>
                <div class="mt-0.5 text-[16px] font-bold text-slate-900">${c.commissionRate}<span class="text-[12px] font-medium text-slate-400">%</span></div>
              </div>
              <div class="rounded-xl bg-slate-50 px-3 py-2.5">
                <div class="text-[12px] font-medium text-slate-400">满员工具费</div>
                <div class="mt-0.5 text-[16px] font-bold text-slate-900">${toolFee} <span class="text-[12px] font-medium text-slate-400">积分</span></div>
              </div>
            </div>
            <p class="mt-2 text-[12px] font-medium text-slate-400">工具费按 Max × 6 积分，由平台周结时自动计算。</p>
          </section>

          <div class="flex gap-2">
            ${canForceStart(c) ? `<button data-action="open-force" data-id="${c.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-1 rounded-xl bg-amber-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">强制开班</button>` : ''}

    function renderOneToOneDetail(c) {

              <div class="min-w-0">
                <h1 class="text-[18px] font-bold tracking-tight text-slate-900">1v1 个人专属排班</h1>

              </div>
              ${statusChip(c, 'monitor')}

            <div class="mt-3 grid grid-cols-2 gap-2">
              <div class="rounded-xl bg-slate-50 px-3 py-2.5">

              <div class="rounded-xl bg-slate-50 px-3 py-2.5">

            <p class="mt-3 rounded-xl bg-slate-50 px-3.5 py-3 text-[12px] font-medium leading-relaxed text-slate-500">系统在购课或首次排课时自动静默建立此 1v1 实体，家长端与教师端全流程物理屏蔽“班级”概念。</p>
          </section>

    /* ------------------------------------------------------------------
     * 家长 · 选班大厅
     * ------------------------------------------------------------------ */
    function childSelector() {
      const child = parentChild();
      return `
        <div class="rounded-2xl border border-slate-200 bg-white p-3.5 shadow-sm">
          <div class="text-[12px] font-medium text-slate-400">当前报名宝贝</div>
          <div class="mt-2 flex gap-2">
            ${PARENT_CHILDREN.map((ch) => {
              const on = ch.name === child.name;
              return `<button data-action="select-child" data-child="${ch.name}" class="flex h-10 flex-1 items-center justify-center gap-1.5 rounded-xl text-[14px] font-semibold ${on ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">
                <span class="grid h-6 w-6 place-items-center rounded-full ${on ? 'bg-white/15 text-white' : 'bg-white text-indigo-700'} text-[12px] font-bold">${esc(ch.name.charAt(0))}</span>
                <span class="truncate">${esc(ch.name)}</span>
                <span class="hidden text-[12px] font-medium sm:inline ${on ? 'text-indigo-100' : 'text-slate-400'}">${ch.age}岁</span>
              </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function renderHall() {
      const smalls = allSmallClasses();
      const one = state.classes.find((c) => c.isOneToOne);
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-3' : 'space-y-3';
      return `
        <div class="mx-auto w-full max-w-[720px] space-y-4 px-4 pb-6 pt-4">
          <div class="px-1">
            <h1 class="text-[18px] font-bold tracking-tight text-slate-900">选班大厅</h1>
            <p class="mt-1 text-[14px] font-medium text-slate-500">小班课满员自动截流 · 1v1 按老师直接约课</p>
          </div>

          ${childSelector()}

          <section class="space-y-2">
            <div class="flex items-center justify-between px-1">
              <h2 class="text-[16px] font-bold text-slate-900">小班课</h2>
              <span class="text-[12px] font-medium text-slate-400">${smalls.length} 个课程</span>
            </div>
            ${smalls.length ? `<div class="${grid}">${smalls.map(renderParentCard).join('')}</div>` : `
              <div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center">
                <p class="text-[14px] font-medium text-slate-400">暂无可选小班课</p>
              </div>`}
          </section>

          ${one ? `
            <section class="space-y-2">
              <div class="flex items-center justify-between px-1">
                <h2 class="text-[16px] font-bold text-slate-900">1v1 自由约课</h2>
                <span class="text-[12px] font-medium text-slate-400">按老师直接约课</span>
              </div>
              ${renderParentOneToOne(one)}
            </section>` : ''}

          <div class="flex items-start gap-2.5 rounded-xl border border-indigo-100 bg-indigo-50/60 px-3.5 py-3">
            <span class="mt-0.5 shrink-0 text-indigo-600">${icon('info', 'h-4 w-4')}</span>
            <p class="text-[12px] font-medium leading-relaxed text-indigo-900">小班课满员后报名入口自动置灰；未达最低人数的开班确认由负责班长处理。</p>
          </div>
        </div>`;
    }

    function renderParentCard(c) {
      const cnt = count(c);
      const full = isFull(c);
      const below = isBelowMin(c);
      const start = isStartReached(c);
      const child = parentChild();
      const enrolled = isChildEnrolled(c, child.name);
      const warning = c.status === 'recruiting' && below && start;

      let action = '';
      if (c.status === 'cancelled') {
        action = '<button disabled class="h-9 rounded-xl bg-slate-100 px-3 text-[12px] font-semibold text-slate-400 cursor-not-allowed">已停止报名</button>';
      } else if (enrolled) {
        action = '<button disabled class="h-9 rounded-xl bg-emerald-50 px-3 text-[12px] font-semibold text-emerald-700 cursor-not-allowed">已报名</button>';
      } else if (c.status === 'active') {
        action = '<button disabled class="h-9 rounded-xl bg-slate-100 px-3 text-[12px] font-semibold text-slate-400 cursor-not-allowed">已开班</button>';
      } else if (full) {
        action = `<button disabled class="flex h-9 items-center gap-1 rounded-xl bg-slate-100 px-3 text-[12px] font-semibold text-slate-400 cursor-not-allowed">${icon('lock', 'h-3.5 w-3.5')}已满员截流</button>`;
      } else {
        action = `<button data-action="enroll" data-id="${c.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-9 rounded-xl bg-indigo-600 px-3 text-[12px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">报名加入</button>`;
      }

      return `
        <div data-action="open-parent-class" data-id="${c.id}" role="button" tabindex="0" class="cursor-pointer rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition hover:border-indigo-200">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <h3 class="truncate text-[16px] font-bold text-slate-900">${esc(c.name)}</h3>
              <div class="mt-1 truncate text-[14px] font-medium text-slate-500">授课外教 ${esc(c.teacherName)} · ${esc(c.courseType)}</div>
              <div class="mt-1 flex items-center gap-1 text-[12px] font-medium text-slate-400">${icon('lock', 'h-3 w-3')}负责班长 ${esc(c.monitorName)}</div>
            </div>
            ${statusChip(c, 'parent')}
          </div>

          <div class="mt-3">
            <div class="flex items-center justify-between text-[12px] font-medium text-slate-500">
              <span>招生进度 <strong class="text-[14px] text-slate-900">${cnt}/${c.max}</strong></span>
              <span>开课日期 ${esc(c.plannedStartDate)}</span>
            </div>
            <div class="mt-1 h-2 overflow-hidden rounded-full bg-slate-100">
              <div class="h-full rounded-full ${progressWidth(c)} ${progressTone(c)}"></div>
            </div>
          </div>

          ${warning ? `<div class="mt-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-medium text-amber-900">开课日已到，待班长确认是否开班</div>` : ''}
          ${c.status === 'cancelled' && c.cancelledReason ? `<div class="mt-2 rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-[12px] font-medium text-rose-700">取消原因：${esc(c.cancelledReason)}</div>` : ''}

          <div class="mt-3 flex items-center justify-between gap-2 border-t border-slate-100 pt-3">
            <span class="text-[12px] font-medium text-slate-400">小班固定 1 小时</span>
            <div class="flex items-center gap-2">
              ${action}
              <span class="text-[12px] font-semibold text-indigo-600">详情</span>
            </div>
          </div>
        </div>`;
    }

    function renderParentOneToOne(c) {
      const child = parentChild();
      return `
        <div class="rounded-2xl border border-indigo-100 bg-indigo-50/60 p-4">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <h3 class="text-[16px] font-bold text-slate-900">${esc(c.teacherName)} · ${esc(c.courseType)}</h3>
              <div class="mt-0.5 text-[12px] font-medium text-slate-500">意向授课老师 + 课程类型</div>
            </div>
            <span class="shrink-0 rounded-full border border-indigo-100 bg-white px-2 py-0.5 text-[12px] font-bold text-indigo-700">1v1 专属</span>

          <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-600">无需等待成班，按老师空闲时段直接约课。</p>
          <button data-action="toast" data-message="已为 ${esc(child.name)} 打开 ${esc(c.teacherName)} 的 1v1 排课（原型模拟）" class="mt-3 h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white">为 ${esc(child.name)} 立即约课</button>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 选班详情
     * ------------------------------------------------------------------ */
    function renderParentDetail() {
      const c = classById(state.activeClassId);
      if (!c || c.isOneToOne) return renderHall();
      const cnt = count(c);
      const full = isFull(c);
      const below = isBelowMin(c);
      const start = isStartReached(c);
      const child = parentChild();
      const enrolled = isChildEnrolled(c, child.name);
      const warning = c.status === 'recruiting' && below && start;

      let action = '';
      if (c.status === 'cancelled') {
        action = '<button disabled class="h-11 w-full rounded-xl bg-slate-100 text-[16px] font-semibold text-slate-400 cursor-not-allowed">已停止报名</button>';
      } else if (enrolled) {
        action = `<button disabled class="h-11 w-full rounded-xl bg-emerald-50 text-[16px] font-semibold text-emerald-700 cursor-not-allowed">已报名 · ${c.status === 'active' ? '已开班' : '等待开班'}</button>`;
      } else if (c.status === 'active') {
        action = '<button disabled class="h-11 w-full rounded-xl bg-slate-100 text-[16px] font-semibold text-slate-400 cursor-not-allowed">已正式开班</button>';
      } else if (full) {
        action = `<button disabled class="flex h-11 w-full items-center justify-center gap-1.5 rounded-xl bg-slate-100 text-[16px] font-semibold text-slate-400 cursor-not-allowed">${icon('lock', 'h-4 w-4')}已满员截流</button>`;
      } else {
        action = `<button data-action="enroll" data-id="${c.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">为 ${esc(child.name)} 报名加入</button>`;
      }

      return `
        <div class="mx-auto w-full max-w-[640px] space-y-4 px-4 pb-6 pt-4">
          ${childSelector()}
          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(c.name)}</h1>
                <div class="mt-1 text-[14px] font-medium text-slate-500">${esc(c.courseType)} · 负责班长 ${esc(c.monitorName)}</div>
              </div>
              ${statusChip(c, 'parent')}
            </div>
            <div class="mt-3 grid grid-cols-2 gap-2">
              <div class="rounded-xl bg-slate-50 px-3 py-2.5">
                <div class="text-[12px] font-medium text-slate-400">授课外教</div>
                <div class="mt-0.5 text-[14px] font-semibold text-slate-900">${esc(c.teacherName)}</div>
              </div>
              <div class="rounded-xl bg-slate-50 px-3 py-2.5">
                <div class="text-[12px] font-medium text-slate-400">开课日期</div>
                <div class="mt-0.5 text-[14px] font-semibold text-slate-900">${esc(c.plannedStartDate)}</div>
              </div>
              <div class="rounded-xl bg-slate-50 px-3 py-2.5">
                <div class="text-[12px] font-medium text-slate-400">招生进度</div>
                <div class="mt-0.5 text-[14px] font-semibold text-slate-900">${cnt}/${c.max} 人</div>
              </div>
              <div class="rounded-xl bg-slate-50 px-3 py-2.5">
                <div class="text-[12px] font-medium text-slate-400">剩余名额</div>
                <div class="mt-0.5 text-[14px] font-semibold ${full ? 'text-slate-400' : 'text-slate-900'}">${Math.max(0, c.max - cnt)} 位</div>
              </div>
            </div>
            <div class="mt-3 h-2 overflow-hidden rounded-full bg-slate-100">
              <div class="h-full rounded-full ${progressWidth(c)} ${progressTone(c)}"></div>
            </div>
            <p class="mt-2 text-[12px] font-medium text-slate-400">小班课固定 1 小时（连续 2 个 30 分钟网格），满员后系统自动截流。</p>
          </section>

          ${warning ? `
            <div class="rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-3 text-[14px] font-medium leading-relaxed text-amber-900">开课日已到，当前未达最低成班人数，等待负责班长确认是否开班。</div>` : ''}
          ${c.status === 'cancelled' ? `
            <div class="rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-3 text-[14px] font-medium leading-relaxed text-rose-700">该小班课已取消 · 原因：${esc(c.cancelledReason || '—')}。课时退回由 M2B 承接。</div>` : ''}

          ${action}

          <div class="rounded-xl border border-slate-200 bg-white px-3.5 py-3 text-[12px] font-medium leading-relaxed text-slate-500">
            报名成功后请等待开班确认；未达最低人数时由负责班长决定强制开班或取消并退回课时。
          </div>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 创建小班底部抽屉
     * ------------------------------------------------------------------ */
    function renderCreateSheet() {
      const f = state.create;
      const inputCls = 'h-12 w-full rounded-xl border border-slate-200 bg-white px-3.5 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100';
      return `
        <div class="absolute inset-0 z-50">

                  <input id="createName" value="${esc(f.name)}" maxlength="50" placeholder="如：KET 强化精讲 4 人小班" class="${inputCls}">
                </div>

                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label for="createCourse" class="mb-1.5 block text-[16px] font-semibold text-slate-800">课程类型 <span class="text-rose-500">*</span></label>
                    <select id="createCourse" class="${inputCls} bg-white font-medium">
                      ${COURSE_TYPES.map((t) => `<option value="${esc(t)}" ${f.courseType === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label for="createTeacher" class="mb-1.5 block text-[16px] font-semibold text-slate-800">授课外教 <span class="text-rose-500">*</span></label>
                    <select id="createTeacher" class="${inputCls} bg-white font-medium">

                    </select>

                <div>
                  <label for="${state.role === 'admin' ? 'createMonitor' : 'createMonitorLocked'}" class="mb-1.5 block text-[16px] font-semibold text-slate-800">负责班长 <span class="text-rose-500">*</span></label>

                    <div class="relative">
                      <input id="createCommission" type="number" min="0" max="100" step="0.01" value="${esc(f.commission)}" class="${inputCls} pr-8">
                      <span class="absolute right-3 top-1/2 -translate-y-1/2 text-[12px] font-medium text-slate-400">%</span>
                    </div>
                  </div>
                </div>

                <div>
                  <label for="createStart" class="mb-1.5 block text-[16px] font-semibold text-slate-800">计划开班日期 <span class="text-rose-500">*</span></label>
                  <input id="createStart" type="date" value="${esc(f.startDate)}" class="${inputCls} bg-white">
                </div>

                ${f.error ? `<div id="createError" class="rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-2.5 text-[14px] font-medium leading-relaxed text-rose-700">${esc(f.error)}</div>` : ''}
              </div>
            </div>

            <div class="flex shrink-0 gap-2 border-t border-slate-100 pt-3">
              <button data-action="close-overlay" class="h-12 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">取消</button>
              <button data-action="submit-create" ${state.online === 'off' ? 'disabled' : ''} class="h-12 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认发布班级</button>
            </div>
          </div>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 开班/取消确认弹层
     * ------------------------------------------------------------------ */
    function modalShell(content) {
      return `
        <div class="absolute inset-0 z-50">
          <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
          <div class="absolute inset-x-4 top-1/2 mx-auto max-h-[85%] max-w-[560px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl">
            ${content}
          </div>
        </div>`;
    }

    function modalHeader(title, subtitle = '') {
      return `
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
            ${subtitle ? `<p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
          </div>
          <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
        </div>`;
    }

    function renderForceModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      const cnt = count(c);
      return modalShell(`
        ${modalHeader('确认强制开班？', `${c.name} · 当前 ${cnt}/${c.min} 人`)}
        <div class="mt-3 rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-3">
          <div class="flex items-start gap-2">
            ${icon('alert-triangle', 'h-4 w-4 shrink-0 text-amber-600 mt-0.5')}
            <p class="text-[14px] font-medium leading-relaxed text-amber-900">当前仅 ${cnt} 人报名，低于最低成班 ${c.min} 人要求。强制开班后按小班自负盈亏执行，学费差额由负责班长预留款承担。</p>
          </div>
        </div>
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">确认后班级状态立即转为“已正式开课”，并记录强制开班时间。</div>
        <div class="mt-4 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">再想想</button>
          <button data-action="confirm-force" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-1 rounded-xl bg-amber-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确定强制开班</button>
        </div>`);
    }

    function renderCancelModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      return modalShell(`
        ${modalHeader('取消小班课招生', `${c.name} · 已报名 ${count(c)} 人`)}
        <p class="mt-3 text-[14px] font-medium leading-relaxed text-slate-600">取消后将联动通知已报名学员，并触发课时退回事件（由 M2B 承接）。</p>
        <div class="mt-3">
          <label for="cancelReason" class="mb-1.5 block text-[16px] font-semibold text-slate-800">取消原因（家长可见）<span class="text-rose-500"> *</span></label>
          <input id="cancelReason" value="${esc(state.cancelReason)}" maxlength="80" placeholder="如：未达最低成班人数" class="h-12 w-full rounded-xl border border-slate-200 bg-white px-3.5 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
        </div>
        ${state.cancelError ? `<div id="cancelError" class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-2.5 text-[14px] font-medium text-rose-700">${esc(state.cancelError)}</div>` : ''}
        <div class="mt-4 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">返回</button>
          <button data-action="confirm-cancel" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-1 rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认取消</button>
        </div>`);
    }

    function renderOverlay() {
      document.getElementById('overlay').innerHTML = state.overlay ? renderOverlayHTML() : '';
    }

    function renderOverlayHTML() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'create') return renderCreateSheet();
      if (state.overlay.type === 'force') return renderForceModal();
      if (state.overlay.type === 'cancel') return renderCancelModal();
      return '';
    }

    /* ------------------------------------------------------------------
     * 业务动作
     * ------------------------------------------------------------------ */
    function openCreateSheet() {
      if (state.online === 'off') return showToast('离线模式下不可创建小班');
      const role = state.role === 'admin' ? 'admin' : 'monitor';
      state.role = role;
      state.create = emptyCreate();
      state.page = 'classes';
      state.navTab = role === 'admin' ? 'settings' : 'ops';
      state.overlay = { type: 'create' };
      renderAll();
      setTimeout(() => document.getElementById('createName')?.focus(), 60);
    }

    function changeMin(delta) {
      state.create.min = Math.max(1, Math.min(state.create.max, state.create.min + delta));
      const el = document.getElementById('createMin');
      if (el) el.textContent = state.create.min;
      clearCreateError();
    }

    function changeMax(delta) {
      state.create.max = Math.max(state.create.min, Math.min(20, state.create.max + delta));
      const el = document.getElementById('createMax');
      if (el) el.textContent = state.create.max;
      clearCreateError();
    }

    function clearCreateError() {
      state.create.error = '';
      const el = document.getElementById('createError');
      if (el) el.remove();
    }

    function createError() {
      if (state.online === 'off') return '离线模式下不可创建小班';
      const f = state.create;
      if (!f.name.trim()) return '请填写班级名称';
      if (f.name.trim().length > 50) return '班级名称不能超过 50 字符';
      if (!COURSE_TYPES.includes(f.courseType)) return '请选择课程类型';
      if (!TEACHERS.some((t) => t.id === f.teacherId)) return '请选择授课外教';
      if (!['Leo', 'Amy'].includes(f.monitorName)) return '请选择负责班长';
      if (!Number.isInteger(f.min) || f.min < 1 || f.min > 20) return 'Min 人数需为 1-20 的整数';
      if (!Number.isInteger(f.max) || f.max < 1 || f.max > 20) return 'Max 人数需为 1-20 的整数';
      if (f.min > f.max) return '需满足 Min ≤ Max';
      if (!/^\d+$/.test(String(f.salary).trim())) return '教师单节课酬需为非负整数';
      const commissionStr = String(f.commission).trim();
      if (!/^\d{1,3}(\.\d{1,2})?$/.test(commissionStr)) return '抽佣比例需为 0-100，最多 2 位小数';
      const commission = Number(commissionStr);
      if (commission < 0 || commission > 100) return '抽佣比例需在 0-100 之间';
      if (!f.startDate) return '请选择计划开班日期';
      return null;
    }

    function submitCreateClass() {
      const err = createError();
      if (err) {
        state.create.error = err;
        renderOverlay();
        lucide.createIcons();
        showToast(err);
        return;
      }
      const f = state.create;
      const teacher = teacherById(f.teacherId);
      const c = {
        id: `cls_${Math.random().toString(36).slice(2, 10)}`,
        name: f.name.trim(), courseType: f.courseType,
        teacherId: f.teacherId, teacherName: teacher.name, monitorName: f.monitorName,
        min: f.min, max: f.max, enrolled: [], status: 'recruiting',
        plannedStartDate: f.startDate, salaryPoints: Number(f.salary),
        commissionRate: Number(f.commission), isOneToOne: false
      };
      state.classes.unshift(c);
      state.activeClassId = c.id;
      state.page = 'classDetail';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
      showToast('小班课已创建并进入招募中');
    }

    function confirmForceStart() {
      if (state.online === 'off') return showToast('离线模式下不可开班');
      const c = classById(state.overlay.classId);
      if (!c) return;
      c.status = 'active';
      c.forceStartedAt = TODAY;
      state.overlay = null;
      renderAll();
      showToast('已强制开班 · 班级状态转为已正式开课');
    }

    function confirmCancelClass() {
      if (state.online === 'off') return showToast('离线模式下不可取消班级');
      const reason = state.cancelReason.trim();
      if (!reason) {
        state.cancelError = '请填写取消原因';
        renderOverlay();
        lucide.createIcons();
        return;
      }
      const c = classById(state.overlay.classId);
      if (!c) return;
      c.status = 'cancelled';
      c.cancelledReason = reason;
      c.cancelledAt = TODAY;
      state.overlay = null;
      renderAll();
      showToast('已取消班级 · 已触发 ClassCancelledEvent 与课时退回');
    }

    function enrollClass(id) {
      if (state.online === 'off') return showToast('离线模式下不可报名');
      const c = classById(id);
      if (!c) return;
      if (c.status !== 'recruiting') return showToast('该小班课当前不可报名');
      if (isFull(c)) return showToast('已满员，报名入口已自动截流');
      const child = parentChild();
      if (isChildEnrolled(c, child.name)) return showToast('该宝贝已报名本班');
      c.enrolled.push(child.name);
      if (isFull(c)) showToast(`已为 ${child.name} 报名，本班已满员并自动截流`);
      else showToast(`已为 ${child.name} 报名「${c.name}」`);
      renderAll();
    }

    /* ------------------------------------------------------------------
     * 事件委托
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'go-back') {
        if (state.page === 'classDetail') state.page = 'classes';
        else if (state.page === 'hallDetail') state.page = 'hall';
        else state.page = state.role === 'parent' ? 'hall' : 'classes';
        state.overlay = null;
        renderAll();
        return;
      }
      if (action === 'open-class') {
        state.activeClassId = el.dataset.id;
        state.page = 'classDetail';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        renderAll();
        return;
      }
      if (action === 'open-parent-class') {
        state.activeClassId = el.dataset.id;
        state.page = 'hallDetail';
        state.navTab = 'hall';
        state.overlay = null;
        renderAll();
        return;
      }
      if (action === 'open-create') return openCreateSheet();
      if (action === 'close-overlay') {
        state.overlay = null;
        renderOverlay();
        lucide.createIcons();
        return;
      }
      if (action === 'submit-create') return submitCreateClass();
      if (action === 'min-dec') return changeMin(-1);
      if (action === 'min-inc') return changeMin(1);
      if (action === 'max-dec') return changeMax(-1);
      if (action === 'max-inc') return changeMax(1);
      if (action === 'open-force') {
        if (state.online === 'off') return showToast('离线模式下不可开班');
        state.overlay = { type: 'force', classId: el.dataset.id };
        renderAll();
        return;
      }
      if (action === 'open-cancel') {
        if (state.online === 'off') return showToast('离线模式下不可取消班级');
        state.cancelReason = '';
        state.cancelError = '';
        state.overlay = { type: 'cancel', classId: el.dataset.id };
        renderAll();
        return;
      }
      if (action === 'confirm-force') return confirmForceStart();
      if (action === 'confirm-cancel') return confirmCancelClass();
      if (action === 'enroll') return enrollClass(el.dataset.id);
      if (action === 'select-child') {
        state.parentChild = el.dataset.child;
        renderAll();
        return;
      }
      if (action === 'set-filter') {
        state.classFilter = el.dataset.filter;
        renderAll();
        return;
      }
    });

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'createName') { state.create.name = e.target.value; clearCreateError(); }
      if (id === 'createSalary') { state.create.salary = e.target.value; clearCreateError(); }
      if (id === 'createCommission') { state.create.commission = e.target.value; clearCreateError(); }
      if (id === 'createStart') { state.create.startDate = e.target.value; clearCreateError(); }
      if (id === 'cancelReason') {
        state.cancelReason = e.target.value;
        state.cancelError = '';
        const err = document.getElementById('cancelError');
        if (err) err.remove();
      }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      if (e.target.id === 'createCourse') {
        state.create.courseType = e.target.value;
        clearCreateError();
      }
      if (e.target.id === 'createTeacher') {
        state.create.teacherId = e.target.value;
        clearCreateError();
      }
      if (e.target.id === 'createMonitor') {
        state.create.monitorName = e.target.value;
        clearCreateError();
      }
    });

    /* ------------------------------------------------------------------
     * 提示
     * ------------------------------------------------------------------ */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2600);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

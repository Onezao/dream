          <button data-action="progress-privacy-toggle" class="mt-2 flex w-full items-start gap-2 rounded-xl border px-3 py-2.5 text-left transition ${p.confirmed ? 'border-indigo-600 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
            <span class="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-md border ${p.confirmed ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 text-transparent'}">${icon('check', 'h-3.5 w-3.5')}</span>
            <span class="text-[12px] font-medium leading-relaxed ${p.confirmed ? 'text-indigo-900' : 'text-slate-600'}">我已确认本备注不含他生姓名、联系方式或其他隐私信息（保存将留痕，同班家长只读查看）。</span>
          </button>
        </div>
        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">取消</button>
          <button id="progressSave" data-action="progress-save" data-id="${c.id}" data-courseware-id="${cw.id}" ${progressSaveBlocked(c, p) ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">保存进度</button>
        </div>
        ${scan.hits.length ? `<p class="mt-1 text-center text-[12px] font-medium text-slate-500">检测到冲突时，仅他生姓名可在勾选确认后放行；联系方式一律硬阻断。</p>` : ''}
      `);
    }

    /* 绑定正式学员：仅展示并允许「正式在读」，待认领试课物理禁止 */
    function renderMemberBindModal() {
      const c = classById(state.overlay.classId);
      if (!c) return '';
      const k = memberCount(c);
      const max = Number(c.max) || 0;
      const full = k >= max;
      const boundIds = new Set(classMembers(c).map((m) => m.studentId));
      const q = String(state.memberSearch || '').trim().toLowerCase();
      const formal = STUDENT_DIRECTORY.filter((s) => s.status === 'formal' && !boundIds.has(s.id));
      const matches = formal.filter((s) => !q || s.name.toLowerCase().includes(q) || String(s.age).includes(q));
      const trials = STUDENT_DIRECTORY.filter((s) => s.status === 'trial');
      return modalShell(`
        ${modalHeader('绑定正式学员', `${c.name} · 当前 ${k} / Max ${max} 人`)}
        <div class="mt-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">仅支持绑定「正式在读」学员（禁绑「待认领试课」、已归档及已删除学员）；绑定后同步小班课表、只读课件与停课 / 代课通知，不涉线上学费与个人请假；学员在 M1A 归档或删档时自动解绑并释放 Max 名额。</div>
        ${!c.teacherId ? `<div class="mt-2 flex items-start gap-1.5 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-amber-900">${icon('info', 'h-3.5 w-3.5 shrink-0 text-amber-700')}<span>阶段 ① 可预绑定老生用于核对课表与配课件；未委任并排课前，学员课表暂无未来投影。</span></div>` : ''}
        ${full ? `<div class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[12px] font-semibold text-rose-800">已达最大学生数上限（K == Max），新增入口已禁用；如需增加请先在编辑小班中调大 Max。</div>` : ''}
        <div class="mt-3">
          <label for="fMemberSearch" class="mb-1 block text-[14px] font-semibold text-slate-700">按规范英文名搜索</label>
          <input id="fMemberSearch" type="text" value="${esc(state.memberSearch || '')}" placeholder="如 AliceZ12" autocomplete="off" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 px-3.5 text-[16px] text-slate-900 outline-none transition placeholder:text-slate-500 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">
        </div>
        <div class="mt-2 space-y-1.5">
          ${matches.length
            ? matches.map((s) => `<div class="flex items-center justify-between gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2">
                <div class="min-w-0">
                  <div class="truncate text-[14px] font-semibold text-slate-900">${esc(s.name)}</div>
                  <div class="truncate text-[12px] font-medium text-slate-500">${s.age}岁 · 规范英文名</div>
                </div>
                <div class="flex shrink-0 items-center gap-1.5">
                  ${chip('正式在读', 'emerald')}
                  <button data-action="bind-member" data-id="${c.id}" data-student-id="${s.id}" ${full ? 'disabled' : ''} class="h-8 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 hover:bg-indigo-100/70 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-100 disabled:text-slate-500">绑定</button>
                </div>
              </div>`).join('')
            : `<div class="rounded-xl border border-dashed border-slate-300 bg-white px-3 py-4 text-center text-[12px] font-medium text-slate-500">${q ? '未找到匹配的「正式在读」学员' : '暂无可绑定的「正式在读」学员'}</div>`}
        </div>
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5">
          <div class="text-[12px] font-semibold text-slate-500">不可绑定示例（物理拦截）</div>
          ${trials.map((s) => `<div class="mt-1 flex items-center justify-between gap-2 rounded-lg bg-white px-2.5 py-1.5">
            <div class="min-w-0">
              <div class="truncate text-[14px] font-semibold text-slate-500">${esc(s.name)}</div>
              <div class="text-[12px] font-medium text-slate-500">${s.age}岁 · 待认领试课</div>
            </div>
            <span class="shrink-0 rounded-lg border border-slate-200 bg-slate-100 px-2 py-1 text-[12px] font-bold text-slate-500">禁绑</span>
          </div>`).join('')}
          <p class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-500">「待认领试课」不会出现在可绑定结果中；即使携带学员 ID 提交也会被服务端物理拒绝。</p>
        </div>
        <div class="mt-2 rounded-xl border border-indigo-200/70 bg-indigo-50/50 px-3 py-2 text-[12px] font-medium leading-relaxed text-indigo-900">并发原子校验：单事务互斥锁定本班容量后复核 K + 1 ≤ Max；并发超限则整笔回滚并提示「本班成员数或容量刚发生变动，请刷新后重试」。</div>
        <div class="mt-3"><button data-action="close-overlay" class="h-11 w-full rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">完成</button></div>
      `);
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'ext-link') return;
      if (action === 'bell') return showToast(`消息中心有 ${BANNERS[state.role].unread} 条新通知`);
      if (action === 'back-main') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'back-classes') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'open-class') {
        state.activeClassId = el.dataset.id;
        state.page = 'detail';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.logOpen = false;
        state.overlay = null;
        return renderAll();
      }
      if (action === 'open-log') {
        state.activeClassId = el.dataset.id;
        state.page = 'detail';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.logOpen = true;
        state.overlay = null;
        return renderAll();
      }
      if (action === 'open-edit') return openEdit(el.dataset.id);
      if (action === 'save-edit') return saveEdit();
      if (action === 'open-picker') {
        const kind = el.dataset.picker;
        if (!kind) return;
        if (kind === 'teacher-edit') {
          if (!state.edit) return;
          const c = classById(state.edit.classId);
          if (!c || classStage(c) === '3' || classStage(c) === '4') return;
        }
        state.picker = { kind };
        state.pickerSearch = '';
        return renderPickerOnly();
      }
      if (action === 'close-picker') {
        state.picker = null;
        state.pickerSearch = '';
        return renderPickerOnly();
      }
      if (action === 'pick-teacher-create' || action === 'pick-teacher-edit') {
        const picked = teacherById(el.dataset.value || '');
        if (picked && picked.leaveDate) return showToast('该老师已设置预约离职日，不可委任');
        return applyTeacherPick(el.dataset.value || '');
      }
      if (action === 'pick-owner-create') return applyOwnerPick(el.dataset.value || '');
      if (action === 'picker-reset') {
        if (!state.picker) return;
        if (state.picker.kind === 'owner-create') return applyOwnerPick(monitorOptions()[0]?.id || CURRENT_MONITOR_ID);
        return applyTeacherPick('');
      }
      if (action === 'toggle-log') { state.logOpen = !state.logOpen; return renderAll(); }
      if (action === 'set-filter') { state.filter = el.dataset.filter; return renderAll(); }
      if (action === 'set-owner') {
        if (!isAdmin()) return;
        state.ownerFilter = el.dataset.owner || 'all';
        state.teacherFilter = 'all';
        return renderAll();
      }
      if (action === 'set-teacher') { state.teacherFilter = el.dataset.teacher; return renderAll(); }
      if (action === 'show-teacher-all') { state.filter = 'all'; return renderAll(); }
      if (action === 'clear-search') {
        state.search = '';
        renderAll();
        const input = $('fClassSearch');
        if (input) input.focus();
        return;
      }
      if (action === 'reset-filters') {
        state.search = '';
        state.teacherFilter = 'all';
        state.filter = 'all';
        if (isAdmin()) state.ownerFilter = 'all';
        renderAll();
        return;
      }
      if (action === 'open-create') return openCreate();
      if (action === 'cancel-create') {
        state.page = 'classes';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'submit-create') return submitCreate();
      if (action === 'open-reopen') return openReopen(el.dataset.id);
      if (action === 'suspend-class') {
        if (state.online === 'off') return showToast('离线模式下不可暂停待排');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可执行暂停待排');
        const released = c.futureTs;
        if (released > 0) {
          const pendingBefore = classPendingTs(c);
          c.futureTs = 0;
          c.unsettledTs += released;
          c.pendingTs = pendingBefore + released;
          appendAudit(c, '暂停待排', `${released} 节未来排课已退回待排池 · 100% 沿用原购课单单节待上交积分、课酬快照与资金持有人（补排待办：立即补排，受老师 >= D UTC+8 不可排限制）`);
        } else {
          appendAudit(c, '暂停待排', '本次暂停待排已记录，当前无未来排课');
        }
        renderAll();
        return showToast(released > 0 ? `已提交暂停待排 · ${released} 节退回待排池（100% 沿用原快照），可在补排待办中立即补排` : '已提交暂停待排');
      }
      if (action === 'open-archive') {
        if (state.online === 'off') return showToast('离线模式下不可归档');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可归档小班');
        state.overlay = { type: 'archive', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'open-dissolve') {
        if (state.online === 'off') return showToast('离线模式下不可提前结课解散');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可提前结课解散');
        state.dissolve = emptyDissolve();
        state.overlay = { type: 'dissolve', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'dissolve-reason') {
        state.dissolve.reason = el.dataset.reason;
        return renderOverlayOnly();
      }
      if (action === 'dissolve-disposition') {
        state.dissolve.disposition = el.dataset.disposition;
        return renderOverlayOnly();
      }
      if (action === 'dissolve-toggle-confirm') {
        state.dissolve.confirmed = !state.dissolve.confirmed;
        return renderOverlayOnly();
      }
      if (action === 'open-member-bind') {
        if (state.online === 'off') return showToast('离线模式下不可绑定学员');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c) || c.status !== 'active') return showToast('仅正式开课小班可绑定或移出学员');
        if (memberCount(c) >= (Number(c.max) || 0)) return showToast('已达最大学生数上限，请先调大 Max');
        state.memberSearch = '';
        state.overlay = { type: 'member-bind', classId: c.id };
        return renderAll();
      }
      if (action === 'bind-member') {
        if (state.online === 'off') return showToast('离线模式下不可绑定学员');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c) || c.status !== 'active') return;
        const s = studentById(el.dataset.studentId);
        if (!s || s.status !== 'formal') return showToast('仅「正式在读」学员可绑定；「待认领试课」已物理拦截');
        const list = classMembers(c);
        if (list.some((m) => m.studentId === s.id)) return showToast('该学员已在本班在读绑定，禁止重复绑定');
        const max = Number(c.max) || 0;
        if (list.length + 1 > max) return showToast('本班成员数或容量刚发生变动，请刷新后重试');
        c.members = [...list, { studentId: s.id, boundAt: TODAY }];
        appendAudit(c, '绑定正式学员', `已绑定 ${s.name}（${s.age}岁）· 当前 ${c.members.length}/${max} · 同步未来课表投影与家长只读视图，不产生线上账单`);
        renderAll();
        return showToast(`已绑定 ${s.name} · 课表投影与家长只读视图已同步`);
      }
      if (action === 'remove-member') {
        if (state.online === 'off') return showToast('离线模式下不可移出学员');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c) || c.status !== 'active') return;
        const s = studentById(el.dataset.studentId);
        const before = classMembers(c).length;
        c.members = classMembers(c).filter((m) => m.studentId !== el.dataset.studentId);
        if (c.members.length === before) return;
        c.removedMembers = [...classRemovedMembers(c), { studentId: el.dataset.studentId, boundAt: '—', removedAt: TODAY, reason: '主理人手工移出' }];
        appendAudit(c, '移出正式学员', `${s ? s.name : el.dataset.studentId} 已在读绑定移出 · 释放 1 个 Max 名额 · 立即停止未来投影与查看权`);
        renderAll();
        return showToast(`${s ? s.name : '学员'} 已移出 · 释放 1 个 Max 名额`);
      }
      if (action === 'open-courseware-config') {
        if (state.online === 'off') return showToast('离线模式下不可配置课件');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c) || c.status !== 'active') return showToast('终态小班全字段只读');
        state.overlay = { type: 'courseware-config', classId: c.id };
        return renderAll();
      }
      if (action === 'courseware-add') {
        if (state.online === 'off') return showToast('离线模式下不可配置课件');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c) || c.status !== 'active') return;
        const lib = coursewareById(el.dataset.coursewareId);
        if (!lib) return;
        const list = classCoursewares(c);
        if (list.length >= 6) return showToast('每个小班最多配置 6 门在学课件');
        if (list.some((x) => x.id === lib.id)) return showToast('该课件已配置');
        c.coursewares = [...list, {
          id: lib.id, name: lib.name, level: lib.defaultLevel, processNote: '',
          updatedBy: currentOperatorName(), updatedByRole: currentOperatorRole(), updatedAt: TODAY, daysAgo: 0,
          topTeacher: currentOperatorName(), topCount: 1
        }];
        appendAudit(c, '配置课件', `添加在学课件 ${lib.name}（${lib.defaultLevel}）`);
        renderAll();
        return showToast(`已添加 ${lib.name}`);
      }
      if (action === 'courseware-remove') {
        if (state.online === 'off') return showToast('离线模式下不可配置课件');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c) || c.status !== 'active') return;
        const cw = classCoursewares(c).find((x) => x.id === el.dataset.coursewareId);
        if (!cw) return;
        c.coursewares = classCoursewares(c).filter((x) => x.id !== cw.id);
        appendAudit(c, '配置课件', `移除在学课件 ${cw.name}`);
        renderAll();
        return showToast(`已移除 ${cw.name}`);
      }
      if (action === 'open-progress') {
        if (state.online === 'off') return showToast('离线模式下不可更新进度');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c) || c.status !== 'active') return showToast('终态小班全字段只读');
        const cw = classCoursewares(c).find((x) => x.id === el.dataset.coursewareId);
        if (!cw) return;
        state.progress = { classId: c.id, coursewareId: cw.id, level: cw.level, note: cw.processNote || '', confirmed: false };
        state.overlay = { type: 'progress', classId: c.id, coursewareId: cw.id };
        return renderAll();
      }
      if (action === 'progress-level') {
        if (!state.progress) return;
        state.progress.level = el.dataset.level;
        return renderOverlayOnly();
      }
      if (action === 'progress-privacy-toggle') {
        if (!state.progress) return;
        state.progress.confirmed = !state.progress.confirmed;
        return renderOverlayOnly();
      }
      if (action === 'progress-copy') {
        const c = classById(el.dataset.id);
        const p = state.progress;
        if (!c || !p) return;
        const scan = progressPrivacyState(c, p);
        if (scan.hard) {
          return showToast(`复制已阻断：备注含${scan.hits.filter((h) => h.kind === 'contact').map((h) => h.label).join('、')}，请移除后重试`);
        }
        if (scan.hits.length && !p.confirmed) {
          return showToast('复制已阻断：检测到他生姓名，请先勾选隐私确认框');
        }
        if (navigator.clipboard) navigator.clipboard.writeText(p.note).catch(() => {});
        return showToast(scan.hits.length ? '已勾选他生姓名确认并复制（操作留痕）' : '已通过隐私检测并复制');
      }
      if (action === 'progress-phrase') {
        if (!state.progress) return;
        const text = el.dataset.phrase || '';
        const base = String(state.progress.note || '').replace(/\s+$/, '');
        state.progress.note = (base ? `${base}\n${text}` : text).slice(0, 2000);
        return renderOverlayOnly();
      }
      if (action === 'progress-save') {
        if (state.online === 'off') return showToast('离线模式下不可更新进度');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c) || c.status !== 'active') return;
        const cw = classCoursewares(c).find((x) => x.id === el.dataset.coursewareId);
        if (!cw || !state.progress) return;
        const scan = progressPrivacyState(c, state.progress);
        if (scan.hard) return showToast(`保存已阻断：备注含${scan.hits.filter((h) => h.kind === 'contact').map((h) => h.label).join('、')}，请移除后重试`);
        if (!state.progress.confirmed) return showToast('请先勾选他生隐私确认框后再保存');
        const oldLevel = cw.level;
        const note = String(state.progress.note || '').slice(0, 2000);
        cw.level = state.progress.level || cw.level;
        cw.processNote = note;
        cw.updatedBy = currentOperatorName();
        cw.updatedByRole = currentOperatorRole();
        cw.updatedAt = TODAY;
        cw.daysAgo = 0;
        cw.topTeacher = currentOperatorName();
        cw.topCount = (Number(cw.topCount) || 0) + 1;
        appendAudit(c, '更新进度', `${cw.name} · 级别: ${oldLevel} → ${cw.level} · 进度备注已更新（${note.length} 字）· 他生隐私检测通过${scan.hits.length ? '（已勾选姓名冲突确认，留痕）' : ''} · 并发版本校验已通过`);
        state.overlay = null;
        state.progress = null;
        renderAll();
        return showToast(`已保存 ${cw.name} 进度`);
      }
      if (action === 'open-appoint') {
        if (state.online === 'off') return showToast('离线模式下不可委任老师');
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return showToast('仅主理人或管理员可委任老师');
        state.appoint = { classId: el.dataset.id, selected: '' };
        state.overlay = { type: 'appoint', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'appoint-select') {
        state.appoint.selected = el.dataset.teacher;
        return renderOverlayOnly();
      }
      if (action === 'blocked-order' || action === 'blocked-schedule') {
        state.overlay = { type: 'blocked', classId: el.dataset.id };
        return renderAll();
      }
      if (action === 'blocked-appoint') {
        const c = classById(el.dataset.id);
        if (!c || !ownsClass(c)) return;
        if (state.online === 'off') return showToast('离线模式下不可委任老师');
        state.appoint = { classId: c.id, selected: '' };
        state.overlay = { type: 'appoint', classId: c.id };
        return renderAll();
      }
      if (action === 'appoint-confirm') {
        if (state.online === 'off') return showToast('离线模式下不可委任老师');
        const c = classById(el.dataset.id);
        const t = teacherById(state.appoint.selected);
        if (!c || !t || !ownsClass(c)) return;
        if (c.status !== 'active') return showToast('仅正式开课小班可委任主讲老师');
        if (c.teacherId) return showToast('该班已委任主讲老师；长期换师请走提前结课解散并创建新小班');
        if (!teacherOptions().some((x) => x.id === t.id)) return showToast('请选择全平台在职老师');
        if (t.leaveDate) return showToast('该老师已设置预约离职日，不可委任');
        c.teacherId = t.id;
        appendAudit(c, '委任老师', `主讲老师: 待委任 → ${t.name}（全平台直接委任）`);
        state.overlay = null;
        renderAll();
        return showToast(`已委任 ${t.name} · 购课与排课已恢复`);
      }
      if (action === 'archive-confirm') {
        if (state.online === 'off') return showToast('离线模式下不可归档');
        const c = classById(el.dataset.id);
        if (!c || c.status !== 'active' || !ownsClass(c)) return;
        if (!archiveReady(c)) {
          const first = archiveGuards(c).find((g) => !g.pass);
          return showToast(`尚有未清零资产：${first.label} ${first.count}，请先完成排课/清退，或改走提前结课解散`);
        }
        c.status = 'archived';
        c.archivedAt = TODAY;
        c.pendingTs = 0;
        c.remainingLessons = 0;
        const retainedCount = memberCount(c);
        appendAudit(c, '归档小班', `五项资产全清零 · 停用全局 4 周自动续费与未来课表投影 · ${retainedCount} 名在读正式学员转「随班归档只读留存」，保留课件与 Process Note 只读回看`);
        appendStatus(c, 'active', 'archived', '全局 4 周轮次履约完结 · 五项资产清零 · 主理人归档');
        state.overlay = null;
        renderAll();
        return showToast(`小班已归档 · ${retainedCount} 名随班学员保留只读回看`);
      }
      if (action === 'dissolve-confirm') {
        if (state.online === 'off') return showToast('离线模式下不可提前结课解散');
        const c = classById(el.dataset.id);
        if (!c || c.status !== 'active' || !ownsClass(c)) return;
        if (!dissolveValid(c)) return showToast('请完成解散原因、处置流向、1–200 字备注与免责确认');
        const d = { ...state.dissolve };
        const snap = residualSnapshot(c);
        const completed = Number(c.completedTs) || 0;
        const clearRecordId = nextClearRecordId();
        c.status = 'early_terminated';
        c.futureTs = 0;
        c.pendingTs = 0;
        c.remainingLessons = 0;
        c.voidedTs = snap.totalLessons;
        if (d.disposition === 'PERMANENT_TERMINATE') c.unsettledTs = 0;
        c.termination = {
          reason: d.reason,
          disposition: d.disposition,
          note: d.note.trim(),
          at: TODAY,
          releasedTs: snap.future,
          completedTs: completed,
          voidedTs: snap.totalLessons,
          remainingLessons: snap.totalLessons,
          voidedFutureTs: snap.future,
          voidedPoolTs: snap.pool,
          remainingPoints: snap.remainingPoints,
          clearRecordId,
          clearRecordStatus: '已生成'
        };
        const releasedTeacher = classTeacher(c);
        appendAudit(c, '提前结课解散', `小班 ${c.id} · 原因: ${reasonLabel(d.reason)} · 流向: ${dispositionLabel(d.disposition)} · 已结课 ${completed} 节 · 作废 ${snap.totalLessons} 节（未来已排 ${snap.future} / 待排池 ${snap.pool}）· 剩余待上交 ${points(snap.remainingPoints)} 积分 · 清退记录 ${clearRecordId}（不进 M5A 冲抵）· ${memberCount(c)} 名在读正式学员转「随班归档只读留存」· 备注: ${d.note.trim()}${releasedTeacher ? ` · 主事务提交后异步向原授课老师 ${releasedTeacher.name} 与已绑定学员家长发送日程释放提醒` : ''}`);
        appendStatus(c, 'active', 'early_terminated', `${reasonLabel(d.reason)} · ${dispositionLabel(d.disposition)}`);
        state.overlay = null;
        state.dissolve = emptyDissolve();
        renderAll();
        const notify = releasedTeacher ? ` · 已向 ${releasedTeacher.name} 发送排期释放提醒` : '';
        return showToast(`已提前结课解散 · 已生成小班解散清退记录 ${clearRecordId} · 未来 ${snap.future} 节已释放${notify}`);
      }
      if (action === 'close-overlay') {
        state.overlay = null;
        state.picker = null;
        state.pickerSearch = '';
        $('overlay').innerHTML = '';
        $('picker').innerHTML = '';
        if (window.lucide) lucide.createIcons();
        return;
      }
    });

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'fClassSearch') { state.search = e.target.value; refreshClassList(); return; }
      if (id === 'fClassName') { state.create.name = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fMax') { state.create.max = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fSalary') { state.create.salary = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'fTotal') { state.create.total = e.target.value; state.create.error = ''; updateCreatePreview(); }
      if (id === 'eName' || id === 'eMax' || id === 'eSalary' || id === 'eTotal') {
        if (!state.edit) return;
        if (id === 'eName') state.edit.name = e.target.value;
        if (id === 'eMax') state.edit.max = e.target.value;
        if (id === 'eSalary') state.edit.salary = e.target.value;
        if (id === 'eTotal') state.edit.total = e.target.value;
        state.edit.error = '';
        updateEditLive();
      }
      if (id === 'fDissolveNote') {
        state.dissolve.note = e.target.value;
        const counter = $('dissolveNoteCount');
        if (counter) counter.textContent = `${e.target.value.length}/200`;
        const btn = $('dissolveSubmit');
        const c = state.overlay ? classById(state.overlay.classId) : null;
        if (btn && c) btn.disabled = !dissolveValid(c);
      }
      if (id === 'fProgressNote') {
        if (!state.progress) return;
        state.progress.note = e.target.value;
        const counter = $('progressCount');
        if (counter) counter.textContent = `${e.target.value.length}/2000`;
        const c = state.overlay ? classById(state.overlay.classId) : null;
        if (c) {
          const zone = $('privacyScanZone');
          if (zone) {
            zone.innerHTML = renderProgressPrivacyBody(c, state.progress);
            if (window.lucide) lucide.createIcons();
          }
          const btn = $('progressSave');
          if (btn) btn.disabled = progressSaveBlocked(c, state.progress);
        }
      }
      if (id === 'fMemberSearch') {
        state.memberSearch = e.target.value;
        renderOverlayOnly();
        const input = $('fMemberSearch');
        if (input) {
          input.focus();
          const end = input.value.length;
          input.setSelectionRange(end, end);
        }
        return;
      }
      if (id === 'pickerSearch') { state.pickerSearch = e.target.value; refreshPickerRows(); }
    });

    function navTo(tab) {
      if (state.role === 'admin' && tab === 'settings') return setView('classes');
      if (state.role === 'monitor' && tab === 'ops') return setView('classes');
      state.page = 'placeholder';
      state.navTab = tab;
      state.overlay = null;
      renderAll();
    }

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    /* ------------------------------------------------------------------
     * URL 直达弹层（仅用于演示与截图）
     * ------------------------------------------------------------------ */
    function applyUrlOverlay() {
      const overlay = params.get('overlay');
      if (overlay === 'dissolve') {
        const c = classById(state.activeClassId);
        if (c && c.status === 'active') {
          state.dissolve = {
            reason: params.get('reason') || '',
            disposition: params.get('disposition') || '',
            note: params.get('note') || '',
            confirmed: params.get('confirmed') === '1'
          };
          state.overlay = { type: 'dissolve', classId: c.id };
        }
      }
      if (overlay === 'courseware-config') {
        const c = classById(state.activeClassId);
        if (c && ownsClass(c)) state.overlay = { type: 'courseware-config', classId: c.id };
      }
      if (overlay === 'progress') {
        const c = classById(state.activeClassId);
        const cw = c ? (classCoursewares(c).find((x) => x.id === params.get('cw')) || classCoursewares(c)[0]) : null;
        if (c && cw && ownsClass(c)) {
          state.progress = { classId: c.id, coursewareId: cw.id, level: cw.level, note: cw.processNote || '', confirmed: false };
          state.overlay = { type: 'progress', classId: c.id, coursewareId: cw.id };
        }
      }
      if (overlay === 'member-bind') {
        const c = classById(state.activeClassId);
        if (c && ownsClass(c) && c.status === 'active') {
          state.memberSearch = params.get('q') || '';
          state.overlay = { type: 'member-bind', classId: c.id };
        }
      }
      if (overlay === 'appoint') {
        const c = classById(state.activeClassId);
        if (c) {
          state.appoint = { classId: c.id, selected: params.get('teacher') || '' };
          state.overlay = { type: 'appoint', classId: c.id };
        }
      }
      if (overlay === 'blocked') {
        const c = classById(state.activeClassId);
        if (c) state.overlay = { type: 'blocked', classId: c.id };
      }
      if (overlay === 'edit') {
        const c = classById(state.activeClassId);
        if (c) {
          state.edit = emptyEdit(c);
          state.overlay = { type: 'edit', classId: c.id };
        }
      }
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    applyUrlOverlay();
    renderAll();
  </script>
</body>
</html>

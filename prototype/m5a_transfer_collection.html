    /* ------------------------------------------------------------------

    function openDrawer() {

              <button data-action="tab" data-tab="student" class="flex-1 rounded-lg py-1.5 text-[12px] font-bold transition ${state.tab === 'student' ? 'bg-white text-indigo-700' : 'text-slate-500'}">按学生</button>
              <button data-action="tab" data-tab="teacher" class="flex-1 rounded-lg py-1.5 text-[12px] font-bold transition ${state.tab === 'teacher' ? 'bg-white text-indigo-700' : 'text-slate-500'}">按教师</button>

                <div class="px-1"><div class="text-[12px] font-semibold text-indigo-700">实转金额</div><div class="mt-0.5 font-mono text-[16px] font-bold text-indigo-700">${fmt(TOTALS.transfer)}</div></div>

    /* 明细聚合：学生视角按出资归属，教师视角按授课人，双视角共用同一份 lines */
    function studentGroupsOf(order) {
      const map = new Map();
      (order.lines || []).forEach((l) => {
        const key = l.funderStudent || l.student;
        if (!map.has(key)) map.set(key, { name: key, parent: l.parent, lines: [] });
        map.get(key).lines.push(l);
      });
      return [...map.values()].map((g) => {
        const prices = [...new Set(g.lines.map((l) => l.points))];
        const kinds = [...new Set(g.lines.map((l) => l.kind))];
        return {
          ...g, count: g.lines.length,
          total: sumBy(g.lines, (l) => l.points),
          unit: prices.length === 1 ? prices[0] : null,
          kind: kinds.length === 1 ? kinds[0] : '混合课型',
          transfer: g.lines.some((l) => l.transferNote)
        };
      });
    }

    function teacherGroupsOf(order) {
      const map = new Map();
      (order.lines || []).forEach((l) => {
        if (!map.has(l.teacher)) map.set(l.teacher, { name: l.teacher, level: l.teacherLevel, lines: [] });
        map.get(l.teacher).lines.push(l);
      });
      return [...map.values()].map((g) => ({
        ...g, count: g.lines.length,
        amount: sumBy(g.lines, (l) => l.points),
        sub: g.lines.filter((l) => l.subFor).length
      }));
    }

    function splitTotals(order) {
      const lines = order.lines || [];
      const one = sumBy(lines.filter((l) => l.kind === '1v1'), (l) => l.points);
      const group = sumBy(lines.filter((l) => l.kind === '小班课'), (l) => l.points);
      const penalty = order.penalty || 0;
      return { one, group, penalty, total: one + group + penalty };
    }

    function penaltySection(order) {
      const list = order.penaltyList || [];
      if (!list.length) return '';
      return `<section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5">
        <div class="flex items-center justify-between gap-2">
          <h3 class="text-[14px] font-bold text-slate-900">退款违约金归集明细</h3>
          <span class="shrink-0 text-[12px] font-bold text-indigo-700">+${fmt(order.penalty)} 积分</span>
        </div>
        <div class="mt-2 space-y-1.5">
          ${list.map((p) => `<div class="flex items-center justify-between gap-2 rounded-lg bg-white px-2.5 py-2 text-[12px]">
            <div class="min-w-0"><div class="truncate font-semibold text-slate-800">${esc(p.id)} · ${esc(p.student)}</div><div class="text-slate-600">退款完成 ${esc(p.completedAt)}</div></div>
            <span class="shrink-0 font-mono font-bold text-slate-900">+${fmt(p.points)}</span>
          </div>`).join('')}
        </div>
        <p class="mt-2 text-[12px] font-medium text-slate-600">经办退款单扣除的违约金，下周一周转单自动归集上交，班长不得私留。</p>
      </section>`;
    }

    function smallSummary(order) {
      const rows = order.groupClasses || [];
      const gross = sumBy(rows, (g) => g.unit * g.count);
      const other = sumBy(rows, (g) => (g.other ?? (g.unit - g.salary - g.toolFee)) * g.count);
      return { rows, gross, other };
    }

    function studentGroups() {
      return `<div class="divide-y divide-slate-100 overflow-hidden rounded-2xl border border-slate-200 bg-slate-50/70">
        ${studentGroupsOf(DRAFT_ORDER).map((s) => `<div class="flex items-center justify-between px-3 py-2">
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="text-[14px] font-semibold text-slate-900">${esc(s.name)}</span>
              <span class="rounded bg-slate-100 px-1 py-0.5 text-[12px] font-bold text-slate-700">${esc(s.kind)}</span>
              ${s.transfer ? `<span class="rounded border border-amber-200 bg-amber-50 px-1 py-0.5 text-[12px] font-bold text-amber-800">含跨家长转让</span>` : ''}
            </div>
            <div class="mt-0.5 text-[12px] text-slate-600">出资家长 ${esc(s.parent)} · ${s.count} 节${s.transfer ? ' · 含跨家长转让' : ''}</div>
          </div>
          <div class="shrink-0 text-right"><div class="font-mono text-[14px] font-bold text-slate-900">${fmt(s.total)}</div><div class="text-[12px] text-slate-600">积分</div></div>
        </div>`).join('')}
      </div>`;
    }

    function teacherGroups() {
      return `<div class="divide-y divide-slate-100 overflow-hidden rounded-2xl border border-slate-200 bg-slate-50/70">
        ${teacherGroupsOf(DRAFT_ORDER).map((t) => `<div class="flex items-center justify-between px-3 py-2">
          <div class="min-w-0">
            <div class="flex items-center gap-1.5"><span class="text-[14px] font-semibold text-slate-900">${esc(t.name)}</span>${t.sub ? `<span class="rounded border border-purple-200 bg-purple-50 px-1 py-0.5 text-[12px] font-bold text-purple-700">代课 ${t.sub} 节</span>` : ''}</div>
            <div class="mt-0.5 text-[12px] text-slate-600">定级 ${esc(t.level)} · ${t.count} 节</div>
          </div>
          <div class="shrink-0 text-right"><div class="font-mono text-[14px] font-bold text-slate-900">${fmt(t.amount)}</div><div class="text-[12px] text-slate-600">积分</div></div>
        </div>`).join('')}
      </div>`;
    }

    function smallBlock(s) {
      const gross = s.unit * s.count;
      const otherUnit = s.other ?? (s.unit - s.salary - s.toolFee);
      const other = otherUnit * s.count;
      const badge = s.terminated
        ? `<span title="该班级已于 ${s.terminatedAt || '11-05'} 提前解散，本周完课 ${s.count} 节已结算，未来未上课次已作废释放" class="shrink-0 rounded border border-slate-300 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-600">已提前解散</span>`

        <div class="flex items-center justify-between gap-2"><span class="flex min-w-0 items-center gap-1.5"><span class="truncate text-[14px] font-semibold text-slate-900">${esc(s.name)}</span>${badge}</span><span class="shrink-0 text-[12px] text-slate-600">Max ${s.max} · ${s.count} 节</span></div>

          <div><span class="text-slate-600">教师课酬</span><div class="font-semibold text-slate-800">${s.salary}</div></div>

          <div><span class="text-slate-600">其他结余</span><div class="font-semibold ${otherUnit < 0 ? 'text-rose-700' : 'text-slate-800'}">${otherUnit}</div></div>
        </div>
        <div class="mt-1.5 flex justify-between border-t border-slate-100 pt-1.5 text-[12px]"><span class="font-medium text-slate-600">小计待上交 ${fmt(gross)}</span><span class="font-semibold text-slate-700">其他结余 ${fmt(other)}</span></div>
      </div>`;
    }

    function uploadInner() {
      if (!state.voucher) {
        return `<button data-action="add-voucher" ${state.online === 'off' ? 'disabled' : ''} class="flex h-16 w-full flex-col items-center justify-center gap-0.5 rounded-xl border-2 border-dashed border-slate-300 text-slate-600 transition hover:border-indigo-400 hover:text-indigo-600 disabled:opacity-40">

        <div class="min-w-0 flex-1"><div class="truncate text-[12px] font-semibold text-slate-800">cmb-1110-0938.jpg</div><div class="text-[12px] text-slate-600">已上传 1 / 5 · 1.2MB</div></div>
        <button data-action="remove-voucher" class="grid h-7 w-7 place-items-center rounded-lg text-slate-600 hover:bg-slate-100 hover:text-rose-600">${icon('trash-2', 'h-4 w-4')}</button>

    function tomUploadInner() {

        return `<button data-action="add-tom-voucher" ${state.online === 'off' ? 'disabled' : ''} class="flex h-16 w-full flex-col items-center justify-center gap-0.5 rounded-xl border-2 border-dashed border-slate-300 text-slate-600 transition hover:border-indigo-400 hover:text-indigo-600 disabled:opacity-40">
          ${icon('upload', 'h-4 w-4')}<span class="text-[12px] font-medium">上传打款凭证</span><span class="text-[12px]">JPG PNG PDF · ≤10MB · 最多 5 张</span>
        </button>`;
      }
      return `<div class="flex h-16 items-center gap-2.5 rounded-xl border border-slate-200 bg-white px-2.5">

      }
      return `<div class="mt-2.5 rounded-xl border border-slate-200 bg-white px-3 py-2.5">
        <div class="flex items-center gap-1.5 text-[12px] font-bold text-slate-700">${icon('upload', 'h-4 w-4')}待上传打款凭证</div>
        <div class="mt-1 text-[12px] text-slate-500">请于周一内完成线下打款并上传截图，提交后生成财务归档快照。</div>
      </div>`;
    }

    function orderFooter(o) {
      const off = state.online === 'off';
      if (state.role === 'sarah') {
        if (o.status === 'PENDING_CONFIRMATION') {
          return `<div class="flex gap-2">
            <button data-action="reject" data-id="${o.id}" ${off ? 'disabled' : ''} class="h-11 flex-1 rounded-xl border border-rose-200 bg-white text-[16px] font-semibold text-rose-700 hover:bg-rose-50 disabled:opacity-40">驳回转账单</button>
            <button data-action="confirm-collect" data-id="${o.id}" ${off ? 'disabled' : ''} class="h-11 flex-[1.6] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700 disabled:opacity-40">确认收款</button>
          </div>`;
        }
        const note = o.status === 'COMPLETED'
          ? '款项已确认入账，单据归档不可更改'
          : o.status === 'CANCELLED'
            ? '单据已驳回归档，仅供查阅历史快照'
            : '草稿阶段由班长提交后再行审批';
        return `<div class="flex items-center justify-center gap-2 rounded-xl bg-slate-100 px-3 py-3 text-[14px] font-semibold text-slate-500">${icon('lock', 'h-4 w-4')}${note}</div>`;
      }
      if (o.status === 'DRAFT') {
        return `<div class="space-y-2">
          <div class="text-center text-[12px] font-medium text-slate-600">请在周一内完成线下打款并上传凭证</div>
          <button data-action="open-drawer" ${off ? 'disabled' : ''} class="h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-600">去上交并打款</button>
        </div>`;
      }
      if (o.status === 'PENDING_CONFIRMATION') {
        return `<div class="flex items-center justify-center gap-2 rounded-xl border border-amber-200/70 bg-amber-50 px-3 py-3 text-[14px] font-semibold text-amber-800">${icon('clock', 'h-4 w-4')}已提交平台审核，请耐心等待</div>`;
      }
      return `<div class="flex items-center justify-center gap-2 rounded-xl bg-slate-100 px-3 py-3 text-[14px] font-semibold text-slate-500">${icon('lock', 'h-4 w-4')}单据已归档，历史记录不可更改</div>`;
    }

    function orderDetailModal(id) {
      const o = state.orders.find((x) => x.id === id);
      if (!o) return '';
      const meta = statusMeta(o.status);
      const tablet = state.device === 'tablet';
      return `<div class="absolute inset-0 z-[60]">
        <div data-action="close-modal" class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]"></div>
        <section class="${tablet
          ? 'absolute inset-y-0 right-0 flex w-[90%] max-w-[480px] flex-col overflow-hidden border-l border-slate-200 bg-white shadow-2xl'
          : 'absolute inset-x-0 bottom-0 flex h-[92%] flex-col overflow-hidden rounded-t-2xl bg-white shadow-2xl'}">
          ${tablet ? '' : '<div class="mx-auto mt-2 h-1 w-9 shrink-0 rounded-full bg-slate-300"></div>'}
          <header class="shrink-0 border-b border-slate-200 bg-white px-4 py-3">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-1.5">
                  <h2 class="truncate font-mono text-[16px] font-bold text-slate-900">${esc(o.id)}</h2>
                  <button data-action="copy-order" data-id="${o.id}" class="grid h-7 w-7 shrink-0 place-items-center rounded-lg border border-slate-200 bg-slate-50 text-slate-500 transition hover:bg-slate-100" aria-label="复制单号">${icon('copy', 'h-3.5 w-3.5')}</button>
                </div>
                <div class="mt-0.5 font-mono text-[12px] text-slate-500">${esc(o.week)} · ${esc(o.period)}</div>
                <div class="mt-1.5 flex flex-wrap items-center gap-1.5">
                  <span class="inline-flex items-center rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${typeLabel(o.type)}</span>
                  ${chip(meta.label, meta.tone)}
                </div>
              </div>
              <button data-action="close-modal" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-600 hover:bg-slate-100">${icon('x', 'h-4 w-4')}</button>
            </div>
          </header>

          <div data-detail-scroll class="min-h-0 flex-1 space-y-3 overflow-y-auto p-3">
            <div class="grid grid-cols-2 overflow-hidden rounded-2xl border border-slate-200/80 bg-slate-50/70">
              <div class="p-2.5">
                <div class="text-[12px] font-semibold text-slate-600">打包课次数</div>
                <div class="mt-1 font-mono text-[18px] font-bold leading-none text-slate-900">${o.count}</div>
                <div class="mt-1 text-[12px] font-medium text-slate-600">1v1 + 小班课</div>
              </div>
              <div class="border-l border-slate-200 p-2.5">
                <div class="text-[12px] font-semibold text-indigo-700">实转金额</div>
                <div class="mt-1 font-mono text-[18px] font-bold leading-none text-indigo-700">${fmt(o.transfer)}</div>
                <div class="mt-1 text-[12px] font-medium text-indigo-700">1v1 ${fmt(splitTotals(o).one)} + 小班 ${fmt(splitTotals(o).group)} + 违约金 ${fmt(o.penalty)}</div>
              </div>
            </div>
            ${penaltySection(o)}

            <section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5">
              <div class="flex items-center justify-between gap-2">
                <h3 class="text-[14px] font-bold text-slate-900">打款凭证与审核反馈</h3>
                <span class="text-[12px] font-medium text-slate-600">1 积分 = 1 元</span>
              </div>
              ${o.voucher
                ? `<button data-action="voucher" data-id="${o.id}" class="mt-2.5 flex w-full items-center gap-2.5 rounded-xl border border-slate-200 bg-white p-2.5 text-left transition hover:bg-slate-50">
                    <span class="h-11 w-9 shrink-0 overflow-hidden rounded border border-slate-200 bg-white">${miniReceipt()}</span>
                    <span class="min-w-0 flex-1">
                      <span class="block truncate text-[12px] font-bold text-slate-700">cmb-${esc(o.id.slice(-4))}-voucher.jpg</span>
                      <span class="block text-[12px] text-slate-600">打款 ¥${fmt(o.transfer)}.00 · 点击查看大图</span>
                    </span>
                    ${icon('maximize-2', 'h-4 w-4 shrink-0 text-slate-600')}
                  </button>`
                : `<div class="mt-2.5 flex items-center gap-2.5 rounded-xl border border-dashed border-slate-300 px-3 py-3 text-slate-600">${icon('image-off', 'h-4 w-4')}<span class="text-[12px] font-medium">暂无打款凭证</span></div>`}
              ${voucherFeedback(o)}
            </section>

            <div class="flex items-center justify-between px-1 pt-1">
              <h3 class="text-[16px] font-bold text-slate-900">课次明细</h3>
              <span class="text-[12px] font-medium text-slate-600">${o.count} 节 · 双视角核对</span>
            </div>
            <div class="flex rounded-xl bg-slate-200/70 p-1">
              <button data-action="detail-tab" data-tab="student" class="flex-1 rounded-lg py-1.5 text-[12px] font-bold transition ${state.detailTab === 'student' ? 'bg-white text-indigo-700' : 'text-slate-500'}">按学生分组</button>
              <button data-action="detail-tab" data-tab="teacher" class="flex-1 rounded-lg py-1.5 text-[12px] font-bold transition ${state.detailTab === 'teacher' ? 'bg-white text-indigo-700' : 'text-slate-500'}">按教师分组</button>
            </div>
            ${state.detailTab === 'teacher' ? teacherDetailGroups(o) : studentDetailGroups(o)}

            ${groupClassSection(o)}

            <div class="flex items-start gap-2 rounded-xl border border-slate-200 bg-slate-100 px-3 py-2.5">
              ${icon('lock', 'mt-0.5 h-4 w-4 shrink-0 text-slate-500')}
              <div class="min-w-0">
                <div class="text-[12px] font-bold text-slate-700">财务归档快照 · 提交后明细与金额不可变</div>
                <div class="mt-0.5 text-[12px] leading-relaxed text-slate-500">课次关联、金额计算与打款凭证在提交后永久锁定，后续外部数据变动不影响本单。</div>
              </div>
            </div>

            <div class="flex items-center justify-between px-1 pt-1">
              <h3 class="text-[16px] font-bold text-slate-900">全链路流转</h3>
              <span class="text-[12px] font-medium text-slate-600">审计留痕</span>
            </div>
            <div class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3">${orderTimeline(o)}</div>
          </div>

          <footer class="shrink-0 border-t border-slate-200 bg-white p-3">${orderFooter(o)}</footer>
        </section>
      </div>`;
    }

    function handoverConfirmModal() {
      return modalShell(`
        <div class="space-y-3 p-4">
          <div class="space-y-1 text-center">
            <div class="mx-auto grid h-11 w-11 place-items-center rounded-2xl bg-amber-50 text-amber-700">${icon('user-round-check', 'h-5 w-5')}</div>
            <h3 class="text-[16px] font-bold text-slate-900">确认移交款项已到账？</h3>
            <p class="text-[12px] font-medium text-slate-500">确认后 20 节 TS 的资金持有人改绑为平台</p>
          </div>
          <div class="space-y-1.5 rounded-xl bg-slate-50 p-3 text-[14px]">
            <div class="flex justify-between"><span class="text-slate-600">离职班长</span><span class="font-semibold text-slate-800">Tom</span></div>
            <div class="flex justify-between"><span class="text-slate-600">移交金额</span><span class="font-semibold text-slate-800">4,400 积分</span></div>
            <div class="flex justify-between"><span class="text-slate-600">改绑课次</span><span class="font-semibold text-slate-800">20 节</span></div>
          </div>
          <div class="flex gap-2">
            <button data-action="close-modal" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
            <button data-action="do-handover" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-1 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:opacity-40">确认移交收款</button>
          </div>
        </div>`);
    }

    function renderModal() {
      const root = $('modalRoot');
      if (!state.modal) { root.innerHTML = ''; return; }
      const type = state.modal.type;
      if (type === 'rollback') root.innerHTML = rollbackModal();
      else if (type === 'confirm') root.innerHTML = confirmModal(state.modal.id);
      else if (type === 'reject') root.innerHTML = rejectModal(state.modal.id);
      else if (type === 'voucher') root.innerHTML = voucherModal(state.modal.id);
      else if (type === 'order') root.innerHTML = orderDetailModal(state.modal.id);
      else if (type === 'handover') root.innerHTML = handoverConfirmModal();
      else root.innerHTML = '';
    }

    /* ------------------------------------------------------------------
     * 业务动作
     * ------------------------------------------------------------------ */
    function submitOrder() {
      if (!requireOnline('离线模式不可提交转账单')) return;
      const d = draftOrder();
      if (!d || !state.voucher) return toast('请先上传打款凭证');
      d.status = 'PENDING_CONFIRMATION';
      d.voucher = true;
      d.time = '11-10 09:42';
      let locked = 0;
      state.ts.forEach((t) => {
        if (t.status === 'FINISHED_PENDING_SETTLEMENT' && locked < 2) {
          t.status = 'TRANSFER_LOCKED';
          locked++;
        }
      });
      state.drawer = false;
      state.voucher = false;
      state.filter = 'ALL';
      state.detailTab = 'student';
      state.modal = { type: 'order', id: d.id };
      renderAll();
      toast('转账单已提交，等待平台确认');
    }

    function openRollback(id) {
      if (!requireOnline('离线模式不可回退课次')) return;
      const t = state.ts.find((x) => x.id === id);
      if (!t) return;
      if (t.status !== 'FINISHED_PENDING_SETTLEMENT') {
        if (t.status === 'TRANSFER_LOCKED') return toast('该课次已转账锁定，暂不可回退');
        if (t.status === 'COLLECTED') {
          console.warn('409 TIMESLOT_ALREADY_SETTLED');
          return toast('该课次已完成资金归集，不可回退');
        }
        return toast('该课次当前不可回退');
      }
      state.rollId = id;
      state.rollReason = '';
      state.modal = { type: 'rollback' };
      renderAll();
    }

    function confirmRollback() {
      if (!requireOnline('离线模式不可回退课次')) return;
      const t = state.ts.find((x) => x.id === state.rollId);
      if (!t || !state.rollReason.trim()) return;
      t.status = 'CANCELLED';
      t.reborn = true;
      const newId = `ts_new${String(state.tsSeq++).padStart(6, '0')}`;
      state.ts.unshift({
        id: newId, date: '—', weekday: '待排期', time: '—', student: t.student, parent: t.parent,
        teacher: t.teacher, kind: t.kind, points: t.points, status: 'PENDING_SCHEDULE'
      });
      state.modal = null;
      state.rollReason = '';
      renderAll();
      toast(`已回退，原购课单补生 1 节待排期 TS（${newId}）`);
    }

    function confirmCollect(id) {
      if (!requireOnline('离线模式不可确认收款')) return;
      const o = state.orders.find((x) => x.id === id);
      if (!o) return;
      o.status = 'COMPLETED';
      o.confirmTime = '11-10 10:40';
      o.confirmBy = 'Sarah';
      state.ts.forEach((t) => { if (t.status === 'TRANSFER_LOCKED') t.status = 'COLLECTED'; });
      const returnId = state.detailReturnId;
      state.detailReturnId = null;
      state.modal = returnId ? { type: 'order', id: returnId } : null;
      renderAll();
      toast(`${id} 已确认收款，${o.count} 节流转为已归集`);
    }

    function confirmReject() {
      if (!requireOnline('离线模式不可驳回转账单')) return;
      const o = state.orders.find((x) => x.id === state.rejectId);
      if (!o || !state.rejectReason.trim()) return;
      o.status = 'CANCELLED';
      o.reject = state.rejectReason;
      o.rejectTime = '11-10 10:42';
      state.ts.forEach((t) => { if (t.status === 'TRANSFER_LOCKED') t.status = 'FINISHED_PENDING_SETTLEMENT'; });
      if (o.type === 'RESIGNATION_HANDOVER') state.handover = 'draft';
      const returnId = state.detailReturnId;
      state.detailReturnId = null;
      state.modal = returnId ? { type: 'order', id: returnId } : null;
      state.rejectReason = '';
      renderAll();
      toast('转账单已驳回，关联课次解除锁定');
    }

    function confirmHandover() {
      if (!requireOnline('离线模式不可确认移交')) return;
      const o = resignationOrder();
      if (o) { o.status = 'COMPLETED'; o.confirmTime = '11-10 10:45'; }
      state.handover = 'completed';
      state.modal = null;
      renderAll();
      toast('移交完成，20 节 TS 已改绑至平台');
    }

    function submitHandover() {
      if (!requireOnline('离线模式不可提交移交单')) return;
      if (!state.tomVoucher) return toast('请先上传打款凭证');
      state.orders = state.orders.filter((o) => o.type !== 'RESIGNATION_HANDOVER');
      state.orders.unshift({
        id: 'tro_tom00001', type: 'RESIGNATION_HANDOVER', monitor: 'Tom', count: 20,
        gross: 4400, penalty: 0, transfer: 4400,
        status: 'PENDING_CONFIRMATION', time: '11-10 10:15', voucher: true, period: '离职移交'
      });
      state.handover = 'pending';
      renderAll();
      toast('移交单已提交，等待平台确认');
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    function handleAction(el) {
      const action = el.dataset.action;
      if (action === 'role') return setRole(el.dataset.role, el.dataset.view);
      if (action === 'view') return setView(el.dataset.view);
      if (action === 'device') return setDevice(el.dataset.device);
      if (action === 'network') return setOnline(el.dataset.online);
      if (action === 'reset') return resetPrototype();
      if (action === 'toast') return toast(el.dataset.message || '');
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'filter') { state.filter = el.dataset.filter || 'ALL'; renderAll(); resetScroll(); return; }
      if (action === 'admin-filter') { state.adminFilter = el.dataset.filter || 'ALL'; renderAll(); resetScroll(); return; }
      if (action === 'open-drawer') return openDrawer();
      if (action === 'close-drawer') return closeDrawer();
      if (action === 'tab') return setTab(el.dataset.tab);
      if (action === 'add-voucher') {
        if (!requireOnline('离线模式不可上传凭证')) return;
        state.voucher = true; renderAll(); return;
      }
      if (action === 'remove-voucher') { state.voucher = false; renderAll(); return; }
      if (action === 'add-tom-voucher') {
        if (!requireOnline('离线模式不可上传凭证')) return;
        state.tomVoucher = true; renderAll(); return;
      }
      if (action === 'remove-tom-voucher') { state.tomVoucher = false; renderAll(); return; }
      if (action === 'submit-order') return submitOrder();
      if (action === 'submit-handover') return submitHandover();
      if (action === 'rollback') return openRollback(el.dataset.id);
      if (action === 'confirm-rollback') return confirmRollback();
      if (action === 'open-order') {
        state.detailTab = 'student';
        state.detailReturnId = null;
        state.modal = { type: 'order', id: el.dataset.id };
        renderAll();
        return;
      }
      if (action === 'copy-order') return copyOrderId(el.dataset.id);
      if (action === 'detail-tab') {
        state.detailTab = el.dataset.tab === 'teacher' ? 'teacher' : 'student';
        renderAll();
        return;
      }
      if (action === 'confirm-collect') {
        if (state.modal && state.modal.type === 'order') state.detailReturnId = state.modal.id;
        state.modal = { type: 'confirm', id: el.dataset.id };
        renderAll();
        return;
      }
      if (action === 'do-collect') return confirmCollect(el.dataset.id);
      if (action === 'reject') {
        if (!requireOnline('离线模式不可驳回转账单')) return;
        if (state.modal && state.modal.type === 'order') state.detailReturnId = state.modal.id;
        state.rejectId = el.dataset.id; state.rejectReason = ''; state.modal = { type: 'reject', id: el.dataset.id }; renderAll(); return;
      }
      if (action === 'do-reject') return confirmReject();
      if (action === 'voucher') {
        if (state.modal && state.modal.type === 'order') state.detailReturnId = state.modal.id;
        state.modal = { type: 'voucher', id: el.dataset.id };
        renderAll();
        return;
      }
      if (action === 'confirm-handover') {
        if (!requireOnline('离线模式不可确认移交')) return;
        state.modal = { type: 'handover' }; renderAll(); return;
      }
      if (action === 'do-handover') return confirmHandover();
      if (action === 'close-modal') {
        if (state.detailReturnId) {
          state.modal = { type: 'order', id: state.detailReturnId };
          state.detailReturnId = null;
        } else {
          state.modal = null;
        }
        renderAll();
        return;
      }
    }

    document.getElementById('console').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (el) handleAction(el);
    });

    document.getElementById('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (el) handleAction(el);
    });

    document.getElementById('frame').addEventListener('input', (event) => {
      if (event.target.id === 'rollReason') {
        state.rollReason = event.target.value;
        const count = $('rollCount');
        if (count) count.textContent = `${state.rollReason.length}/200`;
        const btn = $('btnRollConfirm');
        if (btn) btn.disabled = !state.rollReason.trim() || state.online === 'off';
      }
      if (event.target.id === 'rejectReason') {
        state.rejectReason = event.target.value;
        const count = $('rejectCount');
        if (count) count.textContent = `${state.rejectReason.length}/200`;
        const btn = $('btnRejectConfirm');
        if (btn) btn.disabled = !state.rejectReason.trim() || state.online === 'off';
      }
    });

    function renderPlaceholder() {
      const item = (NAVS[state.role] || []).find((n) => n.id === state.navTab);
      if (!item) return '<div class="p-8 text-center text-[14px] font-medium text-slate-600">页面不存在</div>';
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">${esc(item.cta || '前往')}</a>` : ''}
        <button data-action="nav" data-tab="${roleMeta().boardTab}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回资金归集</button>
      </div>`;
    }

    renderAll();
  </script>
</body>
</html>

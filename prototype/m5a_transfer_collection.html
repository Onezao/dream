      return type === 'RESIGNATION_HANDOVER' ? '离职移交' : '周结上交';
    }

    function weeklyOrders() {
      return state.orders.filter((o) => o.type === 'WEEKLY_SETTLEMENT');
    }

    function draftOrder() {
      return weeklyOrders().find((o) => o.monitor === 'Leo' && o.status === 'DRAFT');
    }

    function pendingWeeklyOrders() {
      return weeklyOrders().filter((o) => o.status === 'PENDING_CONFIRMATION');
    }

    function resignationOrder() {
      return state.orders.find((o) => o.type === 'RESIGNATION_HANDOVER');
    }

    function boardAlert() {
      if (state.role === 'tom') return state.handover !== 'completed';
      if (state.role === 'sarah') {
        const handoverPending = resignationOrder() && resignationOrder().status === 'PENDING_CONFIRMATION';
        return pendingWeeklyOrders().length > 0 || handoverPending;
      }
      return weeklyOrders().some((o) => o.monitor === 'Leo' && ['DRAFT', 'PENDING_CONFIRMATION'].includes(o.status));
    }

    function toast(message) {
      const el = $('toast');
      el.textContent = message;
      el.classList.remove('hidden');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => el.classList.add('hidden'), 2400);
    }

    function requireOnline(message = '离线模式不可用') {
      if (state.online === 'off') {
        toast(message);
        return false;
      }
      return true;
    }

    function resetScroll() {
      const el = $('content');
      if (el) el.scrollTop = 0;
    }

    function emptyState(title, sub) {
      return `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center">
        <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-slate-50 text-slate-300">${icon('inbox', 'h-6 w-6')}</div>
        <p class="mt-3 text-[14px] font-bold text-slate-700">${esc(title)}</p>
        ${sub ? `<p class="mt-0.5 text-[12px] text-slate-400">${esc(sub)}</p>` : ''}
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 控制台与外壳
     * ------------------------------------------------------------------ */
    function syncConsole() {
      document.querySelectorAll('#console [data-action="role"]').forEach((btn) => {
        const on = btn.dataset.role === state.role;
        btn.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;
      });
      document.querySelectorAll('#console [data-action="device"]').forEach((btn) => {
        const on = btn.dataset.device === state.device;
        btn.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;
      });
      document.querySelectorAll('#console [data-action="network"]').forEach((btn) => {
        const on = btn.dataset.online === state.online;
        btn.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;
      });
      $('viewSwitch').innerHTML = (VIEWS[state.role] || []).map(([id, label]) => {
        const on = state.view === id;
        return `<button data-action="view" data-view="${id}" class="rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}">${label}</button>`;
      }).join('');
    }

    function renderBanner() {
      const b = BANNERS[state.role];
      return `<header class="relative flex h-[68px] shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${b.gradient} px-4 text-white">
        ${b.pattern}
        <div class="relative flex min-w-0 items-center gap-2.5">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${b.initial}</span>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="truncate text-[16px] font-bold">${esc(b.brand)}</span>
              <span class="shrink-0 rounded-full bg-white/20 px-2 py-0.5 text-[12px] font-bold">${esc(b.role)}</span>
            </div>
            <div class="truncate text-[12px] text-white/70">${esc(b.subtitle)}</div>
          </div>
        </div>
        <button data-action="toast" data-message="暂无新消息" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
          ${icon('bell', 'h-4 w-4')}
          <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-rose-400 ring-1 ring-white/50"></span>
        </button>
      </header>`;
    }

    function renderNav() {
      const items = NAVS[state.role] || [];
      const alert = boardAlert();
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${items.map((item) => {
            const on = state.navTab === item.id;
            const dot = item.id === roleMeta().boardTab && alert
              ? `<span class="absolute -right-1 top-0 h-2 w-2 rounded-full bg-amber-500 ring-2 ring-white"></span>` : '';
            return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-400'}">
              <span class="relative">${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}${dot}</span>
              <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      const contentEl = $('content');
      const contentTop = contentEl.scrollTop;
      const drawerEl = document.querySelector('[data-drawer-scroll]');
      const drawerTop = drawerEl ? drawerEl.scrollTop : 0;

      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线模式：可查看台账，提交、回退、确认与凭证上传不可用`
        : '';

      contentEl.innerHTML = state.page === 'placeholder' ? renderPlaceholder() : renderContent();
      $('bottomnav').innerHTML = renderNav();
      renderDrawer();
      renderModal();
      syncConsole();

      contentEl.scrollTop = contentTop;
      const nextDrawer = document.querySelector('[data-drawer-scroll]');
      if (nextDrawer) nextDrawer.scrollTop = drawerTop;
      if (window.lucide) lucide.createIcons();
    }

    function setRole(role, view) {
      if (!BANNERS[role]) return;
      state.role = role;
      state.view = view || (role === 'leo' ? 'overview' : role === 'sarah' ? 'audit' : 'handover');
      state.device = 'phone';
      state.navTab = role === 'sarah' ? 'settings' : 'me';
      state.page = 'workspace';
      state.drawer = false;
      state.modal = null;
      renderAll();
      resetScroll();
      toast(`已切换到${role === 'sarah' ? '管理员 Sarah' : role === 'tom' ? '离职班长 Tom' : '班长 Leo'}`);
    }

    function setView(view) {
      if (!(VIEWS[state.role] || []).some(([id]) => id === view)) return;
      state.view = view;
      state.page = 'workspace';
      state.navTab = roleMeta().boardTab;
      state.modal = null;
      renderAll();
      resetScroll();
    }

    function setDevice(device) {
      state.device = device;
      renderAll();
    }

    function setOnline(on) {
      state.online = on;
      if (on === 'off') state.modal = null;
      renderAll();
      if (on === 'off') toast('离线模式：资金提交与回退不可用');
    }

    function navTo(tab) {
      const item = (NAVS[state.role] || []).find((n) => n.id === tab);
      if (!item) return;
      state.navTab = tab;
      state.page = item.board ? 'workspace' : 'placeholder';
      state.drawer = false;
      state.modal = null;
      renderAll();
      resetScroll();
    }

    function resetPrototype() {
      state = initialState();
      state.navTab = roleMeta().boardTab;
      renderAll();
      resetScroll();
      toast('演示数据已重置');
    }

    function renderContent() {
      if (state.role === 'leo') return state.view === 'ts' ? renderLeoTS() : renderLeoOverview();
      if (state.role === 'sarah') return state.view === 'handover' ? renderSarahHandover() : renderSarahAudit();
      return renderTomHandover();
    }

    function pageHeader(title, subtitle, chipText) {
      return `<div class="flex items-end justify-between gap-3 px-1">
        <div class="min-w-0">
          <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(title)}</h1>
          <p class="mt-0.5 text-[12px] font-medium text-slate-400">${esc(subtitle)}</p>
        </div>
        ${chipText ? `<span class="shrink-0 rounded-full border border-indigo-100 bg-indigo-50 px-2.5 py-1 text-[12px] font-bold text-indigo-700">${esc(chipText)}</span>` : ''}
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 班长：交割总览
     * ------------------------------------------------------------------ */
    function renderLeoOverview() {
      const mine = state.orders.filter((o) => o.monitor === 'Leo' && o.type === 'WEEKLY_SETTLEMENT');
      const list = state.filter === 'ALL' ? mine : mine.filter((o) => o.status === state.filter);
      const draft = draftOrder();
      const period = draft ? draft.period : '11.03 - 11.09';
      const filters = [['ALL', '全部'], ['DRAFT', '待上交'], ['PENDING_CONFIRMATION', '待平台确认'], ['COMPLETED', '已完成'], ['CANCELLED', '已作废']]
        .map(([key, label]) => `<button data-action="filter" data-filter="${key}" class="h-8 shrink-0 rounded-lg border px-2.5 text-[12px] font-bold transition ${state.filter === key ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">${label}</button>`).join('');
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('转账交割', `${period} · 1 积分 = 1 元`, '班长')}

        <section class="rounded-2xl border border-slate-200/80 bg-white p-3 shadow-sm">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5 text-[12px] font-bold text-slate-700">${icon('workflow', 'h-4 w-4 text-indigo-600')}周结节奏</div>
            <span class="font-mono text-[12px] font-medium text-slate-400">2026-W45</span>
          </div>
          <div class="mt-2 grid grid-cols-5 gap-1">
            ${TIMELINE.map((s) => `<div class="rounded-lg border px-1 py-1.5 text-center ${s.current ? 'border-amber-200 bg-amber-50' : 'border-slate-100 bg-slate-50'}">
              <div class="mx-auto h-1.5 w-1.5 rounded-full ${s.current ? 'bg-amber-500' : s.done ? 'bg-emerald-500' : 'bg-slate-300'}"></div>
              <div class="mt-1 font-mono text-[12px] font-bold ${s.current ? 'text-amber-800' : 'text-slate-600'}">${s.time}</div>
              <div class="text-[12px] font-medium ${s.current ? 'text-amber-700' : 'text-slate-400'}">${s.label}</div>
              <div class="text-[12px] ${s.current ? 'text-amber-700' : 'text-slate-400'}">${s.sub}</div>
            </div>`).join('')}
          </div>
        </section>

        <section class="rounded-2xl border ${TONES.emerald.card} p-4 shadow-sm">
          <div class="flex items-center justify-between text-[12px] font-medium ${TONES.emerald.sub}">
            <span>${draft ? '待上交账面总额' : '本周已提交账面总额'}</span>
            <span class="font-mono">${TOTALS.count} 节 · 7 位学员</span>
          </div>
          <div class="mt-1.5 flex items-end gap-2">
            <span class="font-mono text-[18px] font-bold ${TONES.emerald.title}">${fmt(TOTALS.gross)}</span>
            <span class="mb-0.5 text-[12px] ${TONES.emerald.sub}">积分</span>
          </div>
          <div class="mt-2.5 grid grid-cols-3 gap-1.5">
            <div class="rounded-lg bg-white/60 px-2 py-1.5">
              <div class="text-[12px] font-medium ${TONES.emerald.sub}">账面总实收</div>
              <div class="mt-0.5 font-mono text-[16px] font-bold ${TONES.emerald.right}">${fmt(TOTALS.gross)}</div>
            </div>
            <div class="rounded-lg bg-white/60 px-2 py-1.5">
              <div class="text-[12px] font-medium ${TONES.emerald.sub}">自留盈余</div>
              <div class="mt-0.5 font-mono text-[16px] font-bold ${TONES.emerald.right}">${fmt(TOTALS.retained)}</div>
            </div>
            <div class="rounded-lg bg-white/60 px-2 py-1.5">
              <div class="text-[12px] font-medium ${TONES.emerald.sub}">应转平台</div>
              <div class="mt-0.5 font-mono text-[16px] font-bold ${TONES.emerald.right}">${fmt(TOTALS.transfer)}</div>
            </div>
          </div>
          <div class="mt-1.5 flex items-center justify-between text-[12px] font-medium ${TONES.emerald.sub}">
            <span>1v1 <b class="font-mono">2,260</b> · 小班 <b class="font-mono">900</b></span>
            <span>含亏损贴补 <b class="font-mono">${TOTALS.subsidy}</b></span>
          </div>
        </section>

        <button data-action="open-drawer" ${!draft || state.online === 'off' ? 'disabled' : ''} class="flex h-11 w-full items-center justify-center gap-1.5 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">
          ${icon('send', 'h-4 w-4')}${draft ? '发起周度资金上交' : '本周已提交，等待平台确认'}
        </button>

        <div class="flex items-center justify-between px-1 pt-1">
          <h2 class="text-[16px] font-bold text-slate-900">历史转账单</h2>
          <button data-action="view" data-view="ts" class="text-[12px] font-bold text-indigo-600 hover:text-indigo-800">待结算课次 · ${state.ts.filter((t) => t.status === 'FINISHED_PENDING_SETTLEMENT').length} 节</button>
        </div>

        <div class="flex gap-1.5 overflow-x-auto pb-0.5">${filters}</div>
        <div class="${grid}">${list.length ? list.map(orderCard).join('') : emptyState('暂无转账单', '当前筛选条件下没有记录')}</div>
      </div>`;
    }

    function orderCard(o) {
      const meta = statusMeta(o.status);
      const T = TONES[meta.tone];
      const isDraft = o.status === 'DRAFT';
      const action = isDraft
        ? `<button data-action="open-drawer" ${state.online === 'off' ? 'disabled' : ''} class="h-8 rounded-lg ${T.action} px-2.5 text-[12px] font-bold disabled:opacity-50">去上交</button>`
        : `<button data-action="open-order" data-id="${o.id}" class="h-8 rounded-lg border ${SOFT_BTN[meta.tone]} px-2.5 text-[12px] font-bold">查看详情</button>`;
      return `<article data-action="open-order" data-id="${o.id}" role="button" tabindex="0" class="cursor-pointer rounded-2xl border p-3.5 shadow-sm transition active:scale-[0.995] ${T.card}">
        <div class="flex items-center justify-between gap-2">
          <span class="truncate font-mono text-[12px] ${T.sub}">${esc(o.id)}</span>
          ${chip(meta.label, meta.tone)}
        </div>
        <div class="mt-2 flex items-end justify-between gap-3">
          <div>
            <div class="text-[12px] ${T.sub}">${typeLabel(o.type)} · ${o.count} 节 · ${esc(o.period)}</div>
            <div class="mt-0.5 font-mono text-[18px] font-bold ${T.right}">${fmt(o.transfer)} <span class="text-[12px] font-medium ${T.sub}">积分</span></div>
          </div>
          <div class="text-right text-[12px] leading-relaxed ${T.sub}">
            <div>账面 ${fmt(o.gross)}</div>
            <div>自留 ${fmt(o.retained)}</div>
          </div>
        </div>
        ${o.status === 'CANCELLED' && o.reject ? `<div class="mt-2 rounded-lg border border-rose-200 bg-white/60 px-2.5 py-1.5 text-[12px] font-medium text-rose-800">${esc(o.reject)}</div>` : ''}
        <div class="mt-2.5 flex items-center justify-between border-t border-black/5 pt-2 text-[12px] ${T.sub}">
          <span class="flex min-w-0 items-center gap-1.5">
            ${o.voucher ? `<button data-action="voucher" data-id="${o.id}" class="block h-6 w-5 shrink-0 overflow-hidden rounded-sm border border-black/10 bg-white/70">${miniReceipt()}</button>` : `<span>凭证：待上传</span>`}
            <span class="truncate">${esc(o.time)}</span>
          </span>
          ${action}
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 班长：待结算课次与异常回退
     * ------------------------------------------------------------------ */
    function renderLeoTS() {
      const rows = state.ts.map(tsCard).join('');
      const wrapper = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';
      const cancelled = state.ts.filter((t) => t.status === 'CANCELLED').length;
      const pending = state.ts.filter((t) => t.status === 'FINISHED_PENDING_SETTLEMENT').length;
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('待结算课次', `最近 ${state.ts.length} 节 · 可回退 ${pending} 节 · 已取消 ${cancelled} 节`, '班长')}
        <button data-action="view" data-view="overview" class="flex items-center gap-1 text-[14px] font-semibold text-slate-500">${icon('chevron-left', 'h-4 w-4')}返回交割总览</button>
        <div class="flex items-start gap-2 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-amber-900">
          ${icon('triangle-alert', 'h-4 w-4 shrink-0 text-amber-700')}
          <span>每节已结课课次可回退 1 次。回退后原购课单自动补生 1 节待排期 TS，并物理剔除课酬与工具费。</span>
        </div>
        <div class="${wrapper}">${rows}</div>
      </div>`;
    }

    function tsCard(t) {
      const meta = tsMeta(t.status);
      const T = TONES[meta.tone];
      let action = '';
      if (t.status === 'FINISHED_PENDING_SETTLEMENT') {
        action = `<button data-action="rollback" data-id="${t.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 rounded-lg border border-rose-200 bg-rose-50 px-2.5 text-[12px] font-bold text-rose-700 hover:bg-rose-100 disabled:opacity-40">未上课回退</button>`;
      } else if (t.status === 'TRANSFER_LOCKED') {
        action = `<span class="inline-flex items-center gap-1 text-[12px] font-medium text-slate-400">${icon('lock', 'h-3.5 w-3.5')}转账锁定，暂不可回退</span>`;
      } else if (t.status === 'COLLECTED') {
        action = `<span class="inline-flex items-center gap-1 text-[12px] font-medium text-emerald-700">${icon('lock', 'h-3.5 w-3.5')}已归集，禁止回退</span>`;
      } else if (t.status === 'CANCELLED') {
        action = `<span class="text-[12px] font-medium text-slate-400">已补生 1 节待排期</span>`;
      } else {
        action = `<span class="text-[12px] font-medium text-indigo-700">待排期 · 可重新约课</span>`;
      }
      return `<article class="rounded-2xl border border-slate-200/80 bg-white p-3.5 shadow-sm ${t.status === 'COLLECTED' || t.status === 'CANCELLED' ? 'bg-slate-50/70' : ''}">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="truncate text-[16px] font-bold text-slate-900">${esc(t.date)} ${esc(t.weekday)} ${esc(t.time)}</span>
              ${t.transfer ? `<span class="rounded border border-amber-200 bg-amber-50 px-1.5 py-0.5 text-[12px] font-bold text-amber-800">转让</span>` : ''}
            </div>
            <div class="mt-1 text-[14px] font-medium text-slate-600">${esc(t.student)} · ${esc(t.teacher)}</div>
            <div class="text-[12px] font-medium text-slate-400">${esc(t.kind)} · ${t.points} 积分</div>
          </div>
          ${chip(meta.label, meta.tone)}
        </div>
        <div class="mt-2.5 flex items-center justify-between gap-2 border-t border-slate-100 pt-2">
          <span class="font-mono text-[12px] text-slate-400">${esc(t.id)}</span>
          ${action}
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 管理员：资金归集审核
     * ------------------------------------------------------------------ */
    function renderSarahAudit() {
      const list = weeklyOrders()
        .filter((o) => o.status !== 'DRAFT')
        .filter((o) => state.adminFilter === 'ALL' || o.status === state.adminFilter);
      const pending = pendingWeeklyOrders();
      const pendingTotal = pending.reduce((sum, o) => sum + o.transfer, 0);
      const filters = [['PENDING_CONFIRMATION', '待确认'], ['ALL', '全部'], ['COMPLETED', '已完成'], ['CANCELLED', '已作废']]
        .map(([key, label]) => `<button data-action="admin-filter" data-filter="${key}" class="h-8 shrink-0 rounded-lg border px-2.5 text-[12px] font-bold transition ${state.adminFilter === key ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">${label}</button>`).join('');
      return `<div class="mx-auto w-full max-w-[720px] space-y-3 p-4 pb-10">
        ${pageHeader('资金归集审核', '全平台转账单 · 银行凭证核验', '管理员')}
        <div class="flex items-center justify-between rounded-2xl border border-slate-200/80 bg-white px-3.5 py-3 shadow-sm">

    function orderTimeline(o) {
      const rows = [];

        rows.push({ text: '待班长上传凭证并提交', time: '', current: true });

        rows.push({ text: '班长提交转账单', time: o.time, done: true });
        rows.push({ text: '平台待确认收款', time: '', current: true });
      } else if (o.status === 'COMPLETED') {
        rows.push({ text: '班长提交转账单', time: o.time, done: true });
        rows.push({ text: '平台确认收款', time: o.confirmTime || '', done: true });
        rows.push({ text: `${o.count} 节流转为已归集`, time: '', done: true });
      } else {
        rows.push({ text: '班长提交转账单', time: o.time, done: true });
        rows.push({ text: `平台驳回：${o.reject || ''}`, time: o.rejectTime || '', failed: true });
        rows.push({ text: `${o.count} 节解除锁定`, time: '', done: true });

            <p class="text-[12px] font-medium text-slate-500">确认后 20 节 TS 的资金持有人改绑为平台</p>
          </div>
          <div class="space-y-1.5 rounded-xl bg-slate-50 p-3 text-[14px]">
            <div class="flex justify-between"><span class="text-slate-400">离职班长</span><span class="font-semibold text-slate-800">Tom</span></div>
            <div class="flex justify-between"><span class="text-slate-400">移交金额</span><span class="font-semibold text-slate-800">4,400 积分</span></div>
            <div class="flex justify-between"><span class="text-slate-400">改绑课次</span><span class="font-semibold text-slate-800">20 节</span></div>
          </div>
          <div class="flex gap-2">
            <button data-action="close-modal" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
            <button data-action="do-handover" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-1 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:opacity-40">确认移交收款</button>
          </div>
        </div>`);
    }

    function renderModal() {
      const root = $('modalRoot');
      if (!state.modal) { root.innerHTML = ''; return; }
      const type = state.modal.type;
      if (type === 'rollback') root.innerHTML = rollbackModal();
      else if (type === 'confirm') root.innerHTML = confirmModal(state.modal.id);
      else if (type === 'reject') root.innerHTML = rejectModal(state.modal.id);
      else if (type === 'voucher') root.innerHTML = voucherModal(state.modal.id);
      else if (type === 'order') root.innerHTML = orderDetailModal(state.modal.id);
      else if (type === 'handover') root.innerHTML = handoverConfirmModal();
      else root.innerHTML = '';
    }

    /* ------------------------------------------------------------------
     * 业务动作
     * ------------------------------------------------------------------ */
    function submitOrder() {
      if (!requireOnline('离线模式不可提交转账单')) return;
      const d = draftOrder();
      if (!d || !state.voucher) return toast('请先上传打款凭证');
      d.status = 'PENDING_CONFIRMATION';
      d.voucher = true;
      d.time = '11-10 09:42';
      let locked = 0;
      state.ts.forEach((t) => {
        if (t.status === 'FINISHED_PENDING_SETTLEMENT' && locked < 2) {
          t.status = 'TRANSFER_LOCKED';
          locked++;
        }
      });
      state.drawer = false;
      state.voucher = false;
      state.filter = 'ALL';
      renderAll();
      toast('转账单已提交，等待平台确认');
    }

    function openRollback(id) {
      if (!requireOnline('离线模式不可回退课次')) return;
      const t = state.ts.find((x) => x.id === id);
      if (!t) return;
      if (t.status !== 'FINISHED_PENDING_SETTLEMENT') {
        if (t.status === 'TRANSFER_LOCKED') return toast('该课次已转账锁定，暂不可回退');
        if (t.status === 'COLLECTED') return toast('409 TIMESLOT_ALREADY_SETTLED · 已归集课次不可回退');
        return toast('该课次当前不可回退');
      }
      state.rollId = id;
      state.rollReason = '';
      state.modal = { type: 'rollback' };
      renderAll();
    }

    function confirmRollback() {
      if (!requireOnline('离线模式不可回退课次')) return;
      const t = state.ts.find((x) => x.id === state.rollId);
      if (!t || !state.rollReason.trim()) return;
      t.status = 'CANCELLED';
      t.reborn = true;
      const newId = `ts_new${String(state.tsSeq++).padStart(6, '0')}`;
      state.ts.unshift({
        id: newId, date: '—', weekday: '待排期', time: '—', student: t.student, parent: t.parent,
        teacher: t.teacher, kind: t.kind, points: t.points, status: 'PENDING_SCHEDULE'
      });
      state.modal = null;
      state.rollReason = '';
      renderAll();
      toast(`已回退，原购课单补生 1 节待排期 TS（${newId}）`);
    }

    function confirmCollect(id) {
      if (!requireOnline('离线模式不可确认收款')) return;
      const o = state.orders.find((x) => x.id === id);
      if (!o) return;
      o.status = 'COMPLETED';
      o.confirmTime = '11-11 10:40';
      state.ts.forEach((t) => { if (t.status === 'TRANSFER_LOCKED') t.status = 'COLLECTED'; });
      state.modal = null;
      renderAll();
      toast(`${id} 已确认收款，${o.count} 节流转为已归集`);
    }

    function confirmReject() {
      if (!requireOnline('离线模式不可驳回转账单')) return;
      const o = state.orders.find((x) => x.id === state.rejectId);
      if (!o || !state.rejectReason.trim()) return;
      o.status = 'CANCELLED';
      o.reject = state.rejectReason;
      o.rejectTime = '11-10 10:42';
      state.ts.forEach((t) => { if (t.status === 'TRANSFER_LOCKED') t.status = 'FINISHED_PENDING_SETTLEMENT'; });
      if (o.type === 'RESIGNATION_HANDOVER') state.handover = 'draft';
      state.modal = null;
      state.rejectReason = '';
      renderAll();
      toast('转账单已驳回，关联课次解除锁定');
    }

    function confirmHandover() {
      if (!requireOnline('离线模式不可确认移交')) return;
      const o = resignationOrder();
      if (o) { o.status = 'COMPLETED'; o.confirmTime = '11-10 10:45'; }
      state.handover = 'completed';
      state.modal = null;
      renderAll();
      toast('移交完成，20 节 TS 已改绑至平台');
    }

    function submitHandover() {
      if (!requireOnline('离线模式不可提交移交单')) return;
      if (!state.tomVoucher) return toast('请先上传打款凭证');
      state.orders = state.orders.filter((o) => o.type !== 'RESIGNATION_HANDOVER');
      state.orders.unshift({
        id: 'tro_tom00001', type: 'RESIGNATION_HANDOVER', monitor: 'Tom', count: 20,
        gross: 4400, retained: 0, subsidy: 0, transfer: 4400,
        status: 'PENDING_CONFIRMATION', time: '11-10 10:15', voucher: true, period: '离职移交'
      });
      state.handover = 'pending';
      renderAll();
      toast('移交单已提交，等待平台确认');
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    function handleAction(el) {
      const action = el.dataset.action;
      if (action === 'role') return setRole(el.dataset.role, el.dataset.view);
      if (action === 'view') return setView(el.dataset.view);
      if (action === 'device') return setDevice(el.dataset.device);
      if (action === 'network') return setOnline(el.dataset.online);
      if (action === 'reset') return resetPrototype();
      if (action === 'toast') return toast(el.dataset.message || '');
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'filter') { state.filter = el.dataset.filter || 'ALL'; renderAll(); resetScroll(); return; }
      if (action === 'admin-filter') { state.adminFilter = el.dataset.filter || 'ALL'; renderAll(); resetScroll(); return; }
      if (action === 'open-drawer') return openDrawer();
      if (action === 'close-drawer') return closeDrawer();
      if (action === 'tab') return setTab(el.dataset.tab);
      if (action === 'add-voucher') {
        if (!requireOnline('离线模式不可上传凭证')) return;
        state.voucher = true; renderAll(); return;
      }
      if (action === 'remove-voucher') { state.voucher = false; renderAll(); return; }
      if (action === 'add-tom-voucher') {
        if (!requireOnline('离线模式不可上传凭证')) return;
        state.tomVoucher = true; renderAll(); return;
      }
      if (action === 'remove-tom-voucher') { state.tomVoucher = false; renderAll(); return; }
      if (action === 'submit-order') return submitOrder();
      if (action === 'submit-handover') return submitHandover();
      if (action === 'rollback') return openRollback(el.dataset.id);
      if (action === 'confirm-rollback') return confirmRollback();
      if (action === 'open-order') { state.modal = { type: 'order', id: el.dataset.id }; renderAll(); return; }
      if (action === 'confirm-collect') { state.modal = { type: 'confirm', id: el.dataset.id }; renderAll(); return; }
      if (action === 'do-collect') return confirmCollect(el.dataset.id);
      if (action === 'reject') {
        if (!requireOnline('离线模式不可驳回转账单')) return;
        state.rejectId = el.dataset.id; state.rejectReason = ''; state.modal = { type: 'reject', id: el.dataset.id }; renderAll(); return;
      }
      if (action === 'do-reject') return confirmReject();
      if (action === 'voucher') { state.modal = { type: 'voucher', id: el.dataset.id }; renderAll(); return; }
      if (action === 'confirm-handover') {
        if (!requireOnline('离线模式不可确认移交')) return;
        state.modal = { type: 'handover' }; renderAll(); return;
      }
      if (action === 'do-handover') return confirmHandover();
      if (action === 'close-modal') { state.modal = null; renderAll(); return; }
    }

    document.getElementById('console').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (el) handleAction(el);
    });

    document.getElementById('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (el) handleAction(el);
    });

    document.getElementById('frame').addEventListener('input', (event) => {
      if (event.target.id === 'rollReason') {
        state.rollReason = event.target.value;
        const count = $('rollCount');
        if (count) count.textContent = `${state.rollReason.length}/200`;
        const btn = $('btnRollConfirm');
        if (btn) btn.disabled = !state.rollReason.trim() || state.online === 'off';
      }
      if (event.target.id === 'rejectReason') {
        state.rejectReason = event.target.value;
        const count = $('rejectCount');
        if (count) count.textContent = `${state.rejectReason.length}/200`;
        const btn = $('btnRejectConfirm');
        if (btn) btn.disabled = !state.rejectReason.trim() || state.online === 'off';
      }
    });

    function renderPlaceholder() {
      const item = (NAVS[state.role] || []).find((n) => n.id === state.navTab);
      if (!item) return '<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>';
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">打开对应原型</a>` : ''}
        <button data-action="nav" data-tab="${roleMeta().boardTab}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回资金归集</button>
      </div>`;
    }

    renderAll();
  </script>
</body>
</html>

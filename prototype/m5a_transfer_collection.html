          navigator.clipboard.writeText(text).catch((err) => console.warn('clipboard unavailable', err));
        }
      } catch (err) {
        console.warn('clipboard unavailable', err);
      }
      toast('单号已复制');
    }

    /* 独立详情页路由：支持哈希深链与浏览器前进/后退；返回按钮直接回到原列表 */
    function detailRouteHash(id, mode) {
      return `#order=${encodeURIComponent(id)}&mode=${encodeURIComponent(mode)}`;
    }

    function cleanSearch() {
      const search = new URLSearchParams(location.search);
      ['order', 'mode', 'tab'].forEach((key) => search.delete(key));
      const query = search.toString();
      return query ? `?${query}` : '';
    }

    function pushDetailRoute(order, mode) {
      try { history.pushState({ order: order.id, mode }, '', cleanSearch() + detailRouteHash(order.id, mode)); } catch (err) { console.warn('history unavailable', err); }
    }

    function clearDetailRoute() {
      try { history.replaceState(null, '', location.pathname + cleanSearch()); } catch (err) { console.warn('history unavailable', err); }
    }

    function requireOnline(message = '离线模式不可用') {
      if (state.online === 'off') {
        toast(message);
        return false;
      }
      return true;
    }

    function resetScroll() {
      const el = $('content');
      if (el) el.scrollTop = 0;
    }

    function emptyState(title, sub) {
      return `<div class="rounded-2xl border border-slate-200/80 bg-slate-50/70 px-6 py-10 text-center">
        <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-white text-slate-300">${icon('inbox', 'h-6 w-6')}</div>
        <p class="mt-3 text-[14px] font-bold text-slate-700">${esc(title)}</p>
        ${sub ? `<p class="mt-0.5 text-[12px] text-slate-600">${esc(sub)}</p>` : ''}
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 控制台与外壳
     * ------------------------------------------------------------------ */
    function syncConsole() {
      document.querySelectorAll('#console [data-action="role"]').forEach((btn) => {
        const on = btn.dataset.role === state.role;
        btn.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}`;
      });
      document.querySelectorAll('#console [data-action="device"]').forEach((btn) => {
        const on = btn.dataset.device === state.device;
        btn.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}`;
      });
      document.querySelectorAll('#console [data-action="network"]').forEach((btn) => {
        const on = btn.dataset.online === state.online;
        btn.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}`;
      });
      $('viewSwitch').innerHTML = (VIEWS[state.role] || []).map(([id, label]) => {
        const on = state.view === id;
        return `<button data-action="view" data-view="${id}" class="rounded-lg px-2.5 py-1.5 font-semibold transition ${on ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}">${label}</button>`;
      }).join('');
    }

    function renderBanner() {
      const b = BANNERS[state.role];
      return `<header class="relative flex h-[64px] shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${b.gradient} px-4 text-white">
        ${b.pattern}
        <div class="relative flex min-w-0 items-center gap-2.5">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${b.initial}</span>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="truncate text-[16px] font-bold">${esc(b.brand)}</span>
            </div>
            <div class="truncate text-[12px] text-white/70">${esc(b.subtitle)}</div>
          </div>
        </div>
        <button data-action="toast" data-message="暂无新消息" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
          ${icon('bell', 'h-4 w-4')}
          <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-rose-400 ring-1 ring-white/50"></span>
        </button>
      </header>`;
    }

    function renderNav() {
      const items = NAVS[state.role] || [];
      const alert = boardAlert();
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${items.map((item) => {
            const on = state.navTab === item.id;
            const dot = item.id === roleMeta().boardTab && alert
              ? `<span class="absolute -right-1 top-0 h-2 w-2 rounded-full bg-amber-500 ring-2 ring-white"></span>` : '';
            return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-600'}">
              <span class="relative">${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}${dot}</span>
              <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      const contentEl = $('content');
      const contentTop = contentEl.scrollTop;

      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线模式：可查看台账，提交、回退、确认与凭证上传不可用`
        : '';

      contentEl.innerHTML = state.page === 'placeholder' ? renderPlaceholder() : renderContent();
      $('pageActions').innerHTML = state.page === 'detail' ? renderDetailActions() : '';
      $('bottomnav').innerHTML = renderNav();
      renderModal();
      syncConsole();

      contentEl.scrollTop = contentTop;
      if (window.lucide) lucide.createIcons();
    }

    function setRole(role, view) {
      if (!BANNERS[role]) return;
      state.role = role;
      state.view = view || (role === 'leo' ? 'overview' : role === 'sarah' ? 'audit' : 'handover');
      state.device = 'phone';
      state.navTab = role === 'sarah' ? 'settings' : 'me';
      state.page = 'workspace';
      state.detailId = null;
      state.detailMode = 'view';
      state.voucher = false;
      state.modal = null;
      clearDetailRoute();
      renderAll();
      resetScroll();
      toast(`已切换到${role === 'sarah' ? '管理员 Sarah' : role === 'tom' ? '离职班长 Tom' : '班长 Leo'}`);
    }

    function setView(view) {
      if (!(VIEWS[state.role] || []).some(([id]) => id === view)) return;
      state.view = view;
      state.page = 'workspace';
      state.navTab = roleMeta().boardTab;
      state.detailId = null;
      state.detailMode = 'view';
      state.voucher = false;
      state.modal = null;
      clearDetailRoute();
      renderAll();
      resetScroll();
    }

    function setDevice(device) {
      state.device = device;
      renderAll();
    }

    function setOnline(on) {
      state.online = on;
      renderAll();
      if (on === 'off') toast('离线模式：资金提交与回退不可用');
    }

    function navTo(tab) {
      const item = (NAVS[state.role] || []).find((n) => n.id === tab);
      if (!item) return;
      state.navTab = tab;
      state.page = item.board ? 'workspace' : 'placeholder';
      state.detailId = null;
      state.detailMode = 'view';
      state.voucher = false;
      state.modal = null;
      clearDetailRoute();
      renderAll();
      resetScroll();
    }

    function resetPrototype() {
      state = initialState();
      state.navTab = roleMeta().boardTab;
      clearDetailRoute();
      renderAll();
      resetScroll();
      toast('演示数据已重置');
    }

    function renderContent() {
      if (state.page === 'detail') return renderOrderDetailPage();
      if (state.role === 'leo') return state.view === 'ts' ? renderLeoTS() : renderLeoOverview();
      if (state.role === 'sarah') return state.view === 'handover' ? renderSarahHandover() : state.view === 'anomaly' ? renderSarahAnomaly() : renderSarahAudit();
      return renderTomHandover();
    }

    function pageHeader(title, subtitle, chipText) {
      return `<div class="flex items-end justify-between gap-3 px-1">
        <div class="min-w-0">
          <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(title)}</h1>
          <p class="mt-0.5 text-[12px] font-medium text-slate-600">${esc(subtitle)}</p>
        </div>
        ${chipText ? `<span class="shrink-0 rounded-full border border-indigo-100 bg-indigo-50 px-2.5 py-1 text-[12px] font-bold text-indigo-700">${esc(chipText)}</span>` : ''}
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 班长：周转账单 & 托管资产看板
     * ------------------------------------------------------------------ */
    function renderLeoOverview() {
      const topSwitch = `<div class="flex rounded-xl bg-slate-200/70 p-1">
        <button data-action="leo-tab" data-tab="orders" class="flex-1 rounded-lg py-1.5 text-[12px] font-bold transition ${state.leoTab === 'orders' ? 'bg-white text-indigo-700' : 'text-slate-600'}">周转账单</button>
        <button data-action="leo-tab" data-tab="custody" class="flex-1 rounded-lg py-1.5 text-[12px] font-bold transition ${state.leoTab === 'custody' ? 'bg-white text-indigo-700' : 'text-slate-600'}">托管资产</button>
      </div>`;

      if (state.leoTab === 'custody') {
        return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
          ${pageHeader('托管资产', '仅汇总 holder_id == 本人 且尚未结课的有效 TS')}
          ${topSwitch}
          ${renderLeoCustody()}
        </div>`;
      }

      const mine = state.orders.filter((o) => o.monitor === 'Leo' && o.type === 'WEEKLY_SETTLEMENT');
      const list = state.filter === 'ALL'
        ? mine
        : mine.filter((o) => o.status === state.filter);
      const draft = draftOrder();
      const pendingCount = mine.filter((o) => o.status === 'PENDING_CONFIRMATION').length;
      const period = draft ? draft.period : '11.02 - 11.08';
      const filters = [['ALL', '全部'], ['PENDING_CONFIRMATION', '待平台确认'], ['COMPLETED', '已完成入账'], ['DRAFT', '待上交草稿'], ['CANCELLED', '已作废']]
        .map(([key, label]) => `<button data-action="filter" data-filter="${key}" class="h-8 shrink-0 whitespace-nowrap rounded-full border px-3 text-[12px] font-bold transition ${state.filter === key ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">${label}</button>`).join('');
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('转账交割', `${period} · 纯积分口径`)}
        ${topSwitch}

        <section class="flex items-center justify-between gap-3 rounded-2xl border border-slate-300 bg-slate-50/70 px-3.5 py-2.5">
          <div class="min-w-0">
            <div class="flex items-center gap-1.5 text-[14px] font-bold text-slate-900">
              <span class="h-2 w-2 shrink-0 rounded-full bg-amber-500"></span>
              <span class="truncate">待平台审核 ${pendingCount} 单</span>
            </div>
            <div class="mt-0.5 truncate text-[12px] font-medium text-slate-600">${draft ? (draft.reject ? '草稿被驳回 · 请重传凭证后提交' : '草稿待上交 · 请完成打款') : '本周已提交，等待确认'}</div>
          </div>
          <button data-action="open-create" ${!draft || state.online === 'off' ? 'disabled' : ''} class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl bg-indigo-600 px-3.5 text-[14px] font-bold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-600">
            ${icon('plus', 'h-4 w-4')}发起周度资金上交
          </button>
        </section>

        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5 text-[12px] font-bold text-slate-700">${icon('workflow', 'h-4 w-4 text-indigo-600')}周结节奏</div>
            <span class="font-mono text-[12px] font-medium text-slate-600">2026-W45</span>
          </div>
          <div class="mt-2 grid grid-cols-5 gap-1">
            ${TIMELINE.map((s) => `<div class="rounded-lg border px-1 py-1.5 text-center ${s.current ? 'border-amber-200 bg-amber-50' : 'border-slate-100 bg-white'}">
              <div class="mx-auto h-1.5 w-1.5 rounded-full ${s.current ? 'bg-amber-500' : s.done ? 'bg-emerald-500' : 'bg-slate-300'}"></div>
              <div class="mt-1 font-mono text-[12px] font-bold ${s.current ? 'text-amber-800' : 'text-slate-600'}">${s.time}</div>
              <div class="text-[12px] font-medium ${s.current ? 'text-amber-700' : 'text-slate-600'}">${s.label}</div>
              <div class="text-[12px] ${s.current ? 'text-amber-700' : 'text-slate-600'}">${s.sub}</div>
            </div>`).join('')}
          </div>
        </section>

        <div class="flex items-center justify-between px-1 pt-1">
          <h2 class="text-[16px] font-bold text-slate-900">历史转账单</h2>
          <button data-action="view" data-view="ts" class="text-[12px] font-bold text-indigo-600 hover:text-indigo-800">待结算课次 · ${leoTsPool().filter((t) => t.status === 'FINISHED_PENDING_SETTLEMENT' || t.status === 'TRANSFER_LOCKED').length} 节</button>
        </div>

        <div class="flex gap-1.5 overflow-x-auto pb-0.5">${filters}</div>
        <div class="${grid}">${list.length ? list.map(orderCard).join('') : emptyState('暂无转账单', '当前筛选条件下没有记录')}</div>
      </div>`;
    }

    function renderLeoCustody() {
      const valid = state.custodyTs.filter((t) => t.holderId === 'leo' && (t.status === 'PENDING_SCHEDULE' || t.status === 'SCHEDULED'));
      const pendingList = valid.filter((t) => t.status === 'PENDING_SCHEDULE');
      const scheduledList = valid.filter((t) => t.status === 'SCHEDULED');
      const pendingPts = sumBy(pendingList, (t) => t.points);
      const scheduledPts = sumBy(scheduledList, (t) => t.points);
      const totalPts = pendingPts + scheduledPts;

      const q = state.custodySearch.trim().toLowerCase();
      const filtered = valid.filter((t) => {
        if (state.custodyFilter !== 'ALL' && t.status !== state.custodyFilter) return false;
        if (!q) return true;
        return [t.student, t.parent, t.className, t.teacher].some((v) => String(v || '').toLowerCase().includes(q));
      });

      const pills = [['ALL', '全部'], ['PENDING_SCHEDULE', '仅待排TS'], ['SCHEDULED', '仅已排TS']]
        .map(([k, label]) => `<button data-action="custody-filter" data-filter="${k}" class="h-8 shrink-0 rounded-lg border px-2.5 text-[12px] font-bold transition ${state.custodyFilter === k ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">${label}</button>`).join('');

      const cards = filtered.map((t) => {
        const isPending = t.status === 'PENDING_SCHEDULE';
        const badge = isPending ? chip('待排期 TS', 'indigo') : chip('已排期未结', 'amber');
        const title = t.student ? `${esc(t.student)} · ${esc(t.parent)}` : `${esc(t.className)} · ${esc(t.parent)}`;
        return `<article class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="truncate text-[14px] font-bold text-slate-900">${title}</span>
                <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${esc(t.kind)}</span>
              </div>
              <div class="mt-0.5 text-[12px] font-medium text-slate-600">${esc(t.date)} · ${esc(t.time)} · 老师 ${esc(t.teacher)}</div>
            </div>
            ${badge}
          </div>
          <div class="mt-2.5 flex items-center justify-between gap-2 border-t border-slate-200 pt-2">
            <div class="font-mono text-[16px] font-bold text-slate-900">${fmt(t.points)} <span class="text-[12px] font-medium text-slate-600">积分</span></div>
            <div class="flex shrink-0 items-center gap-1.5">
              <button data-action="custody-refund" data-id="${t.id}" class="h-8 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-800 hover:bg-slate-50">清退/扣减</button>
              <button data-action="custody-schedule" data-id="${t.id}" class="h-8 rounded-lg bg-indigo-600 px-2.5 text-[12px] font-bold text-white hover:bg-indigo-700">去排课</button>
            </div>
          </div>
        </article>`;
      }).join('');

      return `<div class="space-y-3">
        <section class="grid grid-cols-3 gap-2 rounded-2xl border border-slate-300 bg-slate-50/70 p-3">
          <div class="rounded-xl bg-white p-2.5">
            <div class="text-[12px] font-semibold text-slate-600">待排期 TS</div>
            <div class="mt-1 font-mono text-[16px] font-bold text-slate-900">${pendingList.length} 节</div>
            <div class="font-mono text-[12px] font-medium text-slate-600">${fmt(pendingPts)} 积分</div>
          </div>
          <div class="rounded-xl bg-white p-2.5">
            <div class="text-[12px] font-semibold text-slate-600">已排未结 TS</div>
            <div class="mt-1 font-mono text-[16px] font-bold text-slate-900">${scheduledList.length} 节</div>
            <div class="font-mono text-[12px] font-medium text-slate-600">${fmt(scheduledPts)} 积分</div>
          </div>
          <div class="rounded-xl border border-indigo-200 bg-indigo-50/80 p-2.5">
            <div class="text-[12px] font-semibold text-indigo-700">未结托管总计</div>
            <div class="mt-1 font-mono text-[16px] font-bold text-indigo-700">${valid.length} 节</div>
            <div class="font-mono text-[12px] font-bold text-indigo-700">${fmt(totalPts)} 积分</div>
          </div>
        </section>

        <div class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-[12px] font-medium text-slate-600">仅汇总尚未结课的待排期与已排期未结 TS，严禁包含已结课、已作废或已入账课次。</div>

        <div class="space-y-2">
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
            <input id="custodySearch" type="search" value="${esc(state.custodySearch)}" placeholder="搜索家长 / 学员 / 小班" class="h-11 w-full rounded-xl border border-slate-300 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none focus:border-indigo-500" />
          </div>
          <div class="flex gap-1.5 overflow-x-auto pb-0.5">${pills}</div>
        </div>

        <div class="${state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2'}">${cards || emptyState('暂无匹配的未结托管课次', '可调整搜索词或筛选条件')}</div>
      </div>`;
    }

    function orderCard(o) {
      const meta = statusMeta(o.status);
      const isDraft = o.status === 'DRAFT';
      const isPending = o.status === 'PENDING_CONFIRMATION';
      const isMuted = o.status === 'CANCELLED' || isDraft;
      const surface = isPending
        ? 'border-amber-300 bg-amber-50/50'
        : isMuted
          ? 'border-dashed border-slate-400 bg-slate-50/60 opacity-60'
          : 'border-slate-300 bg-slate-50/70';
      const action = isDraft
        ? `<button data-action="open-reconcile" data-id="${o.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg bg-indigo-600 px-2.5 text-[12px] font-bold text-white hover:bg-indigo-700 disabled:opacity-50">${o.reject ? '重传凭证' : '去上交'}</button>`
        : isPending
          ? `<button data-action="open-detail" data-id="${o.id}" class="h-8 shrink-0 rounded-lg bg-indigo-600 px-2.5 text-[12px] font-bold text-white hover:bg-indigo-700">查看详情</button>`
          : `<button data-action="open-detail" data-id="${o.id}" class="h-8 shrink-0 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-800 hover:bg-slate-50">查看明细</button>`;
      return `<article data-action="open-detail" data-id="${o.id}" role="button" tabindex="0" class="cursor-pointer rounded-2xl border p-3.5 transition active:scale-[0.995] ${surface}">
        <div class="flex items-center justify-between gap-2">
          <span class="truncate font-mono text-[12px] font-bold text-slate-900">${esc(o.code || o.id)}</span>
          <div class="flex shrink-0 items-center gap-1.5">
            <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${typeLabel(o.type)}</span>
            ${chip(meta.label, meta.tone)}
          </div>
        </div>
        <div class="mt-2 flex items-end justify-between gap-3">
          <div class="min-w-0">
            <div class="text-[12px] font-medium text-slate-600">${o.count} 节 · ${esc(o.period)}</div>
            <div class="mt-0.5 font-mono text-[18px] font-bold text-slate-900">${fmt(o.transfer)} <span class="text-[12px] font-medium text-slate-600">积分</span></div>
          </div>

    /* ------------------------------------------------------------------
     * 管理员：全校异常课次核查与回退大盘（与资金归集审核彻底分流）
     * ------------------------------------------------------------------ */
    function isRecentFinished(dateStr, days = 7) {
      const match = /^(\d{2})-(\d{2})$/.exec(String(dateStr || ''));
      if (!match) return false;
      const [year, month, day] = TODAY.split('-').map(Number);
      const target = Date.UTC(year, Number(match[1]) - 1, Number(match[2]));
      const diff = (Date.UTC(year, month - 1, day) - target) / 86400000;
      return diff >= 0 && diff <= days;
    }

    const ANOMALY_MONITORS = ['Leo', 'Amy', 'Mia'];
    const ANOMALY_SELF_MONITOR = 'Sarah';

    function anomalyTsPool() {
      const done = ['FINISHED_PENDING_SETTLEMENT', 'TRANSFER_LOCKED', 'COLLECTED', 'CANCELLED'];
      const rank = (t) => (t.status === 'CANCELLED' ? 2 : t.anomaly ? 0 : 1);
      return state.ts.filter((t) => done.includes(t.status)).slice().sort((a, b) => rank(a) - rank(b));
    }

    /* 以 TODAY 所在自然周（周一至周日）切分；本周 11-09 ~ 11-15，上周 11-02 ~ 11-08 */
    function anomalyDateValue(dateStr) {
      const match = /^(\d{2})-(\d{2})$/.exec(String(dateStr || ''));
      if (!match) return null;
      const year = Number(TODAY.slice(0, 4));
      return Date.UTC(year, Number(match[1]) - 1, Number(match[2]));
    }

    function anomalyInPeriod(t) {
      const value = anomalyDateValue(t.date);
      if (value === null) return false;
      const [year, month, day] = TODAY.split('-').map(Number);
      const today = Date.UTC(year, month - 1, day);
      const monday = today - ((new Date(today).getUTCDay() + 6) % 7) * 86400000;
      const start = monday - (state.anomalyPeriod === 'LAST_WEEK' ? 7 : 0) * 86400000;
      return value >= start && value <= start + 6 * 86400000;
    }

    function anomalyMatchesSearch(t) {
      const q = state.anomalySearch.trim().toLowerCase();
      if (!q) return true;
      return [t.id, t.student, t.nickname, t.englishName, t.teacher, t.monitor, t.parent, t.className, t.orderNo, t.trCode, t.rebornTsId]
        .some((v) => String(v || '').toLowerCase().includes(q));
    }

    function anomalyMatchesMonitor(t) {
      if (state.anomalyMonitor === 'ALL') return true;
      if (state.anomalyMonitor === 'SELF') return t.monitor === ANOMALY_SELF_MONITOR;
      return t.monitor === state.anomalyMonitor;
    }

    /* 分段计数与卡片结果共用的过滤池：时段 + 即时搜索 + 班长切片 三重 AND */
    function anomalyFilteredPool() {
      return anomalyTsPool()
        .filter(anomalyInPeriod)
        .filter(anomalyMatchesSearch)
        .filter(anomalyMatchesMonitor);
    }

    function anomalyOrder(t) {
      return t.orderId ? state.orders.find((o) => o.id === t.orderId) : null;
    }

    function anomalySettlement(t) {
      if (t.status === 'CANCELLED') {
        return { text: '未进入已确认转账单 · 已回退作废', dot: 'bg-slate-400' };
      }
      if (t.status === 'COLLECTED') {
        const order = anomalyOrder(t);
        const code = t.trCode || (order && order.code) || '';
        return {
          text: `已进入完成转账单${code ? ` ${code}` : ''} · 已归集封存`,
          dot: 'bg-slate-500'
        };
      }
      if (t.payrollPaid) {
        return {
          text: `已随课酬单${t.payrollCode ? ` ${t.payrollCode}` : ''} 发薪 · 禁止回退`,
          dot: 'bg-slate-500'
        };
      }
      if (t.status === 'TRANSFER_LOCKED') {
        const order = anomalyOrder(t);
        const code = (order && order.code) || t.trCode || '';
        const draft = !order || order.status === 'DRAFT';
        return {
          text: draft
            ? `处于周转待上交草稿${code ? ` ${code}` : ''} · 可回退`
            : `处于周转待确认单${code ? ` ${code}` : ''} · 在途审核中，需先驳回草稿`,
          dot: draft ? 'bg-amber-500' : 'bg-indigo-500'
        };
      }
      return { text: '未进入已确认转账单 · 可回退', dot: 'bg-emerald-500' };
    }

    function anomalyTsCard(t) {
      const cancelled = t.status === 'CANCELLED';
      const gate = rollbackGate(t);
      const settlement = anomalySettlement(t);
      const surface = cancelled
        ? 'box-border w-full rounded-2xl border border-dashed border-slate-400 bg-slate-50/60 opacity-70'
        : t.anomaly
          ? 'box-border w-full rounded-2xl border border-rose-200 border-l-4 border-l-rose-600 bg-rose-50/80'
          : 'box-border w-full rounded-2xl border border-slate-300 bg-slate-50/70';
      const mark = t.anomaly && !cancelled
        ? chip(`⚠️ ${t.anomaly}`, 'rose')
        : cancelled
          ? chip('已取消', 'slate')
          : chip('正常自动结课', 'slate');
      const action = cancelled
        ? `<span class="inline-flex shrink-0 items-center gap-1 whitespace-nowrap text-[12px] font-bold text-slate-700">${icon('corner-up-left', 'h-3 w-3')}已取消 · 补生 <span class="font-mono">${esc(t.rebornTsId || '—')}</span></span>`
        : gate.allowed
          ? `<button data-action="rollback" data-id="${t.id}" data-rollback-state="ok" ${state.online === 'off' ? 'disabled' : ''} class="inline-flex h-7 shrink-0 items-center rounded-lg border border-rose-200 bg-white px-2.5 text-[12px] font-bold whitespace-nowrap text-rose-700 transition hover:bg-rose-50 disabled:cursor-not-allowed disabled:opacity-40">⚠️ 异常未上课回退</button>`
          : `<button type="button" disabled data-rollback-state="${gate.state}" title="${esc(gate.reason)}" aria-disabled="true" class="inline-flex max-w-[230px] shrink-0 items-center gap-1 rounded-lg border border-slate-200 bg-slate-100 px-2.5 py-1 text-left text-[12px] font-bold leading-tight text-slate-500 disabled:cursor-not-allowed">${icon('lock', 'h-3 w-3')}${esc(gate.reason)}</button>`;
      const footer = cancelled
        ? '原课次已作废'
        : gate.state === 'settled'
          ? '资金已归集封存'
          : gate.state === 'payroll-paid'
            ? '已随课酬单发薪'

              ? '在途审核中，需先驳回草稿'
              : gate.allowed
                ? '回退后自动补生 1 节待排期'
                : '当前状态暂不可回退';
      const studentLine = t.student
        ? `${esc(t.student)}${t.nickname ? `（${esc(t.nickname)}）` : ''}${t.className ? ` · ${esc(t.className)}` : ''} · ${esc(t.parent)} 家长`
        : `${esc(t.className)} · ${esc(t.parent)}`;
      const orderText = t.orderNo
        ? `<span class="font-mono font-semibold text-slate-800">${esc(t.orderNo)}</span><span class="text-slate-600">（共 ${esc(t.orderLessons ?? '—')} 节）</span>`
        : `<span class="text-slate-600">—</span>`;
      const noteLine = t.anomalyNote
        ? `<div class="break-words text-rose-800"><span class="text-rose-700">异常备注</span> ${esc(t.anomalyNote)}</div>`
        : t.anomaly
          ? `<div class="text-slate-600"><span>异常备注</span> 未填写</div>`
          : '';
      const traceLine = t.rollbackTrace
        ? `<div data-rollback-trace="${esc(t.rollbackTrace.exceptionId)}|${esc(t.rollbackTrace.recordId)}" class="flex items-center gap-1 text-slate-600">${icon('file-check-2', 'h-3 w-3 shrink-0')}已写入出勤异常与经办记录</div>`
        : '';
      return `<article data-ts-status="${t.status}" data-ts-rollback-state="${gate.state}" class="${surface} p-3.5">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <div class="truncate font-mono text-[12px] font-semibold text-slate-600">TS · ${esc(t.id)}</div>
            <div class="mt-0.5 truncate text-[16px] font-bold ${cancelled ? 'text-slate-700' : 'text-slate-900'}">${esc(t.date)} ${esc(t.weekday)} ${esc(t.time)}</div>
          </div>
          ${mark}
        </div>
        <div class="mt-1 truncate text-[14px] font-semibold text-slate-700">${studentLine}</div>
        <div class="mt-2 grid grid-cols-2 gap-x-3 gap-y-1 text-[12px]">

        state.vouchers = clone(order.vouchers || []);
      }
      state.detailId = id;
      state.detailMode = nextMode;
      state.page = 'detail';
      state.modal = null;
      pushDetailRoute(order, nextMode);
      renderAll();
      resetScroll();
    }

    function backFromDetail() {
      clearDetailRoute();
      state.page = 'workspace';
      state.detailId = null;
      state.detailMode = 'view';

      renderAll();

               <div class="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-amber-900">单向归集平台 · 严禁班长之间横向转账。提交后关联课次进入审核待确认。</div>

    function renderDetailActions() {
      const o = detailOrder();
      if (!o) return '';
      const off = state.online === 'off';

      if (state.detailMode === 'reconcile' && o.status === 'DRAFT') {
        const hasVoucher = state.vouchers.length > 0;
        const ready = hasVoucher && !off;
        inner = `<div class="space-y-2">
          <div class="text-center text-[12px] font-medium ${hasVoucher ? 'text-emerald-700' : 'text-slate-600'}">${hasVoucher ? `已上传 ${state.vouchers.length} / 5 张凭证，确认后单据将进入平台审核` : '请先上传 1~5 张打款凭证，未上传不可提交'}</div>
          <div class="flex gap-2">

            <button data-action="submit-order" ${ready ? '' : 'disabled'} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-600">确认并提交转账单</button>
          </div>
        </div>`;
      } else if (state.role === 'sarah') {
        if (o.status === 'PENDING_CONFIRMATION') {
          inner = `<div class="flex gap-2">
            <button data-action="reject" data-id="${o.id}" ${off ? 'disabled' : ''} class="h-11 flex-1 rounded-xl border border-rose-200 bg-white text-[16px] font-semibold text-rose-700 hover:bg-rose-50 disabled:opacity-40">驳回转账单</button>
            <button data-action="confirm-collect" data-id="${o.id}" ${off ? 'disabled' : ''} class="h-11 flex-[1.6] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700 disabled:opacity-40">确认收款</button>
          </div>`;
        } else {
          const note = o.status === 'COMPLETED'
            ? '款项已确认入账，单据归档不可更改'

      } else if (o.status === 'DRAFT') {
        inner = `<div class="space-y-2">

          <button data-action="open-reconcile" data-id="${o.id}" ${off ? 'disabled' : ''} class="h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-600">${o.reject ? '重传凭证并提交' : '去上交并打款'}</button>
        </div>`;

      return `<div data-testid="detail-actions" class="border-t border-slate-200 bg-white px-4 py-3">
        <div class="mx-auto w-full max-w-[640px]">${inner}</div>
      </div>`;
    }

    /* 明细聚合：学员视角按出资归属，老师视角按授课人，双视角共用同一份 lines */
    function studentGroupsOf(order) {
      const map = new Map();
      (order.lines || []).forEach((l) => {
        const key = l.funderStudent || l.student;
        if (!map.has(key)) map.set(key, { name: key, parent: l.parent, lines: [] });
        map.get(key).lines.push(l);
      });
      return [...map.values()].map((g) => {
        const prices = [...new Set(g.lines.map((l) => l.points))];
        const kinds = [...new Set(g.lines.map((l) => l.kind))];
        return {
          ...g, count: g.lines.length,
          total: sumBy(g.lines, (l) => l.points),
          unit: prices.length === 1 ? prices[0] : null,
          kind: kinds.length === 1 ? kinds[0] : '混合课型',
          changedStudent: g.lines.some((l) => l.funderStudent)
        };
      });
    }

    function teacherGroupsOf(order) {
      const map = new Map();
      (order.lines || []).forEach((l) => {
        if (!map.has(l.teacher)) map.set(l.teacher, { name: l.teacher, level: l.teacherLevel, lines: [] });
        map.get(l.teacher).lines.push(l);
      });
      return [...map.values()].map((g) => ({
        ...g, count: g.lines.length,
        amount: sumBy(g.lines, (l) => l.points),
        sub: g.lines.filter((l) => l.subFor).length
      }));
    }

    function splitTotals(order) {
      const lines = order.lines || [];
      const one = sumBy(lines.filter((l) => l.kind === '1v1'), (l) => l.points);
      const group = sumBy(lines.filter((l) => l.kind === '小班课'), (l) => l.points);
      return { one, group, total: one + group };
    }

    function smallSummary(order) {
      const rows = order.groupClasses || [];
      const gross = sumBy(rows, (g) => g.unit * g.count);
      return { rows, gross };
    }

    function uploadInner() {
      const list = state.vouchers || [];
      const items = list.map((v, idx) => `<div class="flex h-14 items-center gap-2.5 rounded-xl border border-slate-200 bg-white px-2.5">
        <button data-action="voucher" data-id="${state.detailId || 'v-leo'}" class="h-10 w-8 shrink-0 overflow-hidden rounded border border-slate-200 bg-slate-50">${miniReceipt()}</button>
        <div class="min-w-0 flex-1"><div class="truncate text-[12px] font-semibold text-slate-800">${esc(v.name)}</div><div class="text-[12px] text-slate-600">第 ${idx + 1} / 5 张 · ${esc(v.size)}</div></div>

      const addBtn = list.length < 5
        ? `<button data-action="add-voucher" ${state.online === 'off' ? 'disabled' : ''} class="flex h-14 w-full flex-col items-center justify-center gap-0.5 rounded-xl border-2 border-dashed border-slate-300 text-slate-600 transition hover:border-indigo-400 hover:text-indigo-600 disabled:opacity-40">

          </button>`

      return `<div class="space-y-2">${items}${addBtn}</div>`;
    }

    function tomUploadInner() {

          ${icon('upload', 'h-4 w-4')}<span class="text-[12px] font-medium">上传打款凭证</span><span class="text-[12px]">JPG PNG PDF · ≤10MB · 最多 5 张</span>
        </button>`;
      }
      return `<div class="flex h-16 items-center gap-2.5 rounded-xl border border-slate-200 bg-white px-2.5">
        <button data-action="voucher" data-id="resign" class="h-12 w-10 shrink-0 overflow-hidden rounded border border-slate-200 bg-slate-50">${miniReceipt()}</button>
        <div class="min-w-0 flex-1"><div class="truncate text-[12px] font-semibold text-slate-800">cmb-1110-1012.jpg</div><div class="text-[12px] text-slate-600">已上传 1 / 5 · 1.1MB</div></div>
        <button data-action="remove-tom-voucher" class="grid h-7 w-7 place-items-center rounded-lg text-slate-600 hover:bg-slate-100 hover:text-rose-600">${icon('trash-2', 'h-4 w-4')}</button>

    }

    /* ------------------------------------------------------------------

      const root = $('modalRoot');
      if (!state.modal) { root.innerHTML = ''; return; }
      const type = state.modal.type;
      if (type === 'rollback') root.innerHTML = rollbackModal();
      else if (type === 'confirm') root.innerHTML = confirmModal(state.modal.id);
      else if (type === 'reject') root.innerHTML = rejectModal(state.modal.id);
      else if (type === 'voucher') root.innerHTML = voucherModal(state.modal.id);
      else if (type === 'handover') root.innerHTML = handoverConfirmModal();
      else root.innerHTML = '';
    }

    /* ------------------------------------------------------------------
     * 业务动作
     * ------------------------------------------------------------------ */
    function submitOrder() {
      if (!requireOnline('离线模式不可提交转账单')) return;
      const d = draftOrder();
      if (!d || !(state.vouchers || []).length) return toast('请先上传 1~5 张打款凭证');
      d.status = 'PENDING_CONFIRMATION';
      d.vouchers = clone(state.vouchers);
      d.voucher = true;
      d.time = '11-10 09:42';
      d.reject = '';
      d.history = d.history || [];
      d.history.push({ status: 'PENDING_CONFIRMATION', label: '班长上传凭证并提交，等待平台确认', by: 'Leo', time: d.time, tone: 'done' });
      let locked = 0;
      state.ts.forEach((t) => {
        if (t.status === 'FINISHED_PENDING_SETTLEMENT' && locked < 2) {
          t.status = 'TRANSFER_LOCKED';
          t.orderId = d.id;
          locked++;
        }
      });
      state.vouchers = [];
      state.filter = 'ALL';
      state.detailTab = 'student';
      state.detailId = d.id;
      state.detailMode = 'view';
      state.page = 'detail';
      state.modal = null;
      try { history.replaceState({ order: d.id, mode: 'view' }, '', detailRouteHash(d.id, 'view')); } catch (err) { console.warn('history unavailable', err); }
      renderAll();
      resetScroll();
      toast('转账单已提交，等待平台确认');
    }

    function cancelDraft(id) {
      if (!requireOnline('离线模式不可作废草稿')) return;
      const o = state.orders.find((x) => x.id === id);
      if (!o || o.status !== 'DRAFT') return;
      o.status = 'CANCELLED';
      o.rejectTime = '11-10 10:05';
      o.history = o.history || [];
      o.history.push({ status: 'CANCELLED', label: '经办人作废草稿，释放课次明细', by: 'Leo', time: o.rejectTime, tone: 'failed' });
      state.ts.forEach((t) => {
        if (t.orderId === o.id && t.status === 'TRANSFER_LOCKED') {
          t.status = 'FINISHED_PENDING_SETTLEMENT';
          delete t.orderId;
        }
      });
      state.detailMode = 'view';
      state.vouchers = [];
      renderAll();
      toast('草稿已作废，关联课次已释放回待打包池');
    }

    function openRollback(id) {
      if (!requireOnline('离线模式不可回退课次')) return;
      const t = state.ts.find((x) => x.id === id);
      if (!t) return;
      const gate = rollbackGate(t);
      if (!gate.allowed) return toast(gate.reason);
      state.rollId = id;
      state.rollReason = '';
      state.modal = { type: 'rollback' };
      renderAll();
    }

    function confirmRollback() {
      if (!requireOnline('离线模式不可回退课次')) return;
      const t = state.ts.find((x) => x.id === state.rollId);
      if (!t || !state.rollReason.trim()) return;
      const gate = rollbackGate(t);
      if (!gate.allowed) {
        state.modal = null;
        state.rollReason = '';
        renderAll();
        return toast(gate.reason);
      }
      t.status = 'CANCELLED';
      t.reborn = true;
      const newId = `ts_new${String(state.tsSeq++).padStart(6, '0')}`;
      t.rebornTsId = newId;
      t.rollbackReason = state.rollReason.trim();
      t.rollbackTrace = {
        exceptionId: `AE261110${String(state.tsSeq).padStart(4, '0')}`,
        recordId: `OP261110${String(state.tsSeq).padStart(4, '0')}`,
        at: '11-10 10:20'
      };
      if (t.kind === '小班课') {
        state.custodyTs.unshift({
          id: newId, holderId: 'leo', status: 'PENDING_SCHEDULE', kind: '小班课',
          student: null, className: t.className || 'KET 冲刺班', parent: '小班待排池',
          teacher: t.teacher, points: t.points, date: '待排期', time: '50 分钟双网格'
        });
      } else {
        state.ts.unshift({
          id: newId, date: '—', weekday: '待排期', time: '—', student: t.student, parent: t.parent,
          teacher: t.teacher, kind: t.kind, points: t.points, status: 'PENDING_SCHEDULE'
        });
        state.custodyTs.unshift({
          id: newId, holderId: 'leo', status: 'PENDING_SCHEDULE', kind: t.kind,
          student: t.student, parent: t.parent, teacher: t.teacher, points: t.points,
          date: '待排期', time: '异常回退补生'
        });
      }
      if (t.orderId) {
        const order = state.orders.find((o) => o.id === t.orderId && (o.status === 'DRAFT' || o.status === 'PENDING_CONFIRMATION'));
        if (order) {
          const idx = order.lines.findIndex((l) => l.student === t.student && l.date === t.date);
          if (idx >= 0) {
            order.lines.splice(idx, 1);
            finalizeOrder(order);
            order.history = order.history || [];
            order.history.push({ status: order.status, label: `异常未上课回退剔除 TS (${t.id}) 并重算总额`, by: 'Leo', time: '11-10 10:20', tone: 'done' });
            if (order.lines.length === 0) {
              order.status = 'CANCELLED';
              order.history.push({ status: 'CANCELLED', label: '异常剔除致明细归零，系统自动作废', by: 'system', time: '11-10 10:20', tone: 'failed' });
            }
          }
        }
      }
      state.modal = null;
      state.rollReason = '';
      renderAll();
      toast(t.kind === '小班课'
        ? '已退回小班待排池 · 已写入出勤异常与经办记录'
        : '已回退并补生 1 节待排期 · 已写入出勤异常与经办记录');
    }

    function confirmCollect(id) {
      if (!requireOnline('离线模式不可确认收款')) return;
      const o = state.orders.find((x) => x.id === id);
      if (!o) return;
      o.status = 'COMPLETED';
      o.confirmTime = '11-10 10:40';
      o.confirmBy = 'Sarah';
      o.history = o.history || [];
      o.history.push({ status: 'COMPLETED', label: '平台确认收款，已完成入账', by: 'Sarah', time: o.confirmTime, tone: 'done' });
      state.ts.forEach((t) => { if (t.status === 'TRANSFER_LOCKED') t.status = 'COLLECTED'; });
      state.modal = null;
      renderAll();
      toast(`${o.code || id} 已确认收款，${o.count} 节流转为已归集`);
    }

    function confirmReject() {
      if (!requireOnline('离线模式不可驳回转账单')) return;
      const o = state.orders.find((x) => x.id === state.rejectId);
      if (!o || !state.rejectReason.trim()) return;
      o.status = 'DRAFT';
      o.reject = state.rejectReason.trim();
      o.rejectTime = '11-10 10:42';
      o.history = o.history || [];
      o.history.push({ status: 'DRAFT', label: `管理员驳回退回待上交草稿：${o.reject}`, by: 'Sarah', time: o.rejectTime, tone: 'failed' });
      state.ts.forEach((t) => {
        if (t.status === 'TRANSFER_LOCKED' && (!t.orderId || t.orderId === o.id)) {
          t.status = 'FINISHED_PENDING_SETTLEMENT';
        }
      });
      if (o.type === 'RESIGNATION_HANDOVER') state.handover = 'draft';
      state.modal = null;
      state.rejectReason = '';
      renderAll();
      toast('已驳回并退回草稿（保留明细与驳回原因）');
    }

    function confirmHandover() {
      if (!requireOnline('离线模式不可确认移交')) return;
      const o = resignationOrder();
      if (o) { o.status = 'COMPLETED'; o.confirmTime = '11-10 10:45'; }
      state.handover = 'completed';
      state.modal = null;
      renderAll();
      toast('移交完成，20 节 TS 已改绑至平台');
    }

    function submitHandover() {
      if (!requireOnline('离线模式不可提交移交单')) return;
      if (!state.tomVoucher) return toast('请先上传打款凭证');
      state.orders = state.orders.filter((o) => o.type !== 'RESIGNATION_HANDOVER');
      state.orders.unshift({
        id: 'tro_tom00001', code: 'TR-20261110-005', type: 'RESIGNATION_HANDOVER', monitor: 'Tom', count: 20,
        gross: 880, transfer: 880,
        status: 'PENDING_CONFIRMATION', time: '11-10 10:15', voucher: true, period: '离职移交'
      });
      state.handover = 'pending';
      renderAll();
      toast('移交单已提交，等待平台确认');
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    function handleAction(el) {
      const action = el.dataset.action;
      if (state.anomalyMenuOpen && action !== 'anomaly-monitor-menu') state.anomalyMenuOpen = false;
      if (action === 'role') return setRole(el.dataset.role, el.dataset.view);
      if (action === 'view') return setView(el.dataset.view);
      if (action === 'device') return setDevice(el.dataset.device);
      if (action === 'network') return setOnline(el.dataset.online);
      if (action === 'reset') return resetPrototype();
      if (action === 'toast') return toast(el.dataset.message || '');
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'filter') { state.filter = el.dataset.filter || 'ALL'; renderAll(); resetScroll(); return; }
      if (action === 'leo-tab') { state.leoTab = el.dataset.tab === 'custody' ? 'custody' : 'orders'; renderAll(); resetScroll(); return; }
      if (action === 'custody-filter') { state.custodyFilter = el.dataset.filter || 'ALL'; renderAll(); resetScroll(); return; }
      if (action === 'custody-refund') { return toast('快捷穿透至课次清退模块 · 仅扣减未结待排课时'); }
      if (action === 'custody-schedule') { return toast('快捷穿透至排课工作台 · 选择时段完成排课'); }
      if (action === 'admin-filter') { state.adminFilter = el.dataset.filter || 'ALL'; renderAll(); resetScroll(); return; }
      if (action === 'anomaly-filter') { state.anomalyFilter = el.dataset.filter || 'ALL'; renderAll(); resetScroll(); return; }
      if (action === 'anomaly-monitor-menu') { state.anomalyMenuOpen = !state.anomalyMenuOpen; renderAll(); return; }
      if (action === 'anomaly-monitor') {
        state.anomalyMonitor = el.dataset.monitor || 'ALL';
        state.anomalyMenuOpen = false;
        renderAll();
        resetScroll();
        return;
      }
      if (action === 'anomaly-period') {
        state.anomalyPeriod = el.dataset.period === 'LAST_WEEK' ? 'LAST_WEEK' : 'THIS_WEEK';
        state.anomalyMenuOpen = false;
        renderAll();
        resetScroll();
        return;
      }
      if (action === 'anomaly-search-clear') {
        state.anomalySearch = '';
        renderAll();
        const input = $('anomalySearch');
        if (input) input.focus();
        return;
      }
      if (action === 'open-create') return openCreate();
      if (action === 'open-reconcile') return openDetail(el.dataset.id, 'reconcile');
      if (action === 'open-detail') return openDetail(el.dataset.id, 'view');
      if (action === 'back-detail') return backFromDetail();
      if (action === 'add-voucher') {
        if (!requireOnline('离线模式不可上传凭证')) return;
        if ((state.vouchers || []).length >= 5) return toast('最多上传 5 张打款凭证');
        const seq = (state.vouchers || []).length + 1;
        state.vouchers.push({ name: `cmb-1110-0938-${seq}.jpg`, size: `${(1.0 + seq * 0.2).toFixed(1)}MB` });
        renderAll();
        return;
      }
      if (action === 'remove-voucher') {
        const idx = Number(el.dataset.idx);
        if (!Number.isNaN(idx)) state.vouchers.splice(idx, 1);
        else state.vouchers = [];
        renderAll();
        return;
      }
      if (action === 'cancel-draft') return cancelDraft(el.dataset.id);
      if (action === 'add-tom-voucher') {
        if (!requireOnline('离线模式不可上传凭证')) return;
        state.tomVoucher = true; renderAll(); return;
      }
      if (action === 'remove-tom-voucher') { state.tomVoucher = false; renderAll(); return; }
      if (action === 'submit-order') return submitOrder();
      if (action === 'submit-handover') return submitHandover();
      if (action === 'rollback') return openRollback(el.dataset.id);
      if (action === 'confirm-rollback') return confirmRollback();
      if (action === 'copy-order') return copyOrderId(el.dataset.id);
      if (action === 'detail-tab') {
        state.detailTab = el.dataset.tab === 'teacher' ? 'teacher' : 'student';
        renderAll();
        return;
      }
      if (action === 'confirm-collect') {
        state.modal = { type: 'confirm', id: el.dataset.id };
        renderAll();
        return;
      }
      if (action === 'do-collect') return confirmCollect(el.dataset.id);
      if (action === 'reject') {
        if (!requireOnline('离线模式不可驳回转账单')) return;
        state.rejectId = el.dataset.id; state.rejectReason = ''; state.modal = { type: 'reject', id: el.dataset.id }; renderAll(); return;
      }
      if (action === 'do-reject') return confirmReject();
      if (action === 'voucher') {
        state.modal = { type: 'voucher', id: el.dataset.id };
        renderAll();
        return;
      }
      if (action === 'confirm-handover') {
        if (!requireOnline('离线模式不可确认移交')) return;
        state.modal = { type: 'handover' }; renderAll(); return;
      }
      if (action === 'do-handover') return confirmHandover();
      if (action === 'close-modal') {
        state.modal = null;
        renderAll();
        return;
      }
    }

    /* ------------------------------------------------------------------
     * 原型演示导航折叠（记忆折叠偏好，localStorage 不可用时静默降级）
     * ------------------------------------------------------------------ */
    const NAV_COLLAPSE_KEY = 'dream_proto_nav_collapsed';

    function navCollapsed() {
      try { return localStorage.getItem(NAV_COLLAPSE_KEY) === '1'; } catch (err) { return false; }
    }

    function saveNavCollapsed(collapsed) {
      try { localStorage.setItem(NAV_COLLAPSE_KEY, collapsed ? '1' : '0'); } catch (err) { /* 隐私模式下静默降级 */ }
    }

    function applyNavCollapsed(collapsed) {
      const consoleBar = $('console');
      const miniBar = document.querySelector('[data-console-mini]');
      if (consoleBar) consoleBar.classList.toggle('hidden', collapsed);
      if (miniBar) {
        miniBar.classList.toggle('hidden', !collapsed);
        miniBar.classList.toggle('flex', collapsed);
      }
    }

    function setupConsoleCollapse() {
      const collapseBtn = document.querySelector('[data-console-collapse]');
      const expandBtn = document.querySelector('[data-console-expand]');
      if (collapseBtn) {
        collapseBtn.addEventListener('click', () => {
          saveNavCollapsed(true);
          applyNavCollapsed(true);
        });
      }
      if (expandBtn) {
        expandBtn.addEventListener('click', () => {
          saveNavCollapsed(false);
          applyNavCollapsed(false);
        });
      }
      applyNavCollapsed(navCollapsed());
    }

    setupConsoleCollapse();

    window.addEventListener('popstate', () => {
      const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
      const orderId = hash.get('order');
      const order = orderId && state.orders.find((o) => o.id === orderId);
      if (order) {
        state.detailId = order.id;
        state.detailMode = hash.get('mode') === 'reconcile' && order.status === 'DRAFT' ? 'reconcile' : 'view';
        state.page = 'detail';
        state.modal = null;
      } else if (state.page === 'detail') {
        state.page = 'workspace';
        state.detailId = null;
        state.detailMode = 'view';
        state.vouchers = [];
        state.modal = null;
      } else {
        return;
      }
      renderAll();
      resetScroll();
    });

    document.getElementById('console').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (el) handleAction(el);
    });

    document.getElementById('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (el) {
        handleAction(el);
        return;
      }
      if (state.anomalyMenuOpen && !event.target.closest('[data-anomaly-menu-root]') && !event.target.closest('#anomalySearch')) {
        state.anomalyMenuOpen = false;
        renderAll();
      }
    });

    document.getElementById('frame').addEventListener('input', (event) => {
      if (event.target.id === 'custodySearch') {
        const pos = event.target.selectionStart;
        state.custodySearch = event.target.value;
        renderAll();
        const el = $('custodySearch');
        if (el) {
          el.focus();
          if (typeof pos === 'number') el.setSelectionRange(pos, pos);
        }
      }
      if (event.target.id === 'anomalySearch') {
        const pos = event.target.selectionStart;
        state.anomalySearch = event.target.value;
        state.anomalyMenuOpen = false;
        renderAll();
        const el = $('anomalySearch');
        if (el) {
          el.focus();
          if (typeof pos === 'number') el.setSelectionRange(pos, pos);
        }
      }
      if (event.target.id === 'rollReason') {
        state.rollReason = event.target.value;
        const count = $('rollCount');
        if (count) count.textContent = `${state.rollReason.length}/200`;
        const btn = $('btnRollConfirm');
        if (btn) btn.disabled = !state.rollReason.trim() || state.online === 'off';
      }
      if (event.target.id === 'rejectReason') {
        state.rejectReason = event.target.value;
        const count = $('rejectCount');
        if (count) count.textContent = `${state.rejectReason.length}/200`;
        const btn = $('btnRejectConfirm');
        if (btn) btn.disabled = !state.rejectReason.trim() || state.online === 'off';
      }
    });

    function renderPlaceholder() {
      const item = (NAVS[state.role] || []).find((n) => n.id === state.navTab);
      if (!item) return '<div class="p-8 text-center text-[14px] font-medium text-slate-600">页面不存在</div>';
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">${esc(item.cta || '前往')}</a>` : ''}
        <button data-action="nav" data-tab="${roleMeta().boardTab}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回资金归集</button>
      </div>`;
    }

    renderAll();
  </script>
</body>
</html>

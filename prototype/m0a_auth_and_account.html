    function norm(v) { return String(v || '').trim().toLowerCase(); }

    function maskEmail(email) {
      const parts = String(email || '').split('@');
      if (parts.length !== 2) return email || '';
      const user = parts[0];
      return `${user.slice(0, 2)}***@${parts[1]}`;
    }

    function nowStamp() {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function mmss(totalSeconds) {
      const s = Math.max(0, Number(totalSeconds) || 0);
      if (s >= 3600) return `${pad2(Math.floor(s / 3600))}:${pad2(Math.floor((s % 3600) / 60))}:${pad2(s % 60)}`;
      return `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`;
    }

    function captchaSpec(seed) {
      const a = 3 + ((seed * 7 + 1) % 7);
      const b = 2 + ((seed * 3 + 2) % 8);
      return { a, b, answer: String(a + b) };
    }

    function toast(message) {
      const el = $('toast');
      if (!el) return;
      el.textContent = message;
      el.classList.remove('hidden');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => el.classList.add('hidden'), 2600);
    }

    function syncUrl() {
      try {
        const av = state.screen === 'admins' ? `&adminView=${state.adminView}` : '';
        history.replaceState(null, '', `?screen=${state.screen}&role=${state.role}&lang=${state.lang}${av}`);
      } catch (e) { /* 本地文件模式下静默降级 */ }
    }

    function strengthRules(pw) {
      return [
        { zh: '至少 8 位', en: 'At least 8 characters', ok: String(pw || '').length >= 8 },
        { zh: '包含大写字母', en: 'One uppercase letter', ok: /[A-Z]/.test(pw || '') },
        { zh: '包含小写字母', en: 'One lowercase letter', ok: /[a-z]/.test(pw || '') },
        { zh: '包含数字', en: 'One number', ok: /[0-9]/.test(pw || '') },
        { zh: '包含特殊字符', en: 'One special character', ok: /[^A-Za-z0-9]/.test(pw || '') }
      ];
    }

    function strengthOk(pw) { return strengthRules(pw).every((r) => r.ok); }

    function strengthItems(pw) {
      return strengthRules(pw).map((r) => `
        <div class="flex items-center gap-1 ${r.ok ? 'text-emerald-700' : 'text-slate-600'}">
          ${icon(r.ok ? 'check-circle-2' : 'circle', 'h-3.5 w-3.5 shrink-0')}
          <span class="text-[12px] font-medium">${t(r.zh, r.en)}</span>
        </div>`).join('');
    }

    function strengthBox(prefix, pw) {
      return `<div data-strength="${prefix}" class="mt-2 grid grid-cols-1 gap-1 sm:grid-cols-1">${strengthItems(pw)}</div>`;
    }

    function matchHint(prefix, password, confirm) {
      const show = Boolean(confirm) && password !== confirm;
      return `<p data-match="${prefix}" class="mt-1 text-[12px] font-semibold text-rose-600 ${show ? '' : 'hidden'}">${t('两次输入的密码不一致', 'Passwords do not match')}</p>`;
    }

    function updateStrengthUI() {
      const pairs = [
        ['register', state.reg.password],
        ['forgot', state.forgotPassword],
        ['change-password', state.cpPassword]
      ];
      pairs.forEach(([prefix, pw]) => {
        const el = document.querySelector(`[data-strength="${prefix}"]`);
        if (el) el.innerHTML = strengthItems(pw);
      });
      const matches = [
        ['register', state.reg.password, state.reg.confirm],
        ['forgot', state.forgotPassword, state.forgotConfirm],
        ['change-password', state.cpPassword, state.cpConfirm]
      ];
      matches.forEach(([prefix, pw, confirm]) => {
        const el = document.querySelector(`[data-match="${prefix}"]`);
        if (el) el.classList.toggle('hidden', !(confirm && pw !== confirm));
      });
    }

    function setBtnDisabled(el, disabled) {
      if (el) el.disabled = Boolean(disabled);
    }

    function refreshFormStates() {
      const regOk = state.openRegistration && !state.maintenance && Boolean(state.reg.email.trim()) &&
        Boolean(state.reg.code.trim()) && strengthOk(state.reg.password) &&
        state.reg.password === state.reg.confirm && state.reg.agree;
      setBtnDisabled(document.querySelector('[data-reg-submit]'), !regOk);

      const forgotOk = Boolean(state.forgotCode.trim()) && strengthOk(state.forgotPassword) &&
        state.forgotPassword === state.forgotConfirm;
      setBtnDisabled(document.querySelector('[data-forgot-reset]'), !forgotOk);

      const cpOk = Boolean(state.cpCurrent.trim()) && strengthOk(state.cpPassword) &&
        state.cpPassword === state.cpConfirm;
      setBtnDisabled(document.querySelector('[data-cp-submit]'), !cpOk);

      const addOk = Boolean(state.addLookup && state.addLookup.ok && !state.addError) &&
        state.addName.trim().length >= 1 && state.addName.trim().length <= 50 &&
        (norm(state.addConfirm) === norm(state.addName) || norm(state.addConfirm) === norm(state.addEmail));
      setBtnDisabled(document.querySelector('[data-add-submit]'), !addOk);

      const editOk = state.editName.trim().length >= 1 && state.editName.trim().length <= 50;
      setBtnDisabled(document.querySelector('[data-edit-submit]'), !editOk);

      const revokeTarget = state.admins.find((a) => a.id === state.revokeTargetId);
      const revokeOk = Boolean(revokeTarget) && (norm(state.revokeConfirm) === norm(revokeTarget.name) || norm(state.revokeConfirm) === norm(revokeTarget.email));
      setBtnDisabled(document.querySelector('[data-revoke-submit]'), !revokeOk);

      const delTarget = currentEmail();
      const delOk = Boolean(state.deleteConfirm.trim()) && (norm(state.deleteConfirm) === norm(currentName()) || norm(state.deleteConfirm) === norm(delTarget));
      setBtnDisabled(document.querySelector('[data-delete-submit]'), !delOk);
    }

      const addCount = document.querySelector('[data-add-name-count]');
      if (addCount) addCount.textContent = `${state.addName.trim().length}/50`;
      const editCount = document.querySelector('[data-edit-name-count]');
      if (editCount) editCount.textContent = `${state.editName.trim().length}/50`;
    }

    function setScreen(screen, origin) {
      if (!VALID_SCREENS.includes(screen)) return;
      if (origin) state.subOrigin = origin;
      else if (screen === 'me') state.subOrigin = 'me';
      else if (['change-password', 'change-email', 'security', 'admins'].includes(screen) && (state.screen === 'me' || state.screen === 'security')) {
        state.subOrigin = state.screen;
      }
      state.screen = screen;
      state.overlay = null;
      state.overlayError = '';
      if (['me', 'change-password', 'change-email', 'security', 'admins'].includes(screen)) state.loggedIn = true;
      if (screen === 'login') { state.loginError = ''; state.loginNotice = ''; }
      if (screen === 'register') state.regError = '';
      if (screen === 'forgot') {
        state.forgotStep = 1;
        state.forgotError = '';
        state.forgotCode = '';

      if (screen === 'change-password') {
        state.cpCurrent = '';

        state.cpConfirm = '';
        state.cpError = '';

        state.showCpPw = false;

        state.emailError = '';
        state.emailCurrentSent = false;
        state.emailNewSent = false;
        state.emailCurrentFailures = 0;
        state.emailNewFailures = 0;
        state.credentialUntil = 0;

        credentialTimer = null;

    function fieldLabel(text) {
      return `<label class="mb-1.5 block text-[12px] font-bold text-slate-600">${esc(text)}</label>`;
    }

    function textInput(model, opts) {
      const o = opts || {};
      return `<div class="relative">
        ${o.icon ? `<span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon(o.icon, 'h-4 w-4')}</span>` : ''}
        <input id="${o.id || ''}" type="${o.type || 'text'}" inputmode="${o.inputmode || 'text'}" autocomplete="${o.autocomplete || 'off'}" data-model="${model}" value="${esc(o.value || '')}" placeholder="${esc(o.placeholder || '')}" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 ${o.icon ? 'pl-9' : 'pl-3.5'} ${o.suffix ? 'pr-12' : 'pr-3.5'} text-[16px] text-slate-900 outline-none transition placeholder:text-slate-500 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15" ${o.disabled ? 'disabled' : ''} />
        ${o.suffix || ''}
      </div>`;
    }

    function passwordToggle(target, show) {
      return `<button type="button" data-action="toggle-pw" data-target="${target}" class="absolute right-1.5 top-1/2 grid h-8 w-8 -translate-y-1/2 place-items-center rounded-lg text-slate-500 transition hover:bg-slate-200/70" aria-label="${show ? t('隐藏密码', 'Hide password') : t('显示密码', 'Show password')}">${icon(show ? 'eye-off' : 'eye', 'h-4 w-4')}</button>`;
    }

    function captchaCard(kind) {
      const seed = kind === 'login' ? state.loginCaptchaSeed : state.forgotCaptchaSeed;
      const spec = captchaSpec(seed);
      const model = kind === 'login' ? 'loginCaptchaInput' : 'forgotCaptcha';
      const value = kind === 'login' ? state.loginCaptchaInput : state.forgotCaptcha;
      return `<div class="rounded-xl border border-slate-200 bg-slate-50/70 p-3">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[12px] font-bold text-slate-600">${t('图形验证码', 'Visual captcha')}</span>
          <button type="button" data-action="refresh-captcha" data-captcha="${kind}" class="inline-flex items-center gap-1 rounded-lg px-1.5 py-1 text-[12px] font-semibold text-indigo-600 transition hover:bg-indigo-50">${icon('refresh-cw', 'h-3.5 w-3.5')}${t('换一张', 'Refresh')}</button>
        </div>
        <div class="mt-2 flex items-center gap-2">
          <div class="flex items-center gap-1.5">
            <span class="grid h-9 w-8 place-items-center rounded-lg border border-indigo-200 bg-indigo-50 font-mono text-[16px] font-bold text-indigo-700">${spec.a}</span>
            <span class="text-[14px] font-bold text-slate-500">+</span>
            <span class="grid h-9 w-8 place-items-center rounded-lg border border-indigo-200 bg-indigo-50 font-mono text-[16px] font-bold text-indigo-700">${spec.b}</span>
            <span class="text-[14px] font-bold text-slate-500">=</span>
          </div>
          <input type="text" inputmode="numeric" data-model="${model}" value="${esc(value)}" placeholder="${t('答案', 'Answer')}" class="h-9 w-20 rounded-lg border border-slate-200 bg-white px-2.5 text-center font-mono text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15" />
          <span class="text-[12px] font-medium text-slate-500">${t('点击换一张', 'Tap refresh')}</span>
        </div>
        <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">${t('单张有效期 5 分钟；频繁刷新将受限。', 'Each captcha is valid for 5 minutes; frequent refreshes are rate-limited.')}</p>
      </div>`;
    }

    function inlineError(message) {
      if (!message) return '';
      return `<div class="flex items-start gap-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[12px] font-semibold leading-relaxed text-rose-700">
        ${icon('alert-circle', 'h-4 w-4 shrink-0')}<span>${esc(message)}</span>
      </div>`;
    }

    function inlineNotice(message, tone) {
      if (!message) return '';
      const amber = tone !== 'emerald';
      return `<div class="flex items-start gap-2 rounded-xl border px-3 py-2.5 text-[12px] font-semibold leading-relaxed ${amber ? 'border-amber-300 bg-amber-50 text-amber-900' : 'border-emerald-200 bg-emerald-50 text-emerald-800'}">
        ${icon(amber ? 'info' : 'check-circle-2', 'h-4 w-4 shrink-0')}<span>${esc(message)}</span>
      </div>`;
    }

    function primaryBtn(attrs, label) {
      return `<button type="button" ${attrs} class="h-11 w-full rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white shadow-sm transition hover:bg-indigo-700 active:scale-[0.98] disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500 disabled:shadow-none">${label}</button>`;
    }

    function secondaryBtn(attrs, label) {
      return `<button type="button" ${attrs} class="h-9 rounded-xl border border-slate-300 bg-white px-3.5 text-[14px] font-semibold text-slate-800 transition hover:bg-slate-50">${label}</button>`;
    }

    function statusPill(status) {
      if (status === 'active') return `<span class="rounded-full border border-emerald-200 bg-emerald-100 px-2 py-0.5 text-[12px] font-bold text-emerald-700">${t('在任', 'Active')}</span>`;
      return `<span class="rounded-full border border-slate-200 bg-slate-100 px-2 py-0.5 text-[12px] font-bold text-slate-600">${t('已撤销', 'Revoked')}</span>`;
    }

    function identityPills(list) {
      return (list || []).map((x) => `<span class="rounded-full bg-slate-100 px-2 py-0.5 text-[12px] font-bold text-slate-700">${t('兼任', 'Also')}${esc(x)}</span>`).join('');
    }

    /* ------------------------------------------------------------------
     * 账号状态
     * ------------------------------------------------------------------ */
    function accountStatus() {
      if (state.deactivated) return 'deactivated';
      if (state.scenario === 'locked') return 'locked';
      if (state.scenario === 'banned') return 'banned';
      return 'active';
    }

      const meta = {

          box: 'border-emerald-200 bg-emerald-50/70', iconBox: 'bg-emerald-100 text-emerald-700',
          title: 'text-emerald-950', sub: 'text-emerald-800',
          desc: t('账号可正常登录，并使用当前身份授权的全部功能。', 'Your account can sign in and use all authorized features.')
        },
        locked: {
          label: '临时锁定', labelEn: 'Temporarily locked', icon: 'lock',
          box: 'border-amber-300 bg-amber-50/70', iconBox: 'bg-amber-100 text-amber-700',
          title: 'text-amber-950', sub: 'text-amber-900',
          desc: t('同一账号连续输错密码达 5 次，默认锁定 24 小时。可通过找回密码重置并提前解锁。', 'Five wrong passwords lock the account for 24 hours by default. Reset your password to unlock early.')

        },
        deactivated: {
          label: '已注销停用', labelEn: 'Deactivated', icon: 'user-x',
          box: 'border-dashed border-slate-400 bg-slate-50/60', iconBox: 'bg-slate-200 text-slate-600',
          title: 'text-slate-900', sub: 'text-slate-600',
          desc: t('账号已停用，历史课次、购课记录与相关凭证已按规保留。', 'Account deactivated. Historical lessons, orders and records are retained as required.')

            <button type="button" data-action="go-screen" data-screen="forgot" class="rounded-lg border border-amber-300 bg-white px-2 py-1 text-[12px] font-bold text-amber-900 transition hover:bg-amber-50">${t('前往找回密码', 'Reset password')}</button>
          </div>`
        : status === 'banned'
          ? `<div class="mt-2"><button type="button" data-action="toast" data-message="${t('客服通道为演示占位', 'Support channel demo placeholder')}" class="rounded-lg border border-rose-200 bg-white px-2 py-1 text-[12px] font-bold text-rose-700">${t('联系客服', 'Contact support')}</button></div>`
          : '';
      const adminProtectRow = state.role === 'admin' && status === 'active'
        ? `<div class="mt-2 flex items-center gap-1.5">
            <span class="inline-flex items-center gap-1 rounded-full bg-white/90 px-2.5 py-0.5 text-[12px] font-bold ${state.adminView === 'permanent' ? 'text-violet-700' : 'text-slate-700'}">

          </div>`
        : '';
      return `<section class="rounded-2xl border ${meta.box} p-4">
        <div class="flex items-start gap-3">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl ${meta.iconBox}">${icon(meta.icon, 'h-5 w-5')}</span>
          <div class="min-w-0 flex-1">

              <span class="inline-flex items-center gap-1">${icon('smartphone', 'h-3.5 w-3.5')}iPhone 15 · Safari</span>
            </div>
            ${lockedCountdown}
          </div>

        </div>`;
      } else if (step === 2) {
        const left = Math.max(0, Math.ceil((state.credentialUntil - Date.now()) / 1000));
        body = `<div class="space-y-4">
          ${emailStepBar()}
          <div class="flex items-center justify-between gap-2 rounded-xl border border-amber-300 bg-amber-50 px-3 py-2">
            <span class="text-[12px] font-bold text-amber-900">${t('操作确认有效时间', 'Confirmation window')}</span>
            <span class="rounded-lg bg-white px-2 py-1 font-mono text-[14px] font-bold text-amber-900" data-credential-text>${mmss(left)}</span>
          </div>
          <div class="rounded-xl border border-emerald-200 bg-emerald-50/60 px-3 py-2 text-[12px] font-semibold text-emerald-800">${t('当前邮箱验证通过，请在 10 分钟内完成新邮箱绑定', 'Current email verified. Bind your new email within 10 minutes.')}</div>
          <div>
            ${fieldLabel(t('新邮箱', 'New email'))}
            ${textInput('emailNew', { id: 'emailNew', type: 'email', icon: 'mail', value: state.emailNew, placeholder: 'new@example.com' })}
          </div>
          <div>
            ${fieldLabel(t('新邮箱验证码', 'New email code'))}
            <div class="flex items-start gap-2">
              <div class="min-w-0 flex-1">
                ${textInput('emailNewCode', { id: 'emailNewCode', inputmode: 'numeric', icon: 'shield-check', value: state.emailNewCode, placeholder: t('输入 6 位验证码', 'Enter 6-digit code') })}
              </div>
              <button type="button" data-action="email-send-new" class="h-11 shrink-0 rounded-xl border border-slate-300 bg-white px-3 text-[12px] font-bold text-slate-800 transition hover:bg-slate-50">${t('发送验证码', 'Send code')}</button>
            </div>
            ${state.emailNewSent ? `<p class="mt-1 text-[12px] font-semibold text-emerald-700">${t('验证码已发送（示例 123456）', 'Code sent (demo 123456)')}</p>` : ''}
            <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">${t('新邮箱验证码 120 秒内有效，连续输错 5 次即作废重发；提交时自动校验邮箱未被占用。', 'The new-email code is valid for 120s and voids after 5 wrong attempts; uniqueness is checked automatically on submit.')}</p>
          </div>
          ${inlineError(state.emailError)}
          ${primaryBtn('data-action="email-submit"', t('确认换绑', 'Confirm change'))}
          <div class="flex items-center justify-between gap-2">
            <button type="button" data-action="email-back" class="text-[12px] font-semibold text-slate-600 hover:text-slate-900">${t('上一步', 'Back')}</button>
            <button type="button" data-action="email-expire" class="text-[12px] font-semibold text-amber-700 hover:underline">${t('演示：确认超时', 'Demo: step expired')}</button>
          </div>
        </div>`;
      } else {
        body = `<div class="space-y-4 text-center">
          ${emailStepBar()}
          <div class="mx-auto mt-2 grid h-14 w-14 place-items-center rounded-2xl bg-emerald-50 text-emerald-600 ring-1 ring-emerald-200">${icon('check-circle-2', 'h-7 w-7')}</div>
          <h2 class="text-[18px] font-bold text-slate-900">${t('邮箱换绑成功', 'Email updated')}</h2>
          <p class="text-[14px] font-medium leading-relaxed text-slate-600">${t('后续课程与账户通知将发送至', 'Future notifications will go to')} ${esc(maskEmail(currentEmail()))}</p>
          <p class="text-[12px] font-medium leading-relaxed text-slate-500">${t('原旧邮箱已即时释放，可被其他账号重新注册或绑定；历史记录保留当时邮箱信息。', 'The old email has been released immediately and can be registered by another account; historical records keep the email used at that time.')}</p>
          <button type="button" data-action="go-back" class="h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">${t('完成', 'Done')}</button>
        </div>`;
      }
      return `<div class="mx-auto w-full max-w-[480px] bg-white px-4 pb-8 pt-5">${body}</div>`;
    }

    /* ------------------------------------------------------------------
     * 管理员管理
     * ------------------------------------------------------------------ */
    function visibleAdmins() {
      const q = state.adminQuery.trim().toLowerCase();
      return state.admins
        .filter((a) => state.adminFilter === 'all' || a.status === state.adminFilter)
        .filter((a) => !q || a.name.toLowerCase().includes(q) || a.email.toLowerCase().includes(q))
        .slice()
        .sort((a, b) => {
          const rank = (r) => (r.permanent ? 0 : r.status === 'active' ? 1 : 2);
          if (rank(a) !== rank(b)) return rank(a) - rank(b);
          return a.grantTime < b.grantTime ? 1 : -1;
        });
    }

    function adminCard(record) {
      const canManage = state.adminView === 'permanent';
      const isPermanent = Boolean(record.permanent);
      const isSelf = isPermanent && record.id === 'a1';
      const active = record.status === 'active';
      const avatarTone = isPermanent ? 'from-violet-500 to-indigo-700' : active ? 'from-indigo-500 to-indigo-700' : 'from-slate-500 to-slate-700';
      const available = state.admins.filter((a) => a.status === 'active').length;
      const revokeWouldEmpty = active && available - 1 < 1;
      let actions = '';
      if (isPermanent) {
        actions = `<span class="inline-flex h-7 items-center gap-1 rounded-lg border border-violet-200 bg-violet-50 px-2.5 text-[12px] font-bold text-violet-700">${icon('shield-check', 'h-3.5 w-3.5')}${t('受保护 · 禁止撤销或删除', 'Protected · cannot be revoked')}</span>`;
      } else if (!canManage) {
        actions = `<span class="inline-flex h-7 items-center gap-1 rounded-lg border border-slate-200 bg-white px-2.5 text-[12px] font-bold text-slate-500">${icon('eye', 'h-3.5 w-3.5')}${t('只读查看', 'Read-only')}</span>`;
      } else if (active) {
        actions = `<button type="button" data-action="edit-admin" data-id="${record.id}" class="h-7 rounded-lg border border-indigo-200 bg-white px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-50">${t('编辑名称', 'Edit name')}</button>
           <button type="button" data-action="revoke-admin" data-id="${record.id}" ${revokeWouldEmpty ? 'disabled title="' + t('撤销后全平台可用管理员将归零', 'No usable admin would remain') + '"' : ''} class="h-7 rounded-lg border border-rose-200 bg-white px-2.5 text-[12px] font-bold text-rose-700 transition hover:bg-rose-50 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-100 disabled:text-slate-500">${t('撤销职务', 'Revoke')}</button>`;
      } else {
        actions = `<button type="button" data-action="restore-admin" data-id="${record.id}" class="h-7 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100">${t('重新授权', 'Restore')}</button>`;
      }
      return `<div data-admin-card="${record.id}" class="rounded-2xl border ${isPermanent ? 'border-violet-300 bg-violet-50/50' : active ? 'border-slate-300 bg-slate-50/70' : 'border-dashed border-slate-400 bg-slate-50/60'} p-3.5">
        <div class="flex items-start gap-3">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-gradient-to-br ${avatarTone} text-[14px] font-bold text-white">${esc((record.name || '?').slice(0, 1))}</span>
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="text-[16px] font-bold text-slate-900">${esc(record.name)}</span>
              ${isSelf ? `<span class="rounded-full bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${t('本人', 'You')}</span>` : ''}
              ${statusPill(record.status)}
            </div>
            <div class="mt-1 flex flex-wrap gap-1">
              ${isPermanent
                ? `<span class="rounded-full bg-violet-600 px-2 py-0.5 text-[12px] font-bold text-white">${t('永久主管理员 · 不可撤销', 'Permanent master admin · Irrevocable')}</span>`
                : `<span class="rounded-full bg-slate-100 px-2 py-0.5 text-[12px] font-bold text-slate-700">${t('普通管理员', 'Normal admin')}</span>`}
            </div>
            <div class="mt-0.5 truncate text-[12px] font-medium text-slate-600">${esc(record.email)}</div>
            <div class="mt-1.5 flex flex-wrap gap-1">${identityPills(record.identities)}</div>
            <div class="mt-2 space-y-0.5 text-[12px] font-medium text-slate-600">
              <div>${t('授任', 'Granted')}：${esc(record.grantor)} · ${esc(record.grantTime)}</div>
              ${record.status === 'revoked' ? `<div class="text-slate-600">${t('撤销', 'Revoked')}：${esc(record.revoker)} · ${esc(record.revokeTime)}</div>` : ''}
            </div>
            <div class="mt-2 flex flex-wrap items-center gap-1.5">${actions}</div>
          </div>
        </div>
      </div>`;
    }

    function adminListHTML() {
      const list = visibleAdmins();
      if (!list.length) {
        return `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center">
          <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-slate-50 text-slate-500 ring-1 ring-slate-200">${icon('search', 'h-5 w-5')}</div>
          <p class="mt-3 text-[14px] font-bold text-slate-700">${t('没有匹配的管理员', 'No matching admins')}</p>
          <p class="mt-1 text-[12px] font-medium text-slate-500">${t('可调整搜索词或状态筛选后重试。', 'Try another search term or status filter.')}</p>
        </div>`;
      }
      return list.map(adminCard).join('');
    }

    function renderAdmins() {
      if (state.role !== 'admin') {
        return `<div class="mx-auto flex w-full max-w-[480px] flex-col items-center justify-center bg-white px-8 pt-20 text-center">
          <div class="grid h-16 w-16 place-items-center rounded-2xl bg-rose-50 text-rose-600 ring-1 ring-rose-200">${icon('lock', 'h-7 w-7')}</div>
          <h2 class="mt-4 text-[18px] font-bold text-slate-900">${t('无权限访问', 'Access denied')}</h2>
          <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-600">${t('仅平台在任管理员可查看平台管理员名单；班长、老师与家长无权访问。', 'Only active platform admins can view the admin list. Monitors, teachers and parents have no access.')}</p>
          <button type="button" data-action="go-screen" data-screen="me" class="mt-5 h-11 rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white shadow-sm transition hover:bg-indigo-700">${t('返回我的', 'Back to me')}</button>
        </div>`;
      }
      const activeCount = state.admins.filter((a) => a.status === 'active').length;
      const canManage = state.adminView === 'permanent';
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 bg-white px-4 py-4 pb-8">
        <div class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5">
          <div class="flex items-center gap-2.5">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-white text-indigo-600 ring-1 ring-slate-200">${icon('users', 'h-4 w-4')}</span>
            <div class="min-w-0 flex-1">
              <div class="text-[14px] font-bold text-slate-900">${t('平台管理员名单', 'Platform admins')}</div>
              <div class="text-[12px] font-medium text-slate-600">${t(`共 ${state.admins.length} 条记录 · 在任 ${activeCount} 名`, `${state.admins.length} records · ${activeCount} active`)}</div>
            </div>
            ${!canManage ? `<span class="shrink-0 rounded-full bg-amber-100 px-2.5 py-0.5 text-[12px] font-bold text-amber-900">${t('只读查看', 'Read-only')}</span>` : ''}
          </div>
          <div class="mt-2.5 flex items-center gap-1.5 border-t border-slate-200/80 pt-2.5">
            <span class="rounded-full bg-violet-100 px-2.5 py-0.5 text-[12px] font-bold text-violet-700">${t('永久主管理员 · 不可撤销', 'Permanent master admin · Irrevocable')}</span>
            <button type="button" data-action="open-recovery-info" class="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-white text-indigo-600 ring-1 ring-slate-200 transition hover:bg-indigo-50" aria-label="${t('应急恢复说明', 'Emergency recovery info')}">${icon('info', 'h-3.5 w-3.5')}</button>
          </div>
        </div>

        <div class="space-y-2">
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
            <input id="adminSearch" type="text" data-model="adminQuery" value="${esc(state.adminQuery)}" placeholder="${t('搜索显示名称或 Email', 'Search name or email')}" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 pl-9 pr-3 text-[16px] text-slate-900 outline-none transition placeholder:text-slate-500 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15" />
          </div>
          <div class="flex items-center gap-1.5 overflow-x-auto py-0.5">
            ${[['all', '全部', 'All'], ['active', '在任', 'Active'], ['revoked', '已撤销', 'Revoked']].map(([value, zh, en]) => `<button type="button" data-action="set-admin-filter" data-filter="${value}" class="h-8 shrink-0 rounded-full px-3 text-[12px] font-semibold transition ${state.adminFilter === value ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200/80'}">${t(zh, en)}</button>`).join('')}
          </div>
        </div>
        <div id="adminList" class="space-y-2.5">${adminListHTML()}</div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 覆盖层：通用弹窗
     * ------------------------------------------------------------------ */
    function modalShell(title, subtitle, body, opts) {
      const o = opts || {};
      const close = o.blocking ? '' : `<button type="button" data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-xl text-slate-500 transition hover:bg-slate-100" aria-label="${t('关闭', 'Close')}">${icon('x', 'h-4 w-4')}</button>`;
      return `<div class="absolute inset-0 z-50 flex items-center justify-center p-4">
        <div ${o.blocking ? '' : 'data-action="close-overlay"'} class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]"></div>
        <div class="relative flex max-h-[92%] w-full max-w-[340px] flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl">
          <div class="flex shrink-0 items-start justify-between gap-2 border-b border-slate-100 px-4 py-3">
            <div class="min-w-0">
              <h3 class="text-[16px] font-bold text-slate-900">${title}</h3>
              ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">${subtitle}</p>` : ''}
            </div>
            ${close}
          </div>
          <div class="min-h-0 flex-1 overflow-y-auto p-4">${body}</div>
        </div>
      </div>`;
    }

    function sheetShell(title, subtitle, body) {
      return `<div class="absolute inset-0 z-50 flex items-end">
        <div data-action="close-overlay" class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]"></div>
        <div class="relative flex max-h-[85%] w-full flex-col overflow-hidden rounded-t-3xl border-t border-slate-200 bg-white shadow-2xl">
          <div class="shrink-0 border-b border-slate-100 px-4 pb-2 pt-3">
            <div class="mx-auto mb-2 h-1 w-10 rounded-full bg-slate-300"></div>
            <div class="flex items-center justify-between gap-2">
              <div class="min-w-0">
                <h3 class="text-[16px] font-bold text-slate-900">${title}</h3>
                <p class="mt-0.5 text-[12px] font-medium text-slate-600">${subtitle}</p>
              </div>
              <button type="button" data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-xl text-slate-500 transition hover:bg-slate-100" aria-label="${t('关闭', 'Close')}">${icon('x', 'h-4 w-4')}</button>
            </div>
          </div>
          <div class="flex-1 overflow-y-auto p-4">${body}</div>
        </div>
      </div>`;
    }

    function renderOverlay() {
      const root = $('overlayRoot');
      if (!root) return;
      if (!state.overlay) { root.innerHTML = ''; return; }
      let html = '';
      if (state.overlay === 'terms' || state.overlay === 'privacy') html = legalSheet(state.overlay);
      else if (state.overlay === 'reg-captcha') html = regCaptchaSheet();
      else if (state.overlay === 'reg-success') html = regSuccessSheet();
      else if (state.overlay === 'forgot-success') html = simpleSuccessSheet(t('密码已重置', 'Password reset'), t('所有已登录设备已退出，临时锁定已同步解除', 'All signed-in devices have been signed out, and any temporary lock is lifted'), 'forgot-success-close');
      else if (state.overlay === 'pw-success') html = simpleSuccessSheet(t('密码已修改', 'Password changed'), t('所有已登录设备已退出，请使用新密码重新登录', 'All signed-in devices have been signed out. Sign in with your new password.'), 'pw-success-close');
      else if (state.overlay === 'delete-success') html = simpleSuccessSheet(t('账号已停用', 'Account deactivated'), t('账号已停用，历史课次、购课记录与相关凭证已按规保留。', 'Account deactivated. Historical lessons, orders and records are retained as required.'), 'delete-success-close');
      else if (state.overlay === 'banned') html = bannedSheet();
      else if (state.overlay === 'logout') html = logoutSheet();
      else if (state.overlay === 'delete-account') html = deleteSheet();
      else if (state.overlay === 'recovery-info') html = recoveryInfoModal();
      else if (state.overlay === 'edit-profile') html = editProfileModal();
      else if (state.overlay === 'add-admin') html = addAdminSheet();
      else if (state.overlay === 'edit-admin') html = editAdminSheet();
      else if (state.overlay === 'revoke-admin') html = revokeAdminSheet();
      root.innerHTML = html;
      if (window.lucide) window.lucide.createIcons();
    }

    function legalSheet(doc) {
      const isTerms = doc === 'terms';
      const title = isTerms ? t('用户服务协议', 'Terms of Service') : t('隐私保护政策', 'Privacy Policy');
      const version = isTerms ? 'v2.3' : 'v1.8';
      const date = isTerms ? '2026-10-01' : '2026-09-15';
      const sections = isTerms ? [
        ['一、服务范围', 'Dream 为教务排课与分账管理平台，提供账号登录、档案管理、排课与结算相关功能。'],
        ['二、账号使用', '用户应使用本人常用邮箱注册并妥善保管登录密码。账号仅限本人使用，不得转让或出借。'],
        ['三、课程与排课', '固定位、临时课、试课与代课的排课规则以平台展示与班长确认为准。'],
        ['四、协议更新', '平台协议升级时将展示新版本并重新征得同意，历史签署版本永久留痕。']
      ] : [
        ['一、信息收集', '平台仅收集账号登录、身份绑定与业务履约所必需的信息。'],
        ['二、信息使用', '所收集信息用于排课通知、账号安全与教务协作，不用于与服务无关的用途。'],
        ['三、未成年人保护', '涉及学员信息时，平台遵循最小化原则并进行必要的脱敏展示。'],
        ['四、用户权利', '用户可查询、更正个人资料，并按平台规则申请换绑邮箱或注销账号。']
      ];
      return sheetShell(title, `${t('版本', 'Version')} ${version} · ${t('生效日期', 'Effective')} ${date}`, `
        <div class="space-y-3">
          <div class="rounded-xl border border-indigo-200 bg-indigo-50/60 px-3 py-2 text-[12px] font-semibold text-indigo-900">
            ${t('当前版本', 'Current version')}：${version} · ${t('生效日期', 'Effective date')}：${date}
          </div>
          ${sections.map(([h, p]) => `<div>
            <h4 class="text-[14px] font-bold text-slate-900">${esc(h)}</h4>
            <p class="mt-1 text-[14px] font-medium leading-relaxed text-slate-700">${esc(p)}</p>
          </div>`).join('')}
          <p class="text-[12px] font-medium leading-relaxed text-slate-500">${t('演示文稿仅用于交互展示，正式条文以法务定稿版本为准。', 'Demo copy for interaction only. Final legal text prevails.')}</p>
          <button type="button" data-action="close-overlay" class="h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">${t('我已阅读', 'I have read')}</button>
        </div>`);
    }

    function regCaptchaSheet() {
      const spec = captchaSpec(state.regCaptchaSeed);
      return modalShell(t('安全验证', 'Security check'), t('发送验证码前，请完成图形验证', 'Complete the visual check before sending the code'), `
        <div class="space-y-3">
          <div class="rounded-xl border border-slate-200 bg-slate-50/70 p-3">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[12px] font-bold text-slate-600">${t('图形验证码', 'Visual captcha')}</span>
              <button type="button" data-action="refresh-reg-captcha" class="inline-flex items-center gap-1 rounded-lg px-1.5 py-1 text-[12px] font-semibold text-indigo-600 transition hover:bg-indigo-50">${icon('refresh-cw', 'h-3.5 w-3.5')}${t('换一张', 'Refresh')}</button>
            </div>
            <div class="mt-2 flex items-center gap-2">
              <span class="grid h-10 w-9 place-items-center rounded-lg border border-indigo-200 bg-indigo-50 font-mono text-[16px] font-bold text-indigo-700">${spec.a}</span>
              <span class="text-[14px] font-bold text-slate-500">+</span>

          <button type="button" data-action="revoke-submit" data-revoke-submit class="h-11 flex-1 rounded-xl bg-rose-600 text-[14px] font-semibold text-white transition hover:bg-rose-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">${t('确认撤销', 'Revoke')}</button>

    /* ------------------------------------------------------------------
     * 动作：登录 / 注册 / 找回
     * ------------------------------------------------------------------ */
    function doLogin() {
      if (state.maintenance) { toast('系统维护中，暂停登录'); return; }
      const email = state.loginEmail.trim();
      if (!email) { state.loginError = t('请输入 Email 地址', 'Please enter your email'); render(); return; }
      if (!EMAIL_RE.test(email)) { state.loginError = t('请输入有效的 Email 地址', 'Please enter a valid email'); render(); return; }
      if (!state.loginPassword) { state.loginError = t('请输入登录密码', 'Please enter your password'); render(); return; }

      if (state.scenario === 'banned') {
        state.accountStatus = 'banned';
        state.overlay = 'banned';
        render();
        return;
      }
      if (state.scenario === 'inactive') {
        state.loginNotice = 'inactive';
        state.loginError = '';
        render();
        return;
      }
      if (state.scenario === 'locked') {
        if (state.lockSeconds <= 0) { state.lockSeconds = 24 * 60 * 60; startLockTimer(); }
        state.loginError = '';
        state.loginNotice = '';
        render();
        return;
      }
      if (state.loginCaptcha) {
        const expect = captchaSpec(state.loginCaptchaSeed).answer;
        if (state.loginCaptchaInput.trim() !== expect) {
          state.loginError = t('图形验证码不正确，请重新输入', 'Incorrect captcha. Please try again.');
          state.loginCaptchaInput = '';
          state.loginCaptchaSeed += 1;
          render();
          return;
        }
      }
      if (state.scenario === 'wrong') {
        state.loginAttempts += 1;
        state.loginCaptcha = state.loginAttempts >= 2;
        state.loginPassword = '';
        state.loginCaptchaInput = '';
        state.loginCaptchaSeed += 1;
        if (state.loginAttempts >= 5) {
          state.scenario = 'locked';
          state.lockSeconds = 24 * 60 * 60;
          state.loginNotice = '';
          state.loginError = t('连续输错密码达 5 次，账号已临时锁定 24 小时', 'Five wrong passwords. The account is locked for 24 hours.');
          startLockTimer();
          render();
          return;
        }
        state.loginError = t('账号或密码不正确', 'Incorrect account or password');
        render();
        return;
      }

      state.loggedIn = true;
      state.loginAttempts = 0;
      state.loginCaptcha = false;
      state.loginCaptchaInput = '';
      state.loginError = '';
      state.loginNotice = '';
      state.accountStatus = 'active';
      state.screen = 'me';
      syncUrl();
      render();
      toast(t('登录成功，欢迎回来', 'Signed in successfully'));
    }

    function startActivationCooldown() {
      state.activationWait = 60;
      clearInterval(activationTimer);
      activationTimer = setInterval(() => {
        state.activationWait = Math.max(0, state.activationWait - 1);
        if (state.activationWait <= 0) {
          clearInterval(activationTimer);
          activationTimer = null;
          render();
          return;
        }
        const btn = document.querySelector('[data-action="resend-activation"]');
        if (btn) {
          btn.disabled = true;
          btn.textContent = `${state.activationWait}s ${t('后可重发', 'to resend')}`;
        }
      }, 1000);
    }

    function startRegCountdown() {      state.regCountdown = 60;
      clearInterval(regTimer);
      regTimer = setInterval(() => {
        state.regCountdown = Math.max(0, state.regCountdown - 1);
        const span = document.querySelector('[data-reg-code-text]');
        const btn = document.getElementById('regSendCode');
        if (span) span.textContent = state.regCountdown > 0 ? `${state.regCountdown}s ${t('后重发', 'left')}` : t('发送验证码', 'Send code');
        if (btn) btn.disabled = state.regCountdown > 0 || !state.openRegistration || state.maintenance;
        if (state.regCountdown <= 0) { clearInterval(regTimer); regTimer = null; }
      }, 1000);
    }

    function startLockTimer() {
      clearInterval(lockTimer);
      lockTimer = setInterval(() => {
        state.lockSeconds = Math.max(0, state.lockSeconds - 1);
        document.querySelectorAll('[data-lock-countdown]').forEach((el) => { el.textContent = mmss(state.lockSeconds); });
        if (state.lockSeconds <= 0) {
          clearInterval(lockTimer);
          lockTimer = null;
          state.scenario = 'normal';
          state.accountStatus = 'active';
          render();
          toast('临时锁定已解除，请重新登录');
        }
      }, 1000);
    }

    function triggerSendRegCode() {
      if (!state.openRegistration) { toast('平台暂未开放注册'); return; }
      if (state.regCountdown > 0) return;
      const email = state.reg.email.trim();
      if (!email) { state.regError = t('请输入 Email 地址', 'Please enter your email'); render(); return; }
      if (!EMAIL_RE.test(email)) { state.regError = t('请输入有效的 Email 地址', 'Please enter a valid email'); render(); return; }
      if (norm(email) === TAKEN_EMAIL) {
        state.regError = t('该邮箱已被注册，请直接登录或更换邮箱', 'This email is already registered. Sign in or use another email.');
        render();
        return;
      }
      state.regError = '';
      state.regCaptchaInput = '';
      state.regCaptchaSeed += 1;
      state.overlay = 'reg-captcha';
      state.overlayError = '';
      render();
    }

    function confirmRegCaptcha() {
      const expect = captchaSpec(state.regCaptchaSeed).answer;
      if (state.regCaptchaInput.trim() !== expect) {
        state.overlayError = t('图形验证码不正确，请重新输入', 'Incorrect captcha. Please try again.');
        state.regCaptchaSeed += 1;
        state.regCaptchaInput = '';
        render();
        return;
      }
      state.overlay = null;
      state.overlayError = '';
      state.regCodeSent = true;
      startRegCountdown();
      render();
      toast(t('验证码已发送，请查收邮件（示例 123456）', 'Code sent. Check your inbox (demo 123456).'));
    }

    function doRegister() {
      if (!state.openRegistration) { toast('平台暂未开放注册'); return; }
      if (state.maintenance) { toast('系统维护中，暂停注册'); return; }
      if (!state.reg.agree) { state.regError = t('请先阅读并同意《用户服务协议》与《隐私保护政策》', 'Please accept both agreements first.'); render(); return; }
      if (!EMAIL_RE.test(state.reg.email.trim())) { state.regError = t('请输入有效的 Email 地址', 'Please enter a valid email'); render(); return; }
      if (norm(state.reg.email) === TAKEN_EMAIL) { state.regError = t('该邮箱已被注册，请直接登录或更换邮箱', 'This email is already registered. Sign in or use another email.'); render(); return; }
      if (state.reg.code.trim() !== DEMO_CODE) {
        state.regCodeFailures += 1;
        if (state.regCodeFailures >= 5) {
          state.regCodeFailures = 0;
          state.reg.code = '';
          state.regCodeSent = false;
          startRegCountdown();
          state.regError = t('验证码错误次数过多，请重新获取验证码（60 秒冷却后重发）', 'Too many wrong codes. Request a new code after the 60s cooldown.');
        } else {
          state.regError = t(`邮箱验证码不正确，还可尝试 ${5 - state.regCodeFailures} 次`, `Incorrect email code. ${5 - state.regCodeFailures} attempts left.`);
        }
        render();
        return;
      }
      state.regCodeFailures = 0;
      if (!strengthOk(state.reg.password)) { state.regError = t('密码需同时包含大写字母、小写字母、数字与特殊字符，且至少 8 位', 'Password must include upper/lowercase letters, a number and a special character.'); render(); return; }
      if (state.reg.password !== state.reg.confirm) { state.regError = t('两次输入的密码不一致', 'Passwords do not match'); render(); return; }
      state.loginEmail = state.reg.email.trim();
      state.overlay = 'reg-success';
      render();
    }

    function sendForgotCode() {
      const email = state.forgotEmail.trim();
      if (!email) { state.forgotError = t('请输入注册邮箱', 'Please enter your registered email'); render(); return; }
      if (!EMAIL_RE.test(email)) { state.forgotError = t('请输入有效的 Email 地址', 'Please enter a valid email'); render(); return; }
      if (!ACCOUNT_DIRECTORY[norm(email)]) { state.forgotError = t('该账号未注册', 'This account is not registered'); render(); return; }
      const account = ACCOUNT_DIRECTORY[norm(email)];
      if (account.status === 'banned') { state.forgotError = t('该账号已被封禁，暂不可重置密码；请联系平台运营支持处理', 'This account is banned. Password reset is blocked; contact platform support.'); render(); return; }
      if (account.status === 'deactivated' || account.status === 'locked') {
        state.forgotError = account.status === 'deactivated'
          ? t('该账号已注销停用，暂不可重置密码', 'This account is deactivated and cannot reset its password.')
          : t('该账号当前处于临时锁定，可通过邮箱验证重置密码提前解锁', 'This account is temporarily locked. Reset via email to unlock early.');
        if (account.status === 'deactivated') { render(); return; }
      }
      const expect = captchaSpec(state.forgotCaptchaSeed).answer;
      if (state.forgotCaptcha.trim() !== expect) {
        state.forgotError = t('图形验证码不正确，请重新输入', 'Incorrect captcha. Please try again.');
        state.forgotCaptcha = '';
        state.forgotCaptchaSeed += 1;
        render();
        return;
      }
      state.forgotStep = 2;
      state.forgotError = '';
      state.forgotCode = '';
      state.forgotCodeFailures = 0;
      render();
      toast(t('重置验证码已发送（示例 123456）', 'Reset code sent (demo 123456).'));
    }

    function doForgotReset() {
      if (state.forgotCode.trim() !== DEMO_CODE) {
        state.forgotCodeFailures += 1;
        if (state.forgotCodeFailures >= 5) {
          state.forgotCodeFailures = 0;
          state.forgotCode = '';
          state.forgotStep = 1;
          state.forgotError = t('验证码错误次数过多，当前验证码已作废，请待 60 秒冷却后重新获取验证码', 'Too many wrong codes. The code is void; request a new one after the 60s cooldown.');
        } else {
          state.forgotError = t(`邮箱验证码不正确，还可尝试 ${5 - state.forgotCodeFailures} 次`, `Incorrect email code. ${5 - state.forgotCodeFailures} attempts left.`);
        }
        render();
        return;
      }
      state.forgotCodeFailures = 0;
      if (!strengthOk(state.forgotPassword)) { state.forgotError = t('密码需同时包含大写字母、小写字母、数字与特殊字符，且至少 8 位', 'Password must meet all strength rules.'); render(); return; }
      if (state.forgotPassword !== state.forgotConfirm) { state.forgotError = t('两次输入的密码不一致', 'Passwords do not match'); render(); return; }
      state.accountStatus = 'active';
      state.scenario = 'normal';
      state.lockSeconds = 0;
      clearInterval(lockTimer);
      lockTimer = null;
      state.overlay = 'forgot-success';
      render();
    }

    function forgotExpireDemo() {
      state.forgotStep = 1;
      state.forgotCode = '';
      state.forgotPassword = '';
      state.forgotConfirm = '';
      state.forgotCaptcha = '';
      state.forgotCaptchaSeed += 1;
      state.forgotError = t('操作超时，请重新验证当前邮箱', 'Step timed out. Verify your email again.');
      render();
      toast(t('操作超时，请重新验证当前邮箱', 'Step timed out. Verify your email again.'));
    }

    /* ------------------------------------------------------------------
     * 动作：安全中心 / 改密 / 换绑邮箱
     * ------------------------------------------------------------------ */
    function clearCache() {
      toast(t('缓存已清理，登录状态保持有效', 'Cache cleared. You are still signed in.'));
    }

    function doLogout() {
      state.overlay = null;
      state.loggedIn = false;
      state.screen = 'login';
      state.loginPassword = '';
      state.loginError = '';
      syncUrl();
      render();
      toast(t('已退出登录', 'Signed out'));
    }

    function startCredentialTimer() {
      clearInterval(credentialTimer);
      credentialTimer = setInterval(() => {
        const left = Math.max(0, Math.ceil((state.credentialUntil - Date.now()) / 1000));
        document.querySelectorAll('[data-credential-text]').forEach((el) => { el.textContent = mmss(left); });
        if (left <= 0) {
          clearInterval(credentialTimer);
          credentialTimer = null;
          expireEmailCredential();
        }
      }, 1000);
    }

    function expireEmailCredential() {
      if (state.screen !== 'change-email') return;
      state.emailStep = 1;
      state.emailError = t('操作超时，请重新验证当前邮箱', 'Step timed out. Verify your current email again.');
      state.credentialUntil = 0;
      state.emailCurrentCode = '';
      state.emailNew = '';
      state.emailNewCode = '';
      state.emailCurrentSent = false;
      state.emailNewSent = false;
      clearInterval(credentialTimer); credentialTimer = null;
      render();
      toast(t('操作超时，请重新验证当前邮箱', 'Step timed out. Verify your current email again.'));
    }

    function emailSendCurrent() {
      state.emailCurrentSent = true;
      state.emailCurrentFailures = 0;
      state.emailError = '';
      render();
      toast(t('验证码已发送至当前邮箱（示例 123456）', 'Code sent to current email (demo 123456).'));
    }

    function emailNext() {
      if (!state.emailCurrentSent) { state.emailError = t('请先获取当前邮箱验证码', 'Send the code to your current email first.'); render(); return; }
      if (norm(state.emailCurrentCode) !== DEMO_CODE) {
        state.emailCurrentFailures += 1;
        if (state.emailCurrentFailures >= 5) {
          state.emailCurrentFailures = 0;
          state.emailCurrentCode = '';
          state.emailCurrentSent = false;
          state.emailError = t('当前邮箱验证码错误次数过多，已作废，请重新获取验证码', 'Too many wrong codes for the current email. Request a new code.');
        } else {
          state.emailError = t(`当前邮箱验证码不正确，还可尝试 ${5 - state.emailCurrentFailures} 次`, `Incorrect current email code. ${5 - state.emailCurrentFailures} attempts left.`);
        }
        render();
        return;
      }
      state.emailCurrentFailures = 0;
      state.emailStep = 2;
      state.emailError = '';
      state.emailNew = '';
      state.emailNewCode = '';
      state.emailNewFailures = 0;
      state.emailNewSent = false;
      state.credentialUntil = Date.now() + 10 * 60 * 1000;
      render();
      startCredentialTimer();
      toast(t('当前邮箱验证通过，请在 10 分钟内完成新邮箱绑定', 'Current email verified. Complete binding within 10 minutes.'));
    }

    function emailSendNew() {
      const email = state.emailNew.trim();
      if (!email) { state.emailError = t('请输入新邮箱', 'Please enter the new email'); render(); return; }
      if (!EMAIL_RE.test(email)) { state.emailError = t('请输入有效的新邮箱', 'Please enter a valid new email'); render(); return; }
      if (norm(email) === norm(currentEmail())) { state.emailError = t('新邮箱不能与当前邮箱相同', 'New email must differ from the current one.'); render(); return; }
      if (norm(email) === TAKEN_EMAIL || ACCOUNT_DIRECTORY[norm(email)]) { state.emailError = t('该邮箱已被其他账号使用，请更换邮箱', 'This email is already used by another account.'); render(); return; }
      state.emailNewSent = true;
      state.emailNewFailures = 0;
      state.emailError = '';
      render();
      toast(t('验证码已发送至新邮箱（示例 123456）', 'Code sent to new email (demo 123456).'));
    }

    function emailSubmit() {
      if (state.credentialUntil <= Date.now()) { expireEmailCredential(); return; }
      if (!state.emailNewSent) { state.emailError = t('请先获取新邮箱验证码', 'Send the code to the new email first.'); render(); return; }
      if (norm(state.emailNewCode) !== DEMO_CODE) {
        state.emailNewFailures += 1;
        if (state.emailNewFailures >= 5) {
          state.emailNewFailures = 0;
          state.emailNewCode = '';
          state.emailNewSent = false;
          state.emailError = t('新邮箱验证码错误次数过多，已作废，请重新获取验证码', 'Too many wrong codes for the new email. Request a new code.');
        } else {
          state.emailError = t(`新邮箱验证码不正确，还可尝试 ${5 - state.emailNewFailures} 次`, `Incorrect new email code. ${5 - state.emailNewFailures} attempts left.`);
        }
        render();
        return;
      }
      state.emailNewFailures = 0;
      const newEmail = state.emailNew.trim().toLowerCase();
      if (!EMAIL_RE.test(newEmail)) { state.emailError = t('请输入有效的新邮箱', 'Please enter a valid new email'); render(); return; }
      if (norm(newEmail) === TAKEN_EMAIL || ACCOUNT_DIRECTORY[norm(newEmail)]) { state.emailError = t('该邮箱已被其他账号使用，请更换邮箱', 'This email is already used by another account.'); render(); return; }
      state.emails[state.role] = newEmail;
      if (state.role === 'admin') {
        const self = state.admins.find((a) => a.id === 'a1');
        if (self) self.email = newEmail;
      }
      state.emailStep = 3;
      state.emailError = '';
      state.credentialUntil = 0;
      clearInterval(credentialTimer); credentialTimer = null;
      render();
      toast(t('邮箱换绑成功', 'Email updated'));
    }

    function submitPasswordChange() {
      if (!state.cpCurrent.trim()) { state.cpError = t('请输入当前密码', 'Please enter your current password'); render(); return; }
      if (!strengthOk(state.cpPassword)) { state.cpError = t('新密码需满足全部强度规则', 'New password must meet all strength rules.'); render(); return; }
      if (state.cpPassword !== state.cpConfirm) { state.cpError = t('两次输入的新密码不一致', 'New passwords do not match'); render(); return; }
      state.loggedIn = false;
      state.overlay = 'pw-success';
      render();
    }

    /* ------------------------------------------------------------------
     * 动作：注销账号
     * ------------------------------------------------------------------ */
    function submitDelete() {
      const d = deleteDefense();
      if (d.blocked) { state.deleteError = t('存在未清零事项，暂不可注销', 'Some checks are unresolved.'); render(); return; }
      if (norm(state.deleteConfirm) !== norm(currentName()) && norm(state.deleteConfirm) !== norm(currentEmail())) {
        state.deleteError = t('昵称或邮箱与当前账号不一致', 'Name or email does not match.');
        render();
        return;
      }
      state.deactivated = true;
      state.overlay = 'delete-success';
      render();
    }

    /* ------------------------------------------------------------------
     * 动作：管理员管理
     * ------------------------------------------------------------------ */
    function openAddAdmin(prefillEmail, restoreId) {
      if (state.adminView !== 'permanent') { toast(t('仅永久主管理员可执行管理员授权写操作', 'Only the permanent master admin can grant admin rights.')); return; }
      state.overlay = 'add-admin';
      state.addEmail = prefillEmail || '';
      state.addName = '';
      state.addConfirm = '';
      state.addError = '';
      state.addLookup = null;
      state.addRestoreId = restoreId || '';
      if (prefillEmail) performLookup(true);
      render();
    }

    function performLookup(silent) {
      const email = norm(state.addEmail);
      state.addError = '';
      state.addLookup = null;
      state.addRestoreId = '';
      if (!email) {
        state.addError = t('请输入已注册邮箱', 'Enter a registered email');
        if (!silent) render();
        return;
      }
      const account = ACCOUNT_DIRECTORY[email];
      if (!account) {
        state.addLookup = { ok: false, name: '', identities: [] };
        state.addError = t('该邮箱尚未注册，请先完成注册', 'This email is not registered yet.');
        if (!silent) render();
        return;
      }
      const statusLabel = account.status === 'active' ? t('正常生效', 'Active') : account.status === 'locked' ? t('临时锁定', 'Temporarily locked') : account.status === 'banned' ? t('已封禁', 'Banned') : t('已注销停用', 'Deactivated');
      if (account.status !== 'active') {
        state.addLookup = { ok: false, name: account.name, identities: account.identities, statusLabel };
        state.addError = account.status === 'locked'
          ? t('该账号处于临时锁定状态，暂不可授任', 'This account is locked and cannot be granted admin rights.')
          : account.status === 'banned'
            ? t('该账号已被封禁，暂不可授任', 'This account is banned and cannot be granted admin rights.')
            : t('该账号已注销停用，暂不可授任', 'This account is deactivated and cannot be granted admin rights.');
        if (!silent) render();
        return;
      }
      const existing = state.admins.find((a) => norm(a.email) === email);
      if (existing && existing.status === 'active') {
        state.addLookup = { ok: true, name: account.name, identities: account.identities, statusLabel };
        state.addError = t('该账号已具备平台管理员权限', 'This account already has platform admin rights.');
        if (!silent) render();
        return;
      }
      state.addLookup = { ok: true, name: account.name, identities: account.identities, statusLabel };
      if (existing && existing.status === 'revoked') {
        state.addRestoreId = existing.id;
        state.addName = existing.name || account.name;
      } else {
        state.addName = account.name;
      }
      if (!silent) render();
    }

    function submitAddAdmin() {
      if (state.adminView !== 'permanent') { state.addError = t('仅永久主管理员可执行授权操作', 'Only the permanent master admin can grant admin rights.'); render(); return; }
      if (!state.addLookup || !state.addLookup.ok || state.addError) return;
      const email = norm(state.addEmail);
      const name = state.addName.trim();
      if (name.length < 1 || name.length > 50) { state.addError = t('显示名称需为 1–50 个字符', 'Display name must be 1–50 characters.'); render(); return; }
      if (norm(state.addConfirm) !== norm(name) && norm(state.addConfirm) !== email) {
        state.addError = t('确认文本需与目标名称或邮箱一致', 'Confirmation must match the name or email.');
        render();
        return;
      }
      const existing = state.admins.find((a) => norm(a.email) === email);
      if (existing && existing.status === 'active') { state.addError = t('该账号已具备平台管理员权限', 'This account already has platform admin rights.'); render(); return; }
      if (existing) {
        existing.status = 'active';
        existing.name = name;
        existing.grantor = currentName();
        existing.grantTime = nowStamp();
        existing.revoker = '';
        existing.revokeTime = '';
        state.overlay = null;
        render();
        toast(t(`已恢复 ${name} 的平台管理员权限`, `Restored admin access for ${name}`));
        return;
      }
      const record = {
        id: `a_${Date.now()}`,
        email,
        name,
        status: 'active',
        identities: (state.addLookup.identities || ['家长']).slice(),
        grantor: currentName(),
        grantTime: nowStamp(),
        revoker: '',
        revokeTime: ''
      };
      state.admins.push(record);
      state.overlay = null;
      render();
      toast(t(`已增设 ${name} 为平台管理员`, `${name} is now a platform admin.`));
    }

    function openEditAdmin(id) {
      if (state.adminView !== 'permanent') { toast(t('仅永久主管理员可修改管理员显示名称', 'Only the permanent master admin can rename admins.')); return; }
      const target = state.admins.find((a) => a.id === id);
      if (!target) return;
      if (target.permanent) { toast(t('永久主管理员受保护，显示名称不可在此修改', 'The permanent master admin is protected and cannot be renamed here.')); return; }
      state.overlay = 'edit-admin';
      state.editTargetId = id;
      state.editName = target.name;
      state.editError = '';
      render();
    }

    function submitEditAdmin() {
      if (state.adminView !== 'permanent') { state.editError = t('仅永久主管理员可修改显示名称', 'Only the permanent master admin can rename admins.'); render(); return; }
      const target = state.admins.find((a) => a.id === state.editTargetId);
      if (!target) return;
      if (target.permanent) { state.editError = t('永久主管理员受保护，不可在此修改显示名称', 'The permanent master admin is protected.'); render(); return; }
      const name = state.editName.trim();
      if (name.length < 1 || name.length > 50) { state.editError = t('显示名称需为 1–50 个字符', 'Display name must be 1–50 characters.'); render(); return; }
      if (name === target.name) { state.overlay = null; render(); toast(t('显示名称未变化', 'Display name unchanged')); return; }
      target.name = name;
      state.overlay = null;
      render();
      toast(t('显示名称已更新', 'Display name updated'));
    }

    function openRevokeAdmin(id) {
      if (state.adminView !== 'permanent') { toast(t('仅永久主管理员可撤销普通管理员', 'Only the permanent master admin can revoke admins.')); return; }
      const target = state.admins.find((a) => a.id === id);
      if (!target) return;
      if (target.permanent) { toast(t('永久主管理员受保护，严禁任何管理员撤销或删除', 'The permanent master admin is protected and can never be revoked or deleted.')); return; }
      const remaining = state.admins.filter((a) => a.status === 'active' && a.id !== id).length;
      if (remaining === 0) { toast(t('全平台至少保留 1 名可用管理员，请先增设其他管理员', 'Keep at least one active admin. Add another admin first.')); return; }
      state.overlay = 'revoke-admin';
      state.revokeTargetId = id;
      state.revokeConfirm = '';
      state.revokeError = '';
      render();
    }

    function submitRevokeAdmin() {
      if (state.adminView !== 'permanent') { state.revokeError = t('仅永久主管理员可撤销普通管理员', 'Only the permanent master admin can revoke admins.'); render(); return; }
      const target = state.admins.find((a) => a.id === state.revokeTargetId);
      if (!target) return;
      if (target.permanent) { state.revokeError = t('永久主管理员受保护，严禁撤销或删除', 'The permanent master admin is protected and cannot be revoked.'); render(); return; }
      const remaining = state.admins.filter((a) => a.status === 'active' && a.id !== target.id).length;
      if (remaining === 0) { state.revokeError = t('全平台至少保留 1 名可用管理员，请先增设其他管理员', 'Keep at least one active admin. Add another admin first.'); render(); return; }
      if (norm(state.revokeConfirm) !== norm(target.name) && norm(state.revokeConfirm) !== norm(target.email)) {
        state.revokeError = t('确认文本需与目标姓名或邮箱一致', 'Confirmation must match the name or email.');
        render();
        return;
      }
      target.status = 'revoked';
      target.revoker = currentName();
      target.revokeTime = nowStamp();
      state.overlay = null;
      render();
      toast(t(`已撤销 ${target.name} 的平台管理员权限，兼任身份保留`, `Admin access revoked for ${target.name}. Other roles remain.`));
    }

    function updateAdminList() {
      const el = $('adminList');
      if (el) el.innerHTML = adminListHTML();
      if (window.lucide) window.lucide.createIcons();
    }

    /* ------------------------------------------------------------------
     * 渲染入口
     * ------------------------------------------------------------------ */
    function render() {
      const frame = $('frame');
      const bannerEl = $('banner');
      const contentEl = $('content');
      const navEl = $('bottomnav');
      if (!frame || !bannerEl || !contentEl || !navEl) return;
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;
      const top = contentEl.scrollTop;
      let html = '';
      if (state.screen === 'login') html = renderLogin();
      else if (state.screen === 'register') html = renderRegister();
      else if (state.screen === 'forgot') html = renderForgot();
      else if (state.screen === 'me') html = renderMe();
      else if (state.screen === 'change-password') html = renderChangePassword();
      else if (state.screen === 'change-email') html = renderChangeEmail();
      else if (state.screen === 'security') html = renderSecurity();
      else if (state.screen === 'admins') html = renderAdmins();
      else html = renderLogin();
      bannerEl.innerHTML = renderBanner();
      contentEl.innerHTML = html;
      navEl.innerHTML = renderNav();
      renderOverlay();
      syncConsole();
      refreshFormStates();
      updateCounters();
      contentEl.scrollTop = top;
      if (window.lucide) window.lucide.createIcons();
    }

    /* ------------------------------------------------------------------
     * 输入绑定
     * ------------------------------------------------------------------ */
    function setByModel(model, value) {
      const parts = String(model || '').split('.');
      if (!parts.length) return;
      let obj = state;
      for (let i = 0; i < parts.length - 1; i += 1) {
        if (obj[parts[i]] == null) return;
        obj = obj[parts[i]];
      }
      obj[parts[parts.length - 1]] = value;
    }

    function bindInput(el) {
      const model = el.dataset.model;
      if (!model) return;
      const value = el.type === 'checkbox' ? el.checked : el.value;
      setByModel(model, value);
      if (model === 'reg.agree') {
        const hint = document.querySelector('[data-agree-hint]');
        if (hint) hint.classList.toggle('hidden', Boolean(value));
      }
      updateStrengthUI();
      updateCounters();
      refreshFormStates();
      if (model === 'adminQuery') updateAdminList();
      if (model === 'addEmail') {
        state.addLookup = null;
        state.addError = '';
        state.addRestoreId = '';
      }
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.querySelector('[data-console-collapse]').addEventListener('click', () => {
      applyConsoleCollapsed(true);
      writeConsoleCollapsed(true);
    });
    const consoleMini = document.querySelector('[data-console-mini]');
    if (consoleMini) {
      consoleMini.addEventListener('click', (event) => {
        if (!event.target.closest('[data-console-expand]')) return;
        applyConsoleCollapsed(false);
        writeConsoleCollapsed(false);
      });
    }

    $('console').addEventListener('click', (event) => {
      const nav = event.target.closest('[data-nav-screen]');
      if (nav) return setScreen(nav.dataset.navScreen);
      const devBtn = event.target.closest('[data-device-btn]');
      if (devBtn) { state.device = devBtn.dataset.deviceBtn === 'tablet' ? 'tablet' : 'mobile'; return render(); }
      const roleBtn = event.target.closest('[data-role-btn]');
      if (roleBtn) return setRole(roleBtn.dataset.roleBtn);
      const adminView = event.target.closest('[data-admin-view]');
      if (adminView) return setAdminView(adminView.dataset.adminView);
      const langBtn = event.target.closest('[data-lang-btn]');
      if (langBtn) return setLang(langBtn.dataset.langBtn);
      const config = event.target.closest('[data-config]');
      if (config) return setConfig(config.dataset.config);
      const scenario = event.target.closest('[data-scenario]');
      if (scenario) return setScenario(scenario.dataset.scenario);
      if (event.target.closest('[data-reset]')) return resetDemo();
    });

    $('content').addEventListener('input', (event) => {
      const el = event.target.closest('[data-model]');
      if (!el) return;
      bindInput(el);
    });

    $('content').addEventListener('change', (event) => {
      const el = event.target.closest('input[data-model]');
      if (!el || el.type !== 'checkbox') return;
      bindInput(el);
    });

    $('overlayRoot').addEventListener('input', (event) => {
      const el = event.target.closest('[data-model]');
      if (!el) return;
      bindInput(el);
    });

    $('overlayRoot').addEventListener('change', (event) => {
      const el = event.target.closest('input[data-model]');
      if (!el || el.type !== 'checkbox') return;
      bindInput(el);
    });

    $('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'go-screen') return setScreen(el.dataset.screen);
      if (action === 'go-back') return setScreen(state.subOrigin || 'me');
      if (action === 'bottom-nav') {
        if (el.dataset.tab === 'me') return;
        return toast(t('演示提示：请前往「工作台与首页」查看该页面', 'Demo: view this tab in the Workspace prototype'));
      }
      if (action === 'set-lang') return setLang(el.dataset.lang);
      if (action === 'toggle-pw') {
        const target = el.dataset.target;
        if (target === 'login') state.showLoginPw = !state.showLoginPw;
        if (target === 'register') state.showRegPw = !state.showRegPw;
        if (target === 'register-confirm') state.showRegConfirm = !state.showRegConfirm;
        if (target === 'forgot') state.showForgotPw = !state.showForgotPw;
        if (target === 'forgot-confirm') state.showForgotConfirm = !state.showForgotConfirm;
        if (target === 'cp-current') state.showCpCurrent = !state.showCpCurrent;
        if (target === 'cp-password') state.showCpPw = !state.showCpPw;
        if (target === 'cp-confirm') state.showCpConfirm = !state.showCpConfirm;
        return render();
      }
      if (action === 'refresh-captcha') {
        if (el.dataset.captcha === 'login') { state.loginCaptchaSeed += 1; state.loginCaptchaInput = ''; }
        else { state.forgotCaptchaSeed += 1; state.forgotCaptcha = ''; }
        return render();
      }
      if (action === 'refresh-reg-captcha') {
        state.regCaptchaSeed += 1;
        state.regCaptchaInput = '';
        state.overlayError = '';
        return render();
      }
      if (action === 'login-submit') return doLogin();
      if (action === 'resend-activation') {
        if (state.activationWait > 0) return;
        startActivationCooldown();
        render();
        return toast(t('激活验证已重新发送（60 秒冷却），请查收邮箱', 'Activation verification sent again (60s cooldown). Check your inbox.'));
      }
      if (action === 'send-reg-code') return triggerSendRegCode();
      if (action === 'confirm-reg-captcha') return confirmRegCaptcha();
      if (action === 'register-submit') return doRegister();
      if (action === 'set-gender') {
        state.reg.gender = el.dataset.gender;
        return render();
      }
      if (action === 'forgot-send') return sendForgotCode();
      if (action === 'forgot-reset') return doForgotReset();
      if (action === 'forgot-back') { state.forgotStep = 1; state.forgotError = ''; return render(); }
      if (action === 'forgot-expire') return forgotExpireDemo();
      if (action === 'open-legal') { state.overlay = el.dataset.doc; return render(); }
      if (action === 'open-email') return setScreen('change-email', state.screen === 'security' ? 'security' : 'me');
      if (action === 'email-send-current') return emailSendCurrent();
      if (action === 'email-next') return emailNext();
      if (action === 'email-send-new') return emailSendNew();
      if (action === 'email-submit') return emailSubmit();
      if (action === 'email-back') { state.emailStep = 1; state.emailError = ''; state.credentialUntil = 0; clearInterval(credentialTimer); credentialTimer = null; return render(); }
      if (action === 'email-expire') return expireEmailCredential();
      if (action === 'open-password') return setScreen('change-password', state.screen === 'security' ? 'security' : 'me');
      if (action === 'password-submit') return submitPasswordChange();
      if (action === 'clear-cache') return clearCache();
      if (action === 'logout-confirm') { state.overlay = 'logout'; return render(); }
      if (action === 'confirm-logout') return doLogout();
      if (action === 'open-delete') { state.overlay = 'delete-account'; state.deleteConfirm = ''; state.deleteError = ''; return render(); }
      if (action === 'open-recovery-info') { state.overlay = 'recovery-info'; return render(); }
      if (action === 'open-edit-profile') {
        const p = currentProfile();
        state.editProfile = { nickname: p.nickname || '', personalName: p.personalName || '', gender: p.gender || '女' };
        state.overlay = 'edit-profile';
        return render();
      }
      if (action === 'set-profile-gender') {
        state.editProfile.gender = el.dataset.gender || '女';
        return render();
      }
      if (action === 'save-profile') {
        const nick = String(state.editProfile.nickname || '').trim();
        if (!nick) { toast(t('请输入昵称', 'Please enter a nickname')); return; }
        state.profileOverrides[state.role] = {
          nickname: nick,
          personalName: String(state.editProfile.personalName || '').trim(),
          gender: state.editProfile.gender || '女'
        };
        state.overlay = null;
        render();
        return toast(t('个人资料已保存', 'Profile updated'));
      }
      if (action === 'toggle-assets') { state.assetsCleared = !state.assetsCleared; return render(); }
      if (action === 'toggle-admin-unloaded') { state.adminUnloaded = !state.adminUnloaded; return render(); }
      if (action === 'delete-submit') return submitDelete();
      if (action === 'avatar') return toast(t('头像上传为演示占位，正式版支持 JPG / PNG / WebP', 'Avatar upload is a demo placeholder. JPG / PNG / WebP supported in production.'));
      if (action === 'maintenance-check') return toast(t('平台仍在维护中，请稍后重试', 'Still under maintenance. Please try again later.'));
      if (action === 'set-admin-filter') { state.adminFilter = el.dataset.filter; return render(); }
      if (action === 'open-add-admin') return openAddAdmin('', '');
      if (action === 'lookup-account') return performLookup(false);
      if (action === 'add-submit') return submitAddAdmin();
      if (action === 'edit-admin') return openEditAdmin(el.dataset.id);
      if (action === 'edit-submit') return submitEditAdmin();
      if (action === 'revoke-admin') return openRevokeAdmin(el.dataset.id);
      if (action === 'restore-admin') {
        const record = state.admins.find((a) => a.id === el.dataset.id);
        if (record) return openAddAdmin(record.email, record.id);
        return;
      }
      if (action === 'revoke-submit') return submitRevokeAdmin();
      if (action === 'close-banned') { state.overlay = null; return render(); }
      if (action === 'reg-success-close') {
        state.overlay = null;
        state.screen = 'login';
        state.loginEmail = state.reg.email.trim();
        state.loginPassword = '';
        syncUrl();
        return render();
      }
      if (action === 'forgot-success-close') {
        state.overlay = null;
        state.screen = 'login';
        state.forgotStep = 1;
        state.forgotCode = '';
        state.forgotPassword = '';
        state.forgotConfirm = '';
        state.forgotError = '';
        syncUrl();
        return render();
      }
      if (action === 'pw-success-close') {
        state.overlay = null;
        state.screen = 'login';
        state.loginPassword = '';
        state.loginError = '';
        syncUrl();
        return render();
      }
      if (action === 'delete-success-close') {
        state.overlay = null;
        state.screen = 'login';
        state.loginPassword = '';
        state.loginError = '';
        syncUrl();
        return render();
      }
      if (action === 'go-security') return setScreen('security', 'me');
      if (action === 'close-overlay') {
        state.overlay = null;
        return render();
      }
    });

    /* ------------------------------------------------------------------
     * 启动
     * ------------------------------------------------------------------ */
    syncUrl();
    render();
    applyConsoleCollapsed(readConsoleCollapsed());
  </script>
</body>
</html>

      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    /* ------------------------------------------------------------------

    function emptyForm() {
      return {
        mode: 'create', id: null, nameCn: '', nameEn: '', courseTypes: [],

    const params = new URLSearchParams(location.search);
    if (params.get('role') && ['admin', 'monitor', 'parent', 'teacher'].includes(params.get('role'))) {
      state.role = params.get('role');
      if (state.role === 'parent') { state.page = 'child'; state.navTab = 'me'; }
      else if (state.role === 'teacher') { state.page = 'prep'; state.navTab = 'schedule'; }
      else if (state.role === 'monitor') { state.page = 'student'; state.navTab = 'ops'; }
      else { state.page = 'library'; state.navTab = 'settings'; }
    }
    if (params.get('page')) state.page = params.get('page');
    if (params.get('studentId')) state.activeStudentId = params.get('studentId');
    if (params.get('device') === 'tablet') state.device = 'tablet';

    const clone = (v) => JSON.parse(JSON.stringify(v));
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function newId(prefix) {
      return `${prefix}_${Math.random().toString(36).slice(2, 11).padEnd(9, '0')}`;
    }

    function newLevelId() {
      return `lvl_${Math.random().toString(36).slice(2, 10).padEnd(8, '0')}`;
    }

    function activeStudent() {
      return state.students.find((s) => s.id === state.activeStudentId) || state.students[0];
    }

    function findCw(id) {
      return state.courseware.find((c) => c.id === id) || null;
    }

    function findLevel(cw, levelId) {
      return (cw && cw.levels || []).find((l) => l.id === levelId) || null;
    }

    function levelLabel(cw, levelId) {
      const lvl = findLevel(cw, levelId);
      return lvl ? lvl.name : '标准';
    }

    function itemLabel(item) {
      const cw = findCw(item.cwId);
      return cw ? `${cw.nameCn} · ${levelLabel(cw, item.levelId)}` : '已删除课件';
    }

    function operatorName() {
      if (state.role === 'admin') return 'Sarah';
      if (state.role === 'monitor') return 'Leo';
      if (state.role === 'teacher') return 'David';
      return 'Amy';
    }

    function coverHtml(cw, size = 'h-14 w-14', text = 'text-[18px]') {
      if (cw && cw.cover) {
        return `<img src="${esc(cw.cover)}" alt="" class="${size} shrink-0 rounded-lg object-cover ring-1 ring-slate-200">`;
      }
      const raw = (cw && (cw.nameEn || cw.nameCn)) || '?';
      const initial = raw.split(/\s+/).map((w) => w.charAt(0)).join('').slice(0, 2).toUpperCase() || '?';
      return `<span class="${size} grid shrink-0 place-items-center rounded-lg bg-indigo-50 ${text} font-bold text-indigo-700 ring-1 ring-indigo-100">${esc(initial)}</span>`;
    }

    function ensureDraft() {
      const s = activeStudent();
      if (!state.draft || state.draftStudentId !== s.id) {
        state.draft = clone(s.current);
        state.draftStudentId = s.id;
      }
    }

    function summarizeChanges(before, after) {
      const added = after.filter((a) => !before.some((b) => b.cwId === a.cwId));
      const removed = before.filter((b) => !after.some((a) => a.cwId === b.cwId));
      const changed = after.filter((a) => {
        const b = before.find((x) => x.cwId === a.cwId);
        return b && b.levelId !== a.levelId;
      });
      const parts = [];
      if (added.length) parts.push(`新增 ${added.map(itemLabel).join('、')}`);
      if (removed.length) parts.push(`移除 ${removed.map(itemLabel).join('、')}`);
      if (changed.length) {
        const details = changed.map((a) => {
          const b = before.find((x) => x.cwId === a.cwId);
          const cw = findCw(a.cwId);
          if (!cw || !b) return '';
          return `${cw.nameCn} ${levelLabel(cw, b.levelId)} → ${levelLabel(cw, a.levelId)}`;
        }).filter(Boolean);
        parts.push(`级别调整 ${details.join('、')}`);
      }
      return parts.length ? parts.join('；') : `在学课件更新为 ${after.length} 门`;
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function viewAllowed(v) {
      if (state.role === 'admin') return ['library', 'student'].includes(v);
      if (state.role === 'monitor') return v === 'student';
      if (state.role === 'parent') return v === 'child';
      return v === 'prep';
    }

    function currentViewKey() {
      if (state.page === 'editor' || state.page === 'library') return 'library';
      if (state.page === 'student') return 'student';
      if (state.page === 'child') return 'child';
      if (state.page === 'prep') return 'prep';
      return '';
    }

    function syncConsole() {
      const view = currentViewKey();
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const value = b.dataset.value;
        let active = false;
        let disabled = false;
        if (group === 'role') active = state.role === value;
        if (group === 'view') { active = view === value; disabled = !viewAllowed(value); }
        if (group === 'student') active = state.activeStudentId === value;
        if (group === 'device') active = state.device === value;
        if (group === 'online') active = state.online === value;
        b.disabled = disabled;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}${disabled ? ' cursor-not-allowed opacity-40' : ''}`;
      });
    }

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'view') setView(value);
        if (group === 'student') setStudent(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：可查看课件，新建 / 编辑 / 启停 / 保存不可用');
        }
      });
    });

    function setRole(role) {
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.page = role === 'admin' ? 'library' : role === 'monitor' ? 'student' : role === 'parent' ? 'child' : 'prep';
      state.navTab = role === 'admin' ? 'settings' : role === 'monitor' ? 'ops' : role === 'parent' ? 'me' : 'schedule';
      state.overlay = null;
      state.form = emptyForm();
      state.draft = null;
      state.draftStudentId = null;
      renderAll();
    }

    function setView(view) {
      if (!viewAllowed(view)) return;
      if (view === 'library') { state.page = 'library'; state.navTab = 'settings'; }
      if (view === 'student') {
        state.page = 'student';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.draft = null;
        state.draftStudentId = null;
      }
      if (view === 'child') { state.page = 'child'; state.navTab = 'me'; }
      if (view === 'prep') { state.page = 'prep'; state.navTab = 'schedule'; }
      state.overlay = null;
      renderAll();
    }

    function setStudent(id) {
      if (!state.students.some((s) => s.id === id)) return;
      state.activeStudentId = id;
      state.draft = null;
      state.draftStudentId = null;
      state.overlay = null;
      if (state.page === 'editor') {
        syncConsole();
        return;
      }
      renderAll();
    }

          ${list.length ? list.map(libraryCard).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-400">没有匹配的课件</div>`}

      </div>`;
    }

    function libraryCard(cw) {
      const canWrite = state.online === 'on';

      return `<article class="rounded-2xl border p-3 shadow-sm ${cw.active ? 'border-slate-200/80 bg-white' : 'border-slate-200 bg-slate-100/80'}">

            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="truncate text-[16px] font-bold ${muted ? 'text-slate-500' : 'text-slate-900'}">${esc(cw.nameCn)}</div>
                <div class="truncate text-[12px] font-medium ${muted ? 'text-slate-400' : 'text-slate-500'}">${esc(cw.nameEn)}</div>
              </div>
              <div class="flex shrink-0 flex-col items-end gap-1">
                ${cw.active
                  ? '<span class="rounded-full border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">启用</span>'
                  : '<span class="rounded-full border border-slate-200 bg-slate-200/70 px-1.5 py-0.5 text-[12px] font-bold text-slate-600">已停用</span>'}
                ${cw.pendingReview && !cw.active ? '<span class="rounded-full border border-amber-200 bg-amber-50 px-1.5 py-0.5 text-[12px] font-semibold text-amber-800">待完善</span>' : ''}

            <div class="mt-1 flex flex-wrap gap-1.5 ${muted ? 'opacity-70' : ''}">

            </div>
            <div class="mt-1.5 flex flex-wrap items-center gap-x-2 text-[12px] font-medium ${muted ? 'text-slate-400' : 'text-slate-500'}">
              <span>${cw.levels.length} 个级别</span><span>·</span><span>已绑定 ${cw.boundCount} 名学员</span>

              <span class="absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow-sm transition-transform ${cw.active ? 'translate-x-5' : 'translate-x-0'}"></span>
            </button>

          </div>
          <div class="flex shrink-0 items-center gap-1.5">
            <button data-action="preview-cw" data-id="${cw.id}" data-level="${cw.levels[0] ? cw.levels[0].id : ''}" class="h-8 rounded-lg border border-slate-200 bg-slate-100 px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-200">样课</button>
            <button data-action="edit-cw" data-id="${cw.id}" ${canWrite ? '' : 'disabled'} class="h-8 rounded-lg border border-slate-200 bg-slate-100 px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-200 disabled:opacity-40">编辑</button>
          </div>
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 管理员 · 课件编辑
     * ------------------------------------------------------------------ */
    function openEditor(mode, id = null) {
      if (state.online === 'off') return showToast('离线模式下不可新建或编辑课件');
      if (mode === 'edit') {
        const cw = findCw(id);
        if (!cw) return;
        state.form = {
          mode: 'edit', id: cw.id, nameCn: cw.nameCn, nameEn: cw.nameEn,
          courseTypes: [...cw.courseTypes], descCn: cw.descCn || '', descEn: cw.descEn || '',
          cover: cw.cover || '', levels: clone(cw.levels || []), active: cw.active,
          showErrors: false,
          error: '', boundCount: cw.boundCount || 0, createdAt: cw.createdAt || ''
        };
      } else {
        state.form = emptyForm();
      }
      state.page = 'editor';
      state.navTab = 'settings';
      state.overlay = null;
      renderAll();
    }

    function renderEditor() {
      const f = state.form;
      const isEdit = f.mode === 'edit';
      const inputCls = 'h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500';
      return `<div class="flex h-full min-h-0 flex-col">
        <div id="editorScroll" class="min-h-0 flex-1 overflow-y-auto">
          <div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3">
            <p class="px-1 text-[12px] font-medium leading-relaxed text-slate-500">中英文名称与课程类型为必填 · 级别与样课图可选</p>

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
              <h2 class="text-[16px] font-bold text-slate-900">基础信息</h2>
              <div class="mt-2.5 space-y-3">
                <div>
                  <label for="fNameCn" class="mb-1 block text-[14px] font-semibold text-slate-700">中文名 <span class="text-rose-500">*</span></label>

                <div>
                  <label for="fNameEn" class="mb-1 block text-[14px] font-semibold text-slate-700">英文名 <span class="text-rose-500">*</span></label>
                  <input id="fNameEn" value="${esc(f.nameEn)}" maxlength="64" placeholder="如 Oxford Reading Tree" class="${inputCls}">
                </div>
                <div>
                  <div class="mb-1 flex items-center justify-between">
                    <span class="text-[14px] font-semibold text-slate-700">归属课程类型 <span class="text-rose-500">*</span></span>
                    <span class="text-[12px] font-medium text-slate-400">至少 1 项</span>
                  </div>
                  <div class="flex flex-wrap gap-1.5">
                    ${COURSE_TYPES.map((t) => {
                      const on = f.courseTypes.includes(t);
                      return `<button data-action="toggle-type" data-value="${esc(t)}" class="h-8 rounded-lg border px-2.5 text-[12px] font-semibold ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-600'}">${esc(t)}</button>`;
                    }).join('')}
                  </div>
                </div>
                <div>
                  <label for="fDescCn" class="mb-1 block text-[14px] font-semibold text-slate-700">中文简介</label>
                  <textarea id="fDescCn" maxlength="500" placeholder="课件中文简介（选填）" class="h-20 w-full rounded-xl border border-slate-200 p-3 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500">${esc(f.descCn)}</textarea>
                </div>
                <div>
                  <label for="fDescEn" class="mb-1 block text-[14px] font-semibold text-slate-700">English Description</label>
                  <textarea id="fDescEn" maxlength="500" placeholder="Courseware description (optional)" class="h-20 w-full rounded-xl border border-slate-200 p-3 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500">${esc(f.descEn)}</textarea>
                </div>
                <div>
                  <div class="mb-1 flex items-center justify-between">
                    <span class="text-[14px] font-semibold text-slate-700">封面配图</span>
                    <span class="text-[12px] font-medium text-slate-400">选填 · 1 张</span>
                  </div>
                  <div class="flex items-center gap-2.5">
                    <span class="h-20 w-20 overflow-hidden rounded-xl border border-slate-200 bg-slate-50">
                      ${f.cover ? `<img src="${esc(f.cover)}" class="h-full w-full object-cover" alt="">` : `<span class="grid h-full w-full place-items-center text-slate-300">${icon('image', 'h-6 w-6')}</span>`}
                    </span>
                    <div class="flex flex-col gap-1.5">
                      <label for="fCoverInput" class="inline-flex h-8 cursor-pointer items-center rounded-lg border border-slate-200 bg-slate-100 px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-200">选择封面</label>
                      <input id="fCoverInput" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
                      <button data-action="demo-cover" class="h-8 rounded-lg border border-slate-200 bg-slate-100 px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-200">使用示例封面</button>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <section id="formLevels" class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
              <div class="flex items-center justify-between gap-2">
                <h2 class="text-[16px] font-bold text-slate-900">分级级别 <span class="text-[12px] font-medium text-slate-400">${f.levels.length} 个</span></h2>
                <button data-action="add-level" class="h-8 rounded-lg border border-slate-200 bg-slate-100 px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-200">+ 添加级别</button>
              </div>
              <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">级别英文名必填且不超过 32 字符；每级可上传 0-9 张样课内页，支持调整级别与配图顺序。</p>
              <div class="mt-2.5 space-y-2">
                ${f.levels.length ? f.levels.map((lvl, i) => levelEditor(lvl, i)).join('') : `<div class="rounded-xl border border-dashed border-slate-300 bg-slate-50 px-3 py-5 text-center text-[12px] font-medium text-slate-400">尚未配置级别 · 可保存为无分级课件</div>`}
              </div>
            </section>

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
              <button data-action="toggle-form-active" class="flex w-full items-center justify-between gap-3 ${isEdit ? '' : 'cursor-default'}" aria-label="${isEdit ? '切换启用状态' : '新建课件默认停用'}">
                <div class="text-left">
                  <div class="text-[16px] font-semibold text-slate-900">${isEdit ? '启用课件' : '状态'}</div>
                  <div class="mt-0.5 text-[12px] font-medium text-slate-500">${isEdit ? '停用后新增选择自动隐藏，已绑定档案继续展示【已停用】' : '新建课件默认停用，核验完成后再手动开启'}</div>
                </div>
                <div class="flex shrink-0 items-center gap-2">
                  <span id="formActiveLabel" class="text-[12px] font-semibold ${f.active ? 'text-indigo-700' : 'text-slate-500'}">${f.active ? '启用' : '停用'}</span>
                  <span id="formActiveTrack" class="relative h-6 w-11 rounded-full transition ${f.active ? 'bg-indigo-600' : 'bg-slate-300'} ${isEdit ? '' : 'opacity-70'}">
                    <span id="formActiveKnob" class="absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow-sm transition-transform ${f.active ? 'translate-x-5' : 'translate-x-0'}"></span>
                  </span>
                </div>
              </button>
              <p class="mt-2.5 rounded-lg border px-3 py-2 text-[12px] font-medium leading-relaxed ${isEdit ? (!f.active ? 'border-slate-200 bg-slate-50 text-slate-600' : 'border-indigo-100 bg-indigo-50/70 text-indigo-900') : 'border-amber-200 bg-amber-50 text-amber-900'}">
                ${isEdit
                  ? (f.active ? '当前为启用状态；停用后新增选择自动隐藏，已绑定档案继续展示【已停用】。' : '当前为停用状态；已绑定档案继续展示【已停用】，可在核验无误后手动开启启用。')
                  : '新建课件默认处于停用状态；完善级别与样课配图并核对无误后，可在列表或详情中手动开启启用。'}
              </p>
            </section>

            ${isEdit && f.boundCount === 0 ? `<section class="rounded-2xl border border-rose-200 bg-rose-50/70 p-4">
              <div class="flex items-center justify-between gap-2">
                <div><div class="text-[14px] font-bold text-rose-950">删除课件</div><div class="mt-0.5 text-[12px] font-medium text-rose-800">该课件从未被学员绑定，可物理清理。</div></div>
                <button data-action="delete-cw" ${state.online === 'on' ? '' : 'disabled'} class="h-8 shrink-0 rounded-lg border border-rose-300 bg-white px-2.5 text-[12px] font-bold text-rose-700 disabled:opacity-40">删除</button>
              </div>
            </section>` : ''}
            ${isEdit && f.boundCount > 0 ? `<div class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">已被 ${f.boundCount} 名学员绑定，仅可停用，不可删除；停用后已绑定档案继续展示【已停用】。</div>` : ''}

            ${f.error ? `<div id="formError" class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-rose-700">${esc(f.error)}</div>` : ''}
          </div>
        </div>
        <div class="flex shrink-0 gap-2 border-t border-slate-200 bg-white px-4 py-3">
          <button data-action="cancel-editor" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
          <button data-action="save-cw" ${state.online === 'on' ? '' : 'disabled'} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">${isEdit ? '保存修改' : '确认创建'}</button>
        </div>
      </div>`;
    }

    function levelEditor(lvl, i) {
      const isFirst = i === 0;
      const isLast = i === state.form.levels.length - 1;
      const nameInvalid = state.form.showErrors && (!lvl.name.trim() || lvl.name.length > 32);
      const countInvalid = lvl.images.length > 9;
      return `<div class="rounded-xl border ${nameInvalid || countInvalid ? 'border-rose-300 bg-rose-50/40' : 'border-slate-200 bg-slate-50'} p-2.5">
        <div class="flex items-center gap-1.5">
          <div class="flex shrink-0 gap-1">
            <button data-action="move-level" data-index="${i}" data-delta="-1" ${isFirst ? 'disabled' : ''} class="grid h-8 w-7 place-items-center rounded-lg border border-slate-200 bg-white text-slate-500 disabled:opacity-30" aria-label="上移">${icon('chevron-up', 'h-4 w-4')}</button>
            <button data-action="move-level" data-index="${i}" data-delta="1" ${isLast ? 'disabled' : ''} class="grid h-8 w-7 place-items-center rounded-lg border border-slate-200 bg-white text-slate-500 disabled:opacity-30" aria-label="下移">${icon('chevron-down', 'h-4 w-4')}</button>
          </div>
          <input id="fLevelName-${i}" value="${esc(lvl.name)}" maxlength="32" placeholder="级别英文名，如 Stage 1" class="h-10 min-w-0 flex-1 rounded-lg border ${nameInvalid ? 'border-rose-400 bg-rose-50' : 'border-slate-200 bg-white'} px-2.5 text-[16px] font-semibold text-slate-900 outline-none focus:border-indigo-500">
          <button data-action="remove-level" data-index="${i}" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg border border-rose-200 bg-white text-rose-600" aria-label="删除级别">${icon('trash-2', 'h-4 w-4')}</button>
        </div>
        ${nameInvalid ? `<div class="mt-1 text-[12px] font-semibold text-rose-700">级别英文名必填，最长 32 字符</div>` : ''}
        <div class="mt-2 grid grid-cols-3 gap-1.5">
          ${lvl.images.map((img, j) => `<div class="relative aspect-square overflow-hidden rounded-lg border border-slate-200 bg-white">
            <button data-action="editor-preview-img" data-index="${i}" data-img-index="${j}" class="block h-full w-full" aria-label="预览样课图">
              <img src="${img}" class="h-full w-full object-cover" alt="">
            </button>
            <div class="absolute inset-x-1 bottom-1 flex justify-between gap-1">
              <button data-action="move-level-img" data-index="${i}" data-img-index="${j}" data-delta="-1" ${j === 0 ? 'disabled' : ''} class="grid h-6 flex-1 place-items-center rounded bg-white/85 text-slate-600 disabled:opacity-30" aria-label="前移">${icon('chevron-left', 'h-3 w-3')}</button>
              <button data-action="move-level-img" data-index="${i}" data-img-index="${j}" data-delta="1" ${j === lvl.images.length - 1 ? 'disabled' : ''} class="grid h-6 flex-1 place-items-center rounded bg-white/85 text-slate-600 disabled:opacity-30" aria-label="后移">${icon('chevron-right', 'h-3 w-3')}</button>
              <button data-action="remove-level-img" data-index="${i}" data-img-index="${j}" class="grid h-6 w-6 place-items-center rounded bg-rose-50 text-rose-600" aria-label="删除配图">${icon('x', 'h-3 w-3')}</button>
            </div>
          </div>`).join('')}
          ${lvl.images.length < 9 ? `<label class="flex aspect-square cursor-pointer flex-col items-center justify-center gap-1 rounded-lg border border-dashed border-slate-300 bg-white/70 text-slate-500">
            <input id="fLevelImg-${i}" type="file" accept="image/jpeg,image/png,image/webp" multiple class="hidden">
            ${icon('plus', 'h-4 w-4')}
            <span class="text-[12px] font-semibold">添加配图</span>
          </label>` : ''}
        </div>
        <div class="mt-1.5 flex items-center justify-between gap-2">
          <span class="text-[12px] font-semibold ${countInvalid ? 'text-rose-700' : 'text-slate-500'}">${lvl.images.length}/9 张样课图</span>
          <button data-action="demo-level-img" data-index="${i}" class="text-[12px] font-bold text-slate-600 hover:text-slate-900">生成示例图</button>
        </div>
      </div>`;
    }

    function renderEditorOnly() {
      const scroller = $('editorScroll');
      const top = scroller ? scroller.scrollTop : 0;
      $('content').innerHTML = renderContent();
      if (window.lucide) lucide.createIcons();
      const next = $('editorScroll');
      if (next) next.scrollTop = top;
    }

    function formError() {
      const f = state.form;
      if (state.online === 'off') return '离线模式下不可保存课件';
      if (!f.nameCn.trim()) return '请填写课件中文名';
      if (f.nameCn.length > 64) return '中文名不能超过 64 字符';
      if (!f.nameEn.trim()) return '请填写课件英文名';
      if (f.nameEn.length > 64) return '英文名不能超过 64 字符';
      if (!f.courseTypes.length) return '请至少选择 1 个归属课程类型';
      for (let i = 0; i < f.levels.length; i++) {
        const lvl = f.levels[i];
        if (!lvl.name.trim()) return `请填写第 ${i + 1} 个级别的英文名`;
        if (lvl.name.length > 32) return `第 ${i + 1} 个级别英文名不能超过 32 字符`;
        if (lvl.images.length > 9) return `第 ${i + 1} 个级别最多 9 张样课图`;
      }
      return null;
    }

    function saveCourseware() {
      const err = formError();
      if (err) {
        state.form.error = err;
        state.form.showErrors = true;
        renderEditorOnly();
        setTimeout(() => $('formError')?.scrollIntoView({ block: 'center' }), 60);
        showToast(err);
        return;
      }
      const f = state.form;
      state.form.showErrors = false;
      if (f.mode === 'edit') {
        const cw = findCw(f.id);
        if (!cw) return;
        Object.assign(cw, {
          nameCn: f.nameCn.trim(), nameEn: f.nameEn.trim(),
          courseTypes: [...f.courseTypes], descCn: f.descCn, descEn: f.descEn,
          cover: f.cover, levels: clone(f.levels), active: f.active
        });
        if (cw.active) cw.pendingReview = false;
        state.page = 'library';
        state.navTab = 'settings';
        renderAll();
        showToast(cw.active ? '课件已保存 · 当前为启用状态' : '课件已保存 · 当前为停用状态');
        return;
      }
      state.courseware.unshift({
        id: newId('cw'),
        nameCn: f.nameCn.trim(), nameEn: f.nameEn.trim(),
        courseTypes: [...f.courseTypes], descCn: f.descCn, descEn: f.descEn,
        cover: f.cover, levels: clone(f.levels),
        /* AC-1E-03：新建课件入库强制停用，核验后由管理员手动开启 */
        active: false,
        pendingReview: true,
        boundCount: 0, createdAt: TODAY
      });
      state.page = 'library';
      state.navTab = 'settings';
      renderAll();
      showToast('课件已创建并默认为停用 · 核验后请在列表手动启用');
    }

    /* ------------------------------------------------------------------
     * 在学课件 · 管理员 / 班长
     * ------------------------------------------------------------------ */
    function renderStudentConfig() {
      ensureDraft();
      const s = activeStudent();
      const draft = state.draft;
      const canWriteRole = state.role === 'admin' || state.role === 'monitor';
      const online = state.online === 'on';
      const canWrite = canWriteRole && online;
      const isParent = state.role === 'parent';
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('在学课件', `${s.nickname} · ${draft.length}/6`, isParent ? `<span class="inline-flex shrink-0 items-center gap-1 rounded-full border border-slate-200 bg-slate-50 px-2 py-0.5 text-[12px] font-bold text-slate-500">${icon('lock', 'h-3.5 w-3.5')}只读</span>` : '')}
        ${studentSwitch()}

          </div>

          ${draft.length >= 6 ? `<div class="mt-2 rounded-lg border border-amber-200 bg-amber-50 px-2.5 py-2 text-[12px] font-medium text-amber-900">已达 6 门上限，【添加在学课件】已置灰；请先移除后再添加。</div>` : ''}

          ${canWriteRole ? auditDetails(s) : ''}
        </section>

        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">${canWriteRole ? '停用课件不会自动解绑；已绑定的停用课件继续展示【已停用】。保存后教师日历与家长端即时刷新。' : '在学课件由管理员或负责班长维护，家长端仅可查看封面、名称与级别。'}</div>
      </div>`;
    }

    function configItem(item, i, canWrite) {
      const cw = findCw(item.cwId);
      if (!cw) return '';
      const lvl = findLevel(cw, item.levelId);
      return `<div class="rounded-xl border border-slate-200 bg-white p-2.5">
        <div class="flex items-start gap-2.5">
          <button data-action="preview-cw" data-id="${cw.id}" data-level="${esc(item.levelId || '')}" class="shrink-0" aria-label="预览课件">${coverHtml(cw, 'h-11 w-11', 'text-[14px]')}</button>
          <div class="min-w-0 flex-1">
            <div class="flex items-start justify-between gap-1.5">
              <div class="min-w-0">
                <div class="truncate text-[14px] font-bold text-slate-900">${esc(cw.nameCn)}</div>
                <div class="truncate text-[12px] font-medium text-slate-400">${esc(cw.nameEn)}</div>
              </div>
              ${canWrite ? `<button data-action="config-remove" data-index="${i}" ${state.online === 'on' ? '' : 'disabled'} class="grid h-7 w-7 shrink-0 place-items-center rounded-lg border border-rose-200 bg-rose-50 text-rose-600 disabled:opacity-40" aria-label="移除">${icon('x', 'h-3.5 w-3.5')}</button>` : ''}
            </div>
            <div class="mt-1 flex flex-wrap items-center gap-1.5">
              ${cw.levels.length && canWrite
                ? `<select id="cfgLevel-${i}" ${state.online === 'on' ? '' : 'disabled'} class="h-9 rounded-lg border border-slate-200 bg-white px-2 text-[14px] font-semibold text-slate-700 outline-none focus:border-indigo-500 disabled:bg-slate-100 disabled:text-slate-400">
                    <option value="" ${item.levelId ? '' : 'selected'}>标准（暂不指定级别）</option>
                    ${cw.levels.map((l) => `<option value="${l.id}" ${l.id === item.levelId ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}
                  </select>`
                : `<span class="rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(lvl ? lvl.name : '标准')}</span>`}
              ${!cw.active ? `<span class="rounded-md border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-500">已停用</span>` : ''}
            </div>
          </div>
        </div>
      </div>`;
    }

    function auditDetails(s) {
      if (!s.audit || !s.audit.length) return '';
      return `<details class="mt-2.5 rounded-xl border border-slate-200 bg-slate-50 p-3">
        <summary class="flex cursor-pointer list-none items-center justify-between [&::-webkit-details-marker]:hidden">
          <span class="text-[14px] font-bold text-slate-800">历史升阶与变更日志</span>
          <span class="text-[12px] font-medium text-slate-500">${s.audit.length} 条</span>
        </summary>
        <div class="mt-2 space-y-2">
          ${s.audit.slice(0, 5).map((a) => `<div class="flex items-start gap-2">
            <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-indigo-400"></span>
            <div class="min-w-0">
              <div class="text-[12px] font-medium text-slate-400">${esc(a.at)} · ${esc(a.by)}</div>
              <div class="text-[14px] font-medium leading-relaxed text-slate-800">${esc(a.text)}</div>
            </div>
          </div>`).join('')}
        </div>
      </details>`;
    }

    function saveConfig() {
      if (state.online === 'off') return showToast('离线模式下不可保存在学课件');
      const s = activeStudent();
      ensureDraft();
      const before = s.current;
      const after = state.draft;
      if (JSON.stringify(before) === JSON.stringify(after)) {
        showToast('在学课件未变更');
        return;
      }
      s.current = clone(after);
      s.audit = s.audit || [];
      s.audit.unshift({
        at: '2026-11-10 14:32',
        by: operatorName(),
        text: summarizeChanges(before, after)
      });
      state.draft = clone(s.current);
      state.draftStudentId = s.id;
      renderAll();
      showToast(`在学课件已保存，共 ${after.length} 门；教师课表与家长端已同步刷新`);
    }

    function openAddPicker() {
      if (state.online === 'off') return showToast('离线模式下不可添加在学课件');
      ensureDraft();
      if (state.draft.length >= 6) return showToast('每个学员最多配置 6 门在学课件');
      state.pickCw = '';
      state.pickLevel = '';
      state.overlay = { type: 'addPicker' };
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    function addPick() {
      if (state.online === 'off') return showToast('离线模式下不可添加在学课件');
      ensureDraft();
      const cw = findCw(state.pickCw);
      if (!cw) return showToast('请选择课件');
      if (state.draft.length >= 6) return showToast('每个学员最多配置 6 门在学课件');
      if (state.draft.some((d) => d.cwId === cw.id)) return showToast('该课件已在在学列表中');
      state.draft.push({ cwId: cw.id, levelId: state.pickLevel || '' });
      state.overlay = null;
      renderAll();
      showToast('已添加，保存后生效');
    }

    /* ------------------------------------------------------------------
     * 家长 · 孩子课件（只读）
     * ------------------------------------------------------------------ */
    function renderParentChild() {
      const s = activeStudent();
      const items = s.current || [];
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('孩子课件', `${s.nickname} · 只读`, `<span class="inline-flex shrink-0 items-center gap-1 rounded-full border border-slate-200 bg-slate-50 px-2 py-0.5 text-[12px] font-bold text-slate-500">${icon('lock', 'h-3.5 w-3.5')}只读</span>`)}
        ${studentSwitch()}
        <div class="grid grid-cols-2 gap-2">
          ${miniStat('在学课件', items.length, 'indigo', '/6')}
          ${miniStat('最近更新', s.audit && s.audit[0] ? s.audit[0].at.slice(5, 10) : '—', 'slate')}
        </div>
        <div class="${grid}">
          ${items.length ? items.map(parentCoursewareCard).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-400">该孩子暂未配置在学课件</div>`}
        </div>
        <div class="rounded-xl border border-indigo-100 bg-indigo-50/70 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900">在学课件由管理员或负责班长维护 · 家长端只读。点击封面可查看当前级别样课内页。</div>
      </div>`;

          <button data-action="preview-cw" data-id="${cw.id}" data-level="${esc(item.levelId || '')}" aria-label="查看样课">${coverHtml(cw, 'h-14 w-14', 'text-[18px]')}</button>

          <button data-action="preview-cw" data-id="${cw.id}" data-level="${esc(item.levelId || '')}" class="h-8 rounded-lg border border-slate-200 bg-slate-100 px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-200">查看样课</button>
        </div>
      </article>`;
    }

     * 教师 · 备课课件

    function renderTeacherPrep() {

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('备课课件', `下一节 · ${s.nickname} · ${lesson.course}`)}
        ${studentSwitch()}

        <article class="rounded-2xl border border-amber-200/70 bg-amber-50/80 p-3.5 shadow-sm">

            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-2">
                <div class="flex min-w-0 items-center gap-1.5">
                  <span class="inline-flex shrink-0 items-center gap-1 rounded-full border border-amber-200 bg-amber-100 px-1.5 py-0.5 text-[12px] font-bold text-amber-800"><span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>课程</span>

          <div class="mt-2.5 flex flex-wrap gap-1.5">

          </div>
          <div class="mt-2.5 rounded-xl border border-indigo-100 bg-indigo-50/70 px-3 py-2 text-[12px] font-medium leading-relaxed text-indigo-900">备课参考标签 · 不与单节预约排课执行强阻断校验。</div>

    function teacherCoursewareTag(item) {
      const cw = findCw(item.cwId);
      if (!cw) return '';
      const lvl = findLevel(cw, item.levelId);
      const inactive = !cw.active;
      return `<button data-action="preview-cw" data-id="${cw.id}" data-level="${esc(item.levelId || '')}" class="inline-flex max-w-full items-center gap-1.5 rounded-full border px-2.5 py-1.5 text-left ${inactive ? 'border-slate-200 bg-slate-100 text-slate-500' : 'border-indigo-100 bg-indigo-50 text-indigo-700'}">

      </button>`;

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'addPicker') return renderAddPicker();
      if (state.overlay.type === 'preview') return renderPreview();
      if (state.overlay.type === 'lightbox') return renderLightbox();
      if (state.overlay.type === 'editorLightbox') return renderEditorLightbox();
      if (state.overlay.type === 'deleteConfirm') return renderDeleteConfirm();
      return '';
    }

    function renderOverlayOnly() {
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    function modalShell(content) {
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-3 top-1/2 mx-auto max-h-[88%] max-w-[560px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">${content}</div>
      </div>`;
    }

    function modalHeader(title, subtitle = '') {
      return `<div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
          ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
        </div>
        <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
      </div>`;
    }

    function renderAddPicker() {
      ensureDraft();
      const used = new Set(state.draft.map((d) => d.cwId));
      const available = state.courseware.filter((c) => c.active && !used.has(c.id));
      const picked = findCw(state.pickCw);
      const canAdd = !!picked && state.online === 'on' && state.draft.length < 6;
      return modalShell(`
        ${modalHeader('添加在学课件', `${activeStudent().nickname} · 最多 6 门`)}
        ${available.length ? `<div class="mt-3 space-y-2">
          <select id="pickCw" class="h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-[16px] text-slate-900 outline-none focus:border-indigo-500">
            <option value="">选择启用中的课件</option>
            ${available.map((c) => `<option value="${c.id}" ${state.pickCw === c.id ? 'selected' : ''}>${esc(c.nameCn)} · ${esc(c.nameEn)}</option>`).join('')}
          </select>
          <select id="pickLevel" ${picked ? '' : 'disabled'} class="h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-[16px] text-slate-900 outline-none focus:border-indigo-500 disabled:bg-slate-100 disabled:text-slate-400">
            ${picked
              ? `<option value="" ${state.pickLevel ? '' : 'selected'}>标准（暂不指定级别）</option>${picked.levels.map((l) => `<option value="${l.id}" ${state.pickLevel === l.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}`
              : `<option value="">选择级别</option>`}
          </select>
          <button data-action="pick-add" ${canAdd ? '' : 'disabled'} class="h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">添加到在学课件</button>
        </div>` : `<div class="mt-3 rounded-xl border border-dashed border-slate-300 bg-slate-50 px-3 py-6 text-center text-[12px] font-medium text-slate-400">暂无可添加的启用课件</div>`}
        <div class="mt-2.5 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-500">仅可选择已启用课件；新建课件默认为停用，需在课件库手动启用后才会出现在这里。已绑定的停用课件仍会在在学列表中展示。</div>
        <button data-action="close-overlay" class="mt-3 h-11 w-full rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
      `);
    }

    function renderPreview() {
      const cw = findCw(state.overlay.cwId);
      if (!cw) return '';
      const boundLevel = findLevel(cw, state.overlay.levelId);
      const lvl = boundLevel || (cw.levels.length ? cw.levels[0] : null);
      const images = lvl ? lvl.images : [];
      const levelName = boundLevel ? boundLevel.name : '标准';
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-3 top-1/2 mx-auto max-h-[88%] max-w-[560px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">
          <div class="flex items-start justify-between gap-3">
            <div class="flex min-w-0 items-start gap-2.5">
              ${coverHtml(cw, 'h-14 w-14', 'text-[18px]')}
              <div class="min-w-0">
                <div class="truncate text-[16px] font-bold text-slate-900">${esc(cw.nameCn)}</div>
                <div class="truncate text-[12px] font-medium text-slate-500">${esc(cw.nameEn)}</div>
                <div class="mt-1 flex flex-wrap items-center gap-1.5">
                  <span class="rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(levelName)}</span>
                  ${!cw.active ? '<span class="rounded-md border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-500">已停用</span>' : ''}
                </div>
              </div>
            </div>
            <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="mt-3 space-y-2">
            <div class="rounded-xl bg-slate-50 px-3 py-2">
              <div class="text-[12px] font-bold text-slate-500">中文简介</div>
              <p class="mt-0.5 text-[14px] font-medium leading-relaxed text-slate-700">${esc(cw.descCn || '暂无中文简介')}</p>
            </div>
            <div class="rounded-xl bg-slate-50 px-3 py-2">
              <div class="text-[12px] font-bold text-slate-500">English Description</div>
              <p class="mt-0.5 text-[14px] font-medium leading-relaxed text-slate-700">${esc(cw.descEn || 'No English description yet.')}</p>
            </div>
          </div>
          <div class="mt-3">
            <div class="flex items-center justify-between"><h3 class="text-[14px] font-bold text-slate-800">样课内页</h3><span class="text-[12px] font-medium text-slate-500">${images.length} 张</span></div>
            ${!boundLevel && lvl ? `<p class="mt-0.5 text-[12px] font-medium text-slate-500">未指定级别 · 展示 ${esc(lvl.name)} 样课</p>` : ''}
            ${images.length ? `<div class="mt-1.5 grid grid-cols-3 gap-1.5">
              ${images.map((img, i) => `<button data-action="open-lightbox" data-index="${i}" data-level="${esc(lvl.id)}" class="relative aspect-square overflow-hidden rounded-lg border border-slate-200 bg-slate-100">
                <img src="${img}" class="h-full w-full object-cover" alt="">
                <span class="absolute bottom-1 right-1 grid h-6 w-6 place-items-center rounded bg-slate-900/55 text-white">${icon('maximize-2', 'h-3 w-3')}</span>
              </button>`).join('')}
            </div>` : `<div class="mt-1.5 rounded-xl border border-dashed border-slate-200 bg-slate-50 px-3 py-4 text-center text-[12px] font-medium text-slate-500">该级别暂无样课图</div>`}
          </div>
          <button data-action="close-overlay" class="mt-3 h-11 w-full rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">关闭</button>
        </div>
      </div>`;
    }

    function renderLightbox() {
      const cw = findCw(state.overlay.cwId);
      if (!cw) return '';
      const lvl = findLevel(cw, state.overlay.levelId);
      const images = lvl ? lvl.images : [];
      if (!images.length) return '';
      const total = images.length;
      const index = ((state.overlay.index % total) + total) % total;
      return `<div class="absolute inset-0 z-[70] overflow-hidden bg-slate-950/95">
        <div class="absolute inset-0" data-action="close-lightbox"></div>
        <div class="absolute inset-x-0 top-0 z-10 flex items-start justify-between gap-3 px-4 py-3">
          <div class="min-w-0 text-white">
            <div class="truncate text-[14px] font-bold">${esc(cw.nameCn)} · ${esc(lvl ? lvl.name : '标准')}</div>
            <div class="mt-1 text-[12px] font-medium text-slate-300">样课内页预览</div>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <span class="rounded-full bg-white/10 px-2.5 py-1 font-mono text-[12px] font-semibold text-white">${index + 1} / ${total}</span>
            <button data-action="close-lightbox" class="grid h-9 w-9 place-items-center rounded-xl bg-white/10 text-white hover:bg-white/20" aria-label="关闭大图">${icon('x', 'h-5 w-5')}</button>
          </div>
        </div>
        <div class="pointer-events-none relative z-10 flex h-full items-center justify-center px-4 pb-20 pt-20">
          <img src="${images[index]}" class="pointer-events-auto max-h-full max-w-full rounded-xl object-contain shadow-2xl" alt="">
        </div>
        ${total > 1 ? `<button data-action="lightbox-prev" class="absolute left-3 top-1/2 z-10 grid h-11 w-11 -translate-y-1/2 place-items-center rounded-full bg-white/10 text-white backdrop-blur hover:bg-white/20" aria-label="上一张">${icon('chevron-left', 'h-6 w-6')}</button>
        <button data-action="lightbox-next" class="absolute right-3 top-1/2 z-10 grid h-11 w-11 -translate-y-1/2 place-items-center rounded-full bg-white/10 text-white backdrop-blur hover:bg-white/20" aria-label="下一张">${icon('chevron-right', 'h-6 w-6')}</button>` : ''}
        <div class="pointer-events-none absolute inset-x-0 bottom-0 z-10 px-4 py-3 text-center text-[12px] font-medium text-slate-300">点击暗色背景或按 Esc 退出 · 使用 ← → 切换</div>
      </div>`;
    }

    function renderEditorLightbox() {
      const lvl = state.form.levels[state.overlay.levelIndex];
      const images = lvl ? lvl.images : [];
      if (!images.length) return '';
      const total = images.length;
      const index = ((state.overlay.index % total) + total) % total;
      return `<div class="absolute inset-0 z-[70] overflow-hidden bg-slate-950/95">
        <div class="absolute inset-0" data-action="close-editor-lightbox"></div>
        <div class="absolute inset-x-0 top-0 z-10 flex items-start justify-between gap-3 px-4 py-3">
          <div class="min-w-0 text-white">
            <div class="truncate text-[14px] font-bold">${esc(state.form.nameCn || '新建课件')} · ${esc(lvl && lvl.name ? lvl.name : '标准')}</div>
            <div class="mt-1 text-[12px] font-medium text-slate-300">样课内页预览</div>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <span class="rounded-full bg-white/10 px-2.5 py-1 font-mono text-[12px] font-semibold text-white">${index + 1} / ${total}</span>
            <button data-action="close-editor-lightbox" class="grid h-9 w-9 place-items-center rounded-xl bg-white/10 text-white hover:bg-white/20" aria-label="关闭大图">${icon('x', 'h-5 w-5')}</button>
          </div>
        </div>
        <div class="pointer-events-none relative z-10 flex h-full items-center justify-center px-4 pb-20 pt-20">
          <img src="${images[index]}" class="pointer-events-auto max-h-full max-w-full rounded-xl object-contain shadow-2xl" alt="">
        </div>
        ${total > 1 ? `<button data-action="editor-lightbox-prev" class="absolute left-3 top-1/2 z-10 grid h-11 w-11 -translate-y-1/2 place-items-center rounded-full bg-white/10 text-white backdrop-blur hover:bg-white/20" aria-label="上一张">${icon('chevron-left', 'h-6 w-6')}</button>
        <button data-action="editor-lightbox-next" class="absolute right-3 top-1/2 z-10 grid h-11 w-11 -translate-y-1/2 place-items-center rounded-full bg-white/10 text-white backdrop-blur hover:bg-white/20" aria-label="下一张">${icon('chevron-right', 'h-6 w-6')}</button>` : ''}
        <div class="pointer-events-none absolute inset-x-0 bottom-0 z-10 px-4 py-3 text-center text-[12px] font-medium text-slate-300">点击暗色背景或按 Esc 返回编辑 · 使用 ← → 切换</div>
      </div>`;
    }

    function renderDeleteConfirm() {
      const cw = findCw(state.overlay.cwId);
      if (!cw) return '';
      return modalShell(`
        ${modalHeader('删除课件', '仅从未被学员绑定的课件可物理删除')}
        <div class="mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-rose-900">确认删除「${esc(cw.nameCn)}」？删除后不可恢复，历史排课不会关联该课件。</div>
        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
          <button data-action="confirm-delete-cw" class="h-11 flex-1 rounded-xl bg-rose-600 text-[16px] font-semibold text-white">确认删除</button>
        </div>
      `);
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'back-main') return setView(state.role === 'admin' ? 'library' : state.role === 'monitor' ? 'student' : state.role === 'parent' ? 'child' : 'prep');
      if (action === 'switch-student') return setStudent(el.dataset.id);
      if (action === 'create-courseware') return openEditor('create');
      if (action === 'edit-cw') return openEditor('edit', el.dataset.id);
      if (action === 'lib-status') { state.libStatus = el.dataset.status; return renderAll(); }
      if (action === 'toggle-cw') {
        if (state.online === 'off') return showToast('离线模式下不可启停课件');
        const cw = findCw(el.dataset.id);
        if (!cw) return;
        cw.active = !cw.active;
        if (cw.active) cw.pendingReview = false;
        renderContentOnly();
        showToast(cw.active ? '课件已启用 · 已开放至在学课件备选池' : '课件已停用 · 已绑定档案继续展示【已停用】');
        return;
      }
      if (action === 'preview-cw') {
        state.overlay = { type: 'preview', cwId: el.dataset.id, levelId: el.dataset.level || '' };
        return renderOverlayOnly();
      }
      if (action === 'open-lightbox') {
        state.overlay = { type: 'lightbox', cwId: state.overlay.cwId, levelId: el.dataset.level || state.overlay.levelId, boundLevelId: state.overlay.levelId, index: Number(el.dataset.index) || 0 };
        return renderOverlayOnly();
      }
      if (action === 'lightbox-prev' || action === 'lightbox-next') {
        if (!state.overlay || state.overlay.type !== 'lightbox') return;
        const cw = findCw(state.overlay.cwId);
        const lvl = cw ? findLevel(cw, state.overlay.levelId) : null;
        const total = lvl ? lvl.images.length : 0;
        if (!total) return;
        state.overlay.index = (state.overlay.index + (action === 'lightbox-next' ? 1 : -1) + total) % total;
        return renderOverlayOnly();
      }
      if (action === 'editor-preview-img') {
        state.overlay = { type: 'editorLightbox', levelIndex: Number(el.dataset.index), index: Number(el.dataset.imgIndex) || 0 };
        return renderOverlayOnly();
      }
      if (action === 'editor-lightbox-prev' || action === 'editor-lightbox-next') {
        if (!state.overlay || state.overlay.type !== 'editorLightbox') return;
        const lvl = state.form.levels[state.overlay.levelIndex];
        const total = lvl ? lvl.images.length : 0;
        if (!total) return;
        state.overlay.index = (state.overlay.index + (action === 'editor-lightbox-next' ? 1 : -1) + total) % total;
        return renderOverlayOnly();
      }
      if (action === 'close-editor-lightbox') {
        state.overlay = null;
        return renderOverlayOnly();
      }
      if (action === 'close-lightbox') {
        if (state.overlay && state.overlay.cwId) {
          state.overlay = { type: 'preview', cwId: state.overlay.cwId, levelId: state.overlay.boundLevelId ?? state.overlay.levelId };
        } else {
          state.overlay = null;
        }
        return renderOverlayOnly();
      }
      if (action === 'close-overlay') { state.overlay = null; return renderOverlayOnly(); }
      if (action === 'toggle-type') {
        const v = el.dataset.value;
        state.form.courseTypes = state.form.courseTypes.includes(v)
          ? state.form.courseTypes.filter((x) => x !== v)
          : [...state.form.courseTypes, v];
        clearFormError();
        document.querySelectorAll('[data-action="toggle-type"]').forEach((b) => {
          const on = state.form.courseTypes.includes(b.dataset.value);
          b.className = `h-8 rounded-lg border px-2.5 text-[12px] font-semibold ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-600'}`;
        });
        return;
      }
      if (action === 'toggle-form-active') {
        if (state.form.mode !== 'edit') {
          showToast('新建课件默认处于停用状态；请先保存，再到列表或详情中手动开启启用');
          return;
        }
        state.form.active = !state.form.active;
        renderEditorOnly();
        return;
      }
      if (action === 'add-level') {
        state.form.levels.push({ id: newLevelId(), name: '', images: [] });
        clearFormError();
        renderEditorOnly();
        setTimeout(() => $('formLevels')?.scrollIntoView({ block: 'nearest' }), 30);
        return;
      }
      if (action === 'remove-level') {
        state.form.levels.splice(Number(el.dataset.index), 1);
        clearFormError();
        renderEditorOnly();
        return;
      }
      if (action === 'move-level') {
        const i = Number(el.dataset.index);
        const delta = Number(el.dataset.delta);
        const j = i + delta;
        if (j < 0 || j >= state.form.levels.length) return;
        const [moving] = state.form.levels.splice(i, 1);
        state.form.levels.splice(j, 0, moving);
        renderEditorOnly();
        return;
      }
      if (action === 'demo-level-img') {
        const i = Number(el.dataset.index);
        const lvl = state.form.levels[i];
        if (!lvl || lvl.images.length >= 9) return showToast('每个级别最多 9 张样课图');
        lvl.images.push(demoImage(`${lvl.name || 'Level'} · 样课 ${lvl.images.length + 1}`, 'Sample Page', '#6366f1', '#0ea5e9'));
        clearFormError();
        renderEditorOnly();
        return;
      }
      if (action === 'remove-level-img') {
        const lvl = state.form.levels[Number(el.dataset.index)];
        if (!lvl) return;
        lvl.images.splice(Number(el.dataset.imgIndex), 1);
        renderEditorOnly();
        return;
      }
      if (action === 'move-level-img') {
        const lvl = state.form.levels[Number(el.dataset.index)];
        if (!lvl) return;
        const i = Number(el.dataset.imgIndex);
        const j = i + Number(el.dataset.delta);
        if (j < 0 || j >= lvl.images.length) return;
        const [moving] = lvl.images.splice(i, 1);
        lvl.images.splice(j, 0, moving);
        renderEditorOnly();
        return;
      }
      if (action === 'demo-cover') {
        state.form.cover = demoImage(state.form.nameEn || 'New Courseware', 'Courseware Cover', '#4f46e5', '#0ea5e9');
        clearFormError();
        renderEditorOnly();
        return;
      }
      if (action === 'delete-cw') {
        if (state.online === 'off') return showToast('离线模式下不可删除课件');
        state.overlay = { type: 'deleteConfirm', cwId: state.form.id };
        return renderOverlayOnly();
      }
      if (action === 'confirm-delete-cw') {
        if (state.online === 'off') return showToast('离线模式下不可删除课件');
        const cw = findCw(state.overlay.cwId);
        if (!cw || cw.boundCount > 0) return showToast('该课件已被学员绑定，仅可停用');
        state.courseware = state.courseware.filter((c) => c.id !== cw.id);
        state.overlay = null;
        state.page = 'library';
        state.navTab = 'settings';
        renderAll();
        showToast('课件已删除');
        return;
      }
      if (action === 'save-cw') return saveCourseware();
      if (action === 'cancel-editor') {
        state.page = 'library';
        state.navTab = 'settings';
        state.overlay = null;
        state.form = emptyForm();
        return renderAll();
      }
      if (action === 'config-add') return openAddPicker();
      if (action === 'config-remove') {
        if (state.online === 'off') return showToast('离线模式下不可调整在学课件');
        ensureDraft();
        state.draft.splice(Number(el.dataset.index), 1);
        return renderContentOnly();
      }
      if (action === 'save-config') return saveConfig();
      if (action === 'pick-add') return addPick();
    });

    function clearFormError() {
      state.form.error = '';
      state.form.showErrors = false;
      const el = $('formError');
      if (el) el.remove();
    }

    function renderContentOnly() {
      $('content').innerHTML = renderContent();
      if (window.lucide) lucide.createIcons();
    }

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'fNameCn') { state.form.nameCn = e.target.value; clearFormError(); }
      if (id === 'fNameEn') { state.form.nameEn = e.target.value; clearFormError(); }
      if (id === 'fDescCn') { state.form.descCn = e.target.value; clearFormError(); }
      if (id === 'fDescEn') { state.form.descEn = e.target.value; clearFormError(); }
      if (id && id.startsWith('fLevelName-')) {
        const i = Number(id.split('-')[1]);
        if (state.form.levels[i]) state.form.levels[i].name = e.target.value;
        clearFormError();
      }
      if (id === 'libSearch') {
        state.libQuery = e.target.value;
        const val = e.target.value;
        renderContentOnly();
        const input = $('libSearch');
        if (input) { input.focus(); input.setSelectionRange(val.length, val.length); }
      }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'libType') { state.libType = e.target.value; return renderAll(); }
      if (id === 'fCoverInput') return handleCoverFile(e.target.files && e.target.files[0]);
      if (id && id.startsWith('fLevelImg-')) return handleLevelImages(Number(id.split('-')[1]), e.target.files);
      if (id && id.startsWith('cfgLevel-')) {
        const i = Number(id.split('-')[1]);
        if (state.draft && state.draft[i]) state.draft[i].levelId = e.target.value;
        return;
      }
      if (id === 'pickCw') {
        state.pickCw = e.target.value;
        state.pickLevel = '';
        return renderOverlayOnly();
      }
      if (id === 'pickLevel') {
        state.pickLevel = e.target.value;
        return;
      }
    });

    /* ------------------------------------------------------------------
     * 图片压缩
     * ------------------------------------------------------------------ */
    function compressImageFile(file, maxSide = 1600) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
            const w = Math.max(1, Math.round(img.naturalWidth * scale));
            const h = Math.max(1, Math.round(img.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            try { resolve(canvas.toDataURL('image/webp', 0.85)); }
            catch (err) { resolve(evt.target.result); }
          };
          img.onerror = reject;
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleCoverFile(file) {
      if (!file) return;
      if (state.online === 'off') return showToast('离线模式下不可上传');
      if (!file.type || !file.type.startsWith('image/')) return showToast('请选择图片文件');
      try {
        state.form.cover = await compressImageFile(file, 1200);
        clearFormError();
        renderEditorOnly();
        showToast('封面已压缩为 WebP');
      } catch (e) {
        showToast('无法读取封面图片');
      }
    }

    async function handleLevelImages(index, files) {
      if (state.online === 'off') return showToast('离线模式下不可上传');
      const lvl = state.form.levels[index];
      if (!lvl) return;
      const list = Array.from(files || []).filter((f) => f.type && f.type.startsWith('image/'));
      if (!list.length) return showToast('请选择图片文件');
      const remaining = 9 - lvl.images.length;
      if (remaining <= 0) return showToast('每个级别最多 9 张样课图，无法继续添加');
      const accepted = list.slice(0, remaining);
      if (list.length > remaining) showToast(`每个级别最多 9 张样课图，仅保留前 ${remaining} 张`);
      for (const file of accepted) {
        try {
          lvl.images.push(await compressImageFile(file, 1600));
        } catch (e) {
          showToast(`无法读取图片：${file.name}`);
        }
      }
      clearFormError();
      renderEditorOnly();
      showToast(`已添加 ${accepted.length} 张样课图`);
    }

    /* ------------------------------------------------------------------
     * 键盘 / 导航 / 提示
     * ------------------------------------------------------------------ */
    document.addEventListener('keydown', (e) => {
      if (!state.overlay || (state.overlay.type !== 'lightbox' && state.overlay.type !== 'editorLightbox')) return;
      const isEditor = state.overlay.type === 'editorLightbox';
      let total = 0;
      if (isEditor) {
        const lvl = state.form.levels[state.overlay.levelIndex];
        total = lvl ? lvl.images.length : 0;
      } else {
        const cw = findCw(state.overlay.cwId);
        const lvl = cw ? findLevel(cw, state.overlay.levelId) : null;
        total = lvl ? lvl.images.length : 0;
      }
      if (e.key === 'Escape') {
        state.overlay = isEditor ? null : { type: 'preview', cwId: state.overlay.cwId, levelId: state.overlay.boundLevelId ?? state.overlay.levelId };
        renderOverlayOnly();
      } else if (total > 1 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        e.preventDefault();
        state.overlay.index = (state.overlay.index + (e.key === 'ArrowRight' ? 1 : -1) + total) % total;
        renderOverlayOnly();
      }
    });

    function navTo(tab) {
      if (state.role === 'admin' && tab === 'settings') return setView('library');
      if (state.role === 'monitor' && tab === 'ops') return setView('student');
      if (state.role === 'parent' && tab === 'me') return setView('child');
      if (state.role === 'teacher' && tab === 'schedule') return setView('prep');
      state.page = 'placeholder';
      state.navTab = tab;
      state.overlay = null;
      renderAll();
    }

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

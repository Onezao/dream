    function accessibleClasses() {

    function parentNotifyTargets(s) {

      const targets = [];
      const lesson = LESSONS[s.id];

      return targets.filter((t) => (seen.has(t.name) ? false : (seen.add(t.name), true)));

    /* 分级隐私扫描：中文 ≥2 字；英文 ≥2 字符且按独立英文全词边界忽略大小写；联络特征硬阻断 */
    function scanClassPrivacy(text, c) {
      const raw = String(text || '');
      const names = [...new Set(classMemberNames(c).concat(c && c.historyMemberNames ? c.historyMemberNames : []))]
        .map((n) => String(n || '').trim()).filter(Boolean);
      const hitNames = names.filter((n) => {
        if (/^[A-Za-z][A-Za-z .'-]*$/.test(n)) {
          if (n.replace(/[^A-Za-z]/g, '').length < 2) return false;
          const re = new RegExp(`(?<![A-Za-z])${n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(?![A-Za-z])`, 'i');
          return re.test(raw);
        }
        return n.length >= 2 && raw.includes(n);
      });
      const contacts = [];
      if (/1[3-9]\d{9}/.test(raw)) contacts.push('手机号码');
      if (/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/.test(raw)) contacts.push('电子邮箱');
      return { names: [...new Set(hitNames)], contacts: [...new Set(contacts)] };
    }

    function ensureClassDraft(c) {
      if (!c) return;
      if (!state.classDraft || state.classDraftId !== c.id) {
        state.classDraft = clone(c.current || []);
        state.classDraftId = c.id;
      }
    }

    function levelLabel(cw, levelId) {
      const lvl = findLevel(cw, levelId);
      return lvl ? lvl.name : '标准';
    }

    function itemLabel(item) {
      const cw = findCw(item.cwId);
      return cw ? `${cw.nameCn} · ${levelLabel(cw, item.levelId)}` : '已删除课件';
    }

    function operatorName() {
      if (state.role === 'admin') return 'Sarah';
      if (state.role === 'monitor') return 'Leo';
      if (state.role === 'teacher') return 'David';
      return 'Amy';
    }

    function operatorLabel() {
      if (state.role === 'admin') return 'Sarah（管理员）';
      if (state.role === 'monitor') return 'Leo（班长）';
      if (state.role === 'teacher') return 'David（老师）';
      return 'Amy（家长）';
    }

    function coverHtml(cw, size = 'h-14 w-14', text = 'text-[18px]') {
      if (cw && cw.cover) {
        return `<img src="${esc(cw.cover)}" alt="" class="${size} shrink-0 rounded-lg object-cover ring-1 ring-slate-200">`;
      }
      const raw = (cw && (cw.nameEn || cw.nameCn)) || '?';
      const initial = raw.split(/\s+/).map((w) => w.charAt(0)).join('').slice(0, 2).toUpperCase() || '?';
      return `<span class="${size} grid shrink-0 place-items-center rounded-lg bg-indigo-50 ${text} font-bold text-indigo-700 ring-1 ring-indigo-100">${esc(initial)}</span>`;
    }

    function ensureDraft() {
      const s = activeStudent();
      if (!state.draft || state.draftStudentId !== s.id) {
        state.draft = clone(s.current);
        state.draftStudentId = s.id;
      }
    }

    function summarizeChanges(before, after) {
      const added = after.filter((a) => !before.some((b) => b.cwId === a.cwId));
      const removed = before.filter((b) => !after.some((a) => a.cwId === b.cwId));
      const levelChanged = after.filter((a) => {
        const b = before.find((x) => x.cwId === a.cwId);
        return b && b.levelId !== a.levelId;
      });
      const progressChanged = after.filter((a) => {
        const b = before.find((x) => x.cwId === a.cwId);
        return b && (b.progressText || '').trim() !== (a.progressText || '').trim();
      });
      const parts = [];
      if (added.length) parts.push(`新增 ${added.map(itemLabel).join('、')}`);
      if (removed.length) parts.push(`移除 ${removed.map(itemLabel).join('、')}`);
      if (levelChanged.length) {
        const details = levelChanged.map((a) => {
          const b = before.find((x) => x.cwId === a.cwId);
          const cw = findCw(a.cwId);
          if (!cw || !b) return '';
          return `${cw.nameCn} ${levelLabel(cw, b.levelId)} → ${levelLabel(cw, a.levelId)}`;
        }).filter(Boolean);
        parts.push(`级别调整 ${details.join('、')}`);
      }
      if (progressChanged.length) {
        const details = progressChanged.map((a) => {
          const cw = findCw(a.cwId);
          if (!cw) return '';
          return `${cw.nameCn} → ${a.progressText.trim() || '清空进度'}`;
        }).filter(Boolean);
        parts.push(`更新进度 ${details.join('、')}`);
      }
      return parts.length ? parts.join('；') : `在学课件更新为 ${after.length} 门`;
    }

    function daysSince(dateStr) {
      if (!dateStr) return null;
      const d1 = new Date(`${TODAY}T00:00:00Z`).getTime();
      const d2 = new Date(`${String(dateStr).slice(0, 10)}T00:00:00Z`).getTime();
      if (Number.isNaN(d1) || Number.isNaN(d2)) return null;
      return Math.max(0, Math.round((d1 - d2) / 86400000));
    }

    function relativeDayLabel(dateStr) {
      const days = daysSince(dateStr);
      if (days === null) return '';
      if (days === 0) return '今天';
      return `${days}天前`;
    }

    /* 列表卡默认折叠摘要：换行折叠为空格，单行 ≤40 字符 */
    function progressSummary(text, limit = 40) {
      const s = String(text || '').replace(/\s+/g, ' ').trim();
      if (!s) return '暂无进度记录';
      return s.length > limit ? `${s.slice(0, limit)}…` : s;
    }

    /* 仅取最近一次「老师角色」更新；无老师更新记录时回退到绑定日期 */
    function latestTeacherUpdateAt(item) {
      const logs = item.teacherUpdateLog || {};
      const counts = item.teacherUpdateCounts || {};
      let latest = '';
      Object.values(logs).forEach((v) => {
        if (v && String(v) > latest) latest = String(v);
      });
      /* 兼容仅有老师计数、无明细日志的旧数据；仍不得采用家长/班长/管理员更新 */
      if (!latest && item.lastUpdatedRole === 'teacher' && item.lastUpdatedBy && counts[item.lastUpdatedBy] && item.lastUpdatedAt) {
        latest = String(item.lastUpdatedAt);
      }
      return latest;
    }

    function isStale6Months(item) {
      const refDate = latestTeacherUpdateAt(item) || item.boundAt;
      const days = daysSince(refDate);
      return days !== null && days > 180;
    }

    function topTeacherInfo(item) {
      const counts = item.teacherUpdateCounts || {};
      const logs = item.teacherUpdateLog || {};
      const entries = Object.entries(counts).filter(([, c]) => c > 0);
      if (!entries.length) return { name: '', count: 0, text: '暂无老师更新记录' };
      const logOf = (name) => {
        if (logs[name]) return logs[name];
        if (item.lastUpdatedRole === 'teacher' && item.lastUpdatedBy === name) return item.lastUpdatedAt || '';
        return '';
      };
      entries.sort((a, b) => {
        if (b[1] !== a[1]) return b[1] - a[1];
        /* 次数相同时，取最近一次更新该门课件的老师 */
        return String(logOf(b[0])).localeCompare(String(logOf(a[0])));
      });
      const [name, count] = entries[0];
      return { name, count, text: `主力更新老师：${name} (${count}次)` };
    }

    function lastUpdatedText(item) {
      if (item.lastUpdatedAt && item.lastUpdatedBy) {
        const roleTag = ROLE_LABELS[item.lastUpdatedRole] || '用户';
        return `最后更新：${item.lastUpdatedBy} (${roleTag}) · ${relativeDayLabel(item.lastUpdatedAt)}`;
      }
      return '最后更新：暂无更新记录';
    }

    function prioritizeTeacherItems(items, teacherName = 'David') {
      const list = [...(items || [])];
      list.sort((a, b) => {
        const aIsMain = topTeacherInfo(a).name === teacherName ? 1 : 0;
        const bIsMain = topTeacherInfo(b).name === teacherName ? 1 : 0;
        if (aIsMain !== bIsMain) return bIsMain - aIsMain;
        const aTime = a.lastUpdatedAt || '';
        const bTime = b.lastUpdatedAt || '';
        return bTime.localeCompare(aTime);
      });
      return list;
    }

    /* ------------------------------------------------------------------
     * 平台课件库审计（仅管理员 · 只读）
     * ------------------------------------------------------------------ */
    function shortText(v, n = 28) {
      const s = String(v || '').trim();
      if (!s) return '—';
      return s.length > n ? `${s.slice(0, n)}…` : s;
    }

    function metaAuditDiff(before, after) {
      const d = [];
      if (before.nameCn !== after.nameCn) d.push({ field: '中文名', before: before.nameCn, after: after.nameCn });
      if (before.nameEn !== after.nameEn) d.push({ field: '英文名', before: before.nameEn, after: after.nameEn });
      if ((before.descCn || '') !== (after.descCn || '')) {
        d.push({ field: '中文简介', before: shortText(before.descCn), after: shortText(after.descCn) });
      }
      if ((before.descEn || '') !== (after.descEn || '')) {
        d.push({ field: '英文简介', before: shortText(before.descEn), after: shortText(after.descEn) });
      }
      if ((before.cover || '') !== (after.cover || '')) {
        d.push({ field: '封面配图', before: before.cover ? '已配置' : '未配置', after: after.cover ? '已更新' : '已移除' });
      }
      return d;
    }

    function levelAuditDiff(beforeLevels, afterLevels) {
      const d = [];
      const beforeMap = new Map((beforeLevels || []).map((l) => [l.id, l]));
      const afterMap = new Map((afterLevels || []).map((l) => [l.id, l]));
      (afterLevels || []).forEach((l) => {
        if (!beforeMap.has(l.id)) d.push({ field: '新增级别', before: '—', after: `${l.name || '未命名'}（${l.images.length} 张样图）` });
      });
      (beforeLevels || []).forEach((l) => {
        if (!afterMap.has(l.id)) d.push({ field: '移除级别', before: `${l.name || '未命名'}（${l.images.length} 张样图）`, after: '—' });
      });
      (afterLevels || []).forEach((l) => {
        const b = beforeMap.get(l.id);
        if (!b) return;
        if (b.name !== l.name) d.push({ field: '级别名称', before: b.name || '未命名', after: l.name || '未命名' });
        if (b.images.length !== l.images.length) {
          d.push({ field: `${l.name || '未命名级别'} · 级别配图`, before: `${b.images.length} 张`, after: `${l.images.length} 张` });
        }
        if (!!b.disabled !== !!l.disabled) {
          d.push({ field: `${l.name || '未命名级别'} · 级别状态`, before: b.disabled ? '已停用' : '启用中', after: l.disabled ? '已停用' : '启用中' });
        }
      });
      if (!d.length) {
        const beforeOrder = (beforeLevels || []).map((l) => l.name).filter(Boolean).join(' / ');
        const afterOrder = (afterLevels || []).map((l) => l.name).filter(Boolean).join(' / ');
        if (beforeOrder !== afterOrder) d.push({ field: '级别顺序', before: beforeOrder || '—', after: afterOrder || '—' });
      }
      return d;
    }

    function pushAudit(records) {
      const stamped = records.map((r) => ({
        id: newId('aud'),
        at: AUDIT_NOW,
        by: operatorName(),
        ...r
      }));
      state.coursewareAudit.unshift(...stamped);
    }

    function libraryAuditRecords() {
      return state.coursewareAudit.filter((r) => state.auditCwId === 'all' || r.cwId === state.auditCwId);
    }

    function openAudit(cwId) {
      if (state.role !== 'admin') return showToast('仅管理员可查看课件库变更日志');
      state.auditCwId = cwId || 'all';
      state.auditShowAll = false;
      state.page = 'audit';
      state.navTab = 'settings';
      state.overlay = null;
      renderAll();
    }

    function renderAudit() {
      const all = state.coursewareAudit;
      const list = libraryAuditRecords();
      const shown = state.auditShowAll ? list : list.slice(0, AUDIT_PREVIEW);
      const currentCw = state.auditCwId === 'all' ? null : findCw(state.auditCwId);
      const auditLabel = currentCw ? `${currentCw.nameCn} · ${currentCw.nameEn}` : `全部课件 · ${all.length} 条记录`;
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10" data-audit-scope="library" data-readonly="true">
        ${pageHeader('变更日志', '平台课件库 · 新建、编辑与启停记录', `<span class="inline-flex shrink-0 items-center gap-1 rounded-full border border-slate-200 bg-slate-50 px-2 py-0.5 text-[12px] font-bold text-slate-500">${icon('lock', 'h-3.5 w-3.5')}只读</span>`)}
        <div class="rounded-xl border border-indigo-100 bg-indigo-50/70 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900">仅管理员可见 · 记录新建课件、课件信息编辑、级别调整与启停切换；不含学员在学课件的绑定与升阶记录。</div>
        <div class="grid grid-cols-3 gap-2">
          ${miniStat('审计记录', all.length, 'indigo')}
          ${miniStat('涉及课件', new Set(all.map((r) => r.cwId)).size, 'slate')}
          ${miniStat('最近记录', all[0] ? all[0].at.slice(5, 10) : '—', 'slate')}
        </div>
        <div class="flex items-center gap-2">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full border border-slate-200 bg-white text-slate-500">${icon('filter', 'h-4 w-4')}</span>
          <button type="button" data-action="open-audit-cw" class="flex min-w-0 flex-1 items-center justify-between gap-1 rounded-full border px-2.5 py-1.5 text-left text-[12px] font-medium transition ${state.auditCwId !== 'all' ? 'border-indigo-500 bg-indigo-50/50 text-indigo-700' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}">
            <span class="truncate">${esc(auditLabel)}</span>
            <span class="shrink-0 text-slate-500">▾</span>
          </button>
        </div>
        <div class="space-y-2">
          ${shown.length ? shown.map(auditCard).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/60 px-6 py-10 text-center">
            <div class="text-[14px] font-bold text-slate-700">暂无变更记录</div>
            <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">该课件尚未产生新建、信息编辑、级别调整或启停切换记录。</p>
          </div>`}
        </div>
        ${list.length > AUDIT_PREVIEW ? `<button data-action="toggle-audit-all" class="h-11 w-full rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 hover:bg-slate-50">${state.auditShowAll ? '收起记录' : `展开最近记录（共 ${list.length} 条）`}</button>` : ''}
        <div class="rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">日志为只读记录，按操作时间倒序展示；每条记录保留操作人、时间与修改前后内容，不可编辑或删除。</div>
      </div>`;
    }

    function auditCard(r) {
      const meta = AUDIT_ACTIONS[r.action] || AUDIT_ACTIONS.EDIT_META;
      return `<article class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3">
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="inline-flex items-center gap-1 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${meta.cls}">${icon(meta.icon, 'h-3 w-3')}${meta.label}</span>
          <span class="min-w-0 truncate text-[14px] font-bold text-slate-900">${esc(r.cwNameCn)}</span>
          <span class="min-w-0 truncate text-[12px] font-medium text-slate-500">${esc(r.cwNameEn)}</span>
        </div>
        <p class="mt-1 text-[14px] font-medium leading-relaxed text-slate-800">${esc(r.summary)}</p>
        <p class="mt-0.5 text-[12px] font-medium text-slate-600"><span class="font-mono">${esc(r.at)}</span> · 操作人 ${esc(r.by)}</p>
        <details class="group mt-2 rounded-xl border border-slate-200 bg-white px-2.5 py-2">
          <summary class="flex cursor-pointer list-none items-center justify-between [&::-webkit-details-marker]:hidden">
            <span class="text-[12px] font-bold text-slate-700">修改前后内容</span>
            <span class="flex items-center gap-1 text-[12px] font-semibold text-indigo-600">
              <span class="group-open:hidden">展开</span>
              <span class="hidden group-open:inline">收起</span>
              ${icon('chevron-down', 'h-3.5 w-3.5 transition group-open:rotate-180')}
            </span>
          </summary>
          <div class="mt-1.5 space-y-1.5">
            ${r.diff.map((d) => `<div class="rounded-lg bg-slate-50 px-2 py-1.5">
              <div class="text-[12px] font-bold text-slate-600">${esc(d.field)}</div>
              <div class="mt-0.5 flex flex-wrap items-center gap-1.5 text-[12px] leading-relaxed">
                <span class="rounded bg-slate-200/70 px-1.5 py-0.5 font-medium text-slate-600 line-through decoration-slate-300">${esc(d.before)}</span>
                <span class="font-bold text-slate-500">→</span>
                <span class="rounded bg-indigo-50 px-1.5 py-0.5 font-semibold text-indigo-800">${esc(d.after)}</span>
              </div>
            </div>`).join('')}
          </div>
        </details>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function viewAllowed(v) {
      if (state.role === 'admin') return ['library', 'student', 'class'].includes(v);
      if (state.role === 'monitor') return ['student', 'class'].includes(v);
      /* 家长仅可只读查看本人孩子已绑定的小班课件（物理隐藏增删/编辑） */
      if (state.role === 'parent') return ['child', 'student', 'class'].includes(v);
      return ['prep', 'student', 'class'].includes(v);
    }

    function currentViewKey() {
      if (state.page === 'editor' || state.page === 'library' || state.page === 'audit') return 'library';
      if (state.page === 'student') return 'student';
      if (state.page === 'child') return 'child';
      if (state.page === 'prep') return 'prep';
      if (state.page === 'class') return 'class';
      return '';
    }

    function syncConsole() {
      const view = currentViewKey();
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const value = b.dataset.value;
        let active = false;
        let disabled = false;
        if (group === 'role') active = state.role === value;
        if (group === 'view') { active = view === value; disabled = !viewAllowed(value); }
        if (group === 'student') active = state.activeStudentId === value;
        if (group === 'device') active = state.device === value;
        if (group === 'online') active = state.online === value;
        b.disabled = disabled;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}${disabled ? ' cursor-not-allowed opacity-40' : ''}`;
        /* 家长已开放绑定小班只读回看，演示控制台保留入口 */
        if (group === 'view' && value === 'class') {
          b.classList.remove('hidden');
        }
      });
    }

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'view') setView(value);
        if (group === 'student') setStudent(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：可查看课件，新建 / 编辑 / 启停 / 保存不可用');
        }
      });
    });

    function setRole(role) {
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.page = role === 'admin' ? 'library' : role === 'monitor' ? 'student' : role === 'parent' ? 'child' : 'prep';
      state.navTab = role === 'admin' ? 'settings' : role === 'monitor' ? 'ops' : role === 'parent' ? 'me' : 'schedule';
      state.overlay = null;
      state.form = emptyForm();
      state.draft = null;
      state.draftStudentId = null;
      state.classDraft = null;
      state.classDraftId = null;
      renderAll();
    }

    function setView(view) {
      if (!viewAllowed(view)) return;
      if (view === 'library') { state.page = 'library'; state.navTab = 'settings'; }
      if (view === 'student') {
        state.page = 'student';
        state.navTab = state.role === 'admin' ? 'settings' : state.role === 'monitor' ? 'ops' : state.role === 'parent' ? 'me' : 'students';
        state.draft = null;
        state.draftStudentId = null;
      }
      if (view === 'child') { state.page = 'child'; state.navTab = 'me'; }
      if (view === 'prep') { state.page = 'prep'; state.navTab = 'schedule'; }
      if (view === 'class') {
        state.page = 'class';
        state.navTab = state.role === 'admin' ? 'settings' : state.role === 'monitor' ? 'ops' : state.role === 'parent' ? 'me' : 'schedule';
        state.classDraft = null;
        state.classDraftId = null;
      }
      state.overlay = null;
      renderAll();
    }

    function setStudent(id) {
      if (!state.students.some((s) => s.id === id)) return;
      state.activeStudentId = id;
      state.draft = null;
      state.draftStudentId = null;
      state.overlay = null;
      if (state.page === 'editor') {
        syncConsole();
        return;
      }
      renderAll();
    }

    function resetDemo() {
      state.role = 'admin';
      state.page = 'library';
      state.navTab = 'settings';
      state.device = 'mobile';
      state.online = 'on';
      state.courseware = clone(LIBRARY);
      state.coursewareAudit = clone(LIBRARY_AUDIT);
      state.students = clone(STUDENTS);
      state.activeStudentId = 'stu_alice001';
      state.classes = clone(CLASSES);
      state.activeClassId = 'cls_ket0001';
      state.classDraft = null;
      state.classDraftId = null;
      state.classPickQuery = '';
      state.libQuery = '';
      state.libStatus = 'all';
      state.auditCwId = 'all';
      state.auditShowAll = false;
      state.auditCwQuery = '';
      state.pickCwQuery = '';
      state.form = emptyForm();
      state.draft = null;
      state.draftStudentId = null;
      state.overlay = null;
      state.pickCw = '';
      state.pickLevel = '';
      renderAll();
      showToast('演示数据已重置');
    }

    $('btnResetDemo').addEventListener('click', resetDemo);

    /* 演示控制台：模拟他人并发提交，用于验证乐观版本校验与冲突兜底 */
    $('btnSimulateConflict').addEventListener('click', () => {
      const o = state.overlay;
      if (!o || o.type !== 'progressDrawer') {
        showToast('请先打开某门课件的「更新进度」抽屉，再模拟他人并发提交');
        return;
      }
      if (o.target === 'class') {
        const c = findClass(o.classId);
        const item = c && (c.current || []).find((x) => x.cwId === o.cwId);
        if (item) bumpItemRev(item);
      } else {
        const item = (activeStudent().current || []).find((x) => x.cwId === o.cwId);
        if (item) bumpItemRev(item);
      }
      showToast('已模拟他人并发提交 · 点击保存将触发版本校验');
    });

    /* 演示导航折叠（状态记忆，localStorage 不可用时静默降级） */
    const NAV_COLLAPSE_KEY = 'dream_proto_nav_collapsed';
    const consoleEl = $('console');
    const consoleMini = document.querySelector('[data-console-mini]');

    function applyNavCollapsed(collapsed) {
      if (!consoleEl || !consoleMini) return;
      consoleEl.classList.toggle('hidden', collapsed);
      consoleMini.classList.toggle('hidden', !collapsed);
      consoleMini.classList.toggle('flex', collapsed);
    }

    function setNavCollapsed(collapsed) {
      applyNavCollapsed(collapsed);
      try { localStorage.setItem(NAV_COLLAPSE_KEY, collapsed ? '1' : '0'); } catch (e) { /* 静默降级 */ }
    }

    let navCollapsed = false;
    try { navCollapsed = localStorage.getItem(NAV_COLLAPSE_KEY) === '1'; } catch (e) { navCollapsed = false; }
    const collapseBtn = document.querySelector('[data-console-collapse]');
    const expandBtn = document.querySelector('[data-console-expand]');
    if (collapseBtn) collapseBtn.addEventListener('click', () => setNavCollapsed(true));
    if (expandBtn) expandBtn.addEventListener('click', () => setNavCollapsed(false));
    applyNavCollapsed(navCollapsed);

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线模式：可查看课件与在学配置，新建 / 编辑 / 启停 / 保存不可用`
        : '';

      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = state.page === 'editor' ? '' : renderNav();
      $('overlay').innerHTML = renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function bannerTitle() {
      if (state.page === 'editor') return state.form.mode === 'edit' ? '编辑课件' : '新建课件';
      if (state.page === 'audit') return '课件库变更日志';
      if (PAGE_TITLES[state.page]) return PAGE_TITLES[state.page];
      const tab = (NAVS[state.role] || []).find((n) => n.id === state.navTab);
      return tab ? tab.label : '课件库';
    }

    function renderBanner() {
      const b = BANNERS[state.role];
      const isEditor = state.page === 'editor';
      const isAudit = state.page === 'audit';
      const isConfigBack = state.page === 'student' && (state.role === 'parent' || state.role === 'teacher');
      const backAction = isEditor ? 'cancel-editor' : isAudit ? 'cancel-audit' : isConfigBack ? 'back-config' : '';
      return `<header class="relative flex h-16 shrink-0 items-center justify-between gap-2 overflow-hidden bg-gradient-to-br ${b.gradient} px-3 text-white">
        ${b.pattern}
        <div class="relative flex min-w-0 items-center gap-2">
          ${backAction
            ? `<button data-action="${backAction}" class="-ml-1 inline-flex h-8 shrink-0 items-center gap-1 rounded-lg px-2 text-[13px] font-semibold text-white/90 transition hover:bg-white/10 active:bg-white/15" aria-label="返回">${icon('chevron-left', 'h-4 w-4')}返回</button>`
            : `<span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-white/20 text-[12px] font-bold ring-1 ring-white/30">${b.initial}</span>`}
          <h1 class="truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</h1>
        </div>
        <button data-action="toast" data-message="您有 3 条未读消息" class="relative grid h-9 w-9 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
          ${icon('bell', 'h-[18px] w-[18px]')}
          <span class="absolute -right-0.5 -top-0.5 grid h-4 min-w-[16px] place-items-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white/30">3</span>
        </button>
      </header>`;
    }

    function renderNav() {
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${NAVS[state.role].map((item) => {
            const on = state.navTab === item.id;
            return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-500'}">
              ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
              <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.page === 'editor') return renderEditor();
      if (state.page === 'audit') return state.role === 'admin' ? renderAudit() : renderLibrary();
      if (state.page === 'library' && state.role === 'admin') return renderLibrary();
      if (state.page === 'student') return renderStudentConfig();
      if (state.page === 'child') return renderParentChild();
      if (state.page === 'prep') return renderTeacherPrep();
      if (state.page === 'class') return viewAllowed('class') ? renderClassCourseware() : renderPlaceholder();
      return renderPlaceholder();
    }

    function renderPlaceholder() {
      const item = NAVS[state.role].find((n) => n.id === state.navTab);
      if (!item) return `<div class="p-8 text-center text-[14px] font-medium text-slate-500">页面不存在</div>`;
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">前往查看</a>` : ''}
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 通用组件
     * ------------------------------------------------------------------ */
    function pageHeader(title, subtitle, right = '') {
      return `<div class="flex items-end justify-between gap-3 px-1">
        <div class="min-w-0">
          <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(title)}</h1>
          <p class="mt-0.5 text-[12px] font-medium text-slate-500">${esc(subtitle)}</p>
        </div>
        ${right}
      </div>`;
    }

    function miniStat(label, value, tone, suffix = '') {
      const valueTone = tone === 'indigo' ? 'text-indigo-700' : tone === 'emerald' ? 'text-emerald-700' : tone === 'rose' ? 'text-rose-700' : 'text-slate-900';
      return `<div class="rounded-xl border border-slate-300 bg-slate-50/70 px-2 py-2">
        <div class="text-[12px] font-medium text-slate-500">${esc(label)}</div>
        <div class="mt-0.5 font-mono text-[18px] font-bold ${valueTone}">${esc(value)}${suffix ? `<span class="ml-0.5 text-[12px] font-medium">${esc(suffix)}</span>` : ''}</div>
      </div>`;
    }

    function studentSwitch() {
      return `<div class="rounded-2xl border border-slate-300 bg-slate-50/70 p-2">
        <div class="flex items-center gap-1 rounded-xl bg-slate-100 p-1">
          ${state.students.map((s) => `<button data-action="switch-student" data-id="${s.id}" class="flex flex-1 items-center justify-center gap-1 rounded-lg py-2 text-[12px] font-bold transition ${s.id === state.activeStudentId ? 'bg-white text-indigo-700' : 'text-slate-500'}"><span class="truncate">${esc(s.nickname)}</span>${s.status === 'ACTIVE' ? '' : `<span class="shrink-0 rounded border border-slate-200 bg-slate-100 px-1 py-0.5 text-[10px] font-bold text-slate-500">已归档</span>`}</button>`).join('')}
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 管理员 · 课件库
     * ------------------------------------------------------------------ */
    function filteredLibrary() {
      const q = state.libQuery.trim().toLowerCase();
      /* 默认排序：启用中在前、已停用在后；同状态按英文名 A → Z */
      return state.courseware.filter((cw) => {
        const qOk = !q || cw.nameCn.toLowerCase().includes(q) || cw.nameEn.toLowerCase().includes(q);
        const statusOk = state.libStatus === 'all' || (state.libStatus === 'active' ? cw.active : !cw.active);
        return qOk && statusOk;
      }).sort((a, b) => {
        if (a.active !== b.active) return a.active ? -1 : 1;
        const byEn = String(a.nameEn || '').localeCompare(String(b.nameEn || ''), 'en', { sensitivity: 'base' });
        if (byEn !== 0) return byEn;
        return String(a.nameCn || '').localeCompare(String(b.nameCn || ''), 'zh-Hans-CN');
      });
    }

    function renderLibrary() {
      const all = state.courseware;
      const active = all.filter((c) => c.active);
      const inactive = all.filter((c) => !c.active);
      const list = filteredLibrary();
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';
      const canWrite = state.online === 'on';

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('课件库', '平台课件资产 · 启用中在前 · 同状态英文名 A–Z', `<div class="flex shrink-0 items-center gap-1.5">
          <button data-action="open-audit" data-admin-only="true" class="h-8 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-800 hover:bg-slate-50">变更日志</button>
          <button data-action="create-courseware" ${canWrite ? '' : 'disabled'} class="h-8 rounded-lg bg-indigo-600 px-3 text-[12px] font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">+ 新建课件</button>
        </div>`)}
        <div class="grid grid-cols-3 gap-2">
          ${miniStat('课件总数', all.length, 'indigo')}
          ${miniStat('启用中', active.length, 'emerald')}
          ${miniStat('已停用', inactive.length, 'slate')}
        </div>
        <div class="relative">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
          <input id="libSearch" value="${esc(state.libQuery)}" placeholder="搜索中文名 / 英文名" class="h-11 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500">
        </div>
        <div class="flex items-center gap-2">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full border border-slate-200 bg-white text-slate-500">${icon('filter', 'h-4 w-4')}</span>
          <div class="flex items-center gap-1.5 overflow-x-auto py-0.5 no-scrollbar">
            ${[['all', '全部状态'], ['active', '启用中'], ['inactive', '已停用']].map(([value, label]) => `<button type="button" data-action="set-lib-status" data-value="${value}" class="h-8 shrink-0 whitespace-nowrap rounded-full px-3 text-[12px] transition ${state.libStatus === value ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${label}</button>`).join('')}
          </div>
        </div>
        <div class="${grid}">
          ${list.length ? list.map(libraryCard).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/60 px-6 py-10 text-center text-[14px] font-medium text-slate-500">没有匹配的课件</div>`}
        </div>
        <div class="rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">已被学员绑定的课件仅支持停用，禁止物理删除；停用后新增选择自动隐藏，已绑定档案继续展示【已停用】。</div>
      </div>`;
    }

    function libraryCard(cw) {
      const canWrite = state.online === 'on';
      const muted = !cw.active;
      return `<article class="rounded-2xl border p-3 ${cw.active ? 'border-slate-300 bg-slate-50/70' : 'border-dashed border-slate-400 bg-slate-50/60 opacity-60'}">
        <div class="flex items-start gap-2.5">
          <span class="${muted ? 'grayscale opacity-60' : ''}">${coverHtml(cw, 'h-14 w-14', 'text-[18px]')}</span>
          <div class="min-w-0 flex-1">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="truncate text-[16px] font-bold ${muted ? 'text-slate-500' : 'text-slate-900'}">${esc(cw.nameCn)}</div>
                <div class="truncate text-[12px] font-medium ${muted ? 'text-slate-500' : 'text-slate-500'}">${esc(cw.nameEn)}</div>
              </div>
              <div class="flex shrink-0 flex-col items-end gap-1">
                ${cw.active
                  ? '<span class="rounded-full border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">启用</span>'
                  : '<span class="rounded-full border border-slate-200 bg-slate-200/70 px-1.5 py-0.5 text-[12px] font-bold text-slate-600">已停用</span>'}
                ${cw.pendingReview && !cw.active ? '<span class="rounded-full border border-amber-200 bg-amber-50 px-1.5 py-0.5 text-[12px] font-semibold text-amber-800">待完善</span>' : ''}
              </div>
            </div>
            <div class="mt-1.5 flex flex-wrap items-center gap-x-2 text-[12px] font-medium ${muted ? 'text-slate-500' : 'text-slate-500'}">
              <span>${cw.levels.length} 个级别</span><span>·</span><span>已绑定 ${cw.boundCount} 名学员</span>
            </div>
          </div>
        </div>
        <div class="mt-2 flex items-center justify-between gap-2 border-t border-slate-200/70 pt-2">
          <div class="flex items-center gap-2">
            <button data-action="toggle-cw" data-id="${cw.id}" ${canWrite ? '' : 'disabled'} class="relative h-6 w-11 shrink-0 rounded-full transition ${cw.active ? 'bg-indigo-600' : 'bg-slate-300'} disabled:opacity-40" aria-label="${cw.active ? '停用' : '启用'}">
              <span class="absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white transition-transform ${cw.active ? 'translate-x-5' : 'translate-x-0'}"></span>
            </button>
            <span class="text-[12px] font-medium ${muted ? 'text-slate-500' : 'text-slate-500'}">${cw.active ? '启用中' : '已停用'}</span>
          </div>
          <div class="flex shrink-0 items-center gap-2.5">
            <button data-action="preview-cw" data-id="${cw.id}" data-level="${cw.levels[0] ? cw.levels[0].id : ''}" class="inline-flex items-center gap-0.5 whitespace-nowrap text-[12px] font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">样图 →</button>
            <button data-action="open-audit" data-admin-only="true" data-cw="${cw.id}" class="inline-flex items-center gap-0.5 whitespace-nowrap text-[12px] font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">日志 →</button>
            <button data-action="edit-cw" data-id="${cw.id}" ${canWrite ? '' : 'disabled'} class="h-7 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:opacity-40">编辑</button>
          </div>
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 管理员 · 课件编辑
     * ------------------------------------------------------------------ */
    function openEditor(mode, id = null) {
      if (state.online === 'off') return showToast('离线模式下不可新建或编辑课件');
      if (mode === 'edit') {
        const cw = findCw(id);
        if (!cw) return;
        state.form = {
          mode: 'edit', id: cw.id, nameCn: cw.nameCn, nameEn: cw.nameEn,
          descCn: cw.descCn || '', descEn: cw.descEn || '',
          cover: cw.cover || '', levels: clone(cw.levels || []), active: cw.active,
          showErrors: false,
          error: '', boundCount: cw.boundCount || 0, createdAt: cw.createdAt || ''
        };
      } else {
        state.form = emptyForm();
      }
      state.page = 'editor';
      state.navTab = 'settings';
      state.overlay = null;
      renderAll();
    }

    function formSectionTitle(num, title, extra = '') {
      return `<h2 class="flex items-center gap-2 text-[14px] font-bold text-slate-900">
        <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full bg-indigo-50 text-[11px] font-bold text-indigo-600">${num}</span>
        <span>${esc(title)}</span>${extra}
      </h2>`;
    }

    function renderEditor() {
      const f = state.form;
      const isEdit = f.mode === 'edit';
      const fieldCls = 'h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 px-3.5 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15';
      const areaCls = 'h-20 w-full rounded-xl border border-slate-200 bg-slate-50/70 p-3.5 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15';
      return `<div class="flex h-full min-h-0 flex-col bg-slate-50">
        <div id="editorScroll" class="min-h-0 flex-1 overflow-y-auto bg-slate-50">
          <div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3">
            <p class="px-1 text-[12px] font-medium leading-relaxed text-slate-500">中英文名称为必填且全库唯一（英文忽略大小写，含已停用课件）· 中英文简介、封面配图、级别与样图可选</p>

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4">
              ${formSectionTitle(1, '基础信息')}
              <div class="mt-3 space-y-3.5">
                <div>
                  <label for="fNameCn" class="mb-1 block text-[14px] font-semibold text-slate-700">中文名 <span class="text-rose-500">*</span></label>
                  <input id="fNameCn" value="${esc(f.nameCn)}" maxlength="64" placeholder="如 牛津阅读树" class="${fieldCls}">
                </div>
                <div>
                  <label for="fNameEn" class="mb-1 block text-[14px] font-semibold text-slate-700">英文名 <span class="text-rose-500">*</span></label>
                  <input id="fNameEn" value="${esc(f.nameEn)}" maxlength="64" placeholder="如 Oxford Reading Tree" class="${fieldCls}">
                </div>
                <div>
                  <label for="fDescCn" class="mb-1 block text-[14px] font-semibold text-slate-700">中文简介</label>
                  <textarea id="fDescCn" maxlength="500" placeholder="课件中文简介（选填）" class="${areaCls}">${esc(f.descCn)}</textarea>
                </div>
                <div>
                  <label for="fDescEn" class="mb-1 block text-[14px] font-semibold text-slate-700">English Description</label>
                  <textarea id="fDescEn" maxlength="500" placeholder="Courseware description (optional)" class="${areaCls}">${esc(f.descEn)}</textarea>
                </div>
                <div>
                  <div class="mb-1 flex items-center justify-between">
                    <span class="text-[14px] font-semibold text-slate-700">封面配图</span>
                    <span class="text-[12px] font-medium text-slate-500">选填 · 1 张</span>
                  </div>
                  <div class="flex items-center gap-2.5">
                    <span class="h-20 w-20 overflow-hidden rounded-xl border border-slate-200 bg-slate-50">
                      ${f.cover ? `<img src="${esc(f.cover)}" class="h-full w-full object-cover" alt="">` : `<span class="grid h-full w-full place-items-center text-slate-500">${icon('image', 'h-6 w-6')}</span>`}
                    </span>
                    <div class="flex flex-col gap-1.5">
                      <label for="fCoverInput" class="inline-flex h-8 cursor-pointer items-center rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-800 hover:bg-slate-50">选择封面</label>
                      <input id="fCoverInput" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
                      <button data-action="demo-cover" class="h-8 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-800 hover:bg-slate-50">使用示例封面</button>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <section id="formLevels" class="rounded-2xl border border-slate-200/80 bg-white p-4">
              <div class="flex items-center justify-between gap-2">
                ${formSectionTitle(2, '分级级别', `<span class="text-[12px] font-medium text-slate-500">${f.levels.length}/30 个</span>`)}
                <button data-action="add-level" ${f.levels.length >= 30 ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-800 hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40">+ 添加级别</button>
              </div>
              <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">级别英文名必填且不超过 32 字符；每级可上传 0-9 张样图内页。新增级别按录入顺序排列，全端以管理员上移/下移保存后的显式顺序序号统一展示。</p>
              <div class="mt-2.5 space-y-2">
                ${f.levels.length ? f.levels.map((lvl, i) => levelEditor(lvl, i)).join('') : `<div class="rounded-xl border border-dashed border-slate-300 bg-slate-50 px-3 py-5 text-center text-[12px] font-medium text-slate-500">尚未配置级别 · 可保存为无分级课件</div>`}
              </div>
            </section>

            ${f.error ? `<div id="formError" class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-rose-700">${esc(f.error)}</div>` : ''}
          </div>
        </div>
        <div class="flex shrink-0 gap-2 border-t border-slate-200 bg-white px-4 py-3">
          <button data-action="cancel-editor" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 hover:bg-slate-50">取消</button>
          <button data-action="save-cw" ${state.online === 'on' ? '' : 'disabled'} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">${isEdit ? '保存修改' : '确认创建'}</button>
        </div>
      </div>`;
    }

    function levelEditor(lvl, i) {

      const isLast = i === state.form.levels.length - 1;
      const nameInvalid = state.form.showErrors && (!lvl.name.trim() || lvl.name.length > 32);
      const countInvalid = lvl.images.length > 9;
      const bound = (lvl.boundCount || 0) > 0;
      return `<div class="rounded-xl border ${nameInvalid || countInvalid ? 'border-rose-300 bg-rose-50/40' : 'border-slate-200 bg-slate-50/70'} p-2.5">

          <div class="flex shrink-0 gap-1">
            <button data-action="move-level" data-index="${i}" data-delta="-1" ${isFirst ? 'disabled' : ''} class="grid h-8 w-7 place-items-center rounded-lg border border-slate-200 bg-white text-slate-500 disabled:opacity-30" aria-label="上移">${icon('chevron-up', 'h-4 w-4')}</button>
            <button data-action="move-level" data-index="${i}" data-delta="1" ${isLast ? 'disabled' : ''} class="grid h-8 w-7 place-items-center rounded-lg border border-slate-200 bg-white text-slate-500 disabled:opacity-30" aria-label="下移">${icon('chevron-down', 'h-4 w-4')}</button>
          </div>
          <input id="fLevelName-${i}" value="${esc(lvl.name)}" maxlength="32" placeholder="级别英文名，如 Stage 1" class="h-11 min-w-0 flex-1 rounded-xl border ${nameInvalid ? 'border-rose-400 bg-rose-50' : 'border-slate-200 bg-white'} px-3.5 text-[16px] font-semibold text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">
          ${lvl.disabled ? `<span class="shrink-0 rounded-md border border-slate-200 bg-slate-200/70 px-1.5 py-0.5 text-[12px] font-bold text-slate-600">已停用</span>` : ''}
        </div>
        ${nameInvalid ? `<div class="mt-1 text-[12px] font-semibold text-rose-700">级别英文名必填，最长 32 字符</div>` : ''}
        <div class="mt-2 grid grid-cols-3 gap-1.5">
          ${lvl.images.map((img, j) => `<div class="relative aspect-square overflow-hidden rounded-lg border border-slate-200 bg-white">
            <button data-action="editor-preview-img" data-index="${i}" data-img-index="${j}" class="block h-full w-full" aria-label="预览样图">
              <img src="${img}" class="h-full w-full object-cover" alt="">
            </button>
            <div class="absolute inset-x-1 bottom-1 flex justify-between gap-1">
              <button data-action="move-level-img" data-index="${i}" data-img-index="${j}" data-delta="-1" ${j === 0 ? 'disabled' : ''} class="grid h-6 flex-1 place-items-center rounded bg-white/85 text-slate-600 disabled:opacity-30" aria-label="前移">${icon('chevron-left', 'h-3 w-3')}</button>
              <button data-action="move-level-img" data-index="${i}" data-img-index="${j}" data-delta="1" ${j === lvl.images.length - 1 ? 'disabled' : ''} class="grid h-6 flex-1 place-items-center rounded bg-white/85 text-slate-600 disabled:opacity-30" aria-label="后移">${icon('chevron-right', 'h-3 w-3')}</button>
              <button data-action="remove-level-img" data-index="${i}" data-img-index="${j}" class="grid h-6 w-6 place-items-center rounded bg-rose-50 text-rose-600" aria-label="删除配图">${icon('x', 'h-3 w-3')}</button>
            </div>
          </div>`).join('')}
          ${lvl.images.length < 9 ? `<label class="flex aspect-square cursor-pointer flex-col items-center justify-center gap-1 rounded-lg border border-dashed border-slate-300 bg-white text-slate-500">
            <input id="fLevelImg-${i}" type="file" accept="image/jpeg,image/png,image/webp" multiple class="hidden">
            ${icon('plus', 'h-4 w-4')}
            <span class="text-[12px] font-semibold">添加配图</span>
          </label>` : ''}
        </div>
        <div class="mt-1.5 flex items-center justify-between gap-2">
          <span class="text-[12px] font-semibold ${countInvalid ? 'text-rose-700' : 'text-slate-500'}">${lvl.images.length}/9 张样图</span>
          <button data-action="demo-level-img" data-index="${i}" class="text-[12px] font-bold text-slate-600 hover:text-slate-900">生成示例图</button>
        </div>
        <div class="mt-2 flex flex-wrap items-center gap-1.5 border-t border-slate-200/70 pt-2" data-level-actions="true">
          ${bound ? `<span class="inline-flex items-center gap-1 rounded-md border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-600">${icon('lock', 'h-3 w-3')}已被绑定 · 仅可停用</span>` : ''}
          <button data-action="toggle-level" data-index="${i}" ${state.online === 'on' ? '' : 'disabled'} class="h-7 rounded-lg border px-2.5 text-[12px] font-bold transition disabled:cursor-not-allowed disabled:opacity-40 ${lvl.disabled ? 'border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-50'}">${lvl.disabled ? '启用' : '停用'}</button>
          ${bound
            ? ''
            : `<button data-action="remove-level" data-index="${i}" ${state.online === 'on' ? '' : 'disabled'} class="inline-flex h-7 items-center gap-1 rounded-lg border border-rose-200 bg-white px-2.5 text-[12px] font-bold text-rose-700 transition hover:bg-rose-50 disabled:cursor-not-allowed disabled:opacity-40">${icon('trash-2', 'h-3.5 w-3.5')}删除级别</button>`}
        </div>
      </div>`;

    function renderEditorOnly() {
      const scroller = $('editorScroll');
      const top = scroller ? scroller.scrollTop : 0;
      $('content').innerHTML = renderContent();
      if (window.lucide) lucide.createIcons();
      const next = $('editorScroll');
      if (next) next.scrollTop = top;
    }

    function formError() {
      const f = state.form;
      if (state.online === 'off') return '离线模式下不可保存课件';
      if (!f.nameCn.trim()) return '请填写课件中文名';
      if (f.nameCn.length > 64) return '中文名不能超过 64 字符';
      if (!f.nameEn.trim()) return '请填写课件英文名';
      if (f.nameEn.length > 64) return '英文名不能超过 64 字符';
      /* AC-1E-01：中文名与英文名（忽略大小写）在全库含停用课件内各自唯一 */
      const dupCn = state.courseware.find((c) => c.id !== f.id && String(c.nameCn || '').trim() === f.nameCn.trim());
      if (dupCn) return `已存在同名课件《${f.nameCn.trim()}》，请直接编辑原课件`;
      const dupEn = state.courseware.find((c) => c.id !== f.id && String(c.nameEn || '').trim().toLowerCase() === f.nameEn.trim().toLowerCase());
      if (dupEn) return `已存在同名课件《${f.nameEn.trim()}》，请直接编辑原课件`;
      if (f.levels.length > 30) return '单个课件最多支持 30 个分级级别';
      for (let i = 0; i < f.levels.length; i++) {
        const lvl = f.levels[i];
        if (!lvl.name.trim()) return `请填写第 ${i + 1} 个级别的英文名`;
        if (lvl.name.length > 32) return `第 ${i + 1} 个级别英文名不能超过 32 字符`;
        if (lvl.images.length > 9) return `第 ${i + 1} 个级别最多 9 张样图`;
      }
      return null;
    }

    function saveCourseware() {
      const err = formError();
      if (err) {
        state.form.error = err;
        state.form.showErrors = true;
        renderEditorOnly();
        setTimeout(() => $('formError')?.scrollIntoView({ block: 'center' }), 60);
        showToast(err);
        return;
      }
      const f = state.form;
      state.form.showErrors = false;
      if (f.mode === 'edit') {
        const cw = findCw(f.id);
        if (!cw) return;
        const before = {
          nameCn: cw.nameCn, nameEn: cw.nameEn,
          descCn: cw.descCn, descEn: cw.descEn, cover: cw.cover,
          levels: clone(cw.levels || []), active: cw.active
        };
        Object.assign(cw, {
          nameCn: f.nameCn.trim(), nameEn: f.nameEn.trim(),
          descCn: f.descCn, descEn: f.descEn,
          cover: f.cover, levels: clone(f.levels), active: f.active
        });
        if (cw.active) cw.pendingReview = false;

        const records = [];
        const metaDiff = metaAuditDiff(before, cw);
        if (metaDiff.length) {
          records.push({
            cwId: cw.id, cwNameCn: cw.nameCn, cwNameEn: cw.nameEn, action: 'EDIT_META',
            summary: `更新 ${metaDiff.map((d) => d.field).join('、')}`, diff: metaDiff
          });
        }
        const levelDiff = levelAuditDiff(before.levels, cw.levels);
        if (levelDiff.length) {
          records.push({
            cwId: cw.id, cwNameCn: cw.nameCn, cwNameEn: cw.nameEn, action: 'LEVEL_CHANGE',
            summary: `级别配置调整 · ${levelDiff.length} 项`, diff: levelDiff
          });
        }
        if (before.active !== cw.active) {
          records.push({
            cwId: cw.id, cwNameCn: cw.nameCn, cwNameEn: cw.nameEn, action: 'TOGGLE_ACTIVE',
            summary: `${before.active ? '启用' : '停用'} → ${cw.active ? '启用' : '停用'}`,
            diff: [{ field: '启用状态', before: before.active ? '启用' : '停用', after: cw.active ? '启用' : '停用' }]
          });
        }
        pushAudit(records);

        state.page = 'library';
        state.navTab = 'settings';
        renderAll();
        showToast(cw.active ? '课件已保存 · 当前为启用状态' : '课件已保存 · 当前为停用状态');
        return;
      }
      const created = {
        id: newId('cw'),
        nameCn: f.nameCn.trim(), nameEn: f.nameEn.trim(),
        descCn: f.descCn, descEn: f.descEn,
        cover: f.cover, levels: clone(f.levels),
        /* AC-1E-03：新建课件入库强制停用，核验后由管理员手动开启 */
        active: false,
        pendingReview: true,
        boundCount: 0, createdAt: TODAY
      };
      state.courseware.unshift(created);
      pushAudit([{
        cwId: created.id, cwNameCn: created.nameCn, cwNameEn: created.nameEn, action: 'CREATE',
        summary: '新建课件 · 强制默认停用',
        diff: [
          { field: '启用状态', before: '—', after: '停用（新建默认）' },
          { field: '级别', before: '—', after: created.levels.length ? created.levels.map((l) => l.name || '未命名').join(' / ') : '未配置级别' },
          { field: '封面配图', before: '—', after: created.cover ? '已配置' : '未配置' }
        ]
      }]);
      state.page = 'library';
      state.navTab = 'settings';
      renderAll();
      showToast('课件已创建并默认为停用 · 核验后请在列表手动启用');
    }

    /* ------------------------------------------------------------------
     * 在学课件 · 管理员 / 班长
     * ------------------------------------------------------------------ */
    function renderStudentConfig() {
      ensureDraft();
      const s = activeStudent();
      const draft = state.draft;
      const parentBlocked = state.role === 'parent' && s.status !== 'ACTIVE';
      const roleCanWrite = ['admin', 'monitor', 'teacher', 'parent'].includes(state.role);
      const teacherBlocked = state.role === 'teacher' && (s.status !== 'ACTIVE' || !LESSONS[s.id]);
      const canWriteRole = roleCanWrite && !parentBlocked && !teacherBlocked;
      const online = state.online === 'on';
      const canWrite = canWriteRole && online;
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('在学课件', `${s.nickname} · ${draft.length}/6`)}
        ${studentSwitch()}

        ${parentBlocked ? `<div class="rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">${s.status === 'ARCHIVED' ? '已归档宝贝 · 在学课件与进度备注仅保留只读历史回看，增删与编辑按钮已物理隐藏。' : '该学员档案当前不可编辑，家长仅可查看；如需调整请联系负责班长。'}</div>` : ''}

        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">在学课件 <span class="ml-1 rounded-full bg-slate-100 px-1.5 py-0.5 font-mono text-[12px] font-bold text-slate-500">${draft.length}/6</span></h2>
              <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">[配置课件] 仅负责增删教材；级别与学习进度统一通过每门课件的 [更新进度] 维护，提交执行乐观版本校验防并发静默覆盖。家长仅限本人名下「正式在读」孩子。</p>
            </div>
            ${canWriteRole ? `<button data-action="save-config" ${online ? '' : 'disabled'} class="h-7 shrink-0 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-100 disabled:text-slate-500">保存生效</button>` : ''}
          </div>

          ${!online && canWriteRole ? `<div class="mt-2 rounded-lg border border-amber-200 bg-amber-50 px-2.5 py-2 text-[12px] font-medium text-amber-900">离线模式：可查看，保存与调整不可用。</div>` : ''}

          <div class="mt-2.5 ${grid}">
            ${draft.length ? draft.map((item, i) => configItem(item, i, canWrite)).join('') : `<div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 px-3 py-6 text-center text-[12px] font-medium text-slate-500">尚未配置在学课件</div>`}
            ${canWriteRole ? `<div class="rounded-xl border border-dashed border-slate-300 bg-slate-50/60 p-2 text-center">
              <button data-action="config-add" ${(online && draft.length < 6) ? '' : 'disabled'} title="${draft.length >= 6 ? '每个学员最多支持配置 6 门在学课件' : '从已启用课件中添加'}" class="inline-flex h-7 items-center gap-1 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-100 disabled:text-slate-500">${icon('plus', 'h-3.5 w-3.5')}添加在学课件</button>
            </div>` : ''}
          </div>

          ${draft.length >= 6 ? `<div class="mt-2 rounded-lg border border-amber-200 bg-amber-50 px-2.5 py-2 text-[12px] font-medium text-amber-900">已达 6 门上限，【添加在学课件】已置灰；请先移除后再添加。</div>` : ''}

          ${auditDetails(s)}
        </section>

        ${state.role === 'parent' && !parentBlocked ? `<div class="rounded-xl border border-indigo-100 bg-indigo-50/70 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900">
          <div class="font-bold text-indigo-950">保存后提醒预览（合并去重）</div>
          <div class="mt-1">${parentNotifyTargets(s).map((t) => `${esc(t.role)} ${esc(t.name)}`).join(' ∪ ')} → 合并为 <span class="font-bold">1 条站内中性卡</span> · 不发 Email</div>
          <div class="mt-0.5 text-indigo-700">同一账号兼任多项时仅推送 1 条，避免重复刷屏。</div>
        </div>` : ''}
        <div class="rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">${parentBlocked ? (s.status === 'ARCHIVED' ? '已归档宝贝 · 在学课件与进度备注长期只读留存，严禁编辑。' : '该学员档案当前不可编辑；如需调整请联系负责班长。') : teacherBlocked ? '老师实时编辑权截止于次日 02:00 (UTC+8) 自动结课前；已结课请从「授课历史」课节卡片补录。' : canWriteRole ? '停用课件不会自动解绑；已绑定的停用课件继续展示【已停用】。保存后老师日历与家长端即时刷新；家长修改时合并去重提醒待上/待排相关老师与班长。' : '在学课件由管理员、负责班长、授课老师与家长共同维护。'}</div>
      </div>`;
    }

    function configItem(item, i, canWrite) {
      const cw = findCw(item.cwId);
      if (!cw) return '';
      const lvl = findLevel(cw, item.levelId);
      const stale = isStale6Months(item);
      const topT = topTeacherInfo(item);
      const lastUpd = lastUpdatedText(item);
      /* 级别只读展示：[配置课件] 只负责增删，改级唯一收敛到 [更新进度] 抽屉 */
      const cfgControl = `<span class="rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(lvl ? lvl.name : '标准/无分级')}</span>`;
      const levelDisabled = !!(lvl && lvl.disabled);
      return `<div class="rounded-xl border ${stale ? 'border-amber-300 bg-amber-50/40' : 'border-slate-200 bg-white'} p-3">
        <div class="flex items-start gap-2.5">
          <button data-action="preview-cw" data-id="${cw.id}" data-level="${esc(item.levelId || '')}" class="shrink-0" aria-label="预览课件">${coverHtml(cw, 'h-11 w-11', 'text-[14px]')}</button>
          <div class="min-w-0 flex-1">
            <div class="flex items-start justify-between gap-1.5">

    function saveConfig() {
      if (state.online === 'off') return showToast('离线模式下不可保存在学课件');
      const s = activeStudent();
      if (state.role === 'parent' && s.status !== 'ACTIVE') return showToast('家长仅可维护本人名下「正式在读」学员');
      if (state.role === 'teacher' && (s.status !== 'ACTIVE' || !LESSONS[s.id])) return showToast('实时编辑权已收回：已结课或无待上/未结课次，请前往「授课历史」补录');
      ensureDraft();
      const before = s.current;
      const after = clone(state.draft);
      if (JSON.stringify(before) === JSON.stringify(after)) {
        showToast('在学课件未变更');
        return;
      }
      /* D7/L-2 乐观版本校验：草稿基线版本与当前最新版本不一致则拒绝静默覆盖 */
      const configConflict = after.some((item) => {
        const live = (s.current || []).find((x) => x.cwId === item.cwId);
        return live && itemRev(live) !== itemRev(item);
      });
      if (configConflict) {
        state.overlay = { type: 'versionConflict', ctx: null, operator: '其他协作者' };
        renderOverlayOnly();
        return;
      }
      after.forEach((item) => {
        const prev = before.find((b) => b.cwId === item.cwId);
        const progressChanged = !prev
          ? !!(item.progressText && item.progressText.trim())
          : (prev.progressText || '').trim() !== (item.progressText || '').trim();
        if (progressChanged) {
          item.progressText = (item.progressText || '').trim();
          item.lastUpdatedAt = AUDIT_NOW;
          item.lastUpdatedBy = operatorName();
          item.lastUpdatedRole = state.role;
          item.teacherUpdateCounts = item.teacherUpdateCounts || {};
          if (state.role === 'teacher') {
            const tName = operatorName();
            item.teacherUpdateCounts[tName] = (item.teacherUpdateCounts[tName] || 0) + 1;
            item.teacherUpdateLog = item.teacherUpdateLog || {};
            item.teacherUpdateLog[tName] = AUDIT_NOW;
          }
        }
      });
      s.current = clone(after);
      s.audit = s.audit || [];
      s.audit.unshift({
        at: AUDIT_NOW,
        by: operatorLabel(),
        text: summarizeChanges(before, after)
      });
      state.draft = clone(s.current);
      state.draftStudentId = s.id;
      renderAll();
      if (state.role === 'parent') {
        const targets = parentNotifyTargets(s).map((t) => t.name).join('、');
        showToast(`已保存 · 合并去重为 1 条站内中性卡（不发 Email）：${targets}`);
      } else if (state.role === 'teacher') {
        showToast(`在学课件已保存，共 ${after.length} 门；已同步至老师课表与家长端`);
      } else {
        showToast(`在学课件已保存，共 ${after.length} 门；老师课表与家长端已同步刷新`);
      }
    }

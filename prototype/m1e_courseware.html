            <button data-action="toast" data-message="已打开课程详情" class="shrink-0 text-[12px] font-bold text-indigo-600">查看课表 →</button>
          </div>
        </article>

        <section id="prepDrawer" class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">在学课件 <span class="ml-1 rounded-full bg-slate-100 px-1.5 py-0.5 align-middle font-mono text-[12px] font-bold text-slate-500">${items.length}/6</span></h2>
              <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">优先展示本人多次更新进度的课件；可查看样图并记录学习进度</p>
            </div>
            <button data-action="open-config" class="h-7 shrink-0 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70">编辑在学课件</button>
          </div>
          <div class="mt-2.5 space-y-2">
            ${items.length ? items.map((item, idx) => teacherCoursewareCard(item, idx)).join('') : `<span class="text-[14px] font-medium text-slate-500">该学员暂未配置在学课件</span>`}
          </div>
          <div class="mt-2.5 rounded-xl border border-slate-200/80 bg-white px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-600">课件信息仅作课前备课参考，不影响正常预约上课。</div>
        </section>
      </div>`;
    }

    function teacherCoursewareCard(item, idx) {
      const cw = findCw(item.cwId);
      if (!cw) return '';
      const lvl = findLevel(cw, item.levelId);
      const inactive = !cw.active;
      const stale = isStale6Months(item);
      const topT = topTeacherInfo(item);
      const isMine = topT.name === 'David';
      return `<article class="rounded-xl border ${stale ? 'border-amber-300 bg-amber-50/40' : 'border-slate-200 bg-white'} p-3">
        <div class="flex items-start justify-between gap-2">
          <button data-action="preview-cw" data-id="${cw.id}" data-level="${esc(item.levelId || '')}" class="flex min-w-0 flex-1 items-start gap-2.5 text-left">
            ${coverHtml(cw, 'h-11 w-11', 'text-[14px]')}
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="truncate text-[14px] font-bold text-slate-900">${esc(cw.nameEn)}</span>
                <span class="rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(lvl ? lvl.name : '标准')}</span>
                ${isMine && idx === 0 ? `<span class="rounded-md border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">本人主力</span>` : ''}
                ${inactive ? `<span class="rounded-md border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-500">已停用</span>` : ''}
                ${stale ? `<span class="inline-flex items-center gap-1 rounded-md border border-amber-300 bg-amber-100 px-1.5 py-0.5 text-[12px] font-bold text-amber-900">近 6 个月没有更新</span>` : ''}
              </div>
              <div class="mt-0.5 truncate text-[12px] font-medium text-slate-500">${esc(cw.nameCn)} · 样图 ${(lvl ? lvl.images : []).length} 张</div>
            </div>
          </button>
          <button data-action="preview-cw" data-id="${cw.id}" data-level="${esc(item.levelId || '')}" class="shrink-0 text-[12px] font-semibold text-indigo-600 hover:underline">样图 →</button>
        </div>
        <div class="mt-2 rounded-xl border border-slate-200/80 bg-slate-50/70 px-2.5 py-2">
          <div class="flex items-center justify-between gap-2">
            <div class="flex min-w-0 flex-1 items-center gap-1 text-[12px] font-semibold text-slate-600">学习进度：<span class="min-w-0 flex-1 truncate text-slate-900" data-progress-summary="true">${esc(progressSummary(item.progressText))}</span></div>
            <button data-action="open-progress-drawer" data-source="live" data-cw="${cw.id}" ${state.online === 'on' ? '' : 'disabled'} class="inline-flex h-7 shrink-0 items-center gap-1 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-100 disabled:text-slate-500">${icon('edit-3', 'h-3 w-3')}更新进度</button>
          </div>
          <div class="mt-1.5 flex flex-wrap items-center justify-between gap-2 text-[12px] font-medium text-slate-600">
            <span>${esc(lastUpdatedText(item))}</span>
            <span class="${topT.count ? 'font-semibold text-indigo-700' : 'text-slate-500'}">${esc(topT.text)}</span>
          </div>
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 1vN 小班 · 在学课件（复用 1v1 课件与进度模型）
     * ------------------------------------------------------------------ */
    function classStageChip(stage) {
      const nums = { 1: '①', 2: '②', 3: '③', 4: '④' };
      if (state.role === 'parent') {
        return { text: stage >= 4 ? '随班归档只读留存 · 只读' : '正式开课小班 · 仅查看', cls: 'border-slate-200 bg-slate-100 text-slate-600', icon: 'lock' };
      }
      if (stage >= 4) {
        return { text: '阶段 ④ · 只读', cls: 'border-slate-200 bg-slate-100 text-slate-600', icon: 'lock' };
      }
      return { text: `阶段 ${nums[stage] || stage} · 已锁定（课件与进度可编）`, cls: 'border-emerald-200 bg-emerald-50 text-emerald-700', icon: 'lock-open' };
    }

    function renderClassCourseware() {
      const list = accessibleClasses();
      if (!list.length) {
        return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
          <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-slate-500 ring-1 ring-slate-200">${icon('users', 'h-6 w-6')}</div>
          <p class="mt-3 text-[14px] font-medium leading-relaxed text-slate-500">当前角色暂无可查看的小班课件。</p>
        </div>`;
      }
      const c = activeClass();
      if (!c) return '';
      const items = c.current || [];
      const editable = c.stage <= 3;
      const canCfg = classCanConfig(c);
      const online = state.online === 'on';
      const stage = classStageChip(c.stage);
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10" data-view="class" data-class-id="${esc(c.id)}" data-class-stage="${c.stage}">
        ${pageHeader('小班在学课件', `${c.name} · ${items.length}/6`, canCfg
          ? `<button data-action="open-class-config" ${online ? '' : 'disabled'} class="h-8 shrink-0 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-100 disabled:text-slate-500">配置课件</button>`
          : '')}

        <div class="rounded-2xl border border-slate-300 bg-slate-50/70 p-2">
          <div class="flex items-center gap-1 rounded-xl bg-slate-100 p-1">
            ${list.map((x) => `<button data-action="switch-class" data-id="${x.id}" class="min-w-0 flex-1 truncate rounded-lg px-2 py-2 text-[12px] font-bold transition ${x.id === c.id ? 'bg-white text-indigo-700' : 'text-slate-500'}">${esc(x.name)}</button>`).join('')}
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-1.5">
          <span class="inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-[12px] font-bold ${stage.cls}">${icon(stage.icon, 'h-3 w-3')}${stage.text}</span>
          <span class="rounded-full border border-slate-200 bg-white px-2 py-0.5 text-[12px] font-semibold text-slate-500">主理人 ${esc(c.owner)} · 主讲 ${esc(c.mainTeacher)}</span>
        </div>

        ${state.role === 'parent' ? `<div class="rounded-xl border border-slate-300 bg-slate-200/60 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-700">家长只读视图 · 物理隐藏 [配置课件] / [更新进度] 与全部编辑按钮；仅展示名称、级别、样图与 Process Note，绝不透出同班同学、人数与费用。</div>` : ''}
        ${!editable && state.role !== 'parent' ? `<div class="rounded-xl border border-slate-300 bg-slate-100 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">阶段 ④ · 只读：小班已归档，课件与进度全量封存，不可再增删或更新。</div>` : ''}

        ${!online && state.role !== 'parent' ? `<div class="rounded-lg border border-amber-200 bg-amber-50 px-2.5 py-2 text-[12px] font-medium text-amber-900">离线模式：可查看小班课件，配置与进度更新不可用。</div>` : ''}

        <div class="${grid}">
          ${items.length ? items.map((item, i) => classCoursewareCard(item, i, c, online)).join('') : `<div class="rounded-xl border border-dashed border-slate-300 bg-slate-50 px-3 py-6 text-center text-[12px] font-medium text-slate-500">该小班暂未配置在学课件</div>`}
        </div>

        ${state.role === 'parent' ? '' : classAuditDetails(c)}

        <div class="rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">${state.role === 'parent' ? '正式在读及随班归档只读留存的所属家长、曾执教老师、主理班长与管理员均可只读回看；家长端严禁编辑，内部操作日志对家长隐藏。' : '在读及随班归档只留存的正式学员家长、曾执教/代课老师、主理班长与管理员可只读回看；所有变更写入小班操作与修改日志，改课件对家长零通知。'}</div>
      </div>`;
    }

    function classCoursewareCard(item, idx, c, online) {
      const cw = findCw(item.cwId);
      if (!cw) return '';
      const lvl = findLevel(cw, item.levelId);
      const stale = isStale6Months(item);
      const topT = topTeacherInfo(item);
      const levelDisabled = !!(lvl && lvl.disabled);
      const canProg = classCanProgress(c) && online;
      return `<article class="rounded-xl border ${stale ? 'border-amber-300 bg-amber-50/40' : 'border-slate-200 bg-white'} p-3" data-class-cw="${esc(cw.id)}">
        <div class="flex items-start gap-2.5">
          <button data-action="preview-cw" data-id="${cw.id}" data-level="${esc(item.levelId || '')}" class="shrink-0" aria-label="预览样图">${coverHtml(cw, 'h-11 w-11', 'text-[14px]')}</button>
          <div class="min-w-0 flex-1">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="truncate text-[14px] font-bold text-slate-900">${esc(cw.nameCn)}</div>
                <div class="truncate text-[12px] font-medium text-slate-500">${esc(cw.nameEn)}</div>
              </div>
              ${canProg ? `<button data-action="open-class-progress" data-class="${c.id}" data-cw="${cw.id}" class="inline-flex h-7 shrink-0 items-center gap-1 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70">${icon('edit-3', 'h-3 w-3')}更新进度</button>` : ''}
            </div>
            <div class="mt-1.5 flex flex-wrap items-center gap-1.5">
              <span class="rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(lvl ? lvl.name : '标准/无分级')}</span>
              ${levelDisabled ? `<span class="rounded-md border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-500">级别已停用</span>` : ''}
              ${!cw.active ? `<span class="rounded-md border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-500">课件已停用</span>` : ''}
              ${stale ? `<span class="inline-flex items-center gap-1 rounded-md border border-amber-300 bg-amber-100 px-1.5 py-0.5 text-[12px] font-bold text-amber-900">${icon('clock', 'h-3 w-3')}近 6 个月没有更新</span>` : ''}
            </div>
          </div>
        </div>
        <div class="mt-2.5 rounded-xl border border-slate-200/80 bg-slate-50/70 px-2.5 py-2">
          <div class="flex min-w-0 items-center gap-1 text-[12px] font-semibold text-slate-600">学习进度：<span class="min-w-0 flex-1 truncate text-slate-900" data-progress-summary="true">${esc(progressSummary(item.progressText))}</span></div>
          ${state.role === 'parent' ? `<details class="group mt-1">
            <summary class="flex cursor-pointer list-none items-center gap-1 text-[12px] font-semibold text-indigo-600 [&::-webkit-details-marker]:hidden"><span class="group-open:hidden">展开 Process Note ▾</span><span class="hidden group-open:inline">收起 ▴</span></summary>
            <p class="mt-1 whitespace-pre-line rounded-lg bg-white px-2 py-1.5 text-[12px] font-medium leading-relaxed text-slate-800">${esc(item.progressText || '暂无进度记录')}</p>
          </details>` : ''}
          <div class="mt-1.5 flex flex-wrap items-center justify-between gap-x-3 gap-y-1 text-[12px] font-medium text-slate-600">
            <span>${esc(lastUpdatedText(item))}</span>
            <span class="${topT.count ? 'font-semibold text-indigo-700' : 'text-slate-500'}">${esc(topT.text)}</span>
          </div>
        </div>
      </article>`;
    }

    function classAuditDetails(c) {
      if (!c.audit || !c.audit.length) return '';
      return `<details class="rounded-xl border border-slate-200 bg-slate-50 p-3" data-audit-scope="class" data-readonly="true" data-internal-only="true">
        <summary class="flex cursor-pointer list-none items-center justify-between gap-2 [&::-webkit-details-marker]:hidden">
          <span class="min-w-0">
            <span class="block text-[14px] font-bold text-slate-800">小班课件操作日志</span>
            <span class="block text-[12px] font-medium text-slate-500">内部留痕 · 对家长端不可见</span>
          </span>
          <span class="shrink-0 text-[12px] font-medium text-slate-500">${c.audit.length} 条</span>
        </summary>
        <div class="mt-2 space-y-2">
          ${c.audit.slice(0, 6).map((a) => `<div class="flex items-start gap-2">
            <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-emerald-400"></span>
            <div class="min-w-0">
              <div class="text-[12px] font-medium text-slate-500">${esc(a.at)} · ${esc(a.by)}</div>
              <div class="text-[14px] font-medium leading-relaxed text-slate-800">${esc(a.text)}</div>
            </div>
          </div>`).join('')}
        </div>
      </details>`;
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'addPicker') return renderAddPicker();
      if (state.overlay.type === 'preview') return renderPreview();
      if (state.overlay.type === 'lightbox') return renderLightbox();
      if (state.overlay.type === 'editorLightbox') return renderEditorLightbox();
      if (state.overlay.type === 'deleteConfirm') return renderDeleteConfirm();
      if (state.overlay.type === 'progressDrawer') return renderProgressDrawer();
      if (state.overlay.type === 'removeConfigConfirm') return renderRemoveConfigConfirm();
      if (state.overlay.type === 'auditCwPicker') return renderAuditCwPicker();
      if (state.overlay.type === 'pickCwPicker') return renderPickCwPicker();
      if (state.overlay.type === 'classConfig') return renderClassConfig();
      if (state.overlay.type === 'classAddPicker') return renderClassAddPicker();
      if (state.overlay.type === 'privacyConflict') return renderPrivacyConflict();
      if (state.overlay.type === 'levelConfirm') return renderLevelConfirm();
      if (state.overlay.type === 'versionConflict') return renderVersionConflict();
      return '';
    }

    function renderOverlayOnly() {
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    function modalShell(content) {
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-3 top-1/2 mx-auto max-h-[88%] max-w-[560px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">${content}</div>
      </div>`;
    }

    function modalHeader(title, subtitle = '') {
      return `<div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
          ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
        </div>
        <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
      </div>`;
    }

    function bottomSheet(content) {
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 flex max-h-[88%] flex-col rounded-t-3xl bg-white shadow-2xl">
          <div class="mx-auto mt-2 h-1 w-10 shrink-0 rounded-full bg-slate-300"></div>
          ${content}
        </div>
      </div>`;
    }

    function pickerHeader(title, subtitle = '') {
      return `<div class="flex shrink-0 items-start justify-between gap-3 px-4 py-3">
        <div class="min-w-0">
          <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
          ${subtitle ? `<p class="mt-0.5 truncate text-[12px] font-medium text-slate-500">${esc(subtitle)}</p>` : ''}
        </div>
        <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
      </div>`;
    }

    function pickerRow(active, action, value, label, sub = '') {
      return `<button type="button" data-action="${action}" data-value="${esc(value)}" class="flex min-h-11 w-full items-center justify-between gap-2 rounded-xl px-3 py-2 text-left transition ${active ? 'bg-slate-100' : 'hover:bg-slate-50'}">
        <span class="min-w-0">
          <span class="block truncate text-[14px] font-medium ${active ? 'font-bold text-slate-900' : 'text-slate-700'}">${label}</span>
          ${sub ? `<span class="mt-0.5 block truncate text-[12px] font-medium text-slate-500">${sub}</span>` : ''}
        </span>
        ${active ? `<span class="shrink-0 text-slate-900">${icon('check', 'h-4 w-4')}</span>` : ''}
      </button>`;
    }

    function renderAuditCwPicker() {
      const q = (state.auditCwQuery || '').trim().toLowerCase();
      const list = state.courseware.filter((c) => !q || `${c.nameCn} ${c.nameEn}`.toLowerCase().includes(q));
      const total = state.coursewareAudit.length;
      return bottomSheet(`
        ${pickerHeader('筛选变更日志', '按课件查看只读变更记录')}
        <div class="shrink-0 px-4 pb-2">
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
            <input id="auditCwSearch" value="${esc(state.auditCwQuery)}" placeholder="搜索课件中文名 / 英文名" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 pl-9 pr-3 text-[16px] text-slate-900 outline-none placeholder:text-slate-500 transition focus:border-indigo-500 focus:bg-white">
          </div>
        </div>
        <div class="min-h-0 flex-1 space-y-1 overflow-y-auto px-2 pb-6">
          ${pickerRow(state.auditCwId === 'all', 'pick-audit-cw', 'all', `全部课件 · ${total} 条记录`)}
          ${list.map((c) => pickerRow(state.auditCwId === c.id, 'pick-audit-cw', c.id, esc(c.nameCn), esc(c.nameEn))).join('')}
          ${!list.length ? `<div class="rounded-xl border border-dashed border-slate-300 bg-slate-50 px-3 py-6 text-center text-[12px] font-medium text-slate-500">没有匹配的课件</div>` : ''}
        </div>
      `);
    }

    function renderClassConfig() {
      const c = findClass(state.overlay.classId);
      if (!c || !classCanConfig(c)) return '';
      ensureClassDraft(c);
      const draft = state.classDraft || [];
      const online = state.online === 'on';
      return modalShell(`
        ${modalHeader('配置小班课件', `${c.name} · 在学课件 (${draft.length}/6)`)}
        <div class="mt-3 space-y-2" data-class-config="true">
          ${draft.length ? draft.map((item, i) => {
            const cw = findCw(item.cwId);
            const lvl = cw ? findLevel(cw, item.levelId) : null;
            return `<div class="flex items-center gap-2.5 rounded-xl border border-slate-200 bg-slate-50/70 p-2.5">
              ${cw ? coverHtml(cw, 'h-10 w-10', 'text-[14px]') : ''}
              <div class="min-w-0 flex-1">
                <div class="truncate text-[14px] font-bold text-slate-900">${esc(cw ? cw.nameCn : '已删除课件')}</div>
                <div class="truncate text-[12px] font-medium text-slate-500">${esc(cw ? cw.nameEn : '')}</div>
                <span class="mt-1 inline-block rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(lvl ? lvl.name : '标准/无分级')}</span>
              </div>

    function openClassConfig(classId) {
      const c = findClass(classId);
      if (!c || !classCanConfig(c)) return showToast('仅小班主理人与平台管理员可配置小班课件');
      if (state.online === 'off') return showToast('离线模式下不可配置小班课件');
      ensureClassDraft(c);
      state.classPickQuery = '';
      state.overlay = { type: 'classConfig', classId: c.id };
      renderOverlayOnly();
    }

    function saveClassConfig() {
      if (state.online === 'off') return showToast('离线模式下不可保存小班课件');
      const c = findClass(state.overlay && state.overlay.classId);
      if (!c || !classCanConfig(c)) return showToast('仅小班主理人与平台管理员可配置小班课件');
      ensureClassDraft(c);
      const before = c.current || [];
      const after = clone(state.classDraft || []);
      const classConflict = after.some((item) => {
        const live = before.find((x) => x.cwId === item.cwId);
        return live && itemRev(live) !== itemRev(item);
      });
      if (classConflict) {
        state.overlay = { type: 'versionConflict', ctx: null, operator: '其他协作者' };
        return renderOverlayOnly();
      }
      const beforeIds = new Set(before.map((b) => b.cwId));
      const afterIds = new Set(after.map((a) => a.cwId));
      const added = after.filter((a) => !beforeIds.has(a.cwId));
      const removed = before.filter((b) => !afterIds.has(b.cwId));
      if (!added.length && !removed.length) {
        state.overlay = null;
        state.classDraft = null;
        state.classDraftId = null;
        renderAll();
        return showToast('小班课件未变更');
      }
      const parts = [];
      if (added.length) parts.push(`新增 ${added.map(itemLabel).join('、')}`);
      if (removed.length) parts.push(`移除 ${removed.map(itemLabel).join('、')}`);
      c.current = after;
      c.audit = c.audit || [];
      c.audit.unshift({ at: AUDIT_NOW, by: operatorLabel(), text: `配置课件：${parts.join('；')}` });
      state.classDraft = null;
      state.classDraftId = null;
      state.overlay = null;
      renderAll();
      showToast(`小班课件已保存，共 ${after.length} 门 · 家长只读视图同步刷新，零通知`);
    }

        ${isParent ? `<div class="mt-2 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-amber-900">移除后将同步通知负责授课的老师与班长（合并去重为 1 条站内提醒），确认移除吗？</div>` : ''}
        <div class="mt-3 flex gap-2">

        </div>
      `);
    }

    function renderProgressDrawer() {
      const isClass = state.overlay.target === 'class';
      const c = isClass ? findClass(state.overlay.classId) : null;
      const s = isClass ? null : activeStudent();
      const cw = findCw(state.overlay.cwId);
      if (!cw || (isClass && !c)) return '';
      const item = isClass
        ? (c.current || []).find((x) => x.cwId === cw.id)
        : ((state.overlay.source === 'config' && state.draft && state.draft[state.overlay.index])
          ? state.draft[state.overlay.index]
          : (s.current || []).find((x) => x.cwId === cw.id));
      if (!item) return '';
      const curLvl = findLevel(cw, item.levelId);
      const enabledOthers = cw.levels.filter((l) => !l.disabled && l.id !== item.levelId);
      const allLevelsDisabled = !!curLvl && curLvl.disabled && !enabledOthers.length;
      const levelOpts = curLvl ? [curLvl] : [{ id: '', name: '标准/无分级', disabled: false }];
      enabledOthers.forEach((l) => levelOpts.push(l));
      const selectedLevelId = state.overlay.levelId !== undefined ? state.overlay.levelId : (item.levelId || '');
      const selectedLvl = findLevel(cw, selectedLevelId);
      const stale = isStale6Months(item);
      const topT = topTeacherInfo(item);
      const lastUpd = lastUpdatedText(item);
      const currentVal = state.overlay.text !== undefined ? state.overlay.text : (item.progressText || '');
      const chips = ['Unit 3 · Page 24', 'Lesson 5', 'Review Unit 2'];
      const ctxLine = isClass ? `${c.name} · ${cw.nameCn} · ${cw.nameEn}` : `${s.nickname} · ${cw.nameCn} · ${cw.nameEn}`;
      const privacyOk = !!state.overlay.privacyOk;
      const notifyTargets = !isClass && state.role === 'parent' ? parentNotifyTargets(s) : [];

      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 flex max-h-[92%] flex-col rounded-t-3xl bg-white shadow-2xl" data-drawer-target="${isClass ? 'class' : 'student'}">
          <div class="mx-auto mt-2 h-1 w-10 shrink-0 rounded-full bg-slate-300"></div>
          <div class="flex shrink-0 items-start justify-between gap-3 px-4 py-3">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <h2 class="text-[16px] font-bold text-slate-900">更新学习进度</h2>
                <span class="rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(selectedLvl ? selectedLvl.name : '标准/无分级')}</span>
                ${selectedLvl && selectedLvl.disabled ? `<span class="rounded-md border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-500">已停用</span>` : ''}
              </div>
              <p class="mt-0.5 truncate text-[12px] font-medium text-slate-500">${esc(ctxLine)}</p>
            </div>
            <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>

          <div class="min-h-0 flex-1 space-y-3 overflow-y-auto px-4 pb-4">
            <div class="rounded-xl border ${stale ? 'border-amber-300 bg-amber-50/70' : 'border-slate-200 bg-slate-50/80'} px-3 py-2.5 text-[12px] font-medium text-slate-600">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <span>${esc(lastUpd)}</span>
                <span class="${topT.count ? 'font-semibold text-indigo-700' : 'text-slate-500'}">${esc(topT.text)}</span>
              </div>
              ${stale ? `<div class="mt-1.5 inline-flex items-center gap-1 rounded-md border border-amber-300 bg-amber-100 px-1.5 py-0.5 text-[12px] font-bold text-amber-900">${icon('clock', 'h-3 w-3')}近 6 个月没有更新</div>` : ''}
              <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">仅统计老师角色有效更新（空保存不计数）；全新绑定自最新绑定日起算，试课认领 / 换师承接沿用原最后老师更新时间。</p>
            </div>

            ${state.role === 'teacher' ? `<div class="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-amber-900">实时编辑权截止于次日 <span class="font-bold">02:00 (UTC+8)</span> 自动结课前；已实际授课且已结课的补录请前往「授课历史」课节卡片。</div>` : ''}

            <div>
              <div class="mb-1 flex items-center justify-between gap-2">
                <span class="text-[12px] font-bold text-slate-700">当前级别</span>
                <span class="text-[12px] font-medium text-slate-500">切换即记为升阶 / 调级${state.role === 'parent' ? ' · 提交前需二次确认' : ''}</span>
              </div>
              <div class="flex items-center gap-1.5 overflow-x-auto py-0.5 no-scrollbar" data-level-row="true">
                ${levelOpts.map((l) => `<button type="button" data-action="progress-level" data-level="${esc(l.id || '')}" ${allLevelsDisabled ? 'disabled' : ''} class="h-7 shrink-0 whitespace-nowrap rounded-full px-2.5 text-[12px] transition ${selectedLevelId === (l.id || '') ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'} disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-500">${esc(l.name)}${l.disabled ? ' · 已停用' : ''}</button>`).join('')}
              </div>
              ${allLevelsDisabled ? `<p class="mt-1 rounded-lg border border-slate-200 bg-slate-100 px-2.5 py-1.5 text-[12px] font-medium leading-relaxed text-slate-600">该课件所有级别均已停用或无任何启用级别：级别保留当前只读展示，暂停切换；<span class="font-bold">暂无可用新级别可切</span>，仍可正常更新 Process Note。</p>` : ''}
            </div>

            <div>
              <div class="mb-0.5 flex items-center justify-between gap-2">
                <label for="progressDrawerInput" class="text-[12px] font-bold text-slate-700">进度备注 <span class="font-medium text-slate-500">（选填）</span></label>
                <span id="progressDrawerCount" class="font-mono text-[12px] font-semibold text-slate-500">${currentVal.length}/2000</span>
              </div>
              <p class="mb-1 text-[12px] font-medium leading-relaxed text-slate-500">请尽量填写英文，便于老师看懂</p>
              <textarea id="progressDrawerInput" rows="7" maxlength="2000" placeholder="Unit 3 · Page 24&#10;Lesson 5" class="min-h-[132px] w-full resize-none rounded-xl border border-slate-200 bg-slate-50/70 p-3 text-[14px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white">${esc(currentVal)}</textarea>
              <div class="mt-1.5 flex items-center justify-between gap-2">
                <span class="text-[12px] font-medium text-slate-500">支持多行 · 上限 2000 字符</span>
                <button type="button" data-action="clear-progress-input" class="h-8 shrink-0 rounded-lg border border-slate-200 bg-white px-3 text-[12px] font-semibold text-slate-600 hover:bg-slate-50">清空</button>
              </div>
            </div>

            <div>
              <div class="mb-1.5 text-[12px] font-semibold text-slate-500">常用格式快捷追加</div>
              <div class="flex flex-wrap gap-1.5">
                ${chips.map((c) => `<button type="button" data-action="fill-progress-chip" data-value="${esc(c)}" class="rounded-full border border-indigo-200 bg-indigo-50/70 px-2.5 py-1 text-[12px] font-semibold text-indigo-700 transition hover:bg-indigo-100">${esc(c)}</button>`).join('')}
              </div>
              <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">内容为空时直接填入；已有内容时在末尾换行追加，不会覆盖已有记录。</p>
            </div>

            ${isClass ? `<div class="rounded-xl border border-amber-200 bg-amber-50/80 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-amber-950" data-privacy-gate="true">
              <div class="font-bold">小班 Process Note 隐私门禁</div>
              <div class="mt-1">保存前将扫描本小班当前及历史学员姓名 / 英文名 / 小名（中文 ≥2 字；英文 ≥2 字符按独立全词、忽略大小写）与手机号码、电子邮箱等联络特征。命中联络特征一律硬阻断；命中学员词面将高亮冲突词，可选择确认为正常教学用词后二次确认放行并留痕。</div>
              <div class="mt-1 text-amber-800">扫描范围严格限定已绑定学员集合；未绑定线下学员隐私由下方必勾确认兜底，不承诺穷举拦截非绑定姓名。</div>
              <label class="mt-2 flex items-start gap-2 rounded-lg border border-amber-300 bg-white/80 px-2.5 py-2 text-amber-950">
                <input type="checkbox" id="classPrivacyConfirm" class="mt-0.5 h-4 w-4 shrink-0 accent-indigo-600" ${privacyOk ? 'checked' : ''}>
                <span class="font-semibold leading-relaxed">我已确认：本进度备注对已绑定学员家长只读可见，未填写任何其他学员个人姓名、联系方式或隐私信息</span>
              </label>
            </div>` : ''}
            ${!isClass && state.role === 'parent' ? `<div class="rounded-xl border border-indigo-100 bg-indigo-50/70 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900">
              <div class="font-bold text-indigo-950">保存后提醒预览 · 合并去重</div>
              <div class="mt-1">${notifyTargets.map((t) => `${esc(t.role)} ${esc(t.name)}`).join(' ∪ ')} → <span class="font-bold">1 条站内中性卡</span> · 不发 Email</div>
              <div class="mt-0.5 text-indigo-700">同一账号兼任多项仅推 1 条；待上老师与待排资金持有人并集覆盖，避免漏通知。</div>
            </div>` : ''}
            ${isClass && state.role !== 'parent' ? `<p class="text-[12px] font-medium leading-relaxed text-slate-500">小班进度更新静默留痕，对家长零通知；家长仅可在孩子档案与小班抽屉只读回看最新进度。</p>` : ''}
            <p class="text-[12px] font-medium leading-relaxed text-slate-500">保存时执行乐观版本校验：若期间已被他人先行提交，将拒绝静默覆盖并提示刷新加载最新内容核对。</p>
          </div>

          <div class="flex shrink-0 gap-2 border-t border-slate-200/80 bg-white px-4 py-3">
            <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 hover:bg-slate-50">取消</button>
            <button data-action="save-progress-drawer" ${(state.online === 'on' && (!isClass || privacyOk)) ? '' : 'disabled'} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700 disabled:bg-slate-200 disabled:text-slate-500">保存进度</button>
          </div>
        </div>
      </div>`;
    }

    function drawerPayload(ctx) {
      return {
        target: ctx.isClass ? 'class' : 'student',
        classId: ctx.cls ? ctx.cls.id : undefined,
        cwId: ctx.cw.id,
        source: ctx.source,
        index: ctx.index,
        levelId: ctx.nextLevelId,
        text: ctx.nextVal,
        baseRev: ctx.o.baseRev,
        privacyOk: ctx.o.privacyOk,
        privacyOverride: ctx.o.privacyOverride,
        levelConfirmed: ctx.o.levelConfirmed
      };
    }

    function progressSaveContext() {
      const o = state.overlay;
      if (!o || o.type !== 'progressDrawer') return null;
      const isClass = o.target === 'class';
      const cw = findCw(o.cwId);
      if (!cw) return null;
      const input = $('progressDrawerInput');
      const nextVal = (input ? input.value : (o.text || '')).trim().slice(0, 2000);
      const cls = isClass ? findClass(o.classId) : null;
      if (isClass && (!cls || !classCanProgress(cls))) return null;
      const s = isClass ? null : activeStudent();
      const item = isClass
        ? (cls.current || []).find((x) => x.cwId === cw.id)
        : ((o.source === 'config' && state.draft)
          ? state.draft.find((x) => x.cwId === cw.id)
          : (s.current || []).find((x) => x.cwId === cw.id));
      if (!item) return null;
      const oldLevelId = item.levelId || '';
      const nextLevelId = o.levelId !== undefined ? o.levelId : oldLevelId;
      return {
        o, isClass, cw, cls, s, item, nextVal, oldLevelId, nextLevelId,
        levelChanged: oldLevelId !== nextLevelId,
        progressChanged: (item.progressText || '').trim() !== nextVal,
        source: o.source,
        index: o.index
      };
    }

    function submitProgressDrawer() {
      if (state.online === 'off') return showToast('离线模式下不可更新进度');
      const ctx = progressSaveContext();
      if (!ctx) return;
      if (!ctx.levelChanged && !ctx.progressChanged) {
        state.overlay = null;
        renderOverlayOnly();
        return showToast(ctx.isClass ? '小班课件未变更' : '学习进度未变更');
      }
      /* D7/L-2 乐观版本校验：先于隐私与二次确认执行 */
      const liveRef = ctx.isClass ? ctx.item : ((ctx.s.current || []).find((x) => x.cwId === ctx.cw.id) || ctx.item);
      if (ctx.o.baseRev && itemRev(liveRef) !== ctx.o.baseRev) {
        state.overlay = { type: 'versionConflict', ctx, operator: 'David（老师）' };
        return renderOverlayOnly();
      }
      if (ctx.isClass) {
        const scan = scanClassPrivacy(ctx.nextVal, ctx.cls);
        if (scan.contacts.length || (scan.names.length && !ctx.o.privacyOverride)) {
          state.overlay = {
            type: 'privacyConflict',
            payload: drawerPayload(ctx),
            names: scan.names,
            contacts: scan.contacts,
            savedText: ctx.nextVal
          };
          return renderOverlayOnly();
        }
      }
      if (!ctx.isClass && state.role === 'parent' && ctx.levelChanged && !ctx.o.levelConfirmed) {
        state.overlay = { type: 'levelConfirm', payload: drawerPayload(ctx), ctx, cw: ctx.cw };
        return renderOverlayOnly();
      }
      return commitProgressSave();
    }

    function commitProgressSave(opts = {}) {
      const ctx = progressSaveContext();
      if (!ctx) return;
      if (state.online === 'off') return showToast('离线模式下不可更新进度');
      /* 二次确认后的提交仍需再次版本校验，避免期间又被他人覆盖 */
      const liveRef = ctx.isClass ? ctx.item : ((ctx.s.current || []).find((x) => x.cwId === ctx.cw.id) || ctx.item);
      if (ctx.o.baseRev && itemRev(liveRef) !== ctx.o.baseRev) {
        state.overlay = { type: 'versionConflict', ctx, operator: 'David（老师）' };
        return renderOverlayOnly();
      }
      if (ctx.isClass && !ctx.o.privacyOk) return showToast('请先勾选隐私确认后方可保存');
      const applyMeta = (target, nextLevelId) => {
        if (!target) return;
        target.levelId = nextLevelId;
        target.progressText = ctx.nextVal;
        target.lastUpdatedAt = AUDIT_NOW;
        target.lastUpdatedBy = operatorName();
        target.lastUpdatedRole = state.role;
        target.teacherUpdateCounts = target.teacherUpdateCounts || {};
        if (state.role === 'teacher') {
          const tName = operatorName();
          target.teacherUpdateCounts[tName] = (target.teacherUpdateCounts[tName] || 0) + 1;
          target.teacherUpdateLog = target.teacherUpdateLog || {};
          target.teacherUpdateLog[tName] = AUDIT_NOW;
        }
        bumpItemRev(target);
      };
      const auditText = () => {
        const parts = [];
        if (ctx.levelChanged) parts.push(`升阶/调级：${ctx.cw.nameCn} ${levelLabel(ctx.cw, ctx.oldLevelId)} → ${levelLabel(ctx.cw, ctx.nextLevelId)}`);
        if (ctx.progressChanged) parts.push(`更新进度：${ctx.cw.nameCn} → ${ctx.nextVal || '清空进度'}`);
        const base = parts.join('；');
        return opts.privacyOverride || ctx.o.privacyOverride ? `${base}（敏感词二次确认放行）` : base;
      };

      if (ctx.isClass) {
        applyMeta(ctx.item, ctx.nextLevelId);
        ctx.cls.audit = ctx.cls.audit || [];
        ctx.cls.audit.unshift({ at: AUDIT_NOW, by: operatorLabel(), text: auditText() });
        state.overlay = null;
        renderAll();
        return showToast('小班进度已保存 · 家长只读视图同步刷新，零通知');
      }

      const s = ctx.s;
      const liveItem = (s.current || []).find((x) => x.cwId === ctx.cw.id);
      const draftItem = (state.draftStudentId === s.id && state.draft) ? state.draft.find((x) => x.cwId === ctx.cw.id) : null;
      applyMeta(liveItem, ctx.nextLevelId);
      applyMeta(draftItem, ctx.nextLevelId);
      s.audit = s.audit || [];
      s.audit.unshift({ at: AUDIT_NOW, by: operatorLabel(), text: auditText() });
      state.overlay = null;
      renderOverlayOnly();
      renderContentOnly();
      if (state.role === 'parent') {
        const targets = parentNotifyTargets(s).map((t) => t.name).join('、');
        showToast(`已保存 · 合并去重为 1 条站内中性卡（不发 Email）：${targets}`);
      } else {
        showToast('学习进度已保存并同步');
      }
    }

    function renderPrivacyConflict() {
      const o = state.overlay;
      const hard = o.contacts && o.contacts.length;
      return modalShell(`
        ${modalHeader('Process Note 隐私扫描拦截', '小班进度备注 · 已绑定学员隐私保护')}
        ${hard ? `<div class="mt-3 rounded-xl border border-rose-300 bg-rose-50 px-3 py-2.5 text-[14px] font-bold leading-relaxed text-rose-900">检测到个人联络特征：${o.contacts.map((x) => `<span class="rounded bg-rose-200 px-1.5 py-0.5">${esc(x)}</span>`).join('、')}。此类内容一律硬阻断，禁止提交。</div>
          <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-600">请删除手机号码 / 电子邮箱后重新保存；不得以任何二次确认方式放行。</p>` : `<div class="mt-3 rounded-xl border border-amber-300 bg-amber-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-amber-950">
            <div class="text-[14px] font-bold">命中本小班当前 / 历史已绑定学员词面</div>
            <div class="mt-1.5 flex flex-wrap gap-1.5">${o.names.map((n) => `<span class="rounded-md border border-amber-400 bg-amber-200 px-1.5 py-0.5 text-[12px] font-bold text-amber-950">${esc(n)}</span>`).join('')}</div>
            <p class="mt-2">默认阻断保存。请优先改写脱敏；若确认确属正常英文教学用词或教材书名（如月份 May / 书名 Alice），可二次确认放行并记入「敏感词二次确认放行」审计标记。</p>
          </div>`}
        <div class="mt-3 flex gap-2">
          <button data-action="privacy-conflict-back" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 hover:bg-slate-50">返回修改</button>
          ${hard ? '' : `<button data-action="privacy-conflict-confirm" class="h-11 flex-[1.6] rounded-xl bg-amber-600 px-2 text-[13px] font-semibold text-white hover:bg-amber-700">确认为正常教学用词 · 仍要保存</button>`}
        </div>
      `);
    }

    function renderLevelConfirm() {
      const o = state.overlay;
      const cw = o.cw;
      const oldLvl = findLevel(cw, o.ctx.oldLevelId);
      const newLvl = findLevel(cw, o.ctx.nextLevelId);
      return modalShell(`
        ${modalHeader('确认修改课件级别', `${activeStudent().nickname} · ${cw.nameCn}`)}
        <div class="mt-3 rounded-xl border border-indigo-200 bg-indigo-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-indigo-950">修改级别将同步通知授课老师按新级别备课，确认将《${esc(cw.nameCn)}》调整为《${esc(newLvl ? newLvl.name : '标准/无分级')}》吗？</div>
        <div class="mt-2 flex items-center gap-2 text-[12px] font-semibold text-slate-600">
          <span class="rounded-md border border-slate-200 bg-slate-100 px-1.5 py-0.5">${esc(oldLvl ? oldLvl.name : '标准/无分级')}</span>
          <span>→</span>
          <span class="rounded-md border border-indigo-200 bg-indigo-100 px-1.5 py-0.5 text-indigo-800">${esc(newLvl ? newLvl.name : '标准/无分级')}</span>
        </div>
        <div class="mt-3 flex gap-2">
          <button data-action="level-confirm-cancel" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 hover:bg-slate-50">取消</button>
          <button data-action="level-confirm-save" class="h-11 flex-1 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700">确认调整并保存</button>
        </div>
      `);
    }

    function renderVersionConflict() {
      const o = state.overlay;
      return modalShell(`
        ${modalHeader('配置版本冲突', '乐观版本校验 · 拒绝静默覆盖')}
        <div class="mt-3 rounded-xl border border-amber-300 bg-amber-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-amber-950">配置 / 进度刚刚已被 ${esc(o.operator || '其他用户')} 更新，请刷新加载最新内容核对后再保存。</div>
        <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-600">你的本次修改尚未写入，不会被静默覆盖。刷新后请重新核对级别与 Process Note 内容。</p>
        <div class="mt-3 flex gap-2">
          <button data-action="version-conflict-cancel" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 hover:bg-slate-50">取消</button>
          <button data-action="version-conflict-refresh" class="h-11 flex-1 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white hover:bg-indigo-700">刷新最新内容</button>
        </div>
      `);
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'open-config') {
        state.page = 'student';
        state.navTab = state.role === 'parent' ? 'me' : state.role === 'teacher' ? 'students' : 'schedule';
        state.draft = null;
        state.draftStudentId = null;
        state.overlay = null;
        return renderAll();
      }
      if (action === 'back-config') {
        if (state.role === 'parent') return setView('child');
        if (state.role === 'teacher') return setView('prep');
        return setView('student');
      }
      if (action === 'open-audit') return openAudit(el.dataset.cw || 'all');
      if (action === 'toggle-audit-all') { state.auditShowAll = !state.auditShowAll; return renderContentOnly(); }
      if (action === 'open-audit-cw') {
        state.auditCwQuery = '';
        state.overlay = { type: 'auditCwPicker' };
        return renderOverlayOnly();
      }
      if (action === 'pick-audit-cw') {
        state.auditCwId = el.dataset.value || 'all';
        state.auditShowAll = false;
        state.overlay = null;
        renderOverlayOnly();
        return renderContentOnly();
      }
      if (action === 'set-lib-status') {
        state.libStatus = el.dataset.value || 'all';
        return renderContentOnly();
      }
      if (action === 'switch-class') {
        const id = el.dataset.id;
        if (!accessibleClasses().some((c) => c.id === id)) return;
        state.activeClassId = id;
        state.classDraft = null;
        state.classDraftId = null;
        return renderAll();
      }
      if (action === 'open-class-config') {
        const c = activeClass();
        if (!c) return;
        return openClassConfig(c.id);
      }
      if (action === 'class-config-add') {
        if (state.online === 'off') return showToast('离线模式下不可配置小班课件');
        if (!state.classDraft || state.classDraft.length >= 6) return showToast('每个小班最多支持配置 6 门在学课件');
        state.classPickQuery = '';
        state.overlay = { type: 'classAddPicker', classId: (state.overlay && state.overlay.classId) || state.classDraftId };
        return renderOverlayOnly();
      }
      if (action === 'class-pick-cw') {
        if (state.online === 'off') return showToast('离线模式下不可配置小班课件');
        const cw = findCw(el.dataset.value);
        if (!cw || !state.classDraft) return;
        if (state.classDraft.length >= 6) return showToast('每个小班最多支持配置 6 门在学课件');
        if (state.classDraft.some((d) => d.cwId === cw.id)) return showToast('该课件已在小班在学列表中');
        const firstEnabled = cw.levels.find((l) => !l.disabled);
        state.classDraft.push({
          cwId: cw.id,
          levelId: firstEnabled ? firstEnabled.id : '',
          progressText: '',
          lastUpdatedAt: '',
          lastUpdatedBy: '',
          lastUpdatedRole: '',
          boundAt: TODAY,
          teacherUpdateCounts: {},
          teacherUpdateLog: {}
        });
        state.overlay = { type: 'classConfig', classId: state.classDraftId };
        return renderOverlayOnly();
      }
      if (action === 'class-config-remove') {
        if (state.online === 'off') return showToast('离线模式下不可配置小班课件');
        const i = Number(el.dataset.index);
        if (state.classDraft && state.classDraft[i]) state.classDraft.splice(i, 1);
        return renderOverlayOnly();
      }
      if (action === 'class-config-save') return saveClassConfig();
      if (action === 'open-class-progress') {
        if (state.online === 'off') return showToast('离线模式下不可更新进度');
        const c = findClass(el.dataset.class);
        if (!c || !classCanProgress(c)) return showToast('当前角色或阶段不可更新小班进度');
        const cwId = el.dataset.cw;
        const item = (c.current || []).find((x) => x.cwId === cwId);
        if (!item) return;
        state.overlay = { type: 'progressDrawer', target: 'class', classId: c.id, cwId, levelId: item.levelId || '', text: item.progressText || '', baseRev: itemRev(item), privacyOk: false };
        renderOverlayOnly();
        return;
      }
      if (action === 'open-pick-cw') {
        state.pickCwQuery = '';
        state.overlay = { type: 'pickCwPicker', returnTo: 'addPicker' };
        return renderOverlayOnly();
      }
      if (action === 'choose-pick-cw') {
        state.pickCw = el.dataset.value || '';
        state.pickLevel = '';
        state.overlay = { type: 'addPicker' };
        return renderOverlayOnly();
      }
      if (action === 'set-pick-level') {
        state.pickLevel = el.dataset.value || '';
        return renderOverlayOnly();
      }
      if (action === 'cancel-audit') {
        state.page = 'library';
        state.navTab = 'settings';
        state.auditCwId = 'all';
        state.auditShowAll = false;
        return renderAll();
      }
      if (action === 'switch-student') return setStudent(el.dataset.id);
      if (action === 'create-courseware') return openEditor('create');
      if (action === 'edit-cw') return openEditor('edit', el.dataset.id);
      if (action === 'toggle-cw') {
        if (state.online === 'off') return showToast('离线模式下不可启停课件');
        const cw = findCw(el.dataset.id);
        if (!cw) return;
        const beforeActive = cw.active;
        cw.active = !cw.active;
        if (cw.active) cw.pendingReview = false;
        pushAudit([{
          cwId: cw.id, cwNameCn: cw.nameCn, cwNameEn: cw.nameEn, action: 'TOGGLE_ACTIVE',
          summary: `${beforeActive ? '启用' : '停用'} → ${cw.active ? '启用' : '停用'}${cw.active ? ' · 已开放至在学课件备选池' : ' · 已绑定档案只读保留'}`,
          diff: [{ field: '启用状态', before: beforeActive ? '启用' : '停用', after: cw.active ? '启用' : '停用' }]
        }]);
        renderContentOnly();
        showToast(cw.active ? '课件已启用 · 已开放至在学课件备选池' : '课件已停用 · 已绑定档案继续展示【已停用】');
        return;
      }
      if (action === 'preview-cw') {
        state.overlay = { type: 'preview', cwId: el.dataset.id, levelId: el.dataset.level || '' };
        return renderOverlayOnly();
      }
      if (action === 'open-lightbox') {
        state.overlay = { type: 'lightbox', cwId: state.overlay.cwId, levelId: el.dataset.level || state.overlay.levelId, boundLevelId: state.overlay.levelId, index: Number(el.dataset.index) || 0 };
        return renderOverlayOnly();
      }
      if (action === 'lightbox-prev' || action === 'lightbox-next') {
        if (!state.overlay || state.overlay.type !== 'lightbox') return;
        const cw = findCw(state.overlay.cwId);
        const lvl = cw ? findLevel(cw, state.overlay.levelId) : null;
        const total = lvl ? lvl.images.length : 0;
        if (!total) return;
        state.overlay.index = (state.overlay.index + (action === 'lightbox-next' ? 1 : -1) + total) % total;
        return renderOverlayOnly();
      }
      if (action === 'editor-preview-img') {
        state.overlay = { type: 'editorLightbox', levelIndex: Number(el.dataset.index), index: Number(el.dataset.imgIndex) || 0 };
        return renderOverlayOnly();
      }
      if (action === 'editor-lightbox-prev' || action === 'editor-lightbox-next') {
        if (!state.overlay || state.overlay.type !== 'editorLightbox') return;
        const lvl = state.form.levels[state.overlay.levelIndex];
        const total = lvl ? lvl.images.length : 0;
        if (!total) return;
        state.overlay.index = (state.overlay.index + (action === 'editor-lightbox-next' ? 1 : -1) + total) % total;
        return renderOverlayOnly();
      }
      if (action === 'close-editor-lightbox') {
        state.overlay = null;
        return renderOverlayOnly();
      }
      if (action === 'close-lightbox') {
        if (state.overlay && state.overlay.cwId) {
          state.overlay = { type: 'preview', cwId: state.overlay.cwId, levelId: state.overlay.boundLevelId ?? state.overlay.levelId };
        } else {
          state.overlay = null;
        }
        return renderOverlayOnly();
      }
      if (action === 'close-overlay') {
        if (state.overlay && state.overlay.type === 'classAddPicker') {
          state.overlay = { type: 'classConfig', classId: state.overlay.classId };
          return renderOverlayOnly();
        }
        if (state.overlay && state.overlay.type === 'classConfig') {
          state.classDraft = null;
          state.classDraftId = null;
        }
        const back = state.overlay && state.overlay.returnTo;
        state.overlay = back ? { type: back } : null;
        return renderOverlayOnly();
      }
      if (action === 'toggle-form-active') {
        if (state.form.mode !== 'edit') {
          showToast('新建课件默认处于停用状态；请先保存，再到列表或详情中手动开启启用');
          return;
        }
        state.form.active = !state.form.active;
        renderEditorOnly();
        return;
      }
      if (action === 'add-level') {
        if (state.form.levels.length >= 30) return showToast('单个课件最多支持 30 个分级级别');
        state.form.levels.push({ id: newLevelId(), name: '', images: [], boundCount: 0, disabled: false });
        clearFormError();
        renderEditorOnly();
        setTimeout(() => $('formLevels')?.scrollIntoView({ block: 'nearest' }), 30);
        return;
      }
      if (action === 'toggle-level') {
        if (state.online === 'off') return showToast('离线模式下不可停用或启用级别');
        const lvl = state.form.levels[Number(el.dataset.index)];
        if (!lvl) return;
        lvl.disabled = !lvl.disabled;
        renderEditorOnly();
        return;
      }
      if (action === 'remove-level') {
        if (state.online === 'off') return showToast('离线模式下不可删除级别');
        const i = Number(el.dataset.index);
        const lvl = state.form.levels[i];
        if (!lvl) return;
        if ((lvl.boundCount || 0) > 0) return showToast('该级别已被绑定，仅可停用，不可删除');
        state.form.levels.splice(i, 1);
        clearFormError();
        renderEditorOnly();
        return;
      }
      if (action === 'move-level') {
        const i = Number(el.dataset.index);
        const delta = Number(el.dataset.delta);
        const j = i + delta;
        if (j < 0 || j >= state.form.levels.length) return;
        const [moving] = state.form.levels.splice(i, 1);
        state.form.levels.splice(j, 0, moving);
        renderEditorOnly();
        return;
      }
      if (action === 'demo-level-img') {
        const i = Number(el.dataset.index);
        const lvl = state.form.levels[i];
        if (!lvl || lvl.images.length >= 9) return showToast('每个级别最多 9 张样图');
        lvl.images.push(demoImage(`${lvl.name || 'Level'} · 样图 ${lvl.images.length + 1}`, 'Sample Page', '#6366f1', '#0ea5e9'));
        clearFormError();
        renderEditorOnly();
        return;
      }
      if (action === 'remove-level-img') {
        const lvl = state.form.levels[Number(el.dataset.index)];
        if (!lvl) return;
        lvl.images.splice(Number(el.dataset.imgIndex), 1);
        renderEditorOnly();
        return;
      }
      if (action === 'move-level-img') {
        const lvl = state.form.levels[Number(el.dataset.index)];
        if (!lvl) return;
        const i = Number(el.dataset.imgIndex);
        const j = i + Number(el.dataset.delta);
        if (j < 0 || j >= lvl.images.length) return;
        const [moving] = lvl.images.splice(i, 1);
        lvl.images.splice(j, 0, moving);
        renderEditorOnly();
        return;
      }
      if (action === 'demo-cover') {
        state.form.cover = demoImage(state.form.nameEn || 'New Courseware', 'Courseware Cover', '#4f46e5', '#0ea5e9');
        clearFormError();
        renderEditorOnly();
        return;
      }
      if (action === 'delete-cw') {
        if (state.online === 'off') return showToast('离线模式下不可删除课件');
        state.overlay = { type: 'deleteConfirm', cwId: state.form.id };
        return renderOverlayOnly();
      }
      if (action === 'confirm-delete-cw') {
        if (state.online === 'off') return showToast('离线模式下不可删除课件');
        const cw = findCw(state.overlay.cwId);
        if (!cw || cw.boundCount > 0) return showToast('该课件已被学员绑定，仅可停用');
        state.courseware = state.courseware.filter((c) => c.id !== cw.id);
        state.overlay = null;
        state.page = 'library';
        state.navTab = 'settings';
        renderAll();
        showToast('课件已删除');
        return;
      }
      if (action === 'save-cw') return saveCourseware();
      if (action === 'cancel-editor') {
        state.page = 'library';
        state.navTab = 'settings';
        state.overlay = null;
        state.form = emptyForm();
        return renderAll();
      }
      if (action === 'config-add') return openAddPicker();
      if (action === 'config-remove') {
        if (state.online === 'off') return showToast('离线模式下不可调整在学课件');
        state.overlay = { type: 'removeConfigConfirm', index: Number(el.dataset.index) };
        return renderOverlayOnly();
      }
      if (action === 'confirm-config-remove') {
        if (state.online === 'off') return showToast('离线模式下不可调整在学课件');
        ensureDraft();
        const idx = state.overlay ? Number(state.overlay.index) : -1;
        if (idx >= 0 && idx < state.draft.length) state.draft.splice(idx, 1);
        state.overlay = null;
        renderOverlayOnly();
        renderContentOnly();
        showToast('已从待保存列表移除，点击「保存生效」后同步');
        return;
      }
      if (action === 'save-config') return saveConfig();
      if (action === 'pick-add') return addPick();
      if (action === 'open-progress-drawer') {
        if (state.online === 'off') return showToast('离线模式下不可更新进度');
        const s = activeStudent();
        if (state.role === 'parent' && s.status !== 'ACTIVE') return showToast('家长仅可维护本人名下「正式在读」学员');
        const source = el.dataset.source || 'live';
        const cwId = el.dataset.cw;
        const index = el.dataset.index !== undefined ? Number(el.dataset.index) : -1;
        const item = (source === 'config' && state.draft && state.draft[index])
          ? state.draft[index]
          : (s.current || []).find((x) => x.cwId === cwId);
        if (!item) return;
        state.overlay = {
          type: 'progressDrawer', cwId, source, index,
          levelId: item.levelId || '', text: item.progressText || '',
          baseRev: itemRev(item), privacyOk: false
        };
        renderOverlayOnly();
        const input = $('progressDrawerInput');
        if (input) input.focus();
        return;
      }
      if (action === 'clear-progress-input') {
        if (!state.overlay || state.overlay.type !== 'progressDrawer') return;
        state.overlay.text = '';
        const input = $('progressDrawerInput');
        if (input) { input.value = ''; input.focus(); }
        const cnt = $('progressDrawerCount');
        if (cnt) cnt.textContent = '0/2000';
        return;
      }
      if (action === 'fill-progress-chip') {
        if (!state.overlay || state.overlay.type !== 'progressDrawer') return;
        const chip = (el.dataset.value || '').slice(0, 2000);
        const input = $('progressDrawerInput');
        const current = input ? input.value : (state.overlay.text || '');
        /* 空值直接填入；已有内容则换行追加，绝不覆盖已有记录 */
        const next = (current ? `${current}\n${chip}` : chip).slice(0, 2000);
        state.overlay.text = next;
        if (input) {
          input.value = next;
          input.focus();
          input.setSelectionRange(next.length, next.length);
        }
        const cnt = $('progressDrawerCount');
        if (cnt) cnt.textContent = `${next.length}/2000`;
        return;
      }
      if (action === 'progress-level') {
        if (!state.overlay || state.overlay.type !== 'progressDrawer') return;
        const input = $('progressDrawerInput');
        if (input) state.overlay.text = input.value;
        state.overlay.levelId = el.dataset.level || '';
        renderOverlayOnly();
        return;
      }
      if (action === 'save-progress-drawer') return submitProgressDrawer();
      if (action === 'privacy-conflict-back') {
        const saved = state.overlay && state.overlay.savedText;
        const payload = state.overlay && state.overlay.payload;
        state.overlay = payload ? { type: 'progressDrawer', ...payload, text: saved } : null;
        return renderOverlayOnly();
      }
      if (action === 'privacy-conflict-confirm') {
        const payload = state.overlay && state.overlay.payload;
        if (!payload) return;
        state.overlay = { type: 'progressDrawer', ...payload };
        return commitProgressSave({ privacyOverride: true });
      }
      if (action === 'level-confirm-cancel') {
        const payload = state.overlay && state.overlay.payload;
        state.overlay = payload ? { type: 'progressDrawer', ...payload } : null;
        return renderOverlayOnly();
      }
      if (action === 'level-confirm-save') {
        const payload = state.overlay && state.overlay.payload;
        if (!payload) return;
        state.overlay = { type: 'progressDrawer', ...payload };
        return commitProgressSave({ levelConfirmed: true });
      }
      if (action === 'version-conflict-refresh') {
        const ctx = state.overlay && state.overlay.ctx;
        if (!ctx) {
          /* 配置页 / 小班配置并发冲突：丢弃本地草稿并刷新最新内容 */
          state.overlay = null;
          state.draft = null;
          state.draftStudentId = null;
          state.classDraft = null;
          state.classDraftId = null;
          renderAll();
          return showToast('已刷新最新内容，请重新核对后再保存');
        }
        state.overlay = {
          type: 'progressDrawer', target: ctx.isClass ? 'class' : 'student',
          classId: ctx.classId, cwId: ctx.cw.id, source: ctx.source, index: ctx.index,
          levelId: ctx.item.levelId || '', text: ctx.item.progressText || '',
          baseRev: itemRev(ctx.item)
        };
        return renderOverlayOnly();
      }
      if (action === 'version-conflict-cancel') {
        state.overlay = null;
        return renderOverlayOnly();
      }
    });

    function clearFormError() {
      state.form.error = '';
      state.form.showErrors = false;
      const el = $('formError');
      if (el) el.remove();
    }

    function renderContentOnly() {
      $('content').innerHTML = renderContent();
      if (window.lucide) lucide.createIcons();
    }

    function renderContentKeepScroll() {
      const el = $('content');
      const top = el.scrollTop;
      el.innerHTML = renderContent();
      el.scrollTop = top;
      if (window.lucide) lucide.createIcons();
    }

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'fNameCn') { state.form.nameCn = e.target.value; clearFormError(); }
      if (id === 'fNameEn') { state.form.nameEn = e.target.value; clearFormError(); }
      if (id === 'fDescCn') { state.form.descCn = e.target.value; clearFormError(); }
      if (id === 'fDescEn') { state.form.descEn = e.target.value; clearFormError(); }
      if (id && id.startsWith('fLevelName-')) {
        const i = Number(id.split('-')[1]);
        if (state.form.levels[i]) state.form.levels[i].name = e.target.value;
        clearFormError();
      }
      if (id === 'libSearch') {
        state.libQuery = e.target.value;
        const val = e.target.value;
        renderContentOnly();
        const input = $('libSearch');
        if (input) { input.focus(); input.setSelectionRange(val.length, val.length); }
      }
      if (id === 'auditCwSearch') {
        state.auditCwQuery = e.target.value;
        const val = e.target.value;
        renderOverlayOnly();
        const input = $('auditCwSearch');
        if (input) { input.focus(); input.setSelectionRange(val.length, val.length); }
      }
      if (id === 'pickCwSearch') {
        state.pickCwQuery = e.target.value;
        const val = e.target.value;
        renderOverlayOnly();
        const input = $('pickCwSearch');
        if (input) { input.focus(); input.setSelectionRange(val.length, val.length); }
      }
      if (id === 'progressDrawerInput') {
        const val = e.target.value.slice(0, 2000);
        if (state.overlay && state.overlay.type === 'progressDrawer') state.overlay.text = val;
        const cnt = $('progressDrawerCount');
        if (cnt) cnt.textContent = `${val.length}/2000`;
      }
      if (id === 'classCwSearch') {
        state.classPickQuery = e.target.value;
        const val = e.target.value;
        renderOverlayOnly();
        const input = $('classCwSearch');
        if (input) { input.focus(); input.setSelectionRange(val.length, val.length); }
      }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'fCoverInput') return handleCoverFile(e.target.files && e.target.files[0]);
      if (id === 'classPrivacyConfirm') {
        if (state.overlay && state.overlay.type === 'progressDrawer') {
          state.overlay.privacyOk = !!e.target.checked;
          renderOverlayOnly();
        }
        return;
      }
      if (id && id.startsWith('fLevelImg-')) return handleLevelImages(Number(id.split('-')[1]), e.target.files);
    });

    /* ------------------------------------------------------------------
     * 图片压缩
     * ------------------------------------------------------------------ */
    function compressImageFile(file, maxSide = 1600) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
            const w = Math.max(1, Math.round(img.naturalWidth * scale));
            const h = Math.max(1, Math.round(img.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            try { resolve(canvas.toDataURL('image/webp', 0.85)); }
            catch (err) { resolve(evt.target.result); }
          };
          img.onerror = reject;
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleCoverFile(file) {
      if (!file) return;
      if (state.online === 'off') return showToast('离线模式下不可上传');
      if (!file.type || !file.type.startsWith('image/')) return showToast('请选择图片文件');
      try {
        state.form.cover = await compressImageFile(file, 1200);
        clearFormError();
        renderEditorOnly();
        showToast('封面已压缩为 WebP');
      } catch (e) {
        showToast('无法读取封面图片');
      }
    }

    async function handleLevelImages(index, files) {
      if (state.online === 'off') return showToast('离线模式下不可上传');
      const lvl = state.form.levels[index];
      if (!lvl) return;
      const list = Array.from(files || []).filter((f) => f.type && f.type.startsWith('image/'));
      if (!list.length) return showToast('请选择图片文件');
      const remaining = 9 - lvl.images.length;
      if (remaining <= 0) return showToast('每个级别最多 9 张样图，无法继续添加');
      const accepted = list.slice(0, remaining);
      if (list.length > remaining) showToast(`每个级别最多 9 张样图，仅保留前 ${remaining} 张`);
      for (const file of accepted) {
        try {
          lvl.images.push(await compressImageFile(file, 1600));
        } catch (e) {
          showToast(`无法读取图片：${file.name}`);
        }
      }
      clearFormError();
      renderEditorOnly();
      showToast(`已添加 ${accepted.length} 张样图`);
    }

    /* ------------------------------------------------------------------
     * 键盘 / 导航 / 提示
     * ------------------------------------------------------------------ */
    document.addEventListener('keydown', (e) => {
      if (!state.overlay || (state.overlay.type !== 'lightbox' && state.overlay.type !== 'editorLightbox')) return;
      const isEditor = state.overlay.type === 'editorLightbox';
      let total = 0;
      if (isEditor) {
        const lvl = state.form.levels[state.overlay.levelIndex];
        total = lvl ? lvl.images.length : 0;
      } else {
        const cw = findCw(state.overlay.cwId);
        const lvl = cw ? findLevel(cw, state.overlay.levelId) : null;
        total = lvl ? lvl.images.length : 0;
      }
      if (e.key === 'Escape') {
        state.overlay = isEditor ? null : { type: 'preview', cwId: state.overlay.cwId, levelId: state.overlay.boundLevelId ?? state.overlay.levelId };
        renderOverlayOnly();
      } else if (total > 1 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        e.preventDefault();
        state.overlay.index = (state.overlay.index + (e.key === 'ArrowRight' ? 1 : -1) + total) % total;
        renderOverlayOnly();
      }
    });

    function navTo(tab) {
      if (state.role === 'admin' && tab === 'settings') return setView('library');
      if (state.role === 'monitor' && tab === 'ops') return setView('student');
      if (state.role === 'parent' && tab === 'me') return setView('child');
      if (state.role === 'teacher' && tab === 'schedule') return setView('prep');
      state.page = 'placeholder';
      state.navTab = tab;
      state.overlay = null;
      renderAll();
    }

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

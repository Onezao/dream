    function isoToTs(iso) { return Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10))); }
    function isoAdd(iso, days) { return new Date(isoToTs(iso) + days * 86400000).toISOString().slice(0, 10); }
    function diffDays(a, b) { return Math.round((isoToTs(a) - isoToTs(b)) / 86400000); }
    function newId(prefix) {
      const n = 12 - prefix.length - 1;
      return `${prefix}_${Math.random().toString(36).slice(2, 2 + n).padEnd(n, '0')}`;
    }
    function dateLabel(iso) { return iso.slice(5); }
    function weekdayLabel(iso) { return DAY_LABELS[(new Date(isoToTs(iso)).getUTCDay() + 6) % 7]; }
    function inBookingWindow(iso) { const d = diffDays(iso, TODAY); return d >= 1 && d <= 7; }
    function endTime(time, count) {
      const [h, m] = time.split(':').map(Number);
      const total = h * 60 + m + count * 30;
      return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
    }
    function nextSlot(time) {
      const idx = TIME_SLOTS.indexOf(time);
      return idx >= 0 && idx + 1 < TIME_SLOTS.length ? TIME_SLOTS[idx + 1] : null;
    }

    /* ------------------------------------------------------------------

    function buildWeek(teacherId, offset) {
      const monday = isoAdd(BASE_MONDAY, offset * 7);

        const iso = isoAdd(monday, index);
        return { iso, index, label, dateLabel: dateLabel(iso) };
      });
      const cells = {};
      days.forEach((day) => {
        cells[day.iso] = {};
        TIME_SLOTS.forEach((time) => {
          const h = Number(time.slice(0, 2));
          let status = 'GRAY';
          if (day.index <= 3 && h >= 14 && h < 18) status = 'GREEN';
          if (day.index === 5 && h >= 10 && h < 12) status = 'GREEN';
          cells[day.iso][time] = {
            status, student: '', teacherId, orderId: '', tsId: '', className: '',
            classId: '', holder: '', bookedAt: '', note: '', sub: null, hold: null
          };
        });
      });
      return { offset, monday, weekNo: 46 + offset, days, cells };
    }

    function setCell(week, dayIndex, time, patch) {
      const iso = week.days[dayIndex].iso;
      Object.assign(week.cells[iso][time], patch);

    function buildAllWeeks() {

    function buildTemplate() {
      const grid = {};
      for (let d = 0; d < 7; d += 1) {
        grid[d] = {};
        TIME_SLOTS.forEach((time) => {
          const h = Number(time.slice(0, 2));
          /* 典型外教作息：工作日上午 09-12 + 下午 14-20，周六上午 09-12，周日休息 */
          grid[d][time] = (d <= 4 && ((h >= 9 && h < 12) || (h >= 14 && h < 20)))
            || (d === 5 && h >= 9 && h < 12);
        });
      }
      return grid;
    }

    function buildAllTemplates() {

      TEACHERS.forEach((t) => { all[t.id] = buildTemplate(); });

      const matchedT = TEACHERS.find((t) => {

        if (qName && t.name.toLowerCase().includes(qName)) return true;
        return false;
      });

    /* ------------------------------------------------------------------
     * 工具
     * ------------------------------------------------------------------ */
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function roleMeta() { return ROLE_META[state.role]; }
    function navItems() { return NAVS[state.role] || NAVS.parent; }
    function teacherById(id) { return TEACHERS.find((t) => t.id === id) || TEACHERS[0]; }
    function studentByKey(key) { return STUDENTS.find((s) => s.key === key) || STUDENTS[0]; }
    function classById(id) { return CLASSES.find((c) => c.id === id) || CLASSES[0]; }

    function currentWeek() { return currentWeeks()[String(state.weekOffset)]; }
    function currentTeacher() { return teacherById(state.teacherId); }
    function getCell(dayIso, time) {
      const week = currentWeek();
      return (week.cells[dayIso] && week.cells[dayIso][time]) || null;
    }
    function teacherForCell(cell) { return teacherById(cell.teacherId || state.teacherId); }

    function isManagedTeacher(teacherId) {
      const t = teacherById(teacherId);
      return !!t && t.managedBy === CURRENT_MONITOR_ID;
    }
    function studentMatches(s, query) {
      if (!query) return true;
      const q = query.trim().toLowerCase();
      if (!q) return true;
      return [s.name, s.nickname, s.pinyin, s.phone, s.tag, s.className].join(' ').toLowerCase().includes(q);
    }
    function teacherInitial(name) { return String(name || '?').slice(0, 1).toUpperCase(); }

    /* 学生本周课程聚合：跨教师去重（BLUE/PURPLE 同一节课只保留一张卡） */
    function collectStudentLessons(offset) {
      const student = studentByKey(state.child);
      const out = [];
      const seen = new Set();
      TEACHERS.forEach((t) => {
        const week = state.weeks[t.id][String(offset)];
        if (!week) return;
        week.days.forEach((day) => {
          TIME_SLOTS.forEach((time) => {
            const cell = week.cells[day.iso][time];
            if (cell.student !== student.name) return;
            if (!['ORANGE', 'YELLOW', 'BLUE', 'PURPLE', 'HOLD'].includes(cell.status)) return;
            const key = `${day.iso}-${time}-${cell.orderId || cell.classId || cell.student}`;
            if (seen.has(key)) return;
            seen.add(key);
            out.push({ day, time, cell, teacherId: t.id, teacher: teacherById(t.id) });
          });
        });
      });
      out.sort((a, b) => a.day.iso.localeCompare(b.day.iso) || a.time.localeCompare(b.time));
      return out;
    }

    function originalHoldSlots(studentName) {
      const slots = new Set();
      TEACHERS.forEach((t) => {
        Object.values(state.weeks[t.id]).forEach((week) => {
          week.days.forEach((day) => {
            TIME_SLOTS.forEach((time) => {
              const cell = week.cells[day.iso][time];
              if (cell.status === 'HOLD' && cell.student === studentName) slots.add(`${day.label} ${time}`);
            });
          });
        });
      });
      return Array.from(slots);
    }

    /* 智能外接时间窗：模板开放时段 ∪ 实际排课，最小保底 6 小时 */
    function scheduleBounds(teacherId, week) {
      const tpl = state.availByTeacher[teacherId] || buildTemplate();
      let min = Infinity;
      let max = -Infinity;
      week.days.forEach((day) => {
        TIME_SLOTS.forEach((time, idx) => {
          const cell = week.cells[day.iso][time];
          const scheduled = ['ORANGE', 'YELLOW', 'BLUE', 'PURPLE', 'HOLD', 'RED'].includes(cell.status);
          if (tpl[day.index][time] || scheduled) {
            min = Math.min(min, idx);
            max = Math.max(max, idx + 1);
          }
        });
      });
      if (!isFinite(min)) {
        min = TIME_SLOTS.indexOf('08:00');
        max = TIME_SLOTS.indexOf('20:00');
      }
      if (max - min < 12) {
        const center = (min + max) / 2;
        min = Math.max(0, Math.floor(center - 6));
        max = Math.min(36, min + 12);
        if (max - min < 12) min = Math.max(0, max - 12);
      }
      return { start: min, end: max };
    }

    function slotBoundary(idx) { return idx >= TIME_SLOTS.length ? '24:00' : TIME_SLOTS[idx]; }

    /* 连续 ≥ 4 个半小时格（2h）全周皆休 → 折叠条 */
    function gapRuns(week, start, end) {
      const runs = [];
      let runStart = null;
      for (let i = start; i < end; i += 1) {
        const allGray = week.days.every((day) => week.cells[day.iso][TIME_SLOTS[i]].status === 'GRAY');
        if (allGray) {
          if (runStart === null) runStart = i;
        } else if (runStart !== null) {
          if (i - runStart >= 4 && runStart >= 4 && i <= 30) runs.push({ start: runStart, end: i });
          runStart = null;
        }
      }
      if (runStart !== null && end - runStart >= 4 && runStart >= 4 && end <= 30) runs.push({ start: runStart, end });
      return runs;
    }

    function gapKey(start, end) { return `${start}-${end}`; }
    function hoursLabel(slots) { return (slots * 0.5).toFixed(slots % 2 === 0 ? 0 : 1); }

    function consecutiveOk(dayIso, time, count) {
      const idx = TIME_SLOTS.indexOf(time);
      if (idx < 0 || idx + count > TIME_SLOTS.length) return false;
      for (let i = 0; i < count; i += 1) {
        const cell = getCell(dayIso, TIME_SLOTS[idx + i]);
        if (!cell || cell.status !== 'GREEN') return false;
      }
      return true;
    }

    function cellInner(cell) {
      if (cell.className) {
        const base = cell.className.split(' ')[0].replace('小班', '');
        const short = /^[A-Za-z]/.test(base) ? base.slice(0, 3) : base.slice(0, 2);
        return `<span class="truncate">[班]${esc(short)}</span>`;
      }
      if (cell.student) {
        const short = esc(cell.student.slice(0, 4));
        if (cell.status === 'HOLD') return `<span class="truncate">${short}<span class="text-amber-700">预</span></span>`;
        if (cell.status === 'BLUE' || cell.status === 'PURPLE') {
          const dot = cell.status === 'BLUE' ? 'bg-blue-600' : 'bg-purple-600';
          return `<span class="truncate">${short}</span><span class="ml-0.5 inline-block h-1 w-1 shrink-0 rounded-full ${dot}"></span>`;
        }
        return `<span class="truncate">${short}</span>`;
      }
      return `<span>${COLOR[cell.status].char}</span>`;
    }

    /* 保留滚动位置；首次进入定位到智能时间窗首行（无需再跳过凌晨废格） */
    function restoreScroll(id, top) {
      const el = document.getElementById(id);
      if (!el) return;
      if (top > 0) { el.scrollTop = top; return; }
      if (id === 'availScroll') { el.scrollTop = 0; return; }
      requestAnimationFrame(() => {
        const anchor = el.id === 'availScroll'
          ? (el.querySelector('th[data-time="08:00"]') || el.querySelector('th[data-time]'))
          : el.querySelector('th[data-time]');
        if (!anchor) return;
        const head = el.querySelector('thead');
        const headH = head ? head.getBoundingClientRect().height : 40;
        const delta = anchor.getBoundingClientRect().top - el.getBoundingClientRect().top + el.scrollTop;
        el.scrollTop = Math.max(0, delta - headH);
      });
    }

              <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-slate-100 text-slate-400">${icon('calendar-x', 'h-6 w-6')}</div>
              <p class="mt-3 text-[14px] font-bold text-slate-700">${weekName}暂无已排课程</p>
              <p class="mt-1 text-[12px] font-medium text-slate-400">切换到周度日历可为 ${esc(student.name)} 约 1-7 天内的临时课。</p>
              <button data-action="parent-view" data-view="calendar" class="mt-3 h-9 rounded-xl bg-indigo-600 px-4 text-[12px] font-bold text-white">去周度日历约课</button>
            </div>
          </div>`;
      }

      return `
        <div id="agendaScroll" class="min-h-0 flex-1 overflow-y-auto px-3 py-3">
          <div class="mb-2.5 flex items-center justify-between gap-2 px-1">
            <div class="min-w-0">
              <div class="truncate text-[14px] font-bold text-slate-900">${esc(student.name)} 的${weekName}日程</div>
              <div class="mt-0.5 text-[12px] font-medium text-slate-400">共 ${lessons.length} 节课 · 点击卡片查看详情</div>
            </div>
            <span class="shrink-0 rounded-full border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[12px] font-bold text-emerald-700">零滚动直读</span>
          </div>
          <div class="${state.device === 'tablet' ? 'grid grid-cols-2 gap-3' : 'space-y-3'}">
            ${lessons.map((lesson, index) => {
              const cfg = COLOR[lesson.cell.status];
              const isSub = lesson.cell.status === 'BLUE' || lesson.cell.status === 'PURPLE';
              const cardTeacher = isSub && lesson.cell.sub ? lesson.cell.sub.actual : lesson.teacher.name;
              const level = isSub && lesson.cell.sub ? '代课教师' : lesson.teacher.levelLabel;
              const dotCls = ['ORANGE', 'YELLOW', 'HOLD'].includes(lesson.cell.status) ? 'bg-amber-500' : ['BLUE', 'PURPLE'].includes(lesson.cell.status) ? 'bg-indigo-500' : cfg.dot;
              return `
                <button data-action="agenda-open" data-teacher="${lesson.teacherId}" data-day="${lesson.day.iso}" data-time="${lesson.time}"
                  class="flex min-h-[158px] w-full flex-col justify-between rounded-2xl border ${accent[lesson.cell.status] || 'border-slate-200 bg-white text-slate-900'} p-3.5 text-left shadow-sm transition active:scale-[0.99]">
                  <div class="flex items-start justify-between gap-3">
                    <div class="flex min-w-0 items-center gap-2.5">
                      <div class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl border border-white/70 bg-white/70">
                        <span class="text-[12px] font-bold leading-tight">${lesson.day.label}</span>
                        <span class="font-mono text-[14px] font-bold leading-tight">${lesson.day.dateLabel}</span>
                      </div>
                      <div class="min-w-0">
                        <div class="truncate font-mono text-[16px] font-bold leading-tight">${lesson.time} - ${endTime(lesson.time, 1)}</div>
                        <div class="mt-1 flex flex-wrap items-center gap-1">
                          <span class="rounded-md border border-white/70 bg-white/70 px-1.5 py-0.5 text-[12px] font-bold">${statusLabel[lesson.cell.status] || cfg.name}</span>
                          <span class="text-[12px] font-medium opacity-80">1v1 · 30m</span>
                        </div>
                        <div class="mt-0.5 truncate text-[12px] font-medium opacity-80">${esc(lesson.cell.className || '1v1 专属课')}</div>
                      </div>
                    </div>
                    <div class="grid h-8 w-8 shrink-0 place-items-center rounded-full ${dotCls} text-[12px] font-bold text-white">${teacherInitial(cardTeacher)}</div>
                  </div>
                  <div class="mt-2.5 flex items-center justify-between gap-3 border-t border-white/70 pt-2.5">
                    <div class="min-w-0">
                      <div class="truncate text-[14px] font-bold">${esc(cardTeacher)}</div>
                      <div class="truncate text-[12px] font-medium opacity-75">${esc(level)}${isSub ? ' · 原 ' + esc(lesson.cell.sub.original) : ''}</div>
                    </div>
                    <div class="shrink-0 text-right">
                      <div class="text-[12px] font-bold">ClassIn ${rooms[index % rooms.length]}</div>
                      <div class="font-mono text-[12px] opacity-70">${esc(lesson.cell.orderId || (lesson.cell.hold && lesson.cell.hold.orderId) || lesson.cell.classId || '—')}</div>
                    </div>
                  </div>
                </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 多教师负荷透视 / 4 周一轮极速导航
     * ------------------------------------------------------------------ */
    function roundStartOf(offset) {
      return Math.floor(offset / 4) * 4;
    }

    function weekAt(offset) {
      return state.weeks[state.teacherId][String(offset)] || state.weeks[state.teacherId]['0'];
    }

    function weekLoadFor(teacherId, offset) {
      const week = state.weeks[teacherId][String(offset)];
      let scheduled = 0;
      if (week) {
        Object.values(week.cells).forEach((day) => {
          Object.values(day).forEach((c) => {
            if (['ORANGE', 'YELLOW', 'BLUE', 'PURPLE', 'HOLD'].includes(c.status)) scheduled += 1;
          });
        });
      }
      const total = 24;
      return { scheduled, free: Math.max(0, total - scheduled), total };
    }

    function loadBarHtml(scheduled, total = 24, tone = 'indigo') {
      const filled = Math.max(0, Math.min(10, Math.round((scheduled / total) * 10)));
      const on = tone === 'amber' ? 'bg-amber-500' : 'bg-indigo-600';
      return `<span class="grid grid-cols-10 gap-0.5">${Array.from({ length: 10 }, (_, i) => `<span class="h-1.5 rounded-full ${i < filled ? on : 'bg-slate-200'}"></span>`).join('')}</span>`;
    }

    function weekDotClass(offset) {
      if (state.role === 'parent') {
        const lessons = collectStudentLessons(offset);
        if (lessons.some((l) => ['ORANGE', 'HOLD'].includes(l.cell.status))) return 'bg-amber-500';
        if (lessons.length) return 'bg-yellow-400';
        return 'bg-emerald-500';
      }
      const week = state.weeks[state.teacherId][String(offset)];
      if (!week) return 'bg-emerald-500';
      let hasRed = false;
      let hasFixed = false;
      let hasTemp = false;
      Object.values(week.cells).forEach((day) => {
        Object.values(day).forEach((c) => {
          if (c.status === 'RED') hasRed = true;
          if (c.status === 'ORANGE' || c.status === 'HOLD') hasFixed = true;
          if (['YELLOW', 'BLUE', 'PURPLE'].includes(c.status)) hasTemp = true;
        });
      });
      if (hasRed) return 'bg-rose-500';
      if (hasFixed) return 'bg-amber-500';
      if (hasTemp) return 'bg-yellow-400';
      return 'bg-emerald-500';
    }

    function renderWeekBar(week) {
      const start = roundStartOf(state.weekOffset);
      const first = weekAt(start);
      const last = weekAt(start + 3);
      const firstDate = `${first.days[0].iso.slice(0, 4)}.${dateLabel(first.days[0].iso).replace('-', '.')}`;
      const lastDate = dateLabel(last.days[6].iso).replace('-', '.');
      const canPrev = start > -12;
      const canNext = start < 12;
      const isCurrent = state.weekOffset === 0;

      return `
        <div class="shrink-0 border-b border-slate-200 bg-white px-2.5 py-2">
          <div class="flex items-center justify-between gap-1">
            <button data-action="cycle-prev" ${canPrev ? '' : 'disabled'} class="flex h-8 shrink-0 items-center gap-0.5 rounded-lg border border-slate-200 bg-white px-2 text-[12px] font-bold text-slate-600 active:scale-95 disabled:cursor-not-allowed disabled:text-slate-300">
              ${icon('chevron-left', 'h-3.5 w-3.5')}上一轮
            </button>
            <div class="min-w-0 text-center">
              <div class="truncate text-[14px] font-bold text-slate-900">第 ${first.weekNo} ~ ${last.weekNo} 周</div>
              <div class="mt-0.5 truncate text-[12px] font-medium text-slate-400">${firstDate} - ${lastDate}</div>
            </div>
            <button data-action="cycle-next" ${canNext ? '' : 'disabled'} class="flex h-8 shrink-0 items-center gap-0.5 rounded-lg border border-slate-200 bg-white px-2 text-[12px] font-bold text-slate-600 active:scale-95 disabled:cursor-not-allowed disabled:text-slate-300">
              下一轮${icon('chevron-right', 'h-3.5 w-3.5')}
            </button>
          </div>

          <div class="mt-2 flex items-center gap-1">
            <button data-action="week-prev" class="grid h-10 w-6 shrink-0 place-items-center rounded-lg text-slate-400 hover:bg-slate-100" aria-label="上一周">${icon('chevron-left', 'h-4 w-4')}</button>
            <div class="grid flex-1 grid-cols-4 gap-1 rounded-xl bg-slate-100 p-1">
              ${[0, 1, 2, 3].map((i) => {
                const offset = start + i;
                const w = weekAt(offset);
                const active = state.weekOffset === offset;
                return `
                  <button data-action="week-goto" data-offset="${offset}" class="relative flex h-9 flex-col items-center justify-center rounded-lg text-[12px] font-bold leading-tight transition ${active ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:bg-white/60'}">
                    <span>第${i + 1}周</span>
                    <span class="font-mono text-[12px] font-medium ${active ? 'text-indigo-500' : 'text-slate-400'}">${dateLabel(w.days[0].iso).replace('-', '/')}</span>
                    <span class="absolute right-1 top-1 h-1.5 w-1.5 rounded-full ${weekDotClass(offset)}"></span>
                  </button>`;
              }).join('')}
            </div>
            <button data-action="week-next" class="grid h-10 w-6 shrink-0 place-items-center rounded-lg text-slate-400 hover:bg-slate-100" aria-label="下一周">${icon('chevron-right', 'h-4 w-4')}</button>
          </div>

          <div class="mt-1 flex items-center justify-center gap-2 text-[12px]">
            <span class="text-slate-400">第 ${week.weekNo} 周</span>
            ${isCurrent
              ? '<span class="rounded border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 font-bold text-indigo-700">本周</span>'
              : '<button data-action="week-current" class="font-bold text-indigo-600">回到本周</button>'}
          </div>
        </div>`;
    }

    /* 家长日程清单：紧凑 4 周分段条，保留零滚动直读 */
    function renderAgendaWeekBar() {
      const start = roundStartOf(state.weekOffset);
      return `
        <div class="shrink-0 border-b border-slate-200 bg-white px-2.5 py-1.5">
          <div class="flex items-center gap-1">
            <button data-action="week-prev" class="grid h-10 w-6 shrink-0 place-items-center rounded-lg text-slate-400 hover:bg-slate-100" aria-label="上一周">${icon('chevron-left', 'h-4 w-4')}</button>
            <div class="grid flex-1 grid-cols-4 gap-1 rounded-xl bg-slate-100 p-1">
              ${[0, 1, 2, 3].map((i) => {
                const offset = start + i;
                const w = weekAt(offset);
                const active = state.weekOffset === offset;
                return `
                  <button data-action="week-goto" data-offset="${offset}" class="relative flex h-9 flex-col items-center justify-center rounded-lg text-[12px] font-bold leading-tight transition ${active ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">
                    <span>第${i + 1}周</span>
                    <span class="font-mono text-[12px] font-medium ${active ? 'text-indigo-500' : 'text-slate-400'}">${dateLabel(w.days[0].iso).replace('-', '/')}</span>
                    <span class="absolute right-1 top-1 h-1.5 w-1.5 rounded-full ${weekDotClass(offset)}"></span>
                  </button>`;
              }).join('')}
            </div>
            <button data-action="week-next" class="grid h-10 w-6 shrink-0 place-items-center rounded-lg text-slate-400 hover:bg-slate-100" aria-label="下一周">${icon('chevron-right', 'h-4 w-4')}</button>
            ${state.weekOffset === 0
              ? '<span class="shrink-0 text-[12px] font-bold text-slate-400">本周</span>'
              : '<button data-action="week-current" class="shrink-0 text-[12px] font-bold text-indigo-600">本周</button>'}
          </div>
        </div>`;
    }

    /* 顶部教师状态卡（手机） */
    function renderTeacherStatusCard() {
      const t = currentTeacher();
      const load = weekLoadFor(t.id, state.weekOffset);
      const managed = state.role !== 'monitor' || isManagedTeacher(t.id);
      return `
        <button data-action="open-teacher-sheet" class="flex w-full items-center gap-2.5 rounded-2xl border border-slate-200 bg-white p-2.5 text-left shadow-sm transition active:scale-[0.995]">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-indigo-50 text-[14px] font-bold text-indigo-700">${teacherInitial(t.name)}</span>
          <span class="min-w-0 flex-1">
            <span class="flex items-center gap-1.5">
              <span class="truncate text-[14px] font-bold text-slate-900">${esc(t.name)}</span>
              <span class="shrink-0 rounded border border-slate-200 bg-slate-50 px-1.5 py-0.5 text-[12px] font-bold text-slate-600">${esc(t.levelLabel)}</span>
              ${state.role === 'monitor' ? `<span class="shrink-0 rounded border px-1.5 py-0.5 text-[12px] font-bold ${managed ? 'border-indigo-100 bg-indigo-50 text-indigo-700' : 'border-rose-200 bg-rose-50 text-rose-700'}">${managed ? '管辖' : '非管辖'}</span>` : ''}
            </span>
            <span class="mt-1 flex items-center gap-2 text-[12px] text-slate-500">
              <span>当周已排 <b class="font-mono text-slate-900">${load.scheduled}</b>/${load.total} 节</span>
              <span>空闲 ${load.free} 节</span>
              <span class="ml-auto flex items-center gap-0.5 font-semibold text-indigo-600">切换 ${icon('chevron-down', 'h-3.5 w-3.5')}</span>
            </span>
            <span class="mt-1.5 block">${loadBarHtml(load.scheduled)}</span>
          </span>
        </button>`;
    }

    /* 宽屏教师负荷标签栏 */
    function renderTeacherLoadTabs() {
      return `
        <div class="flex items-center gap-1 overflow-x-auto">
          ${TEACHERS.map((t) => {
            const load = weekLoadFor(t.id, state.weekOffset);
            const on = state.teacherId === t.id;
            const label = load.scheduled === 0 ? '0·空闲' : String(load.scheduled);
            return `<button data-action="set-teacher" data-id="${t.id}" class="flex h-9 shrink-0 items-center gap-1 rounded-lg border px-2.5 text-[12px] font-bold transition ${on ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">${esc(t.name.split(' ')[0])} (${label})</button>`;
          }).join('')}
        </div>`;
    }

    /* 半屏教师切换抽屉 */
    function renderTeacherSheet() {
      const current = currentTeacher();
      const q = (state.teacherQuery || '').trim().toLowerCase();
      const list = TEACHERS.filter((t) => !q || [t.name, t.pinyin || ''].join(' ').toLowerCase().includes(q));
      const managedCount = TEACHERS.filter((t) => t.managedBy === CURRENT_MONITOR_ID).length;
      return `
        <div class="absolute inset-0 z-[60] flex items-end">
          <div data-action="close-overlay" class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]"></div>
          <div class="relative flex max-h-[74%] w-full flex-col overflow-hidden rounded-t-3xl border-t border-slate-200 bg-white shadow-2xl">
            <div class="shrink-0 border-b border-slate-100 px-4 pb-2 pt-3">
              <div class="mx-auto mb-2 h-1 w-10 rounded-full bg-slate-300"></div>
              <div class="flex items-center justify-between gap-2">
                <div>
                  <h3 class="text-[16px] font-bold text-slate-900">切换外教</h3>
                  <p class="mt-0.5 text-[12px] font-medium text-slate-400">${state.role === 'monitor' ? `管辖 ${managedCount} 位 · 全校 ${TEACHERS.length} 位` : '查看各外教当周排课负荷'}</p>
                </div>
                <button data-action="close-overlay" class="grid h-8 w-8 place-items-center rounded-xl text-slate-400 hover:bg-slate-100 hover:text-slate-600" aria-label="关闭">${icon('x', 'h-4 w-4')}</button>
              </div>
            </div>
            <div class="shrink-0 px-3 pb-2">
              <div class="relative">
                <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">${icon('search', 'h-4 w-4')}</span>
                <input id="teacherSearch" value="${esc(state.teacherQuery || '')}" placeholder="搜索外教姓名 / 拼音" class="h-10 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500">
              </div>
            </div>
            <div data-scroll class="flex-1 space-y-1 overflow-y-auto p-2">
              ${list.map((t) => {
                const load = weekLoadFor(t.id, state.weekOffset);
                const on = state.teacherId === t.id;
                const managed = state.role !== 'monitor' || isManagedTeacher(t.id);
                return `
                  <button data-action="set-teacher" data-id="${t.id}" class="flex h-14 w-full items-center gap-3 rounded-xl border px-3 py-1.5 text-left transition ${on ? 'border-indigo-200 bg-indigo-50/60' : 'border-transparent bg-white hover:bg-slate-50'}">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-slate-900 text-[12px] font-bold text-amber-300">${teacherInitial(t.name)}</span>
                    <span class="min-w-0 flex-1">
                      <span class="flex items-center gap-1.5">
                        <span class="truncate text-[14px] font-bold text-slate-900">${esc(t.name)}</span>
                        <span class="shrink-0 rounded border border-slate-200 bg-slate-50 px-1.5 py-0.5 text-[12px] font-bold text-slate-600">${esc(t.levelLabel)}</span>
                        ${state.role === 'monitor' ? `<span class="shrink-0 rounded border px-1.5 py-0.5 text-[12px] font-bold ${managed ? 'border-indigo-100 bg-indigo-50 text-indigo-700' : 'border-rose-200 bg-rose-50 text-rose-700'}">${managed ? '管辖' : '非管辖'}</span>` : ''}
                      </span>
                      <span class="mt-1 flex items-center gap-2 text-[12px] text-slate-500">
                        <span class="shrink-0">已排 <b class="font-mono text-slate-900">${load.scheduled}</b> · 空闲 ${load.free}</span>
                        <span class="min-w-0 flex-1">${loadBarHtml(load.scheduled, load.total)}</span>
                        <span class="shrink-0 font-mono text-slate-400">${load.scheduled}/${load.total}</span>
                      </span>
                    </span>
                    ${on ? `<span class="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-indigo-600 text-white">${icon('check', 'h-3.5 w-3.5')}</span>` : icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-300')}
                  </button>`;
              }).join('')}
            </div>
            <div class="shrink-0 border-t border-slate-100 px-4 py-2 text-center text-[12px] text-slate-400">选择后保持当前周次与滚动位置</div>
          </div>
        </div>`;
    }

    function renderScheduleToolbar() {
      if (state.role === 'parent') {
        const view = state.parentView;
        return `
          <div class="shrink-0 border-b border-slate-100 bg-white">
            <div class="flex items-center gap-1 overflow-x-auto px-3 py-1.5">
              ${['alice', 'bob'].map((key) => {
                const s = studentByKey(key);
                const on = state.child === key;
                return `<button data-action="set-child" data-key="${key}" class="flex h-8 shrink-0 items-center gap-1 rounded-lg px-2 text-[12px] font-bold transition ${on ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">
                  ${esc(s.name)}<span class="rounded px-1 text-[12px] ${on ? 'bg-white/20 text-white' : 'bg-white text-indigo-700'}">${quotaOf(key)} 节</span>
                </button>`;
              }).join('')}
              <div class="ml-auto inline-flex shrink-0 rounded-lg bg-slate-100 p-0.5">
                <button data-action="parent-view" data-view="agenda" class="flex h-7 items-center gap-1 rounded-md px-1.5 text-[12px] font-bold transition ${view === 'agenda' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">${icon('list', 'h-3.5 w-3.5')}日程清单</button>
                <button data-action="parent-view" data-view="calendar" class="flex h-7 items-center gap-1 rounded-md px-1.5 text-[12px] font-bold transition ${view === 'calendar' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">${icon('calendar-days', 'h-3.5 w-3.5')}周度日历</button>
              </div>
            </div>
            ${view === 'calendar'
              ? (state.device === 'tablet'
                ? `<div class="border-t border-slate-100 px-3 py-1.5">${renderTeacherLoadTabs()}</div>`
                : `<div class="border-t border-slate-100 px-3 py-2">${renderTeacherStatusCard()}<div class="mt-1.5 text-[12px] font-medium text-slate-400">提前 1-7 天可约 · 点击状态卡切换外教</div></div>`)
              : ''}
          </div>`;
      }
      if (state.role === 'monitor') {
        return `
          <div class="shrink-0 border-b border-slate-100 bg-white">
            <div class="px-3 py-2">${state.device === 'tablet' ? renderTeacherLoadTabs() : renderTeacherStatusCard()}</div>
            <div class="flex items-center gap-1.5 overflow-x-auto px-3 pb-1.5">
              <button data-action="open-batch" class="h-8 shrink-0 rounded-lg bg-indigo-600 px-2.5 text-[12px] font-bold text-white">固定位排课</button>
              <button data-action="open-smallgroup" class="h-8 shrink-0 rounded-lg border border-slate-200 bg-white px-2.5 text-[12px] font-bold text-slate-700">小班排课</button>
              <button data-action="open-availability" class="h-8 shrink-0 rounded-lg border border-slate-200 bg-white px-2.5 text-[12px] font-bold text-slate-700">周模板</button>
            </div>
            <div class="flex items-center gap-1 border-t border-slate-100 px-3 py-1 text-[12px] font-medium text-slate-400">
              <span class="rounded bg-indigo-50 px-1.5 py-0.5 font-bold text-indigo-700">代约模式</span>
              <span class="truncate">仅所辖教师可代约 · 学员全校跨班检索</span>
            </div>
          </div>`;
      }
      if (state.role === 'teacher' || state.role === 'sub_teacher') {
        const t = currentTeacher();
        return `
          <div class="flex shrink-0 items-center gap-1.5 overflow-x-auto border-b border-slate-100 bg-white px-3 py-1.5">
            <span class="shrink-0 text-[12px] font-semibold text-slate-700">${esc(t.name)} · ${esc(t.levelLabel)}</span>
            ${state.role === 'sub_teacher' ? '<span class="shrink-0 rounded border border-purple-200 bg-purple-50 px-1.5 py-0.5 text-[12px] font-bold text-purple-700">代课视角</span>' : ''}

    function gridGapRow(start, end) {
      const key = gapKey(start, end);
      const from = TIME_SLOTS[start];
      const to = slotBoundary(end);
      const slots = end - start;
      return `
        <tr>
          <td colspan="8" class="border-b border-slate-100 bg-slate-50 p-0">
            <button data-action="toggle-gap" data-key="${key}" class="flex h-[22px] w-full items-center justify-center gap-1.5 px-2 text-[12px] font-medium text-slate-500 hover:bg-slate-100">

              <span>休息时段（共 ${hoursLabel(slots)} 小时已折叠）</span>
              <span class="ml-0.5 font-bold text-indigo-600">点击展开</span>
              <span class="font-mono text-slate-300">┄┄</span>
            </button>
          </td>
        </tr>`;
    }

    function gridGapExpandedRow(start, end) {
      const key = gapKey(start, end);
      const from = TIME_SLOTS[start];
      const to = slotBoundary(end);
      return `
        <tr>
          <td colspan="8" class="border-b border-slate-100 bg-slate-50 p-0">
            <button data-action="toggle-gap" data-key="${key}" class="flex h-[22px] w-full items-center justify-center gap-1.5 px-2 text-[12px] font-medium text-slate-400 hover:bg-slate-100">
              <span class="font-mono">${from} - ${to}</span>
              <span>休息时段已展开</span>
              <span class="font-bold text-indigo-600">收起空档 ▴</span>
            </button>
          </td>
        </tr>`;
    }

    function renderGridBody(week) {
      const bounds = state.fullDay ? { start: 0, end: TIME_SLOTS.length } : scheduleBounds(state.teacherId, week);
      const gaps = state.fullDay ? [] : gapRuns(week, bounds.start, bounds.end);
      const gapMap = new Map(gaps.map((gap) => [gap.start, gap]));
      let html = '';
      let i = bounds.start;
      while (i < bounds.end) {
        const gap = gapMap.get(i);
        if (gap) {
          const key = gapKey(gap.start, gap.end);
          if (state.expandedGaps.has(key)) {
            html += gridGapExpandedRow(gap.start, gap.end);
            for (let j = gap.start; j < gap.end; j += 1) html += gridTimeRow(week, TIME_SLOTS[j]);
          } else {
            html += gridGapRow(gap.start, gap.end);
          }
          i = gap.end;
        } else {
          html += gridTimeRow(week, TIME_SLOTS[i]);
          i += 1;
        }
      }
      return html;
    }

    function renderScheduleFooter() {
      const week = currentWeek();
      const bounds = state.fullDay ? { start: 0, end: TIME_SLOTS.length } : scheduleBounds(state.teacherId, week);

      const pct = Math.max(0, Math.round((1 - rows / TIME_SLOTS.length) * 100));
      const hints = {
        parent: '点击绿色格约课 · 提前 1-7 天',
        monitor: '点击绿色格代约 · 仅所辖教师 · 学员全校可检索',

        sub_teacher: '紫色格课酬计入本人周结单',

      return `
        <div class="shrink-0 border-t border-slate-200 bg-white px-3 py-1 text-[12px] font-medium text-slate-400">
          <div class="flex items-center justify-between gap-2">

    /* ------------------------------------------------------------------
     * 单元格点击 / 详情 / 预约抽屉

    function onCellClick(dayIso, time) {
      const cell = getCell(dayIso, time);
      if (!cell) return;

      if (cell.status === 'GREEN' && canBookRole()) {
        if (state.role === 'monitor') {
          /* 班长：即使超出 1-7 天窗或教师非管辖，也进入代约抽屉展示约束说明 */
          openBooking(dayIso, time);
          return;
        }
        const studentKey = state.role === 'parent' ? state.child : 'alice';
        if (!inBookingWindow(dayIso)) {
          showToast('仅可预约未来 1-7 天内的时段', true);
          return;
        }
        if (quotaOf(studentKey) <= 0) {
          openCell(dayIso, time);
          showToast('暂无可用临时课课时，请先购课', true);
          return;
        }
        openBooking(dayIso, time);
        return;
      }
      openCell(dayIso, time);
    }

    function openCell(dayIso, time) {
      state.overlay = { type: 'cell', day: dayIso, time };
      renderAll();
    }

    function openBooking(dayIso, time) {
      if (state.online === 'off') return showToast('离线只读，暂不可预约', true);
      const week = currentWeek();
      const clickedDay = week.days.findIndex((d) => d.iso === dayIso);
      const defaultStudent = state.role === 'parent'
        ? state.child
        : (state.role === 'monitor' ? (state.monitorStudentKey || 'alice') : 'alice');
      state.booking = {
        day: dayIso,
        time,
        count: 1,
        studentKey: defaultStudent,
        search: '',
        mode: 'temp',                 // temp | fixed（班长）
        simulate: false,
        fixed: {
          teacherId: isManagedTeacher(state.teacherId) ? state.teacherId : 'david',
          startWeek: state.weekOffset >= 2 ? 2 : 1,
          weekday: clickedDay >= 0 ? clickedDay : 1,
          time,
          suppressHold: true
        }
      };
      state.overlay = { type: 'booking' };
      renderAll();
    }

    /* ------------------------- 班长代约抽屉 ------------------------- */
    function proxyStudentResultsHtml() {
      const b = state.booking;
      const list = STUDENTS.filter((s) => studentMatches(s, b.search || ''));
      if (!list.length) {
        return '<p class="rounded-lg border border-dashed border-slate-200 bg-slate-50 px-2 py-2 text-center text-[12px] font-medium text-slate-400">未找到匹配学员，请尝试昵称 / 拼音 / 手机号</p>';
      }
      return list.map((s) => {
        const on = b.studentKey === s.key;
        const q = quotaOf(s.key);
        return `<button data-action="proxy-student" data-key="${s.key}" class="flex w-full items-center justify-between gap-2 rounded-lg border px-2 py-1.5 text-left transition ${on ? 'border-indigo-300 bg-indigo-50 ring-1 ring-indigo-400' : 'border-slate-200 bg-white hover:bg-slate-50'}">
          <div class="min-w-0">
            <div class="flex min-w-0 items-center gap-1">
              <span class="truncate text-[12px] font-bold text-slate-900">${esc(s.name)}</span>

              ${s.trial ? '<span class="shrink-0 rounded bg-amber-100 px-1 text-[12px] font-bold text-amber-700">UNBOUND</span>' : ''}
            </div>
            <div class="mt-0.5 truncate text-[12px] font-medium text-slate-400">${esc(s.phone)} · ${esc(s.tag)}</div>
          </div>
          <span class="shrink-0 text-[12px] font-bold ${q > 0 ? 'text-emerald-600' : 'text-rose-500'}">${q} 节</span>
        </button>`;
      }).join('');
    }

    function fixedBookingTargets(b) {
      const f = b.fixed;
      return [0, 1, 2, 3].map((i) => {
        const offset = f.startWeek + i;
        const week = state.weeks[f.teacherId] ? state.weeks[f.teacherId][String(offset)] : null;
        if (!week) return { weekNo: i + 1, offset, iso: '—', conflict: '超出原型预载周范围', cell: null };
        const day = week.days[f.weekday];
        const cell = week.cells[day.iso][f.time];
        let conflict = '';
        if (!cell) conflict = '时段不存在';
        else if (cell.status !== 'GREEN') conflict = statusConflictLabel(cell.status);
        return { weekNo: i + 1, offset, iso: day.iso, day, cell, conflict };
      });
    }

    function windowConstraintText(dayIso) {
      const delta = diffDays(dayIso, TODAY);
      if (delta < 1) return '所选日期为当天或已过期，严禁代约当天课次';
      if (delta > 7) return `所选日期距当前 ${delta} 天，已超过 7 天预约窗口`;
      return '';
    }

      const constraint = !managed ? `

            </div>` : `
            <div class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-rose-800">
              <div class="flex items-center gap-1 font-bold">${icon('clock-alert', 'h-4 w-4')} 1-7 天时间窗限制</div>

          <div class="mt-3">

            <div class="mt-2 grid grid-cols-4 gap-1.5">
              ${[1, 2, 3, 4].map((n) => {
                const seqOk = consecutiveOk(b.day, b.time, n);
                const quotaOk = q >= n;
                const selectable = seqOk && quotaOk;
                const selected = b.count === n;
                const tag = !seqOk ? '后段已占' : !quotaOk ? '资产不足' : `${n * 30}m`;
                return `<button data-action="book-count" data-count="${n}" ${selectable ? '' : 'disabled'} class="flex flex-col items-center justify-center rounded-xl border px-1 py-2 text-center transition ${selected ? 'border-indigo-300 bg-indigo-50 text-indigo-700 ring-1 ring-indigo-500' : selectable ? 'border-slate-200 bg-white text-slate-700' : 'border-slate-100 bg-slate-50 text-slate-300'}">

          ${q < b.count ? '<p class="mt-1 text-[12px] font-medium text-rose-600">该学员临时课待排期 TS 不足，严禁赊账代约。</p>' : ''}

          <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">

              <span class="text-[12px] font-semibold ${hasConflict ? 'text-rose-600' : 'text-emerald-600'}">${hasConflict ? '存在冲突' : '全部空闲'}</span>
            </div>
            <div class="mt-1.5 grid grid-cols-2 gap-1.5">
              ${targets.map((t) => `<div class="rounded-lg border px-2 py-1.5 ${t.conflict ? 'border-rose-200 bg-rose-50' : 'border-emerald-200 bg-emerald-50'}">
                <div class="text-[12px] font-bold ${t.conflict ? 'text-rose-700' : 'text-emerald-700'}">第 ${t.weekNo} 周 · ${dateLabel(t.iso)}${t.day ? ' ' + weekdayLabel(t.iso) : ''}</div>
                <div class="mt-0.5 truncate text-[12px] font-medium ${t.conflict ? 'text-rose-600' : 'text-emerald-600'}">${esc(t.conflict || '空闲可锁定')}</div>

      return bottomSheet(`

    function renderOverlay() {

      if (!state.overlay) el.innerHTML = '';
      else if (state.overlay.type === 'cell') el.innerHTML = renderCellModal();
      else if (state.overlay.type === 'booking') el.innerHTML = renderBookingSheet();
      else if (state.overlay.type === 'teacher') el.innerHTML = renderTeacherSheet();
      else el.innerHTML = '';
      const next = el.querySelector('[data-scroll]');
      if (next) next.scrollTop = top;
    }

    function confirmBooking() {
      if (state.online === 'off') return showToast('离线只读，暂不可预约', true);
      const b = state.booking;
      if (!b) return;
      if (state.role === 'monitor') {
        if (!isManagedTeacher(state.teacherId)) return showToast('越权阻断：该教师非本班长管辖', true);
        if (!inBookingWindow(b.day)) return showToast('仅可代约距当前 1-7 天内的时段', true);
      }
      const student = studentByKey(b.studentKey);
      const q = quotaOf(b.studentKey);
      if (!consecutiveOk(b.day, b.time, b.count)) return showToast('所选时段后段已被占用，请更换时段', true);
      if (q < b.count) return showToast('临时课 TS 资产不足', true);

      const idx = TIME_SLOTS.indexOf(b.time);
      if (b.simulate) {
        const first = getCell(b.day, b.time);
        if (first) {
          first.status = 'YELLOW';
          first.student = 'CharlieC09';
          first.orderId = 'ord_char0009';
          first.tsId = 'ts_chatx0001';
          first.bookedAt = '刚刚';
        }
        state.overlay = null;
        renderAll();
        showToast('该时段刚刚已被其他学员预约，请选择其他时段（409）', true);
        return;
      }

      for (let i = 0; i < b.count; i += 1) {
        const cell = getCell(b.day, TIME_SLOTS[idx + i]);
        cell.status = 'YELLOW';
        cell.student = student.name;
        cell.orderId = newId('ord');
        cell.tsId = newId('ts');
        cell.bookedAt = '刚刚';
        cell.bookedBy = state.role === 'monitor' ? 'Leo' : '';
      }
      state.credits[b.studentKey] = q - b.count;
      state.overlay = null;
      renderAll();
      const msg = state.role === 'admin'
        ? (student.trial
          ? `代约成功 · 已锁定 ${b.count} 节 · 请线下发送上课时间与 ClassIn 进门信息`
          : `代约成功 · ${student.name} 已锁定 ${b.count} 节临时课`)
        : (state.role === 'monitor'
          ? `代约成功 · ${student.name} · ${b.count} 节 · FIFO 扣减 ${student.tempOrder.split(' ')[0]}`
          : `预约成功 · 已连约 ${b.count} 节（${b.time} - ${endTime(b.time, b.count)}），FIFO 扣减最老 TS`);
      showToast(msg);
    }

    function confirmFixedBooking() {
      if (state.online === 'off') return showToast('离线只读，暂不可代约', true);
      const b = state.booking;
      if (!b || b.mode !== 'fixed') return;
      const f = b.fixed;
      if (!isManagedTeacher(f.teacherId)) return showToast('越权阻断：仅可代约所辖在职教师', true);
      const targets = fixedBookingTargets(b);
      if (targets.some((t) => t.conflict)) return showToast('存在冲突周，事务已回滚（409 SCHEDULE_SLOT_CONFLICT）', true);
      const student = studentByKey(b.studentKey);
      if ((state.fixed[b.studentKey] || 0) < 4) return showToast('固定位待排期 TS 不足 4 节', true);

      targets.forEach((t) => {
        const week = state.weeks[f.teacherId][String(t.offset)];
        const cell = week.cells[t.iso][f.time];
        cell.status = 'ORANGE';
        cell.student = student.name;
        cell.teacherId = f.teacherId;
        cell.orderId = newId('ord');
        cell.tsId = newId('ts');
        cell.holder = 'Leo';
        cell.bookedBy = 'Leo';
        cell.hold = null;
      });

      let released = 0;
      if (f.suppressHold) {
        state.holdSuppressed[b.studentKey] = true;
        TEACHERS.forEach((t) => {
          Object.values(state.weeks[t.id]).forEach((week) => {
            week.days.forEach((day) => {
              TIME_SLOTS.forEach((time) => {
                const cell = week.cells[day.iso][time];
                if (cell.status === 'HOLD' && cell.student === student.name) {
                  cell.status = 'GREEN';
                  cell.student = '';
                  cell.orderId = '';
                  cell.tsId = '';
                  cell.hold = null;
                  released += 1;
                }
              });
            });
          });
        });
      }

      state.fixed[b.studentKey] -= 4;
      state.teacherId = f.teacherId;
      state.weekOffset = f.startWeek;
      state.page = 'schedule';
      state.navTab = 'schedule';
      state.overlay = null;
      state.booking = null;
      renderAll();
      showToast(`下一轮固定位已锁定 4 周 · ${student.name} · ${f.time}${released ? ` · 已释放原时段 ${released} 格 HOLD` : ' · 已跳过 72h HOLD 预占'}`);
    }

      const grid = state.availByTeacher[state.availTeacher];

      for (let d = 0; d < 7; d += 1) TIME_SLOTS.forEach((t) => { if (grid[d][t]) openCount += 1; });

      return `
        <div class="flex h-full min-h-0 flex-col bg-slate-50">

              <button data-action="go-schedule" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="返回课表">${icon('chevron-left', 'h-5 w-5')}</button>
              <div class="min-w-0">

              </div>
            </div>
            ${state.role === 'monitor' ? `

                <div class="inline-flex rounded-lg bg-slate-100 p-0.5">
                  ${TEACHERS.map((t) => `<button data-action="set-avail-teacher" data-id="${t.id}" class="h-7 rounded-md px-2 text-[12px] font-bold ${state.availTeacher === t.id ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}">${esc(t.name.split(' ')[0])}</button>`).join('')}
                </div>
              </div>` : ''}
            <div class="mt-2 flex flex-wrap items-center gap-1.5">
              <span class="rounded-lg border border-emerald-200 bg-emerald-50 px-2 py-1 text-[12px] font-bold text-emerald-700">已开放 <span id="availOpen">${openCount}</span> / 252 格</span>
              <button data-action="avail-preset" data-preset="day" class="h-7 rounded-lg border border-slate-200 bg-white px-2 text-[12px] font-bold text-slate-700">白天高峰 · 08-18</button>
              <button data-action="avail-preset" data-preset="evening" class="h-7 rounded-lg border border-slate-200 bg-white px-2 text-[12px] font-bold text-slate-700">晚间高峰 · 17-21</button>
              <button data-action="avail-preset" data-preset="weekend" class="h-7 rounded-lg border border-slate-200 bg-white px-2 text-[12px] font-bold text-slate-700">周末全天</button>
              <button data-action="avail-preset" data-preset="all" class="h-7 rounded-lg border border-slate-200 bg-white px-2 text-[12px] font-bold text-slate-700">全选</button>
              <button data-action="avail-preset" data-preset="none" class="h-7 rounded-lg border border-slate-200 bg-white px-2 text-[12px] font-bold text-slate-700">清空</button>
            </div>
            <p class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-400">${esc(teacher.name)} · 清晨 06:00-08:00 与深夜 21:00-24:00 默认折叠；保存后自动应用到未来空闲日期，已排课程、请假与续费预占严格保留不被覆盖。</p>
          </div>

          <div id="availScroll" class="min-h-0 flex-1 overflow-auto bg-white">
            <table class="w-full table-fixed border-collapse">
              <thead>
                <tr>
                  <th class="sticky left-0 top-0 z-40 w-[40px] border-b border-r border-slate-200 bg-slate-100 px-0 py-1 text-center text-[12px] font-bold text-slate-500">时段</th>
                  ${DAY_LABELS.map((d) => `<th class="sticky top-0 z-30 border-b border-r border-slate-200 bg-slate-50 px-0.5 py-1 text-center text-[12px] font-bold text-slate-600">${d}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${state.availExpandEarly
                  ? availFoldRow('early', true) + TIME_SLOTS.slice(0, 4).map((t) => availTimeRow(grid, t)).join('')
                  : availFoldRow('early', false)}
                ${TIME_SLOTS.slice(4, 30).map((t) => availTimeRow(grid, t)).join('')}
                ${state.availExpandLate
                  ? TIME_SLOTS.slice(30).map((t) => availTimeRow(grid, t)).join('') + availFoldRow('late', true)
                  : availFoldRow('late', false)}
              </tbody>
            </table>
          </div>

          <div class="shrink-0 border-t border-slate-200 bg-white px-3 py-2">
            <div class="flex gap-2">
              <button data-action="go-schedule" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">返回课表</button>
              <button data-action="save-availability" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">保存并生效</button>
            </div>
          </div>
        </div>`;
    }

    function availTimeRow(grid, time) {
      return `
        <tr class="h-7">
          <th data-time="${time}" class="sticky left-0 z-20 w-[40px] border-b border-r border-slate-200 bg-slate-100 px-0 text-center text-[12px] font-mono font-semibold text-slate-500">${time}</th>
          ${DAY_LABELS.map((_, d) => {
            const open = grid[d][time];
            return `<td class="border-b border-r border-slate-100 p-[2px]">
              <button data-action="toggle-avail" data-day="${d}" data-time="${time}" class="flex h-6 w-full items-center justify-center rounded-md border text-[12px] font-bold leading-none transition active:scale-95 ${open ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-slate-100 border-slate-200 text-slate-400'}">${open ? '可' : '休'}</button>
            </td>`;
          }).join('')}
        </tr>`;
    }

    function availFoldRow(which, expanded) {
      const early = which === 'early';
      const label = early ? '清晨 06:00-08:00' : '深夜 21:00-24:00';
      const rows = early ? 4 : 6;
      return `
        <tr>
          <td colspan="8" class="border-b border-slate-100 bg-slate-50 p-0">
            <button data-action="avail-fold" data-fold="${which}" class="flex h-8 w-full items-center justify-center gap-1.5 text-[12px] font-semibold text-slate-500 hover:bg-slate-100">
              <span class="text-slate-300">┄┄</span>
              ${expanded ? `收起 ${label}` : `展开 ${label}（${rows} 行）`}
              <span class="font-bold text-indigo-600">${expanded ? '▴' : '▾'}</span>
            </button>
          </td>
        </tr>`;
    }

    function toggleAvail(el, dayIndex, time) {
      if (state.online === 'off') return showToast('离线只读，暂不可修改模板', true);
      const grid = state.availByTeacher[state.availTeacher];
      grid[dayIndex][time] = !grid[dayIndex][time];
      const open = grid[dayIndex][time];
      el.className = `flex h-6 w-full items-center justify-center rounded-md border text-[12px] font-bold leading-none transition active:scale-95 ${open ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-slate-100 border-slate-200 text-slate-400'}`;
      el.textContent = open ? '可' : '休';
      let count = 0;
      for (let d = 0; d < 7; d += 1) TIME_SLOTS.forEach((t) => { if (grid[d][t]) count += 1; });
      const badge = document.getElementById('availOpen');
      if (badge) badge.textContent = String(count);
    }

    function applyPreset(preset) {
      if (state.online === 'off') return showToast('离线只读，暂不可修改模板', true);
      const grid = state.availByTeacher[state.availTeacher];
      for (let d = 0; d < 7; d += 1) {
        TIME_SLOTS.forEach((time) => {
          const h = Number(time.slice(0, 2));
          if (preset === 'all') grid[d][time] = true;
          else if (preset === 'none') grid[d][time] = false;
          else if (preset === 'day') grid[d][time] = d <= 4 && h >= 8 && h < 18;
          else if (preset === 'evening') grid[d][time] = d <= 4 && h >= 17 && h < 21;
          else if (preset === 'weekend') grid[d][time] = d >= 5 && h >= 9 && h < 20;
        });
      }
      renderContentOnly();
    }

    function saveAvailability() {
      if (state.online === 'off') return showToast('离线只读，暂不可保存模板', true);
      const teacherId = state.availTeacher;
      const grid = state.availByTeacher[teacherId];
      let changed = 0;
      let preserved = 0;
      for (let o = 0; o <= 4; o += 1) {
        const week = state.weeks[teacherId][String(o)];
        week.days.forEach((day, d) => {
          TIME_SLOTS.forEach((time) => {
            const cell = week.cells[day.iso][time];
            if (cell.status !== 'GRAY' && cell.status !== 'GREEN') { preserved += 1; return; }
            const want = grid[d][time] ? 'GREEN' : 'GRAY';
            if (cell.status !== want) { cell.status = want; changed += 1; }
          });
        });
      }
      showToast(`周模板已生效 · 更新 ${changed} 格，保留 ${preserved} 处已排课程 / 请假 / 预占`);
    }

    /* ------------------------------------------------------------------
     * 固定位四周批量排课
     * ------------------------------------------------------------------ */
    function statusConflictLabel(status) {
      return {
        ORANGE: '已有固定位排课',
        HOLD: '续费预占（排他锁定）',
        YELLOW: '已有临时课预约',
        BLUE: '已有被代课排课',
        PURPLE: '已有代上课排课',
        RED: '教师请假',
        GRAY: '教师未开放该时段'
      }[status] || '时段不可用';
    }

    function batchTargets() {
      const b = state.batch;
      const teacherId = 'david';
      return [0, 1, 2, 3].map((i) => {
        const offset = b.startWeek + i;
        const week = state.weeks[teacherId][String(offset)];
        const day = week.days[b.weekday];
        const cell = week.cells[day.iso][b.time];
        let conflict = '';
        if (b.simulate && i === 2) conflict = '模拟冲突：该周时段已被临时课预约';
        else if (cell.status !== 'GREEN') conflict = statusConflictLabel(cell.status);
        return { weekNo: i + 1, offset, iso: day.iso, day, cell, conflict };
      });
    }

    function renderBatch() {
      const b = state.batch;
      const student = studentByKey(b.studentKey);
      const fixed = state.fixed[b.studentKey] || 0;
      const targets = batchTargets();
      const hasConflict = targets.some((t) => t.conflict);
      const disabled = state.online === 'off' || fixed < 4 || hasConflict;
      const inputCls = 'h-10 w-full rounded-xl border border-slate-200 bg-white px-3 text-[16px] text-slate-900 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100';

      return `
        <div class="mx-auto w-full max-w-[640px] space-y-3.5 px-4 pb-6 pt-4">
          <div class="rounded-xl border border-indigo-100 bg-indigo-50/70 px-3.5 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900">
            1v1 固定位四周一轮：系统在单一事务内原子校验连续 4 周目标时段，任意一周冲突则整体阻断（409 SCHEDULE_SLOT_CONFLICT）。
          </div>

          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <h2 class="text-[16px] font-bold text-slate-900">学员与资产</h2>
            <div class="mt-2.5">
              <label for="batchStudent" class="mb-1 block text-[12px] font-medium text-slate-500">学员档案</label>
              <select id="batchStudent" class="${inputCls}">
                ${['alice', 'charlie', 'bob'].map((k) => {
                  const s = studentByKey(k);
                  return `<option value="${k}" ${b.studentKey === k ? 'selected' : ''}>${esc(s.name)} · ${esc(s.tag)}</option>`;
                }).join('')}
              </select>
            </div>
            <div class="mt-2 grid grid-cols-3 divide-x divide-slate-100 rounded-xl bg-slate-50 py-2.5 text-center">
              <div><div class="text-[16px] font-bold ${fixed >= 4 ? 'text-emerald-600' : 'text-rose-600'}">${fixed} 节</div><div class="mt-0.5 text-[12px] font-medium text-slate-400">固定位 TS</div></div>
              <div><div class="text-[16px] font-bold text-slate-900">4 节</div><div class="mt-0.5 text-[12px] font-medium text-slate-400">本次消耗</div></div>
              <div><div class="text-[16px] font-bold text-slate-900">David</div><div class="mt-0.5 text-[12px] font-medium text-slate-400">授课教师</div></div>
            </div>
            ${fixed < 4 ? '<p class="mt-2 text-[12px] font-medium text-rose-600">该学员固定位待排期 TS 不足 4 节，提交按钮已置灰阻断。</p>' : ''}
          </section>

          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <h2 class="text-[16px] font-bold text-slate-900">上课时间</h2>
            <div class="mt-2.5 space-y-2.5">
              <div>
                <div class="mb-1 text-[12px] font-medium text-slate-500">起始周</div>
                <div class="flex gap-1.5">
                  ${[[0, '本周 (11-09)'], [1, '下周 (11-16)']].map(([v, label]) => `<button data-action="batch-start" data-value="${v}" class="h-8 flex-1 rounded-lg border text-[12px] font-bold ${b.startWeek === v ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-600'}">${label}</button>`).join('')}
                </div>
              </div>
              <div>
                <div class="mb-1 text-[12px] font-medium text-slate-500">周几</div>
                <div class="grid grid-cols-7 gap-1">
                  ${DAY_LABELS.map((d, i) => `<button data-action="batch-weekday" data-value="${i}" class="h-8 rounded-lg border text-[12px] font-bold ${b.weekday === i ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-600'}">${d.slice(1)}</button>`).join('')}
                </div>
              </div>
              <div>
                <label for="batchTime" class="mb-1 block text-[12px] font-medium text-slate-500">授课时段（30 分钟格）</label>
                <select id="batchTime" class="${inputCls} font-mono">
                  ${TIME_SLOTS.map((t) => `<option value="${t}" ${b.time === t ? 'selected' : ''}>${t} - ${endTime(t, 1)}</option>`).join('')}
                </select>
              </div>
            </div>
          </section>

          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <div class="flex items-center justify-between gap-2">
              <h2 class="text-[16px] font-bold text-slate-900">未来 4 周预检</h2>
              <span class="text-[12px] font-medium ${hasConflict ? 'text-rose-600' : 'text-emerald-600'}">${hasConflict ? '存在冲突' : '全部空闲'}</span>
            </div>
            <div class="mt-2.5 space-y-1.5">
              ${targets.map((t) => `
                <div class="flex items-center justify-between gap-2 rounded-xl border px-3 py-2 ${t.conflict ? 'border-rose-200 bg-rose-50' : 'border-emerald-200 bg-emerald-50'}">
                  <div class="min-w-0">
                    <div class="text-[14px] font-bold ${t.conflict ? 'text-rose-700' : 'text-emerald-700'}">第 ${t.weekNo} 周 · ${dateLabel(t.iso)} ${weekdayLabel(t.iso)}</div>
                    <div class="mt-0.5 truncate text-[12px] font-medium ${t.conflict ? 'text-rose-600' : 'text-emerald-600'}">${t.conflict || '空闲可锁定'}</div>
                  </div>
                  <span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${t.conflict ? 'border-rose-200 bg-white text-rose-600' : 'border-emerald-200 bg-white text-emerald-600'}">${t.conflict ? '冲突' : '空闲'}</span>
                </div>`).join('')}
            </div>
            <label class="mt-2.5 flex items-center justify-between gap-3 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2">
              <span class="text-[12px] font-medium text-slate-600">模拟第 3 周冲突（演示 409 阻断）</span>
              <input id="simulateBatchConflict" type="checkbox" ${b.simulate ? 'checked' : ''} class="h-4 w-4 shrink-0 accent-rose-600">
            </label>
          </section>

          <button data-action="submit-batch" ${disabled ? 'disabled' : ''} class="h-12 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认批量排满四周 · 扣减 4 节固定位 TS</button>
          ${state.online === 'off' ? '<p class="text-center text-[12px] font-medium text-amber-700">离线只读，排课提交已禁用</p>' : ''}
          ${hasConflict && fixed >= 4 && state.online === 'on' ? '<p class="text-center text-[12px] font-medium text-rose-600">存在冲突周，请更换时段或协调挪位后重试。</p>' : ''}
        </div>`;
    }

    function submitBatch() {
      if (state.online === 'off') return showToast('离线只读，暂不可排课', true);
      const b = state.batch;
      const targets = batchTargets();
      if ((state.fixed[b.studentKey] || 0) < 4) return showToast('固定位待排期 TS 不足 4 节', true);
      if (targets.some((t) => t.conflict)) return showToast('存在冲突周，事务已回滚（409）', true);

      const student = studentByKey(b.studentKey);
      targets.forEach((t) => {
        const week = state.weeks['david'][String(t.offset)];
        const cell = week.cells[t.iso][b.time];
        cell.status = 'ORANGE';
        cell.student = student.name;
        cell.teacherId = 'david';
        cell.orderId = newId('ord');
        cell.tsId = newId('ts');
        cell.holder = 'Leo';
      });
      state.fixed[b.studentKey] -= 4;
      state.teacherId = 'david';
      state.weekOffset = b.startWeek;
      state.page = 'schedule';
      state.navTab = 'schedule';
      renderAll();
      showToast(`固定位已排满 4 周 · ${targets.map((t) => dateLabel(t.iso)).join(' / ')} · 扣减 4 节 TS`);
    }

    /* ------------------------------------------------------------------
     * 小班课双格排课
     * ------------------------------------------------------------------ */
    function smallTargets() {
      const s = state.small;
      const cls = classById(s.classId);
      const week = state.weeks[cls.teacherId][String(s.startWeek)];
      const day = week.days[s.weekday];
      const idx = TIME_SLOTS.indexOf(s.time);
      const next = idx >= 0 && idx + 1 < TIME_SLOTS.length ? TIME_SLOTS[idx + 1] : null;
      const first = idx >= 0 ? week.cells[day.iso][s.time] : null;
      const second = next ? week.cells[day.iso][next] : null;
      let conflict = '';
      if (!next) conflict = '23:30 无法再连续占用第 2 格';
      else if (first.status !== 'GREEN') conflict = `第 1 格：${statusConflictLabel(first.status)}`;
      else if (second.status !== 'GREEN') conflict = `第 2 格：${statusConflictLabel(second.status)}`;
      return { cls, week, day, next, first, second, conflict };
    }

    function renderSmallGroup() {
      const s = state.small;
      const t = smallTargets();
      const disabled = state.online === 'off' || !!t.conflict;
      const inputCls = 'h-10 w-full rounded-xl border border-slate-200 bg-white px-3 text-[16px] text-slate-900 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100';

      return `
        <div class="mx-auto w-full max-w-[640px] space-y-3.5 px-4 pb-6 pt-4">
          <div class="rounded-xl border border-indigo-100 bg-indigo-50/70 px-3.5 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900">
            小班课采用班级独立运营核算，连续占用 2 个 30 分钟单元格（授课 50 分钟 + 课间 10 分钟），全班统一生效。
          </div>

          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <h2 class="text-[16px] font-bold text-slate-900">目标班级</h2>
            <div class="mt-2.5">
              <label for="smallClass" class="mb-1 block text-[12px] font-medium text-slate-500">班级</label>
              <select id="smallClass" class="${inputCls}">
                ${CLASSES.map((c) => `<option value="${c.id}" ${s.classId === c.id ? 'selected' : ''}>${esc(c.name)} · ${c.size} 人 · ${teacherById(c.teacherId).name}</option>`).join('')}
              </select>
            </div>
            <div class="mt-2 grid grid-cols-3 divide-x divide-slate-100 rounded-xl bg-slate-50 py-2.5 text-center">
              <div><div class="text-[16px] font-bold text-slate-900">${esc(teacherById(t.cls.teacherId).name.split(' ')[0])}</div><div class="mt-0.5 text-[12px] font-medium text-slate-400">授课教师</div></div>
              <div><div class="text-[16px] font-bold text-slate-900">${t.cls.size} 人</div><div class="mt-0.5 text-[12px] font-medium text-slate-400">全班名册</div></div>
              <div><div class="text-[16px] font-bold text-slate-900">2 格</div><div class="mt-0.5 text-[12px] font-medium text-slate-400">连续占用</div></div>
            </div>
          </section>

          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <h2 class="text-[16px] font-bold text-slate-900">排课时间</h2>
            <div class="mt-2.5 space-y-2.5">
              <div>
                <div class="mb-1 text-[12px] font-medium text-slate-500">起始周</div>
                <div class="flex gap-1.5">
                  ${[[0, '本周 (11-09)'], [1, '下周 (11-16)']].map(([v, label]) => `<button data-action="small-start" data-value="${v}" class="h-8 flex-1 rounded-lg border text-[12px] font-bold ${s.startWeek === v ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-600'}">${label}</button>`).join('')}
                </div>
              </div>
              <div>
                <div class="mb-1 text-[12px] font-medium text-slate-500">周几</div>
                <div class="grid grid-cols-7 gap-1">
                  ${DAY_LABELS.map((d, i) => `<button data-action="small-weekday" data-value="${i}" class="h-8 rounded-lg border text-[12px] font-bold ${s.weekday === i ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-600'}">${d.slice(1)}</button>`).join('')}
                </div>
              </div>
              <div>
                <label for="smallTime" class="mb-1 block text-[12px] font-medium text-slate-500">起始时段（自动连续 2 格）</label>
                <select id="smallTime" class="${inputCls} font-mono">
                  ${TIME_SLOTS.map((time) => `<option value="${time}" ${s.time === time ? 'selected' : ''}>${time} - ${endTime(time, 2)}</option>`).join('')}
                </select>
              </div>
            </div>
          </section>

          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <div class="flex items-center justify-between gap-2">
              <h2 class="text-[16px] font-bold text-slate-900">双格预检</h2>
              <span class="text-[12px] font-medium ${t.conflict ? 'text-rose-600' : 'text-emerald-600'}">${t.conflict || '连续 2 格空闲'}</span>
            </div>
            <div class="mt-2.5 grid grid-cols-2 gap-2">
              ${[t.first, t.second].map((cell, i) => {
                if (!cell) return `<div class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-3 text-center text-[12px] font-medium text-rose-600">第 ${i + 1} 格不可用</div>`;
                const cfg = COLOR[cell.status];
                return `<div class="rounded-xl border ${cfg.cls} px-3 py-3 text-center">
                  <div class="text-[12px] font-bold">第 ${i + 1} 格 · ${TIME_SLOTS[TIME_SLOTS.indexOf(s.time) + i]}</div>
                  <div class="mt-1 text-[14px] font-bold">${cfg.name}</div>
                </div>`;
              }).join('')}
            </div>
            <div class="mt-2 flex items-center justify-between rounded-xl bg-slate-50 px-3 py-2 text-[12px] font-medium text-slate-500">
              <span>${dateLabel(t.day.iso)} ${weekdayLabel(t.day.iso)} · ${s.time} - ${t.next ? endTime(t.next, 1) : '—'}</span>
              <span class="font-mono">50m + 10m</span>
            </div>
          </section>

          <button data-action="submit-small" ${disabled ? 'disabled' : ''} class="h-12 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认整班排定连续 2 格</button>
          ${t.conflict ? `<p class="text-center text-[12px] font-medium text-rose-600">${esc(t.conflict)}，请更换时段。</p>` : ''}
          ${state.online === 'off' ? '<p class="text-center text-[12px] font-medium text-amber-700">离线只读，排课提交已禁用</p>' : ''}
        </div>`;
    }

    function submitSmall() {
      if (state.online === 'off') return showToast('离线只读，暂不可排课', true);
      const t = smallTargets();
      if (t.conflict) return showToast(`排课冲突：${t.conflict}`, true);
      t.first.status = 'ORANGE';
      t.first.className = t.cls.name;
      t.first.classId = t.cls.id;
      t.first.teacherId = t.cls.teacherId;
      t.second.status = 'ORANGE';
      t.second.className = t.cls.name;
      t.second.classId = t.cls.id;
      t.second.teacherId = t.cls.teacherId;
      state.teacherId = t.cls.teacherId;
      state.weekOffset = state.small.startWeek;
      state.page = 'schedule';
      state.navTab = 'schedule';
      renderAll();
      showToast(`整班已排定 · ${t.cls.name} · ${dateLabel(t.day.iso)} ${weekdayLabel(t.day.iso)} ${state.small.time} - ${endTime(state.small.time, 2)}`);
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'close-overlay') { state.overlay = null; state.booking = null; renderOverlay(); lucide.createIcons(); return; }
      if (action === 'cell') return onCellClick(el.dataset.day, el.dataset.time);
      if (action === 'week-prev') {
        if (state.weekOffset <= -12) return showToast('已到日历最早可浏览周（前后各 12 周）');
        state.weekOffset -= 1; renderAll(); return;
      }
      if (action === 'week-next') {
        if (state.weekOffset >= 12) return showToast('已到日历最晚可浏览周（前后各 12 周）');
        state.weekOffset += 1; renderAll(); return;
      }
      if (action === 'cycle-prev') {
        if (state.weekOffset <= -12) return showToast('已到最早一轮');
        state.weekOffset = Math.max(-12, state.weekOffset - 4); renderAll(); return;
      }
      if (action === 'cycle-next') {
        if (state.weekOffset >= 12) return showToast('已到最晚一轮');
        state.weekOffset = Math.min(12, state.weekOffset + 4); renderAll(); return;
      }
      if (action === 'week-goto') {
        state.weekOffset = Math.max(-12, Math.min(12, Number(el.dataset.offset) || 0));
        renderAll(); return;
      }
      if (action === 'week-current') { state.weekOffset = 0; renderAll(); return; }
      if (action === 'open-teacher-sheet') {
        state.teacherQuery = '';
        state.overlay = { type: 'teacher' };
        renderOverlay();
        lucide.createIcons();
        return;
      }
      if (action === 'set-teacher') {
        if (state.role === 'monitor' && !isManagedTeacher(el.dataset.id)) {
          showToast('越权阻断：该教师非本班长管辖', true);
          return;
        }
        state.teacherId = el.dataset.id;
        state.overlay = null;
        renderAll();
        return;
      }
      if (action === 'set-child') { state.child = el.dataset.key; renderAll(); return; }
      if (action === 'parent-view') { state.parentView = el.dataset.view; renderAll(); return; }
      if (action === 'toggle-gap') {
        const key = el.dataset.key;
        if (state.expandedGaps.has(key)) state.expandedGaps.delete(key);
        else state.expandedGaps.add(key);
        renderContentOnly();
        return;
      }
      if (action === 'toggle-full-day') {
        state.fullDay = !state.fullDay;
        state.expandedGaps = new Set();
        renderContentOnly();
        return;
      }
      if (action === 'agenda-open') {
        state.teacherId = el.dataset.teacher;
        state.overlay = { type: 'cell', day: el.dataset.day, time: el.dataset.time };
        renderAll();
        return;
      }
      if (action === 'open-availability') { state.page = 'availability'; state.availTeacher = state.teacherId; state.overlay = null; renderAll(); return; }
      if (action === 'open-batch') { state.page = 'batch'; state.overlay = null; renderAll(); return; }
      if (action === 'open-smallgroup') { state.page = 'smallgroup'; state.overlay = null; renderAll(); return; }
      if (action === 'go-schedule') { state.page = 'schedule'; state.navTab = 'schedule'; state.overlay = null; renderAll(); return; }
      if (action === 'set-avail-teacher') {
        if (state.role === 'monitor' && !isManagedTeacher(el.dataset.id)) {
          showToast('越权阻断：该教师非本班长管辖', true);
          return;
        }
        state.availTeacher = el.dataset.id;
        renderContentOnly();
        return;
      }
      if (action === 'toggle-avail') return toggleAvail(el, Number(el.dataset.day), el.dataset.time);
      if (action === 'avail-preset') return applyPreset(el.dataset.preset);
      if (action === 'save-availability') return saveAvailability();
      if (action === 'avail-fold') {
        if (el.dataset.fold === 'early') state.availExpandEarly = !state.availExpandEarly;
        else state.availExpandLate = !state.availExpandLate;
        renderContentOnly();
        return;
      }
      if (action === 'booking-mode') { state.booking.mode = el.dataset.mode; renderOverlay(); lucide.createIcons(); return; }
      if (action === 'proxy-student') {
        state.booking.studentKey = el.dataset.key;
        state.booking.count = 1;
        state.monitorStudentKey = el.dataset.key;
        renderOverlay();
        lucide.createIcons();
        return;
      }
      if (action === 'fixed-teacher') { state.booking.fixed.teacherId = el.dataset.id; renderOverlay(); lucide.createIcons(); return; }
      if (action === 'fixed-start') { state.booking.fixed.startWeek = Number(el.dataset.value); renderOverlay(); lucide.createIcons(); return; }
      if (action === 'fixed-weekday') { state.booking.fixed.weekday = Number(el.dataset.value); renderOverlay(); lucide.createIcons(); return; }
      if (action === 'book-count') { state.booking.count = Number(el.dataset.count); renderOverlay(); lucide.createIcons(); return; }
      if (action === 'confirm-book') return confirmBooking();
      if (action === 'confirm-fixed') return confirmFixedBooking();
      if (action === 'book-from-detail') { const day = el.dataset.day; const time = el.dataset.time; state.overlay = null; return openBooking(day, time); }
      if (action === 'batch-start') { state.batch.startWeek = Number(el.dataset.value); renderContentOnly(); return; }
      if (action === 'batch-weekday') { state.batch.weekday = Number(el.dataset.value); renderContentOnly(); return; }
      if (action === 'submit-batch') return submitBatch();
      if (action === 'small-start') { state.small.startWeek = Number(el.dataset.value); renderContentOnly(); return; }
      if (action === 'small-weekday') { state.small.weekday = Number(el.dataset.value); renderContentOnly(); return; }
      if (action === 'submit-small') return submitSmall();
    });

    document.getElementById('frame').addEventListener('input', (e) => {
      if (e.target.id === 'proxyStudentSearch' && state.booking) {
        state.booking.search = e.target.value;
        const box = document.getElementById('proxyStudentResults');
        if (box) box.innerHTML = proxyStudentResultsHtml();
        lucide.createIcons();
      }
      if (e.target.id === 'teacherSearch') {
        state.teacherQuery = e.target.value;
        renderOverlay();
        lucide.createIcons();
        const input = document.getElementById('teacherSearch');
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'fixedTime' && state.booking) {
        state.booking.fixed.time = e.target.value;
        renderOverlay();
        lucide.createIcons();
        return;
      }
      if (id === 'fixedSuppressHold' && state.booking) {
        state.booking.fixed.suppressHold = e.target.checked;
        return;
      }
      if (id === 'bookingStudent') {
        state.booking.studentKey = e.target.value;
        state.booking.count = 1;
        renderOverlay(); lucide.createIcons();
        return;
      }
      if (id === 'simulateConflict') { state.booking.simulate = e.target.checked; return; }
      if (id === 'batchStudent') { state.batch.studentKey = e.target.value; renderContentOnly(); return; }
      if (id === 'batchTime') { state.batch.time = e.target.value; renderContentOnly(); return; }
      if (id === 'simulateBatchConflict') { state.batch.simulate = e.target.checked; renderContentOnly(); return; }
      if (id === 'smallClass') {
        const cls = classById(e.target.value);
        state.small.classId = cls.id;
        state.small.weekday = cls.weekday;
        state.small.time = cls.time;
        renderContentOnly();
        return;
      }
      if (id === 'smallTime') { state.small.time = e.target.value; renderContentOnly(); return; }
    });

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.className = `pointer-events-none absolute bottom-24 left-1/2 z-[100] w-max max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl px-4 py-2 text-center text-[12px] font-semibold leading-relaxed text-white shadow-xl ${isError ? 'bg-rose-600/95' : 'bg-slate-900/90'}`;
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.add('hidden'), 2800);
    }

    renderAll();
  </script>
</body>
</html>

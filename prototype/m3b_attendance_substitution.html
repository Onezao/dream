      if (lesson.status === 'PENDING') return chip('已退回待排期', 'slate');

      return ['SCHEDULED', 'SUBSTITUTED', 'LEAVE_PENDING'].includes(lesson.status);

      return !!lesson && (lesson.group === true || lesson.type === 'group');

      return !!lesson && ['COMPLETED', 'COMPENSATED'].includes(lesson.status);

    function cellPairOf(lesson) {
      if (!lesson || isGroupLesson(lesson) || isClosedLesson(lesson)) return null;
      const other = state.lessons.find((item) => item.id !== lesson.id
        && item.studentKey === lesson.studentKey
        && item.teacher === lesson.teacher
        && item.date === lesson.date
        && item.type === lesson.type
        && isActiveLesson(item));
      if (!other) return null;
      const ordered = lesson.time < other.time ? [lesson, other] : [other, lesson];
      if (addMinutes(ordered[0].time, 30) !== ordered[1].time) return null;
      return ordered;
    }

      const pair = cellPairOf(lesson);
      if (!pair || !state.cellScope.nextSelected) return [lesson];
      const other = pair.find((item) => item.id !== lesson.id);
      return other ? [lesson, other] : [lesson];

      return lessons.length > 1

      return `${date.slice(5)} ${time}`;

    /* ------------------------------------------------------------------
     * 同师挪位：目标时段与防撞课
     * ------------------------------------------------------------------ */
    function buildTargets(lesson) {
      const origin = originTeacherOf(lesson);
      const pool = TEACHER_TARGETS[origin] || TEACHER_TARGETS['David Miller'];
      return pool.filter((t) => !(t.date === lesson.date && t.time === lesson.time)).map((target) => {
        const conflict = studentConflictAt(lesson, target.date, target.time, [lesson.id]);
        return { ...target, conflict: conflict ? '学员该时段已有其他课程' : '' };
      });
    }

    function studentConflictAt(lesson, date, time, excludeIds = []) {
      if (!lesson.studentKey) return null;
      return state.lessons.find((other) => !excludeIds.includes(other.id)
        && other.id !== lesson.id
        && other.studentKey === lesson.studentKey
        && other.date === date
        && other.time === time
        && ['SCHEDULED', 'SUBSTITUTED', 'LEAVE_PENDING'].includes(other.status)) || null;
    }

    function buildPairTargets(lesson, other) {
      const origin = originTeacherOf(lesson);
      const pool = TEACHER_TARGETS[origin] || TEACHER_TARGETS['David Miller'];
      const current = new Set([`${lesson.date} ${lesson.time}`, `${other.date} ${other.time}`]);
      const excludeIds = [lesson.id, other.id];
      return pool.filter((target) => {
        if (current.has(`${target.date} ${target.time}`)) return false;
        return !!pool.find((item) => item.date === target.date && item.time === addMinutes(target.time, 30));
      }).map((target) => {
        const secondTime = addMinutes(target.time, 30);
        const conflict = studentConflictAt(lesson, target.date, target.time, excludeIds)
          || studentConflictAt(lesson, target.date, secondTime, excludeIds);
        return { ...target, secondTime, conflict: conflict ? '学员该时段已有其他课程' : '' };
      });
    }

    function renderRescheduleSheet() {
      const lessonId = state.overlay.lessonId || (state.picker && state.picker.lessonId);
      const lesson = lessonById(lessonId);
      if (!lesson) return '';
      const origin = originTeacherOf(lesson);
      const scopeLessons = ((state.picker && state.picker.scopeIds) || [lessonId]).map(lessonById).filter(Boolean);
      const pairTargets = scopeLessons.length > 1 ? buildPairTargets(lesson, scopeLessons.find((item) => item.id !== lesson.id)) : null;
      const targets = pairTargets || buildTargets(lesson);
      const selected = state.picker ? state.picker.selectedKey : null;
      const taskId = state.picker ? state.picker.taskId : null;
      const scopeText = scopeLessons.length > 1 ? `连堂 ${scopeLessons.length} 节` : '单节';
      return sheetShell(`
        ${modalHeader('同师挪位', `${lesson.student} · 原任老师 ${origin} · ${scopeText}`)}
        <div class="mt-2.5 rounded-xl border border-indigo-200 bg-indigo-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-indigo-900">
          目标时段限定为 ${esc(origin)} 的空闲格；学员在同一时间已在其他老师处有课的时段已置灰，点击不会落盘。${scopeLessons.length > 1 ? ` 连堂 2 节将按相邻 30min 一并平移。` : ''}
        </div>
        <div class="mt-3 space-y-1.5">
          ${targets.length ? targets.map((target) => {
            const on = selected === target.key;
            const blocked = !!target.conflict;
            return `<button data-action="select-target" data-key="${target.key}" data-conflict="${blocked ? 'true' : 'false'}" ${blocked ? 'aria-label="学员该时段已有其他课程"' : ''} class="flex w-full items-center justify-between gap-2 rounded-xl border px-3 py-2.5 text-left transition ${blocked ? 'cursor-not-allowed border-slate-200 bg-slate-100 opacity-60' : on ? 'border-indigo-400 bg-indigo-50' : 'border-slate-200 bg-white hover:border-indigo-300'}">
              <span class="min-w-0">
                <span class="block text-[14px] font-bold ${blocked ? 'text-slate-600' : on ? 'text-indigo-900' : 'text-slate-900'}">${fmtDate(target.date)} · ${target.time} - ${endTime(target.secondTime || target.time)}</span>
                <span class="mt-0.5 block text-[12px] font-medium text-slate-600">${blocked ? esc(target.conflict) : `${esc(origin)} · 空闲可约${target.secondTime ? ' · 连堂双格' : ''}`}</span>
              </span>
              <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${blocked ? 'border-slate-300 bg-slate-200 text-slate-500' : on ? 'border-indigo-500 bg-indigo-600 text-white' : 'border-slate-300 bg-white text-transparent'}">${icon(blocked ? 'lock' : 'check', 'h-3 w-3')}</span>
            </button>`;
          }).join('') : `<div class="rounded-xl border border-dashed border-slate-300 bg-slate-50/60 px-3 py-4 text-center text-[12px] font-medium text-slate-600">该老师的空闲时段暂不支持连堂双格平移，请取消连带操作后逐节处理。</div>`}
        </div>
        ${state.hours < 3 ? `<div class="mt-2">${amberNote('距开课不足 3 小时', '确认挪位时会弹温和提示，点击确认后直接放行。')}</div>` : ''}
        <div class="mt-4 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800">取消</button>

        </div>
      `);

    function renderStudentLeaveChoice() {

      return modalShell(`
        <div class="flex items-start gap-3">
          <div class="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-rose-100 text-rose-700">${icon('clock-3', 'h-5 w-5')}</div>
          <div class="min-w-0">
            <h2 class="text-[16px] font-bold text-slate-900">临期代请假确认</h2>
            <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-700">距开课不足 3 小时，老师可能已进入备课状态，请确认已与老师沟通</p>

        </div>
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50/70 px-3 py-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="min-w-0 truncate text-[14px] font-bold text-slate-900">${esc(lesson.student)}</span>
            ${chip('学员侧备查', 'slate')}
          </div>
          <div class="mt-1.5 grid grid-cols-2 gap-1.5">
            <div class="rounded-lg bg-white px-2.5 py-2 ring-1 ring-slate-200">
              <div class="text-[18px] font-bold text-slate-900">${stats.leave}<span class="ml-1 text-[12px] font-medium text-slate-600">次</span></div>
              <div class="text-[12px] font-medium text-slate-600">近 30 天请假</div>
            </div>
            <div class="rounded-lg bg-white px-2.5 py-2 ring-1 ring-amber-200">
              <div class="text-[18px] font-bold text-amber-800">${stats.late}<span class="ml-1 text-[12px] font-medium text-slate-600">次</span></div>
              <div class="text-[12px] font-medium text-slate-600">近 30 天临期变动</div>
            </div>
          </div>
          <div class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-600">记录仅归入学员侧统计，不计入老师非常规次数。</div>
        </div>
        <div class="mt-3 space-y-1.5">
          <button data-action="student-leave-lenient" class="flex w-full items-start gap-2.5 rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-left transition hover:bg-slate-50 active:bg-slate-100">
            <span class="mt-0.5 grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-emerald-100 text-emerald-700">${icon('undo-2', 'h-4 w-4')}</span>
            <span class="min-w-0 flex-1">
              <span class="block text-[14px] font-bold text-slate-900">通融退回待排期</span>
              <span class="mt-0.5 block text-[12px] font-medium leading-relaxed text-slate-600">不扣学员课次、不发老师课酬；原课次退回待排期。</span>
            </span>
          </button>
          <button data-action="student-leave-absent" class="flex w-full items-start gap-2.5 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-left transition hover:bg-rose-100 active:bg-rose-200/60">
            <span class="mt-0.5 grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-rose-100 text-rose-700">${icon('user-x', 'h-4 w-4')}</span>
            <span class="min-w-0 flex-1">
              <span class="block text-[14px] font-bold text-rose-900">按学员旷课扣 1 节</span>
              <span class="mt-0.5 block text-[12px] font-medium leading-relaxed text-rose-900/90">照常扣减学员 1 节课次，老师正常获得该节课酬。</span>
            </span>
          </button>
        </div>
        <button data-action="cancel-student-leave" class="mt-3 h-11 w-full rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800">返回</button>
      `, 'max-w-[360px]');
    }

    /* ------------------------------------------------------------------
     * 更换实际上课学员
     * ------------------------------------------------------------------ */
    function renderChangeStudentSheet() {
      const draft = state.changeStudent;
      const lesson = lessonById(draft.lessonId);
      if (!lesson) return '';
      const query = draft.query || '';
      const normalized = String(query).trim().toLowerCase();
      const scopeLessons = (draft.lessonIds || [lesson.id]).map(lessonById).filter(Boolean);
      const candidates = STUDENTS.filter((s) => s.key !== lesson.studentKey
        && (!normalized || `${s.name} ${s.nickname} ${s.tag}`.toLowerCase().indexOf(normalized) !== -1));
      return sheetShell(`
        ${modalHeader('更换实际上课学员', `${lesson.student} · ${scopeLessons.length > 1 ? `本次范围 ${scopeRangeLabel(scopeLessons)}` : `${fmtDate(lesson.date)} ${lesson.time}`}`)}
        <div class="mt-2.5 rounded-xl border border-slate-200 bg-slate-50/70 px-3 py-2">
          ${infoRow('原购课单', lesson.order)}
          ${infoRow('出资人', `${lesson.payer} · 资金归属不变`)}
          ${infoRow('当前学员', lesson.student)}
        </div>
        <div class="mt-2">${neutralNote('资金与单据保持不变', '仅变更该课次的实际授课学员档案；原购课单金额、出资人与资金持有人不变。线下家长结算由双方自行完成，例如微信转账。', 'shield-check')}</div>
        <div class="relative mt-3">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
          <input id="studentSearch" value="${esc(query)}" placeholder="按姓名或规范昵称检索" class="h-11 w-full rounded-xl border border-slate-300 bg-white pl-9 pr-3 text-[16px] font-medium text-slate-900 outline-none focus:border-indigo-500" autocomplete="off">
        </div>
        <div class="mt-2 max-h-56 space-y-1.5 overflow-y-auto">
          ${candidates.map((student) => {
            const on = draft.selected === student.key;
            const search = `${student.name} ${student.nickname} ${student.tag}`.toLowerCase();
            return `<button data-action="pick-student" data-key="${student.key}" data-student-row data-search="${esc(search)}" class="flex w-full items-center justify-between gap-2 rounded-xl border px-3 py-2.5 text-left transition ${on ? 'border-indigo-400 bg-indigo-50' : 'border-slate-200 bg-white hover:border-indigo-300'}">
              <span class="min-w-0">
                <span class="block text-[14px] font-bold ${on ? 'text-indigo-900' : 'text-slate-900'}">${esc(student.name)} <span class="ml-1 text-[12px] font-semibold text-slate-600">${esc(student.nickname)}</span></span>
                <span class="mt-0.5 block text-[12px] font-medium text-slate-600">${esc(student.tag)} · ${esc(student.status)}</span>
              </span>
              <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-indigo-500 bg-indigo-600 text-white' : 'border-slate-300 bg-white text-transparent'}">${icon('check', 'h-3 w-3')}</span>
            </button>`;
          }).join('')}
        </div>
        <div id="studentEmpty" class="mt-2 ${candidates.length ? 'hidden' : ''} rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-center text-[12px] font-medium text-slate-600">没有匹配的学员，请换一个姓名或昵称。</div>
        <div class="mt-4 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800">取消</button>
          <button data-action="confirm-change" ${!draft.selected || state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white active:scale-[0.98] disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认更换</button>
        </div>
      `);
    }

    function filterStudentRows(input) {
      const query = String(input.value || '').trim().toLowerCase();
      let visible = 0;
      document.querySelectorAll('[data-student-row]').forEach((row) => {
        const match = !query || row.dataset.search.indexOf(query) !== -1;
        row.classList.toggle('hidden', !match);
        if (match) visible += 1;
      });
      const empty = document.getElementById('studentEmpty');
      if (empty) empty.classList.toggle('hidden', visible > 0);
      if (state.changeStudent) state.changeStudent.query = input.value;
    }

    /* ------------------------------------------------------------------
     * 课格动作抽屉
     * ------------------------------------------------------------------ */
    function renderCellSheet() {
      const lesson = lessonById(state.overlay.lessonId);
      if (!lesson) return '';
      if (state.cellView === 'leaveReschedule') return renderCellLeaveReschedule(lesson);
      if (state.cellView === 'assign') {
        if (isGroupLesson(lesson)) return renderCellGroupPanel(lesson);
        return renderAssignSubSheet();
      }
      if (state.cellView === 'attendance') return renderCellAttendancePanel(lesson);
      if (state.cellView === 'group') return renderCellGroupPanel(lesson);
      return renderCellMain(lesson);
    }

    function renderCellMain(lesson) {
      const meta = typeMeta(lesson.type);
      const group = isGroupLesson(lesson);
      const substituted = lesson.status === 'SUBSTITUTED';
      const closed = isClosedLesson(lesson);
      const completedUnsettled = lesson.status === 'COMPLETED' && lesson.settled === false;
      const settledClosed = closed && !completedUnsettled;
      const pair = cellPairOf(lesson);
      const scope = cellScopeLessons(lesson);
      const other = pair ? pair.find((item) => item.id !== lesson.id) : null;
      const otherAfter = other ? other.time > lesson.time : false;
      const origin = originTeacherOf(lesson);
      const status = lesson.status;
      return sheetShell(`
        ${modalHeader('课格动作', `${lesson.student} · ${fmtDate(lesson.date)}`)}
        <div data-cell-layer="1" class="mt-2.5 rounded-xl border border-slate-200 bg-slate-50/70 px-3 py-2.5">
          <div class="flex flex-wrap items-center gap-1.5">
            ${chip(group ? '[G] 小班' : meta.label, group ? 'teal' : meta.tone)}
            ${lesson.type === 'sub' && lesson.status === 'SUBSTITUTED' ? '' : lessonStatusChip(lesson)}
            ${pair ? chip('连堂 2 节', 'slate') : ''}
          </div>
          <div class="mt-1.5 text-[16px] font-bold leading-tight text-slate-900">${fmtDate(lesson.date)} · ${scopeRangeLabel(scope)}</div>
          ${substituted
            ? `<div class="mt-1 text-[14px] font-bold leading-snug text-blue-900">原任 ${esc(origin)} <span class="text-[12px] font-semibold text-blue-700">→ 代课 ${esc(lesson.subTeacher || '')}</span></div>`
            : `<div class="mt-1 text-[14px] font-bold leading-snug text-slate-900">${esc(lesson.teacher)}</div>`}
          ${group
            ? `<div class="mt-1 text-[12px] font-medium text-slate-600">小班 ${esc(lesson.size || CLASS_INFO.size)} · 连续 2 个 30min 格</div>`
            : `<div class="mt-1.5 flex flex-wrap items-center gap-1.5">
                <span class="min-w-0 truncate text-[12px] font-semibold text-slate-700">学员 ${esc(lessonStudentLabel(lesson))}</span>
                <button data-action="toast" data-message="打开学员档案" class="rounded-lg border border-slate-200 bg-white px-2 py-1 text-[12px] font-semibold text-slate-700 active:bg-slate-100">学员档案</button>
                <button data-action="toast" data-message="打开课次资产明细" class="rounded-lg border border-slate-200 bg-white px-2 py-1 text-[12px] font-semibold text-slate-700 active:bg-slate-100">课次资产</button>
              </div>`}
          <div class="mt-2 flex items-center justify-between gap-2 rounded-lg bg-white px-2.5 py-2 ring-1 ring-slate-200">
            <div class="min-w-0">
              <div class="text-[12px] font-medium text-slate-600">ClassIn 教室</div>
              <div class="truncate text-[14px] font-bold text-slate-900">${esc(lesson.room)}</div>
            </div>
            <button data-action="copy-room" data-room="${esc(lesson.room)}" class="inline-flex h-8 shrink-0 items-center gap-1 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-800 active:bg-slate-100">${icon('copy', 'h-3.5 w-3.5')}复制</button>
          </div>
          ${substituted ? `<div class="mt-1.5 text-[12px] font-medium leading-relaxed text-blue-800">原任老师课格蓝色 SUBBED_OUT，代课老师课格紫色 SUBBED_IN。</div>` : ''}
          ${pair ? `<label class="mt-2 flex cursor-pointer items-start gap-2 rounded-lg border border-slate-200 bg-white px-2.5 py-2 transition active:bg-slate-50">
            <input type="checkbox" data-cell-scope ${state.cellScope.nextSelected ? 'checked' : ''} class="mt-0.5 h-4 w-4 shrink-0 accent-indigo-600">
            <span class="min-w-0 text-[12px] font-semibold leading-relaxed text-slate-700">连带操作${otherAfter ? '下一节' : '上一节'} ${other.time} - ${endTime(other.time)} (共 2 节)</span>
          </label>` : ''}
        </div>

        ${status === 'LEAVE_PENDING' ? `<div class="mt-2">${amberNote('原任老师已请假 · 待安排代课', '指派代课后原任老师课格变蓝、代课老师课格变紫。')}</div>` : ''}
        ${state.hours < 3 && !closed ? `<div class="mt-2">${amberNote('距开课不足 3 小时', '排课类动作仍可用；代学员请假需二选一，其余操作弹温和确认。')}</div>` : ''}

        <div data-cell-layer="2" class="mt-2.5">
          <div class="mb-1.5 flex items-center justify-between gap-2">
            <span class="text-[12px] font-bold text-slate-700">高频动作</span>
            <span class="truncate text-[12px] font-semibold text-slate-600">${scope.length > 1 ? `按 2 节生效 · ${scopeRangeLabel(scope)}` : group ? '连续双格生效' : '按 1 节生效'}</span>
          </div>
          <div class="grid grid-cols-2 gap-1.5">
            ${actionTile('cell-panel-leave', 'calendar-x', '请假 / 同师挪位', group ? '小班课请用代课 / 暂停待排' : scope.length > 1 ? '请假退期待排或同师平移，按 2 节生效' : '请假退期待排或同师平移', { tone: 'rose', disabled: group || closed, lockHint: group ? '小班课请用代课 / 暂停待排' : '已结课，排课类动作不可用' })}
            ${actionTile('cell-panel-assign', group ? 'repeat-2' : 'user-round-check', group ? '代课 / 暂停待排' : '指派代课', group ? '连续双格代课 / 暂停待排' : substituted ? `已由 ${lesson.subTeacher} 代课 · 可撤销或改派` : '智能筛师 · 熟客优先', { tone: 'purple', disabled: closed, lockHint: '已结课，排课类动作不可用' })}
            ${actionTile('cell-panel-attendance', 'clipboard-list', '考勤 / 旷课标记', closed ? '已结课 · 仅旷课误标纠偏' : '默认正常 · 次日 02:00 自动结课', { tone: 'amber', disabled: group || (closed && !completedUnsettled), lockHint: group ? '小班不记录单人考勤' : '已归集，考勤锁定' })}
            ${group ? '' : actionTile('cell-change', 'user-round-cog', '换上课学员', '1v1 专属 · 出资与资金归属不变', { tone: 'teal', disabled: closed, lockHint: '已结课，排课类动作不可用' })}
          </div>
        </div>

        <div data-cell-layer="3" class="mt-2.5">
          <div class="mb-1.5 text-[12px] font-bold text-slate-700">状态处置</div>
          ${(!closed && status !== 'PENDING' && status !== 'COMPENSATED') || completedUnsettled ? cellReasonField() : ''}
          ${!closed && status !== 'PENDING' && status !== 'COMPENSATED' ? `<button data-action="cell-withdraw" class="mt-2 h-10 w-full rounded-xl border border-rose-200 bg-rose-50 px-3 text-[14px] font-semibold text-rose-700 active:bg-rose-100 ${onlineCls()}">撤排退回课次</button>` : ''}
          ${completedUnsettled ? `<button data-action="cell-compensate" class="mt-2 h-10 w-full rounded-xl border border-amber-300 bg-amber-50 px-3 text-[14px] font-semibold text-amber-900 active:bg-amber-100 ${onlineCls()}">异常未上课回退补生</button>` : ''}
          ${settledClosed ? `<div class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-600">该课次已完成归集，不可回退补生。</div>` : ''}
          ${status === 'PENDING' || status === 'COMPENSATED' ? `<div class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-600">${status === 'PENDING' ? '该课次已退回待排期，无待执行动作。' : '该课次已回退补生，无待执行动作。'}</div>` : ''}
        </div>

        <button data-action="close-overlay" class="mt-3 h-11 w-full rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800">关闭</button>
      `);
    }

    function renderCellLeaveReschedule(lesson) {
      const scope = cellScopeLessons(lesson);
      const scopeIds = scope.map((item) => item.id).join(',');
      const pairLocked = scope.length > 1 && lesson.type === 'fixed';
      const stats = studentLeaveStats(lesson.studentKey);
      const substituted = lesson.status === 'SUBSTITUTED';
      return sheetShell(`
        ${cellPanelBack()}
        ${modalHeader('请假 / 同师挪位', `${lesson.student} · 本次范围 ${scopeRangeLabel(scope)}`)}
        <div class="mt-2 flex items-center justify-between gap-2 rounded-xl border border-indigo-100 bg-indigo-50 px-3 py-2">
          <span class="text-[12px] font-semibold text-indigo-900">${scope.length > 1 ? `按 2 节生效 · ${scopeRangeLabel(scope)}` : '按 1 节生效'}</span>
          ${chip(scope.length > 1 ? '连堂' : '单节', scope.length > 1 ? 'indigo' : 'slate')}
        </div>
        ${state.hours < 3 ? `<div class="mt-2">${amberNote('距开课不足 3 小时', '请假会弹出二选一：通融退回待排期 / 按学员旷课扣 1 节；同师挪位确认前弹温和提示。')}</div>
          <div class="mt-2 grid grid-cols-2 gap-1.5">
            <div class="rounded-xl border border-slate-200 bg-white px-2.5 py-2 text-center">
              <div class="text-[16px] font-bold text-slate-900">${stats.leave}<span class="ml-1 text-[12px] font-medium text-slate-600">次</span></div>
              <div class="text-[12px] font-medium text-slate-600">近 30 天请假</div>
            </div>
            <div class="rounded-xl border border-amber-200 bg-amber-50 px-2.5 py-2 text-center">
              <div class="text-[16px] font-bold text-amber-800">${stats.late}<span class="ml-1 text-[12px] font-medium text-slate-600">次</span></div>
              <div class="text-[12px] font-medium text-slate-600">近 30 天临期变动</div>
            </div>
          </div>` : neutralNote('班长端不锁', scope.length > 1 ? '请假或同师挪位将按 2 节生效；固定位连选仅支持单节请假。' : '请假与同师挪位随时可操作，不受家长端时间门槛限制。')}
        <div class="mt-2.5 space-y-1.5">
          ${actionRow('cell-leave', 'calendar-x', '请假退期待排', pairLocked ? '固定位连选 2 节仅支持单节请假，请取消连带操作' : state.hours < 3 ? '释放课格并退回待排期；临期弹出二选一处置' : '释放课格并退回待排期', { tone: 'rose', write: true, attrs: `data-id="${lesson.id}" data-scope="${scopeIds}"`, disabled: pairLocked, lockHint: '固定位连选 2 节仅支持单节请假，请取消连带操作' })}
          ${actionRow('cell-reschedule', 'calendar-range', '同师挪位', substituted ? '目标限定原任老师空闲格；挪位成功后自动解除原代课委任' : '目标限定原任老师空闲格，自动避开学员已有课程', { tone: 'indigo', write: true, attrs: `data-id="${lesson.id}" data-scope="${scopeIds}"` })}
        </div>
        <div class="mt-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-600">
          ${icon('info', 'mr-1 inline h-3.5 w-3.5 align-[-2px] text-slate-500')}固定位连选 2 节时请假置灰；取消摘要卡连选后可单节请假。同师挪位目标格撞课会置灰并提示。
        </div>
      `);
    }

    function renderCellAttendancePanel(lesson) {
      const scope = cellScopeLessons(lesson);
      const exception = lesson.exception;
      const misMarked = exception === '学员旷课' || exception === '老师旷课';
      const canRestore = misMarked && lesson.settled !== true;
      const normalText = isClosedLesson(lesson) ? '正常出勤（已自动结课）' : '正常（次日 02:00 自动结课）';
      return sheetShell(`
        ${cellPanelBack()}
        ${modalHeader('考勤 / 旷课标记', `${lesson.student} · 本次范围 ${scopeRangeLabel(scope)}`)}
        <div data-cell-panel="attendance" class="mt-2.5 rounded-xl border border-slate-200 bg-slate-50/70 px-3 py-2.5">
          <div class="flex flex-wrap items-center gap-1.5">
            ${chip(lesson.status === 'COMPLETED' ? '已结课' : '待结课', lesson.status === 'COMPLETED' ? 'emerald' : 'slate')}
            ${exception ? chip(exception, 'amber') : chip('正常', 'emerald')}
          </div>
          <div class="mt-1.5 text-[14px] font-bold text-slate-900">当前状态：${exception || normalText}</div>
          <div class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">日常无需手动点击正常出勤；系统次日 02:00 自动结课，正常扣减并计入老师课酬。</div>
        </div>
        ${cellReasonField()}
        <div class="mt-2.5 space-y-1.5">
          ${actionRow('cell-mark-student-absent', 'user-x', '标为学员旷课', '正常结课并扣减学员 1 节；老师课酬正常计入', { tone: 'rose', write: true })}
          ${actionRow('cell-mark-teacher-absent', 'user-round-x', '标为老师旷课', '退回待排期或补生 1 节；剔除老师该节课酬', { tone: 'amber', write: true })}
          ${canRestore ? actionRow('cell-restore-normal', 'undo-2', '恢复为正常出勤', '仅用于误标纠偏 · 该课次尚未完成周结算归集', { tone: 'emerald', write: true }) : ''}
        </div>
        <div class="mt-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-600">
          ${icon('shield-check', 'mr-1 inline h-3.5 w-3.5 align-[-2px] text-slate-500')}[恢复为正常出勤] 仅在已误标学员旷课或老师旷课、且尚未归集时出现；异常处置与纠偏须填写原因，提交后追加只读经办记录。
        </div>
      `);
    }

    function renderCellGroupPanel(lesson) {
      const draft = state.classDraft || { selected: null, query: '' };
      const query = String(draft.query || '').trim().toLowerCase();
      const eligible = CLASS_CANDIDATES
        .filter((c) => c.active && c.qualified && c.twoCells)
        .sort((a, b) => {
          if (a.taughtBefore !== b.taughtBefore) return a.taughtBefore ? -1 : 1;
          if (a.sameLevel !== b.sameLevel) return a.sameLevel ? -1 : 1;
          return a.load - b.load;
        });
      const ineligible = CLASS_CANDIDATES.filter((c) => !(c.active && c.qualified && c.twoCells));
      const visibleEligible = eligible.filter((c) => c.name.toLowerCase().includes(query));
      const visibleIneligible = ineligible.filter((c) => c.name.toLowerCase().includes(query));
      return sheetShell(`
        ${cellPanelBack()}
        ${modalHeader('代课 / 暂停待排', `${lesson.student} · ${fmtDate(lesson.date)} ${lesson.time}-${endTime(lesson.time, 60)}`)}
        <div class="mt-2 rounded-xl border border-teal-200 bg-teal-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-teal-900">
          路线 A：指派临时代课，自动筛出连续双格空闲且具备小班资质的老师，课酬按原班级快照平移。路线 B：暂停待排，TS 退回小班待排池并释放日历双格。
        </div>
        <div class="mt-2.5 rounded-xl border border-purple-200 bg-purple-50 px-3 py-2 text-[12px] font-bold text-purple-900">路线 A · 连续双格代课</div>
        <div class="relative mt-2">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
          <input id="teacherSearch" value="${esc(draft.query || '')}" placeholder="搜索老师姓名" class="h-11 w-full rounded-xl border border-slate-300 bg-white pl-9 pr-3 text-[16px] font-medium text-slate-900 outline-none focus:border-indigo-500">
        </div>
        <div class="mt-1.5 space-y-1.5">
          ${visibleEligible.map((candidate) => {
            const on = draft.selected === candidate.name;
            return `<button data-action="pick-class-sub" data-name="${esc(candidate.name)}" data-sub-row="${esc(candidate.name.toLowerCase())}" class="flex w-full items-center justify-between gap-2 rounded-xl border px-3 py-2.5 text-left transition ${on ? 'border-purple-400 bg-purple-50' : 'border-slate-200 bg-white hover:border-purple-300'}">
              <span class="min-w-0">
                <span class="block text-[14px] font-bold ${on ? 'text-purple-900' : 'text-slate-900'}">${esc(candidate.name)}</span>
                <span class="mt-0.5 block text-[12px] font-medium text-slate-600">${esc(candidate.note)} · 本周已排 ${candidate.load} 节</span>
              </span>
              <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-purple-500 bg-purple-600 text-white' : 'border-slate-300 bg-white text-transparent'}">${icon('check', 'h-3 w-3')}</span>
            </button>`;
          }).join('')}
          ${visibleIneligible.map((candidate) => `<div data-sub-row="${esc(candidate.name.toLowerCase())}" class="flex w-full items-center justify-between gap-2 rounded-xl border border-slate-200 bg-slate-100 px-3 py-2.5 opacity-70">
            <span class="min-w-0">
              <span class="block text-[14px] font-bold text-slate-600">${esc(candidate.name)}</span>
              <span class="mt-0.5 block text-[12px] font-medium text-slate-600">${esc(candidate.note)}</span>
            </span>
            <span class="shrink-0 rounded-full bg-white px-2 py-0.5 text-[12px] font-semibold text-slate-600 ring-1 ring-slate-200">不可选</span>
          </div>`).join('')}
          ${!visibleEligible.length && !visibleIneligible.length ? `<div id="teacherSearchEmpty" class="rounded-xl border border-dashed border-slate-300 bg-slate-50/60 px-3 py-4 text-center text-[12px] font-medium text-slate-600">没有匹配的老师，请更换姓名关键词。</div>` : '<div id="teacherSearchEmpty" class="hidden"></div>'}
        </div>
        <button data-action="confirm-class-sub" ${!draft.selected || state.online === 'off' ? 'disabled' : ''} class="mt-2 h-11 w-full rounded-xl bg-purple-600 text-[16px] font-semibold text-white active:scale-[0.98] disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认指派双格代课</button>
        <div class="mt-3 rounded-xl border border-slate-200 bg-white px-3 py-2.5">
          <div class="text-[14px] font-bold text-slate-900">路线 B · 暂停待排</div>
          <div class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">TS 退回小班待排池并释放双格；系统不向小班家长发送应用内通知。</div>
          <button data-action="cell-group-pause" data-id="${lesson.id}" class="mt-2 h-10 w-full rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 active:bg-slate-100 ${onlineCls()}">暂停待排</button>
          <button data-action="toast" data-message="进入补排入口，为小班补排单节" class="mt-1.5 h-10 w-full rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 active:bg-slate-100">补排入口</button>
        </div>
      `);
    }

    /* ------------------------------------------------------------------
     * 智能筛师：1v1 指派代课
     * ------------------------------------------------------------------ */
    function sortedSubCandidates() {
      return SUB_CANDIDATES
        .filter((c) => c.active && c.qualified && c.free)
        .sort((a, b) => {
          if (a.taughtBefore !== b.taughtBefore) return a.taughtBefore ? -1 : 1;
          if (a.sameLevel !== b.sameLevel) return a.sameLevel ? -1 : 1;
          return a.load - b.load;
        });
    }

    function renderAssignSubSheet() {
      const draft = state.assignSub;
      if (!draft) return '';
      const lesson = lessonById(draft.lessonId);
      if (!lesson) return '';
      const origin = originTeacherOf(lesson);
      const candidates = sortedSubCandidates();
      const ineligible = SUB_CANDIDATES.filter((c) => !(c.active && c.qualified && c.free));
      const scopeLessons = (draft.lessonIds || [lesson.id]).map(lessonById).filter(Boolean);
      const scopeText = scopeLessons.length > 1 ? `${scopeRangeLabel(scopeLessons)} · 同一老师连派` : '1 节';
      const substituted = lesson.status === 'SUBSTITUTED';
      const query = String(draft.query || '').trim().toLowerCase();
      const visibleEligible = candidates.filter((c) => c.name.toLowerCase().includes(query));
      const visibleIneligible = ineligible.filter((c) => c.name.toLowerCase().includes(query));
      return sheetShell(`
        ${draft.cell ? cellPanelBack() : ''}
        ${modalHeader('指派代课', `${lesson.student} · 本次范围 ${scopeText}`)}
        ${substituted ? `<div class="mt-2 rounded-xl border border-purple-200 bg-purple-50 px-3 py-2">
          <div class="text-[12px] font-semibold leading-relaxed text-purple-900">当前已由 ${esc(lesson.subTeacher || '代课老师')} 代课；可撤销后重新指派。</div>
          <button data-action="cell-revoke-sub" class="mt-2 h-10 w-full rounded-xl border border-rose-200 bg-white text-[14px] font-semibold text-rose-700 active:bg-rose-50 ${onlineCls()}">撤销代课指派</button>
        </div>` : ''}
        <div class="mt-2.5 rounded-xl border border-slate-200 bg-slate-50/70 px-3 py-2">
          ${infoRow('原任老师', origin)}
          ${infoRow('本次范围', scopeText)}
          ${task ? infoRow('请假原因', task.reason) : infoRow('当前状态', lesson.status === 'LEAVE_PENDING' ? '老师请假 · 待指派' : '临时调度')}
          ${infoRow('课程资质', lesson.courseware)}
        </div>
        <div class="mt-2 rounded-xl border border-purple-200 bg-purple-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-purple-900">
          仅在职、具备课程资质且目标时段全空闲的老师可选；按熟客优先 → 同定级 → 本周已排负荷排序。不符合条件者置灰并标注冲突原因。
        </div>
        <div class="relative mt-2.5">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
          <input id="teacherSearch" value="${esc(draft.query || '')}" placeholder="搜索老师姓名" class="h-11 w-full rounded-xl border border-slate-300 bg-white pl-9 pr-3 text-[16px] font-medium text-slate-900 outline-none focus:border-indigo-500">
        </div>
        ${state.hours < 3 ? `<div class="mt-2">${amberNote('距开课不足 3 小时', '确认指派时会弹温和提示，点击确认后立即生效。')}</div>` : ''}
        ${!visibleEligible.length && !query ? `<div class="mt-2 rounded-xl border border-amber-300 bg-amber-50/60 px-3 py-2 text-[12px] font-semibold leading-relaxed text-amber-900">当前没有覆盖全部所选时段的可选老师，建议减少连选节数并拆单指派。</div>` : ''}
        <div class="mt-3 space-y-1.5">
          ${visibleEligible.map((candidate) => {
            const on = draft.selected === candidate.name;
            const reasons = [];
            if (candidate.taughtBefore) reasons.push('教过该学员');
            if (candidate.sameLevel) reasons.push('同定级');
            reasons.push(`本周已排 ${candidate.load} 节`);
            return `<button data-action="pick-sub" data-name="${esc(candidate.name)}" data-sub-row="${esc(candidate.name.toLowerCase())}" class="flex w-full items-center justify-between gap-2 rounded-xl border px-3 py-2.5 text-left transition ${on ? 'border-purple-400 bg-purple-50' : 'border-slate-200 bg-white hover:border-purple-300'}">
              <span class="min-w-0">
                <span class="block text-[14px] font-bold ${on ? 'text-purple-900' : 'text-slate-900'}">${esc(candidate.name)} <span class="ml-1 rounded bg-slate-100 px-1 text-[12px] font-semibold text-slate-600">${esc(candidate.level)}</span></span>
                <span class="mt-0.5 block text-[12px] font-medium text-slate-600">${esc(candidate.note)}</span>
                <span class="mt-1 flex flex-wrap gap-1">${reasons.map((r) => chip(r, on ? 'purple' : 'slate')).join('')}</span>
              </span>
              <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-purple-500 bg-purple-600 text-white' : 'border-slate-300 bg-white text-transparent'}">${icon('check', 'h-3 w-3')}</span>
            </button>`;
          }).join('')}
          ${visibleIneligible.map((candidate) => `<div data-sub-row="${esc(candidate.name.toLowerCase())}" class="flex w-full items-center justify-between gap-2 rounded-xl border border-slate-200 bg-slate-100 px-3 py-2.5 opacity-70">
            <span class="min-w-0">
              <span class="block text-[14px] font-bold text-slate-600">${esc(candidate.name)} <span class="ml-1 rounded bg-white px-1 text-[12px] font-semibold text-slate-600">${esc(candidate.level)}</span></span>
              <span class="mt-0.5 block text-[12px] font-medium text-slate-600">${esc(candidate.note)} · 本周已排 ${candidate.load} 节</span>
            </span>
            <span class="shrink-0 rounded-full bg-white px-2 py-0.5 text-[12px] font-semibold text-slate-600 ring-1 ring-slate-200">不可选</span>
          </div>`).join('')}
          ${!visibleEligible.length && !visibleIneligible.length ? `<div id="teacherSearchEmpty" class="rounded-xl border border-dashed border-slate-300 bg-slate-50/60 px-3 py-4 text-center text-[12px] font-medium text-slate-600">没有匹配的老师，请更换姓名关键词。</div>` : '<div id="teacherSearchEmpty" class="hidden"></div>'}
        </div>
        <div class="mt-4 flex gap-2">
          <button data-action="${draft.cell ? 'cell-panel-main' : 'close-overlay'}" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800">取消</button>
          <button data-action="confirm-assign-sub" ${!draft.selected || state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-purple-600 text-[16px] font-semibold text-white active:scale-[0.98] disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认指派代课</button>
        </div>
      `);
    }

    /* ------------------------------------------------------------------
     * 小班课格：连续双格代课与暂停待排（仅在课格抽屉内发起）
     * ------------------------------------------------------------------ */
    function renderClassPauseSheet() {
      const groupLesson = state.classDraft && state.classDraft.lessonId ? lessonById(state.classDraft.lessonId) : null;
      const className = groupLesson ? groupLesson.student : CLASS_INFO.name;
      const classDate = groupLesson ? groupLesson.date : CLASS_INFO.date;
      const classTime = groupLesson ? groupLesson.time : CLASS_INFO.time;
      const classEnd = groupLesson ? endTime(groupLesson.time, 60) : CLASS_INFO.end;
      return modalShell(`
        <div class="flex items-start gap-3">
          <div class="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-rose-100 text-rose-700">${icon('pause-circle', 'h-5 w-5')}</div>
          <div class="min-w-0">
            <h2 class="text-[16px] font-bold text-slate-900">暂停待排</h2>
            <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-700">TS 将退回班级待排池，系统不向小班家长发送应用内通知；请在私域微信群告知家长。</p>
          </div>
        </div>
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50/70 px-3 py-2">
          ${infoRow('班级', className)}
          ${infoRow('时间', `${fmtDate(classDate)} ${classTime}-${classEnd}`)}
          ${infoRow('处理结果', '释放日历双格 · 退回班级待排池')}
        </div>
        <div class="mt-4 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800">返回</button>
          <button data-action="confirm-class-pause" class="h-11 flex-[2] rounded-xl bg-rose-600 text-[16px] font-semibold text-white active:scale-[0.98]">确认暂停待排</button>
        </div>
      `, 'max-w-[360px]');
    }

    /* ------------------------------------------------------------------
     * 经办记录（Append-Only 只读留痕）
     * ------------------------------------------------------------------ */
    function recordFilterPill(label, active, action, value) {
      return `<button data-action="${esc(action)}" data-value="${esc(value)}" class="shrink-0 rounded-full px-3 py-1.5 text-[12px] transition ${active ? 'bg-slate-900 font-semibold text-white shadow-xs' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${esc(label)}</button>`;
    }

    function renderRecordFilters() {
      const monitors = recordMonitors();
      const shownMonitors = state.recordsExpanded ? monitors : monitors.slice(0, 3);
      return `<div class="space-y-2 rounded-2xl border border-slate-200/80 bg-slate-50/70 p-2.5">
        <div class="flex items-center gap-2">
          <span class="w-11 shrink-0 text-[12px] font-semibold text-slate-600">时间</span>
          <div class="flex min-w-0 flex-1 items-center gap-1.5 overflow-x-auto py-0.5">
            ${RECORD_RANGE_FILTERS.map((item) => recordFilterPill(item.label, state.recordsRange === item.key, 'records-range', item.key)).join('')}
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-11 shrink-0 text-[12px] font-semibold text-slate-600">类型</span>
          <div class="flex min-w-0 flex-1 items-center gap-1.5 overflow-x-auto py-0.5">
            ${RECORD_TYPE_FILTERS.map((item) => recordFilterPill(item.label, state.recordsType === item.key, 'records-type', item.key)).join('')}
          </div>
        </div>
        ${state.role === 'admin' ? `<div class="flex items-start gap-2 border-t border-slate-200/80 pt-2">
          <span class="w-11 shrink-0 pt-1 text-[12px] font-semibold text-slate-600">班长</span>
          <div class="flex min-w-0 flex-1 flex-wrap items-center gap-1.5">
            ${recordFilterPill('全部班长', state.recordsMonitor === 'ALL', 'records-monitor', 'ALL')}
            ${shownMonitors.map((monitor) => recordFilterPill(monitor.name, state.recordsMonitor === monitor.name, 'records-monitor', monitor.name)).join('')}
            ${monitors.length > 3 ? `<button data-action="records-toggle-monitors" class="shrink-0 px-2 py-1 text-[12px] font-semibold text-indigo-600 hover:underline">${state.recordsExpanded ? '[ 收起 ]' : '[ 展开更多班长 ]'}</button>` : ''}
          </div>
        </div>` : ''}
      </div>`;
    }

    function renderRecordCard(rec) {
      const meta = RECORD_TYPE_META[rec.type] || RECORD_TYPE_META.schedule;
      return `<article class="box-border w-full rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5">
        <div class="flex items-start justify-between gap-2">
          <div class="flex min-w-0 flex-wrap items-center gap-1.5">
            ${chip(meta.label, meta.tone)}
            ${chip(rec.action, 'slate')}
            ${rec.lastMinute ? chip('临期 <3h', 'rose') : ''}
          </div>
          <span class="shrink-0 text-[12px] font-medium text-slate-600">${esc(recordTimeLabel(rec.ts))}</span>
        </div>

        <div class="mt-1.5 flex min-w-0 flex-wrap items-baseline gap-x-1.5 gap-y-1 text-[14px]">
          ${recordTargetLink(rec)}
          <span class="text-[12px] font-medium text-slate-500">·</span>
          ${recordLessonLink(rec)}
        </div>
        ${rec.batch ? `<div class="mt-0.5 text-[12px] font-medium text-slate-600">首节 ${fmtDate(rec.lessonDate)} ${esc(rec.timeLabel)} · 单次批量操作记 1 条汇总</div>` : ''}

        <div class="mt-2 rounded-xl border border-slate-200 bg-white px-2.5 py-2">
          <div class="text-[12px] font-semibold text-slate-600">变更前 → 变更后</div>
          <div class="mt-0.5 text-[12px] font-semibold leading-relaxed text-slate-800">${esc(rec.from)} <span class="font-bold text-indigo-600">→</span> ${esc(rec.to)}</div>
        </div>

        <div class="mt-1.5 flex flex-wrap items-center gap-x-2 gap-y-1 text-[12px] font-medium text-slate-600">
          <span>归属老师 · <span class="font-semibold text-slate-800">${esc(rec.owner)}</span></span>
          <span class="text-slate-500">|</span>
          ${state.role === 'admin'
            ? `<span>经办人 <span class="font-semibold text-slate-800">${esc(rec.operator)}</span></span>`
            : '<span>本人经办</span>'}
        </div>
        <div class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">原因：${esc(rec.reason || '—')}</div>

        <div class="mt-2 flex items-center justify-between gap-2 border-t border-slate-200/70 pt-2">
          <span class="font-mono text-[12px] font-medium text-slate-600">${esc(rec.id)}</span>
          <span class="inline-flex shrink-0 items-center gap-1 text-[12px] font-semibold text-slate-600">${icon('lock', 'h-3.5 w-3.5')}只读留痕</span>
        </div>
      </article>`;
    }

    function renderRecordsPage() {
      const all = filteredRecords();
      const shown = all.slice(0, state.recordsLimit);
      const isAdmin = state.role === 'admin';
      return `<div class="space-y-3 p-3.5">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <h2 class="text-[18px] font-bold tracking-tight text-slate-900">经办记录</h2>
            <p class="mt-0.5 text-[12px] font-medium text-slate-600">${isAdmin ? '全平台人工经办 · 可按班长筛选' : '仅本人经办 · Leo'}</p>
          </div>
          ${chip('只读 · 仅追加', 'slate')}
        </div>

        ${renderRecordFilters()}

        <div class="flex items-center justify-between gap-2">
          <span class="text-[12px] font-semibold text-slate-600">共 ${all.length} 条 · 已显示 ${shown.length} 条</span>
          <span class="inline-flex items-center gap-1 text-[12px] font-medium text-slate-600">${icon('arrow-down-wide-narrow', 'h-3.5 w-3.5')}时间倒序</span>
        </div>

        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">
          ${icon('lock', 'mr-1 inline h-3.5 w-3.5 align-[-2px] text-slate-500')}记录只新建、不修改、不删除；纠偏会追加新记录并保留完整历史链。
        </div>

        ${shown.length
          ? `<div class="${cardGridClass()}">${shown.map(renderRecordCard).join('')}</div>`
          : emptyState('clipboard-list', '暂无经办记录', '调整时间范围或操作类型后再试。')}

        ${all.length > state.recordsLimit
          ? `<button data-action="records-more" class="h-11 w-full rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 hover:bg-slate-50 active:bg-slate-100">查看更多（剩余 ${all.length - state.recordsLimit} 条）</button>`
          : all.length ? `<div class="py-1 text-center text-[12px] font-medium text-slate-600">已显示全部 ${all.length} 条</div>` : ''}

        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">
          ${icon('info', 'mr-1 inline h-3.5 w-3.5 align-[-2px] text-slate-500')}仅覆盖班长 / 管理员人工约课、代课调度、代请假挪位与异常退回；家长自助、系统自动结课与财务单据不在此列表。
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 抽屉/弹窗调度
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      const el = document.getElementById('overlay');
      if (!state.overlay) { el.innerHTML = ''; return; }
      const type = state.overlay.type;
      if (type === 'reschedule') el.innerHTML = renderRescheduleSheet();
      else if (type === 'softConfirm') el.innerHTML = renderSoftConfirm();
      else if (type === 'studentLeaveChoice') el.innerHTML = renderStudentLeaveChoice();
      else if (type === 'changeStudent') el.innerHTML = renderChangeStudentSheet();
      else if (type === 'assignSub') el.innerHTML = renderAssignSubSheet();
      else if (type === 'cellSheet') el.innerHTML = renderCellSheet();
      else if (type === 'classPause') el.innerHTML = renderClassPauseSheet();
      else el.innerHTML = '';
      if (window.lucide) lucide.createIcons();
    }

    function modalShell(content, width = 'max-w-[360px]') {
      return `<div class="absolute inset-x-0 bottom-0 top-16 z-50">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-4 top-1/2 mx-auto ${width} max-h-[90%] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl">
          ${content}
        </div>
      </div>`;
    }

    function sheetShell(content) {
      return `<div class="absolute inset-x-0 bottom-0 top-16 z-50">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 mx-auto flex max-h-[92%] w-full max-w-[560px] flex-col overflow-y-auto rounded-t-3xl bg-white p-5 shadow-2xl">
          <div class="mx-auto mb-3 h-1 w-10 shrink-0 rounded-full bg-slate-200"></div>
          ${content}
        </div>
      </div>`;
    }

    function modalHeader(title, subtitle = '') {
      return `<div class="flex items-start justify-between gap-3">
        <div class="flex min-w-0 items-start gap-2.5">
          <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-indigo-100 text-indigo-700">${icon('calendar-range', 'h-4 w-4')}</div>
          <div class="min-w-0">
            <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
            ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
          </div>
        </div>
        <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 角色与页面切换
     * ------------------------------------------------------------------ */
    function setRole(role, options = {}) {
      if (!ROLE_META[role]) return;
      state.role = role;
      state.page = defaultPage(role);
      state.overlay = null;
      state.returnOverlay = null;
      state.picker = null;
      state.changeStudent = null;
      state.assignSub = null;
      state.classDraft = null;
      state.cellView = 'main';
      state.cellScope = { lessonId: null, nextSelected: true };
      state.cellReason = '';
      state.recordsRange = '7';
      state.recordsType = 'ALL';
      state.recordsMonitor = 'ALL';
      state.recordsLimit = 20;
      state.recordsExpanded = false;
      state.scenario = options.scenario || '';
      if (!options.silent) renderAll({ resetScroll: true });
    }

    function navTo(page) {
      const item = navItems().find((n) => n.id === page);
      if (!item) return;
      state.page = page;
      state.overlay = null;
      state.returnOverlay = null;
      state.picker = null;
      state.changeStudent = null;
      state.assignSub = null;
      state.classDraft = null;
      state.cellView = 'main';
      state.cellScope = { lessonId: null, nextSelected: true };
      state.cellReason = '';
      state.recordsLimit = 20;
      state.scenario = '';
      renderAll({ resetScroll: true });
    }

    function overlayBack() {
      if (state.overlay && state.overlay.type === 'cellSheet' && state.cellView !== 'main') {
        state.cellView = 'main';
        renderOverlay();
        return;
      }
      closeOverlay();
    }

    function closeOverlay() {
      if (state.overlay && state.overlay.type === 'softConfirm') return cancelSoft();
      if (state.overlay && state.overlay.type === 'studentLeaveChoice') return cancelStudentLeaveChoice();
      state.overlay = null;
      state.returnOverlay = null;
      state.picker = null;
      state.changeStudent = null;
      state.assignSub = null;
      state.classDraft = null;
      state.cellView = 'main';
      state.cellScope = { lessonId: null, nextSelected: true };
      state.cellReason = '';
      renderAll();
    }

    function openReschedule(lessonId, taskId = null, scopeIds = null) {
      const scope = scopeIds && scopeIds.length ? scopeIds : [lessonId];
      state.picker = { lessonId, taskId, selectedKey: null, scopeIds: scope };
      state.overlay = { type: 'reschedule', lessonId, taskId };
      renderAll();
    }

    function openChangeStudent(lessonId, scopeIds = null) {
      const scope = scopeIds && scopeIds.length ? scopeIds : [lessonId];
      state.changeStudent = { lessonId, lessonIds: scope, query: '', selected: null };
      state.overlay = { type: 'changeStudent', lessonId };
      renderAll();
    }

    function openAssignSub({ lessonId = null, lessonIds = null, cell = false }) {
      const resolvedScope = lessonIds && lessonIds.length
        ? lessonIds.filter(Boolean)
        : lessonId ? [lessonId] : [];
      state.assignSub = { lessonId, lessonIds: resolvedScope, selected: null, cell, query: '' };
      state.overlay = { type: 'assignSub', lessonId };
      renderAll();
    }

    function openClassPause(lessonId = null) {
      state.classDraft = { selected: null, lessonId };
      state.overlay = { type: 'classPause' };
      renderAll();
    }

    function openCellSheet(lessonId) {
      state.cellView = 'main';
      state.cellScope = { lessonId, nextSelected: true };
      state.cellReason = '';
      state.overlay = { type: 'cellSheet', lessonId };
      renderAll();
    }

    function openCellAssignPanel(lesson) {
      if (isGroupLesson(lesson)) {
        state.classDraft = { selected: null, lessonId: lesson.id };
        state.cellView = 'group';
      } else {
        state.assignSub = {
          lessonId: lesson.id,
          lessonIds: cellScopeIds(lesson),
          taskId: null,
          selected: null,
          cell: true,
          query: ''
        };
        state.cellView = 'assign';
      }
      renderOverlay();
    }

    function closeCellSheet(message = '') {
      state.overlay = null;
      state.returnOverlay = null;
      state.cellView = 'main';
      state.cellScope = { lessonId: null, nextSelected: true };
      state.assignSub = null;
      state.cellReason = '';
      renderAll();
      if (message) showToast(message);
    }

    function withdrawLessons(lesson) {
      if (!guardWrite()) return;
      const reason = state.cellReason.trim();
      if (!reason) return showToast('请填写处置原因（至少 1 个非空字符）', true);
      const ids = cellScopeIds(lesson);
      ids.forEach((id) => {
        const item = lessonById(id);
        if (!item) return;
        item.status = 'PENDING';
        item.subTeacher = null;
        addRecord({
          type: 'exception',
          action: '撤排退回课次',
          studentKey: isGroupLesson(item) ? null : item.studentKey,
          studentName: isGroupLesson(item) ? '' : item.student,
          groupName: isGroupLesson(item) ? item.student : '',
          classId: isGroupLesson(item) ? groupIdForName(item.student) : null,
          lessonDate: item.date,
          timeLabel: `${item.time}-${endTime(item.time)}`,
          from: '已排课',
          to: '退回待排期',
          owner: originTeacherOf(item),
          reason,
          lastMinute: state.hours < 3
        });
      });
      closeCellSheet(`已撤排退回课次${ids.length > 1 ? `（共 ${ids.length} 节）` : ''} · 课格已释放`);
    }

    function compensateLesson(lesson) {
      if (!guardWrite()) return;
      if (lesson.settled === true) {
        showToast('该课次已完成归集，不可回退补生', true);
        return;
      }
      const reason = state.cellReason.trim();
      if (!reason) return showToast('请填写处置原因（至少 1 个非空字符）', true);
      lesson.status = 'COMPENSATED';
      lesson.exception = '异常未上课回退补生';
      lesson.makeupTs = 1;
      addRecord({
        type: 'exception',
        action: '异常未上课回退补生',
        studentKey: isGroupLesson(lesson) ? null : lesson.studentKey,
        studentName: isGroupLesson(lesson) ? '' : lesson.student,
        groupName: isGroupLesson(lesson) ? lesson.student : '',
        classId: isGroupLesson(lesson) ? groupIdForName(lesson.student) : null,
        lessonDate: lesson.date,
        timeLabel: `${lesson.time}-${endTime(lesson.time)}`,
        from: '已结课',
        to: '作废原课次 · 补生 1 节',
        owner: originTeacherOf(lesson),
        reason,
        lastMinute: state.hours < 3
      });
      closeCellSheet('已回退补生 · 原课次作废，原单补生 1 节待排课次');
    }

    function markAttendance(kind) {
      if (!guardWrite()) return;
      const reason = state.cellReason.trim();
      if (!reason) return showToast('请填写处置原因（至少 1 个非空字符）', true);
      const lesson = lessonById(state.overlay.lessonId);
      if (!lesson) return;
      const ids = cellScopeIds(lesson);
      ids.forEach((id) => {
        const item = lessonById(id);
        if (!item) return;
        if (kind === 'student_absent') {
          item.status = 'COMPLETED';
          item.exception = '学员旷课';
          item.studentDeducted = 1;
          if (item.settled === undefined) item.settled = false;
          addRecord({
            type: 'exception',
            action: '学员旷课',
            studentKey: item.studentKey,
            studentName: item.student,
            lessonDate: item.date,
            timeLabel: `${item.time}-${endTime(item.time)}`,
            from: '已排课',
            to: '学员旷课 · 扣 1 节',
            owner: item.teacher,
            reason,
            lastMinute: state.hours < 3
          });
        } else {
          item.status = 'PENDING';
          item.exception = '老师旷课';
          item.makeupTs = 1;
          addRecord({
            type: 'exception',
            action: '老师旷课',
            studentKey: item.studentKey,
            studentName: item.student,
            lessonDate: item.date,
            timeLabel: `${item.time}-${endTime(item.time)}`,
            from: '已排课',
            to: '退回待排期 · 补生 1 节',
            owner: item.teacher,
            reason,
            lastMinute: state.hours < 3
          });
        }
      });
      closeCellSheet(kind === 'student_absent' ? '已标为学员旷课 · 老师课酬正常计入' : '已标为老师旷课 · 已退回待排期并补生 1 节');
    }

    function restoreNormalAttendance(lesson) {
      if (!guardWrite()) return;
      const reason = state.cellReason.trim();
      if (!reason) return showToast('请填写处置原因（至少 1 个非空字符）', true);
      const ids = cellScopeIds(lesson);
      ids.forEach((id) => {
        const item = lessonById(id);
        if (!item) return;
        item.status = 'COMPLETED';
        item.exception = null;
        item.makeupTs = 0;
        addRecord({
          type: 'exception',
          action: '恢复为正常出勤',
          studentKey: item.studentKey,
          studentName: item.student,
          lessonDate: item.date,
          timeLabel: `${item.time}-${endTime(item.time)}`,
          from: '旷课',
          to: '正常出勤',
          owner: item.teacher,
          reason,
          lastMinute: false
        });
      });
      closeCellSheet('已恢复为正常出勤 · 出勤明细已同步');
    }

    /* ------------------------------------------------------------------
     * 家长 / 班长课格动作
     * ------------------------------------------------------------------ */
    function handleLessonLeave(lessonId, lessonIds = null) {
      requestOrRun('lesson-leave', { lessonId, lessonIds: lessonIds || [lessonId] });
    }

    function doLessonLeave(lessonId, lessonIds = null) {
      const ids = lessonIds && lessonIds.length ? lessonIds : [lessonId];
      const lessons = ids.map(lessonById).filter(Boolean);
      if (!lessons.length) return;
      const wasSub = lessons.some((lesson) => lesson.status === 'SUBSTITUTED');
      lessons.forEach((lesson) => {
        lesson.status = 'PENDING';
        lesson.subTeacher = null;
        if (isStaffRole()) {
          addRecord({
            type: 'leave',
            action: '代学员请假',
            studentKey: isGroupLesson(lesson) ? null : lesson.studentKey,
            studentName: isGroupLesson(lesson) ? '' : lesson.student,
            groupName: isGroupLesson(lesson) ? lesson.student : '',
            lessonDate: lesson.date,
            timeLabel: `${lesson.time}-${endTime(lesson.time)}`,
            from: '已排课',
            to: '退回待排期',
            owner: originTeacherOf(lesson),
            reason: '班长代学员发起，已与老师沟通',
            lastMinute: state.hours < 3
          });
        }
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.cellView = 'main';
      renderAll();
      showToast(wasSub ? '已退回待排期 · 原代课委任已解除' : `已退回待排期 · 课格已释放${lessons.length > 1 ? `（共 ${lessons.length} 节）` : ''}`);
    }

    function executeStudentLeaveChoice(choice) {
      if (!guardWrite()) return;
      const overlay = state.overlay;
      if (!overlay || overlay.type !== 'studentLeaveChoice') return;
      const ids = overlay.lessonIds && overlay.lessonIds.length ? overlay.lessonIds : [overlay.lessonId];
      const lessons = ids.map(lessonById).filter(Boolean);
      if (!lessons.length) return;
      const primary = lessons[0];
      const stats = studentLeaveStats(primary.studentKey);
      const wasSub = lessons.some((lesson) => lesson.status === 'SUBSTITUTED');
      let toast = '';
      lessons.forEach((lesson) => {
        if (choice !== 'lenient' && choice !== 'absent') return;
        if (choice === 'lenient') {
          lesson.status = 'PENDING';
          lesson.subTeacher = null;
          lesson.leaveDisposition = '通融退回待排期';
          addRecord({
            type: 'leave',
            action: '代学员请假',
            studentKey: lesson.studentKey,
            studentName: lesson.student,
            lessonDate: lesson.date,
            timeLabel: `${lesson.time}-${endTime(lesson.time)}`,
            from: '已排课',
            to: '通融退回待排期',
            owner: originTeacherOf(lesson),
            reason: `临期代请假，不扣课次；近 30 天请假 ${stats.leave} 次、临期 ${stats.late} 次`,
            lastMinute: true
          });
        } else if (choice === 'absent') {
          lesson.status = 'COMPLETED';
          lesson.subTeacher = null;
          lesson.exception = '学员旷课';
          lesson.studentDeducted = 1;
          lesson.settled = false;
          addRecord({
            type: 'exception',
            action: '代请假 · 按学员旷课扣 1 节',
            studentKey: lesson.studentKey,
            studentName: lesson.student,
            lessonDate: lesson.date,
            timeLabel: `${lesson.time}-${endTime(lesson.time)}`,
            from: '已排课',
            to: '学员旷课 · 扣 1 节',
            owner: originTeacherOf(lesson),
            reason: `临期代请假，按学员旷课扣 1 节；近 30 天请假 ${stats.leave} 次、临期 ${stats.late} 次`,
            lastMinute: true
          });
        }
      });
      if (choice === 'lenient') toast = `已通融退回待排期 · 不扣学员课次，老师该节不计课酬${lessons.length > 1 ? `（共 ${lessons.length} 节）` : ''}`;
      else if (choice === 'absent') toast = `已按学员旷课扣 1 节 · 老师课酬正常计入${lessons.length > 1 ? `（共 ${lessons.length} 节）` : ''}`;
      else return;
      state.overlay = null;
      state.returnOverlay = null;
      renderAll();
      showToast(wasSub ? `${toast} · 原代课委任已解除` : toast);
    }

    function cancelStudentLeaveChoice() {
      if (state.returnOverlay) {
        state.overlay = state.returnOverlay;
        state.returnOverlay = null;
        renderAll();
        return;
      }
      state.overlay = null;
      state.returnOverlay = null;
      renderAll();
    }

    function selectTarget(key) {
      const lesson = lessonById(state.overlay.lessonId);
      if (!lesson) return;
      const scopeLessons = ((state.picker && state.picker.scopeIds) || [lesson.id]).map(lessonById).filter(Boolean);
      const targets = scopeLessons.length > 1
        ? buildPairTargets(lesson, scopeLessons.find((item) => item.id !== lesson.id))
        : buildTargets(lesson);
      const target = targets.find((t) => t.key === key);
      if (!target) return;
      if (target.conflict) {
        showToast('学员该时段已有其他课程', true);
        return;
      }
      state.picker.selectedKey = key;
      renderOverlay();
    }

    function confirmReschedule() {
      if (!state.picker || !state.picker.selectedKey) return showToast('请选择一个合法目标时段', true);
      requestOrRun('lesson-reschedule', {
        lessonId: state.picker.lessonId,
        targetKey: state.picker.selectedKey,
        taskId: state.picker.taskId || null,
        scopeIds: state.picker.scopeIds || [state.picker.lessonId]
      });
    }

    function moveLessonTo(lesson, date, time) {
      lesson.date = date;
      lesson.time = time;
      lesson.status = 'SCHEDULED';
      lesson.subTeacher = null;
      if (lesson.type === 'sub') lesson.type = lesson.baseType || 'fixed';
    }

    function executeReschedule(payload) {
      const lesson = lessonById(payload.lessonId);
      if (!lesson) return;
      const origin = originTeacherOf(lesson);
      const scopeLessons = (payload.scopeIds && payload.scopeIds.length ? payload.scopeIds : [lesson.id])
        .map(lessonById).filter(Boolean).sort((a, b) => a.time.localeCompare(b.time));
      const pool = TEACHER_TARGETS[origin] || [];
      const target = pool.find((t) => t.key === payload.targetKey);
      if (!target) return;
      const wasSub = scopeLessons.some((item) => item.status === 'SUBSTITUTED');
      const oldDate = lesson.date;
      const oldTime = lesson.time;
      if (scopeLessons.length > 1) {
        moveLessonTo(scopeLessons[0], target.date, target.time);
        moveLessonTo(scopeLessons[1], target.date, addMinutes(target.time, 30));
      } else {
        moveLessonTo(lesson, target.date, target.time);
      }
      if (isStaffRole()) {
        addRecord({
          type: 'leave',
          action: '同师挪位',
          studentKey: lesson.studentKey,
          studentName: lesson.student,
          lessonDate: target.date,
          timeLabel: `${target.time}-${endTime(target.time)}`,
          from: `${fmtDate(oldDate)} ${oldTime}`,
          to: `${fmtDate(target.date)} ${target.time}`,
          owner: origin,
          reason: `同师平移${scopeLessons.length > 1 ? `，连堂 ${scopeLessons.length} 节` : ''}${wasSub ? '，原代课委任已解除' : '，已避开学员其他课程'}`,
          lastMinute: state.hours < 3
        });
      }
      state.overlay = null;
      state.returnOverlay = null;
      state.picker = null;
      state.cellView = 'main';
      renderAll();
      showToast(wasSub ? '原时段已释放 · 新时段已落盘，代课委任已解除' : `原时段已释放 · 新时段已落盘${scopeLessons.length > 1 ? `（共 ${scopeLessons.length} 节）` : ''}`);
    }

    function pickStudent(key) {
      if (!state.changeStudent) return;
      state.changeStudent.selected = key;
      renderOverlay();
    }

    function confirmChangeStudent() {
      if (!state.changeStudent || !state.changeStudent.selected) return showToast('请选择一位新的上课学员', true);
      requestOrRun('change-student', {
        lessonId: state.changeStudent.lessonId,
        lessonIds: state.changeStudent.lessonIds || [state.changeStudent.lessonId],
        studentKey: state.changeStudent.selected
      });
    }

    function executeChangeStudent(payload) {
      const student = studentByKey(payload.studentKey);
      if (!student) return;
      const ids = payload.lessonIds && payload.lessonIds.length ? payload.lessonIds : [payload.lessonId];
      const lessons = ids.map(lessonById).filter(Boolean);
      if (!lessons.length) return;
      lessons.forEach((lesson) => {
        const previous = lesson.student;
        lesson.studentKey = student.key;
        lesson.student = student.name;
        if (isStaffRole()) {
          addRecord({
            type: 'leave',
            action: '更换实际上课学员',
            studentKey: student.key,
            studentName: student.name,
            lessonDate: lesson.date,
            timeLabel: `${lesson.time}-${endTime(lesson.time)}`,
            from: previous,
            to: student.name,
            owner: originTeacherOf(lesson),
            reason: '班长更换实际上课学员，原购课单出资人与资金归属不变',
            lastMinute: state.hours < 3
          });
        }
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.changeStudent = null;
      state.cellView = 'main';
      renderAll();
      showToast(`已更换为 ${student.name} · 原购课单出资人与资金归属不变${lessons.length > 1 ? `（共 ${lessons.length} 节）` : ''}`);
    }

    /* ------------------------------------------------------------------
     * 智能筛师与代课指派
     * ------------------------------------------------------------------ */
    function pickSub(name) {
      if (!state.assignSub) return;
      state.assignSub.selected = name;
      renderOverlay();
    }

    function confirmAssignSub() {
      const draft = state.assignSub;
      if (!draft || !draft.selected) return showToast('请选择一位代课老师', true);
      const primaryId = draft.lessonId || null;
      const scope = (draft.lessonIds && draft.lessonIds.length ? draft.lessonIds : [primaryId]).filter(Boolean);
      requestOrRun('assign-sub', {
        lessonId: primaryId,
        lessonIds: scope,
        teacher: draft.selected
      });
    }

    function applySubAssignment(lesson, teacher) {
      const origin = originTeacherOf(lesson);
      lesson.originTeacher = origin;
      lesson.subTeacher = teacher;
      lesson.status = 'SUBSTITUTED';
      addRecord({
        type: 'sub',
        action: '指派代课',
        studentKey: isGroupLesson(lesson) ? null : lesson.studentKey,
        studentName: isGroupLesson(lesson) ? '' : lesson.student,
        groupName: isGroupLesson(lesson) ? lesson.student : '',
        classId: isGroupLesson(lesson) ? groupIdForName(lesson.student) : null,
        lessonDate: lesson.date,
        timeLabel: `${lesson.time}-${endTime(lesson.time, isGroupLesson(lesson) ? 60 : 30)}`,
        from: origin,
        to: teacher,
        owner: origin,
        reason: '班长指派代课',
        lastMinute: state.hours < 3
      });
    }

    function executeAssignSub(payload) {
      const primary = lessonById(payload.lessonId);
      if (!primary) return;
      const scope = (payload.lessonIds && payload.lessonIds.length ? payload.lessonIds : [primary.id]).filter(Boolean);
      const lessons = (scope.length ? scope : [primary.id]).map(lessonById).filter(Boolean);
      lessons.forEach((lesson) => {
        applySubAssignment(lesson, payload.teacher);
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.assignSub = null;
      state.cellView = 'main';
      renderAll();
      showToast(`已指派 ${payload.teacher} 代课 · 原任老师蓝色、代课老师紫色${lessons.length > 1 ? `（共 ${lessons.length} 节）` : ''}`);
    }

    function executeRevokeSubForLesson(payload) {
      const ids = payload.lessonIds && payload.lessonIds.length ? payload.lessonIds : [payload.lessonId];
      let changed = 0;
      ids.forEach((lessonId) => {
        const lesson = lessonById(lessonId);
        if (!lesson || lesson.status !== 'SUBSTITUTED') return;
        const subTeacher = lesson.subTeacher;
        lesson.subTeacher = null;
        lesson.status = 'SCHEDULED';
        if (lesson.type === 'sub') lesson.type = lesson.baseType || 'fixed';
        addRecord({
          type: 'sub',
          action: '撤销代课指派',
          studentKey: isGroupLesson(lesson) ? null : lesson.studentKey,
          studentName: isGroupLesson(lesson) ? '' : lesson.student,
          groupName: isGroupLesson(lesson) ? lesson.student : '',
          lessonDate: lesson.date,
          timeLabel: `${lesson.time}-${endTime(lesson.time, isGroupLesson(lesson) ? 60 : 30)}`,
          from: subTeacher || '代课老师',
          to: '恢复原任老师',
          owner: originTeacherOf(lesson),
          reason: '撤销代课指派，恢复原任老师排期',
          lastMinute: state.hours < 3
        });
        changed += 1;
      });
      if (!changed) {
        showToast('当前课次没有可撤销的代课指派', true);
        return;
      }
      state.overlay = null;
      state.returnOverlay = null;
      state.assignSub = null;
      state.cellView = 'main';
      renderAll();
      showToast('代课已撤销 · 恢复原任老师已排课');
    }

    /* ------------------------------------------------------------------
     * 小班代课
     * ------------------------------------------------------------------ */
    function pickClassSub(name) {
      if (!state.classDraft) return;
      state.classDraft.selected = name;
      renderOverlay();
    }

    function confirmClassSub() {
      if (!state.classDraft || !state.classDraft.selected) return showToast('请选择一位连续双格空闲的老师', true);
      requestOrRun('class-assign', { teacher: state.classDraft.selected });
    }

    function executeClassAssign(payload) {
      const groupLesson = state.classDraft && state.classDraft.lessonId ? lessonById(state.classDraft.lessonId) : null;
      const groupName = groupLesson ? groupLesson.student : CLASS_INFO.name;
      const groupInfo = Object.values(RECORD_GROUPS).find((item) => item.name === groupName);
      if (groupLesson) {
        groupLesson.originTeacher = groupLesson.teacher;
        groupLesson.subTeacher = payload.teacher;
        groupLesson.status = 'SUBSTITUTED';
      }
      addRecord({
        type: 'sub',
        action: '小班双格代课',
        groupName,
        classId: groupInfo ? groupInfo.id : null,
        lessonDate: groupLesson ? groupLesson.date : CLASS_INFO.date,
        timeLabel: `${groupLesson ? groupLesson.time : CLASS_INFO.time}-${groupLesson ? endTime(groupLesson.time, 60) : CLASS_INFO.end}`,
        from: groupLesson ? groupLesson.teacher : CLASS_INFO.teacher,
        to: payload.teacher,
        owner: groupLesson ? groupLesson.teacher : CLASS_INFO.teacher,
        reason: '连续双格代课，课酬按原班级快照平移',
        lastMinute: state.hours < 3
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.classDraft = null;
      state.cellView = 'main';
      renderAll();
      showToast(`已指派 ${payload.teacher} · 小班课酬按原班级快照平移`);
    }

    function confirmClassPause() {
      if (!guardWrite()) return;
      const groupLesson = state.classDraft && state.classDraft.lessonId ? lessonById(state.classDraft.lessonId) : null;
      const groupName = groupLesson ? groupLesson.student : CLASS_INFO.name;
      const groupInfo = Object.values(RECORD_GROUPS).find((item) => item.name === groupName);
      if (groupLesson) groupLesson.status = 'PENDING';
      addRecord({
        type: 'sub',
        action: '小班暂停待排',
        groupName,
        classId: groupInfo ? groupInfo.id : null,
        lessonDate: groupLesson ? groupLesson.date : CLASS_INFO.date,
        timeLabel: `${groupLesson ? groupLesson.time : CLASS_INFO.time}-${groupLesson ? endTime(groupLesson.time, 60) : CLASS_INFO.end}`,
        from: '已排课',
        to: '退回小班待排池',
        owner: groupLesson ? groupLesson.teacher : CLASS_INFO.teacher,
        reason: '主理人选择暂停待排，不向小班家长发送应用内通知',
        lastMinute: state.hours < 3
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.classDraft = null;
      state.cellView = 'main';
      renderAll();
      showToast('已暂停待排 · TS 退回班级待排池，系统不向小班家长发送应用内通知');
    }

    /* ------------------------------------------------------------------
     * 温和确认执行器
     * ------------------------------------------------------------------ */
    function confirmSoft() {
      const overlay = state.overlay;
      if (!overlay || overlay.type !== 'softConfirm') return;
      const kind = overlay.kind;
      const payload = overlay.payload;
      state.overlay = null;
      state.returnOverlay = null;
      executeSoftAction(kind, payload);
    }

    function cancelSoft() {
      if (state.returnOverlay) {
        state.overlay = state.returnOverlay;
        state.returnOverlay = null;
        renderAll();
        return;
      }
      state.overlay = null;
      state.returnOverlay = null;
      renderAll();
    }

    function executeSoftAction(kind, payload) {
      if (kind === 'lesson-leave') return doLessonLeave(payload.lessonId);
      if (kind === 'lesson-reschedule') return executeReschedule(payload);
      if (kind === 'change-student') return executeChangeStudent(payload);
      if (kind === 'assign-sub') return executeAssignSub(payload);
      if (kind === 'revoke-sub') return executeRevokeSubForLesson(payload);
      if (kind === 'class-assign') return executeClassAssign(payload);
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((btn) => {
        const key = btn.dataset.group;
        const value = btn.dataset.value;
        const current = key === 'hours' ? String(state.hours) : state[key];
        const active = String(current) === String(value);
        btn.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}`;
      });
      document.querySelectorAll('[data-scenario]').forEach((btn) => {
        const active = state.scenario === btn.dataset.scenario;
        btn.className = `scenario rounded-full border px-2.5 py-1 font-semibold transition ${active ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}`;
      });
    }

    function ensureGroupLesson() {
      if (lessonById('lsn_class_cell')) return;
      state.lessons.push({
        id: 'lsn_class_cell',
        student: 'KET 冲刺精讲小班',
        studentKey: null,
        type: 'group',
        group: true,
        date: '2026-11-14',
        time: '10:00',
        teacher: 'David Miller',
        room: 'C-108',
        courseware: 'KET 冲刺讲义 · Unit 6',
        order: '—',
        payer: '—',
        status: 'SCHEDULED',
        size: '3/4 人'
      });
    }

    function runScenario(key) {
      state.online = 'on';
      state.overlay = null;
      state.returnOverlay = null;
      state.picker = null;
      state.changeStudent = null;
      state.assignSub = null;
      state.classDraft = null;
      state.cellReason = '';

      if (key === 'records') {
        state.hours = 3;
        setRole('monitor', { silent: true, scenario: key });
        state.page = 'records';
      } else if (key === 'adminRecords') {
        state.hours = 3;
        setRole('admin', { silent: true, scenario: key });
        state.page = 'records';
      } else if (key === 'cellSingle') {
        state.hours = 24;
        setRole('monitor', { silent: true, scenario: key });
        state.page = 'records';
        state.cellView = 'main';
        state.cellScope = { lessonId: 'lsn_bob_wed', nextSelected: true };
        state.overlay = { type: 'cellSheet', lessonId: 'lsn_bob_wed' };
      } else if (key === 'cellPair') {
        state.hours = 24;
        setRole('monitor', { silent: true, scenario: key });
        state.page = 'records';
        state.cellView = 'main';
        state.cellScope = { lessonId: 'lsn_alice_tue', nextSelected: true };
        state.overlay = { type: 'cellSheet', lessonId: 'lsn_alice_tue' };
      } else if (key === 'cellLeave') {
        state.hours = 2;
        setRole('monitor', { silent: true, scenario: key });
        state.page = 'records';
        state.cellView = 'leaveReschedule';
        state.cellScope = { lessonId: 'lsn_bob_wed', nextSelected: true };
        state.overlay = { type: 'cellSheet', lessonId: 'lsn_bob_wed' };
      } else if (key === 'cellAssign') {
        state.hours = 6;
        setRole('monitor', { silent: true, scenario: key });
        state.page = 'records';
        state.cellView = 'assign';
        state.cellScope = { lessonId: 'lsn_alice_thu', nextSelected: true };
        state.assignSub = { lessonId: 'lsn_alice_thu', lessonIds: ['lsn_alice_thu'], selected: null, cell: true, query: '' };
        state.overlay = { type: 'cellSheet', lessonId: 'lsn_alice_thu' };
      } else if (key === 'cellAttendance') {
        state.hours = 6;
        setRole('monitor', { silent: true, scenario: key });
        state.page = 'records';
        state.cellView = 'attendance';
        state.cellScope = { lessonId: 'lsn_bob_wed', nextSelected: true };
        state.overlay = { type: 'cellSheet', lessonId: 'lsn_bob_wed' };
      } else if (key === 'cellCompleted') {
        state.hours = 6;
        setRole('monitor', { silent: true, scenario: key });
        state.page = 'records';
        state.cellView = 'main';
        state.cellScope = { lessonId: 'lsn_bob_mon', nextSelected: true };
        state.overlay = { type: 'cellSheet', lessonId: 'lsn_bob_mon' };
      } else if (key === 'cellGroup') {
        state.hours = 6;

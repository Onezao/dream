      online: 'on',
      hours: 3,
      page: 'board',
      child: 'alice',
      scenario: '',
      lessons: [],
      slots: [],
      tasks: [],
      ops: [],
      classState: { status: 'scheduled', subTeacher: null },
      overlay: null,
      returnOverlay: null,
      lastChangeNote: null,
      leaveNotice: null,
      picker: null,
      changeStudent: null,
      assignSub: null,
      classDraft: null,
      exceptionDraft: null,
      leaveSlotId: null,
      batch: { selected: [], reasonType: '' },
      opsFilter: 'ALL'
    };

    let taskSeq = 2;
    let opSeq = 4;

    function clone(value) { return JSON.parse(JSON.stringify(value)); }

    function resetState() {
      state.role = 'parent';
      state.device = 'mobile';
      state.online = 'on';
      state.hours = 3;
      state.page = 'board';
      state.child = 'alice';
      state.scenario = '';
      state.lessons = clone(INITIAL_LESSONS);
      state.slots = clone(INITIAL_SLOTS);
      state.tasks = clone(INITIAL_TASKS);
      state.ops = clone(INITIAL_OPS);
      state.classState = { status: 'scheduled', subTeacher: null };
      state.overlay = null;
      state.returnOverlay = null;
      state.lastChangeNote = null;
      state.leaveNotice = null;
      state.picker = null;
      state.changeStudent = null;
      state.assignSub = null;
      state.classDraft = null;
      state.exceptionDraft = null;
      state.leaveSlotId = null;
      state.batch = { selected: [], reasonType: '' };
      state.opsFilter = 'ALL';
      taskSeq = 2;
      opSeq = 4;
    }

    /* ------------------------------------------------------------------
     * 通用工具
     * ------------------------------------------------------------------ */
    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    function icon(name, cls = 'h-4 w-4') {
      return `<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
    }

    const TONE = {
      slate: 'bg-slate-100 text-slate-700 border border-slate-200',
      indigo: 'bg-indigo-50 text-indigo-700 border border-indigo-100',
      amber: 'bg-amber-100 text-amber-900 border border-amber-300',
      yellow: 'bg-yellow-100 text-yellow-900 border border-yellow-300',
      rose: 'bg-rose-100 text-rose-800 border border-rose-200',
      emerald: 'bg-emerald-100 text-emerald-800 border border-emerald-200',
      blue: 'bg-blue-100 text-blue-800 border border-blue-200',
      purple: 'bg-purple-100 text-purple-800 border border-purple-200',
      teal: 'bg-teal-100 text-teal-900 border border-teal-200'
    };

    function chip(text, tone = 'slate') {
      return `<span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[12px] font-bold ${TONE[tone] || TONE.slate}">${esc(text)}</span>`;
    }

    function dot(tone) {
      const map = { blue: 'bg-blue-500', purple: 'bg-purple-600', rose: 'bg-rose-500', emerald: 'bg-emerald-500', amber: 'bg-amber-500' };
      return `<span class="inline-block h-2 w-2 rounded-full ${map[tone] || 'bg-slate-400'}"></span>`;
    }

    function isoToTs(iso) {
      return Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10)));
    }

    function weekdayLabel(iso) {
      return DAY_LABELS[(new Date(isoToTs(iso)).getUTCDay() + 6) % 7];
    }

    function fmtDate(iso) {
      return `${iso.slice(5)} (${weekdayLabel(iso)})`;
    }

    function addMinutes(time, minutes) {
      const parts = time.split(':');
      const total = Number(parts[0]) * 60 + Number(parts[1]) + minutes;
      return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
    }

    function endTime(time, minutes = 30) { return addMinutes(time, minutes); }

    function studentByKey(key) { return STUDENTS.find((s) => s.key === key) || STUDENTS[0]; }
    function lessonById(id) { return state.lessons.find((l) => l.id === id) || null; }
    function taskById(id) { return state.tasks.find((t) => t.id === id) || null; }
    function slotById(id) { return state.slots.find((s) => s.id === id) || null; }

    function roleMeta() { return ROLE_META[state.role]; }
    function navItems() { return NAVS[state.role] || NAVS.parent; }

    function defaultPage(role) {
      if (role === 'monitor' || role === 'admin') return 'ops';
      return 'board';
    }

    function operatorOfRole() {
      if (state.role === 'teacher') return 'David';
      if (state.role === 'monitor') return 'Leo';
      if (state.role === 'admin') return 'Sam';
      if (state.role === 'sub_teacher') return 'Elena';
      return 'Amy';
    }

    function nextTaskId() {
      taskSeq += 1;
      return `sub_${String(taskSeq).padStart(3, '0')}`;
    }

    function addOp({ action, subject, detail, lastMinute = false, operator }) {
      opSeq += 1;
      state.ops.unshift({
        id: `op_${String(opSeq).padStart(3, '0')}`,
        at: '刚刚',
        operator: operator || operatorOfRole(),
        action,
        subject,
        detail,
        lastMinute
      });
    }

    function typeMeta(type) {
      if (type === 'fixed') return { label: '固定位', tone: 'amber', icon: 'pin' };
      if (type === 'temp') return { label: '临时课', tone: 'yellow', icon: 'clock-3' };
      if (type === 'sub') return { label: '代课 [SUB]', tone: 'blue', icon: 'repeat-2' };
      if (type === 'trial') return { label: '试课', tone: 'teal', icon: 'sparkles' };
      return { label: '课程', tone: 'slate', icon: 'book-open' };
    }

    function lessonStatusChip(lesson) {
      if (lesson.status === 'SUBSTITUTED') return chip('代课 [SUB]', 'blue');
      if (lesson.status === 'LEAVE_PENDING') return chip('老师请假 · 待安排', 'rose');
      if (lesson.status === 'PENDING') return chip('已退回待排期', 'slate');
      if (lesson.status === 'COMPENSATED') return chip('已回退补生', 'amber');
      if (lesson.status === 'COMPLETED') return chip(lesson.exception || '已结课', 'emerald');
      return chip('已排课', 'emerald');
    }

    function originTeacherOf(lesson) {
      return lesson.originTeacher || lesson.teacher;
    }

    function isActiveLesson(lesson) {
      return ['SCHEDULED', 'SUBSTITUTED', 'LEAVE_PENDING'].includes(lesson.status);
    }

    function sortedLessons(list) {
      return list.slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    }

    function visibleTasks() {
      let tasks = state.tasks.filter((t) => t.status === 'PENDING' || t.status === 'ASSIGNED');
      if (state.role === 'monitor') tasks = tasks.filter((t) => t.owner === 'Leo');
      if (state.role === 'admin' && state.opsFilter !== 'ALL') tasks = tasks.filter((t) => t.owner === state.opsFilter);
      return tasks;
    }

    function visibleOps() {
      if (state.role === 'monitor') return state.ops.filter((op) => op.operator === 'Leo');
      if (state.role === 'admin' && state.opsFilter !== 'ALL') return state.ops.filter((op) => op.operator === state.opsFilter);
      return state.ops;
    }

    function guardWrite() {
      if (state.online === 'off') {
        showToast('离线只读，暂不可执行该操作', true);
        return false;
      }
      return true;
    }

    function onlineCls() { return state.online === 'off' ? 'opacity-50' : ''; }

    function showToast(message, isError = false) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.className = `pointer-events-none absolute bottom-24 left-1/2 z-[100] w-max max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl px-4 py-2 text-center text-[12px] font-semibold leading-relaxed text-white shadow-xl ${isError ? 'bg-rose-600/95' : 'bg-slate-900/90'}`;
      el.textContent = message;
      el.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => el.classList.add('hidden'), 3000);
    }

    function cardGridClass() {
      return state.device === 'tablet' ? 'grid grid-cols-2 gap-2.5 items-start' : 'space-y-2.5';
    }

    function emptyState(iconName, title, desc) {
      return `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/60 px-5 py-7 text-center">
        <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-white text-slate-500 ring-1 ring-slate-200">${icon(iconName, 'h-5 w-5')}</div>
        <div class="mt-3 text-[14px] font-bold text-slate-900">${esc(title)}</div>
        <div class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">${esc(desc)}</div>
      </div>`;
    }

    function infoRow(label, value, extra = '') {
      return `<div class="flex items-start justify-between gap-3 py-1">
        <span class="shrink-0 text-[12px] font-medium text-slate-600">${esc(label)}</span>
        <span class="min-w-0 text-right text-[12px] font-semibold text-slate-800">${esc(value)}${extra}</span>
      </div>`;
    }

    function amberNote(title, detail) {
      return `<div class="rounded-xl border border-amber-300 bg-amber-50/60 px-3 py-2.5">
        <div class="flex items-start gap-2">
          <span class="mt-0.5 shrink-0 text-amber-700">${icon('clock-3', 'h-4 w-4')}</span>
          <div class="min-w-0">
            <div class="text-[12px] font-bold leading-relaxed text-amber-900">${esc(title)}</div>
            ${detail ? `<div class="mt-0.5 text-[12px] font-medium leading-relaxed text-amber-900/90">${esc(detail)}</div>` : ''}
          </div>
        </div>
      </div>`;
    }

    function neutralNote(title, detail, iconName = 'info') {
      return `<div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5">
        <div class="flex items-start gap-2">
          <span class="mt-0.5 shrink-0 text-slate-500">${icon(iconName, 'h-4 w-4')}</span>
          <div class="min-w-0">
            <div class="text-[12px] font-bold leading-relaxed text-slate-800">${esc(title)}</div>
            ${detail ? `<div class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">${esc(detail)}</div>` : ''}
          </div>
        </div>
      </div>`;
    }

    function actionRow(action, iconName, title, desc, options = {}) {
      const tone = options.tone || 'indigo';
      const toneMap = {
        indigo: 'bg-indigo-100 text-indigo-700',
        rose: 'bg-rose-100 text-rose-700',
        purple: 'bg-purple-100 text-purple-700',
        amber: 'bg-amber-100 text-amber-800',
        teal: 'bg-teal-100 text-teal-800',
        blue: 'bg-blue-100 text-blue-700'
      };
      const attrs = options.attrs || '';
      return `<button data-action="${esc(action)}" ${attrs} class="flex w-full items-center gap-3 rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-left transition hover:bg-slate-50 active:bg-slate-100 ${options.write ? onlineCls() : ''}">
        <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl ${toneMap[tone] || toneMap.indigo}">${icon(iconName, 'h-4 w-4')}</span>
        <span class="min-w-0 flex-1">
          <span class="block text-[14px] font-bold text-slate-900">${esc(title)}</span>
          <span class="mt-0.5 block text-[12px] font-medium leading-relaxed text-slate-600">${esc(desc)}</span>
        </span>
        ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-500')}
      </button>`;
    }

    function requestOrRun(kind, payload) {
      if (!guardWrite()) return;
      if (state.hours < 3) {
        state.returnOverlay = state.overlay;
        state.overlay = { type: 'softConfirm', kind, payload };
        renderAll();
      } else {
        executeSoftAction(kind, payload);
      }
    }

    /* ------------------------------------------------------------------
     * 外壳：顶栏 / 场景横幅 / 底部导航
     * ------------------------------------------------------------------ */
    function pendingOwnCount() {
      return state.tasks.filter((t) => t.status === 'PENDING' && (state.role === 'monitor' ? t.owner === 'Leo' : t.originTeacher === 'David Miller')).length;
    }

    function unreadCount() {
      if (state.role === 'parent') return 2;
      if (state.role === 'teacher') return Math.max(1, pendingOwnCount());
      if (state.role === 'sub_teacher') return 1;
      return Math.max(1, visibleTasks().filter((t) => t.status === 'PENDING').length + 1);
    }

    function bannerTitle() {
      if (state.overlay && OVERLAY_TITLES[state.overlay.type]) return OVERLAY_TITLES[state.overlay.type];
      const item = navItems().find((n) => n.id === state.page);
      if (item) return item.label;
      return '考勤与代课';
    }

    function bannerContext() {
      if (state.role === 'parent') return `${studentByKey(state.child).nickname} · 本周待上 ${state.lessons.filter((l) => l.studentKey === state.child && isActiveLesson(l)).length} 节`;
      if (state.role === 'teacher') return '今天 · 周二 11-10 · David Miller';
      if (state.role === 'monitor') return 'Leo · 管辖 3 位老师';
      if (state.role === 'admin') return '全平台 · 2 位班长';
      return 'Elena Wright · 代课课酬全额归本人';
    }

    function bannerPattern() {
      return `<div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
        <div class="absolute -right-8 -top-10 h-28 w-28 rounded-full border border-white/15"></div>
        <div class="absolute -bottom-14 right-16 h-24 w-24 rounded-full border border-white/10"></div>
        <div class="absolute right-7 top-3 h-8 w-8 rotate-45 rounded-lg border border-white/10"></div>
      </div>`;
    }

    function renderBanner() {
      const meta = roleMeta();
      const canBack = !!state.overlay;
      const left = canBack
        ? `<button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="返回">${icon('arrow-left', 'h-5 w-5')}</button>`
        : `<span class="grid h-9 w-9 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${meta.initial}</span>`;
      return `<header class="relative flex h-16 shrink-0 items-center justify-between gap-3 overflow-hidden bg-gradient-to-br ${meta.gradient} px-4 text-white">
        ${bannerPattern()}
        <div class="relative flex min-w-0 items-center gap-2.5">
          ${left}
          <div class="min-w-0">
            <h1 class="truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</h1>
            <p class="mt-0.5 truncate text-[12px] font-medium text-white/70">${esc(bannerContext())}</p>
          </div>
        </div>
        <button data-action="toast" data-message="进入通知中心" class="relative grid h-9 w-9 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
          ${icon('bell', 'h-4 w-4')}
          <span class="absolute -right-1 -top-1 grid h-4 min-w-[16px] place-items-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white/40">${Math.min(99, unreadCount())}</span>
        </button>
      </header>`;
    }

    function scenarioText() {
      if (state.role === 'parent') {
        return state.hours < 3
          ? '临期场景 · 请假与挪位仍可用，仅弹温和确认'
          : '弹性请假 · 请假与挪位始终可用，不设次数上限';
      }
      if (state.role === 'teacher') return '全时段可请假 · 已排课请假自动生成应急待办';
      if (state.role === 'monitor') return '应急调度 · 原任老师蓝色 / 代课老师紫色';
      if (state.role === 'admin') return '全平台待办 · 可按班长筛选';
      return '代课课酬 100% 归代课老师';
    }

    function renderScenarioBanner() {
      const late = state.hours < 3;
      const cls = late ? 'border-amber-200 bg-amber-50 text-amber-900' : 'border-emerald-200 bg-emerald-50 text-emerald-900';
      const tagCls = late ? 'bg-amber-200 text-amber-900' : 'bg-emerald-200 text-emerald-900';
      return `<div class="flex items-center justify-between gap-2 border-b px-3 py-2 ${cls}">
        <div class="flex min-w-0 items-center gap-1.5 text-[12px] font-semibold leading-relaxed">
          ${icon(late ? 'clock-3' : 'calendar-check-2', 'h-3.5 w-3.5 shrink-0')}
          <span class="min-w-0">${esc(scenarioText())}</span>
        </div>
        <span class="shrink-0 rounded px-1.5 py-0.5 text-[12px] font-bold ${tagCls}">${late ? '&lt;3h' : '≥3h'}</span>
      </div>`;
    }

    function renderNav() {
      const items = navItems();
      const lateCount = state.slots.filter((s) => s.kind === 'leave' || s.kind === 'leavePending').length;
      const pending = state.role === 'monitor' ? visibleTasks().filter((t) => t.status === 'PENDING').length : 0;
      return `<div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${items.map((item) => {
            const active = !item.roleSwitch && state.page === item.id;
            const badge = (item.id === 'ops' && pending > 0) || (item.id === 'leaveRecords' && lateCount > 0);
            return `<button ${item.roleSwitch ? `data-action="switch-role" data-role="${item.roleSwitch}"` : `data-action="nav" data-page="${item.id}"`} ${active ? 'aria-current="page"' : ''} class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${active ? 'text-indigo-600' : 'text-slate-500'}">
              <span class="relative">${icon(item.icon, 'h-[18px] w-[18px]')}${badge ? '<span class="absolute -right-1 -top-0.5 h-1.5 w-1.5 rounded-full bg-rose-500 ring-2 ring-white"></span>' : ''}</span>
              <span class="text-[12px] font-bold">${esc(item.label)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    function renderAll(options = {}) {
      const frame = document.getElementById('frame');
      frame.className = state.device === 'tablet'
        ? 'relative flex h-[860px] w-full max-w-[768px] shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300'
        : 'relative flex h-[812px] w-full max-w-[390px] shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300';

      document.getElementById('banner').innerHTML = renderBanner();
      document.getElementById('scenarioBanner').innerHTML = renderScenarioBanner();

      const offline = document.getElementById('offlineBanner');
      offline.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      offline.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')}离线只读：可查看课表，请假 / 挪位 / 换人 / 代课不可用`
        : '';

      const content = document.getElementById('content');
      const previousScroll = content.scrollTop;
      content.innerHTML = renderContent();
      content.scrollTop = options.resetScroll ? 0 : previousScroll;

      document.getElementById('bottomnav').innerHTML = renderNav();
      renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function renderContent() {
      if (state.role === 'parent') {
        if (state.page === 'board') return renderParentBoard();
        return renderPlaceholderPage();
      }
      if (state.role === 'teacher') {
        if (state.page === 'board') return renderTeacherBoard();
        if (state.page === 'leaveRecords') return renderTeacherLeaveRecords();
        return renderPlaceholderPage();
      }
      if (state.role === 'sub_teacher') {
        if (state.page === 'board') return renderSubBoard();
        return renderPlaceholderPage();
      }
      if (state.page === 'class') return renderClassPage();
      if (state.page === 'exception') return renderExceptionPage();
      if (state.page === 'records') return renderOpsPage();
      return renderOpsBoard();
    }

    function renderPlaceholderPage() {
      const item = navItems().find((n) => n.id === state.page);
      const meta = item && item.placeholder ? item.placeholder : { desc: '该页面用于演示控制台跳转。' };
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 ring-1 ring-slate-200">${icon(item ? item.icon : 'layout-grid', 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item ? item.label : '页面')}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(meta.desc)}</p>
        ${meta.href ? `<a href="${esc(meta.href)}" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">${esc(meta.hrefLabel || '打开页面')}</a>` : ''}
        <button data-action="nav" data-page="${state.role === 'monitor' || state.role === 'admin' ? 'ops' : 'board'}" class="mt-4 text-[14px] font-semibold text-indigo-600">返回${state.role === 'monitor' || state.role === 'admin' ? '应急调度' : '我的课表'}</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 家长：我的课表与课次抽屉
     * ------------------------------------------------------------------ */
    function renderParentBoard() {
      const child = studentByKey(state.child);
      const lessons = sortedLessons(state.lessons.filter((l) => l.studentKey === state.child && isActiveLesson(l)));
      const childOptions = [
        { key: 'alice', label: 'Alice · 大宝' },
        { key: 'bob', label: 'Bob · 二宝' }
      ];
      return `<div class="space-y-3 p-3.5">
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0">
            <h2 class="text-[18px] font-bold tracking-tight text-slate-900">我的课表</h2>
            <p class="mt-0.5 text-[12px] font-medium text-slate-600">${esc(child.tag)} · ${lessons.length} 节待上</p>
          </div>
          <span class="inline-flex shrink-0 items-center gap-1 rounded-full border border-indigo-100 bg-indigo-50 px-2.5 py-1 text-[12px] font-bold text-indigo-700">${icon('calendar-days', 'h-3.5 w-3.5')}本周</span>
        </div>

        <div class="flex gap-1.5">
          ${childOptions.map((option) => {
            const on = state.child === option.key;
            const selected = STUDENTS.find((s) => s.key === option.key);

              ${lesson.status === 'LEAVE_PENDING' ? chip('待安排代课', 'rose') : ''}

          ${lesson.status === 'LEAVE_PENDING' ? amberNote('老师已请假 · 待安排代课', '班长正在应急调度；家长端会合并呈现原任老师与代课老师。') : ''}

          <button data-action="close-overlay" class="h-11 w-full rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800">关闭</button>

    /* ------------------------------------------------------------------
     * 同师挪位：目标时段与防撞课
     * ------------------------------------------------------------------ */
    function buildTargets(lesson) {
      const origin = originTeacherOf(lesson);
      const pool = TEACHER_TARGETS[origin] || TEACHER_TARGETS['David Miller'];
      return pool.filter((t) => !(t.date === lesson.date && t.time === lesson.time)).map((target) => {
        const conflict = state.lessons.find((other) => other.id !== lesson.id
          && other.studentKey === lesson.studentKey
          && other.date === target.date
          && other.time === target.time
          && ['SCHEDULED', 'SUBSTITUTED', 'LEAVE_PENDING'].includes(other.status));
        return { ...target, conflict: conflict ? '学员该时段已有其他课程' : '' };
      });
    }

    function renderRescheduleSheet() {
      const lessonId = state.overlay.lessonId || (state.picker && state.picker.lessonId);
      const lesson = lessonById(lessonId);
      if (!lesson) return '';
      const origin = originTeacherOf(lesson);
      const targets = buildTargets(lesson);
      const selected = state.picker ? state.picker.selectedKey : null;
      const taskId = state.picker ? state.picker.taskId : null;
      return sheetShell(`
        ${modalHeader('同师挪位', `${lesson.student} · 原任老师 ${origin} · 仅展示其空闲时段`)}
        <div class="mt-2.5 rounded-xl border border-indigo-200 bg-indigo-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-indigo-900">
          目标时段限定为 ${esc(origin)} 的空闲格；学员在同一时间已在其他老师处有课的时段已置灰，点击不会落盘。
        </div>
        <div class="mt-3 space-y-1.5">
          ${targets.map((target) => {
            const on = selected === target.key;
            const blocked = !!target.conflict;
            return `<button data-action="select-target" data-key="${target.key}" data-conflict="${blocked ? 'true' : 'false'}" ${blocked ? 'aria-label="学员该时段已有其他课程"' : ''} class="flex w-full items-center justify-between gap-2 rounded-xl border px-3 py-2.5 text-left transition ${blocked ? 'cursor-not-allowed border-slate-200 bg-slate-100 opacity-60' : on ? 'border-indigo-400 bg-indigo-50' : 'border-slate-200 bg-white hover:border-indigo-300'}">
              <span class="min-w-0">
                <span class="block text-[14px] font-bold ${blocked ? 'text-slate-600' : on ? 'text-indigo-900' : 'text-slate-900'}">${fmtDate(target.date)} · ${target.time} - ${endTime(target.time)}</span>
                <span class="mt-0.5 block text-[12px] font-medium ${blocked ? 'text-slate-600' : 'text-slate-600'}">${blocked ? esc(target.conflict) : `${esc(origin)} · 空闲可约`}</span>
              </span>
              <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${blocked ? 'border-slate-300 bg-slate-200 text-slate-500' : on ? 'border-indigo-500 bg-indigo-600 text-white' : 'border-slate-300 bg-white text-transparent'}">${icon(blocked ? 'lock' : 'check', 'h-3 w-3')}</span>
            </button>`;
          }).join('')}
        </div>
        ${state.hours < 3 ? `<div class="mt-2">${amberNote('距开课不足 3 小时', '确认挪位时会弹温和提示，点击确认后直接放行。')}</div>` : ''}
        <div class="mt-4 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800">取消</button>
          <button data-action="confirm-reschedule" ${!selected || state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white active:scale-[0.98] disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认挪位</button>
        </div>
      `);
    }

    /* ------------------------------------------------------------------
     * 临期温和确认
     * ------------------------------------------------------------------ */
    function renderSoftConfirm() {
      return modalShell(`
        <div class="flex items-start gap-3">
          <div class="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-amber-100 text-amber-700">${icon('clock-3', 'h-5 w-5')}</div>
          <div class="min-w-0">
            <h2 class="text-[16px] font-bold text-slate-900">临期操作确认</h2>
            <p class="mt-1 text-[14px] font-medium leading-relaxed text-slate-700">距开课不足 3 小时，老师可能已进入备课状态，请确认已与老师沟通</p>
          </div>
        </div>
        <div class="mt-3 rounded-xl border border-amber-300 bg-amber-50/60 px-3 py-2 text-[12px] font-medium leading-relaxed text-amber-900">
          点击确认后操作立即生效，并标记为临期变更，透明透出至课酬单出勤明细。

        <div class="mt-4 flex gap-2">

          <button data-action="confirm-soft" class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white active:scale-[0.98]">确认放行</button>
        </div>
      `, 'max-w-[360px]');
    }

    /* ------------------------------------------------------------------
     * 更换实际上课学员
     * ------------------------------------------------------------------ */
    function renderChangeStudentSheet() {
      const draft = state.changeStudent;
      const lesson = lessonById(draft.lessonId);
      if (!lesson) return '';
      const query = draft.query || '';
      const normalized = String(query).trim().toLowerCase();
      const candidates = STUDENTS.filter((s) => s.key !== lesson.studentKey
        && (!normalized || `${s.name} ${s.nickname} ${s.tag}`.toLowerCase().indexOf(normalized) !== -1));
      return sheetShell(`
        ${modalHeader('更换实际上课学员', `${lesson.student} · ${fmtDate(lesson.date)} ${lesson.time}`)}
        <div class="mt-2.5 rounded-xl border border-slate-200 bg-slate-50/70 px-3 py-2">
          ${infoRow('原购课单', lesson.order)}
          ${infoRow('出资人', `${lesson.payer} · 资金归属不变`)}
          ${infoRow('当前学员', lesson.student)}
        </div>
        <div class="mt-2">${neutralNote('资金与单据保持不变', '仅变更该课次的实际授课学员档案；原购课单金额、出资人与资金持有人不变。线下家长结算由双方自行完成，例如微信转账。', 'shield-check')}</div>
        <div class="relative mt-3">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
          <input id="studentSearch" value="${esc(query)}" placeholder="按姓名或规范昵称检索" class="h-11 w-full rounded-xl border border-slate-300 bg-white pl-9 pr-3 text-[16px] font-medium text-slate-900 outline-none focus:border-indigo-500" autocomplete="off">
        </div>
        <div class="mt-2 max-h-56 space-y-1.5 overflow-y-auto">
          ${candidates.map((student) => {
            const on = draft.selected === student.key;
            const search = `${student.name} ${student.nickname} ${student.tag}`.toLowerCase();
            return `<button data-action="pick-student" data-key="${student.key}" data-student-row data-search="${esc(search)}" class="flex w-full items-center justify-between gap-2 rounded-xl border px-3 py-2.5 text-left transition ${on ? 'border-indigo-400 bg-indigo-50' : 'border-slate-200 bg-white hover:border-indigo-300'}">
              <span class="min-w-0">
                <span class="block text-[14px] font-bold ${on ? 'text-indigo-900' : 'text-slate-900'}">${esc(student.name)} <span class="ml-1 text-[12px] font-semibold text-slate-600">${esc(student.nickname)}</span></span>
                <span class="mt-0.5 block text-[12px] font-medium text-slate-600">${esc(student.tag)} · ${esc(student.status)}</span>
              </span>
              <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-indigo-500 bg-indigo-600 text-white' : 'border-slate-300 bg-white text-transparent'}">${icon('check', 'h-3 w-3')}</span>
            </button>`;
          }).join('')}
        </div>
        <div id="studentEmpty" class="mt-2 ${candidates.length ? 'hidden' : ''} rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-center text-[12px] font-medium text-slate-600">没有匹配的学员，请换一个姓名或昵称。</div>
        <div class="mt-4 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800">取消</button>
          <button data-action="confirm-change" ${!draft.selected || state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white active:scale-[0.98] disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认更换</button>
        </div>
      `);
    }

    function filterStudentRows(input) {
      const query = String(input.value || '').trim().toLowerCase();
      let visible = 0;
      document.querySelectorAll('[data-student-row]').forEach((row) => {
        const match = !query || row.dataset.search.indexOf(query) !== -1;
        row.classList.toggle('hidden', !match);
        if (match) visible += 1;
      });
      const empty = document.getElementById('studentEmpty');
      if (empty) empty.classList.toggle('hidden', visible > 0);
      if (state.changeStudent) state.changeStudent.query = input.value;
    }

    /* ------------------------------------------------------------------
     * 老师：我的课表与批量请假
     * ------------------------------------------------------------------ */
    function teacherSlotMeta(slot) {
      const lesson = slot.lessonId ? lessonById(slot.lessonId) : null;
      if (slot.kind === 'off') return { tone: 'slate', label: '休息', detail: '未开放授课', selectable: false };
      if (slot.kind === 'free') return { tone: 'emerald', label: '空闲', detail: '可勾选请假，置红后阻断新约', selectable: true };
      if (slot.kind === 'leave') return { tone: 'rose', label: '已请假', detail: slot.reason || '已置红', selectable: false, actionable: true };
      if (slot.kind === 'leavePending') return { tone: 'rose', label: '已请假 · 待派代课', detail: lesson ? `${lesson.student} · 已生成应急待办` : '已生成应急待办', selectable: false, actionable: true };
      if (slot.kind === 'subbedOut') return { tone: 'blue', label: 'SUBBED_OUT', detail: lesson ? `${lesson.student} · 已由 ${lesson.subTeacher || '代课老师'} 代课` : '已由代课老师接课', selectable: false, actionable: true };
      if (lesson) {
        if (lesson.status === 'SUBSTITUTED') return { tone: 'blue', label: 'SUBBED_OUT', detail: `${lesson.student} · 已由 ${lesson.subTeacher || '代课老师'} 代课`, selectable: false, actionable: true };
        if (lesson.status === 'LEAVE_PENDING') return { tone: 'rose', label: '已请假 · 待派代课', detail: `${lesson.student} · 已生成应急待办`, selectable: false, actionable: true };
        return { tone: 'yellow', label: '已排课', detail: `${lesson.student} · ${lesson.courseware}`, selectable: true };
      }
      return { tone: 'slate', label: '不可选', detail: '', selectable: false };
    }

    function renderTeacherSlot(slot) {
      const meta = teacherSlotMeta(slot);
      const lesson = slot.lessonId ? lessonById(slot.lessonId) : null;
      const selected = state.batch.selected.includes(slot.id);
      const reason = slot.reason ? `<div class="mt-0.5 text-[12px] font-medium text-rose-800">原因：${esc(slot.reason)}</div>` : '';
      const body = `<span class="grid h-10 w-12 shrink-0 place-items-center rounded-xl bg-white text-[14px] font-bold text-slate-900 ring-1 ring-slate-200">${esc(slot.time)}</span>
        <span class="min-w-0 flex-1">
          <span class="flex flex-wrap items-center gap-1.5">${chip(meta.label, meta.tone)}${lesson && slot.kind !== 'leave' ? `<span class="text-[12px] font-semibold text-slate-600">30min</span>` : ''}</span>
          <span class="mt-1 block truncate text-[12px] font-medium text-slate-600">${esc(meta.detail)}</span>
          ${reason}
        </span>`;
      if (meta.selectable) {
        return `<label class="flex cursor-pointer items-center gap-2.5 rounded-xl border ${selected ? 'border-indigo-400 bg-indigo-50/70' : 'border-slate-200 bg-white'} px-2.5 py-2 transition ${state.online === 'off' ? 'opacity-50' : ''}">
          ${body}
          <input type="checkbox" data-batch-slot="${slot.id}" ${selected ? 'checked' : ''} ${state.online === 'off' ? 'disabled' : ''} class="h-5 w-5 shrink-0 accent-indigo-600">
        </label>`;
      }
      return `<button data-action="open-leave-slot" data-id="${slot.id}" class="flex w-full items-center gap-2.5 rounded-xl border border-slate-200 bg-white px-2.5 py-2 text-left transition hover:bg-slate-50 ${meta.actionable ? '' : 'opacity-70'}">
        ${body}
        ${meta.actionable ? icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-500') : ''}
      </button>`;
    }

    function renderTeacherBoard() {
      const ownPending = state.tasks.filter((t) => t.originTeacher === 'David Miller' && t.status === 'PENDING');
      const selectedCount = state.batch.selected.length;
      const canSubmit = selectedCount > 0 && !!state.batch.reasonType && state.online === 'on';
      return `<div class="space-y-3 p-3.5">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <h2 class="text-[18px] font-bold tracking-tight text-slate-900">今天 · 周二 11-10</h2>
            <p class="mt-0.5 text-[12px] font-medium text-slate-600">David Miller · 08:00-21:30 · 北京时间</p>
          </div>
          <button data-action="switch-role" data-role="sub_teacher" class="inline-flex shrink-0 items-center gap-1 rounded-full border border-slate-200 bg-white px-2.5 py-1.5 text-[12px] font-semibold text-slate-700">${icon('graduation-cap', 'h-3.5 w-3.5')}代课视角</button>
        </div>

        ${ownPending.length ? `<div class="rounded-2xl border border-amber-300 bg-amber-50/50 p-3.5">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">${chip('应急待办计数 ' + ownPending.length, 'amber')}${chip('已通知 Leo', 'slate')}</div>
              <div class="mt-1 text-[12px] font-medium leading-relaxed text-amber-900">已排课请假已汇总到负责班长的应急调度包，指派代课后本课格会变为蓝色 SUBBED_OUT。</div>
            </div>
            <button data-action="switch-role" data-role="monitor" class="shrink-0 text-[12px] font-bold text-amber-900 underline">查看班长视角</button>

    function sortedSubCandidates() {
      return SUB_CANDIDATES
        .filter((c) => c.active && c.qualified && c.free)
        .sort((a, b) => {
          if (a.taughtBefore !== b.taughtBefore) return a.taughtBefore ? -1 : 1;
          if (a.sameLevel !== b.sameLevel) return a.sameLevel ? -1 : 1;
          return a.load - b.load;
        });

            </div>
          </div>`).join('')}
        </div>` : emptyState('clipboard-list', '暂无经办记录', state.role === 'admin' ? '切换班长筛选或完成一次调度操作后，流水会出现在这里。' : '完成请假、挪位、换人、代课或异常处理后，流水会出现在这里。')}

        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">
          ${icon('lock', 'mr-1 inline h-3.5 w-3.5 align-[-2px] text-slate-500')}经办流水只增不改不删；临期变更会同步透出至课酬单出勤明细。
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 已请假时段
     * ------------------------------------------------------------------ */
    function renderLeaveSlotSheet() {
      const slot = slotById(state.leaveSlotId);
      if (!slot) return '';
      const lesson = slot.lessonId ? lessonById(slot.lessonId) : null;
      const meta = teacherSlotMeta(slot);
      const revocable = slot.kind === 'leave' || slot.kind === 'leavePending';
      return sheetShell(`
        ${modalHeader('已请假时段', `${slot.time} - ${endTime(slot.time)} · 30min`)}
        <div class="mt-2.5 rounded-xl border border-slate-200 bg-slate-50/70 px-3 py-2.5">
          <div class="flex flex-wrap items-center gap-1.5">${chip(meta.label, meta.tone)}${lesson ? chip(lesson.student, 'slate') : ''}</div>
          <div class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-700">${esc(meta.detail)}</div>
          ${slot.reason ? `<div class="mt-1 text-[12px] font-semibold text-rose-800">请假原因：${esc(slot.reason)}</div>` : ''}
          ${lesson ? `<div class="mt-2 space-y-0.5 border-t border-slate-200/70 pt-2">${infoRow('课程', lesson.courseware)}${infoRow('教室', 'ClassIn 教室 ' + lesson.room)}</div>` : ''}
        </div>
        ${slot.kind === 'subbedOut' ? `<div class="mt-2 rounded-xl border border-blue-200 bg-blue-50 px-3 py-2 text-[12px] font-semibold leading-relaxed text-blue-900">该课次已由 ${esc(lesson && lesson.subTeacher ? lesson.subTeacher : '代课老师')} 代课，课酬 100% 归代课老师。</div>` : ''}
        ${slot.kind === 'leavePending' ? `<div class="mt-2">${amberNote('应急待办已通知班长', '销假后会撤回对应的待指派代课，原课次恢复为已排课。')}</div>` : ''}
        <div class="mt-4 space-y-2">
          ${revocable ? `<button data-action="revoke-leave" data-id="${slot.id}" class="h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white active:scale-[0.98] ${onlineCls()}">恢复可约 / 销假</button>` : ''}
          <button data-action="close-overlay" class="h-11 w-full rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800">关闭</button>
        </div>
      `);
    }

    /* ------------------------------------------------------------------
     * 抽屉/弹窗调度
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      const el = document.getElementById('overlay');
      if (!state.overlay) { el.innerHTML = ''; return; }
      const type = state.overlay.type;
      if (type === 'lesson') el.innerHTML = renderLessonSheet();
      else if (type === 'reschedule') el.innerHTML = renderRescheduleSheet();
      else if (type === 'softConfirm') el.innerHTML = renderSoftConfirm();
      else if (type === 'changeStudent') el.innerHTML = renderChangeStudentSheet();
      else if (type === 'assignSub') el.innerHTML = renderAssignSubSheet();
      else if (type === 'cellSheet') el.innerHTML = renderCellSheet();
      else if (type === 'classSub') el.innerHTML = renderClassSubSheet();
      else if (type === 'classPause') el.innerHTML = renderClassPauseSheet();
      else if (type === 'exception') el.innerHTML = renderExceptionSheet();
      else if (type === 'leaveSlot') el.innerHTML = renderLeaveSlotSheet();
      else el.innerHTML = '';
      if (window.lucide) lucide.createIcons();
    }

    function modalShell(content, width = 'max-w-[360px]') {
      return `<div class="absolute inset-x-0 bottom-0 top-16 z-50">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-4 top-1/2 mx-auto ${width} max-h-[90%] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl">
          ${content}
        </div>
      </div>`;
    }

    function sheetShell(content) {
      return `<div class="absolute inset-x-0 bottom-0 top-16 z-50">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 mx-auto flex max-h-[92%] w-full max-w-[560px] flex-col overflow-y-auto rounded-t-3xl bg-white p-5 shadow-2xl">
          <div class="mx-auto mb-3 h-1 w-10 shrink-0 rounded-full bg-slate-200"></div>
          ${content}
        </div>
      </div>`;
    }

    function modalHeader(title, subtitle = '') {
      return `<div class="flex items-start justify-between gap-3">
        <div class="flex min-w-0 items-start gap-2.5">
          <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-indigo-100 text-indigo-700">${icon('calendar-range', 'h-4 w-4')}</div>
          <div class="min-w-0">
            <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
            ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
          </div>
        </div>
        <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 角色与页面切换
     * ------------------------------------------------------------------ */
    function setRole(role, options = {}) {
      if (!ROLE_META[role]) return;
      state.role = role;
      state.page = defaultPage(role);
      state.overlay = null;
      state.returnOverlay = null;
      state.lastChangeNote = null;
      state.leaveNotice = null;
      state.picker = null;
      state.changeStudent = null;
      state.assignSub = null;
      state.classDraft = null;
      state.exceptionDraft = null;
      state.leaveSlotId = null;
      state.batch = { selected: [], reasonType: '' };
      state.opsFilter = 'ALL';
      state.scenario = options.scenario || '';
      if (!options.silent) renderAll({ resetScroll: true });
    }

    function navTo(page) {
      const item = navItems().find((n) => n.id === page);
      if (!item) return;
      state.page = page;
      state.overlay = null;
      state.returnOverlay = null;
      state.picker = null;
      state.changeStudent = null;
      state.assignSub = null;
      state.classDraft = null;
      state.exceptionDraft = null;
      state.leaveSlotId = null;
      state.scenario = '';
      renderAll({ resetScroll: true });
    }

    function closeOverlay() {
      if (state.overlay && state.overlay.type === 'softConfirm') return cancelSoft();
      state.overlay = null;
      state.returnOverlay = null;
      state.picker = null;
      state.changeStudent = null;
      state.assignSub = null;
      state.classDraft = null;
      state.exceptionDraft = null;
      state.leaveSlotId = null;
      renderAll();
    }

    function openLesson(lessonId) {
      state.overlay = { type: 'lesson', lessonId };
      renderAll();
    }

    function openReschedule(lessonId, taskId = null) {
      state.picker = { lessonId, taskId, selectedKey: null };
      state.overlay = { type: 'reschedule', lessonId, taskId };
      renderAll();
    }

    function openChangeStudent(lessonId) {
      state.changeStudent = { lessonId, query: '', selected: null };
      state.overlay = { type: 'changeStudent', lessonId };
      renderAll();
    }

    function openAssignSub({ taskId = null, lessonId = null }) {
      state.assignSub = { taskId, lessonId, selected: null };
      state.overlay = { type: 'assignSub', taskId, lessonId };
      renderAll();
    }

    function openException(lessonId, preset = {}) {
      state.exceptionDraft = { lessonId, option: preset.option || 'normal', reason: preset.reason || '' };
      state.overlay = { type: 'exception', lessonId };
      renderAll();
    }

    function openClassSub() {
      state.classDraft = { selected: null };
      state.overlay = { type: 'classSub' };
      renderAll();
    }

    function openClassPause() {
      state.overlay = { type: 'classPause' };
      renderAll();
    }

    function openLeaveSlot(slotId) {
      state.leaveSlotId = slotId;
      state.overlay = { type: 'leaveSlot', slotId };
      renderAll();
    }

    function openCellSheet(lessonId) {
      state.overlay = { type: 'cellSheet', lessonId };
      renderAll();
    }

    /* ------------------------------------------------------------------
     * 家长 / 班长课格动作
     * ------------------------------------------------------------------ */
    function handleLessonLeave(lessonId) {
      requestOrRun('lesson-leave', { lessonId });
    }

    function doLessonLeave(lessonId) {
      const lesson = lessonById(lessonId);
      if (!lesson) return;
      const wasSub = lesson.status === 'SUBSTITUTED';
      lesson.status = 'PENDING';
      lesson.subTeacher = null;
      state.tasks.forEach((task) => {
        if (task.lessonId === lessonId && (task.status === 'PENDING' || task.status === 'ASSIGNED')) task.status = 'CANCELLED';
      });
      const slot = state.slots.find((s) => s.lessonId === lessonId);
      if (slot) { slot.kind = 'free'; slot.reason = ''; }
      state.lastChangeNote = state.hours < 3
        ? { title: '临期变更 · 将透出至课酬单出勤明细', detail: '课次已退回待排期，卡片与课格已释放。' }
        : { title: '课次已退回待排期 · 卡片已释放', detail: '变更将透出至课酬单出勤明细。' };
      addOp({
        action: '请假退期待排',
        subject: `${lesson.student} · ${fmtDate(lesson.date)} ${lesson.time}`,
        detail: '课次退回待排期 · 课格已释放',
        lastMinute: state.hours < 3
      });
      state.overlay = null;
      state.returnOverlay = null;
      renderAll();
      showToast(wasSub ? '已退回待排期 · 原代课委任已解除' : '已退回待排期 · 课格已释放');
    }

    function selectTarget(key) {
      const lesson = lessonById(state.overlay.lessonId);
      if (!lesson) return;
      const target = buildTargets(lesson).find((t) => t.key === key);
      if (!target) return;
      if (target.conflict) {
        showToast('学员该时段已有其他课程', true);
        return;
      }
      state.picker.selectedKey = key;
      renderOverlay();
    }

    function confirmReschedule() {
      if (!state.picker || !state.picker.selectedKey) return showToast('请选择一个合法目标时段', true);
      requestOrRun('lesson-reschedule', {
        lessonId: state.picker.lessonId,
        targetKey: state.picker.selectedKey,
        taskId: state.picker.taskId || null
      });
    }

    function executeReschedule(payload) {
      const lesson = lessonById(payload.lessonId);
      if (!lesson) return;
      const origin = originTeacherOf(lesson);
      const target = (TEACHER_TARGETS[origin] || []).find((t) => t.key === payload.targetKey);
      if (!target) return;
      const wasSub = lesson.status === 'SUBSTITUTED';
      lesson.date = target.date;
      lesson.time = target.time;
      lesson.status = 'SCHEDULED';
      lesson.subTeacher = null;
      if (lesson.type === 'sub') lesson.type = lesson.baseType || 'fixed';
      const slot = state.slots.find((s) => s.lessonId === lesson.id);
      if (slot) { slot.kind = 'free'; slot.reason = ''; }
      if (payload.taskId) {
        const task = taskById(payload.taskId);
        if (task) {
          task.status = 'RESCHEDULED';
          task.date = target.date;
          task.time = target.time;
          task.subTeacher = null;
        }
      } else {
        state.tasks.forEach((task) => {
          if (task.lessonId === lesson.id && task.status === 'PENDING') {
            task.status = 'RESCHEDULED';
            task.date = target.date;
            task.time = target.time;
            task.subTeacher = null;
          }
        });
      }
      addOp({
        action: '同师挪位',
        subject: `${lesson.student} · ${fmtDate(target.date)} ${target.time}`,
        detail: `原时段已释放 · 新时段落盘${wasSub ? ' · 原代课委任已解除' : ' · 已避开学员其他课程'}`,
        lastMinute: state.hours < 3
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.picker = null;
      renderAll();
      showToast(wasSub ? '原时段已释放 · 新时段已落盘，代课委任已解除' : '原时段已释放 · 新时段已落盘');
    }

    function pickStudent(key) {
      if (!state.changeStudent) return;
      state.changeStudent.selected = key;
      renderOverlay();
    }

    function confirmChangeStudent() {
      if (!state.changeStudent || !state.changeStudent.selected) return showToast('请选择一位新的上课学员', true);
      requestOrRun('change-student', {
        lessonId: state.changeStudent.lessonId,
        studentKey: state.changeStudent.selected
      });
    }

    function executeChangeStudent(payload) {
      const lesson = lessonById(payload.lessonId);
      const student = studentByKey(payload.studentKey);
      if (!lesson || !student) return;
      const previous = lesson.student;
      lesson.studentKey = student.key;
      lesson.student = student.name;
      addOp({
        action: '更换实际上课学员',
        subject: `${lesson.student} · ${fmtDate(lesson.date)} ${lesson.time}`,
        detail: `${previous} → ${lesson.student} · 原购课单出资人与资金归属不变`,
        lastMinute: state.hours < 3
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.changeStudent = null;
      renderAll();
      showToast(`已更换为 ${student.name} · 原购课单出资人与资金归属不变`);
    }

    /* ------------------------------------------------------------------
     * 智能筛师与代课指派
     * ------------------------------------------------------------------ */
    function pickSub(name) {
      if (!state.assignSub) return;
      state.assignSub.selected = name;
      renderOverlay();
    }

    function confirmAssignSub() {
      const draft = state.assignSub;
      if (!draft || !draft.selected) return showToast('请选择一位代课老师', true);
      requestOrRun('assign-sub', { taskId: draft.taskId, lessonId: draft.lessonId, teacher: draft.selected });
    }

    function executeAssignSub(payload) {
      let task = payload.taskId ? taskById(payload.taskId) : null;
      let lesson = lessonById(payload.lessonId || (task && task.lessonId));
      if (!lesson) return;
      if (!task) {
        task = state.tasks.find((t) => t.lessonId === lesson.id && ['PENDING', 'ASSIGNED'].includes(t.status)) || null;
      }
      if (!task) {
        task = {
          id: nextTaskId(),
          lessonId: lesson.id,
          student: lesson.student,
          date: lesson.date,
          time: lesson.time,
          originTeacher: originTeacherOf(lesson),
          reason: '临时调度',
          status: 'ASSIGNED',
          owner: operatorOfRole(),
          group: false,
          createdAt: '刚刚',
          assignedAt: '刚刚',
          proactive: true,
          subTeacher: payload.teacher
        };
        state.tasks.unshift(task);
      } else {
        task.status = 'ASSIGNED';
        task.subTeacher = payload.teacher;
        task.assignedAt = '刚刚';
      }
      const origin = task.originTeacher || originTeacherOf(lesson);
      lesson.originTeacher = origin;
      lesson.subTeacher = payload.teacher;
      lesson.status = 'SUBSTITUTED';
      const slot = state.slots.find((s) => s.lessonId === lesson.id);
      if (slot) { slot.kind = 'subbedOut'; slot.subTeacher = payload.teacher; slot.reason = ''; }
      addOp({
        action: '指派代课',
        subject: `${lesson.student} · ${fmtDate(lesson.date)} ${lesson.time}`,
        detail: `${origin} → ${payload.teacher} · 原任老师蓝色 SUBBED_OUT / 代课老师紫色 SUBBED_IN`,
        lastMinute: state.hours < 3
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.assignSub = null;
      renderAll();
      showToast(`已指派 ${payload.teacher} 代课 · 原任老师蓝色、代课老师紫色`);
    }

    function executeRevokeSub(payload) {
      const task = taskById(payload.taskId);
      if (!task) return;
      const lesson = lessonById(task.lessonId);
      const subTeacher = task.subTeacher;
      task.status = task.proactive ? 'CANCELLED' : 'PENDING';
      task.subTeacher = null;
      if (lesson) {
        lesson.subTeacher = null;
        lesson.status = task.proactive ? 'SCHEDULED' : 'LEAVE_PENDING';
        const slot = state.slots.find((s) => s.lessonId === lesson.id);
        if (slot) {
          slot.kind = task.proactive ? 'lesson' : 'leavePending';
          slot.subTeacher = null;
        }
      }
      addOp({
        action: '撤销代课指派',
        subject: task ? `${task.student} · ${fmtDate(task.date)} ${task.time}` : '',
        detail: `${subTeacher || '代课老师'} 代课已撤销 · ${task.proactive ? '恢复原任老师已排课' : '恢复待指派'}`,
        lastMinute: state.hours < 3
      });
      state.overlay = null;
      state.returnOverlay = null;
      renderAll();
      showToast('代课已撤销 · ' + (task.proactive ? '恢复原任老师已排课' : '恢复待指派'));
    }

    function returnTask(taskId) {
      if (!guardWrite()) return;
      const task = taskById(taskId);
      if (!task) return;
      task.status = 'RETURNED';
      const lesson = lessonById(task.lessonId);
      if (lesson) {
        lesson.status = 'PENDING';
        lesson.subTeacher = null;
        const slot = state.slots.find((s) => s.lessonId === lesson.id);
        if (slot) { slot.kind = 'free'; slot.reason = ''; }
      }
      addOp({
        action: '退回待排期',
        subject: `${task.student} · ${fmtDate(task.date)} ${task.time}`,
        detail: '受影响课次已退回待排期 · 课格已释放',
        lastMinute: state.hours < 3
      });
      renderAll();
      showToast('已退回待排期 · 学员课次已释放');
    }

    /* ------------------------------------------------------------------
     * 小班代课
     * ------------------------------------------------------------------ */
    function pickClassSub(name) {
      if (!state.classDraft) return;
      state.classDraft.selected = name;
      renderOverlay();
    }

    function confirmClassSub() {
      if (!state.classDraft || !state.classDraft.selected) return showToast('请选择一位连续双格空闲的老师', true);
      requestOrRun('class-assign', { teacher: state.classDraft.selected });
    }

    function executeClassAssign(payload) {
      state.classState = { status: 'assigned', subTeacher: payload.teacher };
      addOp({
        action: '小班代课指派',
        subject: `${CLASS_INFO.name} · ${fmtDate(CLASS_INFO.date)} ${CLASS_INFO.time}-${CLASS_INFO.end}`,
        detail: `${CLASS_INFO.teacher} → ${payload.teacher} · 连续双格代课 · 课酬按原班级快照平移`,
        lastMinute: state.hours < 3
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.classDraft = null;
      renderAll();
      showToast(`已指派 ${payload.teacher} · 小班课酬按原班级快照平移`);
    }

    function confirmClassPause() {
      if (!guardWrite()) return;
      state.classState = { status: 'paused', subTeacher: null };
      addOp({
        action: '小班暂停待排',
        subject: `${CLASS_INFO.name} · ${fmtDate(CLASS_INFO.date)} ${CLASS_INFO.time}-${CLASS_INFO.end}`,
        detail: 'TS 退回班级待排池 · 释放日历双格 · 不向小班家长发送应用内通知',
        lastMinute: state.hours < 3
      });
      state.overlay = null;
      state.returnOverlay = null;
      renderAll();
      showToast('已暂停待排 · TS 退回班级待排池，系统不向小班家长发送应用内通知');
    }

    function revokeClassSub() {
      requestOrRun('class-revoke', {});
    }

    function executeClassRevoke() {
      const previous = state.classState.subTeacher;
      state.classState = { status: 'scheduled', subTeacher: null };
      addOp({
        action: '撤销小班代课',
        subject: `${CLASS_INFO.name} · ${fmtDate(CLASS_INFO.date)} ${CLASS_INFO.time}-${CLASS_INFO.end}`,
        detail: `${previous || '代课老师'} 小班代课已撤销 · 恢复原任老师`,
        lastMinute: state.hours < 3
      });
      state.overlay = null;
      state.returnOverlay = null;
      renderAll();
      showToast('小班代课已撤销 · 恢复原任老师');
    }

    /* ------------------------------------------------------------------
     * 老师批量请假与销假
     * ------------------------------------------------------------------ */
    function toggleBatchSlot(slotId, checked) {
      if (!guardWrite()) {
        updateBatchControls();
        return;
      }
      const slot = slotById(slotId);
      if (!slot || !['free', 'lesson'].includes(slot.kind)) { updateBatchControls(); return; }
      const selected = new Set(state.batch.selected);
      if (checked) {
        if (selected.size >= MAX_BATCH) {
          showToast('单次最多勾选 12 节，请先取消其他时段', true);
          updateBatchControls();
          return;
        }
        selected.add(slotId);
      } else {
        selected.delete(slotId);
      }
      state.batch.selected = Array.from(selected);
      updateBatchControls();
    }

    function setBatchReason(reason) {
      state.batch.reasonType = reason;
      document.querySelectorAll('[data-reason]').forEach((btn) => {
        const on = btn.dataset.reason === reason;
        btn.className = `rounded-full px-3 py-1.5 text-[12px] font-semibold transition ${on ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200/80'}`;
      });
      updateBatchControls();
    }

    function updateBatchControls() {
      const count = state.batch.selected.length;
      const countEl = document.getElementById('batchCount');
      if (countEl) countEl.textContent = `已选 ${count} / 12`;
      const submit = document.getElementById('submitLeave');
      const enabled = count > 0 && !!state.batch.reasonType && state.online === 'on';
      if (submit) {
        submit.disabled = !enabled;
        submit.className = `h-11 w-full rounded-xl text-[16px] font-semibold transition active:scale-[0.98] ${enabled ? 'bg-indigo-600 text-white' : 'cursor-not-allowed bg-slate-200 text-slate-500'}`;
        submit.textContent = count ? `提交请假（${count} 节）` : '提交请假';
      }
      document.querySelectorAll('[data-batch-slot]').forEach((cb) => {
        const on = state.batch.selected.includes(cb.dataset.batchSlot);
        cb.checked = on;
        const label = cb.closest('label');
        if (label) {
          label.className = `flex cursor-pointer items-center gap-2.5 rounded-xl border ${on ? 'border-indigo-400 bg-indigo-50/70' : 'border-slate-200 bg-white'} px-2.5 py-2 transition ${state.online === 'off' ? 'opacity-50' : ''}`;
        }
      });
    }

    function submitTeacherLeave() {
      if (!guardWrite()) return;
      const selected = state.batch.selected.slice();
      if (!selected.length) return showToast('请先勾选要请假的时段', true);
      if (!state.batch.reasonType) return showToast('请选择一个请假原因', true);
      let freed = 0;
      let tasksCreated = 0;
      selected.forEach((slotId) => {
        const slot = slotById(slotId);
        if (!slot) return;
        if (slot.kind === 'free') {
          slot.kind = 'leave';
          slot.reason = state.batch.reasonType;
          freed += 1;
          return;
        }
        if (slot.kind !== 'lesson') return;
        const lesson = lessonById(slot.lessonId);
        if (!lesson || !['SCHEDULED', 'LEAVE_PENDING'].includes(lesson.status)) return;
        slot.kind = 'leavePending';
        slot.reason = state.batch.reasonType;
        if (lesson.status !== 'LEAVE_PENDING') {
          lesson.status = 'LEAVE_PENDING';
          const existing = state.tasks.find((t) => t.lessonId === lesson.id && ['PENDING', 'ASSIGNED'].includes(t.status));
          if (!existing) {
            state.tasks.unshift({
              id: nextTaskId(),
              lessonId: lesson.id,
              student: lesson.student,
              date: lesson.date,
              time: lesson.time,
              originTeacher: lesson.teacher,
              reason: state.batch.reasonType,
              status: 'PENDING',
              owner: 'Leo',
              group: false,
              createdAt: '刚刚',
              proactive: false
            });
            tasksCreated += 1;
          }
        }
      });
      const total = selected.length;
      state.leaveNotice = {
        title: `已提交 ${total} 节请假`,
        detail: tasksCreated
          ? `空闲 ${freed} 格已置红 · ${tasksCreated} 个应急待办已通知负责班长 Leo`
          : `空闲 ${freed} 格已置红 · 未影响已排课次`
      };
      addOp({
        action: '老师批量请假',
        subject: `David Miller · 今天 ${total} 节`,
        detail: `空闲 ${freed} 格置红 · ${tasksCreated} 节生成应急待办并通知班长 Leo`,
        operator: 'David'
      });
      state.batch = { selected: [], reasonType: '' };
      renderAll();
      showToast(`已提交 ${total} 节请假${tasksCreated ? ` · ${tasksCreated} 个应急待办已通知 Leo` : ''}`);
    }

    function revokeLeaveSlot(slotId) {
      if (!guardWrite()) return;
      const slot = slotById(slotId);
      if (!slot) return;
      if (slot.kind === 'subbedOut') return showToast('该课次已由代课老师接课，不能直接销假', true);
      if (slot.kind === 'leave') {
        slot.kind = 'free';
        slot.reason = '';
        addOp({ action: '销假', subject: `David Miller · ${slot.time}`, detail: '请假时段恢复为空闲可约，阻断解除', operator: 'David' });
        state.overlay = null;
        state.returnOverlay = null;
        renderAll();
        showToast('已销假 · 该时段恢复空闲可约');
        return;
      }
      if (slot.kind === 'leavePending') {
        const lesson = lessonById(slot.lessonId);
        if (lesson) lesson.status = 'SCHEDULED';
        state.tasks.forEach((task) => {
          if (lesson && task.lessonId === lesson.id && task.status === 'PENDING') task.status = 'CANCELLED';
        });
        slot.kind = 'lesson';
        slot.reason = '';
        addOp({
          action: '销假',
          subject: lesson ? `${lesson.student} · ${fmtDate(lesson.date)} ${slot.time}` : `David Miller · ${slot.time}`,
          detail: '已撤回应急待办 · 原课次恢复已排课',
          operator: 'David'
        });
        state.overlay = null;
        state.returnOverlay = null;
        renderAll();
        showToast('已销假 · 应急待办已撤回，课次恢复已排课');
      }
    }

    /* ------------------------------------------------------------------
     * 异常处置
     * ------------------------------------------------------------------ */
    function pickException(kind) {
      if (!state.exceptionDraft) return;
      state.exceptionDraft.option = kind;
      renderOverlay();
    }

    function updateExceptionControls() {
      if (!state.exceptionDraft) return;
      const ok = String(state.exceptionDraft.reason || '').trim().length >= 4;
      const hint = document.getElementById('exceptionReasonHint');
      if (hint) {
        hint.textContent = ok ? '原因长度符合要求' : '请填写至少 4 个字的处置原因';
        hint.className = `font-medium ${ok ? 'text-emerald-700' : 'text-rose-600'}`;
      }
      const confirm = document.getElementById('confirmException');
      if (confirm) confirm.disabled = !ok || state.online === 'off';
    }

    function confirmException() {
      if (!guardWrite()) return;
      const draft = state.exceptionDraft;
      if (!draft) return;
      const reason = String(draft.reason || '').trim();
      if (reason.length < 4) return showToast('请填写至少 4 个字的处置原因', true);
      const lesson = lessonById(draft.lessonId);
      if (!lesson) return;
      const option = EXCEPTION_OPTIONS.find((o) => o.kind === draft.option) || EXCEPTION_OPTIONS[0];
      lesson.exception = option.label;
      if (option.kind === 'normal' || option.kind === 'student_absent') {
        lesson.status = 'COMPLETED';
      } else if (option.kind === 'compensate') {
        lesson.status = 'COMPENSATED';
        lesson.makeupTs = 1;
      } else {
        lesson.status = 'PENDING';
      }
      if (option.kind === 'teacher_absent' || option.kind === 'compensate') lesson.makeupTs = 1;
      if (option.kind === 'teacher_absent' || option.kind === 'cancel' || option.kind === 'compensate') {
        const slot = state.slots.find((s) => s.lessonId === lesson.id);
        if (slot) { slot.kind = 'free'; slot.reason = ''; }
      }
      addOp({
        action: option.label,
        subject: `${lesson.student} · ${fmtDate(lesson.date)} ${lesson.time}`,
        detail: `${option.impact} 原因：${reason}`,
        lastMinute: false
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.exceptionDraft = null;
      renderAll();
      showToast(`已记录：${option.label} · 影响已同步至课酬单出勤明细`);
    }

    /* ------------------------------------------------------------------
     * 温和确认执行器
     * ------------------------------------------------------------------ */
    function confirmSoft() {
      const overlay = state.overlay;
      if (!overlay || overlay.type !== 'softConfirm') return;
      const kind = overlay.kind;
      const payload = overlay.payload;
      state.overlay = null;
      state.returnOverlay = null;
      executeSoftAction(kind, payload);
    }

    function cancelSoft() {
      if (state.returnOverlay) {
        state.overlay = state.returnOverlay;
        state.returnOverlay = null;
        renderAll();
        return;
      }
      state.overlay = null;
      state.returnOverlay = null;
      renderAll();
    }

    function executeSoftAction(kind, payload) {
      if (kind === 'lesson-leave') return doLessonLeave(payload.lessonId);
      if (kind === 'lesson-reschedule') return executeReschedule(payload);
      if (kind === 'change-student') return executeChangeStudent(payload);
      if (kind === 'assign-sub') return executeAssignSub(payload);
      if (kind === 'revoke-sub') return executeRevokeSub(payload);
      if (kind === 'class-assign') return executeClassAssign(payload);
      if (kind === 'class-revoke') return executeClassRevoke(payload);
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((btn) => {
        const key = btn.dataset.group;
        const value = btn.dataset.value;
        const current = key === 'hours' ? String(state.hours) : state[key];
        const active = String(current) === String(value);
        btn.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}`;
      });
      document.querySelectorAll('[data-scenario]').forEach((btn) => {
        const active = state.scenario === btn.dataset.scenario;
        btn.className = `scenario rounded-full border px-2.5 py-1 font-semibold transition ${active ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}`;
      });
    }

    function runScenario(key) {
      state.online = 'on';
      state.overlay = null;
      state.returnOverlay = null;
      state.picker = null;
      state.changeStudent = null;
      state.assignSub = null;
      state.classDraft = null;
      state.exceptionDraft = null;
      state.leaveSlotId = null;
      state.lastChangeNote = null;
      state.leaveNotice = null;
      state.batch = { selected: [], reasonType: '' };

      if (key === 'parentLeave') {
        state.hours = 2;
        setRole('parent', { silent: true, scenario: key });
        state.overlay = { type: 'lesson', lessonId: 'lsn_alice_tue' };
      } else if (key === 'parentConflict') {
        state.hours = 3;
        setRole('parent', { silent: true, scenario: key });
        state.picker = { lessonId: 'lsn_alice_tue', taskId: null, selectedKey: null };
        state.overlay = { type: 'reschedule', lessonId: 'lsn_alice_tue' };
      } else if (key === 'teacherBatch') {
        state.hours = 3;
        setRole('teacher', { silent: true, scenario: key });
        state.batch = { selected: ['d_0900', 'd_1000', 'd_1900'], reasonType: '突发急病就医' };
      } else if (key === 'monitorOps') {
        state.hours = 3;
        setRole('monitor', { silent: true, scenario: key });
        state.page = 'ops';
      } else if (key === 'classSub') {
        state.hours = 3;
        setRole('monitor', { silent: true, scenario: key });
        state.page = 'class';
        state.classDraft = { selected: null };
        state.overlay = { type: 'classSub' };
      } else if (key === 'exception') {
        state.hours = 3;
        setRole('monitor', { silent: true, scenario: key });
        state.page = 'exception';
        state.exceptionDraft = { lessonId: 'lsn_bob_mon', option: 'compensate', reason: 'ClassIn 进出记录核对，确认未上课' };
        state.overlay = { type: 'exception', lessonId: 'lsn_bob_mon' };
      } else if (key === 'records') {
        state.hours = 3;
        setRole('monitor', { silent: true, scenario: key });
        state.page = 'records';
      }
      renderAll({ resetScroll: true });
    }

    /* ------------------------------------------------------------------
     * 事件绑定
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') {
          setRole(value);
          return;
        }
        if (group === 'device') {
          state.device = value;
          renderAll();
          return;
        }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') {
            state.overlay = null;
            state.returnOverlay = null;
          }
          renderAll();
          showToast(value === 'off' ? '离线只读：请假 / 挪位 / 换人 / 代课不可用' : '已恢复在线，操作可用', value === 'off');
          return;
        }
        if (group === 'hours') {
          state.hours = Number(value);
          renderAll();
          showToast(state.hours < 3 ? '已切换为临期场景：操作仅弹温和确认，不阻断' : '已切换为常规场景：操作直接生效');
        }
      });
    });

    document.getElementById('btnResetDemo').addEventListener('click', () => {
      resetState();
      renderAll({ resetScroll: true });
      showToast('演示数据已重置');
    });

    document.querySelectorAll('[data-scenario]').forEach((btn) => {
      btn.addEventListener('click', () => runScenario(btn.dataset.scenario));
    });

    document.getElementById('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.page);
      if (action === 'switch-role') return setRole(el.dataset.role);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'close-overlay') return closeOverlay();
      if (action === 'set-child') {
        state.child = el.dataset.key;
        state.lastChangeNote = null;
        renderAll();
        return;
      }
      if (action === 'open-lesson') return openLesson(el.dataset.id);
      if (action === 'copy-room') {
        const room = el.dataset.room || '';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(room).catch(() => {});
        }
        return showToast(`教室号已复制：${room}`);
      }
      if (action === 'lesson-leave') return handleLessonLeave(el.dataset.id);
      if (action === 'lesson-reschedule') return openReschedule(el.dataset.id);
      if (action === 'select-target') return selectTarget(el.dataset.key);
      if (action === 'confirm-reschedule') return confirmReschedule();
      if (action === 'cancel-soft') return cancelSoft();
      if (action === 'confirm-soft') return confirmSoft();
      if (action === 'pick-student') return pickStudent(el.dataset.key);
      if (action === 'confirm-change') return confirmChangeStudent();
      if (action === 'open-leave-slot') return openLeaveSlot(el.dataset.id);
      if (action === 'revoke-leave') return revokeLeaveSlot(el.dataset.id);
      if (action === 'set-reason') return setBatchReason(el.dataset.reason);
      if (action === 'submit-leave') return submitTeacherLeave();
      if (action === 'assign-task') return openAssignSub({ taskId: el.dataset.id });
      if (action === 'return-task') return returnTask(el.dataset.id);
      if (action === 'shift-task') {
        const task = taskById(el.dataset.id);
        if (!task) return;
        return openReschedule(task.lessonId, task.id);
      }
      if (action === 'revoke-task') return requestOrRun('revoke-sub', { taskId: el.dataset.id });
      if (action === 'open-cell') return openCellSheet(el.dataset.id);
      if (action === 'cell-leave') return handleLessonLeave(el.dataset.id);
      if (action === 'cell-reschedule') return openReschedule(el.dataset.id);
      if (action === 'cell-change') return openChangeStudent(el.dataset.id);
      if (action === 'cell-assign') return openAssignSub({ lessonId: el.dataset.id });
      if (action === 'cell-exception') return openException(el.dataset.id);
      if (action === 'open-exception') return openException(el.dataset.id);
      if (action === 'pick-exception') return pickException(el.dataset.kind);
      if (action === 'confirm-exception') return confirmException();
      if (action === 'pick-sub') return pickSub(el.dataset.name);
      if (action === 'confirm-assign-sub') return confirmAssignSub();
      if (action === 'open-class-sub') return openClassSub();
      if (action === 'pick-class-sub') return pickClassSub(el.dataset.name);
      if (action === 'confirm-class-sub') return confirmClassSub();
      if (action === 'open-class-pause') return openClassPause();
      if (action === 'confirm-class-pause') return confirmClassPause();
      if (action === 'revoke-class') return revokeClassSub();
    });

    document.getElementById('frame').addEventListener('change', (event) => {
      const target = event.target;
      if (target.matches('[data-batch-slot]')) {
        toggleBatchSlot(target.dataset.batchSlot, target.checked);
        return;
      }
      const changeEl = target.closest('[data-change]');
      if (changeEl && changeEl.dataset.change === 'ops-filter') {
        state.opsFilter = changeEl.value;
        renderAll();
      }
    });

    document.getElementById('frame').addEventListener('input', (event) => {
      if (event.target.id === 'studentSearch') {
        filterStudentRows(event.target);
        return;
      }
      if (event.target.id === 'exceptionReason' && state.exceptionDraft) {
        state.exceptionDraft.reason = event.target.value;
        updateExceptionControls();
      }
    });

    /* ------------------------------------------------------------------
     * URL 参数与启动
     * ------------------------------------------------------------------ */
    function applyUrlScenario() {
      const params = new URLSearchParams(window.location.search);
      const roleParam = params.get('role');
      const role = roleParam === 'sub' ? 'sub_teacher' : roleParam;
      if (role && ROLE_META[role]) state.role = role;
      const device = params.get('device');
      if (device === 'tablet' || device === 'mobile') state.device = device;
      const online = params.get('online');
      if (online === 'off' || online === 'on') state.online = online;
      const hours = params.get('hours');
      if (hours === '2' || hours === '<3' || hours === 'lt3') state.hours = 2;
      if (hours === '3' || hours === '>=3' || hours === 'gte3') state.hours = 3;
      state.page = defaultPage(state.role);
      const pageParam = params.get('page');
      if (pageParam && navItems().some((item) => item.id === pageParam)) state.page = pageParam;
      const scenario = params.get('scenario');
      if (scenario) {
        runScenario(scenario);
        return;
      }
      renderAll({ resetScroll: true });
    }

    resetState();
    applyUrlScenario();
  </script>
</body>
</html>

    function isoToTs(iso) { return Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10))); }
    function isoAdd(iso, days) { return new Date(isoToTs(iso) + days * 86400000).toISOString().slice(0, 10); }
    function diffDays(a, b) { return Math.round((isoToTs(a) - isoToTs(b)) / 86400000); }
    function weekdayLabel(iso) { return DAY_LABELS[(new Date(isoToTs(iso)).getUTCDay() + 6) % 7]; }

    function fmtDate(iso) { return `${iso.slice(5)} (${weekdayLabel(iso)})`; }

      const [h, m] = time.split(':').map(Number);
      const total = h * 60 + m + count * 30;
      return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
    }

    function roleMeta() { return ROLE_META[state.role]; }
    function navItems() { return NAVS[state.role]; }
    function boardTab() { return (state.role === 'monitor' || state.role === 'admin') ? 'ops' : 'schedule'; }
    function studentByKey(key) { return STUDENTS.find((s) => s.key === key) || STUDENTS[0]; }
    function lessonById(id) { return state.lessons.find((l) => l.id === id) || null; }
    function activeLesson() { return lessonById(state.activeLessonId); }
    function quotaOf(key) { return state.quota[key] || { used: 0, max: 0 }; }
    function pendingCount() {
      const emgSourceIds = new Set((state.emergency?.lessons || []).map((l) => l.sourceLessonId).filter(Boolean));
      const statePending = state.lessons.filter((l) => l.status === 'PENDING_SUBSTITUTE' && !emgSourceIds.has(l.id)).length;
      const emgOpen = state.emergency ? state.emergency.lessons.filter((l) => l.status === 'AFFECTED').length : 0;
      return statePending + emgOpen;
    }
    function substitutedCount() { return state.lessons.filter((l) => l.status === 'SUBSTITUTED').length; }
    function lessonsOf(key) { return state.lessons.filter((l) => l.studentKey === key); }

    let auditSeq = 1;

    function fmtHours(hours) {
      if (hours < 1) return `${Math.round(hours * 60)}m`;
      return Number.isInteger(hours) ? `${hours}h` : `${hours.toFixed(1)}h`;
    }

    function forecastHours(iso, time) {
      const [h, m] = time.split(':').map(Number);
      const dayOffset = Math.max(0, diffDays(iso, TODAY));
      return Math.max(0.5, Math.round((dayOffset * 24 + (h + m / 60 - 12)) * 10) / 10);
    }

    function tierOf(hoursLeft) {
      if (hoursLeft < 3) {
        return {
          key: 'BREAK_GLASS',
          label: '<3h 紧急期',
          cls: 'border-rose-200 bg-rose-50 text-rose-700',
          rule: '突发绿色通道（<3h）：免扣退回待排期；同师平移已锁定。'
        };
      }
      if (hoursLeft < 24) {
        return {
          key: 'URGENT',
          label: '3~24h 中段期',
          cls: 'border-amber-200 bg-amber-50 text-amber-800',
          rule: '优先指派代课或同师平移；不可直接退回待排期。'
        };
      }
      return {
        key: 'REGULAR',
        label: '≥24h 正常期',
        cls: 'border-emerald-200 bg-emerald-50 text-emerald-700',
        rule: '可同师平移或免扣退回待排期；配额扣减 0 次。'
      };
    }

    function hoursChip(hoursLeft) {
      const cls = hoursLeft < 3
        ? 'border-rose-200 bg-rose-50 text-rose-700'
        : hoursLeft < 24
          ? 'border-amber-200 bg-amber-50 text-amber-800'
          : 'border-slate-200 bg-slate-50 text-slate-500';
      return `<span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${cls}">距开课 ${fmtHours(hoursLeft)}</span>`;
    }

    function emergencyStatusMeta(status) {
      const map = {
        AFFECTED: { label: '待处置', cls: 'border-rose-200 bg-rose-50 text-rose-700' },
        SUBSTITUTED: { label: '已指派代课', cls: 'border-indigo-200 bg-indigo-50 text-indigo-700' },
        PENDING_REBOOK: { label: '已免扣退回', cls: 'border-slate-200 bg-slate-100 text-slate-600' },
        RESCHEDULED: { label: '已同师平移', cls: 'border-emerald-200 bg-emerald-50 text-emerald-700' }
      };
      return map[status] || map.AFFECTED;
    }

    function activeEmergencyLesson(lessonId) {
      if (!lessonId || !state.emergency) return null;
      return state.emergency.lessons.find((l) => l.sourceLessonId === lessonId && l.status === 'AFFECTED') || null;
    }

    function lessonStatusMeta(l) {
      if (activeEmergencyLesson(l.id)) {
        return { label: '应急调度中', cls: 'border-rose-200 bg-rose-50 text-rose-700' };
      }
      return statusMeta(l.status);
    }

    function emergencyLessonNote(emg) {
      if (state.role === 'teacher') return `原师突发不可抗力：班长应急调度中 · ${tierOf(emg.hoursLeft).label} · 待处置`;
      if (state.role === 'monitor') return `应急调度包待处置 · 距开课 ${fmtHours(emg.hoursLeft)}`;
      return '老师突发不可抗力，班长正在紧急协调代课；本次变动绝不扣减任何请假配额';
    }

    function groupByStudent(lessons) {
      return STUDENTS
        .map((s) => ({ name: s.name, count: lessons.filter((l) => l.studentKey === s.key).length }))
        .filter((x) => x.count > 0)
        .map((x) => `${x.name} ${x.count} 节`);
    }

    function typeMeta(type) {
      return type === 'fixed'
        ? { label: '固定位', cls: 'border-amber-200 bg-amber-50 text-amber-800' }
        : { label: '临时课', cls: 'border-amber-200 bg-amber-50 text-amber-800' };
    }

    function statusMeta(status) {
      const map = {
        SCHEDULED: { label: '已排期', cls: 'border-slate-200 bg-slate-100 text-slate-600' },
        SUBSTITUTED: { label: '被代课', cls: 'border-indigo-200 bg-indigo-50 text-indigo-700' },
        PENDING_SUBSTITUTE: { label: '已请假 · 待代课', cls: 'border-rose-200 bg-rose-50 text-rose-700' },
        PENDING_REBOOK: { label: '已退回待排期', cls: 'border-slate-200 bg-slate-100 text-slate-500' }
      };
      return map[status] || map.SCHEDULED;
    }

    function lessonNote(l) {
      const emg = activeEmergencyLesson(l.id);
      if (emg) return emergencyLessonNote(emg);
      if (l.adminSpecial) return `管理员特批请假：免扣配额，课次已退回待排期（已审计）${l.teacherCompensated ? ' · 平台补偿教师课酬' : ''}`;
      if (l.adminNormal) return '管理员常规代请假：扣 1 次配额，课次已退回待排期（已审计）';
      if (l.adminRescheduled) return `管理员代挪位：免扣配额，已更新至 ${fmtDate(l.date)} ${l.time}（已审计）`;
      if (l.status === 'SUBSTITUTED') {
        if (state.role === 'teacher') return `由 ${l.sub} 代上，不计入个人课酬`;
        if (state.role === 'sub_teacher') return `替 ${TEACHER_NAME} 代课，课酬计入本人周结单`;
        if (state.role === 'monitor') return `已由 ${l.sub} 代课，资金持有人保持 Leo 不变`;
        return `本节由代课老师 ${l.sub} 上课，教学进度不受影响`;
      }
      if (l.status === 'PENDING_SUBSTITUTE') {
        if (state.role === 'teacher') return '已请假，等待班长指派代课老师';
        if (state.role === 'monitor') return `原师请假：${l.leaveReason || '临时请假'}，待指派代课`;
        return '教师请假，班长正在协调代课，无需操作';
      }
      if (l.status === 'PENDING_REBOOK') {
        return l.quotaExempt
          ? '教师原因退期待排，已物理豁免扣减学生请假配额'
          : `已请假退回待排期，扣减 1 次请假配额（剩余 ${quotaOf(l.studentKey).max - quotaOf(l.studentKey).used} 次）`;
      }
      return `${TEACHER_NAME} · KET备考`;
    }

    function lessonBorder(l) {
      if (activeEmergencyLesson(l.id)) return 'border-rose-300';
      if (l.status === 'SUBSTITUTED') return state.role === 'sub_teacher' ? 'border-indigo-200' : 'border-indigo-200';
      if (l.status === 'PENDING_SUBSTITUTE') return 'border-rose-200';
      if (l.status === 'PENDING_REBOOK') return 'border-slate-200';
      return 'border-slate-200';
    }

    function quotaBarClass(left, max) {
      if (left <= 0) return 'w-0';
      if (max <= 0 || left >= max) return 'w-full';
      if (left * 2 === max) return 'w-1/2';
      return 'w-full';
    }

    function slotState(dayISO, time) {
      const l = activeLesson();
      if (!l) return '';
      if (dayISO === l.date && time === l.time) return 'ORIGIN';
      const other = state.lessons.find((x) => x.id !== l.id && x.date === dayISO && x.time === time
        && ['SCHEDULED', 'SUBSTITUTED', 'PENDING_SUBSTITUTE'].includes(x.status));
      if (other) return 'OCCUPIED';
      if (MOCK_OCCUPIED[`${dayISO}_${time}`]) return 'OCCUPIED';
      if (MOCK_GREEN[`${dayISO}_${time}`]) return 'GREEN';
      return '';
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线只读：请假 / 挪位 / 指派代课 / 停课不可用', true);
        }
        if (group === 'hours') { state.hours = Number(value); renderAll(); }
      });
    });
    document.getElementById('btnResetDemo').addEventListener('click', resetDemo);

    function setRole(role) {
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.page = 'board';
      state.navTab = boardTab();
      state.child = 'alice';
      state.activeLessonId = null;
      state.overlay = null;
      state.picker = null;
      state.batch = null;
      state.adminLeave = null;
      renderAll();
    }

    function navTo(tab) {
      const item = navItems().find((n) => n.id === tab);
      if (!item) return;
      state.overlay = null;
      state.activeLessonId = null;
      if (item.board) {
        state.page = 'board';
        state.navTab = tab;
      } else {
        state.page = 'placeholder';
        state.navTab = tab;
      }
      renderAll();
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const active = String(state[b.dataset.group]) === String(b.dataset.value);
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;
      });
    }

    function resetDemo() {
      state.role = 'parent';
      state.page = 'board';
      state.navTab = 'schedule';
      state.device = 'mobile';
      state.online = 'on';
      state.hours = 32;
      state.child = 'alice';
      state.activeLessonId = null;
      state.overlay = null;
      state.lessons = clone(INITIAL_LESSONS);
      state.quota = clone(INITIAL_QUOTA);
      state.freeSlots = clone(INITIAL_FREE);
      state.classCancelled = false;
      state.picker = null;
      state.batch = null;
      state.lastBatchLeave = null;
      state.teacherLeaveSlots = [];
      state.emergency = clone(INITIAL_EMERGENCY);
      state.adminLeave = null;
      state.adminAudit = [];
      auditSeq = 1;
      renderAll();
      showToast('演示数据已重置');
    }

    /* ------------------------------------------------------------------
     * 外壳：顶栏 / 时限横幅 / 底部导航
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = document.getElementById('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      document.getElementById('banner').innerHTML = renderBanner();
      document.getElementById('scenarioBanner').innerHTML = renderScenarioBanner();

      const banner = document.getElementById('offlineBanner');
      banner.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';

      document.getElementById('content').innerHTML = renderContent();
      document.getElementById('bottomnav').innerHTML = renderNav();
      renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.role === 'parent') return renderParentBoard();
      if (state.role === 'teacher') return renderTeacherBoard();
      if (state.role === 'sub_teacher') return renderSubBoard();
      if (state.role === 'admin') return renderAdminBoard();
      return renderMonitorBoard();
    }

    function renderBanner() {
      const b = BANNERS[state.role];
      return `
        <header class="relative flex h-[68px] shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${b.gradient} px-4 text-white">
          ${b.pattern}
          <div class="relative flex min-w-0 items-center gap-2.5">
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${b.initial}</span>
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="truncate text-[16px] font-bold">${esc(b.brand)}</span>
                <span class="shrink-0 rounded-full bg-white/20 px-2 py-0.5 text-[12px] font-bold">${esc(b.role)}</span>
              </div>
              <div class="truncate text-[12px] text-white/70">${esc(b.subtitle)}</div>
            </div>
          </div>
          <button data-action="toast" data-message="暂无新消息" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
            ${icon('bell', 'h-4 w-4')}
            <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-rose-400 ring-1 ring-white/50"></span>
          </button>
        </header>`;
    }

    function renderScenarioBanner() {
      const meta = state.hours >= 24
        ? { tag: '≥24h', cls: 'border-emerald-200 bg-emerald-50 text-emerald-900', tagCls: 'bg-emerald-200 text-emerald-900' }
        : state.hours >= 3
          ? { tag: '3~24h', cls: 'border-amber-200 bg-amber-50 text-amber-900', tagCls: 'bg-amber-200 text-amber-900' }
          : { tag: '<3h', cls: 'border-rose-200 bg-rose-50 text-rose-900', tagCls: 'bg-rose-200 text-rose-900' };
      const base = state.hours >= 24
        ? '正常期：临时课可请假退回待排期（扣 1 次配额）；同师挪位免扣配额'
        : state.hours >= 3
          ? '中段期：禁止请假退回待排期，仅支持同师挪位或课程转让'
          : '授课准备期：老师正在备课，关闭请假与改期，缺席照常结课扣费';
      const roleNote = state.role === 'teacher'
        ? '；教师突发请假仍可提交，系统紧急调配代课'
        : state.role === 'monitor'
          ? '；代课撤销 ≥24h 可用'
          : state.role === 'sub_teacher'
            ? '；代课任务 <24h 刚性锁定'
            : state.role === 'admin'
              ? '；管理员代操作：常规代请假扣配额，特批请假需 ≥10 字原因并审计'
              : '';
      return `
        <div class="flex items-center justify-between gap-2 border-b px-3 py-2 ${meta.cls}">
          <div class="flex min-w-0 items-center gap-1.5 text-[12px] font-medium leading-relaxed">
            ${icon('clock', 'h-3.5 w-3.5 shrink-0')}
            <span class="min-w-0">${esc(base + roleNote)}</span>
          </div>
          <span class="shrink-0 rounded px-1.5 py-0.5 text-[12px] font-bold ${meta.tagCls}">${meta.tag}</span>
        </div>`;
    }

    function renderNav() {
      const pending = pendingCount();
      return `
        <div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
          <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
            ${navItems().map((item) => {
              const on = state.navTab === item.id;
              const dot = item.id === 'ops' && pending > 0
                ? '<span class="absolute -right-1 -top-0.5 h-1.5 w-1.5 rounded-full bg-rose-500 ring-2 ring-white"></span>'
                : '';
              return `<button data-action="nav" data-tab="${item.id}" ${on ? 'aria-current="page"' : ''} class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'text-indigo-600' : 'text-slate-400'}">
                <span class="relative">${icon(item.icon, 'h-[18px] w-[18px]')}${dot}</span>
                <span class="text-[12px] font-bold">${esc(item.label)}</span>
              </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function renderPlaceholder() {
      const item = navItems().find((n) => n.id === state.navTab);
      if (!item) return '<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>';
      return `
        <div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
          <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
          <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
          <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc || '')}</p>
          ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">打开对应原型</a>` : ''}
          <button data-action="nav" data-tab="${boardTab()}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回${state.role === 'monitor' ? '代课调度' : state.role === 'admin' ? '管理员代操作' : '课表'}</button>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 家长：课表 / 配额 / 双通道
     * ------------------------------------------------------------------ */
    function renderParentBoard() {
      const child = studentByKey(state.child);
      const q = quotaOf(state.child);
      const left = q.max - q.used;
      const lessons = lessonsOf(state.child);
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-3' : 'space-y-3';
      return `
        <div class="mx-auto w-full max-w-[640px] space-y-3.5 px-4 pb-6 pt-4">
          <div class="flex items-end justify-between gap-3">
            <div class="min-w-0">
              <h1 class="text-[18px] font-bold tracking-tight text-slate-900">考勤与请假</h1>
              <p class="mt-1 text-[12px] font-medium text-slate-500">${esc(child.name)} · 12.5% 配额 · 24h / 3h 规则自检</p>
            </div>
            <span class="shrink-0 rounded-full border border-indigo-100 bg-indigo-50 px-2.5 py-1 text-[12px] font-bold text-indigo-700">共 ${lessons.length} 节</span>
          </div>

          <div class="rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
            <div class="text-[12px] font-medium text-slate-400">当前宝贝档案</div>
            <div class="mt-2 flex gap-2">
              ${STUDENTS.map((s) => {
                const on = s.key === state.child;
                return `<button data-action="set-child" data-key="${s.key}" class="flex h-9 flex-1 items-center justify-center gap-1.5 rounded-xl text-[12px] font-bold ${on ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">
                  ${esc(s.name)}<span class="rounded px-1 text-[12px] ${on ? 'bg-white/20 text-white' : 'bg-white text-indigo-700'}">${lessonsOf(s.key).length} 节</span>
                </button>`;
              }).join('')}
            </div>
          </div>

          <div class="rounded-2xl border border-indigo-200/70 bg-indigo-50/80 p-3.5">
            <div class="flex items-center justify-between gap-2">
              <div>
                <div class="text-[12px] font-medium text-indigo-700">请假配额（永久消费，不返还）</div>
                <div class="mt-0.5 text-[18px] font-bold text-indigo-950">已用 ${q.used} / 上限 ${q.max} · 剩余 ${left} 次</div>
              </div>
              <span class="shrink-0 rounded-full border ${left > 0 ? 'border-emerald-200 bg-emerald-50 text-emerald-700' : 'border-rose-200 bg-rose-50 text-rose-700'} px-2 py-0.5 text-[12px] font-bold">${left > 0 ? '可请假' : '配额用尽'}</span>
            </div>
            <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-white">
              <div class="h-full rounded-full ${left > 0 ? 'bg-emerald-500' : 'bg-rose-500'} ${quotaBarClass(left, q.max)}"></div>
            </div>
            <p class="mt-2 text-[12px] font-medium leading-relaxed text-indigo-900">同师挪位不扣配额；请假仅临时课可退回待排期；固定位不可退期待排。</p>
          </div>

          <div class="flex items-center justify-between px-1">
            <span class="text-[14px] font-bold text-slate-800">近期课次</span>
            <span class="text-[12px] font-medium text-slate-400">点击课次查看可执行动作</span>
          </div>

          <div class="${grid}">${lessons.map(parentLessonCard).join('') || '<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-12 text-center text-[14px] font-medium text-slate-400 sm:col-span-2">暂无已排课次</div>'}</div>

          <div class="rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3.5 py-3 text-[12px] font-medium leading-relaxed text-indigo-900">
            同师挪位固定位限本轮 4 周购课周期内、临时课限前后 7 天内；每节限挪 1 次且免扣配额。<3h 全端锁定，缺席照常结课扣费。
          </div>
        </div>`;
    }

    function distanceChip() {
      const cls = state.hours < 3
        ? 'border-rose-200 bg-rose-50 text-rose-700'
        : state.hours < 24
          ? 'border-amber-200 bg-amber-50 text-amber-800'
          : 'border-slate-200 bg-slate-50 text-slate-500';
      return `<span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${cls}">距开课 ${state.hours}h</span>`;
    }

    function parentLessonCard(l) {
      const tm = typeMeta(l.type);
      const sm = lessonStatusMeta(l);
      const affected = activeEmergencyLesson(l.id);
      const isScheduled = l.status === 'SCHEDULED';
      const q = quotaOf(l.studentKey);
      const quotaLeft = q.max - q.used;
      const offline = state.online === 'off';
      const fixed = l.type === 'fixed';

      let rescheduleLabel = '同师挪位 免扣';
      let rescheduleDisabled = offline;
      if (state.hours < 3) { rescheduleLabel = '挪位已锁(<3h)'; rescheduleDisabled = true; }
      else if (l.rescheduleCount >= 1) { rescheduleLabel = '已挪位(限1次)'; rescheduleDisabled = true; }
      else if (offline) { rescheduleLabel = '离线只读'; }

      let leaveLabel = '申请请假 耗1次';
      let leaveDisabled = offline;
      if (state.hours < 3) { leaveLabel = '请假已锁(<3h)'; leaveDisabled = true; }
      else if (state.hours < 24) { leaveLabel = '<24h禁请假'; leaveDisabled = true; }
      else if (fixed) { leaveLabel = '固定位禁退期'; leaveDisabled = true; }
      else if (quotaLeft <= 0) { leaveLabel = '配额已用尽'; leaveDisabled = true; }
      else if (offline) { leaveLabel = '离线只读'; }

      const actions = isScheduled && !affected ? `
        <div class="mt-3 flex flex-wrap items-center justify-end gap-1.5 border-t border-slate-100 pt-2.5">
          <button data-action="toast" data-message="跳转课程转让流程（M3C 承载）" class="mr-auto text-[12px] font-medium text-slate-500 underline">课程转让</button>
          <button data-action="open-leave" data-id="${l.id}" ${leaveDisabled ? 'disabled' : ''} class="h-8 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-medium text-slate-700 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-50 disabled:text-slate-400">${leaveLabel}</button>
          <button data-action="open-picker" data-id="${l.id}" ${rescheduleDisabled ? 'disabled' : ''} class="h-8 rounded-lg bg-indigo-600 px-2.5 text-[12px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">${rescheduleLabel}</button>
        </div>` : '';

      return `
        <article class="rounded-2xl border ${lessonBorder(l)} bg-white p-4 shadow-sm">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-[16px] font-bold text-slate-900">${esc(studentByKey(l.studentKey).name)}</span>
                <span class="rounded-md border px-1.5 py-0.5 text-[12px] font-semibold ${tm.cls}">${tm.label}</span>
              </div>
              <div class="mt-1 truncate text-[12px] font-medium text-slate-400">${esc(l.id)} · 挪位 ${l.rescheduleCount}/1</div>
            </div>
            <span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${sm.cls}">${sm.label}</span>
          </div>

          <div class="mt-2.5 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="font-mono text-[14px] font-bold text-slate-800">${fmtDate(l.date)} ${l.time} - ${endTime(l.time)}</div>
              <div class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(lessonNote(l))}</div>
            </div>
            ${distanceChip()}
          </div>
          ${actions}
        </article>`;
    }

    /* ------------------------------------------------------------------
     * 教师：本人课表 / 请假 / 空闲时段
     * ------------------------------------------------------------------ */
    function renderTeacherBoard() {
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-3' : 'space-y-3';
      const pending = pendingCount();
      const subbed = substitutedCount();
      return `
        <div class="mx-auto w-full max-w-[640px] space-y-3.5 px-4 pb-6 pt-4">
          <div class="flex items-end justify-between gap-3">
            <div class="min-w-0">
              <h1 class="text-[18px] font-bold tracking-tight text-slate-900">我的课表</h1>
              <p class="mt-1 text-[12px] font-medium text-slate-500">${TEACHER_NAME} · 每周 ${state.lessons.length} 节 · 被代课不计个人课酬</p>
            </div>
            <div class="flex shrink-0 gap-1.5">
              <span class="rounded-full border border-rose-200 bg-rose-50 px-2 py-0.5 text-[12px] font-bold text-rose-700">待代课 ${pending}</span>
              <span class="rounded-full border border-indigo-200 bg-indigo-50 px-2 py-0.5 text-[12px] font-bold text-indigo-700">被代课 ${subbed}</span>
            </div>
          </div>

          <div class="rounded-2xl border border-rose-200 bg-rose-50 p-3.5">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 text-[14px] font-bold text-rose-900">${icon('siren', 'h-4 w-4')}突发批量请假 / 不可抗力报备</div>
                <p class="mt-1 text-[12px] font-medium leading-relaxed text-rose-700">家庭停电/断网、突发急病等不可抗力，可一次勾选 1~12 节（累计最长 6 小时），提交后自动生成班长应急调度包。</p>
              </div>
              <button data-action="open-batch-leave" ${state.online === 'off' ? 'disabled' : ''} class="h-9 shrink-0 rounded-xl bg-rose-600 px-3 text-[12px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">批量请假</button>
            </div>
            ${state.lastBatchLeave ? `
              <div class="mt-2 rounded-xl border border-rose-200 bg-white px-3 py-2 text-[12px]">
                <div class="flex items-center justify-between gap-2">
                  <span class="font-bold text-slate-800">最近一次批量请假</span>
                  <span class="rounded-full bg-rose-100 px-2 py-0.5 font-bold text-rose-700">${state.lastBatchLeave.count} 节</span>
                </div>
                <div class="mt-0.5 font-medium leading-relaxed text-slate-500">${esc(state.lastBatchLeave.range)} · 已排课受影响 ${state.lastBatchLeave.affectedCount} 节 · 空闲置红 ${state.lastBatchLeave.freeCount} 节 · ${esc(LEAVE_TYPE_LABELS[state.lastBatchLeave.reasonType] || '')}</div>
              </div>` : ''}
          </div>

          <div class="${grid}">${state.lessons.map(teacherLessonCard).join('')}</div>

          <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <div class="flex items-center justify-between gap-2">
              <h2 class="text-[16px] font-bold text-slate-900">空闲可授时段</h2>
              <span class="text-[12px] font-medium text-slate-400">请假不占配额 · 随时销假</span>
            </div>
            <div class="mt-2.5 space-y-1.5">
              ${state.freeSlots.map((f) => {
                const isLeave = f.state === 'leave';
                return `<div class="flex items-center justify-between gap-2 rounded-xl border ${isLeave ? 'border-rose-200 bg-rose-50' : 'border-emerald-200 bg-emerald-50'} px-3 py-2">
                  <div class="min-w-0">
                    <div class="text-[14px] font-bold ${isLeave ? 'text-rose-700' : 'text-emerald-700'}">${fmtDate(f.date)} ${f.time} - ${endTime(f.time)}</div>
                    <div class="text-[12px] font-medium ${isLeave ? 'text-rose-600' : 'text-emerald-600'}">${isLeave ? '已请假 · 该时段不开放' : '空闲可约'}</div>
                  </div>
                  <button data-action="toggle-free" data-id="${f.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg border px-2.5 text-[12px] font-semibold ${isLeave ? 'border-rose-200 bg-white text-rose-600' : 'border-emerald-200 bg-white text-emerald-700'} disabled:cursor-not-allowed disabled:opacity-50">${isLeave ? '销假' : '标记请假'}</button>
                </div>`;
              }).join('')}
            </div>
            <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-400">开课前 &gt;5 分钟可操作；空闲格请假不消耗请假配额，随时销假恢复 🟢 可约。</p>
          </div>

          ${teacherClassCard()}

          <div class="rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3.5 py-3 text-[12px] font-medium leading-relaxed text-indigo-900">
            已排课请假后课次挂起为待代课，原日历置红，由班长指派代课；代课成功后本人显示【被代课】，课酬计数为 0。
          </div>
        </div>`;
    }

    function teacherLessonCard(l) {
      const tm = typeMeta(l.type);
      const sm = lessonStatusMeta(l);
      const affected = activeEmergencyLesson(l.id);
      const isScheduled = l.status === 'SCHEDULED';
      const urgent = state.hours < 24;
      const offline = state.online === 'off';
      const action = isScheduled && !affected
        ? `<div class="mt-3 flex justify-end border-t border-slate-100 pt-2.5">
             <button data-action="open-teacher-leave" data-id="${l.id}" ${offline ? 'disabled' : ''} class="h-8 rounded-lg ${urgent ? 'bg-rose-600 text-white' : 'border border-slate-300 bg-white text-slate-700'} px-3 text-[12px] font-semibold disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">${urgent ? (state.hours < 3 ? '紧急请假(<3h)' : '紧急请假') : '申请请假'}</button>
           </div>` : '';
      return `
        <article class="rounded-2xl border ${lessonBorder(l)} bg-white p-4 shadow-sm">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-[16px] font-bold text-slate-900">${esc(studentByKey(l.studentKey).name)}</span>
                <span class="rounded-md border px-1.5 py-0.5 text-[12px] font-semibold ${tm.cls}">${tm.label}</span>
              </div>
              <div class="mt-1 truncate text-[12px] font-medium text-slate-400">${esc(l.id)} · 挪位 ${l.rescheduleCount}/1</div>
            </div>
            <span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${sm.cls}">${sm.label}</span>
          </div>
          <div class="mt-2.5 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="font-mono text-[14px] font-bold text-slate-800">${fmtDate(l.date)} ${l.time} - ${endTime(l.time)}</div>
              <div class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(lessonNote(l))}</div>
            </div>
            ${distanceChip()}
          </div>
          ${action}
        </article>`;
    }

    function teacherClassCard() {
      const cancelled = state.classCancelled;
      return `
        <div class="rounded-2xl border ${cancelled ? 'border-rose-200 bg-rose-50' : 'border-slate-200 bg-white'} p-4 shadow-sm">
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-[16px] font-bold text-slate-900">小班整班课</h2>
            <span class="rounded-full border px-2 py-0.5 text-[12px] font-bold ${cancelled ? 'border-rose-200 bg-white text-rose-700' : 'border-indigo-100 bg-indigo-50 text-indigo-700'}">${cancelled ? '已停课 · 待补排' : '全班统一排期'}</span>
          </div>
          <div class="mt-2 text-[14px] font-bold text-slate-800">${esc(CLASS_INFO.name)} · ${CLASS_INFO.size} 人</div>
          <div class="mt-0.5 font-mono text-[12px] font-medium ${cancelled ? 'text-rose-600' : 'text-slate-500'}">${fmtDate(CLASS_INFO.date)} ${CLASS_INFO.time} - ${CLASS_INFO.end}</div>
          <p class="mt-2 text-[12px] font-medium leading-relaxed ${cancelled ? 'text-rose-700' : 'text-slate-500'}">${cancelled ? '整班已停课，课次退回班级待排期池；等待班长与家长协调后手工补排。' : '小班课由班长整班排定，学生端无个人挪位入口。'}</p>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 教师：1~12 节批量请假 / 不可抗力报备
     * ------------------------------------------------------------------ */
    function batchSlots() {
      if (!state.batch) return [];
      const day = state.batch.day;
      return BATCH_SLOT_TIMES.map((time) => {
        const lesson = state.lessons.find((l) => l.date === day && l.time === time && l.status === 'SCHEDULED') || null;
        return { id: `${day}_${time}`, time, end: endTime(time), lesson };
      });
    }

    function openBatchLeave() {
      if (!guardWrite()) return;
      state.batch = { day: BATCH_DAYS[0].iso, selected: [], reason: '', reasonType: 'POWER_OUTAGE' };
      state.overlay = { type: 'batchLeave' };
      renderAll();
    }

    function changeBatchDay(day) {
      if (!state.batch || !BATCH_DAYS.some((d) => d.iso === day)) return;
      state.batch.day = day;
      state.batch.selected = [];
      renderOverlay();
    }

    function toggleBatchSlot(id) {
      if (!guardWrite() || !state.batch) return;
      const idx = state.batch.selected.indexOf(id);
      if (idx >= 0) state.batch.selected.splice(idx, 1);
      else {
        if (state.batch.selected.length >= 12) return showToast('单次批量请假上限 12 节（累计最长 6 小时），请先取消部分时段', true);
        state.batch.selected.push(id);
      }
      renderOverlay();
    }

    function selectBatchMax() {
      if (!state.batch) return;
      state.batch.selected = batchSlots().slice(0, 12).map((s) => s.id);
      renderOverlay();
    }

    function clearBatchSelection() {
      if (!state.batch) return;
      state.batch.selected = [];
      renderOverlay();
    }

    function renderBatchLeaveModal() {
      const b = state.batch;
      if (!b) return '';
      const slots = batchSlots();
      const selected = slots.filter((s) => b.selected.includes(s.id));
      const affected = selected.filter((s) => s.lesson);
      const freeCount = selected.length - affected.length;
      const affectedStudents = [...new Set(affected.map((s) => s.lesson.studentKey))];
      const range = selected.length ? `${selected[0].time} - ${selected[selected.length - 1].end}` : '未选择';
      const typeOptions = Object.entries(LEAVE_TYPE_LABELS);

      return modalShell(`
        ${modalHeader('突发批量请假 / 不可抗力报备', '单次 1~12 节 · 累计最长 6 小时 · 同日或连续时段', true)}
        <div class="mt-3 flex gap-1">
          ${BATCH_DAYS.map((d) => {
            const on = d.iso === b.day;
            return `<button data-action="batch-day" data-day="${d.iso}" class="flex-1 rounded-xl px-1 py-1.5 text-[12px] font-bold ${on ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">${esc(d.label)}</button>`;
          }).join('')}
        </div>

        <div class="mt-3 flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-1.5">
            <span class="shrink-0 rounded-full border border-rose-200 bg-rose-50 px-2 py-0.5 text-[12px] font-bold text-rose-700">已选 ${b.selected.length} / 12 节</span>
            <span class="truncate text-[12px] font-medium text-slate-400">${range}</span>
          </div>
          <div class="flex shrink-0 gap-1.5">
            <button data-action="batch-select-max" class="rounded-lg border border-indigo-200 bg-indigo-50 px-2 py-1 text-[12px] font-semibold text-indigo-700">选满 12 节</button>
            <button data-action="batch-clear" class="rounded-lg border border-slate-200 bg-white px-2 py-1 text-[12px] font-semibold text-slate-500">清空</button>
          </div>
        </div>

        <div class="mt-2 max-h-[190px] space-y-1.5 overflow-y-auto rounded-xl border border-slate-200 bg-slate-50 p-2">
          ${slots.map((slot) => {
            const on = b.selected.includes(slot.id);
            const l = slot.lesson;
            return `<button data-action="batch-slot" data-id="${slot.id}" class="flex w-full items-center justify-between gap-2 rounded-lg border px-2.5 py-2 text-left transition ${on ? 'border-indigo-300 bg-indigo-50' : 'border-transparent bg-white hover:border-slate-200'}">
              <span class="flex min-w-0 items-center gap-2">
                <span class="grid h-5 w-5 shrink-0 place-items-center rounded border ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 bg-white text-transparent'}">${icon('check', 'h-3 w-3')}</span>
                <span class="whitespace-nowrap font-mono text-[12px] font-bold text-slate-800">${slot.time}-${slot.end}</span>
                ${l
                  ? `<span class="truncate text-[12px] font-semibold text-rose-700">已排 · ${esc(studentByKey(l.studentKey).name)} · ${l.type === 'fixed' ? '固定位' : '临时课'}</span>`
                  : '<span class="text-[12px] font-medium text-slate-400">空闲可约</span>'}
              </span>
              ${on ? '<span class="shrink-0 rounded bg-indigo-600 px-1.5 py-0.5 text-[12px] font-bold text-white">已选</span>' : ''}
            </button>`;
          }).join('')}
        </div>

        <div class="mt-2 rounded-xl border border-slate-200 bg-white p-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold text-slate-800">影响透视</span>
            <span class="text-[12px] font-medium text-slate-400">提交前实时校验</span>
          </div>
          <div class="mt-1.5 grid grid-cols-2 gap-1.5 text-[12px]">
            <div class="rounded-lg bg-rose-50 px-2 py-1.5 font-semibold text-rose-700">已排课受影响 ${affected.length} 节</div>
            <div class="rounded-lg bg-emerald-50 px-2 py-1.5 font-semibold text-emerald-700">空闲置红 ${freeCount} 节</div>
          </div>
          <p class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-500">${affected.length
            ? `涉及 ${affectedStudents.length} 名学生：${affectedStudents.map((k) => esc(studentByKey(k).name)).join('、')}；将生成班长应急调度包并在 10 秒内安抚通知家长。`
            : '当前未勾选已排课次；若仅选择空闲时段，将直接置红阻断预约。'}</p>
          ${selected.length ? `<div class="mt-2 flex flex-wrap gap-1">${selected.map((s) => `<span class="rounded border border-slate-200 bg-slate-50 px-1.5 py-0.5 font-mono text-[12px] text-slate-600">${s.time}${s.lesson ? `·${esc(studentByKey(s.lesson.studentKey).name)}` : '·空闲'}</span>`).join('')}</div>` : ''}
        </div>

        <div class="mt-3">
          <label for="batchReasonType" class="mb-1 block text-[12px] font-medium text-slate-500">不可抗力分类 <span class="text-rose-500">*</span></label>
          <select id="batchReasonType" class="h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-[16px] text-slate-900 outline-none">
            ${typeOptions.map(([value, label]) => `<option value="${value}" ${b.reasonType === value ? 'selected' : ''}>${esc(label)}</option>`).join('')}
          </select>
        </div>
        <div class="mt-2">
          <label for="batchReason" class="mb-1 block text-[12px] font-medium text-slate-500">请假事由与说明 <span class="text-rose-500">*</span></label>
          <textarea id="batchReason" rows="7" maxlength="300" class="h-16 w-full resize-none rounded-xl border border-slate-200 p-3 text-[16px] text-slate-900 outline-none" placeholder="如：小区突发高压电缆故障抢修，预计今晚恢复供电……">${esc(b.reason)}</textarea>
        </div>

        <div class="mt-2 rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-2.5 text-[12px] font-medium leading-relaxed text-amber-900">
          提交后：已排课次挂起为待代课并生成应急调度包；空闲时段原子置红阻断预约；教师原因导致的学生退课 <b>100% 免扣请假配额</b>。距开课 &lt;3h 走突发不可抗力绿色通道。
        </div>

        <div class="sticky bottom-[-1.25rem] z-10 -mx-5 -mb-5 mt-4 flex gap-2 rounded-b-2xl border-t border-slate-100 bg-white px-5 py-3">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">取消</button>
          <button data-action="confirm-batch-leave" ${state.online === 'off' || b.selected.length === 0 ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认提交批量请假（${b.selected.length} 节）</button>
        </div>`);
    }

    function confirmBatchLeave() {
      if (!guardWrite() || !state.batch) return;
      const b = state.batch;
      if (b.selected.length < 1) return showToast('请至少选择 1 节（单次最多 12 节）', true);
      if (b.selected.length > 12) return showToast('单次批量请假上限 12 节（累计最长 6 小时）', true);
      const reasonEl = document.getElementById('batchReason');
      const reason = reasonEl ? reasonEl.value.trim() : (b.reason || '').trim();
      if (!reason) return showToast('请填写请假事由与说明', true);
      const typeEl = document.getElementById('batchReasonType');
      const reasonType = typeEl ? typeEl.value : (b.reasonType || 'POWER_OUTAGE');
      const slots = batchSlots().filter((s) => b.selected.includes(s.id));
      const affected = [];
      let freeCount = 0;

      slots.forEach((s) => {
        if (s.lesson) {
          s.lesson.status = 'PENDING_SUBSTITUTE';
          s.lesson.leaveReason = reason;
          s.lesson.leaveType = reasonType;
          affected.push({ slot: s, lesson: s.lesson });
        } else {
          freeCount += 1;
          state.teacherLeaveSlots.push({ date: b.day, time: s.time });
          state.freeSlots.push({ id: `fre_${String(Date.now()).slice(-5)}${String(state.freeSlots.length).padStart(3, '0')}`, date: b.day, time: s.time, state: 'leave' });
        }
      });

      state.lastBatchLeave = {
        count: slots.length,
        affectedCount: affected.length,
        freeCount,
        range: `${fmtDate(b.day)} ${slots[0].time} - ${slots[slots.length - 1].end}`,
        reasonType
      };

      if (affected.length) {
        const emgId = `EMG-${String(Date.now()).slice(-8)}`;
        state.emergency = {
          id: emgId,
          teacher: TEACHER_NAME,
          reason,
          reasonCode: reasonType,
          submittedAt: '刚刚',
          status: 'OPEN',
          lastAction: null,
          lessons: affected.map((a, i) => ({
            id: `${emgId}-${i + 1}`,
            studentKey: a.lesson.studentKey,
            type: a.lesson.type,
            date: b.day,
            time: a.slot.time,
            hoursLeft: forecastHours(b.day, a.slot.time),
            status: 'AFFECTED',
            sub: null,
            sourceLessonId: a.lesson.id
          }))
        };
      }

      state.overlay = null;
      state.batch = null;
      renderAll();
      showToast(`批量请假已提交：${slots.length} 节（已排课受影响 ${affected.length} 节，空闲置红 ${freeCount} 节）${affected.length ? ' · 已生成班长应急调度包' : ''}`);
    }

    /* ------------------------------------------------------------------
     * 代课教师：代上课与学情交接
     * ------------------------------------------------------------------ */
    function renderSubBoard() {
      const mine = state.lessons.filter((l) => l.status === 'SUBSTITUTED' && l.sub === 'Elena Wright');
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-3' : 'space-y-3';
      return `
        <div class="mx-auto w-full max-w-[640px] space-y-3.5 px-4 pb-6 pt-4">
          <div class="flex items-end justify-between gap-3">
            <div class="min-w-0">
              <h1 class="text-[18px] font-bold tracking-tight text-slate-900">我的代课</h1>
              <p class="mt-1 text-[12px] font-medium text-slate-500">Elena Wright · 代上课课酬 100% 计入本人周结单</p>
            </div>
            <span class="shrink-0 rounded-full border border-indigo-200 bg-indigo-50 px-2.5 py-1 text-[12px] font-bold text-indigo-700">代课 ${mine.length} 节</span>
          </div>

          <div class="rounded-xl border border-indigo-200 bg-indigo-50 px-3.5 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900">
            代上课标记：替 ${TEACHER_NAME} 代课，完课后课酬 100% 计入本人周结单，原教师课酬为 0。距开课 &lt;24h 时代课刚性锁定，不可撤销。
          </div>

          <div class="${grid}">${mine.length ? mine.map(subLessonCard).join('') : '<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-12 text-center text-[14px] font-medium text-slate-400 sm:col-span-2">暂无代课任务<br><span class="text-[12px]">请先在原师端发起请假，再由班长指派代课</span></div>'}</div>
        </div>`;
    }

    function subLessonCard(l) {
      return `
        <article class="rounded-2xl border border-indigo-200 bg-white p-4 shadow-sm">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-[16px] font-bold text-slate-900">${esc(studentByKey(l.studentKey).name)}</span>
                <span class="rounded-md border border-indigo-200 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-semibold text-indigo-700">代上课</span>
              </div>
              <div class="mt-1 truncate text-[12px] font-medium text-slate-400">${esc(l.id)} · 原师 ${TEACHER_NAME}</div>
            </div>
            <span class="shrink-0 rounded-full border border-indigo-200 bg-indigo-50 px-2 py-0.5 text-[12px] font-bold text-indigo-700">已指派</span>
          </div>
          <div class="mt-2.5 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="font-mono text-[14px] font-bold text-slate-800">${fmtDate(l.date)} ${l.time} - ${endTime(l.time)}</div>
              <div class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">替 ${TEACHER_NAME} 代课 · 课酬计入本人周结单</div>
            </div>
            ${distanceChip()}
          </div>
          <div class="mt-3 flex justify-end border-t border-slate-100 pt-2.5">
            <button data-action="open-memo" data-id="${l.id}" class="h-8 rounded-lg bg-indigo-600 px-3 text-[12px] font-semibold text-white">查看学生教学留言</button>
          </div>
        </article>`;
    }

    /* ------------------------------------------------------------------
     * 班长：待代课 / 已指派 / 小班停课
     * ------------------------------------------------------------------ */
    function renderMonitorBoard() {
      const emgSourceIds = new Set((state.emergency?.lessons || []).map((l) => l.sourceLessonId).filter(Boolean));
      const pending = state.lessons.filter((l) => l.status === 'PENDING_SUBSTITUTE' && !emgSourceIds.has(l.id));
      const assigned = state.lessons.filter((l) => l.status === 'SUBSTITUTED' && !emgSourceIds.has(l.id));
      const emgOpen = state.emergency ? state.emergency.lessons.filter((l) => l.status === 'AFFECTED').length : 0;
      const totalPending = pending.length + emgOpen;
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-3' : 'space-y-3';
      return `
        <div class="mx-auto w-full max-w-[640px] space-y-3.5 px-4 pb-6 pt-4">
          <div class="flex items-end justify-between gap-3">
            <div class="min-w-0">
              <h1 class="text-[18px] font-bold tracking-tight text-slate-900">代课调度</h1>
              <p class="mt-1 text-[12px] font-medium text-slate-500">Leo · 待协调 ${totalPending} 项 · 应急 ${emgOpen} 节 · 资金持有人永久锁定</p>
            </div>
            <span class="shrink-0 rounded-full border border-rose-200 bg-rose-50 px-2.5 py-1 text-[12px] font-bold text-rose-700">待协调 ${totalPending}</span>
          </div>

          ${renderEmergencyPanel()}

          <div class="flex items-center justify-between px-1">
            <span class="text-[14px] font-bold text-slate-800">待协调代课</span>
            <span class="text-[12px] font-medium text-slate-400">教师请假后自动派发</span>
          </div>
          <div class="${grid}">${pending.length ? pending.map(monitorPendingCard).join('') : '<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-8 text-center text-[14px] font-medium text-slate-400 sm:col-span-2">暂无待安排代课工单<br><span class="text-[12px]">可切换到原师端发起请假后返回查看</span></div>'}</div>

          ${assigned.length ? `
            <div class="flex items-center justify-between px-1 pt-1">
              <span class="text-[14px] font-bold text-slate-800">已指派代课</span>
              <span class="text-[12px] font-medium text-slate-400">≥24h 可撤销 · &lt;24h 锁定</span>
            </div>
            <div class="${grid}">${assigned.map(monitorAssignedCard).join('')}</div>` : ''}

          ${monitorClassSection()}

          <div class="rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3.5 py-3 text-[12px] font-medium leading-relaxed text-indigo-900">
            代课指派成功后：原师显示【被代课】、代课师显示【代上课】；TS 资金持有人严格保持 Leo 不变；代课课酬 100% 归代课老师。
          </div>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 班长：多学员应急调度包 / 一键指派 / 一键自动救济
     * ------------------------------------------------------------------ */
    function renderEmergencyPanel() {
      const em = state.emergency;
      if (!em || !em.lessons.length) return '';
      const open = em.lessons.filter((l) => l.status === 'AFFECTED');
      const tiers = em.lessons.reduce((acc, l) => {
        const t = tierOf(l.hoursLeft);
        acc[t.key] = (acc[t.key] || 0) + 1;
        return acc;
      }, {});
      const sorted = [...em.lessons].sort((a, b) => a.hoursLeft - b.hoursLeft);
      return `
        <div class="overflow-hidden rounded-2xl border-2 border-rose-300 bg-white shadow-sm">
          <div class="bg-rose-600 px-4 py-3 text-white">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 text-[12px] font-bold text-rose-100">${icon('siren', 'h-3.5 w-3.5')}突发请假应急调度包 · ${esc(em.reasonCode ? LEAVE_TYPE_LABELS[em.reasonCode] || '' : '')}</div>
                <h2 class="mt-0.5 text-[16px] font-bold">${esc(em.teacher)} 突发停课协调中</h2>
                <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-rose-100">${esc(em.reason)} · 提交 ${esc(em.submittedAt)}</p>
              </div>
              <span class="shrink-0 rounded-full bg-white/20 px-2 py-0.5 text-[12px] font-bold text-white">待处置 ${open.length} / ${em.lessons.length} 节</span>
            </div>
          </div>
          <div class="p-3.5">
            <div class="flex flex-wrap gap-1.5">
              ${[['REGULAR', '≥24h 正常期', 24], ['URGENT', '3~24h 中段期', 4], ['BREAK_GLASS', '<3h 紧急期', 1]].map(([key, label, sample]) => {
                const meta = tierOf(sample);
                return `<span class="rounded-full border px-2 py-0.5 text-[12px] font-bold ${meta.cls}">${label} ${tiers[key] || 0} 节</span>`;
              }).join('')}
            </div>

            <div class="mt-3 grid grid-cols-1 gap-2">
              <button data-action="emergency-assign-all" ${state.online === 'off' || !open.length ? 'disabled' : ''} class="flex h-11 items-center justify-center gap-1.5 rounded-xl bg-indigo-600 px-3 text-[14px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">${icon('user-check', 'h-4 w-4')}一键指派同一代课外教</button>
              <button data-action="emergency-auto-relief" ${state.online === 'off' || !open.length ? 'disabled' : ''} class="flex h-11 items-center justify-center gap-1.5 rounded-xl border border-indigo-200 bg-indigo-50 px-3 text-[14px] font-semibold text-indigo-700 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-50 disabled:text-slate-400">${icon('wand-2', 'h-4 w-4')}一键按学生自动救济</button>
              <button data-action="emergency-safety" ${state.online === 'off' || !open.length ? 'disabled' : ''} class="flex h-11 items-center justify-center gap-1.5 rounded-xl border border-rose-200 bg-rose-50 px-3 text-[14px] font-semibold text-rose-700 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-50 disabled:text-slate-400">${icon('shield-alert', 'h-4 w-4')}模拟 15 分钟安全兜底</button>
            </div>
            <p class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-500">一键指派固定为 Elena Wright；自动救济按逐节时限矩阵执行。距开课 15 分钟仍未指派代课，系统自动取消并退回待排期（免扣配额），可点击模拟按钮演示。</p>

            ${renderEmergencyResult()}

            <div class="mt-3 space-y-2">
              ${sorted.map(renderEmergencyLessonCard).join('')}
            </div>

            <div class="mt-3 rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3.5 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900">
              <b>审计与回滚提示：</b>批量指派 / 自动救济均逐节写入审计日志（操作人 Leo、时间、处置结果），≥24h 课次可撤销，&lt;24h 代课刚性锁定；退回待排期永久豁免学生请假配额。
            </div>
          </div>
        </div>`;
    }

    function renderEmergencyLessonCard(l) {
      const student = studentByKey(l.studentKey);
      const tm = typeMeta(l.type);
      const tier = tierOf(l.hoursLeft);
      const sm = emergencyStatusMeta(l.status);
      const resolved = l.status !== 'AFFECTED';
      return `
        <div class="rounded-xl border ${resolved ? 'border-slate-200 bg-slate-50/60' : 'border-rose-200 bg-white'} p-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-[14px] font-bold text-slate-900">${esc(student.name)}</span>
                <span class="rounded-md border px-1.5 py-0.5 text-[12px] font-semibold ${tm.cls}">${tm.label}</span>
                <span class="rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${tier.cls}">${tier.label}</span>
                <span class="rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${sm.cls}">${sm.label}</span>
              </div>
              <div class="mt-1 font-mono text-[12px] font-bold text-slate-700">${fmtDate(l.date)} ${l.time} - ${endTime(l.time)}</div>
            </div>
            ${hoursChip(l.hoursLeft)}
          </div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">${tier.rule}</p>
          ${resolved
            ? `<div class="mt-2 rounded-lg border border-slate-200 bg-white px-2.5 py-2 text-[12px] font-medium leading-relaxed text-slate-600">${emergencyResolvedNote(l)}</div>`
            : `<div class="mt-2 flex flex-wrap gap-1.5">${emergencyTierActions(l, tier)}</div>`}
        </div>`;
    }

    function emergencyTierActions(l, tier) {
      const offline = state.online === 'off';
      const btn = (action, label, cls, disabled = false, title = '') => `<button data-action="${action}" data-id="${l.id}" ${disabled || offline ? 'disabled' : ''} title="${esc(title)}" class="h-8 rounded-lg px-2.5 text-[12px] font-semibold disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-100 disabled:text-slate-400 ${cls}">${label}</button>`;
      if (tier.key === 'REGULAR') {
        return `
          ${btn('emergency-reschedule', '同师平移', 'border border-emerald-200 bg-emerald-50 text-emerald-700')}
          ${btn('emergency-return', '退回待排期 · 免扣', 'border border-amber-200 bg-amber-50 text-amber-800')}
          <span class="inline-flex items-center rounded-lg bg-emerald-50 px-2 py-1 text-[12px] font-medium text-emerald-700">配额扣减 0 次</span>`;
      }
      if (tier.key === 'URGENT') {
        return `
          ${btn('emergency-assign', '指派代课', 'bg-indigo-600 text-white')}
          ${btn('emergency-reschedule', '同师平移', 'border border-indigo-200 bg-indigo-50 text-indigo-700')}
          <span class="inline-flex items-center rounded-lg bg-slate-100 px-2 py-1 text-[12px] font-medium text-slate-400">退回待排期（中段期锁定）</span>`;
      }
      return `
        ${btn('emergency-assign', '指派代课', 'border border-indigo-200 bg-indigo-50 text-indigo-700')}
        ${btn('emergency-return', '紧急免扣退回', 'bg-rose-600 text-white')}
        <span class="inline-flex items-center rounded-lg bg-slate-100 px-2 py-1 text-[12px] font-medium text-slate-400">同师平移（&lt;3h 已锁）</span>`;
    }

    function emergencyResolvedNote(l) {
      if (l.status === 'SUBSTITUTED') return `已由 ${esc(l.sub || 'Elena Wright')} 代课 · 原师 ${TEACHER_NAME} · 资金持有人 Leo 不变 · 代课课酬 100% 归代课老师`;
      if (l.status === 'PENDING_REBOOK') return '已免扣退回待排期 · 学生请假配额扣减 0 次 · 挪位次数保持 0 · 可重新约课';
      if (l.status === 'RESCHEDULED') return `已同师平移至 ${fmtDate(l.date)} ${l.time} - ${endTime(l.time)} · 免扣配额且不计挪位次数`;
      return '';
    }

    function renderEmergencyResult() {
      const em = state.emergency;
      const a = em && em.lastAction;
      if (!a) return '';
      return `
        <div class="mt-3 rounded-xl border border-emerald-200 bg-emerald-50 p-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="text-[14px] font-bold text-emerald-900">${esc(a.label)}</div>
              <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-emerald-800">${esc(a.summary)}</p>
            </div>
            <span class="shrink-0 rounded-full bg-emerald-200 px-2 py-0.5 text-[12px] font-bold text-emerald-900">${esc(a.auditId)}</span>
          </div>
          ${a.studentSummary && a.studentSummary.length ? `<div class="mt-1.5 flex flex-wrap gap-1">${a.studentSummary.map((s) => `<span class="rounded border border-emerald-200 bg-white px-1.5 py-0.5 text-[12px] font-medium text-emerald-800">${esc(s)}</span>`).join('')}</div>` : ''}
          <div class="mt-2 flex items-center justify-between gap-2 rounded-lg bg-white/70 px-2.5 py-2">
            <p class="text-[12px] font-medium leading-relaxed text-slate-600">审计已记录操作人 Leo、时间与逐节结果；${a.canRollback ? '相关课次均 ≥24h，可整体撤销。' : `含 ${a.lockedCount} 节 <24h 课次，代课已刚性锁定，不可回滚。`}</p>
            <button data-action="emergency-rollback" ${state.online === 'off' || !a.canRollback ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-700 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-100 disabled:text-slate-400">撤销本次操作</button>
          </div>
        </div>`;
    }

    function findEmergencyLesson(id) {
      return state.emergency ? state.emergency.lessons.find((l) => l.id === id) || null : null;
    }

    function syncEmergencyToSource(l) {
      if (!l || !l.sourceLessonId) return;
      const src = lessonById(l.sourceLessonId);
      if (!src) return;
      if (l.status === 'SUBSTITUTED') {
        src.status = 'SUBSTITUTED';
        src.sub = l.sub || 'Elena Wright';
      } else if (l.status === 'PENDING_REBOOK') {
        src.status = 'PENDING_REBOOK';
        src.quotaExempt = true;
      } else if (l.status === 'RESCHEDULED') {
        src.status = 'SCHEDULED';
        src.date = l.date;
        src.time = l.time;
        src.rescheduleCount = 0;
      }
    }

    function setEmergencyResult(type, label, snapshot, changed, counts, summary, studentSummary = []) {
      const em = state.emergency;
      if (!em) return;
      em.lastAction = {
        type,
        label,
        summary,
        studentSummary,
        counts,
        auditId: `AUD-${String(auditSeq++).padStart(4, '0')}`,
        at: '刚刚',
        canRollback: changed.length > 0 && changed.every((l) => l.hoursLeft >= 24),
        lockedCount: changed.filter((l) => l.hoursLeft < 24).length,
        changedIds: changed.map((l) => l.id),
        snapshot: clone(snapshot),
        sourceSnapshot: changed
          .map((l) => (l.sourceLessonId ? lessonById(l.sourceLessonId) : null))
          .filter(Boolean)
          .map((src) => clone(src))
      };
    }

    function emergencyAssignAll() {
      if (!guardWrite() || !state.emergency) return;
      const em = state.emergency;
      const targets = em.lessons.filter((l) => l.status === 'AFFECTED');
      if (!targets.length) return showToast('当前没有待处置课次', true);
      const snapshot = clone(em.lessons);
      targets.forEach((l) => {
        l.status = 'SUBSTITUTED';
        l.sub = 'Elena Wright';
      });
      setEmergencyResult(
        'ASSIGN_ALL',
        `一键指派同一代课外教 · ${targets.length} 节`,
        snapshot,
        targets,
        { assigned: targets.length, returned: 0, rescheduled: 0 },
        `已统一指派 Elena Wright 代课 ${targets.length} 节；资金持有人 Leo 不变，代课课酬 100% 归代课老师。`,
        groupByStudent(targets)
      );
      targets.forEach(syncEmergencyToSource);
      renderAll();
      showToast(`已一键指派 Elena Wright 代课 ${targets.length} 节 · 资金持有人不变 · 审计已留痕`);
    }

    function emergencyAutoRelief() {
      if (!guardWrite() || !state.emergency) return;
      const em = state.emergency;
      const targets = em.lessons.filter((l) => l.status === 'AFFECTED');
      if (!targets.length) return showToast('当前没有待处置课次', true);
      const snapshot = clone(em.lessons);
      const counts = { assigned: 0, returned: 0, rescheduled: 0 };
      const perStudent = {};
      targets.forEach((l) => {
        const tier = tierOf(l.hoursLeft);
        const entry = perStudent[l.studentKey] || (perStudent[l.studentKey] = { assigned: 0, returned: 0, rescheduled: 0 });
        if (tier.key === 'URGENT') {
          l.status = 'SUBSTITUTED';
          l.sub = 'Elena Wright';
          counts.assigned += 1;
          entry.assigned += 1;
        } else {
          l.status = 'PENDING_REBOOK';
          l.quotaExempt = true;
          counts.returned += 1;
          entry.returned += 1;
        }
      });
      const studentSummary = Object.entries(perStudent).map(([key, v]) => {
        const parts = [];
        if (v.assigned) parts.push(`代课 ${v.assigned} 节`);
        if (v.returned) parts.push(`免扣退回 ${v.returned} 节`);
        if (v.rescheduled) parts.push(`平移 ${v.rescheduled} 节`);
        return `${studentByKey(key).name}: ${parts.join('、')}`;
      });
      setEmergencyResult(
        'AUTO_RELIEF',
        `一键按学生自动救济 · ${targets.length} 节`,
        snapshot,
        targets,
        counts,
        `免扣退回待排期 ${counts.returned} 节（≥24h 与 <3h 紧急期）· 3~24h 指派代课 ${counts.assigned} 节 · 配额扣减 0 次`,
        studentSummary
      );
      targets.forEach(syncEmergencyToSource);
      renderAll();
      showToast(`自动救济完成：${counts.assigned} 节代课 · ${counts.returned} 节免扣退回 · 配额扣减 0 次`);
    }

    function emergencySafetyFallback() {
      if (!guardWrite() || !state.emergency) return;
      const em = state.emergency;
      const targets = em.lessons.filter((l) => l.status === 'AFFECTED' && l.hoursLeft <= 0.25);
      if (!targets.length) return showToast('当前无距开课 15 分钟内的待处理课次', true);
      const snapshot = clone(em.lessons);

      const map = new Map((a.snapshot || []).map((l) => [l.id, l]));
      em.lessons = em.lessons.map((l) => (a.changedIds.includes(l.id) && map.has(l.id) ? clone(map.get(l.id)) : l));
      (a.sourceSnapshot || []).forEach((src) => {
        const idx = state.lessons.findIndex((x) => x.id === src.id);

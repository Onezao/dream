        ${modalHeader('管理员代请假', `${studentByKey(l.studentKey).name} · ${fmtDate(l.date)} ${l.time} - ${endTime(l.time)}`, true)}
        <div class="mt-2.5 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-[12px]">
          <div class="flex justify-between py-0.5"><span class="text-slate-400">班型</span><span class="font-semibold text-slate-800">${l.type === 'fixed' ? '1v1 固定位' : '1v1 临时课'}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-400">请假配额</span><span class="font-mono font-bold text-slate-800">已用 ${q.used} / 上限 ${q.max} · 剩余 ${left}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-400">距开课</span><span class="font-mono font-bold ${state.hours < 3 ? 'text-rose-700' : state.hours < 24 ? 'text-amber-700' : 'text-emerald-700'}">${state.hours}h</span></div>
        </div>

        <div class="mt-3 grid grid-cols-2 gap-1.5">
          <button data-action="admin-channel" data-channel="normal" ${normalOk ? '' : 'disabled'} class="h-10 rounded-xl border text-[14px] font-bold transition ${al.channel === 'normal' ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-500'} disabled:cursor-not-allowed disabled:bg-slate-50 disabled:text-slate-300">常规代请假</button>
          <button data-action="admin-channel" data-channel="special" class="h-10 rounded-xl border text-[14px] font-bold transition ${al.channel === 'special' ? 'border-amber-300 bg-amber-50 text-amber-800' : 'border-slate-200 bg-white text-slate-500'}">非常规特批</button>
        </div>

        ${al.channel === 'normal' ? `<div class="mt-2 rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900/85">
          标准扣减 1 次配额（剩余 ${left} → ${Math.max(0, left - 1)}）；仅临时课、距开课 ≥24h 且配额充足时可用。固定位/<24h/配额耗尽请使用特批通道。
        </div>` : `<div class="mt-2 rounded-xl border border-amber-200/70 bg-amber-50/80 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-amber-900/85">
          免扣配额，可突破开课前 &lt;3h、固定位与配额耗尽限制；必须填写 ≥10 字原因并写入审计。补偿教师课酬默认关闭。
        </div>`}

        ${!normalOk && al.channel === 'normal' ? `<div class="mt-1.5 rounded-lg border border-rose-200 bg-rose-50 px-2.5 py-1.5 text-[12px] font-medium text-rose-700">当前课次不满足常规代请假条件，请切换特批通道。</div>` : ''}

        <div class="mt-3">
          <label for="adminLeaveReason" class="mb-1 block text-[14px] font-semibold text-slate-700">代操作原因 <span class="text-rose-500">*</span></label>
          <textarea id="adminLeaveReason" maxlength="200" rows="3" class="h-20 w-full resize-none rounded-xl border border-slate-200 bg-white p-2.5 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500" placeholder="${al.channel === 'special' ? '请填写 ≥10 字特批原因，例如学员突发急病就医……' : '请填写代请假原因，便于审计追溯……'}">${esc(al.reason)}</textarea>
          <div class="mt-1 flex items-center justify-between">
            <span class="text-[12px] font-medium ${al.channel === 'special' && reason.length < 10 ? 'text-rose-600' : 'text-slate-400'}">${reasonHint}</span>
            <span id="adminReasonCount" class="font-mono text-[12px] font-medium text-slate-400">${al.reason.length}/200</span>
          </div>
        </div>

        ${al.channel === 'special' ? `<label class="mt-2 flex cursor-pointer items-start gap-2.5 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2">
          <input id="adminCompensate" type="checkbox" ${al.compensate ? 'checked' : ''} class="mt-0.5 h-4 w-4 rounded border-amber-300 accent-amber-600">
          <span class="text-[12px] font-medium leading-relaxed text-amber-900">给老师补偿课酬（平台贴补）<span class="mt-0.5 block text-amber-700">默认不补偿；仅突发不可抗力且需挽回客诉时勾选</span></span>
        </label>` : ''}

        ${al.error ? `<div id="adminLeaveError" class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-[12px] font-medium text-rose-700">${esc(al.error)}</div>` : ''}

        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
          <button data-action="confirm-admin-leave" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认代请假</button>
        </div>`);
    }

    function setAdminChannel(channel) {
      if (!state.adminLeave) return;
      const l = activeLesson();
      if (channel === 'normal') {
        const q = quotaOf(l.studentKey);
        if (!(l.type === 'temp' && state.hours >= 24 && (q.max - q.used) > 0)) return;
      }
      state.adminLeave.channel = channel;
      state.adminLeave.error = '';
      renderOverlay();
    }

    function confirmAdminLeave() {
      if (!guardWrite()) return;
      const l = activeLesson();
      const al = state.adminLeave;
      if (!l || !al) return;
      const q = quotaOf(l.studentKey);
      const left = q.max - q.used;
      const reason = al.reason.trim();
      const fail = (msg) => { al.error = msg; renderOverlay(); };
      if (al.channel === 'normal') {
        if (!(l.type === 'temp' && state.hours >= 24 && left > 0)) return fail('当前不满足常规代请假条件，请切换特批通道');
        if (reason.length < 2 || reason.length > 200) return fail('常规代请假原因需为 2-200 字');
        q.used += 1;
        l.status = 'PENDING_REBOOK';
        l.quotaExempt = false;
        l.adminNormal = true;
      } else {
        if (reason.length < 10 || reason.length > 200) return fail('特批请假原因必须为 10-200 字');
        l.status = 'PENDING_REBOOK';
        l.quotaExempt = true;
        l.adminSpecial = true;
        l.teacherCompensated = !!al.compensate;
      }
      appendAdminAudit(l, al.channel, reason, al.compensate);
      state.overlay = null;
      state.adminLeave = null;
      renderAll();
      showToast(al.channel === 'normal' ? '管理员常规代请假完成 · 已扣 1 次配额并写入审计' : '管理员特批代请假完成 · 免扣配额并写入审计');
    }

    /* ------------------------------------------------------------------
     * 弹层：兜底渲染
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      const el = document.getElementById('overlay');
      const prevScrollEl = el.querySelector('#pickerScroll');
      const prevScroll = prevScrollEl ? prevScrollEl.scrollTop : 0;

      if (!state.overlay) el.innerHTML = '';
      else if (state.overlay.type === 'picker') el.innerHTML = renderPicker();
      else if (state.overlay.type === 'leave') el.innerHTML = renderLeaveModal();
      else if (state.overlay.type === 'teacherLeave') el.innerHTML = renderTeacherLeaveModal();
      else if (state.overlay.type === 'dispatch') el.innerHTML = renderDispatchModal();
      else if (state.overlay.type === 'memo') el.innerHTML = renderMemoSheet();
      else if (state.overlay.type === 'classCancel') el.innerHTML = renderClassCancelModal();
      else if (state.overlay.type === 'batchLeave') el.innerHTML = renderBatchLeaveModal();
      else if (state.overlay.type === 'adminLeave') el.innerHTML = renderAdminLeaveModal();
      else el.innerHTML = '';

      const nextScrollEl = el.querySelector('#pickerScroll');
      if (nextScrollEl) {
        if (state.picker && state.picker.resetScroll) {
          state.picker.resetScroll = false;
          requestAnimationFrame(scrollPickerToDefault);
        } else {
          nextScrollEl.scrollTop = prevScroll;
        }
      }
      if (window.lucide) lucide.createIcons();
    }

    function modalShell(content, width = 'max-w-[420px]') {
      return `
        <div class="absolute inset-0 z-50">
          <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]" data-action="close-overlay"></div>
          <div class="absolute inset-x-4 top-1/2 mx-auto ${width} max-h-[90%] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl">
            ${content}
          </div>
        </div>`;
    }

    function sheetShell(content) {
      return `
        <div class="absolute inset-0 z-50">
          <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]" data-action="close-overlay"></div>
          <div class="absolute inset-x-0 bottom-0 mx-auto flex max-h-[92%] w-full max-w-[560px] flex-col overflow-y-auto rounded-t-3xl bg-white p-5 shadow-2xl">
            <div class="mx-auto mb-3 h-1 w-10 shrink-0 rounded-full bg-slate-200"></div>
            ${content}
          </div>
        </div>`;
    }

    function modalHeader(title, subtitle = '', destructive = false) {
      return `
        <div class="flex items-start justify-between gap-3">
          <div class="flex min-w-0 items-start gap-2.5">
            <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl ${destructive ? 'bg-rose-100 text-rose-700' : 'bg-indigo-100 text-indigo-700'}">${icon(destructive ? 'calendar-x' : 'calendar-range', 'h-4 w-4')}</div>
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
              ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
            </div>
          </div>
          <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 同师挪位 Picker：固定位本轮 4 周 / 临时课前后 7 天
     * ------------------------------------------------------------------ */
    function buildPickerWeeks(l) {
      if (l.type === 'fixed') {
        return [0, 1, 2, 3].map((i) => makePickerWeek(isoAdd(FIXED_ROUND_START, i * 7), l, true));
      }
      const base = mondayOf(l.date);
      return [-1, 0, 1].map((i) => makePickerWeek(isoAdd(base, i * 7), l, false));
    }

    function makePickerWeek(monday, l, fixed) {
      const days = Array.from({ length: 7 }, (_, i) => {
        const iso = isoAdd(monday, i);
        const diff = diffDays(iso, l.date);
        return {
          iso,
          label: iso.slice(5),
          week: DAY_LABELS[i],
          inWindow: fixed ? true : (diff >= -7 && diff <= 7),
          past: diffDays(iso, TODAY) < 0,
          isOriginDay: iso === l.date
        };
      });
      return { monday, days, range: `${monday.slice(5)} ~ ${isoAdd(monday, 6).slice(5)}` };
    }

    function openPicker(lessonId) {
      if (!guardWrite()) return;
      const l = lessonById(lessonId);
      if (!l || l.status !== 'SCHEDULED') return showToast('该课次当前不可挪位', true);
      if (state.hours < 3) return showToast('距开课不足 3 小时，已进入授课准备锁定期，无法挪位', true);
      if (l.rescheduleCount >= 1) return showToast('本节课已挪位过 1 次，不可二次挪位', true);
      const weeks = buildPickerWeeks(l);
      const originIndex = weeks.findIndex((w) => w.days.some((d) => d.iso === l.date));
      state.activeLessonId = lessonId;
      state.picker = { mode: l.type, weeks, weekIndex: originIndex >= 0 ? originIndex : 0, selected: null, resetScroll: true };
      state.overlay = { type: 'picker' };
      renderAll();
    }

    function renderPicker() {
      const l = activeLesson();
      const p = state.picker;
      if (!l || !p) return '';
      const isFixed = l.type === 'fixed';
      const week = p.weeks[p.weekIndex];
      const selected = p.selected;
      const newText = selected
        ? `${fmtDate(selected.iso)} ${selected.time} - ${endTime(selected.time)}`
        : '请点选绿色可挪格';

      return `
        <div class="absolute inset-0 z-50 flex flex-col bg-white">
          <div class="flex shrink-0 items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 py-2.5">
            <div class="flex min-w-0 items-center gap-2.5">
              <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-indigo-600 text-white">${icon('calendar-range', 'h-4 w-4')}</div>
              <div class="min-w-0">
                <h2 class="truncate text-[16px] font-bold text-slate-900">同师挪位 · ${isFixed ? '固定位' : '临时课'}</h2>
                <p class="truncate text-[12px] font-medium text-slate-500">${isFixed ? '本轮 4 周购课周期内 · 仅同师空闲格 · 免扣配额' : '原课次前后 7 天内 · 仅同师空闲格 · 免扣配额'}</p>
              </div>
            </div>
            <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>

          <div class="flex shrink-0 gap-1 overflow-x-auto border-b border-slate-200 bg-slate-50 px-2 py-1.5">
            ${p.weeks.map((w, i) => {
              const on = i === p.weekIndex;
              const hasOrigin = w.days.some((d) => d.iso === l.date);
              return `<button data-action="picker-week" data-index="${i}" class="relative flex min-w-[74px] flex-1 flex-col items-center rounded-lg px-1 py-1 ${on ? 'bg-white text-indigo-700 shadow-sm ring-1 ring-indigo-200' : 'text-slate-500'}">
                <span class="text-[12px] font-bold">${isFixed ? `第${i + 1}周` : w.range.split(' ~ ')[0]}</span>
                <span class="text-[12px] font-medium ${on ? 'text-indigo-500' : 'text-slate-400'}">${isFixed ? w.range.split(' ~ ')[0] : w.range.split(' ~ ')[1]}</span>
                ${hasOrigin ? '<span class="absolute right-1 top-1 h-1.5 w-1.5 rounded-full bg-amber-500"></span>' : ''}
              </button>`;
            }).join('')}
          </div>

          <div class="flex shrink-0 flex-wrap items-center gap-x-2 gap-y-1 border-b border-slate-100 bg-white px-3 py-1.5 text-[12px] font-medium text-slate-600">
            <span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-sm border border-dashed border-amber-500 bg-amber-50"></span>[原]课次</span>
            <span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded bg-emerald-500"></span>可挪</span>
            <span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded bg-indigo-600"></span>拟选</span>
            <span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded bg-slate-300"></span>已占</span>
            <span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded bg-slate-100 border border-slate-200"></span>超窗/已过</span>
            <span class="ml-auto shrink-0 rounded border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${isFixed ? '本轮 4 周' : '±7 天'}</span>
          </div>

          <div id="pickerScroll" class="min-h-0 flex-1 overflow-auto bg-white">
            <table class="w-full table-fixed border-collapse">
              <thead>
                <tr>
                  <th class="sticky left-0 top-0 z-40 w-[40px] border-b border-r border-slate-200 bg-slate-100 px-0 py-1 text-center text-[12px] font-bold text-slate-500">时段</th>
                  ${week.days.map((d) => `<th class="sticky top-0 z-30 border-b border-r border-slate-200 ${d.iso === TODAY ? 'bg-amber-100 text-amber-900' : d.isOriginDay ? 'bg-amber-50 text-amber-900' : 'bg-slate-50 text-slate-600'} px-0.5 py-1 text-center">
                    <div class="text-[12px] font-bold leading-tight">${d.week}</div>
                    <div class="font-mono text-[12px] font-semibold leading-tight ${d.iso === TODAY ? 'text-amber-800' : 'text-slate-400'}">${d.label}</div>
                  </th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${TIME_SLOTS.map((time) => `
                  <tr class="h-8">
                    <th data-time="${time}" class="sticky left-0 z-20 w-[40px] border-b border-r border-slate-200 bg-slate-100 px-0 text-center align-middle text-[12px] font-mono font-semibold text-slate-500">${time}</th>
                    ${week.days.map((d) => pickerCellHtml(d, time)).join('')}
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>

          <div class="shrink-0 border-t border-slate-200 bg-white px-3 py-2">
            <div class="flex items-center justify-between gap-2 text-[12px]">
              <div class="min-w-0">
                <div class="truncate text-slate-400">原课次：<span class="font-mono font-semibold text-slate-700">${fmtDate(l.date)} ${l.time}</span></div>
                <div class="mt-0.5 truncate font-bold text-indigo-700">新时段：<span class="font-mono">${newText}</span></div>
              </div>
              <span class="shrink-0 rounded border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">免扣请假配额</span>
            </div>
            <div class="mt-2 flex gap-2">
              <button data-action="close-overlay" class="h-10 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">取消</button>
              <button data-action="confirm-picker" ${!selected || state.online === 'off' ? 'disabled' : ''} class="h-10 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认平移此排期（免扣配额）</button>
            </div>
          </div>
        </div>`;
    }

    function pickerCellHtml(day, time) {
      const base = 'flex h-7 w-full items-center justify-center overflow-hidden rounded-md border text-[12px] font-bold leading-none transition active:scale-95';
      if (!day.inWindow) return `<td class="border-b border-r border-slate-100 p-[2px]"><div class="${base} border-slate-100 bg-slate-50 text-slate-300">超窗</div></td>`;
      if (day.past) return `<td class="border-b border-r border-slate-100 p-[2px]"><div class="${base} border-slate-100 bg-slate-50 text-slate-300">已过</div></td>`;
      const s = slotState(day.iso, time);
      if (s === 'ORIGIN') return `<td class="border-b border-r border-slate-100 p-[2px]"><div class="${base} border-dashed border-amber-400 bg-amber-50 text-amber-900">[原]</div></td>`;
      if (s === 'OCCUPIED') return `<td class="border-b border-r border-slate-100 p-[2px]"><div class="${base} border-slate-200 bg-slate-100 text-slate-400">已占</div></td>`;
      if (s === 'GREEN') {
        const selected = state.picker.selected && state.picker.selected.iso === day.iso && state.picker.selected.time === time;
        return `<td class="border-b border-r border-slate-100 p-[2px]"><button data-action="picker-slot" data-day="${day.iso}" data-time="${time}" class="${base} ${selected ? 'border-indigo-500 bg-indigo-600 text-white ring-2 ring-indigo-300' : 'border-emerald-200 bg-emerald-50 text-emerald-700'}">${selected ? '拟选' : '可挪'}</button></td>`;
      }
      return `<td class="border-b border-r border-slate-100 p-[2px]"><div class="${base} border-slate-100 bg-white text-slate-200">·</div></td>`;
    }

    function scrollPickerToDefault() {
      const el = document.getElementById('pickerScroll');
      if (!el) return;
      const anchor = el.querySelector('th[data-time="14:00"]');
      if (!anchor) return;
      const head = el.querySelector('thead');
      const delta = anchor.getBoundingClientRect().top - el.getBoundingClientRect().top + el.scrollTop;
      el.scrollTop = Math.max(0, delta - (head ? head.getBoundingClientRect().height : 40));
    }

    function selectPickerSlot(dayISO, time) {
      if (!guardWrite()) return;
      state.picker.selected = { iso: dayISO, time };
      renderOverlay();
    }

    function changePickerWeek(index) {
      if (!state.picker) return;
      const idx = Number(index);
      if (idx < 0 || idx >= state.picker.weeks.length) return;
      state.picker.weekIndex = idx;
      state.picker.selected = null;
      renderOverlay();
    }

    function confirmPicker() {
      if (!guardWrite()) return;
      if (state.hours < 3) return showToast('距开课不足 3 小时，已进入授课准备锁定期，无法挪位', true);
      const l = activeLesson();
      const p = state.picker;
      if (!l || !p || !p.selected) return showToast('请先点选绿色可挪格', true);
      if (l.rescheduleCount >= 1) return showToast('本节课已挪位过 1 次，不可二次挪位', true);
      l.date = p.selected.iso;
      l.time = p.selected.time;
      l.rescheduleCount = 1;
      if (state.role === 'admin') {
        l.adminRescheduled = true;
        appendAdminAudit(l, 'reschedule', '管理员代挪位（免扣配额）', false);
      }
      state.overlay = null;
      state.picker = null;
      renderAll();
      showToast(`同师挪位成功 · 新时段 ${fmtDate(l.date)} ${l.time} · 免扣请假配额，已通知教师`);
    }

    /* ------------------------------------------------------------------
     * 家长请假：配额核销确认
     * ------------------------------------------------------------------ */
    function openLeave(lessonId) {
      if (!guardWrite()) return;
      const l = lessonById(lessonId);
      if (!l || l.status !== 'SCHEDULED') return showToast('该课次当前不可请假', true);
      if (state.hours < 3) return showToast('距开课不足 3 小时，全端锁定，无法请假', true);
      if (state.hours < 24) return showToast('距开课不足 24 小时，仅支持同师挪位或课程转让', true);
      if (l.type === 'fixed') return showToast('固定位不可请假退回待排期，请使用同师挪位或转让', true);
      const q = quotaOf(l.studentKey);
      if (q.max - q.used <= 0) return showToast('本期请假配额已用尽，仅支持同师挪位或转让', true);
      state.activeLessonId = lessonId;
      state.overlay = { type: 'leave' };
      renderAll();
    }

    function renderLeaveModal() {
      const l = activeLesson();
      if (!l) return '';
      const q = quotaOf(l.studentKey);
      const remaining = q.max - q.used;
      return modalShell(`
        ${modalHeader('申请请假（退回待排期）', `${fmtDate(l.date)} ${l.time} - ${endTime(l.time)} · ${TEACHER_NAME}`, true)}
        <div class="mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold text-rose-800">消耗 1 次请假配额</span>
            <span class="rounded-full bg-rose-200 px-2 py-0.5 text-[12px] font-bold text-rose-900">剩余 ${remaining} 次 → ${remaining - 1} 次</span>
          </div>
          <p class="mt-1.5 text-[12px] font-medium leading-relaxed text-rose-700">请假成功后该课次退回待排期，原日历网格立即释放；扣减的配额为永久性消费，后续重新预约并正常完课亦不予返还。</p>
        </div>
        <div class="mt-2 rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold text-amber-900">不想浪费请假配额？</span>
            <span class="text-[12px] font-bold text-emerald-700">免扣额度</span>
          </div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-amber-800">若仅是本时段冲突，推荐【同师挪位】：临时课可在前后 7 天内、固定位可在本轮 4 周内平移至同师空闲格，完全不消耗请假配额。</p>
          <button data-action="switch-reschedule" class="mt-2 h-9 w-full rounded-xl bg-amber-200 text-[14px] font-semibold text-amber-950">切换为同师挪位（免扣）</button>
        </div>
        <div class="mt-4 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">暂不请假</button>
          <button data-action="confirm-leave" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认请假（扣 1 次）</button>
        </div>`);
    }

    function confirmLeave() {
      if (!guardWrite()) return;
      if (state.hours < 3) return showToast('距开课不足 3 小时，全端锁定，无法请假', true);
      if (state.hours < 24) return showToast('距开课不足 24 小时，仅支持同师挪位或课程转让', true);
      const l = activeLesson();
      if (!l) return;
      if (l.status !== 'SCHEDULED' || l.type !== 'temp') return showToast('该课次不可请假退期待排', true);
      const q = quotaOf(l.studentKey);
      if (q.max - q.used <= 0) return showToast('请假配额已用尽', true);
      q.used += 1;
      l.status = 'PENDING_REBOOK';
      l.quotaExempt = false;
      state.overlay = null;
      renderAll();
      showToast(`请假成功：课次已退回待排期，扣 1 次配额（剩余 ${q.max - q.used}/${q.max} 次，永久不退还）`);
    }

    function switchToReschedule() {
      const id = state.activeLessonId;
      state.overlay = null;
      openPicker(id);
    }

    /* ------------------------------------------------------------------
     * 教师请假
     * ------------------------------------------------------------------ */
    function openTeacherLeave(lessonId) {
      if (!guardWrite()) return;
      const l = lessonById(lessonId);
      if (!l || l.status !== 'SCHEDULED') return showToast('该课次当前不可请假', true);
      state.activeLessonId = lessonId;
      state.overlay = { type: 'teacherLeave' };
      renderAll();
    }

    function renderTeacherLeaveModal() {
      const l = activeLesson();
      if (!l) return '';
      const urgent = state.hours < 24;
      return modalShell(`
        ${modalHeader('教师申请请假', `${TEACHER_NAME} · ${fmtDate(l.date)} ${l.time}`, true)}
        <div class="mt-3">
          <label for="teacherLeaveType" class="mb-1 block text-[12px] font-medium text-slate-500">请假类型</label>
          <select id="teacherLeaveType" class="h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-[16px] text-slate-900 outline-none">
            <option value="SICK">因病请假（突发咽喉炎 / 发热）</option>
            <option value="PERSONAL">因事请假（个人紧急事务）</option>
          </select>
        </div>
        <div class="mt-3">
          <label for="teacherLeaveReason" class="mb-1 block text-[12px] font-medium text-slate-500">请假事由与交接说明</label>
          <textarea id="teacherLeaveReason" rows="3" maxlength="200" class="h-24 w-full resize-none rounded-xl border border-slate-200 p-3 text-[16px] text-slate-900 outline-none" placeholder="请描述病情或事由，便于班长为学生协调代课……"></textarea>
        </div>
        <div class="mt-2 rounded-xl border ${urgent ? 'border-rose-200 bg-rose-50 text-rose-900' : 'border-amber-200 bg-amber-50 text-amber-900'} px-3.5 py-2.5 text-[12px] font-medium leading-relaxed">
          ${urgent
            ? `距开课不足 24 小时，属于紧急请假：系统将并发向负责班长发送邮件 / 短信 / 站内信告警，班长强制介入调配代课${state.hours < 3 ? '；已进入 <3h 兜底窗口' : ''}。`
            : '常规请假：该节课次挂起为待代课，原日历置红，系统向负责班长派发代课待办卡片。'}
        </div>
        <div class="mt-4 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">取消</button>
          <button data-action="confirm-teacher-leave" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认申请请假</button>
        </div>`);
    }

    function confirmTeacherLeave() {
      if (!guardWrite()) return;
      const l = activeLesson();
      if (!l) return;
      const reasonEl = document.getElementById('teacherLeaveReason');
      const typeEl = document.getElementById('teacherLeaveType');
      const reason = reasonEl ? reasonEl.value.trim() : '';
      if (!reason) return showToast('请填写请假事由', true);
      l.status = 'PENDING_SUBSTITUTE';
      l.leaveReason = reason;
      l.leaveType = typeEl ? typeEl.value : 'SICK';
      state.overlay = null;
      renderAll();
      showToast(state.hours < 24 ? '紧急请假已提交：已并发通知班长与平台管理员' : '请假已提交：已向班长派发代课待办');
    }

    /* ------------------------------------------------------------------
     * 班长：指派代课 / 兜底退回 / 撤销
     * ------------------------------------------------------------------ */
    function openDispatch(lessonId) {
      if (!guardWrite()) return;
      const l = lessonById(lessonId);
      if (!l || l.status !== 'PENDING_SUBSTITUTE') return showToast('该工单不可指派', true);
      state.activeLessonId = lessonId;
      state.overlay = { type: 'dispatch' };
      renderAll();
    }

    function renderDispatchModal() {
      const l = activeLesson();
      if (!l) return '';
      const urgent = state.hours < 12;
      return modalShell(`
        ${modalHeader('指派代课外教', `学员 ${studentByKey(l.studentKey).name} · KET备考`)}
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-[12px]">
          <div class="flex justify-between py-1"><span class="text-slate-400">原授课外教</span><span class="font-semibold text-slate-800">${TEACHER_NAME}（${esc(l.leaveReason || '临时请假')}）</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">授课时间</span><span class="font-mono font-bold text-indigo-700">${fmtDate(l.date)} ${l.time} - ${endTime(l.time)}</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">课程类型</span><span class="font-semibold text-slate-800">KET备考（需匹配 KET 技能）</span></div>
          <div class="flex justify-between py-1"><span class="text-slate-400">资金持有人</span><span class="font-semibold text-emerald-700">班长 Leo（代课不变）</span></div>
        </div>
        ${urgent ? '<div class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-2 text-[12px] font-bold text-rose-700">距开课不足 12 小时，工单已升级紧急催办并抄送平台管理员</div>' : ''}
        <div class="mt-3">
          <div class="text-[14px] font-semibold text-slate-700">符合技能且此时段空闲的外教</div>
          <div class="mt-2 space-y-1.5">
            ${SUB_CANDIDATES.map((t) => `
              <div class="flex items-center justify-between gap-2 rounded-xl border border-slate-200 px-3 py-2">
                <div class="min-w-0">
                  <div class="text-[14px] font-bold text-slate-800">${esc(t.name)}</div>
                  <div class="text-[12px] font-medium text-slate-500">${t.level} · 技能 ${esc(t.skills)} · 班长 Leo</div>
                </div>
                <button data-action="assign-sub" data-name="${esc(t.name)}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg bg-indigo-600 px-2.5 text-[12px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">指派代课</button>
              </div>`).join('')}
          </div>
        </div>
        <div class="mt-3 border-t border-slate-100 pt-2">
          <button data-action="toggle-fallback" class="text-[12px] font-medium text-amber-700 underline">实在无可用代课老师？与家长协商退期待排</button>
          <div id="fallbackBox" class="mt-2 hidden rounded-xl border border-amber-200 bg-amber-50 p-3 text-[12px]">
            <p class="font-medium leading-relaxed text-amber-900">因教师原因无法代课而退回待排期的，系统物理强制豁免扣减学生请假配额。</p>
            <input id="fallbackMemo" class="mt-2 h-10 w-full rounded-lg border border-amber-300 bg-white px-2.5 text-[16px] outline-none" placeholder="输入与家长协商沟通说明……">
            <button data-action="confirm-fallback" ${state.online === 'off' ? 'disabled' : ''} class="mt-2 h-9 w-full rounded-lg bg-amber-600 text-[14px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认协商退回待排期（豁免配额）</button>
          </div>
        </div>`);
    }

    function assignSub(name) {
      if (!guardWrite()) return;
      const l = activeLesson();
      if (!l) return;
      l.status = 'SUBSTITUTED';
      l.sub = name;
      state.overlay = null;
      renderAll();
      showToast(`已指派 ${name} 代课 · 资金持有人保持不变 · 已通知三方`);
    }

    function toggleFallback() {
      const box = document.getElementById('fallbackBox');
      if (box) box.classList.toggle('hidden');
    }

    function confirmFallback() {
      if (!guardWrite()) return;
      const l = activeLesson();
      if (!l) return;
      const memoEl = document.getElementById('fallbackMemo');
      if (!memoEl || !memoEl.value.trim()) return showToast('请输入与家长的协商备注', true);
      l.status = 'PENDING_REBOOK';
      l.quotaExempt = true;
      state.overlay = null;
      renderAll();
      showToast('已协商退回待排期 · 物理豁免扣减学生请假配额');
    }

    function revokeSub(lessonId) {
      if (!guardWrite()) return;
      if (state.hours < 24) return showToast('距开课不足 24 小时，代课已刚性锁定，不可撤销', true);
      const l = lessonById(lessonId);
      if (!l || l.status !== 'SUBSTITUTED') return;
      l.status = 'SCHEDULED';
      l.sub = null;
      renderAll();
      showToast('已撤销代课，恢复由原老师授课');
    }

    /* ------------------------------------------------------------------
     * 代课教师：学情留言板
     * ------------------------------------------------------------------ */
    function openMemo(lessonId) {
      state.activeLessonId = lessonId;
      state.overlay = { type: 'memo' };
      renderAll();
    }

    function renderMemoSheet() {
      const l = activeLesson();
      if (!l) return '';
      return sheetShell(`
        ${modalHeader('代课学情与交接进度', `${studentByKey(l.studentKey).name} · KET备考`)}
        <div class="mt-3 rounded-xl border border-indigo-200 bg-indigo-50 px-3.5 py-3 text-indigo-950">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold">代课课酬记账归属</span>
            <span class="rounded-full bg-indigo-200 px-2 py-0.5 text-[12px] font-bold text-indigo-900">100% 计入 Elena 周结单</span>
          </div>
          <p class="mt-1.5 text-[12px] font-medium leading-relaxed text-indigo-800">本节完课后课酬 100% 结算至代课老师 Elena 周课酬单，原授课外教 David 课酬计数为 0。距开课 &lt;24h 时代课刚性锁定，不可撤销。</p>
        </div>
        <div class="mt-2 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-3">
          <div class="text-[14px] font-bold text-slate-800">原任课外教 David 的交接备注</div>
          <div class="mt-1.5 rounded-xl border border-slate-100 bg-white px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-600">
            <p><b>教学进度：</b>已完成 Lesson 12 自然拼读，掌握全部双元音发音规律；本节需开启 Lesson 13 短元音专项训练。</p>
            <p class="mt-1"><b>学员性格：</b>Alice 互动积极、口语自信，但长时间拼读容易注意力分散，建议前半段用闪卡互动破冰。</p>
          </div>
        </div>
        <div class="mt-3">
          <label for="subTeacherNote" class="mb-1 block text-[12px] font-medium text-slate-500">代课老师备课心得 / 教学记录</label>
          <textarea id="subTeacherNote" rows="3" class="h-24 w-full resize-none rounded-xl border border-slate-200 p-3 text-[16px] text-slate-900 outline-none" placeholder="已准备短元音闪卡 PPT 与单词配对游戏……"></textarea>
          <button data-action="save-memo" ${state.online === 'off' ? 'disabled' : ''} class="mt-2 h-10 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">保存代课交接笔记</button>
        </div>`);
    }

    function saveMemo() {
      if (!guardWrite()) return;
      state.overlay = null;
      renderAll();
      showToast('代课交接笔记已保存');
    }

    /* ------------------------------------------------------------------
     * 小班整班停课
     * ------------------------------------------------------------------ */
    function openClassCancel() {
      if (!guardWrite()) return;
      if (state.classCancelled) return;
      state.overlay = { type: 'classCancel' };
      renderAll();
    }

    function renderClassCancelModal() {
      return modalShell(`
        ${modalHeader('小班整班请假停课', `${CLASS_INFO.name}（${CLASS_INFO.size} 人班）`, true)}
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5">
          <div class="text-[12px] font-medium text-slate-400">停课日期与时段</div>
          <div class="mt-0.5 font-mono text-[14px] font-bold text-slate-800">${fmtDate(CLASS_INFO.date)} ${CLASS_INFO.time} - ${CLASS_INFO.end}</div>
        </div>
        <div class="mt-3">
          <label for="classCancelReason" class="mb-1 block text-[12px] font-medium text-slate-500">停课事由 <span class="text-rose-500">*</span></label>
          <input id="classCancelReason" value="公众假期停课，后续统一补排" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-[16px] text-slate-900 outline-none">
        </div>
        <div class="mt-2 rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-2.5 text-[12px] font-medium leading-relaxed text-amber-900">
          <div class="font-bold">执行联动</div>
          <p class="mt-1">1. 该节小班课原子退回班级待排期池，日历网格置红 🔴；</p>
          <p>2. 系统向授课教师发送停课邮件；小班家长由班长在线下群通知；</p>
          <p>3. 向小班班长派发高优先级补排催办邮件与待办卡片。</p>
        </div>
        <div class="mt-4 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">取消</button>
          <button data-action="confirm-class-cancel" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认整班停课</button>
        </div>`);
    }

    function confirmClassCancel() {
      if (!guardWrite()) return;
      const reasonEl = document.getElementById('classCancelReason');
      if (!reasonEl || !reasonEl.value.trim()) return showToast('请填写停课事由', true);
      state.classCancelled = true;
      state.overlay = null;
      renderAll();
      showToast('整班停课成功：已通知全班家长，并生成补排催办待办');
    }

    /* ------------------------------------------------------------------
     * 教师空闲时段请假 / 销假
     * ------------------------------------------------------------------ */
    function toggleFree(slotId) {
      if (!guardWrite()) return;
      const f = state.freeSlots.find((x) => x.id === slotId);
      if (!f) return;
      f.state = f.state === 'leave' ? 'free' : 'leave';
      renderAll();
      showToast(f.state === 'leave' ? '已标记请假，该时段不开放且不占配额' : '已销假，该时段恢复 🟢 空闲可约');
    }

    function guardWrite() {
      if (state.online === 'off') {
        showToast('离线只读，暂不可执行该操作', true);
        return false;
      }
      return true;
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.className = `pointer-events-none absolute bottom-24 left-1/2 z-[100] w-max max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl px-4 py-2 text-center text-[12px] font-semibold leading-relaxed text-white shadow-xl ${isError ? 'bg-rose-600/95' : 'bg-slate-900/90'}`;
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.add('hidden'), 2800);
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'close-overlay') { state.overlay = null; state.picker = null; state.batch = null; renderOverlay(); return; }
      if (action === 'set-child') { state.child = el.dataset.key; renderAll(); return; }
      if (action === 'open-picker') return openPicker(el.dataset.id);
      if (action === 'open-leave') return openLeave(el.dataset.id);
      if (action === 'confirm-leave') return confirmLeave();
      if (action === 'switch-reschedule') return switchToReschedule();
      if (action === 'open-teacher-leave') return openTeacherLeave(el.dataset.id);
      if (action === 'confirm-teacher-leave') return confirmTeacherLeave();
      if (action === 'open-batch-leave') return openBatchLeave();
      if (action === 'batch-day') return changeBatchDay(el.dataset.day);
      if (action === 'batch-slot') return toggleBatchSlot(el.dataset.id);
      if (action === 'batch-select-max') return selectBatchMax();
      if (action === 'batch-clear') return clearBatchSelection();
      if (action === 'confirm-batch-leave') return confirmBatchLeave();
      if (action === 'open-admin-leave') return openAdminLeave(el.dataset.id);
      if (action === 'admin-channel') return setAdminChannel(el.dataset.channel);
      if (action === 'confirm-admin-leave') return confirmAdminLeave();
      if (action === 'emergency-assign-all') return emergencyAssignAll();
      if (action === 'emergency-auto-relief') return emergencyAutoRelief();
      if (action === 'emergency-safety') return emergencySafetyFallback();
      if (action === 'emergency-assign') return emergencyAssign(el.dataset.id);
      if (action === 'emergency-return') return emergencyReturn(el.dataset.id);
      if (action === 'emergency-reschedule') return emergencyReschedule(el.dataset.id);
      if (action === 'emergency-rollback') return emergencyRollback();
      if (action === 'open-dispatch') return openDispatch(el.dataset.id);
      if (action === 'assign-sub') return assignSub(el.dataset.name);
      if (action === 'toggle-fallback') return toggleFallback();
      if (action === 'confirm-fallback') return confirmFallback();
      if (action === 'revoke-sub') return revokeSub(el.dataset.id);
      if (action === 'open-memo') return openMemo(el.dataset.id);
      if (action === 'save-memo') return saveMemo();
      if (action === 'open-class-cancel') return openClassCancel();
      if (action === 'confirm-class-cancel') return confirmClassCancel();
      if (action === 'toggle-free') return toggleFree(el.dataset.id);
      if (action === 'picker-week') return changePickerWeek(el.dataset.index);
      if (action === 'picker-slot') return selectPickerSlot(el.dataset.day, el.dataset.time);
      if (action === 'confirm-picker') return confirmPicker();
    });

    // 批量请假弹窗内的输入需在重渲染后保持
    document.getElementById('frame').addEventListener('input', (e) => {
      if (e.target && e.target.id === 'batchReason' && state.batch) state.batch.reason = e.target.value;
      if (e.target && e.target.id === 'adminLeaveReason' && state.adminLeave) {
        state.adminLeave.reason = e.target.value;
        state.adminLeave.error = '';
        const count = document.getElementById('adminReasonCount');
        if (count) count.textContent = `${e.target.value.length}/200`;
      }
    });
    document.getElementById('frame').addEventListener('change', (e) => {
      if (e.target && e.target.id === 'batchReasonType' && state.batch) state.batch.reasonType = e.target.value;
      if (e.target && e.target.id === 'adminCompensate' && state.adminLeave) state.adminLeave.compensate = e.target.checked;
    });

    renderAll();
  </script>
</body>
</html>

      if (!guardWrite()) return;
      const l = lessonById(lessonId);
      if (!l || l.status !== 'SCHEDULED') return showToast('该课次当前不可代办', true);
      state.activeLessonId = lessonId;
      state.overlay = { type: 'proxy' };
      renderAll();
    }

    function renderProxyDrawer() {
      const l = activeLesson();
      if (!l) return '';
      const q = quotaOf(l.studentKey);
      const left = q.max - q.used;
      const isAdmin = state.role === 'admin';
      const offline = state.online === 'off';
      const rescheduleLocked = state.hours < 3 || l.rescheduleCount >= 1;
      const rescheduleLabel = state.hours < 3 ? '同师挪位已锁（<3h）' : l.rescheduleCount >= 1 ? '已挪位 1 次' : '协助同师挪位';
      const normalOk = l.type === 'temp' && state.hours >= 24 && left > 0;
      const leaveLocked = !isAdmin && !normalOk;
      return modalShell(`
        ${modalHeader('学员课表代办', `${studentByKey(l.studentKey).name} · ${fmtDate(l.date)} ${l.time} - ${endTime(l.time)}`)}
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-[12px]">
          <div class="flex justify-between py-0.5"><span class="text-slate-500">学员</span><span class="font-semibold text-slate-800">${esc(studentByKey(l.studentKey).name)}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">上课时间</span><span class="font-mono font-bold text-slate-800">${fmtDate(l.date)} ${l.time} - ${endTime(l.time)}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">任课外教</span><span class="font-semibold text-slate-800">${TEACHER_NAME}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">教室</span><span class="font-semibold text-slate-800">${ROOM_LABEL}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">班型</span><span class="font-semibold text-slate-800">${l.type === 'fixed' ? '1v1 固定位' : '1v1 临时课'}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">请假配额余量</span><span class="font-mono font-bold ${left > 0 ? 'text-emerald-700' : 'text-rose-700'}">已用 ${q.used} / 上限 ${q.max} · 剩余 ${left} 次</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">资金持有人</span><span class="font-semibold text-emerald-700">班长 Leo（代办不变）</span></div>
        </div>

        <div class="mt-3 rounded-xl border border-indigo-200/70 bg-indigo-50/80 p-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="text-[14px] font-bold text-indigo-950">${icon('refresh-cw', 'mr-1 inline h-4 w-4')}协助同师挪位</div>
              <p class="mt-1 text-[12px] font-medium leading-relaxed text-indigo-900/85">固定位限本轮 4 周购课周期内，临时课限原课次前后 7 天；仅同师空闲格，免扣请假配额。</p>
            </div>
            <button data-action="proxy-reschedule" ${rescheduleLocked || offline ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg bg-indigo-600 px-2.5 text-[12px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">${rescheduleLabel}</button>
          </div>
        </div>

        ${l.type === 'fixed' ? `<div class="mt-2 rounded-xl border border-amber-200/70 bg-amber-50/80 p-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="text-[14px] font-bold text-amber-950">${icon('lock', 'mr-1 inline h-4 w-4')}固定位不支持请假</div>
              <p class="mt-1 text-[12px] font-medium leading-relaxed text-amber-900/85">固定位为 4 周契约，不支持请假，也不支持批量跨周请假；只能代同师挪位或代办转让。异常请走下方【异常处理】。</p>
            </div>
            <span class="shrink-0 rounded-full border border-amber-300 bg-white px-2 py-0.5 text-[12px] font-bold text-amber-800">仅挪位/转让</span>
          </div>
          <div class="mt-2 flex justify-end">
            <a href="m3c_course_transfer.html?role=leo&mode=ts&studentId=stu_${l.studentKey}&tsId=${l.id}&from=calendar" target="_blank" rel="noopener" class="inline-flex h-8 items-center gap-1 rounded-lg border border-amber-300 bg-white px-2.5 text-[12px] font-semibold text-amber-800">${icon('arrow-right-left', 'h-3.5 w-3.5')}代办转让</a>
          </div>
        </div>` : `<div class="mt-2 rounded-xl border border-rose-200/70 bg-rose-50/80 p-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="text-[14px] font-bold text-rose-950">${icon('file-pen-line', 'mr-1 inline h-4 w-4')}协助申请请假</div>
              <p class="mt-1 text-[12px] font-medium leading-relaxed text-rose-900/85">${isAdmin ? '常规通道扣 1 次配额；特批仅临时课可突破 <3h 与配额耗尽限制，免扣配额，原因 ≥10 字并审计。' : '班长常规通道限临时课、≥24h 且配额充足，扣 1 次配额；<3h 或配额耗尽需报平台管理员特批。'}</p>
            </div>
            <button data-action="proxy-leave" ${offline || leaveLocked ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg bg-rose-600 px-2.5 text-[12px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">${leaveLocked ? '常规不可用' : '协助申请请假'}</button>
          </div>
          ${leaveLocked ? '<p class="mt-1.5 rounded-lg border border-rose-200 bg-white/80 px-2.5 py-1.5 text-[12px] font-medium text-rose-700">当前不满足班长常规代请假条件；如遇突发急病等不可抗力，请报平台管理员特批处理。</p>' : ''}
        </div>`}

        <div class="mt-2 rounded-xl border border-slate-200 bg-white p-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="text-[14px] font-bold text-slate-900">${icon('clipboard-check', 'mr-1 inline h-4 w-4')}单节课异常处理</div>
              <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">正常出勤 / 学员旷课 / 外教旷课 / 撤排退回 / 同师挪位；管理员另有异常回退补生与临时课特批请假。每次处置写入审计，不生成退款单。</p>
            </div>
            <button data-action="open-exception" data-id="${l.id}" ${!exceptionEligible(l) || offline ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-700 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-100 disabled:text-slate-500">异常处理</button>
          </div>
        </div>

        <div class="mt-4 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800">关闭</button>
        </div>`);
    }

    function proxyReschedule() {
      const l = activeLesson();
      if (!l) return;
      state.overlay = null;
      openPicker(l.id);
    }

    function proxyLeave() {
      const l = activeLesson();
      if (!l) return;
      if (l.type === 'fixed') return showToast('固定位不支持请假；请使用同师挪位/代办转让，或走【异常处理】', true);
      if (state.role === 'admin') {
        state.overlay = null;
        openAdminLeave(l.id);
        return;
      }
      const q = quotaOf(l.studentKey);
      const normalOk = l.type === 'temp' && state.hours >= 24 && (q.max - q.used) > 0;
      if (!normalOk) return showToast('不满足班长常规代请假条件，请报平台管理员特批', true);
      state.proxyLeaveReason = '';
      state.overlay = { type: 'proxyLeave' };
      renderAll();
    }

    function renderProxyLeaveModal() {
      const l = activeLesson();
      if (!l) return '';
      const q = quotaOf(l.studentKey);
      const left = q.max - q.used;
      const normalOk = l.type === 'temp' && state.hours >= 24 && left > 0;
      return modalShell(`
        ${modalHeader('班长协助申请请假', `${studentByKey(l.studentKey).name} · ${fmtDate(l.date)} ${l.time} - ${endTime(l.time)}`, true)}
        <div class="mt-2.5 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-[12px]">
          <div class="flex justify-between py-0.5"><span class="text-slate-500">任课外教</span><span class="font-semibold text-slate-800">${TEACHER_NAME}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">教室</span><span class="font-semibold text-slate-800">${ROOM_LABEL}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">班型</span><span class="font-semibold text-slate-800">${l.type === 'fixed' ? '1v1 固定位' : '1v1 临时课'}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">配额</span><span class="font-mono font-bold text-slate-800">已用 ${q.used} / 上限 ${q.max} · 剩余 ${left} 次</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">距上课</span><span class="font-mono font-bold ${state.hours < 3 ? 'text-rose-700' : state.hours < 24 ? 'text-amber-700' : 'text-emerald-700'}">${state.hours}h</span></div>
        </div>
        <div class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-rose-800">
          常规代请假将退回待排期并扣减 1 次配额（剩余 ${left} → ${Math.max(0, left - 1)}）；配额为永久消费，不返还。
        </div>
        ${!normalOk ? '<div class="mt-1.5 rounded-lg border border-rose-200 bg-rose-50 px-2.5 py-1.5 text-[12px] font-medium text-rose-700">当前不满足常规条件，请切换管理员特批通道。</div>' : ''}
        <div class="mt-3">
          <label for="proxyLeaveReason" class="mb-1 block text-[14px] font-semibold text-slate-700">代请假原因 <span class="text-rose-500">*</span></label>
          <textarea id="proxyLeaveReason" maxlength="200" rows="3" class="h-20 w-full resize-none rounded-xl border border-slate-200 bg-white p-2.5 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500" placeholder="请填写代请假原因，便于审计追溯……">${esc(state.proxyLeaveReason || '')}</textarea>
        </div>
        <div class="mt-4 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800">取消</button>
          <button data-action="confirm-proxy-leave" ${!normalOk || state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认代请假（扣 1 次）</button>
        </div>`);
    }

    function confirmProxyLeave() {
      if (!guardWrite()) return;
      const l = activeLesson();
      if (!l) return;
      const q = quotaOf(l.studentKey);
      const left = q.max - q.used;
      if (!(l.type === 'temp' && state.hours >= 24 && left > 0)) return showToast('当前不满足常规代请假条件，请报平台管理员特批', true);
      const reasonEl = document.getElementById('proxyLeaveReason');
      const reason = reasonEl ? reasonEl.value.trim() : (state.proxyLeaveReason || '').trim();
      if (reason.length < 2 || reason.length > 200) return showToast('代请假原因需为 2-200 字', true);
      q.used += 1;
      l.status = 'PENDING_REBOOK';
      l.quotaExempt = false;
      l.monitorNormal = true;
      appendAdminAudit(l, 'monitorLeave', reason, false);
      state.overlay = null;
      state.proxyLeaveReason = '';
      renderAll();
      showToast('班长常规代请假完成 · 已扣 1 次配额并写入审计');
    }

    /* ------------------------------------------------------------------
     * 单节课异常处理（班长 / 管理员）
     * ------------------------------------------------------------------ */
    function exceptionEligible(l) {
      if (!l || activeEmergencyLesson(l.id)) return false;
      return ['SCHEDULED', 'SUBSTITUTED', 'PENDING_SUBSTITUTE', 'COMPLETED', 'COMPLETED_ABSENT'].includes(l.status);
    }

    function exceptionOptions(l) {
      const isAdmin = state.role === 'admin';
      const isFixed = l.type === 'fixed';
      const rescheduleDisabled = state.hours < 3 || l.rescheduleCount >= 1 || l.status !== 'SCHEDULED';
      const rescheduleReason = state.hours < 3
        ? '距上课 <3h 已锁定'
        : l.rescheduleCount >= 1
          ? '本节已挪位 1 次'
          : l.status !== 'SCHEDULED'
            ? '当前状态不可同师挪位'
            : '';
      const completed = l.status === 'COMPLETED' || l.status === 'COMPLETED_ABSENT';
      const untaught = l.status === 'SCHEDULED' || l.status === 'PENDING_SUBSTITUTE';
      const opts = [
        {
          kind: 'present', icon: 'check-circle-2', label: '正常出勤',
          summary: 'TS 正常结课，教师课酬进入周结；不扣请假配额。',
          audit: '经核实本节正常出勤'
        },
        {
          kind: 'studentAbsent', icon: 'user-x', label: '学员旷课',
          summary: 'TS 结课扣减，记录学员旷课；教师课酬正常；不扣请假配额。',
          audit: '经核实学员旷课，按结课扣减'
        },
        {
          kind: 'teacherAbsent', icon: 'presentation', label: '外教旷课',
          summary: isAdmin
            ? '教师课酬剔除；TS 退回待排期并补生 1 节；通知家长；不扣配额。'
            : '教师课酬剔除；TS 退回待排期；通知家长；不扣配额。',
          audit: '经核实外教旷课，剔除教师课酬'
        },
        {
          kind: 'cancel', icon: 'calendar-x', label: '撤排退回待排期',
          summary: '仅未上课可执行；TS 退回待排期、释放网格、教师课酬 0。',
          audit: '未上课撤排，TS 退回待排期',
          disabled: completed, disabledReason: '已结课课次不可撤排'
        },
        {
          kind: 'reschedule', icon: 'refresh-cw', label: '同师挪位',
          summary: '打开现有同师 Picker；成功后 reschedule_count=1，免扣配额。',
          audit: '同师挪位（免扣配额）',
          disabled: rescheduleDisabled, disabledReason: rescheduleReason, opensPicker: true
        }
      ];
      if (isAdmin) {
        opts.push({
          kind: 'retro', icon: 'undo-2', label: '异常未上课回退补生',
          summary: '取消结课并补 1 节待排期；教师课酬剔除；写入审计。',
          audit: '系统已结课但实际未上课，取消结课并补生 1 节',
          disabled: !completed, disabledReason: '仅已结课课次可回退补生'
        });
        if (!isFixed) {
          opts.push({
            kind: 'specialLeave', icon: 'file-pen-line', label: '特批请假（仅临时课）',
            summary: '豁免 <3h 与配额限制；必填 ≥10 字原因；补偿课酬默认不补偿。',
            audit: '管理员特批请假（豁免 <3h 与配额限制）',
            disabled: !untaught, disabledReason: '仅未上课的临时课可特批请假'
          });
        }
      }
      return opts;
    }

    function openException(lessonId) {
      if (!['monitor', 'admin'].includes(state.role)) return showToast('异常处理仅班长与管理员可用', true);
      if (!guardWrite()) return;
      const l = lessonById(lessonId);
      if (!l) return showToast('未找到该课次', true);
      if (!exceptionEligible(l)) return showToast('该课次当前不可异常处理', true);
      state.activeLessonId = lessonId;
      state.exception = { selected: null, reason: '', compensate: false, error: '' };
      state.overlay = { type: 'exception' };
      renderAll();
    }

    function renderExceptionSheet() {
      const l = activeLesson();
      const ex = state.exception;
      if (!l || !ex) return '';
      const student = studentByKey(l.studentKey);
      const tm = typeMeta(l.type);
      const sm = lessonStatusMeta(l);
      const q = quotaOf(l.studentKey);
      const left = q.max - q.used;
      const opts = exceptionOptions(l);
      const sel = opts.find((o) => o.kind === ex.selected) || null;
      const isSpecial = ex.selected === 'specialLeave';
      const reason = ex.reason.trim();
      const confirmDisabled = !sel || sel.disabled || (isSpecial && reason.length < 10) || state.online === 'off';

      const optionCard = (o) => {
        const on = ex.selected === o.kind;
        const disabled = !!o.disabled;
        return `<button data-action="exception-select" data-kind="${o.kind}" ${disabled ? 'disabled' : ''} class="block w-full rounded-xl border px-3 py-2.5 text-left transition ${on ? 'border-indigo-400 bg-indigo-50' : disabled ? 'border-slate-200 bg-slate-50' : 'border-slate-200 bg-white hover:border-indigo-300'} ${disabled ? 'cursor-not-allowed' : ''}">
          <div class="flex items-start justify-between gap-2">
            <div class="flex min-w-0 items-start gap-2">
              <span class="mt-0.5 grid h-7 w-7 shrink-0 place-items-center rounded-lg ${on ? 'bg-indigo-600 text-white' : disabled ? 'bg-slate-100 text-slate-300' : 'bg-slate-100 text-slate-500'}">${icon(o.icon, 'h-4 w-4')}</span>
              <span class="min-w-0">
                <span class="block text-[14px] font-bold ${disabled ? 'text-slate-500' : on ? 'text-indigo-950' : 'text-slate-900'}">${o.label}</span>
                <span class="mt-0.5 block text-[12px] font-medium leading-relaxed ${disabled ? 'text-slate-500' : 'text-slate-500'}">${o.summary}</span>
                ${disabled ? `<span class="mt-1 block text-[12px] font-semibold text-rose-600">${o.disabledReason}</span>` : ''}
              </span>
            </div>
            <span class="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 bg-white text-transparent'}">${icon('check', 'h-3 w-3')}</span>
          </div>
        </button>`;
      };

      return sheetShell(`
        ${modalHeader('异常处理', `${student.name} · ${fmtDate(l.date)} ${l.time} - ${endTime(l.time)}`)}
        <div class="mt-2 rounded-lg border border-slate-200/80 bg-slate-50/70 px-3 py-1.5 text-[12px] font-medium text-slate-600">入口：M3A 课表课格抽屉 · 本页仅演示班长 / 管理员异常处置</div>
        <div class="mt-2.5 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-[12px]">
          <div class="flex justify-between gap-3 py-0.5"><span class="shrink-0 text-slate-500">学员</span><span class="font-semibold text-slate-800">${esc(student.name)}</span></div>
          <div class="flex justify-between gap-3 py-0.5"><span class="shrink-0 text-slate-500">上课时间</span><span class="font-mono font-bold text-slate-800">${fmtDate(l.date)} ${l.time} - ${endTime(l.time)}</span></div>
          <div class="flex justify-between gap-3 py-0.5"><span class="shrink-0 text-slate-500">任课外教</span><span class="font-semibold text-slate-800">${TEACHER_NAME}</span></div>
          <div class="flex justify-between gap-3 py-0.5"><span class="shrink-0 text-slate-500">课程类型</span><span class="font-semibold text-slate-800">${tm.label}</span></div>
          <div class="flex justify-between gap-3 py-0.5"><span class="shrink-0 text-slate-500">当前状态</span><span class="font-semibold text-slate-800">${sm.label}</span></div>
          <div class="flex justify-between gap-3 py-0.5"><span class="shrink-0 text-slate-500">请假配额</span><span class="font-mono font-bold ${left > 0 ? 'text-emerald-700' : 'text-rose-700'}">已用 ${q.used} / 上限 ${q.max} · 剩余 ${left} 次</span></div>
          <div class="flex justify-between gap-3 py-0.5"><span class="shrink-0 text-slate-500">资金持有人</span><span class="font-semibold text-emerald-700">班长 Leo（处置不变）</span></div>
        </div>

        ${l.type === 'fixed' ? `<div class="mt-2 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-amber-900">固定位为 4 周契约：不提供请假，也不提供特批请假，不支持批量跨周请假；异常只能按出勤、旷课、撤排、同师挪位处置${state.role === 'admin' ? '，管理员可异常回退补生' : ''}。固定位常规调整请走同师挪位或代办转让。</div>` : ''}

        <div class="mt-3 flex items-center justify-between gap-2">
          <span class="text-[14px] font-bold text-slate-800">选择处置方式</span>
          <span class="shrink-0 rounded-full border border-indigo-200 bg-indigo-50 px-2 py-0.5 text-[12px] font-bold text-indigo-700">${state.role === 'admin' ? '管理员权限' : '班长权限'}</span>
        </div>
        <div class="mt-2 space-y-2">${opts.map(optionCard).join('')}</div>

        ${isSpecial ? `<div class="mt-2 rounded-xl border border-rose-200 bg-rose-50/70 p-3">
          <label for="exceptionReason" class="mb-1 block text-[14px] font-semibold text-rose-950">特批原因 <span class="text-rose-500">*</span></label>
          <textarea id="exceptionReason" maxlength="200" rows="3" class="h-20 w-full resize-none rounded-xl border border-rose-200 bg-white p-2.5 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-rose-400" placeholder="请填写 ≥10 字特批原因，例如学员突发急病就医……">${esc(ex.reason)}</textarea>
          <div class="mt-1 flex items-center justify-between gap-2">
            <span id="exceptionReasonHint" class="text-[12px] font-medium ${reason.length < 10 ? 'text-rose-600' : 'text-emerald-700'}">${reason.length < 10 ? '原因需 ≥10 字' : '原因长度符合要求'}</span>
            <span id="exceptionReasonCount" class="font-mono text-[12px] font-medium text-slate-500">${ex.reason.length}/200</span>
          </div>
          <label class="mt-2 flex cursor-pointer items-start gap-2.5 rounded-xl border border-rose-200 bg-white px-3 py-2">
            <input id="exceptionCompensate" type="checkbox" ${ex.compensate ? 'checked' : ''} class="mt-0.5 h-4 w-4 rounded border-rose-300 accent-rose-600">
            <span class="text-[12px] font-medium leading-relaxed text-rose-900">给老师补偿课酬（平台贴补）<span class="mt-0.5 block text-rose-700">默认不补偿；仅突发不可抗力且需挽回客诉时勾选</span></span>
          </label>
        </div>` : ''}

        ${ex.error ? `<div class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-[12px] font-medium text-rose-700">${esc(ex.error)}</div>` : ''}

        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-500">确认后更新课次状态并写入审计（操作人、课次、处置、原因、补偿标记）；家长只读摘要与动态流同步可见；本入口不生成 M2B 退款单。</div>

        <div class="mt-3 flex gap-2">

        </div>`);

    function selectExceptionOption(kind) {
      if (!state.exception) return;
      const l = activeLesson();
      const opt = exceptionOptions(l).find((o) => o.kind === kind);
      if (!opt || opt.disabled) return showToast(opt && opt.disabledReason ? opt.disabledReason : '该处置当前不可用', true);
      state.exception.selected = kind;
      state.exception.error = '';
      renderOverlay();
    }

    function addExceptionRecord(l, kind, label, reason, extra = {}) {
      state.records.unshift({
        id: `rcd_ex_${Date.now()}`,
        studentKey: l.studentKey,
        kind: 'exception',
        exceptionKind: kind,
        date: l.date,
        time: l.time,
        type: l.type,
        teacher: TEACHER_NAME,
        sub: l.sub || null,
        status: l.status,
        statusLabel: label,
        rescheduleCount: l.rescheduleCount,
        quotaUsed: 0,
        orderLabel: kind === 'specialLeave' ? '管理员特批' : '异常处置',
        reason,
        auditAt: '2026-11-10 14:50',
        teacherPayExcluded: !!extra.teacherPayExcluded,
        compensate: !!extra.compensate
      });
    }

    function appendExceptionAudit(l, label, reason, compensate) {
      state.adminAudit.unshift({
        at: '刚刚',
        by: state.role === 'admin' ? 'Sarah' : 'Leo',
        student: studentByKey(l.studentKey).name,
        lessonId: l.id,
        when: `${fmtDate(l.date)} ${l.time}`,
        channel: 'exception',
        channelLabel: `异常处理 · ${label}`,
        reason,
        compensate: !!compensate,
        detail: `${l.type === 'fixed' ? '固定位' : '临时课'} · 请假配额扣减 0 次 · 不生成退款单`
      });
    }

    function confirmException() {
      if (!['monitor', 'admin'].includes(state.role)) return showToast('异常处理仅班长与管理员可用', true);
      if (!guardWrite()) return;
      const l = activeLesson();
      const ex = state.exception;
      if (!l || !ex) return;
      const opt = exceptionOptions(l).find((o) => o.kind === ex.selected);
      if (!opt) return showToast('请选择一种处置方式', true);
      if (opt.disabled) return showToast(opt.disabledReason || '该处置当前不可用', true);
      if (ex.selected === 'reschedule') {
        state.overlay = null;
        state.exception = null;
        renderAll();
        openPicker(l.id);
        return;
      }

      let reason = opt.audit;
      let compensate = false;
      if (ex.selected === 'specialLeave') {
        reason = ex.reason.trim();
        if (reason.length < 10) { ex.error = '特批请假原因必须 ≥10 字'; renderOverlay(); return; }
        if (reason.length > 200) { ex.error = '特批请假原因不能超过 200 字'; renderOverlay(); return; }
        compensate = !!ex.compensate;
      }

      const isAdmin = state.role === 'admin';
      let teacherPayExcluded = false;
      let toast = '';
      if (ex.selected === 'present') {
        l.status = 'COMPLETED';
        l.attendance = 'PRESENT';
        l.teacherPay = true;
        toast = '已标记正常出勤 · TS 正常结课，教师课酬进入周结 · 审计已留痕';
      } else if (ex.selected === 'studentAbsent') {
        l.status = 'COMPLETED_ABSENT';
        l.attendance = 'STUDENT_ABSENT';
        l.teacherPay = true;
        toast = '已记录学员旷课 · TS 结课扣减，教师课酬正常 · 未扣请假配额';
      } else if (ex.selected === 'teacherAbsent') {
        l.status = 'PENDING_REBOOK';
        l.quotaExempt = true;
        l.teacherPay = false;
        l.makeUp = isAdmin ? 1 : 0;
        teacherPayExcluded = true;
        toast = isAdmin
          ? '已记录外教旷课 · 教师课酬剔除 · TS 退回待排期并补生 1 节 · 已通知家长'
          : '已记录外教旷课 · 教师课酬剔除 · TS 已退回待排期 · 已通知家长';
      } else if (ex.selected === 'cancel') {
        l.status = 'PENDING_REBOOK';
        l.quotaExempt = true;
        l.teacherPay = false;
        teacherPayExcluded = true;
        toast = '撤排完成 · TS 退回待排期，网格已释放，教师课酬 0';
      } else if (ex.selected === 'retro') {
        l.status = 'PENDING_REBOOK';
        l.quotaExempt = true;
        l.teacherPay = false;
        l.makeUp = 1;
        teacherPayExcluded = true;
        toast = '异常回退补生完成 · 已取消结课并补 1 节待排期，教师课酬剔除';
      } else if (ex.selected === 'specialLeave') {
        l.status = 'PENDING_REBOOK';
        l.quotaExempt = true;
        l.teacherCompensated = compensate;
        l.teacherPay = compensate;
        toast = `管理员特批请假完成 · 豁免 <3h/配额限制${compensate ? ' · 平台补偿教师课酬' : ' · 不补偿课酬'} · 审计已留痕`;
      }
      l.exceptionKind = ex.selected;
      addExceptionRecord(l, ex.selected, opt.label, reason, { teacherPayExcluded, compensate });
      appendExceptionAudit(l, opt.label, reason, compensate);
      state.overlay = null;
      state.exception = null;
      renderAll();
      showToast(toast);
    }

    function openExceptionScenario(role) {
      if (!['monitor', 'admin'].includes(role)) return;
      setRole(role);
      const pool = lessonsOf(state.child).filter(exceptionEligible);
      const target = role === 'admin'
        ? (pool.find((l) => l.type === 'temp' && l.status === 'SCHEDULED')
          || pool.find((l) => l.status === 'COMPLETED' || l.status === 'COMPLETED_ABSENT')
          || pool[0])
        : (pool.find((l) => l.status === 'SCHEDULED') || pool[0]);
      if (!target) return showToast('暂无可异常处置的课次', true);
      state.child = target.studentKey;
      openException(target.id);
    }

    function applyUrlScenario() {
      if (params.get('panel') !== 'exception') return;
      if (!['monitor', 'admin'].includes(state.role)) return;
      const studentParam = params.get('studentId');
      if (studentParam) {
        const found = STUDENTS.find((s) => s.key === studentParam || s.name === studentParam || `stu_${s.key}` === studentParam);
        if (found) state.child = found.key;
      }
      const lessonParam = params.get('lessonId');
      let target = lessonParam ? lessonById(lessonParam) : null;
      if (target && !exceptionEligible(target)) target = null;
      if (!target) target = lessonsOf(state.child).find(exceptionEligible) || state.lessons.find(exceptionEligible);
      if (!target) {
        renderAll();
        showToast('暂无可异常处置的课次', true);
        return;
      }
      state.child = target.studentKey;
      openException(target.id);
    }

    function renderOverlay() {
      const el = document.getElementById('overlay');
      const prevScrollEl = el.querySelector('#pickerScroll');
      const prevScroll = prevScrollEl ? prevScrollEl.scrollTop : 0;

      if (!state.overlay) el.innerHTML = '';
      else if (state.overlay.type === 'myOps') el.innerHTML = renderMyOpsDrawer();
      else if (state.overlay.type === 'record') el.innerHTML = renderRecordModal();
      else if (state.overlay.type === 'picker') el.innerHTML = renderPicker();
      else if (state.overlay.type === 'teacherLeave') el.innerHTML = renderTeacherLeaveModal();
      else if (state.overlay.type === 'dispatch') el.innerHTML = renderDispatchModal();
      else if (state.overlay.type === 'memo') el.innerHTML = renderMemoSheet();
      else if (state.overlay.type === 'classCancel') el.innerHTML = renderClassCancelModal();
      else if (state.overlay.type === 'batchLeave') el.innerHTML = renderBatchLeaveModal();
      else if (state.overlay.type === 'adminLeave') el.innerHTML = renderAdminLeaveModal();
      else if (state.overlay.type === 'proxy') el.innerHTML = renderProxyDrawer();
      else if (state.overlay.type === 'proxyLeave') el.innerHTML = renderProxyLeaveModal();
      else if (state.overlay.type === 'exception') el.innerHTML = renderExceptionSheet();
      else if (state.overlay.type === 'classSub') el.innerHTML = renderClassSubModal();
      else el.innerHTML = '';

      const nextScrollEl = el.querySelector('#pickerScroll');
      if (nextScrollEl) {
        if (state.picker && state.picker.resetScroll) {
          state.picker.resetScroll = false;
          requestAnimationFrame(scrollPickerToDefault);
        } else {
          nextScrollEl.scrollTop = prevScroll;
        }
      }
      if (window.lucide) lucide.createIcons();
      if (state.overlay && state.overlay.type === 'batchLeave' && state.batch && state.batch.scrollToSelected) {
        state.batch.scrollToSelected = false;
        requestAnimationFrame(() => {
          const box = document.getElementById('batchSlotsScroll');
          const sel = box ? box.querySelector('[data-action="batch-slot"].border-indigo-300') : null;
          if (box && sel) {
            box.scrollTop = Math.max(0, sel.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - 36);
          }
        });
      }
    }

    /* ------------------------------------------------------------------
     * 同师挪位 Picker：固定位本轮 4 周 / 临时课前后 7 天
     * ------------------------------------------------------------------ */
    function buildPickerWeeks(l) {
      if (l.type === 'fixed') {
        return [0, 1, 2, 3].map((i) => makePickerWeek(isoAdd(FIXED_ROUND_START, i * 7), l, true));
      }
      const base = mondayOf(l.date);
      return [-1, 0, 1].map((i) => makePickerWeek(isoAdd(base, i * 7), l, false));
    }

    function makePickerWeek(monday, l, fixed) {
      const days = Array.from({ length: 7 }, (_, i) => {
        const iso = isoAdd(monday, i);
        const diff = diffDays(iso, l.date);
        return {
          iso,
          label: iso.slice(5),
          week: DAY_LABELS[i],
          inWindow: fixed ? true : (diff >= -7 && diff <= 7),
          past: diffDays(iso, TODAY) < 0,
          isOriginDay: iso === l.date
        };
      });
      return { monday, days, range: `${monday.slice(5)} ~ ${isoAdd(monday, 6).slice(5)}` };
    }

    function openPicker(lessonId) {
      if (!guardWrite()) return;
      const l = lessonById(lessonId);
      if (!l || l.status !== 'SCHEDULED') return showToast('该课次当前不可挪位', true);
      if (state.hours < 3) return showToast('距上课不足 3 小时，已进入授课准备锁定期，无法挪位', true);
      if (l.rescheduleCount >= 1) return showToast('本节课已挪位过 1 次，不可二次挪位', true);
      const weeks = buildPickerWeeks(l);
      const originIndex = weeks.findIndex((w) => w.days.some((d) => d.iso === l.date));
      state.activeLessonId = lessonId;
      state.picker = { mode: l.type, weeks, weekIndex: originIndex >= 0 ? originIndex : 0, selected: null, resetScroll: true };
      state.overlay = { type: 'picker' };
      renderAll();
    }

      const l = activeLesson();
      const p = state.picker;
      if (!l || !p) return '';
      const isFixed = l.type === 'fixed';
      const week = p.weeks[p.weekIndex];
      const selected = p.selected;
      const newText = selected
        ? `${fmtDate(selected.iso)} ${selected.time} - ${endTime(selected.time)}`
        : '请点选绿色可挪格';

      return `
        <div class="absolute inset-x-0 bottom-0 top-16 z-50 flex flex-col bg-white">
          <div class="flex shrink-0 items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 py-2.5">
            <div class="flex min-w-0 items-center gap-2.5">
              <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-indigo-600 text-white">${icon('calendar-range', 'h-4 w-4')}</div>

                <p class="truncate text-[12px] font-medium text-slate-500">${isFixed ? '本轮 4 周购课周期内 · 仅同师空闲格 · 免扣配额' : '原课次前后 7 天内 · 仅同师空闲格 · 免扣配额'}</p>
              </div>
            </div>
            <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>

          <div class="flex shrink-0 gap-1 overflow-x-auto border-b border-slate-200 bg-slate-50 px-2 py-1.5">
            ${p.weeks.map((w, i) => {
              const on = i === p.weekIndex;
              const hasOrigin = w.days.some((d) => d.iso === l.date);
              return `<button data-action="picker-week" data-index="${i}" class="relative flex min-w-[74px] flex-1 flex-col items-center rounded-lg px-1 py-1 ${on ? 'bg-white text-indigo-700 ring-1 ring-indigo-200' : 'text-slate-500'}">
                <span class="text-[12px] font-bold">${isFixed ? `第${i + 1}周` : w.range.split(' ~ ')[0]}</span>

                ${hasOrigin ? '<span class="absolute right-1 top-1 h-1.5 w-1.5 rounded-full bg-amber-500"></span>' : ''}
              </button>`;
            }).join('')}
          </div>

          <div class="flex shrink-0 flex-wrap items-center gap-x-2 gap-y-1 border-b border-slate-100 bg-white px-3 py-1.5 text-[12px] font-medium text-slate-600">
            <span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-sm border border-dashed border-amber-500 bg-amber-50"></span>[原]课次</span>
            <span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded bg-emerald-500"></span>可挪</span>
            <span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded bg-indigo-600"></span>拟选</span>
            <span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded bg-slate-300"></span>已占</span>
            <span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded bg-slate-100 border border-slate-200"></span>超窗/已过</span>
            <span class="ml-auto shrink-0 rounded border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${isFixed ? '本轮 4 周' : '±7 天'}</span>
          </div>

          <div id="pickerScroll" class="min-h-0 flex-1 overflow-auto bg-white">
            <table class="w-full table-fixed border-collapse">
              <thead>
                <tr>
                  <th class="sticky left-0 top-0 z-40 w-[40px] border-b border-r border-slate-200 bg-slate-100 px-0 py-1 text-center text-[12px] font-bold text-slate-500">时段</th>
                  ${week.days.map((d) => `<th class="sticky top-0 z-30 border-b border-r border-slate-200 ${d.iso === TODAY ? 'bg-amber-100 text-amber-900' : d.isOriginDay ? 'bg-amber-50 text-amber-900' : 'bg-slate-50 text-slate-600'} px-0.5 py-1 text-center">

                  </th>`).join('')}
                </tr>

              <tbody>
                ${TIME_SLOTS.map((time) => `
                  <tr class="h-8">
                    <th data-time="${time}" class="sticky left-0 z-20 w-[40px] border-b border-r border-slate-200 bg-slate-100 px-0 text-center align-middle text-[12px] font-mono font-semibold text-slate-500">${time}</th>
                    ${week.days.map((d) => pickerCellHtml(d, time)).join('')}
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>

          <div class="shrink-0 border-t border-slate-200 bg-white px-3 py-2">
            <div class="flex items-center justify-between gap-2 text-[12px]">
              <div class="min-w-0">

                <div class="mt-0.5 truncate font-bold text-indigo-700">新时段：<span class="font-mono">${newText}</span></div>
              </div>
              <span class="shrink-0 rounded border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">免扣请假配额</span>
            </div>
            <div class="mt-2 flex gap-2">
              <button data-action="close-overlay" class="h-10 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">取消</button>
              <button data-action="confirm-picker" ${!selected || state.online === 'off' ? 'disabled' : ''} class="h-10 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认平移此排期（免扣配额）</button>
            </div>
          </div>
        </div>`;
    }

    function pickerCellHtml(day, time) {
      const base = 'flex h-7 w-full items-center justify-center overflow-hidden rounded-md border text-[12px] font-bold leading-none transition active:scale-95';
      if (!day.inWindow) return `<td class="border-b border-r border-slate-100 p-[2px]"><div class="${base} border-slate-100 bg-slate-50 text-slate-300">超窗</div></td>`;
      if (day.past) return `<td class="border-b border-r border-slate-100 p-[2px]"><div class="${base} border-slate-100 bg-slate-50 text-slate-300">已过</div></td>`;
      const s = slotState(day.iso, time);
      if (s === 'ORIGIN') return `<td class="border-b border-r border-slate-100 p-[2px]"><div class="${base} border-dashed border-amber-400 bg-amber-50 text-amber-900">[原]</div></td>`;
      if (s === 'OCCUPIED') return `<td class="border-b border-r border-slate-100 p-[2px]"><div class="${base} border-slate-200 bg-slate-100 text-slate-500">已占</div></td>`;
      if (s === 'GREEN') {
        const selected = state.picker.selected && state.picker.selected.iso === day.iso && state.picker.selected.time === time;
        return `<td class="border-b border-r border-slate-100 p-[2px]"><button data-action="picker-slot" data-day="${day.iso}" data-time="${time}" class="${base} ${selected ? 'border-indigo-500 bg-indigo-600 text-white ring-2 ring-indigo-300' : 'border-emerald-200 bg-emerald-50 text-emerald-700'}">${selected ? '拟选' : '可挪'}</button></td>`;
      }
      return `<td class="border-b border-r border-slate-100 p-[2px]"><div class="${base} border-slate-100 bg-white text-slate-200">·</div></td>`;
    }

    function scrollPickerToDefault() {
      const el = document.getElementById('pickerScroll');
      if (!el) return;
      const anchor = el.querySelector('th[data-time="14:00"]');
      if (!anchor) return;
      const head = el.querySelector('thead');
      const delta = anchor.getBoundingClientRect().top - el.getBoundingClientRect().top + el.scrollTop;
      el.scrollTop = Math.max(0, delta - (head ? head.getBoundingClientRect().height : 40));
    }

    function selectPickerSlot(dayISO, time) {
      if (!guardWrite()) return;
      state.picker.selected = { iso: dayISO, time };

    }

      if (!state.picker) return;
      const idx = Number(index);
      if (idx < 0 || idx >= state.picker.weeks.length) return;
      state.picker.weekIndex = idx;
      state.picker.selected = null;
      renderOverlay();

      if (!guardWrite()) return;

      const p = state.picker;

      if (l.rescheduleCount >= 1) return showToast('本节课已挪位过 1 次，不可二次挪位', true);
      l.date = p.selected.iso;

          <div class="flex justify-between py-0.5"><span class="text-slate-500">原主讲</span><span class="font-semibold text-slate-800">${TEACHER_NAME}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">教室</span><span class="font-semibold text-slate-800">${ROOM_LABEL}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">距上课</span><span class="font-mono font-bold ${state.hours < 3 ? 'text-rose-700' : 'text-emerald-700'}">${state.hours}h</span></div>
        </div>
        <div class="mt-2 rounded-xl border border-indigo-200 bg-indigo-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-indigo-900">
          候选须为全平台在职外教，技能匹配本班 KET 课程，且连续 2 个半小时格空闲；代课课酬按班级快照平移，资金持有人、班级盈余与平台分成比例均不变。
        </div>
        ${!canSub ? '<div class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-[12px] font-bold text-rose-700">距上课不足 3 小时，禁止指派代课，请改为暂停待排。</div>' : ''}
        <div class="mt-3 space-y-1.5">
          ${CLASS_SUB_CANDIDATES.map((c) => {
            const on = d.teacher === c.name;
            const disabled = !c.twoCells;
            return `<button data-action="class-sub-select" data-name="${esc(c.name)}" ${disabled ? 'disabled' : ''} class="flex w-full items-center justify-between gap-2 rounded-xl border px-3 py-2.5 text-left transition ${on ? 'border-purple-400 bg-purple-50' : 'border-slate-200 bg-white'} ${disabled ? 'cursor-not-allowed opacity-50' : 'hover:border-purple-300'}">
              <span class="min-w-0">
                <span class="block text-[14px] font-bold ${on ? 'text-purple-900' : 'text-slate-900'}">${esc(c.name)} <span class="ml-1 rounded bg-slate-100 px-1 text-[12px] font-semibold text-slate-500">${esc(c.level)}</span></span>
                <span class="mt-0.5 block text-[12px] font-medium text-slate-500">${esc(c.skills)} · 绑定班长 ${esc(c.boundMonitor)}</span>
                <span class="mt-0.5 block text-[12px] font-semibold ${c.twoCells ? 'text-emerald-700' : 'text-rose-600'}">${esc(c.note)}</span>
              </span>
              <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-purple-500 bg-purple-600 text-white' : 'border-slate-300 bg-white text-transparent'}">${icon('check', 'h-3 w-3')}</span>
            </button>`;
          }).join('')}
        </div>
        <label for="classSubAck" class="mt-3 flex cursor-pointer items-start gap-2 rounded-xl border ${d.ack ? 'border-purple-300 bg-purple-50' : 'border-slate-200 bg-slate-50'} px-3 py-2.5">
          <input id="classSubAck" type="checkbox" ${d.ack ? 'checked' : ''} class="mt-0.5 h-4 w-4 shrink-0 accent-purple-600">
          <span class="text-[12px] font-semibold leading-relaxed text-slate-800">已知悉需线下通知家长并发布代课/ClassIn 变更<span class="text-rose-500"> *</span></span>
        </label>
        <div class="mt-4 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800">取消</button>
          <button data-action="confirm-class-sub" ${!d.teacher || !d.ack || !canSub || state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-purple-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认指派双格代课</button>
        </div>`);
    }

    function selectClassSub(name) {
      if (!state.classSubDraft) state.classSubDraft = { teacher: null, ack: false };
      const c = CLASS_SUB_CANDIDATES.find((x) => x.name === name);
      if (!c || !c.twoCells) return showToast('该外教无法连续 2 格空闲，不满足小班代课条件', true);
      state.classSubDraft.teacher = state.classSubDraft.teacher === name ? null : name;
      renderOverlay();
    }

    function confirmClassSub() {
      if (!guardWrite()) return;
      if (state.hours < 3) return showToast('距上课不足 3 小时，禁止指派代课', true);
      const d = state.classSubDraft;
      if (!d || !d.teacher) return showToast('请选择一位连续双格空闲的外教', true);
      if (!d.ack) return showToast('请先勾选线下通知家长并发布变更确认', true);
      const c = CLASS_SUB_CANDIDATES.find((x) => x.name === d.teacher);
      state.classSub = { teacher: d.teacher, boundMonitor: c ? c.boundMonitor : '' };
      state.classCancelled = false;
      state.overlay = null;
      state.classSubDraft = null;
      renderAll();
      showToast('小班双格代课已指派 · 已同步通知原主讲、代课外教与绑定班长');
    }

    function revokeClassSub() {
      if (!guardWrite()) return;
      if (state.hours < 24) return showToast('距上课不足 24 小时，代课已锁定，不可撤销', true);
      if (!state.classSub) return;
      state.classSub = null;
      renderAll();
      showToast('小班代课已撤销，已恢复原主讲并同步通知三方');
    }

    /* ------------------------------------------------------------------
     * 教师空闲时段请假 / 销假
     * ------------------------------------------------------------------ */
    function toggleFree(slotId) {
      if (!guardWrite()) return;
      const f = state.freeSlots.find((x) => x.id === slotId);
      if (!f) return;
      f.state = f.state === 'leave' ? 'free' : 'leave';
      renderAll();
      showToast(f.state === 'leave' ? '已标记请假，该时段不开放且不占配额' : '已销假，该时段恢复 🟢 空闲可约');
    }

    function guardWrite() {
      if (state.online === 'off') {
        showToast('离线只读，暂不可执行该操作', true);
        return false;
      }
      return true;
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.className = `pointer-events-none absolute bottom-24 left-1/2 z-[100] w-max max-w-[calc(100%-32px)] -translate-x-1/2 rounded-xl px-4 py-2 text-center text-[12px] font-semibold leading-relaxed text-white shadow-xl ${isError ? 'bg-rose-600/95' : 'bg-slate-900/90'}`;
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.add('hidden'), 2800);
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'close-overlay') { state.overlay = null; state.picker = null; state.batch = null; state.exception = null; renderOverlay(); return; }
      if (action === 'set-child') { state.child = el.dataset.key; renderAll(); return; }
      if (action === 'open-my-ops') { state.overlay = { type: 'myOps' }; renderAll(); return; }
      if (action === 'open-record') return openRecord(el.dataset.id);
      if (action === 'open-teacher-leave') return openTeacherLeave(el.dataset.id);
      if (action === 'confirm-teacher-leave') return confirmTeacherLeave();
      if (action === 'open-batch-leave') return openBatchLeave(el.dataset.day, el.dataset.time);
      if (action === 'batch-day') return changeBatchDay(el.dataset.day);
      if (action === 'batch-slot') return toggleBatchSlot(el.dataset.id);
      if (action === 'batch-select-max') return selectBatchMax();
      if (action === 'batch-clear') return clearBatchSelection();
      if (action === 'confirm-batch-leave') return confirmBatchLeave();
      if (action === 'open-admin-leave') return openAdminLeave(el.dataset.id);
      if (action === 'admin-channel') return setAdminChannel(el.dataset.channel);
      if (action === 'confirm-admin-leave') return confirmAdminLeave();
      if (action === 'emergency-assign-all') return emergencyAssignAll();
      if (action === 'emergency-auto-relief') return emergencyAutoRelief();
      if (action === 'emergency-safety') return emergencySafetyFallback();
      if (action === 'emergency-assign') return emergencyAssign(el.dataset.id);
      if (action === 'emergency-return') return emergencyReturn(el.dataset.id);
      if (action === 'emergency-reschedule') return emergencyReschedule(el.dataset.id);
      if (action === 'emergency-rollback') return emergencyRollback();
      if (action === 'open-dispatch') return openDispatch(el.dataset.id);
      if (action === 'assign-sub') return assignSub(el.dataset.name);
      if (action === 'toggle-fallback') return toggleFallback();
      if (action === 'confirm-fallback') return confirmFallback();
      if (action === 'revoke-sub') return revokeSub(el.dataset.id);
      if (action === 'open-memo') return openMemo(el.dataset.id);
      if (action === 'save-memo') return saveMemo();
      if (action === 'class-pause-release') { state.classPauseRelease = el.dataset.value; renderOverlay(); return; }
      if (action === 'open-class-cancel') return openClassCancel();
      if (action === 'confirm-class-cancel') return confirmClassCancel();
      if (action === 'open-class-sub') return openClassSub();
      if (action === 'class-sub-select') return selectClassSub(el.dataset.name);
      if (action === 'confirm-class-sub') return confirmClassSub();
      if (action === 'revoke-class-sub') return revokeClassSub();
      if (action === 'open-proxy') return openProxy(el.dataset.id);
      if (action === 'proxy-reschedule') return proxyReschedule();
      if (action === 'proxy-leave') return proxyLeave();
      if (action === 'confirm-proxy-leave') return confirmProxyLeave();
      if (action === 'open-exception') return openException(el.dataset.id);
      if (action === 'exception-select') return selectExceptionOption(el.dataset.kind);
      if (action === 'exception-confirm') return confirmException();
      if (action === 'toggle-free') return toggleFree(el.dataset.id);
      if (action === 'picker-week') return changePickerWeek(el.dataset.index);
      if (action === 'picker-slot') return selectPickerSlot(el.dataset.day, el.dataset.time);
      if (action === 'confirm-picker') return confirmPicker();
    });

    // 批量请假弹窗内的输入需在重渲染后保持
    document.getElementById('frame').addEventListener('input', (e) => {
      if (e.target && e.target.id === 'batchReason' && state.batch) state.batch.reason = e.target.value;
      if (e.target && e.target.id === 'adminLeaveReason' && state.adminLeave) {
        state.adminLeave.reason = e.target.value;
        state.adminLeave.error = '';
        const count = document.getElementById('adminReasonCount');
        if (count) count.textContent = `${e.target.value.length}/200`;
      }
      if (e.target && e.target.id === 'classCancelReason') state.classCancelReason = e.target.value;
      if (e.target && e.target.id === 'proxyLeaveReason') state.proxyLeaveReason = e.target.value;
      if (e.target && e.target.id === 'exceptionReason' && state.exception) {
        state.exception.reason = e.target.value;
        state.exception.error = '';
        const count = document.getElementById('exceptionReasonCount');
        if (count) count.textContent = `${e.target.value.length}/200`;
        const ok = e.target.value.trim().length >= 10;
        const hint = document.getElementById('exceptionReasonHint');
        if (hint) {
          hint.textContent = ok ? '原因长度符合要求' : '原因需 ≥10 字';
          hint.className = `text-[12px] font-medium ${ok ? 'text-emerald-700' : 'text-rose-600'}`;
        }
        const confirm = document.getElementById('frame').querySelector('[data-action="exception-confirm"]');
        if (confirm) confirm.disabled = !ok || state.online === 'off';
      }
    });
    document.getElementById('frame').addEventListener('change', (e) => {
      if (e.target && e.target.id === 'batchReasonType' && state.batch) state.batch.reasonType = e.target.value;
      if (e.target && e.target.id === 'adminCompensate' && state.adminLeave) state.adminLeave.compensate = e.target.checked;
      if (e.target && e.target.id === 'exceptionCompensate' && state.exception) state.exception.compensate = e.target.checked;
      if (e.target && e.target.id === 'classSubAck' && state.classSubDraft) { state.classSubDraft.ack = e.target.checked; renderOverlay(); }
      if (e.target && e.target.id === 'classCancelAck') { state.classCancelAck = e.target.checked; renderOverlay(); }
    });

    renderAll();
    applyUrlScenario();
  </script>
</body>
</html>

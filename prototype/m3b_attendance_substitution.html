        setRole('monitor', { silent: true, scenario: key });
        ensureGroupLesson();
        state.page = 'records';
        state.cellView = 'main';
        state.cellScope = { lessonId: 'lsn_class_cell', nextSelected: true };
        state.overlay = { type: 'cellSheet', lessonId: 'lsn_class_cell' };
      }
      renderAll({ resetScroll: true });
    }

    /* ------------------------------------------------------------------
     * 事件绑定
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') {
          setRole(value);
          return;
        }
        if (group === 'device') {
          state.device = value;
          renderAll();
          return;
        }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') {
            state.overlay = null;
            state.returnOverlay = null;
          }
          renderAll();
          showToast(value === 'off' ? '离线只读：请假 / 挪位 / 换人 / 代课不可用' : '已恢复在线，操作可用', value === 'off');
          return;
        }
        if (group === 'hours') {
          state.hours = Number(value);
          renderAll();
          showToast(state.hours < 3
            ? '已切换为临期场景：其余操作温和确认，代学员请假需双选'
            : '已切换为常规场景：操作直接生效');
        }
      });
    });

    document.getElementById('btnResetDemo').addEventListener('click', () => {
      resetState();
      renderAll({ resetScroll: true });
      showToast('演示数据已重置');
    });

    document.querySelectorAll('[data-scenario]').forEach((btn) => {
      btn.addEventListener('click', () => runScenario(btn.dataset.scenario));
    });

    document.getElementById('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.page);
      if (action === 'switch-role') return setRole(el.dataset.role);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'close-overlay') return closeOverlay();
      if (action === 'copy-room') {
        const room = el.dataset.room || '';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(room).catch(() => {});
        }
        return showToast(`教室号已复制：${room}`);
      }
      if (action === 'lesson-leave') return handleLessonLeave(el.dataset.id);
      if (action === 'lesson-reschedule') return openReschedule(el.dataset.id);
      if (action === 'select-target') return selectTarget(el.dataset.key);
      if (action === 'confirm-reschedule') return confirmReschedule();
      if (action === 'cancel-soft') return cancelSoft();
      if (action === 'confirm-soft') return confirmSoft();
      if (action === 'student-leave-lenient') return executeStudentLeaveChoice('lenient');
      if (action === 'student-leave-absent') return executeStudentLeaveChoice('absent');
      if (action === 'cancel-student-leave') return cancelStudentLeaveChoice();
      if (action === 'pick-student') return pickStudent(el.dataset.key);
      if (action === 'confirm-change') return confirmChangeStudent();
      if (action === 'overlay-back') return overlayBack();
      if (action === 'open-cell') return openCellSheet(el.dataset.id);
      if (action === 'cell-panel-main') {
        state.cellView = 'main';
        renderOverlay();
        return;
      }
      if (action === 'cell-panel-leave') {
        state.cellView = 'leaveReschedule';
        renderOverlay();
        return;
      }
      if (action === 'cell-panel-assign') {
        const lesson = lessonById(state.overlay.lessonId);
        if (!lesson) return;
        return openCellAssignPanel(lesson);
      }
      if (action === 'cell-panel-attendance') {
        state.cellView = 'attendance';
        renderOverlay();
        return;
      }
      if (action === 'cell-leave') {
        const ids = el.dataset.scope ? el.dataset.scope.split(',') : [el.dataset.id];
        return handleLessonLeave(el.dataset.id, ids);
      }
      if (action === 'cell-reschedule') {
        const ids = el.dataset.scope ? el.dataset.scope.split(',') : [el.dataset.id];
        return openReschedule(el.dataset.id, null, ids);
      }
      if (action === 'cell-change') {
        const lesson = lessonById(state.overlay.lessonId);
        if (!lesson) return;
        const ids = el.dataset.scope ? el.dataset.scope.split(',') : cellScopeIds(lesson);
        return openChangeStudent(lesson.id, ids);
      }
      if (action === 'cell-withdraw') {
        const lesson = lessonById(state.overlay.lessonId);
        if (!lesson) return;
        return withdrawLessons(lesson);
      }
      if (action === 'cell-compensate') {
        const lesson = lessonById(state.overlay.lessonId);
        if (!lesson) return;
        return compensateLesson(lesson);
      }
      if (action === 'cell-mark-student-absent') return markAttendance('student_absent');
      if (action === 'cell-mark-teacher-absent') return markAttendance('teacher_absent');
      if (action === 'cell-restore-normal') {
        const lesson = lessonById(state.overlay.lessonId);
        if (!lesson) return;
        return restoreNormalAttendance(lesson);
      }
      if (action === 'cell-revoke-sub') {
        const lesson = lessonById(state.overlay.lessonId);
        if (!lesson) return;
        return requestOrRun('revoke-sub', { lessonId: lesson.id, lessonIds: cellScopeIds(lesson) });
      }
      if (action === 'cell-group-pause') return openClassPause(el.dataset.id);
      if (action === 'cell-assign') return openAssignSub({ lessonId: el.dataset.id });
      if (action === 'pick-sub') return pickSub(el.dataset.name);
      if (action === 'confirm-assign-sub') return confirmAssignSub();
      if (action === 'pick-class-sub') return pickClassSub(el.dataset.name);
      if (action === 'confirm-class-sub') return confirmClassSub();
      if (action === 'confirm-class-pause') return confirmClassPause();
      if (action === 'records-range') {
        state.recordsRange = el.dataset.value;
        state.recordsLimit = 20;
        renderAll();
        return;
      }
      if (action === 'records-type') {
        state.recordsType = el.dataset.value;
        state.recordsLimit = 20;
        renderAll();
        return;
      }
      if (action === 'records-monitor') {
        state.recordsMonitor = el.dataset.value;
        state.recordsLimit = 20;
        renderAll();
        return;
      }
      if (action === 'records-toggle-monitors') {
        state.recordsExpanded = !state.recordsExpanded;
        renderAll();
        return;
      }
      if (action === 'records-more') {
        state.recordsLimit = Math.min(state.recordsLimit + 20, filteredRecords().length);
        renderAll();
        return;
      }
    });

    document.getElementById('frame').addEventListener('change', (event) => {
      const target = event.target;
      if (target.matches('[data-cell-scope]')) {
        state.cellScope.nextSelected = target.checked;
        renderOverlay();
      }
    });

    document.getElementById('frame').addEventListener('input', (event) => {
      if (event.target.id === 'studentSearch') {
        filterStudentRows(event.target);
        return;
      }
      if (event.target.id === 'teacherSearch') {
        if (state.assignSub) state.assignSub.query = event.target.value;
        if (state.classDraft) state.classDraft.query = event.target.value;
        const query = event.target.value.trim().toLowerCase();
        const rows = Array.from(document.querySelectorAll('[data-sub-row]'));
        rows.forEach((row) => row.classList.toggle('hidden', !row.dataset.subRow.toLowerCase().includes(query)));
        const empty = document.getElementById('teacherSearchEmpty');
        if (empty) empty.classList.toggle('hidden', rows.some((row) => !row.classList.contains('hidden')));
        return;
      }
      if (event.target.id === 'cellReason') {
        state.cellReason = event.target.value;
        updateCellReasonHint();
      }
    });

    /* ------------------------------------------------------------------
     * URL 参数与启动
     * ------------------------------------------------------------------ */
    function applyUrlScenario() {
      const params = new URLSearchParams(window.location.search);
      const roleParam = params.get('role');
      if (roleParam && ROLE_META[roleParam]) state.role = roleParam;
      const device = params.get('device');
      if (device === 'tablet' || device === 'mobile') state.device = device;
      const online = params.get('online');
      if (online === 'off' || online === 'on') state.online = online;
      const hours = params.get('hours');
      if (hours === '<3' || hours === 'lt3') state.hours = 2;
      else if (hours === '3~24' || hours === 'mid') state.hours = 6;
      else if (hours === '>=24' || hours === 'gte24') state.hours = 24;
      else if (hours) {
        const numericHours = Number(hours);
        if (Number.isFinite(numericHours) && numericHours > 0) state.hours = numericHours;
      }
      state.page = defaultPage(state.role);
      const pageParam = params.get('page');
      if (pageParam && navItems().some((item) => item.id === pageParam)) state.page = pageParam;
      const scenario = params.get('scenario');
      if (scenario) {
        runScenario(scenario);
        return;
      }
      renderAll({ resetScroll: true });
    }

    resetState();
    applyUrlScenario();
    window.__dreamDemoState = state;
  </script>
</body>
</html>

      admin: `<svg class="pointer-events-none absolute inset-0 h-full w-full" viewBox="0 0 390 80" preserveAspectRatio="xMidYMid slice" fill="none"><circle cx="325" cy="18" r="38" stroke="white" stroke-opacity=".08"/><circle cx="325" cy="18" r="24" stroke="white" stroke-opacity=".06"/><path d="M0 68 C60 40 120 82 190 52 S300 20 390 48" stroke="white" stroke-opacity=".07" stroke-width="16" stroke-linecap="round"/></svg>`
    };

    const BANNERS = {
      parent: { gradient: 'from-slate-800 via-blue-900 to-slate-700', initial: 'A', pattern: PATTERNS.parent },
      monitor: { gradient: 'from-slate-900 via-fuchsia-950 to-slate-800', initial: 'L', pattern: PATTERNS.monitor },
      teacher: { gradient: 'from-slate-800 via-emerald-900 to-slate-700', initial: 'D', pattern: PATTERNS.teacher },
      sub_teacher: { gradient: 'from-slate-800 via-emerald-900 to-slate-700', initial: 'E', pattern: PATTERNS.sub_teacher },
      admin: { gradient: 'from-slate-900 via-violet-950 to-slate-800', initial: 'S', pattern: PATTERNS.admin }
    };

    const ROLE_TITLES = {
      parent: '请假与考勤记录',
      monitor: '代课调度',
      teacher: '考勤与代课',
      sub_teacher: '考勤与代课',
      admin: '管理员代操作'
    };

    const OVERLAY_TITLES = {
      batchLeave: '批量请假',
      dispatch: '应急调度',
      classSub: '应急调度',
      classCancel: '应急调度',
      adminLeave: '管理员代操作',
      proxy: '学员代办',
      proxyLeave: '学员代办',
      exception: '异常处理',
      picker: '请假与挪位',
      myOps: '我的经办',
      record: '请假与考勤记录',
      teacherLeave: '考勤与代课',
      memo: '考勤与代课'
    };

    /* ------------------------------------------------------------------
     * 状态
     * ------------------------------------------------------------------ */
    const state = {
      role: 'parent',
      page: 'board', // board | placeholder
      navTab: 'schedule',
      device: 'mobile',
      online: 'on',
      hours: 32,
      child: 'alice',
      activeLessonId: null,
      activeRecordId: null,
      overlay: null,
      lessons: JSON.parse(JSON.stringify(INITIAL_LESSONS)),
      records: JSON.parse(JSON.stringify(INITIAL_RECORDS)),
      quota: JSON.parse(JSON.stringify(INITIAL_QUOTA)),
      freeSlots: JSON.parse(JSON.stringify(INITIAL_FREE)),
      classCancelled: false,
      classSub: null,
      classSubDraft: null,
      classCancelAck: false,
      classCancelReason: '公众假期暂停待排，后续统一补排',
      classPauseRelease: 'red',
      picker: null,
      batch: null,
      lastBatchLeave: null,
      teacherLeaveSlots: [],
      emergency: JSON.parse(JSON.stringify(INITIAL_EMERGENCY)),
      adminLeave: null,
      proxyLeaveReason: '',
      exception: null,
      adminAudit: []
    };

    const params = new URLSearchParams(location.search);
    if (params.get('role') && ['parent', 'teacher', 'sub_teacher', 'monitor', 'admin'].includes(params.get('role'))) {
      state.role = params.get('role');
    }
    if (params.get('child')) state.child = params.get('child');
    if (params.get('studentId')) {
      const sp = params.get('studentId');
      const found = STUDENTS.find((s) => s.key === sp || s.name === sp || `stu_${s.key}` === sp);
      if (found) state.child = found.key;
    }
    if (params.get('device') === 'tablet') state.device = 'tablet';

    /* ------------------------------------------------------------------
     * 工具
     * ------------------------------------------------------------------ */
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const lessonNo = (v) => `课次 #${String(v ?? '').replace(/\D/g, '').slice(-4) || '0000'}`;
    const clone = (v) => JSON.parse(JSON.stringify(v));

    function isoToTs(iso) { return Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10))); }
    function isoAdd(iso, days) { return new Date(isoToTs(iso) + days * 86400000).toISOString().slice(0, 10); }
    function diffDays(a, b) { return Math.round((isoToTs(a) - isoToTs(b)) / 86400000); }
    function weekdayLabel(iso) { return DAY_LABELS[(new Date(isoToTs(iso)).getUTCDay() + 6) % 7]; }
    function mondayOf(iso) { const idx = (new Date(isoToTs(iso)).getUTCDay() + 6) % 7; return isoAdd(iso, -idx); }
    function fmtDate(iso) { return `${iso.slice(5)} (${weekdayLabel(iso)})`; }
    function endTime(time, count = 1) {
      const [h, m] = time.split(':').map(Number);
      const total = h * 60 + m + count * 30;
      return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
    }

    function roleMeta() { return ROLE_META[state.role]; }
    function navItems() { return NAVS[state.role]; }
    function boardTab() { return (state.role === 'monitor' || state.role === 'admin') ? 'ops' : 'schedule'; }
    function studentByKey(key) { return STUDENTS.find((s) => s.key === key) || STUDENTS[0]; }
    function lessonById(id) { return state.lessons.find((l) => l.id === id) || null; }
    function activeLesson() { return lessonById(state.activeLessonId); }
    function quotaOf(key) { return state.quota[key] || { used: 0, max: 0 }; }
    function pendingCount() {
      const emgSourceIds = new Set((state.emergency?.lessons || []).map((l) => l.sourceLessonId).filter(Boolean));
      const statePending = state.lessons.filter((l) => l.status === 'PENDING_SUBSTITUTE' && !emgSourceIds.has(l.id)).length;
      const emgOpen = state.emergency ? state.emergency.lessons.filter((l) => l.status === 'AFFECTED').length : 0;
      return statePending + emgOpen;
    }
    function substitutedCount() { return state.lessons.filter((l) => l.status === 'SUBSTITUTED').length; }
    function lessonsOf(key) { return state.lessons.filter((l) => l.studentKey === key); }

    let auditSeq = 1;

    function fmtHours(hours) {
      if (hours < 1) return `${Math.round(hours * 60)}m`;
      return Number.isInteger(hours) ? `${hours}h` : `${hours.toFixed(1)}h`;
    }

    function forecastHours(iso, time) {
      const [h, m] = time.split(':').map(Number);
      const dayOffset = Math.max(0, diffDays(iso, TODAY));
      return Math.max(0.5, Math.round((dayOffset * 24 + (h + m / 60 - 12)) * 10) / 10);
    }

    function tierOf(hoursLeft) {
      if (hoursLeft < 3) {
        return {
          key: 'BREAK_GLASS',
          label: '<3h 紧急期',
          cls: 'border-rose-200 bg-rose-50 text-rose-700',
          rule: '突发绿色通道（<3h）：免扣退回待排期；同师平移已锁定。'
        };
      }
      if (hoursLeft < 24) {
        return {
          key: 'URGENT',
          label: '3~24h 中段期',
          cls: 'border-amber-200 bg-amber-50 text-amber-800',
          rule: '优先指派代课或同师平移；不可直接退回待排期。'
        };
      }
      return {
        key: 'REGULAR',
        label: '≥24h 正常期',
        cls: 'border-emerald-200 bg-emerald-50 text-emerald-700',
        rule: '可同师平移或免扣退回待排期；配额扣减 0 次。'
      };
    }

    function hoursChip(hoursLeft) {
      const cls = hoursLeft < 3
        ? 'border-rose-200 bg-rose-50 text-rose-700'
        : hoursLeft < 24
          ? 'border-amber-200 bg-amber-50 text-amber-800'
          : 'border-slate-200 bg-slate-50 text-slate-500';
      return `<span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${cls}">距上课 ${fmtHours(hoursLeft)}</span>`;
    }

    function emergencyStatusMeta(status) {
      const map = {
        AFFECTED: { label: '待处置', cls: 'border-rose-200 bg-rose-50 text-rose-700' },
        SUBSTITUTED: { label: '已指派代课', cls: 'border-indigo-200 bg-indigo-50 text-indigo-700' },
        PENDING_REBOOK: { label: '已免扣退回', cls: 'border-slate-200 bg-slate-100 text-slate-600' },
        RESCHEDULED: { label: '已同师平移', cls: 'border-emerald-200 bg-emerald-50 text-emerald-700' }
      };
      return map[status] || map.AFFECTED;
    }

    function activeEmergencyLesson(lessonId) {
      if (!lessonId || !state.emergency) return null;
      return state.emergency.lessons.find((l) => l.sourceLessonId === lessonId && l.status === 'AFFECTED') || null;
    }

    function lessonStatusMeta(l) {
      if (activeEmergencyLesson(l.id)) {
        return { label: '应急调度中', cls: 'border-rose-200 bg-rose-50 text-rose-700' };
      }
      return statusMeta(l.status);
    }

    function emergencyLessonNote(emg) {
      if (state.role === 'teacher') return `原师突发不可抗力：班长应急调度中 · ${tierOf(emg.hoursLeft).label} · 待处置`;
      if (state.role === 'monitor') return `应急调度包待处置 · 距上课 ${fmtHours(emg.hoursLeft)}`;
      return '老师突发不可抗力，班长正在紧急协调代课；本次变动绝不扣减任何请假配额';
    }

    function groupByStudent(lessons) {
      return STUDENTS
        .map((s) => ({ name: s.name, count: lessons.filter((l) => l.studentKey === s.key).length }))
        .filter((x) => x.count > 0)
        .map((x) => `${x.name} ${x.count} 节`);
    }

    function typeMeta(type) {
      return type === 'fixed'
        ? { label: '固定位', cls: 'border-amber-200 bg-amber-50 text-amber-800' }
        : { label: '临时课', cls: 'border-amber-200 bg-amber-50 text-amber-800' };
    }

    function statusMeta(status) {
      if (status === 'SUBSTITUTED') {
        return state.role === 'sub_teacher'
          ? { label: '代上课', cls: 'border-purple-200 bg-purple-50 text-purple-700' }
          : { label: '被代课', cls: 'border-blue-200 bg-blue-50 text-blue-700' };
      }
      const map = {
        SCHEDULED: { label: '已排期', cls: 'border-slate-200 bg-slate-100 text-slate-600' },
        PENDING_SUBSTITUTE: { label: '已请假 · 待代课', cls: 'border-rose-200 bg-rose-50 text-rose-700' },
        PENDING_REBOOK: { label: '已退回待排期', cls: 'border-slate-200 bg-slate-100 text-slate-500' },
        COMPLETED: { label: '已结课 · 正常出勤', cls: 'border-emerald-200 bg-emerald-50 text-emerald-700' },
        COMPLETED_ABSENT: { label: '已结课 · 学员旷课', cls: 'border-amber-200 bg-amber-50 text-amber-800' }
      };
      return map[status] || map.SCHEDULED;
    }

    function lessonTone(l) {
      if (!l || l.status !== 'SUBSTITUTED') return null;
      if (state.role === 'sub_teacher') {
        return {
          card: 'border-purple-300 bg-purple-50/80',
          title: 'text-purple-950',
          body: 'text-purple-900',
          muted: 'text-purple-700',
          faint: 'text-purple-600/80',
          chip: 'border-purple-200 bg-white/70 text-purple-700'
        };
      }
      return {
        card: 'border-blue-300 bg-blue-50/80',
        title: 'text-blue-950',
        body: 'text-blue-900',
        muted: 'text-blue-700',
        faint: 'text-blue-600/80',
        chip: 'border-blue-200 bg-white/70 text-blue-700'
      };
    }

    function lessonNote(l) {
      const emg = activeEmergencyLesson(l.id);
      if (emg) return emergencyLessonNote(emg);
      if (l.adminSpecial) return `管理员特批请假：免扣配额，课次已退回待排期（已审计）${l.teacherCompensated ? ' · 平台补偿教师课酬' : ''}`;
      if (l.adminNormal) return '管理员常规代请假：扣 1 次配额，课次已退回待排期（已审计）';
      if (l.monitorNormal) return '班长常规代请假：扣 1 次配额，课次已退回待排期（已审计）';
      if (l.adminRescheduled) return `管理员代挪位：免扣配额，已更新至 ${fmtDate(l.date)} ${l.time}（已审计）`;
      if (l.monitorRescheduled) return `班长协助同师挪位：免扣配额，已更新至 ${fmtDate(l.date)} ${l.time}（已审计）`;
      if (l.status === 'SUBSTITUTED') {
        if (state.role === 'teacher') return `由 ${l.sub} 代上，不计入个人课酬`;
        if (state.role === 'sub_teacher') return `替 ${TEACHER_NAME} 代课，课酬计入本人周结单`;
        if (state.role === 'monitor') return `已由 ${l.sub} 代课，资金持有人保持 Leo 不变`;
        return `本节由代课老师 ${l.sub} 上课，教学进度不受影响`;
      }
      if (l.status === 'PENDING_SUBSTITUTE') {
        if (state.role === 'teacher') return '已请假，等待班长指派代课老师';
        if (state.role === 'monitor') return `原师请假：${l.leaveReason || '临时请假'}，待指派代课`;
        return '教师请假，班长正在协调代课，无需操作';
      }
      if (l.status === 'COMPLETED') return '正常出勤 · TS 已结课，教师课酬进入周结；未扣请假配额';
      if (l.status === 'COMPLETED_ABSENT') return '学员旷课已记录 · TS 结课扣减，教师课酬正常；未扣请假配额';
      if (l.status === 'PENDING_REBOOK' && l.exceptionKind === 'teacherAbsent') {
        return l.makeUp
          ? '外教旷课：教师课酬剔除，已补生 1 节待排期；未扣学生请假配额'
          : '外教旷课：教师课酬剔除，TS 已退回待排期；未扣学生请假配额';
      }
      if (l.status === 'PENDING_REBOOK' && l.exceptionKind === 'cancel') return '未上课撤排：TS 已退回待排期，网格已释放，教师课酬 0';
      if (l.status === 'PENDING_REBOOK' && l.exceptionKind === 'retro') return '异常回退补生：已取消结课并补 1 节待排期，教师课酬剔除';
      if (l.status === 'PENDING_REBOOK' && l.exceptionKind === 'specialLeave') {
        return `管理员特批请假：豁免 <3h/配额限制，原因已审计${l.teacherCompensated ? ' · 平台补偿教师课酬' : ' · 不补偿课酬'}`;
      }
      if (l.status === 'PENDING_REBOOK') {
        return l.quotaExempt
          ? '教师原因退期待排，已物理豁免扣减学生请假配额'
          : `已请假退回待排期，扣减 1 次请假配额（剩余 ${quotaOf(l.studentKey).max - quotaOf(l.studentKey).used} 次）`;
      }
      return `${TEACHER_NAME} · KET备考`;
    }

    function lessonBorder(l) {
      if (activeEmergencyLesson(l.id)) return 'border-rose-300';
      if (l.status === 'SUBSTITUTED') return state.role === 'sub_teacher' ? 'border-purple-300' : 'border-blue-300';
      if (l.status === 'PENDING_SUBSTITUTE') return 'border-rose-200';
      if (l.status === 'PENDING_REBOOK') return 'border-slate-200';
      if (l.status === 'COMPLETED') return 'border-emerald-200';
      if (l.status === 'COMPLETED_ABSENT') return 'border-amber-200';
      return 'border-slate-200';
    }

    function quotaBarClass(left, max) {
      if (left <= 0) return 'w-0';
      if (max <= 0 || left >= max) return 'w-full';
      if (left * 2 === max) return 'w-1/2';
      return 'w-full';
    }

    function slotState(dayISO, time) {
      const l = activeLesson();
      if (!l) return '';
      if (dayISO === l.date && time === l.time) return 'ORIGIN';
      const other = state.lessons.find((x) => x.id !== l.id && x.date === dayISO && x.time === time
        && ['SCHEDULED', 'SUBSTITUTED', 'PENDING_SUBSTITUTE'].includes(x.status));
      if (other) return 'OCCUPIED';
      if (MOCK_OCCUPIED[`${dayISO}_${time}`]) return 'OCCUPIED';
      if (MOCK_GREEN[`${dayISO}_${time}`]) return 'GREEN';
      return '';
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线只读：请假 / 挪位 / 指派代课 / 暂停待排不可用', true);
        }
        if (group === 'hours') { state.hours = Number(value); renderAll(); }
      });
    });
    document.getElementById('btnResetDemo').addEventListener('click', resetDemo);
    document.querySelectorAll('[data-scenario]').forEach((btn) => {
      btn.addEventListener('click', () => openExceptionScenario(btn.dataset.scenario));
    });

    function setRole(role) {
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.page = 'board';
      state.navTab = boardTab();
      state.child = 'alice';
      state.activeLessonId = null;
      state.activeRecordId = null;
      state.overlay = null;
      state.picker = null;
      state.batch = null;
      state.adminLeave = null;
      state.exception = null;
      state.classSubDraft = null;
      state.classCancelAck = false;
      renderAll();
    }

    function navTo(tab) {
      const item = navItems().find((n) => n.id === tab);
      if (!item) return;
      state.overlay = null;
      state.activeLessonId = null;
      if (item.board) {
        state.page = 'board';
        state.navTab = tab;
      } else {
        state.page = 'placeholder';
        state.navTab = tab;
      }
      renderAll();
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const active = String(state[b.dataset.group]) === String(b.dataset.value);
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}`;
      });
    }

    function resetDemo() {
      state.role = 'parent';
      state.page = 'board';
      state.navTab = 'schedule';
      state.device = 'mobile';
      state.online = 'on';
      state.hours = 32;
      state.child = 'alice';
      state.activeLessonId = null;
      state.activeRecordId = null;
      state.overlay = null;
      state.lessons = clone(INITIAL_LESSONS);
      state.records = clone(INITIAL_RECORDS);
      state.quota = clone(INITIAL_QUOTA);
      state.freeSlots = clone(INITIAL_FREE);
      state.classCancelled = false;
      state.classSub = null;
      state.classSubDraft = null;
      state.classCancelAck = false;
      state.classCancelReason = '公众假期暂停待排，后续统一补排';
      state.classPauseRelease = 'red';
      state.picker = null;
      state.batch = null;
      state.lastBatchLeave = null;
      state.teacherLeaveSlots = [];
      state.emergency = clone(INITIAL_EMERGENCY);
      state.adminLeave = null;
      state.proxyLeaveReason = '';
      state.exception = null;
      state.adminAudit = [];
      auditSeq = 1;
      renderAll();
      showToast('演示数据已重置');
    }

    /* ------------------------------------------------------------------
     * 外壳：顶栏 / 时限横幅 / 底部导航
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = document.getElementById('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      document.getElementById('banner').innerHTML = renderBanner();
      document.getElementById('scenarioBanner').innerHTML = renderScenarioBanner();

      const banner = document.getElementById('offlineBanner');
      banner.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';

      document.getElementById('content').innerHTML = renderContent();
      document.getElementById('bottomnav').innerHTML = renderNav();
      renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.role === 'parent') return renderParentBoard();
      if (state.role === 'teacher') return renderTeacherBoard();
      if (state.role === 'sub_teacher') return renderSubBoard();
      if (state.role === 'admin') return renderAdminBoard();
      return renderMonitorBoard();
    }

    function bannerTitle() {
      if (state.overlay && OVERLAY_TITLES[state.overlay.type]) return OVERLAY_TITLES[state.overlay.type];
      if (state.page === 'placeholder') {
        const item = navItems().find((n) => n.id === state.navTab);
        if (item) return item.label;
      }
      return ROLE_TITLES[state.role] || '考勤与代课';
    }

    function renderBanner() {
      const b = BANNERS[state.role];
      const unread = Math.min(99, 2 + pendingCount());
      const canBack = !!state.overlay || state.page === 'placeholder';
      const left = canBack
        ? `<button data-action="${state.overlay ? 'close-overlay' : 'nav'}" ${state.overlay ? '' : `data-tab="${boardTab()}"`} class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="返回">${icon('arrow-left', 'h-5 w-5')}</button>`
        : `<span class="grid h-9 w-9 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${b.initial}</span>`;
      return `
        <header class="relative flex h-16 shrink-0 items-center justify-between gap-3 overflow-hidden bg-gradient-to-br ${b.gradient} px-4 text-white">
          ${b.pattern}
          <div class="relative flex min-w-0 items-center gap-2.5">

            <h1 class="truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</h1>

    function renderScenarioBanner() {
      const meta = state.hours >= 24
        ? { tag: '≥24h', cls: 'border-emerald-200 bg-emerald-50 text-emerald-900', tagCls: 'bg-emerald-200 text-emerald-900' }
        : state.hours >= 3
          ? { tag: '3~24h', cls: 'border-amber-200 bg-amber-50 text-amber-900', tagCls: 'bg-amber-200 text-amber-900' }
          : { tag: '<3h', cls: 'border-rose-200 bg-rose-50 text-rose-900', tagCls: 'bg-rose-200 text-rose-900' };
      const base = state.role === 'parent'
        ? '家长只读摘要：配额与最近动态实时可查，提交入口在 M3A 学生课表'
        : state.hours >= 24
          ? '正常期：临时课可请假退回待排期（扣 1 次配额）；同师挪位免扣配额'
          : state.hours >= 3
            ? '中段期：仅支持同师挪位或课程转让，请假退回待排期关闭'
            : '授课准备期：关闭请假与改期，缺席照常结课扣费';
      const roleNote = state.role === 'parent'
        ? '；本页不提供提交按钮'
        : state.role === 'teacher'
          ? '；突发不可抗力可走绿色通道，班长紧急调配代课'
          : state.role === 'monitor'
            ? '；应急待办包可按指派代课 / 免扣退回 / 同师平移处置'
            : state.role === 'sub_teacher'
              ? '；代课任务 <24h 锁定，保障备课权益'
              : state.role === 'admin'
                ? '；常规代请假扣配额；特批需 ≥10 字原因并审计'
                : '';
      return `
        <div class="flex items-center justify-between gap-2 border-b px-3 py-2 ${meta.cls}">
          <div class="flex min-w-0 items-center gap-1.5 text-[12px] font-medium leading-relaxed">
            ${icon('clock', 'h-3.5 w-3.5 shrink-0')}
            <span class="min-w-0">${esc(base + roleNote)}</span>
          </div>
          <span class="shrink-0 rounded px-1.5 py-0.5 text-[12px] font-bold ${meta.tagCls}">${meta.tag}</span>
        </div>`;
    }

    function renderNav() {
      const pending = pendingCount();
      return `
        <div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
          <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
            ${navItems().map((item) => {
              const on = state.navTab === item.id;
              const dot = item.id === 'ops' && pending > 0
                ? '<span class="absolute -right-1 -top-0.5 h-1.5 w-1.5 rounded-full bg-rose-500 ring-2 ring-white"></span>'
                : '';
              return `<button data-action="nav" data-tab="${item.id}" ${on ? 'aria-current="page"' : ''} class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'text-indigo-600' : 'text-slate-500'}">
                <span class="relative">${icon(item.icon, 'h-[18px] w-[18px]')}${dot}</span>
                <span class="text-[12px] font-bold">${esc(item.label)}</span>
              </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function renderPlaceholder() {
      const item = navItems().find((n) => n.id === state.navTab);
      if (!item) return '<div class="p-8 text-center text-[14px] font-medium text-slate-500">页面不存在</div>';
      return `
        <div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
          <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
          <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
          <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc || '')}</p>
          ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">前往${esc(item.label)}</a>` : ''}
          <button data-action="nav" data-tab="${boardTab()}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回${state.role === 'monitor' ? '代课调度' : state.role === 'admin' ? '管理员代操作' : '课表'}</button>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 家长：只读摘要（配额 / 最近动态 / 被代课记录）
     * ------------------------------------------------------------------ */
    function parentRecordsOf(key) {
      return state.records.filter((r) => r.studentKey === key);
    }

    function tierSummary() {
      if (state.hours < 3) {
        return { label: '<3h 授课准备期', cls: 'border-rose-200 bg-rose-50 text-rose-700' };
      }
      if (state.hours < 24) {
        return { label: '3~24h 中段期', cls: 'border-amber-200 bg-amber-50 text-amber-800' };
      }
      return { label: '≥24h 正常期', cls: 'border-emerald-200 bg-emerald-50 text-emerald-700' };
    }

    function calendarHref() {
      return `m3a_calendar_grid.html?role=parent&child=${encodeURIComponent(state.child)}&week=1`;
    }

    function renderParentBoard() {
      const child = studentByKey(state.child);
      const q = quotaOf(state.child);
      const left = q.max - q.used;
      const records = parentRecordsOf(state.child);
      const tier = tierSummary();
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-3' : 'space-y-3';
      const href = calendarHref();
      return `
        <div class="mx-auto w-full max-w-[640px] pb-6">
          <div class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 px-4 py-2 backdrop-blur">
            <div class="flex items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="text-[12px] font-bold text-slate-700">家长只读摘要</div>
                <div class="truncate text-[12px] font-medium text-slate-500">配额、剩余次数与最近动态</div>
              </div>
              <a href="${href}" target="_blank" rel="noopener" class="flex h-9 shrink-0 items-center gap-1.5 rounded-xl bg-indigo-600 px-3 text-[12px] font-semibold text-white">${icon('calendar-days', 'h-4 w-4')}去课表操作</a>
            </div>
          </div>

          <div class="space-y-3.5 px-4 pt-4">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <h1 class="text-[18px] font-bold tracking-tight text-slate-900">请假与考勤</h1>
                <p class="mt-1 text-[12px] font-medium text-slate-500">${esc(child.name)} · 12.5% 请假配额 · 只读摘要</p>
              </div>
              <span class="shrink-0 rounded-full border border-slate-200/80 bg-slate-50/70 px-2.5 py-1 text-[12px] font-bold text-slate-500">最近 2 条 · 共 ${records.length} 条</span>
            </div>

            <div class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3">
              <div class="text-[12px] font-medium text-slate-500">当前宝贝档案</div>
              <div class="mt-2 flex gap-2">
                ${STUDENTS.map((s) => {
                  const on = s.key === state.child;
                  return `<button data-action="set-child" data-key="${s.key}" class="flex h-9 flex-1 items-center justify-center gap-1.5 rounded-xl border text-[12px] font-bold ${on ? 'border-indigo-200 bg-indigo-600 text-white' : 'border-slate-300 bg-white text-slate-700'}">
                    ${esc(s.name)}<span class="rounded px-1 text-[12px] ${on ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-600'}">${parentRecordsOf(s.key).length} 条</span>
                  </button>`;
                }).join('')}
              </div>
            </div>

            <div class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <div class="text-[12px] font-medium text-slate-500">请假配额 · 12.5%</div>
                  <div class="mt-0.5 text-[18px] font-bold text-slate-900">已用 ${q.used} / 上限 ${q.max} · 剩余 ${left} 次</div>
                </div>
                <span class="shrink-0 rounded-full border ${tier.cls} px-2 py-0.5 text-[12px] font-bold">${tier.label}</span>
              </div>
              <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-white">
                <div class="h-full rounded-full ${left > 0 ? 'bg-emerald-500' : 'bg-rose-500'} ${quotaBarClass(left, q.max)}"></div>
              </div>
              <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-600">当前时限档位：${tier.label}（${state.hours}h）。同师挪位不扣配额；临时课请假按 M3B 配额与时限规则核销；固定位不支持请假，也不支持批量跨周请假，只能同师挪位/转让。</p>
            </div>

            <div class="flex items-center justify-between px-1">
              <span class="text-[14px] font-bold text-slate-800">最近动态摘要</span>
              <a href="m1a_student_profile.html?role=parent&studentId=stu_${state.child}" target="_blank" rel="noopener" class="text-[12px] font-semibold text-indigo-600">查看完整动态 →</a>
            </div>

            <div class="space-y-2">${records.slice(0, 2).map(parentRecordSummary).join('') || '<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/60 px-6 py-8 text-center text-[14px] font-medium text-slate-500">暂无请假、挪位或代课记录</div>'}</div>

            <p class="rounded-xl border border-slate-200/80 bg-slate-50/70 px-3.5 py-3 text-[12px] font-medium leading-relaxed text-slate-600">
              完整请假 / 同师挪位 / 被代课时间轴已收敛至首页【动态卡】与学员档案抽屉【动态】Tab；本页仅保留配额与最近摘要，不提供独立历史台账。同师挪位：固定位限本轮 4 周内、临时课限原课次前后 7 天内；每节限挪 1 次且免扣配额。&lt;3h 全端锁定。
            </p>
          </div>
        </div>`;
    }

    function renderTimelineMatrix() {
      const key = state.hours < 3 ? 'LOCK' : state.hours < 24 ? 'MID' : 'NORMAL';
      const rows = [
        {
          id: 'NORMAL',
          title: '≥24h 正常期',
          detail: '临时课请假扣 1 次配额；固定位不支持请假，也不支持批量跨周请假，只能同师挪位/转让；同师挪位免扣配额。',
          on: 'border-emerald-300 bg-emerald-50/80 text-emerald-900',
          off: 'border-slate-200 bg-white text-slate-500'
        },
        {
          id: 'MID',
          title: '3~24h 中段期',
          detail: '可同师挪位或课程转让；临时课请假关闭（<24h）；固定位不支持请假，只能同师挪位/转让。',
          on: 'border-amber-300 bg-amber-50/80 text-amber-900',
          off: 'border-slate-200 bg-white text-slate-500'
        },
        {
          id: 'LOCK',
          title: '<3h 授课准备期',
          detail: '全端锁定请假与挪位；固定位同样不支持请假；学生个人原因缺席照常结课扣费。',
          on: 'border-rose-300 bg-rose-50/80 text-rose-900',
          off: 'border-slate-200 bg-white text-slate-500'
        }
      ];
      return `
        <div class="overflow-hidden rounded-2xl border border-slate-200/80 bg-slate-50/70">
          <div class="flex items-center justify-between border-b border-slate-100 px-3.5 py-2.5">
            <span class="text-[14px] font-bold text-slate-800">时限说明</span>
            <span class="text-[12px] font-medium text-slate-500">当前 ${state.hours}h</span>
          </div>
          <div class="space-y-1.5 p-2.5">
            ${rows.map((r) => {
              const on = r.id === key;
              return `<div class="flex items-start gap-2 rounded-xl border px-2.5 py-2 ${on ? r.on : r.off}">
                <span class="mt-0.5 grid h-4 w-4 shrink-0 place-items-center rounded-full border ${on ? 'border-current bg-white/70' : 'border-slate-300 bg-white'}">${on ? icon('check', 'h-3 w-3') : ''}</span>
                <div class="min-w-0">
                  <div class="text-[12px] font-bold">${r.title}${on ? ' · 当前' : ''}</div>
                  <div class="mt-0.5 text-[12px] font-medium leading-relaxed opacity-80">${r.detail}</div>
                </div>
              </div>`;
            }).join('')}
          </div>
          <div class="border-t border-slate-100 px-3.5 py-2 text-[12px] font-medium leading-relaxed text-slate-500">本卡仅作规则说明，实际提交入口在 M3A 学生课表。</div>
        </div>`;
    }

    function distanceChip() {
      const cls = state.hours < 3
        ? 'border-rose-200 bg-rose-50 text-rose-700'
        : state.hours < 24
          ? 'border-amber-200 bg-amber-50 text-amber-800'
          : 'border-slate-200 bg-slate-50 text-slate-500';
      return `<span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${cls}">距上课 ${state.hours}h</span>`;
    }

    function recordKindMeta(r) {
      if (r.kind === 'exception') {
        const map = {
          present: { badge: 'border-emerald-200 bg-emerald-50 text-emerald-700', statusCls: 'border-emerald-200 bg-white text-emerald-700', card: 'border-emerald-200 bg-white' },
          studentAbsent: { badge: 'border-amber-200 bg-amber-50 text-amber-800', statusCls: 'border-amber-200 bg-white text-amber-800', card: 'border-amber-200 bg-white' },
          teacherAbsent: { badge: 'border-rose-200 bg-rose-50 text-rose-700', statusCls: 'border-rose-200 bg-white text-rose-700', card: 'border-rose-200 bg-white' },
          cancel: { badge: 'border-slate-200 bg-slate-100 text-slate-600', statusCls: 'border-slate-200 bg-white text-slate-600', card: 'border-slate-200 bg-white' },
          retro: { badge: 'border-indigo-200 bg-indigo-50 text-indigo-700', statusCls: 'border-indigo-200 bg-white text-indigo-700', card: 'border-indigo-200 bg-white' },
          specialLeave: { badge: 'border-rose-200 bg-rose-50 text-rose-700', statusCls: 'border-rose-200 bg-white text-rose-700', card: 'border-rose-200 bg-white' }
        };
        const m = map[r.exceptionKind] || map.present;
        return {
          label: '异常处置记录',
          status: r.statusLabel || '已处置',
          badge: m.badge,
          statusCls: m.statusCls,
          card: m.card,
          title: 'text-slate-900',
          muted: 'text-slate-500',
          faint: 'text-slate-500'
        };
      }
      if (r.kind === 'reschedule') {
        return {
          label: '同师挪位记录',
          status: '已同师挪位',
          badge: 'border-emerald-200 bg-emerald-50 text-emerald-700',
          statusCls: 'border-emerald-200 bg-white text-emerald-700',
          card: 'border-emerald-200 bg-white',
          title: 'text-slate-900',
          muted: 'text-slate-500',
          faint: 'text-slate-500'
        };
      }
      if (r.kind === 'substituted') {
        return {
          label: '被代课记录',
          status: '被代课',
          badge: 'border-blue-200 bg-blue-50 text-blue-700',
          statusCls: 'border-blue-200 bg-white text-blue-700',
          card: 'border-blue-200 bg-white',
          title: 'text-slate-900',
          muted: 'text-slate-500',
          faint: 'text-slate-500'
        };
      }
      return {
        label: '请假记录',
        status: '已退回待排期',
        badge: 'border-rose-200 bg-rose-50 text-rose-700',
        statusCls: 'border-rose-200 bg-white text-rose-700',
        card: 'border-rose-200 bg-white',
        title: 'text-slate-900',
        muted: 'text-slate-500',
        faint: 'text-slate-500'
      };
    }

    function parentRecordCard(r) {
      const meta = recordKindMeta(r);
      const tm = typeMeta(r.type);
      return `
        <button data-action="open-record" data-id="${r.id}" class="w-full rounded-2xl border ${meta.card} p-4 text-left transition hover:shadow-md">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="rounded-md border px-1.5 py-0.5 text-[12px] font-bold ${meta.badge}">${meta.label}</span>
                <span class="rounded-md border px-1.5 py-0.5 text-[12px] font-semibold ${tm.cls}">${tm.label}</span>
                <span class="rounded-full border px-2 py-0.5 text-[12px] font-bold ${meta.statusCls}">${meta.status}</span>
              </div>
              <div class="mt-1.5 font-mono text-[14px] font-bold ${meta.title}">${fmtDate(r.date)} ${r.time} - ${endTime(r.time)}</div>
            </div>
            <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg bg-slate-50 text-slate-500">${icon('chevron-right', 'h-4 w-4')}</span>
          </div>
          <div class="mt-2 flex flex-wrap gap-x-3 gap-y-1 text-[12px] font-medium ${meta.muted}">
            <span>学员 ${esc(studentByKey(r.studentKey).name)}</span>
            <span>原外教 ${esc(r.teacher)}</span>
            ${r.sub ? `<span>代课 ${esc(r.sub)}</span>` : ''}
            <span>挪位 ${r.rescheduleCount}/1</span>
          </div>
          <p class="mt-1.5 text-[12px] font-medium leading-relaxed ${meta.muted}">${esc(r.reason)}</p>
          <div class="mt-1 text-[12px] font-medium ${meta.faint}">审计 ${esc(r.auditAt)}${r.quotaUsed ? ` · 扣 ${r.quotaUsed} 次配额（${esc(r.orderLabel)}）` : ''}</div>
        </button>`;
    }

    function parentRecordSummary(r) {
      const meta = recordKindMeta(r);
      return `<button data-action="open-record" data-id="${r.id}" class="flex w-full items-center justify-between gap-2 rounded-2xl border border-slate-200/80 bg-slate-50/70 px-3 py-2.5 text-left transition active:scale-[0.995]">
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <span class="rounded-md border px-1.5 py-0.5 text-[12px] font-bold ${meta.badge}">${meta.label}</span>
            <span class="truncate font-mono text-[12px] font-bold text-slate-800">${fmtDate(r.date)} ${r.time}</span>
          </div>
          <div class="mt-0.5 truncate text-[12px] font-medium text-slate-600">${esc(r.reason)}</div>
        </div>
        <span class="shrink-0 text-[12px] font-medium text-slate-500">${esc(meta.status)}</span>
      </button>`;
    }

    function activeRecord() {
      return state.records.find((r) => r.id === state.activeRecordId) || null;
    }

    function openRecord(recordId) {
      if (!state.records.some((r) => r.id === recordId)) return;
      state.activeRecordId = recordId;
      state.overlay = { type: 'record' };
      renderAll();
    }

    function renderRecordModal() {
      const r = activeRecord();
      if (!r) return '';
      const meta = recordKindMeta(r);
      const rows = [
        ['记录类型', meta.label],
        ['状态', meta.status],
        ['学员', studentByKey(r.studentKey).name],
        ['原外教', r.teacher],
        ...(r.sub ? [['代课外教', r.sub]] : []),
        ['课程类型', r.type === 'fixed' ? '1v1 固定位' : '1v1 临时课'],
        ['课程时间', `${fmtDate(r.date)} ${r.time} - ${endTime(r.time)}`],
        ...(r.kind === 'reschedule' ? [['原课次', `${fmtDate(r.originalDate)} ${r.originalTime}`]] : []),
        ['挪位次数', `${r.rescheduleCount} / 1`],
        ['配额影响', r.quotaUsed ? `扣减 ${r.quotaUsed} 次（${r.orderLabel}）` : '未扣减请假配额'],
        ...(r.kind === 'exception' ? [['教师课酬', r.teacherPayExcluded ? '教师课酬剔除' : '正常计入教师周结']] : []),
        ...(r.compensate ? [['补偿标记', '平台补偿教师课酬']] : []),
        ['记录原因', r.reason],
        ['审计时间', r.auditAt]
      ];
      return modalShell(`
        ${modalHeader('记录详情 · 只读', `${studentByKey(r.studentKey).name} · ${fmtDate(r.date)} ${r.time}`)}
        <div class="mt-3 divide-y divide-slate-100 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1">
          ${rows.map(([k, v]) => `<div class="flex items-start justify-between gap-3 py-1.5 text-[12px]">
            <span class="shrink-0 text-slate-500">${esc(k)}</span>

        <a href="${calendarHref()}" target="_blank" rel="noopener" class="mt-3 flex h-11 items-center justify-center gap-1.5 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white">${icon('calendar-days', 'h-4 w-4')}去课表操作</a>
        <button data-action="close-overlay" class="mt-2 h-11 w-full rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">关闭</button>

    /* ------------------------------------------------------------------
     * 教师：本人课表 / 请假 / 空闲时段
     * ------------------------------------------------------------------ */
    function renderTeacherBoard() {
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-3' : 'space-y-3';

      const subbed = substitutedCount();
      return `
        <div class="mx-auto w-full max-w-[640px] space-y-3.5 px-4 pb-6 pt-4">

              <h1 class="text-[18px] font-bold tracking-tight text-slate-900">考勤与代课</h1>
              <p class="mt-1 text-[12px] font-medium text-slate-500">${TEACHER_NAME} · 本周 ${state.lessons.length} 节</p>
            </div>
            <div class="flex shrink-0 gap-1.5">
              <span class="rounded-full border border-rose-200 bg-rose-50 px-2 py-0.5 text-[12px] font-bold text-rose-700">待代课 ${pending}</span>
              <span class="rounded-full border border-indigo-200 bg-indigo-50 px-2 py-0.5 text-[12px] font-bold text-indigo-700">被代课 ${subbed}</span>

          <div class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5">
            <div class="flex items-start gap-2">
              <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl border border-slate-200 bg-white text-rose-600">${icon('siren', 'h-4 w-4')}</span>
              <div class="min-w-0">
                <div class="text-[14px] font-bold text-slate-900">请假 / 不可抗力报备</div>
                <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">点击当天任意课格、空闲格或休息格发起；抽屉内勾选当天 1~12 节（累计最长 6 小时）。家庭停电/断网、突发急病等不可抗力可走绿色通道；提交后 10 秒内安抚家长并生成班长应急调度包。</p>
              </div>
            </div>
            ${state.lastBatchLeave ? `
              <div class="mt-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-[12px]">
                <div class="flex items-center justify-between gap-2">
                  <span class="font-bold text-slate-800">最近一次请假报备</span>
                  <span class="rounded-full bg-rose-100 px-2 py-0.5 font-bold text-rose-700">${state.lastBatchLeave.count} 节</span>
                </div>
                <div class="mt-0.5 font-medium leading-relaxed text-slate-500">${esc(state.lastBatchLeave.range)} · 已排课受影响 ${state.lastBatchLeave.affectedCount} 节 · 空闲置红 ${state.lastBatchLeave.freeCount} 节 · ${esc(LEAVE_TYPE_LABELS[state.lastBatchLeave.reasonType] || '')}</div>
              </div>` : ''}
          </div>

          <div class="${grid}">${state.lessons.map(teacherLessonCard).join('')}</div>

          <div class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4">
            <div class="flex items-center justify-between gap-2">
              <h2 class="text-[16px] font-bold text-slate-900">空闲可授时段</h2>
              <span class="text-[12px] font-medium text-slate-500">请假不占配额 · 随时销假</span>
            </div>
            <div class="mt-2.5 space-y-1.5">
              ${state.freeSlots.map((f) => {
                const isLeave = f.state === 'leave';
                return `<div class="flex items-center justify-between gap-2 rounded-xl border ${isLeave ? 'border-rose-200 bg-rose-50' : 'border-emerald-200 bg-emerald-50'} px-3 py-2">
                  <div class="min-w-0">
                    <div class="text-[14px] font-bold ${isLeave ? 'text-rose-700' : 'text-emerald-700'}">${fmtDate(f.date)} ${f.time} - ${endTime(f.time)}</div>
                    <div class="text-[12px] font-medium ${isLeave ? 'text-rose-600' : 'text-emerald-600'}">${isLeave ? '已请假 · 该时段不开放' : '空闲可约'}</div>
                  </div>
                  <button data-action="${isLeave ? 'toggle-free' : 'open-batch-leave'}" ${isLeave ? `data-id="${f.id}"` : `data-day="${f.date}" data-time="${f.time}"`} ${state.online === 'off' ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg border px-2.5 text-[12px] font-semibold ${isLeave ? 'border-rose-200 bg-white text-rose-600' : 'border-emerald-200 bg-white text-emerald-700'} disabled:cursor-not-allowed disabled:opacity-50">${isLeave ? '销假' : '申请请假'}</button>
                </div>`;
              }).join('')}
            </div>
            <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-500">开课前 &gt;5 分钟可操作；空闲格请假不消耗请假配额，随时销假恢复 🟢 可约。</p>
          </div>

          ${teacherClassCard()}

          <div class="rounded-xl border border-slate-200/80 bg-slate-50/70 px-3.5 py-3 text-[12px] font-medium leading-relaxed text-slate-600">

          </div>
        </div>`;
    }

    function teacherLessonCard(l) {
      const tm = typeMeta(l.type);
      const sm = lessonStatusMeta(l);
      const affected = activeEmergencyLesson(l.id);
      const isScheduled = l.status === 'SCHEDULED';
      const urgent = state.hours < 24;
      const offline = state.online === 'off';
      const action = isScheduled && !affected
        ? `<div class="mt-3 flex justify-end border-t border-slate-100 pt-2.5">
             <button data-action="open-batch-leave" data-day="${l.date}" data-time="${l.time}" ${offline ? 'disabled' : ''} class="h-8 rounded-lg ${urgent ? 'bg-rose-600 text-white' : 'border border-slate-300 bg-white text-slate-700'} px-3 text-[12px] font-semibold disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">${urgent ? (state.hours < 3 ? '紧急请假(<3h)' : '请假 / 报备') : '请假 / 报备'}</button>
           </div>` : '';
      return `
        <article class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-[16px] font-bold text-slate-900">${esc(studentByKey(l.studentKey).name)}</span>
                <span class="rounded-md border px-1.5 py-0.5 text-[12px] font-semibold ${tm.cls}">${tm.label}</span>

              <div class="mt-1 truncate text-[12px] font-medium text-slate-500">${lessonNo(l.id)} · 挪位 ${l.rescheduleCount}/1 · ${ROOM_LABEL}</div>
            </div>
            <span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${sm.cls}">${sm.label}</span>

          <div class="mt-2.5 flex items-center justify-between gap-2">
            <div class="min-w-0">

              <div class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(lessonNote(l))}</div>
            </div>
            ${distanceChip()}
          </div>
          ${action}
        </article>`;
    }

    function teacherClassCard() {
      const cancelled = state.classCancelled;
      const sub = state.classSub;
      const badge = cancelled
        ? '<span class="rounded-full border border-amber-300 bg-amber-100 px-2 py-0.5 text-[12px] font-bold text-amber-900">已暂停待排 · 待补排</span>'
        : sub
          ? `<span class="rounded-full border border-blue-200 bg-blue-50 px-2 py-0.5 text-[12px] font-bold text-blue-700">🔵 被代课</span>`
          : '<span class="rounded-full border border-slate-200 bg-slate-100 px-2 py-0.5 text-[12px] font-bold text-slate-700">全班统一排期</span>';
      return `
        <div class="rounded-2xl border ${cancelled ? 'border-amber-300 bg-amber-50/50' : 'border-slate-200/80 bg-slate-50/70'} p-4">
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-[16px] font-bold ${cancelled ? 'text-amber-950' : 'text-slate-900'}">小班课</h2>
            ${badge}
          </div>
          <div class="mt-2 text-[14px] font-bold ${cancelled ? 'text-amber-950' : 'text-slate-800'}">${esc(CLASS_INFO.name)} · ${CLASS_INFO.size} 人</div>
          <div class="mt-0.5 font-mono text-[12px] font-medium ${cancelled ? 'text-amber-800' : 'text-slate-500'}">${fmtDate(CLASS_INFO.date)} ${CLASS_INFO.time} - ${CLASS_INFO.end} · ${ROOM_LABEL}</div>
          ${sub ? `
            <div class="mt-2 grid grid-cols-2 gap-0.5 overflow-hidden rounded-lg border border-blue-200">
              <div class="flex h-11 items-center justify-center border-r border-blue-200 bg-blue-50 text-[12px] font-bold text-blue-900">[G] KET · 双格 1/2</div>
              <div class="flex h-11 items-center justify-center bg-blue-50 text-[12px] font-bold text-blue-900">[G] KET · 双格 2/2</div>
            </div>` : ''}
          <p class="mt-2 text-[12px] font-medium leading-relaxed ${cancelled ? 'text-amber-800' : 'text-slate-600'}">${cancelled ? '已暂停待排，课次退回班级待排期池；等待主理人与家长协调后手工补排。' : sub ? `由 ${esc(sub.teacher)} 代上，不计入个人课酬；资金持有人与班级盈余、平台分成保持不变。` : '小班课由主理人整班排定，学生端无个人挪位入口。'}</p>
        </div>`;

    /* ------------------------------------------------------------------
     * 教师：1~12 节批量请假 / 不可抗力报备
     * ------------------------------------------------------------------ */
    function batchDays() {
      const days = BATCH_DAYS.slice();
      if (state.batch && !days.some((d) => d.iso === state.batch.day)) {
        days.unshift({ iso: state.batch.day, label: fmtDate(state.batch.day) });
      }
      return days;
    }

    function batchSlots() {
      if (!state.batch) return [];
      const day = state.batch.day;
      return TIME_SLOTS.map((time) => {
        const lesson = state.lessons.find((l) => l.date === day && l.time === time && l.status === 'SCHEDULED') || null;
        const leave = state.freeSlots.find((f) => f.date === day && f.time === time && f.state === 'leave') || null;
        return { id: `${day}_${time}`, time, end: endTime(time), lesson, leave };
      });
    }

    function openBatchLeave(day, time) {
      if (!guardWrite()) return;
      const targetDay = day || BATCH_DAYS[0].iso;
      state.batch = {
        day: targetDay,
        selected: time ? [`${targetDay}_${time}`] : [],
        reason: '',
        reasonType: 'POWER_OUTAGE',
        scrollToSelected: true
      };
      state.overlay = { type: 'batchLeave' };
      renderAll();
    }

    function changeBatchDay(day) {
      if (!state.batch || !batchDays().some((d) => d.iso === day)) return;
      state.batch.day = day;
      state.batch.selected = [];
      renderOverlay();
    }

    function toggleBatchSlot(id) {
      if (!guardWrite() || !state.batch) return;
      const idx = state.batch.selected.indexOf(id);
      if (idx >= 0) state.batch.selected.splice(idx, 1);
      else {
        if (state.batch.selected.length >= 12) return showToast('单次批量请假上限 12 节（累计最长 6 小时），请先取消部分时段', true);
        state.batch.selected.push(id);
      }
      renderOverlay();
    }

    function selectBatchMax() {
      if (!state.batch) return;
      state.batch.selected = batchSlots().slice(0, 12).map((s) => s.id);
      renderOverlay();
    }

    function clearBatchSelection() {
      if (!state.batch) return;
      state.batch.selected = [];
      renderOverlay();
    }

    function renderBatchLeaveModal() {
      const b = state.batch;
      if (!b) return '';
      const slots = batchSlots();
      const selected = slots.filter((s) => b.selected.includes(s.id));
      const affected = selected.filter((s) => s.lesson);
      const freeCount = selected.length - affected.length;
      const affectedStudents = [...new Set(affected.map((s) => s.lesson.studentKey))];
      const range = selected.length ? `${selected[0].time} - ${selected[selected.length - 1].end}` : '未选择';
      const typeOptions = Object.entries(LEAVE_TYPE_LABELS);

      return modalShell(`
        ${modalHeader('突发批量请假 / 不可抗力报备', '当天时段 Checkbox 连选 · 1~12 节 · 累计最长 6 小时', true)}
        <div class="mt-3 flex gap-1">
          ${batchDays().map((d) => {
            const on = d.iso === b.day;
            return `<button data-action="batch-day" data-day="${d.iso}" class="flex-1 rounded-xl px-1 py-1.5 text-[12px] font-bold ${on ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">${esc(d.label)}</button>`;
          }).join('')}
        </div>

        <div class="mt-3 flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-1.5">
            <span class="shrink-0 rounded-full border border-rose-200 bg-rose-50 px-2 py-0.5 text-[12px] font-bold text-rose-700">已选 ${b.selected.length} / 12 节</span>
            <span class="truncate text-[12px] font-medium text-slate-500">${range}</span>
          </div>
          <div class="flex shrink-0 gap-1.5">
            <button data-action="batch-select-max" class="rounded-lg border border-indigo-200 bg-indigo-50 px-2 py-1 text-[12px] font-semibold text-indigo-700">选满 12 节</button>
            <button data-action="batch-clear" class="rounded-lg border border-slate-200 bg-white px-2 py-1 text-[12px] font-semibold text-slate-500">清空</button>
          </div>
        </div>

        <div id="batchSlotsScroll" class="mt-2 max-h-[190px] space-y-1.5 overflow-y-auto rounded-xl border border-slate-200 bg-slate-50 p-2">
          ${slots.map((slot) => {
            const on = b.selected.includes(slot.id);
            const l = slot.lesson;
            return `<button data-action="batch-slot" data-id="${slot.id}" class="flex w-full items-center justify-between gap-2 rounded-lg border px-2.5 py-2 text-left transition ${on ? 'border-indigo-300 bg-indigo-50' : 'border-transparent bg-white hover:border-slate-200'}">
              <span class="flex min-w-0 items-center gap-2">
                <span class="grid h-5 w-5 shrink-0 place-items-center rounded border ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 bg-white text-transparent'}">${icon('check', 'h-3 w-3')}</span>
                <span class="whitespace-nowrap font-mono text-[12px] font-bold text-slate-800">${slot.time}-${slot.end}</span>
                ${l
                  ? `<span class="truncate text-[12px] font-semibold text-rose-700">已排 · ${esc(studentByKey(l.studentKey).name)} · ${l.type === 'fixed' ? '固定位' : '临时课'}</span>`
                  : slot.leave
                    ? '<span class="text-[12px] font-medium text-rose-600">已请假</span>'
                    : '<span class="text-[12px] font-medium text-slate-500">空闲可约</span>'}
              </span>
              ${on ? '<span class="shrink-0 rounded bg-indigo-600 px-1.5 py-0.5 text-[12px] font-bold text-white">已选</span>' : ''}
            </button>`;
          }).join('')}
        </div>

        <div class="mt-2 rounded-xl border border-slate-200 bg-white p-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold text-slate-800">影响透视</span>
            <span class="text-[12px] font-medium text-slate-500">提交前实时校验</span>
          </div>
          <div class="mt-1.5 grid grid-cols-2 gap-1.5 text-[12px]">
            <div class="rounded-lg bg-rose-50 px-2 py-1.5 font-semibold text-rose-700">已排课受影响 ${affected.length} 节</div>
            <div class="rounded-lg bg-emerald-50 px-2 py-1.5 font-semibold text-emerald-700">空闲置红 ${freeCount} 节</div>
          </div>
          <p class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-500">${affected.length
            ? `涉及 ${affectedStudents.length} 名学生：${affectedStudents.map((k) => esc(studentByKey(k).name)).join('、')}；将生成班长应急调度包并在 10 秒内安抚通知家长。`
            : '当前未勾选已排课次；若仅选择空闲时段，将直接置红阻断预约。'}</p>
          ${selected.length ? `<div class="mt-2 flex flex-wrap gap-1">${selected.map((s) => `<span class="rounded border border-slate-200 bg-slate-50 px-1.5 py-0.5 font-mono text-[12px] text-slate-600">${s.time}${s.lesson ? `·${esc(studentByKey(s.lesson.studentKey).name)}` : '·空闲'}</span>`).join('')}</div>` : ''}
        </div>

        <div class="mt-3">
          <label for="batchReasonType" class="mb-1 block text-[12px] font-medium text-slate-500">不可抗力分类 <span class="text-rose-500">*</span></label>
          <select id="batchReasonType" class="h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-[16px] text-slate-900 outline-none">
            ${typeOptions.map(([value, label]) => `<option value="${value}" ${b.reasonType === value ? 'selected' : ''}>${esc(label)}</option>`).join('')}
          </select>
        </div>
        <div class="mt-2">
          <label for="batchReason" class="mb-1 block text-[12px] font-medium text-slate-500">请假事由与说明 <span class="text-rose-500">*</span></label>
          <textarea id="batchReason" rows="7" maxlength="300" class="h-16 w-full resize-none rounded-xl border border-slate-200 p-3 text-[16px] text-slate-900 outline-none" placeholder="如：小区突发高压电缆故障抢修，预计今晚恢复供电……">${esc(b.reason)}</textarea>
        </div>

        <div class="mt-2 rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-2.5 text-[12px] font-medium leading-relaxed text-amber-900">
          提交后 10 秒内安抚家长；已排课次挂起为待代课并生成应急调度包；空闲时段原子置红阻断预约；教师原因导致的学生退课 <b>100% 免扣请假配额</b>。距上课 &lt;3h 仅突发不可抗力可走绿色通道。
        </div>

        <div class="sticky bottom-[-1.25rem] z-10 -mx-5 -mb-5 mt-4 flex gap-2 rounded-b-2xl border-t border-slate-100 bg-white px-5 py-3">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">取消</button>
          <button data-action="confirm-batch-leave" ${state.online === 'off' || b.selected.length === 0 ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认提交批量请假（${b.selected.length} 节）</button>
        </div>`);
    }

    function confirmBatchLeave() {
      if (!guardWrite() || !state.batch) return;
      const b = state.batch;
      if (b.selected.length < 1) return showToast('请至少选择 1 节（单次最多 12 节）', true);
      if (b.selected.length > 12) return showToast('单次批量请假上限 12 节（累计最长 6 小时）', true);
      const reasonEl = document.getElementById('batchReason');
      const reason = reasonEl ? reasonEl.value.trim() : (b.reason || '').trim();
      if (!reason) return showToast('请填写请假事由与说明', true);
      const typeEl = document.getElementById('batchReasonType');
      const reasonType = typeEl ? typeEl.value : (b.reasonType || 'POWER_OUTAGE');
      if (state.hours < 3 && reasonType === 'PERSONAL') return showToast('距上课不足 3 小时，仅突发不可抗力可走绿色通道；常规事假请改期', true);
      const slots = batchSlots().filter((s) => b.selected.includes(s.id));
      const affected = [];
      let freeCount = 0;

      slots.forEach((s) => {
        if (s.lesson) {
          s.lesson.status = 'PENDING_SUBSTITUTE';
          s.lesson.leaveReason = reason;
          s.lesson.leaveType = reasonType;
          affected.push({ slot: s, lesson: s.lesson });
        } else {
          freeCount += 1;
          state.teacherLeaveSlots.push({ date: b.day, time: s.time });
          state.freeSlots.push({ id: `fre_${String(Date.now()).slice(-5)}${String(state.freeSlots.length).padStart(3, '0')}`, date: b.day, time: s.time, state: 'leave' });
        }
      });

      state.lastBatchLeave = {
        count: slots.length,
        affectedCount: affected.length,
        freeCount,
        range: `${fmtDate(b.day)} ${slots[0].time} - ${slots[slots.length - 1].end}`,
        reasonType
      };

      if (affected.length) {
        const emgId = `EMG-${String(Date.now()).slice(-8)}`;
        state.emergency = {
          id: emgId,
          teacher: TEACHER_NAME,
          reason,
          reasonCode: reasonType,
          submittedAt: '刚刚',
          status: 'OPEN',
          lastAction: null,
          lessons: affected.map((a, i) => ({
            id: `${emgId}-${i + 1}`,
            studentKey: a.lesson.studentKey,
            type: a.lesson.type,
            date: b.day,
            time: a.slot.time,
            hoursLeft: forecastHours(b.day, a.slot.time),
            status: 'AFFECTED',
            sub: null,
            sourceLessonId: a.lesson.id
          }))
        };

        ${btn('emergency-assign', '绿色通道指派', 'border border-slate-300 bg-white text-slate-700')}
        ${btn('emergency-return', '紧急暂停待排', 'bg-rose-600 text-white')}
        <span class="inline-flex items-center rounded-lg bg-slate-100 px-2 py-1 text-[12px] font-medium text-slate-500">同师平移（&lt;3h 已锁）</span>`;
    }

    function emergencyResolvedNote(l) {
      if (l.status === 'SUBSTITUTED') return `已由 ${esc(l.sub || 'Elena Wright')} 代课 · 原师 ${TEACHER_NAME} · 资金持有人 Leo 不变 · 代课课酬 100% 归代课老师`;
      if (l.status === 'PENDING_REBOOK') return '已暂停待排（退回待排期 TS）· 学生请假配额扣减 0 次 · 挪位次数保持 0 · 可重新约课';
      if (l.status === 'RESCHEDULED') return `已同师平移至 ${fmtDate(l.date)} ${l.time} - ${endTime(l.time)} · 免扣配额且不计挪位次数`;
      return '';
    }

    function renderEmergencyResult() {
      const em = state.emergency;
      const a = em && em.lastAction;
      if (!a) return '';
      return `
        <div class="mt-3 rounded-xl border border-slate-200/80 bg-slate-50/70 p-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="text-[14px] font-bold text-slate-900">${esc(a.label)}</div>
              <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-emerald-800">${esc(a.summary)}</p>
            </div>
            <span class="shrink-0 rounded-full bg-emerald-200 px-2 py-0.5 text-[12px] font-bold text-emerald-900">${esc(a.auditId)}</span>
          </div>
          ${a.studentSummary && a.studentSummary.length ? `<div class="mt-1.5 flex flex-wrap gap-1">${a.studentSummary.map((s) => `<span class="rounded border border-emerald-200 bg-white px-1.5 py-0.5 text-[12px] font-medium text-emerald-800">${esc(s)}</span>`).join('')}</div>` : ''}
          <div class="mt-2 flex items-center justify-between gap-2 rounded-lg bg-white/70 px-2.5 py-2">
            <p class="text-[12px] font-medium leading-relaxed text-slate-600">审计已记录操作人 Leo、时间与逐节结果；${a.canRollback ? '相关课次均 ≥24h，可整体撤销。' : `含 ${a.lockedCount} 节 <24h 课次，代课已刚性锁定，不可回滚。`}</p>
            <button data-action="emergency-rollback" ${state.online === 'off' || !a.canRollback ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-700 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-100 disabled:text-slate-500">撤销本次操作</button>
          </div>
        </div>`;
    }

    function findEmergencyLesson(id) {
      return state.emergency ? state.emergency.lessons.find((l) => l.id === id) || null : null;
    }

    function syncEmergencyToSource(l) {
      if (!l || !l.sourceLessonId) return;
      const src = lessonById(l.sourceLessonId);
      if (!src) return;
      if (l.status === 'SUBSTITUTED') {
        src.status = 'SUBSTITUTED';
        src.sub = l.sub || 'Elena Wright';
      } else if (l.status === 'PENDING_REBOOK') {
        src.status = 'PENDING_REBOOK';
        src.quotaExempt = true;
      } else if (l.status === 'RESCHEDULED') {
        src.status = 'SCHEDULED';
        src.date = l.date;
        src.time = l.time;
        src.rescheduleCount = 0;
      }
    }

    function setEmergencyResult(type, label, snapshot, changed, counts, summary, studentSummary = []) {
      const em = state.emergency;
      if (!em) return;
      em.lastAction = {
        type,
        label,
        summary,
        studentSummary,
        counts,
        auditId: `AUD-${String(auditSeq++).padStart(4, '0')}`,
        at: '刚刚',
        canRollback: changed.length > 0 && changed.every((l) => l.hoursLeft >= 24),
        lockedCount: changed.filter((l) => l.hoursLeft < 24).length,
        changedIds: changed.map((l) => l.id),
        snapshot: clone(snapshot),
        sourceSnapshot: changed
          .map((l) => (l.sourceLessonId ? lessonById(l.sourceLessonId) : null))
          .filter(Boolean)
          .map((src) => clone(src))
      };
    }

    function emergencyAssignAll() {
      if (!guardWrite() || !state.emergency) return;
      const em = state.emergency;
      const targets = em.lessons.filter((l) => l.status === 'AFFECTED');
      if (!targets.length) return showToast('当前没有待处置课次', true);
      const snapshot = clone(em.lessons);
      targets.forEach((l) => {
        l.status = 'SUBSTITUTED';
        l.sub = 'Elena Wright';
      });
      setEmergencyResult(
        'ASSIGN_ALL',
        `一键指派同一代课外教 · ${targets.length} 节`,
        snapshot,
        targets,
        { assigned: targets.length, returned: 0, rescheduled: 0 },
        `已统一指派 Elena Wright 代课 ${targets.length} 节；资金持有人 Leo 不变，代课课酬 100% 归代课老师。`,
        groupByStudent(targets)
      );
      targets.forEach(syncEmergencyToSource);
      renderAll();
      showToast(`已一键指派 Elena Wright 代课 ${targets.length} 节 · 资金持有人不变 · 审计已留痕`);
    }

    function emergencyAutoRelief() {
      if (!guardWrite() || !state.emergency) return;
      const em = state.emergency;
      const targets = em.lessons.filter((l) => l.status === 'AFFECTED');
      if (!targets.length) return showToast('当前没有待处置课次', true);
      const snapshot = clone(em.lessons);
      const counts = { assigned: 0, returned: 0, rescheduled: 0 };
      const perStudent = {};
      targets.forEach((l) => {
        const tier = tierOf(l.hoursLeft);
        const entry = perStudent[l.studentKey] || (perStudent[l.studentKey] = { assigned: 0, returned: 0, rescheduled: 0 });
        if (tier.key === 'URGENT') {
          l.status = 'SUBSTITUTED';
          l.sub = 'Elena Wright';
          counts.assigned += 1;
          entry.assigned += 1;
        } else {
          l.status = 'PENDING_REBOOK';
          l.quotaExempt = true;
          counts.returned += 1;
          entry.returned += 1;
        }
      });
      const studentSummary = Object.entries(perStudent).map(([key, v]) => {
        const parts = [];
        if (v.assigned) parts.push(`代课 ${v.assigned} 节`);
        if (v.returned) parts.push(`免扣退回 ${v.returned} 节`);
        if (v.rescheduled) parts.push(`平移 ${v.rescheduled} 节`);
        return `${studentByKey(key).name}: ${parts.join('、')}`;
      });
      setEmergencyResult(
        'AUTO_RELIEF',
        `一键按学生自动救济 · ${targets.length} 节`,
        snapshot,
        targets,
        counts,
        `免扣退回待排期 ${counts.returned} 节（≥24h 与 <3h 紧急期）· 3~24h 指派代课 ${counts.assigned} 节 · 配额扣减 0 次`,
        studentSummary
      );
      targets.forEach(syncEmergencyToSource);
      renderAll();
      showToast(`自动救济完成：${counts.assigned} 节代课 · ${counts.returned} 节免扣退回 · 配额扣减 0 次`);
    }

    function emergencySafetyFallback() {
      if (!guardWrite() || !state.emergency) return;
      const em = state.emergency;
      const targets = em.lessons.filter((l) => l.status === 'AFFECTED' && l.hoursLeft <= 0.25);
      if (!targets.length) return showToast('当前无距上课 15 分钟内的待处理课次', true);
      const snapshot = clone(em.lessons);
      targets.forEach((l) => { l.status = 'PENDING_REBOOK'; l.quotaExempt = true; });
      setEmergencyResult(
        'SAFETY_FALLBACK',
        `15 分钟安全兜底 · ${targets.length} 节`,
        snapshot,
        targets,
        { assigned: 0, returned: targets.length, rescheduled: 0 },
        '距上课 15 分钟仍未完成代课指派，系统自动暂停待排并退回待排期 TS，学生请假配额扣减 0 次。',
        groupByStudent(targets)
      );
      targets.forEach(syncEmergencyToSource);
      renderAll();
      showToast('15 分钟安全兜底已触发：自动暂停待排并退回待排期 · 免扣配额');
    }

    function emergencyAssign(id) {
      if (!guardWrite() || !state.emergency) return;
      const l = findEmergencyLesson(id);
      if (!l || l.status !== 'AFFECTED') return showToast('该课次已处置，不可重复指派', true);
      const snapshot = clone(state.emergency.lessons);
      l.status = 'SUBSTITUTED';
      l.sub = 'Elena Wright';
      setEmergencyResult(
        'ASSIGN_ONE',
        `${studentByKey(l.studentKey).name} · 指派 Elena Wright`,
        snapshot,
        [l],
        { assigned: 1, returned: 0, rescheduled: 0 },
        '已指派 Elena Wright 代课，资金持有人 Leo 不变，课酬 100% 归代课老师。',
        groupByStudent([l])
      );
      syncEmergencyToSource(l);
      renderAll();
      showToast(`已指派 Elena Wright 代课 ${studentByKey(l.studentKey).name} · ${fmtDate(l.date)} ${l.time}`);
    }

    function emergencyReturn(id) {
      if (!guardWrite() || !state.emergency) return;
      const l = findEmergencyLesson(id);
      if (!l || l.status !== 'AFFECTED') return showToast('该课次已处置', true);
      const tier = tierOf(l.hoursLeft);
      const snapshot = clone(state.emergency.lessons);
      l.status = 'PENDING_REBOOK';
      l.quotaExempt = true;
      setEmergencyResult(
        'RETURN_ONE',
        `${studentByKey(l.studentKey).name} · 免扣退回待排期`,
        snapshot,
        [l],
        { assigned: 0, returned: 1, rescheduled: 0 },
        tier.key === 'BREAK_GLASS'
          ? '<3h 突发不可抗力绿色通道：免扣退回待排期，学生配额扣减 0 次。'
          : '教师原因免扣退回待排期，学生请假配额扣减 0 次，挪位次数保持 0。',
        groupByStudent([l])
      );
      syncEmergencyToSource(l);
      renderAll();
      showToast('已暂停待排（退回待排期 TS）· 学生配额扣减 0 次');
    }

    function emergencyReschedule(id) {
      if (!guardWrite() || !state.emergency) return;
      const l = findEmergencyLesson(id);
      if (!l || l.status !== 'AFFECTED') return showToast('该课次已处置', true);
      if (l.hoursLeft < 3) return showToast('距上课不足 3 小时，同师平移入口已锁定', true);
      const snapshot = clone(state.emergency.lessons);
      const target = l.type === 'fixed'
        ? { date: '2026-11-18', time: '16:30' }
        : { date: isoAdd(l.date, 3), time: '15:00' };
      l.date = target.date;
      l.time = target.time;
      l.status = 'RESCHEDULED';
      setEmergencyResult(
        'RESCHEDULE_ONE',
        `${studentByKey(l.studentKey).name} · 同师平移`,
        snapshot,
        [l],
        { assigned: 0, returned: 0, rescheduled: 1 },
        `已同师平移至 ${fmtDate(l.date)} ${l.time} - ${endTime(l.time)}；免扣学生配额，且不计入挪位次数。`,
        groupByStudent([l])
      );
      syncEmergencyToSource(l);
      renderAll();
      showToast(`同师平移成功 · 新时段 ${fmtDate(l.date)} ${l.time} · 免扣配额`);
    }

    function emergencyRollback() {
      if (!guardWrite() || !state.emergency) return;
      const em = state.emergency;
      const a = em.lastAction;
      if (!a || !a.canRollback) return showToast('本次操作含 <24h 课次，代课已刚性锁定，不可整体回滚', true);
      const map = new Map((a.snapshot || []).map((l) => [l.id, l]));
      em.lessons = em.lessons.map((l) => (a.changedIds.includes(l.id) && map.has(l.id) ? clone(map.get(l.id)) : l));
      (a.sourceSnapshot || []).forEach((src) => {
        const idx = state.lessons.findIndex((x) => x.id === src.id);
        if (idx >= 0) state.lessons[idx] = clone(src);
      });
      em.lastAction = {
        type: 'ROLLBACK',
        label: '已撤销上一次批量操作',
        summary: '课次状态与学生档案已恢复至操作前，审计留痕保留。',
        studentSummary: [],
        counts: {},
        auditId: `${a.auditId}-R`,
        at: '刚刚',
        canRollback: false,
        lockedCount: 0,
        changedIds: [],
        snapshot: [],
        sourceSnapshot: []
      };
      renderAll();
      showToast('已撤销本次操作，课次状态已恢复（审计留痕保留）');
    }

              <span class="rounded-full bg-amber-100 px-2 py-0.5 text-[12px] font-bold text-amber-900">待补排 1 节</span>
            </div>
            <p class="mt-1.5 text-[12px] font-medium leading-relaxed text-amber-900">${esc(CLASS_INFO.name)} 原定 ${fmtDate(CLASS_INFO.date)} ${CLASS_INFO.time} - ${CLASS_INFO.end} 已暂停待排，课次退回班级待排期池；家长已由主理人在线下微信群通知，请择期手工补排。</p>
            <p class="mt-1 text-[12px] font-medium leading-relaxed text-amber-800">${release === 'red' ? '原外教网格已标记 🔴【已请假 / 停电待补排】，不可再约。' : '原时段已释放为 🟢【空闲可约】，支持全平台再次预约。'}</p>

    function renderAdminAudit() {
      if (!state.adminAudit.length) return '';
      return `<details class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5">
        <summary class="flex cursor-pointer list-none items-center justify-between [&::-webkit-details-marker]:hidden">
          <span class="text-[16px] font-bold text-slate-900">我的经办与审计</span>
          <span class="text-[12px] font-medium text-slate-500">${state.adminAudit.length} 条</span>
        </summary>
        <div class="mt-2.5 space-y-2">
          ${state.adminAudit.slice(0, 6).map((a) => `<div class="rounded-xl border border-slate-200 bg-white p-2.5">
            <div class="flex items-center justify-between gap-2">
              <span class="inline-flex items-center gap-1 rounded-full border border-indigo-200 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(a.channelLabel)}</span>

          </div>`).join('')}
        </div>
      </details>`;
    }

    function appendAdminAudit(l, channel, reason, compensate) {
      const labels = {
        normal: '管理员常规代请假',
        special: '管理员特批代请假',
        monitorLeave: '班长常规代请假',
        reschedule: state.role === 'admin' ? '管理员代挪位' : '班长协助同师挪位'
      };
      state.adminAudit.unshift({
        at: '2026-11-10 14:32',
        by: state.role === 'admin' ? 'Sarah' : 'Leo',
        student: studentByKey(l.studentKey).name,
        lessonId: l.id,
        when: `${fmtDate(l.date)} ${l.time}`,
        channel,
        channelLabel: labels[channel] || '代操作',
        reason,
        compensate: !!compensate
      });
    }

    function openAdminLeave(lessonId) {
      if (!guardWrite()) return;
      const l = lessonById(lessonId);
      if (!l || l.status !== 'SCHEDULED') return showToast('该课次当前不可代请假', true);
      if (l.type === 'fixed') return showToast('固定位不支持请假；请使用同师挪位/代办转让，或走【异常处理】', true);
      const q = quotaOf(l.studentKey);
      const normalOk = l.type === 'temp' && state.hours >= 24 && (q.max - q.used) > 0;
      state.activeLessonId = lessonId;
      state.adminLeave = { channel: normalOk ? 'normal' : 'special', reason: '', compensate: false, error: '' };
      state.overlay = { type: 'adminLeave' };
      renderAll();
    }

    function renderAdminLeaveModal() {
      const l = activeLesson();
      const al = state.adminLeave;
      if (!l || !al) return '';
      const q = quotaOf(l.studentKey);
      const left = q.max - q.used;
      const normalOk = l.type === 'temp' && state.hours >= 24 && left > 0;
      const reason = al.reason.trim();
      const reasonHint = al.channel === 'normal' ? '常规代请假原因建议 2-200 字' : '特批请假原因必须 ≥10 字，将写入审计';
      return modalShell(`
        ${modalHeader('管理员代请假', `${studentByKey(l.studentKey).name} · ${fmtDate(l.date)} ${l.time} - ${endTime(l.time)}`, true)}
        <div class="mt-2.5 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-[12px]">
          <div class="flex justify-between py-0.5"><span class="text-slate-500">任课外教</span><span class="font-semibold text-slate-800">${TEACHER_NAME}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">教室</span><span class="font-semibold text-slate-800">${ROOM_LABEL}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">班型</span><span class="font-semibold text-slate-800">${l.type === 'fixed' ? '1v1 固定位' : '1v1 临时课'}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">请假配额</span><span class="font-mono font-bold text-slate-800">已用 ${q.used} / 上限 ${q.max} · 剩余 ${left}</span></div>
          <div class="flex justify-between py-0.5"><span class="text-slate-500">距上课</span><span class="font-mono font-bold ${state.hours < 3 ? 'text-rose-700' : state.hours < 24 ? 'text-amber-700' : 'text-emerald-700'}">${state.hours}h</span></div>
        </div>

        <div class="mt-3 grid grid-cols-2 gap-1.5">
          <button data-action="admin-channel" data-channel="normal" ${normalOk ? '' : 'disabled'} class="h-10 rounded-xl border text-[14px] font-bold transition ${al.channel === 'normal' ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-500'} disabled:cursor-not-allowed disabled:bg-slate-50 disabled:text-slate-300">常规代请假</button>
          <button data-action="admin-channel" data-channel="special" class="h-10 rounded-xl border text-[14px] font-bold transition ${al.channel === 'special' ? 'border-amber-300 bg-amber-50 text-amber-800' : 'border-slate-200 bg-white text-slate-500'}">非常规特批</button>
        </div>

        ${al.channel === 'normal' ? `<div class="mt-2 rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900/85">
          标准扣减 1 次配额（剩余 ${left} → ${Math.max(0, left - 1)}）；仅临时课、距上课 ≥24h 且配额充足时可用。固定位不适用请假，只能同师挪位/代办转让或异常处理。
        </div>` : `<div class="mt-2 rounded-xl border border-amber-200/70 bg-amber-50/80 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-amber-900/85">
          免扣配额，可突破开课前 &lt;3h 与配额耗尽限制；仅适用临时课，固定位不可用。必须填写 ≥10 字原因并写入审计。补偿教师课酬默认关闭。
        </div>`}

        ${!normalOk && al.channel === 'normal' ? `<div class="mt-1.5 rounded-lg border border-rose-200 bg-rose-50 px-2.5 py-1.5 text-[12px] font-medium text-rose-700">当前课次不满足常规代请假条件，请切换特批通道。</div>` : ''}

        <div class="mt-3">
          <label for="adminLeaveReason" class="mb-1 block text-[14px] font-semibold text-slate-700">代操作原因 <span class="text-rose-500">*</span></label>
          <textarea id="adminLeaveReason" maxlength="200" rows="3" class="h-20 w-full resize-none rounded-xl border border-slate-200 bg-white p-2.5 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500" placeholder="${al.channel === 'special' ? '请填写 ≥10 字特批原因，例如学员突发急病就医……' : '请填写代请假原因，便于审计追溯……'}">${esc(al.reason)}</textarea>
          <div class="mt-1 flex items-center justify-between">
            <span class="text-[12px] font-medium ${al.channel === 'special' && reason.length < 10 ? 'text-rose-600' : 'text-slate-500'}">${reasonHint}</span>
            <span id="adminReasonCount" class="font-mono text-[12px] font-medium text-slate-500">${al.reason.length}/200</span>
          </div>
        </div>

        ${al.channel === 'special' ? `<label class="mt-2 flex cursor-pointer items-start gap-2.5 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2">
          <input id="adminCompensate" type="checkbox" ${al.compensate ? 'checked' : ''} class="mt-0.5 h-4 w-4 rounded border-amber-300 accent-amber-600">
          <span class="text-[12px] font-medium leading-relaxed text-amber-900">给老师补偿课酬（平台贴补）<span class="mt-0.5 block text-amber-700">默认不补偿；仅突发不可抗力且需挽回客诉时勾选</span></span>
        </label>` : ''}

        ${al.error ? `<div id="adminLeaveError" class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-[12px] font-medium text-rose-700">${esc(al.error)}</div>` : ''}

        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-800 hover:bg-slate-50">取消</button>
          <button data-action="confirm-admin-leave" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认代请假</button>
        </div>`);
    }

    function setAdminChannel(channel) {
      if (!state.adminLeave) return;
      const l = activeLesson();
      if (channel === 'normal') {
        const q = quotaOf(l.studentKey);
        if (!(l.type === 'temp' && state.hours >= 24 && (q.max - q.used) > 0)) return;
      }
      state.adminLeave.channel = channel;
      state.adminLeave.error = '';
      renderOverlay();
    }

    function confirmAdminLeave() {
      if (!guardWrite()) return;
      const l = activeLesson();
      const al = state.adminLeave;
      if (!l || !al) return;
      const q = quotaOf(l.studentKey);
      const left = q.max - q.used;
      const reason = al.reason.trim();
      const fail = (msg) => { al.error = msg; renderOverlay(); };
      if (al.channel === 'normal') {
        if (!(l.type === 'temp' && state.hours >= 24 && left > 0)) return fail('当前不满足常规代请假条件，请切换特批通道');
        if (reason.length < 2 || reason.length > 200) return fail('常规代请假原因需为 2-200 字');
        q.used += 1;
        l.status = 'PENDING_REBOOK';
        l.quotaExempt = false;
        l.adminNormal = true;
      } else {
        if (reason.length < 10 || reason.length > 200) return fail('特批请假原因必须为 10-200 字');
        l.status = 'PENDING_REBOOK';
        l.quotaExempt = true;
        l.adminSpecial = true;
        l.teacherCompensated = !!al.compensate;
      }
      appendAdminAudit(l, al.channel, reason, al.compensate);
      state.overlay = null;
      state.adminLeave = null;
      renderAll();
      showToast(al.channel === 'normal' ? '管理员常规代请假完成 · 已扣 1 次配额并写入审计' : '管理员特批代请假完成 · 免扣配额并写入审计');
    }

     * 班长 / 管理员：学员课表代办抽屉
     * ------------------------------------------------------------------ */

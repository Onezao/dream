        state.hours = 2;
        state.returnOverlay = null;
        state.overlay = { type: 'studentLeaveChoice', lessonId: 'lsn_bob_today', lessonIds: ['lsn_bob_today'] };
        renderAll();
        return;
      }
      if (action === 'toggle-pack-hours') {
        state.hours = state.hours < 3 ? 24 : 2;
        renderAll();
        return;
      }
      if (action === 'pack-assign') {
        const ids = el.dataset.scope ? el.dataset.scope.split(',') : [el.dataset.id];
        return openAssignSub({ lessonId: el.dataset.id, lessonIds: ids });
      }
      if (action === 'pack-group-assign') {
        ensureGroupLesson();
        state.cellView = 'group';
        state.classDraft = { selected: null, query: '' };
        state.overlay = { type: 'cellSheet', lessonId: el.dataset.id };
        renderAll();
        return;
      }
      if (action === 'pack-leave') {
        const ids = el.dataset.scope ? el.dataset.scope.split(',') : [el.dataset.id];
        return handleLessonLeave(el.dataset.id, ids);
      }
      if (action === 'pack-reschedule') {
        const ids = el.dataset.scope ? el.dataset.scope.split(',') : [el.dataset.id];
        return openReschedule(el.dataset.id, null, ids);
      }
      if (action === 'lesson-leave') return handleLessonLeave(el.dataset.id);
      if (action === 'lesson-reschedule') return openReschedule(el.dataset.id);
      if (action === 'select-target') return selectTarget(el.dataset.key);
      if (action === 'confirm-reschedule') return confirmReschedule();
      if (action === 'cancel-soft') return cancelSoft();
      if (action === 'confirm-soft') return confirmSoft();
      if (action === 'student-leave-lenient') return executeStudentLeaveChoice('lenient');
      if (action === 'student-leave-absent') return executeStudentLeaveChoice('absent');
      if (action === 'cancel-student-leave') return cancelStudentLeaveChoice();
      if (action === 'pick-student') return pickStudent(el.dataset.key);
      if (action === 'confirm-change') return confirmChangeStudent();
      if (action === 'overlay-back') return overlayBack();
      if (action === 'open-cell') return openCellSheet(el.dataset.id);
      if (action === 'cell-panel-main') {
        state.cellView = 'main';
        renderOverlay();
        return;
      }
      if (action === 'cell-panel-leave') {
        state.cellView = 'leaveReschedule';
        renderOverlay();
        return;
      }
      if (action === 'cell-panel-assign') {
        const lesson = lessonById(state.overlay.lessonId);
        if (!lesson) return;
        return openCellAssignPanel(lesson);
      }
      if (action === 'cell-panel-attendance') {
        state.cellView = 'attendance';
        renderOverlay();
        return;
      }
      if (action === 'cell-leave') {
        const ids = el.dataset.scope ? el.dataset.scope.split(',') : [el.dataset.id];
        return handleLessonLeave(el.dataset.id, ids);
      }
      if (action === 'cell-reschedule') {
        const ids = el.dataset.scope ? el.dataset.scope.split(',') : [el.dataset.id];
        return openReschedule(el.dataset.id, null, ids);
      }
      if (action === 'cell-change') {
        const lesson = lessonById(state.overlay.lessonId);
        if (!lesson) return;
        const ids = el.dataset.scope ? el.dataset.scope.split(',') : cellScopeIds(lesson);
        return openChangeStudent(lesson.id, ids);
      }
      if (action === 'cell-withdraw') {
        const lesson = lessonById(state.overlay.lessonId);
        if (!lesson) return;
        return withdrawLessons(lesson);
      }
      if (action === 'cell-compensate') {
        const lesson = lessonById(state.overlay.lessonId);
        if (!lesson) return;
        return compensateLesson(lesson);
      }
      if (action === 'cell-mark-student-absent') return markAttendance('student_absent');
      if (action === 'cell-mark-teacher-absent') return markAttendance('teacher_absent');
      if (action === 'cell-mark-teacher-late') return markAttendance('teacher_late');
      if (action === 'cell-mark-teacher-early') return markAttendance('teacher_early');
      if (action === 'cell-restore-normal') {
        const lesson = lessonById(state.overlay.lessonId);
        if (!lesson) return;
        return restoreNormalAttendance(lesson);
      }
      if (action === 'cell-revoke-sub') {
        const lesson = lessonById(state.overlay.lessonId);
        if (!lesson) return;
        return requestOrRun('revoke-sub', { lessonId: lesson.id, lessonIds: cellScopeIds(lesson) });
      }
      if (action === 'cell-group-pause') return openClassPause(el.dataset.id);
      if (action === 'cell-assign') return openAssignSub({ lessonId: el.dataset.id });
      if (action === 'assign-responsibility') {
        if (!state.assignSub) return;
        state.assignSub.responsibility = el.dataset.value || '';
        renderOverlay();
        return;
      }
      if (action === 'pick-sub') return pickSub(el.dataset.name);
      if (action === 'confirm-assign-sub') return confirmAssignSub();
      if (action === 'pick-class-sub') return pickClassSub(el.dataset.name);
      if (action === 'confirm-class-sub') return confirmClassSub();
      if (action === 'confirm-class-pause') return confirmClassPause();
      if (action === 'teacher-leave-reason') {
        if (!state.teacherLeave) return;
        state.teacherLeave.reason = el.dataset.reason || '';
        renderOverlay();
        return;
      }
      if (action === 'submit-teacher-leave') return submitTeacherLeave();
      if (action === 'handover-progress-chip') return appendProgressChip(el.dataset.key, el.dataset.text);
      if (action === 'handover-courseware') {
        if (!state.teacherLeave) return;
        ensureTeacherLeaveHandovers();
        state.returnOverlay = { type: 'teacherLeave' };
        state.overlay = { type: 'handoverCourseware', studentKey: el.dataset.key, title: '选择在学课件' };
        renderAll();
        return;
      }
      if (action === 'handover-courseware-pick') {
        const key = el.dataset.key;
        if (!state.teacherLeave || !state.teacherLeave.handovers[key]) return;
        state.teacherLeave.handovers[key].courseware = el.dataset.value || '';
        state.overlay = { type: 'teacherLeave' };
        state.returnOverlay = null;
        renderAll();
        return;
      }
      if (action === 'handover-picker-close') return closeOverlay();
      if (action === 'handover-level') {
        const key = el.dataset.key;
        if (!state.teacherLeave || !state.teacherLeave.handovers[key]) return;
        state.teacherLeave.handovers[key].level = el.dataset.value || '';
        renderOverlay();
        return;
      }
      if (action === 'handover-note-toggle') {
        const key = el.dataset.key;
        if (!state.teacherLeave) return;
        if (!state.teacherLeave.noteOpen) state.teacherLeave.noteOpen = {};
        state.teacherLeave.noteOpen[key] = !state.teacherLeave.noteOpen[key];
        renderOverlay();
        return;
      }
      if (action === 'records-range') {
        state.recordsRange = el.dataset.value;
        state.recordsLimit = 20;
        renderAll();
        return;
      }
      if (action === 'records-type') {
        state.recordsType = el.dataset.value;
        state.recordsLimit = 20;
        renderAll();
        return;
      }
      if (action === 'records-monitor') {
        state.recordsMonitor = el.dataset.value;
        state.recordsLimit = 20;
        renderAll();
        return;
      }
      if (action === 'records-toggle-monitors') {
        state.recordsExpanded = !state.recordsExpanded;
        renderAll();
        return;
      }
      if (action === 'records-more') {
        state.recordsLimit = Math.min(state.recordsLimit + 20, filteredRecords().length);
        renderAll();
        return;
      }
      if (action === 'history-range') {
        state.historyRange = el.dataset.value;
        ensureHistoryStudentValid();
        state.historyLimit = 20;
        renderAll({ resetScroll: true });
        return;
      }
      if (action === 'history-type') {
        state.historyType = el.dataset.value;
        state.historyLimit = 20;
        renderAll({ resetScroll: true });
        return;
      }
      if (action === 'history-students') {
        state.overlay = { type: 'historyStudents', title: '选择学员' };
        renderAll();
        return;
      }
      if (action === 'history-student') {
        state.historyStudent = el.dataset.value || 'ALL';
        state.historyLimit = 20;
        state.overlay = null;
        renderAll({ resetScroll: true });
        return;
      }
      if (action === 'history-months') {
        state.overlay = { type: 'historyMonths', title: '选择月份' };
        renderAll();
        return;
      }
      if (action === 'history-rules') {
        state.overlay = { type: 'historyRules', title: '授课历史规则说明' };
        renderAll();
        return;
      }
      if (action === 'history-month') {
        const ym = el.dataset.value;
        const currentMonth = TODAY.slice(0, 7);
        state.historyRange = ym === currentMonth
          ? 'month'
          : ym === prevMonthKey(currentMonth) ? 'last-month' : `month:${ym}`;
        ensureHistoryStudentValid();
        state.historyLimit = 20;
        state.overlay = null;
        renderAll({ resetScroll: true });
        return;
      }
      if (action === 'history-more') {
        state.historyLimit += 20;
        renderAll();
        return;
      }
      if (action === 'history-note') return openHistoryNote(el.dataset.ids, el.dataset.note);
      if (action === 'save-history-note') return saveHistoryNote();
      if (action === 'history-reset') return resetHistoryFilters();
    });

    document.getElementById('frame').addEventListener('change', (event) => {
      const target = event.target;
      if (target.matches('[data-cell-scope]')) {
        state.cellScope.nextSelected = target.checked;
        renderOverlay();
        return;
      }
      if (target.matches('[data-cross-agree]')) {
        if (!state.changeStudent) return;
        state.changeStudent.agreed = target.checked;
        renderOverlay();
        return;
      }
      if (target.matches('[data-leave-slot]')) {
        if (!state.teacherLeave) return;
        const key = target.dataset.leaveSlot;
        const index = state.teacherLeave.selected.indexOf(key);
        if (target.checked && index === -1) state.teacherLeave.selected.push(key);
        if (!target.checked && index !== -1) state.teacherLeave.selected.splice(index, 1);
        ensureTeacherLeaveHandovers();
        renderOverlay();
      }
    });

    document.getElementById('frame').addEventListener('input', (event) => {
      if (event.target.id === 'historyNoteInput') {
        state.historyNoteDraft = event.target.value.slice(0, NOTE_MAX);
        syncNoteCounter(event.target);
        return;
      }
      if (event.target.id === 'studentSearch') {
        filterStudentRows(event.target);
        return;
      }
      if (event.target.id === 'changeStudentNote' && state.changeStudent) {
        state.changeStudent.note = event.target.value.slice(0, 200);
        const btn = document.querySelector('[data-action="confirm-change"]');
        const draftLesson = lessonById(state.changeStudent.lessonId);
        const picked = state.changeStudent.selected ? studentByKey(state.changeStudent.selected) : null;
        const cross = draftLesson && picked && picked.parent !== draftLesson.payer;
        const ok = !cross || (String(state.changeStudent.note || '').trim() && state.changeStudent.agreed);
        if (btn) btn.disabled = !state.changeStudent.selected || !ok || state.online === 'off';
        return;
      }
      if (event.target.id === 'crossHighReason' && state.assignSub) {
        state.assignSub.crossReason = event.target.value.slice(0, 200);
        const btn = document.querySelector('[data-action="confirm-assign-sub"]');
        const draft = state.assignSub;
        const lesson = lessonById(draft.lessonId);
        const candidate = SUB_CANDIDATES.find((c) => c.name === draft.selected);
        const crossHigh = lesson && candidate && isCrossHigh(candidate.price, teacherPrice(originTeacherOf(lesson)));
        const needResp = lesson && lesson.status !== 'LEAVE_PENDING' && lesson.status !== 'SUBSTITUTED' && state.hours >= 24;
        if (btn) btn.disabled = !draft.selected || (needResp && !draft.responsibility) || (crossHigh && !draft.crossReason.trim()) || state.online === 'off';
        return;
      }
      if (event.target.id === 'teacherSearch') {
        if (state.assignSub) state.assignSub.query = event.target.value;
        if (state.classDraft) state.classDraft.query = event.target.value;
        const query = event.target.value.trim().toLowerCase();
        const rows = Array.from(document.querySelectorAll('[data-sub-row]'));
        rows.forEach((row) => row.classList.toggle('hidden', !row.dataset.subRow.toLowerCase().includes(query)));
        const empty = document.getElementById('teacherSearchEmpty');
        if (empty) empty.classList.toggle('hidden', rows.some((row) => !row.classList.contains('hidden')));
        return;
      }
      if (event.target.id === 'cellReason') {
        state.cellReason = event.target.value;
        updateCellReasonHint();
        return;
      }
      if (event.target.id === 'teacherLeaveReason' && state.teacherLeave) {
        state.teacherLeave.reason = event.target.value;
        return;
      }
      if (event.target.matches('[data-handover-progress]') && state.teacherLeave) {
        const key = event.target.dataset.handoverProgress;
        if (state.teacherLeave.handovers[key]) state.teacherLeave.handovers[key].progress = event.target.value.slice(0, NOTE_MAX);
        syncNoteCounter(event.target);
        return;
      }
      if (event.target.matches('[data-handover-note]') && state.teacherLeave) {
        const key = event.target.dataset.handoverNote;
        if (state.teacherLeave.handovers[key]) state.teacherLeave.handovers[key].note = event.target.value.slice(0, NOTE_MAX);
        syncNoteCounter(event.target);
      }
    });

    /* ------------------------------------------------------------------
     * URL 参数与启动
     * ------------------------------------------------------------------ */
    function applyUrlScenario() {
      const params = new URLSearchParams(window.location.search);
      const roleParam = params.get('role');
      if (roleParam && ROLE_META[roleParam]) state.role = roleParam;
      const device = params.get('device');
      if (device === 'tablet' || device === 'mobile') state.device = device;
      const online = params.get('online');
      if (online === 'off' || online === 'on') state.online = online;
      const hours = params.get('hours');
      if (hours === '<3' || hours === 'lt3') state.hours = 2;
      else if (hours === '3~24' || hours === 'mid') state.hours = 6;
      else if (hours === '>=24' || hours === 'gte24') state.hours = 24;
      else if (hours) {
        const numericHours = Number(hours);
        if (Number.isFinite(numericHours) && numericHours > 0) state.hours = numericHours;
      }
      state.page = defaultPage(state.role);
      const pageParam = params.get('page');
      if (pageParam && (pageParam === 'history' || navItems().some((item) => item.id === pageParam))) state.page = pageParam;
      const scenario = params.get('scenario');
      if (scenario) {
        runScenario(scenario);
        return;
      }
      renderAll({ resetScroll: true });
    }

    /* ------------------------------------------------------------------
     * 演示导航折叠（仅原型控制台，不属于产品界面）
     * ------------------------------------------------------------------ */
    const NAV_COLLAPSE_KEY = 'dream_proto_nav_collapsed';

    function navCollapsed() {
      try { return localStorage.getItem(NAV_COLLAPSE_KEY) === '1'; } catch (error) { return false; }
    }

    function setNavCollapsed(collapsed) {
      const header = document.getElementById('console');
      const mini = document.querySelector('[data-console-mini]');
      if (!header || !mini) return;
      header.classList.toggle('hidden', collapsed);
      mini.classList.toggle('hidden', !collapsed);
      mini.classList.toggle('flex', collapsed);
      try { localStorage.setItem(NAV_COLLAPSE_KEY, collapsed ? '1' : '0'); } catch (error) { /* 静默降级 */ }
    }

    document.querySelectorAll('[data-console-collapse]').forEach((btn) => {
      btn.addEventListener('click', () => setNavCollapsed(true));
    });

    document.querySelectorAll('[data-console-expand]').forEach((btn) => {
      btn.addEventListener('click', () => setNavCollapsed(false));
    });

    setNavCollapsed(navCollapsed());

    resetState();
    applyUrlScenario();
    window.__dreamDemoState = state;
  </script>
</body>
</html>

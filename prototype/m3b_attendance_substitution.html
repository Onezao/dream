    /* M1B 当期「启用中」价位字典升序相邻 = ±1 档；>= +2 档为跨高档 */
    function priceTierGap(price, originPrice) {
      const tiers = Array.from(new Set(Object.values(TEACHER_PRICES))).sort((a, b) => a - b);
      return tiers.indexOf(Number(price)) - tiers.indexOf(Number(originPrice));
    }

    function isCrossHigh(price, originPrice) {
      return priceTierGap(price, originPrice) >= 2;
    }

    function priceSortRank(price, originPrice) {
      const gap = priceTierGap(price, originPrice);
      if (gap === 0) return 0;
      if (gap === -1) return 1;
      if (gap === 1) return 2;
      return 3 + Math.abs(gap);
    }

    function priceDiffLabel(price, originPrice) {
      const gap = priceTierGap(price, originPrice);
      if (gap === 0) return { label: '同价位', gap, dir: 0 };
      if (gap >= 2) return { label: '跨高档', gap, dir: 1 };
      if (gap <= -2) return { label: '低两档', gap, dir: -1 };
      return { label: gap > 0 ? '高一档' : '低一档', gap, dir: gap > 0 ? 1 : -1 };
    }

      return !!lesson && (lesson.group === true || lesson.type === 'group');
    }

    function isClosedLesson(lesson) {
      return !!lesson && ['COMPLETED', 'COMPENSATED'].includes(lesson.status);
    }

    function cellPairOf(lesson) {
      if (!lesson || isGroupLesson(lesson) || isClosedLesson(lesson)) return null;
      const other = state.lessons.find((item) => item.id !== lesson.id
        && item.studentKey === lesson.studentKey
        && item.teacher === lesson.teacher
        && item.date === lesson.date
        && item.type === lesson.type
        && isActiveLesson(item));
      if (!other) return null;
      const ordered = lesson.time < other.time ? [lesson, other] : [other, lesson];
      if (addMinutes(ordered[0].time, 30) !== ordered[1].time) return null;
      return ordered;
    }

    function cellScopeLessons(lesson) {
      const pair = cellPairOf(lesson);
      if (!pair || !state.cellScope.nextSelected) return [lesson];
      const other = pair.find((item) => item.id !== lesson.id);
      return other ? [lesson, other] : [lesson];
    }

    function cellScopeIds(lesson) {
      return cellScopeLessons(lesson).map((item) => item.id);
    }

    function scopeRangeLabel(lessons) {
      if (!lessons.length) return '';
      const first = lessons.slice().sort((a, b) => a.time.localeCompare(b.time))[0];
      const last = lessons.slice().sort((a, b) => a.time.localeCompare(b.time))[lessons.length - 1];
      if (lessons.length === 1 && isGroupLesson(first)) return `${first.time} - ${endTime(first.time, 60)} · 连续双格`;
      return lessons.length > 1
        ? `${first.time} - ${endTime(last.time)} · 共 ${lessons.length} 节`
        : `${first.time} - ${endTime(first.time)} · 1 节`;
    }

    function lessonStudentLabel(lesson) {
      if (!lesson) return '';
      if (isGroupLesson(lesson)) return lesson.student;
      const student = studentByKey(lesson.studentKey);
      return student.nickname || lesson.student;
    }

    function sortedLessons(list) {
      return list.slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    }

    function recordAgeDays(ts) {
      return Math.round((isoToTs(TODAY) - isoToTs(ts.slice(0, 10))) / 86400000);
    }

    function recordTimeLabel(ts) {
      const date = ts.slice(0, 10);
      const time = ts.slice(11, 16);
      if (date === TODAY) return `今天 ${time}`;
      const yesterday = addIsoDays(TODAY, -1);
      if (date === yesterday) return `昨天 ${time}`;
      return `${date.slice(5)} ${time}`;
    }

    function addIsoDays(iso, days) {
      const ms = isoToTs(iso) + days * 86400000;
      return new Date(ms).toISOString().slice(0, 10);
    }

    function weekIndexFor(iso) {
      const diff = Math.floor((isoToTs(iso) - isoToTs('2026-11-09')) / 86400000 / 7);
      return Math.min(3, Math.max(0, diff));
    }

    function recordMonitors() {
      const counts = {};
      state.records.forEach((rec) => {
        counts[rec.operator] = (counts[rec.operator] || 0) + 1;
      });
      return Object.keys(counts)
        .map((name) => ({ name, count: counts[name] }))
        .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
    }

    function filteredRecords() {
      let list = state.records.slice();
      if (state.role === 'monitor') list = list.filter((rec) => rec.operator === 'Leo');
      if (state.role === 'admin' && state.recordsMonitor !== 'ALL') {
        list = list.filter((rec) => rec.operator === state.recordsMonitor);
      }
      if (state.recordsRange !== 'all') {
        const maxAge = state.recordsRange === '7' ? 7 : 30;
        list = list.filter((rec) => recordAgeDays(rec.ts) < maxAge);
      }
      if (state.recordsType !== 'ALL') {
        list = list.filter((rec) => rec.type === state.recordsType);
      }
      return list.sort((a, b) => b.ts.localeCompare(a.ts));
    }

    /* ------------------------------------------------------------------
     * 同师挪位：目标时段与防撞课
     * ------------------------------------------------------------------ */
    function buildTargets(lesson) {
      const origin = originTeacherOf(lesson);
      const pool = TEACHER_TARGETS[origin] || TEACHER_TARGETS['David Miller'];
      return pool.filter((t) => !(t.date === lesson.date && t.time === lesson.time)).map((target) => {
        const conflict = studentConflictAt(lesson, target.date, target.time, [lesson.id]);
        return { ...target, conflict: conflict ? '学员该时段已有其他课程' : '' };
      });
    }

    function studentHasConflictAt(studentKey, date, time, excludeIds = []) {
      if (!studentKey) return false;
      return state.lessons.some((other) => !excludeIds.includes(other.id)
        && other.studentKey === studentKey
        && other.date === date
        && other.time === time
        && ['SCHEDULED', 'SUBSTITUTED', 'LEAVE_PENDING'].includes(other.status));
    }

    function studentConflictAt(lesson, date, time, excludeIds = []) {
      if (!lesson.studentKey) return null;
      return state.lessons.find((other) => !excludeIds.includes(other.id)
        && other.id !== lesson.id
        && other.studentKey === lesson.studentKey
        && other.date === date
        && other.time === time
        && ['SCHEDULED', 'SUBSTITUTED', 'LEAVE_PENDING'].includes(other.status)) || null;
    }

    function buildPairTargets(lesson, other) {
      const origin = originTeacherOf(lesson);
      const pool = TEACHER_TARGETS[origin] || TEACHER_TARGETS['David Miller'];
      const current = new Set([`${lesson.date} ${lesson.time}`, `${other.date} ${other.time}`]);
      const excludeIds = [lesson.id, other.id];
      return pool.filter((target) => {
        if (current.has(`${target.date} ${target.time}`)) return false;
        return !!pool.find((item) => item.date === target.date && item.time === addMinutes(target.time, 30));
      }).map((target) => {
        const secondTime = addMinutes(target.time, 30);
        const conflict = studentConflictAt(lesson, target.date, target.time, excludeIds)
          || studentConflictAt(lesson, target.date, secondTime, excludeIds);
        return { ...target, secondTime, conflict: conflict ? '学员该时段已有其他课程' : '' };
      });

          const rankA = priceSortRank(a.price, originPrice);
          const rankB = priceSortRank(b.price, originPrice);
          if (rankA !== rankB) return rankA - rankB;
          return a.load - b.load;
        });

          if (rankA !== rankB) return rankA - rankB;
          return a.load - b.load;
        });

    function leaveAffectedLessons(selectedKeys) {
      const seen = {};
      const list = [];
      (selectedKeys || []).forEach((key) => {
        const slot = TEACHER_LEAVE_SLOTS.find((item) => item.key === key);
        if (!slot || !slot.lessonId) return;
        const lesson = lessonById(slot.lessonId);
        if (!lesson || isGroupLesson(lesson) || seen[lesson.studentKey]) return;
        seen[lesson.studentKey] = true;
        list.push(lesson);
      });
      return list;
    }

    function leaveAffectedGroupLessons(selectedKeys) {
      const seen = {};
      const list = [];
      (selectedKeys || []).forEach((key) => {
        const slot = TEACHER_LEAVE_SLOTS.find((item) => item.key === key);
        if (!slot || !slot.lessonId) return;
        const lesson = lessonById(slot.lessonId);
        if (!lesson || !isGroupLesson(lesson) || seen[lesson.id]) return;
        seen[lesson.id] = true;
        list.push(lesson);
      });
      return list;
    }

    function ensureTeacherLeaveHandovers() {
      if (!state.teacherLeave) return;
      const next = {};
      leaveAffectedLessons(state.teacherLeave.selected).forEach((lesson) => {
        const existing = state.teacherLeave.handovers[lesson.studentKey];
        const base = STUDENT_HANDOVER[lesson.studentKey] || {};
        next[lesson.studentKey] = {
          courseware: (existing && existing.courseware) || base.courseware || '',
          level: (existing && existing.level) || base.level || '',
          progress: existing && typeof existing.progress === 'string' ? existing.progress : (base.progress || ''),
          note: existing && typeof existing.note === 'string' ? existing.note : (base.note || '')
        };
      });
      if (leaveAffectedGroupLessons(state.teacherLeave.selected).length) {
        const existingGroup = state.teacherLeave.handovers[GROUP_HANDOVER_KEY];
        next[GROUP_HANDOVER_KEY] = {
          courseware: (existingGroup && existingGroup.courseware) || CLASS_HANDOVER.courseware || '',
          level: (existingGroup && existingGroup.level) || CLASS_HANDOVER.level || '',
          progress: existingGroup && typeof existingGroup.progress === 'string' ? existingGroup.progress : (CLASS_HANDOVER.progress || '')
        };
      }
      state.teacherLeave.handovers = next;
    }

      state.teacherLeave = {
        selected: TEACHER_LEAVE_SLOTS.filter((slot) => slot.lessonId).map((slot) => slot.key),

        noteOpen: {}

    function submitTeacherLeave() {
      if (!guardWrite()) return;
      const draft = state.teacherLeave;
      if (!draft) return;
      if (!draft.selected.length) return showToast('请至少勾选 1 个请假时段', true);
      if (!draft.reason.trim()) return showToast('请填写请假原因', true);
      ensureTeacherLeaveHandovers();
      const affected = leaveAffectedLessons(draft.selected);
      const affectedGroups = leaveAffectedGroupLessons(draft.selected);
      affected.forEach((lesson) => {
        const handover = draft.handovers[lesson.studentKey];
        if (!handover) return;
        STUDENT_HANDOVER[lesson.studentKey] = {
          courseware: handover.courseware,
          level: handover.level,
          progress: handover.progress || '',
          note: handover.note,
          updatedAt: '11-10 21:05',
          by: 'David Miller',
          fresh: true
        };
      });
      const groupHandover = draft.handovers[GROUP_HANDOVER_KEY];
      if (affectedGroups.length && groupHandover) {
        CLASS_HANDOVER.courseware = groupHandover.courseware || CLASS_HANDOVER.courseware;
        CLASS_HANDOVER.level = groupHandover.level || CLASS_HANDOVER.level;
        CLASS_HANDOVER.progress = groupHandover.progress || '';
        CLASS_HANDOVER.updatedAt = '11-10 21:05';
        CLASS_HANDOVER.by = 'David Miller';
      }
      affectedGroups.forEach((lesson) => {
        addRecord({
          type: 'leave',
          action: '代老师请假',
          groupName: lesson.student,
          classId: lesson.classId || groupIdForName(lesson.student),
          lessonDate: lesson.date,
          timeLabel: `${lesson.time}-${endTime(lesson.time, 60)}`,
          from: '已排课',
          to: '已请假 · 待代课',
          owner: 'David Miller',
          reason: draft.reason.trim(),
          ts: '2026-11-10T21:05'
        });
      });
      draft.selected.forEach((key) => {
        const slot = TEACHER_LEAVE_SLOTS.find((item) => item.key === key);
        if (!slot || !slot.lessonId) return;
        const lesson = lessonById(slot.lessonId);
        if (!lesson) return;
        lesson.leaveReason = draft.reason.trim();
        if (isActiveLesson(lesson)) lesson.status = 'LEAVE_PENDING';
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.teacherLeave = null;
      state.cellView = 'main';
      renderAll();
      showToast('已提交请假 · 已按时间窗通知负责班长/主理人与受影响家长；空闲格未发通知');
    }

    function appendProgressChip(key, text) {
      if (!state.teacherLeave || !state.teacherLeave.handovers[key]) return;
      const handover = state.teacherLeave.handovers[key];
      const current = handover.progress || '';
      const next = current.trim() ? `${current.replace(/\s+$/, '')}\n${text}` : text;
      handover.progress = next.slice(0, NOTE_MAX);
      const textarea = Array.from(document.querySelectorAll('[data-handover-progress]'))
        .find((node) => node.dataset.handoverProgress === key);
      if (textarea) {
        textarea.value = handover.progress;
        syncNoteCounter(textarea);
      }
    }

            const subbed = lesson.status === 'SUBSTITUTED';
            const pending = lesson.status === 'PENDING';
            return `<article class="box-border w-full rounded-2xl border ${state.hours < 3 ? 'border-rose-200 border-l-4 border-l-rose-600 bg-rose-50/80' : 'border-slate-300 bg-slate-50/70'} p-3">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <div class="text-[14px] font-bold text-slate-900">${esc(item.title)}</div>
                  <div class="mt-0.5 text-[12px] font-medium text-slate-600">原任老师 David Miller · 原负责班长 Amy · ${item.group ? '主理人/班长应急调度' : subbed ? `已指派 ${esc(lesson.subTeacher)} 代课` : pending ? '已退回待排期' : '待应急调度'}</div>
                </div>
                ${state.hours < 3 ? chip('临期 <3h', 'rose') : subbed ? chip('已代课', 'purple') : pending ? chip('已退回', 'slate') : chip('待调度', 'amber')}
              </div>
              ${item.handover ? `<div class="mt-2 rounded-xl border border-slate-200 bg-white px-2.5 py-2 text-[12px]">
                <div class="font-semibold text-slate-800">在学课件：${esc(item.handover.courseware)} · ${esc(item.handover.level)}</div>
                ${item.handover.progress ? `<div class="mt-0.5 line-clamp-1 font-medium text-slate-700">进度备注：${esc(noteSummary(item.handover.progress))}</div>` : ''}
                ${item.group ? '' : `<div class="mt-0.5 line-clamp-1 font-medium text-slate-600">学生备注：${esc(noteSummary(item.handover.note) || '—')}</div>`}
              </div>` : ''}
              <div class="mt-2.5 flex flex-wrap gap-1.5">
                ${item.group
                  ? `<button data-action="pack-group-assign" data-id="${item.id}" class="h-7 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 hover:bg-indigo-100/70">指派代课</button>
                     <button data-action="cell-group-pause" data-id="${item.id}" class="h-7 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-50">暂停待排</button>`
                  : `<button data-action="pack-assign" data-id="${item.id}" data-scope="${item.ids.join(',')}" class="h-7 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 hover:bg-indigo-100/70">指派代课</button>
                     <button data-action="pack-leave" data-id="${item.id}" data-scope="${item.ids.join(',')}" class="h-7 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-50">退回待排期</button>
                     <button data-action="pack-reschedule" data-id="${item.id}" data-scope="${item.ids.join(',')}" class="h-7 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-50">同师代挪位</button>`}
              </div>
            </article>`;
          }).join('')}
        </div>
        <div class="mt-3 rounded-xl border border-slate-200 bg-white px-3 py-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-bold text-slate-900">请假申请单 · 部分销假 / 部分代课混态</span>
            ${chip('已关闭', 'slate')}
          </div>
          <div class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">最后一节挂起课次离池（代课指派 / 退回待排 / 同师平移 / 小班暂停 / 超时释放 / 单节销假恢复）后申请单自动收口为 <span class="font-bold text-slate-900">已关闭</span>；全量 100% 销假才入「已销假撤销」，部分销假的单节异常独立置为「已销假撤销」且不计非常规频次。</div>
        </div>
        <div class="mt-2 rounded-xl border border-sky-200 bg-sky-50/70 px-3 py-2.5">
          <div class="text-[12px] font-bold text-sky-900">${icon('timer-off', 'mr-1 inline h-3.5 w-3.5 align-[-2px]')}课程结束超时自动释放</div>
          <div class="mt-1 text-[12px] font-medium leading-relaxed text-slate-700">到原定课程结束时间仍无人处理：定时任务自动将挂起 TS 退回「待排期」（保留资金持有人与价位），向 1v1 家长发 M4 站内中性卡（<span class="font-bold">不发 Email</span>），对原任老师亦不发 Email；绝不自动结课扣费或发薪。</div>
        </div>
        <button data-action="close-overlay" class="mt-4 h-11 w-full rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800">关闭</button>
      `);
    }

    /* ------------------------------------------------------------------
     * 老师端授课历史（跨周已结课课次 + 教学备注补录）
     * ------------------------------------------------------------------ */
    const HISTORY_QUICK_RANGES = [
      { key: 'week', label: '本周' },
      { key: 'last-week', label: '上周' },
      { key: 'month', label: '本月' },
      { key: 'last-month', label: '上月' }
    ];

    const HISTORY_TYPE_FILTERS = [
      { key: 'ALL', label: '全部' },
      { key: 'normal', label: '正常结课' },
      { key: 'sub_in', label: '🟣 代上课' },
      { key: 'sub_out', label: '🔵 被代课' },
      { key: 'exception', label: '异常与取消' }
    ];

    function historyAgeDays(iso) {
      return Math.round((isoToTs(TODAY) - isoToTs(iso)) / 86400000);
    }

    function prevMonthKey(ym) {
      const [year, month] = ym.split('-').map(Number);
      return month === 1
        ? `${year - 1}-12`
        : `${year}-${String(month - 1).padStart(2, '0')}`;
    }

    function nextMonthKey(ym) {
      const [year, month] = ym.split('-').map(Number);
      return month === 12
        ? `${year + 1}-01`
        : `${year}-${String(month + 1).padStart(2, '0')}`;
    }

    function monthKeyLabel(ym) {
      const parts = ym.split('-');
      return `${parts[0]}年${Number(parts[1])}月`;
    }

    function startOfWeekIso(iso) {
      const mondayOffset = (new Date(isoToTs(iso)).getUTCDay() + 6) % 7;
      return addIsoDays(iso, -mondayOffset);
    }

    function historyRangeWindow(range) {
      const currentMonth = TODAY.slice(0, 7);
      if (range === 'week') {
        const start = startOfWeekIso(TODAY);
        return { start, end: addIsoDays(start, 7), label: '本周' };
      }
      if (range === 'last-week') {
        const start = addIsoDays(startOfWeekIso(TODAY), -7);
        return { start, end: addIsoDays(start, 7), label: '上周' };
      }
      if (range === 'last-month') {
        const ym = prevMonthKey(currentMonth);
        return { start: `${ym}-01`, end: `${nextMonthKey(ym)}-01`, label: '上月' };
      }
      if (range && range.indexOf('month:') === 0) {
        const ym = range.slice(6);
        return { start: `${ym}-01`, end: `${nextMonthKey(ym)}-01`, label: monthKeyLabel(ym) };
      }
      return {
        start: `${currentMonth}-01`,
        end: `${nextMonthKey(currentMonth)}-01`,
        label: '本月'
      };
    }

    function recentHistoryMonths() {
      const months = [];
      let ym = TODAY.slice(0, 7);
      for (let index = 0; index < 12; index += 1) {
        months.push(ym);
        ym = prevMonthKey(ym);
      }
      return months;
    }

    function historySelectedMonth() {
      return state.historyRange.indexOf('month:') === 0 ? state.historyRange.slice(6) : null;
    }

    function historyStudentLabel(item) {
      if (item.groupName) return item.groupName;
      return studentByKey(item.studentKey).name;
    }

    function historyWindowLessons() {
      const win = historyRangeWindow(state.historyRange);
      return HISTORY_LESSONS.filter((item) => item.date >= win.start && item.date < win.end && item.date <= TODAY);
    }

    function historyAvailableStudentKeys() {
      const keys = [];
      historyWindowLessons().forEach((item) => {
        if (item.studentKey && keys.indexOf(item.studentKey) === -1) keys.push(item.studentKey);
      });
      return keys;
    }

    function ensureHistoryStudentValid() {
      if (state.historyStudent === 'ALL') return;
      if (historyAvailableStudentKeys().indexOf(state.historyStudent) === -1) state.historyStudent = 'ALL';
    }

    function historyStudentFilterLabel(key) {
      if (!key || key === 'ALL') return '全部学员';
      const student = studentByKey(key);
      return student.nickname || student.name;
    }

    function historyTypeMeta(item) {
      if (item.type === 'group') return { label: '[G] 小班', tone: 'teal' };
      if (item.type === 'fixed') return { label: '1v1 · 固定位', tone: 'amber' };
      if (item.type === 'temp') return { label: '1v1 · 临时课', tone: 'yellow' };
      return { label: '1v1', tone: 'slate' };
    }

    function historyStatusChip(item) {
      if (item.status === 'sub_in') return chip('🟣 代上课', 'purple');
      if (item.status === 'sub_out') return chip('🔵 被代课', 'blue');
      if (item.status === 'exception') return chip('异常与取消', 'rose');
      return chip('正常结课', 'emerald');
    }

    function filteredHistory() {
      const win = historyRangeWindow(state.historyRange);
      return HISTORY_LESSONS.filter((item) => {
        if (item.date < win.start || item.date >= win.end || item.date > TODAY) return false;
        if (state.historyStudent !== 'ALL' && item.studentKey !== state.historyStudent) return false;
        if (state.historyType !== 'ALL' && item.status !== state.historyType) return false;
        return true;
      });
    }

    function historySummary(list) {
      return list.reduce((acc, item) => {
        if (item.status === 'normal' || item.status === 'sub_in') acc.paid += 1;
        else if (item.status === 'sub_out') acc.subbed += 1;
        else acc.unpaid += 1;
        return acc;
      }, { paid: 0, subbed: 0, unpaid: 0 });
    }

    function historyMergeKey(item) {
      return [
        item.date,
        item.studentKey || item.groupName,
        item.type,
        item.status,
        item.teacher,
        item.originTeacher || ''
      ].join('|');
    }

    function mergeHistoryLessons(list) {
      const ascending = list.slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
      const cards = [];
      const lastCardByKey = {};
      ascending.forEach((item) => {
        const key = historyMergeKey(item);
        const prev = lastCardByKey[key];
        if (prev && prev.end === item.time) {
          prev.segments.push(item);
          prev.end = item.end;
          prev.completedAt = item.completedAt;
          prev.count = prev.segments.length;
          prev.id = item.id;
          prev.studentNote = item.studentNote;
          prev.progressNote = item.progressNote;
          return;
        }
        const card = {
          ...item,
          mergeKey: key,
          segments: [item],
          start: item.time,
          count: 1
        };
        cards.push(card);
        lastCardByKey[key] = card;
      });
      return cards.sort((a, b) => b.completedAt.localeCompare(a.completedAt) || b.start.localeCompare(a.start));
    }

    function historyCardPrimary(card) {
      return card.segments[card.segments.length - 1];
    }

    function historyNoteKey(item, noteType) {
      return `${item.id}:${noteType}`;
    }

    function historyNoteOf(item, noteType) {
      const key = historyNoteKey(item, noteType);
      if (Object.prototype.hasOwnProperty.call(state.historyNotes, key)) return state.historyNotes[key];
      return noteType === 'progress' ? item.progressNote : item.studentNote;
    }

    function historyNoteEditable(item) {
      return item.status !== 'sub_out' && item.status !== 'exception';
    }

    function historyWeekNumber(iso) {
      const date = new Date(isoToTs(iso));
      const day = (date.getUTCDay() + 6) % 7;
      date.setUTCDate(date.getUTCDate() - day + 3);
      const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
      const firstDay = (firstThursday.getUTCDay() + 6) % 7;
      firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDay + 3);
      return 1 + Math.round((date - firstThursday) / 604800000);
    }

    function historySettlementMeta(item) {
      const week = historyWeekNumber(item.completedAt.slice(0, 10));
      if (item.settlementState === 'pending_week') {
        return { label: '待出周单', tone: 'amber', week, href: '' };
      }
      if (item.settlementState === 'unpaid') {
        return {
          label: `第 ${week} 周课酬单 · 待发薪`,
          tone: 'indigo',
          week,
          href: `m5b_weekly_settlement.html?role=david&tab=teacher&view=grid&week=${week}`
        };
      }
      if (item.settlementState === 'paid') {
        return {
          label: `第 ${week} 周课酬单 · 已打款`,
          tone: 'emerald',
          week,
          href: `m5b_weekly_settlement.html?role=david&tab=teacher&view=grid&week=${week}`
        };
      }
      return { label: '不计入课酬', tone: 'slate', week, href: '' };
    }

    function historySettlementBadge(item) {
      const meta = historySettlementMeta(item);
      if (meta.href) {
        return `<a href="${meta.href}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[12px] font-bold ${TONE[meta.tone]} transition hover:underline">${esc(meta.label)}${icon('external-link', 'h-3 w-3')}</a>`;
      }
      return chip(meta.label, meta.tone);
    }

    function historySummaryTile(label, value, iconName, tone) {
      const map = {
        emerald: 'text-emerald-700',
        blue: 'text-blue-700',
        rose: 'text-rose-700'
      };
      const accent = map[tone] || map.emerald;
      return `<div class="min-w-0 rounded-xl border border-slate-200 bg-white px-2 py-2">
        <div class="flex min-w-0 items-center gap-1 text-[12px] font-bold leading-tight text-slate-700">
          <span class="shrink-0 ${accent}">${icon(iconName, 'h-3.5 w-3.5')}</span>
          <span class="min-w-0 truncate">${esc(label)}</span>
        </div>
        <div class="mt-1 text-[18px] font-bold leading-none ${accent}">${value}<span class="ml-0.5 text-[12px] font-semibold text-slate-600">节</span></div>
      </div>`;
    }

    function historyTypePill(label, active, value) {
      return `<button data-action="history-type" data-value="${esc(value)}" class="h-8 shrink-0 whitespace-nowrap rounded-full px-3 text-[12px] transition ${active ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${esc(label)}</button>`;
    }

    function historyNoteRow(card, noteType) {
      const isProgress = noteType === 'progress';
      const label = isProgress ? '进度备注' : '学生备注';
      const primary = historyCardPrimary(card);
      const note = historyNoteOf(primary, noteType);
      const ids = card.segments.map((item) => item.id).join(',');
      return `<button data-action="history-note" data-ids="${esc(ids)}" data-note="${noteType}" class="flex w-full items-start gap-2 rounded-xl border border-slate-200 bg-white px-2.5 py-2 text-left transition hover:border-indigo-300 hover:bg-indigo-50/40 active:bg-indigo-50">
        <span class="mt-0.5 inline-flex shrink-0 items-center gap-1 rounded-md px-1.5 py-0.5 text-[12px] font-bold ring-1 ${isProgress ? 'bg-emerald-50 text-emerald-700 ring-emerald-100' : 'bg-indigo-50 text-indigo-700 ring-indigo-100'}">${icon(isProgress ? 'book-open' : 'pencil-line', 'h-3 w-3')}${label}</span>
        <span class="line-clamp-1 min-w-0 flex-1 text-[12px] font-medium leading-relaxed ${note ? 'text-slate-700' : 'text-slate-500'}">${esc(noteSummary(note) || '尚未补录，点击补充')}</span>
        <span class="mt-0.5 shrink-0 text-indigo-600">${icon('chevron-right', 'h-3.5 w-3.5')}</span>
      </button>`;
    }

    function renderHistoryCard(card) {
      const typeMeta = historyTypeMeta(card);
      const primary = historyCardPrimary(card);
      const completedDate = primary.completedAt.slice(5, 10);
      const completedTime = primary.completedAt.slice(11, 16);
      return `<article data-history-row="true" class="box-border w-full rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <div class="text-[14px] font-bold leading-snug text-slate-900">${fmtDate(card.date)} <span class="font-semibold text-slate-700">${esc(card.start)}-${esc(card.end)}</span></div>
            <div class="mt-0.5 text-[12px] font-medium text-slate-600">结课 ${esc(completedDate)} ${esc(completedTime)}</div>
          </div>
          ${card.count > 1 ? `<span class="shrink-0">${chip(`连上 ${card.count} 节`, 'indigo')}</span>` : ''}
        </div>

        <div class="mt-2 flex flex-wrap items-center gap-1.5">
          ${chip(typeMeta.label, typeMeta.tone)}
          ${historyStatusChip(card)}
          ${historySettlementBadge(card)}
          ${card.status === 'sub_out' ? `<span class="text-[12px] font-medium text-slate-600">原任 ${esc(card.originTeacher)}</span>` : ''}
        </div>

        <div class="mt-2 flex items-baseline justify-between gap-2">
          <div class="min-w-0 truncate text-[16px] font-bold text-slate-900">${esc(historyStudentLabel(card))}</div>
          <div class="shrink-0 text-[12px] font-medium text-slate-600">授课老师 <span class="font-semibold text-slate-800">${esc(card.teacher)}</span></div>
        </div>
        <div class="mt-0.5 truncate text-[12px] font-medium text-slate-600">${esc(card.courseware)}</div>

        <div class="mt-2 space-y-1.5">
          ${historyNoteRow(card, 'student')}
          ${historyNoteRow(card, 'progress')}
        </div>
      </article>`;
    }

    function renderHistoryPage() {
      const list = filteredHistory();
      const summary = historySummary(list);
      const cards = mergeHistoryLessons(list);
      const shown = cards.slice(0, state.historyLimit);
      const monthSelection = historySelectedMonth();
      const studentFiltered = state.historyStudent !== 'ALL';
      const hasFilter = studentFiltered || state.historyType !== 'ALL';
      const emptyTitle = hasFilter ? '当前筛选暂无授课记录' : '当前时间范围暂无授课记录';
      const emptyDesc = hasFilter ? '调整学员或履约类型，或重置筛选后再试。' : '切换其他时间范围查看更早课次。';
      return `<div class="space-y-3 p-3.5">
        <div class="grid grid-cols-3 gap-1.5 rounded-2xl border border-slate-300 bg-slate-50/70 p-2">
          ${historySummaryTile('计薪授课', summary.paid, 'circle-check-big', 'emerald')}
          ${historySummaryTile('被代课', summary.subbed, 'repeat-2', 'blue')}
          ${historySummaryTile('异常/未计薪', summary.unpaid, 'triangle-alert', 'rose')}
        </div>
        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-600">
          ${icon('badge-check', 'mr-1 inline h-3.5 w-3.5 align-[-2px] text-slate-500')}仅在职老师可见 · 已离职后入口自动收回，历史流水在平台端永久只读留存，恢复入职后可重新查阅。
        </div>

        <div class="space-y-2 rounded-2xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="flex items-center gap-2">
            <span class="w-11 shrink-0 text-[12px] font-semibold text-slate-600">时间</span>
            <div class="flex min-w-0 flex-1 items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
              ${HISTORY_QUICK_RANGES.map((item) => recordFilterPill(item.label, state.historyRange === item.key, 'history-range', item.key)).join('')}
              <button data-action="history-months" class="h-8 shrink-0 whitespace-nowrap rounded-full px-3 text-[12px] transition ${monthSelection ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${monthSelection ? monthKeyLabel(monthSelection) : '更多月份 ▾'}</button>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-11 shrink-0 text-[12px] font-semibold text-slate-600">学员</span>
            <div class="flex min-w-0 flex-1 items-center gap-1.5 py-0.5">
              <button type="button" data-action="history-students" class="flex shrink-0 items-center gap-1 rounded-full border px-2.5 py-1.5 text-[12px] font-medium transition ${studentFiltered ? 'border-indigo-500 bg-indigo-50/50 text-indigo-700' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}">
                <span class="max-w-[132px] truncate">${esc(historyStudentFilterLabel(state.historyStudent))}</span>
                <span class="shrink-0 ${studentFiltered ? 'text-indigo-600' : 'text-slate-500'}">${icon('chevron-down', 'h-3.5 w-3.5')}</span>
              </button>
            </div>
          </div>
          <div class="flex items-start gap-2">
            <span class="w-11 shrink-0 pt-1 text-[12px] font-semibold text-slate-600">类型</span>
            <div class="flex min-w-0 flex-1 items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
              ${HISTORY_TYPE_FILTERS.map((item) => historyTypePill(item.label, state.historyType === item.key, item.key)).join('')}
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between gap-2">
          <span class="text-[12px] font-semibold text-slate-600">共 ${list.length} 节 · ${cards.length} 张卡片 · 已显示 ${shown.length} 张</span>
          <span class="inline-flex shrink-0 items-center gap-1 text-[12px] font-medium text-slate-600">${icon('arrow-down-wide-narrow', 'h-3.5 w-3.5')}结课倒序</span>
        </div>

        ${shown.length ? `<div class="${cardGridClass()}">${shown.map(renderHistoryCard).join('')}</div>` : ''}

        ${!shown.length ? `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/60 px-5 py-7 text-center">
          <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-white text-slate-500 ring-1 ring-slate-200">${icon('history', 'h-5 w-5')}</div>
          <div class="mt-3 text-[14px] font-bold text-slate-900">${esc(emptyTitle)}</div>
          <div class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">${esc(emptyDesc)}</div>

    function openHistoryNote(idsRaw, noteType) {
      const ids = String(idsRaw || '').split(',').filter(Boolean);
      const segments = HISTORY_LESSONS.filter((item) => ids.includes(item.id));
      if (!segments.length) return;
      const type = noteType === 'progress' ? 'progress' : 'student';
      const primary = segments[segments.length - 1];
      state.historyNoteDraft = String(historyNoteOf(primary, type) || '').slice(0, NOTE_MAX);
      state.overlay = {
        type: 'historyNote',
        lessonIds: segments.map((item) => item.id),
        lessonId: primary.id,
        noteType: type,
        title: type === 'progress' ? '进度备注' : '学生备注'
      };
      renderAll();
    }

    function renderHistoryNoteSheet() {
      const overlay = state.overlay;
      const ids = overlay.lessonIds || [overlay.lessonId];
      const segments = HISTORY_LESSONS.filter((item) => ids.includes(item.id));
      const item = segments[segments.length - 1] || HISTORY_LESSONS.find((entry) => entry.id === overlay.lessonId);
      if (!item) return '';
      const isProgress = overlay.noteType === 'progress';
      const label = isProgress ? '进度备注' : '学生备注';
      const editable = segments.length ? segments.every(historyNoteEditable) : historyNoteEditable(item);
      const typeMeta = historyTypeMeta(item);
      const first = segments[0] || item;
      const last = segments[segments.length - 1] || item;
      const mergedLabel = segments.length > 1 ? ` · 连上 ${segments.length} 节` : '';
      const readonlyReason = item.status === 'sub_out'
        ? '这节课由实际授课老师记录，你可以查看，但不能在这里补录。'
        : '这节课没有实际开课，暂不能补录备注。';
      return sheetShell(`
        ${modalHeader(`${label}补录`, `${historyStudentLabel(item)} · ${fmtDate(first.date)} ${first.time}-${last.end}${mergedLabel}`)}
        <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50/70 px-3 py-2">
          ${infoRow('课型', typeMeta.label)}
          ${infoRow('授课老师', item.teacher)}
          ${infoRow('结课时间', `${first.date.slice(5)} ${last.completedAt.slice(11, 16)}`)}
          ${infoRow('结算归属', historySettlementMeta(item).label)}
        </div>
        <div class="mt-3 flex items-center justify-between gap-2">
          <label for="historyNoteInput" class="text-[12px] font-bold text-slate-800">${label}内容</label>
          <span class="text-[12px] font-medium text-slate-500">${isProgress ? '如 Unit 4 · Page 32' : '学情 / 注意事项'}</span>
        </div>
        <textarea id="historyNoteInput" rows="5" maxlength="2000" data-note-counter="true" ${editable ? '' : 'readonly'} placeholder="${isProgress ? '填写当前在学课件进度，如 Unit 4 · Page 32' : '填写课后学情、发音或注意力提醒'}" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-[16px] font-medium leading-relaxed outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15 ${editable ? 'bg-slate-50/70 text-slate-900' : 'bg-slate-100 text-slate-600'}">${esc(state.historyNoteDraft)}</textarea>
        ${noteCounter('historyNoteInput', state.historyNoteDraft)}
        <div class="mt-2 rounded-xl border px-3 py-2.5 ${editable ? 'border-emerald-200 bg-emerald-50/60 text-emerald-900' : 'border-slate-200 bg-slate-50 text-slate-600'}">
          <div class="flex items-start gap-2">
            <span class="mt-0.5 shrink-0">${icon(editable ? 'circle-check' : 'lock', 'h-4 w-4')}</span>
            <div class="min-w-0 text-[12px] font-medium leading-relaxed">${editable ? '保存后只更新这条备注，不会影响已完成的课次和课酬。' : esc(readonlyReason)}</div>
          </div>
        </div>
        <div class="mt-4 flex gap-2">
          ${editable
            ? `<button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800">取消</button>
               <button data-action="save-history-note" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white active:scale-[0.98] disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">保存备注</button>`
            : `<button data-action="close-overlay" class="h-11 w-full rounded-xl bg-slate-900 text-[14px] font-semibold text-white">关闭</button>`}
        </div>
      `);
    }

    function saveHistoryNote() {
      if (!guardWrite()) return;
      const overlay = state.overlay;
      if (!overlay || overlay.type !== 'historyNote') return;
      const ids = overlay.lessonIds || [overlay.lessonId];
      const segments = HISTORY_LESSONS.filter((item) => ids.includes(item.id));
      if (!segments.length) return;
      if (!segments.every(historyNoteEditable)) {
        showToast('这节课暂不能补录备注', true);
        return;
      }
      segments.forEach((item) => {
        state.historyNotes[historyNoteKey(item, overlay.noteType)] = state.historyNoteDraft.trim().slice(0, NOTE_MAX);
      });
      state.overlay = null;
      state.historyNoteDraft = '';
      renderAll();
      showToast(`${overlay.noteType === 'progress' ? '进度备注' : '学生备注'}已保存`);
    }

      else if (type === 'softConfirm') el.innerHTML = renderSoftConfirm();
      else if (type === 'studentLeaveChoice') el.innerHTML = renderStudentLeaveChoice();
      else if (type === 'changeStudent') el.innerHTML = renderChangeStudentSheet();
      else if (type === 'assignSub') el.innerHTML = renderAssignSubSheet();
      else if (type === 'emergencyPack') el.innerHTML = renderEmergencyPackSheet();
      else if (type === 'cellSheet') el.innerHTML = renderCellSheet();
      else if (type === 'classPause') el.innerHTML = renderClassPauseSheet();
      else if (type === 'teacherLeave') el.innerHTML = renderTeacherLeaveSheet();
      else if (type === 'handoverCourseware') el.innerHTML = renderHandoverCoursewareSheet();
      else if (type === 'historyNote') el.innerHTML = renderHistoryNoteSheet();
      else if (type === 'historyMonths') el.innerHTML = renderHistoryMonthSheet();
      else if (type === 'historyStudents') el.innerHTML = renderHistoryStudentSheet();
      else if (type === 'historyRules') el.innerHTML = renderHistoryRulesSheet();
      else el.innerHTML = '';
      if (window.lucide) lucide.createIcons();
    }

    function modalShell(content, width = 'max-w-[360px]') {
      return `<div class="absolute inset-x-0 bottom-0 top-16 z-50">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-4 top-1/2 mx-auto ${width} max-h-[90%] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl">
          ${content}
        </div>
      </div>`;
    }

    function sheetShell(content) {
      return `<div class="absolute inset-x-0 bottom-0 top-16 z-50">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 mx-auto flex max-h-[92%] w-full max-w-[560px] flex-col overflow-y-auto rounded-t-3xl bg-white p-5 shadow-2xl">
          <div class="mx-auto mb-3 h-1 w-10 shrink-0 rounded-full bg-slate-200"></div>
          ${content}
        </div>
      </div>`;
    }

    function modalHeader(title, subtitle = '') {
      return `<div class="flex items-start justify-between gap-3">
        <div class="flex min-w-0 items-start gap-2.5">
          <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-indigo-100 text-indigo-700">${icon('calendar-range', 'h-4 w-4')}</div>
          <div class="min-w-0">
            <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
            ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
          </div>
        </div>
        <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 角色与页面切换
     * ------------------------------------------------------------------ */
    function setRole(role, options = {}) {
      if (!ROLE_META[role]) return;
      state.role = role;
      state.page = defaultPage(role);
      state.overlay = null;
      state.returnOverlay = null;
      state.picker = null;
      state.changeStudent = null;
      state.assignSub = null;
      state.classDraft = null;
      state.teacherLeave = null;
      state.cellView = 'main';
      state.cellScope = { lessonId: null, nextSelected: true };
      state.cellReason = '';
      state.recordsRange = '7';
      state.recordsType = 'ALL';
      state.recordsMonitor = 'ALL';
      state.recordsLimit = 20;
      state.recordsExpanded = false;
      state.historyRange = 'month';
      state.historyStudent = 'ALL';
      state.historyType = 'ALL';
      state.historyLimit = 20;
      state.historyNoteDraft = '';
      state.scenario = options.scenario || '';
      if (!options.silent) renderAll({ resetScroll: true });
    }

    function navTo(page) {
      const item = navItems().find((n) => n.id === page);
      if (!item) return;
      state.page = page;
      state.overlay = null;
      state.returnOverlay = null;
      state.picker = null;
      state.changeStudent = null;
      state.assignSub = null;
      state.classDraft = null;
      state.teacherLeave = null;
      state.cellView = 'main';
      state.cellScope = { lessonId: null, nextSelected: true };
      state.cellReason = '';
      state.recordsLimit = 20;
      state.scenario = '';
      renderAll({ resetScroll: true });
    }

    function overlayBack() {
      if (state.overlay && state.overlay.type === 'cellSheet' && state.cellView !== 'main') {
        state.cellView = 'main';
        renderOverlay();
        return;
      }
      closeOverlay();
    }

    function closeOverlay() {
      if (state.overlay && state.overlay.type === 'softConfirm') return cancelSoft();
      if (state.overlay && state.overlay.type === 'studentLeaveChoice') return cancelStudentLeaveChoice();
      if (state.overlay && state.overlay.type === 'handoverCourseware') {
        state.overlay = state.returnOverlay || { type: 'teacherLeave' };
        state.returnOverlay = null;
        renderAll();
        return;
      }
      state.overlay = null;
      state.returnOverlay = null;
      state.picker = null;
      state.changeStudent = null;
      state.assignSub = null;
      state.classDraft = null;
      state.teacherLeave = null;
      state.cellView = 'main';
      state.cellScope = { lessonId: null, nextSelected: true };
      state.cellReason = '';
      renderAll();
    }

    function openReschedule(lessonId, taskId = null, scopeIds = null) {
      const scope = scopeIds && scopeIds.length ? scopeIds : [lessonId];
      state.picker = { lessonId, taskId, selectedKey: null, scopeIds: scope };
      state.overlay = { type: 'reschedule', lessonId, taskId };
      renderAll();
    }

    function openChangeStudent(lessonId, scopeIds = null) {
      const scope = scopeIds && scopeIds.length ? scopeIds : [lessonId];
      state.changeStudent = { lessonId, lessonIds: scope, query: '', selected: null, note: '', agreed: false };
      state.overlay = { type: 'changeStudent', lessonId };
      renderAll();
    }

    function openAssignSub({ lessonId = null, lessonIds = null, cell = false }) {
      const resolvedScope = lessonIds && lessonIds.length
        ? lessonIds.filter(Boolean)
        : lessonId ? [lessonId] : [];
      state.assignSub = { lessonId, lessonIds: resolvedScope, selected: null, cell, query: '', responsibility: '', crossReason: '' };
      state.overlay = { type: 'assignSub', lessonId };
      renderAll();
    }

    function openClassPause(lessonId = null) {
      state.classDraft = { selected: null, lessonId };
      state.overlay = { type: 'classPause' };
      renderAll();
    }

    function openCellSheet(lessonId) {
      state.cellView = 'main';
      state.cellScope = { lessonId, nextSelected: true };
      state.cellReason = '';
      state.overlay = { type: 'cellSheet', lessonId };
      renderAll();
    }

    function openCellAssignPanel(lesson) {
      if (isGroupLesson(lesson)) {
        state.classDraft = { selected: null, lessonId: lesson.id };
        state.cellView = 'group';
      } else {
        state.assignSub = {
          lessonId: lesson.id,
          lessonIds: cellScopeIds(lesson),
          taskId: null,
          selected: null,
          cell: true,
          query: ''
        };
        state.cellView = 'assign';
      }
      renderOverlay();
    }

    function closeCellSheet(message = '') {
      state.overlay = null;
      state.returnOverlay = null;
      state.cellView = 'main';
      state.cellScope = { lessonId: null, nextSelected: true };
      state.assignSub = null;
      state.cellReason = '';
      renderAll();
      if (message) showToast(message);
    }

    function withdrawLessons(lesson) {
      if (!guardWrite()) return;
      const reason = state.cellReason.trim();
      if (!reason) return showToast('请填写处置原因（至少 1 个非空字符）', true);
      const ids = cellScopeIds(lesson);
      ids.forEach((id) => {
        const item = lessonById(id);
        if (!item) return;
        item.status = 'PENDING';
        item.subTeacher = null;
        addRecord({
          type: 'exception',
          action: '撤排退回课次',
          studentKey: isGroupLesson(item) ? null : item.studentKey,
          studentName: isGroupLesson(item) ? '' : item.student,
          groupName: isGroupLesson(item) ? item.student : '',
          classId: isGroupLesson(item) ? groupIdForName(item.student) : null,
          lessonDate: item.date,
          timeLabel: `${item.time}-${endTime(item.time)}`,
          from: '已排课',
          to: '退回待排期',
          owner: originTeacherOf(item),
          reason,
          lastMinute: state.hours < 3
        });
      });
      closeCellSheet(`已撤排退回课次${ids.length > 1 ? `（共 ${ids.length} 节）` : ''} · 课格已释放`);
    }

    function compensateLesson(lesson) {
      if (!guardWrite()) return;
      if (lesson.settled === true) {
        showToast('该课次已完成归集，不可回退补生', true);
        return;
      }
      const reason = state.cellReason.trim();
      if (!reason) return showToast('请填写处置原因（至少 1 个非空字符）', true);
      const hadSub = !!lesson.subTeacher;
      lesson.status = 'COMPENSATED';
      lesson.exception = '异常未上课回退补生';
      lesson.makeupTs = 1;
      if (hadSub) {
        lesson.subOrderStatus = '已取消（异常未上课回退撤销）';
        addRecord({
          type: 'sub',
          action: '代课工单取消',
          studentKey: isGroupLesson(lesson) ? null : lesson.studentKey,
          studentName: isGroupLesson(lesson) ? '' : lesson.student,
          groupName: isGroupLesson(lesson) ? lesson.student : '',
          classId: isGroupLesson(lesson) ? groupIdForName(lesson.student) : null,
          lessonDate: lesson.date,
          timeLabel: `${lesson.time}-${endTime(lesson.time, isGroupLesson(lesson) ? 60 : 30)}`,
          from: '已履约',
          to: '已取消（异常未上课回退撤销）',
          owner: originTeacherOf(lesson),
          reason: `异常未上课回退补生同事务撤销代课工单；${lesson.subTeacher} 该节已在 M5B 剔除，原 TS 作废并补生 1 节`,
          lastMinute: false
        });
      }
      addRecord({
        type: 'exception',
        action: '异常未上课回退补生',
        studentKey: isGroupLesson(lesson) ? null : lesson.studentKey,
        studentName: isGroupLesson(lesson) ? '' : lesson.student,
        groupName: isGroupLesson(lesson) ? lesson.student : '',
        classId: isGroupLesson(lesson) ? groupIdForName(lesson.student) : null,
        lessonDate: lesson.date,
        timeLabel: `${lesson.time}-${endTime(lesson.time)}`,
        from: '已结课',
        to: '作废原课次 · 补生 1 节',
        owner: originTeacherOf(lesson),
        reason,
        lastMinute: state.hours < 3
      });
      closeCellSheet(hadSub ? '已回退补生 · 代课工单同事务置为已取消（异常未上课回退撤销），补生 1 节待排课次' : '已回退补生 · 原课次作废，原单补生 1 节待排课次');
    }

    function markAttendance(kind) {
      if (!guardWrite()) return;
      const reason = state.cellReason.trim();
      if (!reason) return showToast('请填写处置原因（至少 1 个非空字符）', true);
      const lesson = lessonById(state.overlay.lessonId);
      if (!lesson) return;
      const ids = cellScopeIds(lesson);
      let subbed = false;
      ids.forEach((id) => {
        const item = lessonById(id);
        if (!item) return;
        const actualTeacher = item.subTeacher || item.teacher;
        const inSub = !!item.subTeacher && (item.status === 'SUBSTITUTED' || item.status === 'COMPLETED');
        const crossNote = inSub ? `；代课态归属实际代课老师 ${actualTeacher}，原任 ${originTeacherOf(item)} 保持 0 节` : '';
        if (kind === 'student_absent') {
          item.status = 'COMPLETED';
          item.exception = '学员旷课';
          item.studentDeducted = 1;
          if (item.settled === undefined) item.settled = false;
          addRecord({
            type: 'exception',
            action: '学员旷课',
            studentKey: item.studentKey,
            studentName: item.student,
            lessonDate: item.date,
            timeLabel: `${item.time}-${endTime(item.time)}`,
            from: '已排课',
            to: '学员旷课 · 扣 1 节',
            owner: actualTeacher,
            reason: reason + crossNote,
            lastMinute: state.hours < 3
          });
        } else if (kind === 'teacher_late' || kind === 'teacher_early') {
          const isLate = kind === 'teacher_late';
          item.status = 'COMPLETED';
          item.exception = isLate ? '老师迟到' : '老师早退';
          item.makeupTs = 0;
          if (item.settled === undefined) item.settled = false;
          addRecord({
            type: 'exception',
            action: isLate ? '老师迟到' : '老师早退',
            studentKey: item.studentKey,
            studentName: item.student,
            lessonDate: item.date,
            timeLabel: `${item.time}-${endTime(item.time)}`,
            from: '已排课',
            to: isLate ? '正常结课 · 迟到留痕' : '正常结课 · 早退留痕',
            owner: actualTeacher,
            reason: reason + crossNote,
            lastMinute: state.hours < 3
          });
        } else {
          item.status = 'PENDING';
          item.exception = '老师旷课';
          item.makeupTs = 1;
          if (inSub) {
            subbed = true;
            item.subOrderStatus = '已取消（代课老师旷课退回）';
            addRecord({
              type: 'sub',
              action: '代课工单取消',
              studentKey: item.studentKey,
              studentName: item.student,
              lessonDate: item.date,
              timeLabel: `${item.time}-${endTime(item.time)}`,
              from: '已指派',
              to: '已取消（代课老师旷课退回）',
              owner: originTeacherOf(item),
              reason: `代课态【老师旷课】记入 ${actualTeacher}；原 TS 保留原价位档位/单节实付快照/资金持有人退回待排池，M5A 暂不归集`,
              lastMinute: state.hours < 3
            });
          }
          addRecord({
            type: 'exception',
            action: '老师旷课',
            studentKey: item.studentKey,
            studentName: item.student,
            lessonDate: item.date,
            timeLabel: `${item.time}-${endTime(item.time)}`,
            from: '已排课',
            to: '退回待排期 · 补生 1 节',
            owner: actualTeacher,
            reason: reason + crossNote,
            lastMinute: state.hours < 3
          });
        }
      });
      const toastMap = {
        student_absent: '已标为学员旷课 · 实际授课老师课酬正常计入',
        teacher_absent: subbed ? '已标为老师旷课 · 已退回待排期并取消代课工单' : '已标为老师旷课 · 已退回待排期并补生 1 节',
        teacher_late: '已标记老师迟到 · 课次正常结课并计入课酬',
        teacher_early: '已标记老师早退 · 课次正常结课并计入课酬'
      };
      closeCellSheet(toastMap[kind] || '考勤标记已更新');
    }

    function restoreNormalAttendance(lesson) {
      if (!guardWrite()) return;
      const reason = state.cellReason.trim();
      if (!reason) return showToast('请填写处置原因（至少 1 个非空字符）', true);
      const ids = cellScopeIds(lesson);
      ids.forEach((id) => {
        const item = lessonById(id);
        if (!item) return;
        const previousException = item.exception || '异常标记';
        const actualTeacher = item.subTeacher || item.teacher;
        const inSub = !!item.subTeacher;
        item.status = 'COMPLETED';
        item.exception = null;
        item.makeupTs = 0;
        addRecord({
          type: 'exception',
          action: '恢复为正常出勤',
          studentKey: item.studentKey,
          studentName: item.student,
          lessonDate: item.date,
          timeLabel: `${item.time}-${endTime(item.time)}`,
          from: previousException,
          to: '正常出勤',
          owner: actualTeacher,
          reason: reason + (inSub ? `；代课态纠偏撤销 ${actualTeacher} 名下异常，B 恢复 1 节、A 保持 0 节，同步知会 B 负责班长` : ''),
          lastMinute: false
        });
      });
      closeCellSheet('已恢复为正常出勤 · 出勤明细已同步');
    }

    /* ------------------------------------------------------------------
     * 家长 / 班长课格动作
     * ------------------------------------------------------------------ */
    function handleLessonLeave(lessonId, lessonIds = null) {
      requestOrRun('lesson-leave', { lessonId, lessonIds: lessonIds || [lessonId] });
    }

    function doLessonLeave(lessonId, lessonIds = null) {
      const ids = lessonIds && lessonIds.length ? lessonIds : [lessonId];
      const lessons = ids.map(lessonById).filter(Boolean);
      if (!lessons.length) return;
      const wasSub = lessons.some((lesson) => lesson.status === 'SUBSTITUTED');
      lessons.forEach((lesson) => {
        lesson.status = 'PENDING';
        lesson.subTeacher = null;
        if (isStaffRole()) {
          addRecord({
            type: 'leave',
            action: '代学员请假',
            studentKey: isGroupLesson(lesson) ? null : lesson.studentKey,
            studentName: isGroupLesson(lesson) ? '' : lesson.student,
            groupName: isGroupLesson(lesson) ? lesson.student : '',
            lessonDate: lesson.date,
            timeLabel: `${lesson.time}-${endTime(lesson.time)}`,
            from: '已排课',
            to: '退回待排期',
            owner: originTeacherOf(lesson),
            reason: '班长代学员发起，已与老师沟通',
            lastMinute: state.hours < 3
          });
        }
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.cellView = 'main';
      renderAll();
      showToast(wasSub ? '已退回待排期 · 原代课委任已解除' : `已退回待排期 · 课格已释放${lessons.length > 1 ? `（共 ${lessons.length} 节）` : ''}`);
    }

    function executeStudentLeaveChoice(choice) {
      if (!guardWrite()) return;
      const overlay = state.overlay;
      if (!overlay || overlay.type !== 'studentLeaveChoice') return;
      const ids = overlay.lessonIds && overlay.lessonIds.length ? overlay.lessonIds : [overlay.lessonId];
      const lessons = ids.map(lessonById).filter(Boolean);
      if (!lessons.length) return;
      const primary = lessons[0];
      const stats = studentLeaveStats(primary.studentKey);
      const wasSub = lessons.some((lesson) => lesson.status === 'SUBSTITUTED');
      let toast = '';
      lessons.forEach((lesson) => {
        if (choice !== 'lenient' && choice !== 'absent') return;
        if (choice === 'lenient') {
          lesson.status = 'PENDING';
          lesson.subTeacher = null;
          lesson.leaveDisposition = '通融退回待排期';
          addRecord({
            type: 'leave',
            action: '代学员请假',
            studentKey: lesson.studentKey,
            studentName: lesson.student,
            lessonDate: lesson.date,
            timeLabel: `${lesson.time}-${endTime(lesson.time)}`,
            from: '已排课',
            to: '通融退回待排期',
            owner: originTeacherOf(lesson),
            reason: `临期代请假，不扣课次；近 30 天请假 ${stats.leave} 次、临期 ${stats.late} 次`,
            lastMinute: true
          });
        } else if (choice === 'absent') {
          lesson.status = 'COMPLETED';
          lesson.subTeacher = null;
          lesson.exception = '学员旷课';
          lesson.studentDeducted = 1;
          lesson.settled = false;
          addRecord({
            type: 'exception',
            action: '代请假 · 按学员旷课扣 1 节',
            studentKey: lesson.studentKey,
            studentName: lesson.student,
            lessonDate: lesson.date,
            timeLabel: `${lesson.time}-${endTime(lesson.time)}`,
            from: '已排课',
            to: '学员旷课 · 扣 1 节',
            owner: originTeacherOf(lesson),
            reason: `临期代请假，按学员旷课扣 1 节；近 30 天请假 ${stats.leave} 次、临期 ${stats.late} 次`,
            lastMinute: true
          });
        }
      });
      if (choice === 'lenient') toast = `已通融退回待排期 · 不扣学员课次，老师该节不计课酬${lessons.length > 1 ? `（共 ${lessons.length} 节）` : ''}`;
      else if (choice === 'absent') toast = `已按学员旷课扣 1 节 · 老师课酬正常计入${lessons.length > 1 ? `（共 ${lessons.length} 节）` : ''}`;
      else return;
      state.overlay = null;
      state.returnOverlay = null;
      renderAll();
      showToast(wasSub ? `${toast} · 原代课委任已解除` : toast);
    }

    function cancelStudentLeaveChoice() {
      if (state.returnOverlay) {
        state.overlay = state.returnOverlay;
        state.returnOverlay = null;
        renderAll();
        return;
      }
      state.overlay = null;
      state.returnOverlay = null;
      renderAll();
    }

    function selectTarget(key) {
      const lesson = lessonById(state.overlay.lessonId);
      if (!lesson) return;
      const scopeLessons = ((state.picker && state.picker.scopeIds) || [lesson.id]).map(lessonById).filter(Boolean);
      const targets = scopeLessons.length > 1
        ? buildPairTargets(lesson, scopeLessons.find((item) => item.id !== lesson.id))
        : buildTargets(lesson);
      const target = targets.find((t) => t.key === key);
      if (!target) return;
      if (target.conflict) {
        showToast('学员该时段已有其他课程', true);
        return;
      }
      state.picker.selectedKey = key;
      renderOverlay();
    }

    function confirmReschedule() {
      if (!state.picker || !state.picker.selectedKey) return showToast('请选择一个合法目标时段', true);
      requestOrRun('lesson-reschedule', {
        lessonId: state.picker.lessonId,
        targetKey: state.picker.selectedKey,
        taskId: state.picker.taskId || null,
        scopeIds: state.picker.scopeIds || [state.picker.lessonId]
      });
    }

    function moveLessonTo(lesson, date, time) {
      lesson.date = date;
      lesson.time = time;
      lesson.status = 'SCHEDULED';
      lesson.subTeacher = null;
      if (lesson.type === 'sub') lesson.type = lesson.baseType || 'fixed';
    }

    function executeReschedule(payload) {
      const lesson = lessonById(payload.lessonId);
      if (!lesson) return;
      const origin = originTeacherOf(lesson);
      const scopeLessons = (payload.scopeIds && payload.scopeIds.length ? payload.scopeIds : [lesson.id])
        .map(lessonById).filter(Boolean).sort((a, b) => a.time.localeCompare(b.time));
      const pool = TEACHER_TARGETS[origin] || [];
      const target = pool.find((t) => t.key === payload.targetKey);
      if (!target) return;
      const wasSub = scopeLessons.some((item) => item.status === 'SUBSTITUTED');
      const oldDate = lesson.date;
      const oldTime = lesson.time;
      if (scopeLessons.length > 1) {
        moveLessonTo(scopeLessons[0], target.date, target.time);
        moveLessonTo(scopeLessons[1], target.date, addMinutes(target.time, 30));
      } else {
        moveLessonTo(lesson, target.date, target.time);
      }
      if (isStaffRole()) {
        addRecord({
          type: 'leave',

    function pickStudent(key) {
      if (!state.changeStudent) return;
      state.changeStudent.selected = key;
      renderOverlay();
    }

    function confirmChangeStudent() {
      if (!state.changeStudent || !state.changeStudent.selected) return showToast('请选择一位新的上课学员', true);
      const lesson = lessonById(state.changeStudent.lessonId);
      const student = studentByKey(state.changeStudent.selected);
      const crossFamily = lesson && student && student.parent !== lesson.payer;
      if (crossFamily) {
        if (!String(state.changeStudent.note || '').trim()) return showToast('跨家庭换人必须填写 1–200 字协调/结算备注', true);
        if (!state.changeStudent.agreed) return showToast('请勾选确认已沟通双方家长', true);
      }
      requestOrRun('change-student', {
        lessonId: state.changeStudent.lessonId,
        lessonIds: state.changeStudent.lessonIds || [state.changeStudent.lessonId],
        studentKey: state.changeStudent.selected,
        note: String(state.changeStudent.note || '').trim(),
        agreed: !!state.changeStudent.agreed,
        crossFamily
      });
    }

    function executeChangeStudent(payload) {
      const student = studentByKey(payload.studentKey);
      if (!student) return;
      const ids = payload.lessonIds && payload.lessonIds.length ? payload.lessonIds : [payload.lessonId];
      const lessons = ids.map(lessonById).filter(Boolean);
      if (!lessons.length) return;
      lessons.forEach((lesson) => {
        const previous = lesson.student;
        const crossFamily = student.parent !== lesson.payer;
        lesson.studentKey = student.key;
        lesson.student = student.name;
        if (isStaffRole()) {
          const reason = crossFamily
            ? `跨家庭换人（${lesson.payer} → ${student.parent}）。协调/结算备注：${payload.note || '—'}`
            : '班长更换实际上课学员，原购课单出资人与资金归属不变';
          addRecord({
            type: 'leave',
            action: '更换实际上课学员',
            studentKey: student.key,
            studentName: student.name,
            lessonDate: lesson.date,
            timeLabel: `${lesson.time}-${endTime(lesson.time)}`,
            from: previous,
            to: student.name,
            owner: originTeacherOf(lesson),
            reason,
            lastMinute: state.hours < 3
          });
        }
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.changeStudent = null;
      state.cellView = 'main';
      renderAll();
      const isCross = lessons.some((lesson) => student.parent !== lesson.payer);
      showToast(`已更换为 ${student.name} · 原购课单出资人与资金归属不变${isCross ? ' · 已向双方家长与原任老师发 M4 站内卡（无 Email）' : ' · 已向原任老师发 M4 站内卡'}${lessons.length > 1 ? `（共 ${lessons.length} 节）` : ''}`);
    }

    /* ------------------------------------------------------------------
     * 智能筛师与代课指派
     * ------------------------------------------------------------------ */
    function pickSub(name) {
      if (!state.assignSub) return;
      state.assignSub.selected = name;
      renderOverlay();
    }

    function confirmAssignSub() {
      const draft = state.assignSub;
      if (!draft || !draft.selected) return showToast('请选择一位代课老师', true);
      const primary = lessonById(draft.lessonId);
      if (!primary) return;
      const originPrice = teacherPrice(originTeacherOf(primary));
      const candidate = SUB_CANDIDATES.find((c) => c.name === draft.selected);
      const crossHigh = !!candidate && isCrossHigh(candidate.price, originPrice);
      const directNoLeave = primary.status !== 'LEAVE_PENDING' && primary.status !== 'SUBSTITUTED';
      if (directNoLeave && state.hours >= 24 && !draft.responsibility) return showToast('请单选责任来源：老师原因 / 教务/学员主动调剂', true);
      if (crossHigh && !String(draft.crossReason || '').trim()) return showToast('跨高档代课必须填写指派原因', true);
      const primaryId = draft.lessonId || null;
      const scope = (draft.lessonIds && draft.lessonIds.length ? draft.lessonIds : [primaryId]).filter(Boolean);
      const payload = {
        lessonId: primaryId,
        lessonIds: scope,
        teacher: draft.selected,
        crossHigh,
        responsibility: draft.responsibility || (directNoLeave && state.hours < 24 ? 'teacher' : ''),
        crossReason: String(draft.crossReason || '').trim()
      };
      if (crossHigh) {
        state.returnOverlay = { type: 'assignSub', lessonId: primaryId };
        state.overlay = { type: 'softConfirm', kind: 'cross-high-sub', payload };
        renderOverlay();
        return;
      }
      requestOrRun('assign-sub', payload);
    }

    function applySubAssignment(lesson, teacher, meta = {}) {
      const origin = originTeacherOf(lesson);
      lesson.originTeacher = origin;
      lesson.subTeacher = teacher;
      lesson.status = 'SUBSTITUTED';
      lesson.crossHigh = !!meta.crossHigh;
      const reasonParts = [];
      if (meta.crossHigh) reasonParts.push(`[跨高档代课] 浅黄成本预警确认；平台统筹盈余池兜底差额，严禁扣减代课老师课酬${meta.crossReason ? `；原因：${meta.crossReason}` : ''}`);
      else if (meta.responsibility === 'teacher') reasonParts.push('未先请假直派，责任来源：老师原因（计入原任老师非常规异常）');
      else if (meta.responsibility === 'ops') reasonParts.push('未先请假直派，责任来源：教务/学员主动调剂（不计原师异常）');
      else reasonParts.push('班长指派代课');
      addRecord({
        type: 'sub',
        action: '指派代课',
        studentKey: isGroupLesson(lesson) ? null : lesson.studentKey,
        studentName: isGroupLesson(lesson) ? '' : lesson.student,
        groupName: isGroupLesson(lesson) ? lesson.student : '',
        classId: isGroupLesson(lesson) ? groupIdForName(lesson.student) : null,
        lessonDate: lesson.date,
        timeLabel: `${lesson.time}-${endTime(lesson.time, isGroupLesson(lesson) ? 60 : 30)}`,
        from: origin,
        to: teacher,
        owner: origin,
        reason: reasonParts.join('；'),
        lastMinute: state.hours < 3,
        crossHigh: !!meta.crossHigh
      });
    }

    function executeAssignSub(payload) {
      const primary = lessonById(payload.lessonId);
      if (!primary) return;
      const scope = (payload.lessonIds && payload.lessonIds.length ? payload.lessonIds : [primary.id]).filter(Boolean);
      const lessons = (scope.length ? scope : [primary.id]).map(lessonById).filter(Boolean);
      lessons.forEach((lesson) => {
        applySubAssignment(lesson, payload.teacher, payload);
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.assignSub = null;
      state.cellView = 'main';
      renderAll();
      showToast(`已指派 ${payload.teacher} 代课 · 已发站内+Email；原任🔵 代课🟣${payload.crossHigh ? ' · 已打标 [跨高档代课]' : ''}${lessons.length > 1 ? `（共 ${lessons.length} 节）` : ''}`);
    }

    function executeRevokeSubForLesson(payload) {
      const ids = payload.lessonIds && payload.lessonIds.length ? payload.lessonIds : [payload.lessonId];
      let changed = 0;
      ids.forEach((lessonId) => {
        const lesson = lessonById(lessonId);
        if (!lesson || lesson.status !== 'SUBSTITUTED') return;
        const subTeacher = lesson.subTeacher;
        lesson.subTeacher = null;
        lesson.status = 'SCHEDULED';
        if (lesson.type === 'sub') lesson.type = lesson.baseType || 'fixed';
        addRecord({
          type: 'sub',
          action: '撤销代课指派',
          studentKey: isGroupLesson(lesson) ? null : lesson.studentKey,
          studentName: isGroupLesson(lesson) ? '' : lesson.student,
          groupName: isGroupLesson(lesson) ? lesson.student : '',
          lessonDate: lesson.date,
          timeLabel: `${lesson.time}-${endTime(lesson.time, isGroupLesson(lesson) ? 60 : 30)}`,
          from: subTeacher || '代课老师',
          to: '恢复原任老师',
          owner: originTeacherOf(lesson),
          reason: '撤销代课指派，恢复原任老师排期',
          lastMinute: state.hours < 3
        });
        changed += 1;
      });
      if (!changed) {
        showToast('当前课次没有可撤销的代课指派', true);
        return;
      }
      state.overlay = null;
      state.returnOverlay = null;
      state.assignSub = null;
      state.cellView = 'main';
      renderAll();
      showToast('代课已撤销 · 已向原代课老师发站内提醒 + 撤销代课 Email');
    }

    function pickClassSub(name) {
      if (!state.classDraft) return;
      state.classDraft.selected = name;

    function executeClassAssign(payload) {
      const groupLesson = state.classDraft && state.classDraft.lessonId ? lessonById(state.classDraft.lessonId) : null;
      const groupName = groupLesson ? groupLesson.student : CLASS_INFO.name;

        groupLesson.originTeacher = groupLesson.teacher;

        groupName,
        classId: groupInfo ? groupInfo.id : null,

        timeLabel: `${groupLesson ? groupLesson.time : CLASS_INFO.time}-${groupLesson ? endTime(groupLesson.time, 60) : CLASS_INFO.end}`,
        from: groupLesson ? groupLesson.teacher : CLASS_INFO.teacher,
        to: payload.teacher,
        owner: groupLesson ? groupLesson.teacher : CLASS_INFO.teacher,
        reason: '连续双格代课，课酬按原班级快照平移',
        lastMinute: state.hours < 3
      });
      state.overlay = null;
      state.returnOverlay = null;
      state.classDraft = null;
      state.cellView = 'main';

    }

    /* ------------------------------------------------------------------
     * 温和确认执行器
     * ------------------------------------------------------------------ */
    function confirmSoft() {
      const overlay = state.overlay;
      if (!overlay || overlay.type !== 'softConfirm') return;
      const kind = overlay.kind;
      const payload = overlay.payload;
      state.overlay = null;
      state.returnOverlay = null;
      executeSoftAction(kind, payload);
    }

    function cancelSoft() {
      if (state.returnOverlay) {
        state.overlay = state.returnOverlay;
        state.returnOverlay = null;
        renderAll();
        return;
      }
      state.overlay = null;
      state.returnOverlay = null;
      renderAll();
    }

    function executeSoftAction(kind, payload) {
      if (kind === 'lesson-leave') return doLessonLeave(payload.lessonId);
      if (kind === 'lesson-reschedule') return executeReschedule(payload);
      if (kind === 'change-student') return executeChangeStudent(payload);
      if (kind === 'assign-sub') return executeAssignSub(payload);
      if (kind === 'cross-high-sub') return executeAssignSub(payload);
      if (kind === 'revoke-sub') return executeRevokeSubForLesson(payload);
      if (kind === 'class-assign') return executeClassAssign(payload);
    }

    document.getElementById('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.page);
      if (action === 'switch-role') return setRole(el.dataset.role);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'close-overlay') return closeOverlay();
      if (action === 'copy-room') {
        const room = el.dataset.room || '';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(room).catch(() => {});
        }
        return showToast(`ClassIn 教室已复制：${room}`);
      }
      if (action === 'open-emergency-pack') {
        state.overlay = { type: 'emergencyPack' };
        renderAll();
        return;
      }
      if (action === 'demo-soft-confirm') {
        state.hours = 2;
        state.returnOverlay = null;
        state.overlay = { type: 'softConfirm', kind: 'assign-sub', payload: { lessonId: 'lsn_alice_tue', lessonIds: ['lsn_alice_tue'], teacher: 'Elena Wright' } };
        renderAll();
        return;

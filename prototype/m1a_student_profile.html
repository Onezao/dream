    function renderCwLevelDrawer() {
      const cw = state.cw;
      const picked = COURSEWARE_LIB.find((x) => x.id === cw.pickCw);
      if (!picked) return '';
      return `<div class="absolute inset-0 z-[70]">
        <div class="absolute inset-0 bg-slate-900/45 backdrop-blur-[1px]" data-action="close-cw-pick"></div>
        <div class="absolute inset-x-0 bottom-0 flex max-h-[72%] flex-col rounded-t-3xl bg-white">
          <div class="mx-auto mt-2 h-1 w-10 shrink-0 rounded-full bg-slate-300"></div>
          <div class="flex shrink-0 items-center justify-between px-4 py-2.5">
            <div class="min-w-0">
              <h3 class="text-[16px] font-bold text-slate-900">选择级别</h3>
              <p class="truncate text-[12px] font-medium text-slate-500">${esc(picked.nameEn)} · ${esc(picked.nameCn)}</p>
            </div>
            <button data-action="close-cw-pick" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="min-h-0 flex-1 overflow-y-auto px-3 pb-3">
            <div class="space-y-1">
              ${picked.levels.map((l) => `<button data-action="pick-cw-level" data-level="${esc(l)}" class="flex min-h-11 w-full items-center justify-between gap-2 rounded-xl px-3 py-1.5 text-left transition ${cw.pickLevel === l ? 'bg-indigo-50/70' : 'hover:bg-slate-50'}">
                <span class="truncate text-[14px] font-semibold text-slate-900">${esc(l)}</span>
                <span class="shrink-0 text-indigo-600">${cw.pickLevel === l ? icon('check', 'h-4 w-4') : ''}</span>
              </button>`).join('')}
            </div>
          </div>
        </div>
      </div>`;
    }

    function renderNotesModal() {
      const e = state.noteEdit;
      const target = findCwTarget(e.kind, e.id);
      if (!target) return '';
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-4 top-1/2 max-h-[86%] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">编辑学生备注</h2>
              <p class="mt-1 truncate font-mono text-[12px] font-medium text-slate-500">${esc(target.nickname)}</p>
            </div>
            <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="flex items-center justify-between gap-2">
            <label for="notesInput" class="mt-3 mb-1 block text-[14px] font-semibold text-slate-700">学生备注</label>
            <span id="notesCount" class="mt-3 font-mono text-[12px] font-semibold text-slate-500">${String(e.text || '').slice(0, 2000).length}/2000</span>
          </div>
          <textarea id="notesInput" maxlength="2000" rows="6" placeholder="记录孩子的性格偏好、学习习惯与教学注意事项（可换行）" class="w-full resize-none rounded-xl border border-slate-200 bg-slate-50/70 px-3.5 py-2.5 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">${esc(String(e.text || '').slice(0, 2000))}</textarea>
          <p class="mt-1 text-[12px] font-medium text-slate-500">纯文本 · 最多 2000 字 · 请尽量填写英文，便于老师看懂（如 Shy at first, needs encouragement）</p>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">多方协同：提交时校验修改版本，若期间已被他人修改将提示刷新核对后再保存（最后保存生效，避免静默覆盖）。</p>
          <div class="mt-4 flex gap-2">
            <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 transition hover:bg-slate-50">取消</button>
            <button data-action="save-notes" class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">保存备注</button>
          </div>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 预览与表单同步
     * ------------------------------------------------------------------ */
    function statusLine(st) {
      if (st.ok) return `<span class="flex items-center gap-1 text-emerald-600"><span class="font-bold">✓</span>${esc(st.message)}</span>`;
      return `<span class="flex items-center gap-1 ${st.incomplete ? 'text-slate-500' : 'text-rose-600'}"><span class="font-bold">${st.incomplete ? '·' : '!'}</span>${esc(st.message)}</span>`;
    }

    function updateProfilePreview() {
      const f = state.form;
      const nickEl = $('nickPreview');
      if (!nickEl) return;
      const nick = lockedNicknameOf(f) || computeNickname(f);
      nickEl.textContent = nick || '英文名+姓首字母+可选小写字母+年龄';
      nickEl.className = `mt-0.5 break-all font-mono text-[18px] font-bold ${nick ? 'text-slate-900' : 'text-slate-500'}`;

      const statusEl = $('nickStatus');
      if (statusEl) statusEl.innerHTML = statusLine(profileNicknameStatus(f));

      const btn = $('btnSubmitProfile');
      if (btn) btn.disabled = !!profileFormError(f);

      const initialEl = $('avatarInitial');
      if (initialEl && !f.avatarDataUrl) {
        initialEl.textContent = (f.englishName || '?').trim().charAt(0).toUpperCase() || '?';
      }
    }

    function updateTrialPreview() {
      const f = state.trialForm;
      const nickEl = $('trialNickPreview');
      if (!nickEl) return;
      if (f.mode === 'quick') {
        const parsed = parseQuickNick(f.quickNick);
        nickEl.textContent = parsed.ok
          ? `英文名 ${parsed.englishName} · 姓首字母 ${parsed.initial} · ${parsed.age} 岁 · 默认小名 ${parsed.nickname}`
          : '等待输入规范英文名（如 MarkL10）';
        nickEl.className = `mt-1 text-[13px] font-semibold ${parsed.ok ? 'text-slate-900' : 'text-slate-500'}`;
      } else {
        const nick = computeNickname(f);
        nickEl.textContent = nick || '英文名+首字母+年龄';
        nickEl.className = `mt-0.5 break-all font-mono text-[18px] font-bold ${nick ? 'text-slate-900' : 'text-slate-500'}`;
      }

      const statusEl = $('trialNickStatus');
      if (statusEl) statusEl.innerHTML = statusLine(trialNicknameStatus(f));

      const btn = $('btnSubmitTrial');
      if (btn) btn.disabled = !!trialFormError(f);
    }

    function removeEl(id) {
      const el = $(id);
      if (el) el.remove();
    }

    function clearProfileError() {
      state.form.error = '';
      removeEl('profileError');
    }

    function clearTrialError() {
      state.trialForm.error = '';
      removeEl('trialError');
    }

    function clearClaimError() {
      state.claim.error = '';
      removeEl('claimError');
      ['claimNickname', 'claimLast4'].forEach((id) => {
        const el = $(id);
        if (el) { el.classList.remove('border-rose-300'); el.classList.add('border-slate-200'); }
      });
    }

    function clearBindError() {
      state.bind.error = '';
      removeEl('bindError');
      const input = $('bindEmail');
      if (input) { input.classList.remove('border-rose-300'); input.classList.add('border-slate-200'); }
    }

    /* ------------------------------------------------------------------
     * 事件委托
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'back-main') {
        if (state.role === 'parent') return setView('center');
        return setView('staffList');
      }
      if (action === 'back-center') { state.page = 'center'; state.navTab = 'me'; state.overlay = null; return renderAll(); }
      if (action === 'back-staff') {
        if (state.staffKind === 'trial' && state.role === 'admin') {
          state.page = 'trials';
          state.navTab = 'settings';
        } else {
          state.page = 'staffList';
          state.navTab = state.role === 'teacher' ? 'students' : 'ops';
        }
        state.overlay = null;
        state.progressEdit = null;
        return renderAll();
      }
      if (action === 'switch-profile') {
        state.activeId = el.dataset.id;
        if (state.page !== 'detail') state.page = 'center';
        return renderAll();
      }
      if (action === 'open-profile') {
        state.activeId = el.dataset.id;
        state.page = 'detail';
        state.navTab = 'me';
        return renderAll();
      }
      if (action === 'add-profile') return openCreate(el.dataset.reason || '');
      if (action === 'open-edit') return openEdit();
      if (action === 'open-claim') {
        if (state.online === 'off') return showToast('离线模式下不可认领');
        if (activeProfiles().length >= 10) return showToast('名下档案已达上限 (10/10)');
        return openClaimModal();
      }
      if (action === 'claim-query') return claimQuery();
      if (action === 'claim-back') { state.claim.step = 1; state.claim.error = ''; return renderAll(); }
      if (action === 'claim-confirm') return claimConfirm();
      if (action === 'open-archive' || action === 'open-delete') {
        if (state.online === 'off') return showToast('离线模式下不可调整档案生命周期');
        const kind = el.dataset.kind || 'profile';
        let id = el.dataset.id;
        if (!id) {
          const p = activeProfile();
          if (!p) return;
          id = p.id;
        }
        state.overlay = { type: 'guard', mode: action === 'open-delete' ? 'delete' : 'archive', kind, targetId: id };
        return renderAll();
      }
      if (action === 'guard-confirm-archive') return archiveLifecycle(el.dataset.kind || 'profile', el.dataset.id);
      if (action === 'guard-confirm-delete') return deleteLifecycle(el.dataset.kind || 'profile', el.dataset.id);
      if (action === 'reactivate-profile') return reactivateProfile(el.dataset.id);
      if (action === 'reactivate-trial') return reactivateTrial(el.dataset.id);
      if (action === 'contact-monitor') {
        state.overlay = null;
        renderAll();
        return showToast('已向关联班长发送课次清退协助请求');
      }
      if (action === 'open-trial') return openTrial();
      if (action === 'trial-mode') {
        state.trialForm.mode = el.dataset.mode === 'quick' ? 'quick' : 'full';
        state.trialForm.error = '';
        renderOverlayOnly();
        updateTrialPreview();
        return;
      }
      if (action === 'open-progress') {
        if (state.online === 'off') return showToast('离线模式下不可更新进度');
        const target = findCwTarget(el.dataset.kind, el.dataset.id);
        const idx = Number(el.dataset.index);
        if (!target || !target.courseware || !target.courseware[idx]) return;
        const item = target.courseware[idx];
        state.progressEdit = { kind: el.dataset.kind, id: el.dataset.id, index: idx, level: item.level || '', text: item.progressText || '' };
        state.overlay = { type: 'progress' };
        renderAll();
        const input = $('progressNote');
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }
        return;
      }
      if (action === 'progress-level') {
        if (state.progressEdit) state.progressEdit.level = el.dataset.level || '';
        return renderOverlayOnly();
      }
      if (action === 'save-progress') return saveProgress();
      if (action === 'open-transfer') {
        const source = state.enrolled.find((x) => x.id === el.dataset.id);
        if (!source) return;
        const siblings = familySiblings(source);
        if (!siblings.length) return showToast('同一家庭下暂无可接收的正式在读孩子');
        state.transfer = { sourceId: source.id, targetId: siblings[0].id, count: 1, note: '' };
        state.overlay = { type: 'transfer' };
        return renderAll();
      }
      if (action === 'pick-transfer-target') {
        state.transfer.targetId = el.dataset.id;
        return renderOverlayOnly();
      }
      if (action === 'transfer-count') {
        state.transfer.count = Number(el.dataset.count) || 1;
        return renderOverlayOnly();
      }
      if (action === 'confirm-transfer') return confirmTransfer();
      if (action === 'open-bind') {
        if (state.online === 'off') return showToast('离线模式下不可绑定');
        state.bind = { targetId: el.dataset.id, email: '', error: '', conflict: false };
        state.overlay = { type: 'bind' };
        renderAll();
        const input = $('bindEmail');
        if (input) input.focus();
        return;
      }
      if (action === 'submit-bind') return submitBind();
      if (action === 'staff-open') {
        state.staffKind = el.dataset.kind;
        state.staffId = el.dataset.id;
        state.page = 'staffDetail';
        return renderAll();
      }
      if (action === 'open-counselor') {
        state.overlay = { type: 'counselor' };
        return renderOverlayOnly();
      }
      if (action === 'pick-counselor') {
        state.staffCounselor = el.dataset.value || 'all';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'reset-counselor') {
        state.staffCounselor = 'all';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'staff-tab') { state.staffTab = el.dataset.tab; return renderAll(); }
      if (action === 'staff-sort') { state.staffSort = el.dataset.sort; return renderAll(); }
      if (action === 'staff-letter-toggle') { state.staffLetterOpen = !state.staffLetterOpen; return renderAll(); }
      if (action === 'staff-letter') {
        const letter = el.dataset.letter;
        state.staffLetter = letter === state.staffLetter ? 'all' : letter;
        state.staffLetterOpen = true;
        return renderAll();
      }
      if (action === 'staff-reset') {
        state.staffQuery = '';
        state.staffTab = 'all';
        state.staffCounselor = 'all';
        state.staffLetter = 'all';
        state.staffLetterOpen = false;
        state.staffSort = 'smart';
        return renderAll();
      }
      if (action === 'trial-reset') {
        state.trialQuery = '';
        state.adminTab = 'all';
        return renderAll();
      }
      if (action === 'buy4') {
        return showToast(`已为 ${el.dataset.nick || '该学员'} 打开买 4 节 · 优先排 4 节固定位`);
      }
      if (action === 'set-admin-tab') { state.adminTab = el.dataset.tab; return renderAll(); }
      if (action === 'open-courseware') {
        if (state.online === 'off') return showToast('离线模式下不可调整课件');
        return openCourseware(el.dataset.kind, el.dataset.id);
      }
      if (action === 'open-notes') return openNotes(el.dataset.kind, el.dataset.id);
      if (action === 'save-notes') return saveNotes();
      if (action === 'cw-add') return cwAdd();
      if (action === 'cw-pick-open') {
        state.cw.picking = 'cw';
        state.cw.pickQuery = '';
        return renderOverlayOnly();
      }
      if (action === 'close-cw-pick') {
        state.cw.picking = null;
        return renderOverlayOnly();
      }
      if (action === 'pick-cw') {
        const id = el.dataset.id;
        const info = COURSEWARE_LIB.find((x) => x.id === id);
        state.cw.pickCw = id;
        state.cw.pickLevel = info && info.levels.length ? info.levels[0] : '';
        state.cw.picking = null;
        state.cw.pickQuery = '';
        return renderOverlayOnly();
      }
      if (action === 'reset-cw-pick') {
        state.cw.pickCw = '';
        state.cw.pickLevel = '';
        state.cw.picking = null;
        state.cw.pickQuery = '';
        return renderOverlayOnly();
      }
      if (action === 'cw-level-open') {
        state.cw.picking = 'level';
        return renderOverlayOnly();
      }
      if (action === 'pick-cw-level') {
        state.cw.pickLevel = el.dataset.level;
        state.cw.picking = null;
        return renderOverlayOnly();
      }
      if (action === 'cw-level-pick') {
        state.cw.pickLevel = el.dataset.level;
        return renderOverlayOnly();
      }
      if (action === 'cw-level-inline') {
        const index = Number(el.dataset.index);
        const level = el.dataset.level;
        if (state.cw.draft[index]) state.cw.draft[index].level = level;
        document.querySelectorAll(`[data-action="cw-level-inline"][data-index="${index}"]`).forEach((b) => {
          const on = b.dataset.level === level;
          b.className = `h-6 shrink-0 whitespace-nowrap rounded-full px-2.5 text-[11px] transition ${on ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}`;
        });
        return;
      }
      if (action === 'cw-remove') {
        state.cw.pendingRemoveIndex = Number(el.dataset.index);
        return renderOverlayOnly();
      }
      if (action === 'cancel-cw-remove') {
        state.cw.pendingRemoveIndex = null;
        return renderOverlayOnly();
      }
      if (action === 'confirm-cw-remove') {
        const idx = state.cw.pendingRemoveIndex;
        if (idx !== null && idx !== undefined && idx >= 0 && idx < state.cw.draft.length) {
          state.cw.draft.splice(idx, 1);
        }
        state.cw.pendingRemoveIndex = null;
        return renderOverlayOnly();
      }
      if (action === 'cw-save') return cwSave();
      if (action === 'close-overlay') {
        if (state.overlay && state.overlay.type === 'transfer') {
          state.transfer = { sourceId: null, targetId: '', count: 1, note: '' };
        }
        state.overlay = null;
        state.progressEdit = null;
        return renderOverlayOnly();
      }
      if (action === 'toggle-gender') {
        state.form.gender = el.dataset.gender;
        clearProfileError();
        document.querySelectorAll('[data-action="toggle-gender"]').forEach((b) => {
          const on = b.dataset.gender === state.form.gender;
          b.className = `h-11 rounded-xl border px-2 text-[14px] font-semibold transition ${on ? 'border-indigo-500 bg-indigo-50/60 text-indigo-950 ring-1 ring-indigo-500' : 'border-slate-200 bg-slate-50/60 text-slate-700 hover:bg-slate-100'}`;
        });
        return;
      }
      if (action === 'toggle-slot') {
        const key = `${el.dataset.day}:${el.dataset.period}`;
        const targetForm = state.overlay && state.overlay.type === 'trial' ? state.trialForm : state.form;
        const list = clone(targetForm.preferredSlots || []);
        const at = list.indexOf(key);
        if (at >= 0) list.splice(at, 1); else list.push(key);
        targetForm.preferredSlots = list;
        return renderOverlayOnly();
      }
      if (action === 'submit-profile') return submitProfile();
      if (action === 'submit-trial') return submitTrial();
      if (action === 'copy-nick') return copyNick(el.dataset.nick);
      if (action === 'toggle-log') {
        const logId = el.dataset.logId;
        const expanded = el.dataset.open === '1';
        document.querySelectorAll(`[data-log-extra="${logId}"]`).forEach((node) => {
          node.classList.toggle('hidden', expanded);
        });
        el.dataset.open = expanded ? '0' : '1';
        el.textContent = expanded ? `展开更多（${el.dataset.more} 条）` : '收起';
        return;
      }
    });

    function renderOverlayOnly() {
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'fInitial' || id === 'fTrialInitial') {
        e.target.value = e.target.value.replace(/[^a-zA-Z]/g, '').slice(0, 1).toUpperCase();
      }
      if (id === 'fSuffix' || id === 'fTrialSuffix') {
        e.target.value = e.target.value.toLowerCase().replace(/[^a-z]/g, '').slice(0, 2);
      }
      if (id === 'fRealName') { state.form.realName = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fEnglish') { state.form.englishName = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fInitial') { state.form.initial = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fAge') { state.form.age = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fSuffix') { state.form.suffix = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fTrialRealName') { state.trialForm.realName = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialQuickNick') { state.trialForm.quickNick = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialEnglish') { state.trialForm.englishName = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialInitial') { state.trialForm.initial = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialAge') { state.trialForm.age = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialSuffix') { state.trialForm.suffix = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialContact') { state.trialForm.contact = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'progressNote' && state.progressEdit) {
        state.progressEdit.text = e.target.value.slice(0, 2000);
        const cnt = $('progressCount');
        if (cnt) cnt.textContent = `${state.progressEdit.text.length}/2000`;
      }
      if (id === 'claimNickname') { state.claim.nickname = e.target.value; clearClaimError(); }
      if (id === 'claimLast4') {
        e.target.value = e.target.value.replace(/[^0-9a-zA-Z]/g, '').slice(0, 4);
        state.claim.last4 = e.target.value;
        clearClaimError();
      }
      if (id === 'bindEmail') { state.bind.email = e.target.value; clearBindError(); }
      if (id === 'transferNote') {
        state.transfer.note = e.target.value.slice(0, 200);
        const cnt = $('transferNoteCount');
        if (cnt) cnt.textContent = `${state.transfer.note.length}/200`;
        const btn = document.querySelector('[data-action="confirm-transfer"]');
        if (btn) btn.disabled = !state.transfer.note.trim() || state.transfer.note.trim().length > 200 || state.online === 'off';
      }
      if (id === 'notesInput') {
        state.noteEdit.text = e.target.value.slice(0, 2000);
        const cnt = $('notesCount');
        if (cnt) cnt.textContent = `${state.noteEdit.text.length}/2000`;
      }
      if (id === 'cwPickSearch') {
        state.cw.pickQuery = e.target.value;
        const val = e.target.value;
        renderOverlayOnly();
        const input = $('cwPickSearch');
        if (input) {
          input.focus();
          input.setSelectionRange(val.length, val.length);
        }
      }
      if (id === 'staffSearch') {
        state.staffQuery = e.target.value;
        const val = e.target.value;
        renderAll();
        const input = $('staffSearch');
        if (input) {
          input.focus();
          input.setSelectionRange(val.length, val.length);
        }
      }
      if (id === 'trialSearch') {
        state.trialQuery = e.target.value;
        const val = e.target.value;
        renderAll();
        const input = $('trialSearch');
        if (input) {
          input.focus();
          input.setSelectionRange(val.length, val.length);
        }
      }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'avatarInput') return handleAvatar(e);
    });

    function navTo(tab) {
      if (state.role === 'parent' && tab === 'me') return setView('center');
      if (state.role === 'monitor' && tab === 'ops') return setView('staffList');
      if (state.role === 'teacher' && tab === 'students') return setView('staffList');
      if (state.role === 'admin' && tab === 'settings') return setView('trials');
      if (state.role === 'admin' && tab === 'ops') return setView('staffList');
      state.page = 'placeholder';
      state.navTab = tab;
      state.overlay = null;
      renderAll();
    }

    /* ------------------------------------------------------------------
     * 业务动作
     * ------------------------------------------------------------------ */
    function enrolledMirrorOf(p) {
      return state.enrolled.find((x) => x.id === p.id || String(x.nickname || '').toLowerCase() === String(p.nickname || '').toLowerCase());
    }

    function profileMirrorOf(p) {
      return state.profiles.find((x) => x.id === p.id || String(x.nickname || '').toLowerCase() === String(p.nickname || '').toLowerCase());
    }

    function mirrorProfileFields(p) {
      const t = enrolledMirrorOf(p);
      if (!t) return;
      ['realName', 'englishName', 'surnameInitial', 'age', 'gender', 'preferredSlots', 'avatarDataUrl', 'notes', 'courseware', 'nickname'].forEach((key) => {
        if (p[key] !== undefined) t[key] = clone(p[key]);
      });
    }

    function mirrorProfileMirrorStatus(p) {
      const t = enrolledMirrorOf(p);
      if (!t) return;
      t.status = p.status;
      t.archiveType = p.archiveType;
      t.archivedAt = p.archivedAt;
      t.audit = clone(p.audit || t.audit || []);
    }

    function openCreate(reason = '') {
      if (state.online === 'off') return showToast('离线模式下无法创建档案');
      if (activeProfiles().length >= 10) return showToast('名下档案已达上限 (10/10)');
      state.form = { ...emptyProfileForm(), reason };
      state.overlay = { type: 'profile' };
      renderAll();
      updateProfilePreview();
    }

    function openEdit() {
      if (state.online === 'off') return showToast('离线模式下无法编辑档案');
      const p = activeProfile();
      if (!p) return;
      if (p.status !== 'ACTIVE') return showToast('已归档或已删除档案只读');
      state.form = {
        mode: 'edit', editingId: p.id, editingNickname: p.nickname,
        realName: p.realName, englishName: p.englishName, initial: p.surnameInitial,
        age: String(p.age), suffix: p.suffix || '', gender: p.gender,
        avatarDataUrl: p.avatarDataUrl || '', preferredSlots: clone(p.preferredSlots || []),
        error: '', reason: ''
      };
      state.overlay = { type: 'profile' };
      renderAll();
      updateProfilePreview();
    }

    function openTrial() {
      if (!['admin', 'monitor'].includes(state.role)) return showToast('仅班长与平台管理员可创建试课档案');
      if (state.online === 'off') return showToast('离线模式下无法创建试课档案');
      state.trialForm = emptyTrialForm();
      state.overlay = { type: 'trial' };
      renderAll();
      updateTrialPreview();
    }

    function submitProfile() {
      const f = state.form;
      const err = profileFormError(f);
      if (err) {
        f.error = err;
        renderOverlayOnly();
        updateProfilePreview();
        return;
      }
      const nick = computeNickname(f);
      if (f.mode === 'edit') {
        const p = state.profiles.find((x) => x.id === f.editingId);
        if (!p) return;
        const before = {
          nickname: p.nickname, realName: p.realName, englishName: p.englishName,
          age: p.age, avatar: p.avatarDataUrl || '',
          slots: clone(p.preferredSlots || [])
        };
        Object.assign(p, {
          realName: f.realName.trim(),
          /* 规范英文名三项静态组件创建即锁定：编辑仅更新年龄/小名/性别/头像/作息。 */
          englishName: p.englishName, surnameInitial: p.surnameInitial, nickname: p.nickname,
          age: Number(f.age),
          gender: f.gender, preferredSlots: clone(f.preferredSlots || []),
          avatarDataUrl: f.avatarDataUrl
        });
        const by = operatorName();
        recordFieldChange(p, '学员姓名或小名', before.realName, p.realName, by);
        recordFieldChange(p, '年龄（不重算规范英文名）', `${before.age} 岁`, `${p.age} 岁`, by);
        recordFieldChange(p, '常态作息偏好', before.slots.map(preferredSlotLabel).filter(Boolean).join(' · ') || '未填写', (p.preferredSlots || []).map(preferredSlotLabel).filter(Boolean).join(' · ') || '未填写', by);
        if (before.avatar !== (p.avatarDataUrl || '')) {
          recordFieldChange(p, '头像', before.avatar ? '已设置头像' : '未设置头像', p.avatarDataUrl ? '已更新头像（1:1 裁切）' : '已移除头像', by);
        }
        mirrorProfileFields(p);
        state.overlay = null;
        renderAll();
        return showToast('档案已更新（规范英文名及前缀组件保持锁定，年龄增长不重算）');
      }
      const p = {
        id: `sp_${Math.random().toString(36).slice(2, 11).padEnd(9, '0')}`,
        nickname: nick, realName: f.realName.trim(), englishName: f.englishName.trim(),
        surnameInitial: f.initial.trim().toUpperCase(), age: Number(f.age), suffix: f.suffix.trim(),
        gender: f.gender, tag: `宝贝 ${activeProfiles().length + 1}`,
        status: 'ACTIVE', createdAt: TODAY, responsible: 'Leo', holderMonitor: 'Leo',
        familyId: `fam_${Math.random().toString(36).slice(2, 9)}`,
        preferredSlots: clone(f.preferredSlots || []), historyTs: 0, historyOrders: 0,
        courseware: [],
        stats: { upcoming: 0, pendingTs: 0, completed: 0, fixed: 0, temp: 0, hold: 0, pendingOrders: 0, exceptionRollback: 0, pendingTiers: [] },
        notes: '', audit: [],
        avatarDataUrl: f.avatarDataUrl
      };
      state.profiles.push(p);
      state.activeId = p.id;
      state.page = 'center';
      state.navTab = 'me';
      state.overlay = null;
      renderAll();
      showToast(`已创建 ${p.nickname}，并设为当前宝贝`);
    }

    function submitTrial() {
      if (!['admin', 'monitor'].includes(state.role)) return showToast('仅班长与平台管理员可创建试课档案');
      const f = state.trialForm;
      const err = trialFormError(f);
      if (err) {
        f.error = err;
        renderOverlayOnly();
        updateTrialPreview();
        return;
      }
      const isQuick = f.mode === 'quick';
      const parsed = isQuick ? parseQuickNick(f.quickNick) : null;
      const nickname = isQuick ? parsed.nickname : computeNickname(f);
      const t = {
        id: `tr_${Math.random().toString(36).slice(2, 11).padEnd(9, '0')}`,
        nickname,
        realName: isQuick ? nickname : f.realName.trim(),
        englishName: isQuick ? parsed.englishName : f.englishName.trim(),
        surnameInitial: isQuick ? parsed.initial : f.initial.trim().toUpperCase(),
        age: isQuick ? parsed.age : Number(f.age),
        gender: 'undisclosed',
        contact: f.contact.trim(),
        status: 'UNBOUND',
        createdAt: TODAY,
        activatedAt: TODAY,
        lastLessonDate: null,
        trialLessons: 0,
        uncompletedTs: 0,
        historyTs: 0,
        historyOrders: 0,
        archiveType: null,
        daysLeft: 30,
        createdBy: operatorName(),
        responsible: state.role === 'monitor' ? operatorName() : 'Leo',
        familyId: `fam_${Math.random().toString(36).slice(2, 9)}`,
        preferredSlots: clone(f.preferredSlots || []),
        trialProgress: '待排',
        notes: '',
        courseware: [],
        audit: [{ type: 'status', at: `${TODAY} 14:32`, by: operatorName(), from: '新建', to: 'UNBOUND', reason: `${currentRoleLabel()} ${operatorName()} 创建待认领试课档案` }]
      };
      state.trials.unshift(t);
      if (state.role === 'monitor') {
        state.staffTab = 'trial';
        state.page = 'staffList';
        state.navTab = 'ops';
      } else {
        state.adminTab = 'unbound';
        state.page = 'trials';
        state.navTab = 'settings';
      }
      state.overlay = null;
      renderAll();
      showToast(`已创建待认领档案 ${t.nickname}，可前往排课`);
    }

    function enrollTrial(t) {
      const exists = state.enrolled.some((x) => x.nickname.toLowerCase() === t.nickname.toLowerCase());
      if (exists) return false;
      state.enrolled.unshift({
        id: `st_${Math.random().toString(36).slice(2, 11).padEnd(9, '0')}`,
        nickname: t.nickname, realName: t.realName, englishName: t.englishName,
        surnameInitial: t.surnameInitial, age: t.age, gender: t.gender,
        status: 'ACTIVE', createdAt: TODAY, responsible: t.responsible || operatorName(), teacher: '待安排',
        holderMonitor: t.responsible || operatorName(), familyId: t.familyId,
        preferredSlots: clone(t.preferredSlots || []),
        historyTs: Number(t.trialLessons) || 0, historyOrders: Number(t.historyOrders) || 0,
        relations: [{ type: 'group', monitor: t.responsible || operatorName() }],
        courseware: clone(t.courseware || []),
        stats: { upcoming: 0, pendingTs: 0, completed: t.trialLessons || 0, fixed: 0, temp: 0, hold: 0, pendingOrders: 0, exceptionRollback: 0, pendingTiers: [] },
        notes: t.notes || '',
        audit: clone(t.audit || [])
      });
      return true;
    }

    function submitBind() {
      if (state.online === 'off') return showToast('离线模式下不可绑定');
      const email = state.bind.email.trim().toLowerCase();
      const fail = (msg) => {
        state.bind.error = msg;
        renderOverlayOnly();
        const input = $('bindEmail');
        if (input) input.focus();
      };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('请输入有效的家长邮箱');
      if (STAFF_EMAILS.includes(email)) return fail('禁止将试课档案绑定至在职教职人员或管理员邮箱，请填写家长普通注册邮箱');
      if (!REGISTERED_EMAILS.includes(email)) return fail('该邮箱尚未注册或账号状态异常，请核对');
      if (activeProfiles().length >= 10) return fail('名下档案已达上限 (10/10)，请先归档或删除不再使用的档案');
      const t = state.trials.find((x) => x.id === state.bind.targetId);
      if (!t || t.status !== 'UNBOUND' || t.archiveType) return fail('该宝贝已被认领，请刷新查看最新状态');
      const from = t.status;
      const prevParent = t.parentEmail ? `家长 ${t.parentEmail}` : '待归集（未绑定）';
      t.status = 'ACTIVE';
      t.parentEmail = email;
      t.claimedAt = TODAY;
      recordFieldChange(t, '所属家长', prevParent, `家长 ${email}`, operatorName());
      recordStatusChange(t, from, 'ACTIVE', `管理员 ${operatorName()} 绑定家长 ${email}，档案认领转正`, operatorName());
      enrollTrial(t);
      if (state.role === 'admin' && state.page === 'trials') state.adminTab = 'converted';
      state.overlay = null;
      renderAll();
      showToast(`已绑定至 ${email}，档案已认领并纳入全员学员`);
    }

    function claimQuery() {
      if (state.online === 'off') return showToast('离线模式下不可认领');
      if (state.claim.locked) return showToast('自助认领已锁定，请 30 分钟后重试或联系建档班长');
      if (activeProfiles().length >= 10) return showToast('名下档案已达上限 (10/10)');
      const nick = state.claim.nickname.trim();
      const last4 = state.claim.last4.trim();
      const fail = (msg) => {
        state.claim.error = msg;
        renderAll();
      };
      const fuzzyFail = () => {
        state.claim.failCount += 1;
        if (state.claim.failCount >= 5) {
          state.claim.locked = true;
          state.claim.error = '连续匹配失败 5 次，自助认领已锁定 30 分钟；请联系建档班长通过后台通道协助绑定。';
        } else {
          state.claim.error = '未找到匹配的可认领试课宝贝，请核对规范英文名与预留联系方式后四位';
        }
        renderAll();
      };
      if (!nick) return fail('请输入孩子的规范英文名');
      if (last4.length !== 4) return fail('请输入预留联系方式后四位');
      const t = state.trials.find((x) =>
        x.status === 'UNBOUND'
        && x.nickname.toLowerCase() === nick.toLowerCase()
        && x.contact.replace(/\s/g, '').toLowerCase().endsWith(last4.toLowerCase())
      );
      if (!t) return fuzzyFail();
      state.claim.error = '';
      state.claim.failCount = 0;
      state.claim.step = 2;
      state.claim.matchedId = t.id;
      renderAll();
    }

    function claimConfirm() {
      if (state.online === 'off') return showToast('离线模式下不可认领');
      if (state.claim.locked) return showToast('自助认领已锁定，请 30 分钟后重试或联系建档班长');
      if (activeProfiles().length >= 10) return showToast('名下档案已达上限 (10/10)');
      const t = state.trials.find((x) => x.id === state.claim.matchedId);
      /* 单事务原子抢占复检：并发/重复请求仅先提交成功者胜出，后者明确提示已被认领。 */
      if (!t || t.status !== 'UNBOUND' || t.archiveType) {
        state.claim.step = 1;
        state.claim.error = '该宝贝已被认领，请刷新查看最新状态';
        return renderAll();
      }
      const from = t.status;
      recordFieldChange(t, '所属家长', '待归集（未绑定）', '家长 Amy · amy@example.com', '系统');
      recordStatusChange(t, from, 'ACTIVE', '家长 Amy 通过规范英文名与预留联系方式后四位认领，绑定 amy@example.com', '系统');
      const p = {
        id: `sp_${Math.random().toString(36).slice(2, 11).padEnd(9, '0')}`,
        nickname: t.nickname, realName: t.realName, englishName: t.englishName,
        surnameInitial: t.surnameInitial, age: t.age, gender: t.gender, tag: '试课认领',
        suffix: '', status: 'ACTIVE', archiveType: null, createdAt: TODAY,
        responsible: t.responsible || 'Leo', holderMonitor: t.responsible || 'Leo', familyId: t.familyId,
        preferredSlots: clone(t.preferredSlots || []),
        historyTs: Number(t.trialLessons) || 0, historyOrders: Number(t.historyOrders) || 0,
        courseware: clone(t.courseware || []),
        stats: { upcoming: 0, pendingTs: 0, completed: t.trialLessons, fixed: 0, temp: 0, hold: 0, pendingOrders: 0, exceptionRollback: 0, pendingTiers: [] },
        notes: t.notes || '', trialHistory: true,
        audit: clone(t.audit || [])
      };
      t.status = 'ACTIVE';
      t.archiveType = null;
      t.parentEmail = 'amy@example.com';
      t.claimedAt = TODAY;
      enrollTrial(t);
      state.profiles.push(p);
      state.activeId = p.id;
      state.page = 'center';
      state.navTab = 'me';
      state.overlay = null;
      state.claim = { step: 1, nickname: '', last4: '', error: '', matchedId: null, failCount: 0, locked: false };
      renderAll();
      showToast(`已认领 ${p.nickname}，历史记录已并入`);
    }

    function lifecycleTarget(kind, id) {
      if (kind === 'trial') return state.trials.find((x) => x.id === id) || null;
      if (kind === 'enrolled') return state.enrolled.find((x) => x.id === id) || null;
      return state.profiles.find((x) => x.id === id) || null;
    }

    function archiveLifecycle(kind, id) {
      const p = lifecycleTarget(kind, id);
      if (!p) return;
      if (p.status === 'ARCHIVED') return showToast('该档案已归档');
      const archiveType = kind === 'trial' ? '试课失效归档' : '正式暂别归档';
      const from = p.status;
      p.status = 'ARCHIVED';
      p.archiveType = archiveType;
      p.archivedAt = TODAY;
      recordStatusChange(p, from, 'ARCHIVED', `五项资产清零，${currentRoleLabel()} ${operatorName()} 手工归档（${archiveType}）；${kind === 'trial' ? '昵称永久锁定' : '同事务解除 M1C 小班活跃成员绑定，昵称永久锁定'}`, operatorName(), archiveType);
      if (kind === 'profile') mirrorProfileMirrorStatus(p);
      if (kind === 'enrolled') {
        const mirrored = profileMirrorOf(p);
        if (mirrored) {
          mirrored.status = p.status;
          mirrored.archiveType = p.archiveType;
          mirrored.archivedAt = p.archivedAt;
          mirrored.audit = clone(p.audit || []);
        }
      }
      state.overlay = null;
      if (kind === 'profile' && state.activeId === p.id) {
        const next = activeProfiles()[0];
        state.activeId = next ? next.id : '';
        if (!next) { state.page = 'center'; state.navTab = 'me'; }
      }
      renderAll();
      showToast(`${p.nickname} 已归档（${archiveType}）${kind === 'trial' ? '' : '，已解除小班成员绑定'}；昵称永久保留`);
    }

    function reactivateProfile(id) {
      if (state.online === 'off') return showToast('离线模式下不可激活');
      const enrolled = state.enrolled.find((x) => x.id === id);
      if (!enrolled) {
        const p = state.profiles.find((x) => x.id === id);
        if (!p || p.status !== 'ARCHIVED') return;
        if (p.archiveType !== '正式暂别归档') return showToast('仅正式暂别归档可按原类型激活');
        if (activeProfiles().length >= 10) return showToast('名下激活档案已达上限 (10/10)');
        p.status = 'ACTIVE';
        p.archiveType = null;
        p.archivedAt = null;
        recordStatusChange(p, 'ARCHIVED', 'ACTIVE', '家长手工重新激活（原归档类型：正式暂别归档），历史课次、购课单与备注无缝恢复；原已解除的小班成员绑定不自动回绑', operatorName());
        mirrorProfileMirrorStatus(p);
        state.activeId = p.id;
        state.page = 'center';
        state.navTab = 'me';
        renderAll();
        showToast(`${p.nickname} 已重新激活，历史记录完整保留`);
        return;
      }
      if (enrolled.status !== 'ARCHIVED') return;
      if (enrolled.archiveType !== '正式暂别归档') return showToast('仅正式暂别归档可按原类型激活');
      if (activeProfiles().length >= 10) return showToast('名下激活档案已达上限 (10/10)');
      enrolled.status = 'ACTIVE';
      enrolled.archiveType = null;
      enrolled.archivedAt = null;
      recordStatusChange(enrolled, 'ARCHIVED', 'ACTIVE', '管理员手工重新激活（原归档类型：正式暂别归档），历史课次、购课单与备注无缝恢复；原已解除的小班成员绑定不自动回绑', operatorName());
      const pm = profileMirrorOf(enrolled);
      if (pm) {
        pm.status = 'ACTIVE';
        pm.archiveType = null;
        pm.archivedAt = null;
        pm.audit = clone(enrolled.audit || []);
      }
      renderAll();
      showToast(`${enrolled.nickname} 已重新激活，历史记录完整保留`);
    }

    function reactivateTrial(id) {
      if (state.online === 'off') return showToast('离线模式下不可激活');
      const t = state.trials.find((x) => x.id === id);
      if (!t || t.status !== 'ARCHIVED') return;
      if (t.archiveType !== '试课失效归档') return showToast('仅试课失效归档可按原类型激活');
      t.status = 'UNBOUND';
      t.archiveType = null;
      t.archivedAt = null;
      t.activatedAt = TODAY;
      t.daysLeft = 30;
      t.reactivationCount = (Number(t.reactivationCount) || 0) + 1;
      recordStatusChange(t, 'ARCHIVED', 'UNBOUND', `关联班长/管理员手工重新激活（累计第 ${t.reactivationCount} 次，供管理员审计防滥用），自激活自然日起重算 30 天认领窗口`, operatorName());
      state.overlay = null;
      renderAll();
      showToast(`${t.nickname} 已恢复为待认领试课，30 天窗口重新起算`);
    }

    function deleteLifecycle(kind, id) {
      const p = lifecycleTarget(kind, id);
      if (!p) return;
      if (historyTsOf(p, kind) > 0 || historyOrdersOf(p, kind) > 0) {
        return showToast('已有历史课次或购课单，不支持删除，请使用归档');
      }
      const nick = p.nickname;
      recordStatusChange(p, p.status, 'DELETED', `0 历史课次且 0 历史购课单，执行空档软删除；${kind === 'trial' ? '' : '同事务解除 M1C 小班活跃成员绑定；'}昵称永久锁定`, operatorName());
      if (kind === 'trial') {
        state.trials = state.trials.filter((x) => x.id !== id);
      } else if (kind === 'enrolled') {
        state.enrolled = state.enrolled.filter((x) => x.id !== id);
        const mirrored = profileMirrorOf(p);
        if (mirrored) state.profiles = state.profiles.filter((x) => x.id !== mirrored.id);
      } else {
        state.profiles = state.profiles.filter((x) => x.id !== id);
        const mirrored = enrolledMirrorOf(p);
        if (mirrored) state.enrolled = state.enrolled.filter((x) => x.id !== mirrored.id);
        if (state.activeId === id) {
          const next = activeProfiles()[0];
          state.activeId = next ? next.id : '';
          if (!next) { state.page = 'center'; state.navTab = 'me'; }
        }
      }
      state.lockedNicknames.push(nick);
      state.overlay = null;
      state.page = state.role === 'parent' ? 'center' : (state.role === 'admin' && kind === 'trial' ? 'trials' : 'staffList');
      state.navTab = state.role === 'parent' ? 'me' : (state.role === 'teacher' ? 'students' : state.role === 'admin' && kind === 'trial' ? 'settings' : 'ops');
      renderAll();
      showToast(`${nick} 已删除，不可恢复${kind === 'trial' ? '' : '，已解除小班成员绑定'}；昵称永久保留`);
    }

    function deleteProfile(id) {
      deleteLifecycle('profile', id);
    }

    function openNotes(kind, id) {
      if (state.online === 'off') return showToast('离线模式下不可编辑备注');
      const target = findCwTarget(kind, id);
      if (!target) return;
      if (target.status === 'ARCHIVED') return showToast('已归档档案的学生备注只读');
      state.noteEdit = { kind, id, text: target.notes || '' };
      state.overlay = { type: 'notes' };
      renderAll();
      const input = $('notesInput');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function saveNotes() {
      if (state.online === 'off') return showToast('离线模式下不可保存备注');
      const target = findCwTarget(state.noteEdit.kind, state.noteEdit.id);
      if (!target) {
        state.overlay = null;
        return renderAll();
      }
      const text = state.noteEdit.text.trim().slice(0, 2000);
      const before = target.notes || '';
      state.overlay = null;
      if (before === text) {
        renderAll();
        return showToast('学生备注未变更');
      }
      target.notes = text;
      recordFieldChange(target, '学生备注', before, text, operatorName());
      if (state.noteEdit.kind === 'profile') {
        const em = enrolledMirrorOf(target);
        if (em) em.notes = text;
      } else if (state.noteEdit.kind === 'enrolled') {
        const pm = profileMirrorOf(target);
        if (pm) pm.notes = text;
      }
      renderAll();
      showToast('学生备注已保存');
    }

    function openCourseware(kind, id) {
      const target = findCwTarget(kind, id);
      if (!target) return;
      if (kind === 'trial' && target.status === 'ARCHIVED') return showToast('已归档档案不可调整课件');
      if (state.role === 'parent') {
        if (kind !== 'profile') return;
        if (target.status === 'UNBOUND') return showToast('待认领试课档案由建档/关联班长或平台管理员维护');
        if (target.status !== 'ACTIVE') return showToast('仅可调整本人名下在读孩子的在学课件');
      }
      state.cw = {
        targetKind: kind,
        targetId: id,
        draft: clone(target.courseware || []),
        pickCw: '',
        pickLevel: '',
        pickQuery: '',
        picking: null,
        pendingRemoveIndex: null
      };
      state.overlay = { type: 'courseware' };
      renderAll();
    }

    function cwAdd() {
      const cw = state.cw;
      if (state.online === 'off') return showToast('离线模式下不可调整课件');
      if (cw.draft.length >= 6) return showToast('每个学员最多配置 6 门在学课件');
      if (!cw.pickCw || !cw.pickLevel) return showToast('请选择课件与级别');
      if (cw.draft.some((d) => d.cwId === cw.pickCw)) return showToast('该课件已在在学列表中');
      const newItem = {
        cwId: cw.pickCw,
        level: cw.pickLevel,
        progressText: '',
        lastUpdatedAt: TODAY,
        lastUpdatedBy: operatorName(),
        lastUpdatedRole: currentRoleLabel(),
        teacherUpdates: state.role === 'teacher' ? { [operatorName()]: 1 } : {}
      };
      cw.draft.push(newItem);
      cw.pickCw = '';
      cw.pickLevel = '';
      cw.pickQuery = '';
      cw.picking = null;
      renderOverlayOnly();
    }

    function mirrorCoursewareOf(target, kind) {
      if (kind === 'profile') {
        const em = enrolledMirrorOf(target);
        if (em) em.courseware = clone(target.courseware || []);
      } else if (kind === 'enrolled') {
        const pm = profileMirrorOf(target);
        if (pm) pm.courseware = clone(target.courseware || []);
      }
    }

    function cwSave() {
      if (state.online === 'off') return showToast('离线模式下不可保存课件');
      const cw = state.cw;
      const target = findCwTarget(cw.targetKind, cw.targetId);
      if (!target) return;
      const beforeList = clone(target.courseware || []);
      const beforeIds = beforeList.map((x) => x.cwId).join(',');
      const draftIds = cw.draft.map((x) => x.cwId).join(',');
      const nextDraft = cw.draft.map((item) => {
        const old = beforeList.find((b) => b.cwId === item.cwId);
        if (old) return clone(old);
        return {
          cwId: item.cwId,
          level: item.level || '标准',
          progressText: '',
          lastUpdatedAt: TODAY,
          lastUpdatedBy: operatorName(),
          lastUpdatedRole: currentRoleLabel(),
          teacherUpdates: {}
        };
      });
      if (beforeIds === draftIds) {
        state.overlay = null;
        renderAll();
        return showToast('在学课件未变更');
      }
      target.courseware = nextDraft;
      const beforeSnap = coursewareSnapshot(beforeList);
      const afterSnap = coursewareSnapshot(nextDraft);
      recordFieldChange(target, '在学课件（新增/移除）', beforeSnap, afterSnap, operatorName());
      mirrorCoursewareOf(target, cw.targetKind);
      state.overlay = null;
      renderAll();
      showToast(`在学课件已保存，共 ${nextDraft.length} 门；进度请使用各课件行【更新进度】`);
    }

    function saveProgress() {
      if (state.online === 'off') return showToast('离线模式下不可保存进度');
      const pe = state.progressEdit;
      if (!pe) return;
      const target = findCwTarget(pe.kind, pe.id);
      if (!target || !target.courseware || !target.courseware[pe.index]) {
        state.progressEdit = null;
        state.overlay = null;
        return renderAll();
      }
      const item = target.courseware[pe.index];
      const cwInfo = cwById(item.cwId);
      const beforeText = item.progressText || '';
      const beforeLevel = item.level || '';
      const afterText = String(pe.text || '').trim().slice(0, 2000);
      const afterLevel = pe.level || beforeLevel;
      /* 切换课件级别须二次确认（与移除课件一致）。 */
      if (afterLevel !== beforeLevel && !window.confirm(`切换级别「${beforeLevel || '标准'}」→「${afterLevel}」将同步更新排课与家长端展示，确认切换？`)) return;
      state.progressEdit = null;
      state.overlay = null;
      if (beforeText === afterText && beforeLevel === afterLevel) {
        renderAll();
        return showToast('进度未变更');
      }
      item.level = afterLevel;
      item.progressText = afterText;
      item.lastUpdatedAt = TODAY;
      item.lastUpdatedBy = operatorName();
      item.lastUpdatedRole = currentRoleLabel();
      item.teacherUpdates = item.teacherUpdates || {};
      if (state.role === 'teacher') {
        item.teacherUpdates[operatorName()] = (Number(item.teacherUpdates[operatorName()]) || 0) + 1;
      }
      if (beforeLevel !== afterLevel) {
        recordFieldChange(target, `当前就读级别 (${cwInfo.nameEn})`, beforeLevel || '标准', afterLevel || '标准', operatorName());
      }
      recordFieldChange(target, `进度备注 (${cwInfo.nameEn})`, beforeText || '暂未记录', afterText || '已清空', operatorName());
      mirrorCoursewareOf(target, pe.kind);
      renderAll();
      showToast(state.role === 'parent'
        ? '进度已更新，已提醒关联班长与授课老师'
        : '进度已更新并记入档案变动日志');
    }

    function confirmTransfer() {
      if (state.online === 'off') return showToast('离线模式下不可划转');
      const source = state.enrolled.find((x) => x.id === state.transfer.sourceId);
      const target = state.enrolled.find((x) => x.id === state.transfer.targetId);
      if (!source || !target || source.id === target.id) return showToast('请选择同家庭的另一位在读孩子');
      const maxCount = Math.min(3, pendingTsOf(source));
      const count = Math.max(1, Math.min(maxCount, Number(state.transfer.count) || 1));
      if (count > pendingTsOf(source)) return showToast('划转节数超过待排课次');
      const note = String(state.transfer.note || '').trim();
      if (note.length < 1 || note.length > 200) return showToast('请填写 1-200 字划转备注');
      const holder = source.holderMonitor || '平台';
      let remaining = count;
      const movedTiers = [];
      source.stats.pendingTiers = (source.stats.pendingTiers && source.stats.pendingTiers.length ? source.stats.pendingTiers : [{ price: 16, count: pendingTsOf(source) }])
        .map((t) => {
          const take = Math.min(remaining, Number(t.count) || 0);
          if (take > 0) {
            remaining -= take;
            movedTiers.push({ price: Number(t.price), count: take });
          }
          return { ...t, count: Math.max(0, Number(t.count) - take) };
        })
        .filter((t) => t.count > 0);
      source.stats.pendingTs = Math.max(0, pendingTsOf(source) - count);
      target.stats.pendingTiers = clone(target.stats.pendingTiers || []);
      movedTiers.forEach((m) => {
        const hit = target.stats.pendingTiers.find((t) => Number(t.price) === m.price);
        if (hit) hit.count = Number(hit.count) + m.count;
        else target.stats.pendingTiers.push({ price: m.price, count: m.count });
      });
      target.stats.pendingTs = pendingTsOf(target) + count;
      const tierText = movedTiers.map((t) => `${t.price}积分×${t.count}`).join(' · ');
      recordStatusChange(source, '待排期', '待排期', `同家庭课次划转：向 ${target.nickname} 划转 ${count} 节待排 1v1 TS（${tierText}）；价位、积分快照、原购课单与资金持有人 ${holder} 均不变；备注：${note}`, operatorName());
      recordFieldChange(target, '待排课次（同家庭划转接收）', `${pendingTsOf(target) - count} 节`, `${pendingTsOf(target)} 节`, operatorName());
      const sp = profileMirrorOf(source);
      const tp = profileMirrorOf(target);
      if (sp) { sp.stats = clone(source.stats); sp.audit = clone(source.audit || []); }
      if (tp) { tp.stats = clone(target.stats); tp.audit = clone(target.audit || []); }
      state.overlay = null;
      state.transfer = { sourceId: null, targetId: '', count: 1, note: '' };
      renderAll();
      showToast(`已从 ${source.nickname} 向 ${target.nickname} 划转 ${count} 节，资金持有人 ${holder} 不变，已通知家长`);
    }

    function handleAvatar(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
        e.target.value = '';
        return showToast('仅支持 JPG / PNG / WebP');
      }
      if (file.size > 2 * 1024 * 1024) {
        e.target.value = '';
        return showToast('图片不能超过 2MB');
      }
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 240;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const min = Math.min(img.width, img.height);
          const sx = (img.width - min) / 2;
          const sy = (img.height - min) / 2;
          ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
          const url = canvas.toDataURL('image/webp', 0.85);
          state.form.avatarDataUrl = url;
          const preview = $('avatarPreview');
          const initial = $('avatarInitial');
          if (preview) {
            preview.src = url;
            preview.classList.remove('hidden');
          }
          if (initial) initial.classList.add('hidden');
          showToast('照片已裁剪为 1:1');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function copyNick(nick) {
      try {
        await navigator.clipboard.writeText(nick);
        showToast('规范英文名已复制');
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = nick;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('规范英文名已复制');
      }
    }

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

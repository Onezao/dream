    /* ------------------------------------------------------------------
     * 工具函数

    const $ = (id) => document.getElementById(id);
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function genderLabel(g) {
      if (g === 'male') return '男孩';
      if (g === 'female') return '女孩';
      return '保密';
    }

    function cwById(id) {
      return COURSEWARE_LIB.find((x) => x.id === id) || { id, nameCn: id, nameEn: id, levels: [] };
    }

    function cwCount(p) {
      return (p.courseware || []).length;
    }

    function scheduleChild(p) {
      const nick = String(p.nickname || '').toLowerCase();
      if (nick.startsWith('bob')) return { child: 'bob', demo: false };
      if (nick.startsWith('alice')) return { child: 'alice', demo: false };
      return { child: 'alice', demo: true };
    }

    function scheduleUrl(p) {
      const { child } = scheduleChild(p);
      return `m3a_calendar_grid.html?role=parent&child=${child}&week=0&from=ops`;
    }

    function maskContact(c) {
      if (!c) return '—';
      if (/^\d{11}$/.test(c)) return esc(`${c.slice(0, 3)}****${c.slice(-4)}`);
      return esc(c.length > 8 ? `${c.slice(0, 3)}****${c.slice(-4)}` : c);
    }

    function avatar(p, size = 'h-11 w-11', text = 'text-[16px]', tone = 'indigo') {
      if (p.avatarDataUrl) {
        return `<img src="${esc(p.avatarDataUrl)}" alt="" class="${size} shrink-0 rounded-full object-cover ring-1 ring-slate-200">`;
      }
      const initial = (p.englishName || p.nickname || '?').trim().charAt(0).toUpperCase() || '?';
      const t = TONES[tone] || TONES.indigo;
      return `<span class="${size} grid shrink-0 place-items-center rounded-full ${t.icon} ${text} font-bold ring-1 ring-black/5">${esc(initial)}</span>`;
    }

    function statusChip(status, context = 'parent') {
      const map = {
        ACTIVE: { tone: 'emerald', label: context === 'admin' ? '已转正' : '在读' },
        TRIALING: { tone: 'indigo', label: '试课中' },
        UNBOUND: { tone: 'amber', label: '待认领' },
        ARCHIVED: { tone: 'slate', label: '已归档' }
      };
      const item = map[status] || map.ACTIVE;
      return `<span class="inline-flex shrink-0 items-center rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${TONES[item.tone].chip}">${item.label}</span>`;
    }

    function computeNickname(f) {
      const en = (f.englishName || '').trim();
      const ini = (f.initial || '').trim().toUpperCase();
      const age = String(f.age || '').trim();
      const sfx = (f.suffix || '').trim().toLowerCase();
      if (!en || !ini || !age) return '';
      return `${en}${ini}${age}${sfx}`;
    }

    function allNicknames(excludeId = null) {
      const current = excludeId ? state.profiles.find((p) => p.id === excludeId) : null;
      const currentNick = current ? current.nickname.toLowerCase() : '';
      const names = [
        ...state.profiles.filter((p) => p.id !== excludeId).map((p) => p.nickname),
        ...state.lockedNicknames,
        ...state.trials.map((t) => t.nickname),
        ...EXTERNAL_NICKNAMES
      ];
      return names.filter((n) => n.toLowerCase() !== currentNick);
    }

    function nicknameConflict(nick, excludeId = null) {
      return allNicknames(excludeId).some((n) => n.toLowerCase() === nick.toLowerCase());
    }

    function profileNicknameStatus(f) {
      const en = (f.englishName || '').trim();
      const ini = (f.initial || '').trim();
      if (!en || !ini || !String(f.age || '').trim()) {
        return { ok: false, incomplete: true, message: '填写英文名、首字母与年龄后自动生成' };
      }
      if (!/^[A-Za-z]{1,24}$/.test(en)) return { ok: false, message: '英文名仅支持 1-24 位英文字母' };
      if (!/^[A-Za-z]$/.test(ini)) return { ok: false, message: '姓首字母必须为单个英文字母' };
      if (!Number.isInteger(Number(f.age)) || Number(f.age) < 1 || Number(f.age) > 99) {
        return { ok: false, message: '年龄需为 1-99 的整数' };
      }
      if (f.suffix && !/^[a-z0-9]{1,3}$/.test(f.suffix)) {
        return { ok: false, message: '微调后缀仅支持 1-3 位小写字母或数字' };
      }
      const nick = computeNickname(f);
      if (nick.length < 3 || nick.length > 30 || !/^[A-Za-z]{1,24}[A-Z]\d{1,2}[a-z0-9]{0,3}$/.test(nick)) {
        return { ok: false, message: '规范昵称格式不合法' };
      }
      if (nicknameConflict(nick, f.editingId)) {
        return { ok: false, message: `该昵称已被使用，建议添加后缀（如 ${nick}b）` };
      }
      return { ok: true, message: '该昵称全局唯一，可使用' };
    }

    function trialNicknameStatus(f) {
      const en = (f.englishName || '').trim();
      const ini = (f.initial || '').trim();
      if (!en || !ini || !String(f.age || '').trim()) {
        return { ok: false, incomplete: true, message: '填写英文名、首字母与年龄后自动生成' };
      }
      if (!/^[A-Za-z]{1,24}$/.test(en)) return { ok: false, message: '英文名仅支持 1-24 位英文字母' };
      if (!/^[A-Za-z]$/.test(ini)) return { ok: false, message: '姓首字母必须为单个英文字母' };
      if (!Number.isInteger(Number(f.age)) || Number(f.age) < 1 || Number(f.age) > 99) {
        return { ok: false, message: '年龄需为 1-99 的整数' };
      }
      const nick = computeNickname(f);
      if (!/^[A-Za-z]{1,24}[A-Z]\d{1,2}$/.test(nick)) return { ok: false, message: '规范昵称格式不合法' };
      if (nicknameConflict(nick)) return { ok: false, message: '该昵称已存在，请微调英文名或年龄' };
      return { ok: true, message: '待认领档案将使用该昵称' };
    }

    function profileFormError(f) {
      if (state.online === 'off') return '离线模式下无法创建或编辑档案';
      if (f.mode === 'create' && state.profiles.length >= 10) return '名下档案已达上限 (10/10)';
      if (!f.realName.trim()) return '请填写学生姓名或小名';
      const nickStatus = profileNicknameStatus(f);
      if (!nickStatus.ok) return nickStatus.message;
      return null;
    }

    function trialFormError(f) {
      if (state.online === 'off') return '离线模式下无法创建试课档案';
      if (!f.realName.trim()) return '请填写学生姓名或小名';
      const nickStatus = trialNicknameStatus(f);
      if (!nickStatus.ok) return nickStatus.message;
      if (!f.contact.trim() || f.contact.trim().length < 4) return '请填写家长预留联系方式';
      return null;
    }

    function emptyProfileForm() {
      return {
        mode: 'create', editingId: null, realName: '', englishName: '', initial: '',
        age: '', suffix: '', gender: 'female', prefs: [], avatarDataUrl: '',
        error: '', reason: ''
      };
    }

    function emptyTrialForm() {
      return { realName: '', englishName: '', initial: '', age: '', contact: '', prefs: [], error: '' };
    }

    /* ------------------------------------------------------------------
     * 状态
     * ------------------------------------------------------------------ */
    const state = {
      role: 'parent',
      page: 'center',
      navTab: 'me',
      dataset: 'two',
      device: 'mobile',
      online: 'on',
      profiles: clone(MOCK_PROFILES.two),
      activeId: MOCK_PROFILES.two[0].id,
      lockedNicknames: [],
      enrolled: clone(MOCK_ENROLLED),
      trials: clone(MOCK_TRIALS),
      staffKind: 'enrolled',
      staffId: MOCK_ENROLLED[0].id,
      staffQuery: '',
      staffTab: 'all',
      staffCounselor: 'all',
      adminTab: 'all',
      trialQuery: '',
      overlay: null,
      form: emptyProfileForm(),
      trialForm: emptyTrialForm(),
      claim: { step: 1, nickname: '', last4: '', error: '', matchedId: null },
      bind: { targetId: null, email: '', error: '' },
      cw: { targetKind: 'enrolled', targetId: null, draft: [], pickCw: '', pickLevel: '' }
    };

    const params = new URLSearchParams(location.search);
    if (params.get('role') && ['parent', 'monitor', 'admin'].includes(params.get('role'))) {
      state.role = params.get('role');
      if (state.role === 'monitor') { state.page = 'staffList'; state.navTab = 'ops'; }
      else if (state.role === 'admin') { state.page = 'trials'; state.navTab = 'settings'; }
      else { state.page = 'center'; state.navTab = 'me'; }
    }
    const requestedPage = params.get('page');
    if (requestedPage) {
      const allowed = {
        parent: ['center', 'detail', 'claim'],
        monitor: ['staffList', 'staffDetail'],
        admin: ['center', 'detail', 'claim', 'trials', 'staffList', 'staffDetail']
      }[state.role] || [];
      if (requestedPage === 'claim' && allowed.includes('claim')) {
        state.page = 'center';
        state.overlay = { type: 'claim' };
        state.navTab = state.role === 'admin' ? 'settings' : 'me';
      } else if (allowed.includes(requestedPage)) {
        state.page = requestedPage;
        if (state.page === 'staffList') state.navTab = 'ops';
      }
    }
    if (params.get('tab')) state.navTab = params.get('tab');
    if (params.get('device') === 'tablet') state.device = 'tablet';
    if (state.role !== 'parent') ensureStaffTarget();

    function activeProfile() {
      return state.profiles.find((p) => p.id === state.activeId) || state.profiles[0] || null;
    }

    function operatorName() {
      if (state.role === 'admin') return 'Sarah';
      if (state.role === 'monitor') return 'Leo';
      return 'Amy';
    }

    function operatorEmail() {
      if (state.role === 'admin') return 'sarah@example.com';
      if (state.role === 'monitor') return 'leo@example.com';
      return 'amy@example.com';
    }

    function visibleEnrolled() {
      const list = state.role === 'monitor'
        ? state.enrolled.filter((x) => x.responsible === operatorName())
        : state.enrolled;
      return list.map((x) => ({ ...x, staffKind: 'enrolled' }));
    }

    function counselorLabel(value) {
      if (!value || value === 'platform') return '平台未划拨';
      if (value === 'Sarah') return '我直管';
      return `班长 ${value}`;
    }

    function counselorOptions() {
      const set = [];
      state.enrolled.forEach((x) => {
        const key = x.responsible || 'platform';
        if (!set.includes(key)) set.push(key);
      });
      return set.sort((a, b) => {
        const order = { Sarah: 0, platform: 1 };
        return (order[a] ?? 2) - (order[b] ?? 2) || a.localeCompare(b);
      });
    }

    function counselorMatch(item) {
      if (state.role !== 'admin' || state.staffCounselor === 'all') return true;
      if (state.staffCounselor === 'mine') return item.responsible === operatorName();
      if (state.staffCounselor === 'platform') return !item.responsible;
      return item.responsible === state.staffCounselor;
    }

    function filteredStaff() {
      const q = state.staffQuery.trim().toLowerCase();
      const map = { all: '', active: 'ACTIVE', archived: 'ARCHIVED' };
      return visibleEnrolled().filter((x) => {
        const tabOk = state.staffTab === 'all' || x.status === map[state.staffTab];
        const qOk = !q
          || x.nickname.toLowerCase().includes(q)
          || x.realName.toLowerCase().includes(q)
          || x.englishName.toLowerCase().includes(q);
        return tabOk && qOk && counselorMatch(x);
      });
    }

    function staffTarget() {
      if (state.staffKind === 'trial') {
        const t = state.trials.find((x) => x.id === state.staffId);
        return t ? { ...t, staffKind: 'trial' } : null;
      }
      const p = state.enrolled.find((x) => x.id === state.staffId);
      return p ? { ...p, staffKind: 'enrolled' } : null;
    }

    function ensureStaffTarget() {
      const items = visibleEnrolled();
      if (items.some((x) => x.id === state.staffId && state.staffKind === 'enrolled')) return;
      const preferred = items.find((x) => x.status === 'ACTIVE');
      const first = preferred || items[0];
      state.staffId = first ? first.id : '';
      state.staffKind = first ? first.staffKind : 'enrolled';
    }

    function findCwTarget(kind, id) {
      if (kind === 'trial') return state.trials.find((x) => x.id === id);
      if (kind === 'enrolled') return state.enrolled.find((x) => x.id === id);
      return state.profiles.find((x) => x.id === id);
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function viewAllowed(v) {
      if (state.role === 'parent') return ['center', 'detail', 'claim'].includes(v);
      if (state.role === 'monitor') return ['staffList', 'detail'].includes(v);
      return ['center', 'detail', 'claim', 'staffList', 'trials'].includes(v);
    }

    function currentViewKey() {
      if (state.overlay && state.overlay.type === 'claim') return 'claim';
      if (state.page === 'placeholder') return '';
      if (state.role === 'parent') {
        if (state.page === 'detail') return 'detail';
        return 'center';
      }
      if (state.role === 'monitor') {
        if (state.page === 'staffDetail') return 'detail';
        return 'staffList';
      }
      if (state.page === 'trials') return 'trials';
      if (state.page === 'staffList') return 'staffList';
      if (state.page === 'staffDetail') return 'detail';
      if (state.page === 'detail') return 'detail';
      return 'center';
    }

    function syncConsole() {
      const view = currentViewKey();
      const viewLabels = {
        center: '我的孩子',
        detail: '学员详情',
        claim: '认领试课',
        staffList: state.role === 'admin' ? '全员学生' : '所辖学员',
        trials: '试课学生'
      };
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const value = b.dataset.value;
        let active = false;
        let disabled = false;
        if (group === 'role') active = state.role === value;
        if (group === 'view') {
          active = view === value;
          disabled = !viewAllowed(value);
          b.textContent = viewLabels[value] || b.textContent;
        }
        if (group === 'dataset') { active = state.dataset === value; disabled = !['parent', 'admin'].includes(state.role); }
        if (group === 'device') active = state.device === value;
        if (group === 'online') active = state.online === value;
        b.disabled = disabled;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}${disabled ? ' cursor-not-allowed opacity-40' : ''}`;
      });
    }

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'view') setView(value);
        if (group === 'dataset') setDataset(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：建档、认领与课件调整不可用');
        }
      });
    });

    function setRole(role) {
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.navTab = role === 'parent' ? 'me' : role === 'monitor' ? 'ops' : 'settings';
      state.page = role === 'parent' ? 'center' : role === 'monitor' ? 'staffList' : 'trials';
      state.overlay = null;
      state.staffQuery = '';
      state.staffTab = 'all';
      state.staffCounselor = 'all';
      state.trialQuery = '';
      state.adminTab = 'all';
      if (role !== 'parent') ensureStaffTarget();
      renderAll();
    }

    function setView(view) {
      state.overlay = null;
      if (view === 'claim') return openClaimModal();
      if (state.role === 'parent') {
        if (view === 'center') { state.page = 'center'; state.navTab = 'me'; }
        if (view === 'detail') {
          if (!state.profiles.length) {
            showToast('请先添加孩子档案');
            state.page = 'center'; state.navTab = 'me';
          } else {
            state.page = 'detail'; state.navTab = 'me';
          }
        }
      } else if (state.role === 'monitor') {
        if (view === 'staffList') {
          state.page = 'staffList';
          state.navTab = 'ops';
        }
        if (view === 'detail') {
          ensureStaffTarget();
          state.page = 'staffDetail';
          state.navTab = 'ops';
        }
      } else {
        if (view === 'center') {
          state.page = 'center';
          state.navTab = 'settings';
        }
        if (view === 'detail') {
          if (!state.profiles.length) {
            showToast('请先添加孩子档案');
            state.page = 'center'; state.navTab = 'settings';
          } else {
            state.page = 'detail'; state.navTab = 'settings';
          }
        }
        if (view === 'staffList') {
          state.page = 'staffList';
          state.navTab = 'ops';
        }
        if (view === 'trials') {
          state.page = 'trials'; state.navTab = 'settings';
        }
      }
      renderAll();
    }

    function setDataset(dataset) {
      state.dataset = dataset;
      state.profiles = clone(MOCK_PROFILES[dataset]);
      state.activeId = state.profiles[0] ? state.profiles[0].id : '';
      state.overlay = null;
      if (state.role === 'parent' && state.page === 'detail' && !state.profiles.length) {
        state.page = 'center';
      }
      if (state.staffKind === 'enrolled') ensureStaffTarget();
      renderAll();
    }

    function resetDemo() {
      state.role = 'parent'; state.page = 'center'; state.navTab = 'me'; state.dataset = 'two';
      state.device = 'mobile'; state.online = 'on';
      state.profiles = clone(MOCK_PROFILES.two);
      state.activeId = MOCK_PROFILES.two[0].id;
      state.lockedNicknames = [];
      state.enrolled = clone(MOCK_ENROLLED);
      state.trials = clone(MOCK_TRIALS);
      state.staffKind = 'enrolled'; state.staffId = MOCK_ENROLLED[0].id;
      state.staffQuery = ''; state.staffTab = 'all'; state.staffCounselor = 'all';
      state.adminTab = 'all'; state.trialQuery = '';
      state.overlay = null;
      state.form = emptyProfileForm(); state.trialForm = emptyTrialForm();
      state.claim = { step: 1, nickname: '', last4: '', error: '', matchedId: null };
      state.bind = { targetId: null, email: '', error: '' };
      renderAll();
      showToast('演示数据已重置');
    }

    $('btnResetDemo').addEventListener('click', resetDemo);

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线模式：可查看档案，建档、认领与课件调整不可用`
        : '';

      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = renderNav();
      $('overlay').innerHTML = renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function bannerTitle() {
      if (state.overlay && state.overlay.type === 'claim') return '认领试课';
      if (state.page === 'placeholder') {
        const item = NAVS[state.role].find((n) => n.id === state.navTab);
        return item ? item.label : '';
      }
      if (state.role === 'parent') {
        if (state.page === 'detail') return '学员详情';
        return state.profiles.length ? '我的孩子' : '学员档案';
      }
      if (state.role === 'monitor') {
        return state.page === 'staffDetail' ? '学员详情' : '教务中心';
      }
      if (state.page === 'trials') return '试课学生';
      if (state.page === 'staffList') return '教务中心';
      if (state.page === 'staffDetail') return '学员详情';
      if (state.page === 'detail') return '学员详情';
      return '我的孩子';
    }

    function bannerSubtitle() {
      if (state.overlay && state.overlay.type === 'claim') return '';
      if (state.role === 'monitor' && state.page === 'staffList') {
        return '所辖在读学员 · 在学课件维护';
      }
      if (state.role === 'admin' && state.page === 'staffList') {
        return '全校在籍学员 · 按班长筛选';
      }
      return '';
    }

    function renderBanner() {
      const b = BANNERS[state.role];
      const subtitle = bannerSubtitle();
      return `
        <header class="relative flex h-[64px] shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${b.gradient} px-4 text-white">
          ${b.pattern}
          <div class="relative flex min-w-0 items-center gap-2.5">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${b.initial}</span>
            <div class="min-w-0">
              <div class="truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</div>
              ${subtitle ? `<div class="truncate text-[12px] font-medium text-white/70">${esc(subtitle)}</div>` : ''}
            </div>
          </div>
          <button data-action="toast" data-message="暂无新消息" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
            ${icon('bell', 'h-4 w-4')}
            <span class="absolute -right-0.5 -top-0.5 grid h-4 min-w-[16px] place-items-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white/30">3</span>
          </button>
        </header>`;
    }

    function renderNav() {
      const nav = NAVS[state.role];
      return `
        <div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
          <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
            ${nav.map((item) => {
              const on = state.navTab === item.id;
              return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-500'}">
                ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
                <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
              </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.role === 'parent') {
        const body = !state.profiles.length
          ? renderEmpty()
          : (state.page === 'detail' ? renderDetail() : renderCenter());
        return `${renderSwitcher()}${body}`;
      }
      if (state.role === 'admin') {
        if (state.page === 'trials') return renderTrials();
        if (state.page === 'staffList') return renderStaffList();
        if (state.page === 'staffDetail') return renderStaffDetail();
        const body = !state.profiles.length
          ? renderEmpty()
          : (state.page === 'detail' ? renderDetail() : renderCenter());
        return `${renderSwitcher()}${body}`;
      }
      return state.page === 'staffDetail' ? renderStaffDetail() : renderStaffList();
    }

    /* ------------------------------------------------------------------
     * 通用小组件
     * ------------------------------------------------------------------ */
    function pageHeader(title, subtitle, right = '') {
      return `<div class="flex items-end justify-between gap-3 px-1">
        <div class="min-w-0">
          <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(title)}</h1>
          <p class="mt-0.5 text-[12px] font-medium text-slate-500">${esc(subtitle)}</p>
        </div>
        ${right}
      </div>`;
    }

    function backRow(action, label) {
      return `<button data-action="${action}" class="flex items-center gap-1 text-[14px] font-semibold text-slate-500 transition hover:text-slate-800">
        ${icon('chevron-left', 'h-4 w-4')}${esc(label)}
      </button>`;
    }

    function assetTile(label, value, t) {
      return `<div class="rounded-xl bg-white/60 px-2.5 py-2">
        <div class="text-[12px] font-medium ${t.sub}">${esc(label)}</div>
        <div class="mt-0.5 font-mono text-[18px] font-bold ${t.right}">${esc(value)}</div>
      </div>`;
    }

    function renderSwitcher() {
      const count = state.profiles.length;
      if (!count) {
        return `<div class="sticky top-0 z-20 border-b border-slate-200/70 bg-white/95 px-4 py-2 backdrop-blur">
          <div class="mx-auto flex w-full max-w-[640px] items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-500">暂未绑定学员</span>
            <button data-action="add-profile" ${state.online === 'off' ? 'disabled' : ''} class="h-7 rounded-full border border-indigo-200 bg-white px-2.5 text-[12px] font-bold text-indigo-700 disabled:opacity-40">+ 添加宝贝 (0/10)</button>
          </div>
        </div>`;
      }
      return `<div class="sticky top-0 z-20 border-b border-slate-200/70 bg-white/95 px-4 py-2 backdrop-blur">
        <div class="mx-auto flex w-full max-w-[640px] items-center gap-1.5 overflow-x-auto">
          <span class="shrink-0 text-[12px] font-semibold text-slate-500">当前宝贝</span>
          ${state.profiles.map((p) => {
            const on = p.id === state.activeId;
            return `<button data-action="switch-profile" data-id="${p.id}" class="flex shrink-0 items-center gap-1.5 rounded-full border px-2 py-1 ${on ? 'border-indigo-200 bg-white text-indigo-700 ring-1 ring-indigo-200' : 'border-slate-200 bg-white/70 text-slate-600'}">
              ${avatar(p, 'h-6 w-6', 'text-[12px]')}
              <span class="font-mono text-[12px] font-bold">${esc(p.nickname)}</span>
            </button>`;
          }).join('')}
          <button data-action="add-profile" ${count >= 10 || state.online === 'off' ? 'disabled' : ''} class="shrink-0 rounded-full border border-dashed border-slate-300 bg-white/60 px-2.5 py-1 text-[12px] font-bold text-slate-500 disabled:opacity-40">+ 添加 (${count}/10)</button>
          ${state.role === 'parent' ? `<button data-action="open-claim" ${count >= 10 || state.online === 'off' ? 'disabled' : ''} class="shrink-0 rounded-full border border-indigo-200 bg-white px-2.5 py-1 text-[12px] font-bold text-indigo-700 disabled:opacity-40">认领试课</button>` : ''}
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 档案中心
     * ------------------------------------------------------------------ */
    function renderCenter() {
      const count = state.profiles.length;
      const isFull = count >= 10;
      const blocked = isFull || state.online === 'off';
      const tablet = state.device === 'tablet';

      const addRow = `<button data-action="add-profile" ${blocked ? 'disabled' : ''} class="flex w-full items-center justify-center gap-1.5 ${tablet ? 'rounded-2xl border border-dashed border-slate-300 bg-white/70 py-4' : 'border-t border-dashed border-slate-200 py-3'} text-[14px] font-semibold ${blocked ? 'cursor-not-allowed text-slate-500' : 'text-indigo-700 hover:bg-indigo-50/40'}">
        ${icon('plus', 'h-4 w-4')} ${isFull ? '名下档案已达上限 (10/10)' : `添加新宝贝 (${count}/10)`}
      </button>`;

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('我的孩子', state.role === 'admin' ? `${count} 个孩子 · 仅本人家庭可见` : `${count} 个孩子 · 单账号上限 10 个`, `<button data-action="add-profile" ${blocked ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg bg-indigo-600 px-3 text-[12px] font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">+ 添加</button>`)}
        ${isFull ? `<div class="flex items-start gap-2.5 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2.5">
          <span class="mt-0.5 shrink-0 text-amber-700">${icon('alert-triangle', 'h-4 w-4')}</span>
          <div class="text-[12px] font-medium leading-relaxed text-amber-900"><span class="font-bold">名下档案已达上限 (10/10)</span><br>如需新增，请先注销不再使用的档案。</div>
        </div>` : ''}

        <section class="${tablet ? 'grid grid-cols-2 gap-2' : 'overflow-hidden rounded-2xl border border-slate-200/80 bg-slate-50/70'}">
          ${state.profiles.map((p) => profileItem(p, tablet)).join('')}
          ${tablet ? addRow : ''}
        </section>
        ${!tablet ? addRow : ''}

        ${state.role === 'parent' ? claimCard(blocked) : ''}
        <p class="px-2 text-center text-[12px] font-medium text-slate-500">规范昵称全平台唯一 · 注销后昵称永久保留</p>
      </div>`;
    }

    function profileItem(p, standalone) {
      const active = p.id === state.activeId;
      const cls = standalone
        ? 'rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3'
        : `border-b border-slate-100 last:border-0 ${active ? 'bg-white' : ''}`;
      return `<button data-action="open-profile" data-id="${p.id}" class="flex w-full items-center gap-3 ${cls} px-3.5 py-3 text-left transition hover:bg-slate-50 active:bg-slate-50">
        ${avatar(p, 'h-11 w-11', 'text-[16px]')}
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-1.5">
            <span class="truncate font-mono text-[16px] font-bold text-slate-900">${esc(p.nickname)}</span>
            <span class="shrink-0 rounded-full border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(p.tag || '宝贝')}</span>
            ${statusChip(p.status)}
          </div>
          <div class="mt-0.5 truncate text-[14px] font-medium text-slate-600">${esc(p.realName)} · ${genderLabel(p.gender)} · ${p.age}岁</div>
          <div class="mt-1 flex flex-wrap items-center gap-x-2 text-[12px] font-medium">
            <span class="text-amber-700">待上 ${p.stats.upcoming}</span>
            <span class="text-slate-300">|</span>
            <span class="text-indigo-700">待排 ${p.stats.pendingTs}</span>
            <span class="text-slate-300">|</span>
            <span class="text-slate-500">在学课件 ${cwCount(p)}/6</span>
          </div>
        </div>
        ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-300')}
      </button>`;
    }

    function claimCard(blocked) {
      return `<section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4">
        <div class="flex items-start gap-2.5">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-indigo-100 text-indigo-700">${icon('link-2', 'h-4 w-4')}</span>
          <div class="min-w-0 flex-1">
            <h2 class="text-[16px] font-bold text-indigo-950">认领试课宝贝</h2>
            <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-indigo-900/85">把孩子的试听记录并入当前账号，历史排课、留言与购课单完整保留。</p>
          </div>
        </div>
        <button data-action="open-claim" ${blocked ? 'disabled' : ''} class="mt-3 h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-300">开始认领</button>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 冷启动
     * ------------------------------------------------------------------ */
    function renderEmpty() {
      const teachers = [
        { name: 'David Miller', level: '资深外教 · 少儿英语 / KET', initial: 'D' },
        { name: 'Sarah Jenkins', level: '外教 · 生活口语 / 自然拼读', initial: 'S' }
      ];
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('我的孩子', '暂未绑定学员 · 可先浏览老师')}
        <section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-5">
          <span class="grid h-12 w-12 place-items-center rounded-2xl bg-indigo-100 text-indigo-700">${icon('user-plus', 'h-5 w-5')}</span>
          <h2 class="mt-3 text-[18px] font-bold text-indigo-950">还没有孩子档案</h2>
          <p class="mt-1 text-[14px] font-medium text-indigo-900/85">先浏览老师与空课表，选好课再添加孩子档案。</p>
          <button data-action="add-profile" class="mt-4 h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">添加孩子档案</button>
          <button data-action="open-claim" ${state.online === 'off' ? 'disabled' : ''} class="mt-2 h-10 w-full rounded-xl border border-indigo-200 bg-white/60 text-[14px] font-bold text-indigo-700 disabled:opacity-40">认领试课</button>
        </section>

        <section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4">
          <div class="flex items-center justify-between">
            <h2 class="text-[16px] font-bold text-slate-900">推荐老师</h2>
            <span class="text-[12px] font-medium text-slate-500">公开试听</span>
          </div>
          <div class="mt-2 divide-y divide-slate-100">
            ${teachers.map((t) => `<div class="flex items-center gap-3 py-2.5">
              <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-indigo-50 text-[14px] font-bold text-indigo-700">${t.initial}</span>
              <div class="min-w-0 flex-1">
                <div class="truncate text-[14px] font-bold text-slate-900">${t.name}</div>
                <div class="truncate text-[12px] font-medium text-slate-500">${t.level}</div>
              </div>
              <button data-action="add-profile" data-reason="预约排课前，请先添加宝贝档案" class="h-8 shrink-0 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-50">预约</button>
            </div>`).join('')}
          </div>
        </section>

        <a href="m1b_teacher_parent.html" target="_blank" rel="noopener" class="flex items-center justify-between rounded-2xl border border-slate-200/80 bg-slate-50/70 px-4 py-3">
          <span class="flex items-center gap-2 text-[14px] font-semibold text-slate-700">${icon('plus-circle', 'h-4 w-4 text-slate-500')}去约课大厅看看</span>
          ${icon('chevron-right', 'h-4 w-4 text-slate-300')}
        </a>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 档案详情
     * ------------------------------------------------------------------ */
    function renderDetail() {
      const p = activeProfile();
      if (!p) return renderEmpty();
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        ${backRow('back-center', '我的孩子')}
        ${identityCard(p, 'parent')}
        ${assetCard(p)}
        ${coursewareCard(p, 'parent', 'profile')}
        ${communicationCard(p, 'parent')}
        ${activityCard(p)}
        ${infoCard(p, 'parent')}
        ${p.trialHistory ? `<div class="rounded-xl border border-slate-200/80 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-emerald-800">试课记录已并入：历史完课 ${p.stats.completed} 节，公开留言与试课购课单均可查。</div>` : ''}
        ${auditCard(p)}
        <div class="flex gap-2">
          <button data-action="open-edit" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">编辑档案</button>
          <button data-action="open-guard" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-1 rounded-xl border border-rose-200 bg-rose-50 text-[16px] font-semibold text-rose-700 transition hover:bg-rose-100 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-50 disabled:text-slate-300">注销档案</button>
        </div>
        <p class="text-center text-[12px] font-medium text-slate-500">注销前需清零课时资产</p>
      </div>`;
    }

    function identityCard(p, mode) {
      const isTrial = p.staffKind === 'trial';
      const tag = isTrial
        ? `<span class="shrink-0 rounded-full border border-slate-300 bg-white px-1.5 py-0.5 text-[12px] font-bold text-slate-600">试课档案</span>`
        : (p.tag ? `<span class="shrink-0 rounded-full border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(p.tag)}</span>` : '');
      return `<section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4">
        <div class="flex items-start gap-3.5">
          ${avatar(p, 'h-16 w-16', 'text-[18px]')}
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="truncate font-mono text-[18px] font-bold tracking-tight text-slate-900">${esc(p.nickname)}</span>
              ${tag}
              ${statusChip(p.status, isTrial ? 'admin' : 'parent')}
            </div>
            <div class="mt-1 text-[14px] font-medium text-slate-600">${esc(p.realName)} · ${genderLabel(p.gender)} · ${p.age}岁</div>
            <div class="mt-0.5 truncate font-mono text-[12px] font-medium text-slate-500">${esc(p.id)}</div>
          </div>
          <button data-action="copy-nick" data-nick="${esc(p.nickname)}" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg border border-slate-300 bg-white text-slate-500 transition hover:bg-slate-50" aria-label="复制规范昵称">
            ${icon('copy', 'h-3.5 w-3.5')}
          </button>
        </div>
      </section>`;
    }

    function assetCard(p) {
      const t = TONES.emerald;
      return `<section class="rounded-2xl border ${t.card} p-3.5">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="grid h-8 w-8 place-items-center rounded-xl ${t.icon}">${icon('wallet', 'h-4 w-4')}</span>
            <h2 class="text-[16px] font-bold ${t.title}">课次资产</h2>
          </div>
          <span class="text-[12px] font-medium ${t.sub}">1 积分 = 1 元</span>
        </div>
        <div class="mt-2.5 grid grid-cols-2 gap-1.5">
          ${assetTile('待排课时', `${p.stats.pendingTs} 节`, t)}
          ${assetTile('未来已排', `${p.stats.upcoming} 节`, t)}
          ${assetTile('本期请假', `${p.stats.leaveUsed}/${p.stats.leaveQuota}`, t)}
          ${assetTile('历史完课', `${p.stats.completed} 节`, t)}
        </div>
        ${p.pendingRefund ? `<div class="mt-2 rounded-lg border border-rose-200 bg-rose-50 px-2.5 py-1.5 text-[12px] font-semibold text-rose-700">有 1 笔退款单处理中</div>` : ''}
      </section>`;
    }

    function coursewareCard(p, mode, kind) {
      const list = p.courseware || [];
      const restrictedUnbound = state.role === 'monitor' && p.staffKind === 'trial' && p.status === 'UNBOUND';
      const staff = mode === 'staff' && p.status !== 'ARCHIVED' && !restrictedUnbound;
      return `<section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4">
        <div class="flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-slate-100 text-slate-600">${icon('book-open-check', 'h-4 w-4')}</span>
            <h2 class="truncate text-[16px] font-bold text-slate-900">在学课件</h2>
            <span class="shrink-0 rounded-full bg-slate-100 px-1.5 py-0.5 font-mono text-[12px] font-bold text-slate-500">${list.length}/6</span>
          </div>
          ${staff
            ? `<button data-action="open-courseware" data-kind="${kind}" data-id="${p.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-50 disabled:opacity-40">调整</button>`
            : `<span class="inline-flex shrink-0 items-center gap-1 rounded-full border border-slate-300 bg-white px-2 py-0.5 text-[12px] font-bold text-slate-500">${icon('lock', 'h-3.5 w-3.5')}只读</span>`}
        </div>
        <p class="mt-0.5 text-[12px] font-medium text-slate-500">${staff ? '保存后同步至教师日历与家长端' : restrictedUnbound ? '待认领试课档案由平台管理员维护' : p.status === 'ARCHIVED' ? '已归档档案只读 · 不支持调整' : '由管理员或负责班长维护 · 家长端只读'}</p>
        <div class="mt-2.5 space-y-1.5">
          ${list.length ? list.map((item) => {
            const cw = cwById(item.cwId);
            return `<div class="flex items-center gap-2.5 rounded-xl border border-slate-200/80 bg-white px-2.5 py-2">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-indigo-50 text-indigo-700">${icon('book-open', 'h-4 w-4')}</span>
              <div class="min-w-0 flex-1">
                <div class="truncate text-[14px] font-bold text-slate-900">${esc(cw.nameEn)}</div>
                <div class="truncate text-[12px] font-medium text-slate-500">${esc(cw.nameCn)}</div>
              </div>
              <span class="shrink-0 rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(item.level || '标准')}</span>
            </div>`;
          }).join('') : `<div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 px-3 py-4 text-center text-[12px] font-medium text-slate-500">尚未配置在学课件</div>`}
        </div>
      </section>`;
    }

    function infoCard(p, mode) {
      const isTrial = p.staffKind === 'trial';
      const parentLabel = isTrial
        ? (p.parentEmail ? esc(p.parentEmail) : '平台托管')
        : (mode === 'parent' ? `${operatorName()} · ${operatorEmail()}` : (p.parentEmail ? esc(p.parentEmail) : '原购课家长'));
      const rows = [
        ['规范昵称', `<span class="font-mono">${esc(p.nickname)}</span>`],
        ['学生姓名或小名', esc(p.realName)],
        ['英文名', esc(p.englishName)],
        ['年龄', `${p.age} 岁`],
        ['性别', genderLabel(p.gender)],
        ['出资家长', parentLabel],
        ['建档时间', esc(p.createdAt)],
        [mode === 'staff' ? '负责班长' : '12 位短 ID', mode === 'staff' ? counselorLabel(p.responsible) : `<span class="font-mono">${esc(p.id)}</span>`]
      ];
      if (isTrial) {
        rows.push(
          ['家长预留联系方式', maskContact(p.contact)],
          ['试课进度', esc(p.trialProgress || '—')],
          ['建档人', esc(p.createdBy || 'Sarah')]
        );
      }
      return `<section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4">
        <h2 class="text-[16px] font-bold text-slate-900">基础信息</h2>
        <div class="mt-2.5 grid grid-cols-2 gap-x-3 gap-y-2.5">
          ${rows.map(([k, v]) => `<div class="min-w-0">
            <div class="text-[12px] font-medium text-slate-500">${k}</div>
            <div class="mt-0.5 truncate text-[14px] font-semibold text-slate-900">${v}</div>
          </div>`).join('')}
        </div>
        <div class="mt-3 border-t border-slate-100 pt-2.5">
          <div class="flex items-center justify-between">
            <span class="text-[12px] font-medium text-slate-500">选课偏好</span>
            <span class="text-[12px] font-medium text-slate-500">不选即不限</span>
          </div>
          <div class="mt-1.5 flex flex-wrap gap-1.5">
            ${p.prefs && p.prefs.length
              ? p.prefs.map((t) => `<span class="rounded-lg border border-indigo-100 bg-indigo-50 px-2 py-1 text-[12px] font-bold text-indigo-700">${esc(t)}</span>`).join('')
              : `<span class="text-[14px] font-medium text-slate-500">不限课程类型</span>`}
          </div>
        </div>
      </section>`;
    }

    function communicationCard(p, mode) {
      const publicNote = p.publicNote || '';
      const internalNote = p.internalNote || '';
      const showInternal = mode === 'staff' && !!internalNote;
      return `<section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4">
        <div class="flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-slate-100 text-slate-600">${icon('message-square', 'h-4 w-4')}</span>
            <h2 class="truncate text-[16px] font-bold text-slate-900">留言板</h2>
          </div>
          <span class="shrink-0 rounded-full border border-indigo-100 bg-indigo-50 px-2 py-0.5 text-[12px] font-bold text-indigo-700">公开留言家长可见</span>
        </div>
        <div class="mt-2.5 space-y-2">
          <div class="rounded-xl border border-slate-200/80 bg-white px-3 py-2.5">
            <div class="flex items-center justify-between gap-2 text-[12px] font-bold text-indigo-700">
              <span>外教公开留言</span>
              <span class="font-medium">公开可见</span>
            </div>
            <p class="mt-1 text-[14px] font-medium leading-relaxed text-indigo-900/85">${publicNote ? esc(publicNote) : '暂无公开留言，结课后由授课老师提交。'}</p>
          </div>
          ${showInternal ? `<div class="rounded-xl border border-slate-200/80 bg-slate-50 px-3 py-2.5">
            <div class="flex items-center justify-between gap-2 text-[12px] font-bold text-slate-700">
              <span class="flex items-center gap-1">${icon('lock', 'h-3.5 w-3.5')}教学内部留言</span>
              <span class="font-medium text-slate-500">仅班长与教师可见</span>
            </div>
            <p class="mt-1 text-[14px] font-medium leading-relaxed text-slate-700">${esc(internalNote)}</p>
          </div>` : ''}
        </div>
      </section>`;
    }

    // 履约动态：覆盖请假、挪位、代课、缺勤等 14 类不可变事件；UI 不暴露“14 类”技术词。
    function activityCard(p) {
      const events = [
        { tone: 'rose', tag: '请假', text: '11-15 19:00 请假退回待排池（扣 1 次配额）' },
        { tone: 'amber', tag: '挪位', text: '11-08 18:30 → 11-10 19:00（David · 免扣配额）' },
        { tone: 'indigo', tag: '代课', text: '11-01 16:00 由 Elena 代课（照常履约）' }
      ];
      const dot = { rose: 'bg-rose-500', amber: 'bg-amber-500', indigo: 'bg-indigo-500' };
      const chip = {
        rose: 'border-rose-200 bg-rose-100 text-rose-700',
        amber: 'border-amber-200 bg-amber-100 text-amber-800',
        indigo: 'border-indigo-200 bg-indigo-100 text-indigo-700'
      };
      return `<section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4">
        <div class="flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl border border-slate-200 bg-white text-indigo-600">${icon('activity', 'h-4 w-4')}</span>
            <h2 class="truncate text-[16px] font-bold text-slate-900">履约动态</h2>
            <span class="shrink-0 rounded-full border border-slate-200 bg-white px-1.5 py-0.5 text-[12px] font-bold text-slate-600">Activity Stream</span>
          </div>
          <span class="shrink-0 text-[12px] font-semibold text-slate-600">配额剩余: 1/2 次</span>
        </div>
        <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-slate-200">
          <div class="h-full w-1/2 rounded-full bg-indigo-500"></div>
        </div>
        <div class="mt-2.5 space-y-1.5">
          ${events.map((e) => `<div class="flex items-start gap-2 rounded-xl border border-slate-200/80 bg-white px-2.5 py-2">
            <span class="mt-1 h-[7px] w-[7px] shrink-0 rounded-full ${dot[e.tone]}"></span>
            <span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${chip[e.tone]}">${e.tag}</span>
            <span class="min-w-0 text-[12px] font-medium leading-relaxed text-slate-700">${e.text}</span>
          </div>`).join('')}
        </div>
        <button data-action="toast" data-message="正在打开该学员完整动态时间轴" class="mt-2.5 w-full text-right text-[12px] font-bold text-indigo-600">查看该学员完整动态时间轴 →</button>
      </section>`;
    }

    function auditCard(p) {
      if (!p.audit || !p.audit.length) return '';
      return `<details class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4">
        <summary class="flex cursor-pointer list-none items-center justify-between [&::-webkit-details-marker]:hidden">
          <span class="text-[16px] font-bold text-slate-900">变更记录</span>
          <span class="text-[12px] font-medium text-slate-500">${p.audit.length} 条</span>
        </summary>
        <div class="mt-3 space-y-2.5">
          ${p.audit.slice(0, 5).map((a) => `<div class="flex items-start gap-2.5">
            <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-indigo-400"></span>
            <div class="min-w-0">
              <div class="text-[12px] font-medium text-slate-500">${esc(a.at)} · ${esc(a.by)}</div>
              <div class="text-[14px] font-medium leading-relaxed text-slate-800">${esc(a.text)}</div>
            </div>
          </div>`).join('')}
        </div>
      </details>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 认领试课
     * ------------------------------------------------------------------ */
    function renderClaimModal() {
      const blocked = state.online === 'off' || state.profiles.length >= 10;
      const t = state.trials.find((x) => x.id === state.claim.matchedId);
      if (state.claim.step === 2 && !t) state.claim.step = 1;
      const blockedMsg = state.online === 'off'
        ? '离线模式下不可认领，请联网后重试'
        : state.profiles.length >= 10
          ? '名下档案已达上限 (10/10)，请先注销不再使用的档案'
          : '';
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-4 top-1/2 max-h-[88%] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h2 class="text-[18px] font-bold tracking-tight text-slate-900">认领试课</h2>
              <p class="mt-0.5 text-[12px] font-medium text-slate-500">核验规范昵称与预留联系方式后四位</p>
            </div>
            <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="mt-3">${stepIndicator()}</div>
          ${blockedMsg ? `<div class="mt-3 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-amber-900">${blockedMsg}</div>` : ''}
          <div class="mt-3">${state.claim.step === 1 ? claimStep1(blocked) : claimStep2(t, blocked)}</div>
        </div>
      </div>`;
    }

    function openClaimModal() {
      state.claim = { step: 1, nickname: '', last4: '', matchedId: null, error: '' };
      state.overlay = { type: 'claim' };
      renderAll();
    }

    function stepIndicator() {
      const reached = state.claim.step;
      const dot = (n, label) => `<div class="flex items-center gap-2">
        <span class="grid h-6 w-6 place-items-center rounded-full text-[12px] font-bold ${reached >= n ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}">${n}</span>
        <span class="text-[12px] font-semibold ${reached >= n ? 'text-indigo-700' : 'text-slate-500'}">${label}</span>
      </div>`;
      return `<div class="flex items-center gap-2 px-1">
        ${dot(1, '核验信息')}
        <div class="h-px flex-1 bg-slate-200"></div>
        ${dot(2, '确认认领')}
      </div>`;
    }

    function claimStep1(blocked) {
      return `<section class="space-y-3 rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4">
        <div>
          <label for="claimNickname" class="mb-1 block text-[14px] font-semibold text-slate-700">孩子规范昵称</label>
          <input id="claimNickname" value="${esc(state.claim.nickname)}" placeholder="如 LeoW8" maxlength="30" class="h-11 w-full rounded-xl border ${state.claim.error ? 'border-rose-300' : 'border-slate-200'} bg-white px-3 font-mono text-[16px] font-semibold text-slate-900 outline-none transition focus:border-indigo-500">
          <p class="mt-1 text-[12px] font-medium text-slate-500">昵称可向建档老师获取</p>
        </div>
        <div>
          <label for="claimLast4" class="mb-1 block text-[14px] font-semibold text-slate-700">建档预留手机 / 微信后四位</label>
          <input id="claimLast4" value="${esc(state.claim.last4)}" inputmode="numeric" maxlength="4" placeholder="8000" class="h-11 w-full rounded-xl border ${state.claim.error ? 'border-rose-300' : 'border-slate-200'} bg-white px-3 font-mono text-[16px] font-semibold tracking-widest text-slate-900 outline-none transition focus:border-indigo-500">
          <p class="mt-1 text-[12px] font-medium text-slate-500">也可由教务老师在后台绑定家长邮箱</p>
        </div>
        ${state.claim.error ? `<div id="claimError" class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[12px] font-medium text-rose-700">${esc(state.claim.error)}</div>` : ''}
        <button data-action="claim-query" ${blocked ? 'disabled' : ''} class="h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">查询宝贝</button>
        <p class="text-center text-[12px] font-medium text-slate-500">演示：LeoW8 · 后四位 8000</p>
      </section>`;
    }

    function claimStep2(t, blocked) {
      return `<section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4">
        <div class="flex items-start gap-3">
          ${avatar(t, 'h-14 w-14', 'text-[18px]', 'indigo')}
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="font-mono text-[18px] font-bold text-indigo-950">${esc(t.nickname)}</span>
              ${statusChip(t.status, 'admin')}
            </div>
            <div class="mt-0.5 text-[14px] font-medium text-indigo-900/85">${esc(t.realName)} · ${genderLabel(t.gender)} · ${t.age}岁</div>
            <div class="mt-0.5 text-[12px] font-medium text-indigo-700">历史试听 ${t.trialLessons} 节</div>
          </div>
        </div>
        <div class="mt-3 rounded-xl bg-white/60 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900/85">历史排课、老师公开留言、留言板与试课购课单将无缝并入您的名下。</div>
        ${state.claim.error ? `<div id="claimError" class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[12px] font-medium text-rose-700">${esc(state.claim.error)}</div>` : ''}
        <div class="mt-3 flex gap-2">
          <button data-action="claim-back" class="h-11 flex-1 rounded-xl border border-indigo-200 bg-white/70 text-[16px] font-semibold text-indigo-700">返回修改</button>
          <button data-action="claim-confirm" ${blocked ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-300">确认认领并绑定</button>
        </div>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 班长 / 管理员 · 学员列表
     * ------------------------------------------------------------------ */
    function renderStaffList() {
      const isAdmin = state.role === 'admin';
      const base = visibleEnrolled().filter(counselorMatch);
      const counts = {
        all: base.length,
        active: base.filter((x) => x.status === 'ACTIVE').length,
        archived: base.filter((x) => x.status === 'ARCHIVED').length
      };
      const items = filteredStaff();
      const tablet = state.device === 'tablet';
      const options = counselorOptions();
      const counselorSelect = isAdmin
        ? `<select id="staffCounselor" class="h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-[16px] font-semibold text-slate-700 outline-none transition focus:border-indigo-500">
            <option value="all" ${state.staffCounselor === 'all' ? 'selected' : ''}>全部班长</option>
            <option value="mine" ${state.staffCounselor === 'mine' ? 'selected' : ''}>我直管</option>
            <option value="platform" ${state.staffCounselor === 'platform' ? 'selected' : ''}>平台未划拨</option>
            ${options.filter((k) => k !== 'Sarah' && k !== 'platform').map((k) => `<option value="${esc(k)}" ${state.staffCounselor === k ? 'selected' : ''}>班长 ${esc(k)}</option>`).join('')}
          </select>`
        : '';
      const seg = (key, label, count) => `<button data-action="staff-tab" data-tab="${key}" class="flex-1 rounded-xl px-2 py-2 text-[12px] font-bold transition ${state.staffTab === key ? 'bg-white text-indigo-700' : 'text-slate-500'}">${label}${count ? ` (${count})` : ''}</button>`;
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        <div class="flex items-end justify-between gap-3 px-1">
          <div class="min-w-0">
            <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${isAdmin ? '全员学生' : '所辖学员'}</h1>
            <p class="mt-0.5 text-[12px] font-medium text-slate-500">${isAdmin ? '可按班长筛选' : '在学课件由您维护'}</p>
          </div>
          <span class="shrink-0 rounded-full border border-slate-200 bg-white px-2 py-0.5 text-[12px] font-bold text-slate-600">教务中心 · ${isAdmin ? '全员学生' : '所辖学员'}</span>
        </div>
        <div class="space-y-2">
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
            <input id="staffSearch" value="${esc(state.staffQuery)}" placeholder="搜索昵称 / 学生姓名或小名" class="h-11 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500">
          </div>
          ${counselorSelect}
        </div>
        <div class="flex gap-1 rounded-2xl bg-slate-200/60 p-1">
          ${seg('all', '全部', counts.all)}
          ${seg('active', '在读', counts.active)}
          ${seg('archived', '已归档', counts.archived)}
        </div>
        ${items.some((p) => scheduleChild(p).demo) ? `<div class="flex items-start gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-[12px] font-medium text-slate-600">
          <span class="mt-0.5 shrink-0 text-slate-500">${icon('info', 'h-3.5 w-3.5')}</span>
          <span>演示数据：非 Alice / Bob 学员的课表统一展示 Alice 的周课表</span>
        </div>` : ''}
        <div class="${tablet ? 'grid grid-cols-2 gap-2' : 'space-y-2'}">
          ${items.length
            ? items.map((p) => staffRow(p)).join('')
            : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-500">没有匹配的学员</div>`}
        </div>
      </div>`;
    }

    function staffRow(p) {
      const cw = p.courseware && p.courseware.length ? cwById(p.courseware[0].cwId) : null;
      const schedule = scheduleChild(p);
      return `<article class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3">
        <button data-action="staff-open" data-kind="${p.staffKind}" data-id="${p.id}" class="flex w-full items-center gap-3 text-left">
          ${avatar(p, 'h-11 w-11', 'text-[16px]')}
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="truncate font-mono text-[16px] font-bold text-slate-900">${esc(p.nickname)}</span>
              ${statusChip(p.status, 'parent')}
              <span class="shrink-0 rounded-full border border-slate-300 bg-white px-1.5 py-0.5 text-[12px] font-bold text-slate-600">${esc(counselorLabel(p.responsible))}</span>
            </div>
            <div class="mt-0.5 truncate text-[14px] font-medium text-slate-600">${esc(p.realName)} · ${genderLabel(p.gender)} · ${p.age}岁</div>
            <div class="mt-1 flex flex-wrap items-center gap-x-2 text-[12px] font-medium text-slate-500">
              <span>授课 ${esc(p.teacher || '待安排')}</span>
              <span class="text-slate-300">·</span>
              <span>固定 ${p.stats.fixed ?? 0} / 临时 ${p.stats.temp ?? 0}</span>
            </div>
            ${cw ? `<div class="mt-0.5 truncate text-[12px] font-medium text-slate-500">在学课件 ${esc(cw.nameEn)} ${esc(p.courseware[0].level || '')}</div>` : ''}
          </div>
          ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-300')}
        </button>
        <div class="mt-2 flex gap-1.5 border-t border-slate-100 pt-2">
          <a href="${scheduleUrl(p)}" target="_blank" rel="noopener" title="${schedule.demo ? '演示数据：该学员课表统一展示 Alice 的周课表' : '查看该学员周课表'}" class="flex h-8 flex-1 items-center justify-center gap-1 whitespace-nowrap rounded-lg border border-slate-300 bg-white text-[12px] font-bold text-slate-700 transition hover:bg-slate-50">${icon('calendar-days', 'h-3.5 w-3.5 shrink-0')}查看课表</a>
          <button data-action="buy4" data-nick="${esc(p.nickname)}" class="flex h-8 flex-1 items-center justify-center gap-1 rounded-lg bg-indigo-600 text-[12px] font-bold text-white transition hover:bg-indigo-700">${icon('plus', 'h-3.5 w-3.5')}买4排4</button>
          <button data-action="staff-open" data-kind="${p.staffKind}" data-id="${p.id}" class="flex h-8 flex-1 items-center justify-center gap-1 rounded-lg border border-slate-200 bg-white text-[12px] font-bold text-slate-600 transition hover:bg-slate-50">档案 / 学情 ↗</button>
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 班长 / 管理员 · 档案详情
     * ------------------------------------------------------------------ */
    function renderStaffDetail() {
      const p = staffTarget();
      if (!p) return renderStaffList();
      const isTrial = p.staffKind === 'trial';
      const canBind = isTrial && (p.status === 'UNBOUND' || p.status === 'TRIALING');
      const backLabel = isTrial ? '试课学生' : (state.role === 'admin' ? '全员学生' : '所辖学员');
      const schedule = scheduleChild(p);
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        ${backRow('back-staff', backLabel)}
        ${identityCard(p, 'staff')}
        ${canBind ? bindCard(p) : ''}
        ${!isTrial ? assetCard(p) : ''}
        ${coursewareCard(p, 'staff', p.staffKind)}
        ${infoCard(p, 'staff')}
        ${communicationCard(p, 'staff')}
        ${activityCard(p)}
        ${isTrial && p.status === 'ACTIVE' ? `<div class="rounded-xl border border-slate-200/80 bg-white px-3 py-2.5 text-[12px] font-medium text-emerald-800">已转正并绑定至 ${esc(p.parentEmail || '家长账号')}${p.claimedAt ? ` · ${esc(p.claimedAt)}` : ''}</div>` : ''}
        ${isTrial && p.status === 'ARCHIVED' ? `<div class="rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-[12px] font-medium text-slate-500">已于 ${esc(p.archivedAt || '—')} 归档 · 昵称仍保持占用</div>` : ''}
        ${auditCard(p)}
        ${schedule.demo ? `<div class="flex items-start gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-[12px] font-medium text-slate-600">
          <span class="mt-0.5 shrink-0 text-slate-500">${icon('info', 'h-3.5 w-3.5')}</span>
          <span>演示数据：该学员课表展示 Alice 的周课表</span>
        </div>` : ''}
        <div class="flex gap-2">
          <a href="${scheduleUrl(p)}" target="_blank" rel="noopener" title="${schedule.demo ? '演示数据：该学员课表统一展示 Alice 的周课表' : '查看该学员周课表'}" class="flex h-11 flex-1 items-center justify-center gap-1.5 whitespace-nowrap rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-700 transition hover:bg-slate-50">${icon('calendar-days', 'h-4 w-4 shrink-0')}查看课表</a>
          ${isTrial
            ? `<button data-action="toast" data-message="已打开 1v1 临时课代约" class="flex h-11 flex-1 items-center justify-center gap-1.5 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">${icon('calendar-plus', 'h-4 w-4')}代约试听课</button>`
            : `<button data-action="buy4" data-nick="${esc(p.nickname)}" class="flex h-11 flex-1 items-center justify-center gap-1.5 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">${icon('plus', 'h-4 w-4')}买4排4</button>`}
        </div>
      </div>`;
    }

    function bindCard(t) {
      const expiring = t.status === 'UNBOUND' && t.daysLeft <= 7;
      return `<section class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <h2 class="text-[16px] font-bold text-slate-900">${t.status === 'TRIALING' ? '试课中 · 可绑定家长' : '待认领试课档案'}</h2>
            <p class="mt-0.5 text-[12px] font-medium text-slate-500">档案暂归平台托管 · 绑定后历史课表、留言与订单完整继承</p>
          </div>
          ${expiring ? `<span class="shrink-0 text-[12px] font-medium text-rose-700">(剩 ${t.daysLeft} 天归档)</span>` : ''}
        </div>
        <div class="mt-3 flex gap-2">
          <button data-action="open-bind" data-id="${t.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-10 flex-1 rounded-lg bg-indigo-600 text-[14px] font-bold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">绑定家长 Email</button>
          <button data-action="toast" data-message="已打开 1v1 临时课代约" class="h-10 flex-1 rounded-lg border border-slate-300 bg-white text-[14px] font-bold text-slate-700 transition hover:bg-slate-50">代约试听课</button>
        </div>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 管理员 · 试课档案
     * ------------------------------------------------------------------ */
    function renderTrials() {
      const all = state.trials;
      const map = { all: null, unbound: 'UNBOUND', trialing: 'TRIALING', active: 'ACTIVE', archived: 'ARCHIVED' };
      const counts = {
        all: all.length,
        unbound: all.filter((t) => t.status === 'UNBOUND').length,
        trialing: all.filter((t) => t.status === 'TRIALING').length,
        active: all.filter((t) => t.status === 'ACTIVE').length,
        archived: all.filter((t) => t.status === 'ARCHIVED').length
      };
      const q = state.trialQuery.trim().toLowerCase();
      const list = all.filter((t) => {
        if (map[state.adminTab] && t.status !== map[state.adminTab]) return false;
        if (!q) return true;
        return [t.nickname, t.realName, t.englishName, t.contact].some((v) => String(v || '').toLowerCase().includes(q));
      });
      const tablet = state.device === 'tablet';
      const seg = (key, label, count) => `<button data-action="set-admin-tab" data-tab="${key}" class="flex-1 whitespace-nowrap rounded-xl px-1.5 py-2 text-[12px] font-bold transition ${state.adminTab === key ? 'bg-white text-indigo-700' : 'text-slate-500'}">${label}${count ? ` (${count})` : ''}</button>`;
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        <div class="flex items-center justify-between gap-3 px-1">
          <p class="min-w-0 text-[12px] font-medium text-slate-600">免注册代建 · 30 天未认领自动归档</p>
          <button data-action="open-trial" ${state.online === 'off' ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg bg-indigo-600 px-3 text-[12px] font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">+ 新建试课</button>
        </div>
        <div class="relative">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
          <input id="trialSearch" value="${esc(state.trialQuery)}" placeholder="搜索昵称 / 学生姓名或小名" class="h-11 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500">
        </div>
        <div class="flex gap-1 overflow-x-auto rounded-2xl bg-slate-200/60 p-1">
          ${seg('all', '全部', counts.all)}
          ${seg('unbound', '待认领', counts.unbound)}
          ${seg('trialing', '试课中', counts.trialing)}
          ${seg('active', '已转正', counts.active)}
          ${seg('archived', '已归档', counts.archived)}
        </div>
        <div class="${tablet ? 'grid grid-cols-2 gap-2' : 'space-y-2'}">
          ${list.length
            ? list.map((t) => trialCard(t)).join('')
            : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-500">没有匹配的试课学生</div>`}
        </div>
      </div>`;
    }

    function trialCard(t) {
      const expiring = t.status === 'UNBOUND' && t.daysLeft <= 7;

      if (state.overlay.type === 'trial') return renderTrialSheet();
      if (state.overlay.type === 'guard') return renderGuardModal();
      if (state.overlay.type === 'bind') return renderBindModal();
      if (state.overlay.type === 'claim') return renderClaimModal();
      if (state.overlay.type === 'courseware') return renderCoursewareSheet();
      return '';

<!-- 即抛型原型：M1A 学员与多孩档案中心。纯前端 Mock，不连接后端，不触碰生产代码。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>原型 · M1A 学员与多孩档案中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Inter', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800 antialiased">

  <!-- 原型控制台（不属于产品界面） -->
  <header class="sticky top-0 z-[60] border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-5 gap-y-2 px-4 py-2.5 text-[12px]">
      <div class="flex items-center gap-2">
        <span class="grid h-6 w-6 place-items-center rounded-lg bg-slate-900 text-[12px] font-bold text-amber-400">1A</span>
        <span class="text-[14px] font-bold text-slate-900">学员与多孩档案中心</span>
        <span class="hidden text-[12px] font-medium text-slate-400 lg:inline">最新 PRD · 底栏 ≤ 4 Tab</span>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">角色</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="role" data-value="parent" class="ctl rounded-lg px-3 py-1.5 font-semibold">家长</button>
          <button data-group="role" data-value="admin" class="ctl rounded-lg px-3 py-1.5 font-semibold">管理员</button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">页面</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="page" data-value="center" class="ctl rounded-lg px-3 py-1.5 font-semibold">档案中心</button>
          <button data-group="page" data-value="detail" class="ctl rounded-lg px-3 py-1.5 font-semibold">档案详情</button>
          <button data-group="page" data-value="claim" class="ctl rounded-lg px-3 py-1.5 font-semibold">认领试课</button>
          <button data-group="page" data-value="admin" class="ctl rounded-lg px-3 py-1.5 font-semibold">试课管理</button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">档案数据</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="dataset" data-value="empty" data-parent-only class="ctl rounded-lg px-3 py-1.5 font-semibold">无档案</button>
          <button data-group="dataset" data-value="two" data-parent-only class="ctl rounded-lg px-3 py-1.5 font-semibold">2 个孩子</button>
          <button data-group="dataset" data-value="full" data-parent-only class="ctl rounded-lg px-3 py-1.5 font-semibold">已满 10 个</button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">设备</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="device" data-value="mobile" class="ctl rounded-lg px-3 py-1.5 font-semibold">手机</button>
          <button data-group="device" data-value="tablet" class="ctl rounded-lg px-3 py-1.5 font-semibold">平板</button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="font-medium text-slate-500">网络</span>
        <div class="inline-flex rounded-xl bg-slate-100 p-1">
          <button data-group="online" data-value="on" class="ctl rounded-lg px-3 py-1.5 font-semibold">在线</button>
          <button data-group="online" data-value="off" class="ctl rounded-lg px-3 py-1.5 font-semibold">离线</button>
        </div>
      </div>

      <a href="../docs/prd/m1a_student_profile.md" target="_blank" rel="noopener" class="ml-auto hidden items-center gap-1.5 rounded-lg border border-slate-200 px-2.5 py-1.5 font-semibold text-slate-500 hover:bg-slate-50 lg:inline-flex">
        <i data-lucide="file-text" class="h-3.5 w-3.5"></i>M1A PRD
      </a>
    </div>
  </header>

  <main class="flex justify-center px-4 py-6">
    <!-- 手机优先画框；平板由 JS 切换为 768px -->
    <div id="frame" class="relative flex h-[812px] w-[390px] shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300">
      <div id="topbar" class="shrink-0"></div>
      <div id="offlineBanner" class="hidden">
        <i data-lucide="wifi-off" class="h-4 w-4 shrink-0 text-amber-600"></i>
        离线模式：可切换宝贝与查看缓存，建档、编辑、认领与注销不可用
      </div>
      <div id="content" class="flex-1 overflow-y-auto"></div>
      <nav id="bottomnav" class="shrink-0"></nav>
      <div id="overlay"></div>
      <div id="toast" class="pointer-events-none absolute bottom-24 left-1/2 z-[80] hidden -translate-x-1/2 whitespace-nowrap rounded-full bg-slate-900/90 px-4 py-2 text-[12px] font-semibold text-white shadow-xl"></div>
    </div>
  </main>

  <!-- Tailwind CDN 动态类安全垫 -->
  <div class="hidden">
    <span class="h-[812px] w-[390px] h-[860px] w-[768px] min-h-[56px] max-h-[520px]"></span>
    <span class="bg-indigo-600 bg-indigo-50 text-indigo-700 border-indigo-100 text-indigo-950"></span>
    <span class="bg-emerald-50 text-emerald-700 border-emerald-200 bg-amber-50 text-amber-800 border-amber-200"></span>
    <span class="bg-rose-50 text-rose-600 text-rose-700 border-rose-200 bg-slate-100 text-slate-500 border-slate-200"></span>
    <span class="bg-rose-600 border-rose-300 text-emerald-600 text-emerald-800 text-slate-300 bg-slate-900/40 backdrop-blur-[1px] rotate-180"></span>
  </div>

  <script>
    /* ------------------------------------------------------------------
     * 常量与假数据
     * ------------------------------------------------------------------ */
    const COURSE_TYPES = ['少儿英语', '生活口语', '旅游口语', '自然拼读', 'KET', 'PET', '雅思', '托福'];
    const REGISTERED_EMAILS = ['amy@example.com', 'grace@example.com', 'tom@example.com', 'leo@example.com'];
    const EXTERNAL_NICKNAMES = ['TomB08', 'LeoW10', 'KevinZ9'];
    const TODAY = '2026-11-07';

    const MOCK_PROFILES = {
      empty: [],
      two: [
        {
          id: 'sp_alice00001', nickname: 'AliceZ12', realName: '张小丽', englishName: 'Alice',
          surnameInitial: 'Z', age: 12, gender: 'female', tag: '大宝', suffix: '',
          prefs: ['少儿英语', 'KET'], status: 'ACTIVE', createdAt: '2026-03-12',
          stats: { upcoming: 2, pendingTs: 4, leaveUsed: 1, leaveQuota: 2, completed: 38 },
          pendingRefund: false
        },
        {
          id: 'sp_bob0000002', nickname: 'BobZ10', realName: '张小博', englishName: 'Bob',
          surnameInitial: 'Z', age: 10, gender: 'male', tag: '二宝', suffix: '',
          prefs: ['生活口语'], status: 'ACTIVE', createdAt: '2026-05-08',
          stats: { upcoming: 1, pendingTs: 1, leaveUsed: 0, leaveQuota: 2, completed: 22 },
          pendingRefund: false
        }
      ],
      full: Array.from({ length: 10 }).map((_, i) => {
        const letter = String.fromCharCode(65 + i);
        const age = 8 + (i % 5);
        return {
          id: `sp_kid${String(i + 1).padStart(7, '0')}`,
          nickname: `Kid${letter}Z${age}`,
          realName: `孩子 ${i + 1} 号`,
          englishName: `Kid${letter}`,
          surnameInitial: 'Z', age, gender: i % 2 === 0 ? 'female' : 'male',
          tag: `宝贝 ${i + 1}`, suffix: '', prefs: ['少儿英语'], status: 'ACTIVE',
          createdAt: '2026-09-01',
          stats: { upcoming: i % 3, pendingTs: 0, leaveUsed: 0, leaveQuota: 2, completed: i * 4 },
          pendingRefund: false
        };
      })
    };

    const MOCK_TRIALS = [
      {
        id: 'tr_leow800001', nickname: 'LeoW8', realName: '王小明', englishName: 'Leo',
        surnameInitial: 'W', age: 8, gender: 'male', contact: '13800138000',
        prefs: ['少儿英语'], status: 'UNBOUND', createdAt: '2026-10-30',
        lastLessonDate: '2026-11-02', trialLessons: 1, daysLeft: 25, createdBy: 'Sarah'
      },
      {
        id: 'tr_miac600002', nickname: 'MiaC6', realName: '陈米娅', englishName: 'Mia',
        surnameInitial: 'C', age: 6, gender: 'female', contact: 'wx_mia_2026',
        prefs: ['自然拼读'], status: 'UNBOUND', createdAt: '2026-10-01',
        lastLessonDate: '2026-10-09', trialLessons: 2, daysLeft: 1, createdBy: 'Sarah'
      },
      {
        id: 'tr_ethanl9003', nickname: 'EthanL9', realName: '李一辰', englishName: 'Ethan',
        surnameInitial: 'L', age: 9, gender: 'male', contact: '13900139000',
        prefs: ['生活口语'], status: 'UNBOUND', createdAt: '2026-11-05',
        lastLessonDate: null, trialLessons: 0, daysLeft: 28, createdBy: 'Sarah'
      },
      {
        id: 'tr_tomh700004', nickname: 'TomH7', realName: '韩小虎', englishName: 'Tom',
        surnameInitial: 'H', age: 7, gender: 'male', contact: '13700137000',
        prefs: ['少儿英语'], status: 'ARCHIVED', createdAt: '2026-09-01',
        lastLessonDate: '2026-09-10', trialLessons: 1, daysLeft: 0,
        archivedAt: '2026-10-15', createdBy: 'Sarah'
      }
    ];

    const PARENT_NAV = [
      { id: 'home', icon: 'home', label: '首页', desc: '多孩时间流与金刚位属于 M0 工作台主页。', href: 'm0_workspace_home.html?role=user' },
      { id: 'schedule', icon: 'calendar-days', label: '学生课表', desc: '7 色课表、多孩锚点与挪位请假属于 M3A 排课模块。', href: 'm3a_calendar_schedule.html' },
      { id: 'hall', icon: 'plus-circle', label: '约课大厅', desc: '教师资料、空位预约与小班大厅属于 M1B 选课模块。', href: 'm1b_teacher_parent.html' },
      { id: 'me', icon: 'user', label: '我的', desc: '多孩档案中心', href: null }
    ];

    const ADMIN_NAV = [
      { id: 'home', icon: 'home', label: '首页', desc: '平台结算待办与运营大盘属于 M0 工作台主页。', href: 'm0_workspace_home.html?role=admin' },
      { id: 'schedule', icon: 'calendar-days', label: '学生课表', desc: '自家孩子课表属于 M3A 排课模块。', href: 'm3a_calendar_schedule.html' },
      { id: 'ops', icon: 'layout-grid', label: '教务调度', desc: '全局排班看板与调度入口属于 M0 / M3A。', href: 'm0_workspace_home.html?role=admin&view=ops' },
      { id: 'settings', icon: 'settings', label: '管理与设置', desc: '试课建档与平台配置', href: null }
    ];

    /* ------------------------------------------------------------------
     * 状态
     * ------------------------------------------------------------------ */
    function emptyProfileForm() {
      return {
        mode: 'create', editingId: null, realName: '', englishName: '', initial: '',
        age: '', suffix: '', gender: 'female', prefs: [], avatarDataUrl: '',
        error: '', reason: ''
      };
    }

    function emptyTrialForm() {
      return {
        realName: '', englishName: '', initial: '', age: '', contact: '',
        prefs: [], error: ''
      };
    }

    const state = {
      role: 'parent',
      page: 'center',
      navTab: 'me',
      dataset: 'two',
      device: 'mobile',
      online: 'on',
      profiles: JSON.parse(JSON.stringify(MOCK_PROFILES.two)),
      activeId: MOCK_PROFILES.two[0].id,
      lockedNicknames: [],
      trials: JSON.parse(JSON.stringify(MOCK_TRIALS)),
      adminTab: 'unbound',
      overlay: null,
      form: emptyProfileForm(),
      trialForm: emptyTrialForm(),
      claim: { step: 1, nickname: '', last4: '', error: '', matchedId: null },
      bind: { targetId: null, email: '', error: '' }
    };

    /* ------------------------------------------------------------------
     * 工具
     * ------------------------------------------------------------------ */
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function genderLabel(g) {
      if (g === 'male') return '男孩';
      if (g === 'female') return '女孩';
      if (g === 'undisclosed') return '保密';
      return '未填写';
    }

    function currentNav() {
      return state.role === 'admin' ? ADMIN_NAV : PARENT_NAV;
    }

    function activeProfile() {
      return state.profiles.find((p) => p.id === state.activeId) || state.profiles[0] || null;
    }

    function avatar(p, size = 'h-11 w-11', text = 'text-[14px]') {
      if (p.avatarDataUrl) {
        return `<img src="${p.avatarDataUrl}" class="${size} shrink-0 rounded-full object-cover ring-1 ring-slate-200" alt="">`;
      }
      const initial = (p.englishName || p.nickname || '?').trim().charAt(0).toUpperCase() || '?';
      return `<div class="${size} grid shrink-0 place-items-center rounded-full bg-indigo-50 ${text} font-bold text-indigo-700 ring-1 ring-indigo-100">${esc(initial)}</div>`;
    }

    function statusChip(status, context = 'parent') {
      if (status === 'ACTIVE') {
        return `<span class="rounded-full border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[12px] font-bold text-emerald-700">${context === 'admin' ? '已认领' : '在读'}</span>`;
      }
      if (status === 'UNBOUND') {
        return `<span class="rounded-full border border-amber-200 bg-amber-50 px-2 py-0.5 text-[12px] font-bold text-amber-800">待认领</span>`;
      }
      return `<span class="rounded-full border border-slate-200 bg-slate-100 px-2 py-0.5 text-[12px] font-bold text-slate-500">已归档</span>`;
    }

    function maskContact(c) {
      if (!c) return '—';
      if (/^\d{11}$/.test(c)) return `${c.slice(0, 3)}****${c.slice(-4)}`;
      return c.length > 8 ? `${c.slice(0, 3)}****${c.slice(-4)}` : c;
    }

    function computeNickname(f) {
      const en = (f.englishName || '').trim();
      const ini = (f.initial || '').trim().toUpperCase();
      const age = String(f.age || '').trim();
      const sfx = (f.suffix || '').trim().toLowerCase();
      if (!en || !ini || !age) return '';
      return `${en}${ini}${age}${sfx}`;
    }

    function allNicknames(excludeId = null) {
      const current = excludeId ? state.profiles.find((p) => p.id === excludeId) : null;
      const currentNick = current ? current.nickname.toLowerCase() : '';
      const names = [
        ...state.profiles.filter((p) => p.id !== excludeId).map((p) => p.nickname),
        ...state.lockedNicknames,
        ...state.trials.map((t) => t.nickname),
        ...EXTERNAL_NICKNAMES
      ];
      return names.filter((n) => n.toLowerCase() !== currentNick);
    }

    function nicknameConflict(nick, excludeId = null) {
      return allNicknames(excludeId).some((n) => n.toLowerCase() === nick.toLowerCase());
    }

    function profileNicknameStatus(f) {
      const en = (f.englishName || '').trim();
      const ini = (f.initial || '').trim();
      if (!en || !ini || !String(f.age || '').trim()) {
        return { ok: false, incomplete: true, message: '填写英文名、首字母与年龄后自动生成' };
      }
      if (!/^[A-Za-z]{1,24}$/.test(en)) return { ok: false, message: '英文名仅支持 1-24 位英文字母' };
      if (!/^[A-Za-z]$/.test(ini)) return { ok: false, message: '姓首字母必须为单个英文字母' };
      if (!Number.isInteger(Number(f.age)) || Number(f.age) < 1 || Number(f.age) > 99) {
        return { ok: false, message: '年龄需为 1-99 的整数' };
      }
      if (f.suffix && !/^[a-z0-9]{1,3}$/.test(f.suffix)) {
        return { ok: false, message: '微调后缀仅支持 1-3 位小写字母或数字' };
      }
      const nick = computeNickname(f);
      if (nick.length < 3 || nick.length > 30 || !/^[A-Za-z]{1,24}[A-Z]\d{1,2}[a-z0-9]{0,3}$/.test(nick)) {
        return { ok: false, message: '规范昵称格式不合法' };
      }
      if (nicknameConflict(nick, f.editingId)) {
        return { ok: false, message: `该昵称已被占用，建议添加后缀（如 ${nick}b）` };
      }
      return { ok: true, message: '该昵称全局唯一，可使用' };
    }

    function profileFormError(f) {
      if (state.online === 'off') return '离线模式下无法创建或编辑档案';
      if (f.mode === 'create' && state.profiles.length >= 10) return '名下档案已达上限 (10/10)';
      if (!f.realName.trim()) return '请填写宝贝真实姓名';
      const nickStatus = profileNicknameStatus(f);
      if (!nickStatus.ok) return nickStatus.message;
      return null;
    }

    function trialNicknameStatus(f) {
      const en = (f.englishName || '').trim();
      const ini = (f.initial || '').trim();
      if (!en || !ini || !String(f.age || '').trim()) {
        return { ok: false, incomplete: true, message: '填写英文名、首字母与年龄后自动生成' };
      }
      if (!/^[A-Za-z]{1,24}$/.test(en)) return { ok: false, message: '英文名仅支持 1-24 位英文字母' };
      if (!/^[A-Za-z]$/.test(ini)) return { ok: false, message: '姓首字母必须为单个英文字母' };
      if (!Number.isInteger(Number(f.age)) || Number(f.age) < 1 || Number(f.age) > 99) {
        return { ok: false, message: '年龄需为 1-99 的整数' };
      }
      const nick = computeNickname(f);
      if (!/^[A-Za-z]{1,24}[A-Z]\d{1,2}$/.test(nick)) return { ok: false, message: '规范昵称格式不合法' };
      if (nicknameConflict(nick)) return { ok: false, message: '该昵称已存在，请微调英文名或年龄' };
      return { ok: true, message: '待认领档案将使用该昵称' };
    }

    function trialFormError(f) {
      if (state.online === 'off') return '离线模式下无法创建试课档案';
      if (!f.realName.trim()) return '请填写学员真实姓名';
      const nickStatus = trialNicknameStatus(f);
      if (!nickStatus.ok) return nickStatus.message;
      if (!f.contact.trim() || f.contact.trim().length < 4) return '请填写家长预留联系方式';
      return null;
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'page') setPage(value);
        if (group === 'dataset') setDataset(value);
        if (group === 'device') {
          state.device = value;
          renderAll();
        }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：建档、编辑、认领与注销不可用');
        }
      });
    });

    function setRole(role) {
      state.role = role;
      state.page = role === 'admin' ? 'admin' : 'center';
      state.navTab = role === 'admin' ? 'settings' : 'me';
      state.overlay = null;
      renderAll();
    }

    function setPage(page) {
      if (page === 'detail' && !state.profiles.length) page = 'center';
      state.page = page;
      if (page === 'admin') {
        state.role = 'admin';
        state.navTab = 'settings';
      } else {
        state.role = 'parent';
        state.navTab = 'me';
      }
      state.overlay = null;
      renderAll();
    }

    function setDataset(dataset) {
      state.dataset = dataset;
      state.profiles = clone(MOCK_PROFILES[dataset]);
      state.activeId = state.profiles[0] ? state.profiles[0].id : '';
      state.overlay = null;
      if (state.role === 'parent' && state.page === 'detail' && !state.profiles.length) {
        state.page = 'center';
      }
      renderAll();
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const active = state[group] === b.dataset.value;
        let disabled = false;
        if (group === 'page') {
          disabled = (state.role === 'parent' && b.dataset.value === 'admin')
            || (state.role === 'admin' && b.dataset.value !== 'admin');
        }
        if (b.dataset.parentOnly && state.role === 'admin') disabled = true;
        b.disabled = disabled;
        b.className = `ctl rounded-lg px-3 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}${disabled ? ' cursor-not-allowed opacity-40' : ''}`;
      });
    }

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = document.getElementById('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      document.getElementById('topbar').innerHTML = renderTopbar();

      const banner = document.getElementById('offlineBanner');
      banner.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2.5 text-[12px] font-semibold text-amber-900'
        : 'hidden';

      document.getElementById('content').innerHTML = renderContent();
      document.getElementById('bottomnav').innerHTML = renderNav();
      renderOverlay();
      syncConsole();
      lucide.createIcons();
    }

    function renderTopbar() {
      if (state.page === 'placeholder') {
        const item = currentNav().find((n) => n.id === state.navTab);
        return topbarBase(item ? item.label : '页面', '其他模块原型', false);
      }
      if (state.role === 'parent' && (state.page === 'detail' || state.page === 'claim')) {
        return topbarSub(state.page === 'detail' ? '档案详情' : '认领试课宝贝');
      }
      if (state.role === 'admin') return topbarBase('Dream 运营中枢', '平台管理员 · Sarah', true, true);
      return topbarBase('Dream 教务', `家长工作台 · Amy · ${state.profiles.length} 个孩子`, true);
    }

    function topbarBase(title, subtitle, showAvatar, isAdmin = false) {
      return `
        <div class="border-b border-slate-200 bg-white/95">
          <div class="flex h-14 items-center justify-between px-4">
            <div class="flex min-w-0 items-center gap-2.5">
              <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-indigo-600 text-[14px] font-bold text-white shadow-sm">D</div>
              <div class="min-w-0">
                <div class="truncate text-[16px] font-bold leading-tight text-slate-900">${esc(title)}</div>
                <div class="truncate text-[12px] font-medium text-slate-400">${esc(subtitle)}</div>
              </div>
            </div>
            <div class="flex shrink-0 items-center gap-2">
              <button data-action="toast" data-message="暂无新消息" class="relative grid h-9 w-9 place-items-center rounded-xl bg-slate-100 text-slate-600" aria-label="通知">
                ${icon('bell', 'h-[18px] w-[18px]')}
                <span class="absolute right-2 top-2 h-1.5 w-1.5 rounded-full bg-rose-500 ring-2 ring-white"></span>

              ${showAvatar ? `<div class="grid h-9 w-9 place-items-center rounded-full ${isAdmin ? 'bg-slate-900 text-amber-300' : 'bg-indigo-600 text-white'} text-[14px] font-bold">${isAdmin ? 'S' : 'A'}</div>` : ''}

          </div>

    }

    function topbarSub(title) {
      return `
        <div class="border-b border-slate-200 bg-white/95">
          <div class="grid h-14 grid-cols-[44px_1fr_44px] items-center px-2">
            <button data-action="go-back" class="grid h-10 w-10 place-items-center rounded-xl text-slate-600 hover:bg-slate-100" aria-label="返回">
              ${icon('chevron-left', 'h-5 w-5')}
            </button>
            <div class="truncate text-center text-[16px] font-bold text-slate-900">${esc(title)}</div>
            <button data-action="toast" data-message="暂无新消息" class="relative grid h-10 w-10 place-items-center rounded-xl text-slate-600 hover:bg-slate-100" aria-label="通知">

    /* ------------------------------------------------------------------
     * 页面分发
     * ------------------------------------------------------------------ */
    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.role === 'admin') return renderAdmin();
      if (state.page === 'claim') return renderClaim();
      if (!state.profiles.length) return renderEmpty();
      if (state.page === 'detail') return renderDetail();
      return renderCenter();
    }

    /* ------------------------------------------------------------------
     * 家长 · 档案中心（孩子档案卡片列表）

    function renderCenter() {
      const isFull = state.profiles.length >= 10;

              ${icon('plus', 'h-4 w-4')}

          </section>

          <section class="rounded-2xl border border-indigo-100 bg-indigo-50/70 p-4">
            <div class="flex items-start gap-3">
              <div class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-white text-indigo-600 ring-1 ring-indigo-100">${icon('link-2', 'h-[18px] w-[18px]')}</div>

            <button data-action="open-claim" ${blocked ? 'disabled' : ''} class="mt-3 h-11 w-full rounded-xl border border-indigo-200 bg-white text-[16px] font-bold text-indigo-700 disabled:cursor-not-allowed disabled:border-slate-200 disabled:text-slate-300">

            </button>
          </section>

          <p class="px-2 pb-1 pt-1 text-center text-[12px] font-medium text-slate-400">单个账号最多 10 个宝贝档案 · 规范昵称全平台唯一</p>
        </div>`;
    }

    function renderProfileCard(p) {
      const prefs = p.prefs.length
        ? p.prefs.map((t) => `<span class="rounded-md bg-slate-100 px-2 py-0.5 text-[12px] font-semibold text-slate-600">${esc(t)}</span>`).join('')
        : '<span class="text-[12px] font-medium text-slate-400">不限课程</span>';

      return `
        <button data-action="open-profile" data-id="${p.id}" class="w-full rounded-2xl border ${p.id === state.activeId ? 'border-indigo-200' : 'border-slate-200'} bg-white p-4 text-left shadow-sm transition hover:border-indigo-200 hover:bg-indigo-50/30 active:bg-indigo-50/50">

            ${avatar(p, 'h-14 w-14', 'text-[18px]')}

                <span class="truncate font-mono text-[18px] font-bold tracking-tight text-slate-900">${esc(p.nickname)}</span>
                <span class="shrink-0 rounded-full border border-indigo-100 bg-indigo-50 px-2 py-0.5 text-[12px] font-bold text-indigo-700">${esc(p.tag || '宝贝')}</span>
                ${p.trialHistory ? '<span class="shrink-0 rounded-full border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[12px] font-bold text-emerald-700">试课转正</span>' : ''}

              <div class="mt-1 truncate text-[14px] font-medium text-slate-600">${esc(p.realName)} · ${genderLabel(p.gender)} · ${p.age}岁</div>

              <div class="text-[14px] font-bold text-slate-900">${p.stats.upcoming}</div>
              <div class="mt-0.5 text-[12px] font-medium text-slate-500">待上</div>

            <div>
              <div class="text-[14px] font-bold text-slate-900">${p.stats.leaveUsed}/${p.stats.leaveQuota}</div>
              <div class="mt-0.5 text-[12px] font-medium text-slate-500">本期请假</div>

    /* ------------------------------------------------------------------
     * 家长 · 冷启动空状态

    function renderEmpty() {
      return `
        <div class="mx-auto w-full max-w-[640px] space-y-4 px-4 pb-6 pt-4">
          <section class="rounded-2xl border border-indigo-100 bg-indigo-50/70 p-5">
            <div class="grid h-12 w-12 place-items-center rounded-2xl bg-white text-indigo-600 ring-1 ring-indigo-100">${icon('user-plus', 'h-5 w-5')}</div>

              ${[
                { name: 'David Miller', level: '资深外教 · 少儿英语 / KET', initial: 'D' },

                </div>
              `).join('')}
            </div>
          </section>

          <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
            <button data-action="nav" data-tab="hall" class="flex w-full items-center justify-between px-4 py-3.5">
              <span class="flex items-center gap-2.5 text-[14px] font-semibold text-slate-800">${icon('plus-circle', 'h-4 w-4 text-slate-400')}去约课大厅看看</span>
              <span class="text-slate-300">${icon('chevron-right', 'h-4 w-4')}</span>
            </button>
          </section>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 档案详情
     * ------------------------------------------------------------------ */
    function renderDetail() {
      const p = activeProfile();
      if (!p) return renderEmpty();
      const row = (label, value) => `
        <div class="flex items-center justify-between gap-4 px-4 py-3">
          <span class="shrink-0 text-[14px] font-medium text-slate-500">${label}</span>
          <span class="min-w-0 truncate text-right text-[14px] font-semibold text-slate-900">${value}</span>
        </div>`;

      return `
        <div class="mx-auto w-full max-w-[640px] space-y-4 px-4 pb-6 pt-4">
          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <div class="flex items-center gap-4">
              ${avatar(p, 'h-20 w-20', 'text-[18px]')}
              <div class="min-w-0 flex-1">

                <span class="text-slate-400">${icon('lock', 'h-4 w-4')}</span>

          </section>

          <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
            <div class="border-b border-slate-100 px-4 py-3">

              ${row('姓首字母', esc(p.surnameInitial))}
              ${row('年龄', `${p.age} 岁`)}
              ${row('性别', genderLabel(p.gender))}
              ${row('档案状态', statusChip(p.status))}

          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">

            <div class="mt-2.5 flex flex-wrap gap-2">
              ${p.prefs.length

              </div>
              <div class="rounded-xl bg-slate-50 px-3.5 py-3">
                <div class="text-[12px] font-medium text-slate-400">本期请假</div>
                <div class="mt-0.5 text-[18px] font-bold text-slate-900">${p.stats.leaveUsed}/${p.stats.leaveQuota}</div>
              </div>
              <div class="rounded-xl bg-slate-50 px-3.5 py-3">
                <div class="text-[12px] font-medium text-slate-400">历史完课</div>
                <div class="mt-0.5 text-[18px] font-bold text-slate-900">${p.stats.completed} 节</div>

          <div class="flex gap-2">
            <button data-action="open-edit" ${state.online === 'off' ? 'disabled' : ''} class="h-12 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">编辑档案</button>

    /* ------------------------------------------------------------------
     * 家长 · 认领试课宝贝
     * ------------------------------------------------------------------ */
    function renderClaim() {
      const blockedMsg = state.online === 'off'
        ? '离线模式下不可认领，请联网后重试'
        : state.profiles.length >= 10
          ? '名下档案已达上限 (10/10)，请先注销不再使用的档案'
          : '';
      const t = state.trials.find((x) => x.id === state.claim.matchedId);
      if (state.claim.step === 2 && !t) state.claim.step = 1;

      const step = (n, label) => {
        const active = state.claim.step === n;
        return `
          <div class="flex items-center gap-2 ${active ? 'text-indigo-600' : 'text-slate-400'}">
            <span class="grid h-6 w-6 place-items-center rounded-full text-[12px] font-bold ${active ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}">${n}</span>
            <span class="text-[12px] font-semibold">${label}</span>
          </div>`;
      };

      return `
        <div class="mx-auto w-full max-w-[640px] space-y-4 px-4 pb-6 pt-4">
          <div class="flex items-center gap-2 px-1">
            ${step(1, '核验信息')}
            <div class="h-px flex-1 bg-slate-200"></div>
            ${step(2, '确认认领')}
          </div>

          ${blockedMsg ? `
            <div class="rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-[12px] font-medium leading-relaxed text-amber-900">
              ${blockedMsg}
            </div>` : ''}

          ${state.claim.step === 1 ? `
            <section class="space-y-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
              <div>
                <label for="claimNickname" class="mb-1.5 block text-[16px] font-semibold text-slate-800">孩子规范昵称</label>
                <input id="claimNickname" value="${esc(state.claim.nickname)}" placeholder="如 LeoW8" maxlength="30" class="h-12 w-full rounded-xl border ${state.claim.error ? 'border-rose-300' : 'border-slate-200'} bg-white px-3.5 font-mono text-[16px] font-semibold text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <p class="mt-1 text-[12px] font-medium text-slate-400">昵称可向建档老师获取</p>
              </div>
              <div>
                <label for="claimLast4" class="mb-1.5 block text-[16px] font-semibold text-slate-800">建档预留手机 / 微信后四位</label>
                <input id="claimLast4" value="${esc(state.claim.last4)}" inputmode="numeric" maxlength="4" placeholder="8000" class="h-12 w-full rounded-xl border ${state.claim.error ? 'border-rose-300' : 'border-slate-200'} bg-white px-3.5 font-mono text-[16px] font-semibold tracking-widest text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
              </div>
              ${state.claim.error ? `<div id="claimError" class="rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-2.5 text-[12px] font-medium text-rose-700">${esc(state.claim.error)}</div>` : ''}
              <button data-action="claim-query" ${blockedMsg ? 'disabled' : ''} class="h-12 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">查询宝贝</button>
              <p class="text-center text-[12px] font-medium text-slate-400">演示数据：LeoW8 · 后四位 8000</p>
            </section>` : `
            <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
              <div class="flex items-start gap-3">
                ${avatar(t, 'h-14 w-14', 'text-[18px]')}

    /* ------------------------------------------------------------------
     * 管理员 · 试课档案
     * ------------------------------------------------------------------ */
    function renderAdmin() {
      const unbound = state.trials.filter((t) => t.status === 'UNBOUND');
      const active = state.trials.filter((t) => t.status === 'ACTIVE');
      const archived = state.trials.filter((t) => t.status === 'ARCHIVED');
      const urgent = unbound.filter((t) => t.daysLeft <= 7);
      const map = { unbound: 'UNBOUND', active: 'ACTIVE', archived: 'ARCHIVED' };
      const list = state.trials.filter((t) => t.status === map[state.adminTab]);
      const offline = state.online === 'off';

      const statTile = (label, value, tone) => `
        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 shadow-sm">
          <div class="text-[12px] font-medium text-slate-400">${label}</div>
          <div class="mt-0.5 text-[18px] font-bold ${tone}">${value}</div>
        </div>`;

      const tab = (id, label, count) => {
        const on = state.adminTab === id;
        return `<button data-action="set-admin-tab" data-tab="${id}" class="h-9 flex-1 rounded-lg text-[12px] font-bold transition ${on ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">${label} ${count}</button>`;
      };

      return `
        <div class="mx-auto w-full max-w-[680px] space-y-4 px-4 pb-6 pt-4">
          <div class="flex items-end justify-between gap-3 px-1">
            <div class="min-w-0">
              <h1 class="text-[18px] font-bold tracking-tight text-slate-900">试课档案</h1>
              <p class="mt-1 text-[14px] font-medium text-slate-500">免注册代建档 · 30 天未认领自动归档</p>
            </div>
            <button data-action="open-trial" ${offline ? 'disabled' : ''} class="h-9 shrink-0 rounded-xl bg-indigo-600 px-3.5 text-[12px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">+ 新建</button>
          </div>

          <div class="grid grid-cols-3 gap-2">
            ${statTile('待认领', unbound.length, 'text-slate-900')}
            ${statTile('即将归档', urgent.length, urgent.length ? 'text-rose-600' : 'text-slate-900')}
            ${statTile('已归档', archived.length, 'text-slate-900')}
          </div>

          <div class="flex rounded-xl bg-slate-100 p-1">
            ${tab('unbound', '待认领', unbound.length)}
            ${tab('active', '已认领', active.length)}
            ${tab('archived', '已归档', archived.length)}
          </div>

          <div class="space-y-3">
            ${list.length ? list.map((t) => renderTrialCard(t, offline)).join('') : `
              <div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center">
                <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-slate-50 text-slate-300">${icon('inbox', 'h-5 w-5')}</div>
                <p class="mt-3 text-[14px] font-medium text-slate-400">暂无${state.adminTab === 'unbound' ? '待认领' : state.adminTab === 'active' ? '已认领' : '已归档'}档案</p>
              </div>`}
          </div>
        </div>`;
    }

    function renderTrialCard(t, offline) {
      const isUnbound = t.status === 'UNBOUND';
      return `
        <article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <div class="flex items-start justify-between gap-3">
            <div class="flex min-w-0 items-center gap-3">
              ${avatar(t, 'h-12 w-12', 'text-[14px]')}
              <div class="min-w-0">
                <div class="truncate font-mono text-[18px] font-bold text-slate-900">${esc(t.nickname)}</div>
                <div class="truncate text-[14px] font-medium text-slate-500">${esc(t.realName)} · ${genderLabel(t.gender)} · ${t.age}岁</div>
              </div>
            </div>
            ${statusChip(t.status, 'admin')}
          </div>

          <div class="mt-3 grid grid-cols-2 gap-2">
            <div class="rounded-xl bg-slate-50 px-3 py-2">
              <div class="text-[12px] font-medium text-slate-400">家长联系方式</div>
              <div class="mt-0.5 truncate font-mono text-[14px] font-semibold text-slate-800">${esc(maskContact(t.contact))}</div>

              <div class="text-[12px] font-medium text-slate-400">试课记录</div>
              <div class="mt-0.5 text-[14px] font-semibold text-slate-800">${t.trialLessons} 节${t.lastLessonDate ? ` · ${esc(t.lastLessonDate)}` : ''}</div>
            </div>
          </div>

          ${isUnbound ? `
            <div class="mt-3 flex items-center gap-2">

                ${t.daysLeft <= 7 ? '⚠ ' : ''}${t.daysLeft} 天后自动归档
              </div>
              <button data-action="open-bind" data-id="${t.id}" ${offline ? 'disabled' : ''} class="h-10 shrink-0 rounded-xl border border-slate-200 px-3 text-[12px] font-semibold text-slate-700 disabled:cursor-not-allowed disabled:text-slate-300">绑定家长</button>
              <button data-action="toast" data-message="已打开代约排课（原型模拟）" ${offline ? 'disabled' : ''} class="h-10 shrink-0 rounded-xl bg-indigo-600 px-3 text-[12px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">去排课</button>

          ${t.status === 'ACTIVE' ? `

            </div>` : ''}

    /* ------------------------------------------------------------------
     * 其他模块占位页（底栏仍常驻）
     * ------------------------------------------------------------------ */
    function renderPlaceholder() {
      const item = currentNav().find((n) => n.id === state.navTab);
      if (!item) return renderContentFallback();
      return `
        <div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
          <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">

          <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
          ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">打开对应原型</a>` : ''}

        </div>`;
    }

    function renderContentFallback() {
      return `<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>`;
    }

    /* ------------------------------------------------------------------
     * 底部导航（所有整页常驻）
     * ------------------------------------------------------------------ */
    function renderNav() {
      const nav = currentNav();
      return `
        <div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
          <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
            ${nav.map((item) => {
              const on = state.navTab === item.id;
              return `
                <button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'text-indigo-600' : 'text-slate-400'}">
                  ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
                  <span class="text-[12px] font-bold">${item.label}</span>
                </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function navTo(tab) {
      if (state.role === 'admin') {
        if (tab === 'settings') {
          state.page = 'admin';
          state.navTab = 'settings';
        } else {
          state.page = 'placeholder';
          state.navTab = tab;
        }
      } else {
        if (tab === 'me') {
          state.page = 'center';
          state.navTab = 'me';
        } else {
          state.page = 'placeholder';
          state.navTab = tab;
        }
      }
      renderAll();
    }

      document.getElementById('overlay').innerHTML = state.overlay ? renderOverlayHTML() : '';

      if (!state.overlay) return '';
      if (state.overlay.type === 'profile') return renderProfileSheet();
      if (state.overlay.type === 'trial') return renderTrialSheet();
      if (state.overlay.type === 'guard') return renderGuardModal();
      if (state.overlay.type === 'bind') return renderBindModal();
      return '';
    }

    /* ------------------------------------------------------------------
     * 预览与表单更新
     * ------------------------------------------------------------------ */
    function updateProfilePreview() {
      const f = state.form;
      const nickEl = document.getElementById('nickPreview');
      if (!nickEl) return;
      const nick = computeNickname(f);
      nickEl.textContent = nick || '英文名+首字母+年龄';
      nickEl.className = `mt-1 break-all font-mono text-[18px] font-bold ${nick ? 'text-slate-900' : 'text-slate-300'}`;

      const statusEl = document.getElementById('nickStatus');
      const st = profileNicknameStatus(f);
      statusEl.innerHTML = st.ok
        ? `<span class="flex items-center gap-1 text-emerald-600"><span class="font-bold">✓</span>${esc(st.message)}</span>`
        : `<span class="flex items-center gap-1 ${st.incomplete ? 'text-slate-400' : 'text-rose-600'}"><span class="font-bold">${st.incomplete ? '·' : '!'}</span>${esc(st.message)}</span>`;

      const btn = document.getElementById('btnSubmitProfile');
      if (btn) btn.disabled = !!profileFormError(f);

      const initialEl = document.getElementById('avatarInitial');
      if (initialEl && !f.avatarDataUrl) {
        initialEl.textContent = (f.englishName || '?').trim().charAt(0).toUpperCase() || '?';
      }
    }

    function updateTrialPreview() {
      const f = state.trialForm;
      const nickEl = document.getElementById('trialNickPreview');
      if (!nickEl) return;
      const nick = computeNickname(f);
      nickEl.textContent = nick || '英文名+首字母+年龄';
      nickEl.className = `mt-1 break-all font-mono text-[18px] font-bold ${nick ? 'text-slate-900' : 'text-slate-300'}`;

      const statusEl = document.getElementById('trialNickStatus');
      const st = trialNicknameStatus(f);
      statusEl.innerHTML = st.ok
        ? `<span class="flex items-center gap-1 text-emerald-600"><span class="font-bold">✓</span>${esc(st.message)}</span>`
        : `<span class="flex items-center gap-1 ${st.incomplete ? 'text-slate-400' : 'text-rose-600'}"><span class="font-bold">${st.incomplete ? '·' : '!'}</span>${esc(st.message)}</span>`;

      const btn = document.getElementById('btnSubmitTrial');
      if (btn) btn.disabled = !!trialFormError(f);
    }

    function clearProfileError() {
      state.form.error = '';
      const box = document.getElementById('profileError');
      if (box) box.remove();
    }

    function clearTrialError() {
      state.trialForm.error = '';
      const box = document.getElementById('trialError');
      if (box) box.remove();
    }

    function clearClaimError() {
      state.claim.error = '';
      const box = document.getElementById('claimError');
      if (box) box.remove();
      ['claimNickname', 'claimLast4'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) {
          el.classList.remove('border-rose-300');
          el.classList.add('border-slate-200');
        }
      });
    }

    function clearBindError() {
      state.bind.error = '';
      const box = document.getElementById('bindError');
      if (box) box.remove();
      const input = document.getElementById('bindEmail');
      if (input) {
        input.classList.remove('border-rose-300');
        input.classList.add('border-slate-200');
      }
    }

    /* ------------------------------------------------------------------
     * 事件委托
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'open-profile') {
        state.activeId = el.dataset.id;
        state.page = 'detail';
        state.navTab = 'me';
        renderAll();
        return;
      }
      if (action === 'go-detail') {
        state.page = 'detail';
        renderAll();
        return;
      }
      if (action === 'go-back') {
        if (state.role === 'admin') {
          state.page = 'admin';
          state.navTab = 'settings';
        } else {
          state.page = 'center';
          state.navTab = 'me';
        }
        renderAll();
        return;
      }
      if (action === 'open-create') return openCreate(el.dataset.reason || '');
      if (action === 'open-edit') return openEdit();
      if (action === 'open-guard') {
        if (state.online === 'off') return showToast('离线模式下不可注销档案');
        const p = activeProfile();
        if (!p) return;
        state.overlay = { type: 'guard', targetId: p.id };
        renderAll();
        return;
      }
      if (action === 'open-claim') {
        if (state.online === 'off') return showToast('离线模式下不可认领');
        if (state.profiles.length >= 10) return showToast('名下档案已达上限 (10/10)');
        state.claim = { step: 1, nickname: '', last4: '', error: '', matchedId: null };
        state.page = 'claim';
        state.navTab = 'me';
        renderAll();
        return;
      }
      if (action === 'claim-query') return claimQuery();
      if (action === 'claim-back') {
        state.claim.step = 1;
        state.claim.error = '';
        renderAll();
        return;
      }
      if (action === 'claim-confirm') return claimConfirm();
      if (action === 'close-overlay') {
        state.overlay = null;
        renderOverlay();
        lucide.createIcons();
        return;
      }
      if (action === 'toggle-gender') {
        state.form.gender = el.dataset.gender;
        clearProfileError();
        document.querySelectorAll('[data-action="toggle-gender"]').forEach((b) => {
          const on = b.dataset.gender === state.form.gender;
          b.className = `h-10 rounded-lg px-5 text-[14px] font-semibold ${on ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`;
        });
        return;
      }
      if (action === 'toggle-pref') {
        const pref = el.dataset.pref;
        state.form.prefs = state.form.prefs.includes(pref)
          ? state.form.prefs.filter((x) => x !== pref)
          : [...state.form.prefs, pref];
        clearProfileError();
        document.querySelectorAll('[data-action="toggle-pref"]').forEach((b) => {
          const on = state.form.prefs.includes(b.dataset.pref);
          b.className = `h-9 rounded-lg px-3 text-[12px] font-semibold ${on ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`;
        });
        return;
      }
      if (action === 'toggle-trial-pref') {
        const pref = el.dataset.pref;
        state.trialForm.prefs = state.trialForm.prefs.includes(pref)
          ? state.trialForm.prefs.filter((x) => x !== pref)
          : [...state.trialForm.prefs, pref];
        clearTrialError();
        document.querySelectorAll('[data-action="toggle-trial-pref"]').forEach((b) => {
          const on = state.trialForm.prefs.includes(b.dataset.pref);
          b.className = `h-9 rounded-lg px-3 text-[12px] font-semibold ${on ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`;
        });
        return;
      }
      if (action === 'submit-profile') return submitProfile();
      if (action === 'submit-trial') return submitTrial();
      if (action === 'submit-bind') return submitBind();
      if (action === 'open-trial') return openTrial();
      if (action === 'open-bind') {
        if (state.online === 'off') return showToast('离线模式下不可绑定');
        state.bind = { targetId: el.dataset.id, email: '', error: '' };
        state.overlay = { type: 'bind' };
        renderAll();
        document.getElementById('bindEmail')?.focus();
        return;
      }
      if (action === 'set-admin-tab') {
        state.adminTab = el.dataset.tab;
        renderAll();
        return;
      }
      if (action === 'guard-delete') return deleteProfile(el.dataset.id);
      if (action === 'contact-monitor') {
        state.overlay = null;
        renderOverlay();
        lucide.createIcons();
        showToast('已向负责班长发送退课协助请求（原型模拟）');
        return;
      }
      if (action === 'copy-nick') return copyNick(el.dataset.nick);
    });

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'fInitial' || id === 'fTrialInitial') {
        e.target.value = e.target.value.replace(/[^a-zA-Z]/g, '').slice(0, 1).toUpperCase();
      }
      if (id === 'fSuffix') {
        e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 3);
      }
      if (id === 'fRealName') { state.form.realName = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fEnglish') { state.form.englishName = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fInitial') { state.form.initial = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fAge') { state.form.age = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fSuffix') { state.form.suffix = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fTrialRealName') { state.trialForm.realName = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialEnglish') { state.trialForm.englishName = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialInitial') { state.trialForm.initial = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialAge') { state.trialForm.age = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialContact') { state.trialForm.contact = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'claimNickname') { state.claim.nickname = e.target.value; clearClaimError(); }
      if (id === 'claimLast4') {
        e.target.value = e.target.value.replace(/[^0-9a-zA-Z]/g, '').slice(0, 4);
        state.claim.last4 = e.target.value;
        clearClaimError();
      }
      if (id === 'bindEmail') { state.bind.email = e.target.value; clearBindError(); }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      if (e.target.id === 'avatarInput') handleAvatar(e);
    });

    /* ------------------------------------------------------------------
     * 业务动作
     * ------------------------------------------------------------------ */
    function openCreate(reason = '') {
      if (state.online === 'off') return showToast('离线模式下无法创建档案');
      if (state.profiles.length >= 10) return showToast('名下档案已达上限 (10/10)');
      state.form = { ...emptyProfileForm(), reason };
      state.overlay = { type: 'profile' };
      renderAll();
      updateProfilePreview();
    }

    function openEdit() {
      if (state.online === 'off') return showToast('离线模式下无法编辑档案');
      const p = activeProfile();
      if (!p) return;
      state.form = {
        mode: 'edit', editingId: p.id,
        realName: p.realName, englishName: p.englishName, initial: p.surnameInitial,
        age: String(p.age), suffix: p.suffix || '', gender: p.gender,
        prefs: [...p.prefs], avatarDataUrl: p.avatarDataUrl || '', error: '', reason: ''
      };
      state.overlay = { type: 'profile' };
      renderAll();
      updateProfilePreview();
    }

    function openTrial() {
      if (state.online === 'off') return showToast('离线模式下无法创建试课档案');
      state.trialForm = emptyTrialForm();
      state.overlay = { type: 'trial' };
      renderAll();
      updateTrialPreview();
    }

    function submitProfile() {
      const f = state.form;
      const err = profileFormError(f);
      if (err) {
        f.error = err;
        renderOverlay();
        lucide.createIcons();
        updateProfilePreview();
        return;
      }
      const nick = computeNickname(f);
      if (f.mode === 'edit') {
        const p = state.profiles.find((x) => x.id === f.editingId);
        if (!p) return;
        Object.assign(p, {
          nickname: nick, realName: f.realName.trim(), englishName: f.englishName.trim(),
          surnameInitial: f.initial.trim().toUpperCase(), age: Number(f.age),
          suffix: f.suffix.trim(), gender: f.gender, prefs: [...f.prefs],
          avatarDataUrl: f.avatarDataUrl
        });
        state.overlay = null;
        renderAll();
        showToast('档案已更新');
        return;
      }
      const p = {
        id: `sp_${Math.random().toString(36).slice(2, 10)}`,
        nickname: nick, realName: f.realName.trim(), englishName: f.englishName.trim(),
        surnameInitial: f.initial.trim().toUpperCase(), age: Number(f.age), suffix: f.suffix.trim(),
        gender: f.gender, tag: `宝贝 ${state.profiles.length + 1}`, prefs: [...f.prefs],
        status: 'ACTIVE', createdAt: TODAY,
        stats: { upcoming: 0, pendingTs: 0, leaveUsed: 0, leaveQuota: 2, completed: 0 },
        pendingRefund: false,
        avatarDataUrl: f.avatarDataUrl
      };
      state.profiles.push(p);
      state.activeId = p.id;
      state.page = 'center';
      state.navTab = 'me';
      state.overlay = null;
      renderAll();
      showToast(`已创建 ${p.nickname}，并设为当前宝贝`);
    }

    function submitTrial() {
      const f = state.trialForm;
      const err = trialFormError(f);
      if (err) {
        f.error = err;
        renderOverlay();
        lucide.createIcons();
        updateTrialPreview();
        return;
      }
      const t = {
        id: `tr_${Math.random().toString(36).slice(2, 10)}`,
        nickname: computeNickname(f), realName: f.realName.trim(), englishName: f.englishName.trim(),
        surnameInitial: f.initial.trim().toUpperCase(), age: Number(f.age), gender: null,
        contact: f.contact.trim(), prefs: [...f.prefs], status: 'UNBOUND', createdAt: TODAY,
        lastLessonDate: null, trialLessons: 0, daysLeft: 30, createdBy: 'Sarah'
      };
      state.trials.unshift(t);
      state.adminTab = 'unbound';
      state.overlay = null;
      renderAll();
      showToast(`已创建待认领档案 ${t.nickname}，可前往排课`);
    }

    function submitBind() {
      if (state.online === 'off') return showToast('离线模式下不可绑定');
      const email = state.bind.email.trim().toLowerCase();
      const fail = (msg) => {
        state.bind.error = msg;
        renderOverlay();
        lucide.createIcons();
        document.getElementById('bindEmail')?.focus();
      };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('请输入有效的家长邮箱');
      if (!REGISTERED_EMAILS.includes(email)) return fail('该邮箱尚未注册，请核对');
      const t = state.trials.find((x) => x.id === state.bind.targetId);
      if (!t || t.status !== 'UNBOUND') return fail('该档案当前不可绑定');
      t.status = 'ACTIVE';
      t.parentEmail = email;
      t.claimedAt = TODAY;
      state.adminTab = 'active';
      state.overlay = null;
      renderAll();
      showToast(`已绑定至 ${email}，档案转为 ACTIVE`);
    }

    function claimQuery() {
      if (state.online === 'off') return showToast('离线模式下不可认领');
      if (state.profiles.length >= 10) return showToast('名下档案已达上限 (10/10)');
      const nick = state.claim.nickname.trim();
      const last4 = state.claim.last4.trim();
      const fail = (msg) => {
        state.claim.error = msg;
        renderAll();
      };
      if (!nick) return fail('请输入孩子的规范昵称');
      if (last4.length !== 4) return fail('请输入预留联系方式后四位');
      const t = state.trials.find((x) =>
        x.status === 'UNBOUND'
        && x.nickname.toLowerCase() === nick.toLowerCase()
        && x.contact.replace(/\s/g, '').toLowerCase().endsWith(last4.toLowerCase())
      );
      if (!t) return fail('未找到匹配的试课宝贝，请核对信息');
      state.claim.error = '';
      state.claim.step = 2;
      state.claim.matchedId = t.id;
      renderAll();
    }

    function claimConfirm() {
      if (state.online === 'off') return showToast('离线模式下不可认领');
      if (state.profiles.length >= 10) return showToast('名下档案已达上限 (10/10)');
      const t = state.trials.find((x) => x.id === state.claim.matchedId);
      if (!t) {
        state.claim.step = 1;
        state.claim.error = '未找到匹配的试课宝贝，请重新查询';
        renderAll();
        return;
      }
      const p = {
        id: `sp_${Math.random().toString(36).slice(2, 10)}`,
        nickname: t.nickname, realName: t.realName, englishName: t.englishName,
        surnameInitial: t.surnameInitial, age: t.age, gender: t.gender, tag: '试课转正',
        suffix: '', prefs: [...t.prefs], status: 'ACTIVE', createdAt: TODAY,
        stats: { upcoming: 0, pendingTs: 0, leaveUsed: 0, leaveQuota: 2, completed: t.trialLessons },
        pendingRefund: false,
        trialHistory: true
      };
      t.status = 'ACTIVE';
      t.parentEmail = 'amy@example.com';
      t.claimedAt = TODAY;
      state.profiles.push(p);
      state.activeId = p.id;
      state.page = 'center';
      state.navTab = 'me';
      state.claim = { step: 1, nickname: '', last4: '', error: '', matchedId: null };
      renderAll();
      showToast(`已认领 ${p.nickname}，历史试听记录已并入`);
    }

    function deleteProfile(id) {
      const p = state.profiles.find((x) => x.id === id);
      if (!p) return;
      if (p.stats.pendingTs > 0 || p.stats.upcoming > 0 || p.pendingRefund) return showToast('仍有有效课次或退款单，无法注销');
      state.profiles = state.profiles.filter((x) => x.id !== id);
      state.lockedNicknames.push(p.nickname);
      if (state.activeId === id) state.activeId = state.profiles[0] ? state.profiles[0].id : '';
      state.overlay = null;
      state.page = 'center';
      state.navTab = 'me';
      renderAll();
      showToast(`${p.nickname} 已注销，昵称永久锁定`);
    }

    function handleAvatar(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
        showToast('仅支持 JPG / PNG / WebP');
        e.target.value = '';
        return;
      }
      if (file.size > 2 * 1024 * 1024) {
        showToast('图片不能超过 2MB');
        e.target.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 240;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const min = Math.min(img.width, img.height);
          const sx = (img.width - min) / 2;
          const sy = (img.height - min) / 2;
          ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
          const url = canvas.toDataURL('image/webp', 0.85);
          state.form.avatarDataUrl = url;
          const preview = document.getElementById('avatarPreview');
          const initial = document.getElementById('avatarInitial');
          if (preview) {
            preview.src = url;
            preview.classList.remove('hidden');
          }
          if (initial) initial.classList.add('hidden');
          showToast('照片已裁剪为 1:1');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function copyNick(nick) {
      try {
        await navigator.clipboard.writeText(nick);
        showToast('规范昵称已复制');
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = nick;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('规范昵称已复制');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
    updateProfilePreview();
    updateTrialPreview();
  </script>
</body>
</html>

    function pendingTsOf(p) {
      return Math.max(0, Number(p && p.stats && p.stats.pendingTs) || 0);
    }

    function upcomingTsOf(p) {
      return Math.max(0, Number(p && p.stats && p.stats.upcoming) || 0);
    }

    function pendingTiersOf(p) {
      const tiers = (p && p.stats && p.stats.pendingTiers) || [];
      if (tiers.length) return tiers;
      const total = pendingTsOf(p);
      return total > 0 ? [{ price: 16, count: total }] : [];
    }

    function pendingTierText(p) {
      return pendingTiersOf(p).map((t) => `${Number(t.price)}积分×${Number(t.count)}`).join(' · ');
    }

    function scheduledBreakdown(p) {
      const upcoming = upcomingTsOf(p);
      const fixed = Math.min(Math.max(0, Number(p && p.stats && p.stats.fixed) || 0), upcoming);
      return { upcoming, fixed, temp: Math.max(0, upcoming - fixed) };
    }

    function fixedRoundOf(p) {
      return (p && (p.fixedRound || (p.stats && p.stats.fixedRound))) || '';
    }

    function isZeroAsset(p) {
      return pendingTsOf(p) === 0 && upcomingTsOf(p) === 0;
    }

    function totalRemainingOf(p) {
      return pendingTsOf(p) + upcomingTsOf(p);
    }

      return String(
        (p && (p.lastActiveAt || p.updatedAt))

      if (!s) return null;
      const leaves = Number(s.leaves30d) || 0;
      const near = Number(s.nearDeadline30d) || 0;
      const lessons = Number(s.lessons30d) || 0;
      const ratio = lessons > 0 ? leaves / lessons : 0;
      const alert = ratio > 0.125 || (leaves + near) >= 3;
      return { leaves, near, lessons, ratio, alert };
    }

    function computeNickname(f) {
      const en = (f.englishName || '').trim();
      const ini = (f.initial || '').trim().toUpperCase();
      const age = String(f.age || '').trim();
      const sfx = (f.suffix || '').trim().toLowerCase();
      if (!en || !ini || !age) return '';
      return `${en}${ini}${age}${sfx}`;
    }

    function allNicknames(excludeId = null) {
      const current = excludeId ? state.profiles.find((p) => p.id === excludeId) : null;
      const currentNick = current ? current.nickname.toLowerCase() : '';
      const names = [
        ...state.profiles.filter((p) => p.id !== excludeId).map((p) => p.nickname),
        ...state.lockedNicknames,
        ...state.trials.map((t) => t.nickname),
        ...EXTERNAL_NICKNAMES
      ];
      return names.filter((n) => n.toLowerCase() !== currentNick);
    }

    function nicknameConflict(nick, excludeId = null) {
      return allNicknames(excludeId).some((n) => n.toLowerCase() === nick.toLowerCase());
    }

    function profileNicknameStatus(f) {
      const en = (f.englishName || '').trim();
      const ini = (f.initial || '').trim();
      if (!en || !ini || !String(f.age || '').trim()) {
        return { ok: false, incomplete: true, message: '填写英文名、首字母与年龄后自动生成' };
      }
      if (!/^[A-Za-z]{1,24}$/.test(en)) return { ok: false, message: '英文名仅支持 1-24 位英文字母' };
      if (!/^[A-Za-z]$/.test(ini)) return { ok: false, message: '姓首字母必须为单个英文字母' };
      if (!Number.isInteger(Number(f.age)) || Number(f.age) < 1 || Number(f.age) > 99) {
        return { ok: false, message: '年龄需为 1-99 的整数' };
      }
      if (f.suffix && !/^[a-z0-9]{1,3}$/.test(f.suffix)) {
        return { ok: false, message: '微调后缀仅支持 1-3 位小写字母或数字' };
      }
      const nick = computeNickname(f);
      if (nick.length < 3 || nick.length > 30 || !/^[A-Za-z]{1,24}[A-Z]\d{1,2}[a-z0-9]{0,3}$/.test(nick)) {
        return { ok: false, message: '规范昵称格式不合法' };
      }
      if (nicknameConflict(nick, f.editingId)) {
        return { ok: false, message: `该昵称已被使用，建议添加后缀（如 ${nick}b）` };
      }
      return { ok: true, message: '该昵称全局唯一，可使用' };
    }

    function parseQuickNick(raw) {
      const val = (raw || '').trim();
      if (!val) return { ok: false, incomplete: true, message: '请输入规范英文名（如 MarkL10）' };
      const m = /^([A-Za-z]{1,24})([A-Z])(\d{1,2})([a-z0-9]{0,3})$/.exec(val);
      if (!m || val.length < 3 || val.length > 30) {
        return { ok: false, message: '格式需为：英文名 + 大写姓首字母 + 1~2位年龄（如 MarkL10）' };
      }
      const age = Number(m[3]);
      if (age < 1 || age > 99) return { ok: false, message: '年龄需为 1-99 的整数' };
      if (nicknameConflict(val)) return { ok: false, message: `该昵称已被占用，可微调后缀（如 ${val}b）` };
      return { ok: true, nickname: val, englishName: m[1], initial: m[2], age, suffix: m[4] || '', message: '格式合法且全局唯一，自动解析并同步小名' };
    }

      const nick = computeNickname(f);

      form: emptyProfileForm(),
      trialForm: emptyTrialForm(),
      claim: { step: 1, nickname: '', last4: '', error: '', matchedId: null },
      bind: { targetId: null, email: '', error: '' },
      cw: { targetKind: 'enrolled', targetId: null, draft: [], pickCw: '', pickLevel: '' },
      inlineCw: null,
      noteEdit: { kind: 'enrolled', id: null, text: '' }
    };

    const params = new URLSearchParams(location.search);
    if (params.get('role') && ['parent', 'monitor', 'teacher', 'admin'].includes(params.get('role'))) {
      state.role = params.get('role');
      if (state.role === 'monitor') { state.page = 'staffList'; state.navTab = 'ops'; }
      else if (state.role === 'teacher') { state.page = 'staffList'; state.navTab = 'students'; }
      else if (state.role === 'admin') { state.page = 'staffList'; state.navTab = 'ops'; }
      else { state.page = 'center'; state.navTab = 'me'; }
    }
    const requestedPage = params.get('page');
    if (requestedPage) {
      const allowed = {
        parent: ['center', 'detail', 'claim'],
        monitor: ['staffList', 'staffDetail'],
        teacher: ['staffList', 'staffDetail'],
        admin: ['center', 'detail', 'claim', 'trials', 'staffList', 'staffDetail']
      }[state.role] || [];
      if (requestedPage === 'claim' && allowed.includes('claim')) {
        state.page = 'center';
        state.overlay = { type: 'claim' };
        state.navTab = state.role === 'admin' ? 'settings' : 'me';
      } else if (allowed.includes(requestedPage)) {
        state.page = requestedPage;
        if (state.page === 'staffList') state.navTab = state.role === 'teacher' ? 'students' : 'ops';
      }
    }
    if (params.get('tab')) state.navTab = params.get('tab');
    if (params.get('device') === 'tablet') state.device = 'tablet';
    if (state.role !== 'parent') ensureStaffTarget();

    function activeProfile() {
      return state.profiles.find((p) => p.id === state.activeId) || state.profiles[0] || null;
    }

    /* 列表一【自家孩子】：固定按建档时间正序（大宝 → 十宝），与顶栏切换器完全一致。 */
    function sortedProfiles() {
      return [...state.profiles].sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')) || compareNickname(a, b));
    }

    function operatorName() {
      if (state.role === 'admin') return 'Sarah';
      if (state.role === 'monitor') return 'Leo';
      if (state.role === 'teacher') return 'David Miller';
      return 'Amy';
    }

    function currentRoleLabel() {
      return { admin: '管理员', monitor: '班长', teacher: '老师', parent: '家长' }[state.role] || '家长';
    }

    function daysSinceToday(dateStr) {
      if (!dateStr) return null;
      const d1 = new Date(`${dateStr}T00:00:00Z`);
      const d2 = new Date(`${TODAY}T00:00:00Z`);
      if (Number.isNaN(d1.getTime()) || Number.isNaN(d2.getTime())) return null;
      return Math.max(0, Math.round((d2 - d1) / 86400000));
    }

    function relativeDaysLabel(dateStr) {
      const days = daysSinceToday(dateStr);
      if (days === null) return '刚刚';
      if (days === 0) return '今天';
      if (days === 1) return '1天前';
      if (days < 30) return `${days}天前`;
      const months = Math.floor(days / 30);
      return `${months}个月前`;
    }

    function mainTeacherInfo(item) {
      const map = item && item.teacherUpdates ? item.teacherUpdates : {};
      let bestName = null;
      let bestCount = 0;
      Object.entries(map).forEach(([name, count]) => {
        const c = Number(count) || 0;
        if (c > bestCount) {
          bestCount = c;
          bestName = name;
        }
      });
      return bestCount > 0 ? { name: bestName, count: bestCount } : null;
    }

    function isStaleCourseware(item, profile) {
      const refDate = (item && item.lastUpdatedAt) || (profile && profile.createdAt);
      const days = daysSinceToday(refDate);
      return days !== null && days > 180;
    }

    function appendAudit(target, entry) {
      target.audit = target.audit || [];
      target.audit.unshift({ at: '2026-11-10 14:32', ...entry });
    }

    function recordFieldChange(target, field, before, after, by = operatorName()) {
      const prev = String(before ?? '');
      const next = String(after ?? '');
      if (prev === next) return false;
      appendAudit(target, { type: 'field', by, field, before: prev || '（空）', after: next || '（空）' });
      return true;
    }

    function recordStatusChange(target, from, to, reason, by = operatorName()) {
      appendAudit(target, { type: 'status', by, from, to, reason });
    }

    function coursewareSnapshot(list) {
      const items = list || [];
      if (!items.length) return '未配置';
      return items.map((d) => `${cwById(d.cwId).nameEn} · ${d.level || '标准'}${d.progressText ? ` (${d.progressText})` : ''}`).join('；');
    }

    function visibleEnrolled() {
      if (state.role === 'monitor') {
        const me = operatorName();
        const enrolled = state.enrolled.filter((x) => x.responsible === me).map((x) => ({ ...x, staffKind: 'enrolled' }));
        const trials = state.trials
          .filter((t) => t.responsible === me && (t.status === 'UNBOUND' || t.status === 'TRIALING'))
          .map((t) => ({
            ...t,
            staffKind: 'trial',
            teacher: t.teacher || '试课待排',
            stats: t.stats || { upcoming: t.trialLessons || 0, pendingTs: 0, completed: 0, fixed: 0, temp: t.trialLessons || 0, pendingTiers: [] }
          }));
        return [...trials, ...enrolled];
      }
      if (state.role === 'teacher') {
        return state.enrolled.filter((x) => x.teacher === operatorName()).map((x) => ({ ...x, staffKind: 'enrolled' }));
      }
      return state.enrolled.map((x) => ({ ...x, staffKind: 'enrolled' }));
    }

    function counselorLabel(value) {
      if (!value || value === 'platform') return '平台未划拨';
      if (value === 'Sarah') return '我直管';
      return `班长 ${value}`;
    }

    function counselorOptions() {
      const set = [];
      state.enrolled.forEach((x) => {
        const key = x.responsible || 'platform';
        if (!set.includes(key)) set.push(key);
      });
      return set.sort((a, b) => {
        const order = { Sarah: 0, platform: 1 };
        return (order[a] ?? 2) - (order[b] ?? 2) || a.localeCompare(b);
      });
    }

    function counselorMatch(item) {
      if (state.role !== 'admin' || state.staffCounselor === 'all') return true;
      if (state.staffCounselor === 'mine') return item.responsible === operatorName();
      if (state.staffCounselor === 'platform') return !item.responsible;
      return item.responsible === state.staffCounselor;
    }

    function staffTabMatch(x) {
      const map = { all: '', active: 'ACTIVE', archived: 'ARCHIVED' };
      return state.staffTab === 'all'
        || (state.staffTab === 'trial' ? x.staffKind === 'trial' : (x.staffKind !== 'trial' && x.status === map[state.staffTab]));
    }

    function staffSearchMatch(x, q) {
      if (!q) return true;
      const nick = String(x.nickname || '').toLowerCase();
      const fields = [x.realName, x.englishName].map((v) => String(v || '').toLowerCase());
      if (/^[a-z]{1,2}$/.test(q)) return nick.startsWith(q) || fields.some((v) => v.startsWith(q));
      return nick.includes(q) || fields.some((v) => v.includes(q));
    }

    function compareStaff(a, b, key) {
      if (key === 'nickname') return compareNickname(a, b);
      const aZero = isZeroAsset(a);
      const bZero = isZeroAsset(b);
      if (aZero !== bZero) return aZero ? 1 : -1;
      if (aZero && bZero) {
        if (key === 'smart') return lastActivityOf(b).localeCompare(lastActivityOf(a)) || compareNickname(a, b);
        return compareNickname(a, b);
      }
      if (key === 'pending') return pendingTsOf(b) - pendingTsOf(a) || compareNickname(a, b);
      if (key === 'remaining') return totalRemainingOf(a) - totalRemainingOf(b) || compareNickname(a, b);
      /* 智能优先：待排 TS 降序 → 剩余已排课次升序 → 零资产按最近活动时间沉底。 */
      const ap = pendingTsOf(a);
      const bp = pendingTsOf(b);
      if ((ap > 0) !== (bp > 0)) return ap > 0 ? -1 : 1;
      if (ap > 0) return bp - ap || compareNickname(a, b);
      return upcomingTsOf(a) - upcomingTsOf(b) || compareNickname(a, b);
    }

    function sortStaffItems(items) {
      const forceNickname = !!state.staffQuery.trim() || state.staffLetter !== 'all';
      const key = forceNickname ? 'nickname' : state.staffSort;
      return [...items].sort((a, b) => compareStaff(a, b, key));
    }

    function staffInitialOf(x) {
      const ch = String(x.nickname || '').trim().charAt(0).toUpperCase();
      return /^[A-Z]$/.test(ch) ? ch : '';
    }

    function staffLetterOptions(items) {
      return [...new Set(items.map(staffInitialOf).filter(Boolean))].sort();
    }

    function filteredStaff() {
      const q = state.staffQuery.trim().toLowerCase();
      const items = visibleEnrolled().filter((x) => {
        const letterOk = state.staffLetter === 'all' || staffInitialOf(x) === state.staffLetter;
        return staffTabMatch(x) && staffSearchMatch(x, q) && counselorMatch(x) && letterOk;
      });
      return sortStaffItems(items);
    }

    function staffTarget() {
      if (state.staffKind === 'trial') {
        const t = state.trials.find((x) => x.id === state.staffId);
        return t ? { ...t, staffKind: 'trial' } : null;
      }
      const p = state.enrolled.find((x) => x.id === state.staffId);
      return p ? { ...p, staffKind: 'enrolled' } : null;
    }

    function ensureStaffTarget() {
      const items = visibleEnrolled();
      if (items.some((x) => x.id === state.staffId && state.staffKind === 'enrolled')) return;
      const preferred = items.find((x) => x.status === 'ACTIVE');
      const first = preferred || items[0];
      state.staffId = first ? first.id : '';
      state.staffKind = first ? first.staffKind : 'enrolled';
    }

    function findCwTarget(kind, id) {
      if (kind === 'trial') return state.trials.find((x) => x.id === id);
      if (kind === 'enrolled') return state.enrolled.find((x) => x.id === id);
      return state.profiles.find((x) => x.id === id);
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function viewAllowed(v) {
      if (state.role === 'parent') return ['center', 'detail', 'claim'].includes(v);
      if (state.role === 'monitor') return ['staffList', 'detail'].includes(v);
      if (state.role === 'teacher') return ['staffList', 'detail'].includes(v);
      return ['center', 'detail', 'claim', 'staffList', 'trials'].includes(v);
    }

    function currentViewKey() {
      if (state.overlay && state.overlay.type === 'claim') return 'claim';
      if (state.page === 'placeholder') return '';
      if (state.role === 'parent') {
        if (state.page === 'detail') return 'detail';
        return 'center';
      }
      if (state.role === 'monitor' || state.role === 'teacher') {
        if (state.page === 'staffDetail') return 'detail';
        return 'staffList';
      }
      if (state.page === 'trials') return 'trials';
      if (state.page === 'staffList') return 'staffList';
      if (state.page === 'staffDetail') return 'detail';
      if (state.page === 'detail') return 'detail';
      return 'center';
    }

    function syncConsole() {
      const view = currentViewKey();
      const viewLabels = {
        center: '自家孩子',
        detail: '学员详情',
        claim: '认领试课',
        staffList: state.role === 'admin' ? '全员学员' : state.role === 'teacher' ? '我的学员' : '所辖学员',
        trials: '试课学员管理'
      };
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const value = b.dataset.value;
        let active = false;
        let disabled = false;
        if (group === 'role') active = state.role === value;
        if (group === 'view') {
          active = view === value;
          disabled = !viewAllowed(value);
          b.textContent = viewLabels[value] || b.textContent;
        }
        if (group === 'dataset') { active = state.dataset === value; disabled = !['parent', 'admin'].includes(state.role); }
        if (group === 'device') active = state.device === value;
        if (group === 'online') active = state.online === value;
        b.disabled = disabled;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}${disabled ? ' cursor-not-allowed opacity-40' : ''}`;
      });
    }

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'view') setView(value);
        if (group === 'dataset') setDataset(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：建档、认领与课件调整不可用');
        }
      });
    });

    function setRole(role) {
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.navTab = role === 'parent' ? 'me' : role === 'teacher' ? 'students' : 'ops';
      state.page = role === 'parent' ? 'center' : 'staffList';
      state.overlay = null;
      state.inlineCw = null;
      state.staffQuery = '';
      state.staffTab = 'all';
      state.staffCounselor = 'all';
      state.staffSort = 'smart';
      state.staffLetter = 'all';
      state.staffLetterOpen = false;
      state.trialQuery = '';
      state.adminTab = 'all';
      if (role !== 'parent') ensureStaffTarget();
      renderAll();
    }

    function setView(view) {
      state.overlay = null;
      state.inlineCw = null;
      if (view === 'claim') return openClaimModal();
      if (state.role === 'parent') {
        if (view === 'center') { state.page = 'center'; state.navTab = 'me'; }
        if (view === 'detail') {
          if (!state.profiles.length) {
            showToast('请先添加孩子档案');
            state.page = 'center'; state.navTab = 'me';
          } else {
            state.page = 'detail'; state.navTab = 'me';
          }
        }
      } else if (state.role === 'monitor' || state.role === 'teacher') {
        const defaultTab = state.role === 'teacher' ? 'students' : 'ops';
        if (view === 'staffList') {
          state.page = 'staffList';
          state.navTab = defaultTab;
        }
        if (view === 'detail') {
          ensureStaffTarget();
          state.page = 'staffDetail';
          state.navTab = defaultTab;
        }
      } else {
        if (view === 'center') {
          state.page = 'center';
          state.navTab = 'settings';
        }
        if (view === 'detail') {
          if (!state.profiles.length) {
            showToast('请先添加孩子档案');
            state.page = 'center'; state.navTab = 'settings';
          } else {
            state.page = 'detail'; state.navTab = 'settings';
          }
        }
        if (view === 'staffList') {
          state.page = 'staffList';
          state.navTab = 'ops';
        }
        if (view === 'trials') {
          state.page = 'trials'; state.navTab = 'settings';
        }
      }
      renderAll();
    }

    function setDataset(dataset) {
      state.dataset = dataset;
      state.profiles = clone(MOCK_PROFILES[dataset]);
      state.activeId = state.profiles[0] ? state.profiles[0].id : '';
      state.overlay = null;
      if (state.role === 'parent' && state.page === 'detail' && !state.profiles.length) {
        state.page = 'center';
      }
      if (state.staffKind === 'enrolled') ensureStaffTarget();
      renderAll();
    }

    function resetDemo() {
      state.role = 'parent'; state.page = 'center'; state.navTab = 'me'; state.dataset = 'two';
      state.device = 'mobile'; state.online = 'on';
      state.profiles = clone(MOCK_PROFILES.two);
      state.activeId = MOCK_PROFILES.two[0].id;
      state.lockedNicknames = [];
      state.enrolled = clone(MOCK_ENROLLED);
      state.trials = clone(MOCK_TRIALS);
      state.staffKind = 'enrolled'; state.staffId = MOCK_ENROLLED[0].id;
      state.staffQuery = ''; state.staffTab = 'all'; state.staffCounselor = 'all';
      state.staffSort = 'smart'; state.staffLetter = 'all'; state.staffLetterOpen = false;
      state.adminTab = 'all'; state.trialQuery = '';
      state.overlay = null;
      state.form = emptyProfileForm(); state.trialForm = emptyTrialForm();
      state.claim = { step: 1, nickname: '', last4: '', error: '', matchedId: null };
      state.bind = { targetId: null, email: '', error: '' };
      state.noteEdit = { kind: 'enrolled', id: null, text: '' };
      renderAll();
      showToast('演示数据已重置');
    }

    $('btnResetDemo').addEventListener('click', resetDemo);

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线模式：可查看档案，建档、认领与课件调整不可用`
        : '';

      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = renderNav();
      $('overlay').innerHTML = renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function bannerTitle() {
      if (state.overlay && state.overlay.type === 'claim') return '认领试课';
      if (state.page === 'placeholder') {
        const item = NAVS[state.role].find((n) => n.id === state.navTab);
        return item ? item.label : '';
      }
      if (state.role === 'parent') {
        if (state.page === 'detail') return '学员详情';
        return state.profiles.length ? '自家孩子' : '学员档案';
      }
      if (state.role === 'monitor') {
        return state.page === 'staffDetail' ? '学员详情' : '教务中心';
      }
      if (state.role === 'teacher') {
        return state.page === 'staffDetail' ? '学员学情档案' : '我的学员';
      }
      if (state.page === 'trials') return '试课学员管理';
      if (state.page === 'staffList') return '教务中心';
      if (state.page === 'staffDetail') return '学员详情';
      if (state.page === 'detail') return '学员详情';
      return '自家孩子';
    }

    function bannerSubtitle() {
      if (state.overlay && state.overlay.type === 'claim') return '';
      if (state.role === 'monitor' && state.page === 'staffList') {
        return '管理在读学员与未注册试听学员';
      }
      if (state.role === 'teacher' && state.page === 'staffList') {
        return 'David Miller · 在学课件进度与教学备忘';
      }
      if (state.role === 'admin' && state.page === 'staffList') {
        return '全校在籍学员 · 按班长筛选';
      }
      return '';
    }

    function bannerBack() {
      if (state.overlay) return null;
      if (state.page === 'detail') return 'back-center';
      if (state.page === 'staffDetail') return 'back-staff';
      return null;
    }

    function renderBanner() {
      const b = BANNERS[state.role];
      const subtitle = bannerSubtitle();
      const back = bannerBack();
      return `
        <header class="relative flex h-[64px] shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${b.gradient} px-4 text-white">
          ${b.pattern}
          <div class="relative flex min-w-0 items-center gap-2.5">
            ${back
              ? `<button data-action="${back}" class="inline-flex h-8 shrink-0 items-center gap-1 rounded-lg px-2 -ml-1 text-[13px] font-semibold text-white/90 transition hover:bg-white/10 active:bg-white/15">${icon('chevron-left', 'h-4 w-4')}返回</button>`
              : `<span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${b.initial}</span>`}
            <div class="min-w-0">
              <div class="truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</div>
              ${subtitle ? `<div class="truncate text-[12px] font-medium text-white/70">${esc(subtitle)}</div>` : ''}
            </div>
          </div>
          <button data-action="toast" data-message="暂无新消息" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
            ${icon('bell', 'h-4 w-4')}
            <span class="absolute -right-0.5 -top-0.5 grid h-4 min-w-[16px] place-items-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white/30">3</span>
          </button>
        </header>`;
    }

    function renderNav() {
      const nav = NAVS[state.role];
      return `
        <div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
          <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
            ${nav.map((item) => {
              const on = state.navTab === item.id;
              return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-500'}">
                ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
                <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
              </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.role === 'parent') {
        const body = !state.profiles.length
          ? renderEmpty()
          : (state.page === 'detail' ? renderDetail() : renderCenter());
        return `${renderSwitcher()}${body}`;
      }
      if (state.role === 'admin') {
        if (state.page === 'trials') return renderTrials();
        if (state.page === 'staffList') return renderStaffList();
        if (state.page === 'staffDetail') return renderStaffDetail();
        const body = !state.profiles.length
          ? renderEmpty()
          : (state.page === 'detail' ? renderDetail() : renderCenter());
        return `${renderSwitcher()}${body}`;
      }
      return state.page === 'staffDetail' ? renderStaffDetail() : renderStaffList();
    }

    /* ------------------------------------------------------------------
     * 通用小组件
     * ------------------------------------------------------------------ */
    function pageHeader(title, subtitle, right = '') {
      return `<div class="flex items-end justify-between gap-3 px-1">
        <div class="min-w-0">
          <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(title)}</h1>
          <p class="mt-0.5 text-[12px] font-medium text-slate-500">${esc(subtitle)}</p>
        </div>
        ${right}
      </div>`;
    }

    function assetTile(label, value, sub = '') {
      return `<div class="rounded-xl bg-white px-2.5 py-2">
        <div class="text-[12px] font-medium text-slate-600">${esc(label)}</div>
        <div class="mt-0.5 font-mono text-[18px] font-bold text-slate-900">${esc(value)}</div>

    function renderSwitcher() {
      const count = state.profiles.length;
      if (!count) {
        return `<div class="sticky top-0 z-20 border-b border-slate-200/70 bg-white/95 px-4 py-2 backdrop-blur">
          <div class="mx-auto flex w-full max-w-[640px] items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-500">暂未绑定学员</span>
            <button data-action="add-profile" ${state.online === 'off' ? 'disabled' : ''} class="h-7 rounded-full border border-indigo-200 bg-white px-2.5 text-[12px] font-bold text-indigo-700 disabled:opacity-40">+ 添加宝贝 (0/10)</button>
          </div>
        </div>`;
      }
      return `<div class="sticky top-0 z-20 border-b border-slate-200/70 bg-white/95 px-4 py-2 backdrop-blur">
        <div class="mx-auto flex w-full max-w-[640px] items-center gap-1.5 overflow-x-auto">
          <span class="shrink-0 text-[12px] font-semibold text-slate-500">当前宝贝</span>
          ${sortedProfiles().map((p) => {
            const on = p.id === state.activeId;
            return `<button data-action="switch-profile" data-id="${p.id}" class="flex shrink-0 items-center gap-1.5 rounded-full border px-2 py-1 ${on ? 'border-indigo-200 bg-white text-indigo-700 ring-1 ring-indigo-200' : 'border-slate-200 bg-white/70 text-slate-600'}">
              ${avatar(p, 'h-6 w-6', 'text-[12px]')}
              <span class="font-mono text-[12px] font-bold">${esc(p.nickname)}</span>

          <button data-action="add-profile" ${count >= 10 || state.online === 'off' ? 'disabled' : ''} class="shrink-0 rounded-full border border-dashed border-slate-300 bg-white/60 px-2.5 py-1 text-[12px] font-bold text-slate-500 disabled:opacity-40">+ 添加 (${count}/10)</button>
          ${state.role === 'parent' ? `<button data-action="open-claim" ${count >= 10 || state.online === 'off' ? 'disabled' : ''} class="shrink-0 rounded-full border border-indigo-200 bg-white px-2.5 py-1 text-[12px] font-bold text-indigo-700 disabled:opacity-40">认领试课</button>` : ''}

      </div>`;

    /* ------------------------------------------------------------------
     * 家长 · 档案中心
     * ------------------------------------------------------------------ */
    function renderCenter() {
      const count = state.profiles.length;
      const isFull = count >= 10;
      const blocked = isFull || state.online === 'off';
      const tablet = state.device === 'tablet';

      const addRow = `<button data-action="add-profile" ${blocked ? 'disabled' : ''} class="flex w-full items-center justify-center gap-1.5 ${tablet ? 'rounded-2xl border border-dashed border-slate-300 bg-white/70 py-4' : 'border-t border-dashed border-slate-200 py-3'} text-[14px] font-semibold ${blocked ? 'cursor-not-allowed text-slate-500' : 'text-indigo-700 hover:bg-indigo-50/40'}">
        ${icon('plus', 'h-4 w-4')} ${isFull ? '名下档案已达上限 (10/10)' : `添加新宝贝 (${count}/10)`}
      </button>`;

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('自家孩子', state.role === 'admin' ? `${count} 个孩子 · 仅本人家庭可见` : `${count} 个孩子 · 单账号上限 10 个`, `<button data-action="add-profile" ${blocked ? 'disabled' : ''} class="h-11 shrink-0 rounded-xl bg-indigo-600 px-4 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">+ 添加</button>`)}
        ${isFull ? `<div class="flex items-start gap-2.5 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2.5">
          <span class="mt-0.5 shrink-0 text-amber-700">${icon('alert-triangle', 'h-4 w-4')}</span>
          <div class="text-[12px] font-medium leading-relaxed text-amber-900"><span class="font-bold">名下档案已达上限 (10/10)</span><br>如需新增，请先注销不再使用的档案。</div>
        </div>` : ''}

        <section class="${tablet ? 'grid grid-cols-2 gap-2' : 'overflow-hidden rounded-2xl border border-slate-300 bg-slate-50/70'}">
          ${sortedProfiles().map((p) => profileItem(p, tablet)).join('')}
          ${tablet ? addRow : ''}
        </section>
        ${!tablet ? addRow : ''}

        ${state.role === 'parent' ? claimCard(blocked) : ''}
        <p class="px-2 text-center text-[12px] font-medium text-slate-500">规范昵称全平台唯一 · 注销后昵称永久保留</p>
      </div>`;
    }

    function profileItem(p, standalone) {
      const active = p.id === state.activeId;
      const cls = standalone
        ? 'rounded-2xl border border-slate-300 bg-slate-50/70 p-3'
        : `border-b border-slate-100 last:border-0 ${active ? 'bg-white' : ''}`;
      return `<button data-action="open-profile" data-id="${p.id}" class="flex w-full items-center gap-3 ${cls} px-3.5 py-3 text-left transition hover:bg-slate-50 active:bg-slate-50">
        ${avatar(p, 'h-11 w-11', 'text-[16px]')}
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-1.5">
            <span class="truncate font-mono text-[16px] font-bold text-slate-900">${esc(p.nickname)}</span>
            <span class="shrink-0 rounded-full border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(p.tag || '宝贝')}</span>
            ${statusChip(p.status)}
          </div>
          <div class="mt-0.5 truncate text-[14px] font-medium text-slate-600">${esc(p.realName)} · ${genderLabel(p.gender)} · ${p.age}岁</div>
          <div class="mt-1 flex flex-wrap items-center gap-x-2 text-[12px] font-medium">
            <span class="text-amber-700">待上 ${p.stats.upcoming}</span>
            <span class="text-slate-300">|</span>
            <span class="text-indigo-700">待排: ${pendingTsOf(p)} TS</span>
            ${pendingTsOf(p) ? `<span class="text-slate-300">|</span>
            <span class="font-mono text-slate-500">${pendingTierText(p)}</span>` : ''}
            <span class="text-slate-300">|</span>
            <span class="text-slate-500">在学课件 ${cwCount(p)}/6</span>
          </div>
        </div>
        ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-300')}
      </button>`;
    }

    function claimCard(blocked) {
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        <div class="flex items-start gap-2.5">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-indigo-100 text-indigo-700">${icon('link-2', 'h-4 w-4')}</span>
          <div class="min-w-0 flex-1">
            <h2 class="text-[16px] font-bold text-slate-900">认领试课宝贝</h2>
            <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">把孩子的试课记录并入当前账号，历史排课、学员备注与购课单完整保留。</p>
          </div>
          <button data-action="open-claim" ${blocked ? 'disabled' : ''} class="h-7 shrink-0 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:cursor-not-allowed disabled:opacity-40">开始认领</button>
        </div>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 冷启动
     * ------------------------------------------------------------------ */
    function renderEmpty() {
      const teachers = [
        { name: 'David Miller', level: '资深老师 · 少儿英语 / KET', initial: 'D' },
        { name: 'Sarah Jenkins', level: '老师 · 生活口语 / 自然拼读', initial: 'S' }
      ];
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('自家孩子', '暂未绑定学员 · 可先浏览老师')}
        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-5">
          <span class="grid h-12 w-12 place-items-center rounded-2xl bg-indigo-100 text-indigo-700">${icon('user-plus', 'h-5 w-5')}</span>
          <h2 class="mt-3 text-[18px] font-bold text-slate-900">还没有孩子档案</h2>
          <p class="mt-1 text-[14px] font-medium text-slate-600">先浏览老师与空课表，选好课再添加孩子档案。</p>
          <button data-action="add-profile" class="mt-4 h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">添加孩子档案</button>
          <button data-action="open-claim" ${state.online === 'off' ? 'disabled' : ''} class="mx-auto mt-2 block text-[12px] font-semibold text-indigo-600 transition hover:text-indigo-700 hover:underline disabled:cursor-not-allowed disabled:opacity-40">已有试课记录？去认领 →</button>
        </section>

        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
          <div class="flex items-center justify-between">
            <h2 class="text-[16px] font-bold text-slate-900">推荐老师</h2>
            <span class="text-[12px] font-medium text-slate-500">公开试课</span>
          </div>
          <div class="mt-2 divide-y divide-slate-100">
            ${teachers.map((t) => `<div class="flex items-center gap-3 py-2.5">
              <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-indigo-50 text-[14px] font-bold text-indigo-700">${t.initial}</span>
              <div class="min-w-0 flex-1">
                <div class="truncate text-[14px] font-bold text-slate-900">${t.name}</div>
                <div class="truncate text-[12px] font-medium text-slate-500">${t.level}</div>
              </div>
              <button data-action="add-profile" data-reason="预约排课前，请先添加宝贝档案" class="h-7 shrink-0 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70">预约</button>
            </div>`).join('')}
          </div>
        </section>

        <a href="m1b_teacher_parent.html" target="_blank" rel="noopener" class="flex items-center justify-between rounded-2xl border border-slate-300 bg-slate-50/70 px-4 py-3">
          <span class="flex items-center gap-2 text-[14px] font-semibold text-slate-700">${icon('plus-circle', 'h-4 w-4 text-slate-500')}去约课大厅看看</span>
          ${icon('chevron-right', 'h-4 w-4 text-slate-300')}
        </a>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 档案详情
     * ------------------------------------------------------------------ */
    function renderDetail() {
      const p = activeProfile();
      if (!p) return renderEmpty();
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        ${identityCard(p, 'parent')}
        ${assetCard(p)}
        ${coursewareCard(p, 'parent', 'profile')}
        ${notesCard(p, state.role === 'admin' ? 'staff' : 'parent', 'profile')}
        ${lessonHistoryCard()}
        ${infoCard(p, 'parent')}
        ${p.trialHistory ? `<div class="rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-600">试课记录已并入：历史结课 ${p.stats.completed} 节，学员备注与试课购课单均可查。</div>` : ''}
        <div class="flex gap-2">
          <button data-action="open-edit" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">编辑档案</button>
          <button data-action="open-guard" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-1 rounded-xl border border-rose-200 bg-rose-50 text-[14px] font-semibold text-rose-700 transition hover:bg-rose-100 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-50 disabled:text-slate-300">注销档案</button>
        </div>
        <p class="text-center text-[12px] font-medium text-slate-500">注销前需清零课次资产</p>
      </div>`;
    }

    function identityCard(p, mode) {
      const isTrial = p.staffKind === 'trial';
      const tag = isTrial
        ? `<span class="shrink-0 rounded-full border border-amber-200 bg-amber-50 px-1.5 py-0.5 text-[12px] font-bold text-amber-800">试课待认领</span>`
        : (p.tag ? `<span class="shrink-0 rounded-full border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(p.tag)}</span>` : '');
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        <div class="flex items-start gap-3.5">
          ${avatar(p, 'h-16 w-16', 'text-[18px]')}
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="truncate font-mono text-[18px] font-bold tracking-tight text-slate-900">${esc(p.nickname)}</span>
              ${tag}
              ${statusChip(p.status, isTrial ? 'admin' : 'parent')}
            </div>
            <div class="mt-1 text-[14px] font-medium text-slate-600">${esc(p.realName)} · ${genderLabel(p.gender)} · ${p.age}岁</div>
            ${mode === 'staff' && !isTrial ? leaveBadge(p) : ''}
          </div>
          <button data-action="copy-nick" data-nick="${esc(p.nickname)}" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg border border-slate-300 bg-white text-slate-500 transition hover:bg-slate-50" aria-label="复制规范昵称">
            ${icon('copy', 'h-3.5 w-3.5')}
          </button>
        </div>
      </section>`;
    }

    function assetCard(p) {
      const t = TONES.emerald;
      const pending = pendingTsOf(p);
      const tierText = pendingTierText(p);
      const sched = scheduledBreakdown(p);
      const round = fixedRoundOf(p);
      return `<section class="rounded-2xl border ${t.card} p-3.5">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="grid h-8 w-8 place-items-center rounded-xl ${t.icon}">${icon('wallet', 'h-4 w-4')}</span>
            <h2 class="text-[16px] font-bold text-slate-900">课次资产 (TS)</h2>
          </div>
          <span class="text-[12px] font-medium text-slate-600">财课分离 · 按节核销</span>
        </div>
        <div class="mt-2.5 rounded-xl bg-white px-3 py-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-600">1v1 待排期</span>
            <span class="shrink-0 rounded-full border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">统一待排池</span>
          </div>
          <div class="mt-0.5 flex items-end gap-1.5">
            <span class="font-mono text-[18px] font-bold text-slate-900">${pending}</span>
            <span class="pb-0.5 text-[12px] font-semibold text-slate-600">节可排 TS</span>
          </div>
          <div class="mt-0.5 text-[12px] font-medium text-slate-600">${pending ? `价位分布：${esc(tierText)}` : '暂无待排课次'}</div>
        </div>
        <div class="mt-1.5 grid grid-cols-2 gap-1.5">
          ${assetTile('已排期 TS', `${sched.upcoming} 节`, sched.upcoming ? `🟠 固定位 ${sched.fixed} · 🟡 临时课 ${sched.temp}` : '暂未排课')}
          ${assetTile('已结课 TS', `${p.stats.completed} 节`)}
        </div>
        <div class="mt-1.5 flex items-center justify-between gap-2 rounded-xl bg-white px-3 py-2">
          <span class="shrink-0 text-[12px] font-medium text-slate-600">当前已排固定位轮次</span>
          <span class="truncate text-right font-mono text-[12px] font-bold text-slate-900">${esc(round || '暂无固定位轮次')}</span>
        </div>
      </section>`;
    }

    function coursewareCard(p, mode, kind) {
      const list = p.courseware || [];
      const staff = mode === 'staff' && p.status !== 'ARCHIVED';
      const selfActive = mode === 'parent' && p.status === 'ACTIVE' && (state.role === 'parent' || state.role === 'admin');
      const editable = staff || selfActive;
      const maintainHint = state.role === 'parent'
        ? '学习进度选填，最多 64 字；管理员、班长、老师与家长均可维护'
        : '支持 1~6 门课件与就读级别维护；学习进度选填，最多 64 字';
      const readonlyHint = p.status === 'UNBOUND'
        ? '待认领试课档案由负责班长或平台管理员维护'
        : p.status === 'ARCHIVED'
          ? '已归档档案只读 · 不支持调整'
          : maintainHint;
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        <div class="flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-slate-100 text-slate-600">${icon('book-open-check', 'h-4 w-4')}</span>
            <h2 class="truncate text-[16px] font-bold text-slate-900">在学课件</h2>
            <span class="shrink-0 rounded-full bg-slate-100 px-1.5 py-0.5 font-mono text-[12px] font-bold text-slate-500">${list.length}/6</span>
          </div>
          ${editable
            ? `<button data-action="open-courseware" data-kind="${kind}" data-id="${p.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-7 shrink-0 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:opacity-40">配置课件</button>`
            : `<span class="inline-flex shrink-0 items-center gap-1 rounded-full border border-slate-300 bg-white px-2 py-0.5 text-[12px] font-bold text-slate-500">${icon('lock', 'h-3.5 w-3.5')}只读</span>`}
        </div>
        <p class="mt-0.5 text-[12px] font-medium text-slate-500">${editable ? maintainHint : readonlyHint}</p>
        <div class="mt-2.5 space-y-2">
          ${list.length ? list.map((item, idx) => {
            const cw = cwById(item.cwId);
            const stale = isStaleCourseware(item, p);
            const mainTeacher = mainTeacherInfo(item);
            const isEditingInline = state.inlineCw && state.inlineCw.kind === kind && state.inlineCw.id === p.id && state.inlineCw.index === idx;
            const lastUpdater = item.lastUpdatedBy
              ? `最后更新：${esc(item.lastUpdatedBy)} (${esc(item.lastUpdatedRole || '教务')}) · ${relativeDaysLabel(item.lastUpdatedAt)}`
              : '暂无进度更新记录';
            const mainTeacherLabel = mainTeacher
              ? `主力更新老师：${esc(mainTeacher.name)} (${mainTeacher.count}次)`
              : '暂无老师更新记录';
            return `<div class="rounded-xl border border-slate-200/80 bg-white p-3">
              <div class="flex items-start gap-2.5">
                <span class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-indigo-50 text-indigo-700">${icon('book-open', 'h-4 w-4')}</span>
                <div class="min-w-0 flex-1">
                  <div class="flex flex-wrap items-center gap-1.5">
                    <span class="truncate text-[14px] font-bold text-slate-900">${esc(cw.nameEn)}</span>
                    <span class="shrink-0 rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(item.level || '标准')}</span>
                    ${stale ? `<span class="shrink-0 rounded-md border border-amber-200 bg-amber-50 px-1.5 py-0.5 text-[11px] font-bold text-amber-800">近 6 个月没有更新</span>` : ''}
                  </div>
                  <div class="truncate text-[12px] font-medium text-slate-500">${esc(cw.nameCn)}</div>
                </div>
                ${editable && !isEditingInline
                  ? `<button data-action="inline-cw-open" data-kind="${kind}" data-id="${p.id}" data-index="${idx}" ${state.online === 'off' ? 'disabled' : ''} class="h-7 shrink-0 rounded-lg border border-slate-200 bg-slate-50 px-2 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-100 disabled:opacity-40">更新进度</button>`
                  : ''}
              </div>
              <div class="mt-2 rounded-lg bg-slate-50/80 px-2.5 py-1.5 text-[12px]">
                <span class="font-semibold text-slate-500">学习进度：</span>
                <span class="font-semibold ${item.progressText ? 'text-slate-800' : 'text-slate-500'}">${esc(item.progressText || '暂未记录（如 Unit 3 · Page 24）')}</span>
              </div>
              ${isEditingInline ? `<div class="mt-2 space-y-2 rounded-xl border border-indigo-200 bg-indigo-50/40 p-2.5">
                <div class="flex items-center justify-between text-[12px]">
                  <span class="font-semibold text-indigo-950">更新当前学习进度</span>
                  <span id="inlineCwCount" class="font-mono font-semibold text-slate-500">${(state.inlineCw.text || '').length}/64</span>
                </div>
                <input id="inlineCwInput" value="${esc(state.inlineCw.text)}" maxlength="64" placeholder="如 Unit 3 · Page 24 / 第4单元第12页" class="h-10 w-full rounded-lg border border-indigo-200 bg-white px-3 text-[14px] text-slate-900 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15">
                <div class="flex justify-end gap-2">
                  <button data-action="inline-cw-cancel" class="h-8 rounded-lg border border-slate-300 bg-white px-3 text-[12px] font-semibold text-slate-700 hover:bg-slate-50">取消</button>
                  <button data-action="inline-cw-save" class="h-8 rounded-lg bg-indigo-600 px-3 text-[12px] font-semibold text-white hover:bg-indigo-700">保存进度</button>
                </div>

          </div>
          ${showLetterIndex ? `<div class="space-y-1.5">
            <button data-action="staff-letter-toggle" class="inline-flex h-7 items-center gap-1 rounded-full border border-slate-200 bg-white px-2.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">

              <span class="text-slate-500" aria-hidden="true">${state.staffLetterOpen ? '▴' : '▾'}</span>
            </button>
            ${state.staffLetterOpen ? `<div class="flex flex-wrap gap-1">
              <button data-action="staff-letter" data-letter="all" class="h-7 shrink-0 rounded-lg px-2 text-[12px] font-bold transition ${state.staffLetter === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200/80'}">全部</button>
              ${letters.map((l) => `<button data-action="staff-letter" data-letter="${l}" class="h-7 w-7 shrink-0 rounded-lg text-[12px] font-bold transition ${state.staffLetter === l ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200/80'}">${l}</button>`).join('')}

          ${seg('archived', '已归档', counts.archived)}
        </div>
        ${items.some((p) => scheduleChild(p).demo) ? `<div class="flex items-start gap-2 rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2 text-[12px] font-medium text-slate-600">
          <span class="mt-0.5 shrink-0 text-slate-500">${icon('info', 'h-3.5 w-3.5')}</span>
          <span>演示数据：非 Alice / Bob 学员的课表统一展示 Alice 的周课表</span>
        </div>` : ''}
        <div class="${tablet ? 'grid grid-cols-2 gap-2' : 'space-y-2'}">
          ${items.length
            ? items.map((p) => staffRow(p)).join('')
            : `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/60 px-6 py-10 text-center">
              <div class="text-[14px] font-medium text-slate-500">没有匹配的学员</div>
              <button data-action="staff-reset" class="mt-2 h-9 rounded-xl border border-slate-300 bg-white px-4 text-[14px] font-medium text-slate-800 transition hover:bg-slate-50">重置筛选</button>
            </div>`}
        </div>

    }

    function staffRow(p) {
      const cwItem = p.courseware && p.courseware.length ? p.courseware[0] : null;
      const cw = cwItem ? cwById(cwItem.cwId) : null;
      const schedule = scheduleChild(p);
      const archived = p.status === 'ARCHIVED';
      const isTrial = p.staffKind === 'trial';
      const isTeacher = state.role === 'teacher';
      return `<article class="rounded-2xl border ${archived ? 'border-dashed border-slate-400 bg-slate-50/60 opacity-60' : 'border-slate-300 bg-slate-50/70'} p-3">
        <button data-action="staff-open" data-kind="${p.staffKind}" data-id="${p.id}" class="flex w-full items-center gap-3 text-left">
          ${avatar(p, 'h-11 w-11', 'text-[16px]')}
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="truncate font-mono text-[16px] font-bold text-slate-900">${esc(p.nickname)}</span>
              ${isTrial
                ? `<span class="inline-flex shrink-0 items-center rounded-full border border-amber-200 bg-amber-50 px-1.5 py-0.5 text-[12px] font-bold text-amber-800">试课待认领</span>`
                : statusChip(p.status, 'parent')}
              ${!isTeacher ? `<span class="shrink-0 rounded-full border border-slate-300 bg-white px-1.5 py-0.5 text-[12px] font-bold text-slate-600">${esc(counselorLabel(p.responsible))}</span>` : ''}
            </div>
            <div class="mt-0.5 truncate text-[14px] font-medium text-slate-600">${isTeacher ? `${esc(p.englishName)} · ${genderLabel(p.gender)} · ${p.age}岁` : `${esc(p.realName)} · ${genderLabel(p.gender)} · ${p.age}岁`}</div>
            <div class="mt-1 flex flex-wrap items-center gap-x-2 text-[12px] font-medium text-slate-500">
              <span>授课 ${esc(p.teacher || '待安排')}</span>
              <span class="text-slate-300">·</span>
              ${isTrial
                ? `<span>预留 ${maskContact(p.contact)}</span>`
                : `<span class="font-semibold text-indigo-700">待排: ${pendingTsOf(p)} TS</span>${pendingTsOf(p) ? `<span class="text-slate-300">·</span><span class="font-mono text-slate-600">${pendingTierText(p)}</span>` : ''}`}
            </div>
            ${cw ? `<div class="mt-0.5 truncate text-[12px] font-medium text-slate-500">在学课件 ${esc(cw.nameEn)} ${esc(cwItem.level || '')}${cwItem.progressText ? ` · ${esc(cwItem.progressText)}` : ''}</div>` : ''}
          </div>
          ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-300')}
        </button>
        <div class="mt-2 flex items-center gap-3 border-t border-slate-100 pt-2">
          ${isTrial
            ? `<button data-action="open-bind" data-id="${p.id}" ${state.online === 'off' ? 'disabled' : ''} class="inline-flex h-7 shrink-0 items-center gap-1 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:opacity-40">绑定家长 Email</button>`
            : (!isTeacher ? `<button data-action="buy4" data-nick="${esc(p.nickname)}" class="inline-flex h-7 shrink-0 items-center gap-1 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70">${icon('plus', 'h-3.5 w-3.5 shrink-0')}买4排4</button>` : '')}
          <a href="${scheduleUrl(p)}" target="_blank" rel="noopener" title="${schedule.demo ? '演示数据：该学员课表统一展示 Alice 的周课表' : '查看该学员周课表'}" class="inline-flex items-center gap-0.5 whitespace-nowrap text-[12px] font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">查看课表 →</a>
          <button data-action="staff-open" data-kind="${p.staffKind}" data-id="${p.id}" class="ml-auto whitespace-nowrap text-[12px] font-semibold text-indigo-600 transition hover:text-indigo-700 hover:underline">档案 / 学情 →</button>
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 班长 / 管理员 · 档案详情
     * ------------------------------------------------------------------ */
    function renderStaffDetail() {
      const p = staffTarget();
      if (!p) return renderStaffList();
      const isTrial = p.staffKind === 'trial';
      const isTeacher = state.role === 'teacher';
      const canBind = isTrial && !isTeacher && (p.status === 'UNBOUND' || p.status === 'TRIALING');
      const schedule = scheduleChild(p);
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        ${identityCard(p, 'staff')}
        ${!isTeacher ? leaveRiskCard(p) : ''}
        ${canBind ? bindCard(p) : ''}
        ${!isTrial && !isTeacher ? assetCard(p) : ''}
        ${coursewareCard(p, 'staff', p.staffKind)}
        ${infoCard(p, 'staff')}
        ${notesCard(p, 'staff', p.staffKind)}
        ${lessonHistoryCard()}
        ${isTrial && p.status === 'ACTIVE' ? `<div class="rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2.5 text-[12px] font-medium text-slate-600">已认领并绑定至家长账号${p.claimedAt ? ` · ${esc(p.claimedAt)}` : ''}</div>` : ''}
        ${isTrial && p.status === 'ARCHIVED' ? `<div class="rounded-xl border border-dashed border-slate-400 bg-slate-50/60 px-3 py-2.5 text-[12px] font-medium text-slate-600 opacity-60">已于 ${esc(p.archivedAt || '—')} 归档 · 昵称仍保持占用</div>` : ''}
        ${!isTeacher ? auditCard(p) : ''}
        ${schedule.demo ? `<div class="flex items-start gap-2 rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2 text-[12px] font-medium text-slate-600">
          <span class="mt-0.5 shrink-0 text-slate-500">${icon('info', 'h-3.5 w-3.5')}</span>
          <span>演示数据：该学员课表展示 Alice 的周课表</span>
        </div>` : ''}
        <div class="flex gap-2">
          <a href="${scheduleUrl(p)}" target="_blank" rel="noopener" title="${schedule.demo ? '演示数据：该学员课表统一展示 Alice 的周课表' : '查看该学员周课表'}" class="flex h-11 flex-1 items-center justify-center gap-1.5 whitespace-nowrap rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 transition hover:bg-slate-50">${icon('calendar-days', 'h-4 w-4 shrink-0')}查看课表</a>
          ${isTeacher
            ? `<button data-action="open-courseware" data-kind="${p.staffKind}" data-id="${p.id}" class="flex h-11 flex-1 items-center justify-center gap-1.5 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">${icon('book-open-check', 'h-4 w-4')}配置在学课件</button>`
            : isTrial
              ? `<button data-action="toast" data-message="已打开 1v1 临时课代约" class="flex h-11 flex-1 items-center justify-center gap-1.5 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">${icon('calendar-plus', 'h-4 w-4')}代约试课</button>`
              : `<button data-action="buy4" data-nick="${esc(p.nickname)}" class="flex h-11 flex-1 items-center justify-center gap-1.5 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">${icon('plus', 'h-4 w-4')}买4排4</button>`}
        </div>
      </div>`;
    }

    function bindCard(t) {
      const expiring = t.status === 'UNBOUND' && t.daysLeft <= 7;
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-3.5">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <h2 class="text-[16px] font-bold text-slate-900">${t.status === 'TRIALING' ? '试课中 · 可绑定家长' : '待认领试课档案'}</h2>
            <p class="mt-0.5 text-[12px] font-medium text-slate-500">档案暂归平台托管 · 绑定后历史课表、学员备注与订单完整继承</p>
          </div>
          ${expiring ? `<span class="shrink-0 text-[12px] font-medium text-rose-700">(剩 ${t.daysLeft} 天归档)</span>` : ''}
        </div>
        <div class="mt-3 flex items-center gap-3">
          <button data-action="open-bind" data-id="${t.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-7 shrink-0 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:cursor-not-allowed disabled:opacity-40">绑定家长 Email</button>
          <button data-action="toast" data-message="已打开 1v1 临时课代约" class="whitespace-nowrap text-[12px] font-semibold text-indigo-600 transition hover:text-indigo-700 hover:underline">代约试课 →</button>
        </div>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 管理员 · 试课档案
     * ------------------------------------------------------------------ */
    function trialSortRank(t) {
      if (t.status === 'UNBOUND' || t.status === 'TRIALING') return 0;
      if (t.status === 'ACTIVE') return 1;
      return 2;
    }

    function compareTrial(a, b) {
      const ra = trialSortRank(a);
      const rb = trialSortRank(b);
      if (ra !== rb) return ra - rb;
      if (ra === 0) {
        const da = Number(a.daysLeft) || 0;
        const db = Number(b.daysLeft) || 0;
        if (da !== db) return da - db;
        const la = String(a.lastLessonDate || a.createdAt || '');
        const lb = String(b.lastLessonDate || b.createdAt || '');
        return lb.localeCompare(la) || compareNickname(a, b);
      }
      if (ra === 1) return String(b.claimedAt || '').localeCompare(String(a.claimedAt || '')) || compareNickname(a, b);
      return String(b.archivedAt || '').localeCompare(String(a.archivedAt || '')) || compareNickname(a, b);
    }

    function sortTrialItems(list, forceNickname) {
      return [...list].sort((a, b) => (forceNickname ? compareNickname(a, b) : compareTrial(a, b)));
    }

    function renderTrials() {
      const all = state.trials;
      const map = { all: null, unbound: 'UNBOUND', trialing: 'TRIALING', active: 'ACTIVE', archived: 'ARCHIVED' };
      const counts = {
        all: all.length,
        unbound: all.filter((t) => t.status === 'UNBOUND').length,
        trialing: all.filter((t) => t.status === 'TRIALING').length,
        active: all.filter((t) => t.status === 'ACTIVE').length,
        archived: all.filter((t) => t.status === 'ARCHIVED').length
      };
      const q = state.trialQuery.trim().toLowerCase();
      const list = sortTrialItems(all.filter((t) => {
        if (map[state.adminTab] && t.status !== map[state.adminTab]) return false;
        if (!q) return true;
        const nick = String(t.nickname || '').toLowerCase();
        const fields = [t.realName, t.englishName, t.contact].map((v) => String(v || '').toLowerCase());
        if (/^[a-z]{1,2}$/.test(q)) return nick.startsWith(q) || fields.some((v) => v.startsWith(q));
        return nick.includes(q) || fields.some((v) => v.includes(q));
      }), !!q);
      const tablet = state.device === 'tablet';
      const seg = (key, label, count) => `<button data-action="set-admin-tab" data-tab="${key}" class="h-6 shrink-0 whitespace-nowrap rounded-full border-0 px-2.5 text-[11px] transition ${state.adminTab === key ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${label}${count ? ` (${count})` : ''}</button>`;
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        <div class="flex items-center justify-between gap-3 px-1">
          <div class="min-w-0">
            <h1 class="text-[18px] font-bold tracking-tight text-slate-900">试课学员管理</h1>
            <p class="mt-0.5 text-[12px] font-medium text-slate-500">免注册代建 · 30 天未认领自动归档</p>
          </div>
          <button data-action="open-trial" ${state.online === 'off' ? 'disabled' : ''} class="h-11 shrink-0 rounded-xl bg-indigo-600 px-4 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">+ 新建试课</button>
        </div>
        <div class="relative">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
          <input id="trialSearch" value="${esc(state.trialQuery)}" placeholder="搜索规范昵称(如 L / Le)或小名" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 pl-9 pr-3.5 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">
        </div>
        <p class="px-1 text-[12px] font-medium text-slate-500">${q ? '搜索中 · 按昵称 A-Z' : '默认按防流失优先级排序：临期归档 → 已转正 → 已归档'}</p>
        <div class="flex items-center gap-1.5 overflow-x-auto py-0.5">
          ${seg('all', '全部', counts.all)}
          ${seg('unbound', '待认领', counts.unbound)}
          ${seg('trialing', '试课中', counts.trialing)}
          ${seg('active', '已认领', counts.active)}
          ${seg('archived', '已归档', counts.archived)}
        </div>
        <div class="${tablet ? 'grid grid-cols-2 gap-2' : 'space-y-2'}">
          ${list.length
            ? list.map((t) => trialCard(t)).join('')
            : `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/60 px-6 py-10 text-center">
              <div class="text-[14px] font-medium text-slate-500">没有匹配的试课学员</div>
              <button data-action="trial-reset" class="mt-2 h-9 rounded-xl border border-slate-300 bg-white px-4 text-[14px] font-medium text-slate-800 transition hover:bg-slate-50">重置筛选</button>
            </div>`}
        </div>
      </div>`;
    }

    function trialCard(t) {
      const expiring = t.status === 'UNBOUND' && t.daysLeft <= 7;
      const archived = t.status === 'ARCHIVED';
      return `<article class="rounded-2xl border ${archived ? 'border-dashed border-slate-400 bg-slate-50/60 opacity-60' : 'border-slate-300 bg-slate-50/70'} p-3">
        <button data-action="staff-open" data-kind="trial" data-id="${t.id}" class="flex w-full items-center gap-2.5 text-left">
          ${avatar(t, 'h-10 w-10', 'text-[14px]', 'slate')}
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="truncate font-mono text-[16px] font-bold text-slate-900">${esc(t.nickname)}</span>
              ${statusChip(t.status, 'admin')}
            </div>
            <div class="mt-0.5 truncate text-[14px] font-medium text-slate-600">${esc(t.realName)} · ${genderLabel(t.gender)} · ${t.age}岁</div>
            <div class="mt-0.5 truncate text-[12px] font-medium text-slate-500">${esc(t.notes ? t.notes : `建档于 ${t.createdAt} · ${t.createdBy || 'Sarah'}`)}</div>
          </div>
          ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-300')}
        </button>
        <div class="mt-2 space-y-1 border-t border-slate-100 pt-2 text-[12px] font-medium text-slate-500">
          <div class="flex items-center justify-between gap-3"><span class="shrink-0">家长联系方式</span><span class="truncate text-right font-semibold text-slate-700">${maskContact(t.contact)}</span></div>
          <div class="flex items-center justify-between gap-3"><span class="shrink-0">试课进度</span><span class="truncate text-right font-semibold text-slate-700">${esc(t.trialProgress || `${t.trialLessons} 节`)}</span></div>
          <div class="flex items-center justify-between gap-3"><span class="shrink-0">最近试课</span><span class="truncate text-right font-semibold text-slate-700">${t.lastLessonDate ? esc(t.lastLessonDate.slice(5)) : '待排'}</span></div>
          <div class="flex items-center justify-between gap-3"><span class="shrink-0">负责班长</span><span class="truncate text-right font-semibold text-slate-700">${esc(counselorLabel(t.responsible))}</span></div>
          <div class="flex items-center justify-between gap-3"><span class="shrink-0">建档人</span><span class="truncate text-right font-semibold text-slate-700">${esc(t.createdBy || 'Sarah')}</span></div>
          ${expiring ? `<div class="text-right font-medium text-rose-700">(剩 ${t.daysLeft} 天归档)</div>` : ''}
        </div>
        <div class="mt-2 flex flex-wrap items-center gap-3 border-t border-slate-100 pt-2">
          ${t.status === 'UNBOUND' || t.status === 'TRIALING' ? `<button data-action="open-bind" data-id="${t.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-7 shrink-0 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:cursor-not-allowed disabled:opacity-40">绑定家长 Email</button>` : ''}
          ${t.status === 'UNBOUND' || t.status === 'TRIALING' ? `<button data-action="toast" data-message="已打开 1v1 临时课代约" class="whitespace-nowrap text-[12px] font-semibold text-indigo-600 transition hover:text-indigo-700 hover:underline">代约试课 →</button>` : ''}
          <button data-action="staff-open" data-kind="trial" data-id="${t.id}" class="ml-auto whitespace-nowrap text-[12px] font-semibold text-indigo-600 transition hover:text-indigo-700 hover:underline">综合档案详情 →</button>
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 其他模块占位页
     * ------------------------------------------------------------------ */
    function renderPlaceholder() {
      const item = NAVS[state.role].find((n) => n.id === state.navTab);
      if (!item) return renderContentFallback();
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">${esc(item.actionLabel || '前往功能')}</a>` : ''}
        <button data-action="back-main" class="mt-3 text-[14px] font-semibold text-indigo-600">返回${state.role === 'parent' ? '自家孩子' : state.role === 'monitor' ? '所辖学员' : state.role === 'teacher' ? '我的学员' : '全员学员'}</button>
      </div>`;
    }

    function renderContentFallback() {
      return `<div class="p-8 text-center text-[14px] font-medium text-slate-500">页面不存在</div>`;
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'profile') return renderProfileSheet();

        <div class="absolute inset-x-0 bottom-0 flex max-h-[88%] flex-col rounded-t-3xl bg-white shadow-2xl">

            ${draft.length ? draft.map((item, i) => {

              const progLen = (item.progressText || '').length;
              return `<div class="space-y-2 rounded-xl border border-slate-200 bg-white p-3">
                <div class="flex items-center gap-2.5">
                  <span class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-indigo-50 text-indigo-700">${icon('book-open', 'h-4 w-4')}</span>
                  <div class="min-w-0 flex-1">
                    <div class="truncate text-[14px] font-bold text-slate-900">${esc(info.nameEn)}</div>

                  ${info.levels.length

                    ${icon('x', 'h-4 w-4')}

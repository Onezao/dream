            </div>
            <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>

          <div class="mt-4">
            <label for="bindEmail" class="mb-1 block text-[14px] font-semibold text-slate-700">家长注册邮箱</label>
            <input id="bindEmail" type="email" value="${esc(state.bind.email)}" placeholder="parent@example.com" class="h-11 w-full rounded-xl border ${state.bind.error ? 'border-rose-300' : 'border-slate-200'} bg-white px-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500">
            <p class="mt-1 text-[12px] font-medium text-slate-500">系统将核验该邮箱是否已注册</p>
            <p class="mt-0.5 text-[12px] font-medium text-slate-500">演示可用：grace@example.com</p>
          </div>

          ${state.bind.error ? `<div id="bindError" class="mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[12px] font-medium text-rose-700">${esc(state.bind.error)}</div>` : ''}

          <div class="mt-4 flex gap-2">
            <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-700 hover:bg-slate-50">取消</button>
            <button data-action="submit-bind" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认绑定</button>
          </div>
        </div>
      </div>`;
    }

    function renderCoursewareSheet() {
      const cw = state.cw;
      const target = findCwTarget(cw.targetKind, cw.targetId);
      if (!target) return '';
      const draft = cw.draft;
      const available = COURSEWARE_LIB.filter((x) => !draft.some((d) => d.cwId === x.id));
      const picked = COURSEWARE_LIB.find((x) => x.id === cw.pickCw);
      const canAdd = state.online === 'on' && available.length > 0 && draft.length < 6 && !!cw.pickCw && !!cw.pickLevel;
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 flex max-h-[88%] flex-col rounded-t-3xl bg-white shadow-2xl">
          <div class="mx-auto mt-2 h-1 w-10 shrink-0 rounded-full bg-slate-300"></div>
          <div class="flex shrink-0 items-center justify-between px-4 py-2.5">
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">在学课件配置</h2>
              <p class="truncate text-[12px] font-medium text-slate-500">${esc(target.nickname)} · ${draft.length}/6</p>
            </div>
            <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>

          <div class="min-h-0 flex-1 space-y-2.5 overflow-y-auto px-4 pb-3">
            <div class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-500">仅管理员与负责班长可维护；家长端只读，保存后同步至教师日历。</div>

            ${draft.length ? draft.map((item, i) => {
              const info = cwById(item.cwId);
              return `<div class="flex items-center gap-2.5 rounded-xl border border-slate-200 bg-white p-2.5">
                <span class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-indigo-50 text-indigo-700">${icon('book-open', 'h-4 w-4')}</span>
                <div class="min-w-0 flex-1">
                  <div class="truncate text-[14px] font-bold text-slate-900">${esc(info.nameEn)}</div>
                  <div class="truncate text-[12px] font-medium text-slate-500">${esc(info.nameCn)}</div>
                </div>
                ${info.levels.length
                  ? `<select id="cwLevel-${i}" class="h-9 shrink-0 rounded-lg border border-slate-200 bg-white px-2 text-[14px] font-semibold text-slate-700 outline-none focus:border-indigo-500">
                    ${info.levels.map((l) => `<option ${l === item.level ? 'selected' : ''}>${esc(l)}</option>`).join('')}
                  </select>`
                  : `<span class="shrink-0 text-[12px] font-medium text-slate-500">标准</span>`}
                <button data-action="cw-remove" data-index="${i}" ${state.online === 'off' ? 'disabled' : ''} class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 transition hover:bg-rose-50 hover:text-rose-600 disabled:opacity-40" aria-label="移除">
                  ${icon('x', 'h-4 w-4')}
                </button>
              </div>`;
            }).join('') : `<div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 px-3 py-6 text-center text-[12px] font-medium text-slate-500">尚未配置在学课件</div>`}

            ${draft.length >= 6
              ? `<div class="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-medium text-amber-900">已达 6 门上限，请先移除后再添加。</div>`
              : `<div class="space-y-1.5 rounded-xl border border-dashed border-slate-300 bg-slate-50 p-3">
                <div class="text-[12px] font-bold text-slate-500">添加课件</div>
                <select id="cwPick" class="h-10 w-full rounded-lg border border-slate-200 bg-white px-2 text-[14px] font-semibold text-slate-700 outline-none focus:border-indigo-500">
                  <option value="">选择课件</option>
                  ${available.map((x) => `<option value="${x.id}" ${cw.pickCw === x.id ? 'selected' : ''}>${esc(x.nameEn)} · ${esc(x.nameCn)}</option>`).join('')}
                </select>
                <select id="cwLevel" ${picked ? '' : 'disabled'} class="h-10 w-full rounded-lg border border-slate-200 bg-white px-2 text-[14px] font-semibold text-slate-700 outline-none focus:border-indigo-500 disabled:bg-slate-100 disabled:text-slate-500">
                  ${picked
                    ? picked.levels.map((l) => `<option ${l === cw.pickLevel ? 'selected' : ''}>${esc(l)}</option>`).join('')
                    : `<option>选择级别</option>`}
                </select>
                <button data-action="cw-add" ${canAdd ? '' : 'disabled'} class="h-9 w-full rounded-lg bg-indigo-600 text-[14px] font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">添加到在学课件</button>
              </div>`}

            ${target.audit && target.audit.length ? `<details class="rounded-xl border border-slate-200 bg-white p-3">
              <summary class="flex cursor-pointer list-none items-center justify-between [&::-webkit-details-marker]:hidden">
                <span class="text-[14px] font-bold text-slate-800">变更记录</span>
                <span class="text-[12px] font-medium text-slate-500">${target.audit.length} 条</span>
              </summary>
              <div class="mt-2 space-y-2">
                ${target.audit.slice(0, 3).map((a) => `<div class="text-[12px] font-medium leading-relaxed text-slate-500"><span class="text-slate-500">${esc(a.at)} · ${esc(a.by)}</span><br><span class="text-slate-700">${esc(a.text)}</span></div>`).join('')}
              </div>
            </details>` : ''}
          </div>

          <div class="flex shrink-0 gap-2 border-t border-slate-200 px-4 py-3">
            <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[16px] font-semibold text-slate-700 hover:bg-slate-50">取消</button>
            <button data-action="cw-save" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">保存生效</button>
          </div>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 预览与表单同步
     * ------------------------------------------------------------------ */
    function statusLine(st) {
      if (st.ok) return `<span class="flex items-center gap-1 text-emerald-600"><span class="font-bold">✓</span>${esc(st.message)}</span>`;
      return `<span class="flex items-center gap-1 ${st.incomplete ? 'text-slate-500' : 'text-rose-600'}"><span class="font-bold">${st.incomplete ? '·' : '!'}</span>${esc(st.message)}</span>`;
    }

    function updateProfilePreview() {
      const f = state.form;
      const nickEl = $('nickPreview');
      if (!nickEl) return;
      const nick = computeNickname(f);
      nickEl.textContent = nick || '英文名+首字母+年龄';
      nickEl.className = `mt-0.5 break-all font-mono text-[18px] font-bold ${nick ? 'text-indigo-950' : 'text-indigo-300'}`;

      const statusEl = $('nickStatus');
      if (statusEl) statusEl.innerHTML = statusLine(profileNicknameStatus(f));

      const btn = $('btnSubmitProfile');
      if (btn) btn.disabled = !!profileFormError(f);

      const initialEl = $('avatarInitial');
      if (initialEl && !f.avatarDataUrl) {
        initialEl.textContent = (f.englishName || '?').trim().charAt(0).toUpperCase() || '?';
      }
    }

    function updateTrialPreview() {
      const f = state.trialForm;
      const nickEl = $('trialNickPreview');
      if (!nickEl) return;
      const nick = computeNickname(f);
      nickEl.textContent = nick || '英文名+首字母+年龄';
      nickEl.className = `mt-0.5 break-all font-mono text-[18px] font-bold ${nick ? 'text-indigo-950' : 'text-indigo-300'}`;

      const statusEl = $('trialNickStatus');
      if (statusEl) statusEl.innerHTML = statusLine(trialNicknameStatus(f));

      const btn = $('btnSubmitTrial');
      if (btn) btn.disabled = !!trialFormError(f);
    }

    function removeEl(id) {
      const el = $(id);
      if (el) el.remove();
    }

    function clearProfileError() {
      state.form.error = '';
      removeEl('profileError');
    }

    function clearTrialError() {
      state.trialForm.error = '';
      removeEl('trialError');
    }

    function clearClaimError() {
      state.claim.error = '';
      removeEl('claimError');
      ['claimNickname', 'claimLast4'].forEach((id) => {
        const el = $(id);
        if (el) { el.classList.remove('border-rose-300'); el.classList.add('border-slate-200'); }
      });
    }

    function clearBindError() {
      state.bind.error = '';
      removeEl('bindError');
      const input = $('bindEmail');
      if (input) { input.classList.remove('border-rose-300'); input.classList.add('border-slate-200'); }
    }

    /* ------------------------------------------------------------------
     * 事件委托
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'back-main') {
        if (state.role === 'parent') return setView('center');
        return setView(state.role === 'admin' ? 'trials' : 'staffList');
      }
      if (action === 'back-center') { state.page = 'center'; state.navTab = 'me'; state.overlay = null; return renderAll(); }
      if (action === 'back-staff') {
        if (state.staffKind === 'trial') {
          state.page = 'trials';
          state.navTab = 'settings';
        } else {
          state.page = 'staffList';
          state.navTab = 'ops';
        }
        state.overlay = null;
        return renderAll();
      }
      if (action === 'switch-profile') {
        state.activeId = el.dataset.id;
        if (state.page !== 'detail') state.page = 'center';
        return renderAll();
      }
      if (action === 'open-profile') {
        state.activeId = el.dataset.id;
        state.page = 'detail';
        state.navTab = 'me';
        return renderAll();
      }
      if (action === 'add-profile') return openCreate(el.dataset.reason || '');
      if (action === 'open-edit') return openEdit();
      if (action === 'open-claim') {
        if (state.online === 'off') return showToast('离线模式下不可认领');
        if (state.profiles.length >= 10) return showToast('名下档案已达上限 (10/10)');
        return openClaimModal();
      }
      if (action === 'claim-query') return claimQuery();
      if (action === 'claim-back') { state.claim.step = 1; state.claim.error = ''; return renderAll(); }
      if (action === 'claim-confirm') return claimConfirm();
      if (action === 'open-guard') {
        if (state.online === 'off') return showToast('离线模式下不可注销档案');
        const p = activeProfile();
        if (!p) return;
        state.overlay = { type: 'guard', targetId: p.id };
        return renderAll();
      }
      if (action === 'guard-delete') return deleteProfile(el.dataset.id);
      if (action === 'contact-monitor') {
        state.overlay = null;
        renderAll();
        return showToast('已向负责班长发送退课协助请求');
      }
      if (action === 'open-trial') return openTrial();
      if (action === 'open-bind') {
        if (state.online === 'off') return showToast('离线模式下不可绑定');
        state.bind = { targetId: el.dataset.id, email: '', error: '' };
        state.overlay = { type: 'bind' };
        renderAll();
        const input = $('bindEmail');
        if (input) input.focus();
        return;
      }
      if (action === 'submit-bind') return submitBind();
      if (action === 'staff-open') {
        state.staffKind = el.dataset.kind;
        state.staffId = el.dataset.id;
        state.page = 'staffDetail';
        return renderAll();
      }
      if (action === 'staff-tab') { state.staffTab = el.dataset.tab; return renderAll(); }
      if (action === 'buy4') {
        return showToast(`已为 ${el.dataset.nick || '该学员'} 打开买 4 节 · 优先排 4 节固定位`);
      }
      if (action === 'set-admin-tab') { state.adminTab = el.dataset.tab; return renderAll(); }
      if (action === 'open-courseware') {
        if (state.online === 'off') return showToast('离线模式下不可调整课件');
        return openCourseware(el.dataset.kind, el.dataset.id);
      }
      if (action === 'cw-add') return cwAdd();
      if (action === 'cw-remove') {
        state.cw.draft.splice(Number(el.dataset.index), 1);
        return renderOverlayOnly();
      }
      if (action === 'cw-save') return cwSave();
      if (action === 'close-overlay') {
        state.overlay = null;
        return renderOverlayOnly();
      }
      if (action === 'toggle-gender') {
        state.form.gender = el.dataset.gender;
        clearProfileError();
        document.querySelectorAll('[data-action="toggle-gender"]').forEach((b) => {
          const on = b.dataset.gender === state.form.gender;
          b.className = `h-9 rounded-lg px-4 text-[14px] font-semibold ${on ? 'bg-white text-slate-900' : 'text-slate-500'}`;
        });
        return;
      }
      if (action === 'toggle-pref') {
        const pref = el.dataset.pref;
        state.form.prefs = state.form.prefs.includes(pref)
          ? state.form.prefs.filter((x) => x !== pref)
          : [...state.form.prefs, pref];
        clearProfileError();
        document.querySelectorAll('[data-action="toggle-pref"]').forEach((b) => {
          const on = state.form.prefs.includes(b.dataset.pref);
          b.className = `h-8 rounded-lg border px-2.5 text-[12px] font-semibold ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-600'}`;
        });
        return;
      }
      if (action === 'toggle-trial-pref') {
        const pref = el.dataset.pref;
        state.trialForm.prefs = state.trialForm.prefs.includes(pref)
          ? state.trialForm.prefs.filter((x) => x !== pref)
          : [...state.trialForm.prefs, pref];
        clearTrialError();
        document.querySelectorAll('[data-action="toggle-trial-pref"]').forEach((b) => {
          const on = state.trialForm.prefs.includes(b.dataset.pref);
          b.className = `h-8 rounded-lg border px-2.5 text-[12px] font-semibold ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-600'}`;
        });
        return;
      }
      if (action === 'submit-profile') return submitProfile();
      if (action === 'submit-trial') return submitTrial();
      if (action === 'copy-nick') return copyNick(el.dataset.nick);
    });

    function renderOverlayOnly() {
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'fInitial' || id === 'fTrialInitial') {
        e.target.value = e.target.value.replace(/[^a-zA-Z]/g, '').slice(0, 1).toUpperCase();
      }
      if (id === 'fSuffix') {
        e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 3);
      }
      if (id === 'fRealName') { state.form.realName = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fEnglish') { state.form.englishName = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fInitial') { state.form.initial = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fAge') { state.form.age = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fSuffix') { state.form.suffix = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fTrialRealName') { state.trialForm.realName = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialEnglish') { state.trialForm.englishName = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialInitial') { state.trialForm.initial = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialAge') { state.trialForm.age = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialContact') { state.trialForm.contact = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'claimNickname') { state.claim.nickname = e.target.value; clearClaimError(); }
      if (id === 'claimLast4') {
        e.target.value = e.target.value.replace(/[^0-9a-zA-Z]/g, '').slice(0, 4);
        state.claim.last4 = e.target.value;
        clearClaimError();
      }
      if (id === 'bindEmail') { state.bind.email = e.target.value; clearBindError(); }
      if (id === 'staffSearch') {
        state.staffQuery = e.target.value;
        const val = e.target.value;
        renderAll();
        const input = $('staffSearch');
        if (input) {
          input.focus();
          input.setSelectionRange(val.length, val.length);
        }
      }
      if (id === 'trialSearch') {
        state.trialQuery = e.target.value;
        const val = e.target.value;
        renderAll();
        const input = $('trialSearch');
        if (input) {
          input.focus();
          input.setSelectionRange(val.length, val.length);
        }
      }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'staffCounselor') {
        state.staffCounselor = e.target.value;
        renderAll();
        return;
      }
      if (id === 'avatarInput') return handleAvatar(e);
      if (id === 'cwPick') {
        state.cw.pickCw = e.target.value;
        const info = COURSEWARE_LIB.find((x) => x.id === state.cw.pickCw);
        state.cw.pickLevel = info && info.levels.length ? info.levels[0] : '';
        return renderOverlayOnly();
      }
      if (id === 'cwLevel') {
        state.cw.pickLevel = e.target.value;
        return;
      }
      if (id.startsWith('cwLevel-')) {
        const index = Number(id.split('-')[1]);
        if (state.cw.draft[index]) state.cw.draft[index].level = e.target.value;
      }
    });

    function navTo(tab) {
      if (state.role === 'parent' && tab === 'me') return setView('center');
      if (state.role === 'monitor' && tab === 'ops') return setView('staffList');
      if (state.role === 'admin' && tab === 'settings') return setView('trials');
      if (state.role === 'admin' && tab === 'ops') return setView('staffList');
      state.page = 'placeholder';
      state.navTab = tab;
      state.overlay = null;
      renderAll();
    }

    /* ------------------------------------------------------------------
     * 业务动作
     * ------------------------------------------------------------------ */
    function openCreate(reason = '') {
      if (state.online === 'off') return showToast('离线模式下无法创建档案');
      if (state.profiles.length >= 10) return showToast('名下档案已达上限 (10/10)');
      state.form = { ...emptyProfileForm(), reason };
      state.overlay = { type: 'profile' };
      renderAll();
      updateProfilePreview();
    }

    function openEdit() {
      if (state.online === 'off') return showToast('离线模式下无法编辑档案');
      const p = activeProfile();
      if (!p) return;
      state.form = {
        mode: 'edit', editingId: p.id,
        realName: p.realName, englishName: p.englishName, initial: p.surnameInitial,
        age: String(p.age), suffix: p.suffix || '', gender: p.gender,
        prefs: [...p.prefs], avatarDataUrl: p.avatarDataUrl || '', error: '', reason: ''
      };
      state.overlay = { type: 'profile' };
      renderAll();
      updateProfilePreview();
    }

    function openTrial() {
      if (state.role !== 'admin') return showToast('仅平台管理员可创建试课档案');
      if (state.online === 'off') return showToast('离线模式下无法创建试课档案');
      state.trialForm = emptyTrialForm();
      state.overlay = { type: 'trial' };
      renderAll();
      updateTrialPreview();
    }

    function submitProfile() {
      const f = state.form;
      const err = profileFormError(f);
      if (err) {
        f.error = err;
        renderOverlayOnly();
        updateProfilePreview();
        return;
      }
      const nick = computeNickname(f);
      if (f.mode === 'edit') {
        const p = state.profiles.find((x) => x.id === f.editingId);
        if (!p) return;
        Object.assign(p, {
          nickname: nick, realName: f.realName.trim(), englishName: f.englishName.trim(),
          surnameInitial: f.initial.trim().toUpperCase(), age: Number(f.age),
          suffix: f.suffix.trim(), gender: f.gender, prefs: [...f.prefs],
          avatarDataUrl: f.avatarDataUrl
        });
        state.overlay = null;
        renderAll();
        return showToast('档案已更新');
      }
      const p = {
        id: `sp_${Math.random().toString(36).slice(2, 11).padEnd(9, '0')}`,
        nickname: nick, realName: f.realName.trim(), englishName: f.englishName.trim(),
        surnameInitial: f.initial.trim().toUpperCase(), age: Number(f.age), suffix: f.suffix.trim(),
        gender: f.gender, tag: `宝贝 ${state.profiles.length + 1}`, prefs: [...f.prefs],
        status: 'ACTIVE', createdAt: TODAY, responsible: 'Leo',
        courseware: [],
        stats: { upcoming: 0, pendingTs: 0, leaveUsed: 0, leaveQuota: 2, completed: 0 },
        pendingRefund: false, audit: [],
        avatarDataUrl: f.avatarDataUrl
      };
      state.profiles.push(p);
      state.activeId = p.id;
      state.page = 'center';
      state.navTab = 'me';
      state.overlay = null;
      renderAll();
      showToast(`已创建 ${p.nickname}，并设为当前宝贝`);
    }

    function submitTrial() {
      if (state.role !== 'admin') return showToast('仅平台管理员可创建试课档案');
      const f = state.trialForm;
      const err = trialFormError(f);
      if (err) {
        f.error = err;
        renderOverlayOnly();
        updateTrialPreview();
        return;
      }
      const t = {
        id: `tr_${Math.random().toString(36).slice(2, 11).padEnd(9, '0')}`,
        nickname: computeNickname(f), realName: f.realName.trim(), englishName: f.englishName.trim(),
        surnameInitial: f.initial.trim().toUpperCase(), age: Number(f.age), gender: 'undisclosed',
        contact: f.contact.trim(), prefs: [...f.prefs], status: 'UNBOUND', createdAt: TODAY,
        lastLessonDate: null, trialLessons: 0, daysLeft: 30, createdBy: operatorName(), responsible: 'Leo',
        courseware: [], audit: []
      };
      state.trials.unshift(t);
      state.adminTab = 'unbound';
      state.page = 'trials';
      state.navTab = 'settings';
      state.overlay = null;
      renderAll();
      showToast(`已创建待认领档案 ${t.nickname}，可前往排课`);
    }

    function enrollTrial(t) {
      const exists = state.enrolled.some((x) => x.nickname.toLowerCase() === t.nickname.toLowerCase());
      if (exists) return false;
      state.enrolled.unshift({
        id: `st_${Math.random().toString(36).slice(2, 11).padEnd(9, '0')}`,
        nickname: t.nickname, realName: t.realName, englishName: t.englishName,
        surnameInitial: t.surnameInitial, age: t.age, gender: t.gender, prefs: clone(t.prefs || []),
        status: 'ACTIVE', createdAt: TODAY, responsible: t.responsible || operatorName(), teacher: '待安排',
        courseware: clone(t.courseware || []),
        stats: { upcoming: 0, pendingTs: 0, leaveUsed: 0, leaveQuota: 2, completed: t.trialLessons || 0, fixed: 0, temp: 0 },
        pendingRefund: false, publicNote: t.publicNote || '', internalNote: t.internalNote || '',
        audit: clone(t.audit || [])
      });
      return true;
    }

    function submitBind() {
      if (state.online === 'off') return showToast('离线模式下不可绑定');
      const email = state.bind.email.trim().toLowerCase();
      const fail = (msg) => {
        state.bind.error = msg;
        renderOverlayOnly();
        const input = $('bindEmail');
        if (input) input.focus();
      };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('请输入有效的家长邮箱');
      if (!REGISTERED_EMAILS.includes(email)) return fail('该邮箱尚未注册，请核对');
      const t = state.trials.find((x) => x.id === state.bind.targetId);
      if (!t || (t.status !== 'UNBOUND' && t.status !== 'TRIALING')) return fail('该档案当前不可绑定');
      t.status = 'ACTIVE';
      t.parentEmail = email;
      t.claimedAt = TODAY;
      enrollTrial(t);
      if (state.role === 'admin' && state.page === 'trials') state.adminTab = 'active';
      state.overlay = null;
      renderAll();
      showToast(`已绑定至 ${email}，档案已转正并纳入全员学生`);
    }

    function claimQuery() {
      if (state.online === 'off') return showToast('离线模式下不可认领');
      if (state.profiles.length >= 10) return showToast('名下档案已达上限 (10/10)');
      const nick = state.claim.nickname.trim();
      const last4 = state.claim.last4.trim();
      const fail = (msg) => {
        state.claim.error = msg;
        renderAll();
      };
      if (!nick) return fail('请输入孩子的规范昵称');
      if (last4.length !== 4) return fail('请输入预留联系方式后四位');
      const t = state.trials.find((x) =>
        (x.status === 'UNBOUND' || x.status === 'TRIALING')
        && x.nickname.toLowerCase() === nick.toLowerCase()
        && x.contact.replace(/\s/g, '').toLowerCase().endsWith(last4.toLowerCase())
      );
      if (!t) return fail('未找到匹配的试课学员，请核对信息');
      state.claim.error = '';
      state.claim.step = 2;
      state.claim.matchedId = t.id;
      renderAll();
    }

    function claimConfirm() {
      if (state.online === 'off') return showToast('离线模式下不可认领');
      if (state.profiles.length >= 10) return showToast('名下档案已达上限 (10/10)');
      const t = state.trials.find((x) => x.id === state.claim.matchedId);
      if (!t) {
        state.claim.step = 1;
        state.claim.error = '未找到匹配的试课宝贝，请重新查询';
        return renderAll();
      }
      const p = {
        id: `sp_${Math.random().toString(36).slice(2, 11).padEnd(9, '0')}`,
        nickname: t.nickname, realName: t.realName, englishName: t.englishName,
        surnameInitial: t.surnameInitial, age: t.age, gender: t.gender, tag: '试课转正',
        suffix: '', prefs: [...t.prefs], status: 'ACTIVE', createdAt: TODAY, responsible: t.responsible || 'Leo',
        courseware: clone(t.courseware || []),
        stats: { upcoming: 0, pendingTs: 0, leaveUsed: 0, leaveQuota: 2, completed: t.trialLessons },
        pendingRefund: false, trialHistory: true,
        audit: [{ at: '2026-11-10 14:32', by: '系统', text: `认领试课档案，历史试听 ${t.trialLessons} 节已并入` }]
      };
      t.status = 'ACTIVE';
      t.parentEmail = 'amy@example.com';
      t.claimedAt = TODAY;
      enrollTrial(t);
      state.profiles.push(p);
      state.activeId = p.id;
      state.page = 'center';
      state.navTab = 'me';
      state.overlay = null;
      state.claim = { step: 1, nickname: '', last4: '', error: '', matchedId: null };
      renderAll();
      showToast(`已认领 ${p.nickname}，历史记录已并入`);
    }

    function deleteProfile(id) {
      const p = state.profiles.find((x) => x.id === id);
      if (!p) return;
      if (p.stats.pendingTs > 0 || p.stats.upcoming > 0 || p.pendingRefund) {
        return showToast('仍有有效课次或退款单，无法注销');
      }
      state.profiles = state.profiles.filter((x) => x.id !== id);
      state.lockedNicknames.push(p.nickname);
      if (state.activeId === id) state.activeId = state.profiles[0] ? state.profiles[0].id : '';
      state.overlay = null;
      state.page = 'center';
      state.navTab = 'me';
      renderAll();
      showToast(`${p.nickname} 已注销，昵称永久保留`);
    }

    function openCourseware(kind, id) {
      const target = findCwTarget(kind, id);
      if (!target) return;
      if (kind === 'trial' && target.status === 'ARCHIVED') return showToast('已归档档案不可调整课件');
      if (state.role === 'monitor' && kind === 'trial' && target.status === 'UNBOUND') return showToast('待认领试课档案由平台管理员维护');
      state.cw = {
        targetKind: kind,
        targetId: id,
        draft: clone(target.courseware || []),
        pickCw: '',
        pickLevel: ''
      };
      state.overlay = { type: 'courseware' };
      renderAll();
    }

    function cwAdd() {
      const cw = state.cw;
      if (state.online === 'off') return showToast('离线模式下不可调整课件');
      if (cw.draft.length >= 6) return showToast('每个学员最多配置 6 门在学课件');
      if (!cw.pickCw || !cw.pickLevel) return showToast('请选择课件与级别');
      if (cw.draft.some((d) => d.cwId === cw.pickCw)) return showToast('该课件已在在学列表中');
      cw.draft.push({ cwId: cw.pickCw, level: cw.pickLevel });
      cw.pickCw = '';
      cw.pickLevel = '';
      renderOverlayOnly();
    }

    function cwSave() {
      if (state.online === 'off') return showToast('离线模式下不可保存课件');
      const cw = state.cw;
      const target = findCwTarget(cw.targetKind, cw.targetId);
      if (!target) return;
      const before = JSON.stringify(target.courseware || []);
      const after = JSON.stringify(cw.draft);
      if (before === after) {
        state.overlay = null;
        renderAll();
        return showToast('在学课件未变更');
      }
      target.courseware = clone(cw.draft);
      target.audit = target.audit || [];
      target.audit.unshift({
        at: '2026-11-10 14:32',
        by: operatorName(),
        text: cw.draft.length ? `在学课件更新为 ${cw.draft.length} 门` : '清空在学课件'
      });
      state.overlay = null;
      renderAll();
      showToast(`在学课件已保存，共 ${cw.draft.length} 门`);
    }

    function handleAvatar(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
        e.target.value = '';
        return showToast('仅支持 JPG / PNG / WebP');
      }
      if (file.size > 2 * 1024 * 1024) {
        e.target.value = '';
        return showToast('图片不能超过 2MB');
      }
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 240;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const min = Math.min(img.width, img.height);
          const sx = (img.width - min) / 2;
          const sy = (img.height - min) / 2;
          ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
          const url = canvas.toDataURL('image/webp', 0.85);
          state.form.avatarDataUrl = url;
          const preview = $('avatarPreview');
          const initial = $('avatarInitial');
          if (preview) {
            preview.src = url;
            preview.classList.remove('hidden');
          }
          if (initial) initial.classList.add('hidden');
          showToast('照片已裁剪为 1:1');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function copyNick(nick) {
      try {
        await navigator.clipboard.writeText(nick);
        showToast('规范昵称已复制');
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = nick;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('规范昵称已复制');
      }
    }

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

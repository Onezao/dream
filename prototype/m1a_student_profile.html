    const $ = (id) => document.getElementById(id);
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function genderLabel(g) {
      if (g === 'male') return '男孩';
      if (g === 'female') return '女孩';
      return '保密';
    }

    function cwById(id) {
      return COURSEWARE_LIB.find((x) => x.id === id) || { id, nameCn: id, nameEn: id, levels: [] };
    }

    function cwCount(p) {
      return (p.courseware || []).length;
    }

    /* 状态标签：全界面只展示中文，严禁直接透出英文枚举码。 */
    const STATUS_LABELS = {
      UNBOUND: '待认领',
      ACTIVE: '正式在读',
      ARCHIVED: '已归档',
      DELETED: '已删除'
    };

    function statusLabel(status, archiveType) {
      if (!status) return '—';
      if (status === 'ARCHIVED') {
        return archiveType === '试课失效归档' ? '已归档·试课失效' : archiveType === '正式暂别归档' ? '已归档·暂别停课' : '已归档';
      }
      return STATUS_LABELS[status] || String(status);
    }

    function activeProfiles() {
      return state.profiles.filter((p) => p.status === 'ACTIVE');
    }

    function archivedFormalProfiles() {
      return state.profiles.filter((p) => p.status === 'ARCHIVED' && p.archiveType === '正式暂别归档');
    }

    function preferredSlotLabel(key) {
      const [dayId, periodId] = String(key || '').split(':');
      const d = SLOT_DAYS.find((x) => x.id === dayId);
      const p = SLOT_PERIODS.find((x) => x.id === periodId);
      return d && p ? `${d.label} ${p.label}` : '';
    }

    function preferredSlotsText(p) {
      const list = (p && p.preferredSlots) || [];
      return list.length ? list.map(preferredSlotLabel).filter(Boolean).join(' · ') : '未填写';
    }

    function flattenText(text) {
      return String(text || '').replace(/\r?\n/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function compactText(text, max = 38) {
      const flat = flattenText(text);
      if (!flat) return '';
      return flat.length > max ? `${flat.slice(0, max).trim()}…` : flat;
    }

    /* 列表卡单行折叠：1 行 / ≤36~40 字符 + [展开 ▾] / [收起 ▴]。 */
    function compactNoteBlock(text, max = 38, empty = '暂无学生备注') {
      const flat = flattenText(text);
      if (!flat) return `<span class="text-slate-500">${esc(empty)}</span>`;
      const short = compactText(flat, max);
      if (short === flat) return `<span class="whitespace-pre-line break-words">${esc(flat)}</span>`;
      return `<details class="group inline-block w-full">
        <summary class="flex cursor-pointer list-none items-center gap-1 [&::-webkit-details-marker]:hidden">
          <span class="min-w-0 flex-1 truncate">${esc(short)}</span>
          <span class="shrink-0 font-bold text-indigo-600"><span class="group-open:hidden">[展开 ▾]</span><span class="hidden group-open:inline">[收起 ▴]</span></span>
        </summary>
        <p class="mt-1 whitespace-pre-line break-words text-slate-700">${esc(String(text || '').trim())}</p>
      </details>`;
    }

    /* 抽屉 / 详情面板：2 行 / ≤64 字符 + [展开全文 ▾] / [收起 ▴]。 */
    function expandableTextBlock(text, empty = '暂无内容') {
      const raw = String(text || '').trim();
      const flat = flattenText(raw);
      if (!flat) return `<span class="text-slate-500">${esc(empty)}</span>`;
      if (raw.length <= 64 && !/[\r\n]/.test(raw)) {
        return `<span class="whitespace-pre-line break-words">${esc(raw)}</span>`;
      }
      const preview = raw.length > 64 ? `${flat.slice(0, 64).trim()}…` : raw;
      return `<details class="group">
        <summary class="cursor-pointer list-none [&::-webkit-details-marker]:hidden">
          <span class="line-clamp-2 whitespace-pre-line break-words">${esc(preview)}</span>
          <span class="mt-1 inline-flex items-center gap-1 text-[12px] font-bold text-indigo-600">
            <span class="group-open:hidden">[展开全文 ▾]</span>
            <span class="hidden group-open:inline">[收起 ▴]</span>
          </span>
        </summary>
        <p class="mt-1 whitespace-pre-line break-words text-slate-800">${esc(raw)}</p>
      </details>`;
    }

    function historyTsOf(p, kind) {
      if (kind === 'trial') return Number(p.historyTs ?? p.trialLessons) || 0;
      return Number(p.historyTs ?? (p.stats && p.stats.completed)) || 0;
    }

    function historyOrdersOf(p, kind) {
      if (kind === 'trial') return Number(p.historyOrders) || 0;
      return Number(p.historyOrders ?? Math.max(0, Math.round((Number(p.stats && p.stats.completed) || 0) / 8))) || 0;
    }

    function trialPendingTs(t) {
      return Math.max(0, Number(t && t.pendingTs) || 0);
    }

    function trialScheduledTs(t) {
      return Math.max(0, Number(t && t.scheduledTs) || 0);
    }

    function trialUncompletedTs(t) {
      if (!t) return 0;
      if (t.pendingTs !== undefined || t.scheduledTs !== undefined) {
        return trialPendingTs(t) + trialScheduledTs(t);
      }
      return Math.max(0, Number(t.uncompletedTs) || 0);
    }

    function trialBucket(t) {
      if (!t) return '';
      if (t.status === 'UNBOUND') return trialUncompletedTs(t) > 0 ? 'trialing' : 'unbound';
      if (t.status === 'ACTIVE') {
        const days = daysSinceToday(t.claimedAt);
        return days !== null && days <= 30 ? 'converted' : '';
      }
      if (t.status === 'ARCHIVED' && t.archiveType === '试课失效归档') return 'archived';
      return '';
    }

    function archiveAssetsOf(p, kind) {
      const pending = kind === 'trial' ? trialPendingTs(p) : pendingTsOf(p);
      const scheduled = kind === 'trial' ? trialScheduledTs(p) : upcomingTsOf(p);
      return [
        { label: '待排期课次', count: pending, hint: '请先办理课次划转或课次清退' },
        { label: '未来及当日未结课已排课次', count: scheduled, hint: '请更换实际上课学员、挪位或请假退回' },
        { label: '在途续费预占 HOLD', count: Number(p.stats && p.stats.hold) || 0, hint: '请先取消待续费预占' },
        { label: '待付款确认购课单', count: Number(p.stats && p.stats.pendingOrders) || 0, hint: '请先取消待付款购课单' },
        { label: '待处理异常回退', count: Number(p.stats && p.stats.exceptionRollback) || 0, hint: '请先完成异常回退处置' }
      ];
    }

    /* 班长动态关联：试课待认领 / 本组在读 / 持有未排课次，去重展示。 */
    function relationsOf(x) {
      if (!x) return [];
      if (x.staffKind === 'trial') return x.status === 'UNBOUND' ? ['试课待认领'] : [];
      const source = (x.relations && x.relations.length) ? x.relations : fallbackRelations(x);
      const out = [];
      source.forEach((r) => {
        if (r.type === 'group' && !out.includes('本组在读')) out.push('本组在读');
        if (r.type === 'holder' && !out.includes('持有未排课次')) out.push('持有未排课次');
      });
      return out;
    }

    function fallbackRelations(x) {
      const out = [];
      if (x.holderMonitor) out.push({ type: 'holder', monitor: x.holderMonitor });
      if (x.teacher && TEACHER_MONITOR_MAP[x.teacher]) out.push({ type: 'group', monitor: TEACHER_MONITOR_MAP[x.teacher] });
      return out;
    }

    function associatedMonitors(x) {
      if (!x) return [];
      if (x.staffKind === 'trial') return [...new Set([x.responsible, x.createdBy].filter(Boolean))];
      const source = (x.relations && x.relations.length) ? x.relations : fallbackRelations(x);
      return [...new Set(source.map((r) => r.monitor).filter(Boolean))];
    }

    /* 1v1 待排课次统一资产池：购买不分固定/临时，排课后才定性。 */
    function pendingTsOf(p) {
      return Math.max(0, Number(p && p.stats && p.stats.pendingTs) || 0);
    }

    function upcomingTsOf(p) {
      return Math.max(0, Number(p && p.stats && p.stats.upcoming) || 0);
    }

    function pendingTiersOf(p) {
      const tiers = (p && p.stats && p.stats.pendingTiers) || [];
      if (tiers.length) return tiers;
      const total = pendingTsOf(p);
      return total > 0 ? [{ price: 16, count: total }] : [];
    }

    function pendingTierText(p) {
      return pendingTiersOf(p).map((t) => `${Number(t.price)}积分×${Number(t.count)}`).join(' · ');
    }

    function scheduledBreakdown(p) {
      const upcoming = upcomingTsOf(p);
      const fixed = Math.min(Math.max(0, Number(p && p.stats && p.stats.fixed) || 0), upcoming);
      return { upcoming, fixed, temp: Math.max(0, upcoming - fixed) };
    }

    function fixedRoundOf(p) {
      return (p && (p.fixedRound || (p.stats && p.stats.fixedRound))) || '';
    }

    /* 老师端仅展示当前登录老师本人的本轮授课进度。 */
    function roundProgressOf(p) {
      const total = Math.max(0, Number(p && p.roundTotal) || 0);
      const taught = Math.min(Math.max(0, Number(p && p.roundTaught) || 0), total);
      if (!total) return { taught: 0, total: 0, label: '暂无本轮排课' };
      return { taught, total, label: `本轮 已上${taught}次/共${total}次` };
    }

    function isZeroAsset(p) {
      return pendingTsOf(p) === 0 && upcomingTsOf(p) === 0;
    }

    function totalRemainingOf(p) {
      return pendingTsOf(p) + upcomingTsOf(p);
    }

    function lastActivityOf(p) {
      return String(
        (p && (p.lastActiveAt || p.updatedAt))
        || (p && p.audit && p.audit[0] && p.audit[0].at)
        || (p && p.createdAt)
        || ''
      );
    }

    function compareNickname(a, b) {
      return String(a.nickname || '').localeCompare(String(b.nickname || ''), 'en', { sensitivity: 'base' });
    }

    function scheduleChild(p) {
      const nick = String(p.nickname || '').toLowerCase();
      if (nick.startsWith('bob')) return { child: 'bob', demo: false };
      if (nick.startsWith('alice')) return { child: 'alice', demo: false };
      return { child: 'alice', demo: true };
    }

    function scheduleUrl(p) {
      const { child } = scheduleChild(p);
      return `m3a_calendar_grid.html?role=parent&child=${child}&week=0&from=ops`;
    }

    function maskContact(c) {
      if (!c) return '—';
      if (/^\d{11}$/.test(c)) return esc(`${c.slice(0, 3)}****${c.slice(-4)}`);
      return esc(c.length > 8 ? `${c.slice(0, 3)}****${c.slice(-4)}` : c);
    }

    function avatar(p, size = 'h-11 w-11', text = 'text-[16px]', tone = 'indigo') {
      if (p.avatarDataUrl) {
        return `<img src="${esc(p.avatarDataUrl)}" alt="" class="${size} shrink-0 rounded-full object-cover ring-1 ring-slate-200">`;
      }
      const initial = (p.englishName || p.nickname || '?').trim().charAt(0).toUpperCase() || '?';
      const t = TONES[tone] || TONES.indigo;
      return `<span class="${size} grid shrink-0 place-items-center rounded-full ${t.icon} ${text} font-bold ring-1 ring-black/5">${esc(initial)}</span>`;
    }

    function statusChip(status, context = 'parent', archiveType = '') {
      if (status === 'ARCHIVED') {
        return `<span class="inline-flex shrink-0 items-center rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${TONES.slate.chip}">${esc(statusLabel(status, archiveType))}</span>`;
      }
      const map = {
        ACTIVE: { tone: 'emerald', label: '正式在读' },
        UNBOUND: { tone: 'amber', label: '待认领' },
        DELETED: { tone: 'slate', label: '已删除' }
      };
      const item = map[status] || map.ACTIVE;
      return `<span class="inline-flex shrink-0 items-center rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${TONES[item.tone].chip}">${item.label}</span>`;
    }

    function leaveRisk(p) {
      const s = p.leaveStats;
      if (!s) return null;
      const leaves = Number(s.leaves30d) || 0;
      const near = Number(s.nearDeadline30d) || 0;
      const lessons = Number(s.lessons30d) || 0;
      /* 分子 = 家长/班长发起的请假与 <3h 临期变动合计；分母 = 近 30 天应履约 1v1 已排课次基数。 */
      const changes = leaves + near;
      const ratio = lessons > 0 ? changes / lessons : 0;
      const alert = lessons > 0 && (ratio > 0.125 || changes >= 3);
      return { leaves, near, lessons, changes, ratio, alert };
    }

    function leaveBadge(p) {
      const risk = leaveRisk(p);
      if (!risk) return '';
      const pct = (risk.ratio * 100).toFixed(1).replace(/\.0$/, '');
      return `<div class="mt-1 flex flex-wrap items-center gap-x-1.5 text-[12px] font-medium ${risk.alert ? 'text-rose-700' : 'text-slate-600'}">
        <span>近 30 天请假 ${risk.leaves} 次</span>
        <span aria-hidden="true">·</span>
        <span>临期变动 ${risk.near} 次</span>
        <span aria-hidden="true">·</span>
        <span>占比 ${pct}%</span>
      </div>`;
    }

    function leaveRiskCard(p) {
      const risk = leaveRisk(p);
      if (!risk || p.staffKind === 'trial' || p.status === 'ARCHIVED') return '';
      const pct = (risk.ratio * 100).toFixed(1).replace(/\.0$/, '');
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        <div class="flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-slate-100 text-slate-600">${icon('activity', 'h-4 w-4')}</span>
            <h2 class="truncate text-[16px] font-bold text-slate-900">近 30 天请假与临期变动</h2>
          </div>
          <span class="shrink-0 text-[12px] font-bold ${risk.alert ? 'text-rose-700' : 'text-slate-600'}">${risk.alert ? '超出提醒阈值' : '正常范围'}</span>
        </div>
        <div class="mt-2.5 grid grid-cols-3 gap-1.5">
          <div class="rounded-xl border border-slate-200/80 bg-white px-2.5 py-2">
            <div class="text-[12px] font-medium text-slate-600">请假次数</div>
            <div class="mt-0.5 text-[16px] font-bold text-slate-900">${risk.leaves} 次</div>
          </div>
          <div class="rounded-xl border border-slate-200/80 bg-white px-2.5 py-2">
            <div class="text-[12px] font-medium text-slate-600">临期(&lt;3h)变动</div>
            <div class="mt-0.5 text-[16px] font-bold text-slate-900">${risk.near} 次</div>
          </div>
          <div class="rounded-xl border border-slate-200/80 bg-white px-2.5 py-2">
            <div class="text-[12px] font-medium text-slate-600">变动占比</div>
            <div class="mt-0.5 text-[16px] font-bold text-slate-900">${pct}%</div>
          </div>
        </div>
        <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-600">分子：请假 + 临期变动合计 ${risk.changes} 次；分母：近 30 天应履约 1v1 已排课次 ${risk.lessons} 节（含已结课与变动离格课次，不含未来排期与小班）。</p>
        <p class="mt-1 text-[12px] font-medium leading-relaxed ${risk.alert ? 'text-rose-700' : 'text-slate-600'}">${risk.lessons === 0 ? '分母为 0：展示 0 次 (0%)，不触发标红。' : `占比 ${pct}%（阈值：占比 > 12.5% 或分子 ≥ 3 次时轻标红）。`}</p>
        ${risk.alert ? `<p class="mt-1 text-[12px] font-medium leading-relaxed text-rose-700">已超出提醒阈值，建议与家长沟通出勤安排，并评估固定位保留。</p>` : ''}
      </section>`;
    }

    function computeNickname(f) {
      const en = (f.englishName || '').trim();
      const ini = (f.initial || '').trim().toUpperCase();
      const age = String(f.age || '').trim();
      const sfx = (f.suffix || '').trim().toLowerCase();
      if (!en || !ini || !age) return '';
      return `${en}${ini}${sfx}${age}`;
    }

    function lockedNicknameOf(f) {
      if (f.editingId) {
        const p = state.profiles.find((x) => x.id === f.editingId);
        if (p) return p.nickname;
      }
      return f.editingNickname || '';
    }

    function allNicknames(excludeId = null) {
      const current = excludeId ? state.profiles.find((p) => p.id === excludeId) : null;
      const currentNick = current ? current.nickname.toLowerCase() : '';
      const names = [
        ...state.profiles.filter((p) => p.id !== excludeId).map((p) => p.nickname),
        ...state.lockedNicknames,
        ...state.trials.map((t) => t.nickname),
        ...EXTERNAL_NICKNAMES
      ];
      return names.filter((n) => n.toLowerCase() !== currentNick);
    }

    function nicknameConflict(nick, excludeId = null) {
      return allNicknames(excludeId).some((n) => n.toLowerCase() === nick.toLowerCase());
    }

    function profileNicknameStatus(f) {
      const en = (f.englishName || '').trim();
      const ini = (f.initial || '').trim();
      if (!en || !ini || !String(f.age || '').trim()) {
        return { ok: false, incomplete: true, message: '填写英文名、首字母与年龄后自动生成' };
      }
      if (!/^[A-Za-z]{1,24}$/.test(en)) return { ok: false, message: '英文名仅支持 1-24 位英文字母' };
      if (!/^[A-Za-z]$/.test(ini)) return { ok: false, message: '姓首字母必须为单个英文字母' };
      if (!Number.isInteger(Number(f.age)) || Number(f.age) < 1 || Number(f.age) > 99) {
        return { ok: false, message: '年龄需为 1-99 的整数' };
      }
      if (f.suffix && !/^[a-z]{1,2}$/.test(f.suffix)) {
        return { ok: false, message: '微调字母仅支持 1-2 位小写英文字母' };
      }
      if (f.editingId) {
        return { ok: true, message: '规范英文名创建后永久锁定，不随编辑变化' };
      }
      const nick = computeNickname(f);
      if (nick.length < 3 || nick.length > 29 || !/^[A-Za-z]{1,24}[A-Z][a-z]{0,2}\d{1,2}$/.test(nick)) {
        return { ok: false, message: '规范英文名格式不合法（英文名 + 姓首字母 + 可选 1-2 位小写字母 + 1-2 位年龄）' };
      }
      if (nicknameConflict(nick, f.editingId)) {
        const suggestion = `${en.slice(0, 24)}${ini.toUpperCase()}b${String(f.age).trim()}`;
        return { ok: false, message: `该昵称已被使用，建议添加微调字母（如 ${suggestion}）` };
      }
      return { ok: true, message: '该昵称全局唯一，可使用' };
    }

    function parseQuickNick(raw) {
      const val = (raw || '').trim();
      if (!val) return { ok: false, incomplete: true, message: '请输入规范英文名（如 MarkL10）' };
      const m = /^([A-Za-z]{1,24})([A-Z])([a-z]{0,2})(\d{1,2})$/.exec(val);
      if (!m || val.length < 3 || val.length > 29) {
        return { ok: false, message: '格式需为：英文名 + 大写姓首字母 + 可选 1-2 位小写字母 + 1~2 位年龄（如 MarkL10 / MarkLa10）' };
      }
      const age = Number(m[4]);
      if (age < 1 || age > 99) return { ok: false, message: '年龄需为 1-99 的整数' };
      if (nicknameConflict(val)) {
        const suggestion = `${m[1].slice(0, 24)}${m[2]}b${m[4]}`;
        return { ok: false, message: `该昵称已被占用，可添加微调字母（如 ${suggestion}）` };
      }
      return { ok: true, nickname: val, englishName: m[1], initial: m[2], age, suffix: m[3] || '', message: '格式合法且全局唯一，自动解析并同步小名' };
    }

    function trialNicknameStatus(f) {
      if (f.mode === 'quick') return parseQuickNick(f.quickNick);
      const en = (f.englishName || '').trim();
      const ini = (f.initial || '').trim();
      if (!en || !ini || !String(f.age || '').trim()) {
        return { ok: false, incomplete: true, message: '填写英文名、首字母与年龄后自动生成' };
      }
      if (!/^[A-Za-z]{1,24}$/.test(en)) return { ok: false, message: '英文名仅支持 1-24 位英文字母' };
      if (!/^[A-Za-z]$/.test(ini)) return { ok: false, message: '姓首字母必须为单个英文字母' };
      if (!Number.isInteger(Number(f.age)) || Number(f.age) < 1 || Number(f.age) > 99) {
        return { ok: false, message: '年龄需为 1-99 的整数' };
      }
      if (f.suffix && !/^[a-z]{1,2}$/.test(f.suffix)) {
        return { ok: false, message: '微调字母仅支持 1-2 位小写英文字母' };
      }
      const nick = computeNickname(f);
      if (nick.length < 3 || nick.length > 29 || !/^[A-Za-z]{1,24}[A-Z][a-z]{0,2}\d{1,2}$/.test(nick)) {
        return { ok: false, message: '规范英文名格式不合法' };
      }
      if (nicknameConflict(nick)) return { ok: false, message: '该昵称已存在，请微调英文名或年龄' };
      return { ok: true, message: '待认领档案将使用该昵称' };
    }

    function profileFormError(f) {
      if (state.online === 'off') return '离线模式下无法创建或编辑档案';
      if (f.mode === 'create' && activeProfiles().length >= 10) return '名下档案已达上限 (10/10)';
      if (!f.realName.trim()) return '请填写学员姓名或小名';
      const nickStatus = profileNicknameStatus(f);

    function trialFormError(f) {

    function emptyProfileForm() {
      return {

    /* ------------------------------------------------------------------
     * 状态

    const state = {
      role: 'parent',
      page: 'center',
      navTab: 'me',
      dataset: 'two',
      device: 'mobile',
      online: 'on',
      embed: false,
      profiles: clone(MOCK_PROFILES.two),
      activeId: MOCK_PROFILES.two[0].id,
      lockedNicknames: [],
      enrolled: clone(MOCK_ENROLLED),
      trials: clone(MOCK_TRIALS),
      staffKind: 'enrolled',

      staffQuery: '',
      staffTab: 'all',
      staffCounselor: 'all',

      staffLetter: 'all',
      staffLetterOpen: false,
      adminTab: 'all',
      trialQuery: '',
      overlay: null,

      trialForm: emptyTrialForm(),

    const params = new URLSearchParams(location.search);
    state.embed = params.get('embed') === '1';
    if (params.get('role') && ['parent', 'monitor', 'teacher', 'admin'].includes(params.get('role'))) {
      state.role = params.get('role');
      if (state.role === 'monitor') { state.page = 'staffList'; state.navTab = 'ops'; }
      else if (state.role === 'teacher') { state.page = 'staffList'; state.navTab = 'students'; }
      else if (state.role === 'admin') { state.page = 'staffList'; state.navTab = 'ops'; }
      else { state.page = 'center'; state.navTab = 'me'; }
    }
    const requestedPage = params.get('page');
    const requestedStudentId = params.get('student_id') || params.get('student');
    if (requestedStudentId) {
      const profileMatch = state.profiles.find((p) => p.id === requestedStudentId);
      if (profileMatch) {
        state.activeId = profileMatch.id;
      }
      const enrolledMatch = state.enrolled.find((x) => x.id === requestedStudentId)

          ? state.enrolled.find((x) => String(x.nickname || '').toLowerCase() === String(profileMatch.nickname || '').toLowerCase())

      if (enrolledMatch) {
        state.staffKind = 'enrolled';

    if (requestedPage) {

      if (requestedPage === 'claim' && allowed.includes('claim')) {

        state.navTab = state.role === 'admin' ? 'settings' : 'me';

        state.page = 'staffDetail';
        state.navTab = state.role === 'teacher' ? 'students' : 'ops';
      } else if (allowed.includes(requestedPage)) {
        state.page = requestedPage;
        if (state.page === 'staffList') state.navTab = state.role === 'teacher' ? 'students' : 'ops';

    }
    if (params.get('tab')) state.navTab = params.get('tab');
    if (params.get('device') === 'tablet') state.device = 'tablet';
    if (state.role !== 'parent') ensureStaffTarget();
    state.explicitStaffTarget = false;

    function activeProfile() {
      return state.profiles.find((p) => p.id === state.activeId) || state.profiles[0] || null;
    }

    /* 列表一【自家孩子】：仅展示正式在读，固定按建档时间正序（大宝 → 十宝）。 */
    function sortedProfiles() {
      return activeProfiles().sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')) || compareNickname(a, b));
    }

    function operatorName() {
      if (state.role === 'admin') return 'Sarah';
      if (state.role === 'monitor') return 'Leo';
      if (state.role === 'teacher') return 'David Miller';
      return 'Amy';
    }

    function currentRoleLabel() {
      return { admin: '管理员', monitor: '班长', teacher: '老师', parent: '家长' }[state.role] || '家长';
    }

    function daysSinceToday(dateStr) {
      if (!dateStr) return null;
      const d1 = new Date(`${dateStr}T00:00:00Z`);
      const d2 = new Date(`${TODAY}T00:00:00Z`);
      if (Number.isNaN(d1.getTime()) || Number.isNaN(d2.getTime())) return null;
      return Math.max(0, Math.round((d2 - d1) / 86400000));
    }

    function relativeDaysLabel(dateStr) {
      const days = daysSinceToday(dateStr);
      if (days === null) return '刚刚';
      if (days === 0) return '今天';
      if (days === 1) return '1天前';
      if (days < 30) return `${days}天前`;
      const months = Math.floor(days / 30);
      return `${months}个月前`;
    }

    function mainTeacherInfo(item) {
      const map = item && item.teacherUpdates ? item.teacherUpdates : {};
      let bestName = null;
      let bestCount = 0;
      Object.entries(map).forEach(([name, count]) => {
        const c = Number(count) || 0;
        if (c > bestCount) {
          bestCount = c;
          bestName = name;
        }
      });
      return bestCount > 0 ? { name: bestName, count: bestCount } : null;
    }

    function isStaleCourseware(item, profile) {
      /* 仅统计老师角色的有效更新；班长/管理员更新不触发「近 6 个月没有更新」。 */
      if (!item || item.lastUpdatedRole !== '老师' || !item.lastUpdatedAt) return false;
      const days = daysSinceToday(item.lastUpdatedAt);
      return days !== null && days > 180;
    }

    function appendAudit(target, entry) {
      target.audit = target.audit || [];
      target.audit.unshift({ at: '2026-11-10 14:32', ...entry });
    }

    function recordFieldChange(target, field, before, after, by = operatorName()) {
      const prev = String(before ?? '');
      const next = String(after ?? '');
      if (prev === next) return false;
      appendAudit(target, { type: 'field', by, field, before: prev || '（空）', after: next || '（空）' });
      return true;
    }

    function recordStatusChange(target, from, to, reason, by = operatorName(), archiveType = '') {
      appendAudit(target, { type: 'status', by, from, to, reason, archiveType });
    }

    function coursewareSnapshot(list) {
      const items = list || [];
      if (!items.length) return '未配置';
      return items.map((d) => `${cwById(d.cwId).nameEn} · ${d.level || '标准'}${d.progressText ? ` (${d.progressText})` : ''}`).join('；');
    }

    function monitorRelated(x, me) {
      if (!x) return false;
      const recent = daysSinceToday(x.lastActiveAt) !== null && daysSinceToday(x.lastActiveAt) <= 90;
      const ordersOrHold = Number(x.stats && x.stats.pendingOrders) > 0 || Number(x.stats && x.stats.hold) > 0;
      const hasLive = upcomingTsOf(x) > 0 || pendingTsOf(x) > 0 || ordersOrHold || recent;
      return associatedMonitors(x).includes(me) && hasLive;
    }

    function visibleEnrolled() {
      if (state.role === 'monitor') {
        const me = operatorName();
        const enrolled = state.enrolled
          .filter((x) => x.status === 'ACTIVE' && monitorRelated(x, me))
          .map((x) => ({ ...x, staffKind: 'enrolled' }));
        const trials = state.trials
          .filter((t) => t.status === 'UNBOUND' && (t.responsible === me || t.createdBy === me))
          .map((t) => ({
            ...t,
            staffKind: 'trial',
            teacher: t.teacher || '试课待排',
            stats: {
              upcoming: trialScheduledTs(t), pendingTs: trialPendingTs(t), completed: t.trialLessons || 0,
              fixed: 0, temp: trialScheduledTs(t), hold: 0, pendingOrders: 0, exceptionRollback: 0, pendingTiers: []
            }
          }));
        return [...trials, ...enrolled];
      }
      if (state.role === 'teacher') {
        return state.enrolled.filter((x) => x.status === 'ACTIVE' && x.teacher === operatorName()).map((x) => ({ ...x, staffKind: 'enrolled' }));
      }
      return state.enrolled.filter((x) => x.status === 'ACTIVE').map((x) => ({ ...x, staffKind: 'enrolled' }));
    }

    function counselorLabel(value) {
      if (!value || value === 'platform') return '平台未划拨';
      if (value === 'Sarah') return '我关联';
      return `班长 ${value}`;
    }

    function counselorFilterLabel(value) {
      if (value === 'all') return '全部关联班长';
      if (value === 'mine') return '我关联';
      if (value === 'platform') return '平台未划拨';
      return `关联班长 ${value}`;
    }

    function counselorOptions() {
      const set = [];
      const all = visibleEnrolled();
      all.forEach((x) => associatedMonitors(x).forEach((key) => { if (!set.includes(key)) set.push(key); }));
      return set.sort((a, b) => {
        const order = { Sarah: 0, platform: 1 };
        return (order[a] ?? 2) - (order[b] ?? 2) || a.localeCompare(b);
      });
    }

    function counselorMatch(item) {
      if (state.role !== 'admin' || state.staffCounselor === 'all') return true;
      const monitors = associatedMonitors(item);
      if (state.staffCounselor === 'mine') return monitors.includes(operatorName());
      if (state.staffCounselor === 'platform') return monitors.length === 0;
      return monitors.includes(state.staffCounselor);
    }

    function staffTabMatch(x) {
      if (state.staffTab === 'all') return true;
      if (state.staffTab === 'trial') return x.staffKind === 'trial';
      if (state.staffTab === 'group') return x.staffKind !== 'trial' && relationsOf(x).includes('本组在读');
      if (state.staffTab === 'holder') return x.staffKind !== 'trial' && relationsOf(x).includes('持有未排课次');
      if (state.staffTab === 'active') return x.staffKind !== 'trial' && x.status === 'ACTIVE';
      return true;
    }

    function staffSearchMatch(x, q) {
      if (!q) return true;
      /* 统一按规范英文名（全局唯一主标识）检索，不再依赖小名模糊检索以免跨组混淆。 */
      const nick = String(x.nickname || '').toLowerCase();
      if (/^[a-z]{1,2}$/.test(q)) return nick.startsWith(q);
      return nick.includes(q);
    }

    function compareStaff(a, b, key) {
      if (key === 'nickname') return compareNickname(a, b);
      const aZero = isZeroAsset(a);
      const bZero = isZeroAsset(b);
      if (aZero !== bZero) return aZero ? 1 : -1;
      if (aZero && bZero) {
        if (key === 'smart') return lastActivityOf(b).localeCompare(lastActivityOf(a)) || compareNickname(a, b);
        return compareNickname(a, b);
      }
      if (key === 'pending') return pendingTsOf(b) - pendingTsOf(a) || compareNickname(a, b);
      if (key === 'remaining') return totalRemainingOf(a) - totalRemainingOf(b) || compareNickname(a, b);
      /* 智能优先：待排 TS 降序 → 剩余已排课次升序 → 零资产按最近活动时间沉底。 */
      const ap = pendingTsOf(a);
      const bp = pendingTsOf(b);
      if ((ap > 0) !== (bp > 0)) return ap > 0 ? -1 : 1;
      if (ap > 0) return bp - ap || compareNickname(a, b);
      return upcomingTsOf(a) - upcomingTsOf(b) || compareNickname(a, b);
    }

    function sortStaffItems(items) {
      const forceNickname = !!state.staffQuery.trim() || state.staffLetter !== 'all';
      const key = forceNickname ? 'nickname' : state.staffSort;
      return [...items].sort((a, b) => compareStaff(a, b, key));
    }

    function staffInitialOf(x) {
      const ch = String(x.nickname || '').trim().charAt(0).toUpperCase();
      return /^[A-Z]$/.test(ch) ? ch : '';
    }

    function staffLetterOptions(items) {
      return [...new Set(items.map(staffInitialOf).filter(Boolean))].sort();
    }

    function filteredStaff() {
      const q = state.staffQuery.trim().toLowerCase();
      const items = visibleEnrolled().filter((x) => {
        const letterOk = state.staffLetter === 'all' || staffInitialOf(x) === state.staffLetter;
        return staffTabMatch(x) && staffSearchMatch(x, q) && counselorMatch(x) && letterOk;
      });
      return sortStaffItems(items);
    }

    function staffTarget() {
      if (state.staffKind === 'trial') {
        const t = state.trials.find((x) => x.id === state.staffId);
        return t ? { ...t, staffKind: 'trial' } : null;
      }
      const p = state.enrolled.find((x) => x.id === state.staffId);
      return p ? { ...p, staffKind: 'enrolled' } : null;
    }

    function ensureStaffTarget() {
      if (state.explicitStaffTarget && lifecycleTarget(state.staffKind, state.staffId)) return;
      const items = visibleEnrolled();
      if (items.some((x) => x.id === state.staffId && state.staffKind === 'enrolled')) return;
      const preferred = items.find((x) => x.status === 'ACTIVE');
      const first = preferred || items[0];
      state.staffId = first ? first.id : '';
      state.staffKind = first ? first.staffKind : 'enrolled';
    }

    function findCwTarget(kind, id) {
      if (kind === 'trial') return state.trials.find((x) => x.id === id);
      if (kind === 'enrolled') return state.enrolled.find((x) => x.id === id);
      return state.profiles.find((x) => x.id === id);
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function viewAllowed(v) {
      if (state.role === 'parent') return ['center', 'detail', 'claim'].includes(v);
      if (state.role === 'monitor') return ['staffList', 'detail'].includes(v);
      if (state.role === 'teacher') return ['staffList', 'detail'].includes(v);
      return ['center', 'detail', 'claim', 'staffList', 'trials'].includes(v);
    }

    function currentViewKey() {
      if (state.overlay && state.overlay.type === 'claim') return 'claim';
      if (state.page === 'placeholder') return '';
      if (state.role === 'parent') {
        if (state.page === 'detail') return 'detail';
        return 'center';
      }
      if (state.role === 'monitor' || state.role === 'teacher') {
        if (state.page === 'staffDetail') return 'detail';
        return 'staffList';
      }
      if (state.page === 'trials') return 'trials';
      if (state.page === 'staffList') return 'staffList';
      if (state.page === 'staffDetail') return 'detail';
      if (state.page === 'detail') return 'detail';
      return 'center';
    }

    function syncConsole() {
      const view = currentViewKey();
      const viewLabels = {
        center: '自家孩子',
        detail: '学员详情',
        claim: '认领试课',
        staffList: state.role === 'admin' ? '全员学员' : state.role === 'teacher' ? '我的学员' : '所辖学员',
        trials: '试课学员管理'
      };
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const value = b.dataset.value;
        let active = false;
        let disabled = false;
        if (group === 'role') active = state.role === value;
        if (group === 'view') {
          active = view === value;
          disabled = !viewAllowed(value);
          b.textContent = viewLabels[value] || b.textContent;
        }
        if (group === 'dataset') { active = state.dataset === value; disabled = !['parent', 'admin'].includes(state.role); }
        if (group === 'device') active = state.device === value;
        if (group === 'online') active = state.online === value;
        b.disabled = disabled;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}${disabled ? ' cursor-not-allowed opacity-40' : ''}`;
      });
    }

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'view') setView(value);
        if (group === 'dataset') setDataset(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：建档、认领与课件调整不可用');
        }
      });
    });

    function setRole(role) {
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.navTab = role === 'parent' ? 'me' : role === 'teacher' ? 'students' : 'ops';
      state.page = role === 'parent' ? 'center' : 'staffList';
      state.overlay = null;
      state.progressEdit = null;
      state.transfer = { sourceId: null, targetId: '', count: 1, note: '' };
      state.staffQuery = '';
      state.staffTab = 'all';
      state.staffCounselor = 'all';
      state.staffSort = 'smart';
      state.staffLetter = 'all';
      state.staffLetterOpen = false;
      state.trialQuery = '';
      state.adminTab = 'all';
      if (role !== 'parent') ensureStaffTarget();
      renderAll();
    }

    function setView(view) {
      state.overlay = null;
      state.progressEdit = null;
      if (view === 'claim') return openClaimModal();
      if (state.role === 'parent') {
        if (view === 'center') { state.page = 'center'; state.navTab = 'me'; }
        if (view === 'detail') {
          if (!activeProfiles().length) {
            showToast('请先添加孩子档案');
            state.page = 'center'; state.navTab = 'me';
          } else {
            state.page = 'detail'; state.navTab = 'me';
          }
        }
      } else if (state.role === 'monitor' || state.role === 'teacher') {
        const defaultTab = state.role === 'teacher' ? 'students' : 'ops';
        if (view === 'staffList') {
          state.page = 'staffList';
          state.navTab = defaultTab;
        }
        if (view === 'detail') {
          ensureStaffTarget();
          state.page = 'staffDetail';
          state.navTab = defaultTab;
        }
      } else {
        if (view === 'center') {
          state.page = 'center';
          state.navTab = 'settings';
        }
        if (view === 'detail') {
          if (!activeProfiles().length) {
            showToast('请先添加孩子档案');
            state.page = 'center'; state.navTab = 'settings';
          } else {
            state.page = 'detail'; state.navTab = 'settings';
          }
        }
        if (view === 'staffList') {
          state.page = 'staffList';
          state.navTab = 'ops';
        }
        if (view === 'trials') {
          state.page = 'trials'; state.navTab = 'settings';
        }
      }
      renderAll();
    }

    function setDataset(dataset) {
      state.dataset = dataset;
      state.profiles = clone(MOCK_PROFILES[dataset]);
      const firstActive = state.profiles.find((p) => p.status === 'ACTIVE');
      state.activeId = firstActive ? firstActive.id : '';
      state.overlay = null;
      if (state.role === 'parent' && state.page === 'detail' && !activeProfiles().length) {
        state.page = 'center';
      }
      if (state.staffKind === 'enrolled') ensureStaffTarget();
      renderAll();
    }

    function resetDemo() {
      state.role = 'parent'; state.page = 'center'; state.navTab = 'me'; state.dataset = 'two';
      state.device = 'mobile'; state.online = 'on';
      state.profiles = clone(MOCK_PROFILES.two);
      state.activeId = MOCK_PROFILES.two[0].id;
      state.lockedNicknames = [];
      state.enrolled = clone(MOCK_ENROLLED);
      state.trials = clone(MOCK_TRIALS);
      state.staffKind = 'enrolled'; state.staffId = MOCK_ENROLLED[0].id;
      state.staffQuery = ''; state.staffTab = 'all'; state.staffCounselor = 'all';
      state.staffSort = 'smart'; state.staffLetter = 'all'; state.staffLetterOpen = false;
      state.adminTab = 'all'; state.trialQuery = '';
      state.overlay = null;
      state.progressEdit = null;
      state.transfer = { sourceId: null, targetId: '', count: 1, note: '' };
      state.form = emptyProfileForm(); state.trialForm = emptyTrialForm();
      state.claim = { step: 1, nickname: '', last4: '', error: '', matchedId: null, failCount: 0, locked: false };
      state.bind = { targetId: null, email: '', error: '', conflict: false };
      state.noteEdit = { kind: 'enrolled', id: null, text: '' };
      renderAll();
      showToast('演示数据已重置');
    }

    $('btnResetDemo').addEventListener('click', resetDemo);

    /* 原型演示导航折叠：收起后仅保留吸顶微条，偏好写入 localStorage。 */
    const CONSOLE_COLLAPSE_KEY = 'dream_proto_nav_collapsed';

    function readConsoleCollapsed() {
      try { return localStorage.getItem(CONSOLE_COLLAPSE_KEY) === '1'; } catch (err) { return false; }
    }

    function writeConsoleCollapsed(value) {
      try { localStorage.setItem(CONSOLE_COLLAPSE_KEY, value ? '1' : '0'); } catch (err) { /* 静默降级 */ }
    }

    let consoleCollapsed = readConsoleCollapsed();

    function applyConsoleState() {
      const headerEl = $('console');
      const miniEl = document.querySelector('[data-console-mini]');
      const embed = !!state.embed;
      if (headerEl) headerEl.classList.toggle('hidden', embed || consoleCollapsed);
      if (miniEl) {
        miniEl.classList.toggle('hidden', embed || !consoleCollapsed);
        miniEl.classList.toggle('flex', !embed && consoleCollapsed);
      }
    }

    const consoleCollapseBtn = document.querySelector('[data-console-collapse]');
    if (consoleCollapseBtn) {
      consoleCollapseBtn.addEventListener('click', () => {
        consoleCollapsed = true;
        writeConsoleCollapsed(true);
        applyConsoleState();
      });
    }
    const consoleExpandBtn = document.querySelector('[data-console-expand]');
    if (consoleExpandBtn) {
      consoleExpandBtn.addEventListener('click', () => {
        consoleCollapsed = false;
        writeConsoleCollapsed(false);
        applyConsoleState();
      });
    }

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      const embed = state.embed;
      const mainEl = document.querySelector('main');
      const bannerEl = $('banner');
      const navEl = $('bottomnav');

      document.body.className = embed
        ? 'h-screen w-screen overflow-hidden bg-white font-sans text-slate-800 antialiased'
        : 'min-h-screen bg-slate-100 font-sans text-slate-800 antialiased';
      if (mainEl) mainEl.className = embed ? 'h-full w-full overflow-hidden' : 'flex justify-center px-0 py-6 lg:px-4';
      applyConsoleState();

      frame.className = embed
        ? 'relative flex h-full w-full flex-col overflow-hidden rounded-none bg-white shadow-none ring-0'
        : `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      bannerEl.classList.toggle('hidden', embed);
      bannerEl.innerHTML = embed ? '' : renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线模式：可查看档案，建档、认领与课件调整不可用`
        : '';

      $('content').innerHTML = renderContent();
      navEl.classList.toggle('hidden', embed);
      navEl.innerHTML = embed ? '' : renderNav();
      $('overlay').innerHTML = renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function bannerTitle() {
      if (state.overlay && state.overlay.type === 'claim') return '认领试课';
      if (state.page === 'placeholder') {
        const item = NAVS[state.role].find((n) => n.id === state.navTab);
        return item ? item.label : '';
      }
      if (state.role === 'parent') {
        if (state.page === 'detail') return '学员详情';
        return state.profiles.length ? '自家孩子' : '学员档案';
      }
      if (state.role === 'monitor') {
        return state.page === 'staffDetail' ? '学员详情' : '教务中心';
      }
      if (state.role === 'teacher') {
        return state.page === 'staffDetail' ? '学员学情档案' : '我的学员';
      }
      if (state.page === 'trials') return '试课学员管理';
      if (state.page === 'staffList') return '教务中心';
      if (state.page === 'staffDetail') return '学员详情';
      if (state.page === 'detail') return '学员详情';
      return '自家孩子';
    }

    function bannerSubtitle() {
      if (state.overlay && state.overlay.type === 'claim') return '';
      if (state.role === 'monitor' && state.page === 'staffList') {
        return '管理在读学员与未注册试听学员';
      }
      if (state.role === 'teacher' && state.page === 'staffList') {
        return 'David Miller · 本轮授课进度与在学课件';
      }
      if (state.role === 'admin' && state.page === 'staffList') {
        return '全校在籍学员 · 按关联班长筛选';
      }
      return '';
    }

    function bannerBack() {
      if (state.overlay) return null;
      if (state.page === 'detail') return 'back-center';
      if (state.page === 'staffDetail') return 'back-staff';
      return null;
    }

    function renderBanner() {
      const b = BANNERS[state.role];
      const subtitle = bannerSubtitle();
      const back = bannerBack();
      return `
        <header class="relative flex h-[64px] shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${b.gradient} px-4 text-white">
          ${b.pattern}
          <div class="relative flex min-w-0 items-center gap-2.5">
            ${back
              ? `<button data-action="${back}" class="inline-flex h-8 shrink-0 items-center gap-1 rounded-lg px-2 -ml-1 text-[13px] font-semibold text-white/90 transition hover:bg-white/10 active:bg-white/15">${icon('chevron-left', 'h-4 w-4')}返回</button>`
              : `<span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${b.initial}</span>`}
            <div class="min-w-0">
              <div class="truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</div>
              ${subtitle ? `<div class="truncate text-[12px] font-medium text-white/70">${esc(subtitle)}</div>` : ''}
            </div>
          </div>
          <button data-action="toast" data-message="暂无新消息" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
            ${icon('bell', 'h-4 w-4')}
            <span class="absolute -right-0.5 -top-0.5 grid h-4 min-w-[16px] place-items-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white/30">3</span>
          </button>
        </header>`;
    }

    function renderNav() {
      const nav = NAVS[state.role];
      return `
        <div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
          <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
            ${nav.map((item) => {
              const on = state.navTab === item.id;
              return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-500'}">
                ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
                <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
              </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.role === 'parent') {
        const body = !state.profiles.length
          ? renderEmpty()
          : (state.page === 'detail' ? renderDetail() : renderCenter());
        return `${renderSwitcher()}${body}`;
      }
      if (state.role === 'admin') {
        if (state.page === 'trials') return renderTrials();
        if (state.page === 'staffList') return renderStaffList();
        if (state.page === 'staffDetail') return renderStaffDetail();
        const body = !state.profiles.length
          ? renderEmpty()
          : (state.page === 'detail' ? renderDetail() : renderCenter());
        return `${renderSwitcher()}${body}`;
      }
      return state.page === 'staffDetail' ? renderStaffDetail() : renderStaffList();
    }

    /* ------------------------------------------------------------------
     * 通用小组件
     * ------------------------------------------------------------------ */
    function pageHeader(title, subtitle, right = '') {
      return `<div class="flex items-end justify-between gap-3 px-1">
        <div class="min-w-0">
          <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(title)}</h1>
          <p class="mt-0.5 text-[12px] font-medium text-slate-500">${esc(subtitle)}</p>
        </div>
        ${right}
      </div>`;
    }

    /* 嵌入式 iframe 模式：M1A 自身 Banner 已隐藏，详情内保留返回入口。 */
    function slotPickerSection(slots, step = '4') {
      return `<section class="rounded-2xl border border-slate-200/80 bg-white p-4 space-y-2.5">
        <div class="flex items-center gap-2">
          <span class="grid h-5 w-5 place-items-center rounded-full bg-indigo-50 text-[11px] font-bold text-indigo-600">${step}</span>
          <h3 class="text-[14px] font-bold text-slate-900">常态作息偏好 <span class="text-[12px] font-normal text-slate-500">选填</span></h3>
        </div>
        <p class="text-[12px] font-medium leading-relaxed text-slate-500">默认留空，不阻断保存；仅供排课高亮参考，对老师端严格隐藏。</p>
        <div class="space-y-1.5">
          ${SLOT_DAYS.map((day) => `<div class="flex items-start gap-2">
            <span class="w-9 shrink-0 pt-1.5 text-[12px] font-semibold text-slate-600">${day.label}</span>
            <div class="flex min-w-0 flex-1 flex-wrap gap-1">
              ${SLOT_PERIODS.map((period) => {
                const key = `${day.id}:${period.id}`;
                const on = (slots || []).includes(key);
                return `<button data-action="toggle-slot" data-day="${day.id}" data-period="${period.id}" class="h-7 shrink-0 rounded-full px-2 text-[11px] transition ${on ? 'bg-indigo-600 font-bold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${period.label}</button>`;
              }).join('')}
            </div>
          </div>`).join('')}
        </div>
      </section>`;
    }

    /* 嵌入式 iframe 模式：M1A 自身 Banner 已隐藏，详情内保留返回入口。 */
    function embedBackRow() {
      if (!state.embed) return '';
      let action = '';
      let label = '';
      if (state.page === 'staffDetail') {
        action = 'back-staff';
        label = state.role === 'teacher' ? '返回我的学员' : state.role === 'monitor' ? '返回所辖学员' : '返回全员学员';
      } else if (state.page === 'detail') {
        action = 'back-center';
        label = '返回自家孩子';
      }
      if (!action) return '';
      return `<div class="flex items-center">
        <button data-action="${action}" class="inline-flex h-9 items-center gap-1 rounded-lg border border-slate-300 bg-white px-3 text-[14px] font-semibold text-slate-800 transition hover:bg-slate-50">
          ${icon('chevron-left', 'h-4 w-4')}${label}
        </button>
      </div>`;
    }

    function assetTile(label, value, sub = '') {
      return `<div class="rounded-xl bg-white px-2.5 py-2">
        <div class="text-[12px] font-medium text-slate-600">${esc(label)}</div>
        <div class="mt-0.5 font-mono text-[18px] font-bold text-slate-900">${esc(value)}</div>
        ${sub ? `<div class="mt-0.5 text-[12px] font-medium text-slate-600">${esc(sub)}</div>` : ''}
      </div>`;
    }

    function renderSwitcher() {
      const count = activeProfiles().length;
      if (!count) {
        return `<div class="sticky top-0 z-20 border-b border-slate-200/70 bg-white/95 px-4 py-2 backdrop-blur">
          <div class="mx-auto flex w-full max-w-[640px] items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-500">暂未绑定学员</span>
            <button data-action="add-profile" ${state.online === 'off' ? 'disabled' : ''} class="h-7 rounded-full border border-indigo-200 bg-white px-2.5 text-[12px] font-bold text-indigo-700 disabled:opacity-40">+ 添加宝贝 (0/10)</button>
          </div>
        </div>`;
      }
      return `<div class="sticky top-0 z-20 border-b border-slate-200/70 bg-white/95 px-4 py-2 backdrop-blur">
        <div class="mx-auto flex w-full max-w-[640px] items-center gap-1.5 overflow-x-auto">
          <span class="shrink-0 text-[12px] font-semibold text-slate-500">当前宝贝</span>
          ${sortedProfiles().map((p) => {
            const on = p.id === state.activeId;
            return `<button data-action="switch-profile" data-id="${p.id}" class="flex shrink-0 items-center gap-1.5 rounded-full border px-2 py-1 ${on ? 'border-indigo-200 bg-white text-indigo-700 ring-1 ring-indigo-200' : 'border-slate-200 bg-white/70 text-slate-600'}">
              ${avatar(p, 'h-6 w-6', 'text-[12px]')}
              <span class="font-mono text-[12px] font-bold">${esc(p.nickname)}</span>
            </button>`;
          }).join('')}
          <button data-action="add-profile" ${count >= 10 || state.online === 'off' ? 'disabled' : ''} class="shrink-0 rounded-full border border-dashed border-slate-300 bg-white/60 px-2.5 py-1 text-[12px] font-bold text-slate-500 disabled:opacity-40">+ 添加 (${count}/10)</button>
          ${state.role === 'parent' ? `<button data-action="open-claim" ${count >= 10 || state.online === 'off' ? 'disabled' : ''} class="shrink-0 rounded-full border border-indigo-200 bg-white px-2.5 py-1 text-[12px] font-bold text-indigo-700 disabled:opacity-40">认领试课</button>` : ''}
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 档案中心
     * ------------------------------------------------------------------ */
    function renderCenter() {
      const count = activeProfiles().length;
      const isFull = count >= 10;
      const blocked = isFull || state.online === 'off';
      const tablet = state.device === 'tablet';

      const addRow = `<button data-action="add-profile" ${blocked ? 'disabled' : ''} class="flex w-full items-center justify-center gap-1.5 ${tablet ? 'rounded-2xl border border-dashed border-slate-300 bg-white/70 py-4' : 'border-t border-dashed border-slate-200 py-3'} text-[14px] font-semibold ${blocked ? 'cursor-not-allowed text-slate-500' : 'text-indigo-700 hover:bg-indigo-50/40'}">
        ${icon('plus', 'h-4 w-4')} ${isFull ? '名下档案已达上限 (10/10)' : `添加新宝贝 (${count}/10)`}
      </button>`;

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('自家孩子', state.role === 'admin' ? `${count} 个孩子 · 仅本人家庭可见` : `${count} 个孩子 · 单账号上限 10 个`, `<button data-action="add-profile" ${blocked ? 'disabled' : ''} class="h-11 shrink-0 rounded-xl bg-indigo-600 px-4 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">+ 添加</button>`)}
        ${isFull ? `<div class="flex items-start gap-2.5 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2.5">
          <span class="mt-0.5 shrink-0 text-amber-700">${icon('alert-triangle', 'h-4 w-4')}</span>
          <div class="text-[12px] font-medium leading-relaxed text-amber-900"><span class="font-bold">名下档案已达上限 (10/10)</span><br>如需新增，请先归档或删除不再使用的档案。</div>
        </div>` : ''}
        ${!count ? `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/60 px-5 py-8 text-center">
          <div class="text-[14px] font-semibold text-slate-700">暂无正式在读孩子</div>
          <div class="mt-1 text-[12px] font-medium text-slate-500">可从下方【已归档宝贝】重新激活，或添加新宝贝。</div>
        </div>` : ''}

        <section class="${tablet ? 'grid grid-cols-2 gap-2' : 'overflow-hidden rounded-2xl border border-slate-300 bg-slate-50/70'}">
          ${sortedProfiles().map((p) => profileItem(p, tablet)).join('')}
          ${tablet ? addRow : ''}
        </section>
        ${!tablet && count ? addRow : ''}

        ${state.role === 'parent' ? claimCard(blocked) : ''}
        ${renderArchivedSection()}
        <p class="px-2 text-center text-[12px] font-medium text-slate-500">规范英文名全平台唯一 · 归档或删除后仍永久保留</p>
      </div>`;
    }

    function profileItem(p, standalone) {
      const active = p.id === state.activeId;
      const cls = standalone
        ? 'rounded-2xl border border-slate-300 bg-slate-50/70 p-3'
        : `border-b border-slate-100 last:border-0 ${active ? 'bg-white' : ''}`;
      return `<div class="${cls}">
        <div data-action="open-profile" data-id="${p.id}" role="button" tabindex="0" class="flex w-full cursor-pointer items-center gap-3 px-3.5 py-3 text-left transition hover:bg-slate-50 active:bg-slate-50">
          ${avatar(p, 'h-11 w-11', 'text-[16px]')}
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="truncate font-mono text-[16px] font-bold text-slate-900">${esc(p.nickname)}</span>
              <span class="shrink-0 rounded-full border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(p.tag || '宝贝')}</span>
              ${statusChip(p.status, 'parent', p.archiveType)}
            </div>
            <div class="mt-0.5 truncate text-[14px] font-medium text-slate-600">${esc(p.realName)} · ${genderLabel(p.gender)} · ${p.age}岁</div>
            <div class="mt-1 flex flex-wrap items-center gap-x-2 text-[12px] font-medium">
              <span class="text-amber-700">待上 ${p.stats.upcoming}</span>
              <span class="text-slate-300">|</span>
              <span class="text-indigo-700">待排: ${pendingTsOf(p)} TS</span>
              ${pendingTsOf(p) ? `<span class="text-slate-300">|</span>
              <span class="font-mono text-slate-500">${pendingTierText(p)}</span>` : ''}
              <span class="text-slate-300">|</span>
              <span class="text-slate-500">在学课件 ${cwCount(p)}/6</span>
            </div>
          </div>
          ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-300')}
        </div>
        <div class="px-3.5 pb-3 text-[12px] font-medium text-slate-500"><span class="font-semibold text-slate-600">学生备注：</span>${compactNoteBlock(p.notes, 38)}</div>
      </div>`;
    }

    /* 家长 Tab 4【已归档宝贝】：仅正式暂别归档，折叠收口，绝不混入试课失效归档。 */
    function renderArchivedSection() {
      const list = archivedFormalProfiles().sort((a, b) => String(b.archivedAt || '').localeCompare(String(a.archivedAt || '')));
      if (!list.length) return '';
      const activeCount = activeProfiles().length;
      const blocked = activeCount >= 10;
      return `<details class="group rounded-2xl border border-slate-300 bg-slate-50/70">
        <summary class="flex cursor-pointer list-none items-center justify-between gap-2 px-4 py-3 [&::-webkit-details-marker]:hidden">
          <span class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-slate-100 text-slate-600">${icon('package', 'h-4 w-4')}</span>
            <span class="truncate text-[16px] font-bold text-slate-900">已归档宝贝 (${list.length})</span>
          </span>
          <span class="shrink-0 text-[12px] font-bold text-slate-500"><span class="group-open:hidden">▾</span><span class="hidden group-open:inline">▴</span></span>
        </summary>
        <div class="space-y-2 px-3 pb-3">
          ${list.map((p) => `<div class="rounded-xl border border-dashed border-slate-400 bg-white px-3 py-2.5">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="truncate font-mono text-[14px] font-bold text-slate-900">${esc(p.nickname)}</span>
              ${statusChip(p.status, 'parent', p.archiveType)}
            </div>
            <div class="mt-0.5 truncate text-[12px] font-medium text-slate-600">${esc(p.realName)} · 归档于 ${esc(p.archivedAt || '—')}</div>
            <div class="mt-1 text-[12px] font-medium text-slate-500">历史已结课 ${historyTsOf(p)} 节 · 历史购课单 ${historyOrdersOf(p)} 张 · 昵称永久锁定</div>
            <div class="mt-2 flex items-center justify-between gap-2">
              <button data-action="toast" data-message="已打开历史账单与课表（只读）" class="text-[12px] font-semibold text-indigo-600 hover:underline">历史记录只读查看</button>
              <button data-action="reactivate-profile" data-id="${p.id}" ${blocked || state.online === 'off' ? 'disabled' : ''} class="h-7 shrink-0 whitespace-nowrap rounded-lg border border-emerald-200 bg-emerald-50 px-2.5 text-[12px] font-bold text-emerald-700 transition hover:bg-emerald-100 disabled:cursor-not-allowed disabled:opacity-40">🔄 重新激活</button>
            </div>
            ${blocked ? `<div class="mt-1 text-[12px] font-medium text-rose-700">名下激活档案已达上限 (10/10)，请先归档或删除其他孩子。</div>` : ''}
          </div>`).join('')}
        </div>
      </details>`;
    }

    function claimCard(blocked) {
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        <div class="flex items-start gap-2.5">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-indigo-100 text-indigo-700">${icon('link-2', 'h-4 w-4')}</span>
          <div class="min-w-0 flex-1">
            <h2 class="text-[16px] font-bold text-slate-900">认领试课宝贝</h2>
            <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">把孩子的试课记录并入当前账号，历史排课、学生备注与购课单完整保留。</p>
          </div>
          <button data-action="open-claim" ${blocked ? 'disabled' : ''} class="h-7 shrink-0 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:cursor-not-allowed disabled:opacity-40">开始认领</button>
        </div>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 冷启动
     * ------------------------------------------------------------------ */
    function renderEmpty() {
      const teachers = [
        { name: 'David Miller', level: '资深老师 · 少儿英语 / KET', initial: 'D' },
        { name: 'Sarah Jenkins', level: '老师 · 生活口语 / 自然拼读', initial: 'S' }
      ];
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('自家孩子', '暂未绑定学员 · 可先浏览老师')}
        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-5">
          <span class="grid h-12 w-12 place-items-center rounded-2xl bg-indigo-100 text-indigo-700">${icon('user-plus', 'h-5 w-5')}</span>
          <h2 class="mt-3 text-[18px] font-bold text-slate-900">还没有孩子档案</h2>
          <p class="mt-1 text-[14px] font-medium text-slate-600">先浏览老师与空课表，选好课再添加孩子档案。</p>
          <button data-action="add-profile" class="mt-4 h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">添加孩子档案</button>
          <button data-action="open-claim" ${state.online === 'off' ? 'disabled' : ''} class="mx-auto mt-2 block text-[12px] font-semibold text-indigo-600 transition hover:text-indigo-700 hover:underline disabled:cursor-not-allowed disabled:opacity-40">已有试课记录？去认领 →</button>
        </section>

        <section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
          <div class="flex items-center justify-between">
            <h2 class="text-[16px] font-bold text-slate-900">推荐老师</h2>
            <span class="text-[12px] font-medium text-slate-500">公开试课</span>
          </div>

    function assetCard(p, options = {}) {
      const t = TONES.emerald;
      const pending = pendingTsOf(p);

      const sched = scheduledBreakdown(p);
      const round = fixedRoundOf(p);

    function coursewareCard(p, mode, kind) {

          ? '已归档档案只读 · 可回看历史课件、级别与 Process Note，不支持调整'

      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        <div class="flex items-center justify-between gap-2">

        </div>
        <p class="mt-0.5 text-[12px] font-medium text-slate-500">${editable ? maintainHint : readonlyHint}</p>
        <div class="mt-2.5 space-y-2">
          ${list.length ? list.map((item, idx) => {
            const cw = cwById(item.cwId);
            const stale = isStaleCourseware(item, p);
            const mainTeacher = mainTeacherInfo(item);
            const lastUpdater = item.lastUpdatedBy
              ? `最后更新：${esc(item.lastUpdatedBy)} (${esc(item.lastUpdatedRole || '教务')}) · ${relativeDaysLabel(item.lastUpdatedAt)}`
              : '暂无进度更新记录';

              <div class="flex items-start gap-2.5">
                <span class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-indigo-50 text-indigo-700">${icon('book-open', 'h-4 w-4')}</span>
                <div class="min-w-0 flex-1">
                  <div class="flex flex-wrap items-center gap-1.5">
                    <span class="truncate text-[14px] font-bold text-slate-900">${esc(cw.nameEn)}</span>
                    <span class="shrink-0 rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(item.level || '标准')}</span>
                    ${stale ? `<span class="shrink-0 rounded-md border border-slate-200 bg-slate-50 px-1.5 py-0.5 text-[11px] font-semibold text-slate-500">近 6 个月没有更新</span>` : ''}
                  </div>
                  <div class="truncate text-[12px] font-medium text-slate-500">${esc(cw.nameCn)}</div>
                </div>
                ${editable
                  ? `<button data-action="open-progress" data-kind="${kind}" data-id="${p.id}" data-index="${idx}" ${state.online === 'off' ? 'disabled' : ''} class="h-7 shrink-0 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:opacity-40">更新进度</button>`
                  : ''}
              </div>
              <div class="mt-2 rounded-lg bg-slate-50/80 px-2.5 py-1.5 text-[12px] font-semibold ${item.progressText ? 'text-slate-800' : 'text-slate-500'}">

              </div>
              <div class="mt-2 flex flex-wrap items-center justify-between gap-x-3 gap-y-1 text-[11px] font-medium text-slate-500">
                ${state.role === 'teacher' ? '' : `<span>${lastUpdater}</span><span>${mainTeacherLabel}</span>`}
              </div>
            </div>`;
          }).join('') : `<div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 px-3 py-4 text-center text-[12px] font-medium text-slate-500">尚未配置在学课件</div>`}
        </div>
        ${state.role === 'teacher' ? `<p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-500">仅当前对该生存在「待上」或 02:00 结课前未结 1v1 课次（含已接单代课）的在职老师可编辑；代课撤销/改派或结课后立即收回，已完成课节请经 M3B【授课历史】对应课节卡片补录。</p>` : ''}
        ${p.classCourseware && mode === 'parent' ? `<div class="mt-3 rounded-xl border border-slate-200 bg-slate-100/70 p-3">
          <div class="flex items-center justify-between gap-2">
            <div class="flex min-w-0 items-center gap-2">
              <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg bg-white text-slate-500">${icon('users', 'h-3.5 w-3.5')}</span>
              <h3 class="truncate text-[14px] font-bold text-slate-800">小班在学课件（仅查看）</h3>
            </div>
            <span class="inline-flex shrink-0 items-center gap-1 rounded-full border border-slate-300 bg-white px-2 py-0.5 text-[12px] font-bold text-slate-500">${icon('lock', 'h-3.5 w-3.5')}只读</span>
          </div>
          <div class="mt-1 text-[12px] font-medium text-slate-500">${esc(p.classCourseware.className)} · 小班课件由小班主理人统一维护，家长端不可编辑或增删</div>
          <div class="mt-2 space-y-2">
            ${(p.classCourseware.items || []).map((item) => `<div class="rounded-lg border border-slate-200/80 bg-white p-2.5">
              <div class="flex items-start gap-2.5">
                <span class="grid h-12 w-12 shrink-0 place-items-center rounded-lg border border-slate-200 bg-slate-50 text-slate-400" title="课件样图">${icon('image', 'h-5 w-5')}</span>

                  <div class="truncate text-[12px] font-medium text-slate-500">${esc(item.nameCn || '')}</div>
                  <div class="mt-1 rounded-lg bg-slate-50/80 px-2.5 py-1.5 text-[12px] font-semibold ${item.progressText ? 'text-slate-800' : 'text-slate-500'}"><span class="font-semibold text-slate-500">进度备注：</span>${expandableTextBlock(item.progressText, '暂未记录')}</div>
                </div>
              </div>
            </div>`).join('')}
          </div>
        </div>` : ''}
      </section>`;
    }

    function infoCard(p, mode) {
      const isTrial = p.staffKind === 'trial';
      const teacherView = state.role === 'teacher';
      const rows = [
        ['规范英文名 <span class="font-normal text-slate-400">全平台唯一主标识</span>', `<span class="font-mono">${esc(p.nickname)}</span>`],

        ['英文名 <span class="font-normal text-slate-400">创建后锁定</span>', esc(p.englishName)],
        ['年龄 <span class="font-normal text-slate-400">编辑不重算</span>', `${p.age} 岁`],
        ['性别', genderLabel(p.gender)],
        ...(teacherView ? [] : [['常态作息偏好 <span class="font-normal text-slate-400">选填</span>', esc(preferredSlotsText(p))]]),
        ...(teacherView ? [] : [['建档时间', esc(p.createdAt)]])

        rows.push(['归档类型', esc(statusLabel('ARCHIVED', p.archiveType))]);

        rows.push(
          ['家长预留联系方式', maskContact(p.contact)],

          ['建档人', esc(p.createdBy || 'Sarah')]

      }
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">

        <div class="mt-2.5 grid grid-cols-2 gap-x-3 gap-y-2.5">

      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        <div class="flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-slate-100 text-slate-600">${icon('notebook-pen', 'h-4 w-4')}</span>

          ${editable
            ? `<button data-action="open-notes" data-kind="${kind}" data-id="${p.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-7 shrink-0 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:opacity-40">编辑备注</button>`
            : `<span class="inline-flex shrink-0 items-center gap-1 rounded-full border border-slate-300 bg-white px-2 py-0.5 text-[12px] font-bold text-slate-500">${icon('lock', 'h-3.5 w-3.5')}只读</span>`}

        ${p.status === 'ARCHIVED' ? `<p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">已归档档案可只读回看历史 Process Note 与全部变动留痕。</p>` : ''}
      </section>`;
    }

    function lessonHistoryCard() {
      const events = [
        { tone: 'amber', tag: '请假', text: '11-15 19:00 请假退回待排期' },
        { tone: 'indigo', tag: '挪位', text: '11-08 18:30 同师挪位至 11-10 19:00（David）' },

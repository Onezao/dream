      ];
      const chip = {
        amber: 'border-amber-200 bg-amber-100 text-amber-800',
        indigo: 'border-indigo-200 bg-indigo-100 text-indigo-700',
        slate: 'border-slate-200 bg-slate-100 text-slate-700'
      };
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        <div class="flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-slate-100 text-slate-600">${icon('history', 'h-4 w-4')}</span>
            <h2 class="truncate text-[16px] font-bold text-slate-900">近期课次与履约记录</h2>
          </div>
          <span class="shrink-0 text-[12px] font-medium text-slate-500">近 30 天</span>
        </div>
        <div class="mt-2.5 space-y-1.5">
          ${events.map((e) => `<div class="flex items-start gap-2 rounded-xl border border-slate-200/80 bg-white px-2.5 py-2">
            <span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${chip[e.tone]}">${e.tag}</span>
            <span class="min-w-0 break-words text-[12px] font-medium leading-relaxed text-slate-700">${e.text}</span>
          </div>`).join('')}
        </div>
      </section>`;
    }

    function logStatusLabel(status, archiveType = '') {
      if (!status) return '—';
      if (status === 'UNBOUND') return '待认领试课';
      if (status === 'ARCHIVED') return statusLabel('ARCHIVED', archiveType);
      return STATUS_LABELS[status] || String(status);
    }

    function logStatusChip(status, archiveType = '') {
      const tone = { UNBOUND: 'amber', ACTIVE: 'emerald', ARCHIVED: 'slate', DELETED: 'slate' }[status] || 'slate';
      return `<span class="inline-flex items-center rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${TONES[tone].chip}">${esc(logStatusLabel(status, archiveType))}</span>`;
    }

    function logEntry(a) {
      const time = `<span class="text-[12px] font-medium text-slate-600">${esc(a.at)} · ${esc(a.by)}</span>`;
      if (a.type === 'status') {
        return `<div class="rounded-xl border border-slate-200/80 bg-white px-3 py-2.5">
          <div class="flex flex-wrap items-center justify-between gap-x-2 gap-y-1">
            <span class="rounded-full bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">状态流转</span>
            ${time}
          </div>
          <div class="mt-1.5 flex flex-wrap items-center gap-1.5">
            ${logStatusChip(a.from, a.archiveType)}
            <span class="text-[12px] font-bold text-slate-500" aria-hidden="true">→</span>
            ${logStatusChip(a.to, a.archiveType)}
          </div>
          <div class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-600"><span class="font-bold">原因：</span>${expandableTextBlock(a.reason || '—', '—')}</div>
        </div>`;
      }
      return `<div class="rounded-xl border border-slate-200/80 bg-white px-3 py-2.5">
        <div class="flex flex-wrap items-center justify-between gap-x-2 gap-y-1">
          <span class="rounded-full bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">字段变动</span>
          ${time}
        </div>
        <div class="mt-1.5 text-[14px] font-bold text-slate-900">${esc(a.field || '档案字段')}</div>
        <div class="mt-1.5 space-y-1">
          <div class="rounded-lg bg-slate-50 px-2 py-1.5 text-[12px] font-medium leading-relaxed text-slate-700">
            <span class="text-[12px] font-bold text-slate-600">变更前</span>
            <div class="mt-0.5">${expandableTextBlock(a.before || '（空）', '（空）')}</div>
          </div>
          <div class="rounded-lg border border-slate-200 bg-white px-2 py-1.5 text-[12px] font-medium leading-relaxed text-slate-900">
            <span class="text-[12px] font-bold text-indigo-700">变更后</span>
            <div class="mt-0.5">${expandableTextBlock(a.after || '（空）', '（空）')}</div>
          </div>
        </div>
      </div>`;
    }

    function logSummary(a) {
      if (a.type === 'status') return `状态流转：${logStatusLabel(a.from, a.archiveType)} → ${logStatusLabel(a.to, a.archiveType)}`;
      const before = compactText(a.before || '（空）', 64);
      const after = compactText(a.after || '（空）', 64);
      return `${a.field || '档案字段'}：${before} → ${after}`;
    }

    function auditCard(p) {
      const logs = p.audit || [];
      const head = logs.slice(0, 5);
      const tail = logs.slice(5);
      return `<details class="group rounded-2xl border border-slate-300 bg-slate-50/70 p-4" ${logs.length ? '' : 'open'}>
        <summary class="flex cursor-pointer list-none items-center justify-between gap-2 [&::-webkit-details-marker]:hidden">
          <span class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-slate-100 text-slate-600">${icon('history', 'h-4 w-4')}</span>
            <span class="truncate text-[16px] font-bold text-slate-900">档案变动日志</span>
            <span class="inline-flex shrink-0 items-center gap-1 rounded-full border border-slate-300 bg-white px-2 py-0.5 text-[12px] font-bold text-slate-500">${icon('lock', 'h-3.5 w-3.5')}只读</span>
          </span>
          <span class="flex shrink-0 items-center gap-1">
            <span class="text-[12px] font-medium text-slate-500">${logs.length} 条</span>
            ${icon('chevron-down', 'h-4 w-4 text-slate-500 transition group-open:rotate-180')}
          </span>
        </summary>
        <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-600">仅管理员与关联班长可查看 · 状态流转与字段变动全量留痕</p>
        <div class="mt-2.5 space-y-2" data-log-list="${esc(p.id)}">
          ${logs.length
            ? `${head.map(logEntry).join('')}${tail.map((a) => `<div data-log-extra="${esc(p.id)}" class="hidden">${logEntry(a)}</div>`).join('')}`
            : `<div class="rounded-xl border border-dashed border-slate-300 bg-white px-3 py-5 text-center">
              <div class="text-[14px] font-semibold text-slate-600">暂无变动记录</div>
              <div class="mt-0.5 text-[12px] font-medium text-slate-500">状态流转与字段修改将自动留痕</div>
            </div>`}
        </div>
        ${tail.length ? `<button data-action="toggle-log" data-log-id="${esc(p.id)}" data-more="${tail.length}" data-open="0" class="mt-2 h-9 w-full rounded-lg border border-slate-300 bg-white text-[12px] font-bold text-slate-700 transition hover:bg-slate-50">展开更多（${tail.length} 条）</button>` : ''}
      </details>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 认领试课
     * ------------------------------------------------------------------ */
    function renderClaimModal() {
      const locked = !!state.claim.locked;
      const blocked = state.online === 'off' || activeProfiles().length >= 10 || locked;
      const t = state.trials.find((x) => x.id === state.claim.matchedId);
      if (state.claim.step === 2 && !t) state.claim.step = 1;
      const blockedMsg = state.online === 'off'
        ? '离线模式下不可认领，请联网后重试'
        : activeProfiles().length >= 10
          ? '名下档案已达上限 (10/10)，请先归档或删除不再使用的档案'
          : locked
            ? '连续匹配失败 5 次，自助认领已锁定 30 分钟；请联系建档班长通过后台通道协助绑定。'
            : '';
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-4 top-1/2 max-h-[88%] -translate-y-1/2 overflow-y-auto rounded-2xl bg-slate-50 p-4 shadow-2xl">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h2 class="text-[18px] font-bold tracking-tight text-slate-900">认领试课</h2>
              <p class="mt-0.5 text-[12px] font-medium text-slate-500">核验规范英文名与预留联系方式后四位 · 连续失败 5 次锁定 30 分钟</p>
            </div>
            <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="mt-3">${stepIndicator()}</div>
          ${blockedMsg ? `<div class="mt-3 rounded-xl border border-amber-300 bg-amber-50/50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-amber-900">${blockedMsg}</div>` : ''}
          <div class="mt-3">${state.claim.step === 1 ? claimStep1(blocked) : claimStep2(t, blocked)}</div>
        </div>
      </div>`;
    }

    function openClaimModal() {
      /* 冷却锁定按账号生效 30 分钟，关闭弹窗不解除。 */
      const locked = !!state.claim.locked;
      state.claim = { step: 1, nickname: '', last4: '', matchedId: null, error: '', failCount: locked ? 5 : 0, locked };
      state.overlay = { type: 'claim' };
      renderAll();
    }

    function stepIndicator() {
      const reached = state.claim.step;
      const dot = (n, label) => `<div class="flex items-center gap-2">
        <span class="grid h-6 w-6 place-items-center rounded-full text-[12px] font-bold ${reached >= n ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}">${n}</span>
        <span class="text-[12px] font-semibold ${reached >= n ? 'text-indigo-700' : 'text-slate-500'}">${label}</span>
      </div>`;
      return `<div class="flex items-center gap-2 px-1">
        ${dot(1, '核验信息')}
        <div class="h-px flex-1 bg-slate-200"></div>
        ${dot(2, '确认认领')}
      </div>`;
    }

    function claimStep1(blocked) {
      return `<section class="space-y-3.5 rounded-2xl border border-slate-200/80 bg-white p-4">
        <div>
          <label for="claimNickname" class="mb-1 block text-[14px] font-semibold text-slate-700">孩子规范英文名</label>
          <input id="claimNickname" value="${esc(state.claim.nickname)}" placeholder="如 LeoW8" maxlength="30" ${blocked ? 'disabled' : ''} class="h-11 w-full rounded-xl border ${state.claim.error ? 'border-rose-300' : 'border-slate-200'} bg-slate-50/70 px-3.5 font-mono text-[16px] font-semibold text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15 disabled:opacity-60">
          <p class="mt-1 text-[12px] font-medium text-slate-500">规范英文名可向建档老师获取</p>
        </div>
        <div>
          <label for="claimLast4" class="mb-1 block text-[14px] font-semibold text-slate-700">建档预留手机 / 微信后四位</label>
          <input id="claimLast4" value="${esc(state.claim.last4)}" inputmode="numeric" maxlength="4" placeholder="8000" ${blocked ? 'disabled' : ''} class="h-11 w-full rounded-xl border ${state.claim.error ? 'border-rose-300' : 'border-slate-200'} bg-slate-50/70 px-3.5 font-mono text-[16px] font-semibold tracking-widest text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15 disabled:opacity-60">
          <p class="mt-1 text-[12px] font-medium text-slate-500">同一家长账号连续匹配失败 5 次将锁定本入口 30 分钟，并引导联系建档班长走后台通道协助绑定。</p>
        </div>
        ${state.claim.error ? `<div id="claimError" class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[12px] font-medium text-rose-700">${esc(state.claim.error)}</div>` : ''}
        ${!blocked && state.claim.failCount > 0 ? `<p class="text-center text-[12px] font-medium text-amber-700">已连续失败 ${state.claim.failCount}/5 次</p>` : ''}
        <button data-action="claim-query" ${blocked ? 'disabled' : ''} class="h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">查询宝贝</button>
        <p class="text-center text-[12px] font-medium text-slate-500">演示：LeoW8 · 后四位 8000（未匹配与不可认领统一模糊提示，不区分具体错因）</p>
      </section>`;
    }

    function claimStep2(t, blocked) {
      return `<section class="rounded-2xl border border-slate-200/80 bg-white p-4">
        <div class="flex items-start gap-3">
          ${avatar(t, 'h-14 w-14', 'text-[18px]', 'indigo')}
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="font-mono text-[18px] font-bold text-slate-900">${esc(t.nickname)}</span>
              ${statusChip(t.status, 'admin')}
            </div>
            <div class="mt-0.5 text-[14px] font-medium text-slate-600">${esc(t.realName)} · ${genderLabel(t.gender)} · ${t.age}岁</div>
            <div class="mt-0.5 text-[12px] font-medium text-slate-600">历史试课 ${t.trialLessons} 节</div>
          </div>
        </div>
        <div class="mt-3 rounded-xl border border-indigo-100 bg-indigo-50/50 p-3 text-[12px] leading-relaxed text-slate-700">
          <div class="font-bold text-indigo-950">认领转正后，以下 5 类数据将无缝归属您的名下：</div>
          <ul class="mt-1.5 space-y-0.5 font-medium text-slate-600">
            <li>① 学员档案本身（转为在读并开放基础信息与头像编辑）</li>
            <li>② 全部 TS 课次资产（待排期 / 已排期 / 已结课 TS 全量归入）</li>
            <li>③ 试课购课单与清退记录（原资金持有人保持不变）</li>
            <li>④ 在学课件进度（1~6 门课件、就读级别与进度备注同步继承）</li>
            <li>⑤ 学生备注（内部档案变动日志仍对家长隐藏）</li>
          </ul>
        </div>
        ${state.claim.error ? `<div id="claimError" class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[12px] font-medium text-rose-700">${esc(state.claim.error)}</div>` : ''}
        <div class="mt-3 flex gap-2">
          <button data-action="claim-back" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 transition hover:bg-slate-50">返回修改</button>
          <button data-action="claim-confirm" ${blocked ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-300">确认认领并绑定</button>
        </div>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 班长 / 管理员 · 学员列表
     * ------------------------------------------------------------------ */
    const STAFF_SORT_OPTIONS = [
      { key: 'smart', label: '智能优先' },
      { key: 'pending', label: '待排最多' },
      { key: 'remaining', label: '余课最少' },
      { key: 'nickname', label: '规范英文名 A-Z' }
    ];

    function renderStaffList() {
      const isAdmin = state.role === 'admin';
      const isMonitor = state.role === 'monitor';
      const isTeacher = state.role === 'teacher';
      const base = visibleEnrolled().filter(counselorMatch);
      const allowedTabs = isMonitor ? ['all', 'trial', 'group', 'holder'] : ['all', 'active'];
      if (!allowedTabs.includes(state.staffTab)) state.staffTab = 'all';
      const counts = {
        all: base.length,
        trial: base.filter((x) => x.staffKind === 'trial').length,
        group: base.filter((x) => x.staffKind !== 'trial' && relationsOf(x).includes('本组在读')).length,
        holder: base.filter((x) => x.staffKind !== 'trial' && relationsOf(x).includes('持有未排课次')).length,
        active: base.filter((x) => x.staffKind !== 'trial' && x.status === 'ACTIVE').length
      };
      const indexBase = visibleEnrolled().filter(counselorMatch).filter(staffTabMatch);
      const showLetterIndex = indexBase.length > 10;
      if (!showLetterIndex && state.staffLetter !== 'all') {
        state.staffLetter = 'all';
        state.staffLetterOpen = false;
      }
      const items = filteredStaff();
      const letters = staffLetterOptions(indexBase);
      const searchActive = !!state.staffQuery.trim();
      const sortOptions = isTeacher
        ? STAFF_SORT_OPTIONS.filter((s) => s.key === 'smart' || s.key === 'nickname')
        : STAFF_SORT_OPTIONS;
      const sortHint = searchActive
        ? '按 A-Z'
        : (state.staffLetter !== 'all' ? `${state.staffLetter} · A-Z` : `${items.length} 位`);
      const tablet = state.device === 'tablet';
      const counselorActive = state.staffCounselor !== 'all';
      const counselorTrigger = isAdmin
        ? `<div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-500">按关联班长</span>
            <button data-action="open-counselor" class="flex shrink-0 items-center gap-1 rounded-full border px-2.5 py-1.5 text-[12px] font-medium transition ${counselorActive ? 'border-indigo-500 bg-indigo-50/50 text-indigo-700' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}">
              <span>${esc(counselorFilterLabel(state.staffCounselor))}</span>
              <span class="text-slate-500" aria-hidden="true">▾</span>
            </button>
          </div>`
        : '';
      const seg = (key, label, count) => `<button data-action="staff-tab" data-tab="${key}" class="h-7 shrink-0 whitespace-nowrap rounded-full border-0 px-2 text-[11px] transition ${state.staffTab === key ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${label}${count ? ` (${count})` : ''}</button>`;
      const listHeader = state.embed ? '' : `<div class="flex items-center justify-between gap-3 px-1">
          <div class="min-w-0">
            <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${isAdmin ? '全员学员' : isTeacher ? '我的学员' : '所辖学员'}</h1>
            <p class="mt-0.5 text-[12px] font-medium text-slate-500">${isAdmin ? '可按关联班长筛选 · 仅 1v1 三条关联' : isTeacher ? '本轮授课进度 · 在学课件与学生备注' : '按试课建档 / 本组授课 / 持有课次三条 1v1 动态关联'}</p>
          </div>
          ${isMonitor
            ? `<button data-action="open-trial" ${state.online === 'off' ? 'disabled' : ''} class="h-10 shrink-0 rounded-xl bg-indigo-600 px-3.5 text-[14px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">+ 新建试课学员</button>`
            : `<span class="shrink-0 rounded-full border border-slate-200 bg-white px-2 py-0.5 text-[12px] font-bold text-slate-600">${isTeacher ? '授课学员' : '教务中心 · 全员学员'}</span>`}
        </div>`;
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${listHeader}
        <div class="space-y-2">
          <div class="flex items-center gap-1 overflow-x-auto py-0.5">
            <span class="shrink-0 pr-0.5 text-[12px] font-medium text-slate-500">排序</span>
            ${sortOptions.map((s) => `<button data-action="staff-sort" data-sort="${s.key}" class="h-7 shrink-0 whitespace-nowrap rounded-full border-0 px-2.5 text-[11px] transition ${state.staffSort === s.key ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${s.label}</button>`).join('')}
            <span class="ml-auto shrink-0 pl-1 text-[12px] font-medium text-slate-500">${sortHint}</span>
          </div>
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
            <input id="staffSearch" value="${esc(state.staffQuery)}" placeholder="${isTeacher ? '搜索规范英文名(如 A / Al)' : '搜索规范英文名(如 A / Al / AliceZ12)'}" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 pl-9 pr-3.5 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">
          </div>
          ${showLetterIndex ? `<div class="space-y-1.5">
            <button data-action="staff-letter-toggle" class="inline-flex h-7 items-center gap-1 rounded-full border border-slate-200 bg-white px-2.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">
              <span aria-hidden="true">🔤</span>
              <span>首字母索引</span>
              ${state.staffLetter !== 'all' ? `<span class="rounded-full bg-indigo-50 px-1.5 text-[11px] font-bold text-indigo-700">${state.staffLetter}</span>` : ''}
              <span class="text-slate-500" aria-hidden="true">${state.staffLetterOpen ? '▴' : '▾'}</span>
            </button>
            ${state.staffLetterOpen ? `<div class="flex flex-wrap gap-1">
              <button data-action="staff-letter" data-letter="all" class="h-7 shrink-0 rounded-lg px-2 text-[12px] font-bold transition ${state.staffLetter === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200/80'}">全部</button>
              ${letters.map((l) => `<button data-action="staff-letter" data-letter="${l}" class="h-7 w-7 shrink-0 rounded-lg text-[12px] font-bold transition ${state.staffLetter === l ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200/80'}">${l}</button>`).join('')}
            </div>` : ''}
          </div>` : ''}
          ${counselorTrigger}
        </div>
        <div class="flex items-center gap-1 overflow-x-auto py-0.5">
          ${seg('all', '全部', counts.all)}
          ${isMonitor ? seg('trial', '试课待认领', counts.trial) : ''}
          ${isMonitor ? seg('group', '本组在读', counts.group) : ''}
          ${isMonitor ? seg('holder', '持有课次', counts.holder) : ''}

    function staffRow(p) {
      const cwItem = p.courseware && p.courseware.length ? p.courseware[0] : null;

      const isTeacher = state.role === 'teacher';
      const relationChips = (isTeacher || isTrial) ? [] : relationsOf(p);
      return `<article class="rounded-2xl border ${archived ? 'border-dashed border-slate-400 bg-slate-50/60 opacity-70' : 'border-slate-300 bg-slate-50/70'} p-3">

          <div><span class="font-semibold text-slate-600">学生备注：</span>${compactNoteBlock(p.notes, 38)}</div>

        <div class="mt-2 flex flex-wrap items-center gap-2 border-t border-slate-100 pt-2">
          ${archived ? `
            <span class="inline-flex h-7 shrink-0 items-center gap-1 rounded-full border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-500">${icon('lock', 'h-3.5 w-3.5')}已归档只读</span>
            <button data-action="staff-open" data-kind="${p.staffKind}" data-id="${p.id}" class="ml-auto whitespace-nowrap text-[12px] font-semibold text-indigo-600 transition hover:text-indigo-700 hover:underline">档案 / 学情 →</button>
          ` : isTeacher ? `
            <button data-action="open-notes" data-kind="${p.staffKind}" data-id="${p.id}" ${state.online === 'off' ? 'disabled' : ''} class="inline-flex h-7 shrink-0 items-center gap-1 whitespace-nowrap rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-700 transition hover:bg-slate-50 disabled:opacity-40">学生备注</button>
            <button data-action="staff-open" data-kind="${p.staffKind}" data-id="${p.id}" class="ml-auto whitespace-nowrap text-[12px] font-semibold text-indigo-600 transition hover:text-indigo-700 hover:underline">档案 / 学情 →</button>
          ` : `
            ${isTrial
              ? `<button data-action="open-bind" data-id="${p.id}" ${state.online === 'off' ? 'disabled' : ''} class="inline-flex h-7 shrink-0 items-center gap-1 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:opacity-40">绑定家长 Email</button>`
              : `<button data-action="buy4" data-nick="${esc(p.nickname)}" class="inline-flex h-7 shrink-0 items-center gap-1 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70">${icon('plus', 'h-3.5 w-3.5 shrink-0')}买4排4</button>`}
            <a href="${scheduleUrl(p)}" target="_blank" rel="noopener" title="${schedule.demo ? '演示数据：该学员课表统一展示 Alice 的周课表' : '查看该学员周课表'}" class="inline-flex items-center gap-0.5 whitespace-nowrap text-[12px] font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">查看课表 →</a>
            <button data-action="staff-open" data-kind="${p.staffKind}" data-id="${p.id}" class="ml-auto whitespace-nowrap text-[12px] font-semibold text-indigo-600 transition hover:text-indigo-700 hover:underline">档案 / 学情 →</button>

    function teacherRoundCard(p) {
      const r = roundProgressOf(p);
      return `<section class="rounded-2xl border border-slate-300 bg-slate-50/70 p-4">
        <div class="flex items-center gap-2">

    /* ------------------------------------------------------------------

    function familySiblings(p) {
      if (!p || !p.familyId) return [];

    function transferEligible(p) {
      if (!['monitor', 'admin'].includes(state.role)) return false;
      if (!p || p.status !== 'ACTIVE' || pendingTsOf(p) <= 0) return false;

      if (state.role === 'admin') return true;
      return p.holderMonitor === operatorName();

      const canDelete = historyTsOf(p, p.staffKind) === 0 && historyOrdersOf(p, p.staffKind) === 0;
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        ${embedBackRow()}
        ${identityCard(p, 'staff')}
        ${isTeacher ? teacherRoundCard(p) : ''}
        ${!isTeacher ? leaveRiskCard(p) : ''}
        ${canBind ? bindCard(p) : ''}
        ${!isTrial && !isTeacher ? assetCard(p, { showTransfer, kind: p.staffKind }) : ''}
        ${coursewareCard(p, 'staff', p.staffKind)}
        ${infoCard(p, 'staff')}
        ${notesCard(p, 'staff', p.staffKind)}
        ${!isTeacher ? lessonHistoryCard() : ''}
        ${isTrial && p.status === 'ACTIVE' ? `<div class="rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2.5 text-[12px] font-medium text-slate-600">已认领并绑定至家长账号${p.claimedAt ? ` · ${esc(p.claimedAt)}` : ''}</div>` : ''}
        ${isTrial && p.status === 'ARCHIVED' ? `<div class="rounded-xl border border-dashed border-slate-400 bg-slate-50/60 px-3 py-2.5 text-[12px] font-medium text-slate-600">${statusChip('ARCHIVED', 'admin', p.archiveType)} 已于 ${esc(p.archivedAt || '—')} 归档 · 昵称永久锁定</div>` : ''}
        ${!isTeacher ? auditCard(p) : ''}
        ${!isTeacher && schedule.demo ? `<div class="flex items-start gap-2 rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2 text-[12px] font-medium text-slate-600">
          <span class="mt-0.5 shrink-0 text-slate-500">${icon('info', 'h-3.5 w-3.5')}</span>
          <span>演示数据：该学员课表展示 Alice 的周课表</span>
        </div>` : ''}
        ${isTeacher
          ? `<p class="text-center text-[12px] font-medium text-slate-500">学生备注与各课件进度均可在上方区块直接更新，本轮仅展示本人授课进度。</p>
             <a href="m3b_attendance_substitution.html" target="_blank" rel="noopener" class="flex h-10 items-center justify-center gap-1.5 rounded-xl border border-slate-300 bg-white text-[13px] font-semibold text-slate-700 transition hover:bg-slate-50">${icon('history', 'h-4 w-4')}已结课代课记录 → M3B【授课历史】补录</a>`
          : p.status === 'ARCHIVED'
            ? `<p class="text-center text-[12px] font-medium text-slate-500">已归档档案只读：不支持约课、购课、代约试课或查看课表。</p>`
            : `<div class="flex gap-2">
              <a href="${scheduleUrl(p)}" target="_blank" rel="noopener" title="${schedule.demo ? '演示数据：该学员课表统一展示 Alice 的周课表' : '查看该学员周课表'}" class="flex h-11 flex-1 items-center justify-center gap-1.5 whitespace-nowrap rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 transition hover:bg-slate-50">${icon('calendar-days', 'h-4 w-4 shrink-0')}查看课表</a>
              ${isTrial
                ? `<button data-action="toast" data-message="已打开 1v1 临时课代约" class="flex h-11 flex-1 items-center justify-center gap-1.5 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">${icon('calendar-plus', 'h-4 w-4')}代约试课</button>`
                : `<button data-action="buy4" data-nick="${esc(p.nickname)}" class="flex h-11 flex-1 items-center justify-center gap-1.5 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">${icon('plus', 'h-4 w-4')}买4排4</button>`}
            </div>`}
        ${canLifecycle ? (p.status === 'ARCHIVED'
          ? (isTrial
            ? `<button data-action="reactivate-trial" data-id="${p.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 w-full rounded-xl border border-emerald-200 bg-emerald-50 text-[14px] font-semibold text-emerald-700 transition hover:bg-emerald-100 disabled:opacity-40">🔄 重新激活（自激活日重算 30 天）</button>`
            : `<button data-action="reactivate-profile" data-id="${p.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 w-full rounded-xl border border-emerald-200 bg-emerald-50 text-[14px] font-semibold text-emerald-700 transition hover:bg-emerald-100 disabled:opacity-40">🔄 重新激活（恢复正式在读）</button>`)
          : `<div class="flex gap-2">
            <button data-action="open-archive" data-kind="${p.staffKind}" data-id="${p.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-1 rounded-xl border border-amber-300 bg-amber-50 text-[14px] font-semibold text-amber-800 transition hover:bg-amber-100 disabled:opacity-40">${isTrial ? '归档试课' : '归档档案'}</button>
            <button data-action="open-delete" data-kind="${p.staffKind}" data-id="${p.id}" ${!canDelete || state.online === 'off' ? 'disabled' : ''} class="h-11 flex-1 rounded-xl border border-rose-200 bg-rose-50 text-[14px] font-semibold text-rose-700 transition hover:bg-rose-100 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-50 disabled:text-slate-400">删除档案</button>
          </div>
          <p class="text-center text-[12px] font-medium ${canDelete ? 'text-slate-500' : 'text-rose-700'}">${canDelete ? '从未产生课次与购课单，可删除（不可恢复）或归档封存' : '已有历史课次或购课单，不支持删除，请使用归档'}</p>`)

    function bindCard(t) {
      const expiring = t.status === 'UNBOUND' && trialUncompletedTs(t) === 0 && Number(t.daysLeft) <= 7;

          <div class="min-w-0">
            <h2 class="text-[16px] font-bold text-slate-900">${trialing ? '试课中 · 可绑定家长' : '待认领试课档案'}</h2>
            <p class="mt-0.5 text-[12px] font-medium text-slate-500">档案暂由平台待归集 · 绑定后历史课表、学生备注与订单完整继承；仅限正常生效家长普通邮箱，禁止教职/管理员邮箱</p>
          </div>
          ${expiring ? `<span class="shrink-0 text-[12px] font-medium text-rose-700">(剩 ${t.daysLeft} 天归档)</span>` : ''}
        </div>
        <div class="mt-3 flex items-center gap-3">
          <button data-action="open-bind" data-id="${t.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-7 shrink-0 whitespace-nowrap rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:cursor-not-allowed disabled:opacity-40">绑定家长 Email</button>
          <button data-action="toast" data-message="已打开 1v1 临时课代约" class="whitespace-nowrap text-[12px] font-semibold text-indigo-600 transition hover:text-indigo-700 hover:underline">代约试课 →</button>
        </div>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 管理员 · 试课档案
     * ------------------------------------------------------------------ */
    const TRIAL_RANK = { unbound: 0, trialing: 1, converted: 2, archived: 3 };

    function compareTrial(a, b) {
      const ba = trialBucket(a);
      const bb = trialBucket(b);
      const ra = TRIAL_RANK[ba] ?? 9;
      const rb = TRIAL_RANK[bb] ?? 9;
      if (ra !== rb) return ra - rb;
      if (ba === 'unbound') {
        const da = Number(a.daysLeft) || 0;
        const db = Number(b.daysLeft) || 0;
        if (da !== db) return da - db;
        return String(b.activatedAt || b.lastLessonDate || b.createdAt || '').localeCompare(String(a.activatedAt || a.lastLessonDate || a.createdAt || '')) || compareNickname(a, b);
      }
      if (ba === 'trialing') {
        return lastActivityOf(b).localeCompare(lastActivityOf(a)) || compareNickname(a, b);
      }
      if (ba === 'converted') return String(b.claimedAt || '').localeCompare(String(a.claimedAt || '')) || compareNickname(a, b);
      return String(b.archivedAt || '').localeCompare(String(a.archivedAt || '')) || compareNickname(a, b);
    }

    function sortTrialItems(list, forceNickname) {
      return [...list].sort((a, b) => (forceNickname ? compareNickname(a, b) : compareTrial(a, b)));
    }

    function renderTrials() {
      const all = state.trials.filter((t) => trialBucket(t));
      const counts = {
        all: all.length,
        unbound: all.filter((t) => trialBucket(t) === 'unbound').length,
        trialing: all.filter((t) => trialBucket(t) === 'trialing').length,
        converted: all.filter((t) => trialBucket(t) === 'converted').length,
        archived: all.filter((t) => trialBucket(t) === 'archived').length
      };
      const q = state.trialQuery.trim().toLowerCase();
      const list = sortTrialItems(all.filter((t) => {
        if (state.adminTab !== 'all' && trialBucket(t) !== state.adminTab) return false;
        if (!q) return true;
        const nick = String(t.nickname || '').toLowerCase();
        const contact = String(t.contact || '').replace(/\s/g, '').toLowerCase();
        if (/^[a-z]{1,2}$/.test(q)) return nick.startsWith(q);
        return nick.includes(q) || contact.includes(q);
      }), !!q);
      const tablet = state.device === 'tablet';
      const seg = (key, label, count) => `<button data-action="set-admin-tab" data-tab="${key}" class="h-6 shrink-0 whitespace-nowrap rounded-full border-0 px-2 text-[11px] transition ${state.adminTab === key ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${label}${count ? ` (${count})` : ''}</button>`;
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        <div class="flex items-center justify-between gap-3 px-1">
          <div class="min-w-0">
            <h1 class="text-[18px] font-bold tracking-tight text-slate-900">试课学员管理</h1>
            <p class="mt-0.5 text-[12px] font-medium text-slate-500">免注册代建 · 未结课 TS 为 0 且满 30 个自然日未认领，每日凌晨跑批自动归档</p>
          </div>
          <button data-action="open-trial" ${state.online === 'off' ? 'disabled' : ''} class="h-11 shrink-0 rounded-xl bg-indigo-600 px-4 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">+ 新建试课</button>
        </div>
        <div class="relative">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
          <input id="trialSearch" value="${esc(state.trialQuery)}" placeholder="搜索规范英文名 / 预留联系方式 (如 LeoW8)" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 pl-9 pr-3.5 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">
        </div>
        <p class="px-1 text-[12px] font-medium text-slate-500">${q ? '搜索中 · 按规范英文名 A-Z' : '默认按防流失优先级排序：待认领 → 试课中 → 已转正 → 已归档'}</p>
        <div class="flex items-start gap-2 rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2 text-[12px] font-medium text-slate-600">
          <span class="mt-0.5 shrink-0 text-slate-500">${icon('info', 'h-3.5 w-3.5')}</span>
          <span>「待认领试课」档案严禁绑入 M1C 小班（仅「正式在读」学员可加入）；建档班长解除职务或 M0A 账号被封禁时，其名下待认领试课档案由管理员强制改绑至在职、账号正常的接手班长。</span>
        </div>
        <div class="flex items-center gap-1 overflow-x-auto py-0.5">
          ${seg('all', '全部', counts.all)}
          ${seg('unbound', '待认领', counts.unbound)}
          ${seg('trialing', '试课中', counts.trialing)}
          ${seg('converted', '已转正', counts.converted)}
          ${seg('archived', '已归档', counts.archived)}
        </div>
        <div class="${tablet ? 'grid grid-cols-2 gap-2' : 'space-y-2'}">
          ${list.length
            ? list.map((t) => trialCard(t)).join('')

              <div class="text-[14px] font-medium text-slate-500">没有匹配的试课学员</div>

        <div class="mt-1 text-[12px] font-medium text-slate-500"><span class="font-semibold text-slate-600">学生备注：</span>${compactNoteBlock(t.notes, 38, `建档于 ${t.createdAt} · ${t.createdBy || 'Sarah'}`)}</div>

      if (state.overlay.type === 'claim') return renderClaimModal();
      if (state.overlay.type === 'courseware') return renderCoursewareSheet();
      if (state.overlay.type === 'progress') return renderProgressSheet();

              <div class="mt-2 space-y-1.5">
                ${target.audit.slice(0, 3).map((a) => `<div class="rounded-lg bg-white px-2 py-1.5">

                  <div class="mt-0.5 break-words text-[12px] font-medium leading-relaxed text-slate-700">${esc(logSummary(a))}</div>

    function renderProgressSheet() {
      const pe = state.progressEdit;

      const target = findCwTarget(pe.kind, pe.id);
      if (!target || !target.courseware || !target.courseware[pe.index]) return '';
      const item = target.courseware[pe.index];
      const info = cwById(item.cwId);
      const text = String(pe.text || '').slice(0, 2000);
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 flex max-h-[88%] flex-col rounded-t-3xl bg-white shadow-2xl">
          <div class="mx-auto mt-2 h-1 w-10 shrink-0 rounded-full bg-slate-300"></div>
          <div class="flex shrink-0 items-center justify-between px-4 py-2.5">
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">更新进度</h2>
              <p class="truncate text-[12px] font-medium text-slate-500">${esc(target.nickname)} · ${esc(info.nameEn)} · ${esc(info.nameCn)}</p>
            </div>
            <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="min-h-0 flex-1 space-y-3 overflow-y-auto px-4 pb-3">
            <div>
              <div class="mb-1 text-[12px] font-semibold text-slate-600">当前就读级别</div>
              ${info.levels.length
                ? `<div class="flex flex-wrap items-center gap-1.5">${info.levels.map((l) => `<button data-action="progress-level" data-level="${esc(l)}" class="h-8 shrink-0 whitespace-nowrap rounded-full px-3 text-[12px] transition ${l === pe.level ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${esc(l)}</button>`).join('')}</div>`
                : `<div class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-[12px] font-medium text-slate-500">该课件无分级，按标准级别维护</div>`}
            </div>
            <div>
              <div class="mb-1 flex items-center justify-between text-[12px] font-medium text-slate-500">

              <p class="mt-1 text-[12px] font-medium text-slate-500">请尽量填写英文，便于老师看懂（如 Reviewed sight words, needs more speaking practice）</p>
              <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">多方协同：提交时校验修改版本，若期间已被他人修改将提示刷新核对后再保存（最后保存生效）。</p>
            </div>
            ${item.lastUpdatedBy ? `<div class="text-[12px] font-medium text-slate-500">最后更新：${esc(item.lastUpdatedBy)} (${esc(item.lastUpdatedRole || '教务')}) · ${relativeDaysLabel(item.lastUpdatedAt)}</div>` : ''}
          </div>
          <div class="flex shrink-0 gap-2 border-t border-slate-200/80 bg-white/95 px-4 py-3">
            <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 transition hover:bg-slate-50">取消</button>
            <button data-action="save-progress" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">保存进度</button>
          </div>
        </div>
      </div>`;
    }

    function renderTransferSheet() {
      const source = state.enrolled.find((x) => x.id === state.transfer.sourceId);
      if (!source) return '';
      const siblings = familySiblings(source);
      const maxCount = Math.max(1, Math.min(3, pendingTsOf(source)));
      const count = Math.max(1, Math.min(maxCount, Number(state.transfer.count) || 1));
      const target = siblings.find((x) => x.id === state.transfer.targetId) || siblings[0];
      const note = String(state.transfer.note || '').slice(0, 200);
      const noteLen = note.trim().length;
      const noteOk = noteLen >= 1 && noteLen <= 200;
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 flex max-h-[88%] flex-col rounded-t-3xl bg-white shadow-2xl">
          <div class="mx-auto mt-2 h-1 w-10 shrink-0 rounded-full bg-slate-300"></div>
          <div class="flex shrink-0 items-center justify-between px-4 py-2.5">
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">↔️ 划转给同家庭孩子</h2>
              <p class="truncate text-[12px] font-medium text-slate-500">${esc(source.nickname)} · 待排 ${pendingTsOf(source)} 节 · 资金持有人 ${esc(source.holderMonitor || '平台')} 不变</p>
            </div>
            <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="min-h-0 flex-1 space-y-3 overflow-y-auto px-4 pb-3">
            <div class="rounded-xl border border-slate-200 bg-slate-50/70 px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-600">仅限同一家长账号下的「正式在读」孩子；按价位先购先扣（FIFO）划转，原购课单、单节积分快照、价位档位与资金持有人保持不变。家长端与老师端不开放此操作。</div>
            <div>
              <div class="mb-1 text-[12px] font-semibold text-slate-600">选择接收孩子</div>
              <div class="space-y-1">
                ${siblings.map((s) => `<button data-action="pick-transfer-target" data-id="${s.id}" class="flex w-full items-center justify-between gap-2 rounded-xl border px-3 py-2 text-left transition ${target && target.id === s.id ? 'border-indigo-500 bg-indigo-50/60 ring-1 ring-indigo-500' : 'border-slate-200 bg-white hover:bg-slate-50'}">
                  <span class="min-w-0">
                    <span class="block truncate font-mono text-[14px] font-bold text-slate-900">${esc(s.nickname)}</span>
                    <span class="block truncate text-[12px] font-medium text-slate-500">${esc(s.realName)} · 待排 ${pendingTsOf(s)} 节</span>
                  </span>
                  <span class="shrink-0 text-[12px] font-semibold text-slate-600">${pendingTsOf(s) ? esc(pendingTierText(s)) : '暂无待排'}</span>
                </button>`).join('')}
              </div>
            </div>
            <div>
              <div class="mb-1 text-[12px] font-semibold text-slate-600">划转节数（本次演示最多 3 节）</div>
              <div class="flex flex-wrap items-center gap-1.5">
                ${Array.from({ length: maxCount }).map((_, i) => {
                  const n = i + 1;
                  return `<button data-action="transfer-count" data-count="${n}" class="h-8 shrink-0 rounded-full px-3 text-[12px] font-bold transition ${n === count ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200/80'}">${n} 节</button>`;
                }).join('')}
              </div>
            </div>
            <div>
              <div class="mb-1 flex items-center justify-between text-[12px] font-medium text-slate-500">
                <span>划转备注（必填，1-200 字）</span>
                <span id="transferNoteCount" class="font-mono font-semibold">${note.length}/200</span>
              </div>
              <textarea id="transferNote" maxlength="200" rows="3" placeholder="如：家长要求把 1 节待排课转给二宝" class="w-full resize-none rounded-xl border ${noteOk || !note ? 'border-slate-200' : 'border-rose-300'} bg-slate-50/70 px-3.5 py-2.5 text-[16px] leading-relaxed text-slate-900 outline-none transition placeholder:text-slate-500 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">${esc(note)}</textarea>
              <p class="mt-1 text-[12px] font-medium ${noteOk ? 'text-slate-500' : 'text-rose-700'}">请填写 1-200 字划转原因；无需上传截图。</p>
            </div>
            <div class="rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-emerald-900">演示：划转 1 节或所选节数后，资金持有人仍为 ${esc(source.holderMonitor || '平台')}，原购课单与积分快照不变；将写入「待排期 → 待排期」同家庭课次划转日志。</div>
          </div>
          <div class="flex shrink-0 gap-2 border-t border-slate-200/80 bg-white/95 px-4 py-3">
            <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 transition hover:bg-slate-50">取消</button>
            <button data-action="confirm-transfer" ${!target || !noteOk || state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认划转 ${count} 节</button>
          </div>
        </div>
      </div>`;
    }

      return `<div class="absolute inset-0 z-[70]">

          <div class="flex shrink-0 items-center justify-between px-4 py-2.5">

              <h3 class="text-[16px] font-bold text-slate-900">选择课件</h3>
              <p class="truncate text-[12px] font-medium text-slate-500">新增课件 · 可搜索课件名称</p>

            <button data-action="close-cw-pick" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="shrink-0 px-4 pb-2">
            <div class="relative">
              <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
              <input id="cwPickSearch" value="${esc(cw.pickQuery || '')}" placeholder="搜索课件名称" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 pl-9 pr-3.5 text-[16px] text-slate-900 outline-none transition placeholder:text-slate-500 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">
            </div>

              <span class="min-w-0">
                <span class="block truncate text-[14px] font-semibold text-slate-900">${esc(x.nameEn)}</span>
                <span class="block truncate text-[12px] font-medium text-slate-500">${esc(x.nameCn)} · ${x.levels.length} 个级别</span>
              </span>
              <span class="shrink-0 text-indigo-600">${cw.pickCw === x.id ? icon('check', 'h-4 w-4') : ''}</span>
            </button>`).join('') : `<div class="rounded-xl border border-dashed border-slate-300 bg-slate-50 px-3 py-8 text-center text-[12px] font-medium text-slate-500">没有匹配的课件</div>`}
          </div>
          <div class="flex shrink-0 gap-2 border-t border-slate-200/80 bg-white/95 px-4 py-3">
            <button data-action="reset-cw-pick" class="h-11 w-full rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 transition hover:bg-slate-50">清除选择</button>
          </div>
        </div>
      </div>`;

    function maskContact(c) {
      if (!c) return '—';
      if (/^\d{11}$/.test(c)) return esc(`${c.slice(0, 3)}****${c.slice(-4)}`);
      return esc(c.length > 8 ? `${c.slice(0, 3)}****${c.slice(-4)}` : c);
    }

    function avatar(p, size = 'h-11 w-11', text = 'text-[16px]', tone = 'indigo') {
      if (p.avatarDataUrl) {
        return `<img src="${esc(p.avatarDataUrl)}" alt="" class="${size} shrink-0 rounded-full object-cover ring-1 ring-slate-200">`;
      }
      const initial = (p.englishName || p.nickname || '?').trim().charAt(0).toUpperCase() || '?';
      const t = TONES[tone] || TONES.indigo;
      return `<span class="${size} grid shrink-0 place-items-center rounded-full ${t.icon} ${text} font-bold ring-1 ring-black/5">${esc(initial)}</span>`;
    }

    function statusChip(status, context = 'parent') {
      const map = {
        ACTIVE: { tone: 'emerald', label: context === 'admin' ? '已认领' : '在读' },
        UNBOUND: { tone: 'amber', label: '待认领' },
        ARCHIVED: { tone: 'slate', label: '已归档' }
      };
      const item = map[status] || map.ACTIVE;
      return `<span class="inline-flex shrink-0 items-center rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${TONES[item.tone].chip}">${item.label}</span>`;
    }

    function computeNickname(f) {
      const en = (f.englishName || '').trim();
      const ini = (f.initial || '').trim().toUpperCase();
      const age = String(f.age || '').trim();
      const sfx = (f.suffix || '').trim().toLowerCase();
      if (!en || !ini || !age) return '';
      return `${en}${ini}${age}${sfx}`;
    }

    function allNicknames(excludeId = null) {
      const current = excludeId ? state.profiles.find((p) => p.id === excludeId) : null;
      const currentNick = current ? current.nickname.toLowerCase() : '';
      const names = [
        ...state.profiles.filter((p) => p.id !== excludeId).map((p) => p.nickname),
        ...state.lockedNicknames,
        ...state.trials.map((t) => t.nickname),
        ...EXTERNAL_NICKNAMES
      ];
      return names.filter((n) => n.toLowerCase() !== currentNick);
    }

    function nicknameConflict(nick, excludeId = null) {
      return allNicknames(excludeId).some((n) => n.toLowerCase() === nick.toLowerCase());
    }

    function profileNicknameStatus(f) {
      const en = (f.englishName || '').trim();
      const ini = (f.initial || '').trim();
      if (!en || !ini || !String(f.age || '').trim()) {
        return { ok: false, incomplete: true, message: '填写英文名、首字母与年龄后自动生成' };
      }
      if (!/^[A-Za-z]{1,24}$/.test(en)) return { ok: false, message: '英文名仅支持 1-24 位英文字母' };
      if (!/^[A-Za-z]$/.test(ini)) return { ok: false, message: '姓首字母必须为单个英文字母' };
      if (!Number.isInteger(Number(f.age)) || Number(f.age) < 1 || Number(f.age) > 99) {
        return { ok: false, message: '年龄需为 1-99 的整数' };
      }
      if (f.suffix && !/^[a-z0-9]{1,3}$/.test(f.suffix)) {
        return { ok: false, message: '微调后缀仅支持 1-3 位小写字母或数字' };
      }
      const nick = computeNickname(f);
      if (nick.length < 3 || nick.length > 30 || !/^[A-Za-z]{1,24}[A-Z]\d{1,2}[a-z0-9]{0,3}$/.test(nick)) {
        return { ok: false, message: '规范昵称格式不合法' };
      }
      if (nicknameConflict(nick, f.editingId)) {
        return { ok: false, message: `该昵称已被使用，建议添加后缀（如 ${nick}b）` };
      }
      return { ok: true, message: '该昵称全局唯一，可使用' };
    }

    function trialNicknameStatus(f) {
      const en = (f.englishName || '').trim();
      const ini = (f.initial || '').trim();
      if (!en || !ini || !String(f.age || '').trim()) {
        return { ok: false, incomplete: true, message: '填写英文名、首字母与年龄后自动生成' };
      }
      if (!/^[A-Za-z]{1,24}$/.test(en)) return { ok: false, message: '英文名仅支持 1-24 位英文字母' };
      if (!/^[A-Za-z]$/.test(ini)) return { ok: false, message: '姓首字母必须为单个英文字母' };
      if (!Number.isInteger(Number(f.age)) || Number(f.age) < 1 || Number(f.age) > 99) {
        return { ok: false, message: '年龄需为 1-99 的整数' };
      }
      const nick = computeNickname(f);
      if (!/^[A-Za-z]{1,24}[A-Z]\d{1,2}$/.test(nick)) return { ok: false, message: '规范昵称格式不合法' };
      if (nicknameConflict(nick)) return { ok: false, message: '该昵称已存在，请微调英文名或年龄' };
      return { ok: true, message: '待认领档案将使用该昵称' };
    }

    function profileFormError(f) {
      if (state.online === 'off') return '离线模式下无法创建或编辑档案';
      if (f.mode === 'create' && state.profiles.length >= 10) return '名下档案已达上限 (10/10)';
      if (!f.realName.trim()) return '请填写宝贝真实姓名';
      const nickStatus = profileNicknameStatus(f);
      if (!nickStatus.ok) return nickStatus.message;
      return null;
    }

    function trialFormError(f) {
      if (state.online === 'off') return '离线模式下无法创建试课档案';
      if (!f.realName.trim()) return '请填写学员真实姓名';
      const nickStatus = trialNicknameStatus(f);
      if (!nickStatus.ok) return nickStatus.message;
      if (!f.contact.trim() || f.contact.trim().length < 4) return '请填写家长预留联系方式';
      return null;
    }

    function emptyProfileForm() {
      return {
        mode: 'create', editingId: null, realName: '', englishName: '', initial: '',
        age: '', suffix: '', gender: 'female', prefs: [], avatarDataUrl: '',
        error: '', reason: ''
      };
    }

    function emptyTrialForm() {
      return { realName: '', englishName: '', initial: '', age: '', contact: '', prefs: [], error: '' };
    }

    /* ------------------------------------------------------------------
     * 状态
     * ------------------------------------------------------------------ */
    const state = {
      role: 'parent',
      page: 'center',
      navTab: 'me',
      dataset: 'two',
      device: 'mobile',
      online: 'on',
      profiles: clone(MOCK_PROFILES.two),
      activeId: MOCK_PROFILES.two[0].id,
      lockedNicknames: [],
      trials: clone(MOCK_TRIALS),
      staffKind: 'profile',
      staffId: MOCK_PROFILES.two[0].id,
      staffQuery: '',
      staffTab: 'all',
      adminTab: 'unbound',
      overlay: null,
      form: emptyProfileForm(),
      trialForm: emptyTrialForm(),
      claim: { step: 1, nickname: '', last4: '', error: '', matchedId: null },
      bind: { targetId: null, email: '', error: '' },
      cw: { targetKind: 'profile', targetId: null, draft: [], pickCw: '', pickLevel: '' }
    };

    function activeProfile() {
      return state.profiles.find((p) => p.id === state.activeId) || state.profiles[0] || null;
    }

    function operatorName() {
      if (state.role === 'admin') return 'Sarah';
      if (state.role === 'monitor') return 'Leo';
      return 'Amy';
    }

    function staffItems() {
      const activeNicks = new Set(state.profiles.map((p) => p.nickname.toLowerCase()));
      const list = [
        ...state.profiles.map((p) => ({ ...p, staffKind: 'profile' })),
        ...state.trials
          .filter((t) => !(t.status === 'ACTIVE' && activeNicks.has(t.nickname.toLowerCase())))
          .map((t) => ({ ...t, staffKind: 'trial' }))
      ];
      const order = { UNBOUND: 0, ACTIVE: 1, ARCHIVED: 2 };
      return list.sort((a, b) => (order[a.status] ?? 3) - (order[b.status] ?? 3) || a.nickname.localeCompare(b.nickname));
    }

    function filteredStaff() {
      const q = state.staffQuery.trim().toLowerCase();
      const map = { all: '', unbound: 'UNBOUND', active: 'ACTIVE', archived: 'ARCHIVED' };
      return staffItems().filter((x) => {
        const tabOk = state.staffTab === 'all' || x.status === map[state.staffTab];
        const qOk = !q || x.nickname.toLowerCase().includes(q) || x.realName.toLowerCase().includes(q);
        return tabOk && qOk;
      });
    }

    function staffTarget() {
      if (state.staffKind === 'trial') {
        const t = state.trials.find((x) => x.id === state.staffId);
        return t ? { ...t, staffKind: 'trial' } : null;
      }
      const p = state.profiles.find((x) => x.id === state.staffId);
      return p ? { ...p, staffKind: 'profile' } : null;
    }

    function ensureStaffTarget() {
      const items = staffItems();
      if (items.some((x) => x.id === state.staffId && x.staffKind === state.staffKind)) return;
      const preferred = state.role === 'admin'
        ? items.find((x) => x.status === 'UNBOUND')
        : items.find((x) => x.status === 'ACTIVE');
      const first = preferred || items[0];
      state.staffId = first ? first.id : '';
      state.staffKind = first ? first.staffKind : 'profile';
    }

    function findCwTarget(kind, id) {
      return kind === 'trial'
        ? state.trials.find((x) => x.id === id)
        : state.profiles.find((x) => x.id === id);
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function viewAllowed(v) {
      if (state.role === 'parent') return ['center', 'detail', 'claim'].includes(v);
      if (state.role === 'monitor') return ['staffList', 'detail'].includes(v);
      return ['trials', 'staffList', 'detail'].includes(v);
    }

    function currentViewKey() {
      if (state.page === 'placeholder') return '';
      if (state.role === 'parent') {
        if (state.page === 'claim') return 'claim';
        if (state.page === 'detail') return 'detail';
        if (state.page === 'center') return 'center';
      }
      if (state.role === 'admin' && state.page === 'trials') return 'trials';
      if (state.page === 'staffDetail') return 'detail';
      if (state.page === 'staffList') return 'staffList';
      return '';
    }

    function syncConsole() {
      const view = currentViewKey();
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const value = b.dataset.value;
        let active = false;
        let disabled = false;
        if (group === 'role') active = state.role === value;
        if (group === 'view') { active = view === value; disabled = !viewAllowed(value); }
        if (group === 'dataset') { active = state.dataset === value; disabled = state.role !== 'parent'; }
        if (group === 'device') active = state.device === value;
        if (group === 'online') active = state.online === value;
        b.disabled = disabled;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}${disabled ? ' cursor-not-allowed opacity-40' : ''}`;
      });
    }

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'view') setView(value);
        if (group === 'dataset') setDataset(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：建档、认领与课件调整不可用');
        }
      });
    });

    function setRole(role) {
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.navTab = role === 'parent' ? 'me' : role === 'monitor' ? 'ops' : 'settings';
      state.page = role === 'parent' ? 'center' : role === 'monitor' ? 'staffList' : 'trials';
      state.overlay = null;
      state.staffQuery = '';
      state.staffTab = 'all';
      if (role !== 'parent') ensureStaffTarget();
      renderAll();
    }

    function setView(view) {
      if (state.role === 'parent') {
        if (view === 'center') { state.page = 'center'; state.navTab = 'me'; }
        if (view === 'detail') {
          if (!state.profiles.length) {
            showToast('请先添加宝贝档案');
            state.page = 'center'; state.navTab = 'me';
          } else {
            state.page = 'detail'; state.navTab = 'me';
          }
        }
        if (view === 'claim') {
          state.claim = { step: 1, nickname: '', last4: '', error: '', matchedId: null };
          state.page = 'claim'; state.navTab = 'me';
        }
      } else {
        if (view === 'staffList') {
          state.page = 'staffList';
          state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        }
        if (view === 'detail') {
          ensureStaffTarget();
          state.page = 'staffDetail';
          state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        }
        if (view === 'trials' && state.role === 'admin') {
          state.page = 'trials'; state.navTab = 'settings';
        }
      }
      state.overlay = null;
      renderAll();
    }

    function setDataset(dataset) {
      state.dataset = dataset;
      state.profiles = clone(MOCK_PROFILES[dataset]);
      state.activeId = state.profiles[0] ? state.profiles[0].id : '';
      state.staffQuery = '';
      state.staffTab = 'all';
      state.overlay = null;
      if (state.role === 'parent') {
        if (state.page === 'detail' && !state.profiles.length) state.page = 'center';
      } else {
        state.staffId = '';
        state.staffKind = 'profile';
        ensureStaffTarget();
      }
      renderAll();
    }

    function resetDemo() {
      state.role = 'parent'; state.page = 'center'; state.navTab = 'me'; state.dataset = 'two';
      state.device = 'mobile'; state.online = 'on';
      state.profiles = clone(MOCK_PROFILES.two);
      state.activeId = MOCK_PROFILES.two[0].id;
      state.lockedNicknames = [];
      state.trials = clone(MOCK_TRIALS);
      state.staffKind = 'profile'; state.staffId = MOCK_PROFILES.two[0].id;
      state.staffQuery = ''; state.staffTab = 'all'; state.adminTab = 'unbound';
      state.overlay = null;
      state.form = emptyProfileForm(); state.trialForm = emptyTrialForm();
      state.claim = { step: 1, nickname: '', last4: '', error: '', matchedId: null };
      state.bind = { targetId: null, email: '', error: '' };
      renderAll();
      showToast('演示数据已重置');
    }

    $('btnResetDemo').addEventListener('click', resetDemo);

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线模式：可查看档案，建档、认领与课件调整不可用`
        : '';

      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = renderNav();
      $('overlay').innerHTML = renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();
    }

    function renderBanner() {
      const b = BANNERS[state.role];
      return `
        <header class="relative flex h-[68px] shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${b.gradient} px-4 text-white">
          ${b.pattern}
          <div class="relative flex min-w-0 items-center gap-2.5">
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${b.initial}</span>
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="truncate text-[16px] font-bold">${esc(b.brand)}</span>
                <span class="shrink-0 rounded-full bg-white/20 px-2 py-0.5 text-[12px] font-bold">${esc(b.role)}</span>
              </div>
              <div class="truncate text-[12px] text-white/70">${esc(b.subtitle)}</div>
            </div>
          </div>
          <button data-action="toast" data-message="暂无新消息" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知">
            ${icon('bell', 'h-4 w-4')}
            <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-rose-400 ring-1 ring-white/50"></span>
          </button>
        </header>`;
    }

    function renderNav() {
      const nav = NAVS[state.role];
      return `
        <div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
          <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
            ${nav.map((item) => {
              const on = state.navTab === item.id;
              return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-400'}">
                ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
                <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
              </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.role === 'parent') {
        const body = state.page === 'claim'
          ? renderClaim()
          : (!state.profiles.length
            ? renderEmpty()
            : (state.page === 'detail' ? renderDetail() : renderCenter()));
        return `${state.page === 'claim' ? '' : renderSwitcher()}${body}`;
      }
      if (state.role === 'admin' && state.page === 'trials') return renderTrials();
      if (state.page === 'staffDetail') return renderStaffDetail();
      return renderStaffList();
    }

    /* ------------------------------------------------------------------
     * 通用小组件
     * ------------------------------------------------------------------ */
    function pageHeader(title, subtitle, right = '') {
      return `<div class="flex items-end justify-between gap-3 px-1">
        <div class="min-w-0">
          <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(title)}</h1>
          <p class="mt-0.5 text-[12px] font-medium text-slate-400">${esc(subtitle)}</p>
        </div>
        ${right}
      </div>`;
    }

    function backRow(action, label) {
      return `<button data-action="${action}" class="flex items-center gap-1 text-[14px] font-semibold text-slate-500 transition hover:text-slate-800">
        ${icon('chevron-left', 'h-4 w-4')}${esc(label)}
      </button>`;
    }

    function miniStat(label, value, tone) {
      const t = TONES[tone];
      return `<div class="rounded-xl border px-2.5 py-2 ${t.card}">
        <div class="text-[12px] font-medium ${t.sub}">${esc(label)}</div>
        <div class="mt-0.5 font-mono text-[18px] font-bold ${t.right}">${esc(value)}</div>
      </div>`;
    }

    function assetTile(label, value, t) {
      return `<div class="rounded-xl bg-white/60 px-2.5 py-2">
        <div class="text-[12px] font-medium ${t.sub}">${esc(label)}</div>
        <div class="mt-0.5 font-mono text-[18px] font-bold ${t.right}">${esc(value)}</div>
      </div>`;
    }

    function renderSwitcher() {
      const count = state.profiles.length;
      if (!count) {
        return `<div class="sticky top-0 z-20 border-b border-slate-200/70 bg-slate-50/95 px-4 py-2 backdrop-blur">
          <div class="mx-auto flex w-full max-w-[640px] items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-500">暂未绑定学员</span>
            <button data-action="add-profile" ${state.online === 'off' ? 'disabled' : ''} class="h-7 rounded-full border border-indigo-200 bg-white px-2.5 text-[12px] font-bold text-indigo-700 disabled:opacity-40">+ 添加宝贝 (0/10)</button>
          </div>
        </div>`;
      }
      return `<div class="sticky top-0 z-20 border-b border-slate-200/70 bg-slate-50/95 px-4 py-2 backdrop-blur">
        <div class="mx-auto flex w-full max-w-[640px] items-center gap-1.5 overflow-x-auto">
          <span class="shrink-0 text-[12px] font-semibold text-slate-400">当前宝贝</span>
          ${state.profiles.map((p) => {
            const on = p.id === state.activeId;
            return `<button data-action="switch-profile" data-id="${p.id}" class="flex shrink-0 items-center gap-1.5 rounded-full border px-2 py-1 ${on ? 'border-indigo-200 bg-white text-indigo-700 shadow-sm ring-1 ring-indigo-200' : 'border-slate-200 bg-white/70 text-slate-600'}">
              ${avatar(p, 'h-6 w-6', 'text-[12px]')}
              <span class="font-mono text-[12px] font-bold">${esc(p.nickname)}</span>
            </button>`;
          }).join('')}
          <button data-action="add-profile" ${count >= 10 || state.online === 'off' ? 'disabled' : ''} class="shrink-0 rounded-full border border-dashed border-slate-300 bg-white/60 px-2.5 py-1 text-[12px] font-bold text-slate-500 disabled:opacity-40">+ 添加 (${count}/10)</button>
          <button data-action="open-claim" ${count >= 10 || state.online === 'off' ? 'disabled' : ''} class="shrink-0 rounded-full border border-indigo-200 bg-white px-2.5 py-1 text-[12px] font-bold text-indigo-700 disabled:opacity-40">认领试课</button>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 档案中心
     * ------------------------------------------------------------------ */
    function renderCenter() {
      const count = state.profiles.length;
      const isFull = count >= 10;
      const blocked = isFull || state.online === 'off';
      const tablet = state.device === 'tablet';

      const addRow = `<button data-action="add-profile" ${blocked ? 'disabled' : ''} class="flex w-full items-center justify-center gap-1.5 ${tablet ? 'rounded-2xl border border-dashed border-slate-300 bg-white/70 py-4' : 'border-t border-dashed border-slate-200 py-3'} text-[14px] font-semibold ${blocked ? 'cursor-not-allowed text-slate-400' : 'text-indigo-700 hover:bg-indigo-50/40'}">
        ${icon('plus', 'h-4 w-4')} ${isFull ? '名下档案已达上限 (10/10)' : `添加新宝贝 (${count}/10)`}
      </button>`;

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">

        ${isFull ? `<div class="flex items-start gap-2.5 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2.5">
          <span class="mt-0.5 shrink-0 text-amber-700">${icon('alert-triangle', 'h-4 w-4')}</span>
          <div class="text-[12px] font-medium leading-relaxed text-amber-900"><span class="font-bold">名下档案已达上限 (10/10)</span><br>如需新增，请先注销不再使用的档案。</div>
        </div>` : ''}

        <section class="${tablet ? 'grid grid-cols-2 gap-2' : 'overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm'}">
          ${state.profiles.map((p) => profileItem(p, tablet)).join('')}
          ${tablet ? addRow : ''}
        </section>
        ${!tablet ? addRow : ''}

        ${claimCard(blocked)}
        <p class="px-2 text-center text-[12px] font-medium text-slate-400">规范昵称全平台唯一 · 注销后昵称永久保留</p>
      </div>`;
    }

    function profileItem(p, standalone) {
      const active = p.id === state.activeId;
      const cls = standalone
        ? 'rounded-2xl border border-slate-200/80 bg-white p-3 shadow-sm'
        : `border-b border-slate-100 last:border-0 ${active ? 'bg-indigo-50/40' : ''}`;
      return `<button data-action="open-profile" data-id="${p.id}" class="flex w-full items-center gap-3 ${cls} px-3.5 py-3 text-left transition hover:bg-slate-50 active:bg-slate-50">
        ${avatar(p, 'h-11 w-11', 'text-[16px]')}
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-1.5">
            <span class="truncate font-mono text-[16px] font-bold text-slate-900">${esc(p.nickname)}</span>
            <span class="shrink-0 rounded-full border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(p.tag || '宝贝')}</span>
            ${statusChip(p.status)}
          </div>
          <div class="mt-0.5 truncate text-[14px] font-medium text-slate-600">${esc(p.realName)} · ${genderLabel(p.gender)} · ${p.age}岁</div>
          <div class="mt-1 flex flex-wrap items-center gap-x-2 text-[12px] font-medium">
            <span class="text-amber-700">待上 ${p.stats.upcoming}</span>
            <span class="text-slate-300">|</span>
            <span class="text-indigo-700">待排 ${p.stats.pendingTs}</span>
            <span class="text-slate-300">|</span>
            <span class="text-slate-500">在学课件 ${cwCount(p)}/6</span>
          </div>
        </div>
        ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-300')}
      </button>`;
    }

    function claimCard(blocked) {
      return `<section class="rounded-2xl border border-indigo-200/70 bg-indigo-50/80 p-4 shadow-sm">
        <div class="flex items-start gap-2.5">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-indigo-100 text-indigo-700">${icon('link-2', 'h-4 w-4')}</span>
          <div class="min-w-0 flex-1">
            <h2 class="text-[16px] font-bold text-indigo-950">认领试课宝贝</h2>
            <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-indigo-900/85">把孩子的试听记录并入当前账号，历史评语与课表完整保留。</p>
          </div>
        </div>
        <button data-action="open-claim" ${blocked ? 'disabled' : ''} class="mt-3 h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-300">开始认领</button>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 冷启动
     * ------------------------------------------------------------------ */
    function renderEmpty() {
      const teachers = [
        { name: 'David Miller', level: '资深外教 · 少儿英语 / KET', initial: 'D' },
        { name: 'Sarah Jenkins', level: '外教 · 生活口语 / 自然拼读', initial: 'S' }
      ];
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('学员档案', '暂未绑定学员 · 可先浏览老师')}
        <section class="rounded-2xl border border-indigo-200/70 bg-indigo-50/80 p-5 shadow-sm">
          <span class="grid h-12 w-12 place-items-center rounded-2xl bg-indigo-100 text-indigo-700">${icon('user-plus', 'h-5 w-5')}</span>
          <h2 class="mt-3 text-[18px] font-bold text-indigo-950">还没有宝贝档案</h2>
          <p class="mt-1 text-[14px] font-medium text-indigo-900/85">先浏览老师与空课表，选好课再添加宝贝。</p>
          <button data-action="add-profile" class="mt-4 h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">添加宝贝档案</button>
          <button data-action="open-claim" ${state.online === 'off' ? 'disabled' : ''} class="mt-2 h-10 w-full rounded-xl border border-indigo-200 bg-white/60 text-[14px] font-bold text-indigo-700 disabled:opacity-40">认领试课宝贝</button>
        </section>

        <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
          <div class="flex items-center justify-between">
            <h2 class="text-[16px] font-bold text-slate-900">推荐老师</h2>

          </div>
          <div class="mt-2 divide-y divide-slate-100">
            ${teachers.map((t) => `<div class="flex items-center gap-3 py-2.5">
              <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-indigo-50 text-[14px] font-bold text-indigo-700">${t.initial}</span>
              <div class="min-w-0 flex-1">
                <div class="truncate text-[14px] font-bold text-slate-900">${t.name}</div>

              <button data-action="add-profile" data-reason="预约排课前，请先添加宝贝档案" class="h-8 shrink-0 rounded-lg border border-slate-200 bg-slate-100 px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-200">预约</button>
            </div>`).join('')}
          </div>
        </section>

        <a href="m1b_teacher_parent.html" target="_blank" rel="noopener" class="flex items-center justify-between rounded-2xl border border-slate-200/80 bg-white px-4 py-3 shadow-sm">
          <span class="flex items-center gap-2 text-[14px] font-semibold text-slate-700">${icon('plus-circle', 'h-4 w-4 text-slate-400')}去约课大厅看看</span>
          ${icon('chevron-right', 'h-4 w-4 text-slate-300')}
        </a>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 档案详情
     * ------------------------------------------------------------------ */
    function renderDetail() {
      const p = activeProfile();
      if (!p) return renderEmpty();
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        ${backRow('back-center', '学员档案')}
        ${identityCard(p, 'parent')}
        ${assetCard(p)}
        ${coursewareCard(p, 'parent', 'profile')}
        ${infoCard(p, 'parent')}
        ${p.trialHistory ? `<div class="rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-emerald-800">试课记录已并入：历史完课 ${p.stats.completed} 节，公开评语与试课购课单均可查。</div>` : ''}
        ${auditCard(p)}
        <div class="flex gap-2">
          <button data-action="open-edit" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">编辑档案</button>
          <button data-action="open-guard" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-1 rounded-xl border border-rose-200 bg-rose-50 text-[16px] font-semibold text-rose-700 transition hover:bg-rose-100 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-50 disabled:text-slate-300">注销档案</button>
        </div>
        <p class="text-center text-[12px] font-medium text-slate-400">注销前需清零课时资产</p>
      </div>`;
    }

    function identityCard(p, mode) {
      const isTrial = p.staffKind === 'trial';
      const tag = isTrial
        ? `<span class="shrink-0 rounded-full border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-600">试课档案</span>`
        : (p.tag ? `<span class="shrink-0 rounded-full border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(p.tag)}</span>` : '');
      return `<section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
        <div class="flex items-start gap-3.5">
          ${avatar(p, 'h-16 w-16', 'text-[18px]')}
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="truncate font-mono text-[18px] font-bold tracking-tight text-slate-900">${esc(p.nickname)}</span>
              ${tag}
              ${statusChip(p.status, isTrial ? 'admin' : 'parent')}
            </div>
            <div class="mt-1 text-[14px] font-medium text-slate-600">${esc(p.realName)} · ${genderLabel(p.gender)} · ${p.age}岁</div>
            <div class="mt-0.5 truncate font-mono text-[12px] font-medium text-slate-400">${esc(p.id)}</div>
          </div>
          <button data-action="copy-nick" data-nick="${esc(p.nickname)}" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg border border-slate-200 bg-slate-100 text-slate-500 transition hover:bg-slate-200" aria-label="复制规范昵称">
            ${icon('copy', 'h-3.5 w-3.5')}
          </button>
        </div>
      </section>`;
    }

    function assetCard(p) {
      const t = TONES.emerald;
      return `<section class="rounded-2xl border ${t.card} p-3.5 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="grid h-8 w-8 place-items-center rounded-xl ${t.icon}">${icon('wallet', 'h-4 w-4')}</span>
            <h2 class="text-[16px] font-bold ${t.title}">课次资产</h2>
          </div>
          <span class="text-[12px] font-medium ${t.sub}">1 积分 = 1 元</span>
        </div>
        <div class="mt-2.5 grid grid-cols-2 gap-1.5">
          ${assetTile('待排课时', `${p.stats.pendingTs} 节`, t)}
          ${assetTile('未来已排', `${p.stats.upcoming} 节`, t)}
          ${assetTile('本期请假', `${p.stats.leaveUsed}/${p.stats.leaveQuota}`, t)}
          ${assetTile('历史完课', `${p.stats.completed} 节`, t)}
        </div>
        ${p.pendingRefund ? `<div class="mt-2 rounded-lg border border-rose-200 bg-rose-50 px-2.5 py-1.5 text-[12px] font-semibold text-rose-700">有 1 笔退款单处理中</div>` : ''}
      </section>`;
    }

    function coursewareCard(p, mode, kind) {
      const list = p.courseware || [];
      const restrictedUnbound = state.role === 'monitor' && p.staffKind === 'trial' && p.status === 'UNBOUND';
      const staff = mode === 'staff' && p.status !== 'ARCHIVED' && !restrictedUnbound;
      return `<section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-slate-100 text-slate-600">${icon('book-open-check', 'h-4 w-4')}</span>
            <h2 class="truncate text-[16px] font-bold text-slate-900">在学课件</h2>
            <span class="shrink-0 rounded-full bg-slate-100 px-1.5 py-0.5 font-mono text-[12px] font-bold text-slate-500">${list.length}/6</span>
          </div>
          ${staff
            ? `<button data-action="open-courseware" data-kind="${kind}" data-id="${p.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg border border-slate-200 bg-slate-100 px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-200 disabled:opacity-40">调整</button>`
            : `<span class="inline-flex shrink-0 items-center gap-1 rounded-full border border-slate-200 bg-slate-50 px-2 py-0.5 text-[12px] font-bold text-slate-500">${icon('lock', 'h-3.5 w-3.5')}只读</span>`}
        </div>
        <p class="mt-0.5 text-[12px] font-medium text-slate-400">${staff ? '保存后同步至教师日历与家长端' : restrictedUnbound ? '待认领试课档案由平台管理员维护' : p.status === 'ARCHIVED' ? '已归档档案只读 · 不支持调整' : '由管理员或负责班长维护 · 家长端只读'}</p>
        <div class="mt-2.5 space-y-1.5">
          ${list.length ? list.map((item) => {
            const cw = cwById(item.cwId);
            return `<div class="flex items-center gap-2.5 rounded-xl border border-slate-200/80 bg-white px-2.5 py-2">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-indigo-50 text-indigo-700">${icon('book-open', 'h-4 w-4')}</span>
              <div class="min-w-0 flex-1">
                <div class="truncate text-[14px] font-bold text-slate-900">${esc(cw.nameEn)}</div>
                <div class="truncate text-[12px] font-medium text-slate-500">${esc(cw.nameCn)}</div>
              </div>
              <span class="shrink-0 rounded-md border border-indigo-100 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">${esc(item.level || '标准')}</span>
            </div>`;
          }).join('') : `<div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 px-3 py-4 text-center text-[12px] font-medium text-slate-400">尚未配置在学课件</div>`}
        </div>
      </section>`;
    }

    function infoCard(p, mode) {
      const isTrial = p.staffKind === 'trial';
      const lastKey = isTrial
        ? (p.status === 'UNBOUND' ? '预留联系方式' : '家长邮箱')
        : '12 位短 ID';
      const lastValue = isTrial
        ? (p.status === 'UNBOUND' ? maskContact(p.contact) : esc(p.parentEmail || '—'))
        : `<span class="font-mono">${esc(p.id)}</span>`;
      const rows = [
        ['真实姓名', esc(p.realName)],
        ['英文名', esc(p.englishName)],
        ['姓首字母', esc(p.surnameInitial)],
        ['年龄', `${p.age} 岁`],
        ['性别', genderLabel(p.gender)],
        ['建档日期', esc(p.createdAt)],
        [mode === 'staff' ? '负责班长' : '家长账号', mode === 'staff' ? esc(p.responsible || '平台托管') : 'Amy · amy@example.com'],
        [lastKey, lastValue]
      ];
      return `<section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
        <h2 class="text-[16px] font-bold text-slate-900">基础信息</h2>
        <div class="mt-2.5 grid grid-cols-2 gap-x-3 gap-y-2.5">
          ${rows.map(([k, v]) => `<div class="min-w-0">
            <div class="text-[12px] font-medium text-slate-400">${k}</div>
            <div class="mt-0.5 truncate text-[14px] font-semibold text-slate-900">${v}</div>
          </div>`).join('')}
        </div>
        <div class="mt-3 border-t border-slate-100 pt-2.5">
          <div class="flex items-center justify-between">
            <span class="text-[12px] font-medium text-slate-400">选课偏好</span>
            <span class="text-[12px] font-medium text-slate-400">不选即不限</span>
          </div>
          <div class="mt-1.5 flex flex-wrap gap-1.5">
            ${p.prefs && p.prefs.length
              ? p.prefs.map((t) => `<span class="rounded-lg border border-indigo-100 bg-indigo-50 px-2 py-1 text-[12px] font-bold text-indigo-700">${esc(t)}</span>`).join('')
              : `<span class="text-[14px] font-medium text-slate-400">不限课程类型</span>`}
          </div>
        </div>
      </section>`;
    }

    function auditCard(p) {
      if (!p.audit || !p.audit.length) return '';
      return `<details class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
        <summary class="flex cursor-pointer list-none items-center justify-between [&::-webkit-details-marker]:hidden">
          <span class="text-[16px] font-bold text-slate-900">变更记录</span>
          <span class="text-[12px] font-medium text-slate-400">${p.audit.length} 条</span>
        </summary>
        <div class="mt-3 space-y-2.5">
          ${p.audit.slice(0, 5).map((a) => `<div class="flex items-start gap-2.5">
            <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-indigo-400"></span>
            <div class="min-w-0">
              <div class="text-[12px] font-medium text-slate-400">${esc(a.at)} · ${esc(a.by)}</div>
              <div class="text-[14px] font-medium leading-relaxed text-slate-800">${esc(a.text)}</div>
            </div>
          </div>`).join('')}
        </div>
      </details>`;
    }

    /* ------------------------------------------------------------------
     * 家长 · 认领试课
     * ------------------------------------------------------------------ */
    function renderClaim() {
      const blocked = state.online === 'off' || state.profiles.length >= 10;
      const t = state.trials.find((x) => x.id === state.claim.matchedId);
      if (state.claim.step === 2 && !t) state.claim.step = 1;
      const blockedMsg = state.online === 'off'
        ? '离线模式下不可认领，请联网后重试'
        : state.profiles.length >= 10
          ? '名下档案已达上限 (10/10)，请先注销不再使用的档案'
          : '';
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        ${backRow('back-center', '学员档案')}
        ${pageHeader('认领试课宝贝', '核验昵称与预留联系方式后四位')}
        ${stepIndicator()}
        ${blockedMsg ? `<div class="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-amber-900">${blockedMsg}</div>` : ''}
        ${state.claim.step === 1 ? claimStep1(blocked) : claimStep2(t, blocked)}
      </div>`;
    }

    function stepIndicator() {
      const reached = state.claim.step;
      const dot = (n, label) => `<div class="flex items-center gap-2">
        <span class="grid h-6 w-6 place-items-center rounded-full text-[12px] font-bold ${reached >= n ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}">${n}</span>
        <span class="text-[12px] font-semibold ${reached >= n ? 'text-indigo-700' : 'text-slate-400'}">${label}</span>
      </div>`;
      return `<div class="flex items-center gap-2 px-1">
        ${dot(1, '核验信息')}
        <div class="h-px flex-1 bg-slate-200"></div>
        ${dot(2, '确认认领')}
      </div>`;
    }

    function claimStep1(blocked) {
      return `<section class="space-y-3 rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
        <div>
          <label for="claimNickname" class="mb-1 block text-[14px] font-semibold text-slate-700">孩子规范昵称</label>
          <input id="claimNickname" value="${esc(state.claim.nickname)}" placeholder="如 LeoW8" maxlength="30" class="h-11 w-full rounded-xl border ${state.claim.error ? 'border-rose-300' : 'border-slate-200'} bg-white px-3 font-mono text-[16px] font-semibold text-slate-900 outline-none transition focus:border-indigo-500">
          <p class="mt-1 text-[12px] font-medium text-slate-400">昵称可向建档老师获取</p>
        </div>
        <div>
          <label for="claimLast4" class="mb-1 block text-[14px] font-semibold text-slate-700">建档预留手机 / 微信后四位</label>
          <input id="claimLast4" value="${esc(state.claim.last4)}" inputmode="numeric" maxlength="4" placeholder="8000" class="h-11 w-full rounded-xl border ${state.claim.error ? 'border-rose-300' : 'border-slate-200'} bg-white px-3 font-mono text-[16px] font-semibold tracking-widest text-slate-900 outline-none transition focus:border-indigo-500">
        </div>
        ${state.claim.error ? `<div id="claimError" class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[12px] font-medium text-rose-700">${esc(state.claim.error)}</div>` : ''}
        <button data-action="claim-query" ${blocked ? 'disabled' : ''} class="h-11 w-full rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">查询宝贝</button>
        <p class="text-center text-[12px] font-medium text-slate-400">演示：LeoW8 · 后四位 8000</p>
      </section>`;
    }

    function claimStep2(t, blocked) {
      return `<section class="rounded-2xl border border-indigo-200/70 bg-indigo-50/80 p-4 shadow-sm">
        <div class="flex items-start gap-3">
          ${avatar(t, 'h-14 w-14', 'text-[18px]', 'indigo')}
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="font-mono text-[18px] font-bold text-indigo-950">${esc(t.nickname)}</span>
              <span class="rounded-full border border-indigo-200 bg-white/60 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">待认领</span>
            </div>
            <div class="mt-0.5 text-[14px] font-medium text-indigo-900/85">${esc(t.realName)} · ${genderLabel(t.gender)} · ${t.age}岁</div>
            <div class="mt-0.5 text-[12px] font-medium text-indigo-700">历史试听 ${t.trialLessons} 节</div>
          </div>
        </div>
        <div class="mt-3 rounded-xl bg-white/60 px-3 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900/85">认领后，上课记录、老师公开评语与试课购课单将并入您的名下。</div>
        ${state.claim.error ? `<div id="claimError" class="mt-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[12px] font-medium text-rose-700">${esc(state.claim.error)}</div>` : ''}
        <div class="mt-3 flex gap-2">
          <button data-action="claim-back" class="h-11 flex-1 rounded-xl border border-indigo-200 bg-white/70 text-[16px] font-semibold text-indigo-700">返回修改</button>
          <button data-action="claim-confirm" ${blocked ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-300">确认认领并绑定</button>
        </div>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 班长 / 管理员 · 学员列表
     * ------------------------------------------------------------------ */
    function renderStaffList() {
      const all = staffItems();
      const counts = {
        all: all.length,
        unbound: all.filter((x) => x.status === 'UNBOUND').length,
        active: all.filter((x) => x.status === 'ACTIVE').length,
        archived: all.filter((x) => x.status === 'ARCHIVED').length
      };
      const items = filteredStaff();
      const tablet = state.device === 'tablet';
      const right = state.role === 'admin'
        ? `<button data-action="open-trial" ${state.online === 'off' ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg bg-indigo-600 px-3 text-[12px] font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">+ 新建试课</button>`
        : `<span class="shrink-0 text-[12px] font-medium text-slate-400">试课建档由管理员完成</span>`;
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader(state.role === 'admin' ? '学生档案' : '学员档案', state.role === 'admin' ? '全平台学员 · 待认领档案可绑定' : '负责学员 · 在学课件由您维护', right)}
        <div class="relative">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">${icon('search', 'h-4 w-4')}</span>
          <input id="staffSearch" value="${esc(state.staffQuery)}" placeholder="搜索昵称 / 真实姓名" class="h-11 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500">
        </div>
        <div class="flex gap-1 rounded-2xl bg-slate-200/60 p-1">
          ${[['all', '全部', counts.all], ['unbound', '待认领', counts.unbound], ['active', '在读', counts.active], ['archived', '已归档', counts.archived]].map(([key, label, count]) => `<button data-action="staff-tab" data-tab="${key}" class="flex-1 rounded-xl py-2 text-[12px] font-bold transition ${state.staffTab === key ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">${label} ${count}</button>`).join('')}
        </div>
        <div class="${tablet ? 'grid grid-cols-2 gap-2' : 'space-y-2'}">
          ${items.length
            ? items.map((p) => staffRow(p)).join('')
            : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-400">没有匹配的学员</div>`}
        </div>
      </div>`;
    }

    function staffRow(p) {
      const isTrial = p.staffKind === 'trial';
      const urgent = p.status === 'UNBOUND' && p.daysLeft <= 7;
      return `<button data-action="staff-open" data-kind="${p.staffKind}" data-id="${p.id}" class="flex w-full items-center gap-3 rounded-2xl border border-slate-200/80 bg-white p-3 text-left shadow-sm transition hover:bg-slate-50">
        ${avatar(p, 'h-11 w-11', 'text-[16px]')}
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-1.5">
            <span class="truncate font-mono text-[16px] font-bold text-slate-900">${esc(p.nickname)}</span>
            ${statusChip(p.status, isTrial ? 'admin' : 'parent')}
            ${isTrial ? `<span class="rounded-full border border-slate-200 bg-slate-50 px-1.5 py-0.5 text-[12px] font-bold text-slate-500">试课</span>` : ''}
          </div>
          <div class="mt-0.5 truncate text-[14px] font-medium text-slate-600">${esc(p.realName)} · ${genderLabel(p.gender)} · ${p.age}岁</div>
          <div class="mt-1 flex flex-wrap items-center gap-x-2 text-[12px] font-medium text-slate-400">
            <span>在学课件 ${cwCount(p)}/6</span>
            <span>·</span>
            <span>${p.responsible ? `班长 ${esc(p.responsible)}` : '平台托管'}</span>
            ${urgent ? `<span class="text-rose-600">· ${p.daysLeft} 天后归档</span>` : ''}
          </div>
        </div>
        ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-300')}
      </button>`;
    }

    /* ------------------------------------------------------------------
     * 班长 / 管理员 · 档案详情
     * ------------------------------------------------------------------ */
    function renderStaffDetail() {
      const p = staffTarget();
      if (!p) return renderStaffList();
      const isTrial = p.staffKind === 'trial';
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-3 pb-10">
        ${backRow('back-staff', '学员列表')}
        ${identityCard(p, 'staff')}
        ${isTrial && p.status === 'UNBOUND' ? bindCard(p) : ''}
        ${!isTrial ? assetCard(p) : ''}
        ${coursewareCard(p, 'staff', p.staffKind)}
        ${infoCard(p, 'staff')}
        ${isTrial && p.status === 'ACTIVE' ? `<div class="rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-2.5 text-[12px] font-medium text-emerald-800">已认领至 ${esc(p.parentEmail || '家长账号')}${p.claimedAt ? ` · ${esc(p.claimedAt)}` : ''}</div>` : ''}
        ${isTrial && p.status === 'ARCHIVED' ? `<div class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[12px] font-medium text-slate-500">已于 ${esc(p.archivedAt || '—')} 归档 · 昵称仍保持占用</div>` : ''}
        ${auditCard(p)}
        <a href="m3a_calendar_schedule.html" target="_blank" rel="noopener" class="flex h-11 items-center justify-center gap-1.5 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 transition hover:bg-slate-200">${icon('calendar-days', 'h-4 w-4')}查看课表</a>
      </div>`;
    }

    function bindCard(t) {
      const urgent = t.daysLeft <= 7;
      const tone = urgent ? 'rose' : 'amber';
      const T = TONES[tone];
      return `<section class="rounded-2xl border ${T.card} p-3.5 shadow-sm ${urgent ? 'border-l-4 border-l-rose-400' : ''}">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <h2 class="text-[16px] font-bold ${T.title}">待认领试课档案</h2>
            <p class="mt-0.5 text-[12px] font-medium ${T.sub}">档案暂归平台托管 · 绑定后历史记录完整继承</p>
          </div>
          <div class="shrink-0 text-right">
            <div class="font-mono text-[18px] font-bold ${T.right}">${t.daysLeft} 天</div>
            <div class="text-[12px] font-medium ${T.sub}">后自动归档</div>
          </div>
        </div>
        <div class="mt-2 flex gap-1.5">
          <button data-action="open-bind" data-id="${t.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-10 flex-1 rounded-lg ${T.action} text-[14px] font-bold disabled:cursor-not-allowed disabled:opacity-50">绑定家长</button>
          ${state.role === 'admin' ? `<button data-action="toast" data-message="已打开 1v1 临时课代约（原型模拟）" class="h-10 flex-1 rounded-lg border ${SOFT_BTN[tone]} text-[14px] font-bold">去排课</button>` : ''}
        </div>
      </section>`;
    }

    /* ------------------------------------------------------------------
     * 管理员 · 试课档案
     * ------------------------------------------------------------------ */
    function renderTrials() {
      const all = state.trials;
      const unbound = all.filter((t) => t.status === 'UNBOUND');
      const active = all.filter((t) => t.status === 'ACTIVE');
      const archived = all.filter((t) => t.status === 'ARCHIVED');
      const urgent = unbound.filter((t) => t.daysLeft <= 7).length;
      const map = { unbound: 'UNBOUND', active: 'ACTIVE', archived: 'ARCHIVED' };
      const list = all.filter((t) => t.status === map[state.adminTab]);
      const tablet = state.device === 'tablet';
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('试课档案', '免注册代建 · 30 天未认领自动归档', `<button data-action="open-trial" ${state.online === 'off' ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg bg-indigo-600 px-3 text-[12px] font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">+ 新建</button>`)}
        <div class="grid grid-cols-3 gap-2">
          ${miniStat('待认领', unbound.length, 'amber')}
          ${miniStat('7 天内归档', urgent, 'rose')}
          ${miniStat('已归档', archived.length, 'slate')}
        </div>
        <div class="flex gap-1 rounded-2xl bg-slate-200/60 p-1">
          ${[['unbound', '待认领', unbound.length], ['active', '已认领', active.length], ['archived', '已归档', archived.length]].map(([key, label, count]) => `<button data-action="set-admin-tab" data-tab="${key}" class="flex-1 rounded-xl py-2 text-[12px] font-bold transition ${state.adminTab === key ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">${label} ${count}</button>`).join('')}
        </div>
        <div class="${tablet ? 'grid grid-cols-2 gap-2' : 'space-y-2'}">
          ${list.length
            ? list.map((t) => trialCard(t)).join('')
            : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-400">暂无${state.adminTab === 'unbound' ? '待认领' : state.adminTab === 'active' ? '已认领' : '已归档'}档案</div>`}
        </div>
      </div>`;
    }

    function trialCard(t) {
      const urgent = t.status === 'UNBOUND' && t.daysLeft <= 7;
      const tone = t.status === 'ACTIVE' ? 'emerald' : t.status === 'ARCHIVED' ? 'slate' : urgent ? 'rose' : 'amber';
      const T = TONES[tone];
      const statusLabel = t.status === 'ACTIVE' ? '已认领' : t.status === 'ARCHIVED' ? '已归档' : '待认领';
      return `<article class="rounded-2xl border ${T.card} p-3 shadow-sm ${urgent ? 'border-l-4 border-l-rose-400' : ''}">
        <div class="flex items-start justify-between gap-2">
          <button data-action="staff-open" data-kind="trial" data-id="${t.id}" class="flex min-w-0 flex-1 items-center gap-2.5 text-left">
            ${avatar(t, 'h-10 w-10', 'text-[14px]', tone)}
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="truncate font-mono text-[16px] font-bold ${T.title}">${esc(t.nickname)}</span>
                <span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${T.chip}">${statusLabel}</span>
              </div>
              <div class="mt-0.5 truncate text-[14px] font-medium ${T.body}">${esc(t.realName)} · ${genderLabel(t.gender)} · ${t.age}岁</div>
            </div>
          </button>
          ${t.status === 'UNBOUND' ? `<div class="shrink-0 text-right">
            <div class="font-mono text-[18px] font-bold ${T.right}">${t.daysLeft}</div>
            <div class="text-[12px] font-medium ${T.sub}">天后归档</div>
          </div>` : ''}
        </div>
        <div class="mt-2 grid grid-cols-2 gap-1.5">
          <div class="rounded-lg bg-white/60 px-2 py-1.5">
            <div class="text-[12px] font-medium ${T.sub}">联系方式</div>
            <div class="mt-0.5 truncate text-[14px] font-semibold ${T.body}">${maskContact(t.contact)}</div>
          </div>
          <div class="rounded-lg bg-white/60 px-2 py-1.5">
            <div class="text-[12px] font-medium ${T.sub}">试课记录</div>
            <div class="mt-0.5 truncate text-[14px] font-semibold ${T.body}">${t.trialLessons} 节</div>
            <div class="mt-0.5 truncate text-[12px] font-medium ${T.sub}">${t.lastLessonDate ? `最后 ${t.lastLessonDate.slice(5)}` : '尚未结课'}</div>
          </div>
        </div>
        <div class="mt-2 flex items-center justify-between gap-2 border-t border-black/5 pt-2">
          <span class="min-w-0 truncate text-[12px] font-medium ${T.sub}">${t.status === 'ACTIVE' ? `已认领至 ${esc(t.parentEmail || '家长账号')}` : t.status === 'ARCHIVED' ? `归档于 ${esc(t.archivedAt || '—')}` : `建档人 ${esc(t.createdBy || 'Sarah')}`}</span>
          ${t.status === 'UNBOUND'
            ? `<div class="flex shrink-0 gap-1.5">
              <button data-action="open-bind" data-id="${t.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 rounded-lg ${T.action} px-2.5 text-[12px] font-bold disabled:opacity-50">绑定家长</button>
              <button data-action="toast" data-message="已打开 1v1 临时课代约（原型模拟）" class="h-8 rounded-lg border ${SOFT_BTN[tone]} px-2.5 text-[12px] font-bold">去排课</button>
            </div>`
            : `<button data-action="staff-open" data-kind="trial" data-id="${t.id}" class="h-8 shrink-0 rounded-lg border ${SOFT_BTN[tone]} px-2.5 text-[12px] font-bold">查看档案</button>`}
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 其他模块占位页
     * ------------------------------------------------------------------ */
    function renderPlaceholder() {
      const item = NAVS[state.role].find((n) => n.id === state.navTab);
      if (!item) return renderContentFallback();
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">打开对应原型</a>` : ''}
        <button data-action="back-main" class="mt-3 text-[14px] font-semibold text-indigo-600">返回${state.role === 'parent' ? '档案中心' : state.role === 'monitor' ? '学员档案' : '试课档案'}</button>
      </div>`;
    }

    function renderContentFallback() {
      return `<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>`;
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'profile') return renderProfileSheet();
      if (state.overlay.type === 'trial') return renderTrialSheet();
      if (state.overlay.type === 'guard') return renderGuardModal();
      if (state.overlay.type === 'bind') return renderBindModal();
      if (state.overlay.type === 'courseware') return renderCoursewareSheet();
      return '';
    }

    function renderProfileSheet() {
      const f = state.form;
      const isEdit = f.mode === 'edit';
      const invalid = !!profileFormError(f);
      const inputCls = 'h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500';
      const initial = (f.englishName || '?').trim().charAt(0).toUpperCase() || '?';
      return `<div class="absolute inset-0 z-50 flex flex-col bg-white">
        <div class="flex min-h-[56px] shrink-0 items-center justify-between border-b border-slate-200 px-4 py-2">
          <div class="min-w-0">
            <h2 class="truncate text-[16px] font-bold text-slate-900">${isEdit ? '编辑学员档案' : '添加学员档案'}</h2>
            <p class="truncate text-[12px] font-medium text-slate-400">${esc(f.reason || '规范昵称全平台唯一')}</p>
          </div>
          <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
        </div>

        <div class="min-h-0 flex-1 overflow-y-auto px-4 py-4">
          <div class="space-y-3.5">
            <div class="flex items-center gap-3.5">
              <label class="relative grid h-16 w-16 shrink-0 cursor-pointer place-items-center overflow-hidden rounded-full border border-slate-200 bg-slate-50">
                <img id="avatarPreview" src="${esc(f.avatarDataUrl)}" class="${f.avatarDataUrl ? '' : 'hidden'} h-full w-full object-cover" alt="">
                <span id="avatarInitial" class="${f.avatarDataUrl ? 'hidden' : ''} text-[18px] font-bold text-slate-500">${esc(initial)}</span>
                <input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
              </label>
              <div class="min-w-0">
                <label for="avatarInput" class="inline-flex h-9 cursor-pointer items-center rounded-lg border border-slate-200 bg-slate-100 px-3 text-[14px] font-semibold text-slate-700 hover:bg-slate-200">选择照片</label>
                <p class="mt-1 text-[12px] font-medium text-slate-400">1:1 · JPG/PNG/WebP · ≤ 2MB</p>
              </div>
            </div>

            <div>
              <label for="fRealName" class="mb-1 block text-[14px] font-semibold text-slate-700">宝贝真实姓名</label>
              <input id="fRealName" value="${esc(f.realName)}" placeholder="张小丽" maxlength="24" class="${inputCls}">
            </div>

            <div class="grid grid-cols-[1fr_76px_76px] gap-2">
              <div>
                <label for="fEnglish" class="mb-1 block text-[14px] font-semibold text-slate-700">英文名</label>
                <input id="fEnglish" value="${esc(f.englishName)}" placeholder="Alice" maxlength="24" autocomplete="off" class="${inputCls}">
              </div>
              <div>
                <label for="fInitial" class="mb-1 block text-center text-[14px] font-semibold text-slate-700">姓首字母</label>
                <input id="fInitial" value="${esc(f.initial)}" placeholder="Z" maxlength="1" autocomplete="off" class="${inputCls} text-center font-mono uppercase">
              </div>
              <div>
                <label for="fAge" class="mb-1 block text-center text-[14px] font-semibold text-slate-700">年龄</label>
                <input id="fAge" type="number" min="1" max="99" value="${esc(f.age)}" placeholder="12" inputmode="numeric" class="${inputCls} text-center">
              </div>
            </div>

            <div class="rounded-xl border border-indigo-200/70 bg-indigo-50/80 px-3 py-2.5">
              <div class="flex items-center justify-between">
                <span class="text-[12px] font-semibold text-indigo-700">系统生成规范昵称</span>
                <span class="flex items-center gap-1 text-[12px] font-medium text-indigo-700">${icon('lock', 'h-3.5 w-3.5')}全平台唯一</span>
              </div>
              <div id="nickPreview" class="mt-0.5 break-all font-mono text-[18px] font-bold ${computeNickname(f) ? 'text-indigo-950' : 'text-indigo-300'}">${esc(computeNickname(f) || '英文名+首字母+年龄')}</div>
              <div id="nickStatus" class="mt-0.5 text-[12px] font-medium"></div>
            </div>

            <div>
              <label for="fSuffix" class="mb-1 block text-[14px] font-semibold text-slate-700">微调后缀 <span class="font-normal text-[12px] text-slate-400">（可选，重名时使用）</span></label>
              <input id="fSuffix" value="${esc(f.suffix)}" placeholder="b" maxlength="3" autocomplete="off" class="${inputCls} w-36 font-mono lowercase">
            </div>

            <div>
              <span class="mb-1 block text-[14px] font-semibold text-slate-700">性别</span>
              <div class="inline-flex rounded-xl bg-slate-100 p-1">
                ${['male', 'female', 'undisclosed'].map((g) => `<button data-action="toggle-gender" data-gender="${g}" class="h-9 rounded-lg px-4 text-[14px] font-semibold ${f.gender === g ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}">${genderLabel(g)}</button>`).join('')}
              </div>
            </div>

            <div>
              <div class="mb-1 flex items-center justify-between">
                <span class="text-[14px] font-semibold text-slate-700">选课偏好</span>
                <span class="text-[12px] font-medium text-slate-400">不选即不限</span>
              </div>
              <div class="flex flex-wrap gap-1.5">
                ${COURSE_TYPES.map((t) => `<button data-action="toggle-pref" data-pref="${esc(t)}" class="h-8 rounded-lg border px-2.5 text-[12px] font-semibold ${f.prefs.includes(t) ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-600'}">${esc(t)}</button>`).join('')}
              </div>
            </div>

            ${f.error ? `<div id="profileError" class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[12px] font-medium text-rose-700">${esc(f.error)}</div>` : ''}
          </div>
        </div>

      const initialEl = $('avatarInitial');

                <div>
                  <div class="mb-1 flex items-center justify-between text-[11px] font-medium text-slate-500">
                    <span>学习进度（选填，最多 64 字）</span>
                    <span id="cwProgCount-${i}" class="font-mono">${progLen}/64</span>
                  </div>
                  <input id="cwProg-${i}" value="${esc(item.progressText || '')}" maxlength="64" placeholder="如 Unit 3 · Page 24 / 第4单元第12页" class="h-9 w-full rounded-lg border border-slate-200 bg-slate-50/70 px-2.5 text-[13px] text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">
                </div>
              </div>`;
            }).join('') : `<div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 px-3 py-6 text-center text-[12px] font-medium text-slate-500">尚未配置在学课件</div>`}

            ${draft.length >= 6
              ? `<div class="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] font-medium text-amber-900">已达 6 门上限，请先移除后再添加。</div>`
              : `<div class="space-y-1.5 rounded-xl border border-dashed border-slate-300 bg-slate-50 p-3">
                <div class="text-[12px] font-bold text-slate-500">新增课件</div>
                <select id="cwPick" class="h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-[14px] font-semibold text-slate-700 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15">
                  <option value="">选择课件</option>
                  ${available.map((x) => `<option value="${x.id}" ${cw.pickCw === x.id ? 'selected' : ''}>${esc(x.nameEn)} · ${esc(x.nameCn)}</option>`).join('')}
                </select>
                <select id="cwLevel" ${picked ? '' : 'disabled'} class="h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-[14px] font-semibold text-slate-700 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15 disabled:bg-slate-100 disabled:text-slate-500">
                  ${picked
                    ? picked.levels.map((l) => `<option ${l === cw.pickLevel ? 'selected' : ''}>${esc(l)}</option>`).join('')
                    : `<option>选择级别</option>`}
                </select>
                <button data-action="cw-add" ${canAdd ? '' : 'disabled'} class="h-11 w-full rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">添加到在学课件</button>
              </div>`}

            ${target.audit && target.audit.length ? `<details class="rounded-xl border border-slate-200 bg-slate-50/70 p-3">
              <summary class="flex cursor-pointer list-none items-center justify-between [&::-webkit-details-marker]:hidden">
                <span class="flex min-w-0 items-center gap-1.5">
                  <span class="truncate text-[14px] font-bold text-slate-800">档案变动日志</span>
                  <span class="shrink-0 rounded-full border border-slate-300 bg-white px-1.5 py-0.5 text-[12px] font-bold text-slate-500">只读</span>
                </span>
                <span class="shrink-0 text-[12px] font-medium text-slate-500">${target.audit.length} 条</span>
              </summary>
              <div class="mt-2 space-y-1.5">
                ${target.audit.slice(0, 3).map((a) => `<div class="rounded-lg bg-white px-2 py-1.5">
                  <div class="text-[12px] font-medium text-slate-600">${esc(a.at)} · ${esc(a.by)}</div>
                  <div class="mt-0.5 break-words text-[12px] font-medium leading-relaxed text-slate-700">${esc(logSummary(a))}</div>
                </div>`).join('')}
              </div>
            </details>` : ''}
          </div>

          <div class="flex shrink-0 gap-2 border-t border-slate-200/80 bg-white/95 px-4 py-3">
            <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 transition hover:bg-slate-50">取消</button>
            <button data-action="cw-save" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">保存生效</button>
          </div>
        </div>
        ${cw.pendingRemoveIndex !== null && cw.pendingRemoveIndex !== undefined && draft[cw.pendingRemoveIndex] ? (() => {
          const rmInfo = cwById(draft[cw.pendingRemoveIndex].cwId);
          return `<div class="absolute inset-0 z-[60]">
            <div class="absolute inset-0 bg-slate-900/45 backdrop-blur-[1px]" data-action="cancel-cw-remove"></div>
            <div class="absolute inset-x-4 top-1/2 mx-auto max-w-[420px] -translate-y-1/2 rounded-2xl bg-white p-4 shadow-2xl">
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <h3 class="text-[16px] font-bold text-slate-900">移除在学课件</h3>
                  <p class="mt-0.5 text-[12px] font-medium text-slate-500">${esc(target.nickname)} · 在学课件配置</p>
                </div>
                <button data-action="cancel-cw-remove" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
              </div>
              <div class="mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-rose-900">确认将「${esc(rmInfo.nameCn)}」从该学员在学课件中移除？</div>
              <div class="mt-3 flex gap-2">
                <button data-action="cancel-cw-remove" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 hover:bg-slate-50">取消</button>
                <button data-action="confirm-cw-remove" class="h-11 flex-1 rounded-xl bg-rose-600 text-[16px] font-semibold text-white hover:bg-rose-700">确认移除</button>
              </div>
            </div>
          </div>`;
        })() : ''}
      </div>`;
    }

    function renderNotesModal() {
      const e = state.noteEdit;
      const target = findCwTarget(e.kind, e.id);
      if (!target) return '';
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-4 top-1/2 max-h-[86%] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">编辑学员备注</h2>
              <p class="mt-1 truncate font-mono text-[12px] font-medium text-slate-500">${esc(target.nickname)}</p>
            </div>
            <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <label for="notesInput" class="mt-3 mb-1 block text-[14px] font-semibold text-slate-700">教学注意事项</label>
          <textarea id="notesInput" maxlength="300" rows="5" placeholder="记录孩子的性格偏好、教学注意事项等" class="w-full resize-none rounded-xl border border-slate-200 bg-slate-50/70 px-3.5 py-2.5 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">${esc(e.text)}</textarea>
          <p class="mt-1 text-[12px] font-medium text-slate-500">纯文本 · 最多 300 字</p>
          <div class="mt-4 flex gap-2">
            <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 transition hover:bg-slate-50">取消</button>
            <button data-action="save-notes" class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">保存备注</button>
          </div>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 预览与表单同步
     * ------------------------------------------------------------------ */
    function statusLine(st) {
      if (st.ok) return `<span class="flex items-center gap-1 text-emerald-600"><span class="font-bold">✓</span>${esc(st.message)}</span>`;
      return `<span class="flex items-center gap-1 ${st.incomplete ? 'text-slate-500' : 'text-rose-600'}"><span class="font-bold">${st.incomplete ? '·' : '!'}</span>${esc(st.message)}</span>`;
    }

    function updateProfilePreview() {
      const f = state.form;
      const nickEl = $('nickPreview');
      if (!nickEl) return;
      const nick = computeNickname(f);
      nickEl.textContent = nick || '英文名+首字母+年龄';
      nickEl.className = `mt-0.5 break-all font-mono text-[18px] font-bold ${nick ? 'text-slate-900' : 'text-slate-500'}`;

      const statusEl = $('nickStatus');
      if (statusEl) statusEl.innerHTML = statusLine(profileNicknameStatus(f));

      const btn = $('btnSubmitProfile');
      if (btn) btn.disabled = !!profileFormError(f);

      const initialEl = $('avatarInitial');
      if (initialEl && !f.avatarDataUrl) {
        initialEl.textContent = (f.englishName || '?').trim().charAt(0).toUpperCase() || '?';
      }
    }

    function updateTrialPreview() {
      const f = state.trialForm;
      const nickEl = $('trialNickPreview');
      if (!nickEl) return;
      if (f.mode === 'quick') {
        const parsed = parseQuickNick(f.quickNick);
        nickEl.textContent = parsed.ok
          ? `英文名 ${parsed.englishName} · 姓首字母 ${parsed.initial} · ${parsed.age} 岁 · 默认小名 ${parsed.nickname}`
          : '等待输入规范英文名（如 MarkL10）';
        nickEl.className = `mt-1 text-[13px] font-semibold ${parsed.ok ? 'text-slate-900' : 'text-slate-500'}`;
      } else {
        const nick = computeNickname(f);
        nickEl.textContent = nick || '英文名+首字母+年龄';
        nickEl.className = `mt-0.5 break-all font-mono text-[18px] font-bold ${nick ? 'text-slate-900' : 'text-slate-500'}`;
      }

      const statusEl = $('trialNickStatus');
      if (statusEl) statusEl.innerHTML = statusLine(trialNicknameStatus(f));

      const btn = $('btnSubmitTrial');
      if (btn) btn.disabled = !!trialFormError(f);
    }

    function removeEl(id) {
      const el = $(id);
      if (el) el.remove();
    }

    function clearProfileError() {
      state.form.error = '';
      removeEl('profileError');
    }

    function clearTrialError() {
      state.trialForm.error = '';
      removeEl('trialError');
    }

    function clearClaimError() {
      state.claim.error = '';
      removeEl('claimError');
      ['claimNickname', 'claimLast4'].forEach((id) => {
        const el = $(id);
        if (el) { el.classList.remove('border-rose-300'); el.classList.add('border-slate-200'); }
      });
    }

    function clearBindError() {
      state.bind.error = '';
      removeEl('bindError');
      const input = $('bindEmail');
      if (input) { input.classList.remove('border-rose-300'); input.classList.add('border-slate-200'); }
    }

    /* ------------------------------------------------------------------
     * 事件委托
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'back-main') {
        if (state.role === 'parent') return setView('center');
        return setView('staffList');
      }
      if (action === 'back-center') { state.page = 'center'; state.navTab = 'me'; state.overlay = null; return renderAll(); }
      if (action === 'back-staff') {
        if (state.staffKind === 'trial' && state.role === 'admin') {
          state.page = 'trials';
          state.navTab = 'settings';
        } else {
          state.page = 'staffList';
          state.navTab = state.role === 'teacher' ? 'students' : 'ops';
        }
        state.overlay = null;
        state.inlineCw = null;
        return renderAll();
      }
      if (action === 'switch-profile') {
        state.activeId = el.dataset.id;
        if (state.page !== 'detail') state.page = 'center';
        return renderAll();
      }
      if (action === 'open-profile') {
        state.activeId = el.dataset.id;
        state.page = 'detail';
        state.navTab = 'me';
        return renderAll();
      }
      if (action === 'add-profile') return openCreate(el.dataset.reason || '');
      if (action === 'open-edit') return openEdit();
      if (action === 'open-claim') {
        if (state.online === 'off') return showToast('离线模式下不可认领');
        if (state.profiles.length >= 10) return showToast('名下档案已达上限 (10/10)');
        return openClaimModal();
      }
      if (action === 'claim-query') return claimQuery();
      if (action === 'claim-back') { state.claim.step = 1; state.claim.error = ''; return renderAll(); }
      if (action === 'claim-confirm') return claimConfirm();
      if (action === 'open-guard') {
        if (state.online === 'off') return showToast('离线模式下不可注销档案');
        const p = activeProfile();
        if (!p) return;
        state.overlay = { type: 'guard', targetId: p.id };
        return renderAll();
      }
      if (action === 'guard-delete') return deleteProfile(el.dataset.id);
      if (action === 'contact-monitor') {
        state.overlay = null;
        renderAll();
        return showToast('已向负责班长发送课次清退协助请求');
      }
      if (action === 'open-trial') return openTrial();
      if (action === 'trial-mode') {
        state.trialForm.mode = el.dataset.mode === 'quick' ? 'quick' : 'full';
        state.trialForm.error = '';
        renderOverlayOnly();
        updateTrialPreview();
        return;
      }
      if (action === 'inline-cw-open') {
        if (state.online === 'off') return showToast('离线模式下不可更新进度');
        const target = findCwTarget(el.dataset.kind, el.dataset.id);
        const idx = Number(el.dataset.index);
        if (!target || !target.courseware || !target.courseware[idx]) return;
        state.inlineCw = { kind: el.dataset.kind, id: el.dataset.id, index: idx, text: target.courseware[idx].progressText || '' };
        renderAll();
        const input = $('inlineCwInput');
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }
        return;
      }
      if (action === 'inline-cw-cancel') {
        state.inlineCw = null;
        return renderAll();
      }
      if (action === 'inline-cw-save') return saveInlineProgress();
      if (action === 'open-bind') {
        if (state.online === 'off') return showToast('离线模式下不可绑定');
        state.bind = { targetId: el.dataset.id, email: '', error: '' };
        state.overlay = { type: 'bind' };
        renderAll();
        const input = $('bindEmail');
        if (input) input.focus();
        return;
      }
      if (action === 'submit-bind') return submitBind();
      if (action === 'staff-open') {
        state.staffKind = el.dataset.kind;
        state.staffId = el.dataset.id;
        state.page = 'staffDetail';
        return renderAll();
      }
      if (action === 'staff-tab') { state.staffTab = el.dataset.tab; return renderAll(); }
      if (action === 'staff-sort') { state.staffSort = el.dataset.sort; return renderAll(); }
      if (action === 'staff-letter-toggle') { state.staffLetterOpen = !state.staffLetterOpen; return renderAll(); }
      if (action === 'staff-letter') {
        const letter = el.dataset.letter;
        state.staffLetter = letter === state.staffLetter ? 'all' : letter;
        state.staffLetterOpen = true;
        return renderAll();
      }
      if (action === 'staff-reset') {
        state.staffQuery = '';
        state.staffTab = 'all';
        state.staffCounselor = 'all';
        state.staffLetter = 'all';
        state.staffLetterOpen = false;
        state.staffSort = 'smart';
        return renderAll();
      }
      if (action === 'trial-reset') {
        state.trialQuery = '';
        state.adminTab = 'all';
        return renderAll();
      }
      if (action === 'buy4') {
        return showToast(`已为 ${el.dataset.nick || '该学员'} 打开买 4 节 · 优先排 4 节固定位`);
      }
      if (action === 'set-admin-tab') { state.adminTab = el.dataset.tab; return renderAll(); }
      if (action === 'open-courseware') {
        if (state.online === 'off') return showToast('离线模式下不可调整课件');
        return openCourseware(el.dataset.kind, el.dataset.id);
      }
      if (action === 'open-notes') return openNotes(el.dataset.kind, el.dataset.id);
      if (action === 'save-notes') return saveNotes();
      if (action === 'cw-add') return cwAdd();
      if (action === 'cw-remove') {
        state.cw.pendingRemoveIndex = Number(el.dataset.index);
        return renderOverlayOnly();
      }
      if (action === 'cancel-cw-remove') {
        state.cw.pendingRemoveIndex = null;
        return renderOverlayOnly();
      }
      if (action === 'confirm-cw-remove') {
        const idx = state.cw.pendingRemoveIndex;
        if (idx !== null && idx !== undefined && idx >= 0 && idx < state.cw.draft.length) {
          state.cw.draft.splice(idx, 1);
        }
        state.cw.pendingRemoveIndex = null;
        return renderOverlayOnly();
      }
      if (action === 'cw-save') return cwSave();
      if (action === 'close-overlay') {
        state.overlay = null;
        return renderOverlayOnly();
      }
      if (action === 'toggle-gender') {
        state.form.gender = el.dataset.gender;
        clearProfileError();
        document.querySelectorAll('[data-action="toggle-gender"]').forEach((b) => {
          const on = b.dataset.gender === state.form.gender;
          b.className = `h-11 rounded-xl border px-2 text-[14px] font-semibold transition ${on ? 'border-indigo-500 bg-indigo-50/60 text-indigo-950 ring-1 ring-indigo-500' : 'border-slate-200 bg-slate-50/60 text-slate-700 hover:bg-slate-100'}`;
        });
        return;
      }
      if (action === 'submit-profile') return submitProfile();
      if (action === 'submit-trial') return submitTrial();
      if (action === 'copy-nick') return copyNick(el.dataset.nick);
      if (action === 'toggle-log') {
        const logId = el.dataset.logId;
        const expanded = el.dataset.open === '1';
        document.querySelectorAll(`[data-log-extra="${logId}"]`).forEach((node) => {
          node.classList.toggle('hidden', expanded);
        });
        el.dataset.open = expanded ? '0' : '1';
        el.textContent = expanded ? `展开更多（${el.dataset.more} 条）` : '收起';
        return;
      }
    });

    function renderOverlayOnly() {
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'fInitial' || id === 'fTrialInitial') {
        e.target.value = e.target.value.replace(/[^a-zA-Z]/g, '').slice(0, 1).toUpperCase();
      }
      if (id === 'fSuffix') {
        e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 3);
      }
      if (id === 'fRealName') { state.form.realName = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fEnglish') { state.form.englishName = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fInitial') { state.form.initial = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fAge') { state.form.age = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fSuffix') { state.form.suffix = e.target.value; clearProfileError(); updateProfilePreview(); }
      if (id === 'fTrialRealName') { state.trialForm.realName = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialQuickNick') { state.trialForm.quickNick = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialEnglish') { state.trialForm.englishName = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialInitial') { state.trialForm.initial = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialAge') { state.trialForm.age = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'fTrialContact') { state.trialForm.contact = e.target.value; clearTrialError(); updateTrialPreview(); }
      if (id === 'inlineCwInput' && state.inlineCw) {
        state.inlineCw.text = e.target.value.slice(0, 64);
        const cnt = $('inlineCwCount');
        if (cnt) cnt.textContent = `${state.inlineCw.text.length}/64`;
      }
      if (id.startsWith('cwProg-')) {
        const index = Number(id.split('-')[1]);
        const val = e.target.value.slice(0, 64);
        if (state.cw.draft[index]) state.cw.draft[index].progressText = val;
        const cnt = $(`cwProgCount-${index}`);
        if (cnt) cnt.textContent = `${val.length}/64`;
      }
      if (id === 'claimNickname') { state.claim.nickname = e.target.value; clearClaimError(); }
      if (id === 'claimLast4') {
        e.target.value = e.target.value.replace(/[^0-9a-zA-Z]/g, '').slice(0, 4);
        state.claim.last4 = e.target.value;
        clearClaimError();
      }
      if (id === 'bindEmail') { state.bind.email = e.target.value; clearBindError(); }
      if (id === 'notesInput') { state.noteEdit.text = e.target.value; }
      if (id === 'staffSearch') {
        state.staffQuery = e.target.value;
        const val = e.target.value;
        renderAll();
        const input = $('staffSearch');
        if (input) {
          input.focus();
          input.setSelectionRange(val.length, val.length);
        }
      }
      if (id === 'trialSearch') {
        state.trialQuery = e.target.value;
        const val = e.target.value;
        renderAll();
        const input = $('trialSearch');
        if (input) {
          input.focus();
          input.setSelectionRange(val.length, val.length);
        }
      }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'staffCounselor') {
        state.staffCounselor = e.target.value;
        renderAll();
        return;
      }
      if (id === 'avatarInput') return handleAvatar(e);
      if (id === 'cwPick') {
        state.cw.pickCw = e.target.value;
        const info = COURSEWARE_LIB.find((x) => x.id === state.cw.pickCw);
        state.cw.pickLevel = info && info.levels.length ? info.levels[0] : '';
        return renderOverlayOnly();
      }
      if (id === 'cwLevel') {
        state.cw.pickLevel = e.target.value;
        return;

    function navTo(tab) {
      if (state.role === 'parent' && tab === 'me') return setView('center');
      if (state.role === 'monitor' && tab === 'ops') return setView('staffList');
      if (state.role === 'teacher' && tab === 'students') return setView('staffList');
      if (state.role === 'admin' && tab === 'settings') return setView('trials');
      if (state.role === 'admin' && tab === 'ops') return setView('staffList');
      state.page = 'placeholder';
      state.navTab = tab;
      state.overlay = null;
      renderAll();
    }

    /* ------------------------------------------------------------------
     * 业务动作
     * ------------------------------------------------------------------ */
    function openCreate(reason = '') {
      if (state.online === 'off') return showToast('离线模式下无法创建档案');
      if (state.profiles.length >= 10) return showToast('名下档案已达上限 (10/10)');
      state.form = { ...emptyProfileForm(), reason };
      state.overlay = { type: 'profile' };
      renderAll();
      updateProfilePreview();
    }

    function openEdit() {
      if (state.online === 'off') return showToast('离线模式下无法编辑档案');
      const p = activeProfile();
      if (!p) return;
      state.form = {
        mode: 'edit', editingId: p.id,
        realName: p.realName, englishName: p.englishName, initial: p.surnameInitial,
        age: String(p.age), suffix: p.suffix || '', gender: p.gender,
        avatarDataUrl: p.avatarDataUrl || '', error: '', reason: ''
      };
      state.overlay = { type: 'profile' };
      renderAll();
      updateProfilePreview();
    }

    function openTrial() {
      if (!['admin', 'monitor'].includes(state.role)) return showToast('仅班长与平台管理员可创建试课档案');
      if (state.online === 'off') return showToast('离线模式下无法创建试课档案');
      state.trialForm = emptyTrialForm();
      state.overlay = { type: 'trial' };
      renderAll();
      updateTrialPreview();
    }

    function submitProfile() {
      const f = state.form;
      const err = profileFormError(f);
      if (err) {
        f.error = err;
        renderOverlayOnly();
        updateProfilePreview();
        return;
      }
      const nick = computeNickname(f);
      if (f.mode === 'edit') {
        const p = state.profiles.find((x) => x.id === f.editingId);
        if (!p) return;
        const before = {
          nickname: p.nickname, realName: p.realName, englishName: p.englishName,
          age: p.age, avatar: p.avatarDataUrl || ''
        };
        Object.assign(p, {
          nickname: nick, realName: f.realName.trim(), englishName: f.englishName.trim(),
          surnameInitial: f.initial.trim().toUpperCase(), age: Number(f.age),
          suffix: f.suffix.trim(), gender: f.gender,
          avatarDataUrl: f.avatarDataUrl
        });
        const by = operatorName();
        recordFieldChange(p, '规范昵称', before.nickname, p.nickname, by);
        recordFieldChange(p, '学员姓名或小名', before.realName, p.realName, by);
        recordFieldChange(p, '英文名', before.englishName, p.englishName, by);
        recordFieldChange(p, '年龄', `${before.age} 岁`, `${p.age} 岁`, by);
        if (before.avatar !== (p.avatarDataUrl || '')) {
          recordFieldChange(p, '头像', before.avatar ? '已设置头像' : '未设置头像', p.avatarDataUrl ? '已更新头像（1:1 裁切）' : '已移除头像', by);
        }
        state.overlay = null;
        renderAll();
        return showToast('档案已更新');
      }
      const p = {
        id: `sp_${Math.random().toString(36).slice(2, 11).padEnd(9, '0')}`,
        nickname: nick, realName: f.realName.trim(), englishName: f.englishName.trim(),
        surnameInitial: f.initial.trim().toUpperCase(), age: Number(f.age), suffix: f.suffix.trim(),
        gender: f.gender, tag: `宝贝 ${state.profiles.length + 1}`,
        status: 'ACTIVE', createdAt: TODAY, responsible: 'Leo',
        courseware: [],
        stats: { upcoming: 0, pendingTs: 0, completed: 0, fixed: 0, temp: 0, pendingTiers: [] },
        notes: '', audit: [],
        avatarDataUrl: f.avatarDataUrl
      };
      state.profiles.push(p);
      state.activeId = p.id;
      state.page = 'center';
      state.navTab = 'me';
      state.overlay = null;
      renderAll();
      showToast(`已创建 ${p.nickname}，并设为当前宝贝`);
    }

    function submitTrial() {
      if (!['admin', 'monitor'].includes(state.role)) return showToast('仅班长与平台管理员可创建试课档案');
      const f = state.trialForm;
      const err = trialFormError(f);
      if (err) {
        f.error = err;
        renderOverlayOnly();
        updateTrialPreview();
        return;
      }
      const isQuick = f.mode === 'quick';
      const parsed = isQuick ? parseQuickNick(f.quickNick) : null;
      const nickname = isQuick ? parsed.nickname : computeNickname(f);
      const t = {
        id: `tr_${Math.random().toString(36).slice(2, 11).padEnd(9, '0')}`,
        nickname,
        realName: isQuick ? nickname : f.realName.trim(),
        englishName: isQuick ? parsed.englishName : f.englishName.trim(),
        surnameInitial: isQuick ? parsed.initial : f.initial.trim().toUpperCase(),
        age: isQuick ? parsed.age : Number(f.age),
        gender: 'undisclosed',
        contact: f.contact.trim(),
        status: 'UNBOUND',
        createdAt: TODAY,
        lastLessonDate: null,
        trialLessons: 0,
        daysLeft: 30,
        createdBy: operatorName(),
        responsible: state.role === 'monitor' ? operatorName() : 'Leo',
        trialProgress: '待排',
        notes: '',
        courseware: [],
        audit: [{ type: 'status', at: `${TODAY} 14:32`, by: operatorName(), from: '新建', to: 'UNBOUND', reason: `${currentRoleLabel()} ${operatorName()} 创建待认领试课档案` }]
      };
      state.trials.unshift(t);
      if (state.role === 'monitor') {
        state.staffTab = 'trial';
        state.page = 'staffList';
        state.navTab = 'ops';
      } else {
        state.adminTab = 'unbound';
        state.page = 'trials';
        state.navTab = 'settings';
      }
      state.overlay = null;
      renderAll();
      showToast(`已创建待认领档案 ${t.nickname}，可前往排课`);
    }

    function enrollTrial(t) {
      const exists = state.enrolled.some((x) => x.nickname.toLowerCase() === t.nickname.toLowerCase());
      if (exists) return false;
      state.enrolled.unshift({
        id: `st_${Math.random().toString(36).slice(2, 11).padEnd(9, '0')}`,
        nickname: t.nickname, realName: t.realName, englishName: t.englishName,
        surnameInitial: t.surnameInitial, age: t.age, gender: t.gender,
        status: 'ACTIVE', createdAt: TODAY, responsible: t.responsible || operatorName(), teacher: '待安排',
        courseware: clone(t.courseware || []),
        stats: { upcoming: 0, pendingTs: 0, completed: t.trialLessons || 0, fixed: 0, temp: 0, pendingTiers: [] },
        notes: t.notes || '',
        audit: clone(t.audit || [])
      });
      return true;
    }

    function submitBind() {
      if (state.online === 'off') return showToast('离线模式下不可绑定');
      const email = state.bind.email.trim().toLowerCase();
      const fail = (msg) => {
        state.bind.error = msg;
        renderOverlayOnly();
        const input = $('bindEmail');
        if (input) input.focus();
      };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('请输入有效的家长邮箱');
      if (!REGISTERED_EMAILS.includes(email)) return fail('该邮箱尚未注册，请核对');
      const t = state.trials.find((x) => x.id === state.bind.targetId);
      if (!t || (t.status !== 'UNBOUND' && t.status !== 'TRIALING')) return fail('该档案当前不可绑定');
      const from = t.status;
      const prevParent = t.parentEmail ? `家长 ${t.parentEmail}` : '平台托管（未绑定）';
      t.status = 'ACTIVE';
      t.parentEmail = email;
      t.claimedAt = TODAY;
      recordFieldChange(t, '所属家长', prevParent, `家长 ${email}`, operatorName());
      recordStatusChange(t, from, 'ACTIVE', `管理员 ${operatorName()} 绑定家长 ${email}，档案认领转正`, operatorName());
      enrollTrial(t);
      if (state.role === 'admin' && state.page === 'trials') state.adminTab = 'active';
      state.overlay = null;
      renderAll();
      showToast(`已绑定至 ${email}，档案已认领并纳入全员学员`);
    }

    function claimQuery() {
      if (state.online === 'off') return showToast('离线模式下不可认领');
      if (state.profiles.length >= 10) return showToast('名下档案已达上限 (10/10)');
      const nick = state.claim.nickname.trim();
      const last4 = state.claim.last4.trim();
      const fail = (msg) => {
        state.claim.error = msg;
        renderAll();
      };
      if (!nick) return fail('请输入孩子的规范昵称');
      if (last4.length !== 4) return fail('请输入预留联系方式后四位');
      const t = state.trials.find((x) =>
        (x.status === 'UNBOUND' || x.status === 'TRIALING')
        && x.nickname.toLowerCase() === nick.toLowerCase()
        && x.contact.replace(/\s/g, '').toLowerCase().endsWith(last4.toLowerCase())
      );
      if (!t) return fail('未找到匹配的试课学员，请核对信息');
      state.claim.error = '';
      state.claim.step = 2;
      state.claim.matchedId = t.id;
      renderAll();
    }

    function claimConfirm() {
      if (state.online === 'off') return showToast('离线模式下不可认领');
      if (state.profiles.length >= 10) return showToast('名下档案已达上限 (10/10)');
      const t = state.trials.find((x) => x.id === state.claim.matchedId);
      if (!t) {
        state.claim.step = 1;
        state.claim.error = '未找到匹配的试课宝贝，请重新查询';
        return renderAll();
      }
      const from = t.status;
      recordFieldChange(t, '所属家长', '平台托管（未绑定）', '家长 Amy · amy@example.com', '系统');
      recordStatusChange(t, from, 'ACTIVE', '家长 Amy 通过规范昵称与预留联系方式后四位认领，绑定 amy@example.com', '系统');
      const p = {
        id: `sp_${Math.random().toString(36).slice(2, 11).padEnd(9, '0')}`,
        nickname: t.nickname, realName: t.realName, englishName: t.englishName,
        surnameInitial: t.surnameInitial, age: t.age, gender: t.gender, tag: '试课认领',
        suffix: '', status: 'ACTIVE', createdAt: TODAY, responsible: t.responsible || 'Leo',
        courseware: clone(t.courseware || []),
        stats: { upcoming: 0, pendingTs: 0, completed: t.trialLessons, fixed: 0, temp: 0, pendingTiers: [] },
        notes: t.notes || '', trialHistory: true,
        audit: clone(t.audit || [])
      };
      t.status = 'ACTIVE';
      t.parentEmail = 'amy@example.com';
      t.claimedAt = TODAY;
      enrollTrial(t);
      state.profiles.push(p);
      state.activeId = p.id;
      state.page = 'center';
      state.navTab = 'me';
      state.overlay = null;
      state.claim = { step: 1, nickname: '', last4: '', error: '', matchedId: null };
      renderAll();
      showToast(`已认领 ${p.nickname}，历史记录已并入`);
    }

    function deleteProfile(id) {
      const p = state.profiles.find((x) => x.id === id);
      if (!p) return;
      if (p.stats.pendingTs > 0 || p.stats.upcoming > 0) {
        return showToast('仍有有效课次，无法注销');
      }
      state.profiles = state.profiles.filter((x) => x.id !== id);
      state.lockedNicknames.push(p.nickname);
      if (state.activeId === id) state.activeId = state.profiles[0] ? state.profiles[0].id : '';
      state.overlay = null;
      state.page = 'center';
      state.navTab = 'me';
      renderAll();
      showToast(`${p.nickname} 已注销，昵称永久保留`);
    }

    function openNotes(kind, id) {
      if (state.online === 'off') return showToast('离线模式下不可编辑备注');
      const target = findCwTarget(kind, id);
      if (!target) return;
      if (target.status === 'ARCHIVED') return showToast('已归档档案的学员备注只读');
      state.noteEdit = { kind, id, text: target.notes || '' };
      state.overlay = { type: 'notes' };
      renderAll();
      const input = $('notesInput');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function saveNotes() {
      if (state.online === 'off') return showToast('离线模式下不可保存备注');
      const target = findCwTarget(state.noteEdit.kind, state.noteEdit.id);
      if (!target) {
        state.overlay = null;
        return renderAll();
      }
      const text = state.noteEdit.text.trim();
      const before = target.notes || '';
      state.overlay = null;
      if (before === text) {
        renderAll();
        return showToast('学员备注未变更');
      }
      target.notes = text;
      recordFieldChange(target, '学员备注', before, text, operatorName());
      renderAll();
      showToast('学员备注已保存');
    }

    function openCourseware(kind, id) {
      const target = findCwTarget(kind, id);
      if (!target) return;
      if (kind === 'trial' && target.status === 'ARCHIVED') return showToast('已归档档案不可调整课件');
      if (state.role === 'parent') {
        if (kind !== 'profile') return;
        if (target.status === 'UNBOUND') return showToast('待认领试课档案由负责班长或平台管理员维护');
        if (target.status !== 'ACTIVE') return showToast('仅可调整本人名下在读孩子的在学课件');
      }
      state.cw = {
        targetKind: kind,
        targetId: id,
        draft: clone(target.courseware || []),
        pickCw: '',
        pickLevel: '',
        pendingRemoveIndex: null
      };
      state.overlay = { type: 'courseware' };
      renderAll();
    }

    function cwAdd() {
      const cw = state.cw;
      if (state.online === 'off') return showToast('离线模式下不可调整课件');
      if (cw.draft.length >= 6) return showToast('每个学员最多配置 6 门在学课件');
      if (!cw.pickCw || !cw.pickLevel) return showToast('请选择课件与级别');
      if (cw.draft.some((d) => d.cwId === cw.pickCw)) return showToast('该课件已在在学列表中');
      const newItem = {
        cwId: cw.pickCw,
        level: cw.pickLevel,
        progressText: '',
        lastUpdatedAt: TODAY,
        lastUpdatedBy: operatorName(),
        lastUpdatedRole: currentRoleLabel(),
        teacherUpdates: state.role === 'teacher' ? { [operatorName()]: 1 } : {}
      };
      cw.draft.push(newItem);
      cw.pickCw = '';
      cw.pickLevel = '';
      renderOverlayOnly();
    }

    function cwSave() {
      if (state.online === 'off') return showToast('离线模式下不可保存课件');
      const cw = state.cw;
      const target = findCwTarget(cw.targetKind, cw.targetId);
      if (!target) return;
      const beforeList = clone(target.courseware || []);
      const beforeSnap = coursewareSnapshot(beforeList);
      const nextDraft = clone(cw.draft).map((item, idx) => {
        const old = beforeList.find((b) => b.cwId === item.cwId);
        const changed = !old || old.level !== item.level || (old.progressText || '') !== (item.progressText || '');
        if (!changed) return item;
        const updates = clone(item.teacherUpdates || {});
        if (state.role === 'teacher') {
          updates[operatorName()] = (Number(updates[operatorName()]) || 0) + 1;
        }
        return {
          ...item,
          progressText: (item.progressText || '').trim().slice(0, 64),
          lastUpdatedAt: TODAY,
          lastUpdatedBy: operatorName(),
          lastUpdatedRole: currentRoleLabel(),
          teacherUpdates: updates
        };
      });
      const afterSnap = coursewareSnapshot(nextDraft);
      if (beforeSnap === afterSnap && beforeList.length === nextDraft.length) {
        state.overlay = null;
        renderAll();
        return showToast('在学课件未变更');
      }
      target.courseware = nextDraft;
      recordFieldChange(target, '在学课件与学习进度', beforeSnap, afterSnap, operatorName());
      state.overlay = null;
      renderAll();
      showToast(state.role === 'parent'
        ? '已保存并同步，已提醒负责班长与有待上课次的授课老师'
        : `在学课件已保存，共 ${nextDraft.length} 门，已同步至老师日历与家长端`);
    }

    function saveInlineProgress() {
      if (state.online === 'off') return showToast('离线模式下不可保存进度');
      const icw = state.inlineCw;
      if (!icw) return;
      const target = findCwTarget(icw.kind, icw.id);
      if (!target || !target.courseware || !target.courseware[icw.index]) {
        state.inlineCw = null;
        return renderAll();
      }
      const item = target.courseware[icw.index];
      const cwInfo = cwById(item.cwId);
      const before = item.progressText || '';
      const after = (icw.text || '').trim().slice(0, 64);
      state.inlineCw = null;
      if (before === after) {
        renderAll();
        return showToast('学习进度未变更');
      }
      item.progressText = after;
      item.lastUpdatedAt = TODAY;
      item.lastUpdatedBy = operatorName();
      item.lastUpdatedRole = currentRoleLabel();
      item.teacherUpdates = item.teacherUpdates || {};
      if (state.role === 'teacher') {
        item.teacherUpdates[operatorName()] = (Number(item.teacherUpdates[operatorName()]) || 0) + 1;
      }
      recordFieldChange(target, `学习进度 (${cwInfo.nameEn})`, before || '暂未记录', after || '已清空', operatorName());
      renderAll();
      showToast(state.role === 'parent'
        ? '学习进度已更新，已提醒负责班长与授课老师'
        : '学习进度已更新并记入档案变动日志');
    }

    function handleAvatar(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
        e.target.value = '';
        return showToast('仅支持 JPG / PNG / WebP');
      }
      if (file.size > 2 * 1024 * 1024) {
        e.target.value = '';
        return showToast('图片不能超过 2MB');
      }
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 240;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const min = Math.min(img.width, img.height);
          const sx = (img.width - min) / 2;
          const sy = (img.height - min) / 2;
          ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
          const url = canvas.toDataURL('image/webp', 0.85);
          state.form.avatarDataUrl = url;
          const preview = $('avatarPreview');
          const initial = $('avatarInitial');
          if (preview) {
            preview.src = url;
            preview.classList.remove('hidden');
          }
          if (initial) initial.classList.add('hidden');
          showToast('照片已裁剪为 1:1');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function copyNick(nick) {
      try {
        await navigator.clipboard.writeText(nick);
        showToast('规范昵称已复制');
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = nick;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('规范昵称已复制');
      }
    }

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

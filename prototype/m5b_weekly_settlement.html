    /* ------------------------------------------------------------------
     * 管理员：老师周课酬结算看板
     * ------------------------------------------------------------------ */
    function settlementRank(t) {
      // 默认排序：含非常规请假的标红行置顶（含已打款）→ 其余待打款 → 已打款沉底
      if (unusualOf(t).abnormal) return 0;
      if (t.status !== 'PAID') return 1;
      return 2;
    }

    function filteredTeachers() {
      const q = state.search.trim().toLowerCase();
      const order = new Map(state.teachers.map((t, i) => [t.id, i]));
      const rows = state.teachers.filter((t) => {
        const statusOk = state.statusFilter === 'ALL' || t.status === state.statusFilter;
        const searchOk = !q || t.name.toLowerCase().includes(q);
        const anomalyOk = !state.anomalyOnly || unusualOf(t).abnormal;
        return statusOk && searchOk && anomalyOk;
      });
      // 当前筛选结果内全部已录内部单价时才按应发金额比较，否则统一回退为结课节数
      const amountReady = rows.length > 0 && rows.every((t) => refOf(t) !== null);
      return rows.sort((a, b) => {
        const rankDiff = settlementRank(a) - settlementRank(b);
        if (rankDiff) return rankDiff;
        const aValue = amountReady ? refOf(a) : totalOf(a);
        const bValue = amountReady ? refOf(b) : totalOf(b);
        if (bValue !== aValue) return bValue - aValue;
        // 稳定排序：数值相同保持原始录入顺序
        return order.get(a.id) - order.get(b.id);
      });
    }

    function refTotalSummary() {
      return state.teachers.reduce((sum, t) => sum + (refOf(t) || 0), 0);
    }

    function gridView() {
      const pending = state.teachers.filter((t) => t.status !== 'PAID').length;
      const paid = state.teachers.length - pending;
      const abnormalCount = state.teachers.filter((t) => unusualOf(t).abnormal).length;
      const refSum = refTotalSummary();
      const filters = [['ALL', '全部'], ['DRAFT', '待核对'], ['PENDING_PAYOUT', '待发薪'], ['PAID', '已打款']]
        .map(([key, label]) => `<button data-action="status-filter" data-filter="${key}" class="h-8 shrink-0 whitespace-nowrap rounded-full px-3 text-[12px] transition ${state.statusFilter === key ? 'bg-slate-900 font-semibold text-white' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${label}</button>`).join('');

        </div>

        <div class="mt-2 rounded-xl border border-slate-200 bg-white px-2.5 py-2">

            <label class="flex items-center gap-1.5 text-[12px] font-semibold text-slate-700">
              <span>内部单价</span>
              <input type="number" min="0" step="1" data-rate-id="${t.id}" ${paid ? 'disabled' : ''} value="${hasInternalRate(t) ? esc(t.internalRate) : ''}" placeholder="选填" class="h-8 w-20 rounded-lg border border-slate-200 bg-slate-50/70 px-2 font-mono text-[14px] font-semibold text-slate-900 outline-none focus:border-indigo-500 focus:bg-white disabled:bg-slate-100 disabled:text-slate-600">

        return `<button data-action="release" data-id="${t.id}" ${off ? 'disabled' : ''} class="${base} border border-amber-300 bg-amber-100 text-amber-900 hover:bg-amber-200/70 disabled:cursor-not-allowed disabled:opacity-40">放行待发薪</button>

    function releaseDraft(id) {
      if (state.online === 'off') return toast('离线模式下不可放行');
      const t = teacherById(id);
      if (!t || t.status !== 'DRAFT') return;
      t.status = 'PENDING_PAYOUT';
      t.statusHistory = t.statusHistory || [];
      t.statusHistory.push({ from: 'DRAFT', to: 'PENDING_PAYOUT', actor: 'Sarah (管理员)', time: '11-10 09:30', note: '管理员确认放行进入待发薪池' });
      renderAll();
      toast(`${t.name} 已放行至待发薪`);
    }

      const t = teacherById(id);
      if (!t || t.status === 'PAID') return;
      t.internalRate = value === '' ? '' : Number(value);

      document.querySelectorAll(`[data-ref-id="${id}"]`).forEach((el) => {
        el.textContent = ref !== null ? `${fmt(ref)} 积分` : '仅展示节数';
      });
      document.querySelectorAll(`[data-ref-hint-id="${id}"]`).forEach((el) => {

            ? `<div class="space-y-2">${t.stream.map((s) => streamRow(s, true)).join('')}</div>`

          ${t.taken.length ? `<div class="rounded-2xl border border-slate-200 bg-slate-50 px-3.5 py-2.5">
            <div class="text-[12px] font-medium text-slate-700">当周被代课记录（${t.taken.length} 节，不计入课酬）</div>
            <div class="mt-2 space-y-1.5">
              ${t.taken.map((x) => `<div class="flex items-center justify-between gap-2 text-[12px]">
                <span class="text-slate-700"><span class="font-mono">${x.date}</span> ${x.time} · ${esc(x.student)}</span>

            ? `<div class="flex items-start gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-[12px] font-medium leading-relaxed text-slate-700">

              ? `<div class="flex gap-2">
                  <button data-action="adjust" data-id="${t.id}" ${off ? 'disabled' : ''} class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40">添加差额调整项</button>
                  <button data-action="release" data-id="${t.id}" ${off ? 'disabled' : ''} class="h-11 flex-1 rounded-xl bg-indigo-600 text-[14px] font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">放行待发薪</button>

                  <button data-action="pay" data-id="${t.id}" ${off ? 'disabled' : ''} class="h-11 flex-1 rounded-xl bg-indigo-600 text-[14px] font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">标记为已打款</button>

    }

    /* ------------------------------------------------------------------
     * 打款弹窗

    function openPaid(id) {
      if (state.online === 'off') return toast('离线模式下不可标记打款');
      state.paidId = id;
      state.voucher = null;
      state.note = '';
      state.warnNote = '';
      state.warnPushed = false;
      state.modal = 'paid';
      renderModal();
      ico();
    }

    function paidModal() {
      const t = teacherById(state.paidId);
      if (!t) return '';
      const v = state.voucher;
      const ref = refOf(t);
      return modalShell(`<div class="flex items-start justify-between gap-2 border-b border-slate-200 px-4 py-3">
        <div class="min-w-0">
          <h3 class="text-[16px] font-bold text-slate-900">标记为已打款</h3>

        </div>
        <button data-action="close-modal" class="grid h-8 w-8 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-700">${icon('x', 'h-4 w-4')}</button>
      </div>
      <div class="space-y-2.5 p-3.5">
        <div class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5">
          <div class="flex items-center justify-between text-[12px]"><span class="font-medium text-slate-600">总节数</span><span class="font-bold text-slate-900">${totalOf(t)} 节</span></div>
          <div class="mt-1.5 flex items-center justify-between text-[12px]"><span class="font-medium text-slate-600">试算总积分（仅管理员可见）</span><span class="font-mono text-[14px] font-bold text-slate-900">${ref !== null ? `${fmt(ref)} 积分` : '未录内部单价'}</span></div>
          <div class="mt-1.5 flex items-center justify-between text-[12px]"><span class="font-medium text-slate-600">非常规请假</span><span class="font-mono font-semibold ${unusualOf(t).abnormal ? 'text-rose-700' : 'text-slate-700'}">&lt;3h ${unusualOf(t).lt3h} · 3~24h ${unusualOf(t).h3to24h} 节</span></div>
        </div>
        <div>
          <div class="mb-1 flex items-center justify-between gap-2">
            <span class="text-[14px] font-semibold text-slate-700">打款凭证（可选）</span>
            <span class="text-[12px] font-medium text-slate-600">图片压缩 · PDF ≤10MB</span>
          </div>
          ${v
            ? `<div class="flex items-center gap-2 rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
                <div class="grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-white text-indigo-600 ring-1 ring-slate-200">${icon(v.kind === 'pdf' ? 'file-text' : 'image', 'h-5 w-5')}</div>
                <div class="min-w-0 flex-1">
                  <div class="truncate text-[12px] font-semibold text-slate-900">${esc(v.name)}</div>
                  <div class="text-[12px] font-medium text-slate-600">${v.kind === 'pdf' ? 'PDF 凭证 · 未超过 10MB' : '图片已在客户端等比例压缩'}</div>
                </div>
                <button data-action="remove-voucher" class="shrink-0 text-[12px] font-semibold text-slate-600 hover:text-rose-700">移除</button>
              </div>`
            : `<div class="rounded-xl border border-dashed border-slate-300 bg-slate-50/70 p-2.5">
                <div class="flex items-center gap-1.5 text-[12px] font-medium text-slate-600">
                  ${icon('upload-cloud', 'h-4 w-4 shrink-0 text-slate-600')}支持 JPG / PNG / WebP / PDF，也可不上传直接确认
                </div>
                <div class="mt-2 grid grid-cols-2 gap-1.5">
                  <button data-action="mock-voucher" data-kind="image" class="h-9 rounded-lg border border-indigo-200 bg-white text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-50">上传图片</button>
                  <button data-action="mock-voucher" data-kind="pdf" class="h-9 rounded-lg border border-slate-300 bg-white text-[12px] font-bold text-slate-800 transition hover:bg-slate-50">上传 PDF</button>
                </div>
              </div>`}
        </div>
        <label class="block">
          <div class="mb-1 flex items-center justify-between"><span class="text-[14px] font-semibold text-slate-700">打款备注 / 警告说明（选填）</span><span id="warnNoteCount" class="text-[12px] font-medium text-slate-600">${state.warnNote.length}/200</span></div>
          <textarea id="warnNoteInput" rows="2" maxlength="200" placeholder="选填，写入课酬单不可变快照" class="h-[56px] w-full resize-none rounded-xl border border-slate-200 bg-slate-50/70 p-3 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">${esc(state.warnNote)}</textarea>
        </label>
        <label class="flex items-start gap-2 rounded-xl border border-slate-200 bg-slate-50/70 px-3 py-2.5">
          <input id="warnPushInput" type="checkbox" ${state.warnPushed ? 'checked' : ''} class="mt-0.5 h-4 w-4 shrink-0 accent-indigo-600">
          <span class="text-[12px] font-medium leading-relaxed text-slate-700">同步向老师推送端内警告消息</span>
        </label>
        <div class="flex items-start gap-2 rounded-xl border border-slate-200 bg-slate-50/70 px-3 py-2.5 text-[12px] leading-relaxed text-slate-700">
          ${icon('mail-check', 'mt-0.5 h-4 w-4 shrink-0 text-indigo-600')}
          <span>确认后将默认向老师发送端内普通消息及发薪通知 Email。</span>
        </div>
        <div class="flex items-start gap-2 rounded-xl border border-amber-300 bg-amber-50 px-3 py-2.5 text-[12px] leading-relaxed text-amber-900">
          ${icon('triangle-alert', 'mt-0.5 h-4 w-4 shrink-0 text-amber-700')}
          <span>确认后本周全部课次 TS 更新为已结算并冻结，不可撤销。</span>
        </div>
      </div>
      <div class="flex gap-2 border-t border-slate-200 px-4 py-3">
        <button data-action="close-modal" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 hover:bg-slate-50">取消</button>
        <button id="btnPaid" data-action="confirm-paid" class="h-11 flex-1 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700">确认已完成打款</button>
      </div>`);
    }

    function mockVoucher(kind) {
      state.voucher = kind === 'pdf'
        ? { kind: 'pdf', name: `payout-${WEEK.code}.pdf`, meta: 'PDF · 1.8MB' }
        : { kind: 'image', name: `payout-${WEEK.code}.jpg`, meta: 'JPG · 已压缩' };
      renderModal();
      ico();
      toast(kind === 'pdf' ? '已模拟上传 PDF 打款凭证' : '已模拟上传图片凭证并完成压缩');
    }

    function removeVoucher() {
      state.voucher = null;
      renderModal();
      ico();
    }

    function previewVoucher(id) {
      const t = teacherById(id);
      if (!t) return;
      const name = t.voucher ? t.voucher.name : (t.txn || '打款凭证');
      toast(`凭证预览：${name}（原型模拟）`);
    }

    function confirmPaid() {
      if (state.online === 'off') return toast('离线模式下不可标记打款');
      const t = teacherById(state.paidId);
      if (!t) return;
      const warnNote = state.warnNote.trim();
      if (warnNote.length > 200) return;
      const prevStatus = t.status;
      t.status = 'PAID';
      t.voucher = state.voucher ? { ...state.voucher } : null;
      t.voucherRef = state.voucher ? state.voucher.name : '';
      t.note = warnNote;
      t.warnNote = warnNote;
      t.warnPushed = state.warnPushed;
      t.statusHistory = t.statusHistory || [];
      t.statusHistory.push({
        from: prevStatus,
        to: 'PAID',
        actor: 'Sarah (管理员)',
        time: '11-11 15:00',
        note: `线下发薪确认已打款${t.voucher ? `（附凭证 ${t.voucher.name}）` : ''}，关联 TS 已物理冻结${warnNote ? `；备注：${warnNote}` : ''}`
      });
      state.modal = null;
      state.paidId = null;
      state.voucher = null;
      state.note = '';
      state.warnNote = '';
      state.warnPushed = false;
      renderAll();
      toast('已标记打款，本周全部 TS 已结算并冻结；已发送发薪通知');
    }

    /* ------------------------------------------------------------------
     * 差额调整弹窗
     * ------------------------------------------------------------------ */
    function openAdjust(id) {
      if (state.online === 'off') return toast('离线模式下不可差额调整');
      const t = teacherById(id);
      if (!t || t.status === 'PAID') return;
      state.adjustId = id;
      state.adjustDir = t.adjust < 0 ? '-' : '+';
      state.adjustCount = Math.max(1, Math.abs(t.adjust));
      state.adjustReason = t.adjustReason || '';
      state.adjustRef = t.adjustRef || '';
      state.modal = 'adjust';
      renderModal();
      ico();
    }

    function adjustModal() {
      const t = teacherById(state.adjustId);
      if (!t) return '';
      const base = t.regular + t.sub + t.group;
      const delta = (state.adjustDir === '+' ? 1 : -1) * state.adjustCount;
      const next = base + delta;
      const curRef = refOf(t);
      const nextRef = hasInternalRate(t) ? Number(t.internalRate) * next + 10 * t.prep : null;
      const reasonOk = state.adjustReason.trim().length >= 1 && state.adjustReason.trim().length <= 200;
      const valid = reasonOk;
      return modalShell(`<div class="flex items-start justify-between gap-2 border-b border-slate-200 px-4 py-3">
        <div class="min-w-0">
          <h3 class="text-[16px] font-bold text-slate-900">添加差额调整项</h3>
          <p class="mt-0.5 truncate text-[12px] font-medium text-slate-600">${esc(t.name)} · ${WEEK.code}</p>
        </div>
        <button data-action="close-modal" class="grid h-8 w-8 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-700">${icon('x', 'h-4 w-4')}</button>
      </div>
      <div class="space-y-3 p-4">
        <div class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[12px]">
          <div class="flex items-center justify-between"><span class="font-medium text-slate-600">当前</span><span class="font-mono font-semibold text-slate-800">${totalOf(t)} 节${curRef !== null ? ` / ${fmt(curRef)} 积分` : ''}</span></div>
        </div>
        <div>
          <span class="mb-1 block text-[14px] font-semibold text-slate-700">调整类型</span>
          <div class="grid grid-cols-2 gap-1 rounded-xl bg-slate-200/60 p-1">
            <button data-action="adjust-dir" data-dir="+" class="rounded-lg px-1 py-1.5 text-[14px] font-semibold transition ${state.adjustDir === '+' ? 'bg-white text-slate-900' : 'text-slate-600'}">补发节数 (+)</button>
            <button data-action="adjust-dir" data-dir="-" class="rounded-lg px-1 py-1.5 text-[14px] font-semibold transition ${state.adjustDir === '-' ? 'bg-white text-slate-900' : 'text-slate-600'}">扣减节数 (-)</button>
          </div>
        </div>
        <div>
          <span class="mb-1 block text-[14px] font-semibold text-slate-700">调整节数</span>
          <div class="flex items-center gap-2">
            <button data-action="adjust-step" data-step="-1" class="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-white text-[16px] text-slate-700 hover:bg-slate-50">-</button>
            <div id="adjustCount" class="flex-1 rounded-xl border border-slate-200 bg-white py-2 text-center font-mono text-[16px] font-semibold text-slate-900">${state.adjustDir === '-' ? '-' : ''}${state.adjustCount}</div>
            <button data-action="adjust-step" data-step="1" class="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-white text-[16px] text-slate-700 hover:bg-slate-50">+</button>
          </div>
        </div>
        <div class="rounded-xl border border-slate-200 px-3 py-2 text-[12px]">
          <div class="flex items-center justify-between"><span class="font-medium text-slate-600">调整后总节数</span><span id="adjustPreviewTotal" class="font-mono font-semibold text-slate-900">${next} 节</span></div>
          <div class="mt-1 flex items-center justify-between"><span class="font-medium text-slate-600">调整后试算总积分</span><span id="adjustPreviewRef" class="font-mono font-semibold text-slate-900">${nextRef !== null ? `${fmt(nextRef)} 积分` : '未录内部单价'}</span></div>
          <div class="mt-1.5 text-[12px] font-medium leading-relaxed ${state.adjustDir === '+' ? 'text-indigo-700' : 'text-rose-700'}">${state.adjustDir === '+' ? '补发节数将联动增加本期总节数并重算试算积分（若有内部单价）。' : '扣减节数将从本期节数中扣减。'}</div>
        </div>
        <label class="block">
          <div class="mb-1 flex items-center justify-between"><span class="text-[14px] font-semibold text-slate-700">调整原因 <span class="text-rose-500">*</span></span><span id="reasonCount" class="text-[12px] font-medium text-slate-600">${state.adjustReason.length}/200</span></div>
          <textarea id="adjustReasonInput" rows="3" maxlength="200" placeholder="例如 负向扣减 2026-W44 非常规请假 1 节 / 正向备课补贴依据" class="h-[88px] w-full resize-none rounded-xl border border-slate-200 bg-slate-50/70 p-3 text-[16px] leading-relaxed text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">${esc(state.adjustReason)}</textarea>
        </label>
        <label class="block">
          <div class="mb-1 flex items-center justify-between"><span class="text-[14px] font-semibold text-slate-700">审批凭单号（选填）</span><span id="refCount" class="text-[12px] font-medium text-slate-600">${state.adjustRef.length}/50</span></div>
          <input id="adjustRefInput" value="${esc(state.adjustRef)}" maxlength="50" placeholder="选填，例如 #AP8842" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 px-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/15">
        </label>
        <div class="flex items-start gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[12px] leading-relaxed text-slate-700">
          ${icon('info', 'mt-0.5 h-4 w-4 shrink-0 text-indigo-600')}
          <span>调整只作用于当前账期，不改历史已打款周。</span>
        </div>
      </div>
      <div class="flex gap-2 border-t border-slate-200 px-4 py-3">
        <button data-action="close-modal" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 hover:bg-slate-50">取消</button>
        <button id="btnAdjust" data-action="confirm-adjust" ${valid ? '' : 'disabled'} class="h-11 flex-1 rounded-xl bg-indigo-600 text-[16px] font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">确认调整</button>
      </div>`);
    }

    function setAdjustDir(dir) { state.adjustDir = dir; renderModal(); ico(); }

    function stepAdjust(delta) {
      const t = teacherById(state.adjustId);
      if (!t) return;
      const base = t.regular + t.sub + t.group;
      const max = state.adjustDir === '-' ? base : 99;
      state.adjustCount = Math.max(1, Math.min(max, state.adjustCount + Number(delta)));
      const signed = (state.adjustDir === '+' ? 1 : -1) * state.adjustCount;
      const next = base + signed;
      const countEl = $('adjustCount');
      if (countEl) countEl.textContent = `${state.adjustDir === '-' ? '-' : ''}${state.adjustCount}`;
      const totalEl = $('adjustPreviewTotal');
      if (totalEl) totalEl.textContent = `${next} 节`;
      const refEl = $('adjustPreviewRef');
      if (refEl) refEl.textContent = hasInternalRate(t) ? `${fmt(Number(t.internalRate) * next + 10 * t.prep)} 积分` : '未录内部单价';
    }

    function confirmAdjust() {
      if (state.online === 'off') return toast('离线模式下不可差额调整');
      const t = teacherById(state.adjustId);
      const reason = state.adjustReason.trim();
      const ref = state.adjustRef.trim();
      if (!t || t.status === 'PAID' || !reason || ref.length > 50) return;
      const delta = (state.adjustDir === '+' ? 1 : -1) * state.adjustCount;
      t.adjust = delta;
      t.adjustReason = reason;
      t.adjustRef = ref;
      state.modal = null;
      state.adjustId = null;
      state.adjustDir = '+';
      state.adjustCount = 1;
      state.adjustReason = '';
      state.adjustRef = '';
      renderAll();
      toast(`已添加差额调整 ${delta > 0 ? '+' : ''}${delta} 节`);
    }

    /* ------------------------------------------------------------------
     * 弹窗外壳
     * ------------------------------------------------------------------ */
    function modalShell(inner) {
      return `<div class="absolute inset-0 z-[70] flex items-center justify-center p-4">
        <div data-action="close-modal" class="absolute inset-0 bg-slate-900/60 backdrop-blur-[1px]"></div>
        <div class="relative max-h-full w-full max-w-[360px] overflow-y-auto rounded-3xl border border-slate-200 bg-white shadow-2xl">${inner}</div>
      </div>`;
    }

    function m5aModal() {
      const o = M5A_ORDERS[state.m5aOrderId] || {
        id: state.m5aOrderId || 'tro_leo00001',
        week: WEEK.code,
        leader: 'Leo (班长)',
        amount: '3,420 积分',
        lessons: 62,
        status: '已审核入账 (APPROVED)',
        paidAt: '11-09 18:40',
        voucherName: 'm5a-leo-w45-bank.jpg',
        note: '银行转账已到账，资金归集核销完成'
      };
      return modalShell(`<div class="flex items-start justify-between gap-2 border-b border-slate-200 px-4 py-3">
        <div class="min-w-0">
          <h3 class="text-[16px] font-bold text-slate-900">M5A 班长转账单穿透预览</h3>
          <p class="mt-0.5 truncate font-mono text-[12px] font-medium text-slate-600">${esc(o.id)}</p>
        </div>
        <button data-action="close-modal" class="grid h-8 w-8 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-700">${icon('x', 'h-4 w-4')}</button>
      </div>
      <div class="space-y-2.5 p-4 text-[12px]">
        <div class="rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-2 font-semibold text-emerald-800">资金链路已闭环：${esc(o.status)}</div>
        <div class="space-y-1.5 rounded-xl border border-slate-200 bg-slate-50/70 p-3">
          <div class="flex items-center justify-between"><span class="text-slate-600">负责班长</span><span class="font-semibold text-slate-900">${esc(o.leader)}</span></div>
          <div class="flex items-center justify-between"><span class="text-slate-600">归集账期</span><span class="font-mono font-semibold text-slate-900">${esc(o.week)}</span></div>
          <div class="flex items-center justify-between"><span class="text-slate-600">归集课次</span><span class="font-mono font-semibold text-slate-900">${o.lessons} 节</span></div>
          <div class="flex items-center justify-between"><span class="text-slate-600">转账实收</span><span class="font-mono font-bold text-slate-900">${esc(o.amount)}</span></div>
          <div class="flex items-center justify-between"><span class="text-slate-600">打款时间</span><span class="font-mono text-slate-700">${esc(o.paidAt)}</span></div>
          <div class="flex items-center justify-between"><span class="text-slate-600">凭证附件</span><span class="font-mono font-semibold text-indigo-700">${esc(o.voucherName)}</span></div>
        </div>
        <p class="text-[12px] font-medium leading-relaxed text-slate-600">${esc(o.note)}</p>
      </div>
      <div class="flex gap-2 border-t border-slate-200 px-4 py-3">
        <button data-action="close-modal" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 hover:bg-slate-50">关闭</button>
        <a href="m5a_transfer_collection.html?role=sarah&order=${encodeURIComponent(o.id)}" target="_blank" rel="noopener" class="flex h-11 flex-1 items-center justify-center gap-1 rounded-xl bg-indigo-600 text-[14px] font-semibold text-white hover:bg-indigo-700">打开 M5A 页面${icon('external-link', 'h-3.5 w-3.5')}</a>
      </div>`);
    }

    function leaderQrModal() {
      const t = teacherByKey(roleMeta().teacherKey) || state.teachers[0];
      const leader = (t && t.leader) || { name: 'Leo', wechat: 'dream_leo_01' };
      return modalShell(`<div class="flex items-start justify-between gap-2 border-b border-slate-200 px-4 py-3">
        <div class="min-w-0">
          <h3 class="text-[16px] font-bold text-slate-900">联系负责班长</h3>
          <p class="mt-0.5 truncate text-[12px] font-medium text-slate-600">核对当周出勤节数与排课异常</p>
        </div>
        <button data-action="close-modal" class="grid h-8 w-8 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-700">${icon('x', 'h-4 w-4')}</button>
      </div>
      <div class="flex flex-col items-center p-5 text-center">
        <div class="grid h-44 w-44 place-items-center rounded-2xl border border-slate-200 bg-slate-50 p-3">
          <div class="grid h-full w-full grid-cols-5 grid-rows-5 gap-1 rounded-xl bg-white p-2.5 ring-1 ring-slate-200">
            <span class="col-span-2 row-span-2 rounded bg-slate-900"></span>
            <span class="rounded bg-slate-300"></span>
            <span class="col-span-2 row-span-2 rounded bg-slate-900"></span>
            <span class="rounded bg-slate-800"></span>
            <span class="rounded bg-slate-300"></span>
            <span class="rounded bg-slate-900"></span>
            <span class="rounded bg-slate-800"></span>
            <span class="rounded bg-slate-300"></span>
            <span class="rounded bg-slate-900"></span>
            <span class="col-span-2 row-span-2 rounded bg-slate-900"></span>
            <span class="rounded bg-slate-800"></span>
            <span class="rounded bg-slate-900"></span>
            <span class="rounded bg-slate-300"></span>
            <span class="rounded bg-slate-800"></span>
            <span class="rounded bg-slate-900"></span>
          </div>
        </div>
        <div class="mt-3 text-[14px] font-bold text-slate-900">负责班长：${esc(leader.name)}</div>
        <div class="mt-0.5 font-mono text-[12px] font-medium text-slate-600">微信号：${esc(leader.wechat)}</div>
        <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-600">微信扫码添加或复制微信号联系班长核实节数</p>
      </div>
      <div class="border-t border-slate-200 px-4 py-3">
        <button data-action="close-modal" class="h-11 w-full rounded-xl bg-indigo-600 text-[14px] font-semibold text-white hover:bg-indigo-700">关闭</button>
      </div>`);
    }

    function renderModal() {
      const root = $('modalRoot');
      if (state.modal === 'paid') root.innerHTML = paidModal();
      else if (state.modal === 'adjust') root.innerHTML = adjustModal();
      else if (state.modal === 'm5a') root.innerHTML = m5aModal();
      else if (state.modal === 'leaderQr') root.innerHTML = leaderQrModal();
      else root.innerHTML = '';
    }

    function closeModal() {
      state.modal = null;
      state.paidId = null;
      state.adjustId = null;
      state.m5aOrderId = null;
      state.voucher = null;
      state.note = '';
      state.warnNote = '';
      state.warnPushed = false;
      state.adjustDir = '+';
      state.adjustCount = 1;
      state.adjustReason = '';
      state.adjustRef = '';
      renderModal();
      ico();
    }

    /* ------------------------------------------------------------------
     * 其他 Tab 占位
     * ------------------------------------------------------------------ */
    function renderPlaceholder() {
      const item = (NAVS[state.role] || []).find((n) => n.id === state.navTab);
      if (!item) return '<div class="p-8 text-center text-[14px] font-medium text-slate-600">页面不存在</div>';
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">前往${esc(item.label)}</a>` : ''}
        <button data-action="nav" data-tab="${roleMeta().boardTab}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回课酬单</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 事件委托
     * ------------------------------------------------------------------ */
    function handleAction(el) {
      const action = el.dataset.action;
      const id = el.dataset.id;
      if (action === 'role') return setRole(el.dataset.role);
      if (action === 'device') return setDevice(el.dataset.device);
      if (action === 'online') return setOnline(el.dataset.online);
      if (action === 'reset') return resetPrototype();
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'status-filter') return setStatusFilter(el.dataset.filter || 'ALL');
      if (action === 'toggle-anomaly-filter') return toggleAnomalyFilter();
      if (action === 'toggle-attendance') { state.attendanceOpen = !state.attendanceOpen; renderAll(); return; }
      if (action === 'export-grid') return exportGrid();
      if (action === 'download') return downloadSlip(id);
      if (action === 'detail') return openAdminDetail(id);
      if (action === 'close-detail') return closeAdminDetail();
      if (action === 'open-sheet-detail') return openTeacherDetail();
      if (action === 'close-sheet-detail') return closeTeacherDetail();
      if (action === 'release') return releaseDraft(id);
      if (action === 'pay') return openPaid(id);
      if (action === 'adjust') return openAdjust(id);
      if (action === 'preview-m5a') { state.m5aOrderId = el.dataset.order || 'tro_leo00001'; state.modal = 'm5a'; renderModal(); ico(); return; }
      if (action === 'open-leader-qr') { state.modal = 'leaderQr'; renderModal(); ico(); return; }
      if (action === 'mock-voucher') return mockVoucher(el.dataset.kind || 'image');
      if (action === 'remove-voucher') return removeVoucher();
      if (action === 'preview-voucher') return previewVoucher(id);
      if (action === 'close-modal') return closeModal();
      if (action === 'adjust-dir') return setAdjustDir(el.dataset.dir);
      if (action === 'adjust-step') return stepAdjust(el.dataset.step);
      if (action === 'confirm-paid') return confirmPaid();
      if (action === 'confirm-adjust') return confirmAdjust();
      if (action === 'toast') return toast(el.dataset.message || '');
    }

    document.getElementById('console').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (el) handleAction(el);
    });

    document.getElementById('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (el) handleAction(el);
    });

    document.getElementById('frame').addEventListener('input', (event) => {
      const target = event.target;
      if (target.dataset && target.dataset.rateId) { onRateInput(target.dataset.rateId, target.value); return; }
      if (target.id === 'teacherSearch') { onSearch(target.value); return; }
      if (target.id === 'warnNoteInput') {
        state.warnNote = target.value;
        const warnCount = $('warnNoteCount');
        if (warnCount) warnCount.textContent = `${state.warnNote.length}/200`;
        return;
      }
      if (target.id === 'warnPushInput') { state.warnPushed = target.checked; return; }
      if (target.id === 'adjustReasonInput') {
        state.adjustReason = target.value;
        const count = $('reasonCount');
        if (count) count.textContent = `${state.adjustReason.length}/200`;
        updateAdjustButton();
        return;
      }
      if (target.id === 'adjustRefInput') {
        state.adjustRef = target.value;
        const count = $('refCount');
        if (count) count.textContent = `${state.adjustRef.length}/50`;
        updateAdjustButton();
      }
    });

    function updateAdjustButton() {
      const btn = $('btnAdjust');
      if (!btn) return;
      const reasonOk = state.adjustReason.trim().length >= 1 && state.adjustReason.trim().length <= 200;
      const refOk = state.adjustRef.trim().length <= 50;
      btn.disabled = !(reasonOk && refOk);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

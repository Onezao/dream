      const el = $('toast');

        </button>
        ${state.takenOpen ? `<div class="space-y-2 border-t border-slate-200 bg-white px-3.5 py-2.5">
          ${t.taken.map((x) => `<div class="flex items-start justify-between gap-2">
            <div>
              <div class="text-[12px] font-semibold text-slate-700"><span class="font-mono">${x.date}</span> ${x.dow} <span class="font-mono font-normal text-slate-600">${x.time}</span></div>

            </div>
            <span class="shrink-0 rounded border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-semibold text-slate-700">接代 ${esc(x.by)}</span>

    /* ------------------------------------------------------------------
     * 管理员：教师周课酬结算看板

    function filteredTeachers() {
      const q = state.search.trim().toLowerCase();
      return state.teachers.filter((t) => {
        const statusOk = state.statusFilter === 'ALL' || t.status === state.statusFilter;
        const searchOk = !q || t.name.toLowerCase().includes(q);
        return statusOk && searchOk;
      });
    }

    function gridView() {
      const pending = state.teachers.filter((t) => t.status !== 'PAID').length;
      const paid = state.teachers.length - pending;
      const refSum = state.teachers.reduce((sum, t) => sum + refOf(t), 0);
      const filters = [['ALL', '全部'], ['PENDING_SETTLEMENT', '待发薪'], ['PAID', '已打款']]
        .map(([key, label]) => `<button data-action="status-filter" data-filter="${key}" class="shrink-0 rounded-lg border px-2.5 py-1 text-[12px] font-semibold transition ${state.statusFilter === key ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-300'}">${label}</button>`).join('');

      return `<div class="mx-auto w-full max-w-[720px] space-y-3 p-4 pb-10">
        ${pageHeader('教师周课酬结算', '只出节数 · 参考金额仅供线下转账参考', '管理员')}

          </div>
          <div class="flex flex-wrap items-center gap-1.5">
            ${filters}
            <label class="relative min-w-[120px] flex-1">
              ${icon('search', 'absolute left-3 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-slate-500')}
              <input id="teacherSearch" value="${esc(state.search)}" placeholder="搜索教师" class="h-11 w-full rounded-lg border border-slate-200 bg-white pl-8 pr-2 text-[16px] text-slate-800 outline-none transition focus:border-indigo-500">
            </label>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-x-2 gap-y-1 rounded-xl border border-slate-200/80 bg-white px-3 py-2 text-[12px] font-semibold leading-none text-slate-600 shadow-sm">

        <div id="gridBody">${gridBody()}</div>
        <p class="px-1 text-[12px] leading-relaxed text-slate-600">共 ${state.teachers.length} 位教师 · 参考金额 = 定级课酬 × 总节数 + 备课费率 × 备课节数；仅供线下转账核对，不作为教师端展示值。</p>
      </div>`;
    }

    function setStatusFilter(filter) {
      state.statusFilter = filter;
      renderAll();
      resetScroll();
    }

    function onSearch(value) {
      state.search = value;
      const body = $('gridBody');
      if (body) {
        body.innerHTML = gridBody();
        ico();
      }
    }

    function gridBody() {
      const rows = filteredTeachers();
      if (!rows.length) {
        return `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center">
          <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-slate-50 text-slate-300">${icon('search-x', 'h-6 w-6')}</div>
          <p class="mt-3 text-[14px] font-bold text-slate-700">没有匹配的教师</p>
          <p class="mt-0.5 text-[12px] font-medium text-slate-600">请调整筛选条件或搜索关键字</p>
        </div>`;
      }
      return state.device === 'tablet' ? gridTable(rows) : `<div class="space-y-2.5">${rows.map(gridCard).join('')}</div>`;
    }

    function gridTable(rows) {
      return `<div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm">
        <table class="w-full min-w-[680px] table-fixed border-collapse text-left">
          <thead class="border-b border-slate-200 bg-slate-50 text-[12px] font-bold text-slate-600">
            <tr>
              <th class="w-[140px] px-2 py-2.5">教师</th>
              <th class="w-[42px] px-1 py-2.5 text-center">1v1</th>
              <th class="w-[42px] px-1 py-2.5 text-center">代课</th>
              <th class="w-[42px] px-1 py-2.5 text-center">备课</th>
              <th class="w-[42px] px-1 py-2.5 text-center">小班</th>
              <th class="w-[48px] px-1 py-2.5 text-center">总计</th>
              <th class="w-[86px] px-1 py-2.5 text-right">参考金额</th>
              <th class="w-[88px] px-1.5 py-2.5">状态</th>
              <th class="w-[140px] px-2 py-2.5 text-right">操作</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            ${rows.map((t) => `<tr class="transition hover:bg-slate-50/70">
              <td class="px-2 py-2.5">
                <div class="flex min-w-0 items-center gap-1.5">
                  <div class="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-slate-100 text-[12px] font-bold text-slate-700">${esc(t.name.charAt(0))}</div>
                  <div class="min-w-0">
                    <div class="truncate text-[14px] font-bold text-slate-900">${esc(t.name)}</div>
                    <div class="text-[12px] font-medium text-slate-600">定级 ${esc(t.level)}</div>
                  </div>
                </div>
              </td>
              <td class="px-1 py-2.5 text-center font-mono text-[14px] text-slate-700">${t.regular}</td>
              <td class="px-1 py-2.5 text-center font-mono text-[14px] ${t.sub ? 'font-bold text-slate-900' : 'text-slate-700'}">${t.sub}</td>
              <td class="px-1 py-2.5 text-center font-mono text-[14px] text-slate-700">${t.prep}</td>
              <td class="px-1 py-2.5 text-center font-mono text-[14px] text-slate-700">${t.group}</td>
              <td class="px-1 py-2.5 text-center">
                <div class="font-mono text-[14px] font-bold text-slate-900">${totalOf(t)}</div>
                ${t.adjust !== 0 ? `<div class="text-[12px] font-semibold text-amber-800">含调整 ${t.adjust > 0 ? '+' : ''}${t.adjust}</div>` : ''}
              </td>
              <td class="px-1 py-2.5 text-right font-mono text-[12px] font-semibold text-slate-700">${fmt(refOf(t))}</td>
              <td class="px-1.5 py-2.5">${statusChip(t.status)}${t.txn ? `<div class="mt-0.5 max-w-[82px] truncate font-mono text-[12px] font-medium text-slate-600" title="${esc(t.txn)}">${esc(t.txn)}</div>` : ''}</td>
              <td class="px-2 py-2.5"><div class="flex justify-end gap-1">${rowActionsTable(t)}</div></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    }

    function gridCard(t) {
      const paid = t.status === 'PAID';
      const card = paid ? 'border-slate-200 bg-white' : 'border-amber-300 bg-amber-50/50';
      const cellBg = paid ? 'bg-slate-50' : 'bg-white';
      return `<article class="rounded-2xl border p-3.5 shadow-sm ${card}">
        <div class="flex items-start justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2">
            <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-slate-100 text-[12px] font-bold text-slate-700">${esc(t.name.charAt(0))}</div>
            <div class="min-w-0">
              <div class="truncate text-[14px] font-bold text-slate-900">${esc(t.name)}</div>
              <div class="text-[12px] font-medium text-slate-600">定级 ${esc(t.level)}</div>
            </div>
          </div>
          ${statusChip(t.status)}
        </div>

        <div class="mt-2.5 grid grid-cols-5 gap-1 text-center">
          ${miniCount('1v1', t.regular, cellBg)}
          ${miniCount('代课', t.sub, cellBg, true)}
          ${miniCount('备课', t.prep, cellBg)}
          ${miniCount('小班', t.group, cellBg)}
          <div class="rounded-lg ${cellBg} py-1"><div class="text-[12px] font-medium text-slate-600">总计</div><div class="font-mono text-[14px] font-bold text-slate-900">${totalOf(t)}</div></div>
        </div>

        <div class="mt-2.5 flex items-center justify-between gap-2 border-t border-slate-200 pt-2">
          <div class="min-w-0 text-[12px] font-medium text-slate-600">参考金额 <span class="font-mono text-[14px] font-bold text-slate-900">${fmt(refOf(t))}</span><span class="ml-1">· 仅供线下</span></div>
          <div class="flex shrink-0 gap-1">${rowActions(t)}</div>
        </div>
        ${t.txn ? `<div class="mt-1 truncate font-mono text-[12px] font-medium text-slate-600">${esc(t.txn)}</div>` : ''}
      </article>`;
    }

    function miniCount(label, value, cellBg, emphasize = false) {
      return `<div class="rounded-lg ${cellBg} py-1">
        <div class="text-[12px] font-medium text-slate-600">${label}</div>
        <div class="font-mono text-[14px] ${emphasize && value ? 'font-bold' : 'font-semibold'} text-slate-900">${value}${emphasize && value ? '<span class="ml-0.5 inline-block h-1.5 w-1.5 rounded-full bg-purple-600 align-middle"></span>' : ''}</div>
      </div>`;
    }

    function rowActions(t) {
      const off = state.online === 'off';
      const base = 'h-7 shrink-0 whitespace-nowrap rounded-lg px-2 text-[12px] font-semibold transition';
      const secondary = `${base} border border-slate-300 bg-white text-slate-800 hover:bg-slate-50`;
      if (t.status === 'PAID') {
        return `<button data-action="download" data-id="${t.id}" class="${secondary}">对账单</button>
                <button data-action="detail" data-id="${t.id}" class="${secondary}">明细</button>`;
      }
      return `<button data-action="pay" data-id="${t.id}" ${off ? 'disabled' : ''} class="${base} bg-indigo-600 text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">打款</button>
              <button data-action="adjust" data-id="${t.id}" ${off ? 'disabled' : ''} class="${secondary} disabled:cursor-not-allowed disabled:opacity-40">调整</button>
              <button data-action="detail" data-id="${t.id}" class="${secondary}">明细</button>`;
    }

    function rowActionsTable(t) {
      const off = state.online === 'off';
      const base = 'h-7 shrink-0 whitespace-nowrap rounded-lg px-2 text-[12px] font-semibold transition';
      const secondary = `${base} border border-slate-300 bg-white text-slate-800 hover:bg-slate-50`;
      if (t.status === 'PAID') {
        return `<button data-action="download" data-id="${t.id}" class="${secondary}">对账单</button>
                <button data-action="detail" data-id="${t.id}" class="${secondary}">明细</button>`;
      }
      return `<button data-action="pay" data-id="${t.id}" ${off ? 'disabled' : ''} class="${base} bg-indigo-600 text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">打款</button>

              <button data-action="detail" data-id="${t.id}" class="${secondary}">明细</button>`;

      if (state.device === 'phone') {
        return `<div class="space-y-2">
          ${f.contributions.map((c) => `<div class="rounded-2xl border border-slate-200/80 bg-white p-3 shadow-sm">

    /* ------------------------------------------------------------------

    function openAdjust(id) {
      if (state.online === 'off') return toast('离线模式下不可差额调整');
      const t = teacherById(id);
      if (!t || t.status === 'PAID') return;
      state.adjustId = id;
      state.adjustDir = t.adjust < 0 ? '-' : '+';
      state.adjustCount = Math.max(1, Math.abs(t.adjust));
      state.adjustReason = t.adjustReason || '';
      state.adjustRef = t.adjustRef || '';
      state.modal = 'adjust';
      renderModal();
      ico();
    }

    function adjustModal() {
      const t = teacherById(state.adjustId);
      if (!t) return '';
      const base = t.regular + t.sub + t.group;
      const delta = (state.adjustDir === '+' ? 1 : -1) * state.adjustCount;
      const next = base + delta;
      const nextRef = t.rate * next + t.prepRate * t.prep;
      const reasonOk = state.adjustReason.trim().length >= 1 && state.adjustReason.trim().length <= 200;
      const refOk = state.adjustRef.trim().length >= 1 && state.adjustRef.trim().length <= 50;
      const valid = reasonOk && refOk;
      return modalShell(`<div class="flex items-start justify-between gap-2 border-b border-slate-200 px-4 py-3">
        <div class="min-w-0">
          <h3 class="text-[16px] font-bold text-slate-900">差额调整</h3>

            <button data-action="adjust-dir" data-dir="-" class="rounded-lg py-1.5 text-[14px] font-semibold transition ${state.adjustDir === '-' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">扣减</button>

          </div>
        </div>
        <div class="rounded-xl border border-slate-200 px-3 py-2 text-[12px]">
          <div class="flex items-center justify-between"><span class="font-medium text-slate-600">调整后总节数</span><span id="adjustPreviewTotal" class="font-mono font-semibold text-slate-900">${next} 节</span></div>
          <div class="mt-1 flex items-center justify-between"><span class="font-medium text-slate-600">调整后参考金额</span><span id="adjustPreviewRef" class="font-mono font-semibold text-slate-900">${fmt(nextRef)}</span></div>

    function setAdjustDir(dir) { state.adjustDir = dir; renderModal(); ico(); }

    function stepAdjust(delta) {
      const t = teacherById(state.adjustId);
      if (!t) return;
      const base = t.regular + t.sub + t.group;
      const max = state.adjustDir === '-' ? base : 99;
      state.adjustCount = Math.max(1, Math.min(max, state.adjustCount + Number(delta)));
      const signed = (state.adjustDir === '+' ? 1 : -1) * state.adjustCount;
      const next = base + signed;
      const countEl = $('adjustCount');
      if (countEl) countEl.textContent = `${state.adjustDir === '-' ? '-' : ''}${state.adjustCount}`;
      const totalEl = $('adjustPreviewTotal');
      if (totalEl) totalEl.textContent = `${next} 节`;
      const refEl = $('adjustPreviewRef');
      if (refEl) refEl.textContent = fmt(t.rate * next + t.prepRate * t.prep);
    }

    function confirmAdjust() {
      if (state.online === 'off') return toast('离线模式下不可差额调整');
      const t = teacherById(state.adjustId);
      const reason = state.adjustReason.trim();
      const ref = state.adjustRef.trim();
      if (!t || t.status === 'PAID' || !reason || !ref) return;
      const delta = (state.adjustDir === '+' ? 1 : -1) * state.adjustCount;
      t.adjust = delta;
      t.adjustReason = reason;
      t.adjustRef = ref;
      state.modal = null;
      state.adjustId = null;
      state.adjustDir = '+';
      state.adjustCount = 1;
      state.adjustReason = '';
      state.adjustRef = '';
      renderAll();
      toast(`已添加差额调整 ${delta > 0 ? '+' : ''}${delta} 节`);
    }

    /* ------------------------------------------------------------------
     * 弹窗外壳
     * ------------------------------------------------------------------ */
    function modalShell(inner) {
      return `<div class="absolute inset-0 z-[70] flex items-center justify-center p-4">
        <div data-action="close-modal" class="absolute inset-0 bg-slate-900/60 backdrop-blur-[1px]"></div>
        <div class="relative max-h-full w-full max-w-sm overflow-y-auto rounded-3xl border border-slate-200 bg-white shadow-2xl">${inner}</div>
      </div>`;
    }

    function renderModal() {
      const root = $('modalRoot');
      if (state.modal === 'paid') root.innerHTML = paidModal();
      else if (state.modal === 'adjust') root.innerHTML = adjustModal();
      else root.innerHTML = '';
    }

    function closeModal() {
      state.modal = null;
      state.paidId = null;
      state.adjustId = null;
      state.txn = '';
      state.note = '';
      state.adjustDir = '+';
      state.adjustCount = 1;
      state.adjustReason = '';
      state.adjustRef = '';
      renderModal();
      ico();
    }

    /* ------------------------------------------------------------------
     * 其他 Tab 占位
     * ------------------------------------------------------------------ */
    function renderPlaceholder() {
      const item = (NAVS[state.role] || []).find((n) => n.id === state.navTab);
      if (!item) return '<div class="p-8 text-center text-[14px] font-medium text-slate-600">页面不存在</div>';
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white shadow-sm">前往${esc(item.label)}</a>` : ''}
        <button data-action="nav" data-tab="${roleMeta().boardTab}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回周结算</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 事件委托
     * ------------------------------------------------------------------ */
    function handleAction(el) {
      const action = el.dataset.action;
      const id = el.dataset.id;
      if (action === 'role') return setRole(el.dataset.role);
      if (action === 'view') return setView(el.dataset.view);
      if (action === 'device') return setDevice(el.dataset.device);
      if (action === 'online') return setOnline(el.dataset.online);
      if (action === 'reset') return resetPrototype();
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'status-filter') return setStatusFilter(el.dataset.filter || 'ALL');
      if (action === 'fee-tab') { state.feeTab = el.dataset.tab || 'teacher'; renderAll(); return; }
      if (action === 'toggle-taken') { state.takenOpen = !state.takenOpen; renderAll(); return; }
      if (action === 'export-grid') return exportGrid();
      if (action === 'export-fee') return exportFee();
      if (action === 'download') return downloadSlip(id);
      if (action === 'detail') return openDetail(id);
      if (action === 'pay') { if (state.detailId) closeDetail(); return openPaid(id); }
      if (action === 'adjust') { if (state.detailId) closeDetail(); return openAdjust(id); }
      if (action === 'close-detail') return closeDetail();
      if (action === 'close-modal') return closeModal();
      if (action === 'adjust-dir') return setAdjustDir(el.dataset.dir);
      if (action === 'adjust-step') return stepAdjust(el.dataset.step);
      if (action === 'confirm-paid') return confirmPaid();
      if (action === 'confirm-adjust') return confirmAdjust();
      if (action === 'toast') return toast(el.dataset.message || '');
    }

    document.getElementById('console').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (el) handleAction(el);
    });

    document.getElementById('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (el) handleAction(el);
    });

    document.getElementById('frame').addEventListener('input', (event) => {
      const target = event.target;
      if (target.id === 'teacherSearch') { onSearch(target.value); return; }
      if (target.id === 'txnInput') {
        state.txn = target.value;
        const count = $('txnCount');
        if (count) count.textContent = `${state.txn.length}/100`;
        const btn = $('btnPaid');
        if (btn) btn.disabled = !(state.txn.trim().length >= 1 && state.txn.trim().length <= 100);
        return;
      }
      if (target.id === 'noteInput') { state.note = target.value; return; }
      if (target.id === 'adjustReasonInput') {
        state.adjustReason = target.value;
        const count = $('reasonCount');
        if (count) count.textContent = `${state.adjustReason.length}/200`;
        updateAdjustButton();
        return;
      }
      if (target.id === 'adjustRefInput') {
        state.adjustRef = target.value;
        const count = $('refCount');
        if (count) count.textContent = `${state.adjustRef.length}/50`;
        updateAdjustButton();
      }
    });

    function updateAdjustButton() {
      const btn = $('btnAdjust');
      if (!btn) return;
      const reasonOk = state.adjustReason.trim().length >= 1 && state.adjustReason.trim().length <= 200;
      const refOk = state.adjustRef.trim().length >= 1 && state.adjustRef.trim().length <= 50;
      btn.disabled = !(reasonOk && refOk);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

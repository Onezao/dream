      const isToday = dayKey === 0;
      const abnormal = dayAbnormalTotal(dayKey);
      const backRole = state.role === 'admin' ? 'admin' : 'monitor';
      return `<div id="content" class="min-h-0 flex-1 overflow-y-auto overscroll-contain bg-white">
        <div class="border-b border-slate-200 bg-white px-3 pb-2 pt-1.5">
          <div class="flex items-center justify-between gap-2">
            <a href="m0_workspace_home.html?role=${backRole}&view=ops" class="flex h-8 items-center gap-0.5 text-[12px] font-semibold text-indigo-600">${icon('chevron-left', 'h-4 w-4')}返回教务中心</a>
            <span class="text-[12px] font-medium text-slate-600">${isToday ? `当前 ${DAY_NOW}` : `${dayWeekday(dayKey)} ${fmtSlash(dayDate(dayKey))}`}</span>
          </div>
          <div class="mt-1.5 grid grid-cols-5 gap-1.5">
            ${DAY_PILLS.map((pill) => {
              const on = pill.value === dayKey;
              return `<button data-action="day-date" data-value="${pill.value}" class="h-9 rounded-lg border text-center transition ${on ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}">
                <span class="block text-[12px] font-bold leading-tight">${pill.label}</span>
                <span class="block font-mono text-[12px] font-medium leading-tight ${on ? 'text-white/80' : 'text-slate-600'}">${fmtSlash(dayDate(pill.value))}</span>
              </button>`;
            }).join('')}
          </div>
          <div class="mt-2 flex flex-wrap items-center gap-1.5">
            ${daySeg('day-mode', [{ value: 'teacher', label: '按老师' }, { value: 'student', label: '按学员' }], state.dayMode)}
            ${daySeg('day-filter', [{ value: 'all', label: '全部' }, { value: 'abnormal', label: `${isToday ? '今日异常' : '当日异常'} (${abnormal})` }], state.dayFilter)}
            ${state.dayMode === 'teacher' ? daySeg('day-scope', [{ value: 'managed', label: '仅看我管的' }, { value: 'all', label: '全平台老师' }], state.dayScope) : ''}
          </div>
          <div class="mt-2 flex items-center gap-1.5">
            <div class="relative min-w-0 flex-1">
              <span class="pointer-events-none absolute left-2 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-3.5 w-3.5')}</span>
              <input data-day-search value="${esc(state.daySearch)}" placeholder="搜索老师姓名 / 学员小名" class="h-9 w-full rounded-lg border border-slate-200 bg-slate-50 pl-7 pr-2 text-[12px] font-medium text-slate-800 outline-none focus:border-indigo-400 focus:bg-white">
            </div>
            ${state.daySearch ? `<button data-action="day-clear-search" class="h-9 shrink-0 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-800">清空</button>` : ''}
          </div>
          ${daySearchConflictHint(dayKey) ? `<div class="mt-1.5 flex items-start gap-1 rounded-lg border border-amber-300 bg-amber-50 px-2 py-1.5 text-[12px] font-semibold leading-relaxed text-amber-900">${icon('triangle-alert', 'h-3.5 w-3.5 shrink-0')}<span>${esc(daySearchConflictHint(dayKey))}，该时段无空闲，请换一位老师或切换全平台老师</span></div>` : ''}
        </div>
        ${state.dayCompare ? renderDayCompareBanner() : ''}
        <div class="px-3 pb-3 pt-2">${renderDayGrid(dayKey)}</div>
      </div>`;
    }

    function renderDayCompareBanner() {
      const incident = state.dayIncident;
      const teacher = incident ? teacherName(incident.key) : '';
      return `<div class="flex items-center justify-between gap-2 border-b border-indigo-200 bg-indigo-50 px-3 py-2">
        <span class="min-w-0 truncate text-[12px] font-bold text-indigo-800">同屏对照 · ${esc(teacher)} ${incident ? incident.time : ''} 空闲老师</span>
        <button data-action="day-compare-off" class="shrink-0 rounded-lg border border-indigo-200 bg-white px-2 py-1 text-[12px] font-semibold text-indigo-700">退出对照</button>
      </div>`;
    }

    function renderDayGrid(dayKey) {
      const cols = dayColumns(dayKey);
      if (state.dayFilter === 'abnormal' && !cols.length) {
        return `<div class="rounded-xl border border-slate-300 bg-slate-50/70 px-4 py-6 text-center">
          <p class="text-[14px] font-bold text-slate-900">${dayKey === 0 ? '今日暂无待处理调度异常' : '当日暂无待处理调度异常'}</p>
          <button data-action="day-filter" data-value="all" class="mt-2 h-9 rounded-lg border border-slate-300 bg-white px-3 text-[12px] font-semibold text-slate-800">查看全部</button>
        </div>`;
      }
      if (!cols.length) {
        return `<div class="rounded-xl border border-slate-300 bg-slate-50/70 px-4 py-6 text-center">
          <p class="text-[14px] font-bold text-slate-900">未找到匹配的老师或学员</p>
          <button data-action="day-clear-search" class="mt-2 h-9 rounded-lg border border-slate-300 bg-white px-3 text-[12px] font-semibold text-slate-800">一键清空</button>
        </div>`;
      }
      const compareEmpty = state.dayCompare && cols.length === 1;
      return `<section class="overflow-hidden rounded-xl border border-slate-200/80 bg-white" aria-label="日调度课表">
        <div class="overflow-x-auto overscroll-x-contain">
          <div class="flex min-w-max">
            <div class="sticky left-0 z-20 w-10 shrink-0 border-r border-slate-200 bg-white">
              <div class="flex h-14 items-center justify-center border-b border-slate-200 bg-slate-50 font-mono text-[12px] font-semibold text-slate-500">时间</div>
              ${DAY_TIMES.map((time) => renderDayAxisCell(dayKey, time)).join('')}
            </div>
            <div class="flex">
              ${cols.map((col) => renderDayColumn(dayKey, col)).join('')}
            </div>
          </div>
        </div>
      </section>
      ${compareEmpty ? '<p class="mt-2 rounded-lg border border-amber-300 bg-amber-50 px-2.5 py-2 text-[12px] font-semibold text-amber-900">该时段暂无全部空闲的可接手老师</p>' : ''}
      <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-600">仅展示课表调度信息，列区可横向滑动查看全部老师或学员。</p>`;
    }

    function renderDayAxisCell(dayKey, time) {
      const past = dayKey === 0 && toMin(time) + 30 <= DAY_NOW_MIN;
      const nowSlot = dayKey === 0 && dayNowInSlot(time);
      return `<div class="relative flex h-7 items-center justify-center border-b border-slate-100 font-mono text-[12px] font-medium ${past ? 'text-slate-500 opacity-60' : 'text-slate-600'}">
        ${time}
        ${nowSlot ? '<span class="absolute right-0.5 top-3/4 h-1.5 w-1.5 -translate-y-1/2 rounded-full bg-rose-600"></span>' : ''}
      </div>`;
    }

    function renderDayColumn(dayKey, col) {
      return `<div class="w-[92px] shrink-0 border-r border-slate-200 last:border-r-0">
        <div class="flex h-14 flex-col justify-center border-b border-slate-200 bg-slate-50 px-1">
          <div class="flex items-center gap-1">
            <span class="truncate text-[12px] font-bold text-slate-900">${esc(col.title)}</span>
            ${col.count ? `<span class="shrink-0 rounded-full bg-rose-50 px-1 text-[12px] font-bold leading-none text-rose-700">🔴 ${col.count}</span>` : ''}
          </div>
          ${col.meta
            ? `<span class="truncate text-[12px] font-semibold ${col.meta.taught ? 'text-emerald-700' : 'text-slate-600'}">${col.meta.taught ? '教过' : '未教过'} · ${esc(col.meta.tierText)}</span>
               <span class="truncate text-[12px] font-medium text-slate-600">本周已排 ${col.meta.load} 节</span>`
            : `<span class="truncate text-[12px] font-medium text-slate-600">${esc(col.subtitle)}</span>`}
        </div>
        ${DAY_TIMES.map((time) => renderDayColumnCell(dayKey, col, time)).join('')}
      </div>`;
    }

    function renderDayColumnCell(dayKey, col, time) {
      const past = dayKey === 0 && toMin(time) + 30 <= DAY_NOW_MIN;
      const nowSlot = dayKey === 0 && dayNowInSlot(time);
      const item = col.mode === 'teacher'
        ? dayTeacherItem(dayKey, col.key, time)
        : dayStudentItem(dayKey, col.key, time);
      const free = col.mode === 'teacher' && !item && dayFreeAt(dayKey, col.key, time);
      let cls = 'border-transparent bg-white';
      let inner = '';
      if (item && item.sub) {
        cls = 'border-blue-300 bg-blue-50 text-blue-900';
        inner = `<span class="truncate text-[12px] font-bold leading-none">${esc(teacherShort(item.sub))}</span>`;
      } else if (item && item.type === 'pendingSub') {
        cls = 'border-rose-300 bg-rose-50 text-rose-700';
        inner = '<span class="text-[12px] font-bold leading-none">🔴 待代</span>';
      } else if (item && item.type === 'nearChange') {
        if (item.badge === 'free') {
          cls = 'border-emerald-200 bg-emerald-50 text-emerald-800';
          inner = '<span class="text-[12px] font-bold leading-none">约</span><span class="absolute right-0 top-0 text-[12px] leading-none">⚡</span>';
        } else {
          cls = 'border-purple-300 bg-purple-50 text-purple-900';
          inner = '<span class="text-[12px] font-bold leading-none">🟣 代课</span><span class="absolute right-0 top-0 text-[12px] leading-none">⚡</span>';
        }
      } else if (item) {
        cls = item.type === 'temp' ? 'border-yellow-300 bg-yellow-50 text-yellow-900' : 'border-amber-300 bg-amber-50 text-amber-900';
        const text = col.mode === 'teacher' ? studentShort(item.student) : teacherShort(item.teacher);
        inner = `<span class="truncate text-[12px] font-bold leading-none">${esc(text)}</span>`;
      } else if (free) {
        cls = 'border-emerald-200 bg-emerald-50 text-emerald-800';
        inner = '<span class="text-[12px] font-bold leading-none">约</span>';
      }
      const attrs = item
        ? `data-action="day-cell" data-day="${dayKey}" data-mode="${col.mode}" data-key="${esc(col.key)}" data-time="${time}"`
        : `data-action="day-empty" data-time="${time}"`;
      const labelText = item ? `${col.title} ${time} 排课` : `${col.title} ${time} ${free ? '空闲可约' : '无排课'}`;
      return `<div class="relative h-7 w-full border-b border-slate-100 p-px ${past ? 'opacity-60' : ''}">
        <button ${attrs} class="relative flex h-full w-full min-w-0 items-center justify-center overflow-hidden rounded-md border px-0.5 leading-none transition active:scale-95 ${cls}" aria-label="${esc(labelText)}">
          ${inner}
          ${nowSlot ? '<span class="pointer-events-none absolute inset-x-0 top-3/4 border-t-2 border-rose-500"></span>' : ''}
        </button>
      </div>`;
    }

    function dayAlertLine(item) {
      if (item.sub) return `✅ 已指派 ${teacherShort(item.sub)} 代课`;
      if (item.type === 'pendingSub') return item.note ? `🔴 ${item.note}` : '🔴 待代 · 尚未指派代课';
      if (item.type === 'nearChange') return `⚡ ${item.note || '距开课不足 3 小时的临期变动'}`;
      return `${TYPE_NAME[item.type] || '课次'} · ${STUDENTS[item.student].nick} · ${TEACHERS[item.teacher].short}`;
    }

    function renderDayCandidates(cell, candidates) {
      if (!candidates.length) {
        return '<div class="mt-2 rounded-xl border border-amber-300 bg-amber-50 px-3 py-2 text-[12px] font-semibold leading-relaxed text-amber-900">该时段暂无全部空闲的可接手老师</div>';
      }
      return `<div class="mt-2 rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[12px] font-semibold text-slate-600">推荐空闲代课老师</span>
          <span class="shrink-0 text-[12px] font-medium text-slate-600">熟客 → 同/相近价位 → 负荷</span>
        </div>
        <div class="mt-1.5 space-y-1.5">
          ${candidates.map((candidate) => `<button data-action="day-assign" data-key="${candidate.key}" class="flex min-h-12 w-full items-center gap-2 rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-left transition hover:bg-slate-50">
            <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg bg-slate-100 text-[12px] font-bold text-slate-700">${TEACHERS[candidate.key].initial}</span>
            <span class="min-w-0 flex-1">
              <span class="flex items-center gap-1">
                <span class="truncate text-[14px] font-bold text-slate-900">${esc(TEACHERS[candidate.key].name)}</span>
                <span class="shrink-0 rounded bg-slate-100 px-1 py-0.5 text-[12px] font-semibold text-slate-700">${TEACHERS[candidate.key].tierLabel}</span>
                ${candidate.taught ? '<span class="shrink-0 rounded border border-emerald-200 bg-emerald-50 px-1 py-0.5 text-[12px] font-bold text-emerald-700">教过该学员</span>' : ''}
              </span>
              <span class="block truncate text-[12px] font-medium text-slate-600">${esc(candidate.tierText)} · 本周已排 ${candidate.load} 节 · 空闲 ${candidate.free} 节</span>
            </span>
            <span class="shrink-0 rounded-lg bg-indigo-600 px-2 py-1 text-[12px] font-bold text-white">指派</span>
          </button>`).join('')}
        </div>
      </div>`;
    }

    function renderDaySheet() {
      const cell = state.dayCell;
      if (!cell) return '';
      const item = cell.mode === 'teacher'
        ? dayTeacherItem(cell.dayKey, cell.key, cell.time)
        : dayStudentItem(cell.dayKey, cell.key, cell.time);
      const when = `${dayWeekday(cell.dayKey)} ${fmtSlash(dayDate(cell.dayKey))} ${cell.time} - ${endTime(cell.time)}`;
      if (!item) return `${sheetHeader('时段详情', when)}<p class="text-[14px] font-medium text-slate-700">该时段暂无排课。</p>`;
      const pending = item.type === 'pendingSub' && !item.sub;
      const near = item.type === 'nearChange';
      const student = STUDENTS[item.student] || STUDENTS.alice;
      const teacher = TEACHERS[item.teacher] || TEACHERS.david;
      const candidates = pending ? dayCandidates(cell.dayKey, item.teacher, cell.time) : [];
      return `${sheetHeader(pending ? '待指派代课' : (near ? '临期变动' : '课次详情'), when)}
        <div class="rounded-xl border px-3 py-2 ${pending ? 'border-rose-200 bg-rose-50' : near ? 'border-purple-200 bg-purple-50' : 'border-slate-300 bg-slate-50/70'}">
          <p class="text-[14px] font-bold leading-snug ${pending ? 'text-rose-800' : near ? 'text-purple-900' : 'text-slate-900'}">${esc(dayAlertLine(item))}</p>
          <p class="mt-1 text-[12px] font-medium leading-relaxed ${pending ? 'text-rose-700' : near ? 'text-purple-800' : 'text-slate-600'}">${esc(student.nick)} · 任课 ${esc(teacher.short)} · ${cell.mode === 'teacher' ? '按老师视角' : '按学员视角'}</p>
        </div>
        ${pending ? renderDayCandidates(cell, candidates) : ''}
        ${pending ? `<button data-action="day-compare" class="mt-2 flex h-10 w-full items-center justify-center gap-1 rounded-xl border text-[14px] font-semibold transition ${state.dayCompare ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-300 bg-white text-slate-800'}">🔍 同屏对照空闲老师${state.dayCompare ? ' · 已开启' : ''}</button>` : ''}
        <div class="mt-2 flex gap-1.5">
          ${cell.mode === 'teacher' ? `
            ${item.type === 'pendingSub' ? '' : `<button data-action="day-proxy-teacher-leave" class="flex h-10 min-w-0 flex-1 items-center justify-center whitespace-nowrap rounded-lg border border-slate-300 bg-white px-1 text-[14px] font-semibold text-slate-800">代老师请假</button>`}
            <button data-action="day-proxy-leave" class="flex h-10 min-w-0 flex-1 items-center justify-center whitespace-nowrap rounded-lg border border-slate-300 bg-white px-1 text-[14px] font-semibold text-slate-800">代学员请假</button>
            <button data-action="day-week" class="flex h-10 min-w-0 flex-1 items-center justify-center whitespace-nowrap rounded-lg border border-slate-300 bg-white px-1 text-[14px] font-semibold text-slate-800">老师课表</button>
          ` : `
            <button data-action="day-proxy-leave" class="flex h-10 min-w-0 flex-1 items-center justify-center whitespace-nowrap rounded-lg border border-slate-300 bg-white px-1 text-[14px] font-semibold text-slate-800">代 ${esc(student.nick)} 请假</button>
            <button data-action="day-week" class="flex h-10 min-w-0 flex-1 items-center justify-center whitespace-nowrap rounded-lg border border-slate-300 bg-white px-1 text-[14px] font-semibold text-slate-800">学员课表</button>
          `}
        </div>`;
    }

    function handleDayCell(dayKey, mode, key, time) {
      const item = mode === 'teacher' ? dayTeacherItem(dayKey, key, time) : dayStudentItem(dayKey, key, time);
      if (!item) {
        showToast('该时段暂无排课');
        return;
      }
      state.dayCell = { dayKey: Number(dayKey), mode, key, time, teacher: item.teacher };
      state.dayCompare = false;
      if (item.type === 'pendingSub' && !item.sub && mode === 'teacher') {
        state.dayIncident = { key: item.teacher, time };
      }
      state.drawer = 'day';
      render(true);
    }

    function assignDaySub(teacherKey) {
      const cell = state.dayCell;
      if (!cell) return;
      const item = cell.mode === 'teacher'
        ? dayTeacherItem(cell.dayKey, cell.key, cell.time)
        : dayStudentItem(cell.dayKey, cell.key, cell.time);
      if (!item) return;
      dayOverrides[`${cell.dayKey}|${item.teacher}|${cell.time}`] = {
        type: 'pendingSub',
        sub: teacherKey
      };
      state.drawer = null;
      state.dayCell = null;
      state.dayCompare = false;
      render(true);
      showToast(`${TEACHERS[teacherKey].name} 已指派为 ${STUDENTS[item.student].nick} 代课`);
    }

    function proxyDayLeave() {
      const cell = state.dayCell;
      if (!cell) return;
      const item = cell.mode === 'teacher'
        ? dayTeacherItem(cell.dayKey, cell.key, cell.time)
        : dayStudentItem(cell.dayKey, cell.key, cell.time);
      if (!item) return;
      const student = STUDENTS[item.student] || STUDENTS.alice;
      dayOverrides[`${cell.dayKey}|${item.teacher}|${cell.time}`] = {
        type: 'nearChange',
        badge: 'free',
        sub: null,
        note: `已代 ${student.nick} 请假 · 已退回待排期`
      };
      state.drawer = null;
      state.dayCell = null;
      state.dayCompare = false;
      render(true);
      showToast(`已代 ${student.nick} 请假，TS 退回待排期，课格恢复为空闲`);
    }

    function proxyTeacherLeave() {
      const cell = state.dayCell;
      if (!cell) return;
      const item = cell.mode === 'teacher'
        ? dayTeacherItem(cell.dayKey, cell.key, cell.time)
        : dayStudentItem(cell.dayKey, cell.key, cell.time);
      if (!item) return;
      dayOverrides[`${cell.dayKey}|${item.teacher}|${cell.time}`] = {
        type: 'pendingSub',
        sub: null,
        note: '老师请假 · 待指派代课'
      };
      state.drawer = null;
      state.dayCell = null;
      state.dayCompare = false;
      render(true);
      showToast('已代老师请假 · 课格转为待代课');
    }

    function openDayWeekView() {
      const cell = state.dayCell;
      if (!cell) return;
      const item = cell.mode === 'teacher'
        ? dayTeacherItem(cell.dayKey, cell.key, cell.time)
        : dayStudentItem(cell.dayKey, cell.key, cell.time);
      if (!item && cell.mode === 'teacher') return;
      if (cell.mode === 'teacher') {
        state.teacher = item.teacher;
        state.weekStudent = null;
      } else {
        state.weekStudent = cell.key;
      }
      state.view = 'week';
      state.drawer = null;
      state.panel = null;
      state.dayCell = null;
      state.dayIncident = null;
      state.dayCompare = false;
      state.foldOpen = {};
      render(true);
    }

    /* ------------------------------------------------------------------
     * 底部导航
     * ------------------------------------------------------------------ */
    function navItems() {
      if (state.role === 'parent') {
        return [
          { icon: 'home', label: '首页', href: 'm0_workspace_home.html?role=user' },
          { icon: 'calendar-days', label: '自家课表', active: true },
          { icon: 'plus-circle', label: '约课大厅', href: 'm1c_classes.html' },
          { icon: 'user', label: '我的', href: 'm0_workspace_home.html?role=user&view=me' }
        ];
      }
      if (state.role === 'teacher') {
        return [
          { icon: 'home', label: '首页', href: 'm0_workspace_home.html?role=teacher' },
          { icon: 'calendar-days', label: '课表', active: true },
          { icon: 'users', label: '我的学员', href: 'm1a_student_profile.html?role=teacher&page=staffList' },
          { icon: 'user', label: '我的', href: 'm0_workspace_home.html?role=teacher&view=me' }
        ];
      }
      if (state.role === 'admin') {
        return [
          { icon: 'home', label: '首页', href: 'm0_workspace_home.html?role=admin' },
          { icon: 'calendar-days', label: '自家课表', active: state.view !== 'day' && !state.weekStudent, href: 'm3a_calendar_grid.html?role=admin' },
          { icon: 'layout-grid', label: '教务中心', active: state.view === 'day' || !!state.weekStudent, href: 'm0_workspace_home.html?role=admin&view=ops' },
          { icon: 'settings', label: '管理与设置', href: 'm0_workspace_home.html?role=admin&view=settings' }
        ];
      }
      return [
        { icon: 'home', label: '首页', href: 'm0_workspace_home.html?role=monitor' },
        { icon: 'calendar-days', label: '自家课表', active: state.view !== 'day' && !state.weekStudent, href: 'm3a_calendar_grid.html?role=monitor' },
        { icon: 'layout-grid', label: '教务中心', active: state.view === 'day' || !!state.weekStudent, href: 'm0_workspace_home.html?role=monitor&view=ops' },
        { icon: 'user', label: '我的', href: 'm0_workspace_home.html?role=monitor&view=me' }
      ];
    }

    function renderNav() {
      return `<nav id="frameNav" class="relative z-40 shrink-0 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
        <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
          ${navItems().map((item) => item.active
            ? `<span aria-current="page" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 text-indigo-600">
                ${icon(item.icon, 'h-[18px] w-[18px]')}<span class="text-[12px] font-bold">${item.label}</span>
              </span>`
            : `<a href="${item.href}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 text-slate-500 transition hover:bg-slate-50 hover:text-slate-700">
                ${icon(item.icon, 'h-[18px] w-[18px]')}<span class="text-[12px] font-semibold">${item.label}</span>
              </a>`).join('')}
        </div>
      </nav>`;
    }

    /* ------------------------------------------------------------------
     * 抽屉骨架
     * ------------------------------------------------------------------ */
    function renderDrawer() {
      if (!state.drawer) return '';
      let content = '';
      if (state.drawer === 'children') content = renderChildrenSheet();
      else if (state.drawer === 'asset') content = renderAssetSheet();
      else if (state.drawer === 'teachers') content = renderTeachersSheet();
      else if (state.drawer === 'parent-lesson') content = renderParentLessonSheet();
      else if (state.drawer === 'parent-book') content = renderBookingSheet();
      else if (state.drawer === 'staff-lesson') content = renderStaffLessonSheet();
      else if (state.drawer === 'staff-free') content = renderBookingSheet();
      else if (state.drawer === 'staff-rest') content = renderRestSheet();
      else if (state.drawer === 'teacher-free') content = renderTeacherFreeSheet();
      else if (state.drawer === 'teacher-report') content = renderTeacherReportPanel();
      else if (state.drawer === 'schedule-object') content = renderScheduleObjectSheet();
      else if (state.drawer === 'day') content = renderDaySheet();
      else content = '';

      return `<div class="absolute inset-0 z-50">
        <button data-action="close-drawer" class="absolute inset-0 h-full w-full bg-slate-900/40" aria-label="关闭"></button>
        <div class="absolute inset-x-0 bottom-0 max-h-[85%] overflow-y-auto rounded-t-3xl border-t border-slate-200 bg-white px-4 pb-4 pt-2.5 shadow-2xl">
          <div class="mx-auto mb-3 h-1 w-10 rounded-full bg-slate-200"></div>
          ${content}
        </div>
      </div>`;
    }

    function sheetHeader(title, subtitle) {
      return `<div class="mb-3 flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 class="truncate text-[16px] font-bold text-slate-900">${esc(title)}</h2>
          ${subtitle ? `<p class="mt-0.5 truncate text-[12px] font-medium text-slate-600">${esc(subtitle)}</p>` : ''}
        </div>
        <button data-action="close-drawer" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-slate-100 text-slate-600" aria-label="关闭">${icon('x', 'h-4 w-4')}</button>
      </div>`;
    }

    function backRow() {
      return `<button data-action="back-panel" class="mt-2 flex h-10 w-full items-center justify-center gap-1 rounded-xl border border-slate-200 bg-white text-[14px] font-semibold text-slate-700">${icon('arrow-left', 'h-4 w-4')}返回</button>`;
    }

    function renderChildrenSheet() {
      return `${sheetHeader('切换孩子', '课表以孩子为中心，聚合全周所有老师课程')}
        <div class="space-y-2">
          ${['alice', 'bob'].map((key) => {
            const child = STUDENTS[key];
            const active = state.child === key;
            return `<button data-action="select-child" data-key="${key}" class="flex h-14 w-full items-center gap-2.5 rounded-xl border px-3 text-left transition ${active ? 'border-indigo-200 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl ${active ? 'bg-white text-indigo-700' : 'bg-slate-100 text-slate-700'} text-[16px]">${child.emoji}</span>
              <span class="min-w-0 flex-1">
                <span class="flex items-center gap-1.5">
                  <span class="truncate text-[14px] font-bold text-slate-900">${esc(child.nick)}</span>
                  <span class="text-[12px] font-medium text-slate-600">${esc(child.label)} · ${child.age}岁</span>
                </span>
                <span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">${esc(child.name)} · 本周 ${countStudentLessons(key)} 节</span>
              </span>
              <span class="shrink-0 text-right">
                <span class="block text-[16px] font-bold text-indigo-700">${state.credits[key]}</span>
                <span class="block text-[12px] font-medium text-slate-600">剩余课次</span>
              </span>
              ${active ? `<span class="shrink-0 text-indigo-600">${icon('check-circle-2', 'h-4 w-4')}</span>` : ''}
            </button>`;
          }).join('')}
        </div>`;
    }

    function renderTeachersSheet() {
      const subtitle = state.role === 'admin' ? '平台调度 · 3 位老师 · 负荷实时同步' : '本团队 3 位老师 · 负荷实时同步';
      return `${sheetHeader('切换老师', subtitle)}
        <div class="space-y-2">
          ${['david', 'linda', 'nina'].map((key) => {
            const teacher = TEACHERS[key];
            const active = state.teacher === key;
            return `<button data-action="select-teacher" data-key="${key}" class="flex h-14 w-full items-center gap-2.5 rounded-xl border px-3 text-left transition ${active ? 'border-indigo-200 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl ${active ? 'bg-white text-indigo-700' : 'bg-slate-100 text-slate-700'} text-[14px] font-bold">${teacher.initial}</span>
              <span class="min-w-0 flex-1">
                <span class="flex items-center gap-1.5">
                  <span class="truncate text-[14px] font-bold text-slate-900">${esc(teacher.name)}</span>

    function renderAssetSheet() {
      const child = STUDENTS[state.child];

              <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">待排期课次可直接用于临时约课；如需调整已购课次，请联系负责班长处理。</p>

    /* ------------------------------------------------------------------
     * 家长课次抽屉
     * ------------------------------------------------------------------ */
    function pairFor(lesson) {
      if (!lesson) return null;
      if (!['fixed', 'temp'].includes(lesson.kind)) return null;
      const prev = prevTime(lesson.time);
      const next = nextTime(lesson.time);
      const prevLesson = prev ? getSlot(lesson.day, prev).lesson : null;
      const nextLesson = next && toMin(next) < GRID_END ? getSlot(lesson.day, next).lesson : null;
      const same = (a, b) => a && b && a.student === b.student && a.teacher === b.teacher && a.kind === b.kind;
      if (same(prevLesson, lesson)) return [prevLesson, lesson];
      if (same(nextLesson, lesson)) return [lesson, nextLesson];
      return null;
    }

    function renderParentTeacherLeaveBanner(lesson) {
      if (!lesson || !lesson.teacherLeavePending) return '';
      const canSwitch = state.hours >= 3;
      return `<div class="mb-2.5 rounded-xl border border-amber-300 bg-amber-50 p-3">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[14px] font-bold text-amber-900">原授课老师已请假 · 待重排</span>
          <span class="rounded bg-white px-1.5 py-0.5 text-[12px] font-bold text-amber-800">${canSwitch ? '距开课 ≥3h' : '距开课 <3h'}</span>
        </div>
        <p class="mt-1 text-[12px] font-medium leading-relaxed text-amber-900">${canSwitch
          ? '可免费换同价位老师代上，或退回待排期在未来 1～7 天自助重约；若到下课仍未处理将自动退回待排期。'
          : '距开课不足 3 小时，已禁用自助换老师（防代课老师未在线）；可退回待排期或联系班长微信协助。'}</p>
        <div class="mt-2 grid grid-cols-2 gap-2">
          ${canSwitch
            ? `<button data-action="parent-pick-sub" class="flex h-9 items-center justify-center gap-1 rounded-lg bg-indigo-600 px-2 text-[12px] font-bold text-white transition hover:bg-indigo-700">换同价位老师代上</button>`
            : `<button data-action="open-monitor-wechat" class="flex h-9 items-center justify-center gap-1 rounded-lg border border-amber-300 bg-white px-2 text-[12px] font-bold text-amber-900 transition hover:bg-amber-100/50">💬 联系班长微信</button>`}
          <button data-action="parent-return-pending" class="flex h-9 items-center justify-center gap-1 rounded-lg border border-slate-300 bg-white px-2 text-[12px] font-bold text-slate-800 transition hover:bg-slate-50">退回待排期</button>
        </div>
      </div>`;
    }

    function renderParentLessonSheet() {
      if (state.panel === 'leave') return renderLeavePanel();
      const lesson = state.lesson;
      if (!lesson) return '';
      const pair = pairFor(lesson);
      const isGroup = lesson.kind === 'group';
      return `${sheetHeader(isGroup ? '小班课详情' : '课次详情', slotLabel(lesson.day, lesson.time, isGroup ? 2 : 1))}
        ${isGroup ? '' : renderParentTeacherLeaveBanner(lesson)}
        ${pair && !isGroup ? renderPairBox(pair) : ''}
        ${renderLessonInfo(lesson)}
        ${renderClassroomCard(lesson)}
        ${renderCoursewareRow()}
        ${isGroup ? '' : renderParentActions(lesson)}`;
    }

    function pairLeaveEligibility(pair, studentKey = state.child) {
      const items = pair || [];
      if (!items.length) return { ok: false, reason: '请至少勾选 1 节' };
      if (items.some((item) => item.kind !== 'temp')) {
        return { ok: false, reason: '固定位为 4 周契约，连续两节仅支持合并挪位' };
      }
      const check = leaveEligibility(items[0], items.length, studentKey);
      return { ok: check.ok, reason: check.reason };
    }

    function pairRescheduleEligibility(pair) {
      const items = pair || [];
      if (!items.length) return { ok: false, reason: '请至少勾选 1 节' };
      if (state.role === 'parent' && state.hours < 3) {
        return { ok: false, reason: '距开课不足 3 小时，请联系班长处理' };
      }
      if (state.hours < 3) return { ok: true, gentle: true, reason: '距开课不足 3 小时，确认后仍可合并挪位' };
      return { ok: true, reason: '两节同师挪位 · 目标为原任老师的空闲绿格' };
    }

    function renderPairBox(pair, staff = false) {
      const studentKey = staff && pair[0] ? pair[0].student : state.child;
      const leave = pairLeaveEligibility(pair, studentKey);
      const move = pairRescheduleEligibility(pair);
      const canMergeLeave = pair.length > 0 && pair.every((item) => item.kind === 'temp');
      const prefix = staff ? '协助' : '';
      return `<div class="mb-2.5 rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">

        </div>
        <div class="mt-2 space-y-1.5">

            <input type="checkbox" data-pair="${item.time}" ${state.pairSel[item.time] !== false ? 'checked' : ''} class="h-4 w-4 shrink-0 accent-indigo-600">

          ${canMergeLeave ? `<button data-action="pair-leave" ${leave.ok ? '' : 'disabled'} class="flex h-10 items-center justify-center gap-1 rounded-lg text-[14px] font-bold transition ${leave.ok ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'cursor-not-allowed bg-slate-200 text-slate-500'}">${icon('calendar-x', 'h-4 w-4')}${prefix}合并请假 (2节)</button>` : ''}
          <button data-action="pair-reschedule" ${move.ok ? '' : 'disabled'} class="flex h-10 items-center justify-center gap-1 rounded-lg border text-[14px] font-semibold transition ${move.ok ? 'border-slate-300 bg-white text-slate-800 hover:bg-slate-50' : 'cursor-not-allowed border-slate-200 bg-slate-100 text-slate-500'} ${canMergeLeave ? '' : 'w-full'}">${icon('move-right', 'h-4 w-4')}${prefix}合并挪位 (2节)</button>
        </div>
        ${staff ? `<button data-action="confirm-exception-backfill" class="mt-2 flex h-10 w-full items-center justify-center gap-1 rounded-lg border border-rose-200 bg-rose-50 text-[12px] font-bold text-rose-700 transition hover:bg-rose-100">${icon('triangle-alert', 'h-4 w-4')}确认异常未上课回退补生 (2节)</button>` : ''}
        ${canMergeLeave && !leave.ok ? `<p class="mt-1.5 text-[12px] font-medium leading-relaxed text-rose-700">合并请假不可用：${esc(leave.reason)}</p>` : ''}
        ${!canMergeLeave ? `<p class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-600">固定位为 4 周契约，连续两节仅支持合并挪位。</p>` : ''}
        ${!move.ok ? `<p class="mt-1 text-[12px] font-medium leading-relaxed text-rose-700">合并挪位不可用：${esc(move.reason)}</p>` : ''}
        ${staff ? `<p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">异常回退仅适用于连续 2 节老师缺席旷课；提交后一次性补生 2 节待排期 TS。</p>` : ''}
      </div>`;

    function lessonClockLabel(lesson) {

    function renderLessonInfo(lesson) {

      return `<div class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
        <div class="flex items-center justify-between gap-2">
          <span class="flex items-center gap-1">
            <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${TYPE_NAME[lesson.kind] || '课次'}</span>
          </span>
          <span class="text-[12px] font-medium text-slate-600">第 ${state.week + 1} 周 · ${fmtDot(lessonDate(state.week, lesson.day))}</span>

        ${isGroup
          ? `<div class="mt-1 flex flex-wrap items-center gap-1.5 text-[12px] font-medium text-slate-600">
              <span class="font-semibold text-slate-800">${esc(cls.name)}</span>

                <div class="mt-1 flex items-center justify-between gap-2 text-[12px]">
                  <span class="font-medium text-slate-600">代课老师</span>
                  <span class="font-bold text-slate-900">${esc(teacherName(lesson.actual))}</span>

            : `<div class="mt-1 text-[12px] font-medium text-slate-600">任课老师 ${esc(teacherName(lesson.teacher))} · 25 分钟（含 5 分钟课间）</div>`}

    function renderClassroomCard(lesson) {

            <div class="text-[12px] font-medium text-slate-600">ClassIn 授课老师名片</div>

        <button data-action="enter-classin" class="mt-2 flex h-11 w-full items-center justify-center gap-1.5 rounded-xl bg-indigo-600 text-[16px] font-bold text-white transition hover:bg-indigo-700">${icon('external-link', 'h-4 w-4')}进入 ClassIn</button>

    function renderCoursewareRow() {
      return `<a href="m1e_courseware.html" class="mt-2 flex items-center justify-between gap-2 rounded-xl border border-slate-300 bg-slate-50/70 px-3 py-2.5 transition hover:bg-slate-100">
        <span class="min-w-0">
          <span class="block text-[12px] font-medium text-slate-600">课件进度</span>
          <span class="mt-0.5 block truncate text-[14px] font-semibold text-slate-900">Oxford Discover 2 · Unit 3</span>
        </span>
        <span class="flex shrink-0 items-center gap-0.5 rounded-lg bg-indigo-50 px-2 py-1 text-[12px] font-bold text-indigo-700">查看课件${icon('chevron-right', 'h-3.5 w-3.5')}</span>
      </a>`;
    }

    function parentActionRow(action, iconName, title, desc, disabled, tone = '') {
      const danger = tone === 'danger';
      return `<button data-action="${action}" ${disabled ? 'disabled' : ''} class="flex min-h-12 w-full items-center gap-2.5 rounded-xl border px-3 py-2 text-left transition ${disabled ? 'cursor-not-allowed border-slate-200 bg-slate-50' : danger ? 'border-rose-200 bg-rose-50 hover:bg-rose-100' : 'border-slate-200 bg-white hover:bg-slate-50'}">
        <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg ${disabled ? 'bg-slate-100 text-slate-500' : danger ? 'bg-white text-rose-700' : 'bg-slate-100 text-slate-700'}">${icon(iconName, 'h-4 w-4')}</span>
        <span class="min-w-0 flex-1">
          <span class="block text-[14px] font-bold ${disabled ? 'text-slate-500' : danger ? 'text-rose-800' : 'text-slate-900'}">${esc(title)}</span>
          <span class="mt-0.5 block text-[12px] font-medium leading-snug ${disabled ? 'text-rose-600' : 'text-slate-600'}">${esc(desc)}</span>
        </span>
        ${disabled ? icon('lock', 'h-4 w-4 shrink-0 text-slate-500') : icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-500')}
      </button>`;
    }

    function parentLeaveAction(lesson) {
      const leave = leaveEligibility(lesson);
      return `${parentActionRow('start-leave', 'calendar-x', '请假退期待排', leave.reason, !leave.ok)}
        ${!leave.ok && state.role === 'parent' ? `<div class="flex items-center justify-between gap-2 rounded-lg border border-rose-200 bg-rose-50 px-2.5 py-1.5">
          <span class="text-[12px] font-medium text-rose-700">距开课不足 24h，需联系班长协助</span>
          <button type="button" data-action="open-monitor-wechat" class="shrink-0 rounded-lg border border-rose-300 bg-white px-2 py-1 text-[12px] font-bold text-rose-800 hover:bg-rose-100/50">💬 联系班长微信</button>
        </div>` : ''}`;

    function renderParentActions(lesson) {
      const move = rescheduleEligibility(lesson);
      return `<div class="mt-2.5 space-y-2">
        ${parentLeaveAction(lesson)}
        ${parentActionRow('start-reschedule', 'move-right', '同师挪位', move.reason, !move.ok)}
        ${!move.ok && state.role === 'parent' ? `<div class="flex items-center justify-between gap-2 rounded-lg border border-rose-200 bg-rose-50 px-2.5 py-1.5">
          <span class="text-[12px] font-medium text-rose-700">距开课不足 3h，需联系班长协助</span>
          <button type="button" data-action="open-monitor-wechat" class="shrink-0 rounded-lg border border-rose-300 bg-white px-2 py-1 text-[12px] font-bold text-rose-800 hover:bg-rose-100/50">💬 联系班长微信</button>
        </div>` : ''}
        <a href="m1e_courseware.html" class="flex min-h-12 w-full items-center gap-2.5 rounded-xl border border-slate-200 bg-white px-3 py-2 text-left transition hover:bg-slate-50">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-slate-100 text-slate-700">${icon('message-square-text', 'h-4 w-4')}</span>
          <span class="min-w-0 flex-1">
            <span class="block text-[14px] font-bold text-slate-900">查看课前课后反馈</span>
            <span class="mt-0.5 block text-[12px] font-medium leading-snug text-slate-600">老师留言与课后作业</span>
          </span>
          ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-500')}
        </a>
      </div>`;
    }

    function leaveCellsNow() {
      return (state.leaveCells && state.leaveCells.length) ? state.leaveCells : (state.lesson ? [state.lesson] : []);
    }

    function renderLeavePanel() {
      const cells = leaveCellsNow();
      const first = cells[0];
      if (!first) return '';
      const count = cells.length;
      const eligibility = leaveEligibility(first);
      const gentle = !!eligibility.gentle;
      const blocked = !eligibility.ok;
      return `${sheetHeader('请假登记', `${slotLabel(first.day, first.time, count)} · 共 ${count} 节`)}
        <div class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
          <div class="text-[14px] font-bold text-slate-900">请假即释放已排时段</div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">本节课退回待排期池，可重新选择时段；确认后课格恢复为空闲可约。</p>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">${first.kind === 'fixed'
            ? '固定位为 4 周契约，单节请假仍可用；连续两节仅支持合并挪位。'
            : '临时课与代课课次均可直接请假退期待排。'}</p>
        </div>

          ${blocked && state.role === 'parent' ? `<button type="button" data-action="open-monitor-wechat" class="mt-2 inline-flex h-8 items-center gap-1 rounded-lg border border-rose-300 bg-white px-2.5 text-[12px] font-bold text-rose-800 hover:bg-rose-100/50">💬 联系班长微信</button>` : ''}
        </div>
        <button data-action="confirm-leave" ${blocked ? 'disabled' : ''} class="mt-3 flex h-11 w-full items-center justify-center gap-1 rounded-xl text-[16px] font-bold transition ${blocked ? 'cursor-not-allowed bg-slate-200 text-slate-500' : 'bg-indigo-600 text-white hover:bg-indigo-700'}">${icon('check', 'h-4 w-4')}确认请假</button>
        ${backRow()}`;
    }

    /* ------------------------------------------------------------------
     * 预约抽屉
     * ------------------------------------------------------------------ */
    function bookingSlot() {
      if (state.target) return state.target;
      if (state.lesson) return { day: state.lesson.day, time: state.lesson.time };
      return null;
    }

    function studentCredits(key) {
      if (state.credits[key] != null) return state.credits[key];
      return STUDENTS[key] ? Number(STUDENTS[key].credits || 0) : 0;
    }

    function bookingTimes(startTime, count = 1) {
      const list = [];
      let cur = startTime;
      for (let i = 0; i < count; i += 1) {
        if (!cur || toMin(cur) >= gridEndMin()) break;
        list.push(cur);
        cur = nextTime(cur);
      }
      return list;
    }

    function studentBusyAt(studentKey, day, times) {
      for (let i = 0; i < times.length; i += 1) {
        const time = times[i];
        const list = slotLessons(day, time);
        if (list.some((item) => item.student === studentKey && item.kind !== 'leave' && item.kind !== 'rest')) return time;
        const prev = prevTime(time);
        if (prev && slotLessons(day, prev).some((item) => item.student === studentKey
          && item.kind === 'group'
          && (item.dur || 2) > 1)) return time;
      }
      return '';
    }

    function parseStandardNick(raw) {
      const value = String(raw || '').trim();
      const match = /^([A-Za-z]{1,24})([A-Z])(\d{1,2})([a-z0-9]{0,3})$/.exec(value);
      if (!match) return null;
      const age = Number(match[3]);
      if (age < 1 || age > 99) return null;
      return {
        name: value,
        englishName: match[1],
        initial: match[2],
        age,
        suffix: match[4] || ''
      };
    }

    function canBookCount(count) {
      const slot = bookingSlot();
      if (!slot) return { ok: false, reason: '' };
      const times = bookingTimes(slot.time, count);
      if (times.length < count) return { ok: false, reason: '超出当日可约结束时间' };
      const staff = isStaff();
      const studentKey = staff ? state.staffStudent : state.child;
      const student = STUDENTS[studentKey];
      if (!staff && !inParentBookWindow(slot.day)) {
        return { ok: false, reason: '仅支持预约未来 1~7 天' };
      }
      const studentBusy = studentBusyAt(studentKey, slot.day, times);
      if (studentBusy) {
        return { ok: false, reason: `${studentBusy} ${staff ? '学员' : '孩子'}已有课` };
      }
      if (!staff) {
        const tier = Number(state.bookTier);
        if (!tier) return { ok: false, reason: '暂无可用待排课次，请联系班长购课' };
        const tierAvail = studentTempTierCredits(studentKey, tier);
        if (tierAvail < count) return { ok: false, reason: '该价位待排课次不足' };
        const hasTeacher = freeTeachersFor(slot.day, slot.time, count, tier).some((item) => item.available);
        if (!hasTeacher) return { ok: false, reason: `无连续 ${count} 节空闲老师` };
        return { ok: true, reason: '' };
      }
      for (let index = 0; index < times.length; index += 1) {
        const time = times[index];
        if (!teacherOpen(state.teacher, slot.day, time)) return { ok: false, reason: `${time} 老师未开放` };
        if (!teacherFreeAt(state.teacher, slot.day, time)) return { ok: false, reason: `${time} 老师已有课` };
      }
      const avail = studentCredits(studentKey);
      const canProxy = state.role === 'monitor' || state.role === 'admin';
      if (avail < count && !(canProxy && state.quickTrialOrderSync && state.proxyPaymentConfirmed)) {
        return { ok: false, reason: avail < count && state.quickTrialOrderSync ? '请先勾选确认已收款' : `学员待排 TS 不足 ${count} 节` };
      }
      return { ok: true, reason: '' };
    }

    function canBookSixty() {
      return canBookCount(2);
    }

    function shortBookReason(reason) {
      const text = String(reason || '');
      if (text.includes('该价位待排')) return '该价位待排课次不足';
      if (text.includes('无连续')) {
        const match = text.match(/无连续\s*(\d+)\s*节/);
        return match ? `无连续 ${match[1]} 节空闲老师` : '无空闲老师';
      }
      if (text.includes('孩子已有课')) return '孩子已有课';
      if (text.includes('学员已有课')) return '学员有课';
      if (text.includes('超出')) return '超时段';
      if (text.includes('未开放') || text.includes('老师已有课')) return '老师无空';
      if (text.includes('1~7 天')) return '窗口外';
      if (text.includes('暂无可用待排')) return '待排课次不足';
      return '不可约';
    }

    function parentTierOptions(studentKey) {
      const buckets = studentTempBuckets(studentKey);
      return PRICE_TIERS
        .map((tier) => ({ tier, remain: Number(buckets[tier] || 0) }))
        .filter((item) => item.remain > 0);
    }

    function normalizeBookTier(studentKey) {
      const options = parentTierOptions(studentKey);
      const current = Number(state.bookTier);
      if (!options.some((item) => item.tier === current)) {
        state.bookTier = options.length ? options[0].tier : null;
      }
      return state.bookTier;
    }

    function renderParentTierPick(studentKey) {
      const options = parentTierOptions(studentKey);
      const selected = normalizeBookTier(studentKey);
      return `<div class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[14px] font-bold text-slate-900">① 选择价位</span>
          <span class="shrink-0 text-[12px] font-medium text-slate-600">严格同价位匹配</span>
        </div>
        ${options.length ? `<div class="mt-1.5 flex flex-wrap items-center gap-1.5">
          ${options.map((item) => {
            const on = Number(selected) === item.tier;
            return `<button type="button" data-action="set-book-tier" data-value="${item.tier}" class="h-8 shrink-0 whitespace-nowrap rounded-full px-3 text-[12px] transition ${on ? 'border-0 bg-slate-900 font-semibold text-white' : 'border-0 bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${item.tier}积分 (余${item.remain}节)</button>`;
          }).join('')}
        </div>` : `<p class="mt-1.5 rounded-lg border border-amber-300 bg-amber-50 px-2.5 py-2 text-[12px] font-semibold leading-relaxed text-amber-900">暂无可用待排课次，请联系班长购课</p>`}
      </div>`;
    }

    function renderParentTeacherPick(freeTeachers, selectedKey, count, windowOk) {
      if (!windowOk) {
        return `<div class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold text-slate-900">授课老师</span>
            <span class="shrink-0 text-[12px] font-medium text-slate-600">今天不可约</span>
          </div>
          <p class="mt-2 rounded-lg border border-amber-300 bg-amber-50 px-2.5 py-2 text-[12px] font-semibold leading-relaxed text-amber-900">仅支持预约未来 1~7 天，请选择明天及之后的空闲时段。</p>
        </div>`;
      }
      const q = (state.bookTeacherSearch || '').trim();
      const lower = q.toLowerCase();
      const available = freeTeachers.filter((item) => item.available);
      const recommendedKey = available.length ? available[0].key : '';
      const matched = q
        ? freeTeachers.filter((item) => item.name.toLowerCase().includes(lower) || item.short.toLowerCase().includes(lower))
        : available;
      const selectedTier = Number(state.bookTier);
      const tierRemain = selectedTier ? studentTempTierCredits(state.child, selectedTier) : 0;
      return `<div class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
        <div class="flex items-center justify-between gap-2">
          <span class="shrink-0 text-[14px] font-bold text-slate-900">③ 授课老师</span>
          <span class="shrink-0 text-[12px] font-medium text-slate-600">熟客 → 同价位 → 负荷</span>
        </div>
        <div class="mt-1.5 rounded-lg border border-indigo-200 bg-indigo-50/70 px-2.5 py-1.5 text-[12px] font-semibold text-indigo-900">
          ${selectedTier ? `${selectedTier}积分 · 剩余 ${tierRemain} 节（严格同价位匹配）` : '暂无可用待排课次'}
        </div>
        <div class="relative mt-2">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
          <input type="text" data-book-teacher-search value="${esc(state.bookTeacherSearch)}" placeholder="按老师姓名搜索" class="h-10 w-full rounded-xl border border-slate-200 bg-slate-50/70 pl-9 pr-8 text-[14px] font-medium text-slate-900 placeholder:text-slate-500 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/15">
          ${q ? `<button type="button" data-action="clear-book-teacher-search" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-700">${icon('x', 'h-4 w-4')}</button>` : ''}
        </div>
        <div class="mt-2 space-y-1.5">
          ${matched.length ? matched.map((teacher) => {
            const on = selectedKey === teacher.key && teacher.available;
            const isRecommended = recommendedKey === teacher.key;
            return `<button type="button" data-action="pick-book-teacher" data-key="${teacher.key}" ${teacher.available ? '' : 'disabled'} class="flex w-full items-center gap-2 rounded-xl border px-2.5 py-2 text-left transition ${teacher.available ? (on ? 'border-indigo-300 bg-indigo-50 ring-1 ring-indigo-100' : 'border-slate-200 bg-white hover:bg-slate-50') : 'cursor-not-allowed border-slate-200 bg-slate-100 opacity-80'}">
              <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg ${on ? 'bg-white text-indigo-700' : 'bg-slate-100 text-slate-700'} text-[12px] font-bold">${teacher.initial}</span>
              <span class="min-w-0 flex-1">
                <span class="flex flex-wrap items-center gap-1">
                  <span class="truncate text-[14px] font-bold ${on ? 'text-indigo-800' : teacher.available ? 'text-slate-900' : 'text-slate-500'}">${esc(teacher.name)}</span>
                  ${teacher.taught ? `<span class="shrink-0 rounded border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">教过</span>` : ''}
                  ${isRecommended ? `<span class="shrink-0 rounded border border-indigo-200 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">推荐</span>` : ''}
                </span>
                <span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">${esc(teacher.tierLabel)} · 本周已排 ${teacher.load} 节</span>
                ${teacher.available ? '' : `<span class="mt-0.5 block truncate text-[12px] font-bold text-rose-700">${esc(teacher.reason)}</span>`}
              </span>
              <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 bg-white'}">${on ? icon('check', 'h-3 w-3') : ''}</span>
            </button>`;
          }).join('') : `<p class="rounded-lg border border-amber-300 bg-amber-50 px-2.5 py-2 text-[12px] font-semibold leading-relaxed text-amber-900">${q ? `没有匹配“${esc(q)}”的老师` : `当前时段无匹配价位且连续 ${count} 节空闲的老师`}</p>`}
        </div>
        ${q ? '' : `<p class="mt-1.5 text-[12px] font-medium text-slate-600">默认仅展示连续 ${count} 节全程空闲且价位匹配的老师</p>`}
      </div>`;
    }

    function renderBookingSheet() {
      const slot = bookingSlot();
      if (!slot) return '';
      const staff = isStaff();
      const canProxy = state.role === 'monitor' || state.role === 'admin';
      const count = Math.max(1, Math.min(4, Math.round((state.bookDuration || 30) / 30)));
      const windowOk = staff || inParentBookWindow(slot.day);
      const tierOptions = staff ? [] : parentTierOptions(state.child);
      const bookTier = staff ? null : normalizeBookTier(state.child);
      const freeTeachers = staff ? [] : freeTeachersFor(slot.day, slot.time, count, bookTier);
      const availableTeachers = windowOk ? freeTeachers.filter((item) => item.available) : [];
      let teacherKey = staff ? state.teacher : (windowOk ? state.bookTeacher : '');
      if (!staff && windowOk && !availableTeachers.some((item) => item.key === teacherKey)) {
        teacherKey = availableTeachers.length ? availableTeachers[0].key : '';
      }
      if (!staff && state.bookTeacher !== teacherKey) state.bookTeacher = teacherKey;
      const teacher = teacherKey ? TEACHERS[teacherKey] : null;
      const pickedStudent = canProxy ? STUDENTS[state.staffStudent] : STUDENTS[state.child];
      const availCredits = pickedStudent ? studentCredits(pickedStudent.key) : 0;
      const needOrderSync = canProxy && availCredits < count;
      const showOrderSync = canProxy && (needOrderSync || state.quickTrialOrderSync);
      const syncActive = canProxy && state.quickTrialOrderSync;
      const teacherPriceTier = teacher ? teacher.priceTier : 18;
      const totalSyncPoints = count * teacherPriceTier;
      const check = canBookCount(count);
      const noTier = !staff && windowOk && !tierOptions.length;
      const confirmDisabled = !windowOk || noTier || !check.ok || !teacher || (canProxy && !pickedStudent) || (syncActive && !state.proxyPaymentConfirmed);
      const confirmReason = !windowOk
        ? '仅支持预约未来 1~7 天'
        : noTier
          ? '暂无可用待排课次，请联系班长购课'
          : !teacher
            ? `当前时段无连续 ${count} 节空闲老师`
            : (syncActive && !state.proxyPaymentConfirmed)
              ? '请先勾选下方“我已确认线下收到家长本次课次费用”'
              : check.reason;
      const parentTierAvail = (!staff && bookTier && pickedStudent) ? studentTempTierCredits(pickedStudent.key, bookTier) : 0;
      const durOptions = [1, 2, 3, 4].map((n) => {
        const option = canBookCount(n);
        const mins = n * 25;
        const on = count === n;
        return `<button data-action="set-duration" data-value="${n * 30}" ${option.ok ? '' : 'disabled'} title="${esc(option.reason)}" class="rounded-xl border px-2 py-2 text-center transition ${on ? 'border-indigo-300 bg-indigo-50 ring-1 ring-indigo-100' : 'border-slate-200 bg-white'} ${option.ok ? '' : 'cursor-not-allowed opacity-55'}">
          <span class="block text-[14px] font-bold text-slate-900">${n} 节</span>
          <span class="mt-0.5 block text-[12px] font-medium text-slate-500">${mins}分钟</span>
          ${option.ok ? '' : `<span class="mt-0.5 block text-[12px] font-semibold leading-tight text-rose-700">${esc(shortBookReason(option.reason))}</span>`}
        </button>`;
      }).join('');
      return `${sheetHeader(staff ? '代学员约课' : '临时预约', slotLabel(slot.day, slot.time, count))}
        ${staff ? `<div class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-600">授课老师</span>
            <span class="text-[14px] font-bold text-slate-900">${esc(activeTeacher().name)}</span>
          </div>
          <div class="mt-1 flex items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-600">上课安排</span>
            <span class="text-[14px] font-bold text-slate-900">${esc(slotLabel(slot.day, slot.time, count))}</span>
          </div>
        </div>` : renderParentTierPick(state.child)}
        ${canProxy ? renderStaffStudentPick() : ''}
        <div class="mt-3">
          <div class="mb-1.5 flex items-center justify-between">
            <span class="text-[12px] font-semibold text-slate-600">${staff ? '' : '② '}连约节数（每节 25 分钟含 5 分钟课间）</span>
          </div>
          <div class="grid grid-cols-4 gap-1.5">${durOptions}</div>
        </div>
        ${staff ? '' : `<div class="mt-2.5">${renderParentTeacherPick(freeTeachers, teacherKey, count, windowOk)}</div>`}
        ${!windowOk ? `<p class="mt-2.5 rounded-xl border border-amber-300 bg-amber-50 px-3 py-2 text-[12px] font-semibold leading-relaxed text-amber-900">仅支持预约未来 1~7 天，今天与 7 天外时段不可约。</p>` : ''}
        ${state.role === 'parent' && windowOk && !tierOptions.length ? `<div class="mt-2 flex items-center justify-between gap-2 rounded-lg border border-amber-300 bg-amber-50 px-2.5 py-2">
          <span class="text-[12px] font-medium text-amber-900">暂无可用待排课次，请联系班长购课</span>
          <a href="m2a_course_orders.html" class="shrink-0 text-[12px] font-semibold text-indigo-600">去购课 →</a>
        </div>` : ''}
        ${showOrderSync ? `<div class="mt-2.5 space-y-2">
          <label class="flex cursor-pointer items-center gap-2 rounded-xl border border-slate-300 bg-white px-3 py-2 text-[12px] font-bold text-slate-900">
            <input type="checkbox" data-action="toggle-quick-trial-order" ${syncActive ? 'checked' : ''} class="h-4 w-4 rounded border-slate-300 text-indigo-600">
            <span>同步录入 1v1 临时课购课单并确认收款</span>
          </label>
          ${syncActive ? `<div class="rounded-xl border border-amber-300 bg-amber-50 p-3 text-[12px] text-amber-950">
            <div class="flex items-center justify-between gap-2">
              <span class="font-bold text-amber-900">应收总额（不可改价）</span>
              <span class="text-[14px] font-extrabold text-amber-900">${totalSyncPoints} 积分（等值 ¥${totalSyncPoints}）</span>
            </div>
            <p class="mt-1 text-[12px] font-medium text-amber-900">本次代约 ${count} 节 × ${teacherPriceTier} 积分/节 = 应收总计 ${totalSyncPoints} 积分（等值 ¥${totalSyncPoints}）</p>
            <label class="mt-2 flex cursor-pointer items-start gap-2 rounded-lg border border-amber-300 bg-white/90 p-2 text-[12px] font-semibold text-amber-950">
              <input type="checkbox" data-action="toggle-proxy-payment" ${state.proxyPaymentConfirmed ? 'checked' : ''} class="mt-0.5 h-4 w-4 shrink-0 rounded border-amber-400 text-indigo-600">
              <span>我已确认线下收到家长本次课次费用 ¥${totalSyncPoints}（提交后将直接生成已付款购课单并锁定为本人托管，结课后计入周转账单）</span>
            </label>
            <div class="mt-2 flex items-center justify-between gap-2">
              <button type="button" data-action="upload-proxy-proof" class="inline-flex h-8 items-center gap-1 rounded-lg border border-amber-300 bg-white px-2.5 text-[12px] font-bold text-amber-900 hover:bg-amber-100/50">${icon('upload', 'h-3.5 w-3.5')}上传收款凭证 (${state.proxyProofCount}/5 · 可选)</button>
              ${state.proxyProofCount > 0 ? `<span class="text-[12px] font-semibold text-emerald-700">已附 ${state.proxyProofCount} 张</span>` : ''}
            </div>
          </div>` : ''}
        </div>` : ''}
        ${confirmDisabled && confirmReason && windowOk ? `<p class="mt-1.5 rounded-lg border border-rose-200 bg-rose-50 px-2.5 py-1.5 text-[12px] font-medium text-rose-700">${esc(confirmReason)}</p>` : ''}
        <button data-action="confirm-book" ${confirmDisabled ? 'disabled' : ''} class="mt-3 flex h-11 w-full items-center justify-center gap-1 rounded-xl text-[16px] font-bold transition ${confirmDisabled ? 'cursor-not-allowed bg-slate-200 text-slate-500' : 'bg-indigo-600 text-white hover:bg-indigo-700'}">${icon('calendar-check', 'h-4 w-4')}${syncActive ? '确认已收款并立即约课' : '确认预约'}</button>
        ${state.role === 'parent' && windowOk && bookTier ? `<p class="mt-2 text-[12px] font-medium text-slate-600">将消耗 ${bookTier}积分临时课 ${count} 节，该价位剩余 ${Math.max(0, parentTierAvail - count)} 节</p>` : ''}
        ${canProxy ? `<button data-action="confirm-lock-slot" class="mt-2 flex h-10 w-full items-center justify-center gap-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-700 transition hover:bg-slate-50">${icon('lock', 'h-4 w-4')}锁定时段 / 设为不可约</button>` : ''}`;
    }

    function renderStaffStudentPick() {
      const slot = bookingSlot();
      const count = Math.max(1, Math.min(4, Math.round((state.bookDuration || 30) / 30)));
      const times = slot ? bookingTimes(slot.time, count) : [];
      const q = (state.staffStudentSearch || '').trim();
      const lower = q.toLowerCase();
      const list = Object.values(STUDENTS).filter((stu) => {
        if (!lower) return true;
        return [stu.name, stu.nick, stu.short, stu.label, stu.realName]
          .some((field) => String(field || '').toLowerCase().includes(lower));
      }).sort((a, b) => {
        if (a.key === state.staffStudent) return -1;
        if (b.key === state.staffStudent) return 1;
        return 0;
      });
      const parsed = parseStandardNick(state.quickTrialNick);
      const isDup = state.quickTrialNick.trim() && Object.values(STUDENTS).some((s) => s.name.toLowerCase() === state.quickTrialNick.trim().toLowerCase());
      return `<div class="mt-2.5 rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[12px] font-semibold text-slate-600">选择学员（按英文名搜索）</span>
          <button type="button" data-action="toggle-quick-trial" class="inline-flex h-7 items-center gap-1 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70">${icon('user-plus', 'h-3.5 w-3.5')}${state.quickTrialOpen ? '收起建档' : '+ 快速建试课档'}</button>
        </div>
        <div class="relative mt-1.5">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
          <input type="text" data-staff-student-search value="${esc(state.staffStudentSearch)}" placeholder="输入规范英文名 / 英文名 / 小名（如 MarkL10）" class="h-10 w-full rounded-xl border border-slate-200 bg-slate-50/70 pl-9 pr-8 text-[14px] font-medium text-slate-900 placeholder:text-slate-500 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/15">
          ${q ? `<button type="button" data-action="clear-staff-student-search" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-700">${icon('x', 'h-4 w-4')}</button>` : ''}
        </div>
        ${state.quickTrialOpen ? `<div class="mt-2 rounded-xl border border-indigo-200 bg-white p-3">
          <div class="flex items-center justify-between">
            <span class="text-[12px] font-bold text-indigo-900">快速创建试课学员档案（待认领）</span>
            <span class="rounded bg-amber-50 px-1.5 py-0.5 text-[12px] font-bold text-amber-800">UNBOUND</span>
          </div>
          <div class="mt-2 space-y-2">
            <div>
              <label class="block text-[12px] font-semibold text-slate-600">规范英文名 <span class="text-rose-500">*</span></label>
              <input type="text" data-quick-trial-nick value="${esc(state.quickTrialNick)}" placeholder="如 MarkL10（英文名+姓首字母+年龄）" class="mt-0.5 h-10 w-full rounded-xl border border-slate-200 bg-slate-50/70 px-3 text-[14px] font-semibold text-slate-900 placeholder:text-slate-500 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/15">
              ${parsed && !isDup

            </div>

              <button type="button" data-action="create-quick-trial" class="h-7 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 hover:bg-indigo-100/70">确认建档并选中</button>
            </div>
          </div>
        </div>` : ''}
        <div class="mt-2 max-h-40 space-y-1.5 overflow-y-auto pr-0.5">
          ${list.length ? list.map((stu) => {
            const on = state.staffStudent === stu.key;
            const cr = studentCredits(stu.key);
            const busyAt = slot ? studentBusyAt(stu.key, slot.day, times) : '';
            const alias = stu.label && stu.label !== stu.name ? ` · ${stu.label}` : '';
            return `<button type="button" data-action="pick-staff-student" data-key="${esc(stu.key)}" class="flex w-full items-center justify-between gap-2 rounded-lg border px-2.5 py-2 text-left transition ${on ? 'border-indigo-300 bg-indigo-50 ring-1 ring-indigo-100' : 'border-slate-200 bg-white hover:bg-slate-50'}">
              <span class="min-w-0 flex-1">
                <span class="flex items-center gap-1.5">
                  <span class="truncate text-[14px] font-bold text-slate-900">${esc(stu.name)}</span>
                  <span class="shrink-0 rounded border px-1.5 py-0.5 text-[12px] font-bold ${stu.status === '试课' ? 'border-amber-300 bg-amber-50 text-amber-800' : 'border-emerald-200 bg-emerald-50 text-emerald-700'}">${esc(stu.status)}</span>
                </span>
                <span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">待排 ${cr} 节${esc(alias)}${stu.contact ? ` · ${esc(stu.contact)}` : ''}</span>
              </span>
              ${busyAt ? `<span class="shrink-0 rounded bg-amber-100 px-1.5 py-0.5 text-[12px] font-bold text-amber-800">⚠️ ${esc(busyAt)}已有课</span>` : (on ? `<span class="shrink-0 text-indigo-600">${icon('check-circle-2', 'h-4 w-4')}</span>` : '')}
            </button>`;
          }).join('') : `<div class="rounded-lg border border-dashed border-slate-200 bg-white p-3 text-center">
            <p class="text-[12px] font-medium text-slate-500">未找到匹配“${esc(q)}”的学员</p>
            <button type="button" data-action="prefill-quick-trial" class="mt-2 inline-flex h-7 items-center gap-1 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 hover:bg-indigo-100/70">${icon('user-plus', 'h-3.5 w-3.5')}立即创建试课档案</button>
          </div>`}
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 老师课次抽屉（保持原有轻量交互）
     * ------------------------------------------------------------------ */
    function handoverMeta(lesson) {
      if (!lesson) return null;
      const student = STUDENTS[lesson.student];
      if (lesson.kind === 'sub') {
        return { by: lesson.teacher, at: (student && student.notesAt) || '11.15 20:10' };
      }
      if (lesson.kind === 'subbing') {
        return { by: lesson.originTeacher || 'linda', at: '11.15 21:05' };
      }
      return null;
    }

    function renderStudentLearningCard(lesson) {
      const student = STUDENTS[lesson.student];
      if (!student) return '';
      const handover = handoverMeta(lesson);
      return `<div class="mt-2 rounded-xl border border-slate-300 bg-slate-50/70 p-3">

            <a href="m1e_courseware.html" class="text-[12px] font-semibold text-indigo-600 hover:text-indigo-700">课件库 →</a>
          </div>
        </div>
        <div class="mt-1.5 rounded-lg border border-slate-200 bg-white px-2.5 py-2">

            <span class="shrink-0 rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-semibold text-slate-700">${esc(student.level || '未设置级别')}</span>
          </div>
          <div class="mt-1 flex items-center justify-between gap-2 text-[12px]">
            <span class="font-medium text-slate-600">学习进度</span>
            <span class="font-bold text-indigo-700">${esc(student.progressText || '待录入')}</span>
          </div>
          <div class="mt-1 flex items-center justify-between gap-2 text-[12px] text-slate-500">
            <span class="truncate">最后更新：${esc(student.lastUpdatedBy || '暂无')}</span>
          </div>
          <div class="mt-0.5 flex items-center justify-between gap-2 text-[12px] text-slate-500">
            <span class="truncate">主力更新老师：${esc(student.mainTeacher || '暂无')}</span>
            ${student.stale6Months ? `<span class="shrink-0 rounded border border-amber-300 bg-amber-50 px-1.5 py-0.5 text-[11px] font-bold text-amber-800">近 6 个月没有更新</span>` : ''}
          </div>
        </div>
        <div class="mt-1.5 rounded-lg bg-white px-2.5 py-2">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-600">最新备注 Notes</span>
            <span class="text-[12px] font-medium text-slate-500">${esc(student.notesAt || '')}</span>
          </div>
          <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-700">${esc(student.notes || '暂无备注')}</p>
        </div>
        ${handover
          ? `<div class="mt-1.5 flex items-start justify-between gap-2 rounded-lg border border-purple-200 bg-purple-50 px-2.5 py-2">
              <span class="min-w-0">
                <span class="block truncate text-[12px] font-semibold text-purple-900">Handover updated by ${esc(teacherName(handover.by))}</span>
                <span class="mt-0.5 block text-[12px] font-medium text-purple-800">更新于 ${esc(handover.at)}</span>
              </span>
              <button data-action="edit-handover" class="h-7 shrink-0 rounded-lg border border-purple-200 bg-white px-2.5 text-[12px] font-bold text-purple-800">编辑交接</button>
            </div>`
          : `<button data-action="edit-handover" class="mt-2 h-7 rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 hover:bg-indigo-100/70">补充备注</button>`}
      </div>`;
    }

    function renderHandoverBrief(studentKey) {
      const student = STUDENTS[studentKey];
      if (!student) return '';
      return `<div class="rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[12px] font-semibold text-slate-600">学员交接信息</span>
          <span class="text-[12px] font-medium text-slate-500">${esc(student.notesAt || '')}</span>
        </div>
        <p class="mt-1 text-[12px] font-semibold text-slate-800">${esc(student.courseware || '未设置')} · ${esc(student.level || '未设置级别')} · ${esc(student.progressText || '')}</p>
        <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">${esc(student.notes || '暂无备注')}</p>
      </div>`;
    }

    function renderStaffLessonSheet() {
      if (state.role !== 'teacher') {
        if (state.panel === 'leave-move') return renderCoordLeaveMovePanel();
        if (state.panel === 'sub') return renderCoordSubPanel();
        if (state.panel === 'attendance') return renderCoordAttendancePanel();
        if (state.panel === 'withdraw') return renderWithdrawPanel();
        if (state.panel === 'change-student') return renderChangeStudentPanel();
        if (state.panel === 'exception-backfill') return renderExceptionBackfillPanel();
        return renderCoordSummarySheet();
      }
      if (state.panel === 'attendance') return renderAttendancePanel();
      const lesson = state.lesson;
      if (!lesson) return '';
      const isGroup = lesson.kind === 'group';
      const student = STUDENTS[lesson.student];
      return `${sheetHeader(isGroup ? '小班教学管理' : '教学管理', slotLabel(lesson.day, lesson.time, isGroup ? 2 : 1))}
        ${renderLessonInfo(lesson)}
        ${isGroup ? '' : renderStudentLearningCard(lesson)}
        ${renderTeacherActions(lesson, isGroup)}
        ${!isGroup ? `<button data-action="enter-classin" class="mt-2 flex h-11 w-full items-center justify-center gap-1.5 rounded-xl bg-indigo-600 text-[14px] font-bold text-white transition hover:bg-indigo-700">${icon('external-link', 'h-4 w-4')}进入Classin</button>` : ''}
        ${isGroup ? '' : `<div class="mt-2 flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-white text-[14px]">${student.emoji}</span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-[14px] font-semibold text-slate-900">${esc(student.name)}</span>
            <span class="block text-[12px] font-medium text-slate-600">${student.age} 岁 · ${esc(student.label)}</span>

          <span class="flex shrink-0 items-center gap-2">

    function renderTeacherActions(lesson, isGroup) {
      return `<div class="mt-2.5 space-y-2">
        ${actionRow('start-attendance', 'clipboard-check', '考勤打卡', isGroup ? '记录整班出勤情况' : '正常出勤 / 学员旷课 / 老师旷课', '')}
        ${actionRow('start-teacher-report', 'calendar-x', '申请请假 / 突发状况报备', '当天时段多选 · 1~12 节 · 不可抗力分类', '')}
      </div>`;
    }

    function actionRow(action, iconName, title, desc, tone, disabled = false) {
      return `<button data-action="${action}" ${disabled ? 'disabled' : ''} class="flex h-12 w-full items-center gap-2.5 rounded-xl border px-3 text-left transition ${disabled ? 'cursor-not-allowed border-slate-200 bg-slate-50' : tone === 'danger' ? 'border-rose-200 bg-rose-50 hover:bg-rose-100' : 'border-slate-200 bg-white hover:bg-slate-50'}">
        <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg ${disabled ? 'bg-slate-100 text-slate-500' : tone === 'danger' ? 'bg-white text-rose-700' : 'bg-slate-100 text-slate-700'}">${icon(iconName, 'h-4 w-4')}</span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-[14px] font-bold ${disabled ? 'text-slate-500' : tone === 'danger' ? 'text-rose-800' : 'text-slate-900'}">${title}</span>
          <span class="mt-0.5 block truncate text-[12px] font-medium ${disabled ? 'text-slate-600' : tone === 'danger' ? 'text-rose-700' : 'text-slate-600'}">${desc}</span>
        </span>
        ${disabled ? icon('lock', 'h-4 w-4 shrink-0 text-slate-500') : icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-500')}
      </button>`;
    }

    /* ------------------------------------------------------------------
     * 班长 / 管理员 · 3 层紧凑课格抽屉
     * ------------------------------------------------------------------ */
    function coordScope() {
      const lesson = state.lesson;
      if (!lesson) return [];
      const pair = pairFor(lesson);
      if (!pair || state.pairLink === false) return [lesson];
      return pair.slice().sort((a, b) => toMin(a.time) - toMin(b.time));
    }

    function coordScopeLabel(scope) {
      if (!scope.length) return '';
      const first = scope[0];
      return `${dayLabel(first.day)} ${first.time} - ${endTime(scope[scope.length - 1].time)} · ${scope.length} 节`;
    }

    function coordTile(action, iconName, title, desc, disabled = false) {
      return `<button data-action="${action}" ${disabled ? 'disabled' : ''} class="flex min-h-[70px] w-full flex-col items-start gap-1 rounded-xl border p-2.5 text-left transition ${disabled ? 'cursor-not-allowed border-slate-200 bg-slate-50' : 'border-slate-200 bg-white hover:bg-slate-50 active:scale-[0.99]'}">
        <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg ${disabled ? 'bg-slate-100 text-slate-500' : 'bg-slate-100 text-slate-700'}">${icon(disabled ? 'lock' : iconName, 'h-4 w-4')}</span>
        <span class="block w-full truncate text-[14px] font-bold ${disabled ? 'text-slate-500' : 'text-slate-900'}">${title}</span>
        <span class="block w-full truncate text-[12px] font-medium ${disabled ? 'text-slate-500' : 'text-slate-600'}">${desc}</span>
      </button>`;
    }

    function renderCoordSummarySheet() {
      const lesson = state.lesson;
      if (!lesson) return '';
      const isGroup = lesson.kind === 'group';
      const scope = coordScope();
      const pair = isGroup ? null : pairFor(lesson);
      const linked = !!pair && state.pairLink !== false;
      const other = pair ? pair.find((item) => item.time !== lesson.time) : null;
      const settled = state.lessonSettled;
      const isSub = lesson.kind === 'sub' || !!lesson.actual;
      const cls = isGroup ? (CLASSES[lesson.classId] || CLASSES.ket1) : null;
      const student = STUDENTS[lesson.student] || STUDENTS.alice;
      return `${sheetHeader('课次动作', coordScopeLabel(scope))}
        <section aria-label="课次与对象摘要" class="rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="flex min-w-0 items-center gap-1.5">
              <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${TYPE_NAME[lesson.kind] || '课次'}</span>

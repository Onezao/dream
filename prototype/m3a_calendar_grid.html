            ${segment('device', [
              { value: 'mobile', label: '手机' },
              { value: 'tablet', label: '平板' }
            ], state.device)}
            ${segment('network', [
              { value: 'online', label: '在线' },
              { value: 'offline', label: '离线' }
            ], state.online ? 'online' : 'offline')}
            <button data-action="reset-demo" class="h-8 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">重置演示</button>
            <a href="../docs/prd/m3a_calendar_grid.md" target="_blank" rel="noopener" class="flex h-8 items-center gap-1 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">
              ${icon('file-text', 'h-3.5 w-3.5')}PRD 文档
            </a>
            <button type="button" data-console-collapse aria-label="收起演示导航" class="ml-auto flex h-7 shrink-0 items-center gap-1 rounded-lg border border-slate-200 bg-white px-2.5 text-[12px] font-semibold text-slate-600 transition hover:bg-slate-50">▲ 收起</button>
          </div>
          <div class="mt-2 flex flex-wrap items-center gap-1.5">
            ${SCENARIOS.map((item) => `<button data-scenario="${item.value}" class="h-7 rounded-lg border px-2.5 text-[12px] font-semibold transition ${state.scenario === item.value ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}">${item.label}</button>`).join('')}
            <span class="ml-auto flex items-center gap-1 text-[12px] font-medium text-slate-500">
              ${icon('info', 'h-3.5 w-3.5')}家长守门槛 · 班长不锁 · 开课前不足 3 小时仅温和提示
            </span>
          </div>
        </div>
      </header>
      <div data-console-mini class="sticky top-0 z-[60] ${state.consoleCollapsed ? 'flex' : 'hidden'} items-center justify-end border-b border-slate-200/60 bg-white/70 px-2 py-1 backdrop-blur">
        <button type="button" data-console-expand class="flex h-6 items-center gap-1 rounded-full bg-slate-900/70 px-2.5 text-[12px] font-semibold text-white/90 backdrop-blur transition hover:bg-slate-900/85" aria-label="展开演示导航">▾ 导航</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.addEventListener('click', (event) => {
      if (event.target.closest('[data-console-collapse]')) {
        setConsoleCollapsed(true);
        return;
      }
      if (event.target.closest('[data-console-expand]')) {
        setConsoleCollapsed(false);
        return;
      }

      const control = event.target.closest('[data-control]');
      if (control) {
        handleControl(control.dataset.control, control.dataset.value);
        return;
      }

      const scenario = event.target.closest('[data-scenario]');
      if (scenario) {
        applyScenario(scenario.dataset.scenario);
        render(false);
        if (state.scenario === 'booked') armFlashTimers();
        return;
      }

      const actionEl = event.target.closest('[data-action]');
      if (!actionEl) {
        if (state.batchOpen && !event.target.closest('#batchMenu')) {
          state.batchOpen = false;
          render(true);
        }
        return;
      }

      const action = actionEl.dataset.action;
      const key = actionEl.dataset.key;
      const value = actionEl.dataset.value;

      switch (action) {
        case 'bell':
          showToast('有 2 条新的课表通知');
          break;
        case 'open-children':
          state.drawer = 'children';
          state.panel = null;
          render(true);
          break;
        case 'open-asset':
          if (state.role !== 'parent' && state.lesson) state.child = state.lesson.student;
          state.drawer = 'asset';
          state.panel = null;
          render(true);
          break;
        case 'open-teachers':
          state.drawer = 'teachers';
          state.panel = null;
          render(true);
          break;
        case 'open-schedule-select':
          if (state.role !== 'monitor' && state.role !== 'admin') break;
          state.scheduleSelect = true;
          state.scheduleMode = 'single';
          state.scheduleStudent = null;
          state.scheduleClass = null;
          state.scheduleSel = {};
          resetScheduleWeeks();
          state.renewalEdit = false;
          state.renewalOrderId = '';
          state.renewalReturn = '';
          state.renewalSaved = false;
          state.week = 0;
          state.drawer = null;
          state.panel = null;
          state.modal = null;
          state.batchOpen = false;
          render(true);
          showToast('已开启排课复选态，已定位到第 1 周模板周');
          break;
        case 'exit-schedule-select':
          exitScheduleSelect();
          break;
        case 'open-schedule-object':
          state.drawer = 'schedule-object';
          state.panel = null;
          render(true);
          break;
        case 'open-class-view':
          state.classView = actionEl.dataset.class || (state.lesson && state.lesson.classId) || 'ket1';
          state.classArchived = !!classInfo(state.classView).archived;
          state.classFullDay = false;
          state.classFoldOpen = {};
          seedClassDemoLessons(state.classView);
          state.view = 'class';
          state.drawer = null;
          state.panel = null;
          state.lesson = null;
          state.classNoteOpen = false;
          render(true);
          showToast(`已进入 ${classInfo(state.classView).name} · 小班专属周课表`);
          break;
        case 'exit-class-view':
          state.view = 'week';
          state.classArchived = false;
          state.classFullDay = false;
          state.classFoldOpen = {};
          state.drawer = null;
          state.panel = null;
          state.lesson = null;
          state.classBackfill = null;
          state.classMove = null;
          render(true);
          break;
        case 'toggle-class-full-day':
          state.classFullDay = !state.classFullDay;
          render(true);
          break;
        case 'toggle-class-fold': {
          const start = actionEl.dataset.start;
          if (start) state.classFoldOpen[start] = !state.classFoldOpen[start];
          render(true);
          break;
        }
        case 'cancel-class-move':
          state.classMove = null;
          render(true);
          showToast('已取消同师双格挪位');
          break;
        case 'class-cell': {
          const day = Number(actionEl.dataset.day);
          const time = actionEl.dataset.time;
          const lesson = classLessonsAt(day, time)[0];
          if (!lesson) break;
          state.lesson = lesson;
          state.classNoteOpen = false;
          state.drawer = 'class-lesson';
          state.panel = null;
          render(true);
          break;
        }
        case 'class-slot':
          if (state.classMove) {
            performClassMove(Number(actionEl.dataset.day), actionEl.dataset.time);
            break;
          }
          state.classBackfill = { day: Number(actionEl.dataset.day), time: actionEl.dataset.time };
          state.drawer = 'class-backfill';
          state.panel = null;
          render(true);
          break;
        case 'class-backfill-confirm':
          confirmClassBackfill();
          break;
        case 'class-note-toggle':
          state.classNoteOpen = !state.classNoteOpen;
          render(true);
          break;
        case 'parent-class-note-toggle':
          state.parentClassNoteOpen = !state.parentClassNoteOpen;
          render(true);
          break;
        case 'class-edit-note':
          showToast('已打开小班课件 / Process Note 编辑（原型模拟）');
          break;
        case 'class-teacher-leave':
          markClassTeacherLeave();
          break;
        case 'class-attendance':
          if (state.lesson) {
            state.drawer = 'staff-lesson';
            state.panel = 'attendance';
            render(true);
          }
          break;
        case 'class-sub-open':
          if (state.lesson) {
            state.drawer = 'staff-lesson';
            state.panel = 'sub';
            render(true);
          }
          break;
        case 'class-move':
          if (state.lesson && state.lesson.kind === 'group') {
            state.classMove = { lesson: state.lesson, times: groupSpanTimes(state.lesson) };
          }
          state.drawer = null;
          render(true);
          showToast('请在本班网格点选当前主讲老师连续 2 格绿色空闲格完成同师双格挪位');
          break;
        case 'class-withdraw':
          withdrawClassLesson();
          break;
        case 'class-backfill-old':
          showToast('异常未上课回退补生仅在已结课且未归集时可用');
          break;
        case 'pick-schedule-object': {
          if (!key) break;
          if (actionEl.dataset.kind === 'class' && CLASSES[key]) {
            state.scheduleClass = key;
            state.scheduleStudent = null;
          } else if (STUDENTS[key]) {
            state.scheduleStudent = key;
            state.scheduleClass = null;
          } else {
            break;
          }
          state.scheduleSel = {};
          resetScheduleWeeks();
          state.scheduleMode = scheduleModeForObject(scheduleObjectInfo());
          state.week = 0;
          state.drawer = null;
          render(true);
          showToast(actionEl.dataset.kind === 'class'
            ? `已选择小班 ${CLASSES[state.scheduleClass].code}，请从第 1 周模板周选格`
            : `已选择学员 ${STUDENTS[state.scheduleStudent].name}，请从第 1 周模板周选格`);
          break;
        }
        case 'schedule-mode':
          setScheduleMode(actionEl.dataset.mode);
          break;
        case 'schedule-slot': {
          const day = Number(actionEl.dataset.day);
          const time = actionEl.dataset.time;
          const pair = !!actionEl.dataset.pair;
          toggleScheduleSlot(day, time, pair);
          break;
        }
        case 'restore-schedule-week':
          restoreScheduleWeek(Number(actionEl.dataset.week));
          break;
        case 'remove-schedule-slot':
          delete scheduleWeekMap(state.week)[scheduleSlotKey(Number(actionEl.dataset.day), actionEl.dataset.time)];
          if (state.week > 0) state.scheduleWeekStatus[state.week] = 'adjusted';
          else scheduleSyncDerivedWeeks();
          render(true);
          break;
        case 'confirm-schedule-select':
          confirmScheduleSelect();
          break;
        case 'clear-sub-search':
          state.subSearch = '';
          render(true);
          break;
        case 'clear-change-search':
          state.changeSearch = '';
          render(true);
          break;
        case 'prev-round':
          state.roundOffset -= 1;
          if (state.reschedule) {
            state.drawer = null;
            state.panel = null;
            state.modal = null;
          } else {
            closeLayers();
          }
          render(true);
          break;
        case 'next-round':
          state.roundOffset += 1;
          if (state.reschedule) {
            state.drawer = null;
            state.panel = null;
            state.modal = null;
          } else {
            closeLayers();
          }
          render(true);
          break;
        case 'set-week':
          if (state.scheduleSelect && scheduleSingleMode() && clampWeek(actionEl.dataset.week) !== state.week) {
            state.scheduleSel = {};
            resetScheduleWeeks();
          }
          state.week = clampWeek(actionEl.dataset.week);
          state.drawer = null;
          state.panel = null;
          state.modal = null;
          render(true);
          break;
        case 'toggle-fold': {
          const start = actionEl.dataset.start;
          if (start) state.foldOpen[start] = !state.foldOpen[start];
          render(true);
          break;
        }
        case 'cell':
          handleCell(Number(actionEl.dataset.day), actionEl.dataset.time);
          break;
        case 'day-date':
          state.dayKey = Number(actionEl.dataset.value);
          state.dayCell = null;
          state.dayFreeCell = null;
          state.dayIncident = null;
          state.dayCompare = false;
          state.drawer = null;
          render(state.dayKey !== 0);
          break;
        case 'day-mode':
          state.dayMode = value === 'student' ? 'student' : 'teacher';
          state.dayIncident = null;
          state.dayCompare = false;
          render(true);
          break;
        case 'day-filter':
          state.dayFilter = value === 'abnormal' ? 'abnormal' : 'all';
          render(true);
          break;
        case 'day-scope':
          state.dayScope = value === 'all' ? 'all' : 'managed';
          render(true);
          break;
        case 'day-clear-search':
          state.daySearch = '';
          render(true);
          break;
        case 'day-cell':
          handleDayCell(Number(actionEl.dataset.day), actionEl.dataset.mode, actionEl.dataset.key, actionEl.dataset.time);
          break;
        case 'day-free':
        case 'day-leave-free': {
          const dk = Number(actionEl.dataset.day);
          if (dk < 0) { showToast('昨天仅只读复盘，隐藏空闲格操作'); break; }
          state.dayFreeCell = { dayKey: dk, key, time: actionEl.dataset.time, kind: action === 'day-leave-free' ? 'leaveFree' : 'free' };
          state.drawer = 'day-free';
          render(true);
          break;
        }
        case 'day-restore-leave-free': {
          const fc = state.dayFreeCell;
          if (!fc) break;
          delete dayOverrides[`${fc.dayKey}|${fc.key}|${fc.time}`];
          state.dayFreeCell = null;
          state.drawer = null;
          render(true);
          showToast('已销假，课格恢复为 🟢 空闲可约');
          break;
        }
        case 'day-lock-slot': {
          const fc = state.dayFreeCell;
          if (!fc) break;
          dayOverrides[`${fc.dayKey}|${fc.key}|${fc.time}`] = { forced: 'rest' };
          state.dayFreeCell = null;
          state.drawer = null;
          render(true);
          showToast('已锁时段（仅本日生效，不延续至下周）');
          break;
        }
        case 'day-unlock-slot': {
          const fc = state.dayFreeCell;
          if (!fc) break;
          delete dayOverrides[`${fc.dayKey}|${fc.key}|${fc.time}`];
          state.dayFreeCell = null;
          state.drawer = null;
          render(true);
          showToast('已解锁，课格恢复为 🟢 空闲可约');
          break;
        }
        case 'day-quick-book': {
          const fc = state.dayFreeCell;
          if (!fc) break;
          state.teacher = fc.key;
          state.target = { day: 4, time: fc.time };
          state.dayFreeCell = null;
          state.drawer = 'staff-free';
          state.panel = null;
          render(true);
          break;
        }
        case 'day-quick-move': {
          const cell = state.dayCell;
          const nextTimeStr = actionEl.dataset.time;
          if (!cell || !nextTimeStr) break;
          const item = cell.mode === 'teacher' ? dayTeacherItem(cell.dayKey, cell.key, cell.time) : dayStudentItem(cell.dayKey, cell.key, cell.time);
          if (!item) break;
          dayOverrides[`${cell.dayKey}|${item.teacher}|${cell.time}`] = { forced: 'available', leaveFree: true };
          dayOverrides[`${cell.dayKey}|${item.teacher}|${nextTimeStr}`] = Object.assign({}, item, { time: nextTimeStr, sub: null });
          state.dayCell = null;
          state.drawer = null;
          render(true);
          showToast(`已当天同师挪位至 ${nextTimeStr}（原时段已释放）`);
          break;
        }
        case 'day-withdraw': {
          const cell = state.dayCell;
          if (!cell) break;
          const item = cell.mode === 'teacher' ? dayTeacherItem(cell.dayKey, cell.key, cell.time) : cell.mode === 'class' ? dayClassItem(cell.dayKey, cell.key, cell.time) : dayStudentItem(cell.dayKey, cell.key, cell.time);
          if (!item) break;
          dayOverrides[`${cell.dayKey}|${item.teacher}|${cell.time}`] = { forced: 'available' };
          state.dayCell = null;
          state.drawer = null;
          render(true);
          showToast(item.type === 'group' ? '已撤排退回小班待排池' : '已撤排并退回待排期课次');
          break;
        }
        case 'day-change-student': {
          const cell = state.dayCell;
          if (!cell) break;
          const item = cell.mode === 'teacher' ? dayTeacherItem(cell.dayKey, cell.key, cell.time) : dayStudentItem(cell.dayKey, cell.key, cell.time);
          if (!item) break;
          state.lesson = { day: 0, time: cell.time, teacher: item.teacher, student: item.student, kind: 'fixed' };
          state.drawer = 'staff-lesson';
          state.panel = 'change-student';
          state.dayCell = null;
          render(true);
          break;
        }
        case 'day-empty':
          showToast('该时段暂无排课');
          break;
        case 'day-compare':
          state.dayCompare = !state.dayCompare;
          render(true);
          break;
        case 'day-compare-off':
          state.dayCompare = false;
          render(true);
          break;
        case 'day-assign':
          assignDaySub(key);
          break;
        case 'day-proxy-teacher-leave':
          proxyTeacherLeave();
          break;
        case 'day-proxy-leave':
          proxyDayLeave();
          break;
        case 'day-group-pause':
          pauseDayGroup();
          break;
        case 'day-revoke-sub':
          revokeDaySub();
          break;
        case 'day-attendance':
        case 'day-exception-backfill': {
          const cell = state.dayCell;
          if (!cell) break;
          const item = cell.mode === 'teacher'
            ? dayTeacherItem(cell.dayKey, cell.key, cell.time)
            : cell.mode === 'class'
              ? dayClassItem(cell.dayKey, cell.key, cell.time)
              : dayStudentItem(cell.dayKey, cell.key, cell.time);
          if (!item) break;
          const started = Number(cell.dayKey) === -1 || (Number(cell.dayKey) === 0 && toMin(cell.time) <= DAY_NOW_MIN);
          state.lesson = item.type === 'group'
            ? { day: 0, time: cell.time, teacher: item.teacher, student: 'alice', kind: 'group', classId: item.classId, dur: item.dur || 2, actual: item.sub || null, started }
            : { day: 0, time: cell.time, teacher: item.teacher, student: item.student, kind: 'fixed', started };
          state.lessonSettled = Number(cell.dayKey) === -1;
          state.drawer = 'staff-lesson';
          state.panel = action === 'day-attendance' ? 'attendance' : 'exception-backfill';
          state.dayCell = null;
          state.dayCompare = false;
          render(true);
          break;
        }
        case 'day-sub-open': {
          const cell = state.dayCell;
          if (!cell) break;
          const item = cell.mode === 'teacher'
            ? dayTeacherItem(cell.dayKey, cell.key, cell.time)
            : cell.mode === 'class'
              ? dayClassItem(cell.dayKey, cell.key, cell.time)
              : dayStudentItem(cell.dayKey, cell.key, cell.time);
          if (!item) break;
          state.lesson = item.type === 'group'
            ? { day: 0, time: cell.time, teacher: item.teacher, student: 'alice', kind: 'group', classId: item.classId, dur: item.dur || 2, actual: item.sub || null, pendingSub: !!item.pendingSub }
            : { day: 0, time: cell.time, teacher: item.teacher, student: item.student, kind: item.type === 'pendingSub' ? 'fixed' : (item.sub ? 'sub' : 'fixed'), actual: item.sub || null };
          state.drawer = 'staff-lesson';
          state.panel = 'sub';
          state.subSearch = '';
          state.subLeaveOnly = false;
          state.dayCell = null;
          state.dayCompare = false;
          render(true);
          break;
        }
        case 'day-move-class':
          showToast('跨组急救小班挪位请在“小班专属周课表”内点选连续 2 格空闲绿格完成');
          break;
        case 'day-move-rescue':
          showToast('跨组急救 1v1 挪位请切换至老师周课表，仅熔断离职日 D 且不跨带 ≥3h 节次');
          break;
        case 'day-week':
          openDayWeekView();
          break;
        case 'exit-week-student':
          state.weekStudent = null;
          render(true);
          break;
        case 'confirm-staff-gentle': {
          const pending = state.modal;
          state.modal = null;
          if (!pending) break;
          if (pending.action === 'coord-leave') applyCoordLeave(pending.cells || []);
          else if (pending.action === 'coord-teacher-leave') applyCoordTeacherLeave(pending.cells || []);
          else if (pending.action === 'revoke-sub') applyRevokeSub();
          else if (pending.action === 'proxy-leave') proxyLeave(true);
          else if (pending.action === 'reschedule') beginReschedule(pending.cells || [], true);
          else if (pending.action === 'change-student') confirmChangeStudent(true);
          else if (pending.action === 'sub') confirmSub(true);
          break;
        }
        case 'close-drawer':
          state.drawer = null;
          state.panel = null;
          render(true);
          break;
        case 'back-panel':
          if (['teacher-report', 'teacher-free'].includes(state.drawer)) {
            state.drawer = null;
          }
          state.panel = null;
          render(true);
          break;
        case 'start-leave':
          state.leaveCells = state.lesson ? [state.lesson] : [];
          state.panel = 'leave';
          render(true);
          break;
        case 'pair-leave': {
          const pair = pairFor(state.lesson) || (state.lesson ? [state.lesson] : []);
          const cells = pair.filter((item) => state.pairSel[item.time] !== false);
          if (!cells.length) {
            showToast('请至少勾选 1 节');
            break;
          }
          state.leaveCells = cells;
          state.panel = 'leave';
          render(true);
          break;
        }
        case 'pair-reschedule': {
          const pair = pairFor(state.lesson) || (state.lesson ? [state.lesson] : []);
          const cells = pair.filter((item) => state.pairSel[item.time] !== false);
          beginReschedule(cells);
          break;
        }
        case 'start-reschedule':
          beginReschedule(state.lesson ? [state.lesson] : []);
          break;
        case 'cancel-reschedule':
          state.reschedule = null;
          render(true);
          break;
        case 'confirm-leave':
          confirmLeave();
          break;
        case 'confirm-leave-gentle':
          confirmLeave(true);
          break;
        case 'confirm-book':
          confirmBooking();
          break;
        case 'set-book-tier': {
          const tier = Number(value);
          if (PRICE_TIERS.includes(tier) && studentTempTierCredits(state.child, tier) > 0) {
            state.bookTier = tier;
            state.bookTeacherSearch = '';
            render(true);
          }
          break;
        }
        case 'set-duration': {
          const cnt = Math.max(1, Math.min(4, Math.round(Number(value) / 30)));
          const check = canBookCount(cnt);
          if (!check.ok) {
            showToast(check.reason || `连约 ${cnt} 节不可选`);
            break;
          }
          state.bookDuration = cnt * 30;
          render(true);
          break;
        }
        case 'pick-book-teacher':
          if (TEACHERS[key]) state.bookTeacher = key;
          render(true);
          break;
        case 'clear-book-teacher-search':
          state.bookTeacherSearch = '';
          render(true);
          break;
        case 'edit-handover':
          showToast('交接信息编辑已打开（原型模拟）');
          break;
        case 'pick-staff-student':
          state.staffStudent = key || 'alice';
          render(true);
          break;
        case 'clear-staff-student-search':
          state.staffStudentSearch = '';
          render(true);
          break;
        case 'toggle-quick-trial':
          state.quickTrialOpen = !state.quickTrialOpen;
          state.quickTrialError = '';
          if (state.quickTrialOpen && !state.quickTrialNick && state.staffStudentSearch.trim()) {
            state.quickTrialNick = state.staffStudentSearch.trim();
          }
          render(true);
          break;
        case 'prefill-quick-trial':
          state.quickTrialOpen = true;
          state.quickTrialError = '';
          state.quickTrialNick = (state.staffStudentSearch || '').trim();
          render(true);
          break;
        case 'cancel-quick-trial':
          state.quickTrialOpen = false;
          state.quickTrialError = '';
          render(true);
          break;
        case 'create-quick-trial':
          createQuickTrialStudent();
          break;
        case 'toggle-quick-trial-order':
          state.quickTrialOrderSync = !state.quickTrialOrderSync;
          render(true);
          break;
        case 'confirm-lock-slot':
        case 'lock-target-slot':
          confirmLockSlot();
          break;
        case 'restore-rest-slot':
          restoreRestSlot();
          break;
        case 'unlock-rest-slot':
          unlockRestSlot();
          break;
        case 'select-child':
          state.child = key === 'bob' ? 'bob' : 'alice';
          state.scenario = 'parent';
          state.drawer = null;
          state.panel = null;
          state.pairSel = {};
          state.foldOpen = {};
          state.bookTier = null;
          render(true);
          showToast(`已切换至 ${STUDENTS[state.child].nick}`);
          break;
        case 'select-teacher':
          if (TEACHERS[key]) state.teacher = key;
          state.drawer = null;
          state.panel = null;
          render(true);
          showToast(`已切换至 ${activeTeacher().name}`);
          break;
        case 'coord-pair-count': {
          const cnt = Math.max(1, Math.min(4, Number(actionEl.dataset.count) || 1));
          const pair = state.lesson ? pairFor(state.lesson) : null;
          state.pairLink = cnt > 1;
          state.pairSel = {};
          if (pair) {
            const startIdx = Math.max(0, pair.findIndex((item) => item.time === state.lesson.time));
            const picked = pair.slice(startIdx, startIdx + cnt);
            if (picked.length < cnt) {
              pair.slice(0, cnt).forEach((item) => { state.pairSel[item.time] = true; });
              pair.slice(cnt).forEach((item) => { state.pairSel[item.time] = false; });
            } else {
              pair.forEach((item) => { state.pairSel[item.time] = picked.some((p) => p.time === item.time); });
            }
          }
          render(true);
          break;
        }
        case 'toggle-sub-leave-only':
          state.subLeaveOnly = !state.subLeaveOnly;
          render(true);
          break;
        case 'sub-leave-cause':
          state.subLeaveCause = value === 'coord' ? 'coord' : 'teacher';
          render(true);
          break;
        case 'toggle-ex-freeze':
          state.exBackfillFrozen = !state.exBackfillFrozen;
          render(true);
          break;
        case 'ex-fault':
          if (value === 'platform' && state.role !== 'admin') break;
          state.exBackfillFault = value === 'platform' ? 'platform' : 'teacher';
          render(true);
          break;
        case 'start-leave-move':
          state.panel = 'leave-move';
          render(true);
          break;
        case 'coord-leave':
          coordLeave();
          break;
        case 'coord-teacher-leave':
          coordTeacherLeave();
          break;
        case 'coord-reschedule':
          beginReschedule(coordScope());
          break;
        case 'coord-revoke-sub':
          coordRevokeSub();
          break;
        case 'coord-attendance':
          coordMarkAttendance(value);
          break;
        case 'coord-attendance-normal':
          coordRestoreAttendance();
          break;
        case 'outage-reason':
          state.outageReason = value === 'holiday' ? 'holiday' : 'teacher';
          render(true);
          break;
        case 'start-exception-backfill':
          state.panel = 'exception-backfill';
          render(true);
          break;
        case 'start-sub': {
          state.panel = 'sub';
          state.subSearch = '';
          state.subLeaveOnly = false;
          state.subLeaveCause = 'teacher';
          const candidates = coordSubCandidates(coordScope());
          state.subCandidate = subFirstAvailable(candidates) || 'elena';
          render(true);
          break;
        }
        case 'select-sub':
          state.subCandidate = TEACHERS[key] ? key : 'elena';
          render(true);
          break;
        case 'confirm-sub':
          confirmSub();
          break;
        case 'start-attendance':
          state.panel = 'attendance';
          render(true);
          break;
        case 'mark-attendance':
          markAttendance(value);
          break;
        case 'start-teacher-report': {
          const source = state.lesson || state.target;
          state.reportDay = source ? source.day : 0;
          state.reportSel = {};
          if (source) state.reportSel[source.time] = true;
          state.drawer = 'teacher-report';
          state.panel = null;
          render(true);
          scrollReportToSelected();
          break;
        }
        case 'report-tag':
          state.reportTag = actionEl.dataset.tag || 'power';
          render(true);
          break;
        case 'submit-teacher-report': {
          const day = state.reportDay != null ? state.reportDay : (state.lesson ? state.lesson.day : 0);
          const times = Object.keys(state.reportSel).filter((time) => state.reportSel[time]);
          if (!times.length) {
            showToast('请至少勾选 1 个时段');
            break;
          }
          const meta = reportSelectionMeta();
          if (meta.over) {
            showToast('单次请假最多 12 个 30 分钟格，且跨度不得超过 6 小时');
            break;
          }
          const affected = [];
          times.forEach((time) => {
            const slot = getSlot(day, time);
            if (slot.lesson && slot.lesson.student && !affected.includes(slot.lesson.student)) affected.push(slot.lesson.student);
            if (slot.kind === 'available' || slot.kind === 'rest') {
              overrides[slotKey(state.week, day, time)] = { forced: 'leave' };
            }
          });
          const touched = [];
          affected.forEach((studentKey) => {
            const stored = state.reportHandover[studentKey];
            if (!stored) return;
            const student = STUDENTS[studentKey];
            if (!student) return;
            let changed = false;
            if (stored.progressText && stored.progressText.trim()) {
              student.progressText = stored.progressText.trim();
              student.lastUpdatedBy = `${teacherName(state.teacher)} (老师) · 刚刚`;
              student.stale6Months = false;
              changed = true;
            }
            if (stored.note && stored.note.trim()) { student.notes = stored.note.trim(); changed = true; }
            if (changed) { student.notesAt = '11.16 20:30'; touched.push(student.name); }
          });
          const count = times.length;
          state.drawer = null;
          state.panel = null;
          state.reportDay = null;
          state.reportSel = {};
          state.reportHandover = {};
          render(true);
          showToast(touched.length
            ? `已提交请假报备 · ${count} 节 · 已同步 ${touched.length} 位学员交接信息`
            : `已提交请假报备 · ${count} 节（课格挂起 🔴 待代并进入紧急待代流）`);
          break;
        }
        case 'start-change-student': {
          state.changeSearch = '';
          state.changeNote = '';
          state.changeConfirm = false;
          const candidates = changeStudentCandidates('');
          if (candidates.length) state.changeStudent = candidates[0].key;
          state.panel = 'change-student';
          render(true);
          break;
        }
        case 'select-change-student':
          state.changeStudent = STUDENTS[key] ? key : state.changeStudent;
          state.changeConfirm = false;
          render(true);
          break;
        case 'confirm-change-student':
          confirmChangeStudent();
          break;
        case 'confirm-exception-backfill': {
          if (isFinanceFrozen()) {
            showToast('该课次已入已完成入账周转账单或已打款课酬单，禁止回退');
            break;
          }
          const reason = (state.exBackfillReason || '').trim();
          if (reason.length < 1 || reason.length > 200) {
            showToast('请填写 1–200 字异常说明');
            break;
          }
          const count = coordScope().length;
          const faultMsg = state.exBackfillFault === 'platform' && state.role === 'admin'
            ? '平台故障（不计异常 · 不发薪退 1 节 TS）'
            : '老师原因（记实际授课老师异常 · 不发薪退 1 节 TS）';
          state.exBackfillReason = '';
          state.drawer = null;
          state.panel = null;
          render(true);
          showToast(`已置原 TS 已取消、关联代课工单已取消，${faultMsg}，补生 ${count} 节待排期课次`);
          break;
        }
        case 'start-withdraw':
          state.panel = 'withdraw';
          render(true);
          break;
        case 'confirm-withdraw':
          confirmWithdraw();
          break;
        case 'confirm-group-outage':
          confirmGroupOutage();
          break;
        case 'confirm-open-slot':
          confirmOpenSlot();
          break;
        case 'open-classin-qr':
          state.modal = { type: 'classin-qr', teacherKey: actionEl.dataset.teacher || 'david' };
          render(true);
          break;
        case 'open-monitor-wechat':
          state.modal = {
            type: 'monitor-wechat',
            owner: actionEl.dataset.owner || 'Leo',
            classOwner: actionEl.dataset.classOwner === '1'
          };
          render(true);
          break;
        case 'open-progress-modal': {
          const sKey = actionEl.dataset.student || 'alice';
          const stu = STUDENTS[sKey] || STUDENTS.alice;
          state.progressDraft = stu.progressText || '';
          state.modal = { type: 'update-progress', studentKey: sKey };
          render(true);
          break;
        }
        case 'fill-progress-preset':
          state.progressDraft = actionEl.dataset.value || '';
          render(true);
          break;
        case 'save-progress-modal': {
          const sKey = state.modal && state.modal.studentKey;
          const stu = STUDENTS[sKey];
          if (stu) {
            stu.progressText = (state.progressDraft || '').trim() || stu.progressText;
            stu.lastUpdatedBy = `${teacherName(state.teacher)} (老师) · 刚刚`;
            stu.stale6Months = false;
          }
          state.modal = null;
          render(true);
          showToast('学习进度已更新并同步至学员档案');
          break;
        }
        case 'toggle-report-notes':
          state.reportNotesExpanded = !state.reportNotesExpanded;
          render(true);
          break;
        case 'toggle-proxy-payment':
          state.proxyPaymentConfirmed = !state.proxyPaymentConfirmed;
          render(true);
          break;
        case 'upload-proxy-proof':
          state.proxyProofCount = state.proxyProofCount >= 5 ? 0 : state.proxyProofCount + 1;
          render(true);
          break;
        case 'parent-pick-sub':
          state.drawer = null;
          state.panel = null;
          render(true);
          showToast('已为您匹配同价位代课老师（原型模拟）');
          break;
        case 'parent-return-pending':
          if (state.lesson) {
            releaseLeaveCells([state.lesson]);
          }
          state.drawer = null;
          state.panel = null;
          render(true);
          showToast('已退回待排期池，可在未来 1～7 天自助重约');
          break;
        case 'enter-classin':
          showToast('正在打开 ClassIn');
          break;
        case 'confirm-reschedule':
          applyReschedule();
          break;
        case 'cancel-modal':
          state.modal = null;
          render(true);
          break;
        case 'reset-demo':
          applyScenario('parent');
          state.device = 'mobile';
          state.online = true;
          render(false);
          break;
        default:
          break;
      }
    });

    document.addEventListener('change', (event) => {
      const el = event.target;
      if (el.matches('[data-pair-link]')) {
        state.pairLink = el.checked;
        render(true);
        return;
      }
      if (el.matches('[data-pair]')) {
        state.pairSel[el.dataset.pair] = el.checked;
        return;
      }
      if (el.matches('[data-coord-slot]')) {
        const pair = state.lesson ? pairFor(state.lesson) : null;
        if (state.pairLink === false && pair) {
          pair.forEach((item) => { state.pairSel[item.time] = item.time === state.lesson.time; });
        }
        state.pairSel[el.dataset.coordSlot] = el.checked;
        if (pair) {
          const checkedCount = pair.filter((item) => state.pairSel[item.time] !== false).length;
          if (checkedCount === 0) state.pairSel[state.lesson.time] = true;
          state.pairLink = pair.filter((item) => state.pairSel[item.time] !== false).length > 1;
        }
        render(true);
        return;
      }
      if (el.matches('[data-change-confirm]')) {
        state.changeConfirm = el.checked;
        render(true);
        return;
      }
      if (el.matches('[data-report-slot]')) {
        state.reportSel[el.dataset.reportSlot] = el.checked;
        render(true);
        scrollReportToSelected();
        return;
      }
    });

    function refocusInput(selector) {
      const next = document.querySelector(selector);
      if (!next) return;
      next.focus();
      const end = next.value.length;
      if (next.setSelectionRange) next.setSelectionRange(end, end);
    }

    document.addEventListener('input', (event) => {
      const el = event.target;
      if (el.matches('[data-day-search]')) {
        state.daySearch = el.value;
        render(true);
        refocusInput('[data-day-search]');
        return;
      }
      if (el.matches('[data-sub-search]')) {
        state.subSearch = el.value;
        render(true);
        refocusInput('[data-sub-search]');
        return;
      }
      if (el.matches('[data-change-search]')) {
        state.changeSearch = el.value;
        render(true);
        refocusInput('[data-change-search]');
        return;
      }
      if (el.matches('[data-change-note]')) {
        state.changeNote = el.value;
        render(true);
        refocusInput('[data-change-note]');
        return;
      }
      if (el.matches('[data-staff-student-search]')) {
        state.staffStudentSearch = el.value;
        render(true);
        refocusInput('[data-staff-student-search]');
        return;
      }
      if (el.matches('[data-book-teacher-search]')) {
        state.bookTeacherSearch = el.value;
        render(true);
        refocusInput('[data-book-teacher-search]');
        return;
      }
      if (el.matches('[data-report-handover-student]')) {
        const studentKey = el.dataset.reportHandoverStudent;
        const field = el.dataset.reportHandoverField;
        if (!state.reportHandover[studentKey]) state.reportHandover[studentKey] = {};
        state.reportHandover[studentKey][field] = el.value;
        render(true);
        refocusInput(`[data-report-handover-student="${studentKey}"][data-report-handover-field="${field}"]`);
        return;
      }
      if (el.matches('[data-progress-input]')) {
        state.progressDraft = el.value;
        render(true);
        refocusInput('[data-progress-input]');
        return;
      }
      if (el.matches('[data-quick-trial-nick]')) {
        state.quickTrialNick = el.value;
        state.quickTrialError = '';
        render(true);
        refocusInput('[data-quick-trial-nick]');
        return;
      }
      if (el.matches('[data-quick-trial-contact]')) {
        state.quickTrialContact = el.value;
        state.quickTrialError = '';
        render(true);
        refocusInput('[data-quick-trial-contact]');
        return;
      }
      if (el.matches('[data-ex-backfill-reason]')) {
        state.exBackfillReason = el.value;
        render(true);
        refocusInput('[data-ex-backfill-reason]');
      }
    });

    /* ------------------------------------------------------------------
     * 初始化
     * ------------------------------------------------------------------ */
    function init() {
      const params = new URLSearchParams(window.location.search);
      const roleParam = params.get('role');
      const role = ['parent', 'teacher', 'monitor', 'admin'].includes(roleParam) ? roleParam : null;
      const scenarioParam = params.get('scenario');
      const weekParam = params.get('week');
      const childParam = params.get('child');
      const teacherParam = params.get('teacher');
      const deviceParam = params.get('device');
      const hoursParam = Number(params.get('hours'));
      const booked = params.get('booked') === '1';
      const viewParam = params.get('view');
      const teacherIdParam = params.get('teacherId');
      const teacherNameParam = params.get('teacherName') || '';
      const ownerParam = params.get('owner') || '';
      const ownedParam = params.get('owned');
      const tierParam = params.get('tier') || '';
      const teacherStatusParam = params.get('teacherStatus') || '';
      const resignDateParam = params.get('resignDate') || '';
      const fromTabParam = params.get('fromTab') || '';
      const studentIdParam = params.get('studentId');
      const classIdParam = params.get('classId');
      const selectMode = params.get('mode') === 'schedule_select';
      const renewalMode = params.get('mode') === 'renewal_edit';
      const orderIdParam = params.get('orderId') || '';
      const returnParam = params.get('return') || '';
      const studentParam = studentIdParam || params.get('student');
      state.embed = params.get('embed') === '1';
      state.fromHall = params.get('from') === 'hall';
      state.fromM1b = params.get('from') === 'm1b';
      state.teacherView = viewParam === 'teacher' || state.fromM1b;
      state.fromTab = ['tab3', 'ops'].includes(fromTabParam) ? 'ops' : ['tab4', 'settings'].includes(fromTabParam) ? 'settings' : '';

      state.device = deviceParam === 'tablet' ? 'tablet' : 'mobile';

      if (booked) {
        applyScenario('booked');
        state.device = deviceParam === 'tablet' ? 'tablet' : 'mobile';
        if (params.get('hours') !== null && !Number.isNaN(hoursParam) && hoursParam >= 0) state.hours = hoursParam;
        if (role) state.role = role;
        state.week = weekParam !== null ? clampWeek(weekParam) : 1;
        if (childParam === 'bob') state.child = 'bob';
        if (teacherParam && TEACHERS[teacherParam]) state.teacher = teacherParam;
        const modeParam = params.get('mode') === 'group' ? 'group' : 'fixed';
        const slots = parseSlotsParam(params.get('slots'));
        const targets = slots.length
          ? slots
          : (() => {
              const dayParam = params.get('day');
              const timeParam = params.get('time') || '19:00';
              const day = DAY_PARAM[dayParam] !== undefined ? DAY_PARAM[dayParam] : 1;
              return [{ day, time: timeParam }];
            })();
        targets.forEach((target) => {
          const key = slotKey(state.week, target.day, target.time);
          if (!state.flashKeys.includes(key)) state.flashKeys.push(key);
          state.bookedPreview[key] = modeParam;
        });
        state.flash = true;
        state.toast = '排课成功，已在课表中高亮';
        render(false);
        armFlashTimers();
        return;
      }

      let scenario = 'parent';
      if (scenarioParam && SCENARIOS.some((item) => item.value === scenarioParam)) scenario = scenarioParam;
      else if (role) scenario = role;
      else if (viewParam === 'day') scenario = 'day';

      applyScenario(scenario);
      state.device = deviceParam === 'tablet' ? 'tablet' : 'mobile';
      if (params.get('hours') !== null && !Number.isNaN(hoursParam) && hoursParam >= 0) state.hours = hoursParam;
      if (role) state.role = role;
      if (weekParam !== null) state.week = clampWeek(weekParam);
      if (childParam === 'bob') state.child = 'bob';
      if (teacherParam && TEACHERS[teacherParam]) state.teacher = teacherParam;
      if (teacherIdParam) {
        const matchedKey = Object.keys(TEACHERS).find((key) => {
          const item = TEACHERS[key];
          if (item.id === teacherIdParam || key === teacherIdParam) return true;
          if (teacherIdParam.toLowerCase().includes(key)) return true;
          return teacherNameParam && item.name.toLowerCase() === teacherNameParam.toLowerCase();
        });
        if (matchedKey) {
          state.teacher = matchedKey;
        } else {
          const safeName = teacherNameParam || teacherIdParam;
          const shortName = safeName.split(/\s+/)[0] || safeName;
          const parsedTier = Number(String(tierParam).replace(/[^\d]/g, '')) || 18;
          const dynKey = teacherIdParam;
          TEACHERS[dynKey] = {
            key: dynKey,
            id: teacherIdParam,
            name: safeName,
            short: shortName,
            initial: shortName.charAt(0).toUpperCase() || 'T',
            priceTier: parsedTier,
            tierLabel: `${parsedTier}积分`,
            load: teacherStatusParam === 'unbound' ? 0 : 8,
            cap: 24,
            free: teacherStatusParam === 'unbound' ? 0 : 16,
            owner: ownedParam === '0' ? 'other' : 'leo'
          };
          state.teacher = dynKey;
        }
        const active = TEACHERS[state.teacher];
        if (active) {
          if (ownerParam) active.ownerLabel = ownerParam;
          if (ownedParam === '0') active.owner = 'other';
          else if (ownedParam === '1') active.owner = 'leo';
          if (teacherStatusParam) active.teacherStatus = teacherStatusParam;
          if (resignDateParam) active.resignDate = resignDateParam;
        }
      }
      if (selectMode || renewalMode) {
        state.role = role === 'admin' ? 'admin' : 'monitor';
        state.scenario = state.role;
        state.view = 'week';
        state.scheduleSelect = true;
        state.scheduleMode = 'single';
        state.scheduleStudent = null;
        state.scheduleClass = null;
        state.scheduleSel = {};
        resetScheduleWeeks();
        state.week = 0;
        if (renewalMode) {
          state.renewalEdit = true;
          state.renewalOrderId = orderIdParam;
          state.renewalReturn = returnParam;
          state.renewalSaved = false;
          const renewalStudentKey = Object.keys(STUDENTS).find((key) => STUDENTS[key].id === studentParam || key === studentParam);
          state.scheduleStudent = renewalStudentKey || 'alice';
        } else {
          if (studentIdParam) {
            const studentKey = Object.keys(STUDENTS).find((key) => STUDENTS[key].id === studentIdParam || key === studentIdParam);
            if (studentKey) state.scheduleStudent = studentKey;
          }
          if (classIdParam) {
            const classKey = Object.keys(CLASSES).find((key) => CLASSES[key].id === classIdParam || CLASSES[key].key === classIdParam || key === classIdParam);
            if (classKey) {
              state.scheduleClass = classKey;
              state.scheduleStudent = null;
            }
          }
        }
        state.scheduleMode = renewalMode ? 'batch' : scheduleModeForObject(scheduleObjectInfo());
      }
      if ((viewParam === 'day' || viewParam === 'daily') && (state.role === 'monitor' || state.role === 'admin')) {
        state.view = 'day';
      } else if (viewParam === 'student' && (state.role === 'monitor' || state.role === 'admin')) {
        const studentKey = Object.keys(STUDENTS).find((key) => STUDENTS[key].id === studentParam || key === studentParam);
        state.weekStudent = studentKey || 'alice';
      } else if (viewParam === 'class' && (state.role === 'monitor' || state.role === 'admin')) {
        state.view = 'class';
        if (classIdParam) {
          const classKey = Object.keys(CLASSES).find((key) => CLASSES[key].id === classIdParam || CLASSES[key].key === classIdParam || key === classIdParam);
          if (classKey) state.classView = classKey;
        }
        state.classArchived = !!classInfo(state.classView).archived;
        seedClassDemoLessons(state.classView);
      } else if (state.role === 'parent' || state.role === 'teacher') {
        state.view = 'week';
      }
      const lessonIdParam = params.get('lessonId') || '';
      const panelParam = params.get('panel') || '';
      if (lessonIdParam && (state.role === 'monitor' || state.role === 'admin')) {
        if (state.view === 'day') {
          const item = dayPlan(state.dayKey).find((x) => !x.sub && (x.type === 'pendingSub' || x.attendanceMark)) || dayPlan(state.dayKey)[0];
          if (item) {
            state.dayCell = { dayKey: state.dayKey, mode: 'teacher', key: item.teacher, time: item.time, teacher: item.teacher };
            state.drawer = 'day';
          }
        } else {
          const fallback = findBaseLesson(3, '19:00') || findBaseLesson(1, '19:00');
          if (fallback) {
            state.lesson = fallback;
            state.drawer = 'staff-lesson';
            if (['sub', 'leave-move', 'attendance', 'exception-backfill'].includes(panelParam)) state.panel = panelParam;
          }
        }
      }
      render(false);
    }

    init();
  </script>
</body>
</html>

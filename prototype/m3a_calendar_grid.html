    /* ------------------------------------------------------------------
     * 操作
     * ------------------------------------------------------------------ */
    function openParentLesson(lesson) {
      if (!lesson) return;
      state.lesson = lesson;
      state.drawer = 'parent-lesson';
      state.panel = null;
      state.pairSel = {};
      const pair = pairFor(lesson);
      if (pair) pair.forEach((item) => { state.pairSel[item.time] = true; });
      render(true);
    }

    function handleCell(day, time) {
      if (state.reschedule) {
        const info = rescheduleTargetInfo(day, time);
        if (!info || !info.inWindow) {
          showToast('该时段不在同师挪位窗口内');
          return;
        }
        if (info.isSource) {
          showToast('请选择原课次以外的同师绿色空闲格');
          return;
        }
        const slot = getSlot(day, time);
        if (slot.kind !== 'available') {
          showToast('请选择原授课教师的绿色空闲时段');
          return;
        }
        const targets = state.reschedule.times.map((_, index) => fmtMinutes(toMin(time) + index * 30));
        const allFree = targets.every((target) => toMin(target) < GRID_END && getSlot(day, target).kind === 'available');
        if (!allFree) {
          showToast('该时段无法容纳连续课程，请选择其他空闲时段');
          return;
        }
        state.modal = { type: 'reschedule', day, time, targets };
        render(true);
        return;
      }

      const slot = getSlot(day, time);
      if (state.role === 'parent') {
        if (slot.lesson && ['fixed', 'temp', 'sub', 'group'].includes(slot.lesson.kind)) {
          openParentLesson(slot.lesson);
          return;
        }
        if (slot.kind === 'hold') {
          showToast('续费预占中，请在续费单中确认');
          return;
        }
        if (slot.kind === 'available') {
          state.target = { day, time };
          state.drawer = 'parent-book';
          state.panel = null;
          state.bookDuration = 30;
          render(true);
          return;
        }
        showToast('该时段暂不可预约');
        return;
      }

      if (slot.lesson && ['fixed', 'temp', 'sub', 'subbing', 'group'].includes(slot.lesson.kind)) {
        state.lesson = slot.lesson;
        state.drawer = 'staff-lesson';
        state.panel = null;
        state.pairSel = {};
        const pair = pairFor(slot.lesson);
        if (pair) pair.forEach((item) => { state.pairSel[item.time] = true; });
        render(true);
        return;
      }
      if (slot.kind === 'hold') {
        showToast('续费预占中，请在购课单中确认');
        return;
      }
      if (slot.kind === 'available') {
        if (state.role === 'teacher') {
          state.target = { day, time };
          state.drawer = 'teacher-free';
          state.panel = null;
          render(true);
          return;
        }
        state.target = { day, time };
        state.drawer = 'staff-free';
        state.panel = null;
        state.bookDuration = 30;
        render(true);
        return;
      }
      state.target = { day, time };
      state.drawer = 'staff-rest';
      state.panel = null;
      render(true);
    }

    function beginReschedule(cells) {
      const list = (cells || []).filter(Boolean).sort((a, b) => toMin(a.time) - toMin(b.time));
      if (!list.length) {
        showToast('请至少选择 1 节课程');
        return;
      }
      const check = rescheduleEligibility(list[0]);
      if (!check.ok) {
        showToast(check.reason);
        return;
      }
      state.reschedule = {
        round: state.roundOffset,
        week: state.week,
        day: list[0].day,
        times: list.map((item) => item.time),
        teacher: list[0].teacher,
        student: list[0].student,
        kind: list[0].kind === 'temp' ? 'temp' : 'fixed',
        sourceKind: list[0].kind
      };
      state.drawer = null;
      state.panel = null;
      state.modal = null;
      render(true);
      showToast(list[0].kind === 'temp'
        ? '请选择原课次前后 7 天内同师绿色空闲格'
        : '请选择本轮 4 周内同师绿色空闲格');
    }

    function applyReschedule() {
      if (!requireOnline()) return;
      const source = state.reschedule;
      const modal = state.modal;
      if (!source || !modal) return;
      const targetKind = source.sourceKind === 'sub' ? 'fixed' : source.kind;
      modal.targets.forEach((time) => {
        overrides[slotKey(state.week, modal.day, time)] = {
          day: modal.day,
          time,
          teacher: source.teacher,
          student: source.student,
          kind: targetKind,
          rescheduleCount: 1
        };
      });
      source.times.forEach((time) => {
        overrides[slotKey(source.week, source.day, time)] = { forced: 'available' };
      });
      const removedSub = source.sourceKind === 'sub';
      state.reschedule = null;
      state.modal = null;
      render(true);
      showToast(removedSub
        ? '挪位成功，已解除代课委任，目标格回到固定位'
        : '挪位成功，原格释放、目标格已落盘（reschedule_count=1）');
    }

    function applyLeaveCells(cells, studentKey) {
      let applied = 0;
      cells.forEach((cell) => {
        if (cell.kind !== 'temp') return;
        overrides[slotKey(state.week, cell.day, cell.time)] = { forced: 'available' };
        applied += 1;
      });
      if (applied > 0) quotaFor(studentKey).used += applied;
      return applied;
    }

    function confirmLeave() {
      if (!requireOnline()) return;
      const cells = leaveCellsNow();
      if (!cells.length) {
        showToast('请选择要请假的课次');
        return;
      }
      const studentKey = state.role === 'parent' ? state.child : (cells[0].student || state.child);
      const eligibility = leaveEligibility(cells[0], cells.length, studentKey);
      if (!eligibility.ok) {
        showToast(eligibility.reason);
        return;
      }
      const applied = applyLeaveCells(cells, studentKey);
      state.drawer = null;
      state.panel = null;
      state.leaveCells = [];
      render(true);
      showToast(`已请假 ${applied} 节，扣减 ${applied} 次配额，TS 已退回待排期，课格恢复空闲可约`);
    }

    function confirmBooking() {
      if (!requireOnline()) return;
      const slot = bookingSlot();
      if (!slot) return;
      const check = canBookSixty();
      if (state.bookDuration === 60 && !check.ok) {
        showToast(check.reason || '60 分钟不可选');
        return;
      }
      const duration = state.bookDuration === 60 ? 60 : 30;
      const staff = isStaff();
      const student = staff ? state.staffStudent : state.child;
      const teacher = staff ? state.teacher : 'david';
      const cost = duration === 60 ? 2 : 1;
      if (!staff && state.credits[state.child] < cost) {
        showToast('剩余课时不足，暂不可预约');
        return;
      }
      overrides[`${state.week}|${slot.day}|${slot.time}`] = {
        day: slot.day,
        time: slot.time,
        teacher,
        student,
        kind: 'temp'
      };
      if (duration === 60) {
        const next = nextTime(slot.time);
        overrides[`${state.week}|${slot.day}|${next}`] = {
          day: slot.day,
          time: next,
          teacher,
          student,
          kind: 'temp'
        };
      }
      if (!staff) state.credits[state.child] -= cost;
      state.drawer = null;
      state.target = null;
      render(true);
      showToast(staff
        ? `已为 ${STUDENTS[student].short} 预约 ${duration} 分钟课程`
        : `已预约 ${duration} 分钟课程，扣减 ${cost} 节课时`);
    }

    function confirmOpenSlot() {
      if (!requireOnline()) return;
      const slot = state.target;
      if (!slot) return;
      overrides[slotKey(state.week, slot.day, slot.time)] = { forced: 'available' };
      state.drawer = null;
      state.target = null;
      render(true);
      showToast('已加开时段，已通知意向家长');
    }

    function confirmLockSlot() {
      if (!requireOnline()) return;
      const slot = state.target;
      if (!slot) return;
      overrides[slotKey(state.week, slot.day, slot.time)] = { forced: 'rest' };
      state.drawer = null;
      state.target = null;
      render(true);
      showToast('已锁定时段，暂不可预约');
    }

    function confirmSub() {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson) return;
      const key = slotKey(state.week, lesson.day, lesson.time);
      if (lesson.kind === 'group') {
        overrides[key] = Object.assign({}, lesson, { actual: state.subCandidate });
      } else {
        overrides[key] = Object.assign({}, lesson, { kind: 'sub', actual: state.subCandidate });
      }
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(`${TEACHERS[state.subCandidate].name} 已委任代课，课酬按代课快照计入`);
    }

    function markAttendance(value) {
      if (!requireOnline()) return;
      const labels = { present: '正常出勤', 'student-absent': '学员旷课', 'teacher-absent': '外教旷课' };
      state.attendance = value;
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(`已记录：${labels[value] || '正常出勤'}`);
    }

    function confirmWithdraw() {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson) return;
      overrides[slotKey(state.week, lesson.day, lesson.time)] = { forced: 'available' };
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast('已撤排，已退回 1 节课时');
    }

    function proxyLeave() {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson) return;
      const check = leaveEligibility(lesson, 1, lesson.student);
      if (!check.ok) {
        showToast(check.reason);
        return;
      }
      const applied = applyLeaveCells([lesson], lesson.student);
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(`已代 ${STUDENTS[lesson.student].nick} 请假，扣减 ${applied} 次配额，TS 已退回待排期`);
    }

    function confirmGroupOutage() {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson || lesson.kind !== 'group') return;
      const dur = lesson.dur || 2;
      for (let index = 0; index < dur; index += 1) {
        const time = fmtMinutes(toMin(lesson.time) + index * 30);
        overrides[slotKey(state.week, lesson.day, time)] = Object.assign({}, lesson, {
          time,
          dur,
          outage: true
        });
      }
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast('已暂停待排，TS 退回班级待排期池，已豁免学生课时与配额');
    }

    function copyRoom() {
      const room = 'A-302';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(room).then(() => showToast('教室号已复制')).catch(() => showToast(`教室号 ${room}`));
      } else {
        showToast(`教室号 ${room}`);
      }
    }

    function closeLayers() {
      state.drawer = null;
      state.panel = null;
      state.modal = null;
      state.reschedule = null;
      state.batchOpen = false;
    }

    function handleControl(group, value) {
      if (group === 'role') {
        state.role = value;
        state.drawer = null;
        state.panel = null;
        state.modal = null;
        state.reschedule = null;
        state.batchOpen = false;
        state.pairSel = {};
        if (value === 'parent') {
          state.child = 'alice';
          state.scenario = 'parent';
        } else {
          state.teacher = 'david';
          state.scenario = value;
        }
        render(false);
        return;
      }
      if (group === 'device') {
        state.device = value;
        render(true);
        return;
      }
      if (group === 'network') {
        state.online = value === 'online';
        render(true);
        return;
      }
      if (group === 'hours') {
        const hours = Number(value);
        state.hours = Number.isNaN(hours) ? 32 : hours;
        render(true);
        return;
      }
      if (group === 'week') {
        state.week = clampWeek(value);
        state.drawer = null;
        state.panel = null;
        state.modal = null;
        render(true);
      }
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function segment(group, options, current) {
      return `<div class="flex items-center gap-0.5 rounded-lg border border-slate-200 bg-slate-100 p-0.5">
        ${options.map((option) => `<button data-control="${group}" data-value="${option.value}" class="h-7 rounded-md px-2 text-[12px] font-semibold transition ${String(option.value) === String(current) ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-700'}">${option.label}</button>`).join('')}
      </div>`;
    }

    function renderConsole() {
      return `<header class="sticky top-0 z-[60] border-b border-slate-200 bg-white/95 backdrop-blur">
        <div class="mx-auto max-w-[1500px] px-4 py-2.5">
          <div class="flex flex-wrap items-center gap-2">
            <div class="mr-1 flex items-center gap-2">
              <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-slate-900 text-[14px] font-bold text-white">D</span>
              <div class="min-w-0">
                <h1 class="truncate text-[14px] font-bold text-slate-900">M3A 7色课表演示控制台</h1>
                <p class="hidden text-[12px] font-medium text-slate-500 sm:block">7色周历 · 动作抽屉 · M3B 时限配额 · M3C 转让入口</p>
              </div>
            </div>
            <span class="mx-1 hidden h-6 w-px bg-slate-200 sm:block"></span>
            ${segment('role', [
              { value: 'parent', label: '家长' },
              { value: 'teacher', label: '教师' },
              { value: 'monitor', label: '班长' },
              { value: 'admin', label: '管理员' }
            ], state.role)}
            ${segment('week', [
              { value: 0, label: '第1周' },
              { value: 1, label: '第2周' },
              { value: 2, label: '第3周' },
              { value: 3, label: '第4周' }
            ], state.week)}
            ${segment('hours', [
              { value: 32, label: '≥24h(32)' },
              { value: 8, label: '3~24h(8)' },
              { value: 2, label: '<3h(2)' }
            ], state.hours)}
            ${segment('device', [
              { value: 'mobile', label: '手机' },
              { value: 'tablet', label: '平板' }
            ], state.device)}
            ${segment('network', [
              { value: 'online', label: '在线' },
              { value: 'offline', label: '离线' }
            ], state.online ? 'online' : 'offline')}
            <button data-action="reset-demo" class="h-8 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">重置演示</button>
            <a href="../docs/prd/m3a_calendar_grid.md" target="_blank" rel="noopener" class="flex h-8 items-center gap-1 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">
              ${icon('file-text', 'h-3.5 w-3.5')}PRD 文档
            </a>
          </div>
          <div class="mt-2 flex flex-wrap items-center gap-1.5">
            ${SCENARIOS.map((item) => `<button data-scenario="${item.value}" class="h-7 rounded-lg border px-2.5 text-[12px] font-semibold transition ${state.scenario === item.value ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}">${item.label}</button>`).join('')}
            <span class="ml-auto flex items-center gap-1 text-[12px] font-medium text-slate-500">
              ${icon('info', 'h-3.5 w-3.5')}配额 Alice ${state.quota.alice.used}/${state.quota.alice.limit} · Bob ${state.quota.bob.used}/${state.quota.bob.limit}
            </span>
          </div>
        </div>
      </header>`;
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.addEventListener('click', (event) => {
      const control = event.target.closest('[data-control]');
      if (control) {
        handleControl(control.dataset.control, control.dataset.value);
        return;
      }

      const scenario = event.target.closest('[data-scenario]');
      if (scenario) {
        applyScenario(scenario.dataset.scenario);
        render(false);
        if (state.scenario === 'booked') armFlashTimers();
        return;
      }

      const actionEl = event.target.closest('[data-action]');
      if (!actionEl) {
        if (state.batchOpen && !event.target.closest('#batchMenu')) {
          state.batchOpen = false;
          render(true);
        }
        return;
      }

      const action = actionEl.dataset.action;
      const key = actionEl.dataset.key;
      const value = actionEl.dataset.value;

      switch (action) {
        case 'bell':
          showToast('有 2 条新的课表通知');
          break;
        case 'open-children':
          state.drawer = 'children';
          state.panel = null;
          render(true);
          break;
        case 'open-asset':
          state.drawer = 'asset';
          state.panel = null;
          render(true);
          break;
        case 'open-teachers':
          state.drawer = 'teachers';
          state.panel = null;
          render(true);
          break;
        case 'toggle-batch':
          state.batchOpen = !state.batchOpen;
          render(true);
          break;
        case 'prev-round':
          state.roundOffset -= 1;
          if (state.reschedule) {
            state.drawer = null;
            state.panel = null;
            state.modal = null;
          } else {
            closeLayers();
          }
          render(true);
          break;
        case 'next-round':
          state.roundOffset += 1;
          if (state.reschedule) {
            state.drawer = null;
            state.panel = null;
            state.modal = null;
          } else {
            closeLayers();
          }
          render(true);
          break;
        case 'set-week':
          state.week = clampWeek(actionEl.dataset.week);
          state.drawer = null;
          state.panel = null;
          state.modal = null;
          render(true);
          break;
        case 'toggle-fold':
          state.folded = !state.folded;
          render(true);
          break;
        case 'cell':
          handleCell(Number(actionEl.dataset.day), actionEl.dataset.time);
          break;
        case 'close-drawer':
          state.drawer = null;
          state.panel = null;
          render(true);
          break;
        case 'back-panel':
          if (['teacher-report', 'teacher-free', 'channel-b'].includes(state.drawer)) {
            state.drawer = null;
          }
          state.panel = null;
          render(true);
          break;
        case 'start-leave':
          state.leaveCells = state.lesson ? [state.lesson] : [];
          state.panel = 'leave';
          render(true);
          break;
        case 'pair-leave': {
          const pair = pairFor(state.lesson) || (state.lesson ? [state.lesson] : []);
          const cells = pair.filter((item) => state.pairSel[item.time] !== false);
          if (!cells.length) {
            showToast('请至少勾选 1 节');
            break;
          }
          state.leaveCells = cells;
          state.panel = 'leave';
          render(true);
          break;
        }
        case 'pair-reschedule': {
          const pair = pairFor(state.lesson) || (state.lesson ? [state.lesson] : []);
          const cells = pair.filter((item) => state.pairSel[item.time] !== false);
          beginReschedule(cells);
          break;
        }
        case 'start-reschedule':
          beginReschedule(state.lesson ? [state.lesson] : []);
          break;
        case 'cancel-reschedule':
          state.reschedule = null;
          render(true);
          break;
        case 'confirm-leave':
          confirmLeave();
          break;
        case 'confirm-book':
          confirmBooking();
          break;
        case 'set-duration':
          if (value === '60' && !canBookSixty().ok) {
            showToast(canBookSixty().reason || '60 分钟不可选');
            break;
          }
          state.bookDuration = Number(value) === 60 ? 60 : 30;
          render(true);
          break;
        case 'pick-staff-student':
          state.staffStudent = key || 'alice';
          render(true);
          break;
        case 'confirm-lock-slot':
          confirmLockSlot();
          break;
        case 'select-child':
          state.child = key === 'bob' ? 'bob' : 'alice';
          state.scenario = 'parent';
          state.drawer = null;
          state.panel = null;
          state.pairSel = {};
          render(true);
          showToast(`已切换至 ${STUDENTS[state.child].nick}`);
          break;
        case 'select-teacher':
          if (TEACHERS[key]) state.teacher = key;
          state.drawer = null;
          state.panel = null;
          render(true);
          showToast(`已切换至 ${activeTeacher().name}`);
          break;
        case 'start-sub':
          state.panel = 'sub';
          state.subCandidate = 'elena';
          render(true);
          break;
        case 'select-sub':
          state.subCandidate = TEACHERS[key] ? key : 'elena';
          render(true);
          break;
        case 'confirm-sub':
          confirmSub();
          break;
        case 'start-attendance':
          state.panel = 'attendance';
          render(true);
          break;
        case 'mark-attendance':
          markAttendance(value);
          break;
        case 'start-teacher-report': {
          const source = state.lesson || state.target;
          state.reportDay = source ? source.day : 0;
          state.reportSel = {};
          if (source) state.reportSel[source.time] = true;
          state.drawer = 'teacher-report';
          state.panel = null;
          render(true);
          scrollReportToSelected();
          break;
        }
        case 'report-tag':
          state.reportTag = actionEl.dataset.tag || 'power';
          render(true);
          break;
        case 'submit-teacher-report': {
          const day = state.reportDay != null ? state.reportDay : (state.lesson ? state.lesson.day : 0);
          const times = Object.keys(state.reportSel).filter((time) => state.reportSel[time]);
          if (!times.length) {
            showToast('请至少勾选 1 个时段');
            break;
          }
          times.forEach((time) => {
            const slot = getSlot(day, time);
            if (slot.kind === 'available' || slot.kind === 'rest') {
              overrides[slotKey(state.week, day, time)] = { forced: 'leave' };
            }
          });
          const count = times.length;
          state.drawer = null;
          state.panel = null;
          state.reportDay = null;
          state.reportSel = {};
          render(true);
          showToast(`已提交请假报备 · ${count} 节（排课格将生成代课待办包）`);
          break;
        }
        case 'start-channel-b':
          state.panel = 'channel-b';
          render(true);
          break;
        case 'submit-channel-b': {
          const reasonEl = document.getElementById('channelBReason');
          const reason = (reasonEl ? reasonEl.value : '').trim();
          if (reason.length < 10) {
            showToast('请填写不少于 10 字的特批原因');
            break;
          }
          state.drawer = null;
          state.panel = null;
          render(true);
          showToast('已提交特批请假，TS 退回待排期并写入审计');
          break;
        }
        case 'confirm-exception-backfill':
          state.drawer = null;
          state.panel = null;
          render(true);
          showToast('已确认异常未上课，回退补生 2 节待排期 TS');
          break;
        case 'start-withdraw':
          state.panel = 'withdraw';
          render(true);
          break;
        case 'confirm-withdraw':
          confirmWithdraw();
          break;
        case 'start-proxy':
          state.panel = 'proxy';
          render(true);
          break;
        case 'proxy-leave':
          proxyLeave();
          break;
        case 'proxy-reschedule':
          beginReschedule(state.lesson ? [state.lesson] : []);
          break;
        case 'confirm-group-outage':
          confirmGroupOutage();
          break;
        case 'confirm-open-slot':
          confirmOpenSlot();
          break;
        case 'copy-room':
          copyRoom();
          break;
        case 'enter-classin':
          showToast('正在打开 ClassIn 教室 A-302');
          break;
        case 'confirm-reschedule':
          applyReschedule();
          break;
        case 'cancel-modal':
          state.modal = null;
          render(true);
          break;
        case 'reset-demo':
          applyScenario('parent');
          state.device = 'mobile';
          state.online = true;
          render(false);
          break;
        default:
          break;
      }
    });

    document.addEventListener('change', (event) => {
      const el = event.target;
      if (el.matches('[data-pair]')) {
        state.pairSel[el.dataset.pair] = el.checked;
        return;
      }
      if (el.matches('[data-report-slot]')) {
        state.reportSel[el.dataset.reportSlot] = el.checked;
        render(true);
        scrollReportToSelected();
        return;
      }
    });

    /* ------------------------------------------------------------------
     * 初始化
     * ------------------------------------------------------------------ */
    function init() {
      const params = new URLSearchParams(window.location.search);
      const roleParam = params.get('role');
      const role = ['parent', 'teacher', 'monitor', 'admin'].includes(roleParam) ? roleParam : null;
      const scenarioParam = params.get('scenario');
      const weekParam = params.get('week');
      const childParam = params.get('child');
      const teacherParam = params.get('teacher');
      const deviceParam = params.get('device');
      const hoursParam = Number(params.get('hours'));
      const booked = params.get('booked') === '1';
      state.embed = params.get('embed') === '1';

      state.device = deviceParam === 'tablet' ? 'tablet' : 'mobile';

      if (booked) {
        applyScenario('booked');
        state.device = deviceParam === 'tablet' ? 'tablet' : 'mobile';
        if (!Number.isNaN(hoursParam) && hoursParam > 0) state.hours = hoursParam;
        if (role) state.role = role;
        state.week = weekParam !== null ? clampWeek(weekParam) : 1;
        if (childParam === 'bob') state.child = 'bob';
        if (teacherParam && TEACHERS[teacherParam]) state.teacher = teacherParam;
        const modeParam = params.get('mode') === 'group' ? 'group' : 'fixed';
        const slots = parseSlotsParam(params.get('slots'));
        const targets = slots.length
          ? slots
          : (() => {
              const dayParam = params.get('day');
              const timeParam = params.get('time') || '19:00';
              const day = DAY_PARAM[dayParam] !== undefined ? DAY_PARAM[dayParam] : 1;
              return [{ day, time: timeParam }];
            })();
        targets.forEach((target) => {
          const key = slotKey(state.week, target.day, target.time);
          if (!state.flashKeys.includes(key)) state.flashKeys.push(key);
          state.bookedPreview[key] = modeParam;
        });
        state.flash = true;
        state.toast = '排课成功，已在课表中高亮';
        render(false);
        armFlashTimers();
        return;
      }

      let scenario = 'parent';
      if (scenarioParam && SCENARIOS.some((item) => item.value === scenarioParam)) scenario = scenarioParam;
      else if (role) scenario = role;

      applyScenario(scenario);
      state.device = deviceParam === 'tablet' ? 'tablet' : 'mobile';
      if (!Number.isNaN(hoursParam) && hoursParam > 0) state.hours = hoursParam;
      if (role) state.role = role;
      if (weekParam !== null) state.week = clampWeek(weekParam);
      if (childParam === 'bob') state.child = 'bob';
      if (teacherParam && TEACHERS[teacherParam]) state.teacher = teacherParam;
      render(false);
    }

    init();
  </script>
</body>
</html>

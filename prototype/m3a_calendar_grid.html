    /* ------------------------------------------------------------------
     * 日调度视图（仅班长 / 管理员）
     * ------------------------------------------------------------------ */
    function dayDate(key) { return addDays(DAY_TODAY, Number(key)); }
    function dayWeekday(key) {
      const iso = dayDate(key);
      return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][new Date(`${iso}T00:00:00Z`).getUTCDay()];
    }
    function dayPlan(key) { return DAY_PLANS[String(key)] || []; }
    function dayClassItem(dayKey, classId, time) {
      const base = dayPlan(dayKey).find((item) => item.type === 'group' && item.classId === classId && item.time === time);
      if (!base) return null;
      const override = dayOverrides[`${dayKey}|${base.teacher}|${time}`];
      return override ? Object.assign({}, base, override) : base;
    }
    function dayClassIds(dayKey) {
      const ids = [];
      dayPlan(dayKey).forEach((item) => {
        if (item.type === 'group' && item.classId && !ids.includes(item.classId)) ids.push(item.classId);
      });
      return ids;
    }
    function dayItemNear3h(dayKey, time) {
      if (Number(dayKey) !== 0) return false;
      const diff = toMin(time) - DAY_NOW_MIN;
      return diff <= 180 && diff >= -60;
    }
    function dayTeacherItem(dayKey, teacher, time) {
      const base = dayPlan(dayKey).find((item) => item.teacher === teacher && item.time === time);
      if (!base) return null;
      const override = dayOverrides[`${dayKey}|${teacher}|${time}`];
      return override ? Object.assign({}, base, override) : base;
    }
    function dayStudentItem(dayKey, student, time) {
      const base = dayPlan(dayKey).find((item) => item.student === student && item.time === time);
      if (!base) return null;
      const override = dayOverrides[`${dayKey}|${base.teacher}|${time}`];
      return override ? Object.assign({}, base, override) : base;
    }
    function dayIsAbnormal(item) {
      if (!item) return false;
      if (item.attendanceMark) return true;
      if (item.type === 'group') return !!item.pendingSub || !!item.nearChange;
      return !item.sub && (item.type === 'pendingSub' || item.type === 'nearChange');
    }
    function dayColumnItems(dayKey, mode, key) {
      return dayPlan(dayKey)
        .filter((item) => {
          if (mode === 'teacher') return item.teacher === key;
          if (mode === 'class') return item.type === 'group' && item.classId === key;
          return item.type !== 'group' && item.student === key;
        })
        .map((item) => {
          const override = dayOverrides[`${dayKey}|${item.teacher}|${item.time}`];
          return override ? Object.assign({}, item, override) : item;
        });
    }
    function dayAbnormalCount(dayKey, mode, key) {
      if (Number(dayKey) === -1) {
        /* 昨天仅保留历史上真实发生过的 <3h 临期请假/变动与已标考勤异常；请假待代课已随结课释放 */
        return dayColumnItems(dayKey, mode, key).filter((item) => item.type === 'nearChange'
          || (item.type === 'group' && item.nearChange)
          || !!item.attendanceMark).length;
      }
      return dayColumnItems(dayKey, mode, key).filter(dayIsAbnormal).length;
    }
    function dayAbnormalTotal(dayKey) {
      return DAY_TEACHER_ORDER.reduce((sum, key) => sum + dayAbnormalCount(dayKey, 'teacher', key), 0);
    }
    function dayEarliestAbnormal(dayKey, mode, key) {
      const times = dayColumnItems(dayKey, mode, key).filter(dayIsAbnormal).map((item) => toMin(item.time));
      return times.length ? Math.min.apply(null, times) : 99999;
    }
    function dayFreeAt(dayKey, teacher, time) {
      const ov = dayOverrides[`${dayKey}|${teacher}|${time}`];
      if (ov && (ov.forced === 'rest' || ov.leaveFree)) return false;
      if (dayPlan(dayKey).some((item) => item.teacher === teacher && item.time === time)) return false;
      const prev = prevTime(time);
      if (prev && dayPlan(dayKey).some((item) => item.type === 'group' && item.teacher === teacher && item.time === prev && (item.dur || 2) > 1)) return false;
      return DAY_TEACHER_ORDER.includes(teacher);
    }
    function dayFreeCount(dayKey, teacher) {
      return DAY_TIMES.filter((time) => dayFreeAt(dayKey, teacher, time)).length;
    }
    function dayLessonCount(dayKey, mode, key) { return dayColumnItems(dayKey, mode, key).length; }
    function dayNowInSlot(time) { return DAY_NOW_MIN >= toMin(time) && DAY_NOW_MIN < toMin(time) + 30; }

    function dayCandidates(dayKey, teacherKey, time, options) {
      const opts = options || {};
      const dur = Math.max(1, Number(opts.dur || 1));
      const times = [];
      for (let index = 0; index < dur; index += 1) times.push(fmtMinutes(toMin(time) + index * 30));
      const incident = dayTeacherItem(dayKey, teacherKey, time);
      const studentKey = incident ? incident.student : null;
      return DAY_TEACHER_ORDER
        .filter((key) => key !== teacherKey
          && times.every((point) => dayFreeAt(dayKey, key, point))
          && (state.dayScope === 'all' || DAY_MANAGED.includes(key)))
        .map((key) => Object.assign(subRank(key, studentKey, teacherKey, !!opts.isGroup, opts.classId), { free: dayFreeCount(dayKey, key), available: true }))
        .sort(subSort);
    }

    function dayColumns(dayKey) {
      let cols;
      if (state.dayMode === 'teacher') {
        let keys = state.dayScope === 'all' ? DAY_TEACHER_ORDER.slice() : DAY_MANAGED.slice();
        let metaMap = {};
        if (state.dayCompare && state.dayIncident) {
          const incidentKey = state.dayIncident.key;
          const incidentTime = state.dayIncident.time;
          const incidentItem = dayTeacherItem(dayKey, incidentKey, incidentTime);
          const candidates = dayCandidates(dayKey, incidentKey, incidentTime,
            incidentItem && incidentItem.type === 'group' ? { dur: incidentItem.dur || 2, isGroup: true, classId: incidentItem.classId } : {});
          candidates.forEach((candidate) => { metaMap[candidate.key] = candidate; });
          keys = [incidentKey].concat(candidates.map((candidate) => candidate.key));
        }
        cols = keys.map((key) => ({
          mode: 'teacher',
          key,
          title: teacherShort(key),
          subtitle: `${teacherName(key)} · ${dayLessonCount(dayKey, 'teacher', key)} 节`,
          search: `${teacherName(key)} ${teacherShort(key)} ${key}`.toLowerCase(),
          count: dayAbnormalCount(dayKey, 'teacher', key),
          earliest: dayEarliestAbnormal(dayKey, 'teacher', key),
          meta: metaMap[key] || null
        }));
      } else {
        const studentCols = DAY_STUDENT_ORDER.map((key) => ({
          mode: 'student',
          key,
          title: STUDENTS[key].name,
          subtitle: `${STUDENTS[key].label} · ${dayLessonCount(dayKey, 'student', key)} 节`,
          search: STUDENTS[key].name.toLowerCase(),
          count: dayAbnormalCount(dayKey, 'student', key),
          earliest: dayEarliestAbnormal(dayKey, 'student', key)
        }));
        const classCols = dayClassIds(dayKey)
          .filter((classKey) => state.role === 'admin' || isOwnClass(classKey))
          .map((classKey) => {
          const cls = CLASSES[classKey] || CLASSES.ket1;
          const items = dayColumnItems(dayKey, 'class', classKey);
          const earliest = items.filter(dayIsAbnormal).map((item) => toMin(item.time));
          return {
            mode: 'class',
            key: classKey,
            isClass: true,
            title: cls.code,
            subtitle: `${isOwnClass(classKey) ? '本人主理' : '他组'} · ${items.length} 节`,
            search: `${cls.name} ${cls.code} ${classKey}`.toLowerCase(),
            count: dayAbnormalCount(dayKey, 'class', classKey),
            earliest: earliest.length ? Math.min.apply(null, earliest) : 99999
          };
        });
        cols = studentCols.concat(classCols);
      }
      const query = state.daySearch.trim().toLowerCase();
      if (query) cols = cols.filter((col) => col.search.includes(query));
      if (state.dayFilter === 'abnormal') {
        cols = cols.filter((col) => col.count > 0).sort((a, b) => a.earliest - b.earliest);
      }
      return cols;
    }

    function daySeg(action, options, current) {
      return `<div class="flex shrink-0 items-center gap-0.5 rounded-lg border border-slate-200 bg-slate-100 p-0.5">
        ${options.map((option) => `<button data-action="${action}" data-value="${option.value}" class="h-7 rounded-md px-2 text-[12px] font-semibold transition ${String(option.value) === String(current) ? 'bg-slate-900 text-white' : 'text-slate-600 hover:text-slate-800'}">${option.label}</button>`).join('')}
      </div>`;
    }

    function renderDayContent() {
      const dayKey = state.dayKey;
      const isToday = dayKey === 0;
      const abnormal = dayAbnormalTotal(dayKey);
      const backRole = state.role === 'admin' ? 'admin' : 'monitor';
      return `<div id="content" class="min-h-0 flex-1 overflow-y-auto overscroll-contain bg-white">
        <div class="border-b border-slate-200 bg-white px-3 pb-2 pt-1.5">
          <div class="flex items-center justify-between gap-2">
            <a href="m0_workspace_home.html?role=${backRole}&view=ops" class="flex h-8 items-center gap-0.5 text-[12px] font-semibold text-indigo-600">${icon('chevron-left', 'h-4 w-4')}返回教务中心</a>
            <span class="text-[12px] font-medium text-slate-600">${isToday ? `当前 ${DAY_NOW}` : `${dayWeekday(dayKey)} ${fmtSlash(dayDate(dayKey))}`}</span>
          </div>
          <div class="mt-1.5 grid grid-cols-5 gap-1.5">
            ${DAY_PILLS.map((pill) => {
              const on = pill.value === dayKey;
              return `<button data-action="day-date" data-value="${pill.value}" class="h-9 rounded-lg border text-center transition ${on ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}">
                <span class="block text-[12px] font-bold leading-tight">${pill.label}</span>
                <span class="block font-mono text-[12px] font-medium leading-tight ${on ? 'text-white/80' : 'text-slate-600'}">${fmtSlash(dayDate(pill.value))}</span>
              </button>`;
            }).join('')}
          </div>
          <div class="mt-2 flex flex-wrap items-center gap-1.5">
            ${daySeg('day-mode', [{ value: 'teacher', label: '按老师' }, { value: 'student', label: '按学员/小班' }], state.dayMode)}
            ${daySeg('day-filter', [{ value: 'all', label: '全部' }, { value: 'abnormal', label: `${isToday ? '今日异常' : '当日异常'} (${abnormal})` }], state.dayFilter)}
            ${state.dayMode === 'teacher' ? daySeg('day-scope', [{ value: 'managed', label: '仅看我管的' }, { value: 'all', label: '全平台老师' }], state.dayScope) : ''}
          </div>
          <div class="mt-2 flex items-center gap-1.5">
            <div class="relative min-w-0 flex-1">
              <span class="pointer-events-none absolute left-2 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-3.5 w-3.5')}</span>
              <input data-day-search value="${esc(state.daySearch)}" placeholder="搜索老师 / 学员规范英文名 / 小班" class="h-9 w-full rounded-lg border border-slate-200 bg-slate-50 pl-7 pr-2 text-[12px] font-medium text-slate-800 outline-none focus:border-indigo-400 focus:bg-white">
            </div>
            ${state.daySearch ? `<button data-action="day-clear-search" class="h-9 shrink-0 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-800">清空</button>` : ''}
          </div>
          ${daySearchConflictHint(dayKey) ? `<div class="mt-1.5 flex items-start gap-1 rounded-lg border border-amber-300 bg-amber-50 px-2 py-1.5 text-[12px] font-semibold leading-relaxed text-amber-900">${icon('triangle-alert', 'h-3.5 w-3.5 shrink-0')}<span>${esc(daySearchConflictHint(dayKey))}，该时段无空闲，请换一位老师或切换全平台老师</span></div>` : ''}
          ${Number(dayKey) === -1 ? `<div class="mt-1.5 rounded-lg border border-slate-300 bg-slate-100 px-2 py-1.5 text-[12px] font-semibold leading-relaxed text-slate-700">昨天 · 只读复盘：课次已于今日 02:00 自动结课；仅保留【考勤/旷课标记纠偏】与【异常未上课回退补生】（限原负责班长/主理人或管理员），请假/挪位/代课/撤排与同屏对照均已隐藏，且不适用 &lt;3h 跨组驰援。</div>` : ''}
        </div>
        ${state.dayCompare ? renderDayCompareBanner() : ''}
        <div class="px-3 pb-3 pt-2">${renderDayGrid(dayKey)}</div>
      </div>`;
    }

    function renderDayCompareBanner() {
      const incident = state.dayIncident;
      const teacher = incident ? teacherName(incident.key) : '';
      return `<div class="flex items-center justify-between gap-2 border-b border-indigo-200 bg-indigo-50 px-3 py-2">
        <span class="min-w-0 truncate text-[12px] font-bold text-indigo-800">同屏对照 · ${esc(teacher)} ${incident ? incident.time : ''} 空闲老师</span>
        <button data-action="day-compare-off" class="shrink-0 rounded-lg border border-indigo-200 bg-white px-2 py-1 text-[12px] font-semibold text-indigo-700">退出对照</button>
      </div>`;
    }

    function renderDayGrid(dayKey) {
      const cols = dayColumns(dayKey);
      if (state.dayFilter === 'abnormal' && !cols.length) {
        return `<div class="rounded-xl border border-slate-300 bg-slate-50/70 px-4 py-6 text-center">
          <p class="text-[14px] font-bold text-slate-900">${dayKey === 0 ? '今日暂无待处理调度异常' : '当日暂无待处理调度异常'}</p>
          <button data-action="day-filter" data-value="all" class="mt-2 h-9 rounded-lg border border-slate-300 bg-white px-3 text-[12px] font-semibold text-slate-800">查看全部</button>
        </div>`;
      }
      if (!cols.length) {
        return `<div class="rounded-xl border border-slate-300 bg-slate-50/70 px-4 py-6 text-center">
          <p class="text-[14px] font-bold text-slate-900">未找到匹配的老师、学员或小班</p>
          <button data-action="day-clear-search" class="mt-2 h-9 rounded-lg border border-slate-300 bg-white px-3 text-[12px] font-semibold text-slate-800">一键清空</button>
        </div>`;
      }
      const compareEmpty = state.dayCompare && cols.length === 1;
      return `<section class="overflow-hidden rounded-xl border border-slate-200/80 bg-white" aria-label="日调度课表">
        <div class="overflow-x-auto overscroll-x-contain">
          <div class="flex min-w-max">
            <div class="sticky left-0 z-20 w-10 shrink-0 border-r border-slate-200 bg-white">
              <div class="flex h-14 items-center justify-center border-b border-slate-200 bg-slate-50 font-mono text-[12px] font-semibold text-slate-500">时间</div>
              ${DAY_TIMES.map((time) => renderDayAxisCell(dayKey, time)).join('')}
            </div>
            <div class="flex">
              ${cols.map((col) => renderDayColumn(dayKey, col)).join('')}
            </div>
          </div>
        </div>
      </section>
      ${compareEmpty ? '<p class="mt-2 rounded-lg border border-amber-300 bg-amber-50 px-2.5 py-2 text-[12px] font-semibold text-amber-900">该时段暂无全部空闲的可接手老师</p>' : ''}
      <p class="mt-2 text-[12px] font-medium leading-relaxed text-slate-600">仅展示课表调度信息，列区可横向滑动查看全部老师或学员。</p>`;
    }

    function renderDayAxisCell(dayKey, time) {
      const past = dayKey === 0 && toMin(time) + 30 <= DAY_NOW_MIN;
      const nowSlot = dayKey === 0 && dayNowInSlot(time);
      return `<div data-day-slot="${time}" class="relative flex h-7 items-center justify-center border-b border-slate-100 font-mono text-[12px] font-medium ${past ? 'text-slate-500 opacity-60' : 'text-slate-600'}">
        ${time}
        ${nowSlot ? '<span class="absolute right-0.5 top-3/4 h-1.5 w-1.5 -translate-y-1/2 rounded-full bg-rose-600"></span>' : ''}
      </div>`;
    }

    function renderDayColumn(dayKey, col) {
      return `<div class="w-[92px] shrink-0 border-r border-slate-200 last:border-r-0">
        <div class="flex h-14 flex-col justify-center border-b border-slate-200 bg-slate-50 px-1">
          <div class="flex items-center gap-1">
            ${col.isClass ? '<span class="shrink-0 rounded bg-teal-600 px-1 text-[12px] font-bold leading-none text-white">[G]</span>' : ''}
            <span class="truncate text-[12px] font-bold text-slate-900">${esc(col.title)}</span>
            ${col.count ? `<span class="shrink-0 rounded-full bg-rose-50 px-1 text-[12px] font-bold leading-none text-rose-700">🔴 ${col.count}</span>` : ''}
          </div>
          ${col.meta
            ? `<span class="truncate text-[12px] font-semibold ${col.meta.taught ? 'text-emerald-700' : 'text-slate-600'}">${col.meta.taught ? '教过' : '未教过'} · ${esc(col.meta.tierText)}</span>
               <span class="truncate text-[12px] font-medium text-slate-600">本周已排 ${col.meta.load} 节</span>`
            : `<span class="truncate text-[12px] font-medium text-slate-600">${esc(col.subtitle)}</span>`}
        </div>
        ${DAY_TIMES.map((time) => renderDayColumnCell(dayKey, col, time)).join('')}
      </div>`;
    }

    function dayGroupContinuation(dayKey, col, time) {
      const prev = prevTime(time);
      if (!prev) return false;
      const prevItem = col.mode === 'teacher'
        ? dayTeacherItem(dayKey, col.key, prev)
        : col.mode === 'class'
          ? dayClassItem(dayKey, col.key, prev)
          : null;
      return !!prevItem && prevItem.type === 'group' && (prevItem.dur || 2) > 1;
    }

    function renderDayGroupCell(dayKey, col, time, item) {
      const cls = CLASSES[item.classId] || CLASSES.ket1;
      const past = dayKey === 0 && toMin(time) + 30 <= DAY_NOW_MIN;
      const nowSlot = dayKey === 0 && dayNowInSlot(time);
      const subbed = !!item.sub;
      const pending = !!item.pendingSub && !subbed;
      const near = !!item.nearChange || dayItemNear3h(dayKey, item.time);
      const crossClass = isCrossGroupClass(item.classId);
      let card = 'border-2 border-teal-400 bg-teal-50 text-teal-950';
      let inner = `<span class="shrink-0 rounded-sm bg-teal-600 px-1 text-[12px] font-bold leading-none text-white">[G]</span>
        <span class="max-w-full truncate text-[12px] font-bold leading-none">${esc(cls.code)} · ${esc(teacherShort(item.teacher))}${item.hold ? ' · G-HOLD' : ''}</span>`;
      if (pending) {
        card = 'border-rose-300 bg-rose-50 text-rose-800';
        inner = '<span class="text-[12px] font-bold leading-none">🔴 待代</span><span class="max-w-full truncate text-[12px] font-semibold leading-none">[G] ' + esc(cls.code) + '</span>';
      } else if (subbed) {
        card = 'border-purple-300 bg-purple-50 text-purple-900';
        inner = `<span class="text-[12px] font-bold leading-none">🟣 代课</span><span class="max-w-full truncate text-[12px] font-semibold leading-none">[G] ${esc(cls.code)}${crossClass ? '' : ` · ${esc(teacherShort(item.sub))} [SUB]`}</span>`;
      }
      const attrs = `data-action="day-cell" data-day="${dayKey}" data-mode="${col.mode}" data-key="${esc(col.key)}" data-time="${item.time}" data-group="1"`;
      return `<div class="relative h-14 w-full border-b border-slate-100 p-px ${past ? 'opacity-60' : ''}">
        <button ${attrs} class="relative flex h-full w-full min-w-0 flex-col items-center justify-center gap-1 overflow-hidden rounded-md border px-0.5 leading-none transition active:scale-95 ${card}" aria-label="${esc(`${crossClass ? cls.code : cls.name} ${item.time} 小班课`)}">
          ${inner}
          ${item.attendanceMark ? '<span class="pointer-events-none absolute right-0.5 top-0.5 text-[11px] leading-none" aria-label="考勤异常">⚠️</span>' : near ? '<span class="pointer-events-none absolute right-0.5 top-0.5 text-[12px] leading-none">⚡</span>' : ''}
          ${nowSlot ? '<span class="pointer-events-none absolute inset-x-0 top-3/4 border-t-2 border-rose-500"></span>' : ''}
        </button>
      </div>`;
    }

    function renderDayColumnCell(dayKey, col, time) {
      if (dayGroupContinuation(dayKey, col, time)) return '';
      const past = dayKey === 0 && toMin(time) + 30 <= DAY_NOW_MIN;
      const nowSlot = dayKey === 0 && dayNowInSlot(time);
      const item = col.mode === 'teacher'
        ? dayTeacherItem(dayKey, col.key, time)
        : col.mode === 'class'
          ? dayClassItem(dayKey, col.key, time)
          : dayStudentItem(dayKey, col.key, time);
      if (item && item.type === 'group') return renderDayGroupCell(dayKey, col, time, item);
      const ov = col.mode === 'teacher' ? dayOverrides[`${dayKey}|${col.key}|${time}`] : null;
      const leaveFree = !item && !!ov && !!ov.leaveFree;
      const lockedRest = !item && !!ov && ov.forced === 'rest';
      const free = col.mode === 'teacher' && !item && !leaveFree && !lockedRest && dayFreeAt(dayKey, col.key, time);
      let cls = 'border-transparent bg-white';
      let inner = '';
      if (item && item.sub) {
        cls = 'border-blue-300 bg-blue-50 text-blue-900';
        inner = `<span class="truncate text-[12px] font-bold leading-none">${esc(teacherShort(item.sub))}</span>`;
      } else if (item && item.type === 'pendingSub') {
        cls = 'border-rose-300 bg-rose-50 text-rose-700';
        inner = '<span class="text-[12px] font-bold leading-none">🔴 待代</span>';
      } else if (item && item.type === 'nearChange') {
        if (item.badge === 'free') {
          cls = 'border-emerald-200 bg-emerald-50 text-emerald-800';
          inner = '<span class="text-[12px] font-bold leading-none">约</span><span class="absolute right-0 top-0 text-[12px] leading-none">⚡</span>';
        } else {
          cls = 'border-purple-300 bg-purple-50 text-purple-900';
          inner = '<span class="text-[12px] font-bold leading-none">🟣 代课</span><span class="absolute right-0 top-0 text-[12px] leading-none">⚡</span>';
        }
      } else if (item) {
        cls = item.type === 'temp' ? 'border-yellow-300 bg-yellow-50 text-yellow-900' : 'border-amber-300 bg-amber-50 text-amber-900';
        const text = col.mode === 'teacher' ? studentName(item.student) : teacherShort(item.teacher);
        inner = `<span class="truncate text-[12px] font-bold leading-none">${esc(text)}</span>`;
      } else if (leaveFree) {
        cls = 'border-rose-300 bg-rose-50 text-rose-700';
        inner = '<span class="text-[12px] font-bold leading-none">🔴 假</span>';
      } else if (lockedRest) {
        cls = 'border-slate-200 bg-slate-100 text-slate-600';
        inner = '<span class="text-[12px] font-bold leading-none">休</span>';
      } else if (free) {
        cls = 'border-emerald-200 bg-emerald-50 text-emerald-800';
        inner = '<span class="text-[12px] font-bold leading-none">约</span>';
      }
      const attrs = item
        ? `data-action="day-cell" data-day="${dayKey}" data-mode="${col.mode}" data-key="${esc(col.key)}" data-time="${time}"`
        : leaveFree
          ? `data-action="day-leave-free" data-day="${dayKey}" data-key="${esc(col.key)}" data-time="${time}"`
          : free || lockedRest
            ? `data-action="day-free" data-day="${dayKey}" data-key="${esc(col.key)}" data-time="${time}"`
            : `data-action="day-empty" data-time="${time}"`;
      const labelText = item ? `${col.title} ${time} 排课` : leaveFree ? `${col.title} ${time} 请假空闲格` : `${col.title} ${time} ${free ? '空闲可约' : lockedRest ? '已锁定休息' : '无排课'}`;
      return `<div class="relative h-7 w-full border-b border-slate-100 p-px ${past ? 'opacity-60' : ''}">
        <button ${attrs} class="relative flex h-full w-full min-w-0 items-center justify-center overflow-hidden rounded-md border px-0.5 leading-none transition active:scale-95 ${cls}" aria-label="${esc(labelText)}">
          ${inner}
          ${item && item.attendanceMark ? '<span class="pointer-events-none absolute right-0 top-0 text-[11px] leading-none" aria-label="考勤异常">⚠️</span>' : ''}
          ${nowSlot ? '<span class="pointer-events-none absolute inset-x-0 top-3/4 border-t-2 border-rose-500"></span>' : ''}
        </button>
      </div>`;
    }

    function dayAlertLine(item) {
      if (item.attendanceMark) {
        const markText = { 'student-absent': '学员旷课', 'teacher-absent': '老师旷课', 'teacher-late': '老师迟到', 'teacher-early': '老师早退' }[item.attendanceMark] || '考勤异常';
        return `⚠️ 已标考勤异常（${markText}）· ${item.type === 'group' ? `[G] ${(CLASSES[item.classId] || CLASSES.ket1).code}` : STUDENTS[item.student].name}`;
      }
      if (item.type === 'group') {
        const cls = CLASSES[item.classId] || CLASSES.ket1;
        if (item.sub) return `🟣 已指派 ${teacherShort(item.sub)} 代课 · [G] ${cls.code}`;
        if (item.pendingSub) return item.note ? `🔴 ${item.note}` : `🔴 [G] ${cls.code} 待代 · 尚未指派代课`;
        if (item.nearChange) return `⚡ [G] ${cls.code} 距开课不足 3 小时的临期变动`;
        return isCrossGroupClass(item.classId)
          ? `[G] ${cls.code} · 他组小班（主理人与班级详情已半脱敏）`
          : `[G] ${cls.name} · 授课 ${teacherName(item.teacher)}${item.actual ? ` · 代课 ${teacherName(item.actual)} [SUB]` : ''}`;
      }
      if (item.sub) return `✅ 已指派 ${teacherShort(item.sub)} 代课`;
      if (item.type === 'pendingSub') return item.note ? `🔴 ${item.note}` : '🔴 待代 · 尚未指派代课';
      if (item.type === 'nearChange') return `⚡ ${item.note || '距开课不足 3 小时的临期变动'}`;
      return `${TYPE_NAME[item.type] || '课次'} · ${STUDENTS[item.student].name} · ${TEACHERS[item.teacher].short}`;
    }

    function daySameDayFreeTimes(dayKey, teacherKey) {
      if (Number(dayKey) < 0) return [];
      return DAY_TIMES.filter((t) => dayFreeAt(dayKey, teacherKey, t)).slice(0, 6);
    }

    function renderDayCandidates(cell, candidates, isGroup) {
      if (!candidates.length) {
        return '<div class="mt-2 rounded-xl border border-amber-300 bg-amber-50 px-3 py-2 text-[12px] font-semibold leading-relaxed text-amber-900">该时段暂无全部空闲的可接手老师</div>';
      }
      return `<div class="mt-2 rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[12px] font-semibold text-slate-600">推荐全时段空闲代课老师（一步代课）</span>
          <span class="shrink-0 text-[12px] font-medium text-slate-600">${isGroup ? '连续双格空闲 · ' : ''}熟客 → 同/相近价位 → 负荷</span>
        </div>
        <div class="mt-1.5 space-y-1.5">
          ${candidates.map((candidate) => `<button data-action="day-assign" data-key="${candidate.key}" class="flex min-h-12 w-full items-center gap-2 rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-left transition hover:bg-slate-50">
            <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg bg-slate-100 text-[12px] font-bold text-slate-700">${TEACHERS[candidate.key].initial}</span>
            <span class="min-w-0 flex-1">
              <span class="flex items-center gap-1">
                <span class="truncate text-[14px] font-bold text-slate-900">${esc(TEACHERS[candidate.key].name)}</span>
                <span class="shrink-0 rounded bg-slate-100 px-1 py-0.5 text-[12px] font-semibold text-slate-700">${TEACHERS[candidate.key].tierLabel}</span>
                ${candidate.taught ? `<span class="shrink-0 rounded border border-emerald-200 bg-emerald-50 px-1 py-0.5 text-[12px] font-bold text-emerald-700">${isGroup ? '教过本班' : '教过该学员'}</span>` : ''}
              </span>
              <span class="block truncate text-[12px] font-medium text-slate-600">${esc(candidate.tierText)} · 本周已排 ${candidate.load} 节 · 空闲 ${candidate.free} 节</span>
            </span>
            <span class="shrink-0 rounded-lg bg-indigo-600 px-2 py-1 text-[12px] font-bold text-white">一步代课</span>
          </button>`).join('')}
        </div>
      </div>`;
    }

    function renderDayGroupActions(cell, item, ctx) {
      const classHref = `m3a_calendar_grid.html?role=${state.role === 'admin' ? 'admin' : 'monitor'}&view=class&classId=${esc(item.classId || 'ket1')}`;
      const ownClass = isOwnClass(item.classId) || state.role === 'admin';
      const weekLink = `<a href="m3a_calendar_grid.html?role=${state.role === 'admin' ? 'admin' : 'monitor'}&teacher=${esc(item.teacher)}" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-slate-300 bg-white px-1 text-[12px] font-semibold text-slate-800">老师课表</a>`;
      const started = ctx.yesterday || (Number(cell.dayKey) === 0 && toMin(cell.time) <= DAY_NOW_MIN);
      if (ctx.yesterday) {
        return `<div class="mt-2 grid grid-cols-3 gap-1.5">
          <button data-action="day-attendance" class="flex h-10 min-w-0 items-center justify-center rounded-lg border border-slate-300 bg-white px-1 text-[12px] font-semibold text-slate-800">考勤纠偏</button>
          <button data-action="day-exception-backfill" class="flex h-10 min-w-0 items-center justify-center rounded-lg border border-rose-200 bg-rose-50 px-1 text-[12px] font-semibold text-rose-800">异常回退补生</button>
          ${weekLink}
        </div>`;
      }
      if (ctx.readonly) {
        return `<div class="mt-2">${weekLink}</div>
          <p class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-600">他组 &gt;=3h 小班仅半脱敏只读，禁止进入小班详情与小班专属周课表。</p>`;
      }
      const links = ownClass
        ? `<a href="m1c_classes.html" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-teal-200 bg-teal-50 px-1 text-[12px] font-semibold text-teal-800">小班详情</a>
           <a href="${classHref}" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-teal-200 bg-teal-50 px-1 text-[12px] font-semibold text-teal-800">小班课表</a>`
        : weekLink;
      return `<div class="mt-2 space-y-1.5">
        <div class="grid grid-cols-2 gap-1.5">
          <button data-action="day-sub-open" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-slate-300 bg-white px-1 text-[12px] font-semibold text-slate-800">请假 / 代课 / 暂停</button>
          ${item.sub
            ? `<button data-action="day-revoke-sub" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-rose-200 bg-rose-50 px-1 text-[12px] font-semibold text-rose-800">撤销代课</button>`
            : `<button data-action="day-move-class" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-slate-300 bg-white px-1 text-[12px] font-semibold text-slate-800">同师双格挪位</button>`}
          <button data-action="day-attendance" ${started ? '' : 'disabled'} class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border px-1 text-[12px] font-semibold ${started ? 'border-slate-300 bg-white text-slate-800' : 'cursor-not-allowed border-slate-200 bg-slate-100 text-slate-500'}">${started ? '考勤 / 旷课' : '未开课禁考勤'}</button>
          ${started
            ? `<button data-action="day-exception-backfill" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-rose-200 bg-rose-50 px-1 text-[12px] font-semibold text-rose-800">异常回退补生</button>`
            : `<button data-action="day-withdraw" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-rose-200 bg-rose-50 px-1 text-[12px] font-semibold text-rose-800">撤排退池</button>`}
        </div>
        <div class="grid grid-cols-2 gap-1.5">${links}</div>
      </div>`;
    }

    function renderDay1v1Actions(cell, item, ctx) {
      const weekLink = cell.mode === 'teacher'
        ? `<button data-action="day-week" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-slate-300 bg-white px-1 text-[12px] font-semibold text-slate-800">老师课表</button>`
        : `<button data-action="day-week" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-slate-300 bg-white px-1 text-[12px] font-semibold text-slate-800">学员课表</button>`;
      const started = ctx.yesterday || (Number(cell.dayKey) === 0 && toMin(cell.time) <= DAY_NOW_MIN);
      if (ctx.yesterday) {
        return `<div class="mt-2 grid grid-cols-3 gap-1.5">
          <button data-action="day-attendance" class="flex h-10 min-w-0 items-center justify-center rounded-lg border border-slate-300 bg-white px-1 text-[12px] font-semibold text-slate-800">考勤纠偏</button>
          <button data-action="day-exception-backfill" class="flex h-10 min-w-0 items-center justify-center rounded-lg border border-rose-200 bg-rose-50 px-1 text-[12px] font-semibold text-rose-800">异常回退补生</button>
          ${weekLink}
        </div>`;
      }
      if (ctx.readonly) {
        return `<div class="mt-2 flex gap-1.5">${weekLink}</div>`;
      }
      const sameDayFree = daySameDayFreeTimes(cell.dayKey, item.teacher);
      return `<div class="mt-2 space-y-2">
        ${sameDayFree.length ? `<div class="rounded-xl border border-emerald-200 bg-emerald-50/70 p-2">
          <div class="flex items-center justify-between gap-2 text-[12px]">
            <span class="font-bold text-emerald-900">当天同师空闲挪位胶囊</span>
            <button data-action="day-week" class="font-semibold text-indigo-700 underline">跨天请进周课表 →</button>
          </div>
          <div class="mt-1.5 flex flex-wrap gap-1">
            ${sameDayFree.map((t) => `<button type="button" data-action="day-quick-move" data-time="${t}" class="h-7 rounded-lg border border-emerald-300 bg-white px-2 text-[12px] font-bold text-emerald-800 hover:bg-emerald-100">${t}</button>`).join('')}
          </div>
        </div>` : ''}
        <div class="grid grid-cols-2 gap-1.5">
          <button data-action="day-sub-open" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-slate-300 bg-white px-1 text-[12px] font-semibold text-slate-800">请假 / 指派代课</button>
          <button data-action="day-proxy-leave" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-slate-300 bg-white px-1 text-[12px] font-semibold text-slate-800">代 ${esc(ctx.student.name)} 请假</button>
          <button data-action="day-attendance" ${started ? '' : 'disabled'} class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border px-1 text-[12px] font-semibold ${started ? 'border-slate-300 bg-white text-slate-800' : 'cursor-not-allowed border-slate-200 bg-slate-100 text-slate-500'}">${started ? '考勤 / 旷课标记' : '未开课禁考勤'}</button>
          ${ctx.rescue
            ? `<button data-action="day-move-rescue" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-slate-300 bg-white px-1 text-[12px] font-semibold text-slate-800">&lt;3h 同师挪位</button>`
            : `<button data-action="day-change-student" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-slate-300 bg-white px-1 text-[12px] font-semibold text-slate-800">换上课学员</button>`}
          ${started
            ? `<button data-action="day-exception-backfill" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-rose-200 bg-rose-50 px-1 text-[12px] font-semibold text-rose-800">异常回退补生</button>`
            : `<button data-action="day-withdraw" class="flex h-10 min-w-0 items-center justify-center whitespace-nowrap rounded-lg border border-rose-200 bg-rose-50 px-1 text-[12px] font-semibold text-rose-800">撤排退回课次</button>`}
          ${weekLink}
        </div>
      </div>`;
    }

    function renderDayFreeSheet() {
      const cell = state.dayFreeCell;
      if (!cell) return '';
      const when = `${dayWeekday(cell.dayKey)} ${fmtSlash(dayDate(cell.dayKey))} ${cell.time} - ${endTime(cell.time)}`;
      const teacher = TEACHERS[cell.key] || TEACHERS.david;
      const yesterday = Number(cell.dayKey) === -1;
      const ov = dayOverrides[`${cell.dayKey}|${cell.key}|${cell.time}`];
      if (cell.kind === 'leaveFree') {
        return `${sheetHeader('🔴 请假空闲格 · 销假恢复', when)}
          <div class="rounded-xl border border-rose-200 bg-rose-50 p-3 text-[12px] font-medium leading-relaxed text-rose-800">
            <div class="font-bold text-rose-900">${esc(teacher.name)} · 原先因请假释放的红色时段</div>
            <p class="mt-1">若老师临时可复课，可一键销假恢复为 🟢 绿色可约空闲格。</p>
          </div>
          ${yesterday ? '<p class="mt-2 text-[12px] font-semibold text-slate-500">昨天仅只读复盘，不可销假。</p>' : `<button data-action="day-restore-leave-free" class="mt-3 flex h-11 w-full items-center justify-center gap-1 rounded-xl bg-emerald-600 text-[15px] font-bold text-white transition hover:bg-emerald-700">销假恢复 🟢 可约</button>`}`;
      }
      const lockedRest = !!ov && ov.forced === 'rest';
      return `${sheetHeader(lockedRest ? '已锁定休息时段' : '🟢 空闲格 · 紧急代约 / 锁时段', when)}
        <div class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
          <div class="text-[14px] font-bold text-slate-900">${esc(teacher.name)} (${esc(teacher.tierLabel)})</div>
          <p class="mt-1 text-[12px] font-medium text-slate-600">${lockedRest ? '该时段当前已单日锁定为不可约；仅本日生效，不延续至下周。' : '支持紧急代约（含未建档试课快速建档 + 2 合 1 录单收款）或单日锁时段（不延续至下周）。'}</p>
        </div>
        ${yesterday ? '<p class="mt-2 text-[12px] font-semibold text-slate-500">昨天仅只读复盘，隐藏空闲格快操。</p>' : `<div class="mt-3 space-y-2">
          ${lockedRest
            ? `<button data-action="day-unlock-slot" class="flex h-11 w-full items-center justify-center gap-1 rounded-xl bg-emerald-600 text-[15px] font-bold text-white transition hover:bg-emerald-700">解锁恢复 🟢 可约</button>`
            : `<button data-action="day-quick-book" class="flex h-11 w-full items-center justify-center gap-1 rounded-xl bg-indigo-600 text-[15px] font-bold text-white transition hover:bg-indigo-700">紧急代约 / 2合1快速录单</button>
               <button data-action="day-lock-slot" class="flex h-10 w-full items-center justify-center gap-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-800 hover:bg-slate-50">锁时段（仅单日生效）</button>`}
        </div>`}`;
    }

    function renderDaySheet() {
      const cell = state.dayCell;
      if (!cell) return '';
      const item = cell.mode === 'teacher'
        ? dayTeacherItem(cell.dayKey, cell.key, cell.time)
        : cell.mode === 'class'
          ? dayClassItem(cell.dayKey, cell.key, cell.time)
          : dayStudentItem(cell.dayKey, cell.key, cell.time);
      const when = `${dayWeekday(cell.dayKey)} ${fmtSlash(dayDate(cell.dayKey))} ${cell.time} - ${endTime(cell.time)}`;
      if (!item) return `${sheetHeader('时段详情', when)}<p class="text-[14px] font-medium text-slate-700">该时段暂无排课。</p>`;
      const isGroup = item.type === 'group';
      const pending = isGroup ? (!!item.pendingSub && !item.sub) : (item.type === 'pendingSub' && !item.sub);
      const near = isGroup
        ? (!!item.nearChange || dayItemNear3h(cell.dayKey, item.time))
        : item.type === 'nearChange';
      const cls = isGroup ? (CLASSES[item.classId] || CLASSES.ket1) : null;
      const student = isGroup ? STUDENTS.alice : (STUDENTS[item.student] || STUDENTS.alice);
      const teacher = TEACHERS[item.teacher] || TEACHERS.david;
      const cross = state.role === 'monitor' && (!isOwnTeacher(item.teacher) || (isGroup && !isOwnClass(item.classId)));
      const yesterday = Number(cell.dayKey) === -1;
      const rescue = !yesterday && cross && (dayItemNear3h(cell.dayKey, item.time) || pending);
      const readonly = !yesterday && cross && !rescue;
      const candidates = pending && !readonly && !yesterday
        ? dayCandidates(cell.dayKey, item.teacher, cell.time, isGroup ? { dur: item.dur || 2, isGroup: true, classId: item.classId } : {})
        : [];
      const contextLine = isGroup
        ? (cross && !rescue
          ? `[G] ${esc(cls.code)} · 他组小班半脱敏 · 主理人与班级详情已隐藏`
          : `[G] ${esc(cls.name)} · 授课 ${esc(teacher.short)}${(item.actual || item.sub) ? ` · 代课 ${esc(teacherShort(item.actual || item.sub))} [SUB]` : ''} · ${cell.mode === 'class' ? '按小班视角' : '按老师视角'}`)
        : `${esc(student.name)} · 任课 ${esc(teacher.short)} · ${cell.mode === 'teacher' ? '按老师视角' : '按学员视角'}`;
      const banner = yesterday
        ? `<div class="mb-2.5 rounded-xl border border-slate-300 bg-slate-100 px-3 py-2"><p class="text-[14px] font-bold text-slate-800">昨天 · 只读复盘</p><p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">课次已自动结课；仅开放考勤纠偏与异常未上课回退补生（限原负责班长/主理人或管理员），不适用 <3h 跨组驰援。</p></div>`
        : (cross
          ? (rescue
            ? crossOwnerBanner('rescue', item)
            : (isGroup
              ? `<div data-role="cross-readonly-banner" class="mb-2.5 rounded-xl border border-slate-300 bg-slate-100 px-3 py-2"><p class="text-[14px] font-bold text-slate-800">跨组只读 · 他组小班半脱敏</p><p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">距开课 ≥3 小时，仅展示 [G] 小班简称与占格状态；主理班长姓名与班级详情已隐藏。</p></div>`
              : crossOwnerBanner('readonly', item)))
          : '');
      const compare = pending && !readonly && !yesterday && cell.mode === 'teacher'
        ? `<button data-action="day-compare" class="mt-2 flex h-10 w-full items-center justify-center gap-1 rounded-xl border text-[14px] font-semibold transition ${state.dayCompare ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-300 bg-white text-slate-800'}">🔍 同屏对照空闲老师${state.dayCompare ? ' · 已开启' : ''}</button>`
        : '';
      const actions = isGroup
        ? renderDayGroupActions(cell, item, { pending, near, readonly, rescue, yesterday, cls, teacher })
        : renderDay1v1Actions(cell, item, { pending, near, readonly, rescue, yesterday, teacher, student });
      return `<div data-role="${isGroup ? 'day-group' : 'day-1v1'}${readonly ? ' day-cross-readonly' : ''}${rescue ? ' day-cross-rescue' : ''}${yesterday ? ' day-yesterday' : ''}">
        ${sheetHeader(yesterday ? '昨天 · 只读复盘' : (pending ? '待指派代课' : (isGroup ? '小班课详情' : (near ? '临期变动' : '课次详情'))), when)}
        ${banner}
        <div class="rounded-xl border px-3 py-2 ${pending ? 'border-rose-200 bg-rose-50' : near ? 'border-purple-200 bg-purple-50' : isGroup ? 'border-teal-200 bg-teal-50' : 'border-slate-300 bg-slate-50/70'}">
          <p class="text-[14px] font-bold leading-snug ${pending ? 'text-rose-800' : near ? 'text-purple-900' : isGroup ? 'text-teal-900' : 'text-slate-900'}">${esc(dayAlertLine(item))}</p>
          <p class="mt-1 text-[12px] font-medium leading-relaxed ${pending ? 'text-rose-700' : near ? 'text-purple-800' : isGroup ? 'text-teal-800' : 'text-slate-600'}">${contextLine}</p>
        </div>
        ${pending && !yesterday ? renderDayCandidates(cell, candidates, isGroup) : ''}
        ${compare}
        ${actions}
      </div>`;
    }

    function handleDayCell(dayKey, mode, key, time) {
      const item = mode === 'teacher'
        ? dayTeacherItem(dayKey, key, time)
        : mode === 'class'
          ? dayClassItem(dayKey, key, time)
          : dayStudentItem(dayKey, key, time);
      if (!item) {
        showToast('该时段暂无排课');
        return;
      }
      state.dayCell = { dayKey: Number(dayKey), mode, key, time, teacher: item.teacher };
      state.dayCompare = false;
      if (!item.sub && (item.type === 'pendingSub' || (item.type === 'group' && item.pendingSub))) {
        state.dayIncident = { key: item.teacher, time };
      }
      state.drawer = 'day';
      render(true);
    }

    function assignDaySub(teacherKey) {
      const cell = state.dayCell;
      if (!cell) return;
      const item = cell.mode === 'teacher'
        ? dayTeacherItem(cell.dayKey, cell.key, cell.time)
        : cell.mode === 'class'
          ? dayClassItem(cell.dayKey, cell.key, cell.time)
          : dayStudentItem(cell.dayKey, cell.key, cell.time);
      if (!item) return;
      dayOverrides[`${cell.dayKey}|${item.teacher}|${cell.time}`] = item.type === 'group'
        ? Object.assign({}, item, { pendingSub: true, sub: teacherKey })
        : { type: 'pendingSub', sub: teacherKey };
      state.drawer = null;
      state.dayCell = null;
      state.dayCompare = false;
      render(true);
      showToast(item.type === 'group'
        ? `${TEACHERS[teacherKey].name} 已一步代课 ${(CLASSES[item.classId] || CLASSES.ket1).code}（仅发 1 条合并结论通知）`
        : `${TEACHERS[teacherKey].name} 已一步代课 ${STUDENTS[item.student].name}（仅发 1 条合并结论通知）`);
    }

    function proxyDayLeave() {
      const cell = state.dayCell;
      if (!cell) return;
      const item = cell.mode === 'teacher'
        ? dayTeacherItem(cell.dayKey, cell.key, cell.time)
        : cell.mode === 'class'
          ? dayClassItem(cell.dayKey, cell.key, cell.time)
          : dayStudentItem(cell.dayKey, cell.key, cell.time);
      if (!item) return;
      if (item.type === 'group') {
        showToast('小班课不适用代学员请假，请使用暂停待排');
        return;
      }
      const student = STUDENTS[item.student] || STUDENTS.alice;
      dayOverrides[`${cell.dayKey}|${item.teacher}|${cell.time}`] = {
        type: 'nearChange',
        badge: 'free',
        sub: null,
        note: `已代 ${student.name} 请假 · 已退回待排期`
      };
      state.drawer = null;
      state.dayCell = null;
      state.dayCompare = false;
      render(true);
      showToast(`已代 ${student.name} 请假，TS 退回待排期，课格恢复为空闲`);
    }

    function proxyTeacherLeave() {
      const cell = state.dayCell;
      if (!cell) return;
      const item = cell.mode === 'teacher'
        ? dayTeacherItem(cell.dayKey, cell.key, cell.time)
        : cell.mode === 'class'
          ? dayClassItem(cell.dayKey, cell.key, cell.time)
          : dayStudentItem(cell.dayKey, cell.key, cell.time);
      if (!item) return;
      dayOverrides[`${cell.dayKey}|${item.teacher}|${cell.time}`] = item.type === 'group'
        ? Object.assign({}, item, { pendingSub: true, sub: null, note: '老师请假 · 待指派代课' })
        : { type: 'pendingSub', sub: null, note: '老师请假 · 待指派代课' };
      state.drawer = null;
      state.dayCell = null;
      state.dayCompare = false;
      render(true);
      showToast('已代老师请假 · 课格转为待代课');
    }

    function pauseDayGroup() {
      const cell = state.dayCell;
      if (!cell || !cell.teacher) return;
      const item = dayClassItem(cell.dayKey, cell.key, cell.time) || dayTeacherItem(cell.dayKey, cell.key, cell.time);
      if (!item || item.type !== 'group') return;
      dayOverrides[`${cell.dayKey}|${item.teacher}|${cell.time}`] = Object.assign({}, item, {
        pendingSub: true,
        sub: null,
        note: '小班暂停待排 · 不扣学员课次'
      });
      state.drawer = null;
      state.dayCell = null;
      state.dayCompare = false;
      render(true);
      showToast('小班已暂停待排，课次退回小班待排池');
    }

    function revokeDaySub() {
      const cell = state.dayCell;
      if (!cell) return;
      const item = cell.mode === 'class'
        ? dayClassItem(cell.dayKey, cell.key, cell.time)
        : cell.mode === 'teacher'
          ? dayTeacherItem(cell.dayKey, cell.key, cell.time)
          : dayStudentItem(cell.dayKey, cell.key, cell.time);
      if (!item) return;
      dayOverrides[`${cell.dayKey}|${item.teacher}|${cell.time}`] = Object.assign({}, item, {
        sub: null,
        pendingSub: false
      });
      state.drawer = null;
      state.dayCell = null;
      state.dayCompare = false;
      render(true);
      showToast('已撤销代课指派，恢复原任老师排期');
    }

    function openDayWeekView() {
      const cell = state.dayCell;
      if (!cell) return;
      const item = cell.mode === 'teacher'
        ? dayTeacherItem(cell.dayKey, cell.key, cell.time)
        : cell.mode === 'class'
          ? dayClassItem(cell.dayKey, cell.key, cell.time)
          : dayStudentItem(cell.dayKey, cell.key, cell.time);
      if (!item && cell.mode === 'teacher') return;
      if (cell.mode === 'teacher' || cell.mode === 'class') {
        state.teacher = item.teacher;
        state.weekStudent = null;
      } else {
        state.weekStudent = cell.key;
      }
      state.view = 'week';
      state.drawer = null;
      state.panel = null;
      state.dayCell = null;
      state.dayIncident = null;
      state.dayCompare = false;
      state.foldOpen = {};
      render(true);
    }

    /* ------------------------------------------------------------------
     * 小班专属周课表（§4.8.3 · 班长 / 主理人 / 管理员专属）
     * ------------------------------------------------------------------ */
    function isClassArchived(classKey = state.classView) {
      return !!(state.classArchived || classInfo(classKey).archived);
    }
    function classLessonsAt(day, time) {
      const archived = isClassArchived();
      if (archived && (state.roundOffset > 0 || state.week > 1)) return [];
      return slotLessons(day, time).filter((item) => {
        if (item.kind !== 'group' || item.classId !== state.classView) return false;
        if (archived && (item.hold || item.pendingSub)) return false;
        return true;
      });
    }
    function classLessonCovered(day, time) {
      const prevM = toMin(time) - 30;
      if (prevM < STUDENT_GRID_START) return false;
      return classLessonsAt(day, fmtMinutes(prevM)).some((item) => (item.dur || 2) > 1);
    }
    function classGridBounds() {
      if (state.classFullDay) return { startMin: STUDENT_GRID_START, endMin: STUDENT_GRID_END };
      const cls = classInfo(state.classView);
      const archived = isClassArchived();
      const useTeacher = !archived && !!cls.teacher;
      let minMin = Infinity;
      let maxMin = -Infinity;
      for (let m = STUDENT_GRID_START; m < STUDENT_GRID_END; m += 30) {
        const time = fmtMinutes(m);
        for (let day = 0; day < 7; day += 1) {
          const lessons = classLessonsAt(day, time);
          if (lessons.length) {
            minMin = Math.min(minMin, m);
            const dur = Math.max(1, Number(lessons[0].dur || 2));
            maxMin = Math.max(maxMin, m + dur * 30);
          }
          if (useTeacher && classTeacherOpen(cls.teacher, day, time)) {
            minMin = Math.min(minMin, m);
            maxMin = Math.max(maxMin, m + 30);
          }
        }
      }
      if (minMin === Infinity) return { startMin: 9 * 60, endMin: 15 * 60 };
      let startMin = Math.max(STUDENT_GRID_START, minMin);
      let endMin = Math.min(STUDENT_GRID_END, maxMin);
      if (endMin - startMin < 360) {
        const pad = 360 - (endMin - startMin);
        const before = Math.min(startMin - STUDENT_GRID_START, Math.floor(pad / 60) * 30);
        startMin -= before;
        endMin += pad - before;
        if (endMin > STUDENT_GRID_END) {
          startMin = Math.max(STUDENT_GRID_START, startMin - (endMin - STUDENT_GRID_END));
          endMin = STUDENT_GRID_END;
        }
      }
      return { startMin, endMin };
    }
    function classPairFree(day, time) {
      const cls = classInfo(state.classView);
      if (isClassArchived() || !cls.teacher) return false;
      const next = nextTime(time);
      if (toMin(next) >= STUDENT_GRID_END) return false;
      if (classLessonsAt(day, time).length || classLessonsAt(day, next).length) return false;
      return classTeacherFreeAt(cls.teacher, day, time) && classTeacherFreeAt(cls.teacher, day, next);
    }
    function classPairContinuation(day, time) {
      const prevM = toMin(time) - 30;
      if (prevM < STUDENT_GRID_START) return false;
      return classPairFree(day, fmtMinutes(prevM));
    }
    function buildClassWeekLayout() {
      const cls = classInfo(state.classView);
      const archived = isClassArchived();
      const useTeacher = !archived && !!cls.teacher;
      const bounds = classGridBounds();
      const allTimes = [];
      for (let m = bounds.startMin; m < bounds.endMin; m += 30) allTimes.push(fmtMinutes(m));

      const isRowIdle = (time) => {
        if (state.classFullDay) return false;
        for (let day = 0; day < 7; day += 1) {
          if (classLessonsAt(day, time).length || classLessonCovered(day, time)) return false;
          if (useTeacher && classTeacherOpen(cls.teacher, day, time)) return false;
        }
        return true;
      };

      const blocks = [];
      let activeTimes = [];
      let idleTimes = [];
      const flushActive = () => {
        if (!activeTimes.length) return;
        blocks.push({ type: 'segment', times: activeTimes });
        activeTimes = [];
      };
      const flushIdle = () => {
        if (!idleTimes.length) return;
        if (idleTimes.length >= 4) {
          flushActive();
          const start = idleTimes[0];
          const end = endTime(idleTimes[idleTimes.length - 1]);
          const open = !!state.classFoldOpen[start];
          blocks.push({ type: 'fold', start, end, count: idleTimes.length, open });
          if (open) blocks.push({ type: 'segment', times: idleTimes.slice() });
        } else {
          activeTimes = activeTimes.concat(idleTimes);
        }
        idleTimes = [];
      };

      allTimes.forEach((time) => {
        if (isRowIdle(time)) {
          idleTimes.push(time);
        } else {
          flushIdle();
          activeTimes.push(time);
        }
      });
      flushIdle();
      flushActive();

      const buildSegmentRows = (segTimes) => {
        const len = segTimes.length;
        const grid = Array.from({ length: len }, () => Array(7).fill(null));
        for (let day = 0; day < 7; day += 1) {
          for (let i = 0; i < len; i += 1) {
            if (grid[i][day]) continue;
            const lessons = classLessonsAt(day, segTimes[i]);
            if (lessons.length) {
              const lesson = lessons[0];
              const rowSpan = Math.min(Math.max(1, Number(lesson.dur || 2)), len - i);
              grid[i][day] = { kind: 'lesson', lesson, rowSpan };
              if (rowSpan === 2 && i + 1 < len) grid[i + 1][day] = { kind: 'covered' };
            }
          }
          if (useTeacher) {
            let i = 0;
            while (i < len) {
              if (grid[i][day] || !classTeacherFreeAt(cls.teacher, day, segTimes[i])) {
                i += 1;
                continue;
              }
              let endIdx = i;
              while (endIdx + 1 < len && !grid[endIdx + 1][day] && classTeacherFreeAt(cls.teacher, day, segTimes[endIdx + 1])) {
                endIdx += 1;
              }
              const runLen = endIdx - i + 1;
              let cursor = i;
              if (runLen >= 3 && runLen % 2 === 1 && toMin(segTimes[cursor]) % 60 === 30) {
                cursor += 1;
              }
              while (cursor + 1 <= endIdx) {
                grid[cursor][day] = { kind: 'freePair', rowSpan: 2 };
                grid[cursor + 1][day] = { kind: 'covered' };
                cursor += 2;
              }
              i = endIdx + 1;
            }
          }
          for (let i = 0; i < len; i += 1) {
            if (!grid[i][day]) {
              grid[i][day] = { kind: useTeacher ? 'rest' : 'blank', rowSpan: 1 };
            }
          }
        }
        return segTimes.map((time, i) => ({ type: 'row', time, cells: grid[i] }));
      };

      const rows = [];
      blocks.forEach((block) => {
        if (block.type === 'fold') rows.push(block);
        else buildSegmentRows(block.times).forEach((row) => rows.push(row));
      });
      return rows;
    }

    function confirmClassBackfill() {
      if (!requireOnline()) return;
      const slot = state.classBackfill;
      const cls = classInfo(state.classView);
      if (!slot || Number(cls.pool || 0) < 1 || state.classArchived) return;
      cls.pool = Number(cls.pool || 0) - 1;
      extraLessons.push({
        week: state.week,
        day: slot.day,
        time: slot.time,
        teacher: cls.teacher,
        student: 'alice',
        kind: 'group',
        classId: state.classView,
        dur: 2
      });
      state.classBackfill = null;
      state.drawer = null;
      render(true);
      showToast(`已消耗小班待排池 1 节并补排 ${dayLabel(slot.day)} ${slot.time} · 已消解小班待补排待办`);
    }

    function performClassMove(day, time) {
      const move = state.classMove;
      if (!move) return;
      const lesson = move.lesson;
      groupSpanTimes(lesson).forEach((point) => {
        overrides[slotKey(state.week, lesson.day, point)] = { forced: 'available' };
      });
      for (let index = 0; index < (lesson.dur || 2); index += 1) {
        const point = fmtMinutes(toMin(time) + index * 30);
        overrides[slotKey(state.week, day, point)] = Object.assign({}, lesson, {
          day,
          time: point,
          actual: null,
          pendingSub: false,
          hold: false
        });
      }
      state.classMove = null;
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(`已同师双格挪位至 ${dayLabel(day)} ${time} - ${endTime(time, 2)}，平移不改变小班单节待上交积分快照；若命中已绑学员 1v1，已向双方班长发协调卡并向家长补发 1 条中性日程知会`);
    }

    function markClassTeacherLeave() {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson || lesson.kind !== 'group') return;
      groupSpanTimes(lesson).forEach((time) => {
        overrides[slotKey(state.week, lesson.day, time)] = Object.assign({}, lesson, { time, pendingSub: true });
      });
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast('已代老师请假 · 小班双格转为 🔴 待代，已通知主理人与全校紧急流');
    }

    function withdrawClassLesson() {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson || lesson.kind !== 'group') return;
      groupSpanTimes(lesson).forEach((time) => {
        overrides[slotKey(state.week, lesson.day, time)] = { forced: 'available' };
      });
      const cls = classInfo(lesson.classId);
      cls.pool = Number(cls.pool || 0) + 1;
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast('已撤排小班双格，1 节已退回小班待排池');
    }

    /* ------------------------------------------------------------------
     * 家长课次抽屉
     * ------------------------------------------------------------------ */
    function mergeRunTimes(lesson) {
      if (!lesson) return [];
      if (lesson.kind === 'group') {
        const sameGroup = (item) => item && item.kind === 'group' && item.classId === lesson.classId && item.teacher === lesson.teacher;
        let start = lesson.time;
        let guard = 0;
        while (guard < 12) {
          const prevMin = toMin(start) - 60;
          if (prevMin < gridStartMin()) break;
          const prev = fmtMinutes(prevMin);
          if (!slotLessons(lesson.day, prev).some(sameGroup)) break;
          start = prev;
          guard += 1;
        }
        let end = lesson.time;
        guard = 0;
        while (guard < 12) {
          const nextMin = toMin(end) + 60;
          if (nextMin >= gridEndMin()) break;
          const next = fmtMinutes(nextMin);
          if (!slotLessons(lesson.day, next).some(sameGroup)) break;
          end = next;
          guard += 1;
        }
        const times = [];
        for (let m = toMin(start); m <= toMin(end); m += 60) times.push(fmtMinutes(m));
        return times;
      }
      if (!['fixed', 'temp', 'sub'].includes(lesson.kind)) return [];
      const same = (item) => item
        && item.student === lesson.student
        && item.teacher === lesson.teacher
        && ['fixed', 'temp', 'sub'].includes(item.kind);
      let start = lesson.time;
      let guard = 0;
      while (guard < 24) {
        const prev = prevTime(start);
        if (!prev) break;
        if (!slotLessons(lesson.day, prev).some(same)) break;
        start = prev;
        guard += 1;
      }
      let end = lesson.time;
      guard = 0;
      while (guard < 24) {
        const next = nextTime(end);
        if (!next || toMin(next) >= gridEndMin()) break;
        if (!slotLessons(lesson.day, next).some(same)) break;
        end = next;
        guard += 1;
      }
      const times = [];
      let cur = start;
      while (toMin(cur) <= toMin(end)) {
        times.push(cur);
        cur = nextTime(cur);
      }
      return times;
    }

    function pairFor(lesson) {
      if (!lesson) return null;
      const runTimes = mergeRunTimes(lesson);
      if (runTimes.length < 2) return null;
      const index = runTimes.indexOf(lesson.time);
      if (index < 0) return null;
      /* 超过 4 节按开课先后每 4 节自然切段，仅聚合所在分段 */
      const chunkStart = Math.floor(index / 4) * 4;
      const chunk = runTimes.slice(chunkStart, chunkStart + 4);
      if (chunk.length < 2) return null;
      if (lesson.kind === 'group') {
        return chunk.map((time) => {
          const found = slotLessons(lesson.day, time).find((item) => item.kind === 'group' && item.classId === lesson.classId && item.teacher === lesson.teacher);
          return found || Object.assign({}, lesson, { time });
        });
      }
      return chunk.map((time) => {
        const found = slotLessons(lesson.day, time).find((item) => item.student === lesson.student
          && item.teacher === lesson.teacher
          && ['fixed', 'temp', 'sub'].includes(item.kind));
        return found || Object.assign({}, lesson, { time });
      });
    }

    function mergeRunLabel(lesson) {
      const runTimes = mergeRunTimes(lesson);
      if (runTimes.length <= 4) return '';
      const index = runTimes.indexOf(lesson.time);
      const chunk = Math.floor(index / 4) + 1;
      const total = Math.ceil(runTimes.length / 4);
      return `当日连续 ${runTimes.length} 节，已按每 4 节自然切段；当前为第 ${chunk}/${total} 段`;
    }

    function leaveCellsNow() {

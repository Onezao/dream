    function parseSlotsParam(raw) {
      if (!raw) return [];
      let decoded = raw;
      try {
        decoded = decodeURIComponent(raw);
      } catch (err) {
        decoded = raw;
      }
      return decoded
        .split(',')
        .map((item) => item.trim())
        .filter(Boolean)
        .map((item) => {
          const match = item.match(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun):(\d{1,2}):(\d{2})$/i);
          if (!match) return null;
          const dayName = `${match[1].charAt(0).toUpperCase()}${match[1].slice(1).toLowerCase()}`;
          const hours = Number(match[2]);
          const minutes = Number(match[3]);
          if (DAY_PARAM[dayName] === undefined || hours > 23 || minutes > 59) return null;
          return { day: DAY_PARAM[dayName], time: `${pad2(hours)}:${match[3]}` };
        })
        .filter(Boolean);
    }

            if (!teacherOpen(teacherKey, day, time)) {

              break;
            }
            if (!teacherFreeAt(teacherKey, day, time)) {
              reason = `${time} 已有课`;
              break;
            }
          }
        }
        return {
          key: teacherKey,
          name: teacher.name,
          short: teacher.short,
          initial: teacher.initial,
          priceTier: teacher.priceTier,
          tierLabel: teacher.tierLabel,
          tierAvail: studentTempTierCredits(studentKey, teacher.priceTier),
          load: teacher.load,
          taught: taughtStudent(teacherKey, studentKey),
          available: !reason,
          reason
        };
      }).sort(freeTeacherSort);
    }

    function getSlot(day, time) {
      const key = slotKey(state.week, day, time);
      const parentView = state.role === 'parent' && !state.weekStudent;
      const preview = state.bookedPreview[key];
      if (preview === 'fixed') {
        return { kind: 'fixed', lesson: { day, time, teacher: 'david', student: 'alice', kind: 'fixed' }, key };
      }
      if (preview === 'group' && !parentView) {
        return { kind: 'group', lesson: { day, time, teacher: 'david', student: 'alice', kind: 'group', classId: 'ket1', dur: 2 }, key };
      }
      const override = overrides[key];
      if (override && override.forced) {
        if (isHallParent() && override.forced !== 'available') return { kind: 'rest', lesson: null, key, hall: 'leave' };
        return { kind: override.forced, lesson: null, key };
      }
      const lessons = slotLessons(day, time);

      if (isHallParent()) {
        const targetKey = state.teacher;
        const ownLessons = lessons.filter((item) => item.student === state.child && item.kind !== 'group');
        const ownTarget = ownLessons.find((item) => item.teacher === targetKey) || null;
        if (ownTarget) return { kind: ownTarget.kind, lesson: ownTarget, key, hall: 'own' };
        if (ownLessons.some((item) => item.teacher !== targetKey)) {
          return { kind: 'blocked', lesson: null, key, hall: 'masked' };
        }
        if (boundGroupAt(day, time, state.child, true)) {
          return { kind: 'clash', lesson: null, key, hall: 'group-clash' };
        }
        if (!inParentBookWindow(day)) return { kind: 'rest', lesson: null, key, hall: 'out-window' };
        if (override && override.forced === 'leave') return { kind: 'rest', lesson: null, key, hall: 'leave' };
        const targetBusy = lessons.some((item) => item.teacher === targetKey || item.actual === targetKey);
        if (targetBusy) return { kind: 'rest', lesson: null, key, hall: 'busy' };
        if (teacherOpen(targetKey, day, time)) return { kind: 'available', lesson: null, key, hall: 'open' };
        return { kind: 'rest', lesson: null, key, hall: 'closed' };
      }

      const studentViewKey = state.weekStudent || (state.role === 'parent' ? state.child : null);
      if (studentViewKey && !state.reschedule) {
        /* 1v1 绝对优先：与已绑定小班任意重叠时整节小班退让，仅显 1v1 */
        const own1v1 = lessons.find((item) => item.student === studentViewKey && item.kind !== 'group') || null;
        if (own1v1) return { kind: own1v1.kind, lesson: own1v1, key };
        const group = boundGroupAt(day, time, studentViewKey);
        if (group) {
          if (groupOverlapsOwn1v1(group)) {
            /* 视觉隐藏 ≠ 时段释放：未被 1v1 覆盖的半格仍按小班真实占用渲染 */
            return { kind: 'blockedGroup', lesson: null, key, group };
          }
          if (group.time === time) return { kind: 'group', lesson: group, key };
          return { kind: 'rest', lesson: null, key };
        }
        const heldGroup = boundGroupAt(day, time, studentViewKey, true);
        if (heldGroup && heldGroup.hold) return { kind: 'blockedGroup', lesson: null, key, group: heldGroup };
        if (!parentView) return { kind: 'rest', lesson: null, key };
        /* 未来 1~7 天窗口内，孩子本人无课/无请假/未占小班格的任意格均可约 */
        if (!inParentBookWindow(day)) return { kind: 'rest', lesson: null, key };
        return { kind: 'available', lesson: null, key };
      }

      let lesson = null;
      if (studentViewKey) {
        lesson = lessons.find((item) => item.student === studentViewKey) || null;
      } else {
        lesson = lessons.find((item) => item.teacher === state.teacher) || null;
      }
      if (lesson) return { kind: lesson.kind, lesson, key };

      const viewTeacher = state.reschedule ? state.reschedule.teacher : state.teacher;
      const busy = lessons.some((item) => item.teacher === viewTeacher);
      if (!busy && teacherOpen(viewTeacher, day, time)) return { kind: 'available', lesson: null, key };
      return { kind: 'rest', lesson: null, key };
    }

    function groupSpanTimes(lesson) {
      const count = Math.max(1, Number(lesson.dur || 2));
      return Array.from({ length: count }, (_, index) => fmtMinutes(toMin(lesson.time) + index * 30));
    }

    function boundGroupAt(day, time, studentKey, includeHold = false) {
      const eligible = (item) => item.kind === 'group'
        && item.student === studentKey
        && (includeHold || !item.hold);
      const direct = slotLessons(day, time).find(eligible) || null;
      if (direct) return direct;
      const prev = prevTime(time);
      if (!prev) return null;
      return slotLessons(day, prev).find((item) => eligible(item) && (item.dur || 2) > 1) || null;
    }

    function groupOverlapsOwn1v1(lesson) {
      if (!lesson) return false;
      return groupSpanTimes(lesson).some((time) => slotLessons(lesson.day, time).some((item) => item.student === lesson.student
        && ['fixed', 'temp', 'sub', 'hold'].includes(item.kind)));
    }

    function visibleGroup(day, time) {
      /* 家长端仅投影已绑定小班；单师可约视图（fromHall）保持纯脱敏不可见 */
      if (isHallParent()) return null;
      const key = slotKey(state.week, day, time);
      if (state.bookedPreview[key] === 'group') {
        return { day, time, teacher: 'david', student: 'alice', kind: 'group', classId: 'ket1', dur: 2 };
      }
      const studentViewKey = state.weekStudent || (state.role === 'parent' ? state.child : null);
      if (studentViewKey) {
        const group = boundGroupAt(day, time, studentViewKey);
        if (!group || groupOverlapsOwn1v1(group)) return null;
        return group.time === time ? group : null;
      }
      return slotLessons(day, time).find((item) => item.kind === 'group' && item.teacher === state.teacher) || null;
    }

    function isGroupContinuation(day, time) {
      const prev = prevTime(time);
      if (!prev) return false;
      return !!visibleGroup(day, prev);
    }

    function countStudentLessons(child) {
      let count = 0;
      DAY_LABELS.forEach((_, day) => {
        STUDENT_GRID_TIMES.forEach((time) => {
          if (isGroupContinuation(day, time)) return;
          const lessons = slotLessons(day, time);
          const own = lessons.find((item) => item.student === child);
          const preview = state.bookedPreview[slotKey(state.week, day, time)];
          if (preview) {
            if (child === 'alice' && (!own || own.kind === 'leave' || own.kind === 'rest')) count += 1;
            return;
          }
          if (!own) return;
          if (own.kind === 'leave' || own.kind === 'rest') return;
          count += 1;
        });
      });
      return count;
    }

    function activeTeacher() { return TEACHERS[state.teacher]; }
    function isStaff() { return state.role !== 'parent'; }
    function canSwitchTeacher() { return state.role === 'monitor' || state.role === 'admin'; }
    function isHallParent() { return !!state.fromHall && state.role === 'parent' && !state.weekStudent; }
    function isOwnTeacher(teacherKey) {
      const key = teacherKey || state.teacher;
      if (state.role === 'admin') return true;
      if (state.role === 'monitor') return teacherOwner(key) === 'leo';
      return true;
    }
    function lessonOwnerName(lesson) { return ownerName(teacherOwner(lesson ? lesson.teacher : state.teacher)); }
    function isCrossGroupLesson(lesson) {
      if (state.role !== 'monitor' || !lesson) return false;
      if (lesson.kind === 'group') return !isOwnClass(lesson.classId);
      return !isOwnTeacher(lesson.teacher);
    }
    function isCrossReadonlyLesson(lesson) {
      return isCrossGroupLesson(lesson) && Number(state.hours) >= 3;
    }
    function isCrossRescueLesson(lesson) {
      return isCrossGroupLesson(lesson) && Number(state.hours) < 3;
    }
    function teacherWriteLocked(teacher = activeTeacher()) {
      const st = teacher && teacher.teacherStatus;
      if (st === 'unbound') return { locked: true, reason: '该老师待绑定登录账号，暂不可排课' };
      if (st === 'resigned') return { locked: true, reason: '该老师已离职，仅支持只读回看历史周课次，禁止新增排课' };
      if (st === 'banned') return { locked: true, reason: '该老师账号已封禁，暂停新增排课' };
      return { locked: false, reason: '' };
    }
    function hasLessonStarted(lesson = state.lesson) {
      if (state.lessonSettled) return true;
      if (Number(state.hours) <= 0) return true;
      if (state.view === 'day' && state.dayCell) {
        if (Number(state.dayCell.dayKey) === -1) return true;
        if (Number(state.dayCell.dayKey) === 0 && toMin(state.dayCell.time) <= DAY_NOW_MIN) return true;
      }
      if (lesson && lesson.started) return true;
      return false;
    }
    function isFinanceFrozen() {
      return !!state.exBackfillFrozen;
    }

    /* ------------------------------------------------------------------
     * 代课匹配、换学员检索与排课复选态工具
     * ------------------------------------------------------------------ */
    function tierRank(priceTier) {
      const idx = PRICE_TIERS.indexOf(Number(priceTier));
      return idx >= 0 ? idx : 1;
    }
    function tierDiffLabel(fromTier, toTier) {
      const diff = tierRank(toTier) - tierRank(fromTier);
      if (diff === 0) return '同价位';
      if (diff === 1) return '高一档';
      if (diff === -1) return '低一档';
      return diff > 0 ? `高${diff}档` : `低${-diff}档`;
    }
    function taughtStudent(teacherKey, studentKey) {
      const history = TAUGHT_HISTORY[teacherKey];
      return !!history && !!studentKey && history.students.includes(studentKey);
    }
    function taughtClass(teacherKey, classKey) {
      const history = TAUGHT_HISTORY[teacherKey];
      return !!history && !!classKey && history.classes.includes(classKey);
    }
    function subRank(teacherKey, studentKey, refTeacherKey, isGroup, classKey) {
      const teacher = TEACHERS[teacherKey] || TEACHERS.david;
      const refTeacher = TEACHERS[refTeacherKey] || TEACHERS.david;
      return {
        key: teacherKey,
        name: teacher.name,
        initial: teacher.initial,
        priceTier: teacher.priceTier,
        tierLabel: teacher.tierLabel || `${teacher.priceTier}积分`,
        load: teacher.load,
        taught: isGroup ? taughtClass(teacherKey, classKey) : taughtStudent(teacherKey, studentKey),
        tierText: tierDiffLabel(refTeacher.priceTier, teacher.priceTier),
        tierDiff: Math.abs(tierRank(teacher.priceTier) - tierRank(refTeacher.priceTier)),
        tierJump: tierRank(teacher.priceTier) - tierRank(refTeacher.priceTier)
      };
    }
    function subSort(a, b) {
      if (a.available !== b.available) return a.available ? -1 : 1;
      if (a.taught !== b.taught) return a.taught ? -1 : 1;
      if (a.tierDiff !== b.tierDiff) return a.tierDiff - b.tierDiff;
      return a.load - b.load;
    }
    function subFirstAvailable(candidates) {
      const found = candidates.find((item) => item.available);
      return found ? found.key : '';
    }
    function scopeTimes(cells) {
      const list = [];
      (cells || []).forEach((cell) => {
        const count = cell.kind === 'group' ? (cell.dur || 2) : 1;
        for (let index = 0; index < count; index += 1) {
          list.push({ day: cell.day, time: fmtMinutes(toMin(cell.time) + index * 30) });
        }
      });
      return list;
    }
    function subConflictFor(teacherKey, cells) {
      const points = scopeTimes(cells);
      for (let index = 0; index < points.length; index += 1) {
        const point = points[index];
        if (toMin(point.time) >= GRID_END) return `${dayLabel(point.day)} ${point.time} 超出可约时段`;
        const busy = slotLessons(point.day, point.time).some((item) => (item.teacher === teacherKey || item.actual === teacherKey)
          && item.kind !== 'leave'
          && item.kind !== 'rest');
        if (busy) return `${dayLabel(point.day)} ${point.time} 已排课`;
        const prevM = toMin(point.time) - 30;
        if (prevM >= STUDENT_GRID_START) {
          const prevBusy = slotLessons(point.day, fmtMinutes(prevM)).some((item) => item.kind === 'group'
            && (item.dur || 2) > 1
            && (item.teacher === teacherKey || item.actual === teacherKey));
          if (prevBusy) return `${dayLabel(point.day)} ${point.time} 已被小班连占`;
        }
        if (!teacherTemplateOpen(teacherKey, point.day, point.time)) return `${dayLabel(point.day)} ${point.time} 未开放`;
      }
      return '';
    }
    function buildSubCandidates(options) {
      const opts = options || {};
      const exclude = opts.exclude || [];
      const search = String(opts.search || '').trim().toLowerCase();
      return Object.keys(TEACHERS)
        .filter((key) => !exclude.includes(key))
        .map((key) => {
          const rank = subRank(key, opts.studentKey, opts.refTeacherKey, !!opts.isGroup, opts.classKey);
          const conflict = subConflictFor(key, opts.scope || []);
          return Object.assign({}, rank, { available: !conflict, reason: conflict || '' });
        })
        .filter((item) => !search || item.name.toLowerCase().includes(search))
        .sort(subSort);
    }
    function studentHasLessonAt(studentKey, day, time) {
      const own = slotLessons(day, time).some((item) => item.student === studentKey
        && item.kind !== 'leave'
        && item.kind !== 'rest');
      if (own) return true;
      const prev = prevTime(time);
      if (!prev) return false;
      return slotLessons(day, prev).some((item) => item.student === studentKey
        && item.kind === 'group'
        && (item.dur || 2) > 1);
    }
    function daySearchConflictHint(dayKey) {
      if (!state.dayCompare || !state.dayIncident) return '';
      const query = state.daySearch.trim().toLowerCase();
      if (!query) return '';
      const incident = dayTeacherItem(dayKey, state.dayIncident.key, state.dayIncident.time);
      if (!incident) return '';
      const incidentTimes = [];
      const dur = incident.type === 'group' ? (incident.dur || 2) : 1;
      for (let index = 0; index < dur; index += 1) incidentTimes.push(fmtMinutes(toMin(state.dayIncident.time) + index * 30));
      const matched = DAY_TEACHER_ORDER.filter((key) => key !== incident.teacher
        && `${teacherName(key)} ${teacherShort(key)}`.toLowerCase().includes(query));
      for (let index = 0; index < matched.length; index += 1) {
        const key = matched[index];
        if (incidentTimes.every((point) => dayFreeAt(dayKey, key, point))) continue;
        const busy = dayTeacherItem(dayKey, key, state.dayIncident.time);
        return busy
          ? `${teacherShort(key)} ${dayWeekday(dayKey)} ${state.dayIncident.time} 已排课`
          : `${teacherShort(key)} ${dayWeekday(dayKey)} ${state.dayIncident.time} 未开放`;
      }
      return '';
    }

    /* 排课复选态：对象与课次汇总 */
    function scheduleObjectInfo() {
      if (state.scheduleClass && CLASSES[state.scheduleClass]) {
        const cls = CLASSES[state.scheduleClass];
        const credits = state.selectCredits[state.scheduleClass] != null ? state.selectCredits[state.scheduleClass] : cls.credits;
        return { kind: 'class', key: cls.key, label: cls.code, title: cls.name, credits, detail: `小班课次余 ${credits} 节` };
      }
      if (state.scheduleStudent && STUDENTS[state.scheduleStudent]) {
        const student = STUDENTS[state.scheduleStudent];
        const credits = state.selectCredits[state.scheduleStudent] != null ? state.selectCredits[state.scheduleStudent] : student.fixedCredits;
        return { kind: 'student', key: student.key, label: student.name, title: `${student.name} · ${student.status}`, credits, detail: `待排余 ${credits} 节` };
      }
      return null;
    }
    function scheduleTemplateList() {
      return Object.keys(state.scheduleSel).map((key) => state.scheduleSel[key]);
    }
    function scheduleSingleMode() { return state.scheduleMode !== 'batch'; }
    function scheduleBatchLocked() {
      return state.role === 'monitor' && !isOwnTeacher(state.teacher) && !state.scheduleClass;
    }
    function scheduleModeForObject(object) {
      if (object && object.kind === 'class') {
        return Number(object.credits || 0) >= 4 ? 'batch' : 'single';
      }
      return 'single';
    }
    function setScheduleMode(mode) {
      const next = mode === 'batch' ? 'batch' : 'single';
      if (next === 'batch' && scheduleBatchLocked()) {
        showToast('仅该老师所属负责班长或管理员可排 1v1 固定位');
        return;
      }
      if (next === state.scheduleMode) return;
      state.scheduleMode = next;
      if (next === 'batch') {
        state.week = 0;
      } else {
        state.scheduleSel = {};
        resetScheduleWeeks();
      }
      render(true);
      showToast(next === 'batch' ? '已切换为连续 4 周批量，第 1 周为模板周' : '已切换为仅排单周 / 临时课，不再自动复制四周');
    }
    function renderScheduleModeToggle() {
      const single = scheduleSingleMode();
      const locked = scheduleBatchLocked();
      return `<div class="mt-1.5" data-role="schedule-mode-toggle">
        <div class="grid grid-cols-2 gap-1.5">
          <button data-action="schedule-mode" data-mode="single" class="flex h-10 items-center justify-center gap-1 rounded-xl border px-1 text-[12px] font-bold transition ${single ? 'border-slate-900 bg-slate-900 text-white shadow-sm ring-2 ring-slate-900' : 'border-slate-300 bg-white text-slate-800 hover:bg-slate-50'}">🗓️ 仅排单周 / 临时课</button>
          <button data-action="schedule-mode" data-mode="batch" ${locked ? 'disabled' : ''} class="flex h-10 items-center justify-center gap-1 rounded-xl border px-1 text-[12px] font-bold transition ${!single ? 'border-indigo-600 bg-indigo-600 text-white shadow-sm ring-2 ring-indigo-600' : locked ? 'cursor-not-allowed border-slate-200 bg-slate-100 text-slate-500' : 'border-slate-300 bg-white text-slate-800 hover:bg-slate-50'}">🔁 连续 4 周批量</button>
        </div>
        ${locked ? '<p class="mt-1 rounded-lg border border-amber-300 bg-amber-50 px-2 py-1 text-[12px] font-semibold leading-relaxed text-amber-900">仅该老师所属负责班长或管理员可排 1v1 固定位</p>' : ''}
      </div>`;
    }
    function scheduleSelectedList() { return scheduleTemplateList(); }
    function scheduleSlotKey(day, time) { return `${day}|${time}`; }
    function scheduleWeekMap(week) {
      if (scheduleSingleMode()) return week === state.week ? state.scheduleSel : {};
      return week === 0 ? state.scheduleSel : (state.scheduleWeekSel[week - 1] || {});
    }
    function scheduleWeekCount(week) { return Object.keys(scheduleWeekMap(week)).length; }
    function scheduleTotalCount() {
      let total = 0;
      for (let week = 0; week < 4; week += 1) total += scheduleWeekCount(week);
      return total;
    }
    function scheduleRetainedCount() {
      if (scheduleSingleMode()) return 0;
      let retained = 0;
      scheduleTemplateList().forEach((slot) => {
        const key = scheduleSlotKey(slot.day, slot.time);
        for (let week = 1; week < 4; week += 1) {
          if (!scheduleWeekMap(week)[key]) retained += 1;
        }
      });
      return retained;
    }
    function scheduleUnitLabel() { return state.scheduleClass ? '组双格' : '格'; }
    function scheduleWeekMeta(week) {
      if (scheduleSingleMode()) {
        return week === state.week
          ? { label: '仅单周', text: 'text-indigo-700', badge: 'bg-indigo-50 text-indigo-700', dot: 'bg-indigo-500' }
          : { label: '—', text: 'text-slate-500', badge: 'bg-slate-100 text-slate-500', dot: 'bg-slate-300' };
      }
      if (week === 0) {
        return { label: '模板周', text: 'text-indigo-700', badge: 'bg-indigo-50 text-indigo-700', dot: 'bg-indigo-500' };
      }
      const status = state.scheduleWeekStatus[week] || 'follow';
      if (status === 'adjusted') {
        return { label: '已调整', text: 'text-amber-700', badge: 'bg-amber-50 text-amber-800', dot: 'bg-amber-500' };
      }
      if (status === 'conflict') {
        return { label: '冲突待补', text: 'text-rose-700', badge: 'bg-rose-50 text-rose-700', dot: 'bg-rose-500' };
      }
      return { label: '跟随模板', text: 'text-emerald-700', badge: 'bg-emerald-50 text-emerald-700', dot: 'bg-emerald-500' };
    }
    function resetScheduleWeeks() {
      state.scheduleWeekSel = [{}, {}, {}];
      state.scheduleWeekStatus = ['template', 'follow', 'follow', 'follow'];
      state.scheduleWeekConflict = [{}, {}, {}];
    }
    function scheduleWeekBusy(weekIndex, day, time) {
      const key = slotKey(weekIndex, day, time);
      if (state.bookedPreview[key]) return true;
      const override = overrides[key];
      if (override) return override.forced ? override.forced !== 'available' : true;
      return baseLessons(day, time, weekIndex).some((item) => item.teacher === state.teacher
        && item.kind !== 'leave'
        && item.kind !== 'rest');
    }
    function scheduleConfigConflict(weekIndex, day, time) {
      return (SCHEDULE_CONFLICTS[state.teacher] || []).find((item) => item.day === day
        && item.time === time
        && item.weeks.includes(weekIndex)) || null;
    }
    function scheduleWeekConflictNote(weekIndex, day, time, count = 1) {
      for (let index = 0; index < count; index += 1) {
        const point = fmtMinutes(toMin(time) + index * 30);
        if (toMin(point) >= GRID_END) return '超出可约时段';
        if (scheduleWeekBusy(weekIndex, day, point)) return '已有排课';
        if (!teacherOpen(state.teacher, day, point)) return '老师未开放该时段';
      }
      for (let index = 0; index < count; index += 1) {
        const point = fmtMinutes(toMin(time) + index * 30);
        if (toMin(point) >= GRID_END) break;
        const config = scheduleConfigConflict(weekIndex, day, point);
        if (config) return config.note;
      }
      return '';
    }
    function scheduleConflictWeeks(day, time, count = 1) {
      const conflicts = [];
      for (let week = 0; week < 4; week += 1) {
        const note = scheduleWeekConflictNote(week, day, time, count);
        if (note) conflicts.push({ week, note });
      }
      return conflicts;
    }
    function scheduleDeriveWeek(weekIndex) {
      if (weekIndex < 1) return;
      if (scheduleSingleMode()) return;
      const map = {};
      const notes = {};
      scheduleTemplateList().forEach((slot) => {
        const key = scheduleSlotKey(slot.day, slot.time);
        const note = scheduleWeekConflictNote(weekIndex, slot.day, slot.time, slot.pair ? 2 : 1);
        if (note) notes[key] = note;
        else map[key] = Object.assign({}, slot);
      });
      state.scheduleWeekSel[weekIndex - 1] = map;
      state.scheduleWeekConflict[weekIndex - 1] = notes;
      state.scheduleWeekStatus[weekIndex] = Object.keys(notes).length ? 'conflict' : 'follow';
    }
    function scheduleSyncDerivedWeeks() {
      if (scheduleSingleMode()) return;
      for (let week = 1; week < 4; week += 1) {
        if (state.scheduleWeekStatus[week] === 'adjusted') continue;
        scheduleDeriveWeek(week);
      }
    }
    function schedulePairRenderable(day, time) {
      if (!state.scheduleClass) return false;
      if (toMin(time) % 60 !== 0) return false;
      const next = nextTime(time);
      if (!next || toMin(next) >= GRID_END) return false;
      return getSlot(day, time).kind === 'available' && getSlot(day, next).kind === 'available';
    }
    function scheduleGroupSkip(day, time) {
      if (!state.scheduleSelect || !state.scheduleClass) return false;
      if (toMin(time) % 60 !== 30) return false;
      const prev = prevTime(time);
      return !!prev && toMin(prev) % 60 === 0 && schedulePairRenderable(day, prev);
    }
    function toggleScheduleSlot(day, time, isPair) {
      if (!state.scheduleSelect) return;
      const object = scheduleObjectInfo();
      if (!object) {
        showToast('请先选择学员或小班');
        return;
      }
      const week = state.week;
      const key = scheduleSlotKey(day, time);
      if (week === 0) {
        if (state.scheduleSel[key]) {
          delete state.scheduleSel[key];
          scheduleSyncDerivedWeeks();
          render(true);
          return;
        }
        const templateNote = scheduleWeekConflictNote(0, day, time, isPair ? 2 : 1);
        if (templateNote) {
          showToast(`模板周该时段不可选：${templateNote}`);
          return;
        }
        state.scheduleSel[key] = { day, time, pair: !!isPair };
        scheduleSyncDerivedWeeks();
        const attempted = scheduleTotalCount();
        if (attempted > object.credits) {
          delete state.scheduleSel[key];
          scheduleSyncDerivedWeeks();
          render(true);
          showToast(`该价位待排课次不足（需 ${attempted} 节，仅剩 ${object.credits} 节）`);
          return;
        }
        render(true);
        return;
      }

      const note = scheduleWeekConflictNote(week, day, time, isPair ? 2 : 1);
      if (note) {
        showToast(`第${week + 1}周该时段不可选：${note}，已留存待排，可在本周补选其他空闲格`);
        return;
      }
      const map = scheduleWeekMap(week);
      const previous = map[key] || null;
      if (previous) delete map[key];
      else map[key] = { day, time, pair: !!isPair };
      if (scheduleTotalCount() > object.credits) {
        if (previous) map[key] = previous;
        else delete map[key];
        render(true);
        showToast(`该价位待排课次不足（需 ${scheduleTotalCount() + 1} 节，仅剩 ${object.credits} 节）`);
        return;
      }
      state.scheduleWeekStatus[week] = 'adjusted';
      state.scheduleWeekConflict[week - 1] = {};
      render(true);
    }
    function restoreScheduleWeek(week) {
      if (week < 1 || week > 3) return;
      state.scheduleWeekStatus[week] = 'follow';
      scheduleDeriveWeek(week);
      render(true);
      showToast(`第${week + 1}周已恢复跟随第 1 周模板，并重新校验冲突`);
    }
    function clearScheduleUrl() {
      try {
        const params = new URLSearchParams(window.location.search);
        params.delete('mode');
        params.delete('teacherId');
        params.delete('studentId');
        params.delete('classId');
        const query = params.toString();
        window.history.replaceState({}, '', `${window.location.pathname}${query ? `?${query}` : ''}`);
      } catch (err) {
        /* 忽略地址栏不可写场景 */
      }
    }
    function exitScheduleSelect(showMessage = true) {
      state.scheduleSelect = false;
      state.scheduleMode = 'single';
      state.scheduleStudent = null;
      state.scheduleClass = null;
      state.scheduleSel = {};
      resetScheduleWeeks();
      state.renewalEdit = false;
      state.renewalOrderId = '';
      state.renewalReturn = '';
      state.renewalSaved = false;
      state.drawer = null;
      state.panel = null;
      clearScheduleUrl();
      render(true);
      if (showMessage) showToast('已退出排课复选态，恢复普通周课表');
    }
    function scheduleRenewalConflictCount() {
      let count = 0;
      for (let week = 1; week < 4; week += 1) {
        count += Object.keys(state.scheduleWeekConflict[week - 1] || {}).length;
      }
      return count;
    }
    function saveRenewalDraft(object, total) {
      const teacher = activeTeacher();
      const weeks = [0, 1, 2, 3].map((week) => ({
        week: week + 1,
        status: state.scheduleWeekStatus[week],
        slots: Object.keys(scheduleWeekMap(week)).map((key) => {
          const slot = scheduleWeekMap(week)[key];
          return {
            day: slot.day,
            time: slot.time,
            endTime: endTime(slot.time, slot.pair ? 2 : 1),
            pair: !!slot.pair
          };
        })
      }));
      const payload = {
        orderId: state.renewalOrderId,
        studentId: object.kind === 'student' ? STUDENTS[object.key].id : null,
        studentName: object.label,
        teacherId: teacher.id,
        teacherName: teacher.name,
        priceTier: teacher.priceTier,
        weeks,
        selectedCount: total,
        conflictCount: scheduleRenewalConflictCount(),
        savedAt: new Date().toISOString()
      };
      let saved = false;
      try {
        window.localStorage.setItem(`dream_renewal_draft_${state.renewalOrderId || 'UNSPECIFIED'}`, JSON.stringify(payload));
        saved = true;
      } catch (err) {
        saved = false;
      }
      state.renewalSaved = saved;
      showToast(saved ? '已带回续费购课单，原预占未变更' : '草稿已生成，但当前环境不可写入本地缓存');
    }
    function confirmScheduleSelect() {
      if (!requireOnline()) return;
      const object = scheduleObjectInfo();
      const total = scheduleTotalCount();
      if (!object) {
        showToast('请先选择学员或小班');
        return;
      }
      if (!total) {
        showToast(scheduleSingleMode() ? '请至少在当前周选择 1 个可排时段' : '请至少在第 1 周模板选择 1 个可排时段');
        return;
      }
      if (total > object.credits) {
        showToast(`待排课次不足（需 ${total} 节，仅剩 ${object.credits} 节）`);
        return;
      }
      if (state.renewalEdit) {
        saveRenewalDraft(object, total);
        return;
      }
      const single = scheduleSingleMode();
      const bookWeeks = single ? [state.week] : [0, 1, 2, 3];
      const firstSelectedWeek = [0, 1, 2, 3].find((week) => scheduleWeekCount(week) > 0);
      const flashWeek = scheduleWeekCount(state.week) ? state.week : firstSelectedWeek;
      const flashKeys = [];
      bookWeeks.forEach((week) => {
        const map = scheduleWeekMap(week);
        Object.keys(map).forEach((key) => {
          const slot = map[key];
          state.bookedPreview[slotKey(week, slot.day, slot.time)] = slot.pair ? 'group' : 'fixed';
          if (slot.pair) {
            const next = nextTime(slot.time);
            if (next && toMin(next) < GRID_END) state.bookedPreview[slotKey(week, slot.day, next)] = 'group';
          }
          if (week === flashWeek) {
            flashKeys.push(slotKey(week, slot.day, slot.time));
            if (slot.pair) {
              const next = nextTime(slot.time);
              if (next && toMin(next) < GRID_END) flashKeys.push(slotKey(week, slot.day, next));
            }
          }
        });
      });
      const retained = scheduleRetainedCount();
      state.selectCredits[object.key] = object.credits - total;
      state.scheduleSelect = false;
      state.scheduleMode = 'single';
      state.scheduleStudent = null;
      state.scheduleClass = null;
      state.scheduleSel = {};
      resetScheduleWeeks();
      state.week = flashWeek;
      state.drawer = null;
      state.panel = null;
      state.flash = true;
      state.flashKeys = flashKeys;
      state.toast = single
        ? `已锁定单周 · 实扣 ${total} 节`
        : (retained > 0
          ? `已锁定可用周 · 实扣 ${total} 节 · ${retained} 节留存待排池`
          : `已锁定 4 周 · 实扣 ${total} 节`);
      clearScheduleUrl();
      render(true);
      armFlashTimers();
    }
    function changeStudentCandidates(query = state.changeSearch) {
      const keyword = String(query || '').trim().toLowerCase();
      return Object.keys(STUDENTS)
        .filter((key) => !state.lesson || key !== state.lesson.student)
        .map((key) => STUDENTS[key])
        .filter((student) => !keyword || student.name.toLowerCase().includes(keyword));
    }

    /* ------------------------------------------------------------------
     * 页面骨架
     * ------------------------------------------------------------------ */
    function render(preserveScroll = true) {
      document.title = state.role === 'teacher' ? 'Dream · 课表' : 'Dream · 自家课表';
      const previous = document.getElementById('content');
      const previousTop = previous ? previous.scrollTop : 0;
      document.body.className = state.embed
        ? 'h-screen overflow-hidden bg-white font-sans text-slate-800 antialiased'
        : 'min-h-screen bg-slate-100 font-sans text-slate-800 antialiased';
      document.getElementById('app').className = state.embed ? 'h-full' : '';
      document.getElementById('app').innerHTML = `${state.embed ? '' : renderConsole()}${renderFrame()}`;
      const next = document.getElementById('content');
      if (next) {
        if (preserveScroll) {
          next.scrollTop = previousTop;
        } else if (state.view === 'day' && Number(state.dayKey) === 0) {
          const anchor = next.querySelector('[data-day-slot="13:30"]');
          if (anchor) anchor.scrollIntoView({ block: 'start' });
          else next.scrollTop = 0;
        } else {
          next.scrollTop = 0;
        }
      }
      if (window.lucide) window.lucide.createIcons();
    }

    function renderFrame() {
      if (state.embed) {
        return `<main class="h-full w-full overflow-hidden">
          <div id="frame" class="relative flex h-full w-full flex-col overflow-hidden bg-white">
            ${!state.online ? renderOfflineStrip() : ''}
            ${renderContent()}
            ${renderDrawer()}
            ${renderModal()}
            ${state.toast ? renderToast() : ''}
          </div>
        </main>`;
      }
      const size = state.device === 'tablet' ? 'h-[860px] w-full max-w-[768px]' : 'h-[812px] w-[390px]';
      return `<main class="flex justify-center px-0 py-6 sm:px-4">
        <div id="frame" class="relative flex ${size} shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300">
          ${renderBanner()}
          ${!state.online ? renderOfflineStrip() : ''}
          ${renderContent()}
          ${renderNav()}
          ${renderDrawer()}
          ${renderModal()}
          ${state.toast ? renderToast() : ''}
        </div>
      </main>`;
    }

    function roleMeta() {
      if (state.role === 'teacher') return { banner: 'from-slate-800 via-emerald-900 to-slate-700' };
      if (state.role === 'monitor') return { banner: 'from-slate-900 via-fuchsia-950 to-slate-800' };
      if (state.role === 'admin') return { banner: 'from-slate-900 via-violet-950 to-slate-800' };
      return { banner: 'from-slate-800 via-blue-900 to-slate-700' };
    }

    function renderBanner() {
      const meta = roleMeta();
      let title = state.role === 'teacher' ? '课表' : '自家课表';
      let subtitle = '';
      if (state.fromHall && state.role === 'parent') {
        title = '预约老师';
        subtitle = `${activeTeacher().name} · ${fmtDot(weekStart())} - ${fmtDot(addDays(weekStart(), 6))}`;
      } else if (state.scheduleSelect) {
        title = state.role === 'teacher' ? '课表' : '自家课表';
        const mode = state.renewalEdit ? '续费改单 · 排期草稿' : '排课复选态';
        subtitle = `${mode} · ${activeTeacher().name} · 实选 ${scheduleTotalCount()} 节`;
      } else if (state.view === 'class' && (state.role === 'monitor' || state.role === 'admin')) {
        const cls = classInfo(state.classView);
        title = '[G] 小班专属周课表';
        subtitle = `${cls.code} · ${cls.name} · ${state.classArchived ? '已归档只读' : '跨师聚合'}`;
      } else if (state.view === 'day' && (state.role === 'monitor' || state.role === 'admin')) {
        title = '日调度';
        const abnormal = dayAbnormalTotal(state.dayKey);
        subtitle = `${dayWeekday(state.dayKey)} ${fmtSlash(dayDate(state.dayKey))} · ${abnormal ? `${abnormal} 项待处理` : '暂无异常'}`;
      } else if (state.weekStudent) {
        const stu = STUDENTS[state.weekStudent];
        title = '学员课表';
        subtitle = `${stu.emoji} ${stu.name} · 本周 ${countStudentLessons(stu.key)} 节`;
      } else if (state.role === 'teacher') {
        title = '课表';
        subtitle = `${activeTeacher().name} · 本周 ${activeTeacher().load}/24 节`;
      } else if ((state.role === 'monitor' || state.role === 'admin') && (state.fromM1b || state.teacherView)) {
        const teacher = activeTeacher();
        const ownerDisplay = teacher.ownerLabel || (isOwnTeacher(teacher.key) ? '我直管' : ownerName(teacher.owner));
        const statusTag = teacher.teacherStatus === 'resigned' ? ' · 已离职只读' : teacher.teacherStatus === 'unbound' ? ' · 待绑定账号' : '';
        title = '老师周课表';
        subtitle = `${teacher.name} · ${ownerDisplay} · 本周 ${teacher.load}/${teacher.cap || 24} 节${statusTag}`;
      } else if (state.role === 'monitor' || state.role === 'admin') {
        title = '自家课表';
        subtitle = `${activeTeacher().name} · 本周 ${activeTeacher().load}/24 节`;
      } else {
        const child = STUDENTS[state.child];
        subtitle = `${fmtDot(weekStart())} - ${fmtDot(addDays(weekStart(), 6))} · 本周 ${countStudentLessons(child.key)} 节`;
      }
      const m1bBackParams = new URLSearchParams({
        role: state.role === 'admin' ? 'admin' : 'monitor',
        page: 'teachers'
      });
      if (state.fromTab) m1bBackParams.set('fromTab', state.fromTab);
      if (state.device === 'tablet') m1bBackParams.set('device', 'tablet');
      const m1bBackHref = `m1b_teacher_monitor.html?${m1bBackParams.toString()}`;
      return `<header class="relative flex h-16 shrink-0 items-center gap-2 overflow-hidden bg-gradient-to-br ${meta.banner} px-3 text-white">
        <span class="pointer-events-none absolute -right-7 -top-9 h-24 w-24 rounded-full border border-white/10"></span>
        <span class="pointer-events-none absolute right-16 top-5 h-14 w-14 rounded-full border border-white/10"></span>
        <span class="pointer-events-none absolute -bottom-8 left-20 h-20 w-20 rounded-full bg-white/5"></span>
        ${state.fromHall && state.role === 'parent' ? `<a href="m1b_teacher_parent.html?role=parent&embed=1" class="relative inline-flex h-8 shrink-0 items-center gap-0.5 rounded-lg px-2 -ml-1 text-[13px] font-semibold text-white/90 transition hover:bg-white/10 active:bg-white/15">${icon('chevron-left', 'h-4 w-4')}<span>返回选老师</span></a>` : ''}
        ${(state.fromM1b || state.teacherView) && (state.role === 'monitor' || state.role === 'admin') ? `<a href="${m1bBackHref}" class="relative inline-flex h-8 shrink-0 items-center gap-0.5 rounded-lg px-2 -ml-1 text-[13px] font-semibold text-white/90 transition hover:bg-white/10 active:bg-white/15">${icon('chevron-left', 'h-4 w-4')}<span>返回</span></a>` : ''}
        <div class="relative min-w-0 flex-1">
          <h1 class="truncate text-[18px] font-bold tracking-tight">${esc(title)}</h1>
          <p class="mt-0.5 truncate text-[12px] font-medium text-white/70">${esc(subtitle)}</p>
        </div>
        <button data-action="bell" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知，2 条未读">

        </button>
      </header>`;
    }

    function renderOfflineStrip() {
      return `<div class="flex shrink-0 items-center gap-1.5 border-b border-amber-200 bg-amber-50 px-3 py-1.5 text-[12px] font-semibold text-amber-900">

    function renderContent() {
      if (state.view === 'class' && (state.role === 'monitor' || state.role === 'admin')) return renderClassContent();
      if (state.view === 'day' && (state.role === 'monitor' || state.role === 'admin')) return renderDayContent();

      return `<div class="flex min-h-0 flex-1 flex-col bg-white">

    function loadSegments(load, cap) {
      const filled = Math.round((load / cap) * 12);
      return Array.from({ length: 12 }, (_, index) => `<span class="h-1 flex-1 rounded-full ${index < filled ? 'bg-indigo-500' : 'bg-slate-200'}"></span>`).join('');
    }

    function renderWeekStudentContext() {
      const stu = STUDENTS[state.weekStudent];
      if (!stu) return '';
      return `<div class="mb-1.5 flex items-center justify-between gap-2 rounded-xl border border-indigo-200 bg-indigo-50 px-2.5 py-1.5">
        <span class="flex min-w-0 items-center gap-1">
          <span class="text-[14px] leading-none">${stu.emoji}</span>

      if (state.role === 'parent' || state.weekStudent) return '';

      if (!teacher) return '';
      const bars = [];
      if (teacher.teacherStatus === 'unbound') {
        bars.push(`<div class="mb-1.5 flex items-center gap-2 rounded-xl border border-amber-200 bg-amber-50 px-2.5 py-1.5 text-[12px] font-semibold text-amber-900">${icon('alert-circle', 'h-3.5 w-3.5 shrink-0 text-amber-600')}<span>待绑定登录账号 · 暂不可排课（请先在 M1B 完成账号绑定）</span></div>`);
      } else if (teacher.teacherStatus === 'resigned') {
        bars.push(`<div class="mb-1.5 flex items-center gap-2 rounded-xl border border-slate-300 bg-slate-100 px-2.5 py-1.5 text-[12px] font-semibold text-slate-700">${icon('lock', 'h-3.5 w-3.5 shrink-0 text-slate-500')}<span>已离职老师 · 仅只读回看历史周课次，禁止新增排课</span></div>`);
      } else if (teacher.teacherStatus === 'banned') {
        bars.push(`<div class="mb-1.5 flex items-center gap-2 rounded-xl border border-rose-200 bg-rose-50 px-2.5 py-1.5 text-[12px] font-semibold text-rose-800">${icon('shield-alert', 'h-3.5 w-3.5 shrink-0 text-rose-600')}<span>账号已封禁 · 暂停新增排课</span></div>`);

      }

    function renderStaffHeader() {
      if (state.scheduleSelect) return renderScheduleSelectHeader();
      const teacher = activeTeacher();
      const switchable = canSwitchTeacher();
      const own = isOwnTeacher(state.teacher);
      const roleTag = state.role === 'admin' ? '平台统筹' : (state.role === 'monitor' ? (own ? '我直管' : (teacher.ownerLabel || '跨组老师')) : teacher.level);
      const loadText = state.role === 'teacher' ? `本周 ${teacher.load} 节` : `本周已排 ${teacher.load}/${teacher.cap || 24} 节`;
      const inner = `<span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl border border-slate-200 bg-slate-100 text-[14px] font-bold text-slate-700">${teacher.initial}</span>
        <span class="min-w-0 flex-1">
          <span class="flex items-center gap-1">
            <span class="truncate text-[14px] font-bold text-slate-900">${esc(teacher.name)}</span>
            <span class="shrink-0 rounded bg-slate-100 px-1 py-0.5 text-[12px] font-semibold text-slate-700">${esc(roleTag)}</span>
          </span>
          <span class="mt-1 flex items-center gap-1.5">
            <span class="shrink-0 text-[12px] font-medium text-slate-600">${loadText}</span>
            <span class="flex min-w-0 flex-1 gap-0.5">${loadSegments(teacher.load, teacher.cap)}</span>
          </span>
        </span>
        ${switchable ? icon('chevron-down', 'h-3.5 w-3.5 shrink-0 text-slate-500') : ''}`;

      return `<div class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 px-3 pb-1.5 pt-1.5 backdrop-blur">
        <div class="flex items-start gap-1.5">
          ${switchable
            ? `<button data-action="open-teachers" class="flex h-12 w-full min-w-0 items-center gap-2 rounded-xl border border-slate-300 bg-slate-50/70 px-2.5 text-left transition active:scale-[0.995]">${inner}</button>`
            : `<div class="flex h-12 w-full items-center gap-2 rounded-xl border border-slate-300 bg-slate-50/70 px-2.5">${inner}</div>`}
        </div>
        ${switchable ? renderStaffEntries() : ''}
        ${renderWeekNav()}
      </div>`;
    }

    function renderStaffEntries() {
      const roleParam = state.role === 'admin' ? 'admin' : 'monitor';
      const owned = isOwnTeacher(state.teacher);
      const lock = teacherWriteLocked();
      return `<div class="mt-1.5 grid grid-cols-2 gap-1.5" data-role="staff-entries" data-teacher-owned="${owned ? '1' : '0'}">
        ${lock.locked
          ? `<button type="button" disabled title="${esc(lock.reason)}" class="flex h-8 cursor-not-allowed items-center justify-center gap-1 rounded-lg border border-slate-200 bg-slate-100 text-[12px] font-bold text-slate-500">🔒 暂不可排课</button>`
          : (owned
            ? `<button data-action="open-schedule-select" data-mode="fixed" class="flex h-8 items-center justify-center gap-1 rounded-lg border border-indigo-200 bg-indigo-50 text-[12px] font-bold text-indigo-700 transition active:scale-[0.99]">📅 + 批量固定位排课</button>`
            : `<button data-action="open-schedule-select" data-mode="temp" class="flex h-8 items-center justify-center gap-1 rounded-lg border border-amber-200 bg-amber-50 text-[12px] font-bold text-amber-900 transition active:scale-[0.99]">🗓️ 批量临时约课</button>`)}
        <a href="m3d_scheduling_workbench.html?role=${roleParam}&view=board" class="flex h-8 items-center justify-center gap-1 rounded-lg border border-slate-200 bg-white text-[12px] font-bold text-slate-700 transition hover:bg-slate-50">
          ${icon('search', 'h-3.5 w-3.5')}空闲大盘
        </a>
      </div>`;
    }

    function renderScheduleSelectHeader() {
      const teacher = activeTeacher();
      const object = scheduleObjectInfo();
      return `<div class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 px-3 pb-1.5 pt-1.5 backdrop-blur">
        ${state.renewalEdit ? `<div class="mb-1.5 rounded-lg border border-amber-300 bg-amber-50 px-2 py-1">
          <div class="flex items-center justify-between gap-2">
            <span class="min-w-0 truncate text-[12px] font-bold text-amber-900">续费改单 · 排期草稿</span>
            <span class="shrink-0 font-mono text-[12px] font-semibold text-amber-800">${esc(state.renewalOrderId || '未提供单号')}</span>
          </div>
          <div class="mt-0.5 flex items-center justify-between gap-2">
            <span class="min-w-0 truncate text-[12px] font-medium text-amber-800">学员 ${esc(object ? object.label : '未选择学员')} · 原 HOLD 未变更</span>
            ${state.renewalReturn === 'm2a' ? `<a href="m2a_course_orders.html?draft=1&orderId=${encodeURIComponent(state.renewalOrderId || '')}&role=monitor" class="shrink-0 rounded border border-amber-300 bg-white px-1.5 py-0.5 text-[12px] font-bold text-amber-900">返回购课单修改抽屉</a>` : ''}
          </div>
        </div>` : ''}
        <div class="flex items-center gap-1.5">
          <div class="flex h-10 min-w-0 flex-1 items-center gap-2 rounded-xl border border-indigo-200 bg-indigo-50 px-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-white text-[12px] font-bold text-indigo-700">${teacher.initial}</span>
            <span class="min-w-0 flex-1">
              <span class="block truncate text-[14px] font-bold text-slate-900">${esc(teacher.name)}</span>
              <span class="block truncate text-[12px] font-medium text-slate-600">本周已排 ${teacher.load}/${teacher.cap} 节 · ${scheduleSingleMode() ? '仅排单周 / 临时课' : '连续 4 周批量'}</span>
            </span>
          </div>
          <button data-action="exit-schedule-select" class="flex h-10 shrink-0 items-center gap-1 rounded-lg border border-slate-300 bg-white px-2 text-[12px] font-semibold text-slate-800 transition hover:bg-slate-50">${icon('x', 'h-3.5 w-3.5')}退出复选</button>
        </div>
        <button data-action="open-schedule-object" class="mt-1.5 flex min-h-10 w-full items-center gap-1.5 rounded-xl border px-2 py-1.5 text-left transition ${object ? 'border-indigo-200 bg-white' : 'border-amber-300 bg-amber-50'}">
          <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg ${object ? 'bg-indigo-50 text-indigo-700' : 'bg-amber-100 text-amber-800'}">${icon(object ? (object.kind === 'class' ? 'users' : 'user') : 'user-plus', 'h-4 w-4')}</span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-[12px] font-bold ${object ? 'text-slate-900' : 'text-amber-900'}">${object ? `已选对象：${esc(object.label)}` : '未选择学员或小班'}</span>
            <span class="block truncate text-[12px] font-medium ${object ? 'text-slate-600' : 'text-amber-800'}">${object ? `${esc(object.title)} · ${esc(object.detail)}` : '点击补选对象后才能提交排课'}</span>
          </span>
          <span class="shrink-0 rounded-md bg-indigo-600 px-2 py-1 text-[12px] font-bold text-white">${object ? '更换' : '选择'}</span>
        </button>
        ${renderScheduleModeToggle()}
        ${renderWeekNav()}
      </div>`;
    }

    function renderWeekNav() {
      const start = roundStart();
      return `<div class="mt-2">
        <div class="flex items-center justify-between gap-1">
          <button data-action="prev-round" class="flex h-6 shrink-0 items-center gap-0.5 rounded-lg border border-slate-200 bg-white px-1.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">
            ${icon('chevron-left', 'h-3.5 w-3.5')}上一轮
          </button>
          <div class="min-w-0 text-center">
            <div class="truncate text-[12px] font-bold text-slate-800">本轮：第 ${roundNo(0)}~${roundNo(3)} 周</div>
            <div class="truncate text-[12px] font-medium text-slate-600">${fmtDot(start)} - ${fmtDot(addDays(start, 27))}</div>
          </div>
          <button data-action="next-round" class="flex h-6 shrink-0 items-center gap-0.5 rounded-lg border border-slate-200 bg-white px-1.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">
            下一轮${icon('chevron-right', 'h-3.5 w-3.5')}
          </button>
        </div>
        <div class="mt-1.5 grid grid-cols-4 gap-1.5">
          ${[0, 1, 2, 3].map((index) => {
            const on = index === state.week;
            const weekDate = addDays(start, index * 7);
            const meta = state.scheduleSelect ? scheduleWeekMeta(index) : null;
            return `<button data-action="set-week" data-week="${index}" class="relative ${state.scheduleSelect ? 'h-12' : 'h-9'} rounded-lg border px-1 text-center transition ${on ? 'border-indigo-300 bg-indigo-50 text-indigo-700 ring-1 ring-indigo-100' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">
              <span class="block text-[12px] font-bold leading-tight">第${index + 1}周</span>
              ${state.scheduleSelect
                ? `<span class="mt-0.5 block truncate text-[12px] font-bold leading-tight ${meta.text}">${meta.label}</span>
                   <span class="block font-mono text-[12px] font-medium leading-tight text-slate-500">${fmtSlash(weekDate)}</span>`
                : `<span class="block font-mono text-[12px] font-medium leading-tight">${fmtSlash(weekDate)}</span>
                   <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full ${on ? 'bg-indigo-500' : (index === 2 ? 'bg-amber-500' : 'bg-emerald-500')}"></span>`}
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 7 列网格
     * ------------------------------------------------------------------ */
    function renderGridCard() {
      return `<section id="gridCard" class="overflow-hidden rounded-xl border border-slate-200/80 bg-white" aria-label="周课表">
        <table class="w-full table-fixed border-collapse">
          <colgroup>
            <col class="w-10">
            <col><col><col><col><col><col><col>
          </colgroup>
          <thead>
            <tr class="h-7 bg-slate-50">
              <th class="w-10 p-0 text-center align-middle font-mono text-[12px] font-semibold text-slate-500">时间</th>
              ${DAY_LABELS.map((label, day) => {
                const date = addDays(weekStart(), day);
                return `<th class="border-l border-slate-100 p-0 text-center align-middle">
                  <span class="block text-[12px] font-bold leading-none text-slate-700">${label}</span>
                  <span class="mt-0.5 block font-mono text-[12px] font-medium leading-none text-slate-500">${fmtDot(date)}</span>
                </th>`;
              }).join('')}
            </tr>
          </thead>
          <tbody>
            ${renderGridRows()}
          </tbody>
        </table>
      </section>`;
    }

    function renderGridRows() {
      const times = gridTimes();
      if (!isStudentGrid()) return times.map((time) => renderGridRow(time)).join('');
      const rows = [];
      let runStart = '';
      let runTimes = [];
      const flushRun = () => {
        if (!runStart) return;
        const start = runStart;
        const last = runTimes[runTimes.length - 1];
        const label = `${start} - ${endTime(last)} ${foldPeriodOf(start)}`;
        const open = !!state.foldOpen[start];
        rows.push(renderFoldBar(start, label, open));
        if (open) runTimes.forEach((time) => rows.push(renderGridRow(time)));
        runStart = '';
        runTimes = [];
      };
      times.forEach((time) => {
        const foldable = !!foldPeriodOf(time) && !studentHasActivityAt(time);
        if (foldable) {
          if (!runStart) runStart = time;
          runTimes.push(time);
          return;
        }
        flushRun();
        rows.push(renderGridRow(time));
      });
      flushRun();
      return rows.join('');
    }

    function renderFoldBar(start, label, open) {
      return `<tr class="h-[22px]">
        <td colspan="8" class="p-0">
          <button data-action="toggle-fold" data-start="${esc(start)}" class="flex h-[22px] w-full items-center justify-center gap-1.5 border-y border-slate-200 bg-slate-100 px-2 text-[12px] font-semibold text-slate-600 transition hover:bg-slate-200">
            ${icon('chevrons-up-down', 'h-3.5 w-3.5 shrink-0')}
            <span class="truncate">${esc(label)} ${open ? '(已展开) [点击收起]' : '(已折叠) [点击展开]'}</span>
          </button>
        </td>
      </tr>`;
    }

    function renderGridRow(time) {
      const cells = DAY_LABELS.map((_, day) => {
        if (isGroupContinuation(day, time) || scheduleGroupSkip(day, time)) return '';
        return renderGridCell(day, time);
      }).join('');
      return `<tr class="h-7 border-t border-slate-100">
        <td class="p-0 align-middle">
          <div class="flex h-7 items-center justify-center border-r border-slate-100 bg-white font-mono text-[12px] font-medium text-slate-600">${time}</div>
        </td>
        ${cells}
      </tr>`;
    }

    function cellContent(kind, lesson) {
      const parent = state.role === 'parent' || !!state.weekStudent;
      if (lesson && lesson.pendingSub) {
        return '<span class="block text-center text-[12px] font-bold leading-none">待代</span>';
      }
      if (kind === 'group') {
        if (lesson.outage) {
          return `<span class="flex h-full w-full flex-col items-center justify-center gap-0.5 overflow-hidden leading-none">
            <span class="max-w-full truncate rounded-sm bg-rose-600 px-0.5 text-[12px] font-bold leading-none text-white">[停]</span>
            <span class="max-w-full truncate text-[12px] font-bold leading-none">停电停课</span>
            <span class="max-w-full truncate text-[12px] font-medium leading-none">待补排</span>
          </span>`;
        }
        const cls = classInfo(lesson.classId);
        if (lesson.hold) {
          return `<span class="flex h-full w-full flex-col items-center justify-center gap-0.5 overflow-hidden leading-none">
            <span class="max-w-full truncate rounded-sm border border-dashed border-teal-500 px-0.5 text-[12px] font-bold leading-none text-teal-800">[G-HOLD]</span>
            <span class="max-w-full truncate text-[12px] font-bold leading-none">${esc(cls.code)}</span>
            <span class="max-w-full truncate text-[12px] font-medium leading-none">续费预占</span>
          </span>`;
        }
        const subline = lesson.actual ? `${teacherShort(lesson.actual)} [SUB]` : teacherShort(lesson.teacher);
        return `<span class="flex h-full w-full flex-col items-center justify-center gap-0.5 overflow-hidden leading-none">
          <span class="max-w-full truncate rounded-sm bg-teal-600 px-0.5 text-[12px] font-bold leading-none text-white">[G]</span>
          <span class="max-w-full truncate text-[12px] font-bold leading-none">${esc(cls.code)}</span>
          <span class="max-w-full truncate text-[12px] font-medium leading-none">${esc(subline)}</span>
        </span>`;
      }
      if (kind === 'blockedGroup') {
        return `<span class="flex h-full w-full flex-col items-center justify-center gap-0.5 overflow-hidden leading-none">
          <span class="max-w-full truncate text-[12px] font-bold leading-none">不可约</span>
          <span class="max-w-full truncate text-[12px] font-medium leading-none">小班占</span>
        </span>`;
      }
      if (kind === 'clash') return '<span class="block truncate text-center text-[12px] font-bold leading-none">⚠️ 撞课</span>';
      if (kind === 'sub') {
        const text = parent ? teacherShort(lesson.actual || 'elena') : studentName(lesson.student);
        return stackedCell(text, '[SUB]', 'bg-blue-500');
      }
      if (kind === 'subbing') {
        return stackedCell(studentName(lesson.student), '[代上]', 'bg-purple-600');
      }
      if (kind === 'hold') {
        const text = parent ? teacherShort(lesson.teacher) : studentName(lesson.student);
        return stackedCell(text, '预', 'bg-amber-500');
      }
      if (kind === 'fixed' || kind === 'temp') {
        const text = parent ? teacherShort(lesson.teacher) : studentName(lesson.student);
        return `<span class="block w-full truncate text-center text-[12px] font-bold leading-none">${esc(text)}</span>`;
      }
      if (kind === 'leave') return '<span class="block text-center text-[12px] font-bold leading-none">假</span>';
      if (kind === 'blocked') return '<span class="block text-center text-[12px] font-bold leading-none">不可约</span>';
      if (kind === 'available') return '<span class="block text-center text-[12px] font-bold leading-none">约</span>';
      return '<span class="block text-center text-[12px] font-bold leading-none">休</span>';
    }

    function stackedCell(text, badge, badgeClass) {
      return `<span class="flex h-full w-full flex-col items-center justify-center gap-0.5 overflow-hidden leading-none">
        <span class="max-w-full truncate rounded-sm ${badgeClass} px-0.5 py-px text-[12px] font-bold leading-none text-white">${esc(badge)}</span>
        <span class="max-w-full truncate text-[12px] font-bold leading-none">${esc(text)}</span>
      </span>`;
    }

    function isRescheduleSourceSlot(day, time) {
      const source = state.reschedule;
      return !!source
        && state.roundOffset === source.round
        && state.week === source.week
        && source.day === day
        && source.times.includes(time);
    }

    function studentConflictAt(day, time, studentKey) {
      if (!studentKey || isRescheduleSourceSlot(day, time)) return false;
      const sourceTeacher = state.reschedule ? state.reschedule.teacher : null;
      const otherTeacher = (item) => !sourceTeacher || item.teacher !== sourceTeacher;
      const clash = slotLessons(day, time).some((item) => item.student === studentKey
        && item.kind !== 'leave'
        && item.kind !== 'rest'
        && otherTeacher(item));
      if (clash) return true;
      const prev = prevTime(time);
      if (!prev) return false;
      return slotLessons(day, prev).some((item) => item.student === studentKey
        && item.kind === 'group'
        && (item.dur || 2) > 1
        && otherTeacher(item));
    }

    function rescheduleTargetInfo(day, time) {
      const source = state.reschedule;
      if (!source) return null;
      const isSource = isRescheduleSourceSlot(day, time);
      let inWindow = state.roundOffset === source.round;
      if (inWindow && source.kind === 'temp') {
        const srcDate = dateFor(source.round, source.week, source.day);
        const targetDate = dateFor(state.roundOffset, state.week, day);
        const diff = Math.round((Date.parse(`${targetDate}T00:00:00Z`) - Date.parse(`${srcDate}T00:00:00Z`)) / 86400000);
        inWindow = Math.abs(diff) <= 7;
      }
      const conflict = !isSource && studentConflictAt(day, time, source.student);
      return { isSource, inWindow, conflict };
    }

    function renderGridCell(day, time) {
      if (state.scheduleSelect) return renderScheduleCell(day, time);
      return renderStandardGridCell(day, time);
    }

    function renderStandardGridCell(day, time) {
      const slot = getSlot(day, time);
      const kind = slot.kind;
      const lesson = slot.lesson || {};
      const isGroup = kind === 'group';
      const flash = state.flash && state.flashKeys.includes(slot.key);
      const target = rescheduleTargetInfo(day, time);
      const isSource = !!target && target.isSource;
      const conflict = !!target && target.conflict && kind === 'available';
      const validTarget = !!target && !isSource && target.inWindow && !target.conflict && kind === 'available';
      const blockedTarget = !!target && !isSource && (!target.inWindow || kind !== 'available' || conflict);
      const tokenKind = lesson.pendingSub ? 'pending' : (kind === 'group' && lesson.outage ? 'leave' : kind);
      const cls = `${TOKEN[tokenKind] || TOKEN.rest} ${kind === 'blockedGroup' ? 'border-dashed border-slate-300 bg-slate-100 text-slate-600' : ''} ${flash ? 'ring-2 ring-inset ring-indigo-500 animate-pulse' : ''} ${isSource ? 'border-dashed ring-2 ring-inset ring-indigo-400' : ''} ${validTarget ? 'ring-1 ring-emerald-400 animate-pulse' : ''} ${blockedTarget ? 'opacity-40' : ''}`;
      const baseLabel = kind === 'group'
        ? `${dayLabel(day)} ${time} ${classInfo(lesson.classId).code}${lesson.hold ? ' 续费预占' : ''}${lesson.pendingSub ? ' 待代课' : ''}`
        : kind === 'blockedGroup'
          ? `${dayLabel(day)} ${time} 不可约（小班占）`
          : kind === 'blocked'
            ? `${dayLabel(day)} ${time} 不可约`
            : kind === 'available'
              ? `${dayLabel(day)} ${time} 空闲可约`
              : `${dayLabel(day)} ${time} ${lesson.pendingSub ? TYPE_NAME.pending : (TYPE_NAME[kind] || '')}${isSource ? ' 原时段' : ''}`;
      const label = `${baseLabel}${conflict ? ' 学员该时段已有其他课程' : ''}`;
      const height = isGroup ? 'h-[56px]' : 'h-[26px]';
      return `<td ${isGroup ? 'rowspan="2"' : ''} class="p-px align-middle">
        <button data-action="cell" data-day="${day}" data-time="${time}" ${kind === 'blocked' || kind === 'blockedGroup' ? 'data-mask="blocked"' : ''} aria-label="${esc(label)}" class="relative flex ${height} w-full min-w-0 items-center justify-center overflow-hidden rounded-md border px-0.5 font-bold leading-none transition active:scale-95 ${cls}">
          ${cellContent(kind, lesson)}
          ${isSource ? '<span class="absolute right-0 top-0 rounded-sm bg-indigo-600 px-0.5 text-[12px] font-bold leading-none text-white">原</span>' : ''}
          ${conflict ? '<span class="absolute right-0.5 top-0.5 h-2 w-2 rounded-full bg-rose-600 ring-1 ring-white"></span>' : ''}
        </button>
      </td>`;
    }

    function renderScheduleCell(day, time) {
      if (state.scheduleClass) {
        if (toMin(time) % 60 === 0 && schedulePairRenderable(day, time)) {
          return renderSchedulePairCell(day, time);
        }
        const pairSlot = getSlot(day, time);
        if (pairSlot.kind === 'available') {
          return `<td class="p-px align-middle">
            <div aria-hidden="true" class="flex h-[26px] w-full items-center justify-center rounded-md border border-emerald-100 bg-emerald-50 text-[12px] font-bold leading-none text-emerald-700">—</div>
          </td>`;
        }
        return renderStandardGridCell(day, time);
      }

      const week = state.week;
      const map = scheduleWeekMap(week);
      const key = scheduleSlotKey(day, time);
      const selected = !!map[key];
      const slot = getSlot(day, time);
      const conflict = week === 0 ? '' : scheduleWeekConflictNote(week, day, time, 1);
      const future = week === 0 ? scheduleConflictWeeks(day, time, 1).filter((item) => item.week > 0) : [];
      const futureHint = future.length ? `，第${future[0].week + 1}周将冲突（${future[0].note}）` : '';
      if (selected) {
        return `<td class="p-px align-middle">
          <button data-action="schedule-slot" data-day="${day}" data-time="${time}" aria-label="${esc(`${dayLabel(day)} ${time} 第${week + 1}周已选${futureHint}`)}" class="relative flex h-[26px] w-full min-w-0 items-center justify-center overflow-hidden rounded-md border border-indigo-400 bg-indigo-50 px-0.5 text-[12px] font-bold leading-none text-indigo-700 ring-2 ring-inset ring-indigo-300 transition active:scale-95">
            已选${future.length ? '<span class="absolute right-0.5 top-0.5 h-1.5 w-1.5 rounded-full bg-amber-500 ring-1 ring-white"></span>' : ''}
          </button>
        </td>`;
      }
      if (conflict && slot.kind === 'available') {
        const templateSlot = !!state.scheduleSel[key] && state.scheduleWeekStatus[week] !== 'adjusted';
        return `<td class="p-px align-middle">
          <button data-action="schedule-slot" data-day="${day}" data-time="${time}" aria-label="${esc(`${dayLabel(day)} ${time} 第${week + 1}周冲突待补：${conflict}`)}" class="relative flex h-[26px] w-full min-w-0 items-center justify-center overflow-hidden rounded-md border border-dashed border-amber-300 bg-amber-50 px-0.5 text-[12px] font-bold leading-none text-amber-800">
            ${templateSlot ? '待补' : '不约'}
          </button>
        </td>`;
      }
      if (slot.kind !== 'available') return renderStandardGridCell(day, time);
      return `<td class="p-px align-middle">

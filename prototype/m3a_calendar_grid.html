<body class="min-h-screen bg-slate-100 font-sans text-slate-800 antialiased">

  <script>
    /* (c) 2024-2026 Topee (https://topee.top). All rights reserved. Proprietary and confidential. */
    'use strict';

    /* ------------------------------------------------------------------
     * 基础字典
     * ------------------------------------------------------------------ */
    const DAY_LABELS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    const DAY_PARAM = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6 };
    const BASE_MONDAY = '2026-11-09';
    const GRID_START = 9 * 60;
    const GRID_END = 20 * 60;
    const FOLD_START = '11:30';
    const FOLD_END_MIN = 15 * 60;

    const STUDENTS = {
      alice: { key: 'alice', id: 'stu_alice', name: 'AliceZ12', nick: 'Alice', short: 'Alice', emoji: '👧', age: 12, label: '大宝', credits: 5 },
      bob: { key: 'bob', id: 'stu_bob', name: 'BobZ10', nick: 'Bob', short: 'BobZ', emoji: '👦', age: 10, label: '二宝', credits: 3 },
      charlie: { key: 'charlie', id: 'stu_charlie', name: 'CharlieL08', nick: 'Charlie', short: 'Char', emoji: '🧒', age: 8, label: '三宝', credits: 2 }
    };

    const TEACHERS = {
      david: { key: 'david', id: 'tea_david', name: 'David Miller', short: 'David', initial: 'D', level: 'Senior', load: 18, cap: 24, free: 6 },
      linda: { key: 'linda', id: 'tea_linda', name: 'Linda Wu', short: 'Linda', initial: 'L', level: 'Standard', load: 14, cap: 24, free: 10 },
      nina: { key: 'nina', id: 'tea_nina', name: 'Nina Park', short: 'Nina', initial: 'N', level: 'Standard', load: 10, cap: 24, free: 14 },
      elena: { key: 'elena', id: 'tea_elena', name: 'Elena Stone', short: 'Elena', initial: 'E', level: 'Standard', load: 6, cap: 24, free: 18 }
    };

    const CLASSES = {
      ket1: { key: 'ket1', name: 'KET 冲刺精讲小班', code: 'KET1', enrolled: 3, capacity: 4, teacher: 'david' }
    };

    const BASE_LESSONS = [
      { day: 0, time: '18:30', teacher: 'david', student: 'alice', kind: 'fixed' },
      { day: 1, time: '18:30', teacher: 'david', student: 'bob', kind: 'temp' },
      { day: 1, time: '19:00', teacher: 'david', student: 'alice', kind: 'fixed' },
      { day: 1, time: '19:30', teacher: 'david', student: 'alice', kind: 'fixed' },
      { day: 2, time: '19:00', teacher: 'david', student: 'charlie', kind: 'fixed' },
      { day: 3, time: '18:00', teacher: 'david', student: 'bob', kind: 'subbing' },
      { day: 3, time: '19:00', teacher: 'david', student: 'alice', kind: 'sub', actual: 'elena' },
      { day: 5, time: '10:00', teacher: 'david', student: 'alice', kind: 'group', classId: 'ket1', dur: 2 },
      { day: 6, time: '09:30', teacher: 'david', student: 'alice', kind: 'fixed', transfer: true },
      { day: 4, time: '19:00', teacher: 'david', student: 'alice', kind: 'fixed', rescheduleCount: 1 },
      { day: 0, time: '19:30', teacher: 'linda', student: 'bob', kind: 'fixed' },
      { day: 2, time: '18:30', teacher: 'linda', student: 'charlie', kind: 'fixed' },
      { day: 4, time: '18:00', teacher: 'linda', student: 'alice', kind: 'temp' },
      { day: 4, time: '18:30', teacher: 'linda', student: 'alice', kind: 'temp' },
      { day: 5, time: '09:00', teacher: 'linda', student: 'bob', kind: 'fixed' },
      { day: 1, time: '18:00', teacher: 'nina', student: 'charlie', kind: 'fixed' },
      { day: 3, time: '19:30', teacher: 'nina', student: 'bob', kind: 'temp' }
    ];

    const TOKEN = {
      fixed: 'border-amber-300 bg-amber-50 text-amber-900',
      hold: 'border-dashed border-amber-400 bg-amber-50/70 text-amber-900',
      temp: 'border-yellow-300 bg-yellow-50 text-yellow-900',
      sub: 'border-blue-300 bg-blue-50 text-blue-900',
      subbing: 'border-purple-300 bg-purple-50 text-purple-900',
      group: 'border-2 border-teal-400 bg-teal-50 text-teal-950',
      leave: 'border-rose-300 bg-rose-50 text-rose-800',
      rest: 'border-slate-200 bg-slate-100 text-slate-600',
      available: 'border-emerald-200 bg-emerald-50 text-emerald-800'
    };

    const TYPE_NAME = {
      fixed: '固定位',
      hold: '续费预占',
      temp: '临时课',
      sub: '被代课',
      subbing: '代上课',
      group: '小班课',
      leave: '已请假',
      available: '空闲可约',
      rest: '休息'
    };

    const SCENARIOS = [
      { value: 'parent', label: '家长 Alice' },
      { value: 'parent-sub', label: '家长代课' },
      { value: 'parent-consecutive', label: '连续两节' },
      { value: 'fixed-leave-disabled', label: '固定位请假禁用' },
      { value: 'parent-free', label: '空闲约课' },
      { value: 'parent-asset', label: '课时转让入口' },
      { value: 'parent-slot-transfer', label: '课次转让' },
      { value: 'leave-blocked', label: '请假 3~24h 置灰' },
      { value: 'leave-exhausted', label: '配额用尽' },
      { value: 'reschedule-blocked', label: '已挪位锁定' },
      { value: 'group-emergency', label: '小班停电处置' },
      { value: 'teacher-report', label: '教师请假报备' },
      { value: 'admin-channel-b', label: '管理员通道 B' },
      { value: 'teacher', label: '教师 David' },
      { value: 'monitor', label: '班长 David' },
      { value: 'monitor-load', label: '多师抽屉' },
      { value: 'monitor-sub', label: '代课委任' },
      { value: 'monitor-open-slot', label: '加开时段' },
      { value: 'admin', label: '管理员' },
      { value: 'booked', label: '排课回写' }
    ];

    /* ------------------------------------------------------------------
     * 日期与文本工具
     * ------------------------------------------------------------------ */
    const esc = (value) => String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function pad2(n) { return String(n).padStart(2, '0'); }
    function fmtMinutes(total) { return `${pad2(Math.floor(total / 60))}:${pad2(total % 60)}`; }
    function toMin(time) { const bits = time.split(':').map(Number); return bits[0] * 60 + bits[1]; }
    function endTime(time, count = 1) { return fmtMinutes(toMin(time) + count * 30); }
    function nextTime(time) { return fmtMinutes(toMin(time) + 30); }
    function prevTime(time) { const m = toMin(time) - 30; return m < GRID_START ? '' : fmtMinutes(m); }
    function addDays(iso, days) {
      const base = Date.UTC(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1, Number(iso.slice(8, 10)));
      return new Date(base + days * 86400000).toISOString().slice(0, 10);
    }
    function fmtDot(iso) { return `${pad2(Number(iso.slice(5, 7)))}.${iso.slice(8, 10)}`; }
    function fmtSlash(iso) { return `${Number(iso.slice(5, 7))}/${iso.slice(8, 10)}`; }
    function teacherName(key) { return (TEACHERS[key] || TEACHERS.david).name; }
    function teacherShort(key) { return (TEACHERS[key] || TEACHERS.david).short; }
    function studentName(key) { return (STUDENTS[key] || STUDENTS.alice).name; }
    function studentShort(key) { return (STUDENTS[key] || STUDENTS.alice).short; }
    function dayLabel(day) { return DAY_LABELS[day] || ''; }
    function slotLabel(day, time, count = 1) { return `${dayLabel(day)} ${time} - ${endTime(time, count)}`; }

    const GRID_TIMES = [];
    for (let m = GRID_START; m < GRID_END; m += 30) GRID_TIMES.push(fmtMinutes(m));

    function inFold(time) { return toMin(time) >= toMin(FOLD_START) && toMin(time) < FOLD_END_MIN; }

    /* ------------------------------------------------------------------
     * 状态与地址参数
     * ------------------------------------------------------------------ */
    let overrides = {};
    let toastTimer = null;
    let flashTimerA = null;
    let flashTimerB = null;

    const state = {
      role: 'parent',
      device: 'mobile',
      embed: false,
      online: true,
      week: 1,
      roundOffset: 0,
      child: 'alice',
      teacher: 'david',
      scenario: 'parent',
      folded: true,
      drawer: null,
      panel: null,
      lesson: null,
      target: null,
      modal: null,
      reschedule: null,
      batchOpen: false,
      flash: false,
      flashKeys: [],
      bookedPreview: {},
      toast: '',
      credits: { alice: 5, bob: 3 },
      pairSel: {},
      leaveCells: [],
      hours: 32,
      quota: { alice: { used: 0, limit: 2 }, bob: { used: 1, limit: 1 } },
      bookDuration: 30,
      staffStudent: 'alice',
      subCandidate: 'elena',
      attendance: '',
      reportDay: null,
      reportSel: {},
      reportTag: 'power'
    };

    function clampWeek(value) {
      const n = Number(value);
      if (Number.isNaN(n)) return 1;
      return Math.min(3, Math.max(0, n));
    }

    function parseSlotsParam(raw) {
      if (!raw) return [];
      let decoded = raw;
      try {
        decoded = decodeURIComponent(raw);
      } catch (err) {
        decoded = raw;
      }
      return decoded
        .split(',')
        .map((item) => item.trim())
        .filter(Boolean)
        .map((item) => {
          const match = item.match(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun):(\d{1,2}):(\d{2})$/i);
          if (!match) return null;
          const dayName = `${match[1].charAt(0).toUpperCase()}${match[1].slice(1).toLowerCase()}`;
          const hours = Number(match[2]);
          const minutes = Number(match[3]);
          if (DAY_PARAM[dayName] === undefined || hours > 23 || minutes > 59) return null;
          return { day: DAY_PARAM[dayName], time: `${pad2(hours)}:${match[3]}` };
        })
        .filter(Boolean);
    }

    function weekStart(index = state.week) {
      return addDays(BASE_MONDAY, state.roundOffset * 28 + index * 7);
    }
    function roundStart() { return addDays(BASE_MONDAY, state.roundOffset * 28); }
    function lessonDate(weekIndex, day) { return addDays(BASE_MONDAY, state.roundOffset * 28 + weekIndex * 7 + day); }
    function dateFor(roundOffset, weekIndex, day) { return addDays(BASE_MONDAY, roundOffset * 28 + weekIndex * 7 + day); }
    function slotKey(weekIndex, day, time) { return `${state.roundOffset}|${weekIndex}|${day}|${time}`; }
    function roundNo(offset = 0) { return 46 + state.roundOffset * 4 + offset; }

    /* ------------------------------------------------------------------
     * 时限、配额与入口资格（只做 M3A 入口态，规则来源 M3B / M3C）
     * ------------------------------------------------------------------ */
    function hoursTier() {
      if (state.hours < 3) return 'lt3';
      if (state.hours < 24) return 'mid';
      return 'ok';
    }

    function hoursTierLabel() {
      if (state.hours < 3) return '<3h · 全端锁定';
      if (state.hours < 24) return '3~24h · 请假置灰';
      return '≥24h · 正常受理';
    }

    function quotaFor(studentKey = state.child) {
      if (!state.quota[studentKey]) state.quota[studentKey] = { used: 0, limit: 2 };
      return state.quota[studentKey];
    }

    function leaveEligibility(lesson, count = 1, studentKey = state.child) {
      if (!lesson || !['fixed', 'temp', 'sub'].includes(lesson.kind)) return { visible: false, ok: false, reason: '' };
      if (lesson.kind !== 'temp') {
        return { visible: true, ok: false, tier: hoursTier(), quota: false, remain: null, reason: '固定位为 4 周契约，不支持请假；请使用【同师挪位】或【转让此课】' };
      }
      const tier = hoursTier();
      const quota = quotaFor(studentKey);
      const remain = Math.max(0, quota.limit - quota.used);
      if (tier === 'lt3') {
        return { visible: true, ok: false, tier, quota: false, reason: '开课前 3 小时内进入授课准备保障期，禁止请假，缺席正常结课扣除课时' };
      }
      if (tier === 'mid') {
        return { visible: true, ok: false, tier, quota: false, reason: '距开课不足 24h 不支持退课请假，请使用【同师挪位】或【转让此课】' };
      }
      if (remain <= 0) {
        return { visible: true, ok: false, tier, quota: true, remain, reason: '请假配额已用完，仅支持同师挪位' };
      }
      if (count > remain) {
        return { visible: true, ok: false, tier, quota: true, remain, reason: `本次需 ${count} 次请假配额，当前仅剩 ${remain} 次` };
      }
      return { visible: true, ok: true, tier, quota: true, remain, reason: `扣减 ${count} 次配额，TS 退回待排期，课格恢复空闲可约` };
    }

    function rescheduleEligibility(lesson) {
      if (!lesson || !['fixed', 'temp', 'sub'].includes(lesson.kind)) return { visible: false, ok: false, reason: '' };
      if (state.hours < 3) {
        return { visible: true, ok: false, reason: '开课前 3 小时内进入授课准备保障期，禁止挪位' };
      }
      if ((lesson.rescheduleCount || 0) >= 1) {
        return { visible: true, ok: false, reason: '本节课已挪位过 1 次' };
      }
      return {
        visible: true,
        ok: true,
        reason: lesson.kind === 'temp'
          ? '同师平移 · 原课次前后 7 天内 · 免扣配额'
          : '同师平移 · 本轮 4 周内 · 免扣配额'
      };
    }

    function transferEligibility(lesson) {
      if (!lesson || lesson.kind !== 'fixed') return { visible: false, ok: false, reason: '' };
      if (lesson.transfer) {
        return { visible: true, ok: false, reason: '受让课次不可二次转让' };
      }
      if (state.hours < 3) {
        return { visible: true, ok: false, reason: '开课前 3 小时锁定，禁止转让' };
      }
      return { visible: true, ok: true, reason: '带参进入 M3C 转让页 · 校验与转账由 M3C 承接' };
    }

    function tsIdFor(lesson, studentKey = state.child) {
      return `ts_${STUDENTS[studentKey].id.replace('stu_', '')}_w${state.week + 1}_d${lesson.day}_${lesson.time.replace(':', '')}`;
    }

    function lessonIdFor(lesson, studentKey = state.child) {
      return `lsn_${STUDENTS[studentKey].id.replace('stu_', '')}_w${state.week + 1}_d${lesson.day}_${lesson.time.replace(':', '')}`;
    }

    function m3bExceptionUrl(lesson) {
      const role = state.role === 'admin' ? 'admin' : 'monitor';
      return `m3b_attendance_substitution.html?role=${role}&studentId=${STUDENTS[lesson.student].id}&lessonId=${lessonIdFor(lesson, lesson.student)}&panel=exception&from=calendar`;
    }

    function m3cSlotUrl(lesson, role = 'amy', studentKey = state.child) {
      return `m3c_course_transfer.html?role=${role}&mode=slot&tsId=${tsIdFor(lesson, studentKey)}&studentId=${STUDENTS[studentKey].id}&from=calendar&week=${state.week}&day=${lesson.day}&time=${lesson.time}`;
    }

    function m3cAssetUrl(studentKey = state.child) {
      return `m3c_course_transfer.html?role=amy&mode=ts&studentId=${STUDENTS[studentKey].id}&from=calendar`;
    }

    /* ------------------------------------------------------------------
     * 数据解析
     * ------------------------------------------------------------------ */
    function baseLessons(day, time, week = state.week) {
      let list = BASE_LESSONS
        .filter((item) => item.day === day && item.time === time)
        .map((item) => Object.assign({}, item));

      if (week === 1 && day === 0 && time === '17:30') {
        list.push({ day: 0, time: '17:30', teacher: 'david', student: 'alice', kind: 'hold' });
      }
      return list;
    }

    function slotLessons(day, time) {
      const key = slotKey(state.week, day, time);
      const override = overrides[key];
      if (override) {
        if (override.forced) return [];
        return [Object.assign({}, override, { day, time })];
      }
      return baseLessons(day, time);
    }

    function teacherOpen(teacher, day, time) {
      const m = toMin(time);
      if (teacher === 'david') {
        if (day <= 4) return m >= 15 * 60 && m < 20 * 60;
        return m >= 9 * 60 && m < 12 * 60;
      }
      if (teacher === 'linda') {
        if (day <= 4) return m >= 17 * 60 && m < 20 * 60;
        return m >= 9 * 60 && m < 11 * 60 + 30;
      }
      if (teacher === 'nina') {
        if (day <= 4) return m >= 16 * 60 && m < 19 * 60;
        return m >= 9 * 60 && m < 11 * 60;
      }
      return false;
    }

    function getSlot(day, time) {
      const key = slotKey(state.week, day, time);
      const preview = state.bookedPreview[key];
      if (preview === 'fixed') {
        return { kind: 'fixed', lesson: { day, time, teacher: 'david', student: 'alice', kind: 'fixed' }, key };
      }
      if (preview === 'group') {
        return { kind: 'group', lesson: { day, time, teacher: 'david', student: 'alice', kind: 'group', classId: 'ket1', dur: 2 }, key };
      }
      const override = overrides[key];
      if (override && override.forced) return { kind: override.forced, lesson: null, key };
      const lessons = slotLessons(day, time);
      let lesson = null;
      if (state.role === 'parent') {
        lesson = lessons.find((item) => item.student === state.child) || null;
      } else {
        lesson = lessons.find((item) => item.teacher === state.teacher) || null;
      }
      if (lesson) return { kind: lesson.kind, lesson, key };

      const viewTeacher = state.reschedule
        ? state.reschedule.teacher
        : (state.role === 'parent' ? 'david' : state.teacher);
      const busy = lessons.some((item) => item.teacher === viewTeacher);
      if (!busy && teacherOpen(viewTeacher, day, time)) return { kind: 'available', lesson: null, key };
      return { kind: 'rest', lesson: null, key };
    }

    function visibleGroup(day, time) {
      const key = slotKey(state.week, day, time);
      if (state.bookedPreview[key] === 'group') {
        return { day, time, teacher: 'david', student: 'alice', kind: 'group', classId: 'ket1', dur: 2 };
      }
      return slotLessons(day, time).find((item) => {
        if (item.kind !== 'group') return false;
        return state.role === 'parent' ? item.student === state.child : item.teacher === state.teacher;
      }) || null;
    }

    function isGroupContinuation(day, time) {
      const prev = prevTime(time);
      if (!prev) return false;
      return !!visibleGroup(day, prev);
    }

    function countStudentLessons(child) {
      let count = 0;
      DAY_LABELS.forEach((_, day) => {
        GRID_TIMES.forEach((time) => {
          if (isGroupContinuation(day, time)) return;
          const lessons = slotLessons(day, time);
          const own = lessons.find((item) => item.student === child);
          const preview = state.bookedPreview[slotKey(state.week, day, time)];
          if (preview) {
            if (child === 'alice' && (!own || own.kind === 'leave' || own.kind === 'rest')) count += 1;
            return;
          }
          if (!own) return;
          if (own.kind === 'leave' || own.kind === 'rest') return;
          count += 1;
        });
      });
      return count;
    }

    function activeTeacher() { return TEACHERS[state.teacher]; }
    function isStaff() { return state.role !== 'parent'; }
    function canSwitchTeacher() { return state.role === 'monitor' || state.role === 'admin'; }

    /* ------------------------------------------------------------------
     * 页面骨架
     * ------------------------------------------------------------------ */
    function render(preserveScroll = true) {
      const previous = document.getElementById('content');
      const previousTop = previous ? previous.scrollTop : 0;
      document.body.className = state.embed
        ? 'h-screen overflow-hidden bg-white font-sans text-slate-800 antialiased'
        : 'min-h-screen bg-slate-100 font-sans text-slate-800 antialiased';
      document.getElementById('app').className = state.embed ? 'h-full' : '';
      document.getElementById('app').innerHTML = `${state.embed ? '' : renderConsole()}${renderFrame()}`;
      const next = document.getElementById('content');
      if (next) next.scrollTop = preserveScroll ? previousTop : 0;
      if (window.lucide) window.lucide.createIcons();
    }

    function renderFrame() {
      if (state.embed) {
        return `<main class="h-full w-full overflow-hidden">
          <div id="frame" class="relative flex h-full w-full flex-col overflow-hidden bg-white">
            ${!state.online ? renderOfflineStrip() : ''}
            ${renderContent()}
            ${renderDrawer()}
            ${renderModal()}
            ${state.toast ? renderToast() : ''}
          </div>
        </main>`;
      }
      const size = state.device === 'tablet' ? 'h-[860px] w-full max-w-[768px]' : 'h-[812px] w-[390px]';
      return `<main class="flex justify-center px-0 py-6 sm:px-4">
        <div id="frame" class="relative flex ${size} shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300">
          ${renderBanner()}
          ${!state.online ? renderOfflineStrip() : ''}
          ${renderContent()}
          ${renderNav()}
          ${renderDrawer()}
          ${renderModal()}
          ${state.toast ? renderToast() : ''}
        </div>
      </main>`;
    }

    function roleMeta() {
      if (state.role === 'teacher') return { banner: 'from-slate-800 via-emerald-900 to-slate-700' };
      if (state.role === 'monitor') return { banner: 'from-slate-900 via-fuchsia-950 to-slate-800' };
      if (state.role === 'admin') return { banner: 'from-slate-900 via-violet-950 to-slate-800' };
      return { banner: 'from-slate-800 via-blue-900 to-slate-700' };
    }

    function renderBanner() {
      const meta = roleMeta();
      let title = '学生课表';
      let subtitle = '';
      if (state.role === 'teacher') {
        title = '我的课表';
        subtitle = `${activeTeacher().name} · 本周 ${activeTeacher().load}/24 节`;
      } else if (state.role === 'monitor' || state.role === 'admin') {
        title = '教师课表';
        subtitle = `${activeTeacher().name} · 本周 ${activeTeacher().load}/24 节`;
      } else {
        const child = STUDENTS[state.child];
        subtitle = `${fmtDot(weekStart())} - ${fmtDot(addDays(weekStart(), 6))} · 本周 ${countStudentLessons(child.key)} 节`;
      }
      return `<header class="relative flex h-16 shrink-0 items-center gap-2 overflow-hidden bg-gradient-to-br ${meta.banner} px-3 text-white">
        <span class="pointer-events-none absolute -right-7 -top-9 h-24 w-24 rounded-full border border-white/10"></span>
        <span class="pointer-events-none absolute right-16 top-5 h-14 w-14 rounded-full border border-white/10"></span>
        <span class="pointer-events-none absolute -bottom-8 left-20 h-20 w-20 rounded-full bg-white/5"></span>
        <div class="relative min-w-0 flex-1">
          <h1 class="truncate text-[18px] font-bold tracking-tight">${esc(title)}</h1>
          <p class="mt-0.5 truncate text-[12px] font-medium text-white/70">${esc(subtitle)}</p>
        </div>
        <button data-action="bell" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="通知，2 条未读">
          ${icon('bell', 'h-4 w-4')}
          <span class="absolute -right-1 -top-1 grid h-[18px] min-w-[18px] place-items-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white/30">2</span>
        </button>
      </header>`;
    }

    function renderOfflineStrip() {
      return `<div class="flex shrink-0 items-center gap-1.5 border-b border-amber-200 bg-amber-50 px-3 py-1.5 text-[12px] font-semibold text-amber-900">
        ${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')}
        <span class="truncate">离线只读 · 课表可查看，暂不可修改</span>
      </div>`;
    }

    function renderContent() {
      return `<div id="content" class="min-h-0 flex-1 overflow-y-auto overscroll-contain bg-white">
        ${state.role === 'parent' ? renderParentHeader() : renderStaffHeader()}
        <div class="px-3 pb-2 pt-1.5">
          ${state.reschedule ? renderRescheduleHint() : ''}
          ${renderGridCard()}
          ${renderLegend()}
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 顶部工作区
     * ------------------------------------------------------------------ */
    function renderParentHeader() {
      const child = STUDENTS[state.child];
      const credits = state.credits[state.child];
      return `<div class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 px-3 pb-1.5 pt-1.5 backdrop-blur">
        <div class="flex items-center gap-1.5">
          <button data-action="open-children" class="flex h-9 min-w-0 flex-1 items-center gap-1.5 rounded-xl border border-slate-200/80 bg-slate-50/70 px-2 transition active:scale-[0.995]">
            <span class="shrink-0 text-[14px] leading-none">${child.emoji}</span>
            <span class="min-w-0 flex-1 truncate text-left">
              <span class="text-[14px] font-bold text-slate-900">${esc(child.nick)}</span>
              <span class="ml-1 text-[12px] font-medium text-slate-600">(${esc(child.label)}) · ${child.age}岁</span>
            </span>
            ${icon('chevron-down', 'h-3.5 w-3.5 shrink-0 text-slate-500')}
          </button>
          <button data-action="open-asset" class="flex h-9 max-w-[176px] shrink-0 items-center gap-1 rounded-xl border border-indigo-100 bg-indigo-50 px-2 text-[12px] font-bold text-indigo-700 transition active:scale-[0.995]">
            <span class="min-w-0 truncate">${esc(child.nick)} · 剩余: ${credits} 课时</span>
            ${icon('chevron-down', 'h-3.5 w-3.5 shrink-0')}
          </button>
        </div>
        ${renderWeekNav()}
      </div>`;
    }

    function loadSegments(load, cap) {
      const filled = Math.round((load / cap) * 12);
      return Array.from({ length: 12 }, (_, index) => `<span class="h-1 flex-1 rounded-full ${index < filled ? 'bg-indigo-500' : 'bg-slate-200'}"></span>`).join('');
    }

    function renderStaffHeader() {
      const teacher = activeTeacher();
      const switchable = canSwitchTeacher();
      const roleTag = state.role === 'admin' ? '平台统筹' : (state.role === 'monitor' ? '管辖' : teacher.level);
      const loadText = state.role === 'teacher' ? `本周 ${teacher.load} 节` : `本周已排 ${teacher.load}/24 节`;
      const inner = `<span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl border border-slate-200 bg-slate-100 text-[14px] font-bold text-slate-700">${teacher.initial}</span>
        <span class="min-w-0 flex-1">
          <span class="flex items-center gap-1">
            <span class="truncate text-[14px] font-bold text-slate-900">${esc(teacher.name)}</span>
            <span class="shrink-0 rounded bg-slate-100 px-1 py-0.5 text-[12px] font-semibold text-slate-700">${esc(roleTag)}</span>
          </span>
          <span class="mt-1 flex items-center gap-1.5">
            <span class="shrink-0 text-[12px] font-medium text-slate-600">${loadText}</span>
            <span class="flex min-w-0 flex-1 gap-0.5">${loadSegments(teacher.load, teacher.cap)}</span>
          </span>
        </span>
        ${switchable ? icon('chevron-down', 'h-3.5 w-3.5 shrink-0 text-slate-500') : ''}`;

      return `<div class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 px-3 pb-1.5 pt-1.5 backdrop-blur">
        <div class="flex items-start gap-1.5">
          ${switchable
            ? `<button data-action="open-teachers" class="flex h-12 min-w-0 flex-1 items-center gap-2 rounded-xl border border-slate-200/80 bg-slate-50/70 px-2.5 text-left transition active:scale-[0.995]">${inner}</button>`
            : `<div class="flex h-12 w-full items-center gap-2 rounded-xl border border-slate-200/80 bg-slate-50/70 px-2.5">${inner}</div>`}
          ${switchable ? renderBatchEntry() : ''}
        </div>
        ${renderWeekNav()}
      </div>`;
    }

    function renderBatchEntry() {
      return `<div class="relative shrink-0 self-center">
        <button data-action="toggle-batch" class="flex h-8 items-center gap-1 rounded-lg border border-slate-200 bg-white px-2 text-[12px] font-bold text-slate-700 transition hover:bg-slate-50">
          批量排课${icon('chevron-down', 'h-3 w-3')}
        </button>
        ${state.batchOpen ? `<div id="batchMenu" class="absolute right-0 top-full z-40 mt-1 w-64 overflow-hidden rounded-xl border border-slate-200 bg-white p-1 shadow-xl">
          <a href="m3d_scheduling_workbench.html?role=monitor&mode=batch_fixed&teacherId=tea_david&studentId=stu_alice" class="block rounded-lg px-2.5 py-2 transition hover:bg-slate-50">
            <span class="block text-[14px] font-bold text-slate-900">1v1 固定位批量排课</span>
            <span class="mt-0.5 block text-[12px] font-medium text-slate-600">连续 4 周 · 同一时段批量锁定</span>
          </a>
          <a href="m3d_scheduling_workbench.html?role=monitor&mode=batch_group&teacherId=tea_david" class="mt-0.5 block rounded-lg px-2.5 py-2 transition hover:bg-slate-50">
            <span class="block text-[14px] font-bold text-slate-900">1vN 小班课整班排课</span>
            <span class="mt-0.5 block text-[12px] font-medium text-slate-600">连续 16 周 · 整班同一时段</span>
          </a>
          <a href="m3d_scheduling_workbench.html?role=monitor&mode=group_single&teacherId=tea_david" class="mt-0.5 block rounded-lg px-2.5 py-2 transition hover:bg-slate-50">
            <span class="block text-[14px] font-bold text-slate-900">1vN 小班课单节补排</span>
            <span class="mt-0.5 block text-[12px] font-medium text-slate-600">停课退期待排 TS 补排</span>
          </a>
        </div>` : ''}
      </div>`;
    }

    function renderWeekNav() {
      const start = roundStart();
      return `<div class="mt-2">
        <div class="flex items-center justify-between gap-1">
          <button data-action="prev-round" class="flex h-6 shrink-0 items-center gap-0.5 rounded-lg border border-slate-200 bg-white px-1.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">
            ${icon('chevron-left', 'h-3.5 w-3.5')}上一轮
          </button>
          <div class="min-w-0 text-center">
            <div class="truncate text-[12px] font-bold text-slate-800">本轮：第 ${roundNo(0)}~${roundNo(3)} 周</div>
            <div class="truncate text-[12px] font-medium text-slate-600">${fmtDot(start)} - ${fmtDot(addDays(start, 27))}</div>
          </div>
          <button data-action="next-round" class="flex h-6 shrink-0 items-center gap-0.5 rounded-lg border border-slate-200 bg-white px-1.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">
            下一轮${icon('chevron-right', 'h-3.5 w-3.5')}
          </button>
        </div>
        <div class="mt-1.5 grid grid-cols-4 gap-1.5">
          ${[0, 1, 2, 3].map((index) => {
            const on = index === state.week;
            const weekDate = addDays(start, index * 7);
            return `<button data-action="set-week" data-week="${index}" class="relative h-9 rounded-lg border px-1 text-center transition ${on ? 'border-indigo-300 bg-indigo-50 text-indigo-700 ring-1 ring-indigo-100' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">
              <span class="block text-[12px] font-bold leading-tight">第${index + 1}周</span>
              <span class="block font-mono text-[12px] font-medium leading-tight">${fmtSlash(weekDate)}</span>
              <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full ${on ? 'bg-indigo-500' : (index === 2 ? 'bg-amber-500' : 'bg-emerald-500')}"></span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 7 列网格
     * ------------------------------------------------------------------ */
    function renderGridCard() {
      return `<section id="gridCard" class="overflow-hidden rounded-xl border border-slate-200/80 bg-white" aria-label="周课表">
        <table class="w-full table-fixed border-collapse">
          <colgroup>
            <col class="w-10">
            <col><col><col><col><col><col><col>
          </colgroup>
          <thead>
            <tr class="h-7 bg-slate-50">
              <th class="w-10 p-0 text-center align-middle font-mono text-[12px] font-semibold text-slate-500">时间</th>
              ${DAY_LABELS.map((label, day) => {
                const date = addDays(weekStart(), day);
                return `<th class="border-l border-slate-100 p-0 text-center align-middle">
                  <span class="block text-[12px] font-bold leading-none text-slate-700">${label}</span>
                  <span class="mt-0.5 block font-mono text-[12px] font-medium leading-none text-slate-500">${fmtDot(date)}</span>
                </th>`;
              }).join('')}
            </tr>
          </thead>
          <tbody>
            ${renderGridRows()}
          </tbody>
        </table>
      </section>`;
    }

    function renderGridRows() {
      const rows = [];
      GRID_TIMES.forEach((time) => {
        if (state.folded && time === FOLD_START) {
          rows.push(renderFoldRow());
          return;
        }
        if (state.folded && inFold(time)) return;
        if (!state.folded && time === FOLD_START) rows.push(renderFoldBarOpen());
        rows.push(renderGridRow(time));
      });
      return rows.join('');
    }

    function renderFoldRow() {
      return `<tr class="h-[22px]">
        <td colspan="8" class="p-0">
          <button data-action="toggle-fold" class="flex h-[22px] w-full items-center justify-center gap-1.5 border-y border-slate-200 bg-slate-100 px-2 text-[12px] font-semibold text-slate-600 transition hover:bg-slate-200">
            ${icon('chevrons-up-down', 'h-3.5 w-3.5 shrink-0')}
            <span class="truncate">11:30 - 15:00 日间休息 (已折叠) [点击展开]</span>
          </button>
        </td>
      </tr>`;
    }

    function renderFoldBarOpen() {
      return `<tr class="h-[22px]">
        <td colspan="8" class="p-0">
          <button data-action="toggle-fold" class="flex h-[22px] w-full items-center justify-center gap-1.5 border-y border-slate-200 bg-slate-100 px-2 text-[12px] font-semibold text-slate-600 transition hover:bg-slate-200">
            ${icon('chevrons-up-down', 'h-3.5 w-3.5 shrink-0')}
            <span class="truncate">11:30 - 15:00 日间休息 (已展开) [点击收起]</span>
          </button>
        </td>
      </tr>`;
    }

    function renderGridRow(time) {
      const cells = DAY_LABELS.map((_, day) => {
        if (isGroupContinuation(day, time)) return '';
        return renderGridCell(day, time);
      }).join('');
      return `<tr class="h-7 border-t border-slate-100">
        <td class="p-0 align-middle">
          <div class="flex h-7 items-center justify-center border-r border-slate-100 bg-white font-mono text-[12px] font-medium text-slate-600">${time}</div>
        </td>
        ${cells}
      </tr>`;
    }

    function cellContent(kind, lesson) {
      const parent = state.role === 'parent';
      if (kind === 'group') {
        if (lesson.outage) {
          return `<span class="flex h-full w-full flex-col items-center justify-center gap-0.5 overflow-hidden leading-none">
            <span class="max-w-full truncate rounded-sm bg-rose-600 px-0.5 text-[11px] font-bold leading-none text-white">[停]</span>
            <span class="max-w-full truncate text-[11px] font-bold leading-none">停电停课</span>
            <span class="max-w-full truncate text-[11px] font-medium leading-none">待补排</span>
          </span>`;
        }
        const cls = CLASSES[lesson.classId] || CLASSES.ket1;
        const subline = lesson.actual ? `代 ${teacherShort(lesson.actual)}` : `${cls.enrolled}/${cls.capacity}人`;
        return `<span class="flex h-full w-full flex-col items-center justify-center gap-0.5 overflow-hidden leading-none">
          <span class="max-w-full truncate rounded-sm bg-teal-600 px-0.5 text-[11px] font-bold leading-none text-white">[G]</span>
          <span class="max-w-full truncate text-[11px] font-bold leading-none">${esc(cls.code)}</span>
          <span class="max-w-full truncate text-[11px] font-medium leading-none">${esc(subline)}</span>
        </span>`;
      }
      if (kind === 'sub') {
        const text = parent ? teacherShort(lesson.actual || 'elena') : studentShort(lesson.student);
        return stackedCell(text, '[SUB]', 'bg-blue-500');
      }
      if (kind === 'subbing') {
        return stackedCell(studentShort(lesson.student), '[代上]', 'bg-purple-600');
      }
      if (kind === 'hold') {
        const text = parent ? teacherShort(lesson.teacher) : studentShort(lesson.student);
        return stackedCell(text, '预', 'bg-amber-500');
      }
      if (kind === 'fixed' || kind === 'temp') {
        const text = parent ? teacherShort(lesson.teacher) : studentShort(lesson.student);
        if (lesson.transfer) {
          return `<span class="relative flex h-full w-full items-center justify-center overflow-hidden">
            <span class="max-w-full truncate pr-2 text-center text-[11px] font-bold leading-none">${esc(text)}</span>
            <span class="absolute right-0 top-0 rounded-sm bg-amber-200/80 px-0.5 text-[11px] font-bold leading-none text-amber-900">转</span>
          </span>`;
        }
        return `<span class="block w-full truncate text-center text-[11px] font-bold leading-none">${esc(text)}</span>`;
      }
      if (kind === 'leave') return '<span class="block text-center text-[11px] font-bold leading-none">假</span>';
      if (kind === 'available') return '<span class="block text-center text-[11px] font-bold leading-none">约</span>';
      return '<span class="block text-center text-[11px] font-bold leading-none">休</span>';
    }

    function stackedCell(text, badge, badgeClass) {
      return `<span class="flex h-full w-full flex-col items-center justify-center gap-0.5 overflow-hidden leading-none">
        <span class="max-w-full truncate rounded-sm ${badgeClass} px-0.5 py-px text-[11px] font-bold leading-none text-white">${esc(badge)}</span>
        <span class="max-w-full truncate text-[11px] font-bold leading-none">${esc(text)}</span>
      </span>`;
    }

    function rescheduleTargetInfo(day, time) {
      const source = state.reschedule;
      if (!source) return null;
      const isSource = state.roundOffset === source.round
        && state.week === source.week
        && source.day === day
        && source.times.includes(time);
      let inWindow = state.roundOffset === source.round;
      if (inWindow && source.kind === 'temp') {
        const srcDate = dateFor(source.round, source.week, source.day);
        const targetDate = dateFor(state.roundOffset, state.week, day);
        const diff = Math.round((Date.parse(`${targetDate}T00:00:00Z`) - Date.parse(`${srcDate}T00:00:00Z`)) / 86400000);
        inWindow = Math.abs(diff) <= 7;
      }
      return { isSource, inWindow };
    }

    function renderGridCell(day, time) {
      const slot = getSlot(day, time);
      const kind = slot.kind;
      const lesson = slot.lesson || {};
      const isGroup = kind === 'group';
      const flash = state.flash && state.flashKeys.includes(slot.key);
      const target = rescheduleTargetInfo(day, time);
      const isSource = !!target && target.isSource;
      const validTarget = !!target && !isSource && target.inWindow && kind === 'available';
      const blockedTarget = !!target && !isSource && (!target.inWindow || kind !== 'available');
      const tokenKind = kind === 'group' && lesson.outage ? 'leave' : kind;
      const cls = `${TOKEN[tokenKind] || TOKEN.rest} ${flash ? 'ring-2 ring-inset ring-indigo-500 animate-pulse' : ''} ${isSource ? 'border-dashed ring-2 ring-inset ring-indigo-400' : ''} ${validTarget ? 'ring-1 ring-emerald-400 animate-pulse' : ''} ${blockedTarget ? 'opacity-40' : ''}`;
      const label = kind === 'group'
        ? `${dayLabel(day)} ${time} ${CLASSES[lesson.classId] ? CLASSES[lesson.classId].code : 'KET1'}`
        : `${dayLabel(day)} ${time} ${TYPE_NAME[kind] || ''}${isSource ? ' 原时段' : ''}`;
      const height = isGroup ? 'h-[54px]' : 'h-[26px]';
      return `<td ${isGroup ? 'rowspan="2"' : ''} class="p-px align-middle">
        <button data-action="cell" data-day="${day}" data-time="${time}" aria-label="${esc(label)}" class="relative flex ${height} w-full min-w-0 items-center justify-center overflow-hidden rounded-md border px-0.5 font-bold leading-none transition active:scale-95 ${cls}">
          ${cellContent(kind, lesson)}
          ${isSource ? '<span class="absolute right-0 top-0 rounded-sm bg-indigo-600 px-0.5 text-[11px] font-bold leading-none text-white">原</span>' : ''}
        </button>
      </td>`;
    }

    function renderLegend() {
      const items = [
        { label: '固定位', cls: 'border-amber-300 bg-amber-50' },
        { label: '续费预占', cls: 'border-dashed border-amber-400 bg-amber-50/70' },
        { label: '临时课', cls: 'border-yellow-300 bg-yellow-50' },
        { label: '被代课', cls: 'border-blue-300 bg-blue-50' },
        { label: '小班课', cls: 'border-2 border-teal-400 bg-teal-50' },
        { label: '请假', cls: 'border-rose-300 bg-rose-50' },
        { label: '休息', cls: 'border-slate-200 bg-slate-100' },
        { label: '可约', cls: 'border-emerald-200 bg-emerald-50' }
      ];
      return `<div id="legend" class="mt-0.5 rounded-xl border border-slate-200/80 bg-slate-50/70 px-2.5 py-0.5">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
          ${items.map((item) => `<span class="flex items-center gap-1 text-[12px] font-medium text-slate-600">
            <span class="h-2.5 w-2.5 shrink-0 rounded-sm border ${item.cls}"></span>${item.label}
          </span>`).join('')}
        </div>
      </div>`;
    }

    function renderRescheduleHint() {
      const source = state.reschedule;
      if (!source) return '';
      const windowText = source.kind === 'temp' ? '原课次前后 7 天' : '本轮 4 周内';

    /* ------------------------------------------------------------------

    function renderDrawer() {
      if (!state.drawer) return '';
      let content = '';
      if (state.drawer === 'children') content = renderChildrenSheet();
      else if (state.drawer === 'asset') content = renderAssetSheet();
      else if (state.drawer === 'teachers') content = renderTeachersSheet();
      else if (state.drawer === 'parent-lesson') content = renderParentLessonSheet();
      else if (state.drawer === 'parent-book') content = renderBookingSheet();
      else if (state.drawer === 'staff-lesson') content = renderStaffLessonSheet();
      else if (state.drawer === 'staff-free') content = renderBookingSheet();
      else if (state.drawer === 'staff-rest') content = renderRestSheet();
      else if (state.drawer === 'teacher-free') content = renderTeacherFreeSheet();
      else if (state.drawer === 'teacher-report') content = renderTeacherReportPanel();
      else if (state.drawer === 'channel-b') content = renderChannelBPanel();
      else content = '';

      return `<div class="absolute inset-0 z-50">
        <button data-action="close-drawer" class="absolute inset-0 h-full w-full bg-slate-900/40" aria-label="关闭"></button>

    function sheetHeader(title, subtitle) {

    function backRow() {
      return `<button data-action="back-panel" class="mt-2 flex h-10 w-full items-center justify-center gap-1 rounded-xl border border-slate-200 bg-white text-[14px] font-semibold text-slate-700">${icon('arrow-left', 'h-4 w-4')}返回</button>`;
    }

    function renderChildrenSheet() {

              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl ${active ? 'bg-white text-indigo-700' : 'bg-slate-100 text-slate-700'} text-[16px]">${child.emoji}</span>
              <span class="min-w-0 flex-1">
                <span class="flex items-center gap-1.5">
                  <span class="truncate text-[14px] font-bold text-slate-900">${esc(child.nick)}</span>
                  <span class="text-[12px] font-medium text-slate-600">${esc(child.label)} · ${child.age}岁</span>
                </span>
                <span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">${esc(child.name)} · 本周 ${countStudentLessons(key)} 节</span>

                <span class="block text-[16px] font-bold text-indigo-700">${state.credits[key]}</span>

    function renderTeachersSheet() {
      const subtitle = state.role === 'admin' ? '平台调度 · 3 位外教 · 负荷实时同步' : '本团队 3 位外教 · 负荷实时同步';
      return `${sheetHeader('切换外教', subtitle)}
        <div class="space-y-2">
          ${['david', 'linda', 'nina'].map((key) => {
            const teacher = TEACHERS[key];
            const active = state.teacher === key;

              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl ${active ? 'bg-white text-indigo-700' : 'bg-slate-100 text-slate-700'} text-[14px] font-bold">${teacher.initial}</span>
              <span class="min-w-0 flex-1">

                  <span class="truncate text-[14px] font-bold text-slate-900">${esc(teacher.name)}</span>
                  <span class="rounded bg-slate-100 px-1 py-0.5 text-[12px] font-semibold text-slate-700">${teacher.level}</span>
                </span>
                <span class="mt-1 flex items-center gap-1.5">
                  <span class="flex min-w-0 flex-1 gap-0.5">${loadSegments(teacher.load, teacher.cap)}</span>
                  <span class="shrink-0 text-[12px] font-semibold text-slate-700">${teacher.load}/24 节</span>
                </span>

    function renderAssetSheet() {
      const child = STUDENTS[state.child];

        <div class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4 text-center">

          <div class="rounded-xl border border-slate-200 bg-white p-2.5">

          </div>

          <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">仅转让账户内未排课的自由 TS 课时；接收方核验、划转与审计全部由 M3C 承接，本页不扣减课时。</p>
          <a id="assetTransferEntry" href="${m3cAssetUrl()}" class="mt-2.5 flex h-11 w-full items-center justify-center gap-1 rounded-xl bg-indigo-600 text-[16px] font-bold text-white transition hover:bg-indigo-700">${icon('repeat-2', 'h-4 w-4')}课时转让</a>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 家长课次抽屉
     * ------------------------------------------------------------------ */
    function pairFor(lesson) {
      if (!lesson) return null;
      if (!['fixed', 'temp'].includes(lesson.kind)) return null;
      const prev = prevTime(lesson.time);
      const next = nextTime(lesson.time);
      const prevLesson = prev ? getSlot(lesson.day, prev).lesson : null;
      const nextLesson = next && toMin(next) < GRID_END ? getSlot(lesson.day, next).lesson : null;
      const same = (a, b) => a && b && a.student === b.student && a.teacher === b.teacher && a.kind === b.kind;
      if (same(prevLesson, lesson)) return [prevLesson, lesson];
      if (same(nextLesson, lesson)) return [lesson, nextLesson];
      return null;
    }

    function renderParentLessonSheet() {
      if (state.panel === 'leave') return renderLeavePanel();
      const lesson = state.lesson;
      if (!lesson) return '';
      const pair = pairFor(lesson);
      const isGroup = lesson.kind === 'group';
      return `${sheetHeader(isGroup ? '小班课详情' : '课次详情', slotLabel(lesson.day, lesson.time, isGroup ? 2 : 1))}
        ${pair ? renderPairBox(pair) : ''}
        ${renderLessonInfo(lesson)}
        ${renderClassroomCard(lesson)}
        ${renderCoursewareRow()}
        ${isGroup ? '' : renderParentActions(lesson)}`;
    }

    function pairLeaveEligibility(pair, studentKey = state.child) {
      const items = pair || [];
      if (!items.length) return { ok: false, reason: '请至少勾选 1 节' };
      if (items.some((item) => item.kind !== 'temp')) {
        return { ok: false, reason: '固定位为 4 周契约，不支持请假；请使用【同师挪位】或【转让此课】' };
      }
      const check = leaveEligibility(items[0], items.length, studentKey);
      return { ok: check.ok, reason: check.reason };
    }

    function pairRescheduleEligibility(pair) {
      const items = pair || [];
      if (!items.length) return { ok: false, reason: '请至少勾选 1 节' };
      if (state.hours < 3) return { ok: false, reason: '开课前 3 小时内进入授课准备保障期，禁止挪位' };
      if (items.some((item) => (item.rescheduleCount || 0) >= 1)) return { ok: false, reason: '所选课次中存在已挪位过 1 节的课程' };
      return { ok: true, reason: '两节同师平移，免扣配额' };
    }

    function renderPairBox(pair, staff = false) {
      const studentKey = staff && pair[0] ? pair[0].student : state.child;
      const leave = pairLeaveEligibility(pair, studentKey);
      const move = pairRescheduleEligibility(pair);
      const canMergeLeave = pair.length > 0 && pair.every((item) => item.kind === 'temp');
      const prefix = staff ? '协助' : '';
      return `<div class="mb-2.5 rounded-xl border border-slate-200/80 bg-slate-50/70 p-2.5">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[14px] font-bold text-slate-900">连续 2 节</span>
          <span class="text-[12px] font-medium text-slate-600">默认全选，可单节操作</span>
        </div>
        <div class="mt-2 space-y-1.5">
          ${pair.map((item, index) => `<label class="flex h-9 cursor-pointer items-center gap-2 rounded-lg border border-slate-200 bg-white px-2">
            <input type="checkbox" data-pair="${item.time}" ${state.pairSel[item.time] !== false ? 'checked' : ''} class="h-4 w-4 shrink-0 accent-indigo-600">
            <span class="min-w-0 flex-1 truncate text-[12px] font-semibold text-slate-800">${dayLabel(item.day)} ${item.time} - ${endTime(item.time)} · ${teacherShort(item.teacher)} (第${index + 1}节)</span>
          </label>`).join('')}
        </div>
        <div class="mt-2 ${canMergeLeave ? 'grid grid-cols-2 gap-2' : ''}">
          ${canMergeLeave ? `<button data-action="pair-leave" ${leave.ok ? '' : 'disabled'} class="flex h-10 items-center justify-center gap-1 rounded-lg text-[14px] font-bold transition ${leave.ok ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'cursor-not-allowed bg-slate-200 text-slate-500'}">${icon('calendar-x', 'h-4 w-4')}${prefix}合并请假 (2节)</button>` : ''}
          <button data-action="pair-reschedule" ${move.ok ? '' : 'disabled'} class="flex h-10 items-center justify-center gap-1 rounded-lg border text-[14px] font-semibold transition ${move.ok ? 'border-slate-300 bg-white text-slate-800 hover:bg-slate-50' : 'cursor-not-allowed border-slate-200 bg-slate-100 text-slate-500'} ${canMergeLeave ? '' : 'w-full'}">${icon('move-right', 'h-4 w-4')}${prefix}合并调课 (2节)</button>
        </div>
        ${staff ? `<button data-action="confirm-exception-backfill" class="mt-2 flex h-10 w-full items-center justify-center gap-1 rounded-lg border border-rose-200 bg-rose-50 text-[12px] font-bold text-rose-700 transition hover:bg-rose-100">${icon('triangle-alert', 'h-4 w-4')}确认异常未上课回退补生 (2节)</button>` : ''}
        ${canMergeLeave && !leave.ok ? `<p class="mt-1.5 text-[12px] font-medium leading-relaxed text-rose-700">合并请假不可用：${esc(leave.reason)}</p>` : ''}
        ${!canMergeLeave ? `<p class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-600">固定位为 4 周契约，连续两节仅支持合并调课。</p>` : ''}
        ${!move.ok ? `<p class="mt-1 text-[12px] font-medium leading-relaxed text-rose-700">合并调课不可用：${esc(move.reason)}</p>` : ''}
        ${staff ? `<p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">异常回退仅适用于连续 2 节外教缺席旷课；提交后一次性补生 2 节待排期 TS。</p>` : ''}
      </div>`;
    }

    function renderLessonInfo(lesson) {
      const isGroup = lesson.kind === 'group';
      const cls = isGroup ? (CLASSES[lesson.classId] || CLASSES.ket1) : null;
      return `<div class="rounded-xl border border-slate-200/80 bg-slate-50/70 p-3">
        <div class="flex items-center justify-between gap-2">
          <span class="flex items-center gap-1">
            <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${TYPE_NAME[lesson.kind] || '课次'}</span>
            ${lesson.transfer ? `<span class="rounded bg-amber-200/80 px-1.5 py-0.5 text-[12px] font-bold text-amber-900">[转] 受让课次</span>` : ''}
            ${(lesson.rescheduleCount || 0) >= 1 ? `<span class="rounded bg-slate-200 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">已挪位 1 次</span>` : ''}
          </span>
          <span class="text-[12px] font-medium text-slate-600">第 ${state.week + 1} 周 · ${fmtDot(lessonDate(state.week, lesson.day))}</span>
        </div>
        <div class="mt-2 text-[16px] font-bold text-slate-900">${esc(slotLabel(lesson.day, lesson.time, isGroup ? 2 : 1))}</div>
        ${isGroup
          ? `<div class="mt-1 flex flex-wrap items-center gap-1.5 text-[12px] font-medium text-slate-600">
              <span class="font-semibold text-slate-800">${esc(cls.name)}</span>
              <span class="text-slate-300">·</span>
              <span>${cls.enrolled}/${cls.capacity} 人</span>
              <span class="text-slate-300">·</span>
              <span>授课外教 ${esc(teacherName(cls.teacher))}</span>
            </div>`
          : lesson.kind === 'sub'
            ? `<div class="mt-1.5 rounded-lg border border-blue-200 bg-blue-50 px-2.5 py-2">
                <div class="flex items-center justify-between gap-2 text-[12px]">
                  <span class="font-medium text-slate-600">原任外教</span>
                  <span class="font-bold text-slate-900">${esc(teacherName(lesson.teacher))}</span>
                </div>
                <div class="mt-1 flex items-center justify-between gap-2 text-[12px]">
                  <span class="font-medium text-slate-600">代课外教</span>
                  <span class="font-bold text-slate-900">${esc(teacherName(lesson.actual))}</span>
                </div>
              </div>`
            : `<div class="mt-1 text-[12px] font-medium text-slate-600">任课外教 ${esc(teacherName(lesson.teacher))} · 30 分钟</div>`}
      </div>`;
    }

    function renderClassroomCard(lesson) {
      const room = lesson.teacher === 'linda' ? 'B-105' : (lesson.teacher === 'nina' ? 'A-203' : 'A-302');
      return `<div class="mt-2 rounded-xl border border-slate-200/80 bg-slate-50/70 p-2.5">
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="text-[12px] font-medium text-slate-600">ClassIn 教室</div>
            <div class="mt-0.5 font-mono text-[16px] font-bold text-slate-900">${room}</div>
          </div>
          <button data-action="copy-room" class="flex h-9 shrink-0 items-center gap-1 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">${icon('copy', 'h-3.5 w-3.5')}复制教室号</button>
        </div>
        <button data-action="enter-classin" class="mt-2 flex h-11 w-full items-center justify-center gap-1.5 rounded-xl bg-indigo-600 text-[16px] font-bold text-white transition hover:bg-indigo-700">${icon('external-link', 'h-4 w-4')}进入Classin</button>
      </div>`;
    }

    function renderCoursewareRow() {
      return `<a href="m1e_courseware.html" class="mt-2 flex items-center justify-between gap-2 rounded-xl border border-slate-200/80 bg-slate-50/70 px-3 py-2.5 transition hover:bg-slate-100">
        <span class="min-w-0">
          <span class="block text-[12px] font-medium text-slate-600">教材进度</span>
          <span class="mt-0.5 block truncate text-[14px] font-semibold text-slate-900">Oxford Discover 2 · Unit 3</span>
        </span>
        <span class="flex shrink-0 items-center gap-0.5 rounded-lg bg-indigo-50 px-2 py-1 text-[12px] font-bold text-indigo-700">查看课件${icon('chevron-right', 'h-3.5 w-3.5')}</span>
      </a>`;
    }

    function parentActionRow(action, iconName, title, desc, disabled, tone = '') {
      const danger = tone === 'danger';
      return `<button data-action="${action}" ${disabled ? 'disabled' : ''} class="flex min-h-12 w-full items-center gap-2.5 rounded-xl border px-3 py-2 text-left transition ${disabled ? 'cursor-not-allowed border-slate-200 bg-slate-50' : danger ? 'border-rose-200 bg-rose-50 hover:bg-rose-100' : 'border-slate-200 bg-white hover:bg-slate-50'}">
        <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg ${disabled ? 'bg-slate-100 text-slate-500' : danger ? 'bg-white text-rose-700' : 'bg-slate-100 text-slate-700'}">${icon(iconName, 'h-4 w-4')}</span>
        <span class="min-w-0 flex-1">
          <span class="block text-[14px] font-bold ${disabled ? 'text-slate-500' : danger ? 'text-rose-800' : 'text-slate-900'}">${esc(title)}</span>
          <span class="mt-0.5 block text-[12px] font-medium leading-snug ${disabled ? 'text-rose-600' : 'text-slate-600'}">${esc(desc)}</span>
        </span>
        ${disabled ? icon('lock', 'h-4 w-4 shrink-0 text-slate-500') : icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-500')}
      </button>`;
    }

    function parentLeaveAction(lesson) {
      const leave = leaveEligibility(lesson);
      const locked = !leave.ok;

    function renderTransferEntry(lesson, role = 'amy', studentKey = state.child) {

    function leaveCellsNow() {
      return (state.leaveCells && state.leaveCells.length) ? state.leaveCells : (state.lesson ? [state.lesson] : []);

    function renderLeavePanel() {
      const cells = leaveCellsNow();
      const first = cells[0];
      if (!first) return '';
      const studentKey = state.role === 'parent' ? state.child : (first.student || state.child);
      const quota = quotaFor(studentKey);
      const remain = Math.max(0, quota.limit - quota.used);
      const count = cells.length;

      const isTemp = first.kind === 'temp';
      const move = rescheduleEligibility(first);
      const transfer = transferEligibility(first);
      return `${sheetHeader('请假登记', `${slotLabel(first.day, first.time, count)} · 共 ${count} 节`)}
        <div class="rounded-xl border border-amber-300 bg-amber-50 p-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold text-amber-900">已用 ${quota.used} / 上限 ${quota.limit} · 剩余 ${remain} 次</span>
            <span class="rounded bg-white px-1.5 py-0.5 text-[12px] font-semibold text-amber-900">12.5% 配额</span>
          </div>
          <div class="mt-1.5 grid grid-cols-3 gap-1">
            <span class="rounded bg-white px-1.5 py-1 text-center text-[12px] font-semibold text-amber-900">已用 ${quota.used}</span>
            <span class="rounded bg-white px-1.5 py-1 text-center text-[12px] font-semibold text-amber-900">上限 ${quota.limit}</span>
            <span class="rounded bg-white px-1.5 py-1 text-center text-[12px] font-semibold text-amber-900">剩余 ${remain}</span>
          </div>

          <p class="text-[12px] font-semibold text-slate-800">请假范围：仅本次（临时课不跨周）</p>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">固定位：4 周契约，不支持请假；仅可使用【同师挪位】或【转让此课】。</p>
          <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">临时课：≥24h 且配额充足可请假，扣 1 次配额，TS 退回待排期，课格恢复空闲可约；3~24h 不可请假；&lt;3h 全锁。</p>
        </div>
        ${isTemp
          ? `<div class="mt-2 rounded-xl border ${eligibility.ok ? 'border-slate-200 bg-slate-50' : 'border-rose-200 bg-rose-50'} px-3 py-2">
              <p class="text-[12px] font-semibold leading-relaxed ${eligibility.ok ? 'text-slate-700' : 'text-rose-700'}">${esc(eligibility.reason)}</p>
              <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">临时课请假后 TS 回到待排期池，需另行选择时段重排。</p>
            </div>
            <button data-action="confirm-leave" ${eligibility.ok ? '' : 'disabled'} class="mt-3 flex h-11 w-full items-center justify-center gap-1 rounded-xl text-[16px] font-bold transition ${eligibility.ok ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'cursor-not-allowed bg-slate-200 text-slate-500'}">${icon(eligibility.ok ? 'check' : 'lock', 'h-4 w-4')}确认请假</button>`
          : `<div class="mt-2 rounded-xl border border-rose-200 bg-rose-50 p-3">
              <div class="flex items-center gap-1.5 text-[14px] font-bold text-rose-800">${icon('lock', 'h-4 w-4')}固定位不可请假</div>

            </div>
            <div class="mt-2 space-y-2">
              ${parentActionRow('start-reschedule', 'move-right', '同师挪位', move.reason, !move.ok)}

    /* ------------------------------------------------------------------
     * 预约抽屉
     * ------------------------------------------------------------------ */
    function bookingSlot() {
      if (state.target) return state.target;
      if (state.lesson) return { day: state.lesson.day, time: state.lesson.time };
      return null;
    }

    function canBookSixty() {
      const slot = bookingSlot();
      if (!slot) return { ok: false, reason: '' };
      const next = nextTime(slot.time);
      if (!next || toMin(next) >= GRID_END) return { ok: false, reason: '后半小时超出可约时间' };
      if (getSlot(slot.day, next).kind !== 'available') return { ok: false, reason: '后半小时已被占用' };
      if (state.role === 'parent' && state.credits[state.child] < 2) return { ok: false, reason: '剩余课时不足 2 节' };
      return { ok: true, reason: '' };
    }

    function renderBookingSheet() {
      const slot = bookingSlot();
      if (!slot) return '';
      const staff = isStaff();
      const canProxy = state.role === 'monitor' || state.role === 'admin';
      const sixty = canBookSixty();
      const duration = state.bookDuration;
      const teacher = staff ? activeTeacher() : TEACHERS.david;
      return `${sheetHeader(staff ? '代学员约课' : '临时预约', slotLabel(slot.day, slot.time, duration === 60 ? 2 : 1))}
        <div class="rounded-xl border border-slate-200/80 bg-slate-50/70 p-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-600">授课外教</span>
            <span class="text-[14px] font-bold text-slate-900">${esc(teacher.name)}</span>
          </div>
          <div class="mt-1 flex items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-600">上课时间</span>
            <span class="text-[14px] font-bold text-slate-900">${esc(slotLabel(slot.day, slot.time, duration === 60 ? 2 : 1))}</span>
          </div>
        </div>
        ${canProxy ? renderStaffStudentPick() : ''}
        <div class="mt-3 grid grid-cols-2 gap-2">
          <button data-action="set-duration" data-value="30" class="rounded-xl border p-2.5 text-left transition ${duration === 30 ? 'border-indigo-300 bg-indigo-50 ring-1 ring-indigo-100' : 'border-slate-200 bg-white'}">
            <span class="block text-[14px] font-bold text-slate-900">30 分钟</span>
            <span class="mt-0.5 block text-[12px] font-medium text-slate-600">1 节课时</span>
          </button>
          <button data-action="set-duration" data-value="60" ${sixty.ok ? '' : 'disabled'} class="rounded-xl border p-2.5 text-left transition ${duration === 60 ? 'border-indigo-300 bg-indigo-50 ring-1 ring-indigo-100' : 'border-slate-200 bg-white'} ${sixty.ok ? '' : 'cursor-not-allowed opacity-60'}">
            <span class="block text-[14px] font-bold text-slate-900">60 分钟</span>
            <span class="mt-0.5 block text-[12px] font-medium text-slate-600">连约 2 节课时</span>
          </button>
        </div>
        ${!sixty.ok ? `<p class="mt-1.5 text-[12px] font-medium text-slate-500">60 分钟不可选：${esc(sixty.reason)}</p>` : ''}
        ${state.role === 'parent' ? `<p class="mt-2 text-[12px] font-medium text-slate-600">确认后扣减 ${duration === 60 ? 2 : 1} 节课时，剩余 ${state.credits[state.child] - (duration === 60 ? 2 : 1)} 节</p>` : ''}
        <button data-action="confirm-book" class="mt-3 flex h-11 w-full items-center justify-center gap-1 rounded-xl bg-indigo-600 text-[16px] font-bold text-white transition hover:bg-indigo-700">${icon('calendar-check', 'h-4 w-4')}确认预约</button>
        ${canProxy ? `<button data-action="confirm-lock-slot" class="mt-2 flex h-10 w-full items-center justify-center gap-1 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold text-slate-700 transition hover:bg-slate-50">${icon('lock', 'h-4 w-4')}锁定时段 / 设为不可约</button>` : ''}`;
    }

    function renderStaffStudentPick() {
      return `<div class="mt-2 rounded-xl border border-slate-200/80 bg-slate-50/70 p-2.5">
        <div class="text-[12px] font-semibold text-slate-600">选择学员</div>
        <div class="mt-1.5 grid grid-cols-3 gap-1.5">
          ${['alice', 'bob', 'charlie'].map((key) => {
            const on = state.staffStudent === key;
            return `<button data-action="pick-staff-student" data-key="${key}" class="h-9 rounded-lg border text-[12px] font-bold transition ${on ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-700'}">${esc(STUDENTS[key].short)}</button>`;
          }).join('')}
        </div>
      </div>`;

    /* ------------------------------------------------------------------

      if (state.panel === 'sub') return renderSubPanel();
      if (state.panel === 'attendance') return renderAttendancePanel();
      if (state.panel === 'withdraw') return renderWithdrawPanel();
      if (state.panel === 'proxy') return renderProxyPanel();

      if (!lesson) return '';

      const student = STUDENTS[lesson.student];
      const pair = !isGroup && state.role !== 'teacher' ? pairFor(lesson) : null;
      return `${sheetHeader(isGroup ? '小班教学管理' : '教学管理', slotLabel(lesson.day, lesson.time, isGroup ? 2 : 1))}
        ${pair ? renderPairBox(pair, true) : ''}
        ${renderLessonInfo(lesson)}
        ${isGroup ? renderGroupStaffActions(lesson) : renderStaffActions(lesson)}
        ${!isGroup && state.role === 'teacher' ? `<button data-action="enter-classin" class="mt-2 flex h-11 w-full items-center justify-center gap-1.5 rounded-xl bg-indigo-600 text-[14px] font-bold text-white transition hover:bg-indigo-700">${icon('external-link', 'h-4 w-4')}进入Classin</button>` : ''}
        ${isGroup ? '' : `<div class="mt-2 flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">

          <span class="block truncate text-[14px] font-bold text-slate-900">异常处理</span>

        ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-500')}
      </a>`;

    function renderStaffActions(lesson) {
      if (state.role === 'teacher') {
        return `<div class="mt-2.5 space-y-2">
          ${actionRow('start-attendance', 'clipboard-check', '考勤打卡', '正常出勤 / 学员旷课 / 外教旷课', '')}
          ${actionRow('start-teacher-report', 'calendar-x', '申请请假 / 突发状况报备', '当天时段多选 · 1~12 节 · 不可抗力分类', '')}
        </div>`;
      }
      const transfer = transferEligibility(lesson);
      return `<div class="mt-2.5 space-y-2">
        ${actionRow('start-sub', 'user-check', '代课委任', '选择 Elena / Linda / Nina 代课', '')}
        ${actionRow('start-attendance', 'clipboard-check', '考勤打卡', '记录本节出勤情况', '')}
        ${renderStaffExceptionEntry(lesson)}
        ${state.role === 'admin' && lesson.kind === 'temp' && state.hours < 3 ? actionRow('start-channel-b', 'shield-alert', '通道 B：非常规特批急病请假', '突破时限与配额 · 必填 ≥10 字原因', 'danger') : ''}
        ${actionRow('start-proxy', 'user-cog', '代学员请假 / 调课', '按 M3B 校验配额、时限与同师窗口', '')}
        ${actionRow('start-withdraw', 'undo-2', '撤排 / 退回课时', '释放时段并退回 1 节课时', 'danger')}
        ${transfer.visible
          ? (transfer.ok
            ? `<a id="staffTransferEntry" href="${m3cSlotUrl(lesson, 'leo', lesson.student)}" class="flex h-12 w-full items-center gap-2.5 rounded-xl border border-slate-200 bg-white px-3 text-left transition hover:bg-slate-50">
                <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-slate-100 text-slate-700">${icon('repeat-2', 'h-4 w-4')}</span>
                <span class="min-w-0 flex-1"><span class="block truncate text-[14px] font-bold text-slate-900">代办转让</span><span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">带参进入 M3C（role=leo）</span></span>
                ${icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-500')}
              </a>`
            : actionRow('noop', 'repeat-2', '代办转让', transfer.reason, '', true))
          : ''}

    function renderGroupStaffActions(lesson) {

          ${actionRow('start-teacher-report', 'calendar-x', '申请请假 / 突发状况报备', '当天时段多选 · 1~12 节 · 不可抗力分类', '')}
        </div>`;

      const canSub = state.hours >= 0.25 && candidates.length > 0;

        ${actionRow('start-attendance', 'clipboard-check', '考勤打卡', '记录整班出勤情况', '')}
        <div class="rounded-xl border border-rose-200 bg-rose-50 p-3">
          <div class="flex items-center gap-1.5 text-[14px] font-bold text-rose-800">${icon('zap-off', 'h-4 w-4')}小班主理人应急停电处置包</div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-rose-700">外教突发停电/断网不可抗力；停电场景放宽至开课前 ≥15 分钟，家长由主理人微信群闭环通知。</p>
          <button data-action="start-sub" ${canSub ? '' : 'disabled'} class="mt-2 flex min-h-12 w-full items-center gap-2.5 rounded-xl border border-rose-200 bg-white px-3 py-2 text-left transition ${canSub ? 'hover:bg-rose-100' : 'cursor-not-allowed opacity-60'}">

        </div>
      </div>`;

      const list = [];

        if (slot.lesson) {
          status = slot.lesson.kind === 'group' ? '排课 · 小班' : '排课';
        } else if (slot.kind === 'rest') {
          status = '休息';
        } else if (slot.kind === 'leave') {
          status = '请假';

        list.push({ day, time, status, lesson: slot.lesson, kind: slot.kind });
      });
      return list;

    /* ------------------------------------------------------------------

      state.leaveCells = [];

        state.drawer = 'parent-lesson';

        state.lesson = findBaseLesson(0, '18:30');
        state.drawer = 'parent-lesson';

        state.hours = 8;
        state.lesson = findBaseLesson(4, '18:00');

        state.drawer = 'parent-lesson';

        state.drawer = 'parent-lesson';

    function armFlashTimers() {
      clearFlashTimers();
      flashTimerA = window.setTimeout(() => {

      state.toast = message;
      render(true);
      window.clearTimeout(toastTimer);

        state.toast = '';

    function requireOnline() {
      if (state.online) return true;
      showToast('当前为离线只读，暂不可提交');
      return false;

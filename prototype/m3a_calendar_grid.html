    }

    function renderLeavePanel() {
      const cells = leaveCellsNow();
      const first = cells[0];
      if (!first) return '';
      const count = cells.length;
      const eligibility = leaveEligibility(first);
      const gentle = !!eligibility.gentle;
      const blocked = !eligibility.ok;
      return `${sheetHeader('请假登记', `${slotLabel(first.day, first.time, count)} · 共 ${count} 节`)}
        <div class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
          <div class="text-[14px] font-bold text-slate-900">请假即释放已排时段</div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">本节课退回待排期池，可重新选择时段；确认后课格恢复为空闲可约。</p>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">${first.kind === 'fixed'
            ? '固定位与临时课均可请假退期待排；同日连续 2～4 节支持合并请假。'
            : '临时课与代课课次均可直接请假退期待排。'}</p>
          <p class="mt-1 rounded-lg border border-slate-200 bg-white px-2 py-1 text-[12px] font-medium leading-relaxed text-slate-600">请假额度 <span class="font-bold text-slate-800">0.125</span> 仅作非阻断软参考提示，已取消 12.5% 硬拦截，不会因超额禁止请假。</p>
        </div>
        <div class="mt-2 rounded-xl border px-3 py-2 ${blocked ? 'border-rose-200 bg-rose-50' : gentle ? 'border-amber-300 bg-amber-50' : 'border-slate-300 bg-slate-50/70'}">
          <p class="text-[12px] font-semibold leading-relaxed ${blocked ? 'text-rose-700' : gentle ? 'text-amber-900' : 'text-slate-700'}">${esc(eligibility.reason)}</p>
          ${blocked && state.role === 'parent' ? `<button type="button" data-action="open-monitor-wechat" class="mt-2 inline-flex h-8 items-center gap-1 rounded-lg border border-rose-300 bg-white px-2.5 text-[12px] font-bold text-rose-800 hover:bg-rose-100/50">💬 联系班长微信</button>` : ''}
        </div>
        <button data-action="confirm-leave" ${blocked ? 'disabled' : ''} class="mt-3 flex h-11 w-full items-center justify-center gap-1 rounded-xl text-[16px] font-bold transition ${blocked ? 'cursor-not-allowed bg-slate-200 text-slate-500' : 'bg-indigo-600 text-white hover:bg-indigo-700'}">${icon('check', 'h-4 w-4')}确认请假</button>
        ${backRow()}`;
    }

    /* ------------------------------------------------------------------
     * 预约抽屉
     * ------------------------------------------------------------------ */
    function bookingSlot() {
      if (state.target) return state.target;
      if (state.lesson) return { day: state.lesson.day, time: state.lesson.time };
      return null;
    }

    function studentCredits(key) {
      if (state.credits[key] != null) return state.credits[key];
      return STUDENTS[key] ? Number(STUDENTS[key].credits || 0) : 0;
    }

    function bookingTimes(startTime, count = 1) {
      const list = [];
      let cur = startTime;
      for (let i = 0; i < count; i += 1) {
        if (!cur || toMin(cur) >= gridEndMin()) break;
        list.push(cur);
        cur = nextTime(cur);
      }
      return list;
    }

    function studentBusyAt(studentKey, day, times) {
      for (let i = 0; i < times.length; i += 1) {
        const time = times[i];
        const list = slotLessons(day, time);
        if (list.some((item) => item.student === studentKey && item.kind !== 'leave' && item.kind !== 'rest')) return time;
        const prev = prevTime(time);
        if (prev && slotLessons(day, prev).some((item) => item.student === studentKey
          && item.kind === 'group'
          && (item.dur || 2) > 1)) return time;
      }
      return '';
    }

    function parseStandardNick(raw) {
      const value = String(raw || '').trim();
      const match = /^([A-Za-z]{1,24})([A-Z])(\d{1,2})([a-z0-9]{0,3})$/.exec(value);
      if (!match) return null;
      const age = Number(match[3]);
      if (age < 1 || age > 99) return null;
      return {
        name: value,
        englishName: match[1],
        initial: match[2],
        age,
        suffix: match[4] || ''
      };
    }

    function canBookCount(count) {
      const slot = bookingSlot();
      if (!slot) return { ok: false, reason: '' };
      const times = bookingTimes(slot.time, count);
      if (times.length < count) return { ok: false, reason: '超出当日可约结束时间' };
      const staff = isStaff();
      const studentKey = staff ? state.staffStudent : state.child;
      const student = STUDENTS[studentKey];
      if (!staff && !inParentBookWindow(slot.day)) {
        return { ok: false, reason: '仅支持预约未来 1~7 天' };
      }
      const studentBusy = studentBusyAt(studentKey, slot.day, times);
      if (studentBusy) {
        return { ok: false, reason: `${studentBusy} ${staff ? '学员' : '孩子'}已有课` };
      }
      if (!staff) {
        const tier = Number(state.bookTier);
        if (!tier) return { ok: false, reason: '暂无可用待排课次，请联系班长购课' };
        const tierAvail = studentTempTierCredits(studentKey, tier);
        if (tierAvail < count) return { ok: false, reason: '该价位待排课次不足' };
        if (isHallParent()) {
          if (Number(tier) !== teacherTier(state.teacher)) return { ok: false, reason: '仅可按该老师当前价位预约' };
          for (let index = 0; index < times.length; index += 1) {
            const time = times[index];
            if (!teacherOpen(state.teacher, slot.day, time)) return { ok: false, reason: `${time} 该老师不可约` };
            if (!teacherFreeAt(state.teacher, slot.day, time)) return { ok: false, reason: `${time} 该老师已有课` };
          }
          return { ok: true, reason: '' };
        }
        const hasTeacher = freeTeachersFor(slot.day, slot.time, count, tier).some((item) => item.available);
        if (!hasTeacher) return { ok: false, reason: `无连续 ${count} 节空闲老师` };
        return { ok: true, reason: '' };
      }
      for (let index = 0; index < times.length; index += 1) {
        const time = times[index];
        if (!teacherOpen(state.teacher, slot.day, time)) return { ok: false, reason: `${time} 老师未开放` };
        if (!teacherFreeAt(state.teacher, slot.day, time)) return { ok: false, reason: `${time} 老师已有课` };
      }
      const avail = studentCredits(studentKey);
      const canProxy = state.role === 'monitor' || state.role === 'admin';
      if (avail < count && !(canProxy && state.quickTrialOrderSync && state.proxyPaymentConfirmed)) {
        return { ok: false, reason: avail < count && state.quickTrialOrderSync ? '请先勾选确认已收款' : `学员待排 TS 不足 ${count} 节` };
      }
      return { ok: true, reason: '' };
    }

    function canBookSixty() {
      return canBookCount(2);
    }

    function shortBookReason(reason) {
      const text = String(reason || '');
      if (text.includes('该价位待排')) return '该价位待排课次不足';
      if (text.includes('无连续')) {
        const match = text.match(/无连续\s*(\d+)\s*节/);
        return match ? `无连续 ${match[1]} 节空闲老师` : '无空闲老师';
      }
      if (text.includes('孩子已有课')) return '孩子已有课';
      if (text.includes('学员已有课')) return '学员有课';
      if (text.includes('超出')) return '超时段';
      if (text.includes('未开放') || text.includes('老师已有课')) return '老师无空';
      if (text.includes('1~7 天')) return '窗口外';
      if (text.includes('暂无可用待排')) return '待排课次不足';
      return '不可约';
    }

    function parentTierOptions(studentKey) {
      const buckets = studentTempBuckets(studentKey);
      return PRICE_TIERS
        .map((tier) => ({ tier, remain: Number(buckets[tier] || 0) }))
        .filter((item) => item.remain > 0);
    }

    function normalizeBookTier(studentKey) {
      const options = parentTierOptions(studentKey);
      const current = Number(state.bookTier);
      if (!options.some((item) => item.tier === current)) {
        state.bookTier = options.length ? options[0].tier : null;
      }
      return state.bookTier;
    }

    function renderParentTierPick(studentKey) {
      const options = parentTierOptions(studentKey);
      const selected = normalizeBookTier(studentKey);
      return `<div class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[14px] font-bold text-slate-900">① 选择价位</span>
          <span class="shrink-0 text-[12px] font-medium text-slate-600">严格同价位匹配</span>
        </div>
        ${options.length ? `<div class="mt-1.5 flex flex-wrap items-center gap-1.5">
          ${options.map((item) => {
            const on = Number(selected) === item.tier;
            return `<button type="button" data-action="set-book-tier" data-value="${item.tier}" class="h-8 shrink-0 whitespace-nowrap rounded-full px-3 text-[12px] transition ${on ? 'border-0 bg-slate-900 font-semibold text-white' : 'border-0 bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${item.tier}积分 (余${item.remain}节)</button>`;
          }).join('')}
        </div>` : `<p class="mt-1.5 rounded-lg border border-amber-300 bg-amber-50 px-2.5 py-2 text-[12px] font-semibold leading-relaxed text-amber-900">暂无可用待排课次，请联系班长购课</p>`}
      </div>`;
    }

    function renderParentTeacherPick(freeTeachers, selectedKey, count, windowOk) {
      if (!windowOk) {
        return `<div class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold text-slate-900">授课老师</span>
            <span class="shrink-0 text-[12px] font-medium text-slate-600">今天不可约</span>
          </div>
          <p class="mt-2 rounded-lg border border-amber-300 bg-amber-50 px-2.5 py-2 text-[12px] font-semibold leading-relaxed text-amber-900">仅支持预约未来 1~7 天，请选择明天及之后的空闲时段。</p>
        </div>`;
      }
      const q = (state.bookTeacherSearch || '').trim();
      const lower = q.toLowerCase();
      const available = freeTeachers.filter((item) => item.available);
      const recommendedKey = available.length ? available[0].key : '';
      const matched = q
        ? freeTeachers.filter((item) => item.name.toLowerCase().includes(lower) || item.short.toLowerCase().includes(lower))
        : available;
      const selectedTier = Number(state.bookTier);
      const tierRemain = selectedTier ? studentTempTierCredits(state.child, selectedTier) : 0;
      return `<div class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
        <div class="flex items-center justify-between gap-2">
          <span class="shrink-0 text-[14px] font-bold text-slate-900">③ 授课老师</span>
          <span class="shrink-0 text-[12px] font-medium text-slate-600">熟客 → 同价位 → 负荷</span>
        </div>
        <div class="mt-1.5 rounded-lg border border-indigo-200 bg-indigo-50/70 px-2.5 py-1.5 text-[12px] font-semibold text-indigo-900">
          ${selectedTier ? `${selectedTier}积分 · 剩余 ${tierRemain} 节（严格同价位匹配）` : '暂无可用待排课次'}
        </div>
        <div class="relative mt-2">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
          <input type="text" data-book-teacher-search value="${esc(state.bookTeacherSearch)}" placeholder="按老师姓名搜索" class="h-10 w-full rounded-xl border border-slate-200 bg-slate-50/70 pl-9 pr-8 text-[14px] font-medium text-slate-900 placeholder:text-slate-500 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/15">
          ${q ? `<button type="button" data-action="clear-book-teacher-search" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-700">${icon('x', 'h-4 w-4')}</button>` : ''}
        </div>
        <div class="mt-2 space-y-1.5">
          ${matched.length ? matched.map((teacher) => {
            const on = selectedKey === teacher.key && teacher.available;
            const isRecommended = recommendedKey === teacher.key;
            return `<button type="button" data-action="pick-book-teacher" data-key="${teacher.key}" ${teacher.available ? '' : 'disabled'} class="flex w-full items-center gap-2 rounded-xl border px-2.5 py-2 text-left transition ${teacher.available ? (on ? 'border-indigo-300 bg-indigo-50 ring-1 ring-indigo-100' : 'border-slate-200 bg-white hover:bg-slate-50') : 'cursor-not-allowed border-slate-200 bg-slate-100 opacity-80'}">
              <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg ${on ? 'bg-white text-indigo-700' : 'bg-slate-100 text-slate-700'} text-[12px] font-bold">${teacher.initial}</span>
              <span class="min-w-0 flex-1">
                <span class="flex flex-wrap items-center gap-1">
                  <span class="truncate text-[14px] font-bold ${on ? 'text-indigo-800' : teacher.available ? 'text-slate-900' : 'text-slate-500'}">${esc(teacher.name)}</span>
                  ${teacher.taught ? `<span class="shrink-0 rounded border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">教过</span>` : ''}
                  ${isRecommended ? `<span class="shrink-0 rounded border border-indigo-200 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">推荐</span>` : ''}
                </span>
                <span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">${esc(teacher.tierLabel)} · 本周已排 ${teacher.load} 节</span>
                ${teacher.available ? '' : `<span class="mt-0.5 block truncate text-[12px] font-bold text-rose-700">${esc(teacher.reason)}</span>`}
              </span>
              <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 bg-white'}">${on ? icon('check', 'h-3 w-3') : ''}</span>
            </button>`;
          }).join('') : `<p class="rounded-lg border border-amber-300 bg-amber-50 px-2.5 py-2 text-[12px] font-semibold leading-relaxed text-amber-900">${q ? `没有匹配“${esc(q)}”的老师` : `当前时段无匹配价位且连续 ${count} 节空闲的老师`}</p>`}
        </div>
        ${q ? '' : `<p class="mt-1.5 text-[12px] font-medium text-slate-600">默认仅展示连续 ${count} 节全程空闲且价位匹配的老师</p>`}
      </div>`;
    }

    function renderBookingSheet() {
      const slot = bookingSlot();
      if (!slot) return '';
      const staff = isStaff();
      const hallLocked = isHallParent();
      const canProxy = state.role === 'monitor' || state.role === 'admin';
      const count = Math.max(1, Math.min(4, Math.round((state.bookDuration || 30) / 30)));
      const windowOk = staff || inParentBookWindow(slot.day);
      const tierOptions = staff ? [] : parentTierOptions(state.child);
      if (!staff && hallLocked) {
        const targetTier = state.teacher ? teacherTier(state.teacher) : null;
        if (targetTier && studentTempTierCredits(state.child, targetTier) > 0) state.bookTier = targetTier;
      }
      const bookTier = staff ? null : normalizeBookTier(state.child);
      const freeTeachers = staff ? [] : freeTeachersFor(slot.day, slot.time, count, bookTier);
      const availableTeachers = windowOk ? freeTeachers.filter((item) => item.available) : [];
      let teacherKey = staff ? state.teacher : (hallLocked ? state.teacher : (windowOk ? state.bookTeacher : ''));
      if (!staff && !hallLocked && windowOk && !availableTeachers.some((item) => item.key === teacherKey)) {
        teacherKey = availableTeachers.length ? availableTeachers[0].key : '';
      }
      if (!hallLocked && !staff && state.bookTeacher !== teacherKey) state.bookTeacher = teacherKey;
      if (hallLocked) state.bookTeacher = state.teacher;
      const teacher = teacherKey ? TEACHERS[teacherKey] : null;
      const pickedStudent = canProxy ? STUDENTS[state.staffStudent] : STUDENTS[state.child];
      const availCredits = pickedStudent ? studentCredits(pickedStudent.key) : 0;
      const needOrderSync = canProxy && availCredits < count;
      const showOrderSync = canProxy && (needOrderSync || state.quickTrialOrderSync);
      const syncActive = canProxy && state.quickTrialOrderSync;
      const teacherPriceTier = teacher ? teacher.priceTier : 18;
      const totalSyncPoints = count * teacherPriceTier;
      const check = canBookCount(count);
      const noTier = !staff && windowOk && !tierOptions.length;
      const confirmDisabled = !windowOk || noTier || !check.ok || !teacher || (canProxy && !pickedStudent) || (syncActive && !state.proxyPaymentConfirmed);
      const confirmReason = !windowOk
        ? '仅支持预约未来 1~7 天'
        : noTier
          ? '暂无可用待排课次，请联系班长购课'
          : !teacher
            ? `当前时段无连续 ${count} 节空闲老师`
            : (syncActive && !state.proxyPaymentConfirmed)
              ? '请先勾选下方“我已确认线下收到家长本次课次费用”'
              : check.reason;
      const parentTierAvail = (!staff && bookTier && pickedStudent) ? studentTempTierCredits(pickedStudent.key, bookTier) : 0;
      const durOptions = [1, 2, 3, 4].map((n) => {
        const option = canBookCount(n);
        const mins = n * 25;
        const on = count === n;
        return `<button data-action="set-duration" data-value="${n * 30}" ${option.ok ? '' : 'disabled'} title="${esc(option.reason)}" class="rounded-xl border px-2 py-2 text-center transition ${on ? 'border-indigo-300 bg-indigo-50 ring-1 ring-indigo-100' : 'border-slate-200 bg-white'} ${option.ok ? '' : 'cursor-not-allowed opacity-55'}">
          <span class="block text-[14px] font-bold text-slate-900">${n} 节</span>
          <span class="mt-0.5 block text-[12px] font-medium text-slate-500">${mins}分钟</span>
          ${option.ok ? '' : `<span class="mt-0.5 block text-[12px] font-semibold leading-tight text-rose-700">${esc(shortBookReason(option.reason))}</span>`}
        </button>`;
      }).join('');
      return `${sheetHeader(staff ? '代学员约课' : '临时预约', slotLabel(slot.day, slot.time, count))}
        ${staff ? `<div class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-600">授课老师</span>
            <span class="text-[14px] font-bold text-slate-900">${esc(activeTeacher().name)}</span>
          </div>
          <div class="mt-1 flex items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-600">上课安排</span>
            <span class="text-[14px] font-bold text-slate-900">${esc(slotLabel(slot.day, slot.time, count))}</span>
          </div>
        </div>` : renderParentTierPick(state.child)}
        ${canProxy ? renderStaffStudentPick() : ''}
        <div class="mt-3">
          <div class="mb-1.5 flex items-center justify-between">
            <span class="text-[12px] font-semibold text-slate-600">${staff ? '' : '② '}连约节数（每节 25 分钟含 5 分钟课间）</span>
          </div>
          <div class="grid grid-cols-4 gap-1.5">${durOptions}</div>
        </div>
        ${staff ? '' : hallLocked
          ? `<div class="mt-2.5 rounded-xl border border-indigo-200 bg-indigo-50 p-3" data-role="hall-teacher-locked">
              <div class="flex items-center justify-between gap-2">
                <span class="text-[12px] font-semibold text-indigo-900">② 本次预约老师（已锁定）</span>
                <span class="shrink-0 rounded bg-white px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">不可切换</span>
              </div>
              <div class="mt-1.5 flex items-center gap-2">
                <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-white text-[12px] font-bold text-indigo-700">${teacher ? teacher.initial : '—'}</span>
                <span class="min-w-0 flex-1">
                  <span class="block truncate text-[14px] font-bold text-indigo-900">${esc(teacher ? teacher.name : '未匹配老师')}</span>
                  <span class="block truncate text-[12px] font-medium text-indigo-700">${esc(teacher ? teacher.tierLabel : '')} · 本次仅可预约该老师</span>
                </span>
              </div>
            </div>`
          : `<div class="mt-2.5">${renderParentTeacherPick(freeTeachers, teacherKey, count, windowOk)}</div>`}
        ${!windowOk ? `<p class="mt-2.5 rounded-xl border border-amber-300 bg-amber-50 px-3 py-2 text-[12px] font-semibold leading-relaxed text-amber-900">仅支持预约未来 1~7 天，今天与 7 天外时段不可约。</p>` : ''}
        ${state.role === 'parent' && windowOk && !tierOptions.length ? `<div class="mt-2 rounded-lg border border-amber-300 bg-amber-50 px-2.5 py-2">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-amber-900">暂无可用待排课次，请联系班长购课</span>
            <a href="m2a_course_orders.html" class="shrink-0 text-[12px] font-semibold text-indigo-600">去购课 →</a>
          </div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-amber-900">如无可匹配价位时段，可联系负责班长协调选师或另行购课。</p>
          <button type="button" data-action="open-monitor-wechat" class="mt-1.5 inline-flex h-8 items-center gap-1 rounded-lg border border-amber-300 bg-white px-2.5 text-[12px] font-bold text-amber-900">💬 联系班长微信</button>
        </div>` : ''}
        ${state.role === 'parent' && windowOk && tierOptions.length && !availableTeachers.length ? `<div class="mt-2 rounded-lg border border-amber-300 bg-amber-50 px-2.5 py-2">
          <p class="text-[12px] font-medium leading-relaxed text-amber-900">当前价位与节数下暂无连续空闲老师，可调整节数 / 价位 / 时段，或联系负责班长协调。</p>

              <span class="block truncate text-[14px] font-bold text-rose-800">异常未上课回退补生</span>
              <span class="block truncate text-[12px] font-medium text-rose-700">资金持有人 ≠ 老师负责班长时 · 第 2 层只读，第 3 层单独解锁</span>
            </span>
          </button>
        </div>` : `<p class="mt-1.5 text-[12px] font-medium text-slate-500">注：若您为该笔课次「原资金持有人班长」，在开课后且双重财务未冻结时将单独解锁第 3 层【异常未上课回退补生】。</p>`}
      </div>`;
    }

    function renderCrossRescueSheet() {
      const lesson = state.lesson;
      if (!lesson) return '';
      const isGroup = lesson.kind === 'group';
      return `<div data-role="cross-rescue">
        ${sheetHeader('跨组紧急驰援', slotLabel(lesson.day, lesson.time, isGroup ? 2 : 1))}
        ${crossOwnerBanner('rescue', lesson)}
        ${renderLessonInfo(lesson)}
        <div class="mt-1.5 rounded-xl border border-rose-200 bg-rose-50 px-2.5 py-2">
          <p class="text-[12px] font-bold text-rose-900">急救通道 · 仅作用于当节（不足 3 小时）</p>
          <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-rose-800">严格逐节校验 &lt;3h 边界，严禁连带修改跨过 3 小时的后续节次；提交前将弹出温和确认。操作成功后完整写入【经办记录】与 TS 流转日志，并向原负责班长/主理人发送 M4 站内中性知会。</p>
        </div>
        <div class="mt-2 grid grid-cols-2 gap-2">
          ${coordTile('start-sub', 'user-check', '指派 / 撤销代课', '当节急救代课')}
          ${isGroup
            ? coordTile('start-sub', 'calendar-x', '暂停待排', '小班路线 B · 不扣学员课次')
            : coordTile('coord-leave', 'calendar-x', '&lt;3h 退回待排期', 'TS 退回待排池')}
          ${coordTile('coord-reschedule', 'move-right', '&lt;3h 同师挪位', '仅当节同师平移')}
          ${coordTile('start-attendance', 'clipboard-check', '急救考勤', '旷课 / 迟到 / 早退')}
        </div>
        <div class="mt-2 grid grid-cols-2 gap-2">
          ${coordTile('coord-teacher-leave', 'calendar-clock', '代老师请假', '当节挂起待代')}
          ${isGroup
            ? coordTile('start-class-dissolve', 'users', '小班解散', '跨组换人/解散不开放', true)
            : coordTile('start-change-student', 'arrow-left-right', '换上课学员', '跨组换人不开放', true)}
          ${coordTile('confirm-open-slot', 'sun', '加开时段', '跨组救援不开放', true)}
        </div>
        <p class="mt-2 rounded-lg border border-rose-200 bg-white px-2.5 py-2 text-[12px] font-medium leading-relaxed text-rose-800">系统不在 &lt;3h 设额外线上申诉流：若事后核对存在争议，直接依据经办记录与 TS 状态日志在 M5B / 管理员后台及线下追责处置。</p>
        <div class="mt-2 grid grid-cols-2 gap-2">
          <a href="m3a_calendar_grid.html?role=monitor&teacher=${esc(lesson.teacher)}" class="flex h-10 items-center justify-center gap-1 rounded-lg border border-slate-300 bg-white text-[12px] font-bold text-slate-800">老师课表</a>
          ${isGroup
            ? `<a href="m1c_classes.html" class="flex h-10 items-center justify-center gap-1 rounded-lg border border-teal-200 bg-teal-50 text-[12px] font-bold text-teal-800">小班详情</a>`
            : `<a href="m1a_student_profile.html" class="flex h-10 items-center justify-center gap-1 rounded-lg border border-slate-300 bg-white text-[12px] font-bold text-slate-800">学员档案</a>`}
        </div>
      </div>`;
    }

    function renderStaffLessonSheet() {
      if (state.role !== 'teacher') {
        if (state.lesson && isCrossReadonlyLesson(state.lesson)) return renderCrossReadonlySheet();
        if (state.lesson && isCrossRescueLesson(state.lesson)) {
          if (state.panel === 'sub') return `<div data-role="cross-rescue">${crossOwnerBanner('rescue', state.lesson)}${renderCoordSubPanel()}</div>`;
          if (state.panel === 'attendance') return `<div data-role="cross-rescue">${crossOwnerBanner('rescue', state.lesson)}${renderCoordAttendancePanel()}</div>`;
          return renderCrossRescueSheet();
        }
        if (state.panel === 'leave-move') return renderCoordLeaveMovePanel();
        if (state.panel === 'sub') return renderCoordSubPanel();
        if (state.panel === 'attendance') return renderCoordAttendancePanel();
        if (state.panel === 'withdraw') return renderWithdrawPanel();
        if (state.panel === 'change-student') return renderChangeStudentPanel();
        if (state.panel === 'exception-backfill') return renderExceptionBackfillPanel();
        return renderCoordSummarySheet();
      }
      if (state.panel === 'attendance') return renderAttendancePanel();
      const lesson = state.lesson;
      if (!lesson) return '';
      const isGroup = lesson.kind === 'group';
      const student = STUDENTS[lesson.student];
      return `${sheetHeader(isGroup ? '小班教学管理' : '教学管理', slotLabel(lesson.day, lesson.time, isGroup ? 2 : 1))}
        ${renderLessonInfo(lesson)}
        ${isGroup ? renderClassLearningCard(lesson.classId, { open: state.classNoteOpen, archived: state.classArchived, action: 'class-note-toggle' }) : renderStudentLearningCard(lesson)}
        ${renderTeacherActions(lesson, isGroup)}
        ${!isGroup ? `<button data-action="enter-classin" class="mt-2 flex h-11 w-full items-center justify-center gap-1.5 rounded-xl bg-indigo-600 text-[14px] font-bold text-white transition hover:bg-indigo-700">${icon('external-link', 'h-4 w-4')}进入Classin</button>` : ''}
        ${isGroup ? '' : `<div class="mt-2 flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-white text-[14px]">${student.emoji}</span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-[14px] font-semibold text-slate-900">${esc(student.name)}</span>
            <span class="block text-[12px] font-medium text-slate-600">${student.age} 岁 · ${esc(student.status || '在读')}</span>
          </span>
          <span class="flex shrink-0 items-center gap-2">
            <a href="m1a_student_profile.html" class="text-[12px] font-semibold text-indigo-600">学员档案</a>
          </span>
        </div>`}`;
    }

    function renderTeacherActions(lesson, isGroup) {
      const started = hasLessonStarted(lesson);
      return `<div class="mt-2.5 space-y-2">
        ${actionRow('start-attendance', 'clipboard-check', '考勤打卡', started ? (isGroup ? '记录整班出勤情况' : '正常出勤 / 学员旷课') : '尚未到开课时间（请走请假报备）', '', !started)}
        ${actionRow('start-teacher-report', 'calendar-x', '申请请假 / 突发状况报备', '当天 1～12 格 · 跨度最长 6h · 按 4 节切段', '')}
      </div>`;
    }

    function actionRow(action, iconName, title, desc, tone, disabled = false) {
      return `<button data-action="${action}" ${disabled ? 'disabled' : ''} class="flex h-12 w-full items-center gap-2.5 rounded-xl border px-3 text-left transition ${disabled ? 'cursor-not-allowed border-slate-200 bg-slate-50' : tone === 'danger' ? 'border-rose-200 bg-rose-50 hover:bg-rose-100' : 'border-slate-200 bg-white hover:bg-slate-50'}">
        <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg ${disabled ? 'bg-slate-100 text-slate-500' : tone === 'danger' ? 'bg-white text-rose-700' : 'bg-slate-100 text-slate-700'}">${icon(iconName, 'h-4 w-4')}</span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-[14px] font-bold ${disabled ? 'text-slate-500' : tone === 'danger' ? 'text-rose-800' : 'text-slate-900'}">${title}</span>
          <span class="mt-0.5 block truncate text-[12px] font-medium ${disabled ? 'text-slate-600' : tone === 'danger' ? 'text-rose-700' : 'text-slate-600'}">${desc}</span>
        </span>
        ${disabled ? icon('lock', 'h-4 w-4 shrink-0 text-slate-500') : icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-500')}
      </button>`;
    }

    /* ------------------------------------------------------------------
     * 班长 / 管理员 · 3 层紧凑课格抽屉
     * ------------------------------------------------------------------ */
    function coordScope() {
      const lesson = state.lesson;
      if (!lesson) return [];
      if (isCrossGroupLesson(lesson)) return [lesson];
      const pair = pairFor(lesson);
      if (!pair || state.pairLink === false) return [lesson];
      const selected = pair.filter((item) => state.pairSel[item.time] !== false);
      const list = selected.length ? selected : [lesson];
      return list.slice().sort((a, b) => toMin(a.time) - toMin(b.time));
    }

    function coordScopeLabel(scope) {
      if (!scope.length) return '';
      const first = scope[0];
      const last = scope[scope.length - 1];
      const endT = last.kind === 'group' ? endTime(last.time, last.dur || 2) : endTime(last.time);
      return `${dayLabel(first.day)} ${first.time} - ${endT} · ${scope.length} 节`;
    }

    function coordTile(action, iconName, title, desc, disabled = false) {
      return `<button data-action="${action}" ${disabled ? 'disabled' : ''} class="flex min-h-[70px] w-full flex-col items-start gap-1 rounded-xl border p-2.5 text-left transition ${disabled ? 'cursor-not-allowed border-slate-200 bg-slate-50' : 'border-slate-200 bg-white hover:bg-slate-50 active:scale-[0.99]'}">
        <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg ${disabled ? 'bg-slate-100 text-slate-500' : 'bg-slate-100 text-slate-700'}">${icon(disabled ? 'lock' : iconName, 'h-4 w-4')}</span>
        <span class="block w-full truncate text-[14px] font-bold ${disabled ? 'text-slate-500' : 'text-slate-900'}">${title}</span>
        <span class="block w-full truncate text-[12px] font-medium ${disabled ? 'text-slate-500' : 'text-slate-600'}">${desc}</span>
      </button>`;
    }

    function renderCoordSummarySheet() {
      const lesson = state.lesson;
      if (!lesson) return '';
      const isGroup = lesson.kind === 'group';
      const scope = coordScope();
      const pair = pairFor(lesson);
      const settled = state.lessonSettled;
      const started = hasLessonStarted(lesson);
      const isSub = lesson.kind === 'sub' || !!lesson.actual;
      const teacherPending = !!lesson.pendingSub;
      const cls = isGroup ? (CLASSES[lesson.classId] || CLASSES.ket1) : null;
      const student = STUDENTS[lesson.student] || STUDENTS.alice;
      const activeCount = state.pairLink === false ? 1 : scope.length;
      const pairCapsules = pair ? `<div class="mt-2 rounded-lg border border-indigo-200 bg-indigo-50/70 p-2">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[12px] font-bold text-indigo-900">同日连续课次 · 连几次</span>
          <span class="text-[12px] font-medium text-indigo-700">当前作用于 ${scope.length} 节</span>
        </div>
        <div class="mt-1.5 flex flex-wrap gap-1">
          ${Array.from({ length: Math.min(4, pair.length) }, (_, idx) => idx + 1).map((n) => {
            const on = activeCount === n;
            return `<button type="button" data-action="coord-pair-count" data-count="${n}" class="h-7 rounded-lg border px-2 text-[12px] font-bold transition ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-indigo-200 bg-white text-indigo-800 hover:bg-indigo-100'}">${n === 1 ? '仅本节' : `连 ${n} 节`}</button>`;
          }).join('')}
        </div>
        <div class="mt-1.5 space-y-1">
          ${pair.map((item) => {
            const checked = state.pairLink === false ? item.time === lesson.time : state.pairSel[item.time] !== false;
            const slotTxt = isGroup ? `${item.time} - ${endTime(item.time, item.dur || 2)}` : `${item.time} - ${endTime(item.time)}`;
            return `<label class="flex cursor-pointer items-center gap-2 rounded border border-indigo-100 bg-white px-2 py-1 text-[12px]">
              <input type="checkbox" data-coord-slot="${item.time}" ${checked ? 'checked' : ''} class="h-3.5 w-3.5 shrink-0 accent-indigo-600">
              <span class="min-w-0 flex-1 font-semibold text-slate-800">${slotTxt}</span>
              <span class="shrink-0 text-[12px] text-slate-500">${item.kind === 'sub' ? '代课' : isGroup ? '[G] 小班' : (TYPE_NAME[item.kind] || '课次')}</span>
            </label>`;
          }).join('')}
        </div>
      </div>` : '';
      return `${sheetHeader('课次动作', coordScopeLabel(scope))}
        <section aria-label="课次与对象摘要" class="rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="flex min-w-0 items-center gap-1.5">
              <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${teacherPending ? TYPE_NAME.pending : (TYPE_NAME[lesson.kind] || '课次')}</span>
              ${teacherPending ? '<span class="rounded border border-rose-200 bg-rose-50 px-1.5 py-0.5 text-[12px] font-bold text-rose-800">老师已请假 · 待重排</span>' : ''}
              ${isGroup ? '<span class="rounded bg-teal-50 px-1.5 py-0.5 text-[12px] font-bold text-teal-800">[G]</span>' : ''}
            </span>
            <span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${settled ? 'border-amber-300 bg-amber-50 text-amber-900' : 'border-slate-200 bg-white text-slate-700'}">${settled ? '已结课 · 未归集' : started ? '已开课' : '未结课'}</span>
          </div>
          <div class="mt-1.5 text-[16px] font-bold text-slate-900">${esc(slotLabel(lesson.day, lesson.time, isGroup ? 2 : 1))}</div>
          ${isGroup
            ? `<div class="mt-1 flex flex-wrap items-center gap-1.5 text-[12px] font-medium text-slate-600">
                <span class="font-semibold text-slate-800">${esc(cls.name)}</span>
                <span class="text-slate-300">·</span>
                <span>主理班长 ${esc(classOwnerName(lesson.classId))}</span>
                <span class="text-slate-300">·</span>
                <span>${isOwnClass(lesson.classId) ? '本班主理可写' : '他组只读'}</span>
              </div>`
            : ''}
          ${isSub
            ? `<div class="mt-1.5 rounded-lg border border-blue-200 bg-blue-50 px-2 py-1.5">
                <div class="flex items-center justify-between gap-2 text-[12px]"><span class="font-medium text-slate-600">原任老师</span><span class="font-bold text-slate-900">${esc(teacherName(lesson.teacher))}</span></div>
                <div class="mt-0.5 flex items-center justify-between gap-2 text-[12px]"><span class="font-medium text-slate-600">实际代课</span><span class="font-bold text-slate-900">${esc(teacherName(lesson.actual || 'elena'))}</span></div>
              </div>`
            : `<div class="mt-1 text-[12px] font-medium text-slate-600">任课老师 <span class="font-semibold text-slate-800">${esc(teacherName(lesson.teacher))}</span></div>`}
          ${teacherPending ? '<div class="mt-1.5 rounded-lg border border-rose-200 bg-rose-50 px-2 py-1.5 text-[12px] font-semibold leading-relaxed text-rose-700">原任老师已请假 · 待重排，请通过【请假 / 指派代课】继续处理。</div>' : ''}
          ${isGroup
            ? `<div class="mt-2 flex items-center justify-between gap-2 rounded-lg bg-white px-2 py-1.5">
                <span class="min-w-0 truncate text-[12px] font-medium text-slate-600">待排池 <span class="font-bold text-slate-900">${Number(classInfo(lesson.classId).pool || 0)} 节</span> · 全端不显在读人数</span>
                <span class="flex shrink-0 items-center gap-1.5">
                  <a href="m1c_classes.html" class="rounded-md bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">班级档案</a>
                  ${isOwnClass(lesson.classId) ? `<button data-action="open-class-view" data-class="${esc(lesson.classId)}" class="rounded-md bg-teal-50 px-1.5 py-0.5 text-[12px] font-bold text-teal-800">查看小班周课表</button>` : ''}
                </span>
              </div>
              ${renderClassLearningCard(lesson.classId, { open: state.classNoteOpen, archived: state.classArchived, action: 'class-note-toggle' })}`
            : `<div class="mt-1.5 flex items-center justify-between gap-2 rounded-lg bg-white px-2 py-1.5">
                <span class="flex min-w-0 items-center gap-1.5">
                  <span class="shrink-0 text-[14px] leading-none">${student.emoji}</span>
                  <span class="min-w-0 truncate text-[14px] font-bold text-slate-900">${esc(student.name)}</span>
                  <span class="shrink-0 text-[12px] font-medium text-slate-600">${student.age} 岁</span>
                </span>
                <span class="flex shrink-0 items-center gap-1.5">
                  <a href="m1a_student_profile.html" class="rounded-md bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">学员档案</a>
                  <button data-action="open-asset" class="rounded-md bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">课次资产</button>
                </span>
              </div>`}
          <div class="mt-1.5 flex items-center justify-between gap-2 rounded-lg bg-white px-2 py-1.5">
            <span class="min-w-0 truncate text-[12px] font-medium text-slate-600">ClassIn 老师名片 <span class="font-bold text-slate-900">${esc(teacherShort(lesson.actual || lesson.teacher))}</span></span>
            <button data-action="open-classin-qr" data-teacher="${esc(lesson.actual || lesson.teacher)}" class="flex h-8 shrink-0 items-center gap-1 rounded-lg border border-indigo-200 bg-indigo-50 px-2 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100">📷 查看 ClassIn 二维码</button>
          </div>
          ${pairCapsules}
        </section>

        <section aria-label="高频教务动作" class="mt-2.5">
          <div class="flex items-baseline justify-between gap-2">
            <h3 class="text-[14px] font-bold text-slate-900">高频教务动作</h3>
            <span class="shrink-0 text-[12px] font-medium text-slate-600">作用于 ${scope.length} 节</span>
          </div>
          <div class="mt-1.5 grid grid-cols-2 gap-2">
            ${isGroup
              ? coordTile('start-sub', 'user-check', '请假 / 代课 / 暂停待排', '一步代课 / 仅请假 / 暂停待排', settled)
              : coordTile('start-leave-move', 'calendar-x', '请假 / 同师挪位', scope.length > 1 ? `本次 ${scope.length} 节 · 释放或平移` : '释放待排 · 同师平移', settled)}
            ${isGroup
              ? (isOwnClass(lesson.classId) && !state.classArchived ? coordTile('open-class-view', 'move-right', '同师双格挪位', '进入小班周课表操作', settled) : coordTile('class-backfill-old', 'lock', '他组小班只读', '≥3h 禁止跨组操作', true))
              : coordTile('start-sub', 'user-check', '请假 / 指派代课', `一步代课 / 仅请假 (${scope.length} 节)`, settled)}
            ${coordTile('start-attendance', 'clipboard-check', '考勤 / 旷课标记', started ? '正常 · 旷课 / 迟到 / 早退纠偏' : '尚未到开课时间', !started)}
            ${isGroup
              ? coordTile('coord-teacher-leave', 'calendar-clock', '快速仅老师请假', teacherPending ? '已挂起待代' : '挂起 🔴 待代', settled || teacherPending)
              : coordTile('start-change-student', 'arrow-left-right', '换上课学员', '仅变更实际学员', settled)}
          </div>
          ${!started ? '<p class="mt-1.5 rounded-lg border border-slate-200 bg-slate-50 px-2 py-1.5 text-[12px] font-medium leading-relaxed text-slate-600">尚未到开课时间：考勤/旷课标记已置灰，如需取消请走请假、代课或撤排（演示控制台切换「已开课」可核验考勤）。</p>' : ''}
          ${settled ? '<p class="mt-1.5 rounded-lg border border-amber-300 bg-amber-50 px-2 py-1.5 text-[12px] font-semibold leading-relaxed text-amber-900">已结课 · 排课类动作已置灰，仅保留考勤纠偏与异常回退补生。</p>' : ''}
        </section>

        <section aria-label="低频与危险操作" class="mt-2.5 border-t border-slate-200 pt-2">
          <div class="text-[12px] font-semibold text-slate-600">低频 / 危险操作</div>
          ${settled || started
            ? `<button data-action="start-exception-backfill" class="mt-1.5 flex min-h-12 w-full items-center gap-2 rounded-xl border border-rose-200 bg-rose-50 px-2.5 py-2 text-left transition hover:bg-rose-100">
                <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-white text-rose-700">${icon('triangle-alert', 'h-4 w-4')}</span>
                <span class="min-w-0 flex-1">
                  <span class="block truncate text-[14px] font-bold text-rose-800">异常未上课回退补生</span>
                  <span class="block truncate text-[12px] font-medium text-rose-700">三方同权 · 双重未冻结可退 · 补生 ${scope.length} 节待排期</span>
                </span>
              </button>`
            : `<button data-action="start-withdraw" class="mt-1.5 flex min-h-12 w-full items-center gap-2 rounded-xl border border-rose-200 bg-rose-50 px-2.5 py-2 text-left transition hover:bg-rose-100">
                <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-white text-rose-700">${icon('undo-2', 'h-4 w-4')}</span>
                <span class="min-w-0 flex-1">
                  <span class="block truncate text-[14px] font-bold text-rose-800">撤排退回课次</span>
                  <span class="block truncate text-[12px] font-medium text-rose-700">释放时段并退回 ${scope.length} 节课次</span>
                </span>
              </button>`}
        </section>`;
    }

    function renderCoordLeaveMovePanel() {
      const lesson = state.lesson;
      if (!lesson || lesson.kind === 'group') return renderCoordSummarySheet();

      const leave = leaveEligibility(lesson);
      const move = rescheduleEligibility(lesson);

          <div class="mt-1.5 space-y-1">

              <span class="font-semibold text-slate-800">第 ${index + 1} 节 · ${dayLabel(item.day)} ${item.time} - ${endTime(item.time)}</span>

          <button data-action="coord-teacher-leave" ${teacherPending ? 'disabled' : ''} class="flex min-h-12 w-full items-center gap-2.5 rounded-xl border px-3 py-2 text-left transition ${teacherPending ? 'cursor-not-allowed border-slate-200 bg-slate-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">

            <span class="min-w-0 flex-1">

              <span class="mt-0.5 block text-[12px] font-medium leading-snug text-slate-600">${teacherPending ? '该课次已挂起为待代课，请直接指派代课' : '挂起为 🔴 待代，保留课次等待指派代课'}</span>

    function coordSubCandidates(scope) {
      const lesson = state.lesson;
      if (!lesson) return [];
      return buildSubCandidates({
        exclude: [lesson.teacher, lesson.actual],
        scope,
        studentKey: lesson.student,
        refTeacherKey: lesson.teacher,
        isGroup: lesson.kind === 'group',
        classKey: lesson.classId,
        search: state.subSearch
      });
    }

    function renderSubCandidateList(candidates, picked, taughtLabel) {
      if (!candidates.length) {
        return '<p class="rounded-lg border border-amber-300 bg-amber-50 px-2 py-1.5 text-[12px] font-semibold leading-relaxed text-amber-900">没有匹配的老师，请调整姓名搜索。</p>';
      }
      return `<div class="mt-2 space-y-1.5">
        ${candidates.map((teacher) => {
          const on = picked === teacher.key && teacher.available;
          const highCross = teacher.tierJump >= 2;
          return `<button data-action="select-sub" data-key="${teacher.key}" ${teacher.available ? '' : 'disabled'} class="flex min-h-12 w-full items-start gap-2 rounded-lg border px-2.5 py-1.5 text-left transition ${teacher.available ? (on ? 'border-indigo-300 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50') : 'cursor-not-allowed border-slate-200 bg-slate-50 opacity-75'}">
            <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg ${on ? 'bg-white text-indigo-700' : 'bg-slate-100 text-slate-700'} text-[12px] font-bold">${teacher.initial}</span>
            <span class="min-w-0 flex-1">
              <span class="flex flex-wrap items-center gap-1">

                <span class="shrink-0 rounded bg-slate-100 px-1 py-0.5 text-[12px] font-semibold text-slate-700">${esc(teacher.tierLabel)}</span>
                ${teacher.taught ? `<span class="shrink-0 rounded border border-emerald-200 bg-emerald-50 px-1 py-0.5 text-[12px] font-bold text-emerald-700">${taughtLabel}</span>` : ''}
                ${highCross ? '<span class="shrink-0 rounded border border-amber-300 bg-amber-50 px-1 py-0.5 text-[12px] font-bold text-amber-800">跨高档代课</span>' : ''}
              </span>
              <span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">${esc(teacher.tierText)} · 本周已排 ${teacher.load} 节</span>
              ${highCross ? '<span class="mt-0.5 block truncate text-[12px] font-medium text-amber-800">跨高档代课差额由平台统筹教务盈余池兜底吸收，不克扣代课老师课酬</span>' : ''}
              ${teacher.available ? '' : `<span class="mt-0.5 block truncate text-[12px] font-bold text-rose-700">${esc(teacher.reason)}</span>`}
            </span>
            <span class="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 bg-white'}">${on ? icon('check', 'h-3 w-3') : ''}</span>
          </button>`;
        }).join('')}
      </div>`;
    }

      if (state.hours < 24) return '';

        <div class="flex items-center justify-between gap-2">

        </div>
        <div class="mt-1.5 grid grid-cols-2 gap-1.5">
          <button type="button" data-action="sub-leave-cause" data-value="teacher" class="h-9 rounded-lg border px-1.5 text-[12px] font-bold transition ${isTeacher ? 'border-rose-300 bg-rose-50 text-rose-800' : 'border-slate-200 bg-white text-slate-700'}">老师原因（代办请假）</button>
          <button type="button" data-action="sub-leave-cause" data-value="coord" class="h-9 rounded-lg border px-1.5 text-[12px] font-bold transition ${!isTeacher ? 'border-indigo-300 bg-indigo-50 text-indigo-800' : 'border-slate-200 bg-white text-slate-700'}">教务/学员主动调剂</button>

      </div>`;

      if (!lesson) return '';

      const candidates = coordSubCandidates(scope);

      const gentle = state.hours < 3;
      const leaveOnly = !!state.subLeaveOnly;
      return `${sheetHeader('请假 / 指派代课', `${coordScopeLabel(scope)} · 一步代课 + 仅请假双出口`)}

            <input data-sub-search value="${esc(state.subSearch)}" placeholder="按老师姓名搜索" class="h-9 w-full rounded-lg border border-slate-200 bg-white pl-7 pr-2 text-[14px] font-medium text-slate-800 outline-none focus:border-indigo-400">
          </div>
          ${state.subSearch ? `<button data-action="clear-sub-search" class="h-9 shrink-0 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-800">清空</button>` : ''}
        </div>
        <div class="mt-2 rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold text-slate-900">全空闲在职老师</span>

          <span class="min-w-0 flex-1 text-[12px] font-bold">仅老师请假（暂不指定代课，挂起 🔴 待代）</span>

          <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">全平台在职连续双格空闲老师均可一步代课，无课型或资质过滤；小班代课按代课老师当期小班内部单价试算，差额由平台统筹教务盈余池兜底吸收；仅发 1 条合并结论通知。</p>
          ${renderSubCandidateList(candidates, picked, '教过本班')}
          <button data-action="confirm-sub" ${picked ? '' : 'disabled'} class="mt-2 flex h-10 w-full items-center justify-center gap-1 rounded-lg text-[14px] font-bold transition ${picked ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'cursor-not-allowed bg-slate-200 text-slate-500'}">${icon('user-check', 'h-4 w-4')}一步指派代课</button>
        </div>`}
        <div class="mt-2 rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="flex items-center justify-between gap-2">

    function teacherDaySlots(day) {
      const list = [];
      GRID_TIMES.forEach((time) => {
        if (isGroupContinuation(day, time)) return;
        const slot = getSlot(day, time);
        let status = '空闲';
        if (slot.lesson) {
          status = slot.lesson.kind === 'group' ? '排课 · 小班' : '排课';
        } else if (slot.kind === 'rest') {
          status = '休息';
        } else if (slot.kind === 'leave') {
          status = '请假';
        }
        const open = teacherOpen(state.teacher, day, time);
        if (!slot.lesson && slot.kind !== 'leave' && !open) return;
        list.push({ day, time, status, lesson: slot.lesson, kind: slot.kind });
      });
      return list;

    function requireOnline() {
      if (state.online) return true;
      showToast('当前为离线只读，暂不可提交');
      return false;
    }

     * 操作

    function openParentLesson(lesson) {
      if (!lesson) return;
      state.lesson = lesson;
      state.drawer = 'parent-lesson';
      state.panel = null;
      state.pairSel = {};
      const pair = pairFor(lesson);
      if (pair) pair.forEach((item) => { state.pairSel[item.time] = true; });
      render(true);
    }

    function handleCell(day, time) {
      if (state.reschedule) {
        const info = rescheduleTargetInfo(day, time);
        if (!info || !info.inWindow) {
          showToast('该时段不在同师挪位窗口内');
          return;
        }
        if (info.isSource) {
          showToast('请选择原课次以外的同师绿色空闲格');
          return;
        }
        const slot = getSlot(day, time);
        if (slot.kind !== 'available') {
          showToast('请选择原授课老师的绿色空闲时段');
          return;
        }
        if (info.conflict) {
          showToast('学员该时段已有其他课程，请选择其他空闲时段');
          return;
        }
        const targets = state.reschedule.times.map((_, index) => fmtMinutes(toMin(time) + index * 30));
        const conflictTarget = targets.some((target) => studentConflictAt(day, target, state.reschedule.student));
        if (conflictTarget) {
          showToast('学员该时段已有其他课程，请选择其他空闲时段');
          return;
        }
        const allFree = targets.every((target) => toMin(target) < GRID_END && getSlot(day, target).kind === 'available');
        if (!allFree) {
          showToast(`连带挪位需连续 ${targets.length} 格同师空闲时段`);
          return;
        }
        state.modal = { type: 'reschedule', day, time, targets };
        render(true);
        return;
      }
      if (state.weekStudent) {
        const slot = getSlot(day, time);
        if (slot.kind === 'blockedGroup') {
          showToast('该时段已被已绑定小班课占用（视觉隐藏不等于释放）');
          return;
        }
        if (slot.lesson) {
          state.lesson = slot.lesson;
          state.drawer = 'staff-lesson';
          state.panel = null;
          state.pairSel = {};
          state.pairLink = true;
          const pair = pairFor(slot.lesson);
          if (pair) pair.forEach((item) => { state.pairSel[item.time] = true; });
          render(true);
        } else {
          showToast('请到对应老师课表预约空闲时段');
        }
        return;
      }

      const slot = getSlot(day, time);
      if (state.role === 'parent') {
        if (slot.kind === 'blockedGroup' || slot.kind === 'clash') {
          showToast('该时段已被已绑定小班课占用（含视觉隐藏半格），不可约 1v1');
          return;
        }
        if (slot.lesson && slot.lesson.kind === 'group') {
          state.lesson = slot.lesson;
          state.drawer = 'parent-group';
          state.panel = null;
          state.parentClassNoteOpen = false;
          render(true);
          return;
        }
        if (slot.lesson && ['fixed', 'temp', 'sub'].includes(slot.lesson.kind)) {
          openParentLesson(slot.lesson);
          return;
        }
        if (slot.kind === 'hold') {
          showToast('续费预占中，最晚于新轮首日周一 01:00 清退（已传凭证待核除外）');
          return;
        }
        if (slot.kind === 'available') {
          state.target = { day, time };
          state.drawer = 'parent-book';
          state.panel = null;
          state.bookDuration = 30;
          normalizeBookTier(state.child);
          render(true);
          return;
        }
        showToast(inParentBookWindow(day) ? '该时段暂不可预约' : '仅支持预约未来 1~7 天');
        return;
      }

      if (slot.lesson && ['fixed', 'temp', 'sub', 'subbing', 'group'].includes(slot.lesson.kind)) {
        state.lesson = slot.lesson;
        state.drawer = 'staff-lesson';
        state.panel = null;
        state.pairSel = {};
        state.pairLink = true;
        state.lessonSettled = false;
        state.attendanceMark = '';
        state.outageReason = 'teacher';
        const pair = pairFor(slot.lesson);
        if (pair) pair.forEach((item) => { state.pairSel[item.time] = true; });
        render(true);
        return;
      }
      if (slot.kind === 'hold') {
        showToast('续费预占中 · 最晚于新轮首日周一 01:00 清退（已传凭证待核除外），请在购课单中确认');
        return;
      }
      if (slot.kind === 'available') {
        if (state.role === 'teacher') {
          state.target = { day, time };
          state.drawer = 'teacher-free';
          state.panel = null;
          render(true);
          return;
        }
        const lock = teacherWriteLocked();
        if (lock.locked) {
          showToast(lock.reason);
          return;
        }
        state.target = { day, time };
        state.drawer = 'staff-free';
        state.panel = null;
        state.bookDuration = 30;
        state.staffStudentSearch = '';
        state.quickTrialOpen = false;
        state.quickTrialNick = '';
        state.quickTrialContact = '';
        state.quickTrialError = '';
        state.quickTrialOrderSync = true;
        render(true);
        return;
      }
      const restLock = teacherWriteLocked();
      if (restLock.locked) {
        showToast(restLock.reason);
        return;
      }
      state.target = { day, time };
      state.drawer = 'staff-rest';
      state.panel = null;
      render(true);
    }

    function beginReschedule(cells, gentleOk = false) {
      const list = (cells || []).filter(Boolean).sort((a, b) => toMin(a.time) - toMin(b.time));
      if (!list.length) {
        showToast('请至少选择 1 节课程');
        return;
      }
      const check = rescheduleEligibility(list[0]);
      if (!check.ok) {
        showToast(check.reason);
        return;
      }
      if (isStaff() && state.hours < 3 && !gentleOk) {
        state.modal = { type: 'staff-gentle', action: 'reschedule', cells: list };
        render(true);
        return;
      }
      state.reschedule = {
        round: state.roundOffset,
        week: state.week,
        day: list[0].day,
        times: list.map((item) => item.time),
        teacher: list[0].teacher,
        student: list[0].student,
        kind: list[0].kind === 'temp' ? 'temp' : 'fixed',
        sourceKind: list[0].kind
      };
      state.drawer = null;
      state.panel = null;
      state.modal = null;
      render(true);
      showToast(list[0].kind === 'temp'
        ? '请选择原课次前后 7 天内同师绿色空闲格'
        : '请选择本轮 4 周内同师绿色空闲格');
    }

    function applyReschedule() {
      if (!requireOnline()) return;
      const source = state.reschedule;
      const modal = state.modal;
      if (!source || !modal) return;
      const targetKind = source.sourceKind === 'sub' ? 'fixed' : source.kind;
      modal.targets.forEach((time) => {
        overrides[slotKey(state.week, modal.day, time)] = {
          day: modal.day,
          time,
          teacher: source.teacher,
          student: source.student,
          kind: targetKind
        };
      });
      source.times.forEach((time) => {
        overrides[slotKey(source.week, source.day, time)] = { forced: 'available' };
      });
      const removedSub = source.sourceKind === 'sub';
      state.reschedule = null;
      state.modal = null;
      render(true);
      showToast(removedSub
        ? '挪位成功，已解除代课委任并向原代课老师发撤销通知；原代课在课酬单计 0 节 / 0 课酬'
        : '挪位成功，原格释放、目标格已落盘（跨调价日平移免补退差价）');
    }

    function releaseLeaveCells(cells) {
      let applied = 0;
      cells.forEach((cell) => {
        if (!['fixed', 'temp', 'sub'].includes(cell.kind)) return;
        overrides[slotKey(state.week, cell.day, cell.time)] = { forced: 'available' };
        applied += 1;
      });
      return applied;
    }

    function confirmLeave(gentleConfirmed = false) {
      if (!requireOnline()) return;
      const cells = leaveCellsNow();
      if (!cells.length) {
        showToast('请选择要请假的课次');
        return;
      }
      const eligibility = leaveEligibility(cells[0]);
      if (!eligibility.ok) {
        showToast(eligibility.reason);
        return;
      }
      if (eligibility.gentle && !gentleConfirmed) {
        state.modal = { type: 'leave-gentle' };
        render(true);
        return;
      }
      const applied = releaseLeaveCells(cells);
      state.modal = null;
      state.drawer = null;
      state.panel = null;
      state.leaveCells = [];
      render(true);
      showToast(`已请假 ${applied} 节，TS 已退回待排期，课格恢复空闲可约`);
    }

    function createQuickTrialStudent() {
      if (state.role !== 'admin' && state.role !== 'monitor') {
        showToast('仅班长或平台管理员可创建试课学员档案');
        return;
      }
      const rawNick = (state.quickTrialNick || '').trim();
      const contact = (state.quickTrialContact || '').trim();
      const parsed = parseStandardNick(rawNick);
      if (!parsed) {
        state.quickTrialError = '规范英文名格式有误，须为“英文名+大写姓首字母+年龄”，如 MarkL10';
        render(true);
        return;
      }
      const dup = Object.values(STUDENTS).some((s) => s.name.toLowerCase() === parsed.name.toLowerCase());
      if (dup) {
        state.quickTrialError = `规范英文名 ${parsed.name} 已被占用，建议加后缀如 ${parsed.name}b`;
        render(true);
        return;
      }
      if (contact.length < 4) {
        state.quickTrialError = '请输入至少 4 位的家长联系方式（手机号或微信号）';
        render(true);
        return;
      }
      const key = `trial_${Date.now().toString(36)}`;
      STUDENTS[key] = {
        key,
        id: `stu_${key}`,
        name: parsed.name,
        nick: parsed.englishName,
        short: parsed.name.slice(0, 6),
        emoji: '🧒',
        age: parsed.age,
        label: parsed.name,
        credits: 0,
        fixedCredits: 0,
        tempBuckets: { 16: 0, 18: 0, 21: 0 },
        realName: parsed.name,
        parent: `试课待认领 (${contact})`,
        contact,
        status: '试课'
      };
      state.credits[key] = 0;
      state.tempBuckets[key] = { 16: 0, 18: 0, 21: 0 };
      state.staffStudent = key;
      state.staffStudentSearch = '';
      state.quickTrialOpen = false;
      state.quickTrialNick = '';
      state.quickTrialContact = '';
      state.quickTrialError = '';
      state.quickTrialOrderSync = true;
      state.proxyPaymentConfirmed = false;
      render(true);
      showToast(`已创建试课档案 ${parsed.name}（待认领）`);
    }

    function confirmBooking() {
      if (!requireOnline()) return;
      const slot = bookingSlot();
      if (!slot) return;
      const count = Math.max(1, Math.min(4, Math.round((state.bookDuration || 30) / 30)));
      const check = canBookCount(count);
      if (!check.ok) {
        showToast(check.reason || '所选连约节数不可用');
        return;
      }
      const staff = isStaff();
      const studentKey = staff ? state.staffStudent : state.child;
      const studentObj = STUDENTS[studentKey];
      if (!studentObj) {
        showToast('请先选择学员');
        return;
      }
      let teacher = state.teacher;
      if (!staff) {
        normalizeBookTier(state.child);
        if (isHallParent()) {
          teacher = state.teacher;
          state.bookTeacher = teacher;
        } else {
          const available = freeTeachersFor(slot.day, slot.time, count, state.bookTier).filter((item) => item.available);
          const picked = available.some((item) => item.key === state.bookTeacher) ? state.bookTeacher : (available[0] ? available[0].key : '');
          if (!picked) {
            showToast(`当前时段无连续 ${count} 节空闲老师`);
            return;
          }
          state.bookTeacher = picked;
          teacher = picked;
        }
      }
      const cost = count;
      const avail = studentCredits(studentKey);
      const tTier = staff ? teacherTier(teacher) : Number(state.bookTier);
      let syncedOrderCount = 0;
      if (!staff) {
        const tierAvail = studentTempTierCredits(studentKey, tTier);
        if (tierAvail < cost || avail < cost) {
          showToast(`暂无足够的 ${tTier}积分 待排临时课`);
          return;
        }
        state.credits[state.child] = avail - cost;
        const buckets = Object.assign({}, studentTempBuckets(state.child));
        buckets[tTier] = Math.max(0, tierAvail - cost);
        state.tempBuckets[state.child] = buckets;
      } else if (state.quickTrialOrderSync) {
        if (!state.proxyPaymentConfirmed) {
          showToast('请先勾选确认已收到家长课次费用');
          return;
        }
        syncedOrderCount = cost;
      } else if (avail >= cost) {
        state.credits[studentKey] = avail - cost;
      } else {
        showToast('学员待排 TS 不足，请勾选同步录单并确认收款');
        return;
      }
      const times = bookingTimes(slot.time, count);
      times.forEach((t) => {
        extraLessons.push({
          week: state.week,
          day: slot.day,
          time: t,
          teacher,
          student: studentKey,
          kind: 'temp'
        });
      });
      state.drawer = null;
      state.target = null;
      state.bookTeacherSearch = '';
      state.proxyPaymentConfirmed = false;
      state.proxyProofCount = 0;
      render(true);
      const mins = count * 25;
      const teacherText = teacherName(teacher);
      const crossNotice = staff && !isOwnTeacher(teacher)
        ? `；已向 ${teacherText} 所属负责班长 ${ownerName(teacherOwner(teacher))} 发送站内知会`
        : '';
      showToast(staff
        ? (syncedOrderCount > 0
          ? `已确认收款 ${syncedOrderCount * tTier} 积分并生成已付款购课单，由 ${teacherText} 完成 ${studentObj.name} 约课（${count} 节）${crossNotice}`
          : `已为 ${studentObj.name} 预约 ${count} 节（${mins} 分钟），授课老师 ${teacherText}${crossNotice}`)
        : `已预约 ${count} 节（${mins} 分钟），授课老师 ${teacherText}，扣减 ${tTier}积分临时课 ${cost} 节`);
    }

    function confirmOpenSlot() {
      if (!requireOnline()) return;
      const slot = state.target;
      if (!slot) return;
      overrides[slotKey(state.week, slot.day, slot.time)] = { forced: 'available' };
      state.drawer = null;
      state.target = null;
      render(true);
      showToast('已加开时段，已通知意向家长');
    }

    function confirmLockSlot() {
      if (!requireOnline()) return;
      const slot = state.target;
      if (!slot) return;
      overrides[slotKey(state.week, slot.day, slot.time)] = { forced: 'rest' };
      state.drawer = null;
      state.target = null;
      render(true);
      showToast('已锁定时段，暂不可预约；本次覆盖仅单日生效，不延续至下周');
    }

    function restoreRestSlot() {
      if (!requireOnline()) return;
      const slot = state.target;
      if (!slot) return;
      delete overrides[slotKey(state.week, slot.day, slot.time)];
      state.drawer = null;
      state.target = null;
      render(true);
      showToast('已恢复为休息，清除临时加开覆盖并还原周模板');
    }

    function unlockRestSlot() {
      if (!requireOnline()) return;
      const slot = state.target;
      if (!slot) return;
      delete overrides[slotKey(state.week, slot.day, slot.time)];
      state.drawer = null;
      state.target = null;
      render(true);
      showToast('已解锁该时段，覆盖记录清除并恢复周模板可约状态');
    }

    function resolveSubCandidate(scope) {
      const lesson = state.lesson;
      if (!lesson) return '';
      if (state.subCandidate && state.subCandidate !== lesson.teacher && state.subCandidate !== lesson.actual) {
        const conflict = subConflictFor(state.subCandidate, scope);
        const qualified = lesson.kind !== 'group' || SMALL_CLASS_QUALIFIED.includes(state.subCandidate);
        if (!conflict && qualified) return state.subCandidate;
      }
      const candidates = buildSubCandidates({
        exclude: [lesson.teacher, lesson.actual],
        scope,
        studentKey: lesson.student,
        refTeacherKey: lesson.teacher,
        isGroup: lesson.kind === 'group',
        classKey: lesson.classId,
        search: ''
      });
      return subFirstAvailable(candidates);
    }

    function confirmSub(gentleOk = false) {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson) return;
      const scopeCheck = coordScope();
      const chosen = resolveSubCandidate(scopeCheck);
      if (!chosen) {
        showToast('请选择全部时段空闲的在职老师');
        return;
      }
      const conflict = subConflictFor(chosen, scopeCheck);
      if (conflict) {
        showToast(conflict);
        return;
      }
      state.subCandidate = chosen;
      if (isStaff() && state.hours < 3 && !gentleOk) {
        state.modal = { type: 'staff-gentle', action: 'sub' };
        render(true);
        return;
      }
      const key = slotKey(state.week, lesson.day, lesson.time);
      if (lesson.kind === 'group') {
        overrides[key] = Object.assign({}, lesson, { actual: state.subCandidate, pendingSub: false });
      } else {
        const scope = coordScope();
        scope.forEach((cell) => {
          overrides[slotKey(state.week, cell.day, cell.time)] = Object.assign({}, cell, { kind: 'sub', actual: state.subCandidate, pendingSub: false });
        });
      }
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(`${TEACHERS[state.subCandidate].name} 已一步指派代课（仅发 1 条合并结论通知，不锁原师当日其余空闲格）`);
    }

    function markAttendance(value) {
      if (!requireOnline()) return;
      const labels = { present: '正常出勤', 'student-absent': '学员旷课' };
      state.attendance = value;
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(`已记录：${labels[value] || '正常出勤'}`);
    }

    function confirmWithdraw() {
      if (!requireOnline()) return;
      const scope = coordScope();
      if (!scope.length) return;
      scope.forEach((cell) => {
        overrides[slotKey(state.week, cell.day, cell.time)] = { forced: 'available' };
      });
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(`已撤排 ${scope.length} 节，课次已退回`);
    }

    function coordLeave(gentleOk = false) {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson) return;
      const scope = coordScope();
      const check = leaveEligibility(lesson);
      if (!check.ok) {
        showToast(check.reason);
        return;
      }
      if (state.hours < 3 && !gentleOk) {
        state.modal = { type: 'staff-gentle', action: 'coord-leave', cells: scope };
        render(true);
        return;
      }
      applyCoordLeave(scope);
    }

    function applyCoordLeave(cells) {
      const scope = (cells && cells.length) ? cells : coordScope();
      const applied = releaseLeaveCells(scope);
      state.drawer = null;
      state.panel = null;
      state.modal = null;
      render(true);
      showToast(`已请假 ${applied} 节，TS 已退回待排期，课格恢复空闲可约`);
    }

    function coordTeacherLeave(gentleOk = false) {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson) return;
      if (lesson.pendingSub) {
        showToast('该课次已处于待代课状态，请直接指派代课');
        return;
      }
      if (state.hours < 3 && !gentleOk) {
        state.modal = { type: 'staff-gentle', action: 'coord-teacher-leave', cells: coordScope() };
        render(true);
        return;
      }
      applyCoordTeacherLeave(coordScope());
    }

    function applyCoordTeacherLeave(cells) {
      const scope = (cells && cells.length) ? cells : coordScope();
      scope.forEach((cell) => {
        overrides[slotKey(state.week, cell.day, cell.time)] = Object.assign({}, cell, { pendingSub: true });
      });
      state.drawer = null;
      state.panel = null;
      state.modal = null;
      render(true);
      showToast('已代老师请假 · 课格转为待代课');
    }

    function coordRevokeSub(gentleOk = false) {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson || !lesson.actual) return;
      if (state.hours < 3 && !gentleOk) {
        state.modal = { type: 'staff-gentle', action: 'revoke-sub' };
        render(true);
        return;
      }
      applyRevokeSub();
    }

    function applyRevokeSub() {
      const lesson = state.lesson;
      if (!lesson) return;
      coordScope().forEach((cell) => {
        const key = slotKey(state.week, cell.day, cell.time);
        if (cell.kind === 'sub') {
          overrides[key] = Object.assign({}, cell, { kind: 'fixed', actual: null });
        } else if (cell.actual) {
          const copy = Object.assign({}, cell);
          delete copy.actual;
          overrides[key] = copy;
        }
      });
      state.drawer = null;
      state.panel = null;
      state.modal = null;
      render(true);
      showToast('已撤销代课指派，恢复原任老师排期');
    }

    function coordMarkAttendance(value) {
      if (!requireOnline()) return;
      const labels = { 'student-absent': '学员旷课', 'teacher-absent': '老师旷课', 'teacher-late': '老师迟到', 'teacher-early': '老师早退' };
      state.attendanceMark = value;
      render(true);
      showToast(`已标记：${labels[value] || '旷课'}，可在面板内纠偏`);
    }

    function coordRestoreAttendance() {
      if (!requireOnline()) return;
      state.attendanceMark = '';
      render(true);
      showToast('已恢复为正常出勤，按次日 02:00 自动结课');
    }

    function proxyLeave(gentleOk = false) {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson) return;
      const check = leaveEligibility(lesson);
      if (!check.ok) {
        showToast(check.reason);
        return;
      }
      if (isStaff() && state.hours < 3 && !gentleOk) {
        state.modal = { type: 'staff-gentle', action: 'proxy-leave' };
        render(true);
        return;
      }
      const applied = releaseLeaveCells([lesson]);
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(`已代 ${STUDENTS[lesson.student].name} 请假，TS 已退回待排期`);
    }

    function confirmChangeStudent(gentleOk = false) {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson) return;
      if (isStaff() && state.hours < 3 && !gentleOk) {
        state.modal = { type: 'staff-gentle', action: 'change-student' };
        render(true);
        return;
      }
      const candidates = changeStudentCandidates('').map((student) => student.key);
      const next = candidates.includes(state.changeStudent) ? state.changeStudent : candidates[0];
      if (!next) return;
      const current = STUDENTS[lesson.student] || STUDENTS.alice;
      const target = STUDENTS[next];
      const crossFamily = target.parent !== current.parent;
      if (crossFamily) {
        const note = (state.changeNote || '').trim();
        if (note.length < 1 || note.length > 200) {
          showToast('跨家庭换人必须填写 1–200 字协调/结算备注');
          return;
        }
        if (!state.changeConfirm) {
          showToast('请先确认已沟通原出资家长与新学员家长');
          return;
        }
      }
      const scope = coordScope();
      scope.forEach((cell) => {
        overrides[slotKey(state.week, cell.day, cell.time)] = Object.assign({}, cell, { student: next });
      });
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(crossFamily
        ? `已将 ${scope.length} 节课次换为 ${target.name}，备注已写入经办记录，并向双方家长发送站内中性知会`
        : `已将 ${scope.length} 节课次换为 ${target.name}，原购课单资金归属不变`);
    }

    function confirmGroupOutage() {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson || lesson.kind !== 'group') return;
      const dur = lesson.dur || 2;
      const holiday = state.outageReason === 'holiday';
      for (let index = 0; index < dur; index += 1) {
        const time = fmtMinutes(toMin(lesson.time) + index * 30);
        overrides[slotKey(state.week, lesson.day, time)] = holiday
          ? { forced: 'available' }
          : Object.assign({}, lesson, { time, dur, outage: true, pendingSub: false });
      }
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(holiday
        ? '已暂停待排，原网格释放为绿色可约，TS 退回小班待排池'
        : '已暂停待排，原网格标红不可约，TS 退回小班待排池');
    }

    function closeLayers() {
      state.drawer = null;
      state.panel = null;
      state.modal = null;
      state.reschedule = null;
      state.batchOpen = false;
    }

    function handleControl(group, value) {
      if (group === 'role') {
        state.role = value;
        state.drawer = null;
        state.panel = null;
        state.modal = null;
        state.reschedule = null;
        state.batchOpen = false;
        state.scheduleSelect = false;
        state.scheduleStudent = null;
        state.scheduleClass = null;
        state.scheduleSel = {};
        resetScheduleWeeks();
        state.renewalEdit = false;
        state.renewalOrderId = '';
        state.renewalReturn = '';
        state.renewalSaved = false;
        state.pairSel = {};
        state.dayCell = null;
        state.dayIncident = null;
        state.dayCompare = false;
        if (value === 'parent' || value === 'teacher') state.view = 'week';
        if (value === 'parent') {
          state.child = 'alice';
          state.scenario = 'parent';
        } else {
          state.teacher = 'david';
          state.scenario = value;
        }
        render(false);
        return;
      }
      if (group === 'view') {
        if (value === 'day' && state.role !== 'monitor' && state.role !== 'admin') {
          showToast('日调度仅班长与管理员可用');
          return;
        }
        state.view = value === 'day' ? 'day' : 'week';
        state.drawer = null;
        state.dayCell = null;
        state.dayIncident = null;
        state.dayCompare = false;
        render(false);
        return;
      }
      if (group === 'device') {
        state.device = value;
        render(true);
        return;
      }
      if (group === 'network') {
        state.online = value === 'online';
        render(true);
        return;
      }
      if (group === 'hours') {
        const hours = Number(value);
        state.hours = Number.isNaN(hours) ? 32 : hours;
        render(true);
        return;
      }
      if (group === 'week') {
        state.week = clampWeek(value);
        state.drawer = null;
        state.panel = null;
        state.modal = null;
        render(true);
      }
    }

    /* ------------------------------------------------------------------
     * 控制台

    function segment(group, options, current) {
      return `<div class="flex items-center gap-0.5 rounded-lg border border-slate-200 bg-slate-100 p-0.5">
        ${options.map((option) => `<button data-control="${group}" data-value="${option.value}" class="h-7 rounded-md px-2 text-[12px] font-semibold transition ${String(option.value) === String(current) ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-700'}">${option.label}</button>`).join('')}
      </div>`;
    }

    function setConsoleCollapsed(collapsed) {
      state.consoleCollapsed = collapsed;
      try {
        window.localStorage.setItem('dream_proto_nav_collapsed', collapsed ? '1' : '0');
      } catch (err) {
        /* localStorage 不可用时静默降级 */
      }
      const header = document.querySelector('[data-console-header]');
      const mini = document.querySelector('[data-console-mini]');
      if (header) header.classList.toggle('hidden', collapsed);
      if (mini) {
        mini.classList.toggle('hidden', !collapsed);
        mini.classList.toggle('flex', collapsed);
      }

            ${segment('view', [

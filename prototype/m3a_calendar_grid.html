            <span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${settled ? 'border-amber-300 bg-amber-50 text-amber-900' : 'border-slate-200 bg-white text-slate-700'}">${settled ? '已结课 · 未归集' : '未结课'}</span>
          </div>
          <div class="mt-1.5 text-[16px] font-bold text-slate-900">${esc(slotLabel(lesson.day, lesson.time, isGroup ? 2 : 1))}</div>
          ${isGroup
            ? `<div class="mt-1 flex flex-wrap items-center gap-1.5 text-[12px] font-medium text-slate-600">
                <span class="font-semibold text-slate-800">${esc(cls.name)}</span>
                <span class="text-slate-300">·</span>
                <span>${cls.enrolled}/${cls.capacity} 人</span>
              </div>`
            : ''}
          ${isSub
            ? `<div class="mt-1.5 rounded-lg border border-blue-200 bg-blue-50 px-2 py-1.5">
                <div class="flex items-center justify-between gap-2 text-[12px]"><span class="font-medium text-slate-600">原任老师</span><span class="font-bold text-slate-900">${esc(teacherName(lesson.teacher))}</span></div>
                <div class="mt-0.5 flex items-center justify-between gap-2 text-[12px]"><span class="font-medium text-slate-600">实际代课</span><span class="font-bold text-slate-900">${esc(teacherName(lesson.actual || 'elena'))}</span></div>
              </div>`
            : `<div class="mt-1 text-[12px] font-medium text-slate-600">任课老师 <span class="font-semibold text-slate-800">${esc(teacherName(lesson.teacher))}</span></div>`}
          ${isGroup
            ? `<div class="mt-2 flex items-center justify-between gap-2 rounded-lg bg-white px-2 py-1.5">
                <span class="min-w-0 truncate text-[12px] font-medium text-slate-600">在读学员 <span class="font-bold text-slate-900">${cls.enrolled}/${cls.capacity}</span></span>
                <a href="m1c_classes.html" class="shrink-0 rounded-md bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">班级档案</a>
              </div>`
            : `<div class="mt-1.5 flex items-center justify-between gap-2 rounded-lg bg-white px-2 py-1.5">
                <span class="flex min-w-0 items-center gap-1.5">
                  <span class="shrink-0 text-[14px] leading-none">${student.emoji}</span>
                  <span class="min-w-0 truncate text-[14px] font-bold text-slate-900">${esc(student.name)}</span>
                  <span class="shrink-0 text-[12px] font-medium text-slate-600">${esc(student.nick)}</span>
                </span>
                <span class="flex shrink-0 items-center gap-1.5">
                  <a href="m1a_student_profile.html" class="rounded-md bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">学员档案</a>
                  <button data-action="open-asset" class="rounded-md bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">课次资产</button>
                </span>
              </div>`}
          <div class="mt-1.5 flex items-center justify-between gap-2 rounded-lg bg-white px-2 py-1.5">
            <span class="min-w-0 truncate text-[12px] font-medium text-slate-600">ClassIn 老师名片 <span class="font-bold text-slate-900">${esc(teacherShort(lesson.actual || lesson.teacher))}</span></span>
            <button data-action="open-classin-qr" data-teacher="${esc(lesson.actual || lesson.teacher)}" class="flex h-8 shrink-0 items-center gap-1 rounded-lg border border-indigo-200 bg-indigo-50 px-2 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100">📷 查看 ClassIn 二维码</button>
          </div>
          ${pair ? `<label class="mt-2 flex min-h-9 cursor-pointer items-center gap-2 rounded-lg border px-2 py-1.5 transition ${linked ? 'border-indigo-200 bg-indigo-50' : 'border-slate-200 bg-white'}">
            <input type="checkbox" data-pair-link ${linked ? 'checked' : ''} class="h-4 w-4 shrink-0 accent-indigo-600">
            <span class="min-w-0 truncate text-[12px] font-semibold ${linked ? 'text-indigo-800' : 'text-slate-700'}">连带操作下一节 ${other.time} - ${endTime(other.time)} (共 2 节)</span>

          ${pair && !linked ? `<p class="mt-1 text-[12px] font-medium text-slate-600">当前仅操作本节，勾选上方开关可恢复连带。</p>` : ''}

        <section aria-label="高频教务动作" class="mt-2.5">

          </div>
          <div class="mt-1.5 grid grid-cols-2 gap-2">
            ${coordTile('start-leave-move', 'calendar-x', '请假 / 同师挪位', scope.length > 1 ? '本次 2 节 · 释放或平移' : '释放待排 · 同师平移', settled)}
            ${coordTile('start-sub', 'user-check', isGroup ? '代课 / 暂停待排' : '指派代课', isGroup ? '连续双格代课 / 暂停待排' : `按 ${scope.length} 节筛全空闲老师`, settled)}
            ${coordTile('start-attendance', 'clipboard-check', '考勤 / 旷课标记', '正常 · 旷课纠偏', false)}
            ${isGroup ? '' : coordTile('start-change-student', 'arrow-left-right', '换上课学员', '仅变更实际学员', settled)}
          </div>
          ${settled ? '<p class="mt-1.5 rounded-lg border border-amber-300 bg-amber-50 px-2 py-1.5 text-[12px] font-semibold leading-relaxed text-amber-900">已结课 · 排课类动作已置灰，仅保留考勤纠偏。</p>' : ''}
        </section>

        <section aria-label="低频与危险操作" class="mt-2.5 border-t border-slate-200 pt-2">
          <div class="text-[12px] font-semibold text-slate-600">低频 / 危险操作</div>
          ${settled
            ? `<button data-action="start-exception-backfill" class="mt-1.5 flex min-h-12 w-full items-center gap-2 rounded-xl border border-rose-200 bg-rose-50 px-2.5 py-2 text-left transition hover:bg-rose-100">
                <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-white text-rose-700">${icon('triangle-alert', 'h-4 w-4')}</span>
                <span class="min-w-0 flex-1">
                  <span class="block truncate text-[14px] font-bold text-rose-800">异常未上课回退补生</span>
                  <span class="block truncate text-[12px] font-medium text-rose-700">作废原课次 · 剔除课酬 · 补生 ${scope.length} 节待排期</span>
                </span>
              </button>`
            : `<button data-action="start-withdraw" class="mt-1.5 flex min-h-12 w-full items-center gap-2 rounded-xl border border-rose-200 bg-rose-50 px-2.5 py-2 text-left transition hover:bg-rose-100">
                <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-white text-rose-700">${icon('undo-2', 'h-4 w-4')}</span>
                <span class="min-w-0 flex-1">
                  <span class="block truncate text-[14px] font-bold text-rose-800">撤排退回课次</span>
                  <span class="block truncate text-[12px] font-medium text-rose-700">释放时段并退回 ${scope.length} 节课次</span>
                </span>
              </button>`}
        </section>`;
    }

    function renderCoordLeaveMovePanel() {
      const lesson = state.lesson;
      if (!lesson) return '';
      const scope = coordScope();
      const fixedPair = scope.length > 1 && scope.every((item) => item.kind === 'fixed');
      const leave = leaveEligibility(lesson);
      const move = rescheduleEligibility(lesson);
      const gentle = state.hours < 3;
      const leaveBlocked = fixedPair || !leave.ok;
      const isSub = lesson.kind === 'sub' || !!lesson.actual;
      return `${sheetHeader('请假 / 同师挪位', coordScopeLabel(scope))}
        <div class="rounded-xl border border-slate-300 bg-slate-50/70 p-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-600">当前生效范围</span>
            <span class="text-[14px] font-bold text-slate-900">${scope.length} 节</span>
          </div>
          <div class="mt-1.5 space-y-1">
            ${scope.map((item, index) => `<div class="flex items-center justify-between gap-2 text-[12px]">
              <span class="font-semibold text-slate-800">第 ${index + 1} 节 · ${dayLabel(item.day)} ${item.time} - ${endTime(item.time)}</span>
              <span class="shrink-0 rounded bg-slate-100 px-1.5 py-0.5 font-bold text-slate-700">${TYPE_NAME[item.kind] || '课次'}</span>
            </div>`).join('')}
          </div>
          ${scope.length > 1 ? '<p class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-600">已按摘要卡连带开关合并操作；取消勾选可改为单节。</p>' : ''}
        </div>
        ${gentle ? `<div class="mt-2 rounded-xl border border-amber-300 bg-amber-50 px-3 py-2"><p class="text-[12px] font-semibold leading-relaxed text-amber-900">距开课不足 3 小时，老师可能已进入备课状态，操作时将请确认已与老师沟通。</p></div>` : ''}
        <div class="mt-2 space-y-2">
          <button data-action="coord-leave" ${leaveBlocked ? 'disabled' : ''} class="flex min-h-12 w-full items-center gap-2.5 rounded-xl border px-3 py-2 text-left transition ${leaveBlocked ? 'cursor-not-allowed border-slate-200 bg-slate-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg ${leaveBlocked ? 'bg-slate-100 text-slate-500' : 'bg-slate-100 text-slate-700'}">${icon(leaveBlocked ? 'lock' : 'calendar-x', 'h-4 w-4')}</span>
            <span class="min-w-0 flex-1">
              <span class="block text-[14px] font-bold ${leaveBlocked ? 'text-slate-500' : 'text-slate-900'}">请假退期待排</span>
              <span class="mt-0.5 block text-[12px] font-medium leading-snug ${leaveBlocked ? 'text-slate-600' : 'text-slate-600'}">${fixedPair ? '固定位连选 2 节仅支持单节请假，请先取消连带开关' : `${scope.length} 节释放为绿色空闲，TS 退回待排期`}</span>
            </span>
            ${leaveBlocked ? icon('lock', 'h-4 w-4 shrink-0 text-slate-500') : icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-500')}
          </button>
          <button data-action="coord-reschedule" ${move.ok ? '' : 'disabled'} class="flex min-h-12 w-full items-center gap-2.5 rounded-xl border px-3 py-2 text-left transition ${move.ok ? 'border-slate-200 bg-white hover:bg-slate-50' : 'cursor-not-allowed border-slate-200 bg-slate-50'}">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg ${move.ok ? 'bg-slate-100 text-slate-700' : 'bg-slate-100 text-slate-500'}">${icon(move.ok ? 'move-right' : 'lock', 'h-4 w-4')}</span>
            <span class="min-w-0 flex-1">
              <span class="block text-[14px] font-bold ${move.ok ? 'text-slate-900' : 'text-slate-500'}">同师挪位</span>
              <span class="mt-0.5 block text-[12px] font-medium leading-snug text-slate-600">目标为 ${esc(teacherShort(lesson.teacher))} 的空闲绿格 · 自动置灰学员冲突时段${isSub ? ' · 挪位后解除代课' : ''}</span>
            </span>
            ${move.ok ? icon('chevron-right', 'h-4 w-4 shrink-0 text-slate-500') : icon('lock', 'h-4 w-4 shrink-0 text-slate-500')}
          </button>
        </div>
        ${fixedPair ? '<p class="mt-1.5 rounded-lg border border-amber-300 bg-amber-50 px-2 py-1.5 text-[12px] font-semibold leading-relaxed text-amber-900">固定位为 4 周契约，连选 2 节时仅支持单节请假；请取消连带开关后逐节操作。</p>' : ''}
        ${backRow()}`;
    }

    function coordSubCandidates(scope) {
      const lesson = state.lesson;
      if (!lesson) return [];
      return buildSubCandidates({
        exclude: [lesson.teacher, lesson.actual],
        scope,
        studentKey: lesson.student,
        refTeacherKey: lesson.teacher,
        isGroup: lesson.kind === 'group',
        classKey: lesson.classId,
        search: state.subSearch
      });
    }

    function renderSubCandidateList(candidates, picked, taughtLabel) {
      if (!candidates.length) {
        return '<p class="rounded-lg border border-amber-300 bg-amber-50 px-2 py-1.5 text-[12px] font-semibold leading-relaxed text-amber-900">没有匹配的老师，请调整姓名搜索。</p>';
      }
      return `<div class="mt-2 space-y-1.5">
        ${candidates.map((teacher) => {
          const on = picked === teacher.key && teacher.available;
          return `<button data-action="select-sub" data-key="${teacher.key}" ${teacher.available ? '' : 'disabled'} class="flex min-h-12 w-full items-start gap-2 rounded-lg border px-2.5 py-1.5 text-left transition ${teacher.available ? (on ? 'border-indigo-300 bg-indigo-50' : 'border-slate-200 bg-white hover:bg-slate-50') : 'cursor-not-allowed border-slate-200 bg-slate-50 opacity-75'}">
            <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg ${on ? 'bg-white text-indigo-700' : 'bg-slate-100 text-slate-700'} text-[12px] font-bold">${teacher.initial}</span>
            <span class="min-w-0 flex-1">
              <span class="flex items-center gap-1">
                <span class="truncate text-[14px] font-bold ${on ? 'text-indigo-700' : teacher.available ? 'text-slate-900' : 'text-slate-500'}">${esc(teacher.name)}</span>
                <span class="shrink-0 rounded bg-slate-100 px-1 py-0.5 text-[12px] font-semibold text-slate-700">${esc(teacher.tierLabel)}</span>
                ${teacher.taught ? `<span class="shrink-0 rounded border border-emerald-200 bg-emerald-50 px-1 py-0.5 text-[12px] font-bold text-emerald-700">${taughtLabel}</span>` : ''}
              </span>
              <span class="mt-0.5 block truncate text-[12px] font-medium text-slate-600">${esc(teacher.tierText)} · 本周已排 ${teacher.load} 节</span>
              ${teacher.available ? '' : `<span class="mt-0.5 block truncate text-[12px] font-bold text-rose-700">${esc(teacher.reason)}</span>`}
            </span>
            <span class="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-full border ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 bg-white'}">${on ? icon('check', 'h-3 w-3') : ''}</span>
          </button>`;
        }).join('')}
      </div>`;
    }

    function renderCoordSubPanel() {
      const lesson = state.lesson;
      if (!lesson) return '';
      if (lesson.kind === 'group') return renderCoordGroupSubPanel();
      const scope = coordScope();
      const candidates = coordSubCandidates(scope);
      const picked = candidates.some((teacher) => teacher.key === state.subCandidate && teacher.available)
        ? state.subCandidate
        : subFirstAvailable(candidates);
      const already = lesson.kind === 'sub' && lesson.actual;
      const gentle = state.hours < 3;
      return `${sheetHeader('指派代课', `${coordScopeLabel(scope)} · 按 ${scope.length} 节筛全空闲老师`)}
        ${renderHandoverBrief(lesson.student)}
        ${already ? `<div class="mt-2 rounded-xl border border-blue-200 bg-blue-50 p-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold text-slate-900">当前代课 ${esc(teacherName(lesson.actual))}</span>
            <span class="rounded bg-white px-1.5 py-0.5 text-[12px] font-bold text-blue-800">已指派</span>
          </div>
          <p class="mt-1 text-[12px] font-medium text-slate-600">原任 ${esc(teacherName(lesson.teacher))} · 撤销后恢复原任老师排期。</p>
          <button data-action="coord-revoke-sub" class="mt-2 flex h-9 w-full items-center justify-center gap-1 rounded-lg border border-rose-200 bg-white text-[12px] font-bold text-rose-700 transition hover:bg-rose-50">${icon('undo-2', 'h-4 w-4')}撤销代课指派</button>
        </div>` : ''}
        <div class="mt-2 rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="text-[12px] font-semibold text-slate-600">本次过滤的 ${scope.length} 个具体时段</div>
          <div class="mt-1 flex flex-wrap gap-1">
            ${scope.map((cell) => `<span class="rounded border border-slate-200 bg-white px-1.5 py-0.5 text-[12px] font-semibold text-slate-700">${dayLabel(cell.day)} ${cell.time} - ${endTime(cell.time)}</span>`).join('')}
          </div>
        </div>
        <div class="mt-1.5 flex items-center gap-1.5">
          <div class="relative min-w-0 flex-1">
            <span class="pointer-events-none absolute left-2 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-3.5 w-3.5')}</span>
            <input data-sub-search value="${esc(state.subSearch)}" placeholder="按老师姓名搜索" class="h-9 w-full rounded-lg border border-slate-200 bg-white pl-7 pr-2 text-[14px] font-medium text-slate-800 outline-none focus:border-indigo-400">
          </div>
          ${state.subSearch ? `<button data-action="clear-sub-search" class="h-9 shrink-0 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-800">清空</button>` : ''}
        </div>
        <div class="mt-2 rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold text-slate-900">全空闲在职老师</span>
            <span class="text-[12px] font-medium text-slate-600">熟客 → 同/相近价位 → 负荷</span>
          </div>
          <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">全平台在职空闲老师均可指派，无课型或资质过滤；不满足时段条件时置灰并标注冲突时段。</p>
          ${renderSubCandidateList(candidates, picked, '教过该学员')}
        </div>
        ${gentle ? '<p class="mt-1.5 rounded-lg border border-amber-300 bg-amber-50 px-2 py-1.5 text-[12px] font-semibold leading-relaxed text-amber-900">距开课不足 3 小时，确认后仍可指派代课。</p>' : ''}
        <button data-action="confirm-sub" ${picked ? '' : 'disabled'} class="mt-2.5 flex h-10 w-full items-center justify-center gap-1 rounded-lg text-[14px] font-bold transition ${picked ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'cursor-not-allowed bg-slate-200 text-slate-500'}">${icon('user-check', 'h-4 w-4')}确认指派代课</button>
        ${backRow()}`;
    }

    function renderCoordGroupSubPanel() {
      const lesson = state.lesson;
      const scope = coordScope();
      const candidates = coordSubCandidates(scope);
      const picked = candidates.some((teacher) => teacher.key === state.subCandidate && teacher.available)
        ? state.subCandidate
        : subFirstAvailable(candidates);
      const already = !!lesson.actual;
      const gentle = state.hours < 3;
      const teacherReason = state.outageReason !== 'holiday';
      return `${sheetHeader('代课 / 暂停待排', coordScopeLabel(scope))}
        ${already ? `<div class="rounded-xl border border-blue-200 bg-blue-50 p-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold text-slate-900">当前代课 ${esc(teacherName(lesson.actual))}</span>
            <span class="rounded bg-white px-1.5 py-0.5 text-[12px] font-bold text-blue-800">已指派</span>
          </div>
          <button data-action="coord-revoke-sub" class="mt-2 flex h-9 w-full items-center justify-center gap-1 rounded-lg border border-rose-200 bg-white text-[12px] font-bold text-rose-700 transition hover:bg-rose-50">${icon('undo-2', 'h-4 w-4')}撤销代课指派</button>
        </div>` : ''}
        <div class="mt-1.5 flex items-center gap-1.5">
          <div class="relative min-w-0 flex-1">
            <span class="pointer-events-none absolute left-2 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-3.5 w-3.5')}</span>
            <input data-sub-search value="${esc(state.subSearch)}" placeholder="按老师姓名搜索" class="h-9 w-full rounded-lg border border-slate-200 bg-white pl-7 pr-2 text-[14px] font-medium text-slate-800 outline-none focus:border-indigo-400">
          </div>
          ${state.subSearch ? `<button data-action="clear-sub-search" class="h-9 shrink-0 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-800">清空</button>` : ''}
        </div>
        <div class="mt-2 rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold text-slate-900">路线 A · 指派临时代课</span>
            <span class="rounded bg-teal-50 px-1.5 py-0.5 text-[12px] font-bold text-teal-800">连续双格空闲</span>
          </div>
          <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-600">全平台在职连续双格空闲老师均可指派，无课型或资质过滤；课酬按原快照平移。</p>
          ${renderSubCandidateList(candidates, picked, '教过本班')}
          <button data-action="confirm-sub" ${picked ? '' : 'disabled'} class="mt-2 flex h-10 w-full items-center justify-center gap-1 rounded-lg text-[14px] font-bold transition ${picked ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'cursor-not-allowed bg-slate-200 text-slate-500'}">${icon('user-check', 'h-4 w-4')}确认指派代课</button>
        </div>
        <div class="mt-2 rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[14px] font-bold text-slate-900">路线 B · 暂停待排</span>
            <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">不扣学员课次</span>
          </div>
          <div class="mt-2 grid grid-cols-2 gap-1.5">
            <button data-action="outage-reason" data-value="teacher" class="h-9 rounded-lg border px-1 text-[12px] font-bold transition ${teacherReason ? 'border-rose-300 bg-rose-50 text-rose-800' : 'border-slate-200 bg-white text-slate-700'}">老师原因</button>
            <button data-action="outage-reason" data-value="holiday" class="h-9 rounded-lg border px-1 text-[12px] font-bold transition ${!teacherReason ? 'border-emerald-300 bg-emerald-50 text-emerald-800' : 'border-slate-200 bg-white text-slate-700'}">节假日 / 调休</button>
          </div>
          <p class="mt-1.5 rounded-lg border px-2 py-1.5 text-[12px] font-semibold leading-relaxed ${teacherReason ? 'border-rose-200 bg-rose-50 text-rose-700' : 'border-emerald-200 bg-emerald-50 text-emerald-800'}">${teacherReason ? '原网格标红不可约，TS 退回小班待排池。' : '原网格释放为绿色可约，TS 退回小班待排池。'}</p>
          <button data-action="confirm-group-outage" class="mt-2 flex h-10 w-full items-center justify-center gap-1 rounded-lg border border-slate-300 bg-white text-[14px] font-bold text-slate-800 transition hover:bg-slate-50">${icon('calendar-x', 'h-4 w-4')}确认暂停待排</button>
          <a href="m3d_scheduling_workbench.html?role=monitor&mode=group_single&classId=${esc(lesson.classId || 'ket1')}" class="mt-2 flex h-9 w-full items-center justify-center gap-1 rounded-lg border border-slate-300 bg-white text-[12px] font-bold text-slate-800 transition hover:bg-slate-50">${icon('calendar-plus', 'h-4 w-4')}单节补排入口 ↗</a>
        </div>
        ${gentle ? '<p class="mt-1.5 rounded-lg border border-amber-300 bg-amber-50 px-2 py-1.5 text-[12px] font-semibold leading-relaxed text-amber-900">距开课不足 3 小时，确认后仍可指派代课。</p>' : ''}
        ${backRow()}`;
    }

    function renderCoordAttendancePanel() {
      const lesson = state.lesson;
      if (!lesson) return '';
      const mark = state.attendanceMark;
      const abnormal = mark === 'student-absent' || mark === 'teacher-absent';
      const markLabel = mark === 'student-absent' ? '学员旷课' : (mark === 'teacher-absent' ? '老师旷课' : '');
      return `${sheetHeader('考勤 / 旷课标记', slotLabel(lesson.day, lesson.time, lesson.kind === 'group' ? 2 : 1))}
        <div class="rounded-xl border px-3 py-2.5 ${abnormal ? 'border-rose-200 bg-rose-50' : 'border-slate-300 bg-slate-50/70'}">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-medium text-slate-600">当前状态</span>
            <span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${abnormal ? 'border-rose-300 bg-white text-rose-800' : 'border-emerald-200 bg-emerald-50 text-emerald-800'}">${abnormal ? markLabel : '正常（次日 02:00 自动结课）'}</span>
          </div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed ${abnormal ? 'text-rose-700' : 'text-slate-600'}">系统于次日凌晨 02:00 自动结课并照常扣减课次、计入课酬；日常无需手动标记正常。</p>
        </div>
        ${abnormal ? `<button data-action="coord-attendance-normal" class="mt-2 flex h-10 w-full items-center justify-center gap-1 rounded-lg border border-slate-300 bg-white text-[14px] font-bold text-slate-800 transition hover:bg-slate-50">${icon('undo-2', 'h-4 w-4')}恢复为正常出勤</button>` : ''}
        <div class="mt-2 grid grid-cols-2 gap-2">
          <button data-action="coord-attendance" data-value="student-absent" class="flex h-11 items-center justify-center gap-1 rounded-lg border px-1.5 text-[14px] font-bold transition ${mark === 'student-absent' ? 'border-rose-300 bg-rose-50 text-rose-800' : 'border-slate-200 bg-white text-slate-800 hover:bg-slate-50'}">${icon('user-x', 'h-4 w-4')}标为学员旷课</button>
          <button data-action="coord-attendance" data-value="teacher-absent" class="flex h-11 items-center justify-center gap-1 rounded-lg border px-1.5 text-[14px] font-bold transition ${mark === 'teacher-absent' ? 'border-rose-300 bg-rose-50 text-rose-800' : 'border-slate-200 bg-white text-slate-800 hover:bg-slate-50'}">${icon('triangle-alert', 'h-4 w-4')}标为老师旷课</button>
        </div>
        ${backRow()}`;
    }

    function renderExceptionBackfillPanel() {
      const lesson = state.lesson;
      if (!lesson) return '';
      const scope = coordScope();
      return `${sheetHeader('异常未上课回退补生', coordScopeLabel(scope))}
        <div class="rounded-xl border border-rose-200 bg-rose-50 p-3">
          <div class="flex items-center gap-1.5 text-[14px] font-bold text-rose-800">${icon('triangle-alert', 'h-4 w-4')}已结课且尚未完成周转账归集</div>
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-rose-700">作废原课次并剔除已计课酬，按原单补生 ${scope.length} 节全新待排期课次；该操作不可撤销。</p>
        </div>
        <button data-action="confirm-exception-backfill" class="mt-3 flex h-11 w-full items-center justify-center gap-1 rounded-xl bg-rose-600 text-[16px] font-bold text-white transition hover:bg-rose-700">确认回退并补生 ${scope.length} 节</button>
        ${backRow()}`;
    }

    function renderAttendancePanel() {
      const options = [
        { value: 'present', label: '正常出勤', desc: '本节按时完成', icon: 'check-circle-2' },
        { value: 'student-absent', label: '学员旷课', desc: '记录学员未到课', icon: 'user-x' },
        { value: 'teacher-absent', label: '老师旷课', desc: '记录老师未到课', icon: 'triangle-alert' }
      ];
      return `${sheetHeader('考勤打卡', slotLabel(state.lesson.day, state.lesson.time))}
        <div class="space-y-2">
          ${options.map((option) => `<button data-action="mark-attendance" data-value="${option.value}" class="flex h-14 w-full items-center gap-2.5 rounded-xl border border-slate-200 bg-white px-3 text-left transition hover:bg-slate-50">
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-slate-100 text-slate-700">${icon(option.icon, 'h-4 w-4')}</span>

    function teacherDaySlots(day) {
      const list = [];
      GRID_TIMES.forEach((time) => {
        if (isGroupContinuation(day, time)) return;
        const slot = getSlot(day, time);
        let status = '空闲';
        if (slot.lesson) {
          status = slot.lesson.kind === 'group' ? '排课 · 小班' : '排课';
        } else if (slot.kind === 'rest') {
          status = '休息';
        } else if (slot.kind === 'leave') {
          status = '请假';
        }
        const open = teacherOpen(state.teacher, day, time);
        if (!slot.lesson && slot.kind !== 'leave' && !open) return;
        list.push({ day, time, status, lesson: slot.lesson, kind: slot.kind });
      });
      return list;
    }

        render(true);
      }, 2800);

    function showToast(message) {
      state.toast = message;
      render(true);
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => {
        state.toast = '';
        render(true);
      }, 2600);

    function requireOnline() {
      if (state.online) return true;
      showToast('当前为离线只读，暂不可提交');
      return false;
    }

    /* ------------------------------------------------------------------
     * 操作
     * ------------------------------------------------------------------ */
    function openParentLesson(lesson) {
      if (!lesson) return;
      state.lesson = lesson;
      state.drawer = 'parent-lesson';
      state.panel = null;
      state.pairSel = {};
      const pair = pairFor(lesson);
      if (pair) pair.forEach((item) => { state.pairSel[item.time] = true; });
      render(true);
    }

    function handleCell(day, time) {
      if (state.weekStudent) {
        const slot = getSlot(day, time);
        if (slot.lesson) {
          const stu = STUDENTS[state.weekStudent];
          showToast(`${stu.nick} ${dayLabel(day)} ${time} · ${TYPE_NAME[slot.lesson.kind] || '课次'}`);
        } else {
          showToast('请到对应学员课表操作');
        }
        return;
      }
      if (state.reschedule) {
        const info = rescheduleTargetInfo(day, time);
        if (!info || !info.inWindow) {
          showToast('该时段不在同师挪位窗口内');
          return;
        }
        if (info.isSource) {
          showToast('请选择原课次以外的同师绿色空闲格');
          return;
        }
        const slot = getSlot(day, time);
        if (slot.kind !== 'available') {
          showToast('请选择原授课老师的绿色空闲时段');
          return;
        }
        if (info.conflict) {
          showToast('学员该时段已有其他课程，请选择其他空闲时段');
          return;
        }
        const targets = state.reschedule.times.map((_, index) => fmtMinutes(toMin(time) + index * 30));
        const conflictTarget = targets.some((target) => studentConflictAt(day, target, state.reschedule.student));
        if (conflictTarget) {
          showToast('学员该时段已有其他课程，请选择其他空闲时段');
          return;
        }
        const allFree = targets.every((target) => toMin(target) < GRID_END && getSlot(day, target).kind === 'available');
        if (!allFree) {
          showToast('该时段无法容纳连续课程，请选择其他空闲时段');
          return;
        }
        state.modal = { type: 'reschedule', day, time, targets };
        render(true);
        return;
      }

      const slot = getSlot(day, time);
      if (state.role === 'parent') {
        if (slot.lesson && ['fixed', 'temp', 'sub', 'group'].includes(slot.lesson.kind)) {
          openParentLesson(slot.lesson);
          return;
        }
        if (slot.kind === 'hold') {
          showToast('续费预占中，请在续费单中确认');
          return;
        }
        if (slot.kind === 'available') {
          state.target = { day, time };
          state.drawer = 'parent-book';
          state.panel = null;
          state.bookDuration = 30;
          normalizeBookTier(state.child);
          render(true);
          return;
        }
        showToast(inParentBookWindow(day) ? '该时段暂不可预约' : '仅支持预约未来 1~7 天');
        return;
      }

      if (slot.lesson && ['fixed', 'temp', 'sub', 'subbing', 'group'].includes(slot.lesson.kind)) {
        state.lesson = slot.lesson;
        state.drawer = 'staff-lesson';
        state.panel = null;
        state.pairSel = {};
        state.pairLink = true;
        state.lessonSettled = false;
        state.attendanceMark = '';
        state.outageReason = 'teacher';
        const pair = pairFor(slot.lesson);
        if (pair) pair.forEach((item) => { state.pairSel[item.time] = true; });
        render(true);
        return;
      }
      if (slot.kind === 'hold') {
        showToast('续费预占中，请在购课单中确认');
        return;
      }
      if (slot.kind === 'available') {
        if (state.role === 'teacher') {
          state.target = { day, time };
          state.drawer = 'teacher-free';
          state.panel = null;
          render(true);
          return;
        }
        state.target = { day, time };
        state.drawer = 'staff-free';
        state.panel = null;
        state.bookDuration = 30;
        state.staffStudentSearch = '';
        state.quickTrialOpen = false;
        state.quickTrialNick = '';
        state.quickTrialContact = '';
        state.quickTrialError = '';
        state.quickTrialOrderSync = true;
        render(true);
        return;
      }
      state.target = { day, time };
      state.drawer = 'staff-rest';
      state.panel = null;
      render(true);
    }

    function beginReschedule(cells, gentleOk = false) {
      const list = (cells || []).filter(Boolean).sort((a, b) => toMin(a.time) - toMin(b.time));
      if (!list.length) {
        showToast('请至少选择 1 节课程');
        return;
      }
      const check = rescheduleEligibility(list[0]);
      if (!check.ok) {
        showToast(check.reason);
        return;
      }
      if (isStaff() && state.hours < 3 && !gentleOk) {
        state.modal = { type: 'staff-gentle', action: 'reschedule', cells: list };
        render(true);
        return;
      }
      state.reschedule = {
        round: state.roundOffset,
        week: state.week,
        day: list[0].day,
        times: list.map((item) => item.time),
        teacher: list[0].teacher,
        student: list[0].student,
        kind: list[0].kind === 'temp' ? 'temp' : 'fixed',
        sourceKind: list[0].kind
      };
      state.drawer = null;
      state.panel = null;
      state.modal = null;
      render(true);
      showToast(list[0].kind === 'temp'
        ? '请选择原课次前后 7 天内同师绿色空闲格'
        : '请选择本轮 4 周内同师绿色空闲格');
    }

    function applyReschedule() {
      if (!requireOnline()) return;
      const source = state.reschedule;
      const modal = state.modal;
      if (!source || !modal) return;
      const targetKind = source.sourceKind === 'sub' ? 'fixed' : source.kind;
      modal.targets.forEach((time) => {
        overrides[slotKey(state.week, modal.day, time)] = {
          day: modal.day,
          time,
          teacher: source.teacher,
          student: source.student,
          kind: targetKind
        };
      });
      source.times.forEach((time) => {
        overrides[slotKey(source.week, source.day, time)] = { forced: 'available' };
      });
      const removedSub = source.sourceKind === 'sub';
      state.reschedule = null;
      state.modal = null;
      render(true);
      showToast(removedSub
        ? '挪位成功，已解除代课委任，目标格回到固定位'
        : '挪位成功，原格释放、目标格已落盘');
    }

    function releaseLeaveCells(cells) {
      let applied = 0;
      cells.forEach((cell) => {
        if (!['fixed', 'temp', 'sub'].includes(cell.kind)) return;
        overrides[slotKey(state.week, cell.day, cell.time)] = { forced: 'available' };
        applied += 1;
      });
      return applied;
    }

    function confirmLeave(gentleConfirmed = false) {
      if (!requireOnline()) return;
      const cells = leaveCellsNow();
      if (!cells.length) {
        showToast('请选择要请假的课次');
        return;
      }
      const eligibility = leaveEligibility(cells[0]);
      if (!eligibility.ok) {
        showToast(eligibility.reason);
        return;
      }
      if (eligibility.gentle && !gentleConfirmed) {
        state.modal = { type: 'leave-gentle' };
        render(true);
        return;
      }
      const applied = releaseLeaveCells(cells);
      state.modal = null;
      state.drawer = null;
      state.panel = null;
      state.leaveCells = [];
      render(true);
      showToast(`已请假 ${applied} 节，TS 已退回待排期，课格恢复空闲可约`);
    }

    function createQuickTrialStudent() {
      if (state.role !== 'admin' && state.role !== 'monitor') {
        showToast('仅班长或平台管理员可创建试课学员档案');
        return;
      }
      const rawNick = (state.quickTrialNick || '').trim();
      const contact = (state.quickTrialContact || '').trim();
      const parsed = parseStandardNick(rawNick);
      if (!parsed) {
        state.quickTrialError = '规范英文名格式有误，须为“英文名+大写姓首字母+年龄”，如 MarkL10';
        render(true);
        return;
      }
      const dup = Object.values(STUDENTS).some((s) => s.name.toLowerCase() === parsed.name.toLowerCase());
      if (dup) {
        state.quickTrialError = `规范英文名 ${parsed.name} 已被占用，建议加后缀如 ${parsed.name}b`;
        render(true);
        return;
      }
      if (contact.length < 4) {
        state.quickTrialError = '请输入至少 4 位的家长联系方式（手机号或微信号）';
        render(true);
        return;
      }
      const key = `trial_${Date.now().toString(36)}`;
      STUDENTS[key] = {
        key,
        id: `stu_${key}`,
        name: parsed.name,
        nick: parsed.englishName,
        short: parsed.name.slice(0, 6),
        emoji: '🧒',
        age: parsed.age,
        label: parsed.name,
        credits: 0,
        fixedCredits: 0,
        tempBuckets: { 16: 0, 18: 0, 21: 0 },
        realName: parsed.name,
        parent: `试课待认领 (${contact})`,
        contact,
        status: '试课'
      };
      state.credits[key] = 0;
      state.tempBuckets[key] = { 16: 0, 18: 0, 21: 0 };
      state.staffStudent = key;
      state.staffStudentSearch = '';
      state.quickTrialOpen = false;
      state.quickTrialNick = '';
      state.quickTrialContact = '';
      state.quickTrialError = '';
      state.quickTrialOrderSync = true;
      state.proxyPaymentConfirmed = false;
      render(true);
      showToast(`已创建试课档案 ${parsed.name}（待认领）`);
    }

    function confirmBooking() {
      if (!requireOnline()) return;
      const slot = bookingSlot();
      if (!slot) return;
      const count = Math.max(1, Math.min(4, Math.round((state.bookDuration || 30) / 30)));
      const check = canBookCount(count);
      if (!check.ok) {
        showToast(check.reason || '所选连约节数不可用');
        return;
      }
      const staff = isStaff();
      const studentKey = staff ? state.staffStudent : state.child;
      const studentObj = STUDENTS[studentKey];
      if (!studentObj) {
        showToast('请先选择学员');
        return;
      }
      let teacher = state.teacher;
      if (!staff) {
        normalizeBookTier(state.child);
        const available = freeTeachersFor(slot.day, slot.time, count, state.bookTier).filter((item) => item.available);
        const picked = available.some((item) => item.key === state.bookTeacher) ? state.bookTeacher : (available[0] ? available[0].key : '');
        if (!picked) {
          showToast(`当前时段无连续 ${count} 节空闲老师`);
          return;
        }
        state.bookTeacher = picked;
        teacher = picked;
      }
      const cost = count;
      const avail = studentCredits(studentKey);
      const tTier = staff ? teacherTier(teacher) : Number(state.bookTier);
      let syncedOrderCount = 0;
      if (!staff) {
        const tierAvail = studentTempTierCredits(studentKey, tTier);
        if (tierAvail < cost || avail < cost) {
          showToast(`暂无足够的 ${tTier}积分 待排临时课`);
          return;
        }
        state.credits[state.child] = avail - cost;
        const buckets = Object.assign({}, studentTempBuckets(state.child));
        buckets[tTier] = Math.max(0, tierAvail - cost);
        state.tempBuckets[state.child] = buckets;
      } else if (state.quickTrialOrderSync) {
        if (!state.proxyPaymentConfirmed) {
          showToast('请先勾选确认已收到家长课次费用');
          return;
        }
        syncedOrderCount = cost;
      } else if (avail >= cost) {
        state.credits[studentKey] = avail - cost;
      } else {
        showToast('学员待排 TS 不足，请勾选同步录单并确认收款');
        return;
      }
      const times = bookingTimes(slot.time, count);
      times.forEach((t) => {
        extraLessons.push({
          week: state.week,
          day: slot.day,
          time: t,
          teacher,
          student: studentKey,
          kind: 'temp'
        });
      });
      state.drawer = null;
      state.target = null;
      state.bookTeacherSearch = '';
      state.proxyPaymentConfirmed = false;
      state.proxyProofCount = 0;
      render(true);
      const mins = count * 25;
      const teacherText = teacherName(teacher);
      showToast(staff
        ? (syncedOrderCount > 0
          ? `已确认收款 ¥${syncedOrderCount * tTier} 并生成已付款购课单，由 ${teacherText} 完成 ${studentObj.name} 约课（${count} 节）`
          : `已为 ${studentObj.name} 预约 ${count} 节（${mins} 分钟），授课老师 ${teacherText}`)
        : `已预约 ${count} 节（${mins} 分钟），授课老师 ${teacherText}，扣减 ${tTier}积分临时课 ${cost} 节`);
    }

    function confirmOpenSlot() {
      if (!requireOnline()) return;
      const slot = state.target;
      if (!slot) return;
      overrides[slotKey(state.week, slot.day, slot.time)] = { forced: 'available' };
      state.drawer = null;
      state.target = null;
      render(true);
      showToast('已加开时段，已通知意向家长');
    }

    function confirmLockSlot() {
      if (!requireOnline()) return;
      const slot = state.target;
      if (!slot) return;
      overrides[slotKey(state.week, slot.day, slot.time)] = { forced: 'rest' };
      state.drawer = null;
      state.target = null;
      render(true);
      showToast('已锁定时段，暂不可预约');
    }

    function resolveSubCandidate(scope) {
      const lesson = state.lesson;
      if (!lesson) return '';
      if (state.subCandidate && state.subCandidate !== lesson.teacher && state.subCandidate !== lesson.actual) {
        const conflict = subConflictFor(state.subCandidate, scope);
        const qualified = lesson.kind !== 'group' || SMALL_CLASS_QUALIFIED.includes(state.subCandidate);
        if (!conflict && qualified) return state.subCandidate;
      }
      const candidates = buildSubCandidates({
        exclude: [lesson.teacher, lesson.actual],
        scope,
        studentKey: lesson.student,
        refTeacherKey: lesson.teacher,
        isGroup: lesson.kind === 'group',
        classKey: lesson.classId,
        search: ''
      });
      return subFirstAvailable(candidates);
    }

    function confirmSub(gentleOk = false) {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson) return;
      const scopeCheck = coordScope();
      const chosen = resolveSubCandidate(scopeCheck);
      if (!chosen) {
        showToast('请选择全部时段空闲的在职老师');
        return;
      }
      const conflict = subConflictFor(chosen, scopeCheck);
      if (conflict) {
        showToast(conflict);
        return;
      }
      state.subCandidate = chosen;
      if (isStaff() && state.hours < 3 && !gentleOk) {
        state.modal = { type: 'staff-gentle', action: 'sub' };
        render(true);
        return;
      }
      const key = slotKey(state.week, lesson.day, lesson.time);
      if (lesson.kind === 'group') {
        overrides[key] = Object.assign({}, lesson, { actual: state.subCandidate });
      } else {
        const scope = coordScope();
        scope.forEach((cell) => {
          overrides[slotKey(state.week, cell.day, cell.time)] = Object.assign({}, cell, { kind: 'sub', actual: state.subCandidate });
        });
      }
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(`${TEACHERS[state.subCandidate].name} 已指派代课，课酬按代课快照计入`);
    }

    function markAttendance(value) {
      if (!requireOnline()) return;
      const labels = { present: '正常出勤', 'student-absent': '学员旷课', 'teacher-absent': '老师旷课' };
      state.attendance = value;
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(`已记录：${labels[value] || '正常出勤'}`);
    }

    function confirmWithdraw() {
      if (!requireOnline()) return;
      const scope = coordScope();
      if (!scope.length) return;
      scope.forEach((cell) => {
        overrides[slotKey(state.week, cell.day, cell.time)] = { forced: 'available' };
      });
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(`已撤排 ${scope.length} 节，课次已退回`);
    }

    function coordLeave(gentleOk = false) {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson) return;
      const scope = coordScope();
      if (scope.length > 1 && scope.every((item) => item.kind === 'fixed')) {
        showToast('固定位连选 2 节仅支持单节请假，请先取消连带开关');
        return;
      }
      const check = leaveEligibility(lesson);
      if (!check.ok) {
        showToast(check.reason);
        return;
      }
      if (state.hours < 3 && !gentleOk) {
        state.modal = { type: 'staff-gentle', action: 'coord-leave', cells: scope };
        render(true);
        return;
      }
      applyCoordLeave(scope);
    }

    function applyCoordLeave(cells) {
      const scope = (cells && cells.length) ? cells : coordScope();
      const applied = releaseLeaveCells(scope);
      state.drawer = null;
      state.panel = null;
      state.modal = null;
      render(true);
      showToast(`已请假 ${applied} 节，TS 已退回待排期，课格恢复空闲可约`);
    }

    function coordRevokeSub(gentleOk = false) {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson || !lesson.actual) return;
      if (state.hours < 3 && !gentleOk) {
        state.modal = { type: 'staff-gentle', action: 'revoke-sub' };
        render(true);
        return;
      }
      applyRevokeSub();
    }

    function applyRevokeSub() {
      const lesson = state.lesson;
      if (!lesson) return;
      coordScope().forEach((cell) => {
        const key = slotKey(state.week, cell.day, cell.time);
        if (cell.kind === 'sub') {
          overrides[key] = Object.assign({}, cell, { kind: 'fixed', actual: null });
        } else if (cell.actual) {
          const copy = Object.assign({}, cell);
          delete copy.actual;
          overrides[key] = copy;
        }
      });
      state.drawer = null;
      state.panel = null;
      state.modal = null;
      render(true);
      showToast('已撤销代课指派，恢复原任老师排期');
    }

    function coordMarkAttendance(value) {
      if (!requireOnline()) return;
      const labels = { 'student-absent': '学员旷课', 'teacher-absent': '老师旷课' };
      state.attendanceMark = value;
      render(true);
      showToast(`已标记：${labels[value] || '旷课'}，可在面板内纠偏`);
    }

    function coordRestoreAttendance() {
      if (!requireOnline()) return;
      state.attendanceMark = '';
      render(true);
      showToast('已恢复为正常出勤，按次日 02:00 自动结课');
    }

    function proxyLeave(gentleOk = false) {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson) return;
      const check = leaveEligibility(lesson);
      if (!check.ok) {
        showToast(check.reason);
        return;
      }
      if (isStaff() && state.hours < 3 && !gentleOk) {
        state.modal = { type: 'staff-gentle', action: 'proxy-leave' };
        render(true);
        return;
      }
      const applied = releaseLeaveCells([lesson]);
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(`已代 ${STUDENTS[lesson.student].nick} 请假，TS 已退回待排期`);
    }

    function confirmChangeStudent(gentleOk = false) {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson) return;
      if (isStaff() && state.hours < 3 && !gentleOk) {
        state.modal = { type: 'staff-gentle', action: 'change-student' };
        render(true);
        return;
      }
      const candidates = changeStudentCandidates('').map((student) => student.key);
      const next = candidates.includes(state.changeStudent) ? state.changeStudent : candidates[0];
      if (!next) return;
      const scope = coordScope();
      scope.forEach((cell) => {
        overrides[slotKey(state.week, cell.day, cell.time)] = Object.assign({}, cell, { student: next });
      });
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(`已将 ${scope.length} 节课次换为 ${STUDENTS[next].nick}，原购课单资金归属不变`);
    }

    function confirmGroupOutage() {
      if (!requireOnline()) return;
      const lesson = state.lesson;
      if (!lesson || lesson.kind !== 'group') return;
      const dur = lesson.dur || 2;
      const holiday = state.outageReason === 'holiday';
      for (let index = 0; index < dur; index += 1) {
        const time = fmtMinutes(toMin(lesson.time) + index * 30);
        overrides[slotKey(state.week, lesson.day, time)] = holiday
          ? { forced: 'available' }
          : Object.assign({}, lesson, { time, dur, outage: true });
      }
      state.drawer = null;
      state.panel = null;
      render(true);
      showToast(holiday
        ? '已暂停待排，原网格释放为绿色可约，TS 退回小班待排池'
        : '已暂停待排，原网格标红不可约，TS 退回小班待排池');
    }

    function closeLayers() {
      state.drawer = null;
      state.panel = null;
      state.modal = null;
      state.reschedule = null;
      state.batchOpen = false;
    }

    function handleControl(group, value) {
      if (group === 'role') {
        state.role = value;
        state.drawer = null;
        state.panel = null;
        state.modal = null;
        state.reschedule = null;
        state.batchOpen = false;
        state.scheduleSelect = false;
        state.scheduleStudent = null;
        state.scheduleClass = null;
        state.scheduleSel = {};
        resetScheduleWeeks();
        state.renewalEdit = false;
        state.renewalOrderId = '';
        state.renewalReturn = '';
        state.renewalSaved = false;
        state.pairSel = {};
        state.dayCell = null;
        state.dayIncident = null;
        state.dayCompare = false;
        if (value === 'parent' || value === 'teacher') state.view = 'week';
        if (value === 'parent') {
          state.child = 'alice';
          state.scenario = 'parent';
        } else {
          state.teacher = 'david';
          state.scenario = value;
        }
        render(false);
        return;
      }
      if (group === 'view') {
        if (value === 'day' && state.role !== 'monitor' && state.role !== 'admin') {
          showToast('日调度仅班长与管理员可用');
          return;
        }
        state.view = value === 'day' ? 'day' : 'week';
        state.drawer = null;
        state.dayCell = null;
        state.dayIncident = null;
        state.dayCompare = false;
        render(false);
        return;
      }
      if (group === 'device') {
        state.device = value;
        render(true);
        return;
      }
      if (group === 'network') {
        state.online = value === 'online';
        render(true);
        return;
      }
      if (group === 'hours') {
        const hours = Number(value);
        state.hours = Number.isNaN(hours) ? 32 : hours;
        render(true);
        return;
      }
      if (group === 'week') {
        state.week = clampWeek(value);
        state.drawer = null;
        state.panel = null;
        state.modal = null;
        render(true);
      }
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function segment(group, options, current) {
      return `<div class="flex items-center gap-0.5 rounded-lg border border-slate-200 bg-slate-100 p-0.5">
        ${options.map((option) => `<button data-control="${group}" data-value="${option.value}" class="h-7 rounded-md px-2 text-[12px] font-semibold transition ${String(option.value) === String(current) ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-700'}">${option.label}</button>`).join('')}
      </div>`;
    }

    function setConsoleCollapsed(collapsed) {
      state.consoleCollapsed = collapsed;
      try {
        window.localStorage.setItem('dream_proto_nav_collapsed', collapsed ? '1' : '0');
      } catch (err) {
        /* localStorage 不可用时静默降级 */
      }
      const header = document.querySelector('[data-console-header]');
      const mini = document.querySelector('[data-console-mini]');
      if (header) header.classList.toggle('hidden', collapsed);
      if (mini) {
        mini.classList.toggle('hidden', !collapsed);
        mini.classList.toggle('flex', collapsed);
      }
    }

    function renderConsole() {
      return `<header data-console-header class="sticky top-0 z-[60] border-b border-slate-200 bg-white/95 backdrop-blur ${state.consoleCollapsed ? 'hidden' : ''}">
        <div class="mx-auto max-w-[1500px] px-4 py-2.5">
          <div class="flex flex-wrap items-center gap-2">
            <div class="mr-1 flex items-center gap-2">
              <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-slate-900 text-[14px] font-bold text-white">D</span>
              <div class="min-w-0">
                <h1 class="truncate text-[14px] font-bold text-slate-900">7 色课表演示控制台</h1>
                <p class="hidden text-[12px] font-medium text-slate-500 sm:block">7 色周历 · 动作抽屉 · 家长门槛与班长温和提示 · 日调度</p>
              </div>
            </div>
            <span class="mx-1 hidden h-6 w-px bg-slate-200 sm:block"></span>
            ${segment('role', [
              { value: 'parent', label: '家长' },
              { value: 'teacher', label: '老师' },
              { value: 'monitor', label: '班长' },
              { value: 'admin', label: '管理员' }
            ], state.role)}
            ${segment('week', [
              { value: 0, label: '第1周' },
              { value: 1, label: '第2周' },
              { value: 2, label: '第3周' },
              { value: 3, label: '第4周' }
            ], state.week)}
            ${segment('hours', [
              { value: 32, label: '距开课≥24h' },
              { value: 8, label: '距开课8h' },
              { value: 2, label: '距开课<3h' }
            ], state.hours)}
            ${segment('view', [
              { value: 'week', label: '周课表' },
              { value: 'day', label: '日调度' }
            ], state.view)}
            ${segment('device', [
              { value: 'mobile', label: '手机' },
              { value: 'tablet', label: '平板' }
            ], state.device)}
            ${segment('network', [
              { value: 'online', label: '在线' },
              { value: 'offline', label: '离线' }
            ], state.online ? 'online' : 'offline')}
            <button data-action="reset-demo" class="h-8 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">重置演示</button>
            <a href="../docs/prd/m3a_calendar_grid.md" target="_blank" rel="noopener" class="flex h-8 items-center gap-1 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-50">
              ${icon('file-text', 'h-3.5 w-3.5')}PRD 文档
            </a>
            <button type="button" data-console-collapse aria-label="收起演示导航" class="ml-auto flex h-7 shrink-0 items-center gap-1 rounded-lg border border-slate-200 bg-white px-2.5 text-[12px] font-semibold text-slate-600 transition hover:bg-slate-50">▲ 收起</button>
          </div>
          <div class="mt-2 flex flex-wrap items-center gap-1.5">
            ${SCENARIOS.map((item) => `<button data-scenario="${item.value}" class="h-7 rounded-lg border px-2.5 text-[12px] font-semibold transition ${state.scenario === item.value ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}">${item.label}</button>`).join('')}
            <span class="ml-auto flex items-center gap-1 text-[12px] font-medium text-slate-500">
              ${icon('info', 'h-3.5 w-3.5')}家长守门槛 · 班长不锁 · 开课前不足 3 小时仅温和提示
            </span>
          </div>
        </div>
      </header>
      <div data-console-mini class="sticky top-0 z-[60] ${state.consoleCollapsed ? 'flex' : 'hidden'} items-center justify-end border-b border-slate-200/60 bg-white/70 px-2 py-1 backdrop-blur">
        <button type="button" data-console-expand class="flex h-6 items-center gap-1 rounded-full bg-slate-900/70 px-2.5 text-[12px] font-semibold text-white/90 backdrop-blur transition hover:bg-slate-900/85" aria-label="展开演示导航">▾ 导航</button>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.addEventListener('click', (event) => {
      if (event.target.closest('[data-console-collapse]')) {
        setConsoleCollapsed(true);
        return;
      }
      if (event.target.closest('[data-console-expand]')) {
        setConsoleCollapsed(false);
        return;
      }

      const control = event.target.closest('[data-control]');
      if (control) {
        handleControl(control.dataset.control, control.dataset.value);
        return;
      }

      const scenario = event.target.closest('[data-scenario]');
      if (scenario) {
        applyScenario(scenario.dataset.scenario);
        render(false);
        if (state.scenario === 'booked') armFlashTimers();
        return;
      }

      const actionEl = event.target.closest('[data-action]');
      if (!actionEl) {
        if (state.batchOpen && !event.target.closest('#batchMenu')) {
          state.batchOpen = false;
          render(true);
        }
        return;
      }

      const action = actionEl.dataset.action;
      const key = actionEl.dataset.key;
      const value = actionEl.dataset.value;

      switch (action) {
        case 'bell':
          showToast('有 2 条新的课表通知');
          break;
        case 'open-children':
          state.drawer = 'children';
          state.panel = null;
          render(true);
          break;
        case 'open-asset':
          if (state.role !== 'parent' && state.lesson) state.child = state.lesson.student;
          state.drawer = 'asset';
          state.panel = null;
          render(true);
          break;
        case 'open-teachers':
          state.drawer = 'teachers';
          state.panel = null;
          render(true);
          break;
        case 'open-schedule-select':
          if (state.role !== 'monitor' && state.role !== 'admin') break;
          state.scheduleSelect = true;
          state.scheduleStudent = null;
          state.scheduleClass = null;
          state.scheduleSel = {};
          resetScheduleWeeks();
          state.renewalEdit = false;
          state.renewalOrderId = '';
          state.renewalReturn = '';
          state.renewalSaved = false;
          state.week = 0;
          state.drawer = null;
          state.panel = null;
          state.modal = null;
          state.batchOpen = false;
          render(true);
          showToast('已开启排课复选态，已定位到第 1 周模板周');
          break;
        case 'exit-schedule-select':
          exitScheduleSelect();
          break;
        case 'open-schedule-object':
          state.drawer = 'schedule-object';
          state.panel = null;
          render(true);
          break;
        case 'pick-schedule-object': {
          if (!key) break;
          if (actionEl.dataset.kind === 'class' && CLASSES[key]) {
            state.scheduleClass = key;
            state.scheduleStudent = null;
          } else if (STUDENTS[key]) {
            state.scheduleStudent = key;
            state.scheduleClass = null;
          } else {
            break;
          }
          state.scheduleSel = {};
          resetScheduleWeeks();
          state.week = 0;
          state.drawer = null;
          render(true);
          showToast(actionEl.dataset.kind === 'class'
            ? `已选择小班 ${CLASSES[state.scheduleClass].code}，请从第 1 周模板周选格`
            : `已选择学员 ${STUDENTS[state.scheduleStudent].name}，请从第 1 周模板周选格`);
          break;
        }
        case 'schedule-slot': {
          const day = Number(actionEl.dataset.day);
          const time = actionEl.dataset.time;
          const pair = !!actionEl.dataset.pair;
          toggleScheduleSlot(day, time, pair);
          break;
        }
        case 'restore-schedule-week':
          restoreScheduleWeek(Number(actionEl.dataset.week));
          break;
        case 'remove-schedule-slot':
          delete scheduleWeekMap(state.week)[scheduleSlotKey(Number(actionEl.dataset.day), actionEl.dataset.time)];
          if (state.week > 0) state.scheduleWeekStatus[state.week] = 'adjusted';
          else scheduleSyncDerivedWeeks();
          render(true);
          break;
        case 'confirm-schedule-select':
          confirmScheduleSelect();
          break;
        case 'clear-sub-search':
          state.subSearch = '';
          render(true);
          break;
        case 'clear-change-search':
          state.changeSearch = '';
          render(true);
          break;
        case 'prev-round':
          state.roundOffset -= 1;
          if (state.reschedule) {
            state.drawer = null;
            state.panel = null;
            state.modal = null;
          } else {
            closeLayers();

          render(true);
          break;

          state.roundOffset += 1;

            state.drawer = null;
            state.panel = null;
            state.modal = null;

            closeLayers();

          render(true);
          break;
        case 'day-filter':

          render(true);
          break;
        case 'day-scope':
          state.dayScope = value === 'all' ? 'all' : 'managed';
          render(true);
          break;

          render(true);
          break;

          break;
        case 'confirm-staff-gentle': {

          else if (pending.action === 'revoke-sub') applyRevokeSub();
          else if (pending.action === 'proxy-leave') proxyLeave(true);
          else if (pending.action === 'reschedule') beginReschedule(pending.cells || [], true);
          else if (pending.action === 'change-student') confirmChangeStudent(true);
          else if (pending.action === 'sub') confirmSub(true);
          break;
        }
        case 'close-drawer':
          state.drawer = null;
          state.panel = null;
          render(true);
          break;
        case 'back-panel':

        case 'start-leave':

        case 'pair-leave': {
          const pair = pairFor(state.lesson) || (state.lesson ? [state.lesson] : []);

          confirmBooking();

          state.bookDuration = cnt * 30;

          break;
        case 'clear-book-teacher-search':

          break;
        case 'edit-handover':

          break;
        case 'pick-staff-student':
          state.staffStudent = key || 'alice';
          render(true);
          break;
        case 'clear-staff-student-search':
          state.staffStudentSearch = '';
          render(true);
          break;
        case 'toggle-quick-trial':

          render(true);
          break;
        case 'prefill-quick-trial':
          state.quickTrialOpen = true;
          state.quickTrialError = '';
          state.quickTrialNick = (state.staffStudentSearch || '').trim();
          render(true);
          break;
        case 'cancel-quick-trial':
          state.quickTrialOpen = false;
          state.quickTrialError = '';
          render(true);
          break;
        case 'create-quick-trial':

          break;
        case 'toggle-quick-trial-order':
          state.quickTrialOrderSync = !state.quickTrialOrderSync;
          render(true);
          break;
        case 'confirm-lock-slot':
          confirmLockSlot();
          break;
        case 'select-child':
          state.child = key === 'bob' ? 'bob' : 'alice';
          state.scenario = 'parent';
          state.drawer = null;
          state.panel = null;
          state.pairSel = {};
          state.foldOpen = {};
          state.bookTier = null;
          render(true);
          showToast(`已切换至 ${STUDENTS[state.child].nick}`);

        case 'select-teacher':

          state.panel = null;
          render(true);

          break;
        case 'coord-leave':

          break;
        case 'coord-reschedule':

          coordRevokeSub();
          break;

          break;
        case 'coord-attendance-normal':
          coordRestoreAttendance();
          break;
        case 'outage-reason':
          state.outageReason = value === 'holiday' ? 'holiday' : 'teacher';
          render(true);
          break;
        case 'start-exception-backfill':
          state.panel = 'exception-backfill';
          render(true);
          break;
        case 'start-sub': {
          state.panel = 'sub';
          state.subSearch = '';
          const candidates = coordSubCandidates(coordScope());
          state.subCandidate = subFirstAvailable(candidates) || 'elena';
          render(true);
          break;
        }
        case 'select-sub':
          state.subCandidate = TEACHERS[key] ? key : 'elena';
          render(true);
          break;
        case 'confirm-sub':
          confirmSub();
          break;
        case 'start-attendance':
          state.panel = 'attendance';
          render(true);
          break;
        case 'mark-attendance':
          markAttendance(value);
          break;
        case 'start-teacher-report': {
          const source = state.lesson || state.target;
          state.reportDay = source ? source.day : 0;
          state.reportSel = {};
          if (source) state.reportSel[source.time] = true;
          state.drawer = 'teacher-report';
          state.panel = null;
          render(true);
          scrollReportToSelected();
          break;
        }
        case 'report-tag':
          state.reportTag = actionEl.dataset.tag || 'power';
          render(true);
          break;
        case 'submit-teacher-report': {
          const day = state.reportDay != null ? state.reportDay : (state.lesson ? state.lesson.day : 0);
          const times = Object.keys(state.reportSel).filter((time) => state.reportSel[time]);
          if (!times.length) {
            showToast('请至少勾选 1 个时段');
            break;
          }
          const affected = [];
          times.forEach((time) => {
            const slot = getSlot(day, time);
            if (slot.lesson && slot.lesson.student && !affected.includes(slot.lesson.student)) affected.push(slot.lesson.student);
            if (slot.kind === 'available' || slot.kind === 'rest') {
              overrides[slotKey(state.week, day, time)] = { forced: 'leave' };
            }
          });
          const touched = [];
          affected.forEach((studentKey) => {
            const stored = state.reportHandover[studentKey];
            if (!stored) return;
            const student = STUDENTS[studentKey];
            if (!student) return;
            let changed = false;
            if (stored.progressText && stored.progressText.trim()) {
              student.progressText = stored.progressText.trim();
              student.lastUpdatedBy = `${teacherName(state.teacher)} (老师) · 刚刚`;
              student.stale6Months = false;
              changed = true;
            }
            if (stored.note && stored.note.trim()) { student.notes = stored.note.trim(); changed = true; }
            if (changed) { student.notesAt = '11.16 20:30'; touched.push(student.name); }
          });
          const count = times.length;
          state.drawer = null;
          state.panel = null;
          state.reportDay = null;
          state.reportSel = {};
          state.reportHandover = {};
          render(true);
          showToast(touched.length
            ? `已提交请假报备 · ${count} 节 · 已同步 ${touched.length} 位学员交接信息`
            : `已提交请假报备 · ${count} 节（排课格将生成代课待办包）`);
          break;
        }
        case 'start-change-student': {
          state.changeSearch = '';
          const candidates = changeStudentCandidates('');
          if (candidates.length) state.changeStudent = candidates[0].key;
          state.panel = 'change-student';
          render(true);
          break;
        }
        case 'select-change-student':
          state.changeStudent = STUDENTS[key] ? key : state.changeStudent;
          render(true);
          break;
        case 'confirm-change-student':
          confirmChangeStudent();
          break;
        case 'confirm-exception-backfill': {
          const count = coordScope().length;
          state.drawer = null;
          state.panel = null;
          render(true);
          showToast(`已确认异常未上课，回退补生 ${count} 节待排期课次`);
          break;
        }
        case 'start-withdraw':
          state.panel = 'withdraw';
          render(true);
          break;
        case 'confirm-withdraw':
          confirmWithdraw();
          break;
        case 'confirm-group-outage':
          confirmGroupOutage();
          break;
        case 'confirm-open-slot':
          confirmOpenSlot();
          break;
        case 'open-classin-qr':
          state.modal = { type: 'classin-qr', teacherKey: actionEl.dataset.teacher || 'david' };
          render(true);
          break;
        case 'open-monitor-wechat':
          state.modal = { type: 'monitor-wechat' };
          render(true);
          break;
        case 'open-progress-modal': {
          const sKey = actionEl.dataset.student || 'alice';
          const stu = STUDENTS[sKey] || STUDENTS.alice;
          state.progressDraft = stu.progressText || '';
          state.modal = { type: 'update-progress', studentKey: sKey };
          render(true);
          break;
        }
        case 'fill-progress-preset':
          state.progressDraft = actionEl.dataset.value || '';
          render(true);
          break;
        case 'save-progress-modal': {
          const sKey = state.modal && state.modal.studentKey;
          const stu = STUDENTS[sKey];
          if (stu) {
            stu.progressText = (state.progressDraft || '').trim() || stu.progressText;
            stu.lastUpdatedBy = `${teacherName(state.teacher)} (老师) · 刚刚`;
            stu.stale6Months = false;

          render(true);
          showToast('学习进度已更新并同步至学员档案');
          break;
        }
        case 'toggle-report-notes':
          state.reportNotesExpanded = !state.reportNotesExpanded;
          render(true);
          break;
        case 'toggle-proxy-payment':
          state.proxyPaymentConfirmed = !state.proxyPaymentConfirmed;
          render(true);
          break;
        case 'upload-proxy-proof':
          state.proxyProofCount = state.proxyProofCount >= 5 ? 0 : state.proxyProofCount + 1;
          render(true);
          break;
        case 'parent-pick-sub':
          state.drawer = null;
          state.panel = null;
          render(true);
          showToast('已为您匹配同价位代课老师（原型模拟）');
          break;
        case 'parent-return-pending':
          if (state.lesson) {
            releaseLeaveCells([state.lesson]);
          }
          state.drawer = null;
          state.panel = null;
          render(true);
          showToast('已退回待排期池，可在未来 1～7 天自助重约');
          break;

          showToast('正在打开 ClassIn');
          break;
        case 'confirm-reschedule':
          applyReschedule();
          break;
        case 'cancel-modal':
          state.modal = null;
          render(true);
          break;
        case 'reset-demo':
          applyScenario('parent');
          state.device = 'mobile';
          state.online = true;
          render(false);
          break;
        default:
          break;
      }
    });

    document.addEventListener('change', (event) => {
      const el = event.target;
      if (el.matches('[data-pair-link]')) {
        state.pairLink = el.checked;
        render(true);
        return;
      }
      if (el.matches('[data-pair]')) {
        state.pairSel[el.dataset.pair] = el.checked;
        return;
      }
      if (el.matches('[data-report-slot]')) {
        state.reportSel[el.dataset.reportSlot] = el.checked;
        render(true);
        scrollReportToSelected();
        return;
      }
    });

    function refocusInput(selector) {
      const next = document.querySelector(selector);
      if (!next) return;
      next.focus();
      const end = next.value.length;
      if (next.setSelectionRange) next.setSelectionRange(end, end);
    }

    document.addEventListener('input', (event) => {
      const el = event.target;
      if (el.matches('[data-day-search]')) {
        state.daySearch = el.value;
        render(true);
        refocusInput('[data-day-search]');
        return;
      }
      if (el.matches('[data-sub-search]')) {
        state.subSearch = el.value;
        render(true);
        refocusInput('[data-sub-search]');
        return;
      }
      if (el.matches('[data-change-search]')) {
        state.changeSearch = el.value;
        render(true);
        refocusInput('[data-change-search]');
        return;
      }
      if (el.matches('[data-staff-student-search]')) {
        state.staffStudentSearch = el.value;
        render(true);
        refocusInput('[data-staff-student-search]');
        return;
      }
      if (el.matches('[data-book-teacher-search]')) {
        state.bookTeacherSearch = el.value;
        render(true);
        refocusInput('[data-book-teacher-search]');
        return;
      }
      if (el.matches('[data-report-handover-student]')) {
        const studentKey = el.dataset.reportHandoverStudent;
        const field = el.dataset.reportHandoverField;
        if (!state.reportHandover[studentKey]) state.reportHandover[studentKey] = {};
        state.reportHandover[studentKey][field] = el.value;
        render(true);
        refocusInput(`[data-report-handover-student="${studentKey}"][data-report-handover-field="${field}"]`);
        return;
      }
      if (el.matches('[data-progress-input]')) {
        state.progressDraft = el.value;
        render(true);
        refocusInput('[data-progress-input]');
        return;
      }
      if (el.matches('[data-quick-trial-nick]')) {
        state.quickTrialNick = el.value;
        state.quickTrialError = '';
        render(true);
        refocusInput('[data-quick-trial-nick]');
        return;
      }
      if (el.matches('[data-quick-trial-contact]')) {
        state.quickTrialContact = el.value;
        state.quickTrialError = '';
        render(true);
        refocusInput('[data-quick-trial-contact]');
      }
    });

    /* ------------------------------------------------------------------
     * 初始化
     * ------------------------------------------------------------------ */
    function init() {
      const params = new URLSearchParams(window.location.search);
      const roleParam = params.get('role');
      const role = ['parent', 'teacher', 'monitor', 'admin'].includes(roleParam) ? roleParam : null;
      const scenarioParam = params.get('scenario');
      const weekParam = params.get('week');
      const childParam = params.get('child');
      const teacherParam = params.get('teacher');
      const deviceParam = params.get('device');
      const hoursParam = Number(params.get('hours'));
      const booked = params.get('booked') === '1';
      const viewParam = params.get('view');
      const teacherIdParam = params.get('teacherId');
      const studentIdParam = params.get('studentId');
      const classIdParam = params.get('classId');
      const selectMode = params.get('mode') === 'schedule_select';
      const renewalMode = params.get('mode') === 'renewal_edit';
      const orderIdParam = params.get('orderId') || '';
      const returnParam = params.get('return') || '';
      const studentParam = studentIdParam || params.get('student');
      state.embed = params.get('embed') === '1';

      state.device = deviceParam === 'tablet' ? 'tablet' : 'mobile';

      if (booked) {
        applyScenario('booked');
        state.device = deviceParam === 'tablet' ? 'tablet' : 'mobile';
        if (!Number.isNaN(hoursParam) && hoursParam > 0) state.hours = hoursParam;
        if (role) state.role = role;
        state.week = weekParam !== null ? clampWeek(weekParam) : 1;
        if (childParam === 'bob') state.child = 'bob';
        if (teacherParam && TEACHERS[teacherParam]) state.teacher = teacherParam;
        const modeParam = params.get('mode') === 'group' ? 'group' : 'fixed';
        const slots = parseSlotsParam(params.get('slots'));
        const targets = slots.length
          ? slots
          : (() => {
              const dayParam = params.get('day');
              const timeParam = params.get('time') || '19:00';
              const day = DAY_PARAM[dayParam] !== undefined ? DAY_PARAM[dayParam] : 1;
              return [{ day, time: timeParam }];
            })();
        targets.forEach((target) => {
          const key = slotKey(state.week, target.day, target.time);
          if (!state.flashKeys.includes(key)) state.flashKeys.push(key);
          state.bookedPreview[key] = modeParam;
        });
        state.flash = true;
        state.toast = '排课成功，已在课表中高亮';
        render(false);
        armFlashTimers();
        return;
      }

      let scenario = 'parent';
      if (scenarioParam && SCENARIOS.some((item) => item.value === scenarioParam)) scenario = scenarioParam;
      else if (role) scenario = role;
      else if (viewParam === 'day') scenario = 'day';

      applyScenario(scenario);
      state.device = deviceParam === 'tablet' ? 'tablet' : 'mobile';
      if (!Number.isNaN(hoursParam) && hoursParam > 0) state.hours = hoursParam;
      if (role) state.role = role;
      if (weekParam !== null) state.week = clampWeek(weekParam);
      if (childParam === 'bob') state.child = 'bob';
      if (teacherParam && TEACHERS[teacherParam]) state.teacher = teacherParam;
      if (teacherIdParam) {
        const teacherKey = Object.keys(TEACHERS).find((key) => TEACHERS[key].id === teacherIdParam || key === teacherIdParam);
        if (teacherKey) state.teacher = teacherKey;
      }
      if (selectMode || renewalMode) {
        state.role = role === 'admin' ? 'admin' : 'monitor';
        state.scenario = state.role;
        state.view = 'week';
        state.scheduleSelect = true;
        state.scheduleStudent = null;
        state.scheduleClass = null;
        state.scheduleSel = {};
        resetScheduleWeeks();
        state.week = 0;
        if (renewalMode) {
          state.renewalEdit = true;
          state.renewalOrderId = orderIdParam;
          state.renewalReturn = returnParam;
          state.renewalSaved = false;
          const renewalStudentKey = Object.keys(STUDENTS).find((key) => STUDENTS[key].id === studentParam || key === studentParam);
          state.scheduleStudent = renewalStudentKey || 'alice';
        } else {
          if (studentIdParam) {
            const studentKey = Object.keys(STUDENTS).find((key) => STUDENTS[key].id === studentIdParam || key === studentIdParam);
            if (studentKey) state.scheduleStudent = studentKey;
          }
          if (classIdParam) {
            const classKey = Object.keys(CLASSES).find((key) => CLASSES[key].id === classIdParam || CLASSES[key].key === classIdParam || key === classIdParam);
            if (classKey) {
              state.scheduleClass = classKey;
              state.scheduleStudent = null;
            }
          }
        }
      }
      if (viewParam === 'day' && (state.role === 'monitor' || state.role === 'admin')) state.view = 'day';
      else if (state.role === 'parent' || state.role === 'teacher') state.view = 'week';
      render(false);
    }

    init();

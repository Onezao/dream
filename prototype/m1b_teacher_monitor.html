        resign: { temp: 0, fixed: 1, classes: 0, sub: 0 }
      }
    ];

    const INITIAL_CLASSES = [
      { id: 'cl_ket000001', name: 'KET 冲刺小班', monitorId: 'mn_leo000001', teacherId: 'tc_david0001', status: 'active', students: '6/8' },

    ];

    /* ------------------------------------------------------------------
     * 状态与工具
     * ------------------------------------------------------------------ */
    function emptyTeacherForm() {
      return {
        mode: 'create', id: null, name: '', level: 'Standard', specialties: [],
        introZh: '', introEn: '', avatarDataUrl: '', qrDataUrl: '',

      };
    }

    const state = {
      role: 'monitor',
      page: 'teachers',
      navTab: 'ops',
      device: 'mobile',
      online: 'on',
      teachers: JSON.parse(JSON.stringify(INITIAL_TEACHERS)),
      monitors: JSON.parse(JSON.stringify(INITIAL_MONITORS)),
      classes: JSON.parse(JSON.stringify(INITIAL_CLASSES)),
      activeTeacherId: 'tc_david0001',
      teacherFilter: 'all',
      adminTeacherFilter: 'all',
      adminTeacherMonitor: 'all',
      introLang: 'zh',
      monitorFilter: 'all',

      formReturnPage: 'teachers',

    const $ = (id) => document.getElementById(id);

    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

    function newId(prefix) {
      return `${prefix}_${Math.random().toString(36).slice(2, 11).padEnd(9, '0')}`;
    }

    function currentNav() {
      return NAVS[state.role];
    }

    function myTeachers() {
      return state.teachers.filter((t) => t.monitorId === CURRENT_MONITOR_ID && t.status !== 'resigned');

    function allTeachers() {
      return state.teachers.filter((t) => t.status !== 'resigned');
    }

    function teacherById(id) {
      return state.teachers.find((t) => t.id === id) || null;
    }

    function monitorById(id) {
      return state.monitors.find((m) => m.id === id) || null;
    }

    function monitorMetrics(m) {
      if (!m || m.status === 'resigned') return { teachers: 0, classes: 0, ts: 0, points: 0 };
      return {
        teachers: state.teachers.filter((t) => t.monitorId === m.id && t.status !== 'resigned').length,
        classes: state.classes.filter((c) => c.monitorId === m.id && ['recruiting', 'active'].includes(c.status)).length,
        ts: m.unsettledTs || 0,
        points: m.unsettledPoints || 0
      };
    }

    function missingMedia(t) {
      const missing = [];
      if (!t.introEn || !t.introEn.trim()) missing.push('英文简介');
      if (!t.media || !t.media.photo) missing.push('个人照片');
      if (!t.media || !t.media.qr) missing.push('ClassIn 二维码');
      if (!t.media || !t.media.video) missing.push('试讲视频');
      return missing;
    }

    function formMissing() {
      const f = state.form;
      const missing = [];
      if (!f.introEn.trim()) missing.push('英文简介');
      if (!f.media.photo) missing.push('个人照片');
      if (!f.media.qr) missing.push('ClassIn 二维码');
      if (!f.media.video) missing.push('试讲视频');
      return missing;
    }

    function teacherStatusMeta(t) {
      if (t.status === 'resigned') return { label: '已离职', tone: 'slate' };
      if (missingMedia(t).length) return { label: '待完善', tone: 'amber' };
      if (t.status === 'pending') return { label: '待发布', tone: 'amber' };
      return { label: '在职', tone: 'emerald' };
    }

    function monitorStatusChip(status) {
      return status === 'active'
        ? `<span class="shrink-0 rounded-full border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">在职</span>`
        : `<span class="shrink-0 rounded-full border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-500">已离职</span>`;
    }

    function levelBadge(level, tone = 'indigo') {
      return `<span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${TONES[tone].chip}">${esc(level)}</span>`;
    }

    function statusChip(t) {
      const meta = teacherStatusMeta(t);
      const T = TONES[meta.tone];
      return `<span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${T.chip}">${meta.label}</span>`;
    }

    function mainPhotoId(t) {
      if (t.avatarPhotoId) return t.avatarPhotoId;
      return t.photos && t.photos[0] ? t.photos[0].id : null;
    }

    function mainPhoto(t) {
      return (t.photos || []).find((p) => p.id === mainPhotoId(t)) || (t.photos || [])[0] || null;
    }

    function avatar(t, size = 'h-14 w-14', text = 'text-[18px]', tone = 'indigo') {
      const initial = (t.name || '?').trim().charAt(0).toUpperCase() || '?';
      const photo = mainPhoto(t);
      const src = t.avatarDataUrl || (photo ? photo.dataUrl : '');
      if (src) return `<img src="${esc(src)}" alt="" class="${size} shrink-0 rounded-full object-cover ring-1 ring-slate-200">`;
      return `<span class="${size} grid shrink-0 place-items-center rounded-full ${TONES[tone].icon} ${text} font-bold ring-1 ring-black/5">${esc(initial)}</span>`;
    }

    function qrSvg(seed) {
      const n = 9;
      let h = 0;
      for (const ch of String(seed)) h = (h * 131 + ch.charCodeAt(0)) >>> 0;
      const isFinder = (x, y, ox, oy) => x >= ox && x < ox + 3 && y >= oy && y < oy + 3
        && (x === ox || x === ox + 2 || y === oy || y === oy + 2 || (x === ox + 1 && y === oy + 1));
      let rects = '';
      for (let y = 0; y < n; y++) {
        for (let x = 0; x < n; x++) {
          const on = isFinder(x, y, 0, 0) || isFinder(x, y, 6, 0) || isFinder(x, y, 0, 6)
            ? true
            : ((h >> ((x + y * 3) % 30)) & 1) === 1;
          if (on) rects += `<rect x="${x * 10}" y="${y * 10}" width="10" height="10"/>`;
        }
      }
      return `<svg viewBox="0 0 90 90" class="h-full w-full text-slate-900" fill="currentColor" aria-hidden="true">${rects}</svg>`;
    }

    function mediaStatusText(t) {
      const missing = missingMedia(t);
      return missing.length
        ? { ok: false, text: `待补：${missing.join('、')}` }
        : { ok: true, text: '多媒体已就绪' };
    }

    function isEmailValid(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
    }

    function isValidPhone(phone) {
      const clean = String(phone || '').replace(/[\s-]/g, '');
      return /^\+?[1-9]\d{6,14}$/.test(clean);
    }

    function filteredMonitors() {
      const q = state.monitorQuery.trim().toLowerCase();
      return state.monitors
        .filter((m) => state.monitorFilter === 'all' || m.status === state.monitorFilter)
        .filter((m) => !q || [m.name, m.email, m.phone].join(' ').toLowerCase().includes(q))
        .sort((a, b) => {
          if (a.status !== b.status) return a.status === 'active' ? -1 : 1;
          return b.appointedAt.localeCompare(a.appointedAt);
        });
    }

    function filteredAdminTeachers() {
      return allTeachers().filter((t) => {
        const monitorOk = state.adminTeacherMonitor === 'all' || t.monitorId === state.adminTeacherMonitor;
        const pending = t.status === 'pending' || missingMedia(t).length > 0;
        const statusOk = state.adminTeacherFilter === 'all' || pending;
        return monitorOk && statusOk;
      });
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function viewAllowed(v) {
      if (state.role === 'monitor') return ['teachers', 'detail', 'form'].includes(v);
      return ['teachers', 'detail', 'monitors'].includes(v);
    }

    function currentViewKey() {
      if (state.page === 'placeholder') return '';
      if (state.page === 'teacherForm') return 'form';
      if (state.page === 'teacherDetail') return 'detail';
      if (state.page === 'monitors') return 'monitors';
      if (state.page === 'teachers') return 'teachers';
      return '';
    }

    function syncConsole() {
      const view = currentViewKey();
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const value = b.dataset.value;
        let active = false;
        let disabled = false;
        if (group === 'role') active = state.role === value;
        if (group === 'view') { active = view === value; disabled = !viewAllowed(value); }
        if (group === 'device') active = state.device === value;
        if (group === 'online') active = state.online === value;
        b.disabled = disabled;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}${disabled ? ' cursor-not-allowed opacity-40' : ''}`;
      });
    }

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'view') setView(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：可浏览缓存，录入与人事操作不可用');
        }
      });
    });

    function setRole(role) {
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.page = role === 'admin' ? 'monitors' : 'teachers';
      state.navTab = role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      if (role === 'admin') {
        state.monitorFilter = 'all';
        state.monitorQuery = '';
      } else {
        ensureActiveTeacher();
      }
      renderAll();
    }

    function setView(view) {
      if (view === 'teachers') {
        state.page = 'teachers';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      }
      if (view === 'detail') {
        if (state.role === 'monitor' && !myTeachers().length) {
          showToast('暂无可查看的教师档案');
          state.page = 'teachers';
        } else {
          ensureActiveTeacher();
          state.page = 'teacherDetail';
          state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        }
      }
      if (view === 'form' && state.role === 'monitor') startTeacherForm('create');
      if (view === 'monitors' && state.role === 'admin') {
        state.page = 'monitors';
        state.navTab = 'settings';
      }
      state.overlay = null;
      renderAll();
    }

    function ensureActiveTeacher() {
      const list = state.role === 'admin' ? allTeachers() : myTeachers();
      if (!list.some((t) => t.id === state.activeTeacherId)) {
        state.activeTeacherId = list[0] ? list[0].id : '';
      }
    }

    function resetDemo() {
      state.role = 'monitor';
      state.page = 'teachers';
      state.navTab = 'ops';
      state.device = 'mobile';
      state.online = 'on';
      state.teachers = clone(INITIAL_TEACHERS);
      state.monitors = clone(INITIAL_MONITORS);
      state.classes = clone(INITIAL_CLASSES);
      state.activeTeacherId = 'tc_david0001';
      state.teacherFilter = 'all';
      state.adminTeacherFilter = 'all';
      state.adminTeacherMonitor = 'all';
      state.introLang = 'zh';
      state.monitorFilter = 'all';
      state.monitorQuery = '';
      state.form = emptyTeacherForm();
      state.formReturnPage = 'teachers';
      state.overlay = null;
      state.resignTeacher = { cleared: false };
      state.appoint = { email: '', name: '', phone: '', error: '' };
      state.rebind = { monitorId: null, targetId: '', teacherIds: [], classIds: [], error: '' };
      state.dismiss = { monitorId: null, fundsCleared: false, eduCleared: false, confirmName: '', error: '' };
      state.singleRebind = { teacherId: null, targetId: '', error: '' };
      renderAll();
      showToast('演示数据已重置');
    }

    $('btnResetDemo').addEventListener('click', resetDemo);

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      $('banner').innerHTML = renderBanner();

      const off = $('offlineBanner');
      off.className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';
      off.innerHTML = state.online === 'off'
        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线模式：可浏览缓存，录入与人事操作不可用`
        : '';

      $('content').innerHTML = renderContent();
      $('bottomnav').innerHTML = state.page === 'teacherForm' ? '' : renderNav();
      $('overlay').innerHTML = renderOverlay();
      syncConsole();
      if (window.lucide) lucide.createIcons();

    function renderBanner() {
      const b = BANNERS[state.role];
      return `
        <header class="relative flex h-[68px] shrink-0 items-center justify-between overflow-hidden bg-gradient-to-br ${b.gradient} px-4 text-white">

              <div class="flex items-center gap-1.5">
                <span class="truncate text-[16px] font-bold">${esc(b.brand)}</span>
                <span class="shrink-0 rounded-full bg-white/20 px-2 py-0.5 text-[12px] font-bold">${esc(b.role)}</span>
              </div>

            ${icon('bell', 'h-4 w-4')}
            <span class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-rose-400 ring-1 ring-white/50"></span>
          </button>
        </header>`;
    }

    function renderNav() {
      return `
        <div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
          <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
            ${currentNav().map((item) => {
              const on = state.navTab === item.id;
              return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-400'}">
                ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
                <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
              </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.page === 'teacherForm') return renderTeacherForm();
      if (state.page === 'monitors' && state.role === 'admin') return renderMonitors();
      if (state.page === 'teacherDetail') return renderTeacherDetail();
      return renderTeacherList();
    }

    function renderPlaceholder() {
      const item = currentNav().find((n) => n.id === state.navTab);
      if (!item) return renderContentFallback();
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>

        <button data-action="back-main" class="mt-3 text-[14px] font-semibold text-indigo-600">返回${state.role === 'admin' ? '班长管理' : '教师团队'}</button>

    function renderContentFallback() {
      return `<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>`;
    }

    /* ------------------------------------------------------------------

      return `<div class="flex items-end justify-between gap-3 px-1">

        ${right}

    function backRow(action, label) {
      return `<button data-action="${action}" class="flex items-center gap-1 text-[14px] font-semibold text-slate-500 transition hover:text-slate-800">
        ${icon('chevron-left', 'h-4 w-4')}${esc(label)}
      </button>`;
    }

    function miniStat(label, value, tone, suffix = '') {
      const T = TONES[tone];
      return `<div class="rounded-xl border px-2 py-2 ${T.card}">
        <div class="text-[12px] font-medium ${T.sub}">${esc(label)}</div>
        <div class="mt-0.5 font-mono text-[18px] font-bold ${T.right}">${esc(value)}${suffix ? `<span class="ml-0.5 text-[12px] font-medium">${esc(suffix)}</span>` : ''}</div>
      </div>`;
    }

    function inlineStat(label, value, tone) {
      const T = TONES[tone];
      return `<div class="rounded-xl bg-white/60 px-2 py-1.5">
        <div class="text-[12px] font-medium ${T.sub}">${esc(label)}</div>
        <div class="mt-0.5 font-mono text-[18px] font-bold ${T.right}">${esc(value)}</div>
      </div>`;
    }

    function softBtn(tone, extra = '') {
      return `border ${SOFT_BTN[tone]} ${extra}`;
    }

    /* ------------------------------------------------------------------
     * 教师团队 · 班长 / 管理员
     * ------------------------------------------------------------------ */
    function renderTeacherList() {
      return state.role === 'admin' ? renderAdminTeacherList() : renderMonitorTeacherList();
    }

    function renderMonitorTeacherList() {
      const list = myTeachers();
      const pending = list.filter((t) => teacherStatusMeta(t).tone === 'amber');
      const filtered = state.teacherFilter === 'pending' ? pending : list;
      const todayTotal = list.reduce((sum, t) => sum + t.todayLessons, 0);
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';
      const offline = state.online === 'off';

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('我负责的教师', `1:1 强绑定 · ${list.length}/15`, `<button data-action="create-teacher" ${offline ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg bg-indigo-600 px-3 text-[12px] font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">+ 代录外教</button>`)}
        <div class="grid grid-cols-3 gap-2">
          ${miniStat('负责教师', list.length, 'indigo', '/15')}
          ${miniStat('今日课时', todayTotal, 'amber')}
          ${miniStat('待处理', pending.length, pending.length ? 'rose' : 'slate')}
        </div>
        <div class="flex gap-1 rounded-2xl bg-slate-200/60 p-1">
          ${[['all', '全部', list.length], ['pending', '待处理', pending.length]].map(([key, label, count]) => `<button data-action="teacher-filter" data-filter="${key}" class="flex-1 rounded-xl py-2 text-[12px] font-bold transition ${state.teacherFilter === key ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">${label} ${count}</button>`).join('')}
        </div>
        <div class="${grid}">

                  <div class="flex items-center justify-between">
                    <span class="whitespace-nowrap text-[14px] font-semibold text-slate-800">ClassIn 二维码 <span class="text-rose-500">*</span></span>
                    <span class="shrink-0 whitespace-nowrap text-[12px] font-medium ${media.qr ? 'text-emerald-600' : 'text-amber-700'}">${media.qr ? '已就绪' : '待上传'}</span>
                  </div>
                  <div class="mt-2 flex items-center justify-center">
                    ${f.qrDataUrl
                      ? `<img src="${esc(f.qrDataUrl)}" class="h-16 w-16 rounded-lg bg-white object-contain p-1 ring-1 ring-slate-200" alt="">`
                      : media.qr
                        ? `<div class="grid h-16 w-16 place-items-center rounded-lg bg-white p-1 ring-1 ring-slate-200">${qrSvg(f.name || 'ClassIn')}</div>`

                </div>
                <label class="mt-1.5 flex h-10 cursor-pointer items-center justify-center gap-1.5 rounded-lg border border-dashed border-slate-300 bg-white text-[12px] font-semibold text-slate-600">
                  <input id="fVideoInput" type="file" accept="video/mp4" class="hidden">
                  ${icon('upload', 'h-4 w-4 text-slate-400')}选择 MP4 视频（≤50MB）
                </label>
                ${video ? `<div class="mt-1.5 flex items-center justify-between rounded-lg border border-slate-200 bg-white px-2 py-1.5">
                  <span class="truncate text-[12px] font-medium text-slate-700">${esc(video.name)}</span>
                  <span class="shrink-0 font-mono text-[12px] text-slate-400">${esc(video.size)} · ${esc(video.duration)}</span>
                </div>` : ''}
                ${f.videoError ? `<div class="mt-1.5 rounded-lg border border-rose-200 bg-rose-50 px-2 py-1.5 text-[12px] font-medium text-rose-700">${esc(f.videoError)}</div>` : ''}

                  <div class="text-[16px] font-semibold text-slate-900">保存后同步至家长端选课大厅</div>
                  <div class="mt-0.5 text-[12px] font-medium text-slate-400">关闭后保存为待完善草稿，不会上架</div>
                </div>
                <div class="flex shrink-0 items-center gap-2">
                  <span id="publishLabel" class="text-[12px] font-semibold ${f.publish ? 'text-indigo-700' : 'text-slate-400'}">${f.publish ? '已开启' : '已关闭'}</span>
                  <span id="publishTrack" class="relative h-6 w-11 rounded-full transition ${f.publish ? 'bg-indigo-600' : 'bg-slate-300'}">
                    <span id="publishKnob" class="absolute top-0.5 h-5 w-5 rounded-full bg-white shadow-sm transition-transform ${f.publish ? 'translate-x-5' : 'translate-x-0'}"></span>
                  </span>
                </div>
              </button>
            </section>

            ${f.error ? `<div id="formError" class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-rose-700">${esc(f.error)}</div>` : ''}
          </div>
        </div>

        <div class="flex shrink-0 gap-2 border-t border-slate-200 bg-white px-4 py-3">
          <button data-action="cancel-teacher-form" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
          <button id="btnSaveTeacher" data-action="save-teacher" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">${f.publish ? '保存并发布' : '保存草稿'}</button>
        </div>
      </div>`;
    }

    function renderFormPhotoCard(p, i) {
      const photos = state.form.photos;
      const main = state.form.avatarPhotoId === p.id;
      const isFirst = i === 0;
      const isLast = i === photos.length - 1;
      const onlyOne = photos.length <= 1;
      return `<div data-photo-id="${p.id}" draggable="true" class="overflow-hidden rounded-xl border bg-white transition ${main ? 'border-indigo-400 ring-2 ring-indigo-500/20' : 'border-slate-200'}">
        <div class="relative aspect-square bg-slate-100">
          <img src="${p.dataUrl}" class="h-full w-full object-cover" alt="" draggable="false">
          <span class="absolute left-1.5 top-1.5 grid h-5 min-w-5 place-items-center rounded bg-slate-900/65 px-1 text-[12px] font-bold text-white">${i + 1}</span>
          ${main ? '<span class="absolute right-1.5 top-1.5 rounded bg-indigo-600 px-1 py-0.5 text-[12px] font-bold text-white shadow-sm">主头像</span>' : ''}
          <span class="absolute bottom-1.5 left-1.5 inline-flex items-center gap-0.5 rounded bg-white/85 px-1 py-0.5 text-[12px] font-semibold text-slate-600">${icon('grip-vertical', 'h-3 w-3')}拖拽</span>
        </div>
        <div class="space-y-1 p-1.5">
          <div class="flex gap-1">
            <button data-action="move-photo" data-id="${p.id}" data-delta="-1" ${isFirst ? 'disabled' : ''} class="grid h-7 flex-1 place-items-center rounded-md border border-slate-200 text-slate-500 hover:bg-slate-50 disabled:cursor-not-allowed disabled:text-slate-300" aria-label="前移">${icon('chevron-left', 'h-3.5 w-3.5')}</button>
            <button data-action="move-photo" data-id="${p.id}" data-delta="1" ${isLast ? 'disabled' : ''} class="grid h-7 flex-1 place-items-center rounded-md border border-slate-200 text-slate-500 hover:bg-slate-50 disabled:cursor-not-allowed disabled:text-slate-300" aria-label="后移">${icon('chevron-right', 'h-3.5 w-3.5')}</button>
          </div>
          <button data-action="set-main-avatar" data-id="${p.id}" class="h-7 w-full rounded-md text-[12px] font-semibold ${main ? 'border border-indigo-200 bg-indigo-50 text-indigo-700' : 'border border-slate-200 bg-slate-100 text-slate-700 hover:bg-slate-200'}">${main ? '重新裁切 1:1' : '设为主头像'}</button>
          <button data-action="delete-photo" data-id="${p.id}" ${onlyOne ? 'disabled' : ''} class="h-7 w-full rounded-md text-[12px] font-semibold ${onlyOne ? 'cursor-not-allowed bg-slate-100 text-slate-300' : 'border border-rose-200 bg-rose-50 text-rose-700'}">${onlyOne ? '仅剩 1 张' : '删除'}</button>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 管理员 · 班长管理
     * ------------------------------------------------------------------ */
    function renderMonitors() {
      const all = state.monitors;
      const active = all.filter((m) => m.status === 'active');
      const resigned = all.filter((m) => m.status === 'resigned');
      const list = filteredMonitors();
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';
      const offline = state.online === 'off';
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('班长管理', '全平台班长负荷与教务交接', `<button data-action="open-appoint" ${offline ? 'disabled' : ''} class="h-8 shrink-0 rounded-lg bg-indigo-600 px-3 text-[12px] font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">+ 委任班长</button>`)}
        <div class="relative">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">${icon('search', 'h-4 w-4')}</span>
          <input id="monitorSearch" value="${esc(state.monitorQuery)}" placeholder="搜索姓名 / 邮箱 / 电话" class="h-11 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500">
        </div>
        <div class="flex gap-1 rounded-2xl bg-slate-200/60 p-1">
          ${[['all', '全部', all.length], ['active', '在职', active.length], ['resigned', '已离职', resigned.length]].map(([key, label, count]) => `<button data-action="monitor-filter" data-filter="${key}" class="flex-1 rounded-xl py-2 text-[12px] font-bold transition ${state.monitorFilter === key ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">${label} ${count}</button>`).join('')}
        </div>
        <div id="monitorList" class="${grid}">
          ${list.length ? list.map(monitorCard).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-400">暂无班长</div>`}
        </div>
        <div id="monitorCount" class="text-center text-[12px] font-medium text-slate-400">共 ${list.length} 条 · 第 1/1 页 · 每页 20 条</div>
        <div class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[12px] font-medium leading-relaxed text-slate-500">仅管理员可见。班长或教师访问由服务端直接拒绝并返回 <span class="font-mono text-slate-600">403 FORBIDDEN</span>。</div>
      </div>`;
    }

    function monitorCard(m) {
      const metrics = monitorMetrics(m);
      const resigned = m.status === 'resigned';
      return `<article class="rounded-2xl border p-3.5 shadow-sm ${resigned ? 'border-slate-200 bg-slate-50' : 'border-slate-200/80 bg-white'}">
        <div class="flex items-start justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2.5">
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-full text-[16px] font-bold ${resigned ? 'bg-slate-200 text-slate-500' : 'bg-slate-900 text-amber-300'}">${esc((m.name || '?').charAt(0).toUpperCase())}</span>
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="truncate text-[16px] font-bold text-slate-900">${esc(m.name)}</span>
                ${monitorStatusChip(m.status)}
              </div>
              <div class="mt-0.5 truncate text-[12px] font-medium text-slate-500">${esc(m.email)}</div>
              <div class="truncate font-mono text-[12px] font-medium text-slate-400">${esc(m.phone)} · 委任 ${esc(m.appointedAt)}</div>
            </div>
          </div>
        </div>
        <div class="mt-2.5 grid grid-cols-3 gap-1.5">
          ${miniStat('所辖外教', metrics.teachers, 'indigo')}
          ${miniStat('负责小班', metrics.classes, 'amber')}
          ${miniStat('托管未结', `${metrics.ts} 节`, 'emerald')}
        </div>
        <div class="mt-1.5 rounded-lg bg-slate-50 px-2 py-1.5 text-[12px] font-medium text-slate-500">托管未结 <span class="font-mono font-bold text-slate-700">${Number(metrics.points).toLocaleString('en-US')}</span> 积分</div>
        <div class="mt-2 flex items-center justify-between gap-2 border-t border-slate-100 pt-2">
          <button data-action="open-load" data-id="${m.id}" class="text-[12px] font-bold text-indigo-700">负荷明细</button>
          ${resigned
            ? `<button data-action="reappoint" data-id="${m.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 rounded-lg border border-indigo-200 bg-indigo-50 px-2.5 text-[12px] font-bold text-indigo-700 disabled:opacity-40">复用委任</button>`
            : `<div class="flex shrink-0 gap-1.5">
              <button data-action="open-rebind" data-id="${m.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 rounded-lg border border-slate-200 bg-slate-100 px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-200 disabled:opacity-40">批量改绑</button>
              <button data-action="open-dismiss" data-id="${m.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-8 rounded-lg border border-rose-200 bg-rose-50 px-2.5 text-[12px] font-bold text-rose-700 disabled:opacity-40">解除职务</button>
            </div>`}
        </div>
        ${resigned ? `<div class="mt-1.5 text-[12px] font-medium text-slate-400">已离职 · 历史单据只读追溯 · 不可再新增教师 / 小班 / 收款</div>` : ''}
      </article>`;
    }

    function updateMonitorListOnly() {
      const el = $('monitorList');
      const count = $('monitorCount');
      const list = filteredMonitors();
      if (el) {
        el.className = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';
        el.innerHTML = list.length ? list.map(monitorCard).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-400">暂无班长</div>`;
      }
      if (count) count.textContent = `共 ${list.length} 条 · 第 1/1 页 · 每页 20 条`;
      if (window.lucide) lucide.createIcons();
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'video') return renderVideoModal();
      if (state.overlay.type === 'qr') return renderQrModal();
      if (state.overlay.type === 'photo') return renderPhotoLightbox();
      if (state.overlay.type === 'avatarCrop') return renderAvatarCropModal();
      if (state.overlay.type === 'resignTeacher') return renderResignTeacherModal();
      if (state.overlay.type === 'appoint') return renderAppointModal();
      if (state.overlay.type === 'rebind') return renderRebindModal();
      if (state.overlay.type === 'dismiss') return renderDismissModal();
      if (state.overlay.type === 'loadDetail') return renderLoadDetailModal();
      if (state.overlay.type === 'singleRebind') return renderSingleRebindModal();
      return '';
    }

    function modalShell(content) {
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-3 top-1/2 mx-auto max-h-[88%] max-w-[560px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">${content}</div>
      </div>`;
    }

    function modalHeader(title, subtitle = '') {
      return `<div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
          ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
        </div>
        <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
      </div>`;
    }

    function renderVideoModal() {
      const t = teacherById(state.activeTeacherId);
      const video = t && t.media.video;
      if (!video) return '';
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/70" data-action="close-overlay"></div>
        <div class="absolute inset-x-3 top-1/2 mx-auto max-w-[560px] -translate-y-1/2 overflow-hidden rounded-2xl bg-slate-900 p-3 shadow-2xl">
          <div class="mb-2 flex items-center justify-between px-1">
            <span class="truncate text-[14px] font-semibold text-white">${esc(video.name)}</span>
            <button data-action="close-overlay" class="grid h-8 w-8 place-items-center rounded-lg text-slate-300 hover:bg-white/10" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <video controls playsinline autoplay class="aspect-video w-full rounded-xl bg-black" src="${esc(video.url)}"></video>
          <p class="mt-2 text-center text-[12px] font-medium text-slate-400">原型使用公共示例视频 · 正式环境为教师 MP4 试讲</p>
        </div>
      </div>`;
    }

    function renderQrModal() {
      const t = teacherById(state.activeTeacherId);
      if (!t) return '';
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/60" data-action="close-overlay"></div>

    function startTeacherForm(mode, id = null) {
      if (state.online === 'off') return showToast('离线模式下不可录入或编辑档案');
      if (state.role !== 'monitor') return showToast('仅负责班长可录入教师档案');
      if (mode === 'edit') {
        const t = teacherById(id);
        if (!t || t.monitorId !== CURRENT_MONITOR_ID || t.status === 'resigned') return showToast('该教师不在当前班长名下');
        const photos = clone(t.photos || []);
        state.form = {
          mode: 'edit', id: t.id, name: t.name, level: t.level, specialties: [...t.specialties],
          introZh: t.introZh, introEn: t.introEn,
          avatarDataUrl: t.avatarDataUrl || (photos[0] ? photos[0].dataUrl : ''), qrDataUrl: t.qrDataUrl || '',
          photos, avatarPhotoId: t.avatarPhotoId || (photos[0] ? photos[0].id : null), crop: null,
          media: clone(t.media), publish: t.status === 'active' || missingMedia(t).length === 0, videoError: '', error: ''
        };

    function openAppoint(prefill = {}) {
      if (state.online === 'off') return showToast('离线模式下不可委任班长');

    function openRebind(monitorId) {
      if (state.online === 'off') return showToast('离线模式下不可改绑');

      const metrics = monitorMetrics(m);

      const label = $('publishLabel');

      if (label) {

    function updateAppointMatch() {
      const email = state.appoint.email.trim().toLowerCase();
      const account = ACCOUNTS[email];
      const active = state.monitors.find((m) => m.email.toLowerCase() === email && m.status === 'active');
      const resigned = state.monitors.find((m) => m.email.toLowerCase() === email && m.status === 'resigned');
      let html = '';
      let blocked = false;
      let tone = 'text-slate-400';
      if (!email) {
        html = '输入已注册邮箱检索账号';
      } else if (!isEmailValid(email)) {
        html = '请输入有效的邮箱地址'; tone = 'text-rose-600'; blocked = true;
      } else if (!account) {
        html = '未找到该账号'; tone = 'text-rose-600'; blocked = true;
      } else if (active) {
        html = '该账号已有在职班长档案'; tone = 'text-rose-600'; blocked = true;
      } else if (resigned) {
        html = `检测到已离职档案「${resigned.name}」，确认后将复用并恢复在职`; tone = 'text-amber-700';
      } else {
        html = `匹配账号：${account.name} · 可授予 monitor 角色`; tone = 'text-emerald-600';
      }
      const match = $('appointMatch');
      if (match) match.innerHTML = `<span class="${tone}">${esc(html)}</span>`;
      const nameOk = state.appoint.name.trim().length >= 1 && state.appoint.name.trim().length <= 50;
      const phoneOk = isValidPhone(state.appoint.phone);
      const btn = $('btnAppoint');
      if (btn) btn.disabled = blocked || !nameOk || !phoneOk;

      const valid = !!state.rebind.targetId && (state.rebind.teacherIds.length + state.rebind.classIds.length > 0);
      const btn = $('btnRebind');

    function updateDismissButton() {
      const m = monitorById(state.dismiss.monitorId);
      const metrics = m ? monitorMetrics(m) : { teachers: 0, classes: 0 };
      const fundsCleared = state.dismiss.fundsCleared || !(m && m.unsettledTs > 0);
      const eduCleared = state.dismiss.eduCleared || (metrics.teachers === 0 && metrics.classes === 0);
      const btn = $('btnDismiss');
      if (btn) btn.disabled = !(fundsCleared && eduCleared && m && state.dismiss.confirmName.trim() === m.name);

     * 保存与业务确认

    function teacherFormError() {
      const f = state.form;
      if (state.online === 'off') return '离线模式下不可保存档案';
      if (!f.name.trim()) return '请填写外教英文姓名';
      if (f.name.trim().length > 50) return '英文姓名不能超过 50 字符';
      if (!LEVELS.some((l) => l.id === f.level)) return '请选择定级标准';
      if (!f.specialties.length) return '请至少选择 1 个擅长课程类型';
      if (!f.introZh.trim()) return '请填写中文简介';
      if (f.introZh.length > 2000) return '中文简介不能超过 2000 字符';
      if (f.introEn.length > 2000) return '英文简介不能超过 2000 字符';
      if (f.publish) {
        if (!f.introEn.trim()) return '发布前请补全英文简介，或关闭同步保存为草稿';
        if (!f.photos.length) return '发布前请上传至少 1 张风采相册照片，或关闭同步保存为草稿';
        if (!f.avatarPhotoId) return '发布前请选择并裁切 1 张 1:1 主头像，或关闭同步保存为草稿';
        if (!f.media.qr) return '发布前请上传 ClassIn 二维码，或关闭同步保存为草稿';
        if (!f.media.video) return '发布前请上传 MP4 试讲视频，或关闭同步保存为草稿';
      }
      return null;

    function saveTeacher() {
      if (state.role !== 'monitor') return showToast('仅负责班长可保存教师档案');
      const f = state.form;
      const err = teacherFormError();
      if (err) {
        f.error = err;
        renderAll();
        setTimeout(() => $('formError')?.scrollIntoView({ block: 'center' }), 60);
        showToast(err);
        return;
      }
      const complete = formMissing().length === 0;
      const status = f.publish && complete ? 'active' : 'pending';
      if (f.mode === 'edit') {
        const t = teacherById(f.id);
        if (!t) return;
        Object.assign(t, {
          name: f.name.trim(), level: f.level, specialties: [...f.specialties],
          introZh: f.introZh, introEn: f.introEn,
          avatarDataUrl: f.avatarDataUrl, qrDataUrl: f.qrDataUrl,
          photos: clone(f.photos), avatarPhotoId: f.avatarPhotoId,
          media: clone(f.media), status
        });
        state.activeTeacherId = t.id;
        state.page = 'teacherDetail';
        state.navTab = 'ops';
        state.overlay = null;
        renderAll();
        showToast(status === 'active' ? '教师档案已保存并同步至家长端' : (complete ? '已保存为待发布草稿，暂未上架' : '已保存为待完善档案，暂未上架'));
        return;
      }
      const t = {
        id: newId('tc'),
        name: f.name.trim(), level: f.level, monitorId: CURRENT_MONITOR_ID,
        specialties: [...f.specialties], introZh: f.introZh, introEn: f.introEn,
        avatarDataUrl: f.avatarDataUrl, qrDataUrl: f.qrDataUrl,
        photos: clone(f.photos), avatarPhotoId: f.avatarPhotoId,
        media: clone(f.media), todayLessons: 0, upcoming: 0, completed: 0,
        status, createdAt: TODAY, resign: { temp: 0, fixed: 0, classes: 0, sub: 0 }
      };

      state.activeTeacherId = t.id;
      state.page = 'teacherDetail';
      state.navTab = 'ops';
      state.overlay = null;

    }

    function submitAppoint() {
      if (state.online === 'off') return showToast('离线模式下不可委任班长');
      const email = state.appoint.email.trim().toLowerCase();
      const name = state.appoint.name.trim();
      const phone = state.appoint.phone.trim();
      const fail = (msg) => {
        state.appoint.error = msg;
        renderOverlayOnly();
        $('appointEmail')?.focus();
      };
      if (!isEmailValid(email)) return fail('请输入有效的邮箱地址');
      const account = ACCOUNTS[email];
      if (!account) return fail('该邮箱尚未注册');
      const active = state.monitors.find((m) => m.email.toLowerCase() === email && m.status === 'active');
      if (active) return fail('该账号已有在职班长档案');
      if (!name || name.length > 50) return fail('显示名称需为 1-50 字符');
      if (!isValidPhone(phone)) return fail('请输入 11 位手机号或 E.164 格式电话');
      const resigned = state.monitors.find((m) => m.email.toLowerCase() === email && m.status === 'resigned');
      if (resigned) {
        resigned.status = 'active';
        resigned.name = name;
        resigned.phone = phone;
        resigned.appointedAt = TODAY;
        resigned.appointedBy = 'Sarah';
        delete resigned.resignedAt;
        state.monitorFilter = 'active';
        state.overlay = null;
        renderAll();
        showToast(`已复用并恢复 ${name} 的班长档案`);
        return;
      }
      state.monitors.push({
        id: newId('mn'), name, email, phone, appointedAt: TODAY, status: 'active',
        unsettledTs: 0, unsettledPoints: 0, appointedBy: 'Sarah'
      });
      state.monitorFilter = 'active';
      state.overlay = null;
      renderAll();
      showToast(`已委任 ${name} 为班长`);

    function submitRebind() {
      if (state.online === 'off') return showToast('离线模式下不可改绑');
      const r = state.rebind;
      const m = monitorById(r.monitorId);
      const target = monitorById(r.targetId);
      const fail = (msg) => {
        state.rebind.error = msg;
        renderOverlayOnly();

      if (!m || !target || target.status !== 'active' || target.id === m.id) return fail('接手班长必须为在职、非本人');
      if (!r.teacherIds.length && !r.classIds.length) return fail('请至少选择 1 位教师或 1 个小班');
      let teacherCount = 0;
      let classCount = 0;
      state.teachers.forEach((t) => {
        if (r.teacherIds.includes(t.id) && t.monitorId === m.id) { t.monitorId = target.id; teacherCount++; }
      });
      state.classes.forEach((c) => {
        if (r.classIds.includes(c.id) && c.monitorId === m.id) { c.monitorId = target.id; classCount++; }

      state.overlay = null;
      state.page = 'monitors';
      state.navTab = 'settings';
      renderAll();
      showToast(`已改绑 ${teacherCount} 位教师 / ${classCount} 个小班 · 历史资金持有人不变`);
    }

    function submitDismiss() {
      if (state.online === 'off') return showToast('离线模式下不可解除班长职务');
      const d = state.dismiss;
      const m = monitorById(d.monitorId);
      if (!m) return;
      const metrics = monitorMetrics(m);
      const fundsCleared = d.fundsCleared || (m.unsettledTs || 0) === 0;
      const eduCleared = d.eduCleared || (metrics.teachers === 0 && metrics.classes === 0);
      const fail = (msg) => {
        state.dismiss.error = msg;
        renderOverlayOnly();
      };
      if (!fundsCleared) return fail('防线一未通过：仍有未结 TS');
      if (!eduCleared) return fail('防线二未通过：仍有在职教师或小班');
      if (d.confirmName.trim() !== m.name) return fail('请输入正确的班长显示名称以确认');
      m.status = 'resigned';
      m.resignedAt = TODAY;
      m.unsettledTs = 0;
      m.unsettledPoints = 0;
      if (eduCleared) {
        const fallback = state.monitors.find((x) => x.status === 'active' && x.id !== m.id);

          state.teachers.forEach((t) => { if (t.monitorId === m.id) t.monitorId = fallback.id; });
          state.classes.forEach((c) => { if (c.monitorId === m.id) c.monitorId = fallback.id; });
        }

      state.monitorFilter = 'active';
      state.overlay = null;
      state.page = 'monitors';
      state.navTab = 'settings';
      renderAll();
      showToast(`已解除 ${m.name} 的班长职务`);
    }

    /* ------------------------------------------------------------------
     * 图片 / 视频 / 相册
     * ------------------------------------------------------------------ */
    const imageCache = new Map();

    function loadImage(src) {
      if (imageCache.has(src)) return imageCache.get(src);
      const promise = new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
      imageCache.set(src, promise);
      return promise;
    }

    function compressImageFile(file, maxSide = 1200) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
            const w = Math.max(1, Math.round(img.naturalWidth * scale));
            const h = Math.max(1, Math.round(img.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            try { resolve(canvas.toDataURL('image/webp', 0.85)); }
            catch (e) { resolve(evt.target.result); }
          };
          img.onerror = reject;
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function cropToDataUrl(dataUrl, opts = {}) {
      return loadImage(dataUrl).then((img) => {
        const size = 400;
        const zoom = opts.zoom || 1;
        const side = Math.min(img.naturalWidth, img.naturalHeight) / zoom;
        const sx = (img.naturalWidth - side) * (opts.x ?? 0.5);
        const sy = (img.naturalHeight - side) * (opts.y ?? 0.5);
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, size, size);
        try { return canvas.toDataURL('image/webp', 0.85); }
        catch (e) { return dataUrl; }
      });
    }

    function drawCropPreview() {
      const crop = state.form.crop;
      const photo = crop ? state.form.photos.find((p) => p.id === crop.photoId) : null;
      const canvas = $('cropPreview');
      if (!crop || !photo || !canvas) return;
      loadImage(photo.dataUrl).then((img) => {
        const size = canvas.width;
        const side = Math.min(img.naturalWidth, img.naturalHeight) / (crop.zoom || 1);
        const sx = (img.naturalWidth - side) * crop.x;
        const sy = (img.naturalHeight - side) * crop.y;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      }).catch(() => {});
    }

    function openAvatarCrop(photoId) {
      const photo = state.form.photos.find((p) => p.id === photoId);
      if (!photo) return;
      state.form.crop = { photoId, zoom: 1, x: 0.5, y: 0.5 };
      state.overlay = { type: 'avatarCrop' };
      renderAll();
      setTimeout(drawCropPreview, 30);
    }

    function closeAvatarCrop() {
      state.form.crop = null;
      state.overlay = null;
      renderAll();
    }

    function confirmAvatarCrop() {
      const crop = state.form.crop;
      const photo = crop ? state.form.photos.find((p) => p.id === crop.photoId) : null;
      if (!crop || !photo) return;
      const opts = { zoom: crop.zoom, x: crop.x, y: crop.y };
      cropToDataUrl(photo.dataUrl, opts).then((url) => {
        state.form.avatarPhotoId = photo.id;
        state.form.avatarDataUrl = url;
        state.form.media.photo = true;
        state.form.crop = null;
        state.overlay = null;
        clearFormError();
        renderAll();
        updateIntroCounters();
        setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
        showToast('已设为 1:1 主头像');
      });
    }

    async function handleAlbumFiles(files) {
      const list = Array.from(files || []).filter((f) => f.type && f.type.startsWith('image/'));
      if (!list.length) return showToast('请选择图片文件');
      const remaining = 6 - state.form.photos.length;
      if (remaining <= 0) return showToast('风采相册最多 6 张');
      const accepted = list.slice(0, remaining);
      let added = 0;
      for (const file of accepted) {
        if (state.form.photos.length >= 6) break;
        try {
          const dataUrl = await compressImageFile(file);
          state.form.photos.push({ id: `ph_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, name: file.name, dataUrl });
          added++;
        } catch (e) {
          showToast(`无法读取图片：${file.name}`);
        }
      }
      if (!added) return;
      state.form.media.photo = true;
      if (!state.form.avatarPhotoId) {
        const first = state.form.photos[0];
        state.form.avatarPhotoId = first.id;
        try { state.form.avatarDataUrl = await cropToDataUrl(first.dataUrl); }
        catch (e) { state.form.avatarDataUrl = first.dataUrl; }
      }
      clearFormError();
      renderAll();
      updateIntroCounters();
      setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      const ignored = list.length - accepted.length;
      showToast(ignored > 0 ? `已添加 ${added} 张照片（相册上限 6 张）` : `已添加 ${added} 张风采照片`);
    }

    function deleteFormPhoto(photoId) {
      const photos = state.form.photos;
      if (photos.length <= 1) return showToast('教师档案必须保留至少 1 张照片作为主头像');
      const index = photos.findIndex((p) => p.id === photoId);
      if (index < 0) return;
      const wasMain = state.form.avatarPhotoId === photoId;
      photos.splice(index, 1);
      if (wasMain) {
        const promoted = photos[Math.min(index, photos.length - 1)] || photos[0];
        state.form.avatarPhotoId = promoted.id;
        state.form.avatarDataUrl = promoted.dataUrl;
        cropToDataUrl(promoted.dataUrl).then((url) => {
          state.form.avatarDataUrl = url;
          renderAll();
          updateIntroCounters();
        }).catch(() => {});
      }
      state.form.media.photo = photos.length > 0;
      clearFormError();
      renderAll();
      updateIntroCounters();
      setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      showToast(wasMain ? '已删除原主头像，剩余照片已自动晋升' : '照片已删除');
    }

    function reorderFormPhoto(fromId, toId) {
      const photos = state.form.photos;
      const from = photos.findIndex((p) => p.id === fromId);
      const to = photos.findIndex((p) => p.id === toId);
      if (from < 0 || to < 0 || from === to) return;
      const [moving] = photos.splice(from, 1);
      photos.splice(to, 0, moving);
      renderAll();
      updateIntroCounters();
      setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      showToast('相册展示顺序已更新');
    }

    function moveFormPhoto(photoId, delta) {
      const photos = state.form.photos;
      const index = photos.findIndex((p) => p.id === photoId);
      const target = index + delta;
      if (index < 0 || target < 0 || target >= photos.length) return;
      const [moving] = photos.splice(index, 1);
      photos.splice(target, 0, moving);
      renderAll();
      updateIntroCounters();
      setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      showToast('相册展示顺序已更新');
    }

    function handleQrFile(file) {
      if (!file) return;
      if (!file.type || !file.type.startsWith('image/')) return showToast('请选择图片文件');
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 320;
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const min = Math.min(img.width, img.height);
          const sx = (img.width - min) / 2;
          const sy = (img.height - min) / 2;
          ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
          const url = canvas.toDataURL('image/webp', 0.85);
          clearFormError();
          state.form.qrDataUrl = url;
          state.form.media.qr = true;
          renderAll();
          updateIntroCounters();
          setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
          showToast('ClassIn 二维码已压缩为 WebP');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleVideoFile(file) {
      if (!file) return;
      const isMp4 = file.type === 'video/mp4' || /\.mp4$/i.test(file.name);
      if (!isMp4) {
        state.form.videoError = '仅支持 MP4 (H.264 + AAC)，WebM 已拦截';
        renderAll();
        setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
        return showToast('视频格式被拦截：仅支持 MP4');
      }
      if (file.size > 50 * 1024 * 1024) {
        state.form.videoError = '视频不能超过 50MB';
        renderAll();
        setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
        return showToast('视频超过 50MB 上限');
      }
      const sizeMb = (file.size / 1024 / 1024).toFixed(1);
      clearFormError();
      state.form.videoError = '';
      state.form.media.video = { name: file.name, size: `${sizeMb} MB`, duration: '—', url: URL.createObjectURL(file) };
      renderAll();
      setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      showToast('MP4 校验通过');
    }

    /* ------------------------------------------------------------------
     * 事件委托
     * ------------------------------------------------------------------ */
    document.getElementById('frame').addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'back-main') {
        state.page = state.role === 'admin' ? 'monitors' : 'teachers';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'back-teachers') {
        state.page = 'teachers';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'open-teacher') {
        state.activeTeacherId = el.dataset.id;
        state.page = 'teacherDetail';
        state.navTab = state.role === 'admin' ? 'settings' : 'ops';
        state.introLang = 'zh';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'create-teacher') return startTeacherForm('create');
      if (action === 'edit-teacher') return startTeacherForm('edit', el.dataset.id);
      if (action === 'teacher-filter') { state.teacherFilter = el.dataset.filter; return renderAll(); }
      if (action === 'admin-teacher-filter') { state.adminTeacherFilter = el.dataset.filter; return renderAll(); }
      if (action === 'intro-lang') {
        state.introLang = el.dataset.lang;
        const t = teacherById(state.activeTeacherId);
        const text = $('introText');
        if (text && t) {
          const intro = state.introLang === 'en' ? t.introEn : t.introZh;
          text.textContent = intro && intro.trim() ? intro : (state.introLang === 'en' ? 'English introduction has not been added yet.' : '中文简介待补充。');
          text.className = `mt-2.5 whitespace-pre-line text-[14px] font-medium leading-relaxed ${intro && intro.trim() ? 'text-slate-700' : 'text-amber-700'}`;
        }
        document.querySelectorAll('[data-action="intro-lang"]').forEach((b) => {
          const on = b.dataset.lang === state.introLang;
          b.className = `h-8 rounded-lg px-2.5 text-[12px] font-bold ${on ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}`;
        });
        return;
      }
      if (action === 'open-video') {
        const t = teacherById(state.activeTeacherId);
        if (!t || !t.media.video) return showToast('该教师暂未上传试讲视频');
        state.overlay = { type: 'video' };
        return renderAll();
      }
      if (action === 'open-qr') {
        const t = teacherById(state.activeTeacherId);
        if (!t || !t.media.qr) return showToast('该教师暂未上传 ClassIn 二维码');
        state.overlay = { type: 'qr' };
        return renderAll();
      }
      if (action === 'open-photo') {
        const t = teacherById(state.activeTeacherId);
        if (!t || !(t.photos || []).length) return;
        state.overlay = { type: 'photo', index: Number(el.dataset.index) || 0 };
        return renderOverlayOnly();
      }
      if (action === 'photo-prev' || action === 'photo-next') {
        if (!state.overlay || state.overlay.type !== 'photo') return;
        const t = teacherById(state.activeTeacherId);
        const total = (t && t.photos && t.photos.length) || 0;
        if (!total) return;
        state.overlay.index = (state.overlay.index + (action === 'photo-next' ? 1 : -1) + total) % total;
        return renderOverlayOnly();
      }
      if (action === 'open-resign') {
        if (state.online === 'off') return showToast('离线模式下不可办理离职');
        state.resignTeacher.cleared = false;
        state.overlay = { type: 'resignTeacher' };
        return renderAll();
      }
      if (action === 'open-appoint') return openAppoint();
      if (action === 'open-rebind') return openRebind(el.dataset.id);
      if (action === 'open-dismiss') return openDismiss(el.dataset.id);
      if (action === 'open-load') {
        state.overlay = { type: 'loadDetail', monitorId: el.dataset.id };
        return renderAll();
      }
      if (action === 'open-single-rebind') {
        if (state.online === 'off') return showToast('离线模式下不可改绑');
        const t = teacherById(el.dataset.id);
        if (!t) return;
        state.singleRebind = { teacherId: t.id, targetId: '', error: '' };
        state.overlay = { type: 'singleRebind' };
        return renderAll();
      }
      if (action === 'reappoint') {
        const m = monitorById(el.dataset.id);
        if (!m) return;
        return openAppoint({ email: m.email, name: m.name, phone: m.phone });
      }
      if (action === 'monitor-filter') { state.monitorFilter = el.dataset.filter; return renderAll(); }
      if (action === 'toggle-specialty') {
        const value = el.dataset.value;
        state.form.specialties = state.form.specialties.includes(value)
          ? state.form.specialties.filter((x) => x !== value)
          : [...state.form.specialties, value];
        clearFormError();
        document.querySelectorAll('[data-action="toggle-specialty"]').forEach((b) => {
          const on = state.form.specialties.includes(b.dataset.value);
          b.className = `h-8 rounded-lg border px-2.5 text-[12px] font-semibold ${on ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-600'}`;
        });
        return;
      }
      if (action === 'toggle-publish') {
        state.form.publish = !state.form.publish;
        clearFormError();
        updatePublishToggle();
        return;
      }
      if (action === 'set-main-avatar') return openAvatarCrop(el.dataset.id);
      if (action === 'delete-photo') return deleteFormPhoto(el.dataset.id);
      if (action === 'move-photo') return moveFormPhoto(el.dataset.id, Number(el.dataset.delta));
      if (action === 'confirm-crop') return confirmAvatarCrop();
      if (action === 'close-crop') return closeAvatarCrop();
      if (action === 'reset-crop') {
        if (!state.form.crop) return;
        state.form.crop = { ...state.form.crop, zoom: 1, x: 0.5, y: 0.5 };
        renderAll();
        setTimeout(drawCropPreview, 30);
        return;
      }
      if (action === 'load-sample') {
        const f = state.form;
        clearFormError();
        if (!f.introZh.trim()) f.introZh = '该教师拥有多年少儿英语一线教学经验，擅长游戏化互动与自然拼读，课堂耐心细致，注重建立孩子的开口自信。';
        if (!f.introEn.trim()) f.introEn = 'This teacher has years of ESL experience with young learners, specializing in gamified phonics and confidence-building speaking practice.';
        if (!f.photos.length) {
          const sample = demoAlbum('sample', [['教学瞬间', '#6366f1', '#0ea5e9'], ['课堂互动', '#0ea5e9', '#22c55e'], ['阅读时光', '#f59e0b', '#ef4444']]);
          f.photos = sample;
          f.avatarPhotoId = sample[0].id;
          f.avatarDataUrl = sample[0].dataUrl;
        }
        f.media.photo = f.photos.length > 0;
        f.media.qr = true;
        f.media.video = { name: 'Sample_Lesson_MP4.mp4', size: '24.6 MB', duration: '01:45', url: SAMPLE_VIDEO };
        f.videoError = '';
        renderAll();
        updateIntroCounters();
        setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
        showToast('已载入示例简介与多媒体素材');
        return;
      }
      if (action === 'simulate-webm') {
        state.form.videoError = '仅支持 MP4 (H.264 + AAC)，WebM 已拦截';
        renderAll();
        setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
        return showToast('已拦截 WebM：教师视频仅支持 MP4');
      }
      if (action === 'save-teacher') return saveTeacher();
      if (action === 'cancel-teacher-form') {
        state.page = state.formReturnPage || 'teachers';
        state.overlay = null;
        return renderAll();
      }
      if (action === 'close-overlay') { state.overlay = null; return renderOverlayOnly(); }
      if (action === 'resign-confirm') return confirmResignTeacher();
      if (action === 'appoint-submit') return submitAppoint();
      if (action === 'rebind-submit') return submitRebind();
      if (action === 'dismiss-submit') return submitDismiss();
      if (action === 'single-rebind-submit') return submitSingleRebind();
    });

    function renderOverlayOnly() {
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'fTeacherName') { state.form.name = e.target.value; clearFormError(); }
      if (id === 'fIntroZh') {
        state.form.introZh = e.target.value;
        clearFormError();
        const count = $('zhCount');
        if (count) count.textContent = e.target.value.length;
      }
      if (id === 'fIntroEn') {
        state.form.introEn = e.target.value;
        clearFormError();
        const count = $('enCount');
        if (count) count.textContent = e.target.value.length;
      }
      if (id === 'monitorSearch') { state.monitorQuery = e.target.value; updateMonitorListOnly(); }
      if (id === 'appointEmail') { state.appoint.email = e.target.value; state.appoint.error = ''; updateAppointMatch(); }
      if (id === 'appointName') { state.appoint.name = e.target.value; state.appoint.error = ''; updateAppointMatch(); }
      if (id === 'appointPhone') { state.appoint.phone = e.target.value; state.appoint.error = ''; updateAppointMatch(); }
      if (id === 'dismissConfirmName') { state.dismiss.confirmName = e.target.value; updateDismissButton(); }
      if (state.form.crop && ['cropZoom', 'cropX', 'cropY'].includes(id)) {
        if (id === 'cropZoom') state.form.crop.zoom = Number(e.target.value);
        if (id === 'cropX') state.form.crop.x = Number(e.target.value);
        if (id === 'cropY') state.form.crop.y = Number(e.target.value);
        drawCropPreview();
      }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'fLevel') { state.form.level = e.target.value; clearFormError(); }
      if (id === 'adminTeacherMonitor') {
        state.adminTeacherMonitor = e.target.value;
        renderAll();
      }
      if (id === 'fPhotoInput') handleAlbumFiles(e.target.files);
      if (id === 'fQrInput') handleQrFile(e.target.files && e.target.files[0]);
      if (id === 'fVideoInput') handleVideoFile(e.target.files && e.target.files[0]);
      if (id === 'resignCleared') {
        state.resignTeacher.cleared = e.target.checked;
        const btn = $('btnResignTeacher');
        if (btn) btn.disabled = !e.target.checked;
      }
      if (id === 'rebindTarget') {
        state.rebind.targetId = e.target.value;
        state.rebind.error = '';
        updateRebindButton();
      }
      if (e.target.matches('[data-rebind-teacher]')) {
        const tid = e.target.dataset.rebindTeacher;
        state.rebind.teacherIds = e.target.checked
          ? [...new Set([...state.rebind.teacherIds, tid])]
          : state.rebind.teacherIds.filter((x) => x !== tid);
        state.rebind.error = '';
        updateRebindButton();
      }
      if (e.target.matches('[data-rebind-class]')) {
        const cid = e.target.dataset.rebindClass;
        state.rebind.classIds = e.target.checked
          ? [...new Set([...state.rebind.classIds, cid])]
          : state.rebind.classIds.filter((x) => x !== cid);
        state.rebind.error = '';
        updateRebindButton();
      }
      if (id === 'dismissFunds') {
        state.dismiss.fundsCleared = e.target.checked;
        state.dismiss.error = '';
        renderOverlayOnly();
      }
      if (id === 'dismissEdu') {
        state.dismiss.eduCleared = e.target.checked;
        state.dismiss.error = '';
        renderOverlayOnly();
      }
      if (id === 'singleRebindTarget') {
        state.singleRebind.targetId = e.target.value;
        state.singleRebind.error = '';
        const btn = $('btnSingleRebind');
        if (btn) btn.disabled = !e.target.value;
      }
    });

    /* ------------------------------------------------------------------
     * 相册拖拽排序
     * ------------------------------------------------------------------ */
    let draggingPhotoId = null;

    document.getElementById('frame').addEventListener('dragstart', (e) => {
      const card = e.target.closest('[data-photo-id]');
      if (!card || state.page !== 'teacherForm') return;
      draggingPhotoId = card.dataset.photoId;
      card.classList.add('opacity-50');
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', draggingPhotoId); } catch (err) { /* noop */ }
      }
    });

    document.getElementById('frame').addEventListener('dragend', (e) => {
      const card = e.target.closest('[data-photo-id]');
      if (card) card.classList.remove('opacity-50');
      draggingPhotoId = null;
    });

    document.getElementById('frame').addEventListener('dragover', (e) => {
      if (state.page !== 'teacherForm' || !draggingPhotoId) return;
      const card = e.target.closest('[data-photo-id]');
      if (!card) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    });

    document.getElementById('frame').addEventListener('drop', (e) => {
      if (state.page !== 'teacherForm') return;
      const card = e.target.closest('[data-photo-id]');
      if (!card) return;
      e.preventDefault();
      const fromId = draggingPhotoId || (e.dataTransfer ? e.dataTransfer.getData('text/plain') : '');
      draggingPhotoId = null;
      if (fromId) reorderFormPhoto(fromId, card.dataset.photoId);
    });

    document.addEventListener('keydown', (e) => {
      if (!state.overlay || state.overlay.type !== 'photo') return;
      const t = teacherById(state.activeTeacherId);
      const total = (t && t.photos && t.photos.length) || 0;
      if (e.key === 'Escape') {
        state.overlay = null;
        renderOverlayOnly();
      } else if (total > 1 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        e.preventDefault();
        state.overlay.index = (state.overlay.index + (e.key === 'ArrowRight' ? 1 : -1) + total) % total;
        renderOverlayOnly();
      }
    });

    /* ------------------------------------------------------------------
     * 导航与提示
     * ------------------------------------------------------------------ */
    function navTo(tab) {
      if (state.role === 'admin' && tab === 'settings') return setView('monitors');
      if (state.role === 'monitor' && tab === 'ops') return setView('teachers');
      state.page = 'placeholder';
      state.navTab = tab;
      state.overlay = null;
      renderAll();
    }

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

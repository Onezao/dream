    /* 原型内联示例照片（原创 SVG 占位，不依赖外网图片） */
    function demoPhoto(label, from, to, w = 800, h = 600) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${from}"/><stop offset="1" stop-color="${to}"/></linearGradient></defs>
        <rect width="${w}" height="${h}" fill="url(#g)"/>
        <circle cx="${w * 0.74}" cy="${h * 0.28}" r="${h * 0.16}" fill="#ffffff" opacity="0.20"/>
        <path d="M0 ${h * 0.72} Q ${w * 0.28} ${h * 0.5} ${w * 0.55} ${h * 0.74} T ${w} ${h * 0.6} V ${h} H 0 Z" fill="#0f172a" opacity="0.18"/>
        <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="${Math.round(h * 0.09)}" font-weight="700" fill="#ffffff" opacity="0.94">${label}</text>
        <text x="50%" y="64%" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="${Math.round(h * 0.035)}" font-weight="500" fill="#ffffff" opacity="0.72">Dream Teacher Gallery</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function demoAlbum(prefix, specs) {
      return specs.map(([label, from, to], i) => ({
        id: `ph_${prefix}_${i + 1}`,
        name: `${prefix}_${i + 1}.webp`,
        dataUrl: demoPhoto(label, from, to)
      }));
    }

    const DEMO_ALBUMS = {

    const INITIAL_TEACHERS = [
      {
        id: 'tc_david000001', name: 'David Miller', level: 'Senior', monitorId: 'mn_leo000001',

        introEn: 'Teacher David comes from London, UK, holding a degree in Education and CELTA certification with over 8 years of ESL teaching experience. He specializes in gamified phonics and Cambridge KET exam preparation.',
        avatarDataUrl: DEMO_ALBUMS.david[0].dataUrl, qrDataUrl: '',
        photos: DEMO_ALBUMS.david, avatarPhotoId: DEMO_ALBUMS.david[0].id,
        media: { photo: true, qr: true, video: { name: 'David_Sample_Lesson.mp4', size: '24.6 MB', duration: '01:45', url: SAMPLE_VIDEO } },
        todayLessons: 4, upcoming: 12, completed: 38, status: 'active', createdAt: '2026-03-12',
        resign: { temp: 3, fixed: 2, classes: 1 }
      },
      {
        id: 'tc_sarah000002', name: 'Sarah Jenkins', level: 'Standard', monitorId: 'mn_leo000001',
        specialties: ['生活口语', '旅游口语'],
        introZh: 'Sarah 老师拥有 6 年在线少儿英语教学经验，课堂节奏轻快，擅长生活口语与旅游情境表达训练，善于用绘本和角色扮演帮助孩子建立开口自信。',

        media: { photo: true, qr: true, video: { name: 'Emma_Intro_MP4.mp4', size: '16.4 MB', duration: '01:08', url: SAMPLE_VIDEO } },
        todayLessons: 3, upcoming: 9, completed: 21, status: 'active', createdAt: '2026-07-03',
        resign: { temp: 0, fixed: 0, classes: 0 }
      },
      {
        id: 'tc_kevin000005', name: 'Kevin Lin', level: 'Junior', monitorId: 'mn_amy000002',
        specialties: ['少儿英语'],
        introZh: 'Kevin 老师专注少儿英语启蒙，擅长游戏化课堂与自然拼读。',
        introEn: 'Kevin focuses on early-years English and gamified phonics lessons.',
        avatarDataUrl: DEMO_ALBUMS.kevin[0].dataUrl, qrDataUrl: '',
        photos: DEMO_ALBUMS.kevin, avatarPhotoId: DEMO_ALBUMS.kevin[0].id,
        media: { photo: true, qr: true, video: { name: 'Kevin_Intro_MP4.mp4', size: '14.8 MB', duration: '01:02', url: SAMPLE_VIDEO } },
        todayLessons: 2, upcoming: 6, completed: 17, status: 'active', createdAt: '2026-08-15',
        resign: { temp: 1, fixed: 0, classes: 0 }

    ];

    const INITIAL_CLASSES = [
      { id: 'cl_ket000001', name: 'KET 冲刺小班', monitorId: 'mn_leo000001', teacherId: 'tc_david000001', status: 'active', students: '6/8' },
      { id: 'cl_phonics0002', name: '自然拼读小班', monitorId: 'mn_leo000001', teacherId: 'tc_sarah000002', status: 'recruiting', students: '3/6' },
      { id: 'cl_speak00003', name: '口语进阶小班', monitorId: 'mn_amy000002', teacherId: 'tc_emma000004', status: 'active', students: '5/8' }
    ];

    const MONITOR_NAV = [
      { id: 'home', icon: 'home', label: '首页', desc: '多孩时间流与金刚位属于 M0 工作台主页。', href: 'm0_workspace_home.html?role=monitor' },
      { id: 'schedule', icon: 'calendar-days', label: '学生课表', desc: '7 色课表与多孩锚点属于 M3A 排课模块。', href: 'm3a_calendar_schedule.html' },
      { id: 'ops', icon: 'layout-grid', label: '教务中心', desc: '我负责的外教、所辖学员与小班课', href: null },
      { id: 'me', icon: 'user', label: '我的', desc: '班长周转账与家庭多孩档案属于 M0 个人中心。', href: 'm0_workspace_home.html?role=monitor&view=me' }
    ];

    const ADMIN_NAV = [
      { id: 'home', icon: 'home', label: '首页', desc: '平台结算待办与运营大盘属于 M0 工作台主页。', href: 'm0_workspace_home.html?role=admin' },
      { id: 'schedule', icon: 'calendar-days', label: '学生课表', desc: '自家孩子课表属于 M3A 排课模块。', href: 'm3a_calendar_schedule.html' },
      { id: 'ops', icon: 'layout-grid', label: '教务调度', desc: '全局排班看板与调度入口属于 M0 / M3A。', href: 'm0_workspace_home.html?role=admin&view=ops' },
      { id: 'settings', icon: 'settings', label: '管理与设置', desc: '班长管理、教师团队与平台配置', href: null }
    ];

    /* ------------------------------------------------------------------
     * 状态
     * ------------------------------------------------------------------ */
    function emptyTeacherForm() {
      return {
        mode: 'create', id: null, name: '', level: 'Standard', specialties: [],
        introZh: '', introEn: '', avatarDataUrl: '', qrDataUrl: '',
        photos: [], avatarPhotoId: null, crop: null,
        media: { photo: false, qr: false, video: null },
        publish: true, videoError: '', error: ''
      };
    }

    const state = {
      role: 'monitor',
      page: 'teachers',
      navTab: 'ops',
      device: 'mobile',
      online: 'on',
      teachers: JSON.parse(JSON.stringify(INITIAL_TEACHERS)),
      monitors: JSON.parse(JSON.stringify(INITIAL_MONITORS)),
      classes: JSON.parse(JSON.stringify(INITIAL_CLASSES)),
      activeTeacherId: INITIAL_TEACHERS[0].id,
      teacherFilter: 'all',
      introLang: 'zh',
      monitorFilter: 'all',
      monitorQuery: '',
      form: emptyTeacherForm(),
      formReturnPage: 'teachers',
      overlay: null,
      resignTeacher: { cleared: false },
      appoint: { email: '', name: '', phone: '', error: '' },
      rebind: { monitorId: null, targetId: '', teacherIds: [], classIds: [], error: '' },
      dismiss: { monitorId: null, fundsCleared: false, eduCleared: false, confirmName: '', error: '' }
    };

    /* ------------------------------------------------------------------
     * 工具
     * ------------------------------------------------------------------ */
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function currentNav() {
      return state.role === 'admin' ? ADMIN_NAV : MONITOR_NAV;
    }

    function myTeachers() {
      return state.teachers.filter((t) => t.monitorId === CURRENT_MONITOR_ID && t.status !== 'resigned');
    }

    function teacherById(id) {
      return state.teachers.find((t) => t.id === id) || null;
    }

    function monitorById(id) {
      return state.monitors.find((m) => m.id === id) || null;
    }

    function monitorMetrics(m) {
      if (!m || m.status === 'resigned') return { teachers: 0, classes: 0, ts: 0, points: 0 };
      return {
        teachers: state.teachers.filter((t) => t.monitorId === m.id && t.status !== 'resigned').length,
        classes: state.classes.filter((c) => c.monitorId === m.id && ['recruiting', 'active'].includes(c.status)).length,
        ts: m.unsettledTs || 0,
        points: m.unsettledPoints || 0
      };
    }

    function missingMedia(t) {
      const missing = [];
      if (!t.introEn || !t.introEn.trim()) missing.push('英文简介');
      if (!t.media || !t.media.photo) missing.push('个人照片');
      if (!t.media || !t.media.qr) missing.push('ClassIn 二维码');
      if (!t.media || !t.media.video) missing.push('试讲视频');
      return missing;
    }

    function formMissing() {
      const f = state.form;
      const missing = [];
      if (!f.introEn.trim()) missing.push('英文简介');
      if (!f.media.photo) missing.push('个人照片');
      if (!f.media.qr) missing.push('ClassIn 二维码');
      if (!f.media.video) missing.push('试讲视频');
      return missing;
    }

    function teacherStatusMeta(t) {
      if (t.status === 'resigned') return { label: '已离职', cls: 'border-slate-200 bg-slate-100 text-slate-500' };
      if (t.status === 'pending' || missingMedia(t).length) return { label: '待完善', cls: 'border-amber-200 bg-amber-50 text-amber-800' };
      return { label: '在职', cls: 'border-emerald-200 bg-emerald-50 text-emerald-700' };
    }

    function levelBadge(level) {
      const cls = level === 'Senior'
        ? 'border-indigo-100 bg-indigo-50 text-indigo-700'
        : level === 'Standard'
          ? 'border-slate-200 bg-slate-100 text-slate-600'
          : 'border-slate-200 bg-slate-50 text-slate-500';
      return `<span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${cls}">${esc(level)}</span>`;
    }

    function monitorStatusChip(status) {
      return status === 'active'
        ? '<span class="rounded-full border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[12px] font-bold text-emerald-700">在职</span>'
        : '<span class="rounded-full border border-slate-200 bg-slate-100 px-2 py-0.5 text-[12px] font-bold text-slate-500">已离职</span>';
    }

    function avatar(t, size = 'h-14 w-14', text = 'text-[18px]') {
      const initial = (t.name || '?').trim().charAt(0).toUpperCase() || '?';
      if (t.avatarDataUrl) {
        return `<img src="${t.avatarDataUrl}" class="${size} shrink-0 rounded-full object-cover ring-1 ring-slate-200" alt="">`;
      }
      return `<div class="${size} grid shrink-0 place-items-center rounded-full bg-gradient-to-br from-indigo-50 to-slate-100 ${text} font-bold text-indigo-700 ring-1 ring-indigo-100">${esc(initial)}</div>`;
    }

    function qrSvg(seed) {
      const n = 9;
      let h = 0;
      for (const ch of String(seed)) h = (h * 131 + ch.charCodeAt(0)) >>> 0;
      const isFinder = (x, y, ox, oy) => x >= ox && x < ox + 3 && y >= oy && y < oy + 3
        && (x === ox || x === ox + 2 || y === oy || y === oy + 2 || (x === ox + 1 && y === oy + 1));
      let rects = '';
      for (let y = 0; y < n; y++) {
        for (let x = 0; x < n; x++) {
          const on = isFinder(x, y, 0, 0) || isFinder(x, y, 6, 0) || isFinder(x, y, 0, 6)
            ? true
            : ((h >> ((x + y * 3) % 30)) & 1) === 1;
          if (on) rects += `<rect x="${x * 10}" y="${y * 10}" width="10" height="10"/>`;
        }
      }
      return `<svg viewBox="0 0 90 90" class="h-full w-full text-slate-900" fill="currentColor" aria-hidden="true">${rects}</svg>`;
    }

    function mediaStatusText(t) {
      const missing = missingMedia(t);
      return missing.length
        ? { ok: false, text: `待补：${missing.join('、')}` }

    }

        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'page') setPage(value);
        if (group === 'device') {
          state.device = value;
          renderAll();

        if (group === 'online') {
          state.online = value;

      state.role = role;
      state.page = role === 'admin' ? 'monitors' : 'teachers';
      state.navTab = role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      renderAll();
    }

    function setPage(page) {
      if (page === 'teachers') {
        state.role = 'monitor';
        state.navTab = 'ops';
        state.page = 'teachers';
      }
      if (page === 'teacherDetail') {
        state.role = 'monitor';
        state.navTab = 'ops';
        const list = myTeachers();
        if (!list.length) {
          state.page = 'teachers';

          state.page = 'teacherDetail';

      if (page === 'teacherForm') {

      if (page === 'monitors') {
        state.role = 'admin';
        state.navTab = 'settings';
        state.page = 'monitors';
      }
      state.overlay = null;
      renderAll();
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const active = state[group] === b.dataset.value;
        let disabled = false;
        if (group === 'page') {
          const adminPage = b.dataset.value === 'monitors';
          disabled = (state.role === 'admin' && !adminPage) || (state.role === 'monitor' && adminPage);
        }
        b.disabled = disabled;
        b.className = `ctl rounded-lg px-3 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}${disabled ? ' cursor-not-allowed opacity-40' : ''}`;

      state.teachers = clone(INITIAL_TEACHERS);
      state.monitors = clone(INITIAL_MONITORS);

      state.role = 'monitor';
      state.page = 'teachers';
      state.navTab = 'ops';
      state.activeTeacherId = INITIAL_TEACHERS[0].id;
      state.teacherFilter = 'all';
      state.introLang = 'zh';
      state.monitorFilter = 'all';

      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

            <img src="${p.dataUrl}" class="h-full w-full object-cover" alt="" draggable="false">
            <span class="absolute left-1.5 top-1.5 grid h-5 min-w-5 place-items-center rounded bg-slate-900/65 px-1 text-[12px] font-bold text-white">${i + 1}</span>
            ${main ? '<span class="absolute right-1.5 top-1.5 rounded bg-indigo-600 px-1.5 py-0.5 text-[12px] font-bold text-white shadow-sm">主头像</span>' : ''}
            <span class="absolute bottom-1.5 left-1.5 inline-flex items-center gap-0.5 rounded bg-white/85 px-1 py-0.5 text-[12px] font-semibold text-slate-600">${icon('grip-vertical', 'h-3 w-3')}拖拽</span>
          </div>
          <div class="space-y-1 p-1.5">
            <div class="flex gap-1">
              <button data-action="move-form-photo" data-id="${p.id}" data-delta="-1" ${isFirst ? 'disabled' : ''} class="grid h-7 flex-1 place-items-center rounded-md border border-slate-200 text-slate-500 hover:bg-slate-50 disabled:cursor-not-allowed disabled:text-slate-300" aria-label="前移">${icon('chevron-left', 'h-3.5 w-3.5')}</button>
              <button data-action="move-form-photo" data-id="${p.id}" data-delta="1" ${isLast ? 'disabled' : ''} class="grid h-7 flex-1 place-items-center rounded-md border border-slate-200 text-slate-500 hover:bg-slate-50 disabled:cursor-not-allowed disabled:text-slate-300" aria-label="后移">${icon('chevron-right', 'h-3.5 w-3.5')}</button>
            </div>
            <button data-action="set-main-avatar" data-id="${p.id}" class="h-8 w-full rounded-md text-[12px] font-semibold ${main ? 'border border-indigo-200 bg-indigo-50 text-indigo-700' : 'bg-slate-900 text-white'}">${main ? '重新裁切 1:1' : '设为主头像'}</button>
            <button data-action="delete-form-photo" data-id="${p.id}" ${onlyOne ? 'disabled' : ''} class="h-7 w-full rounded-md text-[12px] font-semibold ${onlyOne ? 'cursor-not-allowed bg-slate-100 text-slate-300' : 'border border-rose-200 bg-rose-50 text-rose-600'}">${onlyOne ? '删除已锁定' : '删除'}</button>
          </div>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 管理员 · 班长管理
     * ------------------------------------------------------------------ */
    function renderMonitors() {
      const all = state.monitors;
      const active = all.filter((m) => m.status === 'active');
      const resigned = all.filter((m) => m.status === 'resigned');
      const list = filteredMonitors();
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-3' : 'space-y-3';
      const offline = state.online === 'off';

      return `
        <div class="mx-auto w-full max-w-[720px] space-y-4 px-4 pb-6 pt-4">
          <div class="flex items-end justify-between gap-3 px-1">
            <div class="min-w-0">
              <h1 class="text-[18px] font-bold tracking-tight text-slate-900">班长管理</h1>
              <p class="mt-1 text-[14px] font-medium text-slate-500">全平台班长负荷与教务交接</p>
            </div>
            <button data-action="open-appoint" ${offline ? 'disabled' : ''} class="h-9 shrink-0 rounded-xl bg-indigo-600 px-3.5 text-[14px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">+ 委任班长</button>
          </div>

          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">${icon('search', 'h-4 w-4')}</span>
            <input id="monitorSearch" value="${esc(state.monitorQuery)}" placeholder="搜索姓名 / 邮箱 / 电话" class="h-11 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
          </div>

          <div class="flex rounded-xl bg-slate-100 p-1">
            ${[['all', '全部', all.length], ['active', '在职', active.length], ['resigned', '已离职', resigned.length]].map(([id, label, count]) => `
              <button data-action="set-monitor-filter" data-filter="${id}" class="h-9 flex-1 rounded-lg text-[12px] font-bold transition ${state.monitorFilter === id ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}">${label} ${count}</button>
            `).join('')}
          </div>

          <div id="monitorList" class="${grid}">
            ${list.length ? list.map(renderMonitorCard).join('') : `
              <div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center sm:col-span-2">
                <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-slate-50 text-slate-300">${icon('inbox', 'h-5 w-5')}</div>
                <p class="mt-3 text-[14px] font-medium text-slate-400">暂无班长</p>
              </div>`}
          </div>

          <div id="monitorCount" class="text-center text-[12px] font-medium text-slate-400">共 ${list.length} 条 · 第 1/1 页 · 每页 20 条</div>

          <div class="flex items-start gap-2.5 rounded-xl border border-indigo-100 bg-indigo-50/60 px-3.5 py-3">
            <span class="mt-0.5 shrink-0 text-indigo-600">${icon('shield-check', 'h-4 w-4')}</span>
            <p class="text-[12px] font-medium leading-relaxed text-indigo-900">仅管理员可见。班长或教师访问由服务端直接拒绝并返回 <span class="font-mono">403 FORBIDDEN</span>。</p>
          </div>
        </div>`;
    }

    function filteredMonitors() {
      const q = state.monitorQuery.trim().toLowerCase();
      return state.monitors
        .filter((m) => state.monitorFilter === 'all' || m.status === state.monitorFilter)
        .filter((m) => !q || [m.name, m.email, m.phone].join(' ').toLowerCase().includes(q))
        .sort((a, b) => {
          if (a.status !== b.status) return a.status === 'active' ? -1 : 1;
          return b.appointedAt.localeCompare(a.appointedAt);
        });
    }

    function renderMonitorCard(m) {
      const metrics = monitorMetrics(m);
      const resigned = m.status === 'resigned';

      return `
        <article class="rounded-2xl border ${resigned ? 'border-slate-200 bg-slate-50/80' : 'border-slate-200 bg-white'} p-4 shadow-sm">
          <div class="flex items-start justify-between gap-3">
            <div class="flex min-w-0 items-center gap-3">
              <div class="grid h-12 w-12 shrink-0 place-items-center rounded-full ${resigned ? 'bg-slate-200 text-slate-500' : 'bg-slate-900 text-amber-300'} text-[16px] font-bold">${esc(m.name.charAt(0).toUpperCase())}</div>
              <div class="min-w-0">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="truncate text-[16px] font-bold text-slate-900">${esc(m.name)}</span>
                  ${monitorStatusChip(m.status)}
                </div>
                <div class="mt-0.5 truncate text-[12px] font-medium text-slate-500">${esc(m.email)}</div>
                <div class="truncate font-mono text-[12px] font-medium text-slate-400">${esc(m.phone)} · 委任 ${esc(m.appointedAt)}</div>
              </div>
            </div>
          </div>

          <div class="mt-3 grid grid-cols-3 divide-x divide-slate-100 rounded-xl bg-slate-50 py-2.5 text-center">
            <div>
              <div class="text-[18px] font-bold text-slate-900">${metrics.teachers}</div>
              <div class="mt-0.5 text-[12px] font-medium text-slate-500">所辖外教</div>
            </div>
            <div>
              <div class="text-[18px] font-bold text-slate-900">${metrics.classes}</div>
              <div class="mt-0.5 text-[12px] font-medium text-slate-500">负责小班</div>
            </div>
            <div>
              <div class="text-[18px] font-bold text-slate-900">${metrics.ts} 节</div>
              <div class="mt-0.5 text-[12px] font-medium text-slate-500">托管未结</div>
              <div class="mt-0.5 text-[12px] font-medium text-slate-400">${Number(metrics.points).toLocaleString('en-US')} 积分</div>
            </div>
          </div>

          <div class="mt-3 flex items-center justify-between gap-2">
            <button data-action="toast" data-message="负荷明细：教师 / 小班 / 未结 TS 下钻（原型模拟）" class="text-[12px] font-semibold text-indigo-600">查看负荷明细</button>
            ${resigned ? `
              <button data-action="reappoint" data-id="${m.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-9 rounded-lg border border-indigo-200 bg-indigo-50 px-3 text-[12px] font-semibold text-indigo-700 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-50 disabled:text-slate-300">复用委任</button>` : `
              <div class="flex shrink-0 gap-2">
                <button data-action="open-rebind" data-id="${m.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-9 rounded-lg border border-slate-200 px-3 text-[12px] font-semibold text-slate-700 disabled:cursor-not-allowed disabled:text-slate-300">批量改绑</button>
                <button data-action="open-dismiss" data-id="${m.id}" ${state.online === 'off' ? 'disabled' : ''} class="h-9 rounded-lg border border-rose-200 bg-rose-50 px-3 text-[12px] font-semibold text-rose-600 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-50 disabled:text-slate-300">解除职务</button>
              </div>`}
          </div>

          ${resigned ? `<div class="mt-2 text-[12px] font-medium text-slate-400">已离职 · 历史单据只读追溯 · 不可再新增教师 / 小班 / 收款</div>` : ''}
        </article>`;
    }

    function updateMonitorListOnly() {
      const list = filteredMonitors();
      const el = document.getElementById('monitorList');
      const count = document.getElementById('monitorCount');
      if (el) {
        const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-3' : 'space-y-3';
        el.className = grid;
        el.innerHTML = list.length
          ? list.map(renderMonitorCard).join('')
          : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center sm:col-span-2"><p class="text-[14px] font-medium text-slate-400">暂无班长</p></div>`;
      }
      if (count) count.textContent = `共 ${list.length} 条 · 第 1/1 页 · 每页 20 条`;
      lucide.createIcons();
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      document.getElementById('overlay').innerHTML = state.overlay ? renderOverlayHTML() : '';
    }

    function renderOverlayHTML() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'video') return renderVideoModal();
      if (state.overlay.type === 'qr') return renderQrModal();
      if (state.overlay.type === 'avatarCrop') return renderAvatarCropModal();
      if (state.overlay.type === 'resignTeacher') return renderResignTeacherModal();
      if (state.overlay.type === 'appoint') return renderAppointModal();
      if (state.overlay.type === 'rebind') return renderRebindModal();
      if (state.overlay.type === 'dismiss') return renderDismissModal();
      return '';
    }

    function modalShell(content, maxWidth = 'max-w-[560px]') {
      return `
        <div class="absolute inset-0 z-50">
          <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
          <div class="absolute inset-x-3 top-1/2 mx-auto max-h-[88%] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl ${maxWidth}">
            ${content}
          </div>
        </div>`;
    }

    function modalHeader(title, subtitle = '') {
      return `
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
            ${subtitle ? `<p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
          </div>
          <button data-action="close-overlay" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
        </div>`;
    }

    function renderVideoModal() {
      const t = teacherById(state.activeTeacherId);
      const video = t && t.media.video;
      if (!video) return '';
      return `
        <div class="absolute inset-0 z-50">
          <div class="absolute inset-0 bg-slate-900/70" data-action="close-overlay"></div>
          <div class="absolute inset-x-3 top-1/2 mx-auto max-w-[560px] -translate-y-1/2 overflow-hidden rounded-2xl bg-slate-900 p-3 shadow-2xl">
            <div class="mb-2 flex items-center justify-between px-1">
              <span class="truncate text-[14px] font-semibold text-white">${esc(video.name)}</span>
              <button data-action="close-overlay" class="grid h-8 w-8 place-items-center rounded-lg text-slate-300 hover:bg-white/10" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
            </div>
            <video controls playsinline autoplay class="aspect-video w-full rounded-xl bg-black" src="${esc(video.url)}"></video>
            <p class="mt-2 text-center text-[12px] font-medium text-slate-400">原型使用公共示例视频 · 正式环境为教师 MP4 试讲</p>
          </div>
        </div>`;
    }

    function renderQrModal() {
      const t = teacherById(state.activeTeacherId);
      if (!t) return '';
      return `
        <div class="absolute inset-0 z-50">
          <div class="absolute inset-0 bg-slate-900/60" data-action="close-overlay"></div>
          <div class="absolute inset-x-6 top-1/2 mx-auto max-w-[340px] -translate-y-1/2 rounded-2xl bg-white p-5 text-center shadow-2xl">
            <div class="flex justify-end">
              <button data-action="close-overlay" class="grid h-8 w-8 place-items-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
            </div>
            <div class="mx-auto mt-1 h-56 w-56 rounded-2xl border border-slate-200 bg-white p-3">
              ${t.qrDataUrl ? `<img src="${t.qrDataUrl}" class="h-full w-full object-contain" alt="ClassIn QR">` : qrSvg(t.name)}
            </div>
            <div class="mt-3 text-[16px] font-bold text-slate-900">${esc(t.name)}</div>
            <p class="mt-1 text-[12px] font-medium text-slate-500">长按识别 / 使用 ClassIn 扫码添加</p>
            <p class="mt-1 text-[12px] font-medium text-slate-400">原型占位二维码 · 正式环境为教师真实 ClassIn 码</p>
          </div>
        </div>`;
    }

    function renderAvatarCropModal() {
      const crop = state.form.crop;
      const photo = crop ? state.form.photos.find((p) => p.id === crop.photoId) : null;
      if (!crop || !photo) return '';
      return `
        <div class="absolute inset-0 z-50">
          <div class="absolute inset-0 bg-slate-900/75 backdrop-blur-[1px]" data-action="close-avatar-crop"></div>
          <div class="absolute inset-x-4 top-1/2 mx-auto max-h-[90%] max-w-[360px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <h2 class="text-[16px] font-bold text-slate-900">1:1 主头像裁切</h2>
                <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">缩放并移动构图，确认后生成列表与课表使用的 1:1 主头像。</p>
              </div>
              <button data-action="close-avatar-crop" class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-slate-500 hover:bg-slate-100" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
            </div>

            <div class="mt-3 flex justify-center rounded-2xl bg-slate-100 p-3">
              <canvas id="cropPreview" width="400" height="400" class="h-56 w-56 rounded-xl bg-slate-200 ring-1 ring-slate-200"></canvas>
            </div>

            <div class="mt-3 space-y-2.5">
              <label for="cropZoom" class="block text-[12px] font-semibold text-slate-600">缩放
                <input id="cropZoom" type="range" min="1" max="3" step="0.05" value="${crop.zoom}" class="mt-1 w-full accent-indigo-600">
              </label>
              <div class="grid grid-cols-2 gap-3">
                <label for="cropX" class="block text-[12px] font-semibold text-slate-600">水平位置
                  <input id="cropX" type="range" min="0" max="1" step="0.01" value="${crop.x}" class="mt-1 w-full accent-indigo-600">
                </label>
                <label for="cropY" class="block text-[12px] font-semibold text-slate-600">垂直位置
                  <input id="cropY" type="range" min="0" max="1" step="0.01" value="${crop.y}" class="mt-1 w-full accent-indigo-600">
                </label>
              </div>
            </div>

            <p class="mt-2 text-[12px] font-medium text-slate-400">相册其余照片保持原始纵横比，仅主头像保存为 1:1 WebP。</p>
            <div class="mt-3 flex gap-2">
              <button data-action="reset-avatar-crop" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">恢复居中</button>
              <button data-action="confirm-avatar-crop" class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white">确认设为主头像</button>
            </div>
          </div>
        </div>`;
    }

    function renderResignTeacherModal() {
      const t = teacherById(state.activeTeacherId);
      if (!t) return '';
      const cleared = state.resignTeacher.cleared;
      const rows = [
        { key: 'temp', label: '未来 1-7 天临时课', count: t.resign.temp, unit: '节', tone: 'amber', action: '去调配代课' },
        { key: 'fixed', label: '正在履约的四周固定位', count: t.resign.fixed, unit: '名学员', tone: 'rose', action: '去协调换师' },
        { key: 'classes', label: '担任主讲人的小班课', count: t.resign.classes, unit: '个班', tone: 'indigo', action: '去变更主讲' }
      ];
      return modalShell(`
        ${modalHeader(`办理教师离职：${t.name}`, `${t.level} · 需完成全部教务交接后方可离职`)}
        <p class="mt-3 text-[14px] font-medium leading-relaxed text-slate-600">该教师尚有未来未执行教务，必须全部交接清零后方可办理离职。</p>
        <div class="mt-3 space-y-2">
          ${rows.map((r) => `
            <div class="rounded-xl border ${r.count ? 'border-amber-200 bg-amber-50' : 'border-emerald-200 bg-emerald-50'} px-3.5 py-3">
              <div class="flex items-center justify-between gap-2">
                <div class="min-w-0">
                  <div class="text-[14px] font-bold ${r.count ? 'text-amber-900' : 'text-emerald-800'}">${r.label}</div>
                  <div class="mt-0.5 text-[12px] font-medium ${r.count ? 'text-amber-800' : 'text-emerald-700'}">${r.count ? `${r.count} ${r.unit}待处理` : '已清零'}</div>
                </div>
                ${r.count ? `<button data-action="toast" data-message="${r.action}（原型模拟）" class="h-8 shrink-0 rounded-lg border border-amber-300 bg-white px-2.5 text-[12px] font-semibold text-amber-800">${r.action}</button>` : `<span class="text-[12px] font-semibold text-emerald-700">${icon('check-circle-2', 'h-4 w-4')}</span>`}
              </div>
            </div>
          `).join('')}
        </div>
        <label class="mt-3 flex items-start gap-3 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-3 cursor-pointer">
          <input id="resignCleared" type="checkbox" ${cleared ? 'checked' : ''} class="mt-0.5 h-4 w-4 rounded border-slate-300 accent-indigo-600">
          <span class="text-[14px] font-medium text-slate-700">模拟完成全部交接（原型演示）<span class="mt-0.5 block text-[12px] font-medium text-slate-400">勾选后确认办理离职按钮可用</span></span>
        </label>
        <p class="mt-3 text-[12px] font-medium leading-relaxed text-slate-400">离职后档案软删除，选课大厅立即下架，历史已完课课酬正常参与周结发薪。</p>
        <div class="mt-4 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-200 text-[14px] font-semibold text-slate-700">取消</button>
          <button id="btnResignTeacher" data-action="resign-confirm" ${cleared ? '' : 'disabled'} class="h-11 flex-1 rounded-xl bg-rose-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400">确认办理离职</button>
        </div>
      `);
    }

    function renderAppointModal() {
      return modalShell(`
        ${modalHeader('委任新班长', '通过已注册邮箱检索账号，授予 monitor 角色')}
        <div class="mt-4 space-y-3.5">
          <div>
            <label for="appointEmail" class="mb-1.5 block text-[16px] font-semibold text-slate-800">已注册邮箱 <span class="text-rose-500">*</span></label>
            <input id="appointEmail" type="email" value="${esc(state.appoint.email)}" placeholder="leo@example.com" class="h-12 w-full rounded-xl border border-slate-200 bg-white px-3.5 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
            <div id="appointMatch" class="mt-1.5 text-[12px] font-medium"></div>
          </div>
          <div>
            <label for="appointName" class="mb-1.5 block text-[16px] font-semibold text-slate-800">显示名称 <span class="text-rose-500">*</span></label>
            <input id="appointName" value="${esc(state.appoint.name)}" placeholder="如 Grace" maxlength="50" class="h-12 w-full rounded-xl border border-slate-200 bg-white px-3.5 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
          </div>
          <div>
            <label for="appointPhone" class="mb-1.5 block text-[16px] font-semibold text-slate-800">联系电话 <span class="text-rose-500">*</span></label>
            <input id="appointPhone" type="tel" value="${esc(state.appoint.phone)}" placeholder="138 0000 0000" class="h-12 w-full rounded-xl border border-slate-200 bg-white px-3.5 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
          </div>
        </div>
        <div class="mt-3 rounded-xl border border-indigo-100 bg-indigo-50/70 px-3.5 py-2.5 text-[12px] font-medium leading-relaxed text-indigo-900">

    /* ------------------------------------------------------------------
     * 表单与弹层更新

    function startTeacherForm(mode, id = null) {
      if (state.online === 'off') return showToast('离线模式下不可录入或编辑档案');
      if (mode === 'edit') {
        const t = teacherById(id);
        if (!t || t.monitorId !== CURRENT_MONITOR_ID || t.status === 'resigned') return showToast('该教师不在当前班长名下');
        const photos = clone(t.photos || []);
        state.form = {
          mode: 'edit', id: t.id, name: t.name, level: t.level, specialties: [...t.specialties],
          introZh: t.introZh, introEn: t.introEn,
          avatarDataUrl: t.avatarDataUrl || (photos[0] ? photos[0].dataUrl : ''), qrDataUrl: t.qrDataUrl || '',
          photos, avatarPhotoId: t.avatarPhotoId || (photos[0] ? photos[0].id : null), crop: null,
          media: clone(t.media), publish: t.status === 'active', videoError: '', error: ''
        };
        state.formReturnPage = state.page === 'teacherDetail' ? 'teacherDetail' : 'teachers';
      } else {
        state.form = emptyTeacherForm();
        state.formReturnPage = 'teachers';
      }
      state.role = 'monitor';
      state.page = 'teacherForm';
      state.navTab = 'ops';
      state.overlay = null;
      renderAll();
      updateIntroCounters();
    }

    function openAppoint(prefill = {}) {
      if (state.online === 'off') return showToast('离线模式下不可委任班长');
      state.appoint = { email: prefill.email || '', name: prefill.name || '', phone: prefill.phone || '', error: '' };
      state.overlay = { type: 'appoint' };
      renderAll();
      updateAppointMatch();
      setTimeout(() => document.getElementById('appointEmail')?.focus(), 50);
    }

    function openRebind(monitorId) {
      if (state.online === 'off') return showToast('离线模式下不可改绑');
      const m = monitorById(monitorId);
      if (!m || m.status === 'resigned') return;
      const teachers = state.teachers.filter((t) => t.monitorId === m.id && t.status !== 'resigned');
      const classes = state.classes.filter((c) => c.monitorId === m.id && ['recruiting', 'active'].includes(c.status));
      if (!teachers.length && !classes.length) return showToast('该班长名下暂无可改绑的教师或小班');
      state.rebind = {
        monitorId: m.id, targetId: '',
        teacherIds: teachers.map((t) => t.id), classIds: classes.map((c) => c.id), error: ''
      };
      state.overlay = { type: 'rebind' };
      renderAll();
      updateRebindButton();
    }

    function openDismiss(monitorId) {
      if (state.online === 'off') return showToast('离线模式下不可解除班长职务');
      const m = monitorById(monitorId);
      if (!m || m.status === 'resigned') return;
      const metrics = monitorMetrics(m);
      state.dismiss = {
        monitorId: m.id,
        fundsCleared: (m.unsettledTs || 0) === 0,
        eduCleared: metrics.teachers === 0 && metrics.classes === 0,
        confirmName: '', error: ''
      };
      state.overlay = { type: 'dismiss' };
      renderAll();
    }

    function updateIntroCounters() {
      const zh = document.getElementById('fIntroZh');
      const en = document.getElementById('fIntroEn');
      const zhCount = document.getElementById('zhCount');
      const enCount = document.getElementById('enCount');
      if (zh && zhCount) zhCount.textContent = zh.value.length;
      if (en && enCount) enCount.textContent = en.value.length;
    }

    function clearFormError() {
      state.form.error = '';
      const el = document.getElementById('formError');
      if (el) el.remove();
    }

    function updatePublishToggle() {
      const on = state.form.publish;
      const label = document.getElementById('publishLabel');
      const track = document.getElementById('publishTrack');
      const knob = document.getElementById('publishKnob');
      if (label) {
        label.textContent = on ? '已开启' : '已关闭';
        label.className = `text-[12px] font-semibold ${on ? 'text-indigo-700' : 'text-slate-400'}`;
      }
      if (track) track.className = `relative h-6 w-11 rounded-full transition ${on ? 'bg-indigo-600' : 'bg-slate-300'}`;
      if (knob) knob.className = `absolute top-0.5 h-5 w-5 rounded-full bg-white shadow-sm transition-transform ${on ? 'translate-x-5' : 'translate-x-0'}`;
    }

    function updateAppointMatch() {
      const email = state.appoint.email.trim().toLowerCase();
      const account = ACCOUNTS[email];
      const active = state.monitors.find((m) => m.email.toLowerCase() === email && m.status === 'active');
      const resigned = state.monitors.find((m) => m.email.toLowerCase() === email && m.status === 'resigned');
      let html = '';
      let blocked = false;
      let tone = 'text-slate-400';
      if (!email) {
        html = '输入已注册邮箱检索账号';
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        html = '请输入有效的邮箱地址';
        tone = 'text-rose-600';
        blocked = true;
      } else if (!account) {
        html = '未找到该账号 · ACCOUNT_NOT_FOUND';
        tone = 'text-rose-600';
        blocked = true;
      } else if (active) {
        html = '该账号已有在职班长档案 · MONITOR_ALREADY_EXISTS';
        tone = 'text-rose-600';
        blocked = true;
      } else if (resigned) {
        html = `检测到已离职档案「${resigned.name}」，确认后将复用并恢复在职`;
        tone = 'text-amber-700';
      } else {
        html = `匹配账号：${account.name} · 可授予 monitor 角色`;
        tone = 'text-emerald-600';
      }
      const match = document.getElementById('appointMatch');
      if (match) match.innerHTML = `<span class="${tone}">${esc(html)}</span>`;
      const nameOk = state.appoint.name.trim().length >= 1 && state.appoint.name.trim().length <= 50;
      const phoneOk = isValidPhone(state.appoint.phone);
      const btn = document.getElementById('btnAppoint');
      if (btn) btn.disabled = blocked || !nameOk || !phoneOk;
    }

    function updateRebindButton() {
      const valid = !!state.rebind.targetId && (state.rebind.teacherIds.length + state.rebind.classIds.length > 0);
      const btn = document.getElementById('btnRebind');
      if (btn) btn.disabled = !valid;
    }

    function updateDismissButton() {
      const m = monitorById(state.dismiss.monitorId);
      const metrics = m ? monitorMetrics(m) : { teachers: 0, classes: 0 };
      const fundsCleared = state.dismiss.fundsCleared || !(m && m.unsettledTs > 0);
      const eduCleared = state.dismiss.eduCleared || (metrics.teachers === 0 && metrics.classes === 0);
      const btn = document.getElementById('btnDismiss');
      if (btn) btn.disabled = !(fundsCleared && eduCleared && m && state.dismiss.confirmName.trim() === m.name);
    }

    function isEmailValid(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
    }

    function isValidPhone(phone) {
      const clean = String(phone || '').replace(/[\s-]/g, '');
      return /^\+?[1-9]\d{6,14}$/.test(clean);
    }

    function teacherFormError() {
      const f = state.form;
      if (state.online === 'off') return '离线模式下不可保存档案';
      if (!f.name.trim()) return '请填写外教英文姓名';
      if (f.name.trim().length > 50) return '英文姓名不能超过 50 字符';
      if (!LEVELS.some((l) => l.id === f.level)) return '请选择定级标准';
      if (!f.specialties.length) return '请至少选择 1 个擅长课程类型';
      if (!f.introZh.trim()) return '请填写中文简介';
      if (f.introZh.length > 2000) return '中文简介不能超过 2000 字符';
      if (f.introEn.length > 2000) return '英文简介不能超过 2000 字符';
      if (f.publish) {
        if (!f.introEn.trim()) return '发布前请补全英文简介，或关闭同步保存为草稿';
        if (!f.photos.length) return '发布前请上传至少 1 张风采相册照片，或关闭同步保存为草稿';
        if (!f.avatarPhotoId) return '发布前请选择并裁切 1 张 1:1 主头像，或关闭同步保存为草稿';
        if (!f.media.qr) return '发布前请上传 ClassIn 二维码，或关闭同步保存为草稿';
        if (!f.media.video) return '发布前请上传 MP4 试讲视频，或关闭同步保存为草稿';
      }
      return null;
    }

    function saveTeacher() {
      const f = state.form;
      const err = teacherFormError();
      if (err) {
        f.error = err;
        renderAll();
        setTimeout(() => document.getElementById('formError')?.scrollIntoView({ block: 'center' }), 60);
        showToast(err);
        return;
      }
      const complete = formMissing().length === 0;
      const status = f.publish && complete ? 'active' : 'pending';
      if (f.mode === 'edit') {
        const t = teacherById(f.id);
        if (!t) return;
        Object.assign(t, {
          name: f.name.trim(), level: f.level, specialties: [...f.specialties],
          introZh: f.introZh, introEn: f.introEn,
          avatarDataUrl: f.avatarDataUrl, qrDataUrl: f.qrDataUrl,
          photos: clone(f.photos), avatarPhotoId: f.avatarPhotoId,
          media: clone(f.media), status
        });
        state.activeTeacherId = t.id;
        state.page = 'teacherDetail';
        state.navTab = 'ops';
        state.overlay = null;
        renderAll();
        showToast(status === 'active' ? '教师档案已保存并同步至家长端' : '已保存为待完善档案，暂未上架');
        return;
      }
      const t = {
        id: `tc_${Math.random().toString(36).slice(2, 10)}`,
        name: f.name.trim(), level: f.level, monitorId: CURRENT_MONITOR_ID,
        specialties: [...f.specialties], introZh: f.introZh, introEn: f.introEn,
        avatarDataUrl: f.avatarDataUrl, qrDataUrl: f.qrDataUrl,
        photos: clone(f.photos), avatarPhotoId: f.avatarPhotoId,
        media: clone(f.media), todayLessons: 0, upcoming: 0, completed: 0,
        status, createdAt: TODAY, resign: { temp: 0, fixed: 0, classes: 0 }
      };
      state.teachers.push(t);
      state.activeTeacherId = t.id;
      state.page = 'teacherDetail';
      state.navTab = 'ops';
      state.overlay = null;
      renderAll();
      showToast(status === 'active' ? `已创建 ${t.name} 并上架家长端` : `已创建 ${t.name}，档案待完善`);
    }

    function handleQrFile(file) {
      if (!file) return;
      if (!file.type || !file.type.startsWith('image/')) {
        showToast('请选择图片文件');
        return;
      }
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 320;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const min = Math.min(img.width, img.height);
          const sx = (img.width - min) / 2;
          const sy = (img.height - min) / 2;
          ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
          const url = canvas.toDataURL('image/webp', 0.85);
          clearFormError();
          state.form.qrDataUrl = url;
          state.form.media.qr = true;
          renderAll();
          updateIntroCounters();
          setTimeout(() => document.getElementById('formMedia')?.scrollIntoView({ block: 'center' }), 60);
          showToast('ClassIn 二维码已压缩为 WebP');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    /* ------------------------------------------------------------------
     * 风采相册 · 上传 / 1:1 裁切 / 排序 / 删除保护
     * ------------------------------------------------------------------ */
    const imageCache = new Map();

    function loadImage(src) {
      if (imageCache.has(src)) return imageCache.get(src);
      const promise = new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
      imageCache.set(src, promise);
      return promise;
    }

    function compressImageFile(file, maxSide = 1200) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
            const w = Math.max(1, Math.round(img.naturalWidth * scale));
            const h = Math.max(1, Math.round(img.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            try {
              resolve(canvas.toDataURL('image/webp', 0.85));
            } catch (e) {
              resolve(evt.target.result);
            }
          };
          img.onerror = reject;
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function cropToDataUrl(dataUrl, opts = {}) {
      return loadImage(dataUrl).then((img) => {
        const size = 400;
        const zoom = opts.zoom || 1;
        const side = Math.min(img.naturalWidth, img.naturalHeight) / zoom;
        const sx = (img.naturalWidth - side) * (opts.x ?? 0.5);
        const sy = (img.naturalHeight - side) * (opts.y ?? 0.5);
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, size, size);
        try {
          return canvas.toDataURL('image/webp', 0.85);
        } catch (e) {
          return dataUrl;
        }
      });
    }

    function drawCropPreview() {
      const crop = state.form.crop;
      const photo = crop ? state.form.photos.find((p) => p.id === crop.photoId) : null;
      const canvas = document.getElementById('cropPreview');
      if (!crop || !photo || !canvas) return;
      loadImage(photo.dataUrl).then((img) => {
        const size = canvas.width;
        const side = Math.min(img.naturalWidth, img.naturalHeight) / (crop.zoom || 1);
        const sx = (img.naturalWidth - side) * crop.x;
        const sy = (img.naturalHeight - side) * crop.y;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      }).catch(() => {});
    }

    async function handleAlbumFiles(files) {
      const list = Array.from(files || []).filter((f) => f.type && f.type.startsWith('image/'));
      if (!list.length) {
        showToast('请选择图片文件');
        return;
      }
      const remaining = 6 - state.form.photos.length;
      if (remaining <= 0) {
        showToast('风采相册最多 6 张');
        return;
      }
      const accepted = list.slice(0, remaining);
      let added = 0;
      for (const file of accepted) {
        if (state.form.photos.length >= 6) break;
        try {
          const dataUrl = await compressImageFile(file);
          state.form.photos.push({
            id: `ph_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            name: file.name,
            dataUrl
          });
          added++;
        } catch (e) {
          showToast(`无法读取图片：${file.name}`);
        }
      }
      if (!added) return;
      state.form.media.photo = true;
      if (!state.form.avatarPhotoId) {
        const first = state.form.photos[0];
        state.form.avatarPhotoId = first.id;
        try {
          state.form.avatarDataUrl = await cropToDataUrl(first.dataUrl);
        } catch (e) {
          state.form.avatarDataUrl = first.dataUrl;
        }
      }
      clearFormError();
      renderAll();
      updateIntroCounters();
      setTimeout(() => document.getElementById('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      const ignored = list.length - accepted.length;
      showToast(ignored > 0 ? `已添加 ${added} 张照片（相册上限 6 张）` : `已添加 ${added} 张风采照片`);
    }

    function deleteFormPhoto(photoId) {
      const photos = state.form.photos;
      if (photos.length <= 1) {
        showToast('教师档案必须保留至少 1 张照片作为主头像');
        return;
      }
      const index = photos.findIndex((p) => p.id === photoId);
      if (index < 0) return;
      const wasMain = state.form.avatarPhotoId === photoId;
      photos.splice(index, 1);
      if (wasMain) {
        const promoted = photos[Math.min(index, photos.length - 1)] || photos[0];
        state.form.avatarPhotoId = promoted.id;
        state.form.avatarDataUrl = promoted.dataUrl;
        cropToDataUrl(promoted.dataUrl).then((url) => {
          state.form.avatarDataUrl = url;
          renderAll();
          updateIntroCounters();
        }).catch(() => {});
      }
      state.form.media.photo = photos.length > 0;
      clearFormError();
      renderAll();
      updateIntroCounters();
      setTimeout(() => document.getElementById('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      showToast(wasMain ? '已删除原主头像，剩余照片已自动晋升' : '照片已删除');
    }

    function reorderFormPhoto(fromId, toId) {
      const photos = state.form.photos;
      const from = photos.findIndex((p) => p.id === fromId);
      const to = photos.findIndex((p) => p.id === toId);
      if (from < 0 || to < 0 || from === to) return;
      const [moving] = photos.splice(from, 1);
      photos.splice(to, 0, moving);
      renderAll();
      updateIntroCounters();
      setTimeout(() => document.getElementById('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      showToast('相册展示顺序已更新');
    }

    function moveFormPhoto(photoId, delta) {
      const photos = state.form.photos;
      const index = photos.findIndex((p) => p.id === photoId);
      const target = index + delta;
      if (index < 0 || target < 0 || target >= photos.length) return;
      const [moving] = photos.splice(index, 1);
      photos.splice(target, 0, moving);
      renderAll();
      updateIntroCounters();
      setTimeout(() => document.getElementById('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      showToast('相册展示顺序已更新');
    }

    function handleVideoFile(file) {
      if (!file) return;
      const isMp4 = file.type === 'video/mp4' || /\.mp4$/i.test(file.name);
      if (!isMp4) {
        state.form.videoError = '仅支持 MP4 (H.264 + AAC)，WebM 已拦截';
        renderAll();
        setTimeout(() => document.getElementById('formMedia')?.scrollIntoView({ block: 'center' }), 60);
        showToast('视频格式被拦截：仅支持 MP4');
        return;
      }
      if (file.size > 50 * 1024 * 1024) {
        state.form.videoError = '视频不能超过 50MB';
        renderAll();
        setTimeout(() => document.getElementById('formMedia')?.scrollIntoView({ block: 'center' }), 60);
        showToast('视频超过 50MB 上限');
        return;
      }
      const sizeMb = (file.size / 1024 / 1024).toFixed(1);
      clearFormError();
      state.form.videoError = '';
      state.form.media.video = { name: file.name, size: `${sizeMb} MB`, duration: '—', url: URL.createObjectURL(file) };
      renderAll();
      setTimeout(() => document.getElementById('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      showToast('MP4 校验通过');
    }

    function submitAppoint() {
      if (state.online === 'off') return showToast('离线模式下不可委任班长');
      const email = state.appoint.email.trim().toLowerCase();
      const name = state.appoint.name.trim();
      const phone = state.appoint.phone.trim();
      const fail = (msg) => {
        state.appoint.error = msg;
        renderOverlay();
        lucide.createIcons();
        document.getElementById('appointEmail')?.focus();
      };
      if (!isEmailValid(email)) return fail('请输入有效的邮箱地址');
      const account = ACCOUNTS[email];
      if (!account) return fail('该邮箱尚未注册 · ACCOUNT_NOT_FOUND');
      const active = state.monitors.find((m) => m.email.toLowerCase() === email && m.status === 'active');
      if (active) return fail('该账号已有在职班长档案 · MONITOR_ALREADY_EXISTS');
      if (!name || name.length > 50) return fail('显示名称需为 1-50 字符');
      if (!isValidPhone(phone)) return fail('请输入 11 位手机号或 E.164 格式电话');
      const resigned = state.monitors.find((m) => m.email.toLowerCase() === email && m.status === 'resigned');
      if (resigned) {
        resigned.status = 'active';
        resigned.name = name;
        resigned.phone = phone;
        resigned.appointedAt = TODAY;
        resigned.appointedBy = 'Sarah';
        delete resigned.resignedAt;
        state.monitorFilter = 'active';
        state.overlay = null;
        renderAll();
        showToast(`已复用并恢复 ${name} 的班长档案 · monitor_appointed`);
        return;
      }
      state.monitors.push({
        id: `mn_${Math.random().toString(36).slice(2, 10)}`,
        name, email, phone, appointedAt: TODAY, status: 'active',
        unsettledTs: 0, unsettledPoints: 0, appointedBy: 'Sarah'
      });
      state.monitorFilter = 'active';
      state.overlay = null;
      renderAll();
      showToast(`已委任 ${name} 为班长 · monitor_appointed`);
    }

    function submitRebind() {
      if (state.online === 'off') return showToast('离线模式下不可改绑');
      const r = state.rebind;
      const m = monitorById(r.monitorId);
      const target = monitorById(r.targetId);
      const fail = (msg) => {
        state.rebind.error = msg;
        renderOverlay();
        lucide.createIcons();
      };
      if (!m || !target || target.status !== 'active' || target.id === m.id) {
        return fail('接手班长必须为在职、非本人 · REBIND_TARGET_INVALID');
      }
      if (!r.teacherIds.length && !r.classIds.length) return fail('请至少选择 1 位教师或 1 个小班');
      let teacherCount = 0;
      let classCount = 0;
      state.teachers.forEach((t) => {
        if (r.teacherIds.includes(t.id) && t.monitorId === m.id) {
          t.monitorId = target.id;
          teacherCount++;
        }
      });
      state.classes.forEach((c) => {
        if (r.classIds.includes(c.id) && c.monitorId === m.id) {
          c.monitorId = target.id;
          classCount++;
        }
      });
      state.overlay = null;
      state.page = 'monitors';
      state.navTab = 'settings';
      renderAll();
      showToast(`已改绑 ${teacherCount} 位教师 / ${classCount} 个小班 · 历史资金持有人不变`);
    }

    function submitDismiss() {
      if (state.online === 'off') return showToast('离线模式下不可解除职务');
      const d = state.dismiss;
      const m = monitorById(d.monitorId);
      if (!m) return;
      const metrics = monitorMetrics(m);
      const fundsCleared = d.fundsCleared || (m.unsettledTs || 0) === 0;
      const eduCleared = d.eduCleared || (metrics.teachers === 0 && metrics.classes === 0);
      const fail = (msg) => {
        state.dismiss.error = msg;
        renderOverlay();
        lucide.createIcons();
      };
      if (!fundsCleared) return fail('防线一未通过：仍有未结 TS · MONITOR_HAS_UNSETTLED_TS');
      if (!eduCleared) return fail('防线二未通过：仍有在职教师或小班 · MONITOR_HAS_ACTIVE_TEACHERS');
      if (d.confirmName.trim() !== m.name) return fail('请输入正确的班长显示名称以确认');
      m.status = 'resigned';
      m.resignedAt = TODAY;
      m.unsettledTs = 0;
      m.unsettledPoints = 0;
      if (eduCleared) {
        const fallback = state.monitors.find((x) => x.status === 'active' && x.id !== m.id);
        if (fallback) {
          state.teachers.forEach((t) => { if (t.monitorId === m.id) t.monitorId = fallback.id; });
          state.classes.forEach((c) => { if (c.monitorId === m.id) c.monitorId = fallback.id; });
        }
      }
      state.monitorFilter = 'active';
      state.overlay = null;
      state.page = 'monitors';
      state.navTab = 'settings';
      renderAll();
      showToast(`已解除 ${m.name} 的班长职务 · monitor_dismissed`);
    }

        clearFormError();
      }
      if (id === 'fPhotoInput') handleAlbumFiles(e.target.files);
      if (id === 'fQrInput') handleQrFile(e.target.files && e.target.files[0]);
      if (id === 'fVideoInput') handleVideoFile(e.target.files && e.target.files[0]);

      if (id === 'resignCleared') {
        state.resignTeacher.cleared = e.target.checked;
        const btn = document.getElementById('btnResignTeacher');
        if (btn) btn.disabled = !e.target.checked;
      }

      if (id === 'rebindTarget') {
        state.rebind.targetId = e.target.value;
        state.rebind.error = '';
        updateRebindButton();
      }
      if (e.target.matches('[data-rebind-teacher]')) {
        const tid = e.target.dataset.rebindTeacher;
        state.rebind.teacherIds = e.target.checked
          ? [...new Set([...state.rebind.teacherIds, tid])]
          : state.rebind.teacherIds.filter((x) => x !== tid);
        state.rebind.error = '';
        updateRebindButton();
      }
      if (e.target.matches('[data-rebind-class]')) {
        const cid = e.target.dataset.rebindClass;
        state.rebind.classIds = e.target.checked
          ? [...new Set([...state.rebind.classIds, cid])]
          : state.rebind.classIds.filter((x) => x !== cid);
        state.rebind.error = '';
        updateRebindButton();
      }

      if (id === 'dismissFunds') {
        state.dismiss.fundsCleared = e.target.checked;
        state.dismiss.error = '';
        renderOverlay();
        lucide.createIcons();
      }
      if (id === 'dismissEdu') {
        state.dismiss.eduCleared = e.target.checked;
        state.dismiss.error = '';
        renderOverlay();
        lucide.createIcons();
      }
    });

    /* ------------------------------------------------------------------
     * 相册拖拽排序（HTML5 Drag & Drop，无外部依赖）
     * ------------------------------------------------------------------ */
    let draggingPhotoId = null;

    document.getElementById('frame').addEventListener('dragstart', (e) => {
      const card = e.target.closest('[data-photo-id]');
      if (!card || state.page !== 'teacherForm') return;
      draggingPhotoId = card.dataset.photoId;
      card.classList.add('opacity-50');
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', draggingPhotoId); } catch (err) { /* noop */ }
      }
    });

    document.getElementById('frame').addEventListener('dragend', (e) => {
      const card = e.target.closest('[data-photo-id]');
      if (card) card.classList.remove('opacity-50');
      draggingPhotoId = null;
    });

    document.getElementById('frame').addEventListener('dragover', (e) => {
      if (state.page !== 'teacherForm' || !draggingPhotoId) return;
      const card = e.target.closest('[data-photo-id]');
      if (!card) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    });

    document.getElementById('frame').addEventListener('drop', (e) => {
      if (state.page !== 'teacherForm') return;
      const card = e.target.closest('[data-photo-id]');
      if (!card) return;
      e.preventDefault();
      const fromId = draggingPhotoId || (e.dataTransfer ? e.dataTransfer.getData('text/plain') : '');
      draggingPhotoId = null;
      if (fromId) reorderFormPhoto(fromId, card.dataset.photoId);
    });

    /* ------------------------------------------------------------------
     * 提示
     * ------------------------------------------------------------------ */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2600);
    }

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

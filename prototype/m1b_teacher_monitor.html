      if (!t.media || !t.media.qr) missing.push('ClassIn 二维码');
      if (!t.media || !t.media.video) missing.push('试讲视频');
      return missing;
    }

    function formMissing() {
      const f = state.form;
      const missing = [];
      if (!f.introEn.trim()) missing.push('英文简介');
      if (!f.media.photo) missing.push('个人照片');
      if (!f.media.qr) missing.push('ClassIn 二维码');
      if (!f.media.video) missing.push('试讲视频');
      return missing;
    }

    function weeklyLoad(t) {
      const capacity = t.weeklyCapacity || 30;
      return { used: Math.min(capacity, (t.todayLessons || 0) + (t.upcoming || 0)), capacity };
    }

    function teacherAvailability(t) {
      return t.availability === 'leave' || t.availability === 'substituting' ? t.availability : 'available';
    }

    function teacherStatusMeta(t) {
      if (t.status === 'resigned') return { label: '已离职', tone: 'slate' };
      if (hasPendingResign(t)) return { label: `将于 ${shortDate(t.resignDate)} 离职`, tone: 'amber' };
      if (missingMedia(t).length) return { label: '待完善', tone: 'amber' };
      if (t.status === 'pending') return { label: '待完善', tone: 'amber' };
      if (teacherAvailability(t) === 'leave') return { label: '请假', tone: 'rose' };
      if (teacherAvailability(t) === 'substituting') return { label: '代课中', tone: 'indigo' };
      return { label: '正常可约', tone: 'emerald' };
    }

    function attributionMeta(t, mode = state.role) {
      if (t.monitorId === PLATFORM_MONITOR_ID) return { label: '平台未划拨', tone: 'slate' };
      if (mode === 'monitor') {
        if (t.monitorId === CURRENT_MONITOR_ID) return { label: '⭐ 我直管', tone: 'indigo' };
        const own = monitorById(t.monitorId);
        return { label: own ? `${own.name} 班` : '待划拨', tone: 'slate' };
      }
      if (t.monitorId === ADMIN_MONITOR_ID) return { label: '⭐ 我直管', tone: 'indigo' };
      const m = monitorById(t.monitorId);
      return { label: m ? `${m.name} 班` : '待划拨', tone: 'slate' };
    }

    function attributionBadge(t, mode = state.role) {
      const meta = attributionMeta(t, mode);
      return `<span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${TONES[meta.tone].chip}">${esc(meta.label)}</span>`;
    }

    function monitorDisplayName(t) {
      if (t.monitorId === PLATFORM_MONITOR_ID) return '平台未划拨';
      const m = monitorById(t.monitorId);
      return m ? m.name : '—';
    }

    function attributionText(t, mode = state.role) {
      return attributionMeta(t, mode).label;
    }

    function countLabel(count) {
      return count > 0 ? ` (${count})` : '';
    }

    function teacherSearchText(t) {
      const monitor = monitorById(t.monitorId);
      return [t.name, priceLabel(t.level), t.level, t.classinRoom, monitor ? monitor.name : '']
        .filter(Boolean).join(' ').toLowerCase();
    }

    function teacherMatchesQuery(t) {
      const q = state.teacherQuery.trim().toLowerCase();
      return !q || teacherSearchText(t).includes(q);
    }

    function teacherStatusFilterMatch(t, filter) {
      if (filter === 'all') return true;
      const label = teacherStatusMeta(t).label;
      if (filter === 'normal') return label === '正常可约';
      if (filter === 'leave') return label === '请假' || label === '代课中';
      if (filter === 'pending') return label === '待完善' || label === '待发布';
      return true;
    }

    function adminAttributionMatch(t, key) {
      if (key === 'all') return true;
      if (key === 'direct') return t.monitorId === ADMIN_MONITOR_ID || t.monitorId === PLATFORM_MONITOR_ID;
      if (key === 'platform') return t.monitorId === PLATFORM_MONITOR_ID;
      return t.monitorId === key;
    }

    function monitorSliceMatch(t, key) {
      if (key === 'all') return true;
      if (key === 'mine') return t.monitorId === CURRENT_MONITOR_ID;
      if (key === 'platform') return t.monitorId === PLATFORM_MONITOR_ID;
      return t.monitorId === key;
    }

    function monitorSliceCounts(base) {
      const others = state.monitors.filter((m) => m.status === 'active' && !m.isPlatform && m.id !== CURRENT_MONITOR_ID);
      return {
        mine: base.filter((t) => monitorSliceMatch(t, 'mine')).length,
        all: base.length,
        platform: base.filter((t) => monitorSliceMatch(t, 'platform')).length,
        others: others.map((m) => ({ id: m.id, name: m.name, count: base.filter((t) => t.monitorId === m.id).length }))
      };
    }

    function statusCounts(base) {
      return {
        all: base.length,
        normal: base.filter((t) => teacherStatusMeta(t).label === '正常可约').length,
        leave: base.filter((t) => ['请假', '代课中'].includes(teacherStatusMeta(t).label)).length,
        pending: base.filter((t) => ['待完善', '待发布'].includes(teacherStatusMeta(t).label)).length
      };
    }

    function attributionCounts(base) {
      const monitors = state.monitors.filter((m) => m.status === 'active' && !m.isPlatform && !m.isAdminSelf);
      return {
        direct: base.filter((t) => adminAttributionMatch(t, 'direct')).length,
        all: base.length,
        platform: base.filter((t) => adminAttributionMatch(t, 'platform')).length,
        monitors: monitors.map((m) => ({ id: m.id, name: m.name, count: base.filter((t) => t.monitorId === m.id).length }))
      };
    }

    function monitorStatusChip(status) {
      return status === 'active'
        ? `<span class="shrink-0 rounded-full border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-bold text-emerald-700">在职</span>`
        : `<span class="shrink-0 rounded-full border border-slate-300 bg-white px-1.5 py-0.5 text-[12px] font-bold text-slate-500">已离职</span>`;
    }

    function priceTier(level) {
      return PRICE_TIERS.find((p) => p.id === String(level)) || null;
    }

    function priceLabel(level) {
      const tier = priceTier(level);
      return tier ? tier.label : '—';
    }

    function priceBadge(level) {
      return `<span class="shrink-0 rounded-full border border-slate-200 bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">${esc(priceLabel(level))}</span>`;
    }

    function statusChip(t) {
      const meta = teacherStatusMeta(t);
      const T = TONES[meta.tone];
      return `<span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${T.chip}">${meta.label}</span>`;
    }

    function statusText(status, kind = 'teacher') {
      if (!status) return '新建档案';
      const map = kind === 'monitor' ? MONITOR_STATUS_LABELS : TEACHER_STATUS_LABELS;
      return map[status] || status;
    }

    function monitorNameOf(id) {
      if (id === PLATFORM_MONITOR_ID) return '平台未划拨';
      const m = monitorById(id);
      return m ? m.name : '—';
    }

    function clipText(value, max = 42) {
      const text = String(value ?? '').trim();
      if (!text) return '—';
      return text.length > max ? `${text.slice(0, max)}…` : text;
    }

    function nowStamp() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function operatorLabel() {
      return state.role === 'admin' ? 'Sarah（管理员）' : 'Leo（负责班长）';
    }

    function appendTeacherLog(id, entry) {
      state.teacherLogs[id] = [
        { id: `tl_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, ...entry },
        ...(state.teacherLogs[id] || [])
      ];
    }

    function appendMonitorLog(id, entry) {
      state.monitorLogs[id] = [
        { id: `ml_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, ...entry },
        ...(state.monitorLogs[id] || [])
      ];
    }

    function appendTeacherStatus(t, from, to, reason) {
      appendTeacherLog(t.id, { kind: 'status', at: nowStamp(), operator: operatorLabel(), from, to, reason });
    }

    function teacherFieldSnapshot(t) {
      const photos = t.photos || [];
      const main = photos.find((p) => p.id === mainPhotoId(t));
      return {
        name: clipText(t.name, 50),
        level: priceLabel(t.level),
        monitor: monitorNameOf(t.monitorId),
        introZh: clipText(t.introZh, 36),
        introEn: clipText(t.introEn, 36),
        video: t.media && t.media.video ? `${t.media.video.name}（${t.media.video.size}）` : '未上传',
        photos: `${photos.length} 张 · 主头像 ${main ? main.name : '未标记'} · 顺序 ${photos.map((p) => p.name).join(' → ') || '—'}`,
        qr: t.media && t.media.qr ? (t.qrDataUrl ? '已上传（自定义图片）' : '已上传（默认二维码）') : '未上传'
      };
    }

    function logFieldDiff(beforeSnap, afterSnap) {
      const defs = [
        ['level', '价位'],
        ['monitor', '负责班长'],
        ['name', '英文展示名'],
        ['introZh', '中文简介'],
        ['introEn', '英文简介'],
        ['video', '试讲视频'],
        ['photos', '风采相册'],
        ['qr', 'ClassIn 二维码']
      ];
      return defs
        .filter(([key]) => String(beforeSnap[key] ?? '') !== String(afterSnap[key] ?? ''))
        .map(([key, field]) => ({ field, before: clipText(beforeSnap[key], 60), after: clipText(afterSnap[key], 60) }));
    }

    function appendTeacherChanges(beforeSnap, t) {
      const changes = logFieldDiff(beforeSnap, teacherFieldSnapshot(t));
      if (changes.length) {
        appendTeacherLog(t.id, { kind: 'field', at: nowStamp(), operator: operatorLabel(), changes });
      }
    }

    function mainPhotoId(t) {
      if (t.avatarPhotoId) return t.avatarPhotoId;
      return t.photos && t.photos[0] ? t.photos[0].id : null;
    }

    function mainPhoto(t) {
      return (t.photos || []).find((p) => p.id === mainPhotoId(t)) || (t.photos || [])[0] || null;
    }

    function avatar(t, size = 'h-14 w-14', text = 'text-[18px]', tone = 'indigo') {
      const initial = (t.name || '?').trim().charAt(0).toUpperCase() || '?';
      const photo = mainPhoto(t);
      const src = t.avatarDataUrl || (photo ? photo.dataUrl : '');
      if (src) return `<img src="${esc(src)}" alt="" class="${size} shrink-0 rounded-full object-cover ring-1 ring-slate-200">`;
      return `<span class="${size} grid shrink-0 place-items-center rounded-full ${TONES[tone].icon} ${text} font-bold ring-1 ring-black/5">${esc(initial)}</span>`;
    }

    function qrSvg(seed) {
      const n = 9;
      let h = 0;
      for (const ch of String(seed)) h = (h * 131 + ch.charCodeAt(0)) >>> 0;
      const isFinder = (x, y, ox, oy) => x >= ox && x < ox + 3 && y >= oy && y < oy + 3
        && (x === ox || x === ox + 2 || y === oy || y === oy + 2 || (x === ox + 1 && y === oy + 1));
      let rects = '';
      for (let y = 0; y < n; y++) {
        for (let x = 0; x < n; x++) {
          const on = isFinder(x, y, 0, 0) || isFinder(x, y, 6, 0) || isFinder(x, y, 0, 6)
            ? true
            : ((h >> ((x + y * 3) % 30)) & 1) === 1;
          if (on) rects += `<rect x="${x * 10}" y="${y * 10}" width="10" height="10"/>`;
        }
      }
      return `<svg viewBox="0 0 90 90" class="h-full w-full text-slate-900" fill="currentColor" aria-hidden="true">${rects}</svg>`;
    }

    function isEmailValid(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
    }

    function isValidPhone(phone) {
      const clean = String(phone || '').replace(/[\s-]/g, '');
      return /^\+?[1-9]\d{6,14}$/.test(clean);
    }

    function filteredMonitors() {
      const q = state.monitorQuery.trim().toLowerCase();
      return state.monitors
        .filter((m) => !m.isPlatform)
        .filter((m) => state.monitorFilter === 'all' || m.status === state.monitorFilter)
        .filter((m) => !q || [m.name, m.email, m.phone].join(' ').toLowerCase().includes(q))
        .sort((a, b) => {
          if (a.status !== b.status) return a.status === 'active' ? -1 : 1;
          return b.appointedAt.localeCompare(a.appointedAt);
        });
    }

    function filteredAdminTeachers() {
      return sortTeacherList(listTeachers().filter((t) => teacherMatchesQuery(t)
        && adminAttributionMatch(t, state.adminTeacherMonitor)
        && teacherStatusFilterMatch(t, state.adminTeacherFilter)));
    }

    /* ------------------------------------------------------------------
     * 控制台
     * ------------------------------------------------------------------ */
    function viewAllowed(v) {
      if (state.role === 'monitor') return ['teachers', 'detail', 'form'].includes(v);
      return ['teachers', 'detail', 'monitors'].includes(v);
    }

    function currentViewKey() {
      if (state.page === 'placeholder') return '';
      if (state.page === 'teacherForm') return 'form';
      if (state.page === 'teacherDetail') return 'detail';
      if (state.page === 'monitors') return 'monitors';
      if (state.page === 'teachers') return 'teachers';
      return '';
    }

    function syncConsole() {
      const view = currentViewKey();
      document.querySelectorAll('.ctl').forEach((b) => {
        const group = b.dataset.group;
        const value = b.dataset.value;
        let active = false;
        let disabled = false;
        if (group === 'role') active = state.role === value;
        if (group === 'view') { active = view === value; disabled = !viewAllowed(value); }
        if (group === 'device') active = state.device === value;
        if (group === 'online') active = state.online === value;
        b.disabled = disabled;
        b.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900' : 'text-slate-500 hover:text-slate-800'}${disabled ? ' cursor-not-allowed opacity-40' : ''}`;
      });
    }

    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'view') setView(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.overlay = null;
          renderAll();
          if (value === 'off') showToast('离线模式：仅可浏览，录入与人事操作不可用');
        }
      });
    });

    function setRole(role) {
      state.role = role; if (role === 'admin') state.device = 'mobile';
      state.page = role === 'admin' ? 'monitors' : 'teachers';
      state.navTab = role === 'admin' ? 'settings' : 'ops';
      state.overlay = null;
      state.picker = null;
      state.playingVideo = false;
      state.teacherQuery = '';
      state.teacherFilter = 'all';
      state.adminTeacherFilter = 'all';
      state.adminTeacherMonitor = 'all';
      state.monitorTeacherSlice = 'mine';
      state.monitorFilter = 'all';
      state.monitorQuery = '';
      state.teacherLogCollapsed = false;
      state.teacherLogShowAll = false;
      state.monitorLogCollapsed = false;
      if (role !== 'admin') ensureActiveTeacher();
      renderAll();
    }

    function setView(view) {
      if (view === 'teachers') {
        state.page = 'teachers';
        state.navTab = 'ops';
      }
      if (view === 'detail') {
        if (state.role === 'monitor' && !allTeachers().length) {
          showToast('暂无可查看的老师档案');
          state.page = 'teachers';
        } else {
          ensureActiveTeacher();
          state.teacherLogCollapsed = false;
          state.teacherLogShowAll = false;
          state.page = 'teacherDetail';
          state.navTab = 'ops';
        }
      }
      if (view === 'form' && state.role === 'monitor') startTeacherForm('create');
      if (view === 'monitors' && state.role === 'admin') {
        state.page = 'monitors';
        state.navTab = 'settings';
      }
      state.overlay = null;
      state.picker = null;
      state.playingVideo = false;
      renderAll();
    }

    function ensureActiveTeacher() {
      const list = allTeachers();
      if (!list.some((t) => t.id === state.activeTeacherId)) {
        state.activeTeacherId = list[0] ? list[0].id : '';
      }
    }

    function resetDemo() {
      state.role = 'monitor';
      state.page = 'teachers';
      state.navTab = 'ops';
      state.device = 'mobile';
      state.online = 'on';
      state.teachers = clone(INITIAL_TEACHERS);
      state.monitors = clone(INITIAL_MONITORS);
      state.classes = clone(INITIAL_CLASSES);
      state.teacherLogs = clone(INITIAL_TEACHER_LOGS);
      state.monitorLogs = clone(INITIAL_MONITOR_LOGS);
      state.dictAudit = clone(INITIAL_DICT_AUDIT);
      state.teacherLogCollapsed = false;
      state.teacherLogShowAll = false;
      state.monitorLogCollapsed = false;
      state.activeTeacherId = 'tc_david0001';
      state.teacherFilter = 'all';
      state.teacherQuery = '';
      state.adminTeacherFilter = 'all';
      state.adminTeacherMonitor = 'all';
      state.monitorTeacherSlice = 'mine';
      state.introLang = 'zh';
      state.monitorFilter = 'all';
      state.monitorQuery = '';
      state.form = emptyTeacherForm();
      state.formReturnPage = 'teachers';
      state.overlay = null;
      state.picker = null;
      state.pickerQuery = '';
      state.playingVideo = false;
      state.resignTeacher = { cleared: false };
      state.appoint = { email: '', name: '', phone: '', error: '' };
      state.rebind = { monitorId: null, targetId: '', teacherIds: [], classIds: [], error: '' };
      state.dismiss = { monitorId: null, fundsCleared: false, eduCleared: false, confirmName: '', error: '' };
      state.singleRebind = { teacherId: null, targetId: '', error: '' };
      renderAll();
      showToast('数据已重置');

    $('btnResetDemo').addEventListener('click', resetDemo);

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

        ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线模式：仅可浏览，录入与人事操作不可用`
        : '';

              ${icon('chevron-left', 'h-4 w-4 shrink-0')}<span>返回</span>
            </button>`}
            <span class="truncate text-[18px] font-bold tracking-tight">${esc(bannerTitle())}</span>

            ${icon('bell', 'h-4 w-4')}
            <span class="absolute -right-1 -top-1 grid h-[18px] min-w-[18px] place-items-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white/30">${UNREAD_COUNT}</span>
          </button>
        </header>`;

    function renderNav() {
      return `
        <div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
          <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
            ${currentNav().map((item) => {

                ${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}
                <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
              </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function renderContent() {
      if (state.page === 'placeholder') return renderPlaceholder();
      if (state.page === 'teacherForm') return renderTeacherForm();
      if (state.page === 'monitors' && state.role === 'admin') return renderMonitors();
      if (state.page === 'teacherDetail') return renderTeacherDetail();
      return renderTeacherList();
    }

    function renderPlaceholder() {
      const item = currentNav().find((n) => n.id === state.navTab);
      if (!item) return renderContentFallback();
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">${esc(item.cta || '进入')}</a>` : ''}
        <button data-action="back-main" class="mt-3 text-[14px] font-semibold text-indigo-600">返回${state.role === 'admin' ? '班长管理' : '老师团队'}</button>
      </div>`;
    }

    function renderContentFallback() {
      return `<div class="p-8 text-center text-[14px] font-medium text-slate-500">页面不存在</div>`;
    }

    /* ------------------------------------------------------------------
     * 通用组件
     * ------------------------------------------------------------------ */
    function pageHeader(title, subtitle = '', right = '') {
      return `<div class="flex items-end justify-between gap-3 px-1">
        <div class="min-w-0">
          <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(title)}</h1>
          ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium text-slate-500">${esc(subtitle)}</p>` : ''}
        </div>
        ${right}
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 老师团队 · 班长 / 管理员
     * ------------------------------------------------------------------ */
    function renderTeacherList() {
      return state.role === 'admin' ? renderAdminTeacherList() : renderMonitorTeacherList();
    }

    function teacherSearchBox(placeholder) {
      return `<div class="relative">
        <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
        <input id="teacherSearch" value="${esc(state.teacherQuery)}" placeholder="${esc(placeholder)}" class="h-11 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500" aria-label="搜索老师">
      </div>`;
    }

    function statusSegment(base, action = 'teacher-filter', selected = state.teacherFilter, showAllCount = true) {
      const c = statusCounts(base);
      const pillCls = (key) => selected === key
        ? 'bg-slate-900 text-white font-semibold'
        : 'bg-slate-100 text-slate-600 font-medium hover:bg-slate-200/80';
      return `<div class="flex flex-wrap items-center gap-1.5 py-0.5">
        ${[['all', '全部', c.all], ['normal', '正常可约', c.normal], ['leave', '请假/代课', c.leave], ['pending', '待完善', c.pending]].map(([key, label, count]) => `<button data-action="${action}" data-filter="${key}" class="h-8 shrink-0 whitespace-nowrap rounded-full border-0 px-3 text-[12px] transition ${pillCls(key)}">${label}${countLabel(key === 'all' && !showAllCount ? 0 : count)}</button>`).join('')}
      </div>`;
    }

    function renderMonitorTeacherList() {
      const base = listTeachers().filter(teacherMatchesQuery);
      const attrBase = base.filter((t) => monitorSliceMatch(t, state.monitorTeacherSlice));
      const filtered = sortTeacherList(attrBase.filter((t) => teacherStatusFilterMatch(t, state.teacherFilter)));
      const counts = monitorSliceCounts(base);
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';
      const offline = state.online === 'off';
      const pillCls = (key) => state.monitorTeacherSlice === key
        ? 'bg-slate-900 text-white font-semibold'
        : 'bg-slate-100 text-slate-600 font-medium hover:bg-slate-200/80';
      const pills = [
        { key: 'mine', label: '我的团队', count: counts.mine },
        { key: 'all', label: '全部老师', count: counts.all },
        ...counts.others.map((m) => ({ key: m.id, label: `${m.name} 班`, count: m.count })),
        { key: 'platform', label: '平台未划拨', count: counts.platform }
      ];

      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('负责老师', '', `<button data-action="create-teacher" ${offline ? 'disabled' : ''} class="inline-flex h-9 shrink-0 items-center gap-1 rounded-lg bg-indigo-600 px-3 text-[12px] font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">${icon('plus', 'h-3.5 w-3.5 shrink-0')}录入新老师</button>`)}
        ${teacherSearchBox('搜索姓名或负责班长')}
        <div class="flex flex-wrap gap-1.5">
          ${pills.map((p) => `<button data-action="monitor-teacher-slice" data-slice="${p.key}" class="h-8 shrink-0 whitespace-nowrap rounded-full border-0 px-3 text-[12px] transition ${pillCls(p.key)}">${esc(p.label)}${countLabel(p.count)}</button>`).join('')}
        </div>
        ${statusSegment(attrBase, 'teacher-filter', state.teacherFilter, false)}
        <div class="${grid}">
          ${filtered.length ? filtered.map((t) => teacherCard(t, 'monitor')).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-500">${attrBase.length ? '没有符合条件的老师' : '当前筛选下暂无老师'}</div>`}
        </div>
        <button data-action="create-teacher" ${offline ? 'disabled' : ''} class="flex w-full items-center justify-center gap-1.5 rounded-2xl border border-dashed border-slate-300 bg-white py-4 text-[14px] font-semibold ${offline ? 'cursor-not-allowed text-slate-500' : 'text-indigo-700 hover:bg-indigo-50/40'}">
          ${icon('plus', 'h-4 w-4')}录入新老师
        </button>
      </div>`;
    }

    function renderAdminTeacherList() {
      const base = listTeachers().filter(teacherMatchesQuery);
      const attrBase = base.filter((t) => adminAttributionMatch(t, state.adminTeacherMonitor));
      const filtered = filteredAdminTeachers();
      const counts = attributionCounts(base);
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';
      const offline = state.online === 'off';
      const pillCls = (key) => state.adminTeacherMonitor === key
        ? 'bg-slate-900 text-white font-semibold'
        : 'bg-slate-100 text-slate-600 font-medium hover:bg-slate-200/80';
      const pills = [
        { key: 'direct', label: '⭐ 我亲自管的', count: counts.direct },
        { key: 'all', label: '全部老师', count: counts.all },
        { key: 'platform', label: '平台未划拨', count: counts.platform },
        ...counts.monitors.map((m) => ({ key: m.id, label: `${m.name} 班`, count: m.count }))
      ];
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        <div class="flex items-center justify-between gap-2 px-1">
          <div class="min-w-0">
            <h1 class="text-[18px] font-bold tracking-tight text-slate-900">全校老师</h1>
            <p class="mt-0.5 text-[12px] font-medium text-slate-500">跨班长归属筛选与档案治理</p>
          </div>
          <div class="flex shrink-0 items-center gap-1.5">
            <button data-action="open-dict-audit" class="inline-flex h-9 shrink-0 items-center gap-1 rounded-lg border border-slate-300 bg-white px-2 text-[12px] font-bold text-slate-700 hover:bg-slate-50">${icon('scroll-text', 'h-3.5 w-3.5 shrink-0')}配置审计</button>
            <button data-action="create-teacher" ${offline ? 'disabled' : ''} class="inline-flex h-9 shrink-0 items-center gap-1 rounded-lg bg-indigo-600 px-2.5 text-[12px] font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">${icon('plus', 'h-3.5 w-3.5 shrink-0')}录入新老师</button>
          </div>
        </div>
        ${teacherSearchBox('搜索姓名或负责班长')}
        <div class="flex flex-wrap gap-1.5">
          ${pills.map((p) => `<button data-action="admin-teacher-monitor" data-monitor="${p.key}" class="h-8 shrink-0 whitespace-nowrap rounded-full border-0 px-3 text-[12px] transition ${pillCls(p.key)}">${esc(p.label)}${countLabel(p.count)}</button>`).join('')}
        </div>
        ${statusSegment(attrBase, 'admin-teacher-filter', state.adminTeacherFilter, false)}
        <div class="${grid}">
          ${filtered.length ? filtered.map((t) => teacherCard(t, 'admin')).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-500">没有匹配的老师</div>`}
        </div>
      </div>`;
    }

    function teacherCard(t, mode) {
      const complete = missingMedia(t).length === 0;
      const resigned = t.status === 'resigned';
      const canEdit = !resigned && (mode === 'admin' || t.monitorId === CURRENT_MONITOR_ID);
      const pendingTeacher = canEdit && !complete;
      const qrReady = !!(t.media && t.media.qr);
      const qrControl = qrReady
        ? `<button data-action="open-card-qr" data-id="${t.id}" class="inline-flex shrink-0 items-center gap-0.5 text-[12px] font-semibold text-indigo-600 transition hover:text-indigo-700 hover:underline">${icon('qr-code', 'h-3 w-3 shrink-0')}ClassIn 二维码</button>`
        : `<span class="inline-flex shrink-0 items-center gap-0.5 text-[12px] font-medium text-slate-500" aria-disabled="true">${icon('qr-code', 'h-3 w-3 shrink-0')}ClassIn 二维码待补</span>`;
      const pendingPrice = t.pendingPrice && !resigned
        ? `<span class="shrink-0 whitespace-nowrap text-[12px] font-semibold text-indigo-700">${esc(pendingPriceText(t.pendingPrice))}</span>`
        : '';
      const weekScheduleAction = `<button data-action="week-schedule" data-id="${t.id}" class="inline-flex h-7 shrink-0 items-center gap-0.5 whitespace-nowrap rounded-lg px-1 text-[12px] font-semibold text-indigo-600 transition hover:bg-indigo-50 hover:text-indigo-700">${icon('calendar-days', 'h-3 w-3 shrink-0')}周排期</button>`;
      const editAction = canEdit
        ? `<button data-action="edit-teacher" data-id="${t.id}" ${state.online === 'off' ? 'disabled' : ''} class="inline-flex h-7 shrink-0 items-center rounded-lg border border-indigo-200 bg-indigo-50/80 px-2 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-100 disabled:text-slate-500">${pendingTeacher ? '去完善' : '编辑'}</button>`
        : '';
      const viewAction = `<button data-action="open-teacher" data-id="${t.id}" class="inline-flex h-7 shrink-0 items-center gap-0.5 whitespace-nowrap rounded-lg px-1 text-[12px] font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-slate-900">查看档案${icon('chevron-right', 'h-3.5 w-3.5 shrink-0')}</button>`;
      return `<article data-action="open-teacher" data-id="${t.id}" role="button" tabindex="0" class="flex h-full cursor-pointer flex-col rounded-2xl p-3 transition active:scale-[0.995] ${resigned ? 'border border-dashed border-slate-400 bg-slate-50/60 opacity-60' : 'border border-slate-300 bg-slate-50/70'}">
        <div class="flex items-center gap-2.5">
          ${avatar(t, 'h-10 w-10', 'text-[14px]')}
          <div class="flex min-w-0 flex-1 items-center gap-1.5">
            <span class="min-w-0 flex-1 truncate text-[14px] font-bold text-slate-900">${esc(t.name)}</span>
            ${priceBadge(t.level)}
            ${pendingPrice}
          </div>
          <div class="shrink-0">${statusChip(t)}</div>
        </div>
        <div class="mt-2 flex min-w-0 items-center gap-1.5 text-[12px] font-medium text-slate-500">
          <span class="shrink-0">归属班长</span>
          <span class="min-w-0 truncate font-semibold text-slate-700">${esc(attributionText(t, mode))}</span>
          <span class="shrink-0" aria-hidden="true">·</span>
          ${qrControl}
        </div>
        <div class="mt-auto pt-2">
          <div class="flex items-center justify-between gap-1.5 border-t border-slate-200 pt-2">
            <span class="inline-flex shrink-0 items-center gap-1 text-[12px] font-medium ${complete ? 'text-emerald-700' : 'text-amber-800'}">
              <span class="h-1.5 w-1.5 rounded-full ${complete ? 'bg-emerald-500' : 'bg-amber-500'}"></span>${complete ? '档案齐全' : '待补档案'}
            </span>
            <div class="flex min-w-0 shrink-0 items-center gap-0.5">
              ${weekScheduleAction}
              ${editAction}
              ${viewAction}
            </div>
          </div>
        </div>
      </article>`;
    }

    /* ------------------------------------------------------------------
     * 档案变动日志 · 管理员只读审计
     * ------------------------------------------------------------------ */
    function renderLogEntry(entry, kind = 'teacher') {
      const badge = entry.kind === 'status'
        ? 'border-indigo-200 bg-indigo-50 text-indigo-700'
        : 'border-slate-200 bg-slate-100 text-slate-700';
      const body = entry.kind === 'status'
        ? `<div class="mt-1.5 flex flex-wrap items-center gap-1.5">
            <span class="rounded-lg border border-slate-200 bg-slate-50 px-2 py-1 text-[12px] font-semibold text-slate-600">${esc(statusText(entry.from, kind))}</span>
            <span class="text-[12px] font-bold text-slate-500">→</span>
            <span class="rounded-lg border border-indigo-200 bg-indigo-50 px-2 py-1 text-[12px] font-bold text-indigo-700">${esc(statusText(entry.to, kind))}</span>
          </div>
          ${entry.reason ? `<p class="mt-1 break-words text-[12px] font-medium leading-relaxed text-slate-600">原因：${esc(entry.reason)}</p>` : ''}`
        : `<div class="mt-1.5 space-y-1">${(entry.changes || []).map((c) => `
            <div class="rounded-lg border border-slate-200 bg-slate-50/70 px-2 py-1.5">
              <div class="text-[12px] font-bold text-slate-700">${esc(c.field)}</div>
              <div class="mt-0.5 flex flex-wrap items-center gap-1 text-[12px] font-medium leading-relaxed">
                <span class="min-w-0 break-words rounded bg-white px-1.5 py-0.5 text-slate-600">变更前 · ${esc(c.before)}</span>
                <span class="shrink-0 font-bold text-slate-500">→</span>
                <span class="min-w-0 break-words rounded bg-indigo-50 px-1.5 py-0.5 text-indigo-800">变更后 · ${esc(c.after)}</span>
              </div>
            </div>`).join('')}</div>`;
      return `<article class="rounded-xl border border-slate-200 bg-white p-2.5">
        <div class="flex items-start justify-between gap-2">
          <span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${badge}">${entry.kind === 'status' ? '状态流转' : '字段变更'}</span>
          <span class="shrink-0 font-mono text-[12px] font-medium text-slate-500">${esc(entry.at)}</span>
        </div>
        ${body}
        <div class="mt-1.5 flex items-center gap-1 text-[12px] font-medium text-slate-500">${icon('user-round', 'h-3 w-3 shrink-0')}${esc(entry.operator)}</div>
      </article>`;
    }

    function renderTeacherChangeLog(t) {
      if (state.role !== 'admin') return '';
      const entries = state.teacherLogs[t.id] || [];
      const open = !state.teacherLogCollapsed;
      const visible = state.teacherLogShowAll ? entries : entries.slice(0, 5);
      const hidden = Math.max(0, entries.length - 5);
      return `<section id="teacherLog" class="overflow-hidden rounded-2xl border border-slate-300 bg-slate-50/70">
        <button data-action="toggle-teacher-log" class="flex w-full items-center justify-between gap-3 px-4 py-3 text-left">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-xl border border-slate-200 bg-white text-indigo-600">${icon('history', 'h-4 w-4')}</span>
            <div class="min-w-0">
              <h2 class="truncate text-[16px] font-bold text-slate-900">档案变动日志</h2>
              <p class="mt-0.5 truncate text-[12px] font-medium text-slate-500">状态流转与字段变更 · 只读审计</p>
            </div>
          </div>
          <div class="flex shrink-0 items-center gap-1.5">
            <span class="rounded-full border border-slate-200 bg-white px-1.5 py-0.5 text-[12px] font-bold text-slate-600">仅管理员</span>
            ${icon(open ? 'chevron-up' : 'chevron-down', 'h-4 w-4 text-slate-500')}
          </div>
        </button>
        ${open ? `<div class="border-t border-slate-200 px-3 py-3">
          <div class="flex items-center justify-between gap-2 pb-2">
            <span class="text-[12px] font-medium text-slate-500">共 ${entries.length} 条留痕 · 最近 5 条优先</span>
            <span class="shrink-0 rounded-full border border-slate-200 bg-white px-1.5 py-0.5 text-[12px] font-bold text-slate-500">不可编辑</span>
          </div>
          ${entries.length
            ? `<div class="space-y-2">${visible.map((e) => renderLogEntry(e, 'teacher')).join('')}</div>
              ${hidden > 0 ? `<button data-action="teacher-log-more" class="mt-2 flex h-9 w-full items-center justify-center gap-1 rounded-lg border border-slate-300 bg-white text-[12px] font-bold text-slate-700 hover:bg-slate-50">${state.teacherLogShowAll ? '收起历史记录' : `展开更多（${hidden} 条）`}${icon(state.teacherLogShowAll ? 'chevron-up' : 'chevron-down', 'h-3.5 w-3.5')}</button>` : ''}`
            : `<div class="rounded-xl border border-dashed border-slate-300 bg-white px-4 py-6 text-center">
                <div class="text-[14px] font-semibold text-slate-600">暂无档案变动记录</div>
                <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">后续状态流转与字段变更将在此留痕，仅管理员可查看。</p>
              </div>`}
        </div>` : ''}
      </section>`;
    }

    function renderMonitorChangeLog(m) {
      if (state.role !== 'admin') return '';
      const entries = state.monitorLogs[m.id] || [];
      const open = !state.monitorLogCollapsed;
      return `<section id="monitorLog" class="mt-3 overflow-hidden rounded-xl border border-slate-300 bg-slate-50/70">
        <button data-action="toggle-monitor-log" class="flex w-full items-center justify-between gap-2 px-3 py-2.5 text-left">
          <div class="flex min-w-0 items-center gap-2">
            <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg border border-slate-200 bg-white text-indigo-600">${icon('history', 'h-3.5 w-3.5')}</span>
            <div class="min-w-0">
              <h3 class="truncate text-[14px] font-bold text-slate-900">职务档案变动日志</h3>
              <p class="mt-0.5 truncate text-[12px] font-medium text-slate-500">状态流转 / 显示名称 / 联系电话 / 微信二维码 · 只读</p>
            </div>
          </div>
          <div class="flex shrink-0 items-center gap-1.5">
            <span class="rounded-full border border-slate-200 bg-white px-1.5 py-0.5 text-[12px] font-bold text-slate-600">仅管理员</span>
            ${icon(open ? 'chevron-up' : 'chevron-down', 'h-4 w-4 text-slate-500')}
          </div>
        </button>
        ${open ? `<div class="border-t border-slate-200 px-2.5 py-2.5">
          ${entries.length
            ? `<div class="space-y-2">${entries.map((e) => renderLogEntry(e, 'monitor')).join('')}</div>`
            : `<div class="rounded-lg border border-dashed border-slate-300 bg-white px-3 py-4 text-center">
                <div class="text-[14px] font-semibold text-slate-600">暂无职务档案变动记录</div>
                <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">委任、信息调整与解除职务将在此留痕。</p>
              </div>`}
        </div>` : ''}
      </section>`;
    }

    function renderDictAuditModal() {
      const actionMeta = {
        created: { label: '新增', cls: 'border-emerald-200 bg-emerald-50 text-emerald-700' },
        updated: { label: '编辑', cls: 'border-indigo-200 bg-indigo-50 text-indigo-700' },
        disabled: { label: '停用', cls: 'border-rose-200 bg-rose-50 text-rose-700' }
      };
      return modalShell(`
        ${modalHeader('配置审计', '老师价位字典 · 只读变更日志')}
        <div class="mt-2 flex flex-wrap gap-1.5">
          <span class="rounded-full border border-indigo-100 bg-indigo-50 px-2 py-0.5 text-[12px] font-bold text-indigo-700">老师价位字典</span>
          <span class="rounded-full border border-slate-200 bg-white px-2 py-0.5 text-[12px] font-bold text-slate-500">只读</span>
        </div>
        <div class="mt-2 rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
          <div class="text-[12px] font-semibold text-slate-700">启用中价位</div>
          <div class="mt-1.5 flex flex-wrap gap-1.5">
            ${PRICE_TIERS.map((p) => `<span class="inline-flex items-center gap-1 rounded-lg border border-slate-300 bg-white px-2 py-1 text-[12px] font-bold text-slate-700">
              ${p.label}
              <button data-action="attempt-disable-price" data-level="${p.id}" class="rounded border border-rose-200 bg-rose-50 px-1.5 py-0.5 text-[12px] font-bold text-rose-700">停用</button>
            </span>`).join('')}
          </div>
          <p class="mt-1.5 text-[12px] font-medium leading-relaxed text-slate-500">若价位仍被老师待生效调价引用，停用将被阻断。</p>
        </div>
        <div class="mt-3 space-y-2">
          ${state.dictAudit.map((e) => {
            const meta = actionMeta[e.action] || actionMeta.updated;
            const categoryCls = 'border-indigo-100 bg-indigo-50 text-indigo-700';
            return `<article class="rounded-xl border border-slate-300 bg-slate-50/70 p-2.5">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <div class="flex flex-wrap items-center gap-1.5">
                    <span class="rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${categoryCls}">${esc(e.category)}</span>
                    <span class="text-[14px] font-bold text-slate-900">${esc(e.entity)}</span>
                  </div>
                </div>
                <span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${meta.cls}">${meta.label}</span>
              </div>
              <div class="mt-1.5 space-y-1">
                <div class="break-words rounded-lg border border-slate-200 bg-white px-2 py-1.5 text-[12px] font-medium leading-relaxed text-slate-600"><span class="font-bold text-slate-700">变更前</span> · ${esc(e.before)}</div>

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4">

                <div>
                  <div class="mb-1 flex items-center justify-between">

              </div>

            <section id="formMedia" class="rounded-2xl border border-slate-200/80 bg-white p-4">
              <h2 class="flex items-center gap-2 text-[14px] font-bold text-slate-900"><span class="grid h-5 w-5 shrink-0 place-items-center rounded-full bg-indigo-50 text-[11px] font-bold text-indigo-600">3</span>多媒体档案</h2>

              <div class="mt-2.5 rounded-xl border border-slate-300 bg-white p-2.5">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-[14px] font-semibold text-slate-800">风采相册 <span class="text-rose-500">*</span></span>

                <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">拖拽卡片调整顺序；点选任意照片设为主头像并执行 1:1 独立裁切。</p>
                <div class="mt-2 ${albumGrid}">
                  ${f.photos.map((p, i) => renderFormPhotoCard(p, i)).join('')}
                  ${f.photos.length < 6 ? `<label class="flex min-h-[140px] cursor-pointer flex-col items-center justify-center gap-1 rounded-xl border border-dashed border-slate-300 bg-white/70 text-slate-500 transition hover:border-indigo-300 hover:bg-indigo-50/40">

                    <span class="text-[12px] font-medium text-slate-500">支持常见图片格式</span>
                  </label>` : ''}
                </div>
                ${f.photos.length <= 1 ? `<p class="mt-1.5 text-[12px] font-medium leading-relaxed text-amber-700">仅剩最后 1 张照片，删除按钮已禁用：老师档案必须保留至少 1 张照片作为主头像。</p>` : ''}
              </div>

              <div class="mt-2 grid grid-cols-2 gap-2">
                <label class="block cursor-pointer rounded-xl border border-slate-300 bg-white p-2.5">
                  <input id="fQrInput" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
                  <div class="flex items-center justify-between">
                    <span class="whitespace-nowrap text-[14px] font-semibold text-slate-800">ClassIn 二维码 <span class="text-rose-500">*</span></span>
                    <span class="shrink-0 whitespace-nowrap text-[12px] font-medium ${media.qr ? 'text-emerald-600' : 'text-amber-700'}">${media.qr ? '已就绪' : '待上传'}</span>
                  </div>
                  <div class="mt-2 flex items-center justify-center">
                    ${f.qrDataUrl
                      ? `<img src="${esc(f.qrDataUrl)}" class="h-16 w-16 rounded-lg bg-white object-contain p-1 ring-1 ring-slate-200" alt="">`
                      : media.qr
                        ? `<div class="grid h-16 w-16 place-items-center rounded-lg bg-white p-1 ring-1 ring-slate-200">${qrSvg(f.name || 'ClassIn')}</div>`
                        : `<div class="grid h-16 w-16 place-items-center rounded-lg bg-white text-slate-300 ring-1 ring-slate-200">${icon('qr-code', 'h-6 w-6')}</div>`}
                  </div>
                  <p class="mt-1 text-center text-[12px] font-medium text-slate-500">点击选择二维码图片</p>
                </label>

                <div class="rounded-xl border border-slate-300 bg-white p-2.5">
                  <div class="text-[14px] font-semibold text-slate-800">相册规格</div>
                  <ul class="mt-1.5 space-y-1 text-[12px] font-medium text-slate-500">
                    <li class="flex items-center gap-1.5">${icon('images', 'h-3.5 w-3.5 text-indigo-500')}1 ~ 6 张生活 / 教学照片</li>
                    <li class="flex items-center gap-1.5">${icon('crop', 'h-3.5 w-3.5 text-indigo-500')}主头像独立 1:1 裁切</li>
                    <li class="flex items-center gap-1.5">${icon('move', 'h-3.5 w-3.5 text-indigo-500')}拖拽调整展示顺序</li>
                    <li class="flex items-center gap-1.5">${icon('shield-check', 'h-3.5 w-3.5 text-indigo-500')}至少保留最后 1 张</li>
                  </ul>
                </div>
              </div>

              <div class="mt-2 rounded-xl border border-slate-300 bg-white p-2.5">
                <div class="flex items-center justify-between">
                  <span class="text-[14px] font-semibold text-slate-800">试讲视频 <span class="text-rose-500">*</span></span>
                  <span class="text-[12px] font-medium ${video ? 'text-emerald-600' : 'text-amber-700'}">${video ? '视频已就绪' : '待上传'}</span>
                </div>
                <label class="mt-1.5 flex h-10 cursor-pointer items-center justify-center gap-1.5 rounded-lg border border-dashed border-slate-300 bg-white text-[12px] font-semibold text-slate-600">
                  <input id="fVideoInput" type="file" accept="video/mp4" class="hidden">
                  ${icon('upload', 'h-4 w-4 text-slate-500')}选择试讲视频（≤50MB）
                </label>
                ${video ? `<div class="mt-1.5 flex items-center justify-between rounded-lg border border-slate-200 bg-white px-2 py-1.5">
                  <span class="truncate text-[12px] font-medium text-slate-700">${esc(video.name)}</span>
                  <span class="shrink-0 font-mono text-[12px] text-slate-500">${esc(video.size)} · ${esc(video.duration)}</span>
                </div>` : ''}
                ${f.videoError ? `<div class="mt-1.5 rounded-lg border border-rose-200 bg-rose-50 px-2 py-1.5 text-[12px] font-medium text-rose-700">${esc(f.videoError)}</div>` : ''}
                <div class="mt-1.5 text-[12px] font-medium text-slate-500">家长端卡片内就地播放</div>
              </div>
            </section>

            <section class="rounded-2xl border border-slate-200/80 bg-white p-4">
              <button data-action="toggle-publish" class="flex w-full items-center justify-between gap-3">
                <div class="text-left">
                  <div class="text-[16px] font-semibold text-slate-900">保存后同步至家长端选课大厅</div>
                  <div class="mt-0.5 text-[12px] font-medium text-slate-500">关闭后保存为待完善草稿，不会上架</div>
                </div>
                <div class="flex shrink-0 items-center gap-2">
                  <span id="publishLabel" class="text-[12px] font-semibold ${f.publish ? 'text-indigo-700' : 'text-slate-500'}">${f.publish ? '已开启' : '已关闭'}</span>
                  <span id="publishTrack" class="relative h-6 w-11 rounded-full transition ${f.publish ? 'bg-indigo-600' : 'bg-slate-300'}">
                    <span id="publishKnob" class="absolute top-0.5 h-5 w-5 rounded-full bg-white transition-transform ${f.publish ? 'translate-x-5' : 'translate-x-0'}"></span>
                  </span>
                </div>
              </button>
            </section>

            ${f.error ? `<div id="formError" class="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-[14px] font-medium leading-relaxed text-rose-700">${esc(f.error)}</div>` : ''}
          </div>
        </div>

        <div class="flex shrink-0 gap-2 border-t border-slate-200/80 bg-white/95 px-4 py-3">
          <button data-action="cancel-teacher-form" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 transition-colors hover:bg-slate-50 active:bg-slate-100">取消</button>
          <button id="btnSaveTeacher" data-action="save-teacher" ${state.online === 'off' ? 'disabled' : ''} class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">${f.publish ? '保存并发布' : '保存草稿'}</button>
        </div>
      </div>`;
    }

    function renderFormPhotoCard(p, i) {
      const photos = state.form.photos;
      const main = state.form.avatarPhotoId === p.id;
      const isFirst = i === 0;
      const isLast = i === photos.length - 1;
      const onlyOne = photos.length <= 1;
      return `<div data-photo-id="${p.id}" draggable="true" class="overflow-hidden rounded-xl border bg-white transition ${main ? 'border-indigo-400 ring-2 ring-indigo-500/20' : 'border-slate-200'}">
        <div class="relative aspect-square bg-slate-100">
          <img src="${p.dataUrl}" class="h-full w-full object-cover" alt="" draggable="false">
          <span class="absolute left-1.5 top-1.5 grid h-5 min-w-5 place-items-center rounded bg-slate-900/65 px-1 text-[12px] font-bold text-white">${i + 1}</span>
          ${main ? '<span class="absolute right-1.5 top-1.5 rounded bg-indigo-600 px-1 py-0.5 text-[12px] font-bold text-white">主头像</span>' : ''}
          <span class="absolute bottom-1.5 left-1.5 inline-flex items-center gap-0.5 rounded bg-white/85 px-1 py-0.5 text-[12px] font-semibold text-slate-600">${icon('grip-vertical', 'h-3 w-3')}拖拽</span>
        </div>
        <div class="space-y-1 p-1.5">
          <div class="flex gap-1">
            <button data-action="move-photo" data-id="${p.id}" data-delta="-1" ${isFirst ? 'disabled' : ''} class="grid h-7 flex-1 place-items-center rounded-md border border-slate-200 text-slate-500 hover:bg-slate-50 disabled:cursor-not-allowed disabled:text-slate-300" aria-label="前移">${icon('chevron-left', 'h-3.5 w-3.5')}</button>
            <button data-action="move-photo" data-id="${p.id}" data-delta="1" ${isLast ? 'disabled' : ''} class="grid h-7 flex-1 place-items-center rounded-md border border-slate-200 text-slate-500 hover:bg-slate-50 disabled:cursor-not-allowed disabled:text-slate-300" aria-label="后移">${icon('chevron-right', 'h-3.5 w-3.5')}</button>
          </div>
          <button data-action="set-main-avatar" data-id="${p.id}" class="h-7 w-full rounded-md text-[12px] font-semibold ${main ? 'border border-indigo-200 bg-indigo-50 text-indigo-700' : 'border border-slate-300 bg-white text-slate-700 hover:bg-slate-50'}">${main ? '重新裁切 1:1' : '设为主头像'}</button>
          <button data-action="delete-photo" data-id="${p.id}" ${onlyOne ? 'disabled' : ''} class="h-7 w-full rounded-md text-[12px] font-semibold ${onlyOne ? 'cursor-not-allowed bg-slate-100 text-slate-300' : 'border border-rose-200 bg-rose-50 text-rose-700'}">${onlyOne ? '仅剩 1 张' : '删除'}</button>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 管理员 · 班长管理
     * ------------------------------------------------------------------ */
    function renderMonitors() {
      const all = state.monitors;
      const active = all.filter((m) => m.status === 'active');
      const resigned = all.filter((m) => m.status === 'resigned');
      const list = filteredMonitors();
      const grid = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';
      const offline = state.online === 'off';
      return `<div class="mx-auto w-full max-w-[640px] space-y-3 px-4 py-4 pb-10">
        ${pageHeader('班长名册', '', `<div class="flex shrink-0 gap-1.5">
          <button data-action="open-dict-audit" class="inline-flex h-9 items-center gap-1 rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-50">${icon('scroll-text', 'h-3.5 w-3.5 shrink-0')}配置审计</button>
          <button data-action="open-appoint" ${offline ? 'disabled' : ''} class="h-9 shrink-0 rounded-lg bg-indigo-600 px-3 text-[12px] font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">+ 委任班长</button>
        </div>`)}
        <div class="relative">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
          <input id="monitorSearch" value="${esc(state.monitorQuery)}" placeholder="搜索姓名 / 邮箱 / 电话" class="h-11 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500">
        </div>
        <div class="flex flex-wrap items-center gap-1.5 py-0.5">
          ${[['all', '全部', all.length], ['active', '在职', active.length], ['resigned', '已离职', resigned.length]].map(([key, label, count]) => `<button data-action="monitor-filter" data-filter="${key}" class="h-8 shrink-0 whitespace-nowrap rounded-full border-0 px-3 text-[12px] transition ${state.monitorFilter === key ? 'bg-slate-900 text-white font-semibold' : 'bg-slate-100 text-slate-600 font-medium hover:bg-slate-200/80'}">${label}${countLabel(count)}</button>`).join('')}
        </div>
        <div id="monitorList" class="${grid}">
          ${list.length ? list.map(monitorCard).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-500">暂无班长</div>`}
        </div>
        <div id="monitorCount" class="text-center text-[12px] font-medium text-slate-500">共 ${list.length} 条 · 第 1/1 页 · 每页 20 条</div>
      </div>`;
    }

    function monitorCard(m) {
      const metrics = monitorMetrics(m);
      const resigned = m.status === 'resigned';
      return `<article class="rounded-2xl border p-3.5 ${resigned ? 'border-dashed border-slate-400 bg-slate-50/60 opacity-60' : 'border-slate-300 bg-slate-50/70'}">
        <div class="flex items-start justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2.5">
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-full text-[16px] font-bold ${resigned ? 'bg-slate-200 text-slate-500' : 'bg-slate-900 text-amber-300'}">${esc((m.name || '?').charAt(0).toUpperCase())}</span>
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="truncate text-[16px] font-bold text-slate-900">${esc(m.name)}</span>
                ${monitorStatusChip(m.status)}
                ${m.isAdminSelf ? `<span class="shrink-0 rounded-full border border-indigo-200 bg-indigo-50 px-1.5 py-0.5 text-[12px] font-bold text-indigo-700">管理员兼班长</span>` : ''}
              </div>
              <div class="mt-0.5 truncate text-[12px] font-medium text-slate-500">${esc(m.email)}</div>
              <div class="truncate font-mono text-[12px] font-medium text-slate-500">${esc(m.phone)} · 委任 ${esc(m.appointedAt)}</div>
              ${!m.isPlatform ? `<div class="mt-1 flex items-center gap-1.5">
                ${m.wechatQr
                  ? `<button data-action="open-monitor-wechat-qr" data-id="${m.id}" class="inline-flex items-center gap-1 rounded-md border border-emerald-200 bg-emerald-50 px-1.5 py-0.5 text-[12px] font-semibold text-emerald-700 transition hover:bg-emerald-100/70">${icon('qr-code', 'h-3 w-3 shrink-0')}微信二维码 · 点击预览</button>`
                  : `<span class="inline-flex items-center gap-1 rounded-md border border-slate-200 bg-white px-1.5 py-0.5 text-[12px] font-medium text-slate-500">${icon('qr-code', 'h-3 w-3 shrink-0')}微信二维码未上传</span>`}
              </div>` : ''}
            </div>
          </div>
        </div>
        <div class="mt-2.5 grid grid-cols-[1.1fr_1.1fr_1.8fr] gap-1.5">
          <div class="rounded-xl border border-slate-300 bg-white px-2 py-2">
            <div class="text-[12px] font-medium text-slate-500">所辖老师数</div>
            <div class="mt-0.5 text-[18px] font-bold text-slate-900">${metrics.teachers}</div>
          </div>
          <div class="rounded-xl border border-slate-300 bg-white px-2 py-2">
            <div class="text-[12px] font-medium text-slate-500">负责小班数</div>
            <div class="mt-0.5 text-[18px] font-bold text-slate-900">${metrics.classes}</div>
          </div>
          <div class="rounded-xl border border-slate-300 bg-white px-2 py-2">
            <div class="text-[12px] font-medium leading-tight text-slate-500">托管未结课次资产</div>
            <div class="mt-0.5 text-[14px] font-bold leading-tight text-slate-900">${metrics.ts} 节 / ${Number(metrics.points).toLocaleString('en-US')} 积分</div>
          </div>
        </div>
        <div class="mt-2 flex items-center justify-between gap-2 border-t border-slate-100 pt-2">
          <button data-action="open-load" data-id="${m.id}" class="text-[12px] font-bold text-indigo-700">负荷明细</button>
          ${resigned
            ? `<button data-action="reappoint" data-id="${m.id}" ${state.online === 'off' ? 'disabled' : ''} class="inline-flex h-7 items-center rounded-lg border border-indigo-200 bg-indigo-50/80 px-2.5 text-[12px] font-bold text-indigo-700 transition hover:bg-indigo-100/70 disabled:opacity-40">复用委任</button>`
            : `<div class="flex shrink-0 gap-1.5">
              ${m.isPlatform ? '' : `<button data-action="open-edit-monitor" data-id="${m.id}" ${state.online === 'off' ? 'disabled' : ''} class="inline-flex h-7 items-center rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-700 transition hover:bg-slate-50 disabled:opacity-40">编辑</button>`}
              <button data-action="open-rebind" data-id="${m.id}" ${state.online === 'off' ? 'disabled' : ''} class="inline-flex h-7 items-center rounded-lg border border-slate-300 bg-white px-2.5 text-[12px] font-bold text-slate-700 transition hover:bg-slate-50 disabled:opacity-40">批量改绑</button>
              ${m.isAdminSelf || m.isPlatform ? '' : `<button data-action="open-dismiss" data-id="${m.id}" ${state.online === 'off' ? 'disabled' : ''} class="inline-flex h-7 items-center rounded-lg border border-rose-200 bg-rose-50 px-2.5 text-[12px] font-bold text-rose-700 transition disabled:opacity-40">解除职务</button>`}
            </div>`}
        </div>
        ${resigned ? `<div class="mt-1.5 text-[12px] font-medium text-slate-500">已离职 · 历史单据只读追溯 · 不可再新增老师 / 小班 / 收款</div>` : ''}
      </article>`;
    }

    function updateMonitorListOnly() {
      const el = $('monitorList');
      const count = $('monitorCount');
      const list = filteredMonitors();
      if (el) {
        el.className = state.device === 'tablet' ? 'grid grid-cols-2 gap-2' : 'space-y-2';
        el.innerHTML = list.length ? list.map(monitorCard).join('') : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-10 text-center text-[14px] font-medium text-slate-500">暂无班长</div>`;
      }
      if (count) count.textContent = `共 ${list.length} 条 · 第 1/1 页 · 每页 20 条`;
      if (window.lucide) lucide.createIcons();
    }

    /* ------------------------------------------------------------------
     * 弹层
     * ------------------------------------------------------------------ */
    function renderOverlay() {
      return renderBaseOverlay() + renderPickerSheet();
    }

    function renderBaseOverlay() {
      if (!state.overlay) return '';
      if (state.overlay.type === 'qr') return renderQrModal();
      if (state.overlay.type === 'monitorWechatQr') return renderMonitorWechatQrModal();
      if (state.overlay.type === 'photo') return renderPhotoLightbox();
      if (state.overlay.type === 'avatarCrop') return renderAvatarCropModal();
      if (state.overlay.type === 'resignTeacher') return renderResignTeacherModal();
      if (state.overlay.type === 'appoint') return renderAppointModal();
      if (state.overlay.type === 'rebind') return renderRebindModal();
      if (state.overlay.type === 'dismiss') return renderDismissModal();
      if (state.overlay.type === 'loadDetail') return renderLoadDetailModal();
      if (state.overlay.type === 'singleRebind') return renderSingleRebindModal();
      if (state.overlay.type === 'dictAudit') return renderDictAuditModal();
      return '';
    }

    /* ------------------------------------------------------------------
     * 底部抽屉选择器（替代原生 select · §8.1.2）
     * ------------------------------------------------------------------ */
    function pickerConfig() {
      if (!state.picker) return null;
      const kind = state.picker.kind;
      if (kind === 'formMonitor') {
        const options = [
          { id: ADMIN_MONITOR_ID, label: '⭐ 我直管', meta: '管理员自管' },
          ...state.monitors
            .filter((m) => m.status === 'active' && !m.isPlatform && !m.isAdminSelf)
            .map((m) => ({ id: m.id, label: `${m.name} 班`, meta: m.email || '' })),
          { id: PLATFORM_MONITOR_ID, label: '平台未划拨', meta: '暂不分配班长' }
        ];
        return { title: '选择负责班长', options, selected: state.form.monitorId, action: 'pick-form-monitor' };
      }
      if (kind === 'rebindTarget') {
        const m = monitorById(state.rebind.monitorId);
        const options = state.monitors
          .filter((x) => x.status === 'active' && !x.isPlatform && x.id !== (m && m.id))
          .map((x) => ({ id: x.id, label: x.name, meta: x.email || '' }));
        return { title: '选择接手班长', options, selected: state.rebind.targetId, action: 'pick-rebind-target' };
      }
      if (kind === 'singleRebindTarget') {
        const t = teacherById(state.singleRebind.teacherId);
        const options = state.monitors
          .filter((x) => x.status === 'active' && !x.isPlatform && x.id !== (t && t.monitorId))
          .map((x) => ({ id: x.id, label: x.name, meta: x.email || '' }));
        return { title: '选择接手班长', options, selected: state.singleRebind.targetId, action: 'pick-single-rebind-target' };
      }
      return null;
    }

    function renderPickerSheet() {
      const cfg = pickerConfig();
      if (!cfg) return '';
      const q = state.pickerQuery.trim().toLowerCase();
      const options = q
        ? cfg.options.filter((o) => `${o.label} ${o.meta}`.toLowerCase().includes(q))
        : cfg.options;
      return `<div class="absolute inset-0 z-[70]">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-picker"></div>
        <div class="absolute inset-x-0 bottom-0 mx-auto flex max-h-[85%] w-full max-w-[640px] flex-col rounded-t-2xl bg-white pb-2 shadow-2xl">
          <div class="flex shrink-0 justify-center pt-2"><span class="h-1.5 w-10 rounded-full bg-slate-300"></span></div>
          <div class="flex shrink-0 items-center justify-between gap-2 px-4 pb-1 pt-2">
            <h3 class="text-[16px] font-bold text-slate-900">${cfg.title}</h3>
            <button data-action="close-picker" class="grid h-8 w-8 place-items-center rounded-lg text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="shrink-0 px-4 pb-2">
            <div class="relative">
              <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">${icon('search', 'h-4 w-4')}</span>
              <input id="pickerSearch" value="${esc(state.pickerQuery)}" placeholder="搜索姓名或邮箱" class="h-11 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-[16px] text-slate-900 outline-none transition placeholder:text-slate-500 focus:border-indigo-500" aria-label="搜索班长">
            </div>
          </div>
          <div class="min-h-0 flex-1 overflow-y-auto px-2">
            ${options.map((o) => `<button data-action="${cfg.action}" data-id="${o.id}" class="flex h-11 w-full items-center gap-2 rounded-xl px-3 text-left transition hover:bg-slate-50">
              <span class="min-w-0 flex-1 truncate text-[14px] font-medium text-slate-800">${esc(o.label)}</span>
              ${o.meta ? `<span class="max-w-[45%] truncate text-[12px] font-medium text-slate-500">${esc(o.meta)}</span>` : ''}
              ${cfg.selected === o.id ? icon('check', 'h-4 w-4 shrink-0 text-slate-900') : ''}
            </button>`).join('') || '<p class="px-3 py-6 text-center text-[14px] font-medium text-slate-500">没有匹配的班长</p>'}
          </div>
          <div class="shrink-0 border-t border-slate-200 px-4 pb-1 pt-2">
            <button data-action="reset-picker" class="h-11 w-full rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 transition-colors hover:bg-slate-50 active:bg-slate-100">重置</button>
          </div>
        </div>
      </div>`;
    }

    function modalShell(content) {
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[1px]" data-action="close-overlay"></div>
        <div class="absolute inset-x-3 top-1/2 mx-auto max-h-[88%] max-w-[560px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">${content}</div>
      </div>`;
    }

    function modalHeader(title, subtitle = '') {
      return `<div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 class="text-[16px] font-bold text-slate-900">${esc(title)}</h2>
          ${subtitle ? `<p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">${esc(subtitle)}</p>` : ''}
        </div>
        <button data-action="close-overlay" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
      </div>`;
    }

    function renderQrModal() {
      const t = teacherById(state.activeTeacherId);
      if (!t) return '';
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/60" data-action="close-overlay"></div>
        <div class="absolute inset-x-6 top-1/2 mx-auto max-w-[340px] -translate-y-1/2 rounded-2xl bg-white p-4 text-center shadow-2xl">

        </div>
      </div>`;

    function renderMonitorWechatQrModal() {
      const m = monitorById(state.overlay.monitorId);
      if (!m || !m.wechatQr) return '';
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/60" data-action="close-overlay"></div>
        <div class="absolute inset-x-6 top-1/2 mx-auto max-w-[340px] -translate-y-1/2 rounded-2xl bg-white p-4 text-center shadow-2xl">
          <div class="flex justify-end">
            <button data-action="close-overlay" class="grid h-8 w-8 place-items-center rounded-lg text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>

          </div>

        </div>
      </div>`;
    }

    function renderPhotoLightbox() {
      const t = teacherById(state.activeTeacherId);
      const photos = (t && t.photos) || [];
      if (!photos.length) return '';
      const total = photos.length;
      const index = ((state.overlay.index % total) + total) % total;
      const photo = photos[index];
      const mainId = mainPhotoId(t);
      return `<div class="absolute inset-0 z-[70] overflow-hidden bg-slate-950/95">
        <div class="absolute inset-0" data-action="close-overlay"></div>
        <div class="absolute inset-x-0 top-0 z-10 flex items-start justify-between gap-3 px-4 py-3">
          <div class="min-w-0 text-white">
            <div class="truncate text-[14px] font-bold">${esc(t.name)} · 风采相册</div>
            <div class="mt-1 flex items-center gap-1.5 text-[12px] font-medium text-slate-300">
              ${photo.id === mainId ? '<span class="rounded bg-indigo-500 px-1.5 py-0.5 text-[12px] font-bold text-white">主头像</span>' : ''}
              <span>生活 / 教学照片</span>
            </div>
          </div>
          <div class="flex shrink-0 items-center gap-2">

            <button data-action="close-overlay" class="grid h-9 w-9 place-items-center rounded-xl bg-white/10 text-white hover:bg-white/20" aria-label="关闭大图">${icon('x', 'h-5 w-5')}</button>
          </div>
        </div>
        <div class="pointer-events-none relative z-10 flex h-full items-center justify-center px-4 pb-20 pt-20">
          <img src="${photo.dataUrl}" class="pointer-events-auto max-h-full max-w-full rounded-xl object-contain shadow-2xl" alt="">
        </div>
        ${total > 1 ? `<button data-action="photo-prev" class="absolute left-3 top-1/2 z-10 grid h-11 w-11 -translate-y-1/2 place-items-center rounded-full bg-white/10 text-white backdrop-blur hover:bg-white/20" aria-label="上一张">${icon('chevron-left', 'h-6 w-6')}</button>
        <button data-action="photo-next" class="absolute right-3 top-1/2 z-10 grid h-11 w-11 -translate-y-1/2 place-items-center rounded-full bg-white/10 text-white backdrop-blur hover:bg-white/20" aria-label="下一张">${icon('chevron-right', 'h-6 w-6')}</button>` : ''}
        <div class="pointer-events-none absolute inset-x-0 bottom-0 z-10 px-4 py-3 text-center text-[12px] font-medium text-slate-300">点击暗色背景或按 Esc 退出${total > 1 ? ' · 使用 ← → 切换照片' : ''}</div>
      </div>`;
    }

    function renderAvatarCropModal() {
      const crop = state.form.crop;
      const photo = crop ? state.form.photos.find((p) => p.id === crop.photoId) : null;
      if (!crop || !photo) return '';
      return `<div class="absolute inset-0 z-50">
        <div class="absolute inset-0 bg-slate-900/75 backdrop-blur-[1px]" data-action="close-crop"></div>
        <div class="absolute inset-x-4 top-1/2 mx-auto max-h-[90%] max-w-[360px] -translate-y-1/2 overflow-y-auto rounded-2xl bg-white p-4 shadow-2xl">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h2 class="text-[16px] font-bold text-slate-900">1:1 主头像裁切</h2>
              <p class="mt-0.5 text-[12px] font-medium leading-relaxed text-slate-500">缩放并移动构图，确认后生成列表与课表使用的 1:1 主头像。</p>
            </div>
            <button data-action="close-crop" class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-50" aria-label="关闭">${icon('x', 'h-5 w-5')}</button>
          </div>
          <div class="mt-3 flex justify-center rounded-2xl bg-slate-100 p-3">

          </div>
          <div class="mt-3 space-y-2">

            </label>
            <div class="grid grid-cols-2 gap-2">
              <label for="cropX" class="block text-[12px] font-semibold text-slate-600">水平位置

            <button data-action="confirm-crop" class="h-11 flex-[2] rounded-xl bg-indigo-600 text-[16px] font-semibold text-white">确认设为主头像</button>

      </div>`;

    function renderResignTeacherModal() {
      const t = teacherById(state.activeTeacherId);
      if (!t) return '';
      const cleared = state.resignTeacher.cleared;
      const date = state.resignTeacher.date || TODAY;
      const future = date > TODAY;
      const allDetails = t.resignDetails || { temp: [], fixed: [], classes: [], sub: [] };
      const afterDate = (items) => (items || []).filter((x) => !x.date || x.date >= date);
      const details = {
        temp: afterDate(allDetails.temp),
        fixed: afterDate(allDetails.fixed),
        classes: afterDate(allDetails.classes),
        sub: afterDate(allDetails.sub)
      };
      const totalLeft = details.temp.length + details.fixed.length + details.classes.length + details.sub.length;
      const category = (title, items, unitLabel, actionLabel, renderItem) => `
        <div class="rounded-xl border border-slate-200 bg-white p-2.5">
          <div class="flex items-center justify-between gap-2">
            <div class="text-[14px] font-bold text-slate-800">${title}</div>
            ${items.length
              ? `<span class="shrink-0 rounded-full border border-amber-200 bg-amber-50 px-1.5 py-0.5 text-[12px] font-bold text-amber-800">${items.length} ${unitLabel}待处理</span>`
              : `<span class="shrink-0 text-[12px] font-bold text-emerald-700">已清零</span>`}
          </div>
          ${items.length ? `<div class="mt-1.5 space-y-1.5">
            ${items.map((item) => `<div class="flex items-center justify-between gap-2 rounded-lg bg-slate-50 px-2 py-1.5">
              <div class="min-w-0 flex-1 text-[12px] font-medium leading-relaxed text-slate-600">${renderItem(item)}</div>
              <button data-action="toast" data-message="${actionLabel}" class="h-7 shrink-0 rounded-md border border-slate-200 bg-white px-2 text-[12px] font-bold text-slate-700">${actionLabel}</button>
            </div>`).join('')}
          </div>` : ''}
        </div>`;
      return modalShell(`
        ${modalHeader(`办理老师离职：${t.name}`, `${priceLabel(t.level)} · 需完成全部教务交接后方可离职`)}
        <div class="mt-2.5 rounded-xl border border-slate-300 bg-white p-2.5">
          <label for="resignDate" class="mb-1 block text-[14px] font-semibold text-slate-700">离职生效日期</label>
          <input id="resignDate" type="date" min="${TODAY}" value="${esc(date)}" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 px-3.5 text-[16px] text-slate-900 outline-none transition focus:border-indigo-500 focus:bg-white">
          <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-500">${future ? `将于 ${esc(date)} 进入待离职过渡态；该日及当轮剩余/后续日期全不可约，D 前既有课次正常履约。` : '今日立即生效：选课大厅即刻下架，并校验今日及之后全部未执行教务。'}</p>
        </div>
        <p class="mt-2.5 text-[14px] font-medium leading-relaxed text-slate-600">${future ? `需校验 ${esc(date)} 及之后的未执行教务；该日之前既有课次正常履约。` : '该老师尚有未来未执行教务，必须全部交接清零后方可办理离职。'}</p>
        <div class="mt-2.5 space-y-1.5">
          ${category(`防线 A · ${future ? `${esc(date)} 及之后的` : '未来 1-7 天'}临时课`, details.temp, '节', '去调配代课', (x) => `${esc(x.date)} ${esc(x.time)} · ${esc(x.student)}`)}
          ${category('防线 B · 未来固定位 / 预占 HOLD', details.fixed, '名学员', '去协调换师', (x) => `${esc(x.student)} · ${esc(x.schedule)} · 剩余 ${x.remaining} 节`)}
          <div class="rounded-xl border border-slate-200 bg-white p-2.5">
            <div class="flex items-center justify-between gap-2">
              <div class="text-[14px] font-bold text-slate-800">防线 C · 担任主讲人的小班</div>
              ${details.classes.length
                ? `<span class="shrink-0 rounded-full border border-amber-200 bg-amber-50 px-1.5 py-0.5 text-[12px] font-bold text-amber-800">${details.classes.length} 个小班待处理</span>`
                : `<span class="shrink-0 text-[12px] font-bold text-emerald-700">已清零</span>`}
            </div>
            ${details.classes.length ? `<div class="mt-1.5 space-y-1.5">
              ${details.classes.map((c) => `<div class="rounded-lg bg-slate-50 px-2 py-1.5">
                <div class="text-[12px] font-medium leading-relaxed text-slate-600">${esc(c.name)}${c.isOwn ? '' : ` <span class="text-slate-500">(主理人: ${esc(c.owner)})</span>`} · ${esc(c.schedule)}</div>
                <div class="mt-1 flex flex-wrap justify-end gap-2">
                  ${c.isOwn
                    ? `<button data-action="toast" data-message="去变更主讲" class="h-7 shrink-0 rounded-md border border-slate-200 bg-white px-2 text-[12px] font-bold text-slate-700">去变更主讲</button>`
                    : `<button data-action="toast" data-message="已向主理人 ${esc(c.owner)} 发送提前结课提醒" class="h-7 shrink-0 rounded-md border border-slate-200 bg-white px-2 text-[12px] font-bold text-slate-700">一键催办主理人提前结课解散</button>
                       <button data-action="toast" data-message="管理员已发起强制结课解散" class="h-7 shrink-0 rounded-md border border-slate-200 bg-white px-2 text-[12px] font-bold text-slate-500">管理员强制解散</button>`}
                </div>
              </div>`).join('')}
            </div>` : ''}
          </div>
          ${category('附加校验 · 被指派且未执行的代课任务', details.sub, '节', '去交接代课', (x) => `${esc(x.date)} ${esc(x.time)} · ${esc(x.className)}`)}
        </div>
        <label class="mt-2.5 flex cursor-pointer items-start gap-2.5 rounded-xl border border-slate-300 bg-white px-3 py-2.5">
          <input id="resignCleared" type="checkbox" ${cleared ? 'checked' : ''} class="mt-0.5 h-4 w-4 rounded border-slate-300 accent-indigo-600">
          <span class="text-[14px] font-medium text-slate-700">已完成全部交接确认<span class="mt-0.5 block text-[12px] font-medium text-slate-500">勾选后确认办理离职按钮可用${totalLeft ? '' : ' · 当前日期范围已无待交接项'}</span></span>
        </label>
        <p class="mt-2.5 text-[12px] font-medium leading-relaxed text-slate-500">${future ? '到达离职日期后将自动转为已离职、下架选课大厅，并作废未生效调价计划；' : '离职后档案从选课大厅下架并作废未生效调价计划；'}历史课酬正常归集，变动日志永久保留。</p>
        <div class="mt-3 flex gap-2">
          <button data-action="close-overlay" class="h-11 flex-1 rounded-xl border border-slate-300 bg-white text-[14px] font-medium text-slate-800 transition-colors hover:bg-slate-50 active:bg-slate-100">取消</button>
          <button id="btnResignTeacher" data-action="resign-confirm" ${cleared ? '' : 'disabled'} class="h-11 flex-1 rounded-xl bg-rose-600 text-[14px] font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-500">${future ? '确认预约离职' : '确认办理离职'}</button>
        </div>
      `);
    }

    function renderAppointModal() {
      const a = state.appoint;
      const isEdit = a.mode === 'edit';
      return modalShell(`
        ${modalHeader(isEdit ? '编辑班长资料' : '委任新班长', isEdit ? '维护显示名称、联系电话与微信二维码（变更自动写入职务档案变动日志）' : '通过已注册邮箱检索账号，授予班长权限')}

      return modalShell(`

              <span class="min-w-0 flex-1 truncate text-[14px] font-medium text-slate-800">${esc(c.name)}</span>
              <span class="shrink-0 text-[12px] font-medium text-slate-500">${esc(c.students)} 人</span>
            </label>`).join('') || '<p class="text-[12px] font-medium text-slate-500">暂无小班</p>'}

    function renderDismissModal() {

      const eduBlocked = metrics.teachers > 0 || metrics.classes > 0;
      const fundsCleared = state.dismiss.fundsCleared || !fundsBlocked;
      const eduCleared = state.dismiss.eduCleared || !eduBlocked;
      const canConfirm = fundsCleared && eduCleared;
      const nameOk = state.dismiss.confirmName.trim() === m.name;
      return modalShell(`
        ${modalHeader(`解除班长职务：${m.name}`, '两道强防线均通过后方可解除；解除后仅收回班长权限')}

              <div class="min-w-0">
                <div class="flex items-center gap-1.5 text-[12px] font-bold ${fundsBlocked && !fundsCleared ? TONES.rose.sub : TONES.emerald.sub}">

            </div>
            ${fundsBlocked ? `<label class="mt-1.5 flex items-center gap-2 text-[12px] font-medium text-slate-600">

                </div>

              ${eduBlocked ? `<button data-action="open-rebind" data-id="${m.id}" class="inline-flex h-7 shrink-0 items-center rounded-lg border ${SOFT_BTN.rose} px-2.5 text-[12px] font-bold">去改绑</button>` : ''}
            </div>

              <input id="dismissEdu" type="checkbox" ${eduCleared ? 'checked' : ''} class="h-4 w-4 rounded border-slate-300 accent-indigo-600">已完成教务交接确认

    /* ------------------------------------------------------------------

     * ------------------------------------------------------------------ */
    function startTeacherForm(mode, id = null) {
      if (state.online === 'off') return showToast('离线模式下不可录入或编辑档案');
      if (!['monitor', 'admin'].includes(state.role)) return showToast('当前身份不可维护老师档案');
      if (mode === 'edit') {
        const t = teacherById(id);
        if (!t || t.status === 'resigned') return showToast('已离职老师档案只读可查');
        if (state.role === 'monitor' && t.monitorId !== CURRENT_MONITOR_ID) return showToast('该老师不在当前班长名下');
        const photos = clone(t.photos || []);
        state.form = {
          mode: 'edit', id: t.id, name: t.name, level: t.level, monitorId: t.monitorId,
          pendingLevel: t.pendingPrice ? t.pendingPrice.level : '',
          pendingDate: t.pendingPrice ? t.pendingPrice.effectiveDate : '',
          classinRoom: t.classinRoom || '',
          introZh: t.introZh, introEn: t.introEn,
          avatarDataUrl: t.avatarDataUrl || (photos[0] ? photos[0].dataUrl : ''), qrDataUrl: t.qrDataUrl || '',
          photos, avatarPhotoId: t.avatarPhotoId || (photos[0] ? photos[0].id : null), crop: null,
          media: clone(t.media), publish: t.status === 'active' || missingMedia(t).length === 0, videoError: '', error: ''
        };
        state.formReturnPage = state.page === 'teacherDetail' ? 'teacherDetail' : 'teachers';
      } else {
        state.form = emptyTeacherForm();
        state.form.monitorId = state.role === 'admin' ? ADMIN_MONITOR_ID : CURRENT_MONITOR_ID;
        state.formReturnPage = 'teachers';
      }
      state.page = 'teacherForm';
      state.navTab = 'ops';
      state.overlay = null;
      state.picker = null;
      state.pickerQuery = '';
      state.playingVideo = false;
      renderAll();
      updateIntroCounters();
    }

    function openAppoint(prefill = {}) {
      if (state.online === 'off') return showToast('离线模式下不可委任班长');
      state.appoint = {
        mode: 'appoint', monitorId: null,
        email: prefill.email || '', name: prefill.name || '', phone: prefill.phone || '',
        wechatQr: !!prefill.wechatQr, wechatQrDataUrl: prefill.wechatQrDataUrl || '', error: ''
      };
      state.overlay = { type: 'appoint' };
      renderAll();
      updateAppointMatch();
      setTimeout(() => $('appointEmail')?.focus(), 50);
    }

    function openEditMonitor(monitorId) {
      if (state.online === 'off') return showToast('离线模式下不可编辑班长资料');
      const m = monitorById(monitorId);
      if (!m || m.status !== 'active' || m.isPlatform) return;
      state.appoint = {
        mode: 'edit', monitorId: m.id,
        email: m.email, name: m.name, phone: m.phone,
        wechatQr: !!m.wechatQr, wechatQrDataUrl: m.wechatQrDataUrl || '', error: ''
      };
      state.overlay = { type: 'appoint' };
      renderAll();
      updateAppointMatch();
      setTimeout(() => $('appointName')?.focus(), 50);
    }

    function openRebind(monitorId) {
      if (state.online === 'off') return showToast('离线模式下不可改绑');
      const m = monitorById(monitorId);
      if (!m || m.status === 'resigned') return;
      const teachers = state.teachers.filter((t) => t.monitorId === m.id && t.status !== 'resigned');
      const classes = state.classes.filter((c) => c.monitorId === m.id && ['recruiting', 'active'].includes(c.status));
      if (!teachers.length && !classes.length) return showToast('该班长名下暂无可改绑的老师或小班');
      state.rebind = { monitorId: m.id, targetId: '', teacherIds: teachers.map((t) => t.id), classIds: classes.map((c) => c.id), error: '' };
      state.overlay = { type: 'rebind' };
      renderAll();
      updateRebindButton();
    }

    function openDismiss(monitorId) {
      if (state.online === 'off') return showToast('离线模式下不可解除班长职务');
      const m = monitorById(monitorId);
      if (!m || m.status === 'resigned') return;
      if (m.isAdminSelf) return showToast('管理员账号不可解除班长职务');
      const metrics = monitorMetrics(m);
      state.dismiss = {
        monitorId: m.id,
        fundsCleared: (m.unsettledTs || 0) === 0 && (m.unsettledPoints || 0) === 0,
        eduCleared: metrics.teachers === 0 && metrics.classes === 0,
        confirmName: '', error: ''
      };
      state.overlay = { type: 'dismiss' };
      renderAll();
    }

    function updateIntroCounters() {
      const zh = $('fIntroZh');
      const en = $('fIntroEn');
      const zhCount = $('zhCount');
      const enCount = $('enCount');
      if (zh && zhCount) zhCount.textContent = zh.value.length;
      if (en && enCount) enCount.textContent = en.value.length;
    }

    function clearFormError() {
      state.form.error = '';
      const el = $('formError');
      if (el) el.remove();
    }

    function updatePublishToggle() {
      const on = state.form.publish;
      const label = $('publishLabel');
      const track = $('publishTrack');
      const knob = $('publishKnob');
      if (label) {
        label.textContent = on ? '已开启' : '已关闭';
        label.className = `text-[12px] font-semibold ${on ? 'text-indigo-700' : 'text-slate-500'}`;
      }
      if (track) track.className = `relative h-6 w-11 rounded-full transition ${on ? 'bg-indigo-600' : 'bg-slate-300'}`;
      if (knob) knob.className = `absolute top-0.5 h-5 w-5 rounded-full bg-white transition-transform ${on ? 'translate-x-5' : 'translate-x-0'}`;
      const save = document.querySelector('[data-action="save-teacher"]');
      if (save) save.textContent = on ? '保存并发布' : '保存草稿';
    }

    function updateAppointMatch() {
      const nameOk = state.appoint.name.trim().length >= 1 && state.appoint.name.trim().length <= 50;
      const phoneOk = isValidPhone(state.appoint.phone);
      const btn = $('btnAppoint');
      if (state.appoint.mode === 'edit') {
        if (btn) btn.disabled = !nameOk || !phoneOk;
        return;
      }
      const email = state.appoint.email.trim().toLowerCase();
      const account = ACCOUNTS[email];
      const active = state.monitors.find((m) => m.email.toLowerCase() === email && m.status === 'active');
      const resigned = state.monitors.find((m) => m.email.toLowerCase() === email && m.status === 'resigned');
      let html = '';
      let blocked = false;
      let tone = 'text-slate-500';
      if (!email) {
        html = '输入已注册邮箱检索账号';
      } else if (!isEmailValid(email)) {
        html = '请输入有效的邮箱地址'; tone = 'text-rose-600'; blocked = true;
      } else if (!account) {
        html = '未找到该账号'; tone = 'text-rose-600'; blocked = true;
      } else if (active) {
        html = '该账号已有在职班长档案'; tone = 'text-rose-600'; blocked = true;
      } else if (resigned) {
        html = `检测到已离职档案「${resigned.name}」，确认后将复用并恢复在职`; tone = 'text-amber-700';
      } else {
        html = `匹配账号：${account.name} · 可授予班长权限`; tone = 'text-emerald-600';
      }
      const match = $('appointMatch');
      if (match) match.innerHTML = `<span class="${tone}">${esc(html)}</span>`;
      if (btn) btn.disabled = blocked || !nameOk || !phoneOk;
    }

    function updateRebindButton() {
      const valid = !!state.rebind.targetId && (state.rebind.teacherIds.length + state.rebind.classIds.length > 0);
      const btn = $('btnRebind');
      if (btn) btn.disabled = !valid;
    }

    function updateDismissButton() {
      const m = monitorById(state.dismiss.monitorId);
      const metrics = m ? monitorMetrics(m) : { teachers: 0, classes: 0 };
      const fundsCleared = state.dismiss.fundsCleared || !(m && ((m.unsettledTs || 0) > 0 || (m.unsettledPoints || 0) > 0));
      const eduCleared = state.dismiss.eduCleared || (metrics.teachers === 0 && metrics.classes === 0);
      const btn = $('btnDismiss');
      if (btn) btn.disabled = !(fundsCleared && eduCleared && m && state.dismiss.confirmName.trim() === m.name);
    }

    /* ------------------------------------------------------------------
     * 保存与业务确认
     * ------------------------------------------------------------------ */
    function teacherFormError() {
      const f = state.form;
      if (state.online === 'off') return '离线模式下不可保存档案';
      if (!f.name.trim()) return '请填写老师英文姓名';
      if (f.name.trim().length > 50) return '英文姓名不能超过 50 字符';
      if (!PRICE_TIERS.some((l) => l.id === f.level)) return '请选择老师价位';
      if (!f.introZh.trim()) return '请填写中文简介';
      if (f.introZh.length > 2000) return '中文简介不能超过 2000 字符';
      if (!f.introEn.trim()) return '请填写英文简介';
      if (f.introEn.length > 2000) return '英文简介不能超过 2000 字符';
      if (f.publish) {
        if (!f.photos.length) return '发布前请上传至少 1 张风采相册照片，或关闭同步保存为草稿';
        if (!f.avatarPhotoId) return '发布前请选择并裁切 1 张 1:1 主头像，或关闭同步保存为草稿';
        if (!f.media.qr) return '发布前请上传 ClassIn 二维码，或关闭同步保存为草稿';
        if (!f.media.video) return '发布前请上传试讲视频，或关闭同步保存为草稿';
      }
      return null;
    }

    function saveTeacher() {
      if (!['monitor', 'admin'].includes(state.role)) return showToast('当前身份不可维护老师档案');
      const f = state.form;
      const err = teacherFormError();
      if (err) {
        f.error = err;
        renderAll();
        setTimeout(() => $('formError')?.scrollIntoView({ block: 'center' }), 60);
        showToast(err);
        return;
      }
      if (state.role === 'admin' && f.pendingLevel) {
        if (!PRICE_TIERS.some((l) => l.id === f.pendingLevel)) {
          f.error = '请选择有效的待生效价位';
          renderAll();
          return showToast(f.error);
        }
        if (!f.pendingDate || f.pendingDate < ROUND_SETTABLE_FROM || !ROUND_STARTS.includes(f.pendingDate)) {
          f.error = '生效日只能选择未来轮次首日，且须早于该轮次前一周周一 08:30';
          renderAll();
          return showToast(f.error);
        }
      }
      const complete = formMissing().length === 0;
      const status = f.publish && complete ? 'active' : 'pending';
      if (f.mode === 'edit') {
        const t = teacherById(f.id);
        if (!t) return;
        if (t.status === 'resigned') return showToast('已离职老师档案只读，不可编辑');
        if (state.role === 'monitor' && t.monitorId !== CURRENT_MONITOR_ID) return showToast('该老师不在当前班长名下');
        const beforeSnap = teacherFieldSnapshot(t);
        const beforePending = t.pendingPrice ? pendingPriceText(t.pendingPrice) : '未设置';
        const beforeStatus = t.status;
        Object.assign(t, {
          name: f.name.trim(), level: f.level,
          monitorId: state.role === 'admin' ? f.monitorId : t.monitorId,
          introZh: f.introZh, introEn: f.introEn,
          avatarDataUrl: f.avatarDataUrl, qrDataUrl: f.qrDataUrl,
          photos: clone(f.photos), avatarPhotoId: f.avatarPhotoId,
          media: clone(f.media), status
        });
        if (state.role === 'admin') {
          if (f.pendingLevel && f.pendingDate) {
            t.pendingPrice = { level: f.pendingLevel, effectiveDate: f.pendingDate };
          } else {
            delete t.pendingPrice;
          }
        }
        const afterPending = t.pendingPrice ? pendingPriceText(t.pendingPrice) : '未设置';
        appendTeacherChanges(beforeSnap, t);
        if (beforePending !== afterPending) {
          appendTeacherLog(t.id, { kind: 'field', at: nowStamp(), operator: operatorLabel(), changes: [
            { field: '待生效调价', before: beforePending, after: afterPending }
          ] });
        }
        if (beforeStatus !== status) {
          appendTeacherStatus(t, beforeStatus, status, status === 'active' ? '档案完善并上架' : '档案退回待完善');
        }
        state.activeTeacherId = t.id;
        state.page = 'teacherDetail';
        state.navTab = 'ops';
        state.overlay = null;
        renderAll();
        showToast(status === 'active' ? '老师档案已保存并同步至家长端' : (complete ? '已保存为待发布草稿，暂未上架' : '已保存为待完善档案，暂未上架'));
        return;
      }
      const monitorId = state.role === 'admin' ? f.monitorId : CURRENT_MONITOR_ID;
      const t = {
        id: newId('tc'),
        name: f.name.trim(), level: f.level, monitorId,
        weeklyCapacity: 30, availability: 'available',
        introZh: f.introZh, introEn: f.introEn,
        avatarDataUrl: f.avatarDataUrl, qrDataUrl: f.qrDataUrl,
        photos: clone(f.photos), avatarPhotoId: f.avatarPhotoId,
        media: clone(f.media), todayLessons: 0, upcoming: 0, completed: 0,
        status, createdAt: TODAY, resign: { temp: 0, fixed: 0, classes: 0, sub: 0 },
        resignDetails: { temp: [], fixed: [], classes: [], sub: [] }
      };
      if (state.role === 'admin' && f.pendingLevel && f.pendingDate) {
        t.pendingPrice = { level: f.pendingLevel, effectiveDate: f.pendingDate };
      }
      state.teachers.push(t);
      appendTeacherStatus(t, '', status, status === 'active' ? '录入档案并上架' : '录入档案，待完善');
      if (t.pendingPrice) {
        appendTeacherLog(t.id, { kind: 'field', at: nowStamp(), operator: operatorLabel(), changes: [
          { field: '待生效调价', before: '未设置', after: pendingPriceText(t.pendingPrice) }
        ] });
      }
      state.activeTeacherId = t.id;
      state.page = 'teacherDetail';
      state.navTab = 'ops';
      state.overlay = null;
      renderAll();
      showToast(status === 'active' ? `已创建 ${t.name} 并上架家长端` : (complete ? `已创建 ${t.name}，待发布` : `已创建 ${t.name}，档案待完善`));
    }

    function confirmResignTeacher() {
      if (!state.resignTeacher.cleared) return;
      const t = teacherById(state.activeTeacherId);
      if (!t) return;
      const date = state.resignTeacher.date || TODAY;
      if (date < TODAY) return showToast('离职生效日期不能早于今天');
      const beforeStatus = t.status;
      const hadPendingPrice = !!t.pendingPrice;
      delete t.pendingPrice;
      if (date > TODAY) {
        t.resignDate = date;
        const changes = [{ field: '离职生效日期', before: '未设置', after: `${date}（待离职过渡态）` }];
        if (hadPendingPrice) changes.push({ field: '待生效调价', before: '待生效计划', after: '已自动作废' });
        appendTeacherLog(t.id, { kind: 'field', at: nowStamp(), operator: operatorLabel(), changes });
        state.overlay = null;
        state.page = 'teacherDetail';
        renderAll();
        showToast(`${t.name} 将于 ${date} 离职 · 该日前既有课次正常履约`);
        return;
      }
      t.status = 'resigned';
      t.resignedAt = TODAY;
      delete t.resignDate;
      appendTeacherStatus(t, beforeStatus, 'resigned', '教务交接清零，办理离职（今日生效）');
      if (hadPendingPrice) {
        appendTeacherLog(t.id, { kind: 'field', at: nowStamp(), operator: operatorLabel(), changes: [
          { field: '待生效调价', before: '待生效计划', after: '已自动作废' }
        ] });
      }
      state.overlay = null;
      const list = allTeachers();
      state.activeTeacherId = list[0] ? list[0].id : '';
      state.page = 'teachers';
      state.navTab = state.role === 'admin' ? 'settings' : 'ops';
      renderAll();
      showToast(`${t.name} 已办理离职 · 档案已下架 · 历史课酬正常纳入课酬单`);
    }

    function submitAppoint() {
      if (state.online === 'off') return showToast('离线模式下不可操作班长档案');
      const a = state.appoint;
      const name = a.name.trim();
      const phone = a.phone.trim();
      const wechatQr = !!a.wechatQr;
      const wechatQrDataUrl = a.wechatQrDataUrl || '';
      const fail = (msg, focusId = 'appointEmail') => {
        state.appoint.error = msg;
        renderOverlayOnly();
        $(focusId)?.focus();
      };
      if (a.mode === 'edit') {
        const m = monitorById(a.monitorId);
        if (!m) return;
        if (!name || name.length > 50) return fail('显示名称需为 1-50 字符', 'appointName');
        if (!isValidPhone(phone)) return fail('请输入 11 位手机号或 E.164 格式电话', 'appointPhone');
        const beforeName = m.name;
        const beforePhone = m.phone;
        const beforeQrLabel = m.wechatQr ? (m.wechatQrDataUrl ? '已上传（自定义图片）' : '已上传') : '未上传';
        const beforeQrSig = `${!!m.wechatQr}:${m.wechatQrDataUrl || ''}`;
        m.name = name;
        m.phone = phone;
        m.wechatQr = wechatQr;
        m.wechatQrDataUrl = wechatQrDataUrl;
        const afterQrLabel = m.wechatQr ? (m.wechatQrDataUrl ? '已上传（自定义图片）' : '已上传') : '未上传';
        const afterQrSig = `${!!m.wechatQr}:${m.wechatQrDataUrl || ''}`;
        const changes = [];
        if (beforeName !== name) changes.push({ field: '显示名称', before: beforeName, after: name });
        if (beforePhone !== phone) changes.push({ field: '联系电话', before: beforePhone, after: phone });
        if (beforeQrSig !== afterQrSig) changes.push({ field: '微信二维码', before: beforeQrLabel, after: afterQrLabel });
        if (changes.length) {
          appendMonitorLog(m.id, { kind: 'field', at: nowStamp(), operator: operatorLabel(), changes });
        }
        state.overlay = null;
        renderAll();
        showToast(changes.length ? `已更新 ${name} 的班长资料` : '未检测到字段变更');
        return;
      }
      const email = a.email.trim().toLowerCase();
      if (!isEmailValid(email)) return fail('请输入有效的邮箱地址');
      const account = ACCOUNTS[email];
      if (!account) return fail('该邮箱尚未注册');
      const active = state.monitors.find((m) => m.email.toLowerCase() === email && m.status === 'active');
      if (active) return fail('该账号已有在职班长档案');
      if (!name || name.length > 50) return fail('显示名称需为 1-50 字符', 'appointName');
      if (!isValidPhone(phone)) return fail('请输入 11 位手机号或 E.164 格式电话', 'appointPhone');
      const resigned = state.monitors.find((m) => m.email.toLowerCase() === email && m.status === 'resigned');
      if (resigned) {
        const beforeName = resigned.name;
        const beforePhone = resigned.phone;
        const beforeQrLabel = resigned.wechatQr ? (resigned.wechatQrDataUrl ? '已上传（自定义图片）' : '已上传') : '未上传';
        const beforeQrSig = `${!!resigned.wechatQr}:${resigned.wechatQrDataUrl || ''}`;
        resigned.status = 'active';
        resigned.name = name;
        resigned.phone = phone;
        resigned.wechatQr = wechatQr;
        resigned.wechatQrDataUrl = wechatQrDataUrl;
        resigned.appointedAt = TODAY;
        resigned.appointedBy = 'Sarah';
        delete resigned.resignedAt;
        const afterQrLabel = resigned.wechatQr ? (resigned.wechatQrDataUrl ? '已上传（自定义图片）' : '已上传') : '未上传';
        const afterQrSig = `${!!resigned.wechatQr}:${resigned.wechatQrDataUrl || ''}`;
        const changes = [];
        if (beforeName !== name) changes.push({ field: '显示名称', before: beforeName, after: name });
        if (beforePhone !== phone) changes.push({ field: '联系电话', before: beforePhone, after: phone });
        if (beforeQrSig !== afterQrSig) changes.push({ field: '微信二维码', before: beforeQrLabel, after: afterQrLabel });
        if (changes.length) {
          appendMonitorLog(resigned.id, { kind: 'field', at: nowStamp(), operator: operatorLabel(), changes });
        }
        appendMonitorLog(resigned.id, { kind: 'status', at: nowStamp(), operator: operatorLabel(), from: 'resigned', to: 'active', reason: '复用原档案重新委任' });
        state.monitorFilter = 'active';
        state.overlay = null;
        renderAll();
        showToast(`已复用并恢复 ${name} 的班长档案`);
        return;
      }
      const created = {
        id: newId('mn'), name, email, phone, appointedAt: TODAY, status: 'active',
        unsettledTs: 0, unsettledPoints: 0, appointedBy: 'Sarah',
        wechatQr, wechatQrDataUrl
      };
      state.monitors.push(created);
      appendMonitorLog(created.id, { kind: 'status', at: nowStamp(), operator: operatorLabel(), from: '', to: 'active', reason: wechatQr ? '邮箱检索委任班长（已附微信二维码）' : '邮箱检索委任班长' });
      state.monitorFilter = 'active';
      state.overlay = null;
      renderAll();
      showToast(`已委任 ${name} 为班长`);
    }

    function submitRebind() {
      if (state.online === 'off') return showToast('离线模式下不可改绑');
      const r = state.rebind;
      const m = monitorById(r.monitorId);
      const target = monitorById(r.targetId);
      const fail = (msg) => {
        state.rebind.error = msg;
        renderOverlayOnly();
      };
      if (!m || !target || target.status !== 'active' || target.isPlatform || target.id === m.id) return fail('接手班长必须为在职、非本人');
      if (!r.teacherIds.length && !r.classIds.length) return fail('请至少选择 1 位老师或 1 个小班');
      let teacherCount = 0;
      let classCount = 0;
      const beforeMonitorName = monitorNameOf(m.id);
      const afterMonitorName = monitorNameOf(target.id);
      state.teachers.forEach((t) => {
        if (r.teacherIds.includes(t.id) && t.monitorId === m.id) {
          t.monitorId = target.id;
          teacherCount++;
          appendTeacherLog(t.id, { kind: 'field', at: nowStamp(), operator: operatorLabel(), changes: [
            { field: '负责班长', before: beforeMonitorName, after: afterMonitorName }
          ] });
        }
      });
      state.classes.forEach((c) => {
        if (r.classIds.includes(c.id) && c.monitorId === m.id) { c.monitorId = target.id; classCount++; }
      });
      state.overlay = null;
      state.page = 'monitors';
      state.navTab = 'settings';
      renderAll();
      showToast(`已改绑 ${teacherCount} 位老师 / ${classCount} 个小班 · 历史资金持有人不变`);
    }

    function submitDismiss() {
      if (state.online === 'off') return showToast('离线模式下不可解除班长职务');
      const d = state.dismiss;
      const m = monitorById(d.monitorId);
      if (!m) return;
      const metrics = monitorMetrics(m);
      const fundsCleared = d.fundsCleared || ((m.unsettledTs || 0) === 0 && (m.unsettledPoints || 0) === 0);
      const eduCleared = d.eduCleared || (metrics.teachers === 0 && metrics.classes === 0);
      const fail = (msg) => {
        state.dismiss.error = msg;
        renderOverlayOnly();
      };
      if (!fundsCleared) return fail('防线一未通过：仍有未结课次');
      if (!eduCleared) return fail('防线二未通过：仍有在职老师或小班');
      if (d.confirmName.trim() !== m.name) return fail('请输入正确的班长显示名称以确认');
      const beforeStatus = m.status;
      m.status = 'resigned';
      m.resignedAt = TODAY;
      m.unsettledTs = 0;
      m.unsettledPoints = 0;
      appendMonitorLog(m.id, { kind: 'status', at: nowStamp(), operator: operatorLabel(), from: beforeStatus, to: 'resigned', reason: '资金清算与教务交接完成，解除职务' });
      if (eduCleared) {
        const fallback = state.monitors.find((x) => x.status === 'active' && x.id !== m.id);
        if (fallback) {
          state.teachers.forEach((t) => {
            if (t.monitorId === m.id) {
              const beforeMonitorName = monitorNameOf(t.monitorId);
              t.monitorId = fallback.id;
              appendTeacherLog(t.id, { kind: 'field', at: nowStamp(), operator: operatorLabel(), changes: [
                { field: '负责班长', before: beforeMonitorName, after: monitorNameOf(fallback.id) }
              ] });
            }
          });
          state.classes.forEach((c) => { if (c.monitorId === m.id) c.monitorId = fallback.id; });
        }
      }
      state.monitorFilter = 'active';
      state.overlay = null;
      state.page = 'monitors';
      state.navTab = 'settings';
      renderAll();
      showToast(`已解除 ${m.name} 的班长职务`);

    /* ------------------------------------------------------------------
     * 图片 / 视频 / 相册
     * ------------------------------------------------------------------ */
    const imageCache = new Map();

    function loadImage(src) {
      if (imageCache.has(src)) return imageCache.get(src);
      const promise = new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
      imageCache.set(src, promise);
      return promise;
    }

    function compressImageFile(file, maxSide = 1200) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
            const w = Math.max(1, Math.round(img.naturalWidth * scale));
            const h = Math.max(1, Math.round(img.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            try { resolve(canvas.toDataURL('image/webp', 0.85)); }
            catch (e) { resolve(evt.target.result); }
          };
          img.onerror = reject;
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function cropToDataUrl(dataUrl, opts = {}) {
      return loadImage(dataUrl).then((img) => {
        const size = 400;
        const zoom = opts.zoom || 1;
        const side = Math.min(img.naturalWidth, img.naturalHeight) / zoom;
        const sx = (img.naturalWidth - side) * (opts.x ?? 0.5);
        const sy = (img.naturalHeight - side) * (opts.y ?? 0.5);
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, size, size);
        try { return canvas.toDataURL('image/webp', 0.85); }
        catch (e) { return dataUrl; }
      });
    }

    function drawCropPreview() {
      const crop = state.form.crop;
      const photo = crop ? state.form.photos.find((p) => p.id === crop.photoId) : null;
      const canvas = $('cropPreview');
      if (!crop || !photo || !canvas) return;
      loadImage(photo.dataUrl).then((img) => {
        const size = canvas.width;
        const side = Math.min(img.naturalWidth, img.naturalHeight) / (crop.zoom || 1);
        const sx = (img.naturalWidth - side) * crop.x;
        const sy = (img.naturalHeight - side) * crop.y;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      }).catch(() => {});
    }

    function openAvatarCrop(photoId) {
      const photo = state.form.photos.find((p) => p.id === photoId);
      if (!photo) return;
      state.form.crop = { photoId, zoom: 1, x: 0.5, y: 0.5 };
      state.overlay = { type: 'avatarCrop' };
      renderAll();
      setTimeout(drawCropPreview, 30);
    }

    function closeAvatarCrop() {
      state.form.crop = null;
      state.overlay = null;
      renderAll();
    }

    function confirmAvatarCrop() {
      const crop = state.form.crop;
      const photo = crop ? state.form.photos.find((p) => p.id === crop.photoId) : null;
      if (!crop || !photo) return;
      const opts = { zoom: crop.zoom, x: crop.x, y: crop.y };
      cropToDataUrl(photo.dataUrl, opts).then((url) => {
        state.form.avatarPhotoId = photo.id;
        state.form.avatarDataUrl = url;
        state.form.media.photo = true;
        state.form.crop = null;
        state.overlay = null;
        clearFormError();
        renderAll();
        updateIntroCounters();
        setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
        showToast('已设为 1:1 主头像');
      });
    }

    async function handleAlbumFiles(files) {
      const list = Array.from(files || []).filter((f) => f.type && f.type.startsWith('image/'));
      if (!list.length) return showToast('请选择图片文件');
      const remaining = 6 - state.form.photos.length;
      if (remaining <= 0) return showToast('风采相册最多 6 张');
      const accepted = list.slice(0, remaining);
      let added = 0;
      for (const file of accepted) {
        if (state.form.photos.length >= 6) break;
        try {
          const dataUrl = await compressImageFile(file);
          state.form.photos.push({ id: `ph_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, name: file.name, dataUrl });
          added++;
        } catch (e) {
          showToast(`无法读取图片：${file.name}`);
        }
      }
      if (!added) return;
      state.form.media.photo = true;
      if (!state.form.avatarPhotoId) {
        const first = state.form.photos[0];
        state.form.avatarPhotoId = first.id;
        try { state.form.avatarDataUrl = await cropToDataUrl(first.dataUrl); }
        catch (e) { state.form.avatarDataUrl = first.dataUrl; }
      }
      clearFormError();
      renderAll();
      updateIntroCounters();
      setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      const ignored = list.length - accepted.length;
      showToast(ignored > 0 ? `已添加 ${added} 张照片（相册上限 6 张）` : `已添加 ${added} 张风采照片`);
    }

    function deleteFormPhoto(photoId) {
      const photos = state.form.photos;
      if (photos.length <= 1) return showToast('老师档案必须保留至少 1 张照片作为主头像');
      const index = photos.findIndex((p) => p.id === photoId);
      if (index < 0) return;
      const wasMain = state.form.avatarPhotoId === photoId;
      photos.splice(index, 1);
      if (wasMain) {
        const promoted = photos[0];
        state.form.avatarPhotoId = promoted.id;
        state.form.avatarDataUrl = promoted.dataUrl;
        cropToDataUrl(promoted.dataUrl).then((url) => {
          state.form.avatarDataUrl = url;
          renderAll();
          updateIntroCounters();
        }).catch(() => {});
      }
      state.form.media.photo = photos.length > 0;
      clearFormError();
      renderAll();
      updateIntroCounters();
      setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      showToast(wasMain ? '已删除原主头像，剩余照片已自动晋升' : '照片已删除');
    }

    function reorderFormPhoto(fromId, toId) {
      const photos = state.form.photos;
      const from = photos.findIndex((p) => p.id === fromId);
      const to = photos.findIndex((p) => p.id === toId);
      if (from < 0 || to < 0 || from === to) return;
      const [moving] = photos.splice(from, 1);
      photos.splice(to, 0, moving);
      renderAll();
      updateIntroCounters();
      setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      showToast('相册展示顺序已更新');
    }

    function moveFormPhoto(photoId, delta) {
      const photos = state.form.photos;
      const index = photos.findIndex((p) => p.id === photoId);
      const target = index + delta;
      if (index < 0 || target < 0 || target >= photos.length) return;
      const [moving] = photos.splice(index, 1);
      photos.splice(target, 0, moving);
      renderAll();
      updateIntroCounters();
      setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      showToast('相册展示顺序已更新');
    }

    function handleQrFile(file) {
      if (!file) return;
      if (!file.type || !file.type.startsWith('image/')) return showToast('请选择图片文件');
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 320;
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const min = Math.min(img.width, img.height);
          const sx = (img.width - min) / 2;
          const sy = (img.height - min) / 2;
          ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
          const url = canvas.toDataURL('image/webp', 0.85);
          clearFormError();
          state.form.qrDataUrl = url;
          state.form.media.qr = true;
          renderAll();
          updateIntroCounters();
          setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
          showToast('ClassIn 二维码已更新');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleMonitorWechatQrFile(file) {
      if (!file) return;
      const validType = ['image/jpeg', 'image/png', 'image/webp'].includes(file.type);
      if (!validType) {
        state.appoint.error = '微信二维码仅支持 JPG / PNG / WebP 格式';
        renderOverlayOnly();
        return;
      }
      if (file.size > 2 * 1024 * 1024) {
        state.appoint.error = '微信二维码图片体积不能超过 2MB';
        renderOverlayOnly();
        return;
      }
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 320;
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const min = Math.min(img.width, img.height);
          const sx = (img.width - min) / 2;
          const sy = (img.height - min) / 2;
          ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
          state.appoint.wechatQr = true;
          state.appoint.wechatQrDataUrl = canvas.toDataURL('image/webp', 0.85);
          state.appoint.error = '';
          renderOverlayOnly();
          updateAppointMatch();
          showToast('班长微信二维码已就绪');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleVideoFile(file) {
      if (!file) return;
      const isMp4 = file.type === 'video/mp4' || /\.mp4$/i.test(file.name);
      if (!isMp4) {
        state.form.videoError = '视频格式不支持，请上传 MP4 文件';
        renderAll();
        setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
        return showToast('视频格式不支持：请上传 MP4 文件');
      }
      if (file.size > 50 * 1024 * 1024) {
        state.form.videoError = '视频不能超过 50MB';
        renderAll();
        setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
        return showToast('视频超过 50MB 上限');
      }
      const sizeMb = (file.size / 1024 / 1024).toFixed(1);
      clearFormError();
      state.form.videoError = '';
      state.form.media.video = { name: file.name, size: `${sizeMb} MB`, duration: '—', url: URL.createObjectURL(file) };
      renderAll();
      setTimeout(() => $('formMedia')?.scrollIntoView({ block: 'center' }), 60);
      showToast('视频已就绪');
    }

      const action = el.dataset.action;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'toast') return showToast(el.dataset.message || '');
      if (action === 'back-main') {
        state.page = state.role === 'admin' ? 'monitors' : 'teachers';

        state.page = 'teachers';
        state.navTab = 'ops';
        state.overlay = null;
        state.playingVideo = false;
        return renderAll();
      }
      if (action === 'open-teacher') {
        state.activeTeacherId = el.dataset.id;
        state.page = 'teacherDetail';
        state.navTab = 'ops';
        state.introLang = 'zh';

        state.overlay = null;
        state.teacherLogCollapsed = false;

        state.teacherLogCollapsed = !state.teacherLogCollapsed;
        return renderAll();
      }
      if (action === 'teacher-log-more') {
        state.teacherLogShowAll = !state.teacherLogShowAll;
        return renderAll();
      }
      if (action === 'toggle-monitor-log') {
        state.monitorLogCollapsed = !state.monitorLogCollapsed;
        return renderOverlayOnly();
      }
      if (action === 'open-dict-audit') {
        state.overlay = { type: 'dictAudit' };
        return renderAll();
      }
      if (action === 'create-teacher') return startTeacherForm('create');
      if (action === 'edit-teacher') return startTeacherForm('edit', el.dataset.id);
      if (action === 'teacher-filter') { state.teacherFilter = el.dataset.filter; return renderAll(); }
      if (action === 'monitor-teacher-slice') { state.monitorTeacherSlice = el.dataset.slice; return renderAll(); }
      if (action === 'admin-teacher-filter') { state.adminTeacherFilter = el.dataset.filter; return renderAll(); }
      if (action === 'admin-teacher-monitor') { state.adminTeacherMonitor = el.dataset.monitor; return renderAll(); }
      if (action === 'intro-lang') {
        state.introLang = el.dataset.lang;

          text.className = `mt-2.5 whitespace-pre-line text-[14px] font-medium leading-relaxed ${intro && intro.trim() ? 'text-slate-700' : 'text-amber-700'}`;
        }
        document.querySelectorAll('[data-action="intro-lang"]').forEach((b) => {
          const on = b.dataset.lang === state.introLang;
          b.className = `h-8 rounded-lg px-2.5 text-[12px] font-bold transition ${on ? 'bg-white text-slate-900' : 'text-slate-500'}`;
        });
        return;
      }
      if (action === 'play-video') {
        const t = teacherById(state.activeTeacherId);
        if (!t || !t.media.video) return showToast('该老师暂未上传试讲视频');
        state.playingVideo = true;
        return renderAll();
      }
      if (action === 'stop-video') {
        state.playingVideo = false;
        return renderAll();
      }
      if (action === 'open-qr') {
        const t = teacherById(state.activeTeacherId);
        if (!t || !t.media.qr) return showToast('该老师暂未上传 ClassIn 二维码');
        state.overlay = { type: 'qr' };
        return renderAll();
      }
      if (action === 'open-card-qr') {
        const t = teacherById(el.dataset.id);
        if (!t || !t.media || !t.media.qr) return showToast('该老师暂未上传 ClassIn 二维码');
        state.activeTeacherId = t.id;
        state.overlay = { type: 'qr' };
        return renderAll();
      }
      if (action === 'week-schedule') {
        const t = teacherById(el.dataset.id);
        return showToast(t ? `已打开 ${t.name} 的 7 色全周排期` : '老师不存在');
      }
      if (action === 'open-photo') {
        const t = teacherById(state.activeTeacherId);
        if (!t || !(t.photos || []).length) return;
        state.overlay = { type: 'photo', index: Number(el.dataset.index) || 0 };
        return renderOverlayOnly();
      }
      if (action === 'photo-prev' || action === 'photo-next') {
        if (!state.overlay || state.overlay.type !== 'photo') return;
        const t = teacherById(state.activeTeacherId);
        const total = (t && t.photos && t.photos.length) || 0;
        if (!total) return;
        state.overlay.index = (state.overlay.index + (action === 'photo-next' ? 1 : -1) + total) % total;
        return renderOverlayOnly();
      }
      if (action === 'open-resign') {
        if (state.online === 'off') return showToast('离线模式下不可办理离职');
        const t = teacherById(state.activeTeacherId);
        if (!t || t.status === 'resigned') return showToast('该老师已离职');
        state.resignTeacher.cleared = false;
        state.resignTeacher.date = t.resignDate && t.resignDate > TODAY ? t.resignDate : TODAY;
        state.overlay = { type: 'resignTeacher' };
        return renderAll();
      }
      if (action === 'revoke-pending-price') {
        state.form.pendingLevel = '';
        state.form.pendingDate = '';
        if (state.form.mode === 'edit') {
          const t = teacherById(state.form.id);
          if (t) {
            delete t.pendingPrice;
            appendTeacherLog(t.id, { kind: 'field', at: nowStamp(), operator: operatorLabel(), changes: [
              { field: '待生效调价', before: '已设置', after: '已撤销' }
            ] });
          }
        }
        renderAll();
        return showToast('待生效调价计划已撤销');
      }
      if (action === 'attempt-disable-price') {
        const level = el.dataset.level;
        const users = state.teachers.filter((t) => t.pendingPrice && t.pendingPrice.level === level && t.status !== 'resigned');
        if (users.length) {
          const u = users[0];
          return showToast(`${level}积分仍被 ${u.name} 的待生效调价（${pendingPriceText(u.pendingPrice)}）引用，暂不可停用`);
        }
        return showToast(`演示：${level}积分已停用（当前无待生效调价引用）`);
      }
      if (action === 'open-appoint') return openAppoint();
      if (action === 'open-edit-monitor') return openEditMonitor(el.dataset.id);
      if (action === 'open-monitor-wechat-qr') {
        const m = monitorById(el.dataset.id);
        if (!m || !m.wechatQr) return showToast('该班长暂未上传微信二维码');
        state.overlay = { type: 'monitorWechatQr', monitorId: m.id };
        return renderOverlayOnly();

        state.appoint.wechatQr = false;
        state.appoint.wechatQrDataUrl = '';
        state.appoint.error = '';
        renderOverlayOnly();
        updateAppointMatch();
        return showToast('已清除微信二维码');
      }
      if (action === 'open-rebind') return openRebind(el.dataset.id);
      if (action === 'open-dismiss') return openDismiss(el.dataset.id);
      if (action === 'open-load') {
        state.overlay = { type: 'loadDetail', monitorId: el.dataset.id };
        return renderAll();
      }
      if (action === 'open-single-rebind') {
        if (state.online === 'off') return showToast('离线模式下不可改绑');
        const t = teacherById(el.dataset.id);
        if (!t) return;
        state.singleRebind = { teacherId: t.id, targetId: '', error: '' };
        state.overlay = { type: 'singleRebind' };
        return renderAll();
      }
      if (action === 'reappoint') {
        const m = monitorById(el.dataset.id);
        if (!m) return;
        return openAppoint({ email: m.email, name: m.name, phone: m.phone });
      }
      if (action === 'monitor-filter') { state.monitorFilter = el.dataset.filter; return renderAll(); }
      if (action === 'toggle-publish') {
        state.form.publish = !state.form.publish;
        clearFormError();
        updatePublishToggle();
        return;

      if (action === 'delete-photo') return deleteFormPhoto(el.dataset.id);
      if (action === 'move-photo') return moveFormPhoto(el.dataset.id, Number(el.dataset.delta));
      if (action === 'confirm-crop') return confirmAvatarCrop();
      if (action === 'close-crop') return closeAvatarCrop();
      if (action === 'reset-crop') {
        if (!state.form.crop) return;
        state.form.crop = { ...state.form.crop, zoom: 1, x: 0.5, y: 0.5 };
        renderAll();
        setTimeout(drawCropPreview, 30);
        return;

        state.form.pendingDate = el.dataset.date;
        clearFormError();
        return renderAll();
      }
      if (action === 'pick-form-monitor') {
        state.form.monitorId = el.dataset.id;
        state.picker = null;
        state.pickerQuery = '';
        clearFormError();
        return renderAll();
      }
      if (action === 'pick-rebind-target') {
        state.rebind.targetId = el.dataset.id;
        state.rebind.error = '';
        state.picker = null;
        state.pickerQuery = '';
        renderAll();
        updateRebindButton();
        return;
      }
      if (action === 'pick-single-rebind-target') {
        state.singleRebind.targetId = el.dataset.id;
        state.singleRebind.error = '';
        state.picker = null;
        state.pickerQuery = '';
        renderAll();
        const btn = $('btnSingleRebind');
        if (btn) btn.disabled = !state.singleRebind.targetId;
        return;
      }
      if (action === 'reset-picker') {
        const kind = state.picker && state.picker.kind;
        if (kind === 'formMonitor') state.form.monitorId = ADMIN_MONITOR_ID;
        if (kind === 'rebindTarget') { state.rebind.targetId = ''; state.rebind.error = ''; }
        if (kind === 'singleRebindTarget') { state.singleRebind.targetId = ''; state.singleRebind.error = ''; }
        state.picker = null;
        state.pickerQuery = '';
        renderAll();
        if (kind === 'rebindTarget') updateRebindButton();
        return;
      }
      if (action === 'close-overlay') { state.overlay = null; state.picker = null; state.pickerQuery = ''; return renderOverlayOnly(); }
      if (action === 'resign-confirm') return confirmResignTeacher();
      if (action === 'appoint-submit') return submitAppoint();
      if (action === 'rebind-submit') return submitRebind();
      if (action === 'dismiss-submit') return submitDismiss();
      if (action === 'single-rebind-submit') return submitSingleRebind();
    });

    function renderOverlayOnly() {
      $('overlay').innerHTML = renderOverlay();
      if (window.lucide) lucide.createIcons();
    }

    document.getElementById('frame').addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'pickerSearch') {
        state.pickerQuery = e.target.value;
        renderOverlayOnly();
        const input = $('pickerSearch');
        if (input) {
          input.focus();
          input.setSelectionRange(state.pickerQuery.length, state.pickerQuery.length);
        }
        return;
      }
      if (id === 'fTeacherName') { state.form.name = e.target.value; clearFormError(); }
      if (id === 'fIntroZh') {
        state.form.introZh = e.target.value;
        clearFormError();
        const count = $('zhCount');
        if (count) count.textContent = e.target.value.length;
      }
      if (id === 'fIntroEn') {
        state.form.introEn = e.target.value;
        clearFormError();
        const count = $('enCount');
        if (count) count.textContent = e.target.value.length;
      }
      if (id === 'monitorSearch') { state.monitorQuery = e.target.value; updateMonitorListOnly(); }
      if (id === 'teacherSearch') {
        const value = e.target.value;
        state.teacherQuery = value;
        const scroll = $('content') ? $('content').scrollTop : 0;
        renderAll();
        const input = $('teacherSearch');
        if (input) {
          input.focus();
          input.setSelectionRange(value.length, value.length);
        }
        if ($('content')) $('content').scrollTop = scroll;
      }
      if (id === 'appointEmail') { state.appoint.email = e.target.value; state.appoint.error = ''; updateAppointMatch(); }
      if (id === 'appointName') { state.appoint.name = e.target.value; state.appoint.error = ''; updateAppointMatch(); }
      if (id === 'appointPhone') { state.appoint.phone = e.target.value; state.appoint.error = ''; updateAppointMatch(); }
      if (id === 'dismissConfirmName') { state.dismiss.confirmName = e.target.value; updateDismissButton(); }
      if (state.form.crop && ['cropZoom', 'cropX', 'cropY'].includes(id)) {
        if (id === 'cropZoom') state.form.crop.zoom = Number(e.target.value);
        if (id === 'cropX') state.form.crop.x = Number(e.target.value);
        if (id === 'cropY') state.form.crop.y = Number(e.target.value);
        drawCropPreview();
      }
    });

    document.getElementById('frame').addEventListener('change', (e) => {
      const id = e.target.id;
      if (id === 'fPhotoInput') handleAlbumFiles(e.target.files);
      if (id === 'fQrInput') handleQrFile(e.target.files && e.target.files[0]);
      if (id === 'appointWechatQrInput') handleMonitorWechatQrFile(e.target.files && e.target.files[0]);
      if (id === 'fVideoInput') handleVideoFile(e.target.files && e.target.files[0]);
      if (id === 'resignDate') {
        state.resignTeacher.date = e.target.value || TODAY;
        state.resignTeacher.cleared = false;
        renderAll();
      }
      if (id === 'resignCleared') {
        state.resignTeacher.cleared = e.target.checked;
        const btn = $('btnResignTeacher');
        if (btn) btn.disabled = !e.target.checked;
      }
      if (e.target.matches('[data-rebind-teacher]')) {
        const tid = e.target.dataset.rebindTeacher;
        state.rebind.teacherIds = e.target.checked
          ? [...new Set([...state.rebind.teacherIds, tid])]
          : state.rebind.teacherIds.filter((x) => x !== tid);
        state.rebind.error = '';
        updateRebindButton();
      }
      if (e.target.matches('[data-rebind-class]')) {
        const cid = e.target.dataset.rebindClass;
        state.rebind.classIds = e.target.checked
          ? [...new Set([...state.rebind.classIds, cid])]
          : state.rebind.classIds.filter((x) => x !== cid);
        state.rebind.error = '';
        updateRebindButton();
      }
      if (id === 'dismissFunds') {
        state.dismiss.fundsCleared = e.target.checked;
        state.dismiss.error = '';
        renderOverlayOnly();
      }
      if (id === 'dismissEdu') {
        state.dismiss.eduCleared = e.target.checked;
        state.dismiss.error = '';
        renderOverlayOnly();
      }
    });

    /* ------------------------------------------------------------------
     * 相册拖拽排序
     * ------------------------------------------------------------------ */
    let draggingPhotoId = null;

    document.getElementById('frame').addEventListener('dragstart', (e) => {
      const card = e.target.closest('[data-photo-id]');
      if (!card || state.page !== 'teacherForm') return;
      draggingPhotoId = card.dataset.photoId;
      card.classList.add('opacity-50');
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', draggingPhotoId); } catch (err) { /* noop */ }
      }
    });

    document.getElementById('frame').addEventListener('dragend', (e) => {
      const card = e.target.closest('[data-photo-id]');
      if (card) card.classList.remove('opacity-50');
      draggingPhotoId = null;
    });

    document.getElementById('frame').addEventListener('dragover', (e) => {
      if (state.page !== 'teacherForm' || !draggingPhotoId) return;
      const card = e.target.closest('[data-photo-id]');
      if (!card) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    });

    document.getElementById('frame').addEventListener('drop', (e) => {
      if (state.page !== 'teacherForm') return;
      const card = e.target.closest('[data-photo-id]');
      if (!card) return;
      e.preventDefault();
      const fromId = draggingPhotoId || (e.dataTransfer ? e.dataTransfer.getData('text/plain') : '');
      draggingPhotoId = null;
      if (fromId) reorderFormPhoto(fromId, card.dataset.photoId);
    });

    document.addEventListener('keydown', (e) => {
      if (!state.overlay || state.overlay.type !== 'photo') return;
      const t = teacherById(state.activeTeacherId);
      const total = (t && t.photos && t.photos.length) || 0;
      if (e.key === 'Escape') {
        state.overlay = null;
        renderOverlayOnly();
      } else if (total > 1 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        e.preventDefault();
        state.overlay.index = (state.overlay.index + (e.key === 'ArrowRight' ? 1 : -1) + total) % total;
        renderOverlayOnly();
      }
    });

    /* ------------------------------------------------------------------
     * 导航与提示
     * ------------------------------------------------------------------ */
    function navTo(tab) {
      if (state.role === 'admin' && tab === 'settings') return setView('monitors');
      if (state.role === 'monitor' && tab === 'ops') return setView('teachers');
      state.page = 'placeholder';
      state.navTab = tab;
      state.overlay = null;
      renderAll();
    }

    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    /* 原型演示导航折叠（§8.5） */
    const NAV_COLLAPSE_KEY = 'dream_proto_nav_collapsed';

    function navCollapsedPref() {
      try { return localStorage.getItem(NAV_COLLAPSE_KEY) === '1'; } catch (e) { return false; }
    }

    function saveNavCollapsed(collapsed) {
      try { localStorage.setItem(NAV_COLLAPSE_KEY, collapsed ? '1' : '0'); } catch (e) { /* 静默降级 */ }
    }

    function applyNavCollapsed(collapsed) {
      const header = $('console');
      const mini = document.querySelector('[data-console-mini]');
      if (!header || !mini) return;
      header.classList.toggle('hidden', collapsed);
      mini.classList.toggle('hidden', !collapsed);
      mini.classList.toggle('flex', collapsed);
    }

    const consoleCollapseBtn = document.querySelector('[data-console-collapse]');
    const consoleExpandBtn = document.querySelector('[data-console-expand]');
    if (consoleCollapseBtn) consoleCollapseBtn.addEventListener('click', () => { saveNavCollapsed(true); applyNavCollapsed(true); });
    if (consoleExpandBtn) consoleExpandBtn.addEventListener('click', () => { saveNavCollapsed(false); applyNavCollapsed(false); });

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
    applyNavCollapsed(navCollapsedPref());

    const focusTarget = params.get('focus');
    if (focusTarget) {
      setTimeout(() => {
        const el = document.getElementById(focusTarget);
        if (!el) return;
        const content = document.getElementById('content');
        if (content && content.contains(el)) {
          const delta = el.getBoundingClientRect().top - content.getBoundingClientRect().top;
          content.scrollTop = Math.max(0, content.scrollTop + delta - 4);
        } else {
          el.scrollIntoView({ block: 'center' });
        }
      }, 600);
    }
  </script>
</body>
</html>

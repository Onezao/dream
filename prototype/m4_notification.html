      if (minutes < 60) return { zh: `${minutes}分钟前`, en: `${minutes} min${minutes > 1 ? 's' : ''} ago` };
      if (minutes < 1440) {
        const hours = Math.floor(minutes / 60);
        return { zh: `${hours}小时前`, en: `${hours} hour${hours > 1 ? 's' : ''} ago` };
      }
      if (minutes < 2880) return { zh: '昨天', en: 'Yesterday' };

      const d = new Date(MOCK_NOW_UTC - minutes * 60000);

    function channelLabel(n) {
      if (n.internal) return '仅内部';
      if (n.emailStatus === 'SENT') return '邮件已发';
      if (n.emailStatus === 'PENDING') return '邮件待补发';
      if (n.emailStatus === 'PERMANENT_FAILED') return '邮件失败';
      if (n.level === 'L2' && n.read) return '已读免补发';
      return '仅站内信';
    }

    function channelColor(n) {
      if (n.internal) return 'text-rose-700';
      if (n.emailStatus === 'SENT') return 'text-emerald-700';
      if (n.emailStatus === 'PENDING') return 'text-amber-700';
      if (n.emailStatus === 'PERMANENT_FAILED') return 'text-rose-700';
      if (n.level === 'L2' && n.read) return 'text-emerald-700';
      return 'text-slate-400';
    }

      if (n.internal) return `<span class="inline-flex items-center gap-1 font-semibold text-rose-700">${icon('lock', 'h-3.5 w-3.5')}仅内部</span>`;
      if (n.emailStatus === 'SENT') return `<span class="inline-flex items-center gap-1 font-semibold text-emerald-700">${icon('mail-check', 'h-3.5 w-3.5')}邮件已发</span>`;
      if (n.emailStatus === 'PENDING') return `<span class="inline-flex items-center gap-1 font-semibold text-amber-700">${icon('clock', 'h-3.5 w-3.5')}邮件待补发</span>`;
      if (n.emailStatus === 'PERMANENT_FAILED') return `<span class="inline-flex items-center gap-1 font-semibold text-rose-700">${icon('mail-x', 'h-3.5 w-3.5')}邮件永久失败</span>`;

            <button data-action="filter-status" data-value="all" class="h-8 rounded-full border px-3 text-[12px] font-bold transition ${filterChip(state.statusFilter === 'all')}">${tr('statusAll')}</button>
            <button data-action="filter-status" data-value="unread" class="h-8 rounded-full border px-3 text-[12px] font-bold transition ${filterChip(state.statusFilter === 'unread')}">${tr('unreadOnly')} (${unread})</button>
          </div>
          <div class="mt-1.5 flex flex-wrap items-center gap-1.5" role="group" aria-label="category filter">
            <button data-action="filter-category" data-value="all" class="h-8 rounded-full border px-3 text-[12px] font-bold transition ${filterChip(state.categoryFilter === 'all')}">${tr('allTypes')}</button>
            <button data-action="filter-category" data-value="schedule" class="h-8 rounded-full border px-3 text-[12px] font-bold transition ${filterChip(state.categoryFilter === 'schedule')}">📅 ${tr('catSchedule')}</button>
            <button data-action="filter-category" data-value="billing" class="h-8 rounded-full border px-3 text-[12px] font-bold transition ${filterChip(state.categoryFilter === 'billing')}">💳 ${tr('catBilling')}</button>
          </div>
        </div>`;
    }

    /* ---- 分支 A：120 字以内直读卡片 ---- */
    function shortNoticeCard(n) {
      const level = LEVEL_META[n.level];
      const rel = relative(n.minutesAgo);
      const unread = !n.read;
      return `
        <article data-action="mark-read" data-id="${n.id}" class="cursor-pointer rounded-2xl border p-3.5 shadow-sm transition active:scale-[0.995] ${unread ? 'border-slate-200 bg-white' : 'border-slate-100 bg-slate-50/80'}">
          <div class="flex items-start gap-2.5">
            <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full ${unread ? 'bg-indigo-600' : 'bg-slate-200'}"></span>
            <div class="min-w-0 flex-1">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <h3 class="text-[16px] font-bold leading-snug text-slate-900">${esc(n.titleZh)}</h3>
                  <p class="mt-0.5 text-[12px] leading-tight text-slate-400">${esc(n.titleEn)}</p>
                </div>
                <span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${level.cls}">${level.zh}</span>
              </div>
              <div class="mt-1 flex flex-wrap items-center gap-2 text-[12px] font-medium text-slate-400">
                <span>${rel.zh} / ${rel.en}</span>
                ${unread ? '' : `<span class="rounded-full bg-slate-100 px-1.5 py-0.5 font-bold text-slate-500">${tr('read')}</span>`}
              </div>
              <p class="mt-1.5 text-[14px] leading-relaxed text-slate-700">${esc(n.bodyZh)}</p>
              <p class="mt-1 text-[12px] leading-relaxed text-slate-500">${esc(n.bodyEn)}</p>
              <div class="mt-2.5 flex items-end justify-between gap-2 border-t border-slate-100 pt-2">
                <div class="flex min-w-0 flex-wrap items-center gap-2 text-[12px]">
                  ${categoryChip(n)}
                  <span class="inline-flex items-center gap-1 text-slate-500">${icon('inbox', 'h-3.5 w-3.5 text-slate-400')}站内信</span>
                  ${emailBadge(n)}
                </div>
                ${quickActionButton(n)}
              </div>
            </div>
          </div>
        </article>`;
    }

    /* ---- 分支 B：120 字及以上摘要跳转型卡片 ---- */
    function longNoticeCard(n) {
      const level = LEVEL_META[n.level];
      const rel = relative(n.minutesAgo);
      const unread = !n.read;
      return `
        <article data-action="open-detail" data-id="${n.id}" class="cursor-pointer rounded-2xl border p-3.5 shadow-sm transition active:scale-[0.995] ${unread ? 'border-indigo-200 bg-white ring-1 ring-indigo-100' : 'border-slate-100 bg-slate-50/80'}">
          <div class="flex items-start gap-2.5">
            <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full ${unread ? 'bg-indigo-600' : 'bg-slate-200'}"></span>
            <div class="min-w-0 flex-1">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <h3 class="text-[16px] font-bold leading-snug text-slate-900">${esc(n.titleZh)}</h3>
                  <p class="mt-0.5 text-[12px] leading-tight text-slate-400">${esc(n.titleEn)}</p>
                </div>
                <span class="shrink-0 rounded-full border px-2 py-0.5 text-[12px] font-bold ${level.cls}">${level.zh}</span>
              </div>
              <div class="mt-1 flex flex-wrap items-center gap-2 text-[12px] font-medium text-slate-400">
                <span>${rel.zh} / ${rel.en}</span>
                ${unread ? '' : `<span class="rounded-full bg-slate-100 px-1.5 py-0.5 font-bold text-slate-500">${tr('read')}</span>`}
              </div>
              <p class="mt-1.5 text-[14px] leading-relaxed text-slate-700">${esc(summaryZh(n, 80))}</p>
              <div class="mt-2.5 flex items-end justify-between gap-2 border-t border-slate-100 pt-2">
                <div class="flex min-w-0 flex-wrap items-center gap-2 text-[12px]">
                  ${categoryChip(n)}
                  <span class="inline-flex items-center gap-1 text-slate-500">${icon('inbox', 'h-3.5 w-3.5 text-slate-400')}站内信</span>
                </div>
                <span class="shrink-0 text-[12px] font-bold text-indigo-600">${tr('viewDetail')} &gt;</span>
              </div>
            </div>
          </div>
        </article>`;
    }

    function renderNotificationList() {
      const list = filteredNotices();
      const empty = `
        <div class="mt-8 rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-12 text-center">
          <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-slate-50 text-slate-300">${icon('inbox', 'h-6 w-6')}</div>
          <p class="mt-3 text-[14px] font-bold text-slate-700">${tr('noMatch')}</p>
          <p class="mt-0.5 text-[12px] text-slate-400">No matching notifications</p>
          <button data-action="reset-filters" class="mt-3 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-[12px] font-semibold text-slate-600 transition hover:bg-slate-50">重置筛选 / Reset filters</button>
        </div>`;
      return `
        <div class="mx-auto w-full max-w-[640px] px-4 py-3 pb-10">
          ${renderListFilters()}
          <div class="mt-3 space-y-2.5">
            ${list.length ? list.map((n) => (isLongNotice(n) ? longNoticeCard(n) : shortNoticeCard(n))).join('') : empty}
          </div>
          ${list.length ? `<footer class="pb-2 pt-5 text-center text-[12px] font-medium text-slate-400">${tr('loaded')}</footer>` : ''}
        </div>`;
    }

    /* ---- 详情页 ---- */
    function detailTable(lang = 'zh') {
      const headers = lang === 'en' ? BATCH_TABLE.headersEn : BATCH_TABLE.headersZh;
      return `
        <div class="mt-3 overflow-x-auto rounded-xl border border-slate-200">
          <table class="w-full min-w-[520px] border-collapse text-left text-[12px]">
            <thead>
              <tr class="border-b border-slate-200 bg-slate-50">
                ${headers.map((h) => `<th class="px-2.5 py-2 font-bold text-slate-700">${esc(h)}</th>`).join('')}
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${BATCH_TABLE.rows.map((row) => `
                <tr class="hover:bg-slate-50/60">
                  ${row[lang].map((cell) => `<td class="whitespace-nowrap px-2.5 py-2 text-slate-700">${esc(cell)}</td>`).join('')}
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <p class="mt-1 text-right text-[12px] text-slate-400">左右滑动查看完整排期 / Swipe to see all columns</p>`;
    }

    function genericDetailBlock(n) {
      const level = LEVEL_META[n.level];
      return `
        <div class="mt-3 grid grid-cols-2 gap-2 border-t border-slate-100 pt-3 text-[12px]">
          <div class="rounded-lg bg-slate-50 p-2">
            <div class="text-slate-400">发送时间 / Sent</div>
            <div class="mt-0.5 font-semibold text-slate-700">${absoluteTime(n.minutesAgo)}</div>
          </div>
          <div class="rounded-lg bg-slate-50 p-2">
            <div class="text-slate-400">通知等级 / Level</div>
            <div class="mt-0.5 font-semibold text-slate-700">${level.zh} · ${level.en}</div>
          </div>
        </div>`;
    }

    function detailCtaLabel(n) {
      const lang = currentLang();
      if (n.action && n.action.type === 'schedule') {
        if (lang === 'en') return 'View Schedule';
        return state.role === 'amy' ? '查看孩子课表' : '查看课表';
      }
      if (n.action && n.action.type === 'memo') return lang === 'en' ? 'View Message Board' : '查看留言板';
      return lang === 'en' ? 'Got it' : '知道了';
    }

    function detailCtaIcon(n) {
      if (n.action && n.action.type === 'schedule') return 'calendar-days';
      if (n.action && n.action.type === 'memo') return 'message-square';
      return 'check';
    }

    function renderNotificationDetail() {
      const n = findNotice(state.selectedNoticeId);
      if (!n) {
        return `<div class="p-8 text-center text-[14px] font-medium text-slate-400">${tr('noMessages')}</div>`;
      }
      const level = LEVEL_META[n.level];
      const rel = relative(n.minutesAgo);
      const cat = CATEGORY_META[n.category] || CATEGORY_META.system;
      const isBatch = n.template === 'batch';
      return `
        <div class="mx-auto w-full max-w-[640px] px-4 py-4 pb-8">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <span class="rounded-full border px-2.5 py-1 text-[12px] font-bold ${level.cls}">${level.zh} · ${level.en}</span>
            <span class="inline-flex items-center gap-1 rounded-full border border-emerald-200 bg-emerald-50 px-2 py-1 text-[12px] font-bold text-emerald-700">${icon('check', 'h-3.5 w-3.5')}${tr('read')}</span>
          </div>

          <div class="mt-3 text-[12px] font-medium text-slate-400">${absoluteTime(n.minutesAgo)} · ${rel.zh} / ${rel.en}</div>
          <div class="mt-1 flex items-center gap-1.5 text-[12px] font-semibold text-indigo-600">${cat.icon} ${esc(cat.zh)} / ${esc(cat.en)}</div>

          <h1 class="mt-3 text-[18px] font-bold leading-snug text-slate-900">${esc(n.titleZh)}</h1>
          <p class="mt-1 text-[14px] font-semibold text-slate-500">${esc(n.titleEn)}</p>

          <section class="mt-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <p class="whitespace-pre-line text-[14px] leading-relaxed text-slate-700">${esc(n.bodyZh)}</p>
            ${isBatch ? detailTable('zh') : genericDetailBlock(n)}
          </section>

          <div class="my-5 flex items-center gap-2">
            <span class="h-px flex-1 bg-slate-200"></span>
            <span class="whitespace-nowrap text-[12px] font-bold text-slate-400">English Version Below</span>
            <span class="h-px flex-1 bg-slate-200"></span>
          </div>

          <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <p class="text-[12px] font-bold text-slate-400">${esc(n.titleEn)}</p>
            <p class="mt-2 whitespace-pre-line text-[14px] leading-relaxed text-slate-600">${esc(n.bodyEn)}</p>
            ${isBatch ? detailTable('en') : ''}
          </section>

          <button data-action="detail-cta" data-id="${n.id}" class="mt-5 flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 text-[16px] font-bold text-white shadow-sm transition hover:bg-indigo-700 active:scale-[0.99]">
            ${icon(detailCtaIcon(n), 'h-5 w-5')}${detailCtaLabel(n)}
          </button>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 全部已读确认
     * ------------------------------------------------------------------ */
    function renderConfirm() {
      const root = $('confirmRoot');
      if (!state.confirmRead) {
        root.innerHTML = '';
        return;
      }
      const unread = unreadCount();
      const lang = currentLang();
      const body = lang === 'en'
        ? `All ${unread} unread messages on this account will be marked as read. The bell badge will be cleared.`
        : `将当前账号的 ${unread} 条未读消息全部置为已读，顶部铃铛红点将清零。此操作不可撤销。`;
      const sub = lang === 'en'
        ? `将当前账号的 ${unread} 条未读消息全部置为已读。`
        : `All ${unread} unread messages will be marked as read.`;

      root.innerHTML = `
        <div class="absolute inset-0 z-[70] flex items-center justify-center p-4">
          <div data-action="close-confirm" class="absolute inset-0 bg-slate-900/60 backdrop-blur-[1px]"></div>
          <div class="relative w-full max-w-xs space-y-3.5 rounded-3xl border border-slate-200 bg-white p-5 shadow-2xl">
            <div class="space-y-1 text-center">
              <div class="mx-auto grid h-11 w-11 place-items-center rounded-2xl border border-indigo-100 bg-indigo-50 text-indigo-600 shadow-sm">${icon('check-check', 'h-5 w-5')}</div>
              <h4 class="text-[16px] font-bold text-slate-900">${tr('markAll')}</h4>
              <p class="text-[12px] text-slate-400">Mark All as Read</p>
            </div>
            <p class="text-[14px] leading-relaxed text-slate-600">${body}</p>
            <p class="text-[12px] leading-relaxed text-slate-400">${sub}</p>
            <div class="flex gap-2.5 pt-1">
              <button data-action="close-confirm" class="h-11 flex-1 rounded-xl bg-slate-100 text-[16px] font-semibold text-slate-700 transition hover:bg-slate-200">${tr('cancel')}</button>
              <button data-action="mark-all-read" class="h-11 flex-1 rounded-xl bg-indigo-600 text-[16px] font-bold text-white shadow-sm transition hover:bg-indigo-700">${tr('confirmRead')}</button>
            </div>
          </div>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 渲染
     * ------------------------------------------------------------------ */
    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;

      const contentEl = $('content');
      const contentTop = contentEl.scrollTop;

      $('offlineBanner').className = state.online === 'off'
        ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900'
        : 'hidden';

      if (state.page === 'notifications') {
        $('topbar').innerHTML = renderListTopbar();
        contentEl.innerHTML = renderNotificationList();
        $('bottomnav').innerHTML = '';
      } else if (state.page === 'detail') {
        $('topbar').innerHTML = renderDetailTopbar();
        contentEl.innerHTML = renderNotificationDetail();
        $('bottomnav').innerHTML = '';
      } else {
        $('topbar').innerHTML = renderTopbar();
        contentEl.innerHTML = state.page === 'workspace'
          ? (state.role === 'sarah' ? renderAdminConsole() : renderNotificationHome())
          : renderPlaceholder();
        $('bottomnav').innerHTML = renderNav();
      }

      renderConfirm();
      syncConsole();

      contentEl.scrollTop = contentTop;
      ico();
    }

    /* ------------------------------------------------------------------
     * 交互
     * ------------------------------------------------------------------ */
    function setRole(role) {
      if (!ROLE_META[role]) return;
      state.role = role;
      state.page = 'workspace';
      state.navTab = ROLE_META[role].boardTab;
      state.selectedNoticeId = null;
      state.statusFilter = 'all';
      state.categoryFilter = 'all';
      state.listScrollTop = 0;
      state.confirmRead = false;
      state.force99 = false;
      state.lang = 'zh';
      renderAll();
      $('content').scrollTop = 0;
      toast(`已切换到${ROLE_META[role].label}`);
    }

    function setDevice(device) {
      state.device = device;
      renderAll();
    }

    function setOnline(online) {
      state.online = online;
      if (online === 'off') state.confirmRead = false;
      renderAll();
      toast(online === 'off'
        ? '离线只读：仅展示端内缓存通知，标为已读与邮件重试需联网生效'
        : '网络已恢复，通知通道在线');
    }

    function navTo(tab) {
      const item = (NAVS[state.role] || []).find((n) => n.id === tab);
      if (!item) return;
      state.navTab = tab;
      state.page = item.board ? 'workspace' : 'placeholder';
      state.selectedNoticeId = null;
      state.confirmRead = false;
      renderAll();
      $('content').scrollTop = 0;
    }

    /* ---- 双页流转：工作台 → 列表 → 详情 ---- */
    function openNotifications() {
      state.page = 'notifications';
      state.selectedNoticeId = null;
      state.statusFilter = 'all';
      state.categoryFilter = 'all';
      state.listScrollTop = 0;
      state.confirmRead = false;
      renderAll();
      $('content').scrollTop = 0;
    }

    function backToWorkspace() {
      state.page = 'workspace';
      state.selectedNoticeId = null;
      state.listScrollTop = 0;
      state.confirmRead = false;
      renderAll();
      $('content').scrollTop = 0;
    }

    function openDetail(id) {
      const notice = findNotice(id);
      if (!notice) return;
      if (state.page === 'notifications') state.listScrollTop = $('content').scrollTop;
      notice.read = true; // 进入详情页立即核销未读
      state.selectedNoticeId = id;
      state.page = 'detail';
      state.confirmRead = false;
      renderAll();
      $('content').scrollTop = 0;
      if (state.online === 'off') toast('离线模式：端内已标已读，联网后同步');
    }

    function backToList() {
      state.page = 'notifications';
      state.selectedNoticeId = null;
      renderAll();
      $('content').scrollTop = state.listScrollTop;
    }

    function setListStatus(value) {
      state.statusFilter = value;
      state.listScrollTop = 0;
      renderAll();
      $('content').scrollTop = 0;
    }

    function setListCategory(value) {
      state.categoryFilter = value;
      state.listScrollTop = 0;
      renderAll();
      $('content').scrollTop = 0;
    }

    function resetListFilters() {
      state.statusFilter = 'all';
      state.categoryFilter = 'all';
      state.listScrollTop = 0;
      renderAll();
      $('content').scrollTop = 0;
    }

    function markRead(id) {
      const notice = findNotice(id);
      if (!notice || notice.read) return;
      notice.read = true;
      renderAll();
      toast(state.online === 'off' ? '离线模式：端内已标已读，联网后同步' : '已标为已读');
    }

    function quickAction(id) {
      const notice = findNotice(id);
      if (!notice) return;
      if (notice.action && notice.action.type === 'email') {
        openDetail(id);
        return;
      }
      notice.read = true;
      if (notice.action && notice.action.type === 'schedule') {
        navTo('schedule');
        toast('已跳转至学生课表视图');
        return;
      }
      renderAll();
      if (notice.action && notice.action.type === 'memo') {
        toast('已打开学生公开留言板（原型演示）');
      } else {
        toast(state.online === 'off' ? '离线模式：端内已标已读，联网后同步' : '已标为已读');
      }
    }

    function handleDetailCta(id) {
      const notice = findNotice(id);
      if (!notice) return;
      if (notice.action && notice.action.type === 'schedule') {
        navTo('schedule');
        toast('已跳转至学生课表视图');
        return;
      }
      if (notice.action && notice.action.type === 'memo') {
        toast('已打开学生公开留言板（原型演示）');
        return;
      }
      toast('已确认收到通知');
    }

    function openConfirmAll() {
      if (state.online === 'off') {
        toast('离线模式只读：无法执行一键标为已读');
        return;
      }
      if (unreadCount() === 0) {
        toast('当前没有未读消息');
        return;
      }
      state.confirmRead = true;
      renderAll();
    }

    function closeConfirmAll() {
      state.confirmRead = false;
      renderAll();
    }

    function markAllRead() {
      if (state.online === 'off') {
        toast('离线模式只读：无法同步状态');
        return;
      }
      noticeList().forEach((n) => { n.read = true; });
      state.confirmRead = false;
      if (state.statusFilter === 'unread') state.listScrollTop = 0;
      renderAll();
      toast('已将当前账号全部消息标为已读');
    }

    function simulateWorkerScan() {
      if (state.online === 'off') {
        toast('离线模式：后台 Worker 无法向网关推送邮件');
        return;
      }
      const hits = [];
      Object.keys(state.notices).forEach((role) => {
        noticeList(role).forEach((n) => {
          if (n.level === 'L2' && !n.read && n.emailStatus === 'PENDING' && n.minutesAgo >= 30) {
            n.emailStatus = 'SENT';
            n.emailNote = 'Worker 扫描命中，已补发中英双语邮件并原子回写 email_sent。';
            n.action = { type: 'email', labelZh: '查看兜底邮件', labelEn: 'View Fallback Email' };
            hits.push(`${role} · ${n.titleZh}`);
          }
        });
      });
      state.workerLog = hits.length
        ? `10:35 扫描命中 ${hits.length} 条二级必达记录，已委托 task-relay 补发。`
        : '10:35 扫描 0 条命中，未发现超过 30 分钟未读的二级必达记录。';
      renderAll();
      toast(hits.length ? `Worker 已补发 ${hits.length} 封中英双语邮件` : '本次扫描无命中记录');
    }

    function simulateInternalNote() {
      const id = Date.now();
      ['david', 'leo', 'sarah'].forEach((role) => {
        if (!state.notices[role]) return;
        state.notices[role].unshift({
          id: `${role}-internal-${id}`,
          category: 'system', level: 'L1', read: false, minutesAgo: 0,
          titleZh: '内部教学备忘', titleEn: 'Internal Teaching Note',
          bodyZh: 'AliceZ12 近期注意力易分散，建议课堂前 5 分钟做口部热身。本留言仅内部教学可见。',
          bodyEn: 'AliceZ12 has recently shown a shorter attention span. A 5-minute warm-up is recommended. This note is internal teaching only.',
          emailStatus: 'NONE', emailNote: '隐私防火墙：家长端零站内信、零邮件。',
          internal: true, action: { type: 'none', labelZh: '', labelEn: '' }, template: 'internal'
        });
      });
      state.blockedParentRoutes += 1;
      renderAll();
      toast('内部留言已派发教师、班长与管理员，家长端物理隔离 0 站内信 0 邮件');
    }

    function simulateNetworkRecover() {
      const task = state.relayTasks.find((t) => t.status === 'RETRYING');
      if (!task) {
        toast('当前没有重试中的邮件任务');
        return;
      }
      task.status = 'SENT';
      task.attempt = Math.min(3, task.attempt + 1);
      task.next = '-';
      task.error = '';
      renderAll();
      toast('网络恢复，TaskRelay 重试成功');
    }

    function simulateAgainFail() {
      const task = state.relayTasks.find((t) => t.status === 'RETRYING');
      if (!task) {
        toast('当前没有重试中的邮件任务');
        return;
      }
      task.attempt += 1;
      if (task.attempt >= 3) {
        task.status = 'PERMANENT_FAILED';
        task.next = '-';
        task.error = 'EMAIL_GATEWAY_THROTTLED';
        toast('连续 3 次重试失败，已标记 PERMANENT_FAILED');
      } else {
        task.next = '15 分钟后';
        toast(`第 ${task.attempt} 次重试仍失败，按退避策略继续`);
      }
      renderAll();
    }

    function retryPermanent() {
      if (state.online === 'off') {
        toast('离线模式无法重新入队');
        return;
      }
      const task = state.relayTasks.find((t) => t.status === 'PERMANENT_FAILED');
      if (!task) {
        toast('当前没有永久失败任务');
        return;
      }
      task.status = 'RETRYING';
      task.attempt = 1;
      task.next = '1 分钟后';
      task.error = 'EMAIL_GATEWAY_THROTTLED';
      renderAll();
      toast('永久失败任务已重新压入 task-relay 队列');
    }

    function toggleForce99() {
      state.force99 = !state.force99;
      renderAll();
      toast(state.force99 ? '铃铛角标已模拟显示 99+' : '铃铛角标已恢复真实未读数');
    }

    function toggleLang() {
      if (state.role !== 'david') return;
      state.lang = state.lang === 'zh' ? 'en' : 'zh';
      renderAll();
      toast(state.lang === 'zh' ? '已切换为中文' : 'Language: English');
    }

    function resetDemo() {
      state = initialState();
      renderAll();
      toast('演示数据已重置');
    }

    /* ------------------------------------------------------------------
     * 事件绑定
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'device') setDevice(value);
        if (group === 'online') setOnline(value);
      });
    });

    $('btnOpenCenter').addEventListener('click', openNotifications);
    $('btnScanWorker').addEventListener('click', simulateWorkerScan);
    $('btnInternalNote').addEventListener('click', simulateInternalNote);
    $('btnToggle99').addEventListener('click', toggleForce99);
    $('btnResetDemo').addEventListener('click', resetDemo);

    $('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      const id = el.dataset.id;

      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'open-notifications') return openNotifications();
      if (action === 'back-workspace') return backToWorkspace();
      if (action === 'back-to-list') return backToList();
      if (action === 'open-detail') return openDetail(id);
      if (action === 'filter-status') return setListStatus(el.dataset.value);
      if (action === 'filter-category') return setListCategory(el.dataset.value);
      if (action === 'reset-filters') return resetListFilters();
      if (action === 'mark-read') return markRead(id);
      if (action === 'quick-action') return quickAction(id);
      if (action === 'detail-cta') return handleDetailCta(id);
      if (action === 'open-confirm') return openConfirmAll();
      if (action === 'close-confirm') return closeConfirmAll();
      if (action === 'mark-all-read') return markAllRead();
      if (action === 'scan-worker') return simulateWorkerScan();
      if (action === 'internal-note') return simulateInternalNote();
      if (action === 'simulate-recover') return simulateNetworkRecover();
      if (action === 'simulate-fail') return simulateAgainFail();
      if (action === 'requeue') return retryPermanent();
      if (action === 'toggle-99') return toggleForce99();
      if (action === 'toggle-lang') return toggleLang();
    });

    /* ------------------------------------------------------------------
     * 首屏
     * ------------------------------------------------------------------ */
    renderAll();
  </script>
</body>
</html>

let S = initialState();
let toastTimer = null;

const $ = (id) => document.getElementById(id);

function initialState() {

function ico() {

function toast(message) {
  const el = $('toast');
  $('toastText').textContent = message;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
}

function relative(minutes) {
  if (minutes < 1) return { zh: '刚刚', en: 'just now' };
  if (minutes < 60) return { zh: `${minutes}分钟前`, en: `${minutes} mins ago` };
  if (minutes < 1440) {
    const hours = Math.floor(minutes / 60);
    return { zh: `${hours}小时前`, en: `${hours} hours ago` };
  }
  if (minutes < 2880) return { zh: '昨天', en: 'Yesterday' };
  const days = Math.floor(minutes / 1440);
  return { zh: `${days}天前`, en: `${days} days ago` };
}

function unreadCount(role = S.role) {
  return (S.notices[role] || []).filter((n) => !n.read).length;
}

function badgeText(role = S.role) {
  if (S.force99) return '99+';
  const count = unreadCount(role);
  if (count <= 0) return '';
  return count > 99 ? '99+' : String(count);
}

function pendingMandatoryCount() {
  let count = 0;
  Object.keys(S.notices).forEach((role) => {
    S.notices[role].forEach((n) => {
      if (n.level === 'L2' && !n.read && !n.emailSent && n.minutesAgo >= 30) count += 1;
    });
  });
  return count;
}

function findNotice(id) {
  const list = S.notices[S.role] || [];
  const current = list.find((n) => n.id === id);
  if (current) return current;
  for (const role of Object.keys(S.notices)) {
    const found = S.notices[role].find((n) => n.id === id);
    if (found) return found;
  }
  return null;
}

  S.emailNoticeId = null;

function noticeAction(id) {
  const notice = findNotice(id);

  notice.read = true;
  if (notice.action.type === 'email') {

  }
  renderAll();
  if (notice.action.type === 'memo') toast('已打开学生留言板（原型演示）');

function simulateWorkerScan() {
  const hits = [];
  Object.keys(S.notices).forEach((role) => {
    S.notices[role].forEach((n) => {
      if (n.level === 'L2' && !n.read && !n.emailSent && n.minutesAgo >= 30) {
        n.emailSent = true;
        n.emailStatus = 'SENT';
        n.emailNote = 'Worker 扫描命中，已补发中英双语邮件并原子回写 email_sent。';
        n.channels = ['inapp', 'email'];
        n.action = { type: 'email', labelZh: '查看兜底邮件', labelEn: 'View Fallback Email' };
        hits.push(`${role} · ${n.titleZh}`);
      }
    });
  });
  S.workerLog = hits.length
    ? `10:35 扫描命中 ${hits.length} 条二级必达记录，已委托 task-relay 补发。`
    : '10:35 扫描 0 条命中，未发现超过 30 分钟未读的二级必达记录。';
  renderAll();
  toast(hits.length ? `Worker 已补发 ${hits.length} 封中英双语邮件` : '本次扫描无命中记录');
}

function simulateNetworkRecover() {
  const task = S.relayTasks.find((t) => t.status === 'RETRYING');
  if (!task) {
    toast('当前没有重试中的邮件任务');
    return;
  }
  task.status = 'SENT';
  task.attempt = Math.min(3, task.attempt + 1);
  task.next = '-';
  task.error = '';
  renderAll();
  toast('网络恢复，TaskRelay 重试成功');
}

function simulateAgainFail() {
  const task = S.relayTasks.find((t) => t.status === 'RETRYING');
  if (!task) {
    toast('当前没有重试中的邮件任务');
    return;
  }
  task.attempt += 1;
  if (task.attempt >= 3) {
    task.status = 'PERMANENT_FAILED';
    task.next = '-';
    task.error = 'EMAIL_GATEWAY_THROTTLED';
    toast('连续 3 次重试失败，已标记 PERMANENT_FAILED');
  } else {
    task.next = '15 分钟后';
    toast(`第 ${task.attempt} 次重试仍失败，按退避策略继续`);
  }
  renderAll();
}

function retryPermanent() {
  const task = S.relayTasks.find((t) => t.status === 'PERMANENT_FAILED');
  if (!task) {
    toast('当前没有永久失败任务');
    return;
  }
  task.status = 'RETRYING';
  task.attempt = 1;
  task.next = '1 分钟后';
  task.error = 'EMAIL_GATEWAY_THROTTLED';
  renderAll();
  toast('永久失败任务已重新压入 task-relay 队列');
}

        <div class="flex items-center justify-between text-[10px] text-slate-600"><span>未读站内信</span><span>保留 180 天 · 当前 37 条</span></div>
        <div class="flex items-center justify-between text-[10px] text-slate-400"><span>下次清理</span><span>每日 02:00</span></div>

      <div class="rounded-2xl border border-slate-200 bg-white p-3 space-y-1.5">

function renderContent() {
  $('content').innerHTML = S.role === 'sarah' ? adminDashboard() : workspaceContent();
}

function renderAll() {
  const contentEl = $('content');
  const contentTop = contentEl && typeof contentEl.scrollTop === 'number' ? contentEl.scrollTop : 0;
  const drawerEl = document.querySelector('[data-drawer-scroll]');
  const drawerTop = drawerEl ? drawerEl.scrollTop : 0;

  renderControls();
  renderHeader();
  renderContent();
  renderDrawer();
  renderConfirm();
  renderEmail();

  const nextContent = $('content');
  if (nextContent && typeof nextContent.scrollTop === 'number') nextContent.scrollTop = contentTop;
  const nextDrawer = document.querySelector('[data-drawer-scroll]');
  if (nextDrawer) nextDrawer.scrollTop = drawerTop;

  ico();
}

renderAll();
</script>

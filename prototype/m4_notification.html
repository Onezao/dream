    const RELAY_TASKS = [
      { id: 'RT-1001', notice: '代课通知邮件 · Amy', status: 'sent', attempt: 1, next: '-', note: '已送达' },
      { id: 'RT-1002', notice: '代课通知邮件 · David', status: 'retrying', attempt: 1, next: '约 5 分钟后', note: '网络波动，自动重发中' },

    /* ------------------------------------------------------------------
     * 状态与工具
     * ------------------------------------------------------------------ */
    function initialState() {
      return {
        role: 'amy', device: 'mobile', online: 'on', page: 'workspace', navTab: 'home',
        statusFilter: 'all', categoryFilter: 'all',
        expandedIds: [], stickyReadIds: [],
        force99: false, confirmRead: false,
        workerLog: '10:35 检查完成，已补发 1 条提醒。',
        blockedParentRoutes: 3,
        notices: JSON.parse(JSON.stringify(NOTICES)),
        relayTasks: JSON.parse(JSON.stringify(RELAY_TASKS))
      };
    }

    let state = initialState();
    const $ = (id) => document.getElementById(id);
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const ico = () => { if (window.lucide) window.lucide.createIcons(); };

    function roleMeta() { return ROLE_META[state.role]; }
    function noticeList(role = state.role) { return state.notices[role] || []; }
    function sortedNotices(role = state.role) { return noticeList(role).slice().sort((a, b) => a.minutesAgo - b.minutesAgo); }
    function unreadCount(role = state.role, category = 'all') {
      return noticeList(role).filter((n) => !n.read && (category === 'all' || n.category === category)).length;
    }

    function badgeText() {
      if (state.force99) return '99+';
      const count = unreadCount();
      if (count <= 0) return '';
      return count > 99 ? '99+' : String(count);
    }

    function currentNavItem() {
      return (NAVS[state.role] || []).find((n) => n.id === state.navTab) || null;
    }

    function findNotice(id) {
      const own = noticeList().find((n) => n.id === id);
      if (own) return own;
      for (const role of Object.keys(state.notices)) {
        const found = noticeList(role).find((n) => n.id === id);
        if (found) return found;
      }
      return null;
    }

    function filteredNotices() {
      let list = sortedNotices();
      if (state.statusFilter === 'unread') list = list.filter((n) => !n.read || state.stickyReadIds.includes(n.id));
      if (state.categoryFilter !== 'all') list = list.filter((n) => n.category === state.categoryFilter);
      return list;
    }

    function pendingReminderCount() {
      return state.relayTasks.filter((t) => t.status !== 'sent').length;
    }

    function relative(minutes) {
      if (minutes < 1) return '刚刚';
      if (minutes < 60) return `${minutes} 分钟前`;
      if (minutes < 1440) return `${Math.floor(minutes / 60)} 小时前`;
      if (minutes < 2880) return '昨天';
      return `${Math.floor(minutes / 1440)} 天前`;
    }

    function isLongNotice(n) { return n.long === true; }
    function summaryZh(n, size = 90) {
      const arr = Array.from(String(n.bodyZh || ''));
      return arr.slice(0, size).join('') + (arr.length > size ? '…' : '');
    }
    function toneKey(n) { return TONES[n.tone] ? n.tone : 'slate'; }

    function categoryChip(n, tone) {
      const cat = CATEGORY_META[n.category] || CATEGORY_META.schedule;
      return `<span class="inline-flex items-center gap-1 text-[12px] font-medium ${TONES[tone].sub}">${cat.icon} ${esc(cat.shortZh)}</span>`;
    }

    function pinIfNeeded(n) {
      if (state.statusFilter === 'unread' && !state.stickyReadIds.includes(n.id)) state.stickyReadIds.push(n.id);
    }

    function toast(message) {
      const el = $('toast');
      el.textContent = message;
      el.classList.remove('hidden');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => el.classList.add('hidden'), 2600);
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((btn) => {
        const active = state[btn.dataset.group] === btn.dataset.value;
        btn.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;
      });
    }

    /* ------------------------------------------------------------------
     * URL 参数（便于直接演示指定状态）
     * ------------------------------------------------------------------ */
    const params = new URLSearchParams(location.search);
    if (params.get('role') && ROLE_META[params.get('role')]) {
      state.role = params.get('role');
      state.navTab = ROLE_META[state.role].boardTab;
    }
    if (params.get('device') === 'tablet') state.device = 'tablet';
    if (params.get('online') === 'off') state.online = 'off';
    if (params.get('page') === 'notifications') state.page = 'notifications';
    if (params.get('filter') === 'unread') state.statusFilter = 'unread';
    {
      const cat = params.get('category');
      if (cat && CATEGORY_META[cat]) state.categoryFilter = cat;
    }
    if (params.get('allread') === '1') noticeList().forEach((n) => { n.read = true; });
    if (params.get('expand')) {
      params.get('expand').split(',').forEach((id) => {
        const n = findNotice(id);
        if (n) {
          if (!state.expandedIds.includes(id)) state.expandedIds.push(id);
          if (state.online === 'on') n.read = true;
        }
      });
    }
    if (params.get('confirm') === '1') state.confirmRead = true;

    /* ------------------------------------------------------------------
     * Banner / 导航
     * ------------------------------------------------------------------ */
    function renderBanner() {
      const r = roleMeta();
      const isNotifications = state.page === 'notifications';
      const navItem = currentNavItem();
      const title = isNotifications ? '消息中心' : (state.page === 'placeholder' ? (navItem ? navItem.label : '工作台') : r.brand);
      const badge = badgeText();
      const left = isNotifications
        ? `<button data-action="back-workspace" aria-label="返回" class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25">${icon('chevron-left', 'h-5 w-5')}</button>`
        : `<span class="grid h-9 w-9 shrink-0 place-items-center rounded-2xl bg-white/20 text-[14px] font-bold ring-1 ring-white/30">${r.initial}</span>`;
      const right = isNotifications
        ? `<div class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20" aria-label="未读消息">
            ${icon('bell', 'h-4 w-4')}
            ${badge ? `<span class="absolute -right-1 -top-1 flex h-[18px] min-w-[18px] items-center justify-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white/70">${badge}</span>` : ''}
          </div>`
        : `<button data-action="open-notifications" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/20 transition hover:bg-white/25" aria-label="消息中心">
            ${icon('bell', 'h-4 w-4')}
            ${badge ? `<span class="absolute -right-1 -top-1 flex h-[18px] min-w-[18px] items-center justify-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white/70">${badge}</span>` : ''}
          </button>`;
      return `<header class="relative flex h-16 shrink-0 items-center justify-between gap-3 overflow-hidden bg-gradient-to-br ${r.banner} px-4 text-white">
        ${r.pattern}
        <div class="relative flex min-w-0 items-center gap-2.5">
          ${left}
          <h1 class="truncate text-[18px] font-bold tracking-tight">${esc(title)}</h1>
        </div>
        ${right}
      </header>`;
    }

    function renderNav() {
      const items = NAVS[state.role] || [];
      const unread = unreadCount();
      const relayAlert = state.relayTasks.filter((t) => t.status !== 'sent').length;
      return `
        <div class="relative z-40 border-t border-slate-200 bg-white px-1 pb-1.5 pt-1">
          <div class="mx-auto flex w-full max-w-[640px] items-stretch justify-around">
            ${items.map((item) => {
              const on = state.navTab === item.id;
              let dot = '';
              if (item.id === roleMeta().boardTab && unread > 0) dot = '<span class="absolute -right-1 top-0 h-2 w-2 rounded-full bg-rose-500 ring-2 ring-white"></span>';
              else if (item.id === 'settings' && relayAlert > 0) dot = '<span class="absolute -right-1 top-0 h-2 w-2 rounded-full bg-amber-500 ring-2 ring-white"></span>';
              return `<button data-action="nav" data-tab="${item.id}" class="flex min-w-0 flex-1 flex-col items-center gap-0.5 rounded-xl py-1 transition ${on ? 'font-bold text-indigo-600' : 'font-medium text-slate-400'}">
                <span class="relative">${icon(item.icon, `h-[18px] w-[18px] ${on ? '' : 'opacity-80'}`)}${dot}</span>
                <span class="text-[12px] font-bold leading-tight">${esc(item.label)}</span>
              </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 工作台 / 管理端
     * ------------------------------------------------------------------ */
    function pageHeader(title, subtitle) {
      return `<div class="px-1">
        <h1 class="text-[18px] font-bold tracking-tight text-slate-900">${esc(title)}</h1>
        <p class="mt-0.5 text-[12px] font-medium text-slate-400">${esc(subtitle)}</p>
      </div>`;
    }

    function miniStat(label, value, tone) {
      const T = TONES[tone];
      return `<div class="rounded-xl border px-2.5 py-2 ${T.card}">
        <div class="text-[12px] font-medium ${T.sub}">${esc(label)}</div>
        <div class="mt-0.5 font-mono text-[18px] font-bold ${T.title}">${esc(value)}</div>
      </div>`;
    }

    function miniNoticeRow(n) {
      const tone = toneKey(n);
      const T = TONES[tone];

    /* ------------------------------------------------------------------

    function renderTableZh(table) {

          <thead><tr class="border-b border-slate-200 bg-slate-50">${table.headersZh.map((h, i) => `<th class="whitespace-nowrap px-0.5 py-2 first:pl-1.5 last:pr-1.5 font-bold text-slate-700 ${i === table.headersZh.length - 2 ? 'pr-1' : ''}">${esc(h)}</th>`).join('')}</tr></thead>
          <tbody class="divide-y divide-slate-100">${table.rows.map((row) => `<tr class="hover:bg-slate-50/60">${row.zh.map((cell, i) => `<td class="whitespace-nowrap px-0.5 py-2 first:pl-1.5 last:pr-1.5 text-slate-700 ${i === row.zh.length - 2 ? 'pr-1' : ''}">${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody>

    function renderTableEn(table) {
      return `<div class="mt-2 overflow-x-auto rounded-xl border border-slate-200">

    function deliveryBlock(n) {

              <div class="flex min-w-0 flex-wrap items-center gap-2">

                  ? `<button data-action="toggle-expand" data-id="${n.id}" class="text-[12px] font-bold ${T.title}">${expanded ? '收起明细 ▴' : '展开明细 ▾'}</button>`
                  : `<span class="text-[12px] font-medium ${T.sub}">${unread ? '点击卡片标为已读' : '已读'}</span>`}
              </div>
              ${hasAction ? actionButton(n, tone) : ''}
            </div>
          </div>
        </div>
      </article>`;
    }

          </div>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderContent() {
      if (state.page === 'notifications') return renderNotificationList();
      if (state.page === 'placeholder') return renderPlaceholder();
      return renderWorkspace();
    }

    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;
      const contentEl = $('content');
      const top = contentEl.scrollTop;
      $('banner').innerHTML = renderBanner();
      $('offlineBanner').className = state.online === 'off' ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900' : 'hidden';
      $('offlineBanner').innerHTML = state.online === 'off' ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线只读：可查看缓存消息；标为已读与邮件重发需联网` : '';
      contentEl.innerHTML = renderContent();
      $('bottomnav').innerHTML = state.page === 'notifications' ? '' : renderNav();
      renderConfirm();
      syncConsole();
      contentEl.scrollTop = top;
      ico();
    }

    /* ------------------------------------------------------------------
     * 交互
     * ------------------------------------------------------------------ */
    function setRole(role) {
      if (!ROLE_META[role]) return;
      state.role = role;
      state.page = 'workspace';
      state.navTab = ROLE_META[role].boardTab;
      state.statusFilter = 'all';
      state.categoryFilter = 'all';
      state.expandedIds = [];
      state.stickyReadIds = [];
      state.confirmRead = false;
      state.force99 = false;
      renderAll();
      $('content').scrollTop = 0;
      toast(`已切换到${ROLE_META[role].label}`);
    }

    function navTo(tab) {
      const item = (NAVS[state.role] || []).find((n) => n.id === tab);
      if (!item) return;
      state.navTab = tab;
      state.page = item.board ? 'workspace' : 'placeholder';
      state.confirmRead = false;
      renderAll();
      $('content').scrollTop = 0;
    }

    function openNotifications() {
      state.page = 'notifications';
      state.statusFilter = 'all';
      state.categoryFilter = 'all';
      state.expandedIds = [];
      state.stickyReadIds = [];
      state.confirmRead = false;
      renderAll();
      $('content').scrollTop = 0;
    }

    function backToWorkspace() {
      state.page = 'workspace';
      state.confirmRead = false;
      state.expandedIds = [];
      state.stickyReadIds = [];
      renderAll();
      $('content').scrollTop = 0;
    }

    function setListStatus(value) {
      state.statusFilter = value;
      state.stickyReadIds = [];
      renderAll();
      $('content').scrollTop = 0;
    }

    function setListCategory(value) {
      state.categoryFilter = value;
      state.stickyReadIds = [];
      renderAll();
      $('content').scrollTop = 0;
    }

    function resetListFilters() {
      state.statusFilter = 'all';
      state.categoryFilter = 'all';
      state.stickyReadIds = [];
      renderAll();
      $('content').scrollTop = 0;
    }

    function markRead(id) {
      if (state.online === 'off') return toast('离线只读：标为已读需联网');
      const notice = findNotice(id);
      if (!notice || notice.read) return;
      pinIfNeeded(notice);
      notice.read = true;
      renderAll();
      toast('已标为已读');
    }

    function toggleExpand(id) {
      const notice = findNotice(id);
      if (!notice) return;
      const wasExpanded = state.expandedIds.includes(id);
      const wasUnread = !notice.read;
      if (!wasExpanded && state.online === 'on' && wasUnread) {
        pinIfNeeded(notice);
        notice.read = true;
      }
      if (wasExpanded) state.expandedIds = state.expandedIds.filter((x) => x !== id);
      else state.expandedIds.push(id);
      renderAll();
      if (state.online === 'off') toast('离线只读：可展开查看，已读状态需联网同步');
      else if (!wasExpanded && wasUnread) toast('已标为已读');
    }

    function runAction(id) {
      if (state.online === 'off') return toast('离线只读：消息操作需联网');
      const notice = findNotice(id);
      if (!notice) return;
      if (!notice.read) {
        pinIfNeeded(notice);
        notice.read = true;
      }
      if (notice.action && notice.action.type === 'retry' && notice.delivery) {
        notice.delivery.status = 'retrying';
        notice.delivery.note = '已重新发送，等待投递结果。';
      }
      const messages = {
        classroom: '已进入 ClassIn 教室',
        schedule: '已打开学生课表',
        book: '已打开约课大厅',
        billing: '已打开购课与账单',
        renew: '已打开续费单',
        memo: '已打开留言板',
        feedback: '已打开课后反馈',
        retry: '邮件已重新发送，正在投递',
        todo: '已打开待处理事项'
      };
      renderAll();
      toast(messages[notice.action ? notice.action.type : ''] || '已处理');
    }

    function openConfirmAll() {
      if (state.online === 'off') return toast('离线只读：暂时无法批量标为已读');
      if (unreadCount() === 0) return toast('当前没有未读消息');
      state.confirmRead = true;
      renderAll();
    }

    function closeConfirmAll() {
      state.confirmRead = false;
      renderAll();
    }

    function markAllRead() {
      if (state.online === 'off') return toast('离线只读：暂时无法同步已读状态');
      noticeList().forEach((n) => { n.read = true; });
      state.confirmRead = false;
      state.expandedIds = [];
      state.stickyReadIds = [];
      renderAll();
      $('content').scrollTop = 0;
      toast('全部消息已标为已读');
    }

    function simulateWorkerScan() {
      if (state.online === 'off') return toast('离线模式：暂时无法补发提醒');
      const hits = [];
      Object.keys(state.notices).forEach((role) => {
        noticeList(role).forEach((n) => {
          if (n.delivery && n.delivery.status === 'retrying') {
            n.delivery.status = 'sent';
            n.delivery.note = '检查命中，已补发并送达。';
            hits.push(n.titleZh);
          }
        });
      });
      state.relayTasks.forEach((t) => {
        if (t.status === 'retrying') {
          t.status = 'sent';
          t.attempt = Math.min(3, t.attempt + 1);
          t.next = '-';
          t.note = '检查命中，已送达';
        }
      });
      state.workerLog = hits.length ? `10:35 检查完成，已补发 ${hits.length} 条提醒。` : '10:35 检查完成，当前没有待补发提醒。';
      renderAll();
      toast(hits.length ? `已补发 ${hits.length} 条提醒` : '本次检查没有待补发提醒');
    }

    function simulateInternalNote() {
      if (state.online === 'off') return toast('离线模式：暂时无法新增教学备忘');
      const id = Date.now();
      ['david', 'leo', 'sarah'].forEach((role) => {
        if (!state.notices[role]) return;
        state.notices[role].unshift({
          id: `${role}-note-${id}`,
          category: 'schedule', tone: 'slate', read: false, minutesAgo: 0,
          titleZh: '教学备忘', titleEn: 'Teaching Note',
          bodyZh: 'AliceZ12 近期注意力易分散，建议课堂前 5 分钟做口部热身。',
          bodyEn: 'AliceZ12 has recently shown a shorter attention span. A 5-minute warm-up before class is recommended.',
          action: { type: 'memo', labelZh: '查看留言' }
        });
      });
      state.blockedParentRoutes += 1;
      renderAll();
      toast('教学备忘已发送给教师与班长，家长不会收到通知');
    }

    function simulateNetworkRecover() {
      const task = state.relayTasks.find((t) => t.status === 'retrying');
      if (!task) return toast('当前没有重发中的邮件');
      task.status = 'sent';
      task.attempt = Math.min(3, task.attempt + 1);
      task.next = '-';
      task.note = '网络恢复，已送达';
      Object.keys(state.notices).forEach((role) => noticeList(role).forEach((n) => {
        if (n.delivery && n.delivery.status === 'retrying') {
          n.delivery.status = 'sent';
          n.delivery.note = '网络恢复，已送达。';
        }
      }));
      renderAll();
      toast('网络恢复，邮件已送达');
    }

    function retryPermanent() {
      if (state.online === 'off') return toast('离线模式：暂时无法重新发送');
      const task = state.relayTasks.find((t) => t.status === 'failed');
      if (!task) return toast('当前没有失败的邮件');
      task.status = 'retrying';
      task.attempt = 1;
      task.next = '约 5 分钟后';
      task.note = '已重新发送，等待结果';
      Object.keys(state.notices).forEach((role) => noticeList(role).forEach((n) => {
        if (n.delivery && n.delivery.status === 'failed') {
          n.delivery.status = 'retrying';
          n.delivery.note = '已重新发送，等待投递结果。';
        }
      }));
      renderAll();
      toast('失败邮件已重新发送');
    }

    function toggleForce99() {
      state.force99 = !state.force99;
      renderAll();
      toast(state.force99 ? '铃铛角标已显示 99+' : '铃铛角标已恢复真实未读数');
    }

    function resetDemo() {
      state = initialState();
      renderAll();
      $('content').scrollTop = 0;
      toast('演示数据已重置');
    }

    /* ------------------------------------------------------------------
     * 事件绑定
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.confirmRead = false;
          renderAll();
          toast(value === 'off' ? '离线只读：标为已读与邮件重发需联网' : '网络已恢复，消息服务在线');
        }
      });
    });

    $('btnOpenCenter').addEventListener('click', openNotifications);
    $('btnScanWorker').addEventListener('click', simulateWorkerScan);
    $('btnInternalNote').addEventListener('click', simulateInternalNote);
    $('btnToggle99').addEventListener('click', toggleForce99);
    $('btnResetDemo').addEventListener('click', resetDemo);

    $('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      const id = el.dataset.id;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'open-notifications') return openNotifications();
      if (action === 'back-workspace') return backToWorkspace();
      if (action === 'filter-status') return setListStatus(el.dataset.value);
      if (action === 'filter-category') return setListCategory(el.dataset.value);
      if (action === 'reset-filters') return resetListFilters();
      if (action === 'mark-read') return markRead(id);
      if (action === 'toggle-expand') return toggleExpand(id);
      if (action === 'run-action') return runAction(id);
      if (action === 'open-confirm') return openConfirmAll();
      if (action === 'close-confirm') return closeConfirmAll();
      if (action === 'mark-all-read') return markAllRead();
      if (action === 'scan-worker') return simulateWorkerScan();
      if (action === 'internal-note') return simulateInternalNote();
      if (action === 'simulate-recover') return simulateNetworkRecover();
      if (action === 'requeue') return retryPermanent();
      if (action === 'toggle-99') return toggleForce99();
    });

    function scrollToExpandedCard() {
      const firstId = params.get('expand').split(',')[0];
      const card = document.querySelector(`#content [data-id="${firstId}"]`);
      if (!card) return;
      const content = $('content');
      const sticky = content.querySelector('.sticky');
      const offset = (sticky ? sticky.offsetHeight : 0) + 12;
      const cardTop = card.getBoundingClientRect().top - content.getBoundingClientRect().top + content.scrollTop;
      content.scrollTop = Math.max(0, cardTop - offset);
    }

    renderAll();
    if (params.get('expand')) {
      scrollToExpandedCard();
      requestAnimationFrame(() => requestAnimationFrame(scrollToExpandedCard));
      setTimeout(scrollToExpandedCard, 700);
    }
  </script>
</body>
</html>

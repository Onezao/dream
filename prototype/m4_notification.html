    function initialState() {

        blockedParentRoutes: 3,

        relayTasks: JSON.parse(JSON.stringify(RELAY_TASKS))
      };
    }

    let state = initialState();
    const $ = (id) => document.getElementById(id);
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const ico = () => { if (window.lucide) window.lucide.createIcons(); };

    const params = new URLSearchParams(location.search);
    if (params.get('role') && ROLE_META[params.get('role')]) {
      state.role = params.get('role');
      state.navTab = ROLE_META[state.role].boardTab;
    }
    if (params.get('device') === 'tablet') state.device = 'tablet';
    {
      const initialItem = (NAVS[state.role] || []).find((n) => n.id === state.navTab);
      state.page = initialItem && initialItem.board ? 'workspace' : 'placeholder';
    }

    function roleMeta() { return ROLE_META[state.role]; }
    function noticeList(role = state.role) { return state.notices[role] || []; }
    function sortedNotices(role = state.role) { return noticeList(role).slice().sort((a, b) => a.minutesAgo - b.minutesAgo); }
    function unreadCount(role = state.role) { return noticeList(role).filter((n) => !n.read).length; }

    function badgeText() {
      if (state.force99) return '99+';
      const count = unreadCount();
      if (count <= 0) return '';
      return count > 99 ? '99+' : String(count);
    }

    function pendingMandatoryCount() {
      let count = 0;
      Object.keys(state.notices).forEach((role) => {
        noticeList(role).forEach((n) => {
          if (n.level === 'L2' && !n.read && n.emailStatus === 'PENDING' && n.minutesAgo >= 30) count += 1;
        });
      });
      return count;
    }

    function findNotice(id) {
      const own = noticeList().find((n) => n.id === id);
      if (own) return own;
      for (const role of Object.keys(state.notices)) {
        const found = noticeList(role).find((n) => n.id === id);
        if (found) return found;
      }
      return null;
    }

    function filteredNotices() {
      let list = sortedNotices();
      if (state.statusFilter === 'unread') list = list.filter((n) => !n.read);
      if (state.categoryFilter !== 'all') list = list.filter((n) => n.category === state.categoryFilter);
      return list;
    }

    function relative(minutes) {
      if (minutes < 1) return '刚刚';
      if (minutes < 60) return `${minutes} 分钟前`;
      if (minutes < 1440) return `${Math.floor(minutes / 60)} 小时前`;
      if (minutes < 2880) return '昨天';
      return `${Math.floor(minutes / 1440)} 天前`;
    }

    const MOCK_NOW_UTC = Date.UTC(2026, 10, 8, 10, 35);
    function absoluteTime(minutes) {
      const d = new Date(MOCK_NOW_UTC - minutes * 60000);
      const pad = (v) => String(v).padStart(2, '0');
      return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
    }

    function isLongNotice(n) { return Array.from(String(n.bodyZh || '')).length >= 120; }
    function summaryZh(n, size = 80) { return Array.from(String(n.bodyZh || '')).slice(0, size).join('') + '...'; }

    function toneKey(n) {
      if (n.internal || n.read) return 'slate';
      if (n.level === 'L3') return 'rose';
      if (n.level === 'L2') return 'amber';
      return 'indigo';
    }

    function levelLabel(n) { return (LEVEL_META[n.level] || LEVEL_META.L1).zh; }

    function channelLabel(n) {
      if (n.internal) return '仅内部';
      if (n.emailStatus === 'SENT') return '邮件已发';
      if (n.emailStatus === 'PENDING') return '邮件待补发';
      if (n.emailStatus === 'PERMANENT_FAILED') return '邮件失败';
      if (n.level === 'L2' && n.read) return '已读免补发';
      return '仅站内信';
    }

    function channelIcon(n) {
      if (n.internal) return 'lock';
      if (n.emailStatus === 'SENT') return 'mail-check';
      if (n.emailStatus === 'PENDING') return 'clock';
      if (n.emailStatus === 'PERMANENT_FAILED') return 'mail-x';
      return 'inbox';
    }

    function categoryChip(n, tone) {

      return `<span class="inline-flex items-center gap-1 text-[12px] font-medium ${TONES[tone].sub}">${cat.icon} ${esc(cat.zh)}</span>`;
    }

    function levelChip(n, tone) {
      const level = LEVEL_META[n.level] || LEVEL_META.L1;
      return `<span class="shrink-0 rounded-full border px-1.5 py-0.5 text-[12px] font-bold ${TONES[tone].chip}">${level.zh}</span>`;
    }

    function quickActionLabel(n) {
      if (n.action && n.action.type === 'email') return '查看详情';
      if (n.action && n.action.type !== 'none') return n.action.labelZh || '查看';
      return '标为已读';
    }

    }

      const el = $('toast');

        emailTitle = '隐私防火墙拦截';
        emailSub = '仅教师、代课教师、班长与管理员可见；家长端零站内信、零邮件';
      } else if (n.emailStatus === 'SENT') {
        emailTone = 'emerald'; emailIcon = 'mail-check';
        emailTitle = n.level === 'L3' ? '即时并发邮件已送达' : '兜底邮件已补发';
        emailSub = n.level === 'L3' ? '事务提交后 5 秒内并发派发双语邮件' : '站内信 30 分钟未读后自动补发';
      } else if (n.emailStatus === 'PENDING') {
        emailTone = 'amber'; emailIcon = 'clock';
        emailTitle = '等待 30 分钟未读兜底';
        emailSub = '后台每 5 分钟扫描；命中后补发双语邮件';
      } else if (n.emailStatus === 'PERMANENT_FAILED') {
        emailTone = 'rose'; emailIcon = 'mail-x';
        emailTitle = '邮件重试后永久失败';
        emailSub = 'TaskRelay 已重试 1 / 5 / 15 分钟；主业务与站内信不受影响';
      } else if (n.level === 'L2' && n.read) {
        emailTone = 'emerald'; emailIcon = 'check';
        emailTitle = '已读免补发';
        emailSub = '用户在 30 分钟内已阅读，系统未发送兜底邮件';
      }
      return `<section class="mt-3 rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
        <h2 class="text-[16px] font-bold text-slate-900">投递记录</h2>
        <div class="mt-3 space-y-3">
          ${deliveryStep('inbox', 'indigo', '站内信已送达', '实时推送至铃铛，未读数即时更新')}
          ${deliveryStep(emailIcon, emailTone, emailTitle, emailSub)}
          ${n.level !== 'L1' ? deliveryStep('refresh-cw', 'slate', '异步任务队列', '1 / 5 / 15 分钟指数退避，最多 3 次') : ''}
        </div>
      </section>`;
    }

    function detailCtaLabel(n) {
      if (n.action && n.action.type === 'schedule') return state.role === 'amy' ? '查看孩子课表' : '查看课表';
      if (n.action && n.action.type === 'memo') return '查看留言板';
      return '知道了';
    }

    function detailCtaIcon(n) {
      if (n.action && n.action.type === 'schedule') return 'calendar-days';
      if (n.action && n.action.type === 'memo') return 'message-square';
      return 'check';
    }

    function renderNotificationDetail() {
      const n = findNotice(state.selectedNoticeId);
      if (!n) return `<div class="p-8 text-center text-[14px] font-medium text-slate-400">暂无消息</div>`;
      const tone = toneKey(n);
      const level = LEVEL_META[n.level] || LEVEL_META.L1;
      const cat = CATEGORY_META[n.category] || CATEGORY_META.system;
      const isBatch = n.template === 'batch';
      return `<div class="mx-auto w-full max-w-[640px] px-4 py-4 pb-8">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <span class="rounded-full border px-2.5 py-1 text-[12px] font-bold ${TONES[tone].chip}">${level.zh} · ${level.en}</span>
          <span class="inline-flex items-center gap-1 rounded-full border px-2 py-1 text-[12px] font-bold ${n.read ? 'border-emerald-200 bg-emerald-50 text-emerald-700' : 'border-amber-200 bg-amber-50 text-amber-800'}">${icon(n.read ? 'check' : 'clock', 'h-3.5 w-3.5')}${n.read ? '已读' : '未读'}</span>
        </div>
        <div class="mt-3 text-[12px] font-medium text-slate-400">${absoluteTime(n.minutesAgo)} · ${relative(n.minutesAgo)}</div>
        <div class="mt-1 flex items-center gap-1.5 text-[12px] font-semibold text-indigo-700">${cat.icon} ${esc(cat.zh)} / ${esc(cat.en)}</div>
        <h1 class="mt-3 text-[18px] font-bold leading-snug text-slate-900">${esc(n.titleZh)}</h1>
        <p class="mt-1 text-[14px] font-semibold text-slate-500">${esc(n.titleEn)}</p>
        <section class="mt-4 rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
          <p class="whitespace-pre-line text-[14px] leading-relaxed text-slate-700">${esc(n.bodyZh)}</p>
          ${isBatch ? detailTable('zh') : ''}
        </section>
        <div class="my-5 flex items-center gap-2"><span class="h-px flex-1 bg-slate-200"></span><span class="whitespace-nowrap text-[12px] font-bold text-slate-400">English Version Below</span><span class="h-px flex-1 bg-slate-200"></span></div>
        <section class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
          <p class="text-[12px] font-bold text-slate-400">${esc(n.titleEn)}</p>
          <p class="mt-2 whitespace-pre-line text-[14px] leading-relaxed text-slate-600">${esc(n.bodyEn)}</p>
          ${isBatch ? detailTable('en') : ''}
        </section>
        ${deliveryTimeline(n)}
        <button data-action="detail-cta" data-id="${n.id}" class="mt-5 flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 text-[16px] font-bold text-white transition hover:bg-indigo-700">${icon(detailCtaIcon(n), 'h-5 w-5')}${detailCtaLabel(n)}</button>
      </div>`;
    }

    function renderPlaceholder() {
      const item = (NAVS[state.role] || []).find((n) => n.id === state.navTab);
      if (!item) return '<div class="p-8 text-center text-[14px] font-medium text-slate-400">页面不存在</div>';
      return `<div class="flex h-full flex-col items-center justify-center px-8 pb-10 text-center">
        <div class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-indigo-600 shadow-sm ring-1 ring-slate-200">${icon(item.icon, 'h-6 w-6')}</div>
        <h2 class="mt-4 text-[18px] font-bold text-slate-900">${esc(item.label)}</h2>
        <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-500">${esc(item.desc)}</p>
        ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener" class="mt-5 inline-flex h-11 items-center rounded-xl bg-indigo-600 px-5 text-[16px] font-semibold text-white">打开对应原型</a>` : ''}
        <button data-action="nav" data-tab="${roleMeta().boardTab}" class="mt-3 text-[14px] font-semibold text-indigo-600">返回消息中心</button>
      </div>`;
    }

    function renderConfirm() {
      const root = $('confirmRoot');
      if (!state.confirmRead) { root.innerHTML = ''; return; }
      const unread = unreadCount();
      root.innerHTML = `<div class="absolute inset-0 z-[70] flex items-center justify-center p-4">
        <div data-action="close-confirm" class="absolute inset-0 bg-slate-900/60 backdrop-blur-[1px]"></div>
        <div class="relative w-full max-w-xs space-y-3 rounded-2xl border border-slate-200 bg-white p-5 shadow-2xl">
          <div class="text-center">
            <div class="mx-auto grid h-11 w-11 place-items-center rounded-2xl border border-indigo-100 bg-indigo-50 text-indigo-700">${icon('check-check', 'h-5 w-5')}</div>
            <h4 class="mt-2 text-[16px] font-bold text-slate-900">全部标为已读</h4>
            <p class="mt-0.5 text-[12px] text-slate-400">Mark All as Read</p>
          </div>
          <p class="text-[14px] leading-relaxed text-slate-600">将当前账号的 ${unread} 条未读消息全部置为已读，顶部铃铛红点将清零。此操作不可撤销。</p>
          <div class="flex gap-2 pt-1">
            <button data-action="close-confirm" class="h-11 flex-1 rounded-xl border border-slate-200 bg-slate-100 text-[16px] font-semibold text-slate-700 hover:bg-slate-200">取消</button>
            <button data-action="mark-all-read" class="h-11 flex-1 rounded-xl bg-indigo-600 text-[16px] font-bold text-white hover:bg-indigo-700">确认全部已读</button>
          </div>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 总渲染与交互
     * ------------------------------------------------------------------ */
    function renderContent() {
      if (state.page === 'notifications') {
        const right = `<button data-action="open-confirm" ${state.online === 'off' ? 'disabled' : ''} class="rounded-lg px-2 py-1.5 text-[12px] font-bold text-indigo-700 disabled:cursor-not-allowed disabled:text-slate-300">全部标为已读</button>`;
        return `${subheader('消息中心', 'Notifications · 120 字直读', 'back-workspace', '工作台', right)}${renderNotificationList()}`;
      }
      if (state.page === 'detail') {
        return `${subheader('通知详情', '中英双语对照 · 自动标已读', 'back-to-list', '消息列表')}${renderNotificationDetail()}`;
      }
      if (state.page === 'placeholder') return renderPlaceholder();
      return state.role === 'sarah' ? renderAdminConsole() : renderWorkspace();
    }

    function renderAll() {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-slate-50 shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;
      const contentEl = $('content');
      const top = contentEl.scrollTop;
      $('banner').innerHTML = renderBanner();
      $('offlineBanner').className = state.online === 'off' ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900' : 'hidden';
      $('offlineBanner').innerHTML = state.online === 'off' ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线只读：可查看缓存通知；标为已读与邮件重试需联网` : '';
      contentEl.innerHTML = renderContent();
      $('bottomnav').innerHTML = (state.page === 'notifications' || state.page === 'detail') ? '' : renderNav();
      renderConfirm();
      syncConsole();
      contentEl.scrollTop = top;
      ico();
    }

    function setRole(role) {
      if (!ROLE_META[role]) return;
      state.role = role; if (role === 'sarah') state.device = 'mobile';
      state.page = 'workspace';
      state.navTab = ROLE_META[role].boardTab;
      state.selectedNoticeId = null;
      state.statusFilter = 'all';
      state.categoryFilter = 'all';
      state.listScrollTop = 0;
      state.confirmRead = false;
      state.force99 = false;
      renderAll();
      $('content').scrollTop = 0;
      toast(`已切换到${ROLE_META[role].label}`);
    }

    function navTo(tab) {
      const item = (NAVS[state.role] || []).find((n) => n.id === tab);
      if (!item) return;
      state.navTab = tab;
      state.page = item.board ? 'workspace' : 'placeholder';
      state.selectedNoticeId = null;
      state.confirmRead = false;
      renderAll();
      $('content').scrollTop = 0;
    }

    function openNotifications() {
      state.page = 'notifications';
      state.selectedNoticeId = null;
      state.statusFilter = 'all';
      state.categoryFilter = 'all';
      state.listScrollTop = 0;
      state.confirmRead = false;
      renderAll();
      $('content').scrollTop = 0;
    }

    function backToWorkspace() {
      state.page = 'workspace';
      state.selectedNoticeId = null;
      state.listScrollTop = 0;
      state.confirmRead = false;
      renderAll();
      $('content').scrollTop = 0;
    }

    function openDetail(id) {
      const notice = findNotice(id);
      if (!notice) return;
      if (state.page === 'notifications') state.listScrollTop = $('content').scrollTop;
      if (state.online === 'on') notice.read = true;
      state.selectedNoticeId = id;
      state.page = 'detail';
      state.confirmRead = false;
      renderAll();
      $('content').scrollTop = 0;
      if (state.online === 'off') toast('离线只读：已读状态需联网后同步');
    }

    function backToList() {
      state.page = 'notifications';
      state.selectedNoticeId = null;
      renderAll();
      $('content').scrollTop = state.listScrollTop;
    }

    function setListStatus(value) { state.statusFilter = value; state.listScrollTop = 0; renderAll(); $('content').scrollTop = 0; }
    function setListCategory(value) { state.categoryFilter = value; state.listScrollTop = 0; renderAll(); $('content').scrollTop = 0; }
    function resetListFilters() { state.statusFilter = 'all'; state.categoryFilter = 'all'; state.listScrollTop = 0; renderAll(); $('content').scrollTop = 0; }

    function markRead(id) {
      if (state.online === 'off') return toast('离线只读：标为已读需联网');
      const notice = findNotice(id);
      if (!notice || notice.read) return;
      notice.read = true;
      renderAll();
      toast('已标为已读');
    }

    function quickAction(id) {
      if (state.online === 'off') return toast('离线只读：消息操作需联网');
      const notice = findNotice(id);
      if (!notice) return;
      if (notice.action && notice.action.type === 'email') return openDetail(id);
      notice.read = true;
      if (notice.action && notice.action.type === 'schedule') { navTo('schedule'); return toast('已跳转至学生课表视图'); }
      renderAll();
      if (notice.action && notice.action.type === 'memo') return toast('已打开学生公开留言板（原型演示）');
      toast('已标为已读');
    }

    function handleDetailCta(id) {
      const notice = findNotice(id);
      if (!notice) return;
      if (notice.action && notice.action.type === 'schedule') { navTo('schedule'); return toast('已跳转至学生课表视图'); }
      if (notice.action && notice.action.type === 'memo') return toast('已打开学生公开留言板（原型演示）');
      toast('已确认收到通知');
    }

    function openConfirmAll() {
      if (state.online === 'off') return toast('离线模式只读：无法执行一键标为已读');
      if (unreadCount() === 0) return toast('当前没有未读消息');
      state.confirmRead = true;
      renderAll();
    }

    function closeConfirmAll() { state.confirmRead = false; renderAll(); }

    function markAllRead() {
      if (state.online === 'off') return toast('离线模式只读：无法同步状态');
      noticeList().forEach((n) => { n.read = true; });
      state.confirmRead = false;
      if (state.statusFilter === 'unread') state.listScrollTop = 0;
      renderAll();
      toast('已将当前账号全部消息标为已读');
    }

    function simulateWorkerScan() {
      if (state.online === 'off') return toast('离线模式：后台扫描无法推送邮件');
      const hits = [];
      Object.keys(state.notices).forEach((role) => {
        noticeList(role).forEach((n) => {
          if (n.level === 'L2' && !n.read && n.emailStatus === 'PENDING' && n.minutesAgo >= 30) {
            n.emailStatus = 'SENT';
            n.emailNote = '后台扫描命中，已补发双语兜底邮件并原子回写 email_sent。';
            n.action = { type: 'email', labelZh: '查看兜底邮件' };
            hits.push(`${role} · ${n.titleZh}`);
          }
        });
      });
      state.workerLog = hits.length ? `10:35 扫描命中 ${hits.length} 条二级必达记录，已委托异步队列补发。` : '10:35 扫描 0 条命中，未发现超过 30 分钟未读的二级必达记录。';
      renderAll();
      toast(hits.length ? `已补发 ${hits.length} 封双语兜底邮件` : '本次扫描无命中记录');
    }

    function simulateInternalNote() {
      if (state.online === 'off') return toast('离线模式：无法派发内部留言');
      const id = Date.now();
      ['david', 'leo', 'sarah'].forEach((role) => {
        if (!state.notices[role]) return;
        state.notices[role].unshift({
          id: `${role}-internal-${id}`,
          category: 'system', level: 'L1', read: false, minutesAgo: 0,
          titleZh: '内部教学备忘', titleEn: 'Internal Teaching Note',
          bodyZh: 'AliceZ12 近期注意力易分散，建议课堂前 5 分钟做口部热身。本留言仅内部教学可见。',
          bodyEn: 'AliceZ12 has recently shown a shorter attention span. A 5-minute warm-up is recommended. This note is internal teaching only.',
          emailStatus: 'NONE', emailNote: '隐私防火墙：家长端零站内信、零邮件。',
          internal: true, action: { type: 'none', labelZh: '' }, template: 'internal'
        });
      });
      state.blockedParentRoutes += 1;
      renderAll();
      toast('内部留言已派发教师、班长与管理员，家长端物理隔离 0 站内信 0 邮件');
    }

    function simulateNetworkRecover() {
      const task = state.relayTasks.find((t) => t.status === 'RETRYING');
      if (!task) return toast('当前没有重试中的邮件任务');
      task.status = 'SENT'; task.attempt = Math.min(3, task.attempt + 1); task.next = '-'; task.error = '';
      renderAll(); toast('网络恢复，异步队列重试成功');
    }

    function simulateAgainFail() {
      const task = state.relayTasks.find((t) => t.status === 'RETRYING');
      if (!task) return toast('当前没有重试中的邮件任务');
      task.attempt += 1;
      if (task.attempt >= 3) { task.status = 'PERMANENT_FAILED'; task.next = '-'; task.error = 'EMAIL_GATEWAY_THROTTLED'; toast('连续 3 次重试失败，已标记 PERMANENT_FAILED'); }
      else { task.next = '15 分钟后'; toast(`第 ${task.attempt} 次重试仍失败，按退避策略继续`); }
      renderAll();
    }

    function retryPermanent() {
      if (state.online === 'off') return toast('离线模式无法重新入队');
      const task = state.relayTasks.find((t) => t.status === 'PERMANENT_FAILED');
      if (!task) return toast('当前没有永久失败任务');
      task.status = 'RETRYING'; task.attempt = 1; task.next = '1 分钟后'; task.error = 'EMAIL_GATEWAY_THROTTLED';
      renderAll(); toast('永久失败任务已重新压入异步队列');
    }

    function toggleForce99() {
      state.force99 = !state.force99;
      renderAll();
      toast(state.force99 ? '铃铛角标已模拟显示 99+' : '铃铛角标已恢复真实未读数');
    }

    function resetDemo() {
      state = initialState();
      renderAll();
      toast('演示数据已重置');
    }

    /* ------------------------------------------------------------------
     * 事件
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') setRole(value);
        if (group === 'device') { state.device = value; renderAll(); }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.confirmRead = false;
          renderAll();
          toast(value === 'off' ? '离线只读：标为已读与邮件重试需联网' : '网络已恢复，通知通道在线');
        }
      });
    });

    $('btnOpenCenter').addEventListener('click', openNotifications);
    $('btnScanWorker').addEventListener('click', simulateWorkerScan);
    $('btnInternalNote').addEventListener('click', simulateInternalNote);
    $('btnToggle99').addEventListener('click', toggleForce99);
    $('btnResetDemo').addEventListener('click', resetDemo);

    $('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      const id = el.dataset.id;
      if (action === 'nav') return navTo(el.dataset.tab);
      if (action === 'open-notifications') return openNotifications();
      if (action === 'back-workspace') return backToWorkspace();
      if (action === 'back-to-list') return backToList();
      if (action === 'open-detail') return openDetail(id);
      if (action === 'filter-status') return setListStatus(el.dataset.value);
      if (action === 'filter-category') return setListCategory(el.dataset.value);
      if (action === 'reset-filters') return resetListFilters();
      if (action === 'mark-read') return markRead(id);
      if (action === 'quick-action') return quickAction(id);
      if (action === 'detail-cta') return handleDetailCta(id);
      if (action === 'open-confirm') return openConfirmAll();
      if (action === 'close-confirm') return closeConfirmAll();
      if (action === 'mark-all-read') return markAllRead();
      if (action === 'scan-worker') return simulateWorkerScan();
      if (action === 'internal-note') return simulateInternalNote();
      if (action === 'simulate-recover') return simulateNetworkRecover();
      if (action === 'simulate-fail') return simulateAgainFail();
      if (action === 'requeue') return retryPermanent();
      if (action === 'toggle-99') return toggleForce99();
    });

    renderAll();
  </script>
</body>
</html>

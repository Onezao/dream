    const PAGE_SIZE = 20;

    /* ------------------------------------------------------------------
     * 状态与工具
     * ------------------------------------------------------------------ */
    function initialState() {
      return {
        role: 'amy',
        device: 'mobile',
        online: 'on',
        filter: 'all',
        page: 1,
        expandedIds: [],
        force99: false,
        confirmRead: false,
        notices: JSON.parse(JSON.stringify(NOTICES))
      };
    }

    let state = initialState();
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    const icon = (name, cls = 'h-4 w-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const ico = () => { if (window.lucide) window.lucide.createIcons(); };
    const isEnglish = () => state.role === 'david';
    const listOf = (role = state.role) => state.notices[role] || [];
    const unreadCount = (role = state.role) => listOf(role).filter((item) => item.unread).length;

    function sortedList() {
      return listOf().slice().sort((a, b) => a.minutesAgo - b.minutesAgo);
    }

    function matchedList() {
      const all = sortedList();
      if (state.filter !== 'unread') return all;
      return all.filter((item) => item.unread || state.expandedIds.includes(item.id));
    }

    function visibleList() {
      return matchedList().slice(0, state.page * PAGE_SIZE);
    }

    function findNotice(id) {
      return listOf().find((item) => item.id === id) || null;
    }

    function badgeText() {
      if (state.force99) return '99+';
      const count = unreadCount();
      if (count <= 0) return '';
      return count > 99 ? '99+' : String(count);
    }

    function relative(minutes) {
      if (isEnglish()) {
        if (minutes < 1) return 'just now';
        if (minutes < 60) return `${minutes} min ago`;
        if (minutes < 1440) return `${Math.floor(minutes / 60)} hr ago`;
        if (minutes < 2880) return 'Yesterday';
        return `${Math.floor(minutes / 1440)} days ago`;
      }
      if (minutes < 1) return '刚刚';
      if (minutes < 60) return `${minutes} 分钟前`;
      if (minutes < 1440) return `${Math.floor(minutes / 60)} 小时前`;
      if (minutes < 2880) return '昨天';
      return `${Math.floor(minutes / 1440)} 天前`;
    }

    function tagLabel(tag) {
      return isEnglish() ? (TAGS_EN[tag] || tag) : tag;
    }

    function jumpLabel(jump) {
      const meta = JUMP_META[jump] || JUMP_META.schedule;
      return meta.zh;
    }

    function toast(message) {
      const el = $('toast');
      el.textContent = message;
      el.classList.remove('hidden');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => el.classList.add('hidden'), 2600);
    }

    function syncConsole() {
      document.querySelectorAll('.ctl').forEach((btn) => {
        const active = state[btn.dataset.group] === btn.dataset.value;
        btn.className = `ctl rounded-lg px-2.5 py-1.5 font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;
      });
      const toggle = $('btnToggle99');
      toggle.className = `rounded-lg border px-2.5 py-1.5 font-semibold transition ${state.force99 ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`;
    }

    /* ------------------------------------------------------------------
     * URL 参数（便于直接演示指定状态）
     * ------------------------------------------------------------------ */
    const params = new URLSearchParams(location.search);
    if (params.get('role') && ROLE_META[params.get('role')]) state.role = params.get('role');
    if (params.get('device') === 'tablet') state.device = 'tablet';
    if (params.get('online') === 'off') state.online = 'off';
    if (params.get('filter') === 'unread') state.filter = 'unread';
    if (params.get('force99') === '1') state.force99 = true;
    if (params.get('allread') === '1') listOf().forEach((item) => { item.unread = false; });
    if (params.get('expand')) {
      params.get('expand').split(',').forEach((id) => {
        const item = findNotice(id);
        if (!item) return;
        if (!state.expandedIds.includes(id)) state.expandedIds.push(id);
        if (state.online === 'on') item.unread = false;
      });
    }

    /* ------------------------------------------------------------------
     * 顶栏：返回 + 消息中心 + 铃铛 + 全部标为已读
     * ------------------------------------------------------------------ */
    function renderBanner() {
      const role = ROLE_META[state.role];
      const badge = badgeText();
      const allDone = unreadCount() === 0;
      const disabled = state.online === 'off' || allDone;
      const title = '消息中心';
      const markLabel = '全部标为已读';
      return `<header class="relative h-14 shrink-0 overflow-hidden bg-gradient-to-br ${role.banner} px-3 text-white">
        ${role.pattern}
        <div class="relative flex h-14 items-center gap-1.5">
          <button data-action="back" aria-label="返回" class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-white/10 text-white transition hover:bg-white/20 active:scale-[0.98]">
            ${icon('chevron-left', 'h-5 w-5')}
          </button>
          <div class="min-w-0 flex-1">
            <h1 class="truncate text-[18px] font-bold leading-tight tracking-tight">${title}</h1>
          </div>
          <div class="flex shrink-0 items-center gap-1.5">
            <div class="relative grid h-8 w-8 place-items-center rounded-full bg-white/15 ring-1 ring-white/20" aria-label="未读">
              ${icon('bell', 'h-4 w-4')}
              <span data-badge class="absolute -right-1 -top-1 flex h-[18px] min-w-[18px] items-center justify-center rounded-full bg-rose-500 px-1 text-[12px] font-bold leading-none text-white ring-2 ring-white/70 ${badge ? '' : 'hidden'}">${badge}</span>
            </div>
            <button data-action="mark-all" ${disabled ? 'disabled' : ''} title="${state.online === 'off' ? '离线状态不可同步已读' : (allDone ? '当前没有未读消息' : '')}" class="rounded-lg border border-white/30 bg-white/10 px-2 py-1.5 text-[12px] font-bold text-white transition hover:bg-white/20 disabled:cursor-not-allowed disabled:border-white/15 disabled:bg-transparent disabled:text-white/50">${markLabel}</button>
          </div>
        </div>
      </header>`;
    }

    /* ------------------------------------------------------------------
     * 筛选：仅「全部」与「未读 (N)」
     * ------------------------------------------------------------------ */
    function renderFilters() {
      const unread = unreadCount();
      const pill = (value, label) => {
        const active = state.filter === value;
        return `<button data-action="filter" data-value="${value}" class="h-8 shrink-0 rounded-full px-3.5 text-[12px] transition ${active ? 'bg-slate-900 font-semibold text-white shadow-sm' : 'bg-slate-100 font-medium text-slate-600 hover:bg-slate-200/80'}">${label}</button>`;
      };
      return `<div class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 px-4 py-2 backdrop-blur">
        <div class="flex items-center gap-1.5 overflow-x-auto">
          ${pill('all', '全部')}
          ${pill('unread', `未读 (${unread})`)}
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 消息卡：点击原地手风琴展开，展开即已读
     * ------------------------------------------------------------------ */
    function renderCard(item) {
      const expanded = state.expandedIds.includes(item.id);
      const unread = item.unread;
      const statusText = unread
        ? (state.online === 'off' ? '离线状态不可同步已读' : '未读')
        : '已读';
      const statusCls = unread && state.online === 'off' ? 'text-amber-800' : 'text-slate-600';
      const englishBody = item.body && item.bilingual ? item.body : '';
      const chineseBody = item.bodyZh || item.body;
      const languageLabel = '中文';
      return `<article data-action="toggle" data-id="${item.id}" aria-expanded="${expanded}" class="cursor-pointer rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3.5 transition active:scale-[0.995] ${state.device === 'tablet' && expanded ? 'col-span-2' : ''}">
        <div class="flex items-start gap-2.5">
          <span data-dot class="mt-1.5 h-2 w-2 shrink-0 rounded-full ${unread ? 'bg-blue-500' : 'bg-transparent'}"></span>
          <div class="min-w-0 flex-1">
            <div class="flex items-center justify-between gap-2">
              <span class="inline-flex min-w-0 items-center rounded-md bg-slate-100 px-1.5 py-0.5 text-[12px] font-bold text-slate-700">[${esc(tagLabel(item.tag))}]</span>
              <span class="flex shrink-0 items-center gap-1 text-[12px] font-medium text-slate-600">
                ${relative(item.minutesAgo)}
                <i data-lucide="chevron-down" class="h-3.5 w-3.5 text-slate-600 transition-transform duration-300 ${expanded ? 'rotate-180' : ''}"></i>
              </span>
            </div>
            <h3 class="mt-1 text-[16px] font-bold leading-snug text-slate-900">${esc(item.title)}</h3>
            ${item.titleZh ? `<p class="mt-0.5 text-[12px] font-medium leading-tight text-slate-600">${esc(item.titleZh)}</p>` : ''}
            <div data-body="${item.id}" class="grid ${expanded ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'} transition-[grid-template-rows] duration-300 ease-out">
              <div class="min-h-0 overflow-hidden">
                <div class="mt-2 border-t border-slate-200/70 pt-2">
                  <p class="whitespace-pre-line text-[14px] font-medium leading-relaxed text-slate-700">${esc(englishBody || chineseBody)}</p>
                  ${englishBody ? `<div class="my-2 flex items-center gap-2"><span class="h-px flex-1 bg-slate-200"></span><span class="whitespace-nowrap text-[12px] font-bold text-slate-600">${languageLabel}</span><span class="h-px flex-1 bg-slate-200"></span></div>
                  <p class="whitespace-pre-line text-[14px] font-medium leading-relaxed text-slate-700">${esc(chineseBody)}</p>` : ''}
                  <div class="mt-2.5 flex flex-wrap items-center justify-between gap-2">
                    <span class="min-w-0 text-[12px] font-medium ${statusCls}">${statusText}</span>
                    <div class="flex shrink-0 items-center gap-2">
                      ${unread && state.online === 'off'
                        ? `<button disabled title="离线状态不可同步已读" class="cursor-not-allowed rounded-lg border border-slate-200 bg-slate-100 px-2 py-1 text-[12px] font-semibold text-slate-500">标为已读</button>`
                        : ''}
                      <button data-action="goto" data-id="${item.id}" class="text-[13px] font-semibold text-indigo-600 transition hover:text-indigo-700 hover:underline">前往查看 →</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </article>`;
    }

    function renderEmpty() {
      return `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/70 px-6 py-12 text-center">
        <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-white text-slate-600">${icon('inbox', 'h-6 w-6')}</div>
        <p class="mt-3 text-[14px] font-bold text-slate-700">这里暂无未读消息</p>
        <p class="mt-1 text-[12px] font-medium leading-relaxed text-slate-600">最近 90 天的关键邮件提醒会显示在消息中心。</p>
        <button data-action="show-all" class="mt-3 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-[12px] font-semibold text-slate-800 transition hover:bg-slate-50">查看全部</button>
      </div>`;
    }

    function renderList() {
      const visible = visibleList();
      const matched = matchedList();
      const remaining = matched.length - visible.length;
      const tablet = state.device === 'tablet';
      const retention = '仅保留最近 90 天';
      return `<div class="mx-auto w-full max-w-[720px] px-4 pb-8">
        ${renderFilters()}
        <div class="mt-3 ${tablet ? 'grid grid-cols-2 gap-2' : 'space-y-2'}">
          ${visible.length ? visible.map(renderCard).join('') : renderEmpty()}
        </div>
        <footer class="pt-5 text-center">
          ${remaining > 0 ? `<button data-action="load-more" class="mb-2 w-full rounded-xl border border-slate-300 bg-white py-2.5 text-[12px] font-bold text-slate-800 transition hover:bg-slate-50">加载更多 (还有 ${remaining} 条)</button>` : ''}
          <p class="text-[12px] font-medium text-slate-600">共 ${matched.length} 条</p>
          <p class="mt-0.5 text-[12px] font-medium text-slate-600">${retention}</p>
        </footer>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 全部标为已读确认
     * ------------------------------------------------------------------ */
    function renderConfirm() {
      const root = $('confirmRoot');
      if (!state.confirmRead) { root.innerHTML = ''; return; }
      const unread = unreadCount();
      root.innerHTML = `<div data-action="close-confirm" class="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/45 p-4">
        <div data-action="noop" class="w-full max-w-[320px] rounded-2xl bg-white p-4 shadow-2xl">
          <h2 class="text-[16px] font-bold text-slate-900">全部标为已读？</h2>
          <p class="mt-2 text-[14px] font-medium leading-relaxed text-slate-700">将把 ${unread} 条未读消息标为已读，铃铛红点会同步隐藏。</p>
          <div class="mt-4 grid grid-cols-2 gap-2">
            <button data-action="close-confirm" class="h-11 rounded-xl border border-slate-300 bg-white text-[14px] font-bold text-slate-800 transition hover:bg-slate-50">取消</button>
            <button data-action="confirm-all" class="h-11 rounded-xl bg-indigo-600 text-[14px] font-bold text-white transition hover:bg-indigo-700">确认全部已读</button>
          </div>
        </div>
      </div>`;
    }

    /* ------------------------------------------------------------------
     * 总渲染
     * ------------------------------------------------------------------ */
    function renderAll(options = {}) {
      const frame = $('frame');
      frame.className = `relative flex shrink-0 flex-col overflow-hidden rounded-3xl bg-white shadow-2xl ring-1 ring-slate-300 transition-all duration-300 ${state.device === 'tablet' ? 'h-[860px] w-[768px]' : 'h-[812px] w-[390px]'}`;
      $('banner').innerHTML = renderBanner();
      $('offlineBanner').className = state.online === 'off' ? 'flex shrink-0 items-center gap-2 border-b border-amber-200 bg-amber-50 px-4 py-2 text-[12px] font-semibold text-amber-900' : 'hidden';
      $('offlineBanner').innerHTML = state.online === 'off' ? `${icon('wifi-off', 'h-4 w-4 shrink-0 text-amber-600')} 离线状态不可同步已读 · 可查看与展开` : '';
      const content = $('content');
      const top = options.resetScroll ? 0 : content.scrollTop;
      content.innerHTML = renderList();
      renderConfirm();
      syncConsole();
      content.scrollTop = top;
      ico();
    }

    /* ------------------------------------------------------------------
     * 交互
     * ------------------------------------------------------------------ */
    function setRole(role) {
      if (!ROLE_META[role]) return;
      state.role = role;
      state.filter = 'all';
      state.page = 1;
      state.expandedIds = [];
      state.force99 = false;
      state.confirmRead = false;
      renderAll({ resetScroll: true });
      toast(`已切换到${ROLE_META[role].label}`);
    }

    function toggleExpand(id) {
      const item = findNotice(id);
      if (!item) return;
      const opening = !state.expandedIds.includes(id);
      if (!opening) {
        const body = document.querySelector(`[data-body="${id}"]`);
        if (body) {
          body.classList.remove('grid-rows-[1fr]');
          body.classList.add('grid-rows-[0fr]');
        }
        state.expandedIds = state.expandedIds.filter((value) => value !== id);
        setTimeout(() => renderAll(), 220);
        return;
      }

      state.expandedIds.push(id);
      const wasUnread = item.unread;
      if (wasUnread && state.online === 'on') item.unread = false;
      renderAll();
      const body = document.querySelector(`[data-body="${id}"]`);
      if (body) {
        body.classList.remove('grid-rows-[1fr]');
        body.classList.add('grid-rows-[0fr]');
        void body.offsetHeight;
        body.classList.remove('grid-rows-[0fr]');
        body.classList.add('grid-rows-[1fr]');
      }
      if (wasUnread) {
        toast(state.online === 'off' ? '离线状态不可同步已读' : '已标为已读');
      }
    }

    function goTo(id) {
      const item = findNotice(id);
      if (!item) return;
      if (item.unread && state.online === 'on') {
        item.unread = false;
        renderAll();
      }
      const target = jumpLabel(item.jump);
      toast(`正在前往${target}…`);
    }

    function setFilter(value) {
      if (value !== 'all' && value !== 'unread') return;
      state.filter = value;
      state.page = 1;
      renderAll({ resetScroll: true });
    }

    function openConfirmAll() {
      if (state.online === 'off') return toast('离线状态不可同步已读');
      if (unreadCount() === 0) return toast('当前没有未读消息');
      state.confirmRead = true;
      renderAll();
    }

    function closeConfirmAll() {
      state.confirmRead = false;
      renderAll();
    }

    function markAllRead() {
      if (state.online === 'off') {
        state.confirmRead = false;
        renderAll();
        return toast('离线状态不可同步已读');
      }
      listOf().forEach((item) => { item.unread = false; });
      state.confirmRead = false;
      state.force99 = false;
      state.expandedIds = [];
      state.page = 1;
      renderAll();
      toast('全部消息已标为已读');
    }

    function loadMore() {
      state.page += 1;
      renderAll();
      toast('已加载更多消息');
    }

    function toggleForce99() {
      state.force99 = !state.force99;
      renderAll();
      toast(state.force99 ? '铃铛角标已显示 99+' : '铃铛角标已恢复真实未读数');
    }

    function resetDemo() {
      state = initialState();
      renderAll({ resetScroll: true });
      toast('演示数据已重置');
    }

    /* ------------------------------------------------------------------
     * 事件绑定
     * ------------------------------------------------------------------ */
    document.querySelectorAll('.ctl').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const value = btn.dataset.value;
        if (group === 'role') return setRole(value);
        if (group === 'device') {
          state.device = value;
          renderAll();
          return;
        }
        if (group === 'online') {
          state.online = value;
          if (value === 'off') state.confirmRead = false;
          renderAll();
          toast(value === 'off' ? '离线状态不可同步已读' : '网络已恢复，消息服务在线');
        }
      });
    });

    $('btnToggle99').addEventListener('click', toggleForce99);
    $('btnResetDemo').addEventListener('click', resetDemo);

    $('frame').addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      const id = el.dataset.id;
      if (action === 'back') return toast('已返回上一页');
      if (action === 'filter') return setFilter(el.dataset.value);
      if (action === 'show-all') return setFilter('all');
      if (action === 'toggle') return toggleExpand(id);
      if (action === 'goto') return goTo(id);
      if (action === 'mark-all') return openConfirmAll();
      if (action === 'close-confirm') return closeConfirmAll();
      if (action === 'noop') return;
      if (action === 'confirm-all') return markAllRead();
      if (action === 'load-more') return loadMore();
    });

    function focusExpanded() {
      const firstId = state.expandedIds[0];
      if (!firstId) return;
      const card = document.querySelector(`#content [data-id="${firstId}"]`);
      if (!card) return;
      const content = $('content');
      const bar = content.querySelector('.sticky');
      const offset = (bar ? bar.offsetHeight : 0) + 8;
      const top = card.getBoundingClientRect().top - content.getBoundingClientRect().top + content.scrollTop;
      content.scrollTop = Math.max(0, top - offset);
    }

    renderAll();
    ico();
    if (state.expandedIds.length) {
      focusExpanded();
      requestAnimationFrame(() => requestAnimationFrame(focusExpanded));
      setTimeout(focusExpanded, 400);
    }
  </script>
</body>
</html>

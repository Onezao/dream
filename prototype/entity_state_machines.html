<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream 全域实体状态机全景速查</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-800 text-white">
    <div class="mx-auto max-w-5xl px-4 py-6 sm:px-6 lg:py-8">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2.5">
          <span class="inline-flex items-center rounded-full bg-indigo-500/20 px-3 py-1 text-xs font-bold text-indigo-100 ring-1 ring-indigo-400/30">全系统实体状态机 · SSOT 速查</span>
          <span class="text-xs font-medium text-slate-200">共 17 个核心实体 · 按业务模块排序</span>
        </div>
        <div id="summaryPills" class="flex flex-wrap items-center gap-2 text-xs"></div>
      </div>
      <h1 class="mt-3 text-xl font-bold tracking-tight sm:text-2xl lg:text-3xl">Dream 全域实体状态机全景手册</h1>
      <p class="mt-1.5 max-w-3xl text-sm text-slate-200">汇总 M1 主数据、M2 购课与清退、TS 全域枢纽、M3 排课与考勤、M4 消息通知与 M5 资金结算的全部 17 个核心实体状态机图、触发人、功能入口、操作留痕与数据清理策略（不含 M0A 登录账号）。</p>
      <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div id="moduleFilters" class="flex flex-wrap gap-1.5"></div>
        <div class="relative w-full sm:w-72">
          <input id="searchInput" type="search" placeholder="搜索实体、中文状态、模型名或关键词..." class="h-10 w-full rounded-full border border-white/20 bg-white/10 px-4 text-sm text-white placeholder-slate-200 outline-none transition focus:border-indigo-300 focus:bg-white/15 sm:h-9 sm:text-xs" />
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6 sm:px-6">
    <section id="cardsContainer" class="space-y-6"></section>
  </main>

  <script>
    const MODULE_GROUPS = [
      { key: 'all', label: '全部模块' },
      { key: 'M1', label: 'M1 主数据与档案' },
      { key: 'M2', label: 'M2 购课与清退' },
      { key: 'M3', label: 'M3 排课与考勤（含 TS）' },
      { key: 'M4', label: 'M4 消息通知' },
      { key: 'M5', label: 'M5 资金与周结' }
    ];

    const RETENTION_BADGE = {
      permanent: { label: '永久只读不可删', cls: 'border-rose-200 bg-rose-50 text-rose-800' },
      archive_lock: { label: '归档只读 · 昵称永久锁定', cls: 'border-rose-200 bg-rose-50 text-rose-800' },
      bind_permanent: { label: '产生绑定后永久只读禁删', cls: 'border-rose-200 bg-rose-50 text-rose-800' },
      draft_release: { label: '已落盘永久留存 · 退出释草稿', cls: 'border-indigo-200 bg-indigo-50 text-indigo-800' },
      cleanup_90: { label: '早于90天定期物理清理', cls: 'border-amber-200 bg-amber-50 text-amber-800' },
      cleanup_notif: { label: '已读90天 / 全部180天清理', cls: 'border-amber-200 bg-amber-50 text-amber-800' },
      cold_1_2y: { label: '满1~2年按年归档冷存', cls: 'border-indigo-200 bg-indigo-50 text-indigo-800' },
      keep_log: { label: '长期只读审计留存', cls: 'border-slate-200 bg-slate-100 text-slate-700' }
    };

    const ENTITIES = [
      {
        id: 'student-profile',
        seq: 1,
        group: 'M1',
        module: 'M1A',
        name: '学员档案',
        code: 'StudentProfile',
        retention: 'archive_lock',
        states: [
          { name: '待认领试课', label: '含待认领/试课中派生分组', tone: 'amber' },
          { name: '正式在读', label: '家长上限 10 个', tone: 'emerald' },
          { name: '已归档', label: '分试课失效归档 / 正式暂别归档', tone: 'slate' },
          { name: '已删除', label: '仅限 0 历史 TS 且 0 购课单', tone: 'rose' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> 正式在读: 家长自主建档 (在读 <= 10 个)
    [*] --> 待认领试课: 班长/管理员试课代建档 (含 M3A 抽屉快速建试课档)
    待认领试课 --> 正式在读: 家长注册后通过 Email 绑定或自助认领转正
    待认领试课 --> 已归档: 5 项全清零前提下，超 30 天未认领自动或手工归档 (试课失效归档)
    正式在读 --> 已归档: 有历史 TS/购课单时手工归档 (5 项全清零，正式暂别归档)
    已归档 --> 待认领试课: 仅 试课失效归档 可由班长/管理员手工再激活 (重算 30 天)
    已归档 --> 正式在读: 仅 正式暂别归档 可由家长/管理员手工再激活 (正式在读 < 10)
    正式在读 --> 已删除: 删除 (仅限 0 历史 TS 且 0 历史购课单，不可恢复)
    待认领试课 --> 已删除: 删除 (仅限 0 历史 TS 且 0 历史购课单，不可恢复)
    已删除 --> [*]`,
        transitions: [
          { edge: '[*] -> 正式在读', actor: '家长本人', scene: '家长账号下创建孩子档案（在读上限 10 个），自动组装全平台大小写不敏感唯一规范英文名（昵称）', entry: 'Tab 2 多孩切换器【+ 添加新宝贝】；Tab 4【多孩档案】' },
          { edge: '[*] -> 待认领试课', actor: '建档班长 / 平台管理员', scene: '为未注册家长代建试课档案（班长创建归属本人，管理员可管全校）；试课列表中的待认领(未结课TS==0)与试课中(未结课TS>0)均为派生视图分组', entry: 'Tab 3【所辖学员】；Tab 4【试课建档】；M3A 约课抽屉【+ 快速建试课档】' },
          { edge: '待认领试课 -> 正式在读', actor: '家长 / 建档班长 / 管理员', scene: '后台录入家长已注册 Email 绑定，或家长输入规范英文名 + 联系方式后四位自助认领（且家长在读数 < 10），并归集历史试课单、TS、课件与备注', entry: 'Tab 4 试课详情【绑定家长 Email】；家长多孩切换器【🔗 认领试课宝贝】' },
          { edge: '待认领试课 -> 已归档', actor: '系统定时跑批 / 建档班长 / 管理员', scene: '5 项全清零守卫（待排 TS、未来未结 TS、在途 HOLD、待付款单、异常回退全为 0）：自最后已结课 TS（或手工激活日；从未上课则自建档日）起超 30 天自动归档或提前手工归档（标试课失效归档），规范昵称永久锁定', entry: '系统定时归档任务；Tab 4 试课详情【归档】' },
          { edge: '正式在读 -> 已归档', actor: '家长本人 / 平台管理员', scene: '产生过任意历史 TS 或购课单禁删仅可归档：校验 5 项全清零后自动停用 AUTO_RENEWAL，封存至家长【已归档宝贝】（标正式暂别归档，严禁混入试课池），释放 10 名额上限，规范昵称永久锁定', entry: 'Tab 4 多孩档案【归档】；管理员后台【归档】' },
          { edge: '已归档 -> 待认领试课', actor: '建档班长 / 平台管理员', scene: '仅限「试课失效归档」手工再激活，移回待认领池并自激活日起重算 30 天（严禁跨类激活正式暂别归档）', entry: 'Tab 4 试课学员【已归档】卡片【重新激活】' },
          { edge: '已归档 -> 正式在读', actor: '家长本人 / 平台管理员', scene: '仅限「正式暂别归档」手工再激活（校验家长当前在读 < 10 且账号未停用；严禁跨类激活试课失效归档），无缝恢复历史单据、备注与课件', entry: 'Tab 4【已归档宝贝】折叠区【重新激活】；管理员后台【重新激活】' },
          { edge: '正式在读 / 待认领试课 -> 已删除', actor: '家长 / 建档班长 / 管理员', scene: '仅当「历史 TS 总数 == 0 AND 历史购课单总数 == 0」（含已取消/已作废）时允许逻辑软删；不可再激活，规范昵称仍永久锁定', entry: 'Tab 4 多孩档案 / 试课详情【删除档案】' }
        ],
        audit: '① 每次状态跃迁追加只读状态流转记录（含归档类型与认领关系）；② 修改任一业务字段（Student Note 2000 字、小名、英文名、年龄、性别、常态作息偏好、头像、或经由 M1E/M3A/M3B 联动的课件进度与备注）均记入【档案变动日志】（管理员与关联班长可查，对家长/老师隐藏）；已删除/已归档档案长期只读留存。'
      },
      {
        id: 'teacher-profile',
        seq: 2,
        group: 'M1',
        module: 'M1B',
        name: '老师档案',
        code: 'TeacherProfile',
        retention: 'permanent',
        states: [
          { name: '在职', label: '含预约离职日 D 待离职标记', tone: 'emerald' },
          { name: '已离职', label: '附价位字典 启用/停用 2 态', tone: 'slate' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> 在职: 负责班长/管理员录入档案并绑定价位 (含未来 D 的待离职标记态)
    在职 --> 已离职: 办理离职交割 (清零防线全通过立即生效，或到达预约离职日 D 00点00分)
    已离职 --> [*]`,
        transitions: [
          { edge: '[*] -> 在职', actor: '负责班长 / 管理员', scene: '录入国籍、英文名、价位（16/18/21 积分）、必填中英自我介绍（<=2000 字）、至少 1 张风采照片，及负责班长（管理员直录可暂置平台直管）；首期不做老师级长期休假态，短期停课通过关时段或 M3B 单课次请假处理', entry: 'Tab 3【负责老师/全校老师】/ Tab 4【老师团队】→ M1B【新建老师】' },
          { edge: '在职 -> 已离职', actor: '负责班长 / 管理员 / 定时任务', scene: '校验自离职日 D 起 4 项清零（1–7 天临时课、固定位/HOLD、作为主讲的正式开课小班已解散、未履约代课已改派）；D > 今天 挂起待离职并封锁 >= D 日历，到 D 00:00 自动置已离职、下架选课大厅并作废未生效调价计划', entry: 'M1B 老师档案详情【办理离职】' }
        ],
        audit: '附注：老师价位字典具备启用/停用 2 态（被在职老师或待生效调价引用时禁停用）；每位在职老师最多挂起 1 条预约定时调价计划（落未来 4 周轮次首日周一 00:00 生效，先期离职自动作废）。每次跃迁与字段变更（常规可约周模板、价位、预约调价、跨班长改绑等）均写入【档案变动日志】（仅管理员可查），永久只读审计留存。'
      },
      {
        id: 'monitor-profile',
        seq: 3,
        group: 'M1',
        module: 'M1B',
        name: '班长职务档案',
        code: 'MonitorProfile',
        retention: 'permanent',
        states: [
          { name: '在职', label: '含上限 7 天「交接冻结中」', tone: 'emerald' },
          { name: '已离职', label: '同邮箱再委任可复用原档', tone: 'slate' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> 在职: 管理员通过已注册邮箱委任 (或复用已离职档案恢复在职)
    在职 --> 在职: 发起解除职务进入 交接冻结中 (上限 7 天，可取消或超时自动解冻)
    在职 --> 已离职: 非本人管理员通过防线一与防线二且事务二次复检全零后解除
    已离职 --> 在职: 管理员通过同一已注册邮箱重新委任 (复用原档案并保留历史单据)`,
        transitions: [
          { edge: '[*] / 已离职 -> 在职', actor: '平台管理员', scene: '通过已在 M0A 注册的 Email 委任新班长或重新委任原班长（复用原档保留历史单据），授予班长权限视图', entry: 'Tab 4【班长管理】→ M1B【委任新班长】' },
          { edge: '在职 <-> 交接冻结中', actor: '平台管理员 / 系统超时任务', scene: '发起解除职务进入冻结（上限 7 天，阻断新收款/新开单/新建档案），可手工取消解冻，满 7 天未完结由系统自动解冻并通知管理员', entry: 'Tab 4【班长管理】→ 班长详情【解除职务 / 取消冻结】' },
          { edge: '在职/交接冻结中 -> 已离职', actor: '非本人平台管理员', scene: '严禁解除本人；通过防线一（资金清算：未结 TS、待归集已结 TS 与在途待付款/HOLD 经 M5A 离职移交单已完成入账清零）+ 防线二（名下老师、正式开课小班与未认领试课档案 100% 改绑）且提交瞬间二次复检全零后解除并注销档案', entry: 'Tab 4【班长管理】→ 班长详情【确认解除职务】' }
        ],
        audit: '委任/冻结/解冻/解除职务的状态跃迁及显示名称、联系电话、微信二维码修改均记入只读流转与【档案变动日志】，管理员可查且永久只读留存。'
      },
      {
        id: 'group-class',
        seq: 4,
        group: 'M1',
        module: 'M1C',
        name: '小班实体',
        code: 'GroupClass',
        retention: 'permanent',
        states: [
          { name: '正式开课', label: '分阶段 ①②③', tone: 'emerald' },
          { name: '已提前解散', label: '伴生 M2B 清退卡', tone: 'rose' },
          { name: '已归档', label: '阶段 ④ 全只读', tone: 'slate' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> 正式开课: 主理人/管理员创建小班课 (建班即生效)
    正式开课 --> 正式开课: 主理人改绑 / 在学课件与进度更新 / 单节补排
    正式开课 --> 已提前解散: 提前结课解散 (老师离职 / 累计>=3节代课或停排 / 换师停办)
    正式开课 --> 已归档: 五项资产全清零，主理人或管理员手动归档
    已提前解散 --> [*]
    已归档 --> [*]`,
        transitions: [
          { edge: '[*] -> 正式开课', actor: '小班主理人 / 管理员', scene: '录入班名（1–64 字）、容量上限（2~20，默认 3）、老师单节课酬积分与单节待上交积分，可选委任全平台在职老师（暂不绑定时标 [待委任老师] 并阻断购课排课）', entry: 'Tab 3【主理小班/活跃小班】/ Tab 4【小班管理】→ M1C【创建小班】' },
          { edge: '正式开课 -> 正式开课 (分阶段 ①②③)', actor: '主理人 / 主讲或代课老师 / 管理员', scene: '阶段 ①（待委任）与 阶段 ②（已委任零单零 TS）可修改容量/课酬/上交/老师；产生首笔在途/已付款单或 TS 后进入 阶段 ③ 锁定上述财务与主讲老师字段，仅允许主理人改绑（M1B）、改班名、配置 0~6 门课件及更新 Process Note（2000 字）', entry: 'M1C 详情 / M3A 课格 / M3B 交接与授课历史' },
          { edge: '正式开课 -> 已提前解散', actor: '小班主理人 / 平台管理员', scene: '校验无已过开课时间未结课 TS 后，选原因、流向并填 1–200 字解散备注（免传截图）；批量作废未来已排与待排 TS（保留老师 🔴 请假、取消代课待办），清在途待付款单与 G-HOLD；原已付款单据保持不变，唯一同事务驱动生成 1 笔 M2B 小班解散清退记录（零 M5A 冲抵；仅通知管理员与原师，严禁通知家长）', entry: 'M1C 小班详情页【提前结课解散】' },
          { edge: '正式开课 -> 已归档', actor: '小班主理人 / 平台管理员', scene: '五项资产全清零（无未来已排、无待排池、无在途单及 G-HOLD、无过期未结 TS、无异常回退），手动归档为全字段只读阶段 ④ 并停用后续自动续费', entry: 'M1C 小班详情页【归档小班】' }
        ],
        audit: '每次状态跃迁与字段修改（含课件增删、改级与 Process Note 更新）均写入【小班操作与修改日志】；执行【提前结课解散】同时固化 4 项【解散结案依据卡】快照（操作结论、剩余节数拆分、按 TS 快照精准求和的剩余待上交积分、逐节作废 TS 明细），永久只读留存。'
      },
      {
        id: 'courseware',
        seq: 5,
        group: 'M1',
        module: 'M1E',
        name: '课件主实体',
        code: 'Courseware',
        retention: 'bind_permanent',
        states: [
          { name: '已停用', label: '新建默认停用', tone: 'amber' },
          { name: '启用中', label: '配齐级别与样图上架', tone: 'emerald' },
          { name: '已删除', label: '零绑定空白课件可删', tone: 'slate' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> 已停用: 管理员创建新课件 (新建强制默认停用)
    已停用 --> 启用中: 管理员核验级别定义与样图配图完整后手动开启
    启用中 --> 已停用: 教研过时或下架，管理员停用 (已有学员/小班只读保留并可改级记进度)
    已停用 --> 已删除: 管理员删除 (仅限从未产生任何学员或小班绑定记录)
    已删除 --> [*]`,

          { edge: '待平台确认 -> 待上交草稿', actor: '平台管理员', scene: '金额不符、未到账、凭证模糊或课次存疑时填 1–200 字原因驳回，保留明细退回并推 M4 浅黄提醒卡，允许重传凭证或剔除异常 TS', entry: 'Tab 3【周转审核】→ 详情页【驳回转账单】' },
          { edge: '待上交草稿 -> 已作废', actor: '班长 / 管理员 / 系统自动', scene: '草稿态主动作废重算，或因 M5A 异常未上课回退剔除 TS 致明细归零自动作废，释放课次打包占位', entry: 'M5A 草稿详情【作废草稿】；异常回退联动' },
          { edge: '待平台确认 -> 已完成入账 (终态)', actor: '平台管理员', scene: '周二核验银行流水到账后点击【确认收款】，完成平台资金归集并永久锁定（单内 TS 永久禁回退）；若为离职移交单，同事务将未结 TS 资金持有人改绑为平台并核销防线一', entry: 'Tab 3【周转审核】→ 详情页【确认收款】' }
        ],
        audit: '每次状态跃迁及草稿自动剔除审计均追加只读流转记录，详情页展示【状态流转历史】时间轴；全部单据、明细与凭证永久只读留存不可删。'
      },
      {
        id: 'salary-report',
        seq: 17,
        group: 'M5',
        module: 'M5B',
        name: '老师周课酬单',
        code: 'TeacherSalaryReport',
        retention: 'permanent',
        states: [
          { name: '待核对草稿', label: '含 0 节兜底单 · 仅出节数', tone: 'amber' },
          { name: '待打款发薪', label: '周二 20:00 放行 · 支持差额调整', tone: 'indigo' },
          { name: '已打款', label: '周三发薪终态 · 冻结关联 TS', tone: 'emerald' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> 待核对草稿: 每周一凌晨 03点00分 自动批处理生成（按上周授课日期归属）
    待核对草稿 --> 待核对草稿: 未打款期间 M5A 异常回退联动剔除重算
    待核对草稿 --> 待打款发薪: 周二 20点00分 前无考勤异议自动放行 / 管理员批量放行
    待打款发薪 --> 待打款发薪: 未打款期间 M5A 异常回退联动剔除重算
    待打款发薪 --> 已打款: 周三管理员线下发薪并标记已打款（终态·关联课次冻结）
    已打款 --> [*]`,
        transitions: [
          { edge: '[*] -> 待核对草稿', actor: '系统自动跑批', scene: '每周一 03:00 按实际授课老师汇总上周「已结课」TS（含存在老师责任类异常时生成的 0 节兜底单），彻底解绑班长；老师端只出节数不出金额（管理员端可当期选填内部课酬单价试算），推 M4 中性卡不发邮件', entry: '周一 03:00 结算批处理' },
          { edge: '待核对草稿 / 待打款发薪 -> 保持原态', actor: '负责班长 / 管理员（经 M5A 回退触发）', scene: '未「已打款」且关联课次未入「已完成入账」转账单时，M5A 异常未上课回退同步从本单剔除该节并重算 4 项节数与试算总积分（归零仍兜底保单）', entry: 'M3A/M5A【异常未上课回退补生】' },
          { edge: '待核对草稿 -> 待打款发薪', actor: '系统自动 / 平台管理员', scene: '周二 20:00 前无异议自动放行，或管理员手动批量放行，进入周三待发薪池（不可退回草稿；未打款前均支持新增【差额调整项】填 1–200 字原因）', entry: '老师端对账；管理员 Tab 3【课酬发薪】' },
          { edge: '待打款发薪 -> 已打款 (终态)', actor: '平台超级管理员', scene: '周三线下打款后点击【标记为已打款】（凭证、备注与内部单价均为选填），全字段永久锁定并对单内关联 TS 叠加不可逆发薪只读冻结，向老师发 M4 通知与发薪邮件（若勾选附发警告同步投递）', entry: 'Tab 3【课酬发薪】→【标记为已打款】' }
        ],
        audit: '每次跃迁记入【状态流转历史】（老师端仅见节点与时间，严格过滤内部单价试算与内部惩罚备注）；差额调整项、打款警告与异常处理变动同步单行留痕，全生命周期永久只读留存不可删。'
      }
    ];

    const TONE_CLS = {
      emerald: 'border-emerald-200 bg-emerald-50 text-emerald-800',
      amber: 'border-amber-200 bg-amber-50 text-amber-800',
      indigo: 'border-indigo-200 bg-indigo-50 text-indigo-800',
      rose: 'border-rose-200 bg-rose-50 text-rose-800',
      slate: 'border-slate-200 bg-slate-100 text-slate-700'
    };

    const state = { group: 'all', query: '' };
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    if (window.mermaid) {
      mermaid.initialize({ startOnLoad: false, theme: 'base', themeVariables: { primaryColor: '#eef2ff', primaryTextColor: '#1e1b4b', primaryBorderColor: '#a5b4fc', lineColor: '#6366f1', fontSize: '13px' } });
    }

    function renderFilters() {
      document.getElementById('moduleFilters').innerHTML = MODULE_GROUPS.map((g) => {
        const active = state.group === g.key;
        return `<button type="button" data-group="${g.key}" class="rounded-full px-3 py-1.5 text-xs font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'bg-white/10 text-slate-200 hover:bg-white/20'}">${esc(g.label)}</button>`;
      }).join('');

      const counts = {
        total: ENTITIES.length,
        threePlus: ENTITIES.filter((e) => e.states.length >= 3).length,
        oneOrTwo: ENTITIES.filter((e) => e.states.length < 3).length,
        permanent: ENTITIES.filter((e) => e.retention === 'permanent').length
      };
      document.getElementById('summaryPills').innerHTML = `
        <span class="rounded-full bg-white/10 px-2.5 py-1 text-slate-200">实体总数 <strong class="text-white">${counts.total}</strong></span>
        <span class="rounded-full bg-white/10 px-2.5 py-1 text-slate-200">≥3 状态 <strong class="text-white">${counts.threePlus}</strong></span>
        <span class="rounded-full bg-white/10 px-2.5 py-1 text-slate-200">1~2 状态 <strong class="text-white">${counts.oneOrTwo}</strong></span>
        <span class="rounded-full bg-rose-500/20 px-2.5 py-1 text-rose-100 ring-1 ring-rose-300/30">永久留存 <strong>${counts.permanent}</strong></span>
      `;
    }

    function matchesQuery(item, q) {
      if (!q) return true;
      const haystack = [
        item.module,
        item.name,
        item.code,
        item.formula || '',
        item.flowNote || '',
        item.audit,
        ...item.states.map((s) => `${s.name} ${s.label || ''}`),
        ...item.transitions.map((t) => `${t.edge} ${t.actor} ${t.scene} ${t.rule || ''} ${t.entry}`)
      ].join(' ').toLowerCase();
      return haystack.includes(q);
    }

    function renderDiagramBlock(item) {
      if (item.mermaid) {
        return `<div class="mt-4 overflow-x-auto rounded-xl border border-slate-200/80 bg-slate-50/60 p-4">
          <div class="mb-2 text-xs font-bold text-slate-600">状态机流转图</div>
          <pre class="mermaid flex justify-center bg-transparent text-center">${esc(item.mermaid)}</pre>
        </div>`;
      }
      if (item.formula) {
        return `<div class="mt-4 rounded-xl border border-amber-200 bg-amber-50/70 p-4">
          <div class="mb-1.5 text-xs font-bold text-amber-900">时段覆盖优先级叠加公式（无独立状态机流转图）</div>
          <div class="overflow-x-auto rounded-lg border border-amber-200/80 bg-white px-3 py-2 font-mono text-xs font-semibold text-slate-800 whitespace-nowrap">${esc(item.formula)}</div>
        </div>`;
      }
      if (item.flowNote) {
        return `<div class="mt-4 rounded-xl border border-slate-200 bg-slate-50/80 p-4">
          <div class="mb-1.5 text-xs font-bold text-slate-700">状态流转简述（无独立 Mermaid 图）</div>
          <p class="text-xs leading-relaxed text-slate-700">${esc(item.flowNote)}</p>
        </div>`;
      }
      return '';
    }

    async function renderCards() {
      const q = state.query.trim().toLowerCase();
      const list = ENTITIES.filter((item) => (state.group === 'all' || item.group === state.group) && matchesQuery(item, q));
      const container = document.getElementById('cardsContainer');
      if (!list.length) {
        container.innerHTML = `<div class="rounded-2xl border border-slate-300 bg-slate-50/70 p-8 text-center text-sm font-medium text-slate-600">未找到匹配的实体状态机，请尝试更换筛选模块或搜索关键词。</div>`;
        return;
      }
      container.innerHTML = list.map((item) => {
        const ret = RETENTION_BADGE[item.retention];
        const cols = item.tableColumns || ['状态跃迁', '触发人 / 驱动源', '触发场景与行为', '功能入口'];
        const hasRuleCol = Boolean(item.tableColumns && item.tableColumns.length === 5);
        return `<article id="${item.id}" class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm sm:p-6">
          <div class="flex flex-wrap items-start justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2">
              <span class="rounded-md bg-slate-900 px-2 py-0.5 font-mono text-xs font-bold text-white">${esc(item.module)}</span>
              <h2 class="text-base font-bold text-slate-900 sm:text-lg">${item.seq}. ${esc(item.name)}</h2>
              <span class="rounded-md border border-slate-200 bg-slate-50 px-2 py-0.5 font-mono text-xs font-semibold text-slate-600">${esc(item.code)}</span>
            </div>
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="rounded-full border border-indigo-200 bg-indigo-50 px-2.5 py-0.5 text-xs font-bold text-indigo-700">${item.states.length} 个状态</span>
              ${ret ? `<span class="rounded-full border px-2.5 py-0.5 text-xs font-semibold ${ret.cls}">${esc(ret.label)}</span>` : ''}
            </div>
          </div>

          <div class="mt-3 flex flex-wrap gap-1.5">
            ${item.states.map((s) => `<span class="inline-flex items-center gap-1 rounded-lg border px-2 py-1 text-xs ${TONE_CLS[s.tone] || TONE_CLS.slate}">
              <span class="font-bold">${esc(s.name)}</span>
              ${s.label ? `<span class="opacity-80">· ${esc(s.label)}</span>` : ''}
            </span>`).join('')}
          </div>

          ${renderDiagramBlock(item)}

          <div class="mt-4 overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full min-w-[640px] text-left text-xs">
              <thead class="border-b border-slate-200 bg-slate-50 text-slate-600">
                <tr>
                  ${cols.map((c) => `<th class="px-3 py-2 font-bold">${esc(c)}</th>`).join('')}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${item.transitions.map((t) => `<tr class="align-top hover:bg-slate-50/70">
                  <td class="whitespace-nowrap px-3 py-2 font-mono font-bold text-indigo-700">${esc(t.edge)}</td>
                  <td class="px-3 py-2 font-semibold text-slate-800">${esc(t.actor)}</td>
                  <td class="px-3 py-2 leading-relaxed text-slate-700">${esc(t.scene)}</td>
                  ${hasRuleCol ? `<td class="px-3 py-2 leading-relaxed text-slate-700">${esc(t.rule || '')}</td>` : ''}
                  <td class="px-3 py-2 leading-relaxed text-slate-600">${esc(t.entry)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>

          <div class="mt-3 rounded-xl border border-indigo-100 bg-indigo-50/60 px-3 py-2.5 text-xs leading-relaxed text-slate-700">
            <span class="font-bold text-indigo-900">操作与变更记录：</span>${esc(item.audit)}
          </div>
        </article>`;
      }).join('');

      if (window.mermaid) {
        const mermaidNodes = container.querySelectorAll('.mermaid');
        if (mermaidNodes.length) {
          try {
            await mermaid.run({ nodes: mermaidNodes });
          } catch (err) {
            console.error(err);
          }
        }
      }
    }

    document.getElementById('moduleFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-group]');
      if (!btn) return;
      state.group = btn.dataset.group;
      renderFilters();
      renderCards();
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      state.query = e.target.value;
      renderCards();
    });

    renderFilters();
    renderCards();
  </script>
</body>
</html>

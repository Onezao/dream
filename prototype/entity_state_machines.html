<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream 全域实体状态机全景速查</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-800 text-white shadow-md">
    <div class="mx-auto max-w-5xl px-4 py-6 sm:px-6 lg:py-8">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
          <span class="inline-flex items-center rounded-full bg-indigo-500/20 px-3 py-1 text-xs font-bold text-indigo-200 ring-1 ring-indigo-400/30">全系统实体状态机 · SSOT 速查</span>
          <span class="text-xs text-slate-300">共 14 个多状态实体 · 按业务模块排序</span>
        </div>
        <div id="summaryPills" class="flex flex-wrap items-center gap-2 text-xs"></div>
      </div>
      <h1 class="mt-3 text-xl font-bold tracking-tight sm:text-2xl lg:text-3xl">Dream 全域实体状态机全景手册</h1>
      <p class="mt-1.5 max-w-3xl text-sm text-slate-200">汇总 M1 主数据、M2 购课、TS 全域枢纽、M3 教务排课、M4 通知与 M5 结算的全部多状态实体状态机图、触发人、功能入口、操作留痕与数据清理策略。</p>
      <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div id="moduleFilters" class="flex flex-wrap gap-1.5"></div>
        <div class="relative w-full sm:w-64">
          <input id="searchInput" type="search" placeholder="搜索实体、状态码或关键词..." class="h-9 w-full rounded-full border border-white/20 bg-white/10 px-3.5 text-xs text-white placeholder-slate-300 outline-none transition focus:border-indigo-300 focus:bg-white/15" />
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6 sm:px-6">
    <section id="cardsContainer" class="space-y-6"></section>
  </main>

  <script>
    const MODULE_GROUPS = [
      { key: 'all', label: '全部模块' },
      { key: 'M1', label: 'M1 主数据与档案' },
      { key: 'M2', label: 'M2 购课与订单' },
      { key: 'M3', label: 'M3 排课与考勤（含 TS）' },
      { key: 'M4', label: 'M4 消息通知' },
      { key: 'M5', label: 'M5 资金与周结' }
    ];

    const RETENTION_BADGE = {
      permanent: { label: '永久只读不可删', cls: 'border-rose-200 bg-rose-50 text-rose-800' },
      cleanup_90: { label: '早于90天定期清理', cls: 'border-amber-200 bg-amber-50 text-amber-800' },
      cleanup_notif: { label: '已读90天 / 全部180天清理', cls: 'border-amber-200 bg-amber-50 text-amber-800' },
      cold_1_2y: { label: '满1~2年按年冷存', cls: 'border-indigo-200 bg-indigo-50 text-indigo-800' },
      keep_log: { label: '留痕只读保留', cls: 'border-slate-200 bg-slate-100 text-slate-700' }
    };

    const ENTITIES = [
      {
        id: 'student-profile',
        seq: 1,
        group: 'M1',
        module: 'M1A',
        name: '学员档案',
        code: 'StudentProfile',
        retention: 'hot_readonly',
        states: [
          { name: 'UNBOUND', label: '待认领试课', tone: 'amber' },
          { name: 'ACTIVE', label: '在读正式', tone: 'emerald' },
          { name: 'ARCHIVED', label: '已归档/注销', tone: 'slate' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> ACTIVE: 家长自主创建 (多孩家庭)
    [*] --> UNBOUND: 班长/管理员代建试课档案 (免注册)
    UNBOUND --> ACTIVE: 后台绑定家长 Email / 家长自助认领
    UNBOUND --> ARCHIVED: 超 30 天未认领自动失效归档
    ACTIVE --> ARCHIVED: 资产清零后申请注销档案
    ARCHIVED --> [*]`,
        transitions: [
          { edge: '[*] -> ACTIVE', actor: '家长本人', scene: '家长账号下创建孩子档案（上限 10 个），自动组装全平台唯一规范昵称', entry: 'Tab 2 多孩切换器【+ 添加新宝贝】；Tab 4【多孩档案】' },
          { edge: '[*] -> UNBOUND', actor: '班长 / 平台管理员', scene: '为未注册家长代建试课档案（班长创建自动归属本人负责，管理员可管理全校所有试课档案）', entry: 'Tab 3【所辖学员】；Tab 4【试课建档】；M3A 代约课抽屉【+ 快速建试课档】' },
          { edge: 'UNBOUND -> ACTIVE', actor: '管理员 / 班长 / 家长', scene: '后台输入家长注册 Email 绑定，或家长输入规范昵称 + 预留联系方式后四位自助认领（自动继承 5 类试课数据）', entry: 'Tab 4 试课详情【绑定家长 Email】；家长多孩切换器【🔗 认领试课宝贝】' },
          { edge: 'UNBOUND -> ARCHIVED', actor: '系统自动跑批', scene: '最后一节试课结课或建档超 30 天仍未认领，自动失效归档并锁定昵称', entry: '系统定时失效归档任务' },
          { edge: 'ACTIVE -> ARCHIVED', actor: '家长本人 / 管理员', scene: '校验待排 TS 与未来已排 TS 均为 0 后软删除档案，永久锁定昵称', entry: 'Tab 4 / M1A 学员档案详情【注销/删除档案】' }
        ],
        audit: '① 每次状态跃迁追加只读状态流转记录（含原/新状态、操作人、时间、原因/认领关系，管理员后台可查）；② 修改任一业务字段（备注、小名、英文名、年龄、头像、规范昵称、家长换绑、在学课件与级别）均记录只读变动快照，管理员与负责班长可在学员综合档案抽屉展开查看【档案变动日志】（家长端不可见）。'
      },
      {
        id: 'teacher-profile',
        seq: 2,
        group: 'M1',
        module: 'M1B',
        name: '老师档案',
        code: 'TeacherProfile',
        retention: 'hot_readonly',
        states: [
          { name: 'ACTIVE', label: '在职可约', tone: 'emerald' },
          { name: 'ON_LEAVE', label: '长期休假', tone: 'amber' },
          { name: 'RESIGNED', label: '已离职', tone: 'slate' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> ACTIVE: 班长/管理员建档生效
    ACTIVE --> ON_LEAVE: 发起长期休假 (日历置灰)
    ON_LEAVE --> ACTIVE: 销假或休假期满复原
    ACTIVE --> RESIGNED: 排课三防线清零通过后离职
    RESIGNED --> [*]`,
        transitions: [
          { edge: '[*] -> ACTIVE', actor: '班长 / 管理员', scene: '录入老师英文名、价位（16/18/21 积分）、负责班长、多媒体相册与简介并生效', entry: 'Tab 3【负责老师/全校老师】/ Tab 4【老师团队】→ M1B【新建老师】' },
          { edge: 'ACTIVE -> ON_LEAVE', actor: '老师 / 班长 / 管理员', scene: '发起全天或跨周长期休假，选课大厅标注暂不接新约', entry: 'M1B 老师详情 / 排期状态操作' },
          { edge: 'ON_LEAVE -> ACTIVE', actor: '老师 / 班长 / 管理员 / 系统', scene: '销假或休假期满自动复原为正常可约', entry: 'M1B 老师详情 / 系统定时复原' },
          { edge: 'ACTIVE -> RESIGNED', actor: '负责班长 / 管理员', scene: '通过未来临时课/固定位/小班三防线清零校验后办理离职，收回老师权限并下架', entry: 'M1B 老师档案详情【办理离职】' }
        ],
        audit: '① 每次状态跃迁追加只读状态流转记录；② 修改价位、负责班长、英文展示名、中英简介、试讲视频、风采相册、ClassIn 二维码等字段时均写入字段前后快照，仅管理员可在老师档案详情页底部展开查看【档案变动日志】（老师端与家长端不可见）。'
      },
      {
        id: 'monitor-profile',
        seq: 3,
        group: 'M1',
        module: 'M1B',
        name: '班长职务档案',
        code: 'MonitorProfile',
        retention: 'hot_readonly',
        states: [
          { name: 'ACTIVE', label: '在职履职', tone: 'emerald' },
          { name: 'RESIGNED', label: '解职注销', tone: 'slate' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> ACTIVE: 管理员通过已注册邮箱委任新班长
    ACTIVE --> RESIGNED: 资金清算与团队改绑两道防线通过后解职
    RESIGNED --> [*]`,
        transitions: [
          { edge: '[*] -> ACTIVE', actor: '平台管理员', scene: '通过已注册邮箱委任新班长，授予班长权限并开始管辖老师与小班', entry: 'Tab 4【班长管理】→ M1B【委任新班长】' },
          { edge: 'ACTIVE -> RESIGNED', actor: '平台管理员', scene: '通过“资金移交清算 + 老师/小班全量改绑”两道防线后解除职务，收回权限并软删除档案', entry: 'Tab 4【班长管理】→ 班长详情【解除职务】' }
        ],
        audit: '委任/解除职务的状态跃迁及显示名称、联系电话等字段修改均追加只读留痕，管理员可在班长详情页展开查看【职务档案变动日志】。'
      },
      {
        id: 'group-class',
        seq: 4,
        group: 'M1',
        module: 'M1C',
        name: '小班实体',
        code: 'GroupClass',
        retention: 'hot_readonly',
        states: [
          { name: 'ACTIVE', label: '正式生效', tone: 'emerald' },
          { name: 'EARLY_TERMINATED', label: '提前结课解散', tone: 'rose' },
          { name: 'ARCHIVED', label: '正常结案归档', tone: 'slate' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> ACTIVE: 主理人/管理员创建小班 (建班即生效)
    ACTIVE --> EARLY_TERMINATED: 提前结课解散 (换师/停办)
    ACTIVE --> ARCHIVED: 轮次完结且不再续开，手动归档
    EARLY_TERMINATED --> [*]
    ARCHIVED --> [*]`,
        transitions: [
          { edge: '[*] -> ACTIVE', actor: '小班主理人(班长) / 管理员', scene: '录入班名、容量上限、财务参数并可选委任全平台在职老师（暂不绑定时阻断购课排课）', entry: 'Tab 3【主理小班/活跃小班】/ Tab 4【创建小班】→ M1C【创建小班】' },
          { edge: 'ACTIVE -> EARLY_TERMINATED', actor: '小班主理人 / 管理员', scene: '老师离职/集体换师/停办，作废未来已排与待排 TS 并终止关联购课单，不走系统退款单', entry: 'M1C 小班详情页【提前结课解散】' },
          { edge: 'ACTIVE -> ARCHIVED', actor: '小班主理人 / 管理员', scene: '无未来未上 TS 且历史账目已结清，手动归档为只读态', entry: 'M1C 小班详情页【归档小班】' }
        ],
        audit: '每次状态跃迁与关键字段变更（新建、编辑字段、委任老师、提前结课解散等）均追加只读记录；主理人与管理员可在小班详情页展开查看【小班操作与修改日志】时间轴。'
      },
      {
        id: 'courseware',
        seq: 5,
        group: 'M1',
        module: 'M1E',
        name: '课件主实体',
        code: 'Courseware',
        retention: 'hot_readonly',
        states: [
          { name: 'INACTIVE', label: '已停用/草稿', tone: 'slate' },
          { name: 'ACTIVE', label: '已启用上架', tone: 'emerald' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> INACTIVE: 管理员创建新课件 (新建默认停用)
    INACTIVE --> ACTIVE: 核验级别与样课配图完整后启用
    ACTIVE --> INACTIVE: 过时下架软停用 (已有学员只读保留)`,
        transitions: [
          { edge: '[*] -> INACTIVE', actor: '平台管理员', scene: '新建课件默认停用（防止未配齐级别样课图的半成品暴露）', entry: 'Tab 4【课件库管理】→ M1E【+ 新建课件】' },
          { edge: 'INACTIVE <-> ACTIVE', actor: '平台管理员', scene: '配齐级别与样课图后手动启用上架；过时下架时软停用（已有在学学员只读保留，禁止物理删除）', entry: 'Tab 4【课件库管理】列表卡片启用/停用开关' }
        ],
        audit: '学员绑定与调整【在学课件及级别】的每次变更均写入学员档案变动日志；课件库主实体本身的编辑与启停目前未设前端独立查看时间轴。'
      },
      {
        id: 'course-order',
        seq: 6,
        group: 'M2',
        module: 'M2A',
        name: '购课单',
        code: 'CoursePurchaseOrder',
        retention: 'permanent',
        states: [
          { name: 'PENDING_PAYMENT', label: '待付款确认', tone: 'amber' },
          { name: 'PAID', label: '已付款生效', tone: 'emerald' },
          { name: 'CANCELLED', label: '已作废', tone: 'slate' },
          { name: 'REFUNDED', label: '全额清退', tone: 'rose' },
          { name: 'TERMINATED', label: '提前终止', tone: 'rose' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> PENDING_PAYMENT: 人工录单 / 提前7天自动续费跑批
    PENDING_PAYMENT --> PAID: 确认收款到账 (原子裂变生成 TS)
    PENDING_PAYMENT --> CANCELLED: 24h逾期释放 / 经办人作废 / 家长暂不续费
    PAID --> PAID: 部分 TS 清退 (标记 PARTIALLY_REFUNDED)
    PAID --> REFUNDED: 剩余有效 TS 全部清退
    PAID --> TERMINATED: 小班课提前结课解散
    CANCELLED --> [*]
    REFUNDED --> [*]
    TERMINATED --> [*]`,
        transitions: [
          { edge: '[*] -> PENDING_PAYMENT', actor: '班长 / 管理员 / 系统自动跑批', scene: '录入 1v1 固定位（价位必选+老师选填）、1v1 临时课（1~20 节多价位组合按节购课，不可改价，含试课）、小班购课单；或最后一周周一 08点30分 自动生成续费单（并锁 HOLD）', entry: 'Tab 3【购课续费】→ 新建购课单；系统续费跑批' },
          { edge: '[*] -> PAID (2合1快捷直达)', actor: '班长 / 管理员', scene: '在 M3A 约临时课抽屉勾选“同步录单”与“已确认收到课次费用”，点击【确认已收款并立即约课】，单事务直接落盘 PAID 购课单并裂变锁定 SCHEDULED TS（按本次代约 1~4 节计价，不可改价）', entry: 'M3A 老师课表空闲绿格 → 代学员约课抽屉' },
          { edge: 'PENDING_PAYMENT -> PAID', actor: '班长 / 主理人 / 管理员', scene: '核实线下到账后点击【确认收款】：所有类型购课单（1v1 固定位、临时课、小班、试课单）均原子裂变待排 TS 并锁定资金持有人 holder_id，续费单 HOLD 转正', entry: 'Tab 3【购课续费】单据列表/详情页；班长待办流【确认收款】' },
          { edge: 'PENDING_PAYMENT -> CANCELLED', actor: '班长 / 管理员 / 家长 / 系统定时任务', scene: '经办人作废；1v1 续费单家长点击【暂不续费】；或开课前 24h 逾期未付自动释放 HOLD', entry: 'M2A 购课单详情【作废】；家长端待续费单【暂不续费】；24h 超时释放任务' },
          { edge: 'PAID -> PAID', actor: '资金持有人班长 / 管理员(需传凭证兜底)', scene: 'M2B 清退部分待排 TS，单据打上部分清退标记', entry: 'M1A 学员资产卡 / Tab 3【退款管理】→【课次清退】' },
          { edge: 'PAID -> REFUNDED', actor: '资金持有人班长 / 管理员(需传凭证兜底)', scene: 'M2B 将该单剩余有效待排 TS 全部清退归零', entry: 'M1A 学员资产卡 / Tab 3【退款管理】→【课次清退】' },
          { edge: 'PAID -> TERMINATED', actor: '小班主理人 / 管理员', scene: '小班在 M1C 执行【提前结课解散】，联动终止小班购课单', entry: 'M1C 小班详情页【提前结课解散】' },
          { edge: '协商子状态 adjustment_status', actor: '家长 → 班长', scene: '家长点击【申请调整】置为待处理 PENDING_HANDLE（保留 HOLD）；班长【修改购课单】或【标为已沟通】后置为已处理 RESOLVED', entry: '家长端 M2A 待续费单【申请调整】；班长端 M2A【修改购课单】/【标为已沟通】' }
        ],
        audit: '① 每次状态跃迁均追加只读状态流转记录（含操作人、时间、作废/清退原因），详情页展示流转时间轴；② 确认收款前修改购课单（调时段/改老师/增减课次/改实收）与强制提交原因同步写入变更日志；③ 家长申请调整保留诉求标签、留言摘要与提交时间。'
      },
      {
        id: 'timeslot',
        seq: 7,
        group: 'M3',
        module: '全域枢纽',
        name: '最小课次枢纽',
        code: 'TS / TimeSlot',
        retention: 'permanent',
        states: [
          { name: 'PENDING_SCHEDULE', label: '待排期', tone: 'amber' },
          { name: 'SCHEDULED', label: '已排期', tone: 'indigo' },
          { name: 'COMPLETED', label: '已结课', tone: 'emerald' },
          { name: 'CANCELLED', label: '已取消', tone: 'slate' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> PENDING_SCHEDULE: 固定位/小班收款裂变 / 异常回退 / 跨持有人临时退课
    [*] --> SCHEDULED: M3A 约临时课同步录单直出 TS
    PENDING_SCHEDULE --> SCHEDULED: 约课 / 批量排课 / 续费转正
    PENDING_SCHEDULE --> CANCELLED: 课次清退 / 小班提前解散作废
    SCHEDULED --> PENDING_SCHEDULE: 请假退回待排期 / 撤排 / 暂停待排
    SCHEDULED --> SCHEDULED: 同师挪位 / 换上课学员 / 指派代课
    SCHEDULED --> COMPLETED: 次日凌晨 02点 自动结课跑批
    COMPLETED --> CANCELLED: 异常未上课回退补生 (未归集)
    COMPLETED --> [*]
    CANCELLED --> [*]`,

          { edge: 'PENDING_PAYOUT -> PAID', actor: '平台管理员', scene: '周三线下打款后点击【标记为已打款】（凭证与备注选填），永久冻结关联 TS 并通知老师', entry: 'Tab 3【课酬发薪】看板/详情页【标记为已打款】' }
        ],
        audit: '① 每次状态跃迁均追加只读流转记录，详情页展示【状态流转历史】时间轴（老师端仅展示状态变更节点与时间，隐藏管理员内部课酬单价、试算与惩罚备注）；② 发薪前新增【差额调整项】强制录入 1-200 字原因并独立单行留痕。'
      }
    ];

    const TONE_CLS = {
      emerald: 'border-emerald-200 bg-emerald-50 text-emerald-800',
      amber: 'border-amber-200 bg-amber-50 text-amber-800',
      indigo: 'border-indigo-200 bg-indigo-50 text-indigo-800',
      rose: 'border-rose-200 bg-rose-50 text-rose-800',
      slate: 'border-slate-200 bg-slate-100 text-slate-700'
    };

    const state = { group: 'all', query: '' };
    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    if (window.mermaid) {
      mermaid.initialize({ startOnLoad: false, theme: 'base', themeVariables: { primaryColor: '#eef2ff', primaryTextColor: '#1e1b4b', primaryBorderColor: '#a5b4fc', lineColor: '#6366f1', fontSize: '13px' } });
    }

    function renderFilters() {
      document.getElementById('moduleFilters').innerHTML = MODULE_GROUPS.map((g) => {
        const active = state.group === g.key;
        return `<button type="button" data-group="${g.key}" class="rounded-full px-3 py-1.5 text-xs font-semibold transition ${active ? 'bg-white text-slate-900 shadow-sm' : 'bg-white/10 text-slate-200 hover:bg-white/20'}">${esc(g.label)}</button>`;
      }).join('');

      const counts = {
        total: ENTITIES.length,
        threePlus: ENTITIES.filter((e) => e.states.length >= 3).length,
        permanent: ENTITIES.filter((e) => e.retention === 'permanent').length
      };
      document.getElementById('summaryPills').innerHTML = `
        <span class="rounded-full bg-white/10 px-2.5 py-1 text-slate-200">≥3 状态 <strong class="text-white">${counts.threePlus}</strong></span>
        <span class="rounded-full bg-white/10 px-2.5 py-1 text-slate-200">2 状态 <strong class="text-white">${counts.total - counts.threePlus}</strong></span>
        <span class="rounded-full bg-rose-500/20 px-2.5 py-1 text-rose-100 ring-1 ring-rose-300/30">永久留存 <strong>${counts.permanent}</strong></span>
      `;
    }

    function matchesQuery(item, q) {
      if (!q) return true;
      const haystack = [
        item.module,
        item.name,
        item.code,
        item.audit,
        ...item.states.map((s) => `${s.name} ${s.label}`),
        ...item.transitions.map((t) => `${t.edge} ${t.actor} ${t.scene} ${t.entry}`)
      ].join(' ').toLowerCase();
      return haystack.includes(q);
    }

    async function renderCards() {
      const q = state.query.trim().toLowerCase();
      const list = ENTITIES.filter((item) => (state.group === 'all' || item.group === state.group) && matchesQuery(item, q));
      const container = document.getElementById('cardsContainer');
      if (!list.length) {
        container.innerHTML = `<div class="rounded-2xl border border-slate-300 bg-slate-50/70 p-8 text-center text-sm font-medium text-slate-600">未找到匹配的实体状态机，请尝试更换筛选模块或搜索关键词。</div>`;
        return;
      }
      container.innerHTML = list.map((item) => {
        const ret = RETENTION_BADGE[item.retention];
        return `<article id="${item.id}" class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm sm:p-6">
          <div class="flex flex-wrap items-start justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2">
              <span class="rounded-md bg-slate-900 px-2 py-0.5 font-mono text-xs font-bold text-white">${esc(item.module)}</span>
              <h2 class="text-base font-bold text-slate-900 sm:text-lg">${item.seq}. ${esc(item.name)}</h2>
              <span class="rounded-md border border-slate-200 bg-slate-50 px-2 py-0.5 font-mono text-xs font-semibold text-slate-600">${esc(item.code)}</span>
            </div>
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="rounded-full border border-indigo-200 bg-indigo-50 px-2.5 py-0.5 text-xs font-bold text-indigo-700">${item.states.length} 个状态</span>
              ${ret ? `<span class="rounded-full border px-2.5 py-0.5 text-xs font-semibold ${ret.cls}">${esc(ret.label)}</span>` : ''}
            </div>
          </div>

          <div class="mt-3 flex flex-wrap gap-1.5">
            ${item.states.map((s) => `<span class="inline-flex items-center gap-1 rounded-lg border px-2 py-1 text-xs ${TONE_CLS[s.tone] || TONE_CLS.slate}">
              <span class="font-mono font-bold">${esc(s.name)}</span>
              <span class="opacity-80">· ${esc(s.label)}</span>
            </span>`).join('')}
          </div>

          <div class="mt-4 overflow-x-auto rounded-xl border border-slate-200/80 bg-slate-50/60 p-4">
            <div class="mb-2 text-xs font-bold text-slate-600">状态机流转图</div>
            <pre class="mermaid flex justify-center bg-transparent text-center">${esc(item.mermaid)}</pre>
          </div>

          <div class="mt-4 overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full min-w-[640px] text-left text-xs">
              <thead class="border-b border-slate-200 bg-slate-50 text-slate-600">
                <tr>
                  <th class="px-3 py-2 font-bold">状态跃迁</th>
                  <th class="px-3 py-2 font-bold">触发人 / 驱动源</th>
                  <th class="px-3 py-2 font-bold">触发场景与行为</th>
                  <th class="px-3 py-2 font-bold">功能入口</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${item.transitions.map((t) => `<tr class="align-top hover:bg-slate-50/70">
                  <td class="whitespace-nowrap px-3 py-2 font-mono font-bold text-indigo-700">${esc(t.edge)}</td>
                  <td class="whitespace-nowrap px-3 py-2 font-semibold text-slate-800">${esc(t.actor)}</td>
                  <td class="px-3 py-2 leading-relaxed text-slate-700">${esc(t.scene)}</td>
                  <td class="px-3 py-2 leading-relaxed text-slate-600">${esc(t.entry)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>

          <div class="mt-3 rounded-xl border border-indigo-100 bg-indigo-50/60 px-3 py-2.5 text-xs leading-relaxed text-slate-700">
            <span class="font-bold text-indigo-900">操作与变更记录：</span>${esc(item.audit)}
          </div>
        </article>`;
      }).join('');

      if (window.mermaid) {
        try {
          await mermaid.run({ nodes: container.querySelectorAll('.mermaid') });
        } catch (err) {
          console.error(err);
        }
      }
    }

    document.getElementById('moduleFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-group]');
      if (!btn) return;
      state.group = btn.dataset.group;
      renderFilters();
      renderCards();
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      state.query = e.target.value;
      renderCards();
    });

    renderFilters();
    renderCards();
  </script>
</body>
</html>

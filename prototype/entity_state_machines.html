<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream 全域实体状态机全景速查</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-800 text-white">
    <div class="mx-auto max-w-5xl px-4 py-6 sm:px-6 lg:py-8">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2.5">
          <span class="inline-flex items-center rounded-full bg-indigo-500/20 px-3 py-1 text-xs font-bold text-indigo-100 ring-1 ring-indigo-400/30">全系统实体状态机 · SSOT 速查</span>
          <span class="text-xs font-medium text-slate-200">共 21 个核心实体 · 2026-11-24 同步刷新</span>
        </div>
        <div id="summaryPills" class="flex flex-wrap items-center gap-2 text-xs"></div>
      </div>
      <h1 class="mt-3 text-xl font-bold tracking-tight sm:text-2xl lg:text-3xl">Dream 全域实体状态机全景手册</h1>
      <p class="mt-1.5 max-w-3xl text-sm text-slate-200">汇总 M0A 全域认证与授权、M1 主数据、M2 购课清退、TS 全域枢纽、M3 排课考勤、M4 消息通知与 M5 资金结算的全部 21 个核心实体状态机图、触发人、功能入口、操作留痕与数据清理策略。</p>
      <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div id="moduleFilters" class="flex flex-wrap gap-1.5"></div>
        <div class="relative w-full sm:w-72">
          <input id="searchInput" type="search" placeholder="搜索实体、中文状态、模型名或关键词..." class="h-10 w-full rounded-full border border-white/20 bg-white/10 px-4 text-sm text-white placeholder-slate-200 outline-none transition focus:border-indigo-300 focus:bg-white/15 sm:h-9 sm:text-xs" />
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6 sm:px-6">
    <section id="cardsContainer" class="space-y-6"></section>
  </main>

  <script>
    const MODULE_GROUPS = [
      { key: 'all', label: '全部模块' },
      { key: 'M0A', label: 'M0A 认证与授权' },
      { key: 'M1', label: 'M1 主数据与档案' },
      { key: 'M2', label: 'M2 购课与清退' },
      { key: 'M3', label: 'M3 排课与考勤（含 TS）' },
      { key: 'M4', label: 'M4 消息通知' },
      { key: 'M5', label: 'M5 资金与周结' }
    ];

    const RETENTION_BADGE = {
      permanent: { label: '永久只读不可删', cls: 'border-rose-200 bg-rose-50 text-rose-800' },
      archive_lock: { label: '归档只读 · 昵称永久锁定', cls: 'border-rose-200 bg-rose-50 text-rose-800' },
      bind_permanent: { label: '产生绑定后永久只读禁删', cls: 'border-rose-200 bg-rose-50 text-rose-800' },
      draft_release: { label: '已落盘永久留存 · 退出释草稿', cls: 'border-indigo-200 bg-indigo-50 text-indigo-800' },
      cleanup_90: { label: '早于90天定期物理清理', cls: 'border-amber-200 bg-amber-50 text-amber-800' },
      cleanup_notif: { label: '已读90天 / 全部180天清理', cls: 'border-amber-200 bg-amber-50 text-amber-800' },
      cold_1_2y: { label: '满1~2年按年归档冷存', cls: 'border-indigo-200 bg-indigo-50 text-indigo-800' },
      keep_log: { label: '长期只读审计留存', cls: 'border-slate-200 bg-slate-100 text-slate-700' }
    };

    const ENTITIES = [
      {
        id: 'user-account',
        seq: 1,
        group: 'M0A',
        module: 'M0A',
        name: '自然人登录账号',
        code: 'UserAccount',
        retention: 'permanent',
        retentionLabel: '永久停用留存 · 禁物理删除',
        states: [
          { name: '未激活', label: '降级未验码兜底 · 超7天释放', tone: 'amber' },
          { name: '正常生效', label: '默认直通生效 · 含家长视角', tone: 'emerald' },
          { name: '临时锁定', label: '连错5次锁24h · 可找回解锁', tone: 'indigo' },
          { name: '已封禁', label: '后台封禁 · 禁释违规Email', tone: 'rose' },
          { name: '已注销停用', label: '三防线全清零后停用', tone: 'slate' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> 正常生效: 前置6位邮箱验证码核验通过完成注册（默认直通生效）
    [*] --> 未激活: 仅降级未验码建号兜底态（超7天可释放）
    未激活 --> 正常生效: 重发激活验证并完成邮箱确认
    正常生效 --> 临时锁定: 连续输错密码达5次风控阈值（默认锁24小时）
    临时锁定 --> 正常生效: 锁定期满 / 找回密码两步重置提前解锁
    正常生效 --> 已封禁: 平台风控或运营后台审核封禁（全端会话吊销）
    已封禁 --> 正常生效: 运营后台审核解封恢复
    正常生效 --> 已注销停用: 通过 M1A / M1B / M0A 管理员全清零防线后自主注销
    已封禁 --> 已注销停用: 运营后台确认下游剥离后终结停用（禁止自助注销）
    已注销停用 --> [*]`,
        transitions: [
          { edge: '[*] -> 正常生效 / 未激活', actor: '新用户自助注册', scene: '前置 6 位邮箱验证码（120 秒有效，连续错 5 次作废）校验通过直通「正常生效」；密码 >= 8 位含四类字符，记录协议版本；默认具备家长视角', entry: '登录/注册页' },
          { edge: '正常生效 <-> 临时锁定', actor: '安全风控 / 本人', scene: '连错 2 次出图形码，连错 5 次锁定 24 小时；支持通过图形码 + 邮箱验证码重置密码提前解锁并吊销历史会话', entry: '登录页 /【忘记密码】' },
          { edge: '正常生效 <-> 已封禁', actor: '平台统一运营后台', scene: '违规封禁立即失效会话、阻断高危操作，向 M1A/M1B 暴露封禁标放行管理员代清零改绑，严禁释放违规 Email', entry: '平台运营后台' },
          { edge: '正常生效 / 已封禁 -> 已注销停用', actor: '账号本人 / 运营后台', scene: '须满足：① M1A「正式在读」== 0（历史已 5 项清零归档）；② M1B 无在职/冻结/待离职班长或老师；③ M0A 无在任管理员（永久主管理员受保护禁自助注销）；停用凭据且不物理删除历史业务档案与账单', entry: '【我的】→ 注销账号；运营后台终结处置' }
        ],
        audit: '注册协议签约版本、改密/重置、两步安全换绑（旧邮箱即时释放）、锁解封禁及注销均同事务记入只读【安全审计日志】；永久停用留存（禁物理删除，违规封禁不释 Email）。'
      },
      {
        id: 'admin-grant',
        seq: 2,
        group: 'M0A',
        module: 'M0A',
        name: '平台管理员授权',
        code: 'AdminGrant',
        retention: 'permanent',
        retentionLabel: '永久只读审计 · 同邮箱复用',
        states: [
          { name: '永久在任（受保护）', label: '唯一1名 · 独占4项专属高危权限', tone: 'rose' },
          { name: '在任（普通）', label: '日常教务平权 · M5A/M5B核薪仅只读', tone: 'emerald' },
          { name: '已撤销', label: '同Email再授任复用原记录', tone: 'slate' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> 永久在任_受保护: 系统冷启动初始化唯一 1 名永久主管理员（不可撤销）
    永久在任_受保护 --> 永久在任_受保护: 极端失联经受控运维 Break-Glass 通道解封或移交
    [*] --> 在任_普通: 仅永久主管理员输入已注册正常 Email 增设
    在任_普通 --> 已撤销: 仅永久主管理员排他锁复检全平台仍 >=1 名可用管理员后撤销
    已撤销 --> 在任_普通: 仅永久主管理员通过同一 Email 复用恢复授权`,
        transitions: [
          { edge: '[*] -> 永久在任（受保护）', actor: '系统冷启动 / 运维 Break-Glass', scene: '唯一 1 名（账号 ID 永久不变，交接仅账密改密），独占 4 项专属高危权限：① 普通管理员增改撤；② M2B 72h 异议核验；③ M5A 周/移交确认收款与驳回（兼托管直收与离职 TS）；④ M5B 老师周课酬单写操作与发薪确认', entry: '系统初始化；Tab 4【管理员管理】' },
          { edge: '[*] / 已撤销 -> 在任（普通）', actor: '仅唯一「永久主管理员」', scene: '目标 M0A 账号「正常生效」且无重复授权；复用原记录保留历史轴；日常教务平权，在管理员管理、M5A 审单与 M5B 仅只读查验', entry: 'Tab 4 → M0A【+ 增设管理员】/【重新授权】' },
          { edge: '在任（普通）-> 已撤销', actor: '仅唯一「永久主管理员」', scene: '排他并发锁内校验扣除后仍存 >= 1 名正常可用管理员 + 二次输入名称确认；即刻刷新吊销在线管理端视图，保留其兼任班长/老师/家长身份不受阻断', entry: 'Tab 4 → M0A【撤销职务】' }
        ],
        audit: '全部增设、改名、撤销、复用恢复与 Break-Glass 操作同事务写入【授权变更安全审计日志】（仅在任管理员只读可查）并永久留存（同 Email 再授任复用原记录）。'
      },
      {
        id: 'student-profile',
        seq: 3,
        group: 'M1',
        module: 'M1A',
        name: '学员档案',
        code: 'StudentProfile',
        retention: 'archive_lock',
        retentionLabel: '归档只读 · 昵称永久锁定',
        states: [
          { name: '待认领试课', label: '含待认领/试课中派生分组 · 禁绑小班', tone: 'amber' },
          { name: '正式在读', label: '家长上限 10 个', tone: 'emerald' },
          { name: '已归档', label: '分试课失效归档 / 正式暂别归档', tone: 'slate' },
          { name: '已删除', label: '仅限 0 历史 TS 且 0 购课单', tone: 'rose' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> 正式在读: 家长自主建档 (在读 <= 10 个)
    [*] --> 待认领试课: 班长/管理员试课代建档 (含 M3A 抽屉快速建试课档)
    待认领试课 --> 正式在读: 家长注册后通过 Email 绑定或自助认领转正
    待认领试课 --> 已归档: 5 项全清零前提下，超 30 天未认领自动或手工归档 (标记 试课失效归档)
    正式在读 --> 已归档: 有历史 TS/购课单时手工归档 (5 项全清零 + 自动解绑 M1C 小班，标记 正式暂别归档)
    已归档 --> 待认领试课: 仅 试课失效归档 可由班长/管理员手工再激活 (重算 30 天)
    已归档 --> 正式在读: 仅 正式暂别归档 可由家长/管理员手工再激活 (正式在读 < 10)
    正式在读 --> 已删除: 删除 (仅限 0 历史 TS 且 0 历史购课单，不可恢复 + 解绑 M1C)
    待认领试课 --> 已删除: 删除 (仅限 0 历史 TS 且 0 历史购课单，不可恢复)
    已删除 --> [*]`,
        transitions: [
          { edge: '[*] -> 正式在读', actor: '家长本人', scene: '家长账号下创建孩子档案（在读上限 10 个），自动组装全平台大小写不敏感唯一规范英文名（创建即永久锁定）', entry: 'Tab 2 多孩切换器【+ 添加新宝贝】；Tab 4【多孩档案】' },
          { edge: '[*] -> 待认领试课', actor: '建档班长 / 平台管理员', scene: '为未注册家长代建试课档案（班长创建归属本人，管理员可管全校）；试课列表中的待认领(未结课TS==0)与试课中(未结课TS>0)均为派生视图分组；禁绑入 M1C 小班', entry: 'Tab 3【所辖学员】；Tab 4【试课建档】；M3A 约课抽屉【+ 快速建试课档】' },
          { edge: '待认领试课 -> 正式在读', actor: '家长 / 建档班长 / 管理员', scene: '通道 A 录入家长 M0A「正常生效」非教职/非管理员 Email 绑定，或通道 B 家长自助输入规范英文名 + 预留联系方式后四位（错 5 次冷却 30 分钟；原子抢占防重；在读 < 10），归集试课单、TS、课件与备注', entry: 'Tab 4 试课详情【绑定家长 Email】；家长多孩切换器【🔗 认领试课宝贝】' },
          { edge: '待认领试课 -> 已归档 (试课失效归档)', actor: '系统定时跑批 / 建档班长 / 管理员', scene: '5 项全清零守卫（待排 TS、未来未结 TS、在途 HOLD、待付款单、异常回退全为 0）：自最后已结课 TS（或手工激活日；从未上课则自建档日）起超 30 天（UTC+8 自然日跑批）自动归档或提前手工归档；仅沉底试课【已归档】区，规范昵称永久锁定', entry: '系统定时归档任务；Tab 4 试课详情【归档】' },
          { edge: '正式在读 -> 已归档 (正式暂别归档)', actor: '家长本人 / 平台管理员', scene: '产生过任意历史 TS 或购课单禁删仅可归档：校验 5 项全清零后同事务停用 AUTO_RENEWAL 并自动解除 M1C「正式开课」小班活跃成员绑定以释放 Max 名额，封存至家长【已归档宝贝】（严禁混入试课池），释放 10 名额上限，规范昵称永久锁定', entry: 'Tab 4 多孩档案【归档】；管理员后台【归档】' },
          { edge: '已归档 -> 待认领试课', actor: '建档班长 / 平台管理员', scene: '仅限「试课失效归档」手工再激活，移回待认领池并自激活日起重算 30 天（严禁跨类激活正式暂别归档）', entry: 'Tab 4 试课学员【已归档】卡片【重新激活】' },
          { edge: '已归档 -> 正式在读', actor: '家长本人 / 平台管理员', scene: '仅限「正式暂别归档」手工再激活（校验家长当前在读 < 10 且账号未停用；严禁跨类激活试课失效归档），无缝恢复历史单据、备注与课件（原已解绑小班不自动回绑）', entry: 'Tab 4【已归档宝贝】折叠区【重新激活】；管理员后台【重新激活】' },
          { edge: '正式在读 / 待认领试课 -> 已删除', actor: '家长 / 建档班长 / 管理员', scene: '仅当「历史 TS 总数 == 0 AND 历史购课单总数 == 0」（含已取消/已作废）时允许逻辑软删并同步解绑 M1C 活跃成员；不可再激活，规范昵称仍永久锁定', entry: 'Tab 4 多孩档案 / 试课详情【删除档案】' }
        ],
        audit: '① 每次状态跃迁追加只读状态流转记录（含归档类型与认领关系）；② 修改任一业务字段（Student Note 2000 字、小名、英文名/姓首字母/微调锁定校验、年龄、性别、常态作息偏好、头像、或经由 M1E/M3A/M3B 联动的课件进度与备注）均记入【档案变动日志】（管理员与关联班长可查，对家长/老师隐藏）；已删除/已归档档案长期只读留存。'
      },
      {
        id: 'teacher-profile',
        seq: 4,
        group: 'M1',
        module: 'M1B',
        name: '老师档案',
        code: 'TeacherProfile',
        retention: 'permanent',
        retentionLabel: '永久只读审计留存（不删）',
        states: [
          { name: '在职', label: '含 待绑定账号 / 待离职 派生标', tone: 'emerald' },
          { name: '已离职', label: '支持管理员复用恢复', tone: 'slate' }
        ],
        mermaid: `stateDiagram-v2
    [*] --> 在职: 负责班长/管理员录入档案并选定启用价位 (未绑 M0A 账号暂存待绑定草稿、不上架)
    在职 --> 已离职: 仅平台管理员办理离职交割 (四防线全清零立即生效，或到达预约离职日 D 00点00分 UTC+8)
    已离职 --> 在职: 仅平台管理员二次入职复用恢复原档案 (重选价位、负责班长与可用资料)`,
        transitions: [

                  <td class="px-3 py-2 font-semibold text-slate-800">${esc(t.actor)}</td>
                  <td class="px-3 py-2 leading-relaxed text-slate-700">${esc(t.scene)}</td>
                  ${hasRuleCol ? `<td class="px-3 py-2 leading-relaxed text-slate-700">${esc(t.rule || '')}</td>` : ''}
                  <td class="px-3 py-2 leading-relaxed text-slate-600">${esc(t.entry)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>

          <div class="mt-3 rounded-xl border border-indigo-100 bg-indigo-50/60 px-3 py-2.5 text-xs leading-relaxed text-slate-700">
            <span class="font-bold text-indigo-900">操作与变更记录：</span>${esc(item.audit)}
          </div>
          ${item.extraNote ? `<div class="mt-2 rounded-xl border border-amber-200/80 bg-amber-50/60 px-3 py-2.5 text-xs leading-relaxed text-slate-700">
            <span class="font-bold text-amber-900">专项规则附注：</span>${esc(item.extraNote)}
          </div>` : ''}
        </article>`;
      }).join('');

      if (window.mermaid) {
        const mermaidNodes = container.querySelectorAll('.mermaid');
        if (mermaidNodes.length) {
          try {
            await mermaid.run({ nodes: mermaidNodes });
          } catch (err) {
            console.error(err);
          }
        }
      }
    }

    document.getElementById('moduleFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-group]');
      if (!btn) return;
      state.group = btn.dataset.group;
      renderFilters();
      renderCards();
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      state.query = e.target.value;
      renderCards();
    });

    renderFilters();
    renderCards();
  </script>
</body>
</html>
